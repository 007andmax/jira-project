module.exports = "<div class=\"date-picker\" (clickOutside)=\"hideDatePicker()\">\n  <input type=\"text\"\n         placeholder=\"Filter by date\"\n         (click)=\"toggleDatePicker()\"\n         [(ngModel)]=\"selectedDateModel\"\n         class=\"pointer\">\n  <i *ngIf=\"selectedDateModel\"\n     class=\"icn-sm icn-remove-old\"\n     (click)=\"clearDate()\"></i>\n  <i *ngIf=\"!selectedDateModel\"\n     class=\"icn-16 icn-calendar-light pointer\"></i>\n  <div  class=\"dropdown-menu show\" *ngIf=\"showDatePicker\">\n    <ngb-datepicker #dp (select)=\"onDateSelection($event)\" [displayMonths]=\"2\" [dayTemplate]=\"t\" outsideDays=\"hidden\">\n    </ngb-datepicker>\n    <ng-template #t let-date let-focused=\"focused\">\n        <span class=\"custom-day\"\n              [class.focused]=\"focused\"\n              [class.range]=\"isRange(date)\"\n              [class.faded]=\"isHovered(date) || isInside(date)\"\n              (mouseenter)=\"hoveredDate = date\"\n              (mouseleave)=\"hoveredDate = null\">\n          {{ date.day }}\n        </span>\n    </ng-template>\n  </div>\n</div>\n"
