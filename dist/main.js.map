module.exports = "<form\n  [formGroup] = \"quoteForm\"\n  class=\"quote-create__content\">\n  <app-quote-create-content-top\n    [quoteForm]=\"quoteForm\"\n    (selectedItem)=\"setClient($event)\"\n  ></app-quote-create-content-top>\n  <app-quote-create-content-bottom\n    [clientId]=\"selectedClient\"\n  ></app-quote-create-content-bottom>\n  <app-quote-create-content-notes\n    (selectedRegularNoteItem)=\"setRegularNote($event)\"\n    (selectedGlobalNoteItem)=\"setGlobalNote($event)\"\n  ></app-quote-create-content-notes>\n</form>\n"
