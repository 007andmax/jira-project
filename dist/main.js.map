module.exports = "<div class=\"row\" *ngIf=\"type && (itemListServices || itemListProducts)\">\n  <!-- IF SERVICE -->\n  <div class=\"col-md-1\"\n       style=\"width: 23%;\"\n       *ngIf=\"type === 'service'\"\n       (clickOutside)=\"hideDropDown($event)\">\n    <div class=\"light-dropdown\">\n      <input class=\"pointer\"\n             type=\"text\"\n             (click)=\"toggleShowDropDown()\"\n             [ngClass]=\"{'no-valid': isFormValid}\"\n             placeholder=\"Service\">\n      <i class=\"icn-sm report-caret-icon\"></i>\n      <app-services-list\n        *ngIf=\"isDropDownShow\"\n        [itemList]=\"itemListServices\"\n        (selectedServicesItem)=\"setItem($event)\"></app-services-list>\n    </div>\n  </div>\n  <div class=\"col-md-2\"\n       *ngIf=\"type === 'service'\">\n    <input type=\"text\"\n           [ngClass]=\"{'no-valid': isFormValid}\"\n           placeholder=\"\">\n  </div>\n\n  <!-- IF PRODUCT -->\n  <div class=\"col-md-3\"\n       style=\"width: 48%;\"\n       *ngIf=\"type === 'product'\">\n    <div class=\"product-dropdown-new-ng light-dropdown\">\n      <input class=\"pointer\"\n             type=\"text\"\n             (click)=\"toggleShowDropDown()\"\n             [ngClass]=\"{'no-valid': isFormValid}\"\n             placeholder=\"Product\">\n      <i class=\"icn-sm report-caret-icon\"></i>\n      <app-product-list *ngIf=\"isDropDownShow\"\n                        [itemList]=\"itemListProducts\"\n                        (selectedProductItem)=\"setItem($event)\"></app-product-list>\n    </div>\n  </div>\n\n  <div class=\"col-md-1\">\n    <input type=\"text\"\n           [ngClass]=\"{'no-valid': isFormValid}\"\n           placeholder=\"\">\n  </div>\n  <div class=\"col-md-1\">\n    <input type=\"text\"\n           [ngClass]=\"{'no-valid': isFormValid}\"\n           [disabled]=\"type === 'service'\"\n           placeholder=\"\">\n  </div>\n  <div class=\"col-md-1\">\n    <input type=\"text\"\n           [ngClass]=\"{'no-valid': isFormValid}\"\n           [disabled]=\"type === 'service'\"\n           placeholder=\"\">\n  </div>\n  <div class=\"col-md-1\">\n    <input type=\"text\"\n           [ngClass]=\"{'no-valid': isFormValid}\"\n           placeholder=\"\">\n  </div>\n  <i class=\"icn-delete\" (click)=\"hideAddForm()\"></i>\n</div>\n"
