module.exports = "<!--for show filters add class \"show\" for app-left-panel-->\n<app-left-panel-password-manager [ngClass]=\"{'show': isMobileFilterShowing }\" ></app-left-panel-password-manager>\n\n<div class=\"password-content\">\n\n  <app-passwoord-manager-header></app-passwoord-manager-header>\n\n  <div class=\"password-content__list\">\n\n    <div class=\"password-content__list--header clearfix\">\n      <div style=\"width: 5.5%;\" class=\"col-md-1\"></div>\n      <div class=\"col-md-2\">Company</div>\n      <div class=\"col-md-3\">Description</div>\n      <div class=\"col-md-2\">User/device</div>\n      <div class=\"col-md-2\">Password Expiry</div>\n      <div class=\"col-md-1\">Safety Level</div>\n    </div>\n\n    <app-password-manager-table\n      [selectedCompany]=\"selectedCompany\"\n      [selectedUserOrDevice]=\"selectedUserOrDevice\"\n      [selectedDate]=\"selectedDate\"\n      [addNewRecords]=\"newRecord\"\n      [showDataTable]=\"showDataTable()\"\n    ></app-password-manager-table>\n\n  </div>\n\n  <button class=\"mob-filters-btn mobile-btn primary\" (click)=\"showMobileFilters()\">\n    Filters\n  </button>\n\n</div>\n\n<app-password-manager-edit-aside\n  (addRecord)=\"addRecord($event)\"\n></app-password-manager-edit-aside>\n\n\n"
