module.exports = "<div class=\"quote-create__header\">\n  <h1>Create Quote</h1>\n  <div class=\"quote-create__header--actions\">\n    <button class=\"btn-new disabled\" (click)=\"returnToQuotes()\">Back</button>\n    <button class=\"btn-new disabled\" (click)=\"goToState('quote-preview-component')\">Preview</button>\n    <div class=\"btn-new btn-success df\">\n      <button type=\"button\" (click)=\"saveQuotes()\">Save and Continue</button>\n      <div class=\"light-dropdown\" ngbDropdown role=\"group\" aria-label=\"Button group with nested dropdown\">\n        <button class=\"dropdown-toggle-split\" ngbDropdownToggle>\n          <i class=\"icn-sm pointer report-caret-icon-white\"></i>\n        </button>\n        <div class=\"dropdown-menu\" ngbDropdownMenu>\n          <button class=\"dropdown-item\" ngbDropdownItem (click)=\"convertToInvoice()\">Convert to Invoice</button>\n          <button class=\"dropdown-item\" ngbDropdownItem (click)=\"convertToTicket()\">Convert to Ticket</button>\n          <button class=\"dropdown-item\" ngbDropdownItem (click)=\"approveQuote()\">Approve a quote</button>\n          <button class=\"dropdown-item\" ngbDropdownItem (click)=\"downloadPdf()\">Download Pdf</button>\n        </div>\n      </div>\n    </div>\n\n  </div>\n</div>\n"
