module.exports = "<div class=\"alert alert-yellow hide\" user-notification style=\"z-index: 991;\" ></div>\n\n<div class=\"top-bar\" style=\"z-index: 991;\"\n     ng-include=\"'/ng1/scripts/core/header/header.tpl.html'\"></div>\n\n<div ng-controller=\"quicktech.core.header.headerCtrl\"\nclass=\"mobile-top-bar\"\nng-class=\"{ 'ticket-detail-header': isTicketOpened && !isTicketEditOpened, 'ticket-create-update': isTicketEditOpened }\"\nstyle=\"z-index: 991;\"\nng-include=\"'/ng1/scripts/core/header/mobile-header.tpl.html'\"></div>\n\n<aside id=\"left\" style=\"z-index: 991;\"\n       ng-include=\"'/ng1/scripts/core/left-panel/left-panel.tpl.html'\"></aside>\n\n<aside ng-controller=\"quicktech.core.leftPanel.leftPanelCtrl\"\nid=\"mobile-left\" ng-class=\"{opened: isLeftPanelOpened}\"\nqt-sidebar style=\"z-index: 991;\"\nng-include=\"'/ng1/scripts/core/left-panel/mobile-left-panel.tpl.html'\"></aside>\n\n<aside id=\"right\" class=\"nano collapsed\" ng-if=\"!isRightPanelHidden && applicationLoaded\" right-panel\n       ng-include=\"'/ng1/scripts/core/right-panel/right-panel.tpl.html'\"></aside>\n\n\n<div class=\"main-container\">\n  <div class=\"row\">\n    <div class=\"content-container\" ng-class=\"{'large': isRightPanelHidden}\">\n      <div class=\"content-wrapper\">\n        <div ng-include=\"'/ng1/scripts/common/templates/index-page-body.tpl.html'\"></div>\n        <app-main></app-main>\n      </div>\n    </div>\n  </div>\n</div>\n<!--<div feedback-form ></div>-->\n<div welcome-wizard></div>\n\n\n"
