module.exports = "<div class=\"password-content__header\">\n  <h3>Password Manager</h3>\n  <div class=\"password-content__header--search\">\n    <!--add class \"show\" to <div class=\"password-selected\">-->\n    <div class=\"password-selected\">\n      <div class=\"password-selected-qty new-link\">\n        <span>2</span> Selected\n      </div>\n      <div class=\"password-selected-actions\">\n        <i class=\"icn-16 edit-new\"></i>\n        <i class=\"icn-16 print-new\"></i>\n        <i class=\"icn-16 export-new\"></i>\n      </div>\n    </div>\n    <button\n      *ngIf=\"getPermissions('CREATE_PASSWORD')\"\n      (click)=\"addRecord()\"\n            style=\"font-size: 13px;\" class=\"new-link desktop-hidden\">Create Password</button>\n    <button\n      *ngIf=\"getPermissions('CREATE_PASSWORD')\"\n      (click)=\"addRecord()\" class=\"plus-btn mob-hidden\">+</button>\n  </div>\n</div>\n"
