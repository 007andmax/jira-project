module.exports = "<ngb-accordion #acc=\"ngbAccordion\" class=\"item-list\">\n  <ngb-panel *ngFor=\"let item of itemList\">\n    <ng-template ngbPanelHeader>\n      <button ngbPanelToggle\n              class=\"btn\">\n        {{item.name}} <span *ngIf=\"item.products.length\"> {{item.products.length}} items</span>\n        <span class=\"icn-sm report-caret-icon\"></span>\n      </button>\n    </ng-template>\n    <ng-template ngbPanelContent>\n      <div class=\"category-product\"\n           *ngFor=\"let productItem of item.products\"\n           (click)=\"setProduct(productItem)\">\n        <div class=\"clearfix\">\n          <div class=\"title col-md-10\">{{ productItem.description }}</div>\n          <div class=\"text-right total-count col-md-2\">{{ productItem.sale | currency: '$' }}</div>\n          <div class=\"col-md-12\">\n            <span *ngIf=\"productItem.ilc\">ILC: {{ productItem.ilc }}</span>\n            <span *ngIf=\"productItem.manufacture\">P/N: {{ productItem.manufacture }}</span>\n          </div>\n        </div>\n      </div>\n    </ng-template>\n  </ngb-panel>\n</ngb-accordion>\n"
