module.exports = "<div  *ngIf=\"showDataTable\">\n  <div class=\"password-content__list--item clearfix pointer\"\n       *ngFor=\" let item of recordsData\n           | company: selectedCompany\n           | user: selectedUserOrDevice\n           | dateFormat: selectedDate\n           | passwordCategory: selectedCategory\">\n    <div style=\"width: 5.5%;\"\n         class=\"col-md-1 password-icon\"\n         [ngClass]=\"getRecordTypeClass(item.template)\">\n      <label class=\"control checkbox\">\n        <input type=\"checkbox\">\n        <span class=\"control-indicator\" style=\"margin-top: 3px;\"></span>\n      </label>\n    </div>\n    <div class=\"col-md-2 password-icon mob-hidden\"\n         (click)=\"editRecord(item)\"\n         [ngClass]=\"getRecordTypeClass(item.template)\">\n      {{item.companyName}}\n    </div>\n    <div class=\"col-md-3 password-icon\"\n         (click)=\"editRecord(item)\">{{item.description}}\n    </div>\n    <div class=\"col-md-2\"\n         (click)=\"editRecord(item)\">\n      <p *ngFor=\"let linkItem of item.links\">\n        {{(linkItem.userName || linkItem.deviceLabel)}}\n      </p>\n    </div>\n    <div class=\"col-md-2 mob-hidden\"\n         (click)=\"editRecord(item)\">{{item.expiredDate}}\n    </div>\n    <div class=\"col-md-2 mob-hidden\"\n         style=\"width: 15%;\"\n         (click)=\"editRecord(item)\"></div>\n    <div class=\"col-md-1 btn-actions grey-dropdown right mob-hidden\">\n      <div ngbDropdown class=\"d-inline-block\">\n        <a class=\"hit-area ha-20-20 pointer\"\n           id=\"dropdownBasic1\"\n           ngbDropdownToggle>\n          <i class=\"icn-sm icn-more-light-grey\"></i>\n        </a>\n        <div ngbDropdownMenu aria-labelledby=\"dropdownBasic1\">\n          <button ngbDropdownItem\n                  *ngIf=\"getPermissions('VIEW_PASSWORD')\"\n                  (click)=\"editRecord(item)\">Edit</button>\n          <button ngbDropdownItem\n                  *ngIf=\"getPermissions('DELETE_PASSWORD')\"\n                  (click)=\"deleteRecord(item.id)\">Remove</button>\n        </div>\n      </div>\n    </div>\n  </div>\n</div>\n"
