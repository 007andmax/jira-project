module.exports = "<div class=\"left-panel-full-wrapper nano billing\">\n  <div class=\"left-panel-full__head\">\n    <div class=\"icon-pos go-back-left-panel\">\n      <i class=\"icn-sm icn-back-arrow\"></i>\n    </div>\n    <span class=\"left-panel-full__head--header\">Billing</span>\n  </div>\n  <div class=\"center-category collapsed-nav nano-content\">\n    <div class=\"center-category__category\" (click)=\"goToState('accounting.dashboard')\">\n      Dashboard\n    </div>\n    <div class=\"center-category__category\" (click)=\"goToState('services')\">\n      Default Services\n    </div>\n    <div class=\"center-category__category active\" (click)=\"goToState('accounting.billable')\">\n      Billable Items\n    </div>\n    <div class=\"center-category__category\" (click)=\"goToState('receivable')\">\n      Invoices\n    </div>\n    <div class=\"center-category__category\" (click)=\"goToState('quotes-component')\">\n      Quotes\n    </div>\n    <div class=\"center-category__category\" (click)=\"goToState('new-payments')\">\n      Payments\n    </div>\n    <div class=\"center-category__category\" (click)=\"goToState('service-agreements')\">\n      Contracts\n    </div>\n  </div>\n</div>\n"
