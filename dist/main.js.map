module.exports = "<div class=\"left-panel-filter\">\n  <div class=\"inventory-lp-header\">\n    <div>Select by Category</div>\n  </div>\n  <div class=\"center-category__category desktop-version\">\n    <div class=\"center-category__category--item\"\n         *ngFor=\"let item of passwordRecordTypes; let i = index\"\n         [class.active]=\"selectedIndex === i\"\n         (click)=\"filterByPasswordTypes(item, i)\">\n      <div [class.new-link]=\"item.TITLE === 'Clear'\">{{item.TITLE}}</div>\n      <div *ngIf=\"item.TITLE !== 'Clear'\">{{item.count}}</div>\n    </div>\n  </div>\n\n  <div class=\"center-category__category mob-version\">\n    <div class=\"center-category__category--item\"\n         *ngFor=\"let item of passwordRecordTypes; let i = index\"\n         [class.active]=\"selectedIndex === i\"\n         (click)=\"filterByPasswordTypesMob(item, i)\">\n      <div [class.new-link]=\"item.TITLE === 'Clear'\">{{item.TITLE}}</div>\n      <div *ngIf=\"item.TITLE !== 'Clear'\">{{item.count}}</div>\n    </div>\n  </div>\n\n</div>\n"
