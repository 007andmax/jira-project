module.exports = "<input\n  id=\"typeahead-focus1\"\n  placeholder=\"Select Company\"\n  type=\"text\"\n  [(ngModel)]=\"selectedClient\"\n  class=\"pointer\"\n  [inputFormatter]=\"formatter\"\n  [resultFormatter]=\"formatter\"\n  [ngbTypeahead]=\"search\"\n  (selectItem)=\"selectItem($event)\"\n  (focus)=\"focus$.next('')\"\n  (click)=\"click$.next('')\"\n  #instance=\"ngbTypeahead\"\n/>\n<i *ngIf=\"selectedClient\"\n   class=\"icn-sm icn-remove-old\"\n   (click)=\"clearClient($event)\"></i>\n<i *ngIf=\"!selectedClient\"\n   class=\"icn-sm report-caret-icon\"></i>\n"
