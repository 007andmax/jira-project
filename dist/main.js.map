module.exports = "<div class=\"quote-create__content--top row\">\n  <div class=\"col-md-4\">\n    <div class=\"quote-create-field\">\n      <app-select-client-company style=\"width: 75%;\"\n                                 class=\"light-dropdown\"\n                                 [formGroup]=\"quoteForm\"\n                                 (selectedItem)=\"selectClient($event)\">\n      </app-select-client-company>\n    </div>\n  </div>\n  <div class=\"col-md-4\">\n    <div class=\"quote-create-field\">\n      <p>Quote Date</p>\n      <div class=\"input-group date-picker\" [formGroup]=\"quoteForm\">\n        <input class=\"pointer\"\n               placeholder=\"yyyy-mm-dd\"\n               formControlName=\"startDate\"\n               name=\"dp\"\n               ngbDatepicker #startDate=\"ngbDatepicker\" (click)=\"startDate.toggle()\">\n        <div class=\"input-group-append\">\n          <i class=\"new-calendar\"></i>\n        </div>\n      </div>\n    </div>\n    <div class=\"quote-create-field\">\n      <p>Valid Until</p>\n      <div class=\"input-group date-picker\" [formGroup]=\"quoteForm\">\n        <input class=\"pointer\"\n               placeholder=\"yyyy-mm-dd\"\n               formControlName=\"endDate\"\n               name=\"dp\"\n               ngbDatepicker #endDate=\"ngbDatepicker\" (click)=\"endDate.toggle()\">\n        <div class=\"input-group-append\">\n          <i class=\"new-calendar\"></i>\n        </div>\n      </div>\n    </div>\n    <div class=\"quote-create-field\">\n      <p>Partial/ Deposit</p>\n      <input type=\"text\"\n             placeholder=\"\">\n    </div>\n    <div class=\"request-payments\">\n      <div></div>\n      <div><label class=\"control checkbox\">\n        <input type=\"checkbox\">\n        <span class=\"control-indicator\"\n              style=\"margin-top: 3px;\">\n          </span>\n        <p>Request payment</p>\n      </label></div>\n    </div>\n  </div>\n  <div class=\"col-md-4\">\n    <div class=\"quote-create-field\">\n      <p>Quote #</p>\n      <input type=\"text\"\n             [(ngModel)]=\"quoteNumber\"\n             (ngModelChange)=\"setNumber($event)\"\n             placeholder=\"\">\n    </div>\n    <div class=\"quote-create-field\">\n      <p>PO #</p>\n      <input type=\"text\"\n             placeholder=\"\">\n    </div>\n  </div>\n</div>\n"
