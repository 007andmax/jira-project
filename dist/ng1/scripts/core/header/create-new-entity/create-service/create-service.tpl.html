<div class="service-form-wrapper edit-form-checkbox create-new" ng-form="editServiceForm"
     ng-controller="quicktech.editServiceCtrl" ng-show="showModal">
  <div class="service--header">
    <h2>Create Service</h2>
    <button class="close-modal" ng-click="closeWindowWithConfirm()"></button>
  </div>
  <div class="service--content row">
    <div class="col-md-6" add-on-focus ng-class="{'has-error': isShowingErrors(editServiceForm, 'editServiceName')}">
      <div ng-messages="editServiceForm.editServiceName.$error"
           ng-class="{'hide': !isShowingErrors(editServiceForm, 'editServiceName')}">
        <!--<div class="control-label" ng-message="required">Email field cannot be left empty.</div>-->
        <div class="control-label" ng-message="required">Service name is required.</div>
        <div class="control-label" ng-message="maxlength">Service name is too long.</div>

      </div>
      <div class="placeholder">Service Name</div>
      <input type="text" class="form-validation"
             ng-model="editService.name"
             name="editServiceName" ng-required="true" custom-disabled="{{ !editService.isDefault }}"
             requiredis-uniq-validation validation-func="validateServiceName" model-id="editService.versionedId.id"
             ng-maxlength="100" ng-minlength="3">
    </div>
    <div class="col-md-6" add-on-focus  ng-class="{'has-error': isShowingErrors(editServiceForm, 'editServiceRate')}">
      <div ng-messages="editServiceForm.editServiceName.$error"
           ng-class="{'hide': !isShowingErrors(editServiceForm, 'editServiceRate')}">
        <!--<div class="control-label" ng-message="required">Email field cannot be left empty.</div>-->
        <div class="control-label" ng-message="required">Hour rate is required.</div>

      </div>
      <div class="placeholder">Per Hour Rate</div>
      <input type="text" class="form-validation"
             ng-model="editService.rate" qt-to-fixed="2"
             required name="editServiceRate" hard-reset-required="true" hard-reset-pattern="decimalNumberPattern">
    </div>
    <div class="col-md-6 taxes" add-on-focus>
      <select-taxes taxes="taxes" active-placeholder='"Taxes"' entity="editService"></select-taxes>
      <div class="add-taxes">
        <p style="margin-bottom: 0;" smart-dropdown-menu-position no-restricted="true"
           dropdown-toogle aria-haspopup="true" aria-expanded="false" data-toggle="dropdown">
          Add Tax
        </p>

        <div class="dropdown-menu dropdown-menu-custom new-tax" role="menu">

          <div ng-click="stopPropagation($event)" class="add-tax-dropdown" ng-form="newTaxForm" ng-controller="quicktech.core.settings.taxesCtrl"
               ng-required='false'>
            <div ng-messages="newTaxForm.name.$error"
                 ng-class="{'hide': !isShowingErrors(newTaxForm, 'name')}">

              <label class="control-label" ng-message="required">
                Name is required.
              </label>

              <label class="control-label" ng-message="unique">
                Name is already taken.
              </label>

              <label class="control-label" ng-message="minlength">
                Name is too short.
              </label>

              <label class="control-label" ng-message="maxlength">
                Name is too long.
              </label>
            </div>
            <input  no-select placeholder="Enter Tax Name" type="text" class="form-control" name="name" ng-model="newTax.name"
                   is-uniq-validation validation-func="isUniqueName" ng-minlength="2" ng-maxlength="30">


            <div ng-messages="newTaxForm.rate.$error" ng-class="{'hide': !isShowingErrors(newTaxForm, 'rate')}">
              <label style="white-space: nowrap;" class="control-label" ng-message="required">
                Required.
              </label>
              <label style="white-space: nowrap;" class="control-label" ng-message="number">
                Only numbers.
              </label>
              <label style="white-space: nowrap;" class="control-label" ng-message="min">
                To small.
              </label>
              <label style="white-space: nowrap;" class="control-label" ng-message="max">
                To large.
              </label>
            </div>
            <input  no-select placeholder="Rate (%)" type="number" class="form-control" ng-model="newTax.rate" name="rate"
                   required min="0.01" max="99">
            <label ng-click="stopPropagation($event)" class="control checkbox" style="margin-bottom: 20px;">
              <input no-select  type="checkbox" ng-model="newTax.isDefault">
              <span class="control-indicator">
              </span>Set as Default
            </label>
            <button class="btn btn-success" ng-click="saveNewTax(newTaxForm, true)"
                    custom-disabled="{{ newTaxForm.$invalid || newTaxForm.$pristine }}">Add
            </button>
          </div>

        </div>

      </div>
    </div>
    <div class="col-md-12">
      <label class="control checkbox" style="margin-bottom: 15px;">
        <input type="checkbox" ng-model="editService.billable">
        <span class="control-indicator">
        </span> Make this service billable
      </label>
    </div>
  </div>
  <div class="service--footer">

    <button-with-loading-indicator class="btn btn-primary"
                                   ng-click="saveEditService(editServiceForm, true)" loading="disabledSaveButton"
                                   label="{{ editService.versionedId.id ? 'Save Service' : 'Create Service' }}">
    </button-with-loading-indicator>
    <!-- <button class="btn btn-primary">Create Service</button> -->
    <button class="btn btn-default" ng-click="closeWindowWithConfirm()">Cancel</button>
  </div>
