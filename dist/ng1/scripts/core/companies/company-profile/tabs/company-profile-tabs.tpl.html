<div ng-controller="quicktech.core.companies.companyProfileTabsCtrl">

  <div class="tabs-container">
    <div class="fixed-block-top" fixed-block-top style="transition: margin-top linear 0.5s; z-index: 999"
         ng-style="{'margin-top': currentOpenTab !== 'dashboard' ? '10px' : '820px'}">
      <ul class="nav nav-qt clearfix" style="padding: 0 30px;" company-bulk-option>

        <li ng-class="{'active': currentOpenTab === 'dashboard'}" style="cursor: pointer;"
            ng-if="PermissionsService.isAllowed('VIEW_USERS')">
          <a ui-sref="companyProfile({ tabName: 'dashboard' })">
            Dashboard
          </a>
        </li>

        <li ng-class="{'active': currentOpenTab === 'users'}" style="cursor: pointer;"
            ng-if="PermissionsService.isAllowed('VIEW_USERS')">
          <a ui-sref="companyProfile({ tabName: 'users' })">
            Users
            <span class="text-muted">{{ users.filter(filterDeleted).length }}</span>
          </a>
        </li>

        <li ng-class="{'active': currentOpenTab === 'devices', 'hide': !isHasDevices}" style="cursor: pointer;">
          <a ui-sref="companyProfile({ tabName: 'devices' })">
            Devices
            <span class="text-muted">{{ agents.length }}</span>
          </a>
        </li>

        <li ng-class="{'active': currentOpenTab === 'network-scan'}"
            ng-if="PermissionsService.isAllowed('NETWORK_SCAN_CLIENTS')"
            style="cursor: pointer;">
          <a ui-sref="companyProfile({ tabName: 'network-scan' })">
            Network Scan
          </a>
        </li>

        <li ng-class="{'active': currentOpenTab === 'products'}" style="cursor: pointer;"
            ng-if="checkClientType('vendor') && (company.hasProducts || productsData.length)">
          <a ui-sref="companyProfile({ tabName: 'products' })">
            Products
          </a>
        </li>

        <li class="bulk-option" bulk-option-content
            ng-class="{'hide': !(bulkOptionMode === 'users') && !(bulkOptionMode === 'devices')}"
            ng-controller="quicktech.core.companies.bulkOptionCtrl">

          <div class="topNavbarLeft-Left pull-left" ng-if="bulkOptionMode === 'users'">

            <p class="pull-left select" style="white-space: nowrap;">
              <strong>{{ selectUsersIds.length }}</strong>&nbsp;<span class="text-muted">Selected</span>
            </p>

            <div class="topNavbar-filter pull-right">

              <div class="btn btn-icn has-tooltip pull-right pad-top" ng-click="archiveUsers()"
                   tooltip-placement="bottom" uib-tooltip="Archive">
                <i class="icn-sm icn-remove-old"></i>
              </div>

              <div uib-dropdown>
                <div class="btn btn-icn has-tooltip pull-right" uib-dropdown-toggle
                     tooltip-placement="bottom" uib-tooltip="Subscribe to...">
                  <i class="icon-sm icn-user-subscription"></i>
                </div>

                <ul class="dropdown-menu dropdown-subscribe" stop-propagation="click">

                  <li ng-click="changeUserSubscription('ticket')">
                    <a tabindex="-1" href="javascript:void(0)">
                      <div class="clearfix">
                        <label class="control checkbox pull-left">
                          <input type="checkbox" ng-model="usersSbscr['ticket']" ng-disabled="disabledSubscr">
                          <span class="control-indicator"></span> Ticket Updates
                        </label>
                      </div>
                    </a>
                  </li>

                  <li ng-click="changeUserSubscription('ticketManager')">
                    <a tabindex="-1" href="javascript:void(0)">
                      <div class="clearfix">
                        <label class="control checkbox pull-left">
                          <input type="checkbox" ng-model="usersSbscr['ticketManager']" ng-disabled="disabledSubscr">
                          <span class="control-indicator"></span> Ticket Manager
                        </label>
                      </div>
                    </a>
                  </li>

                  <li ng-click="changeUserSubscription('invoice')">
                    <a tabindex="-1" href="javascript:void(0)">
                      <div class="clearfix">
                        <label class="control checkbox pull-left"
                               ng-disabled="disabledSubscr || isInvoiceSubscriptionForbidden()">
                          <input type="checkbox" ng-checked="usersSbscr['invoice']"
                                 ng-disabled="disabledSubscr || isInvoiceSubscriptionForbidden()">
                          <span class="control-indicator"></span> Invoice Updates
                        </label>
                      </div>
                    </a>
                  </li>

                </ul>
              </div>

              <div uib-dropdown>
                <div class="btn btn-icn has-tooltip pull-right" uib-dropdown-toggle
                     tooltip-placement="bottom" uib-tooltip="Set Privilege to...">
                  <i class="icon-sm icn-user-privilege"></i>
                </div>

                <ul class="dropdown-menu dropdown-privilege">

                  <li>
                    <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserRole('USER')">
                      User
                    </a>
                  </li>

                  <li>
                    <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserRole('ADMIN')">
                      Administrator
                    </a>
                  </li>

                </ul>
              </div>

            </div>

          </div>

          <div class="topNavbarLeft-Left" ng-if="bulkOptionMode === 'devices'">

            <p>
              <strong>{{ selectDevicesIds.length }}</strong>&nbsp;<span class="text-muted">Selected</span>
            </p>

            <div class="topNavbar-filter">

              <div class="btn btn-icn has-tooltip" ng-click="restartDevices()"
                   tooltip-placement="bottom" uib-tooltip="Restart"
                   ng-if="!companyProfileHeader.isOfflineDeviceSelected">
                <i class="icn-sm icn-restart-device"></i>
              </div>

              <div class="btn btn-icn has-tooltip" ng-click="shutdownDevices()"
                   tooltip-placement="bottom" uib-tooltip="Shutdown"
                   ng-if="!companyProfileHeader.isOfflineDeviceSelected">
                <i class="icn-sm icn-shutdown-device"></i>
              </div>

              <div class="btn btn-icn has-tooltip" ng-click="removeDevices()"
                   tooltip-placement="bottom" uib-tooltip="Remove">
                <i class="icn-sm icn-remove-old"></i>
              </div>

            </div>
          </div>
        </li>
      </ul>
    </div>
  </div>

  <div class="tab-content clearfix"
       ng-include="getTabTemplateUrl(currentOpenTab)"></div>

</div>
<script>
  (function (i, s, o, g, r, a, m) {
    i['GoogleAnalyticsObject'] = r;
    i[r] = i[r] || function () {
        (i[r].q = i[r].q || []).push(arguments)
      }, i[r].l = 1 * new Date();
    a = s.createElement(o),
      m = s.getElementsByTagName(o)[0];
    a.async = 1;
    a.src = g;
    m.parentNode.insertBefore(a, m)
  })(window, document, 'script', 'https://www.google-analytics.com/analytics.js', 'ga');

  ga('create', 'UA-93441341-1', 'auto');
  ga('send', 'pageview');

</script>
