<div class="sub-content-item clearfix" ng-repeat="service in ticket.serviceExpense">
  <div class="col-md-1">{{service.createdAt | date:'dd MMM yyyy'}}</div>
  <div class="col-md-2">{{service.item.name}}</div>
  <div class="col-md-4">{{service.description}}</div>
  <div class="col-md-1">

    <form name="billableEditDiscountForm"
          stop-propagation="click" ng-show="checkAgreementTypeToShowDiscount(service)">

      <form name="billableEditDiscountForm"
            stop-propagation="click">
        <div ng-hide="isShowBillableDiscountInput || service.discountAmount != null">
          <i class="icon-sm sale-icon-for-isDicount"
             ng-click="isShowBillableDiscountInput = !isShowBillableDiscountInput"
             uib-tooltip="Click to choose Discount"></i>
        </div>
        <div class="form-group discount-recurring"
             ng-show="isShowBillableDiscountInput || service.discountAmount != null">
          <input style="padding: 0 5px; background-color: white"
                 type="text"
                 name="discountAmount"
                 ng-model="service.discountAmount"
                 ng-max="100"
                 ng-min="0"
                 execute-when-outfocused="addDiscountInBillable(service.id, service.discountAmount); isShowBillableDiscountInput = false"
                 hard-reset-pattern="PERCENT"
                 ng-keydown="$event.which === 13 && $event.preventDefault()">
          <p>%</p>
        </div>
      </form>
    </form>

  </div>
  <div class="col-md-1">

    <!--<div class="tax-recurring">-->
      <!--<select-taxes taxes="taxes" entity="service" entity-type="service" on-close="saveTaxes"></select-taxes>-->
    <!--</div>-->

  </div>
  <div class="col-md-2">Total hours {{service.billableQuantity}}</div>
  <div class="col-md-1"><strong>{{service.sum | currency: '$': 2 }}</strong></div>
</div>
