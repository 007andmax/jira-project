<div class="settings-main-wrapper" ng-if="(currentUser.accountType !== 'ROOT' && currentUser.isOwner) || PermissionsService.isAllowed('VIEW_TECH_USERS_SETTINGS')">

  <div class="tech-user-templates-wrapper">

    <ul class="template-list list-unstyled">

      <li class="template-item tech-user-item new-tech-user"
          ng-class="{'expanded': editUserId === 'new_user'}">

        <h4 class="template-title btn btn-success ng-binding" style="height: 100%;" ng-click="openEditUser('new_user')"
            ng-hide="editUserId === 'new_user'">Create New Tech User</h4>

        <div class="clearfix tech-user">

          <div class="template-details pull-left" style="margin-top:10px;"
               ng-if="editUserId === 'new_user'"
               ng-include="'/ng1/scripts/core/settings/tech-users/edit-tech-user.tpl.html'">
          </div>
        </div>
      </li>

      <li class="template-item tech-user-item" ng-repeat="user in users | orderBy: getUserName track by user.id"
          ng-class="{'expanded': editUserId === user.id}"
          show-model-element="{{ 'showTechUser-' + user.id}}"
          on-finish-render="highlightTechUser()">

        <div class="clearfix tech-user">

          <div ng-hide="editUserId === user.id">
            <div class="user-info">

              <div class="avatar" ng-if="!user.requestToChangePassword && user.isEmailVerified">
                <img ng-if="user.avatar" ng-src="{{ getUserAvatarUrl(user) }}"
                     alt="..." class="img-circle">
                <img ng-if="!user.avatar" src="ng1/images/settings-icon/tech-user.png" alt="..." class="img-circle">
              </div>

              <div class="avatar" ng-if="user.requestToChangePassword || !user.isEmailVerified" style="position: relative">
                <img src="ng1/images/settings-icon/unverified-user.png" alt="" class="img-circle">
                <img src="ng1/images/settings-icon/unverified-user-mark.png" alt="" class="unverified-user-mark"
                     uib-tooltip="Tech-user hasn't confirmed his account yet." tooltip-placement="bottom">
              </div>

              <div class="name-designation">
                <h4>{{ getUserName(user) }}</h4>
                <span ng-style="{'background-color': techColors[user.techRole]}" class="label">{{ user.techRole }}</span><br/>

                <div class="user-email"><img style="width: 13px;" src="ng1/images/settings-icon/new-email.png"> {{ user.primaryEmail }}</div>
              </div>
              <div class="tech-request" ng-click="changePasswordRequired(user)" ng-if="user.isEmailVerified">
                <p>Send a request to change password</p>
              </div>

              <div class="tech-request" ng-if="!(user.isEmailVerified && user.userEnabled)">
                <p ng-click="resendWelcomeEmail(user.primaryEmail)">Resend welcome email</p>
              </div>

              <div>
                <label class="control checkbox">
                  <input type="checkbox" ng-model="usersEmailNotificationList[user.id].ticketCreated"
                  ng-click="saveUserNewEmailNotificationSetting(user.id)">
                  <span class="control-indicator"></span>
                  Receive new ticket notification
                </label>
              </div>

            </div>

            <div class="tech-action">

              <a href="javascript:void(0)" class="hit-area pull-right has-tooltip pad-top"
                 tooltip-placement="top" uib-tooltip="Archive user"
                 ng-click="archiveUser(user)">
                <i class="icn-sm icn-remove-old"></i>
              </a>

              <a href="javascript:void(0)" class="hit-area pull-right has-tooltip"
                 tooltip-placement="top" uib-tooltip="Edit user"
                 ng-click="openEditUser(user)">
                <i class="icon-sm edit-icon"></i>
              </a>

            </div>
          </div>

          <div class="template-details pull-left" style="margin-top:10px;"
               ng-if="editUserId === user.id"
               ng-include="'/ng1/scripts/core/settings/tech-users/edit-tech-user.tpl.html'">
          </div>
        </div>
      </li>

      <div class="archived" ng-show="filteredArchivedUsers && filteredArchivedUsers.length">

        <h2 class="text-center" style="font-weight: normal;">Archived tech-users</h2>

        <li class="template-item tech-user-item"
            ng-repeat="user in (filteredArchivedUsers = (archivedUsers | filter: { accountType: 'TECH' }) | orderBy: getUserName) track by user.id"
            show-model-element="{{ 'showTechUser-' + user.id}}"
            on-finish-render="highlightTechUser()">
          <div class="opacity-layer"></div>
          <div class="clearfix tech-user">

            <div class="user-info">

              <div class="avatar">
                <img ng-if="user.avatar" ng-src="{{ getContactAvatarUrl(user) }}"
                     alt="..." class="img-circle">
                <img ng-if="!user.avatar" src="ng1/images/settings-icon/deleted-tech-user.png" alt="..." >
              </div>

              <div class="name-designation">
                <h4>{{ getUserName(user) }}</h4>
                <span ng-style="{'background-color': techColors[user.techRole]}" class="label">{{ user.techRole }}</span><br/>

                <div class="user-email"><img style="width: 13px;" src="ng1/images/settings-icon/new-email.png"> {{ user.primaryEmail }}</div>
              </div>

            </div>

            <div class="tech-action">

              <a href="javascript:void(0)" class="hit-area pull-right has-tooltip pad-top">
                <i class="icn-sm icn-remove-old"></i>
              </a>

              <a href="javascript:void(0)" class="hit-area pull-right has-tooltip">
                <i class="icon-sm edit-icon"></i>
              </a>

            </div>

            <button-with-loading-indicator class="btn pull-right btn-primary" style="z-index: 3;"
                                           ng-click="restoreUser(user)" label="Restore User"
                                           loading="user.loadingInProgress"></button-with-loading-indicator>
          </div>
        </li>
      </div>

    </ul>

  </div>
</div>
