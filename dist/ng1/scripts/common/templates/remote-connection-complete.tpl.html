<div>
  <div class="modal-header remote-access-header" ng-if="selectingTicket">
    <span class="title">Select Ticket</span>
    <div class="pull-right" ng-click="cancelConfirm()" style="cursor: pointer;"><i class="icn-sm icn-remove-old"></i></div>
  </div>
  <div class="modal-body">
    <p ng-show="!selectingTicket">Remote access session has been completed. Do you want to create ticket or ticket update?</p>
    <div class="form-group" ng-if="selectingTicket">
      <input type="text" class="form-control" autocomplete="off" ng-model="selectedTicket.label"
             qt-typeahead-async-show-on-focus
             uib-typeahead="getTicketLabel(ticket) for ticket in searchTickets($viewValue)" ng-trim="false"
             typeahead-on-select="onTicketSelect(selectedTicket.label)" typeahead-min-length="0"
             custom-style="{'max-height': '200px', 'width': '100%', 'overflow-y': 'auto'}">

      <input type="hidden" ng-model="ticket" name="ticket" required>

      <div typeahead-input-icon="ticket" style="position: absolute;top: 14px;right: 13px;"></div>
    </div>
  </div>
  <div class="modal-footer" ng-style="{'padding-top': selectingTicket ? '0px' : '19px'}">
    <div class="btn btn-lg btn-primary" data-dismiss='modal' ng-click="cancelConfirm(selectingTicket)">
      {{ selectingTicket ? 'Back' : 'Cancel' }}
    </div>
    <div class="btn btn-lg btn-primary" ng-if="!selectingTicket" ng-click="createTicket()">Create Ticket</div>
    <div class="btn btn-lg btn-primary"
         custom-disabled="{{ selectingTicket && (!selectedTicket.item || !selectedTicket.item.id) }}"
         ng-click="selectingTicket ? createTicketUpdate() : selectTicket(true)">
      {{ selectingTicket ? 'Confirm' : 'Create TU' }}
    </div>
  </div>
</div>
