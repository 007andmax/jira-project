<div class="customer-report-modal clearfix" ng-form="customerReportForm">
  <div class="close-btn btn pull-right" ng-click="dismiss()" tabindex="1">
    <i class="icn-sm icn-remove-old"></i>
  </div>
  <h2 class="col-sm-12">Create new customer ticket report</h2>
  <div class="row">
    <div class="col-sm-6 form-group" ng-class="{'has-error': isShowingErrors(customerReportForm, 'reportCompanyId')}">

      <span ng-if="!isShowingErrors(customerReportForm, 'ticketCompany')">Company</span>

      <div ng-messages="customerReportForm.$error.reportCompanyId">
        <label ng-message="required">Company is required field.</label>
      </div>

      <input type="text" class="form-control has-dropdown" ng-model="dto.company" name="reportCompanyId"
             uib-typeahead="company as company.name for company in clientCompanies | filter:{'name': $viewValue}:stateComparator | orderBy:'name'"
             qt-typeahead-show-on-focus required
             custom-style="{'max-height': '180px', 'overflow-y': 'auto', 'width': '254px'}">

      <div typeahead-input-icon="dto.companyId"></div>
    </div>
    <div class="col-sm-6 form-group dropdown-user-parent">

      <span>Client</span>
      <input type="text" class="form-control has-dropdown" ng-model="dto.user" name="reportUserId"
             typeahead-template-url="/html/partials/user-autocomplete.tpl.html"
             uib-typeahead="user as getUserName(user) for user in clientUsers | filter:filterUsers($viewValue) | orderBy:'firstName'"
             qt-typeahead-show-on-focus typeahead-on-select="onUserSelect(dto.user)"
             custom-style="{'max-height': '180px', 'overflow-y': 'auto', 'width': '254px'}">

      <div typeahead-input-icon="dto.userId"></div>
    </div>
    <div class="col-sm-6 form-group">
      <span>Date range</span>
      <input type="text" class="form-control" qt-date-range-picker="onDateRangeSelect" range
             min-date="{{ currentCompany.createdAt }}" max-date="{{ today }}" date-format="mm/dd/yyyy" readonly>
    </div>
    <div class="col-sm-6 form-group" uib-dropdown keyboard-nav="true">
      <span>Type</span>
      <input type="text" class="form-control" readonly uib-dropdown-toggle
             value="{{ dto.extendedReport ? 'Extended report' : 'Simple report' }}">
      <ul class="dropdown-menu" uib-dropdown-menu style="width: 254px;">
        <li ng-class="{'active': !dto.extendedReport}" ng-click="dto.extendedReport = false">
          <a href="javascript:void(0)">Simple report</a>
        </li>
        <li ng-class="{'active': dto.extendedReport}" ng-click="dto.extendedReport = true">
          <a href="javascript:void(0)">Extended report</a>
        </li>
      </ul>
    </div>
  </div>
  <div class="option col-sm-12">
    <p><strong>What to include</strong></p>
    <div>
      <label class="control checkbox">
        <input type="checkbox" ng-model="dto.withTimeSpent">
        <span class="control-indicator"></span>
        Time spent
      </label>
    </div>
    <div>
      <label class="control checkbox">
        <input type="checkbox" ng-model="dto.withResponseTime">
        <span class="control-indicator"></span>
        Average response time
      </label>
    </div>
    <div>
      <label class="control checkbox">
        <input type="checkbox" ng-model="dto.showTotalTicketAmount">
        <span class="control-indicator"></span>
        Total amount of tickets
      </label>
    </div>
    <button class="btn btn-lg btn-primary pull-right" append-html-to-body
            data="customerReport" custom-disabled="{{ customerReportForm.$invalid }}"
            url="/html/scripts/core/left-panel/customer-ticket-report/customer-ticket-report.tpl.html"
            ng-click="getCustomerTicketReport(customerReportForm)">Generate</button>
  </div>
</div>
