<div class="select-taxes-drv" style="display: inline-block;" uib-dropdown dropdown-appent-to-body="true" on-toggle="$ctrl.onDropdownToggle(open)">
  <div ng-if="$ctrl.activePlaceholder && $ctrl.showPlaceholder" class="placeholder active">{{ $ctrl.activePlaceholder }}</div>
  <div ng-if="$ctrl.activePlaceholder" class="placeholder">{{ $ctrl.activePlaceholder }}</div>
  <input ng-if="!$ctrl.showIcon" smart-dropdown-menu-position type="text" class="form-control ellipsis clickable tax-input" ng-value="$ctrl.getSelectedTaxNames()" placeholder="{{ $ctrl.activePlaceholder ? '' : 'Choose Tax' }}" readonly uib-dropdown-toggle>
  <i ng-if="$ctrl.showIcon" class="icn-sm icn-tax" uib-dropdown-toggle> </i>
  <div class="dropdown-menu checkbox-dropdown" uib-dropdown-menu stop-propagation="click" style="overflow: hidden;">
    <div class="list-container">
      <div class="custom-scroll" style="max-height: 164px;margin-bottom: 10px;" ng-if="!$ctrl.previewMode">
        <div class="checkbox-dd-item"
             ng-repeat="tax in $ctrl.taxList | orderBy: 'name'">
          <label class="control checkbox ellipsis">
            <input type="checkbox" ng-model="$ctrl.selectedTaxes[tax.id]" no-select
                   ng-change="$ctrl.updateEntityTaxList(tax)">
            {{ tax.name }}&nbsp;{{ tax.rate }}%
            <i class="icn-sm icn-label-save" ng-show="$ctrl.selectedTaxes[tax.id]" style="right: 13px"></i>
          </label>
        </div>
      </div>

      <div class="custom-scroll" style="max-height: 164px;margin-bottom: 10px;" ng-if="$ctrl.previewMode">
        <div class="checkbox-dd-item"
             ng-repeat="tax in $ctrl.taxList | orderBy: 'name' track by tax.id" ng-show="$ctrl.selectedTaxes[tax.id]">
          <label class="control checkbox ellipsis" onclick="return false">
            <input type="checkbox" ng-model="$ctrl.selectedTaxes[tax.id]" no-select>
            {{ tax.name }}&nbsp;{{ tax.rate }}%

          </label>
        </div>
      </div>
    </div>

  </div>
</div>
