<div class="settings-main-wrapper">
  <div class="email-me-wrapper">

    <form name="emailNotificationsForm">

      <h3>Email me when: </h3>

      <p>Email notifications will email if one of the follow events are created. Please select what notifications
      you want to be notified about</p>

      <div class="clearfix">
        <label class="control checkbox pull-left">
          <input type="checkbox" ng-model="emailNotifications.newDevice"
                 ng-change="saveEmailNotifications(emailNotificationsForm)">
          <span class="control-indicator"></span> When my account is logged in from a new device
        </label>
      </div>

      <div class="clearfix">
        <label class="control checkbox pull-left">
          <input type="checkbox" ng-model="emailNotifications.ticketCreated"
                 ng-change="saveEmailNotifications(emailNotificationsForm)">
          <span class="control-indicator"></span> When a New Ticket created
        </label>
      </div>



      <div class="clearfix">
        <label class="control checkbox pull-left">
          <input type="checkbox" ng-model="emailNotifications.myTicketUpdated"
                 ng-change="saveEmailNotifications(emailNotificationsForm)">
          <span class="control-indicator"></span> When a ticket that is assigned to me is updated
        </label>
      </div>

      <div class="clearfix">
        <label class="control checkbox pull-left">
          <input type="checkbox" ng-model="emailNotifications.ticketCloseNotifications"
                ng-change="saveEmailNotifications(emailNotificationsForm)" >
          <span class="control-indicator"></span> When any ticket is closed
        </label>
      </div>

    </form>
  </div>
</div>
