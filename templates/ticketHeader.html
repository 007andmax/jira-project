<h4>{{panelTitle}} <span class="dot-sep"></span> <span class="tickt-counts">{{ticketCount}}</span></h4>
<div class="ticket-actions" style="display:none" id="ticketBulkActionCtrl">
    <div class="btn btn-white-gray btn-cr hidden-xs hidden-sm" data-toggle="tooltip" data-placement="top" title="Delete" ng-click="deleteTicketBulk($event)">
        <span class="icn-nav-delete"></span>
    </div>
    <div class="btn btn-white-gray btn-cr hidden-xs hidden-sm"data-toggle="tooltip" data-placement="top" title="assign ticket to...">
        <span class="icn-nav-user"></span>
    </div>
    <div class="btn btn-white-gray btn-cr hidden-xs hidden-sm"data-toggle="tooltip" data-placement="top" title="Tag" ng-click="getTagAs($event)">
        <span class="icn-nav-tag"></span>
    </div>
    <div class="dropdown pull-left">
        <div class="btn btn-white-gray btn-cr hidden-xs hidden-sm dropdown-toggle" data-toggle="dropdown" title="Tooltip on top">
            <span class="icn-nav-more"></span>
        </div>
        <ul class="dropdown-menu" role="menu">
            <li><a tabindex="-1" href="javascript:{}" ng-click="markAsOpenBulk($event)">Mark as Open</a></li>
            <li><a tabindex="-1" href="javascript:{}" ng-click="markAsSpamBulk($event)">Mark as Spam</a></li>
            <li class="dropdown-submenu">
                <a tabindex="-1" href="javascript:{}">Change Priority to...</a>
                <div class="dropdown-submenu-wrapper">
                    <ul class="dropdown-menu dropdown-priority">
                        <li><a tabindex="-1" href="javascript:{}" ng-click="changePriorityBulk($event, 'low')"> <span class="priority-dot low"></span> Low </a></li>
                        <li><a tabindex="-1" href="javascript:{}" ng-click="changePriorityBulk($event, 'medim')"> <span class="priority-dot medium"></span> Medium </a></li>
                        <li><a tabindex="-1" href="javascript:{}" ng-click="changePriorityBulk($event, 'high')"> <span class="priority-dot high"></span> High </a></li>
                    </ul>
                </div>
            </li>
        </ul>
    </div>
</div>
<div class="pull-right">
    <div class="dropdown pull-right" id="filterBox" role="dialog" aria-hidden="true">
        <button type="submit" data-target="#filterBox" class="btn btn-gray btn-filter dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">Filter by <span class="icn-caret-gray"></span></button>
        <div class="dropdown-menu dropdown-filter clearfix">
            <div class="filter-by-wrapper filter-priority clearfix">
                <label class="control checkbox">
                    <input type="checkbox" class="filter-tickets filterPriority" >
                    <span class="control-indicator icn-checkbox" ng-click="checkMe($event)"></span>
					<input type="hidden" value="false">
                    Filter by priority
                </label>
                <div class="filter-slider-wrapper clearfix">
                    <div class="filter-slider-handle icn-slider-handle" style="left: 113px"></div>
                    <div class="filter-slider-track">
                        <div class="slidpo filter-slider-starts icn-slider-start pull-left" data-value="low">
                            <span class="filter-label">Low</span>
                        </div>
                        <div class="slidpo filter-slider-center icn-slider-center active pull-left" data-value="medium">
                            <span class="filter-label">Medium</span>
                        </div>
                        <div class="slidpo filter-slider-ends icn-slider-end pull-left" data-value="high">
                            <span class="filter-label">High</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="filter-by-wrapper filter-status clearfix">
                <label class="control checkbox">
                    <input type="checkbox" class="filter-tickets filterStatus">
					<input type="hidden" value="false">
                    <span class="control-indicator icn-checkbox" ng-click="checkMe($event)"></span>
                    Filter by status
                </label>
                <div class="filter-slider-wrapper clearfix">
                    <div class="filter-slider-handle icn-slider-handle" style="left: 11px"></div>
                    <div class="filter-slider-track">
                        <div class="slidpo filter-slider-starts icn-slider-start active pull-left" data-value="on_hold">
                            <span class="filter-label">On hold</span>
                        </div>
                        <div class="slidpo filter-slider-center icn-slider-center pull-left" data-value="in_progress">
                            <span class="filter-label">In progress</span>
                        </div>
                        <div class="slidpo filter-slider-ends icn-slider-end pull-left" data-value="completed">
                            <span class="filter-label">Completed</span>
                        </div>
                    </div>
                </div>
            </div>
            <a href="javascript:{}" class="btn btn-sr btn-scooter btn-reset-filter pull-right" data-dismiss="dropdown" ng-click="filterTickets($event, ticketListType)">Search</a>
            <a href="javascript:{}" class="btn btn-sr btn-gray btn-apply-filter pull-right" data-dismiss="dropdown" ng-click="closeFilterTickets($event, ticketListType)">Cancel</a>
        </div>
    </div>
    <div class="form-group pull-right">
        <input type="text" ng-model="keyword" class="form-control form-control-round form-control-search" data-provide="typeahead" autocomplete="off" id="typeahead" placeholder="Search tickets by client or tkt#" ng-change="keywordSearch($event, filter)">
    </div>
</div>
