<div class="modal-backdrop fade in" style="height: 2000px;"></div>
      <div class="modal-dialog" ng-controller="TagController">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
            <h4 class="modal-title">Label {{selectedTickets}} tickets as...</h4>
          </div>
          <div class="modal-body">
            <ul class="modal-tag-list" id="ticketAssignTags">
              <li ng-repeat="tag in tags">
                <label class="control checkbox">
                  <input type="checkbox" value="{{tag.id}}">
                  <span class="control-indicator pull-left"></span>
                  <span class="tag-color tag-blue {{tag.color}} {{checkIntermediate(tag)}}" ></span>
                  {{tag.name}}
                </label>
              </li>
            </ul>
          </div>
          <div class="modal-footer">
            <div class="btn btn-white-gray btn-cr pull-left" data-toggle="tooltip" data-placement="top" title="" data-original-title="create label" ng-click="getcreateTag($event)">
              <span class="icn-create-label"></span>
            </div>
            <button type="button" class="btn btn-gray" data-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-scooter" ng-click="postTagAs($event)">Save Changes</button>
          </div>
        </div><!-- /.modal-content -->
      </div><!-- /.modal-dialog -->
