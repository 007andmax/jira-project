<div class="modal-dialog modal-att-box" ng-controller="UserController">
	<div class="modal-content">
		<div class="modal-header">
			<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
			<h4 class="modal-title" id="assignToLabel">Assign Ticket to...</h4>
			<div class="clearfix">
				<div class="form-group">
					<input type="email" class="form-control tokenfield" vlaue="d.fosket@quicktech.com" placeholder="Add agent" />
				</div>
			</div>
		</div>
		<div class="modal-body scroll-pane" ng-contoller="TicketsController" {{getAssignToUsers(currentCompany)}}>
			<ul class="users-list" ng-controller="UserController">
				<li ng-repeat="user in getAllByCompanyId(currentUser.company)" ng-click="selectAssignUser($event, user, ticketDetail)">
					<a herf="" class="pull-left avatar-26 avatar m-r">
						<img src="html/images/avatars/a4.jpg" alt="..." class="img-circle">
					</a>
					<div class="clearfix">
						<div class="user-name"><a href="javascript:{}">{{user.firstName}} {{user.lastName}}</a></div>
					</div>
				</li>
			</ul>
		</div>
	</div>
</div>
