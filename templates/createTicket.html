<div class="modal-backdrop fade in" style="height: 2000px;"></div>
	<div class="modal-dialog" ng-controller="UserController">
        <div class="modal-content">
          <div class="modal-header clearfix">
            <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true" class="icn-close-modal"></span></button>
            <h4 class="modal-title pull-left">Create Ticket <span class="dot-sep"></span> </h4><span class="ticket-numer pull-left">Tkt# 0236589</span>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <input type="text" class="form-control form-control-subject" placeholder="Subject" id="createTicketSubject" onblur="createAble()">
            </div>
            <div class="form-group">
              <textarea class="form-control form-control-message" placeholder="Type your message..." id="createTicketNote" onblur="createAble()"></textarea>
            </div>
            <div class="wysiwyg-controls-wrapper clearfix">
              <a href="#" class="pull-left icn-wysiwyg-attachment"></a>
              <span class="pull-left line-sep"></span>
              <div class="pull-left dropdown-tz-wrapper dropdown">
                <a href="#" class="pull-left icn-wysiwyg-tz"></a>
              </div>
              <div class="font-styles pull-left">
                <a href="#" class="icon pull-left icn-wysiwyg-bold"></a>
                <a href="#" class="icon pull-left icn-wysiwyg-italic"></a>
                <a href="#" class="icon pull-left icn-wysiwyg-underline"></a>
                <div class="pull-left color-preview dropdown"></div>
              </div>
              <div class="text-bullets pull-left">
                <a href="#" class="icon pull-left icn-wysiwyg-bn"></a>
                <a href="#" class="icon pull-left icn-wysiwyg-bp"></a>
              </div>
              <div class="text-styles pull-left">
                <a href="#" class="icon pull-left icn-wysiwyg-tal"></a>
                <a href="#" class="icon pull-left icn-wysiwyg-tac"></a>
                <a href="#" class="icon pull-left icn-wysiwyg-tar"></a>
                <a href="#" class="icon pull-left icn-wysiwyg-iless"></a>
                <a href="#" class="icon pull-left icn-wysiwyg-imore"></a>
              </div>
              <a href="#" class="pull-left icn-wysiwyg-quote"></a>
              <a href="#" class="pull-right icn-wysiwyg-reset disabled"></a>
            </div>
          </div>
          <div class="modal-footer" ng-controller="CompaniesController">
            <div class="row-wrapper clearfix">
              <div class="form-group dropdown pull-left">
                <label>company</label>
                <input type="text" name="company" class="form-control form-control-dropdown dropdown-toggle" data-toggle="dropdown" aria-expanded="true" id="ticketCompany" onblur="createAble()">
				<input type="hidden" id="ticketCompanyId">
                <ul class="dropdown-menu dropdown-company" role="menu" >
				  <li role="presentation" ng-repeat="company in companies" ng-click="selectCompany($event, company)" ><a role="menuitem" tabindex="-1" href="javascript:{}">{{company.legalName}}</a></li>
                </ul>
              </div>
              <div class="form-group dropdown pull-left">
                <label>created by</label>
                <input type="text" class="form-control form-control-dropdown dropdown-toggle" data-toggle="dropdown" aria-expanded="true" id="ticketCreatedBy" onblur="createAble()">
				<input type="hidden" id="ticketCreatedById" />
                <ul class="dropdown-menu">
					
                  <li ng-if="companyUsers.length == 0" role="presentation" class="dropdown-header">Please select company to<br>access users.</li>
				  <li ng-if="companyUsers.length > 0" role="presentation" class="dropdown-header" ng-repeat="user in companyUsers" ng-click="selectUser($event, user)"><a role="menuitem" tabindex="-1" href="javascript:{}">{{user.firstName}} {{user.lastName}}</a></li>
                </ul>
              </div>
              <div class="form-group dropdown pull-right">
                <label>priority</label>
                <input type="text" class="form-control form-control-dropdown dropdown-toggle" data-toggle="dropdown" aria-expanded="true" id="createTicketPriority" onblur="createAble()">
                <ul class="dropdown-menu dropdown-priority">
                  <li><a tabindex="-1" href="javascript:{}" ng-click="selectPriority($event, 'low')"><span class="priority-dot low"></span> Low </a></li>
                  <li><a tabindex="-1" href="javascript:{}" ng-click="selectPriority($event, 'medium')"><span class="priority-dot medium" ></span> Medium </a></li>
                  <li><a tabindex="-1" href="javascript:{}" ng-click="selectPriority($event, 'high')"><span class="priority-dot high"></span> High </a></li>
                </ul>
              </div>
            </div>
            <div class="row-wrapper clearfix">
              <div class="form-group dropdown pull-left">
                <label>assign to</label>
                <input type="text" class="form-control form-control-dropdown dropdown-toggle" data-toggle="dropdown" aria-expanded="true" id="ticketAssignTo"  onchange="getAssignToUsers(currentCompany)">
                <input type="hidden" id="ticketAssignToId" />
				<ul class="dropdown-menu users-list">
                  <li ng-repeat="assignToUser in currentCompanyUser"] ng-click="selectAssignTo($event, assignToUser)">
                    <a class="clearfix" href="javascript:{}">
                      <span class="avatar avatar-26">
                        <img src="html/images/avatars/a4.jpg" alt="..." class="img-circle">
                      </span>
                      {{assignToUser.firstName}} {{assignToUser.lastName}}
                    </a>
                  </li>
                </ul>
              </div>
              <div class="form-group actions-wrapper pull-right">
                <button type="button" class="btn btn-gray" data-dismiss="modal" ng-click="cancelCreateTicket($event)">Cancel</button>
                <button type="button" class="btn btn-scooter" ng-click="postCreateTicket($event)" id="createTicketBtn" disabled>Create</button>
              </div>
            </div>
          </div>
        </div><!-- /.modal-content -->
	</div><!-- /.modal-dialog -->
