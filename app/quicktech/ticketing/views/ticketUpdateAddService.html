
<div class="add-service clearfix" ng-repeat="service in services" ng-init="serviceIndex = $index">
  <div class="col-1">
    <div class="col-wrapper dropdown">
      <input type="text" class="form-control form-control-dropdown dropdown-toggle has-dropdown" placeholder="Service" data-toggle="dropdown" aria-expanded="true" ng-model="service.name">
      <ul class="dropdown-menu dropdown-menu-services">
      	
        <li role="presentation" ng-repeat="companyService in companyServices">
        <a role="menuitem" tabindex="-1" href="javascript:void(0);" ng-click="service.id = companyService.versionedId.id; service.name = companyService.name"> {{ companyService.name }} </a>
        </li>
        
      </ul>
    </div>
  </div>
  <div class="col-2">
    <div class="col-wrapper dropdown">
      <input type="text" id="hourmin_{{ $index }}" class="form-control form-control-dropdown dropdown-toggle has-dropdown" data-toggle="dropdown" aria-expanded="true" placeholder="Hr : Min" ng-model="service.HourMin">
      <div class="dropdown-menu dropdown-menu-transparent dropdown-time">

        <ul id="servicehour" class="dropdown-menu dropdown-menu-hour">
          <li role="presentation" ng-repeat="hour in serviceMeta.hours">
            <a role="menuitem" tabindex="-1" href="#" ng-click="setTime($event, 'hour', serviceIndex);" ng-class="{'active': service.selectedHour === hour}">{{ hour | numberFixedLen:2 }}</a>
          </li>
        </ul>

        <ul id="serviceminute" class="dropdown-menu dropdown-menu-minute">
          <li role="presentation" ng-repeat="min in serviceMeta.minutes">
            <a role="menuitem" tabindex="-1" href="#" ng-click="setTime($event, 'min', serviceIndex);" ng-class="{'active': service.selectedMin === min}">{{ min | numberFixedLen:2 }}</a>
          </li>
        </ul>

      </div>
    </div>
  </div>
  <div class="col-5">
    <div class="col-wrapper">
      <a href="javascript:void(0)" class="btn btn-cr btn-gray btn-remove-update pull-left tp-hide" data-toggle="tooltip" data-original-title="Remove Service" data-placement="top" ng-click="serviceMeta.removeService($index);">
        <span class="icn-remove-update"></span>
      </a>
    </div>
  </div>
  <div class="col-4">
    <div class="col-wrapper">
      <input type="text" id="dtpicker_{{ $index }}" class="form-control form-control-dropdown dropdown-toggle has-dropdown" data-toggle="dropdown" aria-expanded="true" placeholder="Date" ng-model="service.date">
    </div>
  </div>
  <div class="col-3">
    <div class="col-wrapper">
      <input type="text" class="form-control service-description" placeholder="Description" ng-model="service.desc">
    </div>
  </div>
</div> <!-- /ng-repeat -->
