<div class="clearfix">
  <a herf="javascript:void(0)" class="pull-left avatar">
    <img class="img-circle avatar-26"
         ng-src="{{ '/users/' + (match.model.id || 'default') + '/image' + (match.model.avatar ? '?t=' + match.model.avatar.updatedAt : '') }}"
         alt="...">
  </a>

  <div class="user-name"
       ng-bind-html='(match.label | uibTypeaheadHighlight:query) + (match.model.primaryEmail && match.model.primaryEmail.length > 0 ? " \"" + match.model.primaryEmail + "\"" : "")'></div>

</div>
