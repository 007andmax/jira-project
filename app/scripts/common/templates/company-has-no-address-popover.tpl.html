<div>
  <div class="modal-body" style="width: 250px;">
    {{ currentUser.isOwner
    ? 'You can not use invoicing feature, because you have not entered the company\'s address.'
    : 'The owner of the company has not filled the address of the company, therefore you can not use invoicing feature.'
    }}
  </div>
  <div class="modal-footer">
    <div class="btn btn-lg btn-info" ui-sref="settings.companyInfo({ isAddressFocused: true })"
         ng-if="currentUser.isOwner" ng-click="focusOnAddress()">
      Enter Address
    </div>
  </div>
</div>
