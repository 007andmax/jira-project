<div class="alert alert-yellow hide" user-notification style="z-index: 1039;" ng-if="applicationLoaded"></div>

<div class="top-bar" style="z-index: 1038;" ng-if="applicationLoaded "
     ng-include="'/html/scripts/core/header/header.tpl.html'"></div>

<div class="mobile-top-bar" style="z-index: 1038;" ng-if="applicationLoaded "
     ng-include="'/html/scripts/core/header/mobile-header.tpl.html'"></div>

<aside id="left" qt-sidebar style="z-index: 1039;" ng-if="applicationLoaded"
       ng-include="'/html/scripts/core/left-panel/left-panel.tpl.html'"></aside>

<aside id="mobile-left" qt-sidebar style="z-index: 1039;" ng-if="applicationLoaded"
       ng-include="'/html/scripts/core/left-panel/mobile-left-panel.tpl.html'"></aside>

<aside id="right" class="nano collapsed" ng-if="!isRightPanelHidden && applicationLoaded" right-panel
       ng-include="'/html/scripts/core/right-panel/right-panel.tpl.html'"></aside>

<div class="main-container" ng-if="applicationLoaded ">
  <div class="row">
    <div class="content-container" ng-class="{'large': isRightPanelHidden}">
      <div class="content-wrapper">
        <div ui-view></div>
      </div>
    </div>
  </div>
</div>
<div feedback-form ng-if="applicationLoaded"></div>
<div welcome-wizard ng-if="applicationLoaded && currentUser && currentUser.isOwner"></div>
