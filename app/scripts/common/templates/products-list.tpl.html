<ul class="category-list-container qt-table nano-content" ng-init="categoryExpanded = {}">

  <li ng-hide="isCanCreateProduct" class="clear-product" ng-click="chooseProductItem()">
    <div class="clear-product-cont">
      <span>Clear Product</span>
    </div>
  </li>

  <li ng-show="isCanCreateProduct" class="create-product" ng-click="createNewProduct()"
      ng-if="PermissionsService.isAllowed('inventry/products', currentUser.role, 'c')">
    <div class="create-product-cont" style="">
      <span>Create Product</span>
    </div>
  </li>

  <li class="category-conteiner" ng-repeat="category in autocompleteData | orderBy: 'name' track by category.id"
      ng-show="(category.products | filter:filterProduct).length > 0" ng-init="categoryExpanded[category.id] = false">

    <div class="category-info" ng-click="categoryExpanded[category.id] = !categoryExpanded[category.id]">
      <span><b>{{ category.name }}</b></span>
      <span><b>{{ category.products.length + (category.products.length > 1 ? ' items' : ' item') }}</b></span>
      <i class="icn-sm icn-caret-gray pull-right" ng-class="{'rotated': categoryExpanded[category.id]}"></i>
    </div>

    <ul class="qt-table product-list-container" ng-if="categoryExpanded[category.id]">

      <li ng-click="chooseProductItem(product)"
          ng-repeat="product in category.products | filter: filterProduct | orderBy: 'description' track by product.versionedId.id">

        <div>
          <span class="title">{{ product.description }}</span>
          <span class="pull-right total-count">{{ product.sale | currency: '$': 2 }}</span>
          <span class="clearfix"></span>

          <div style="color:#b2becd;">
            <span ng-show="product.ilc">ILC: {{ product.ilc }}</span>
            <span ng-show="product.manufacture" style="margin-left: 15px;">P/N: {{ product.manufacture }}</span>
          </div>
        </div>

      </li>

    </ul>

  </li>

</ul>
