<div class="wrapper container">
  <div class="row">
    <div class="interior">
      <div class="col-md-12 agent-head">
        <p class="agent-head__description">Agent Install</p>
      </div>
      <div class="col-md-12 icons-container">
        <div class="col-md-6">
          <img class="svg-icn download-icn" src="images\input-icons\monitor-symbol-with-download-down-arrow.svg"
               alt="download">
        </div>
        <div class="col-md-6">
          <img class="svg-icn letter-icn" src="images\input-icons\envelope.svg" alt="letter">
        </div>
      </div>
      <div class="form-container col-md-12">
        <div class="col-md-12">
          <div class="form-group">
            <input type="text" class="form-control" placeholder="Name">
          </div>
        </div>
        <div class="col-md-12">
          <div class="form-group">
            <input type="text" class="form-control" placeholder="Email Address">
          </div>
        </div>
      </div>
      <div class="form-container col-md-12">
        <div class="col-md-12">
          <div class="form-group">
            <input type="text" class="form-control" placeholder="Admin Name">
          </div>
        </div>
        <div class="col-md-12">
          <div class="form-group">
            <input type="text" class="form-control" placeholder="Admin Password">
          </div>
        </div>
      </div>
      <div class="col-md-12">
        <span class="underline-link">View and edit default email content</span>
      </div>
      <div class="col-md-12">
        <div class="btn btn-lg btn-info download-agent-btn">
          Send Email
        </div>
      </div>
      <div class="col-md-12">
        <div class="btn btn-lg btn-info download-agent-btn">
          Copy Link to Clipboard
        </div>
      </div>
    </div>
    <div class="internal-wrap">
      <div class="col-md-12 agent-head">
        <p class="agent-head__description">
          <span class="back-in-black">
            <i class="icn-sm icn-expand"></i>
          </span>
          Email Template
        </p>
      </div>
      <div class="form-container col-md-12">
        <div class="col-md-12">
          <div class="form-group">
            <label class="control-label">Subject</label>
            <input type="text" class="form-control">
          </div>
        </div>
        <div class="col-md-12">
          <div class="form-group">
            <label class="control-label">Body</label>
            <textarea class="form-control"></textarea>
          </div>
          <div class="template-actions">
            <div class="btn btn-lg btn-info download-agent-btn">
              Save
            </div>
            <div class="btn btn-lg btn-primary download-agent-btn">
              Cancel
            </div>
            <div class="restore-default-wrap">
              <span class="or">or</span>
              <a href="#">Restore Default</a>
            </div>
          </div>

          <div style="padding-bottom: 10px;">
            <span class="available-keywords-label">Available keywords: </span>
              <span class="available-keyword" ng-repeat="keyword in keywords" ng-click="insertAtCaret(keyword.keyName)">
                {{ keyword.keyName }}{{ $last ? '.' : ', ' }}
              </span>
          </div>

        </div>
      </div>
    </div>
  </div>
