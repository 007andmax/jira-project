<div class="company-cover-wrapper edit-cover" style="background-color: #f7f9fb;">

  <div crop-box style="width: 100%; height: 100%; display: none"></div>

  <div class="reposition-wrapper" instruction-wrap>DRAG TO REPOSITION COVER</div>

  <div class="actions-wrapper">

    <div class="btn btn-info btn-lg" save-button
         ng-click="callSaveEditCover(model)" ng-disabled="disabledCoverControl">
      Save
    </div>

    <div class="btn btn-primary btn-lg"
         ng-click="cancelEditCover()" ng-disabled="disabledCoverControl">
      Cancel
    </div>

  </div>

  <div class="row-wrapper clearfix hide">
    <div class="zoom-slider pull-centre">
      <a href="javascript:void(0)" class="pull-left icn icn-zoom-minus disabled" icn-zoom-minus></a>

      <div class="range-wrapper  pull-left">
        <input range-zoom type="range" ng-disabled="disabledCoverControl"
               max="130" min="0" style="width: 130px;">
      </div>
      <a href="javascript:void(0)" class="pull-right icn icn-zoom-plus disabled" icn-zoom-plus></a>
    </div>
  </div>

  <div class="hide" file-uploader></div>

  <div class="loader-wrapper" ng-show="isShowLoaderOnCover">
    <div class="loader"></div>
  </div>

</div>
