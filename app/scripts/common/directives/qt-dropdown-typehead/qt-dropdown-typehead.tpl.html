
<div id="qtDropdown">

  <div>
    <input type="text" class="form-control has-dropdown"
           ng-model="$ctrl.viewValueItem"
           ng-click="$ctrl.changeDropdownState()"
           ng-keyup="$ctrl.listFilterFunction()" >
    <div>
          <span class="x-mark" ng-click="$ctrl.clearValueByIconClick()" ng-show="$ctrl.viewValueItem.length">
            <i class="icn-sm icn-remove-old" tooltip="clear"
               tooltip-placement="top"></i>
          </span>
          <span class="x-mark ng-hide" ng-hide="$ctrl.viewValueItem.length" ng-click="$ctrl.changeDropdownState()">
            <i class="icn-sm report-caret-icon"></i>
          </span>
    </div>
  </div>

  <div class="dropdown-content" ng-show="$ctrl.isOpen">
    <ul>
      <li  ng-repeat="item in $ctrl.list " ng-click="$ctrl.selectItem(item)">
        {{$ctrl.getDisplayedProperty(item)}}

      </li>
    </ul>
  </div>

</div>
