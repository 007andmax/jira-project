<!--MENU FOR NON-TECH REPORTS-->
<div ng-show="!$ctrl.isTechReport">
  <div ng-form="reportSettingForm">
    <div class="run-report-content clearfix {{ $ctrl.className || '' }}">


      <button class="form-group btn btn-success" ng-click="$ctrl.sendReportRequest(reportSetting)"
              ng-disabled="reportSettingForm.$invalid && !$ctrl.isCustomerHidden && !$ctrl.isRadioButtonHidden">Get
        Report
      </button>



      <div class="device-report dropdown-remote-report-tech form-group" ng-show="$ctrl.isShowTechSelectField">
        <input type="text"
               class="form-control has-dropdown-with-label pointer"
               autocomplete="off"
               ng-model="reportSetting.techUser"
               name="ticketAssignTo"
               typeahead-editable="false"
               smart-dropdown-menu-position
               ng-disabled="!reportSetting.company && !availableTechusersWoCompany"
               typeahead-template-url="/html/partials/user-autocomplete.tpl.html"
               placeholder="Tech"
               uib-typeahead="user as $ctrl.getUserName(user) for user in usersCurrentCompany | filter: $viewValue:stateComparator | orderBy:'firstName'"
               qt-typeahead-async-show-on-focus
               custom-style="{'max-height': '113px', 'overflow-y': 'auto', 'width': '100%'}"> </input>

        <div typeahead-input-icon-sm="userCompany"></div>

        <div class="ng-scope" typeahead-input-icon="userCompany">
          <span class="x-mark" ng-click="clearInput($event)" ng-show="showClearIcon">
            <i class="icn-sm icn-remove-old" ng-click="clearInput($event)" tooltip="clear"
               tooltip-placement="top"></i>
          </span>
          <span class="x-mark ng-hide" ng-hide="showClearIcon">
                <i class="icm-sm report-caret-icon"></i>
          </span>
        </div>

      </div>

      <div class="device-report form-group" ng-hide="$ctrl.isDeviceHidden">
        <input type="text"
               class="form-control has-dropdown-with-label"
               autocomplete="off"
               ng-model="reportSetting.device"
               name="reportAgent"
               smart-dropdown-menu-position
               ng-disabled="!reportSetting.company"
               uib-typeahead="agent as (agent.hostName || agent.ip) for agent in filteredAgentList | filter:filterAgents($viewValue) | orderBy:'hostName'"
               qt-typeahead-async-show-on-focus
               placeholder="Device"
               custom-style="{'max-height': '113px', 'overflow-y': 'auto', 'width': '356px'}"> </input>
        <div typeahead-input-icon-sm="reportAgent"></div>
        <div class="ng-scope" typeahead-input-icon="userCompany">
          <span class="x-mark" ng-click="clearInput($event)" ng-show="showClearIcon">
            <i class="icn-sm icn-remove-old" ng-click="clearInput($event)" tooltip="clear"
               tooltip-placement="top"></i>
          </span>
          <span class="x-mark ng-hide" ng-hide="showClearIcon">
            <i class="icn-sm report-caret-icon"></i>
          </span>
        </div>
      </div>

      <div class="form-group content" ng-hide="$ctrl.isRadioButtonHidden">
        <div uib-dropdown>
          <input type="text"
                 name="reportType"
                 ng-model="reportType"
                 autocomplete="off"
                 tabindex="3"
                 smart-dropdown-menu-position
                 class="form-control form-control-dropdown dropdown-toggle"
                 uib-typeahead="type for type in reportTypes"
                 qt-typeahead-async-show-on-focus
                 ng-change="reportType ? (previousReportType = reportType) : (reportType = reportType || previousReportType)"
                 readonly
                 custom-style="{width: '100%', 'max-height': '160px', 'overflow-y': 'auto'}"> </input>
        </div>

      </div>

      <div class="form-group content" ng-show="$ctrl.isCustomerTicketOptions && false">
        <div uib-dropdown>
          <input type="text"
                 name="customerTicketType"
                 ng-model="customerTicketType"
                 autocomplete="off"
                 tabindex="3"
                 smart-dropdown-menu-position
                 class="form-control form-control-dropdown dropdown-toggle"
                 uib-typeahead="type for type in customerTicketTypes"
                 qt-typeahead-async-show-on-focus
                 readonly
                 custom-style="{width: '100%', 'max-height': '160px', 'overflow-y': 'auto'}"> </input>

        </div>
      </div>

      <div class="content form-group" ng-hide="$ctrl.isDateRangeHidden">
        <div>
          <div class="text-error" style="position: absolute;bottom: -10px;right: 0;" ng-hide="errorNassageForDate">
            Please select
            the dates
          </div>
          <div style="position: relative;">
            <input type="text"
                   class="form-control has-dropdown readonly-normal"
                   name="reportDateRange"
                   readonly
                   date-format="dd/mm/yy"
                   date-range-picker
                   options="datePickerOptions"
                   range max-date="{{ maxDateForDateRangeInputField }}"
                   ng-model="reportSetting.dateRange"
                   placeholder="Select Date"> </input>
            <i class="report-calendar" ng-show="!startDate && !endDate"></i>
            <i class="icn-sm icn-remove-old pointer"
               ng-show="startDate && endDate"
               uib-tooltip="clear date filter"
               style="pointer-events: all;" tooltip-placement="top" ng-click="resetDate()"></i>
          </div>
        </div>
      </div>

      <div class="form-group content" ng-show="$ctrl.isSerialNumberOptions">
        <div uib-dropdown>
          <input type="text"
                 name="serialNumber"
                 ng-model="serialNumber"
                 autocomplete="off"
                 class="form-control"
                 placeholder="Serial Number"
                 custom-style="{width: '100%', 'max-height': '160px', 'overflow-y': 'auto'}"> </input>
        </div>

      </div>

      <div class="form-group content" ng-hide="$ctrl.isCustomerHidden">

        <div class="text-error" style="position: absolute;bottom: -10px;right: 0;" ng-hide="errorNassageForCompany">
          Please select
          the company name
        </div>
        <div uib-dropdown>
          <input type="text"
                 name="reportCompany"
                 ng-disabled="reportType.toUpperCase() !== 'DETAILED'"
                 ng-model="reportSetting.company"
                 autocomplete="off"
                 tabindex="3"
                 smart-dropdown-menu-position
                 class="form-control form-control-dropdown dropdown-toggle"
                 uib-typeahead="company as company.name for company in clientCompanies | filter:{'name': $viewValue}:stateComparator | orderBy:'name'"
                 placeholder="{{ $ctrl.commonCommissions || $ctrl.detailedCommissions ? 'All companies' : 'Company Name' }}"
                 qt-typeahead-async-show-on-focus
                 custom-style="{width: '100%', 'max-height': '160px', 'overflow-y': 'auto'}"> </input>
          <div class="input-top-4" typeahead-input-icon="userCompany"></div>

          <!--<qt-dropdown-typehead list-for-dropdown="clientCompanies"-->
          <!--selected-item="reportSetting.company"-->
          <!--display-property="'name'"-->
          <!--filter-property="'name'"-->
          <!--qt-tabindex="'3'"-->
          <!--qt-ng-disabled="'reportType.toUpperCase() === \'SUMMARY\''"-->
          <!--qt-ng-required="'reportType.toUpperCase() === \'DETAILED\''"-->
          <!--qt-name="'reportCompany'"-->
          <!--qt-readonly-->
          <!--qt-class="'form-control'"-->
          <!--qt-ng-style="'{\'max-height\': \'160px\', \'overflow-y\': \'auto\', \'width\': \'100%\'}'">-->

          <!--</qt-dropdown-typehead>-->

        </div>
      </div>

      <div class="form-group content" ng-show="$ctrl.commonCommissions || $ctrl.detailedCommissions">

        <div>

          <div class="text-error" style="position: absolute;bottom: -10px;right: 0;" ng-hide="errorNassageForSalesUser">
            Select
            the sales user
          </div>
          <div uib-dropdown style="position: relative">
            <input type="text"
                   name="reportCompany"
                   ng-model="reportSetting.salesUser"
                   autocomplete="off"
                   tabindex="3"
                   smart-dropdown-menu-position
                   class="form-control form-control-dropdown dropdown-toggle"
                   uib-typeahead="user as $ctrl.getUserName(user) for user in techUsers | filter: $viewValue:stateComparator | orderBy:'firstName'"
                   placeholder="Sales user"
                   qt-typeahead-async-show-on-focus
                   custom-style="{width: '100%', 'max-height': '160px', 'overflow-y': 'auto'}"> </input>
            <div class="input-top-4" typeahead-input-icon="userCompany"></div>

            <!--<qt-dropdown-typehead list-for-dropdown="clientCompanies"-->
            <!--selected-item="reportSetting.company"-->
            <!--display-property="'name'"-->
            <!--filter-property="'name'"-->
            <!--qt-tabindex="'3'"-->
            <!--qt-ng-disabled="'reportType.toUpperCase() === \'SUMMARY\''"-->
            <!--qt-ng-required="'reportType.toUpperCase() === \'DETAILED\''"-->
            <!--qt-name="'reportCompany'"-->
            <!--qt-readonly-->
            <!--qt-class="'form-control'"-->
            <!--qt-ng-style="'{\'max-height\': \'160px\', \'overflow-y\': \'auto\', \'width\': \'100%\'}'">-->

            <!--</qt-dropdown-typehead>-->

          </div>
        </div>


      </div>

      <div class="form-group content" ng-show="$ctrl.isProductOptions">

        <div style="float: left;width: 100%;">
          <div products-list id="product-list-cont"
               click-outside="closeDropdown()" outside-if-not="product-list-cont">

            <div tooltip-placement="top">

              <input style="cursor: pointer;" ng-hide="isPLOpen" type="text" class="form-control has-dropdown"
                     pl-product-input
                     placeholder="Product" autocomplete="off"> </input>

              <input ng-show="isPLOpen" type="text" class="form-control has-dropdown" pl-search-product-input
                     placeholder="Search Product" autocomplete="off" ng-model="searchProduct"> </input>

              <!--<i class="icn-sm icn-caret-gray"></i>-->
            </div>
            <i class="icn-sm icn-remove-old" ng-click="clearInputField(); showDropdown()" ng-show="selectedProduct"></i>

            <input type="hidden" name="product" ng-model="productExpense.item.description"> </input>

            <div class="nano dropdown-menu custom-product-list" pl-conteiner
                 ng-include="'/html/scripts/common/templates/products-list.tpl.html'"></div>

          </div>
        </div>
      </div>

      <div ng-show="$ctrl.isCustomerTicketOptions" class="col-md-11">
        <div class="include-ticket-report">
          <p>What to include</p>
          <label class="control checkbox">
            <input type="checkbox" ng-model="customerTicketWithTimeSpent"> </input>
            <span class="control-indicator"></span>
            Show dashboard
          </label>
          <label class="control checkbox">
            <input type="checkbox" ng-model="customerTicketWithResponseTime"> </input>
            <span class="control-indicator"></span>
            Average response time
          </label>
          <label ng-show="false" class="control checkbox">
            <input type="checkbox" ng-model="customerTicketShowTotalTicketAmount" ng-click="hideTotalTickets()"> </input>
            <span class="control-indicator"></span>
            Total ticket amount
          </label>
          <label class="control checkbox">
            <input type="checkbox" ng-model="customerTicketWithServices"> </input>
            <span class="control-indicator"></span>
            Show services
          </label>
          <label class="control checkbox">
            <input type="checkbox" ng-model="customerTicketWithProducts"> </input>
            <span class="control-indicator"></span>
            Show products
          </label>
        </div>
      </div>
      <div ng-show="$ctrl.isHardwareSummaryOptions" class="col-md-11">
        <div class="include-ticket-report">
          <p>Include the following columns in the report</p>
          <label class="control checkbox">
            <input type="checkbox" ng-model="hardwareSummaryWithDevice">
            <span class="control-indicator"></span>
            Device
          </label>
          <label class="control checkbox">
            <input type="checkbox" ng-model="hardwareSummaryWithOperationSystem">
            <span class="control-indicator"></span>
            Operating System
          </label>
          <label class="control checkbox">
            <input type="checkbox" ng-model="hardwareSummaryWithCpu">
            <span class="control-indicator"></span>
            CPU
          </label>
          <label class="control checkbox">
            <input type="checkbox" ng-model="hardwareSummaryWithRam">
            <span class="control-indicator"></span>
            Ram
          </label>
          <label class="control checkbox">
            <input type="checkbox" ng-model="hardwareSummaryWithDisk">
            <span class="control-indicator"></span>
            Disk
          </label>
          <label class="control checkbox">
            <input type="checkbox" ng-model="hardwareSummaryWithWarrenty">
            <span class="control-indicator"></span>
            Warrenty
          </label>
          <label class="control checkbox">
            <input type="checkbox" ng-model="hardwareSummaryWithSerialNumber"/>
            <span class="control-indicator"></span>
            Serial Number
          </label>
        </div>
      </div>
      <div ng-show="$ctrl.commonCommissions" class="col-md-11">
        <div class="include-ticket-report">

          <!-- <label class="control checkbox">
            <input type="checkbox" ng-model="customerTicketWithProducts"> </input>
            <span class="control-indicator"></span>
            Show products cost
          </label> -->
        </div>
      </div>

      <div ng-show="$ctrl.detailedCommissions" class="col-md-11">
        <div class="include-ticket-report">

          <!-- <label class="control checkbox">
            <input type="checkbox" ng-model="customerTicketWithProducts"> </input>
            <span class="control-indicator"></span>
            Show products cost
          </label> -->

          <label class="control checkbox">
            <input type="radio" name="details" ng-checked="!detailsByProducts" ng-model="detailsByProducts" ng-value="false"> </input>
            <span class="control-indicator"></span>
            Details by customer
          </label>

          <label class="control checkbox">
            <input type="radio" name="details" ng-checked="detailsByProducts" ng-model="detailsByProducts" ng-value="true"> </input>
            <span class="control-indicator"></span>
            Details by product
          </label>
        </div>
      </div>
    </div>

  </div>

</div>

<!--MENU FOR TECH REPORTS-->
<div>
  <div class="chart-header-controls" ng-form="techReportForm" ng-show="$ctrl.isTechReport">

    <div class="chart-header clearfix">

      <div class="chart-header-controls clearfix">

        <p ng-click="$ctrl.setTechReportDateType('TODAY')" ng-class="{'choosen': techReportDateType === 'TODAY'}">
          Daily</p>
        <p ng-click="$ctrl.setTechReportDateType('WEEK')" ng-class="{'choosen': techReportDateType === 'WEEK'}">
          Week</p>
        <p ng-click="$ctrl.setTechReportDateType('MONTH')" ng-class="{'choosen': techReportDateType === 'MONTH'}">
          Month</p>
        <!-- <p ng-click="$ctrl.setTechReportDateType('CUSTOM')" ng-class="{'choosen': techReportDateType === 'CUSTOM'}">
          Custom</p> -->
        <!-- <div ng-show="techReportDateType==='CUSTOM'"> -->
        <div style="position: relative; display: inline-block">
          <input style="display: inline-block;width: 250px;margin-top: 10px;"
                 ng-click="$ctrl.setTechReportDateType('CUSTOM')"
                 type="text"
                 class="form-control has-dropdown readonly-normal"
                 name="reportDateRange"
                 readonly
                 options="datePickerOptions"
                 range
                 placeholder="Select date"
                 date-range-picker
                 max-date="{{ maxDateForDateRangeInputField }}"
                 ng-model="reportSetting.dateRange"> </input>

          <i class="report-calendar" ng-show="!startDate && !endDate"></i>
          <i class="icn-sm icn-remove-old pointer"
             ng-show="startDate && endDate"
             uib-tooltip="clear date filter"
             style="pointer-events: all;" tooltip-placement="top" ng-click="$ctrl.setTechReportDateType('TODAY')"></i>
        </div>

        <!-- </div> -->
      </div>
      <div class="form-group content" ng-hide="locationTechReport === '/reports/techReport-TicketCreated'">
        <div uib-dropdown>
          <input type="text"
                 name="techReportType"
                 ng-model="techReportType"
                 typeahead-on-select="$ctrl.sendTechDataRequest()"
                 autocomplete="off"
                 tabindex="3"
                 class="form-control form-control-dropdown dropdown-toggle"
                 uib-typeahead="type for type in techReportTypes"
                 qt-typeahead-async-show-on-focus
                 smart-dropdown-menu-position
                 readonly
                 custom-style="{width: '100%', 'max-height': '160px', 'overflow-y': 'auto'}"> </input>

        </div>
      </div>
    </div>
  </div>
  <div class="product-list-report-btn product-list-report-btn-ticket clearfix">


    <div class="product-report-btn" uib-dropdown keyboard-nav="true" uib-tooltip="export" tooltip-placement="top">

        <img src="images/new-icons/export-icon.png" alt="export">
      </div>
      <ul uib-dropdown-menu>
        <li class="open-pdf-btn " ng-click="$ctrl.downloadAsPdf()" disabled="disabled">PDF</li>

    </div>

      <div style="height: 100%;width: 100%;">
        <img src="images/new-icons/message-icon.png" alt="send mail to">
