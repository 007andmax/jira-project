<!--MENU FOR NON-TECH REPORTS-->
<div ng-show="!$ctrl.isTechReport">
  <div ng-form="reportSettingForm">
    <div class="run-report-content {{ $ctrl.className || '' }}">

      <div class="content form-group">
        <div>
          <p>Date Range</p>
          <div style="position: relative;">
            <input type="text"
                   class="form-control has-dropdown readonly-normal"
                   name="reportDateRange"
                   readonly
                   date-range-picker="$ctrl.onDateRangeChangeReport"
                   range max-date="{{ maxDateForDateRangeInputField }}"
                   ng-model="reportSetting.dateRange">
            <!--<i class="icn-sm icn-caret-gray"-->
            <!--ng-show="!(companiesSharedState.filter.dateRange && companiesSharedState.filter.dateRange.length)">-->
            <!--</i>-->
            <!--<i class="icn-sm icn-remove-old" style="cursor: pointer; pointer-events: auto;"-->
            <!--ng-show="companiesSharedState.filter.dateRange && companiesSharedState.filter.dateRange.length"-->
            <!--ng-click="clearDateRange()" uib-tooltip="clear" tooltip-placement="top"></i>-->
          </div>
        </div>
      </div>

      <div class="form-group content" ng-hide="$ctrl.isCustomerHidden">
        <label class="control-label"><p>Customer Name</p></label>
        <div ng-messages="reportSettingForm.reportCompany.$error">
          <div class="text-error" style="position: absolute;bottom: -15px;right: 0;" ng-message="required">Please select
            the company name
          </div>
        </div>
        <div uib-dropdown>
          <input type="text"
                 name="reportCompany"
                 ng-model="reportSetting.company"
                 ng-disabled="reportType === 'SUMMARY'"
                 ng-required="reportType === 'DETAILED'"
                 autocomplete="off"
                 tabindex="3"
                 class="form-control form-control-dropdown dropdown-toggle"
                 uib-typeahead="company as company.name for company in clientCompanies | filter:{'name': $viewValue}:stateComparator | orderBy:'name'"
                 qt-typeahead-show-on-focus
                 custom-style="{width: '100%', 'max-height': '160px', 'overflow-y': 'auto'}">
          <div class="input-top-4" typeahead-input-icon="userCompany"></div>
          <!--<div ng-message="reportSettingForm.reportCompany.$error"-->
          <!--ng-if="">-->
          <!--<div class="error-msg" ng-message="required">Customer Name is required</div>-->
          <!--</div>-->
        </div>
      </div>

      <div class="device-report form-group" ng-hide="$ctrl.isDeviceHidden">
        <label class="control-label"><p>Device</p></label>
        <input type="text"
               class="form-control has-dropdown-with-label"
               autocomplete="off"
               ng-model="reportSetting.device"
               name="reportAgent"
               ng-disabled="!reportSetting.company"
               uib-typeahead="agent as (agent.hostName || agent.ip) for agent in filteredAgentList | filter:filterAgents($viewValue) | orderBy:'hostName'"
               qt-typeahead-show-on-focus
               custom-style="{'max-height': '113px', 'overflow-y': 'auto', 'width': '356px'}">
        <div typeahead-input-icon-sm="reportAgent"></div>
        <div class="ng-scope" typeahead-input-icon="userCompany">
        <span class="x-mark" ng-click="clearInput($event)" ng-show="showClearIcon">
          <i class="icn-sm icn-remove-old" ng-click="clearInput($event)" tooltip="clear"
             tooltip-placement="top"></i>
        </span>
          <span class="x-mark ng-hide" ng-hide="showClearIcon">
          <i class="icn-sm icn-caret-gray"></i>
        </span>
        </div>
      </div>


      <button ng-click="$ctrl.sendReportRequest(reportSetting)"
              ng-disabled="reportSettingForm.$invalid && !$ctrl.isCustomerHidden">Run Report
      </button>
    </div>

    <div class="radio-buttons-product-report form-group">
      <div class="summary-radio summary-radio-device">
        <input type="radio" name="l1" class="radio" id="summary" ng-model="reportType" value="SUMMARY">
        <label for="summary">Summary</label>
      </div>
      <div class="detailed-radio summary-radio-device">
        <input type="radio" name="l1" class="radio" id="detailed" ng-model="reportType" value="DETAILED">
        <label for="detailed">Detailed</label>
      </div>
    </div>
  </div>
</div>
<!--MENU FOR TECH REPORTS-->
<div>
  <div class="chart-header-controls" ng-form="techReportForm" ng-show="$ctrl.isTechReport">

    <div class="chart-header clearfix">
      <!--<div class="chart-header-name">-->
      <!--<button>Billed Time</button>-->
      <!--<button ng-click="">Product Sales</button>-->
      <!--</div>-->
      <div class="radio-buttons-product-report form-group" ng-hide="locationTechReport === '/reports/techReport-TicketCreated'">
        <div class="summary-radio summary-radio-device">
          <input type="radio" name="l2" class="radio" id="billedTime" ng-model="techReportType" value="BILLED_TIME">
          <label for="billedTime">Billed Time</label>
        </div>
        <div class="detailed-radio summary-radio-device">
          <input type="radio" name="l2" class="radio" id="productSales" ng-model="techReportType" value="PRODUCT_SOLD">
          <label for="productSales">Product Sales</label>
        </div>
      </div>

      <div class="chart-header-controls">
        <p ng-click="$ctrl.setTechReportDateType('TODAY')" ng-class="{'choosen': techReportDateType === 'TODAY'}">Daily</p>
        <p ng-click="$ctrl.setTechReportDateType('WEEK')" ng-class="{'choosen': techReportDateType === 'WEEK'}">Week</p>
        <p ng-click="$ctrl.setTechReportDateType('MONTH')" ng-class="{'choosen': techReportDateType === 'MONTH'}">Month</p>
        <p ng-click="$ctrl.setTechReportDateType('CUSTOM')" ng-class="{'choosen': techReportDateType === 'CUSTOM'}">Custom</p>
        <div ng-show="techReportDateType==='CUSTOM'">
          <input type="text"
                    class="form-control has-dropdown readonly-normal"
                    name="reportDateRange"
                    readonly
                    date-range-picker="$ctrl.onDateRangeChangeReport"
                    range max-date="{{ maxDateForDateRangeInputField }}"
                    ng-model="reportSetting.dateRange">
        </div>
      </div>
      <button ng-click="$ctrl.sendReportRequest(techReportSetting)"
              ng-disabled="reportSettingForm.$invalid && !$ctrl.isCustomerHidden">Run Report
      </button>
    </div>
  </div>
  <div class="product-list-report-btn clearfix">
    <div class="product-report-btn" uib-dropdown keyboard-nav="true">
      <img src="images/new-icons/export-icon.png" alt="export" uib-dropdown-toggle>
      <ul uib-dropdown-menu>
        <li class="open-pdf-btn" ng-click="$ctrl.downloadAsPdf()" disabled="disabled">PDF</li>
        <li ng-click="$ctrl.exportFileToCsv()">CSV</li>
      </ul>
    </div>
    <div class="product-report-btn">
      <img src="images/new-icons/printer-icon.png" ng-click="$ctrl.openInPdf()" alt="print">
    </div>
    <div class="product-report-btn dropdown-email" uib-dropdown ng-form="sendMailForm">
    <img src="images/new-icons/message-icon.png" uib-dropdown-toggle alt="send mail to">
    <div uib-dropdown-menu>
      <div class="clearfix add-gadget" stop-propagation="click"
           ng-class="{'has-error': sendMailForm.$dirty && (!$ctrl.emailToNotify || !$ctrl.emailPattern.test($ctrl.emailToNotify))}">
        <input class="form-control" type="text" ng-model="$ctrl.emailToNotify">
        <div>
          <i class="icn-sm icn-label-save" ng-click="$ctrl.addEmailToNotify($ctrl.emailToNotify, sendMailForm)"></i>
          <i class="icn-sm icn-remove-old" ng-click="$ctrl.emailToNotify = ''"></i>
        </div>
      </div>
      <ul class="dropdown-menu">
        <li class="clearfix" ng-if="user.primaryEmail && !user.deletedAt"
            ng-repeat="user in (clientUsers.concat($ctrl.tempUsers)) | orderBy: 'firstName'">
          <label class="control checkbox pull-left ng-scope" stop-propagation="click">
            <input type="checkbox" ng-model="$ctrl.notifySelectionMap[user.primaryEmail]">
            <span class="control-indicator"></span>
            {{ user.primaryEmail }} ({{ $ctrl.getUserName(user) || '' }})
          </label>
        </li>
        <div style="padding: 10px 0;text-align: center;position: fixed;top: 643px;right: 153px;background-color: #fff;width: 455px;cursor: default;box-shadow: 0 9px 20px 0 rgba(10, 45, 89, 0.1);">
          <button ng-click="$ctrl.sendToMail($ctrl.getEmailsArray($ctrl.notifySelectionMap), $ctrl.emailSent)"
                  type="button">
            Send
          </button>
        </div>
      </ul>
    </div>
  </div>
  </div>
</div>
