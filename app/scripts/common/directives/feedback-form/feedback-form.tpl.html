<div class="feed-back-form" ng-form="feedbackForm" ng-if="formShown">
  <div class="row">
    <div class="col-sm-12 feed-head">
      <h1>Leave feedback</h1>
      <p class="description">We`d love to make Quicktech better for you!</p>
    </div>
    <div class="col-sm-6">
      <p>Type</p>
      <div uib-dropdown>
        <input type="text" class="form-control has-dropdown readonly-normal" uib-dropdown-toggle
               readonly>
        <i class="icn-sm icn-caret-gray"></i>

        <ul class="dropdown-menu" role="menu">

          <li ng-repeat="(type, label) in types" ng-click="feedbackDto.type = type">
            <a tabindex="-1" href="javascript:void(0)">{{ label }}</a>
          </li>

        </ul>

        <div class="default-value">
          {{ types[feedbackDto.type] }}
        </div>
      </div>
    </div>
    <div class="col-sm-6">
      <p>Priority</p>
      <div uib-dropdown>
        <input type="text" class="form-control has-dropdown readonly-normal" uib-dropdown-toggle
               readonly>
        <i class="icn-sm icn-caret-gray"></i>

        <ul class="dropdown-menu dropdown-priority" role="menu">

          <li ng-repeat="(priority, label) in priorities" ng-click="feedbackDto.priority = priority">
            <a tabindex="-1" href="javascript:void(0)">
              <span class="priority-dot {{ label.toLowerCase() }}"></span>{{ label }}
            </a>
          </li>

        </ul>

        <div class="default-value">
          <span class="priority-dot {{ priorities[feedbackDto.priority].toLowerCase() }}"></span>
          {{ priorities[feedbackDto.priority] }}
        </div>
      </div>

    </div>
    <div class="col-sm-12">
      <p>Subject</p>
      <input type="text" class="form-control" ng-model="feedbackDto.subject">
    </div>
    <div class="col-sm-12">
      <p>Message</p>
      <textarea name="" id="" cols="30" rows="4" class="form-control" ng-model="feedbackDto.message"></textarea>
    </div>
    <div class="col-sm-12">
      <p>Problematic page</p>
      <input type="text" class="form-control" ng-model="feedbackDto.page">
    </div>
    <div class="col-sm-6">
      <p>OS</p>
      <input type="text" class="form-control" ng-model="feedbackDto.os">
    </div>
    <div class="col-sm-6">
      <p>Browser</p>
      <input type="text" class="form-control" ng-model="feedbackDto.browserName">
    </div>
    <div class="col-sm-2">

    </div>
    <div class="col-sm-2">
      </div>
      <div class="col-sm-2">
      </div>
    <div class="col-sm-2">
      <button class="btn btn-default">
        <i class="icn-sm icn-attachment"></i>
      </button>
    </div>
    <div class="col-sm-4">
      <button class="btn btn-success" ng-click="submit(feedbackForm)">SUBMIT</button>
    </div>
  </div>
  <div class="thanks-backdrop" ng-if="submitSuccsesfull">
    <div class="thanks">
      <h1>Thank you for feedback!</h1>
      <p>Keep exploring</p>
    </div>
  </div>
</div>
