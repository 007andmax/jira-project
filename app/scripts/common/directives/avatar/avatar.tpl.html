<div class="create-user-avatar clearfix" crop-image="model" is-tech-logo="{{ modelName === 'techCompany' }}"
     model-image-path="{{ imagePath }}">
  <div class="avatar pull-left">
    <img ng-src="{{ getUrl() }}" ng-class="{'no-avatar': model[imagePath] && model[imagePath].cropped}"
         ng-style="{'max-height': model[imagePath] && model[imagePath].cropped ? '100%' : 'none'}">

    <div class="reposition" ng-show="model[imagePath] && model[imagePath].origin" reposition-button>
      Reposition...
    </div>
  </div>
  <div class="choose-file pull-left">
    <div class="select-file clearfix">
      <div class="btn btn-lg btn-primary pull-left" crop-image-button>
        {{ model[imagePath] && model[imagePath].origin ? 'Change': 'Choose' }} image
      </div>
      <span class="file-name pull-left" ng-show="model[imagePath] && model[imagePath].origin">or
        <a href="javascript:void(0)" restore-default-button>Restore Default</a>
      </span>
    </div>
  </div>
</div>
