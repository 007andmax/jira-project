<div class="avatar-content default clearfix">
  <div class="avatar">
    <img ng-src="{{ getUrl() }}" class="no-avatar" ng-if="!model.cropped.id">
    <img ng-src="/file/{{ model.cropped.id }}" class="no-avatar" ng-if="model.cropped.id">

    <div class="reposition-wrapper" ng-show="model.origin || getError().loadingInProcess">
      <div class="reposition" ng-show="model.origin && !getError().loadingInProcess" change-position-button>
        REPOSITION...
      </div>
      <div class="loader" ng-show="getError().loadingInProcess"></div>
    </div>
  </div>
  <div class="choose-file">
    <div class="select-file">
      <button type="button" class="btn btn-gray pull-left" change-avatar-button
              ng-disabled="getError().loadingInProcess">
       {{ model.origin ? 'Change': 'Choose' }} {{ isLogo ? 'Logo' : 'Avatar' }}
      </button>
      <span class="file-name pull-left" ng-show="!model.origin">No File Selected</span>
    </div>
    <div class="file-type pull-left ">maximum size of 2 MB. jpg, GIF, PNG.</div>

    <div error-message></div>
  </div>
</div>
