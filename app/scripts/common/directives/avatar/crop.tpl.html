<div crop ng-model="avatar" crop-info="cropInfo.type" is-reposition="isReposition">
  <div class="modal-header clearfix">

    <a href="javascript:void(0)" class="hit-area pull-right"
       data-dismiss="modal" aria-label="Close" ng-click="close()">
      <i class="icn-sm icn-remove-token"></i>
    </a>

    <h4 class="modal-title pull-left"><strong>Select crop size</strong><i class="dot-sep"></i>
      <span>Drag the photo around or use zoom slider</span>
    </h4>

  </div>

  <div class="modal-body">
    <div class="avatar-crop-area">
      <div crop-box style="width:578px; height:420px; display: none"></div>
      <div class="avatorCropProgressBar hide">
        <div class="avatorCropProgressDone"></div>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <div class="clearfix">

      <div class="zoom-slider pull-left">

        <a href="javascript:void(0)" class="hit-area pull-left" icn-zoom-minus>
          <i class="icn-sm icn-zoom-minus"></i>
        </a>

        <div class="range-wrapper pull-left">
          <input type="range" range-zoom max="130" min="0" disabled="true">
        </div>

        <a href="javascript:void(0)" class="hit-area pull-right" icn-zoom-plus>
          <i class="icn-sm icn-zoom-plus"></i>
        </a>

      </div>

      <div class="form-group pull-right">

        <div class="avatar-preview pull-left">
          <img ng-src="/file/{{ avatar.origin.id }}" alt="...">
        </div>

        <div class="btn btn-lg btn-info pull-left disabled"
             ng-click="save()" continue-button>
          {{ cropInfo && cropInfo.type === 'logo-company-card' ? 'Save' : 'Continue' }}
        </div>

      </div>

    </div>
  </div>
</div>
