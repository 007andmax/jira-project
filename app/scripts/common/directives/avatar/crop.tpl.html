<div class="modal-customize-avatr fade in show" crop ng-model="avatar" is-reposition="isReposition">
  <div class="modal-dialog ">
    <div class="modal-content">
      <div class="modal-header clearfix">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" ng-click="close()">
          <span aria-hidden="true" class="icn-close-modal"></span>
        </button>
        <h4 class="modal-title pull-left">Select crop size<span class="dot-sep"></span></h4>
        <span class="ticket-numer pull-left">Drag the photo around or use zoom slider</span>
      </div>

      <div class="modal-body" style="width:578px; height: 480px">
        <div class="crop-area avatorCropAreaNew">
          <div crop-box style="width:578px; height:480px;"></div>
          <div class="avatorCropProgressBar hide">
            <div class="avatorCropProgressDone"></div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <div id="cropBoxControls" class="row-wrapper clearfix">
          <div class="zoom-slider pull-left">
            <a href="" class="pull-left icn icn-zoom-minus" icn-zoom-minus></a>

            <div class="range-wrapper pull-left">
              <input range-zoom type="range" max="130" min="0">
            </div>
            <a href="" class="pull-right icn icn-zoom-plus" icn-zoom-plus></a>
          </div>

          <div class="form-group actions-wrapper pull-right">
            <button type="button" class="btn btn-scooter" ng-click="save()">Continue</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
