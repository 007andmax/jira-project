<div ng-form="phoneNumbersForm" class="phone-number-form">
  <div class="row clearfix" ng-repeat="phoneNumber in phoneNumbers">

    <div ng-if="$index !== phoneNumbers.length - 1">
      <div class="form-group custom-phone-number col-xs-6" ng-class="{'has-error': phoneNumber.error}">

        <label class="control-label" ng-if="!phoneNumber.error">
          {{ $first ? 'Primary Phone Number' : 'Phone Number' }}
        </label>

        <div ng-if="phoneNumber.error">
          <label class="control-label">{{ phoneNumber.error }}</label>
        </div>

        <input type="text" class="form-control" name="phoneNumber{{ $index }}" ng-model="phoneNumber.number"
               ng-pattern="phoneNumberPattern" hard-phone-number-pattern country="{{ countryCode }}"
               execute-when-outfocused="onLostFocus()" tabindex="20" ng-disabled="$eval(disabled)"
               ng-change="phoneNumber.error = getPhoneNumberError(phoneNumber.number, phoneNumbersForm, $index)">
      </div>

      <div class="form-group custom-phone-type col-xs-6 no-label">
        <div class="pull-left" uib-dropdown keyboard-nav="true">

          <button class="form-control form-control-number has-dropdown" tabindex="21"
                  uib-dropdown-toggle ng-disabled="$eval(disabled)">
            {{ phoneNumberTypes[phoneNumber.typeNumber] }}
          </button>

          <ul class="dropdown-account-type" uib-dropdown-menu style="width: 100%; z-index: 9999;">
            <li ng-repeat="(type, label) in phoneNumberTypes"
                ng-click="phoneNumber.typeNumber = type; onLostFocus && onLostFocus(phoneNumbersForm)">
              <a tabindex="-1" href="javascript:void(0)">{{ label }}</a>
            </li>
          </ul>
          <i class="icn-sm report-caret-icon"></i>

        </div>

        <button class="company-remove-icn company-remove-icn-sm" ng-click="removePhoneNumber($index)"
                tooltip-placement="top" uib-tooltip="Remove" tabindex="22" ng-disabled="$eval(disabled)">
        </button>

      </div>
    </div>

    <div ng-if="$index === phoneNumbers.length - 1">
      <div class="form-group custom-phone-number col-xs-6" ng-class="{'has-error': phoneNumber.error}">

        <label class="control-label" ng-if="!phoneNumber.error">
          {{ $first ? 'Primary Phone Number' : 'Phone Number' }}
        </label>

        <div ng-if="phoneNumber.error">
          <label class="control-label">
            {{ phoneNumber.error }}
          </label>
        </div>

        <input type="text" class="form-control" name="phoneNumber{{ $index }}" ng-model="phoneNumber.number"
               ng-pattern="phoneNumberPattern" execute-when-outfocused="onLostFocus()" ng-disabled="$eval(disabled)"
               hard-phone-number-pattern country="{{ countryCode }}" tabindex="{{ 20 + $index * 3 }}"
               ng-change="phoneNumber.error = getPhoneNumberError(phoneNumber.number, phoneNumbersForm, $index)">
      </div>

      <div class="form-group col-xs-6 custom-phone-type no-label">
        <div class="pull-left " uib-dropdown keyboard-nav="true">

          <button class="form-control form-control-number has-dropdown" tabindex="{{ 21 + $index * 3 }}"
                  uib-dropdown-toggle ng-disabled="$eval(disabled)">
            {{ phoneNumberTypes[phoneNumber.typeNumber] }}
          </button>

          <ul class="dropdown-account-type" uib-dropdown-menu style="width: 100%;z-index: 9999;">
            <li ng-repeat="(type, label) in phoneNumberTypes"
                ng-click="phoneNumber.typeNumber = type; onLostFocus && onLostFocus(phoneNumbersForm)">
              <a tabindex="-1" href="javascript:void(0)">{{ label }}</a>
            </li>
          </ul>
          <i class="icn-sm report-caret-icon"></i>

        </div>

        <div custom-ng-show-if="phoneNumbers.length < maximalAmountOfPhones">

          <button cns-if class="company-remove-icn-sm company-remove-icn" ng-disabled="$eval(disabled)"
                  tooltip-placement="top" uib-tooltip="Add more" ng-click="addPhoneNumber()"
                  tabindex="{{ 22 + $index * 3 }}">
            <i style="margin-top: 12px;" class="icn-sm icn-plus"></i>
          </button>

          <button cns-else class="company-remove-icn-sm company-remove-icn"
                  tabindex="{{ 23 + $index * 3 }}"
                  tooltip-placement="top" title="" uib-tooltip="Remove"
                  ng-click="removePhoneNumber($index)" ng-disabled="$eval(disabled)">
            <i style="margin-top: 12px;" class="icn-sm icn-remove-token-light"></i>
          </button>

        </div>

      </div>

      <!-- <a href="javascript:void(0)" class="btn btn-cr btn-green btn-add-more pull-left tp-hide"
         uib-tooltip="Add More" tooltip-placement="top" ng-click="addPhoneNumber()"
         ng-disabled="phoneNumbers.length >= maximalAmountOfPhones">
        <span class="icn-add"></span>
      </a> -->

    </div>
  </div>
</div>
