<div ng-form="phoneNumbersForm" class="phone-number-form">
  <div class="form-row clearfix" ng-repeat="phoneNumber in phoneNumbers">

    <div ng-if="$index !== phoneNumbers.length - 1">
      <div class="form-group"
           ng-class="{'has-error': !phoneNumbersForm['phoneNumber' + $index].$valid}">

        <label class="control-label"
               ng-class="{'hide': !phoneNumbersForm['phoneNumber' + $index].$valid}">
          contact no.
        </label>

        <div ng-messages="phoneNumbersForm['phoneNumber' + $index].$error" style="min-height: 20px;"
             ng-class="{'hide': phoneNumbersForm['phoneNumber' + $index].$valid}">
          <label class="control-label" ng-message="required">CONTACT NO. IS REQUIRED.</label>
          <label class="control-label" ng-message="maxlength">CONTACT NO. IS TOO LARGE</label>
          <label class="control-label" ng-message="minlength">CONTACT NO. IS TOO SHORT</label>
          <label class="control-label" ng-message="pattern">INVALID NO.</label>
        </div>

        <input type="text" class="form-control" name="phoneNumber{{ $index }}" ng-model="phoneNumber.number"
               aria-expanded="true" hard-reset-required="true" ng-minlength="3" ng-maxlength="20"
               ng-pattern="phoneNumberPattern" hard-reset-pattern="phoneNumberPattern" make-dirty-on-blur>
      </div>

      <div class="form-group no-label">
        <div class="pull-left dropdown">

          <input type="text" class="form-control-number has-dropdown"
                 ng-model="phoneNumberTypes[phoneNumber.typeNumber]" data-toggle="dropdown"
                 aria-expanded="true" READONLY>

          <ul class="dropdown-menu dropdown-account-type">
            <li ng-repeat="(type, label) in phoneNumberTypes" ng-click="phoneNumber.typeNumber = type">
              <a tabindex="-1" href="javascript:void(0)">{{ label }}</a>
            </li>
          </ul>
          <i class="icn-sm icn-caret-gray"></i>

        </div>

        <div class="btn btn-primary has-tooltip pull-right" ng-click="removePhoneNumber($index)"
             tooltip-placement="top" tooltip="Remove">
          <i class="icn-sm icn-remove-token"></i>
        </div>

      </div>
    </div>

    <div ng-if="$index === phoneNumbers.length - 1">
      <div class="form-group" ng-class="{'has-error': !phoneNumbersForm['phoneNumber' + $index].$valid}">

        <label class="control-label"
               ng-class="{'hide': !phoneNumbersForm['phoneNumber' + $index].$valid}">
          contact no.
        </label>

        <div ng-messages="phoneNumbersForm['phoneNumber' + $index].$error" style="min-height: 20px;"
             ng-class="{'hide': phoneNumbersForm['phoneNumber' + $index].$valid}">
          <label class="control-label" ng-message="maxlength">CONTACT NO. IS TOO LARGE</label>
          <label class="control-label" ng-message="minlength">CONTACT NO. IS TOO SHORT</label>
          <label class="control-label" ng-message="pattern">INVALID NO.</label>
        </div>

        <input type="text" class="form-control" name="phoneNumber{{ $index }}" ng-model="phoneNumber.number"
               aria-expanded="true" ng-minlength="3" ng-maxlength="20" ng-pattern="phoneNumberPattern"
               make-dirty-on-blur hard-reset-pattern="phoneNumberPattern">
      </div>

      <div class="form-group no-label">
        <div class="pull-left dropdown">

          <input type="text" class="form-control-number has-dropdown"
                 ng-model="phoneNumberTypes[phoneNumber.typeNumber]" data-toggle="dropdown"
                 aria-expanded="true" READONLY>

          <ul class="dropdown-menu dropdown-account-type">
            <li ng-repeat="(type, label) in phoneNumberTypes" ng-click="phoneNumber.typeNumber = type">
              <a tabindex="-1" href="javascript:void(0)">{{ label }}</a>
            </li>
          </ul>
          <i class="icn-sm icn-caret-gray"></i>

        </div>

        <div custom-ng-show-if="phoneNumbers.length < maximalAmountOfPhones">

          <div cns-if class="btn btn-dark has-tooltip pull-right"
               tooltip-placement="top" tooltip="Add more" ng-click="addPhoneNumber()">
            <i class="icn-sm icn-plus"></i>
          </div>

          <div cns-else class="btn btn-primary has-tooltip pull-right"
               tooltip-placement="top" title="" tooltip="Remove" ng-click="removePhoneNumber($index)">
            <i class="icn-sm icn-remove-token"></i>
          </div>

        </div>

      </div>

      <!-- <a href="javascript:void(0)" class="btn btn-cr btn-green btn-add-more pull-left tp-hide"
         tooltip="Add More" tooltip-placement="top" ng-click="addPhoneNumber()"
         ng-disabled="phoneNumbers.length >= maximalAmountOfPhones">
        <span class="icn-add"></span>
      </a> -->

    </div>
  </div>
</div>
