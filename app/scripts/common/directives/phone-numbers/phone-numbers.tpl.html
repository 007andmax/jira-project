<div ng-form="phoneNumbersForm" class="phone-number-form">
  <div class="row clearfix" ng-repeat="phoneNumber in phoneNumbers">

    <div ng-if="$index !== phoneNumbers.length - 1">
      <div class="form-group custom-phone-number col-xs-6"
           ng-class="{'has-error': !phoneNumbersForm['phoneNumber' + $index].$valid}">

        <label class="control-label"
               ng-class="{'hide': !phoneNumbersForm['phoneNumber' + $index].$valid}">
          {{ $first ? 'Primary Phone Number' : 'Phone Number' }}
        </label>

        <div  ng-class="{'hide': phoneNumbersForm['phoneNumber' + $index].$valid}">

          <label style="font-size: 12px;" class="control-label"
                 ng-class="{'hide': !phoneNumbersForm['phoneNumber' + $index].$error['required']}">
            Phone Number IS REQUIRED.
          </label>

          <label class="control-label" style="font-size: 12px;"
                 ng-class="{'hide': !phoneNumbersForm['phoneNumber' + $index].$error['maxlength']}">
            Phone Number IS TOO LARGE.
          </label>

          <label class="control-label" style="font-size: 12px;" ng-show="!phoneNumbersForm['phoneNumber' + $index].$error['required'] &&
                                                phoneNumber.number.length < 5 && !isPrefixValid(phoneNumber.number)">
            Phone Number IS TOO SHORT.
          </label>

          <label class="control-label" style="font-size: 12px;"
                 ng-class="{'hide': phoneNumber.number.length >= 5 ||
                                    phoneNumbersForm['phoneNumber' + $index].$error['maxlength'] ||
                                    !phoneNumbersForm['phoneNumber' + $index].$error['pattern'] ||
                                    isPrefixValid(phoneNumber.number)}">
            INVALID Phone Number.
          </label>

        </div>

        <input type="text" class="form-control" name="phoneNumber{{ $index }}" ng-model="phoneNumber.number"
               aria-expanded="true" hard-reset-required="true" ng-maxlength="20"
               ng-pattern="phoneNumberPattern" hard-phone-number-pattern country="{{countryCode}}"
               make-dirty-on-blur execute-when-outfocused="onLostFocus()">
      </div>

      <div class="form-group custom-phone-type col-xs-6 no-label">
        <div class="pull-left" uib-dropdown dropdown-append-to-body="true">

          <input type="text" class="form-control-number has-dropdown"
                 ng-model="phoneNumberTypes[phoneNumber.typeNumber]" uib-dropdown-toggle
                 aria-expanded="true" READONLY>

          <ul class="dropdown-account-type" uib-dropdown-menu style="width: 250px; z-index: 9999;">
            <li ng-repeat="(type, label) in phoneNumberTypes"
                ng-click="phoneNumber.typeNumber = type; onLostFocus && onLostFocus(phoneNumbersForm)">
              <a tabindex="-1" href="javascript:void(0)">{{ label }}</a>
            </li>
          </ul>
          <i class="icn-sm icn-caret-gray"></i>

        </div>

        <div class="btn btn-primary has-tooltip pull-right" ng-click="removePhoneNumber($index)"
             tooltip-placement="top" uib-tooltip="Remove">
          <i class="icn-sm icn-remove-token-light"></i>
        </div>

      </div>
    </div>

    <div ng-if="$index === phoneNumbers.length - 1">
      <div class="form-group custom-phone-number col-xs-6"
           ng-class="{'has-error': error}">

        <label class="control-label" ng-if="!error">
          {{ $first ? 'Primary Phone Number' : 'Phone Number' }}
        </label>

        <div ng-if="error">
          <label class="control-label">
            {{ error }}
          </label>
        </div>

        <input type="text" class="form-control" name="phoneNumber{{ $index }}" ng-model="phoneNumber.number"
               ng-pattern="phoneNumberPattern" execute-when-outfocused="onLostFocus()"
               hard-phone-number-pattern country="{{countryCode}}"
               ng-change="error = getPhoneNumberError(phoneNumber.number, phoneNumbersForm, $index)">
      </div>

      <div class="form-group col-xs-6 custom-phone-type no-label">
        <div class="pull-left " uib-dropdown dropdown-append-to-body="true">

          <input type="text" class="form-control-number has-dropdown"
                 ng-model="phoneNumberTypes[phoneNumber.typeNumber]" uib-dropdown-toggle
                 aria-expanded="true" READONLY>

          <ul class="dropdown-account-type" uib-dropdown-menu style="width: 250px;z-index: 9999;">
            <li ng-repeat="(type, label) in phoneNumberTypes"
                ng-click="phoneNumber.typeNumber = type; onLostFocus && onLostFocus(phoneNumbersForm)">
              <a tabindex="-1" href="javascript:void(0)">{{ label }}</a>
            </li>
          </ul>
          <i class="icn-sm icn-caret-gray"></i>

        </div>

        <div custom-ng-show-if="phoneNumbers.length < maximalAmountOfPhones">

          <div cns-if class="btn btn-primary has-tooltip pull-right"
               tooltip-placement="top" uib-tooltip="Add more" ng-click="addPhoneNumber()">
            <i class="icn-sm icn-plus"></i>
          </div>

          <div cns-else class="btn btn-primary has-tooltip pull-right"
               tooltip-placement="top" title="" uib-tooltip="Remove" ng-click="removePhoneNumber($index)">
            <i class="icn-sm icn-remove-token-light"></i>
          </div>

        </div>

      </div>

      <!-- <a href="javascript:void(0)" class="btn btn-cr btn-green btn-add-more pull-left tp-hide"
         uib-tooltip="Add More" tooltip-placement="top" ng-click="addPhoneNumber()"
         ng-disabled="phoneNumbers.length >= maximalAmountOfPhones">
        <span class="icn-add"></span>
      </a> -->

    </div>
  </div>
</div>
