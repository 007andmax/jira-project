<div class="select-taxes-drv" style="display: inline-block;" uib-dropdown dropdown-appent-to-body="true" on-toggle="$ctrl.onDropdownToggle(open)">
  <input type="text" class="form-control ellipsis" ng-value="$ctrl.getSelectedTaxNames()" placeholder="Choose Tax" readonly uib-dropdown-toggle>

  <div class="dropdown-menu dropdown-menu-left checkbox-dropdown" uib-dropdown-menu stop-propagation="click">
    <div class="list-container">
      <div class="custom-scroll" style="max-height: 164px;margin-bottom: 10px;">
        <div class="checkbox-dd-item"
             ng-repeat="tax in $ctrl.taxes | orderBy: 'name' track by tax.id">
          <label class="control checkbox ellipsis">
            <input type="checkbox" ng-model="$ctrl.selectedTaxes[tax.id]"
                   ng-change="$ctrl.updateEntityTaxList(tax)">
            {{ tax.name }}&nbsp;{{ tax.rate }}%
            <i class="icn-sm icn-label-save" ng-show="$ctrl.selectedTaxes[tax.id]"></i>
          </label>
        </div>
      </div>
    </div>

  </div>
</div>
