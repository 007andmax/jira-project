<div class="center-horizontally">
  <div class="center-vertically">
    <div>
      <h3>WELCOME to QUICKTECH</h3>
      <span>BETA</span>
    </div>
    <div ui-sref="settings.companyProfile" ng-click="closeWizard()">
      <img src="images/input-icons/wizard-step-1.png" alt="Set up settings">
      <div>Set up your company settings</div>
    </div>
    <div ui-sref="createCompany" ng-click="closeWizard()">
      <img src="images/input-icons/wizard-step-2.png" alt="Create company">
      <div>Create your first client company</div>
    </div>
    <div create-ticket-open-modal ng-click="closeWizard()">
      <img src="images/input-icons/wizard-step-3.png" alt="Create ticket">
      <div>Add your first ticket</div>
    </div>
    <div>
      <label class="control checkbox">
        <input type="checkbox" ng-model="dontShowThisAgain">
        <span class="control-indicator"></span>
        Don't show this again
      </label>
      <div class="btn btn-success" ng-click="closeWizard()">Start Exploring</div>
    </div>
  </div>
</div>
