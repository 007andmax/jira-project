<div class="welcome-wrapper container-fluid">
  <div class="welcome-wrapper__header">
    <h1 class="welcome-wrapper__header--description">Welcome to <span>QUICK</span>TECH</h1>
  </div>
  <div class="row">
    <div class="col-sm-4 col-xs-12"
         ui-sref="settings.companyProfile" ng-click="closeWizard()">
      <img src="images/input-icons/wizard-step-1.png" alt="Set up settings">
    </div>
    <div class="col-sm-4 col-xs-12">
      <p class="descr descr--first">Create your first client company</p>
    </div>
    <div class="col-sm-4 col-xs-12"
         create-ticket-open-modal ng-click="closeWizard()">
      <img src="images/input-icons/wizard-step-3.png" alt="Create ticket">
    </div>
  </div>
  <div class="circles circles--first"></div>
  <div class="row">
    <div class="col-sm-4 col-xs-12">
      <p class="descr descr--second">Set up your company settings</p>
    </div>
    <div class="col-sm-4 col-xs-12"
         ui-sref="createCompany" ng-click="closeWizard()">
      <img src="images/input-icons/wizard-step-2.png" alt="Create company">
    </div>
    <div class="col-sm-4 col-xs-12">
      <p class="descr descr--third">Add your <br> first ticket</p>
    </div>
  </div>
  <div class="circles circles--second"></div>
  <div class="welcome-wrapper__footer">
    <label class="control checkbox">
      <input type="checkbox" ng-model="dontShowThisAgain">
      <span class="control-indicator"></span>
      Don't show this again
    </label>
    <button class="btn btn-success" ng-click="closeWizard()">Start exploring</button>
  </div>
</div>
