<div>
  <div ng-click="isShowInputField = !isShowInputField" ng-show="!isShowInputField">
    <i class="icon-sm sale-icon-for-isDicount"></i>
  </div>

  <div ng-show="isShowInputField">
    <input type="text"
           class="form-control"
           placeholder="Discount Amount"
           name="discountAmount"
           ng-model="product.discountAmount"
           ng-max=100"
           ng-min="0"
           qt-to-fixed="2"
           hard-reset-pattern="{{service.discountType}}"
           ng-keydown="$event.which === 13 && $event.preventDefault()">
  </div>
</div>
