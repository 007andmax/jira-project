<div class="{{readonlyTags ? 'readonly-tags-wrap' : 'tags-wrap'}}" ng-click="setFocus($event)">
  <div class="{{readonlyTags ? 'readonly-tags' : 'tags'}}">
    <span class="tags-title" ng-hide="readonlyTags">Tags: </span>
    <span class="tag-label"
          ng-style="{'background-color': tagColors[tag.colorCode].backgroundColor,
                    'border-color': tagColors[tag.colorCode].borderColor}"
          ng-repeat="tag in ticketTags track by $index">
      <span>{{ tag.word }}</span>
      <i ng-show="!readonlyTags" class="icn-xs remove-tag" ng-click="removeTag($index)"
         tooltip="remove" tooltip-placement="top"></i>
    </span>

    <div ng-show="!readonlyTags" class="tags-action"
         dropdown is-open="dropdownOpened && result.length" on-toggle="setDropdownOpened(open)"
         dropdown-arrow-navigation on-enter="addTag" dropdown-data-item-name="tag">
      <input type="text" class="tags-input" ng-model="newTag" placeholder="..." set-focus-on-var-change="focusInput">

      <ul class="tag-autocomplete dropdown-menu" dropdown-menu>
        <li class="autocomplete-item" ng-repeat="tag in result | orderBy:'word'"
            ng-click="addTag(tag)">
          <span class="tag-name">{{tag.word}}</span>
          <span class="pull-right">{{tag.usedCounter}}</span>
        </li>
      </ul>
    </div>
  </div>

  <div class="loading-wrap" ng-if="saving && !readonlyTags">
    <div class="sk-fading-circle">
      <div class="sk-circle1 sk-circle"></div>
      <div class="sk-circle2 sk-circle"></div>
      <div class="sk-circle3 sk-circle"></div>
      <div class="sk-circle4 sk-circle"></div>
      <div class="sk-circle5 sk-circle"></div>
      <div class="sk-circle6 sk-circle"></div>
      <div class="sk-circle7 sk-circle"></div>
      <div class="sk-circle8 sk-circle"></div>
      <div class="sk-circle9 sk-circle"></div>
      <div class="sk-circle10 sk-circle"></div>
      <div class="sk-circle11 sk-circle"></div>
      <div class="sk-circle12 sk-circle"></div>
    </div>
  </div>
</div>
