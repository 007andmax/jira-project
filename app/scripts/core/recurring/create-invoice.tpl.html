<div class="qt-create-invoice clearfix" ng-controller="quicktech.core.recurring.createInvoiceCtrl">
  <form name="createInvoiceForm">
    <ul class="qt-list qt-invoices">
      <li>

        <div class="col-1">{{ actualInvoiceNumber }}</div>

        <div class="col-2" ng-class="{'has-error': isShowingErrors(createInvoiceForm, 'createInvoiceDate')}">

          <div class="dropdown" style="max-width:140px;">
            <input type="text" class="form-control has-dropdown"
                   name="createInvoiceDate" ng-model="createInvoice.sentOn"
                   choose-data-dropdown min-date="{{ minSentOnDate }}">
            <i class="icn-sm icn-caret-gray"></i>
          </div>
        </div>

        <div class="col-3">
          <div class="dropdown" style="max-width:140px;">
            <input type="text" class="form-control has-dropdown readonly-normal" readonly="readonly"
                   name="createInvoiceFrequency"
                   data-toggle="dropdown" aria-expanded="false">
            <i class="icn-sm icn-caret-gray"></i>

            <ul class="dropdown-menu dropdown-priority" role="menu">

              <li ng-repeat="(value, label) in frequency" ng-click="createInvoice.frequency = value">
                <a tabindex="-1" href="javascript:void(0)">
                  <span class="priority-dot" ng-class="{'weekly': value === 'WEEKLY',
                                                    'yearly': value === 'YEARLY',
                                                    'monthly': value === 'MONTHLY'}"></span>
                  {{ label }}
                </a>
              </li>

            </ul>

            <div class="default-value">
              <span class="priority-dot" ng-class="{'weekly': createInvoice.frequency === 'WEEKLY',
                                                    'yearly': createInvoice.frequency === 'YEARLY',
                                                    'monthly': createInvoice.frequency === 'MONTHLY'}"></span>
              {{ frequency[createInvoice.frequency] }}
            </div>

          </div>
        </div>
        <div class="col-4">$00</div>
      </li>

      <li class="qt-form-actions">

        <div class="btn btn-lg btn-info pull-right"
             ng-click="createRecurringInvoice(createInvoiceForm)"
             custom-disabled="{{ disabledCreateButton }}">
          Create
        </div>

        <div class="btn btn-lg btn-primary pull-right"
             ng-click="cancelCreateRecurringInvoice()">Cancel
        </div>

      </li>

    </ul>
  </form>
</div>
