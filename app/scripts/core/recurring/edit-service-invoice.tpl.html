<div class="qt-add-service clearfix" ng-controller="quicktech.core.recurring.editServiceCtrl">
  <form name="editServiceInvoiceForm">
    <ul class="qt-list qt-invoices">
      <li class="add-service-item">

        <i class="icn icn-sm icn-update-service pull-left"></i>

        <div class="col-1">
          <div class="dropdown" ng-class="{'has-error': isShowingErrors(editServiceInvoiceForm, 'editServiceName')}">

            <input type="text" class="form-control has-dropdown" placeholder="Service"
                   data-toggle="dropdown" aria-expanded="true"
                   ng-model="editService.item" name="editServiceName" ng-required="true"
                   typeahead="companyService as companyService.name for companyService in companyServices | filter:$viewValue:stateComparator | orderBy:'name'"
                   typeahead-min-length="0" typeahead-editable="false"
                   qt-typeahead-show-on-focus ng-trim="false">
            <i class="icn-sm icn-caret-gray"></i>

          </div>
        </div>

        <div class="col-2" ng-class="{'has-error': isShowingErrors(editServiceInvoiceForm, 'editServiceQuantity')}">

          <input type="text" class="form-control" placeholder="Hr(s) : Min(s)"
                 ng-model="editService.quantity" hard-reset-required="true" name="editServiceQuantity"
                 hard-reset-pattern="numberPattern">
        </div>

        <div class="col-3" ng-class="{'has-error': isShowingErrors(editServiceInvoiceForm, 'editServiceDescription')}">

          <input type="text" class="form-control" placeholder="Description" ng-maxlength="1000"
                 ng-model="editService.description" name="editServiceDescription" ng-required="true">
        </div>

        <div class="col-4" ng-class="{'has-error': isShowingErrors(editServiceInvoiceForm, 'amount')}">

          <input type="text" class="form-control" placeholder="Amount"
                 ng-model="editService.sum" hard-reset-required="true" name="amount"
                 hard-reset-pattern="decimalNumberPattern">
        </div>

      </li>

      <li class="qt-form-actions">

        <div class="pull-left text-error">{{ getValidationMessage(editServiceInvoiceForm) }}</div>

        <div class="btn btn-lg btn-info pull-right" ng-click="saveService(editServiceInvoiceForm)"
             custom-disabled="{{ disabledCreateServiceButton }}">
          {{ service === undefined ? 'Add' : 'Save' }}
        </div>

        <div class="btn btn-lg btn-primary pull-right" ng-click="cancelEditService()">Cancel</div>
      </li>
    </ul>
  </form>
</div>
