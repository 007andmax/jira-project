<div class="service-expense" ng-init="updateInvoiceService = 'updateInvoiceService-' + $index"
     ng-form="{{ updateInvoiceService }}">
  <div class="col1" ng-class="{'has-error': isShowingServiceErrors(editInvoiceForm[updateInvoiceService], 'service')}">

    <div uib-dropdown>

      <input type="text" class="form-control has-dropdown" placeholder="Service" autocomplete="off"
             uib-dropdown-toggle aria-expanded="false" name="serviceName"
             ng-model="service.item.name" custom-disabled="{{ !companyServices }}">
      <i class="icn-sm icn-caret-gray"></i>

      <input type="hidden" name="service" ng-model="service.item.versionedId.id" ng-required="true">

      <ul ng-class="{'dropdown-menu dropdown-menu-services': !!companyServices}">

        <li role="presentation"
            ng-repeat="companyService in companyServices | filter: {name: editService.item.name} | orderBy: 'name'">
          <a role="menuitem" tabindex="-1" href="javascript:void(0)" ng-click="setNewService(companyService)">
            {{ companyService.name }}
          </a>
        </li>

      </ul>
    </div>
  </div>

  <div class="col2"
       ng-class="{'has-error': isShowingServiceErrors(editInvoiceForm[updateInvoiceService], 'serviceTime')}"
       service-quantity-picker="service.quantity" sqp-is-show-format="false">

    <input id="service-quantity-picker" type="text" class="form-control"
           placeholder="Hr(s) : Min(s)" sqp-input
           autocomplete="off" aria-expanded="true"/>

    <input type="hidden" name="serviceTime" ng-model="service.quantity" ng-required="true"/>

  </div>

  <div class="col3"
       ng-class="{'has-error': isShowingServiceErrors(editInvoiceForm[updateInvoiceService], 'serviceDescription')}">

    <input type="text" class="form-control service-description" placeholder="Description"
           ng-model="service.description" max-length-word="30"
           name="serviceDescription" ng-maxlength="2000">
  </div>

  <div class="col4"
       ng-class="{'has-error': isShowingServiceErrors(editInvoiceForm[updateInvoiceService], 'serviceData')}">

    <div class="dropdown">

      <i class="icn-sm icn-caret-gray" style="position: absolute;top: 13px;right: 13px;z-index: 1;"></i>
      <input type="text" qt-data-time-picker max-date="maxServiceDate"
             class="form-control has-dropdown" data-toggle="dropdown" aria-expanded="false"
             placeholder="Date" ng-model="service.date"
             name="serviceData" ng-required="true">

    </div>
  </div>

  <div class="col-5" style="min-width: 50px;">
    <a class="hit-area pull-left order-add-product has-tooltip"
       ng-click="addService(editInvoiceForm)" tooltip-placement="top"
       uib-tooltip="Add Service">
      <i class="icn-sm icn-plus-dark"></i>
    </a>
    <a style="margin-left: 5px;" class="hit-area pull-right has-tooltip" tooltip-placement="top" uib-tooltip="Delete"
       ng-click="deleteService()">
      <i class="icn-sm icn-delete"></i>
    </a>
  </div>

</div>
