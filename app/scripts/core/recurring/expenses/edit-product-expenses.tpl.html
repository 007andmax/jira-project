<div class="product-expense" ng-init="updateInvoiceProduct = 'updateInvoiceProduct-' + $index"
     ng-form="{{ updateInvoiceProduct }}">

  <div class="col-sm-7"
       ng-class="{'has-error': isShowingProductErrors(editInvoiceForm[updateInvoiceProduct], 'product')}">

    <div products-list="product" id="product-list-cont"
         click-outside="closeDropdown()" outside-if-not="product-list-cont">
      <div>

        <input ng-hide="isPLOpen" type="text" class="form-control has-dropdown" pl-product-input
               placeholder="Product" autocomplete="off">

        <input ng-show="isPLOpen" type="text" class="form-control has-dropdown" pl-search-product-input
               placeholder="Search or Add Product" autocomplete="off" ng-model="searchProduct">

        <i class="icn-sm icn-caret-gray"></i>
      </div>

      <input type="hidden" name="product" ng-model="product.item.description" ng-required="true">

      <div class="nano dropdown-menu custom-product-list" pl-conteiner style="margin-left: -97px;"
           ng-include="'/html/scripts/common/templates/products-list.tpl.html'"></div>

    </div>

  </div>


  <div class="col-sm-2"
       ng-class="{'has-error': isShowingProductErrors(editInvoiceForm[updateInvoiceProduct], 'productQty')}">

    <input type="text" class="form-control" placeholder="Qty"
           ng-model="product.quantity" ng-maxlength="10"
           name="productQty" hard-reset-required="true"
           ng-change="controlProductQty(editInvoiceForm[updateInvoiceProduct])"
           hard-reset-pattern="numberPattern">
  </div>

  <div class="col-sm-2"
       ng-class="{'has-error': isShowingProductErrors(editInvoiceForm[updateInvoiceProduct], 'productPrice')}">

    <input type="text" class="form-control" placeholder="Price" name="productPrice" qt-to-fixed="2"
           ng-required="true" ng-model="product.item.sale"
           ng-readonly="!PermissionsService.isAllowed('MANAGE_PRODUCTS')"
           hard-reset-pattern="decimalNumberPattern" hard-reset-required="true">
  </div>

  <div class="col-sm-1">
    <a class="hit-area  order-add-product has-tooltip"
       ng-click="addProduct(editInvoiceForm)" tooltip-placement="top" uib-tooltip="Add Product">
      <i class="icn-sm icn-plus-dark"></i>
    </a>
    <a class="hit-area  has-tooltip" tooltip-placement="top" uib-tooltip="Delete"
       ng-click="deleteProduct()">
      <i class="icon-sm icn-delete"></i>
    </a>

  </div>

</div>
