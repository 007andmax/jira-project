<div class="add-product clearfix" ng-controller="quicktech.core.recurring.editProductCtrl">
  <form name="editProductInvoiceForm">
    <div class="col-1">
      <div class="col-wrapper dropdown" ng-class="{error: isShowingErrors(editProductInvoiceForm, 'editProductName')}">
        <input type="text" class="form-control form-control-dropdown dropdown-toggle" placeholder="Product"
               name="editProductName" ng-model="editProduct.item" ng-required="true"
               data-toggle="dropdown" aria-expanded="true" tabindex="1"
               typeahead="product as product.name for product in searchProducts($viewValue)"
               typeahead-min-length="0" typeahead-editable="false"
               qt-typeahead-show-on-focus ng-trim="false">
      </div>
    </div>

    <div class="col-2">
      <div class="col-wrapper" ng-class="{error: isShowingErrors(editProductInvoiceForm, 'editProductDescription')}">
        <input type="text" class="form-control" placeholder="Description"
               tabindex="2" name="editProductDescription" ng-required="true"
               ng-model="editProduct.description" ng-maxlength="1000">
      </div>
    </div>
    <div class="col-3">
      <div class="col-wrapper" ng-class="{error: isShowingErrors(editProductInvoiceForm, 'editProductQuantity')}">
        <input type="text" class="form-control" placeholder="Qty" tabindex="3"
               ng-model="editProduct.quantity" ng-required="true" name="editProductQuantity"
               hard-reset-pattern="numberPattern">
      </div>
    </div>
    <div class="col-4">
      <div class="col-wrapper" ng-class="{error: isShowingErrors(editProductInvoiceForm, 'amount')}">

        <input type="text" class="form-control" placeholder="Amount" tabindex="2" name="amount"
               tooltip="Product cost {{ editProduct.item.cost | currency: '$'  }}" product-cost-validate="editProduct"
               ng-required="true" ng-model="editProduct.sum" hard-reset-pattern="decimalNumberPattern">
      </div>
    </div>
    <div class="add-more  new clearfix">
      <div class="service-add-table-message pull-left">
        <div>

          <div class="qt-error-msg">{{ getValidationMessage(editProductInvoiceForm) }}</div>

        </div>
      </div>
      <div class="add-table-actions pull-right">
        <a href="javascript:void(0)" class="btn btn-sr btn-gray btn-apply-filter pull-left"
           ng-click="cancelEditProduct()">Cancel</a>
        <a href="javascript:void(0)" class="btn btn-sr btn-scooter btn-reset-filter pull-left"
           ng-click="saveProduct(editProductInvoiceForm)" ng-class="{disabled: disabledCreateProductButton}">
          {{ product === undefined ? 'Create' : 'Save Changes' }}</a>
      </div>
    </div>
  </form>
</div>
