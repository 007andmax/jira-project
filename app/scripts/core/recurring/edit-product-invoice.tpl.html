<div class="qt-add-service clearfix" ng-controller="quicktech.core.recurring.editProductCtrl">
  <form name="editProductInvoiceForm">
    <ul class="qt-list qt-invoices">
      <li class="add-product-item">
        <i class="icn icn-sm icn-update-product pull-left"></i>

        <div class="col-1" ng-class="{'has-error': isShowingErrors(editProductInvoiceForm, 'product')}">

          <div products-list="editProduct" id="product-list-cont"
               click-outside="closeDropdown()" outside-if-not="product-list-cont">

            <div>

              <input ng-hide="isPLOpen" type="text" class="form-control has-dropdown" pl-product-input
                     placeholder="Product" autocomplete="off">

              <input ng-show="isPLOpen" type="text" class="form-control has-dropdown" pl-search-product-input
                     placeholder="Search or Add Product" autocomplete="off" ng-model="searchProduct">

              <i class="icn-sm icn-caret-gray"></i>
            </div>

            <input type="hidden" name="product" ng-model="editProduct.item.description" ng-required="true">

            <div class="nano dropdown-menu custom-product-list" pl-conteiner
                 ng-include="'/html/scripts/common/templates/products-list.tpl.html'"></div>

          </div>

        </div>

        <div class="col-5" ng-class="{'has-error': isShowingErrors(editProductInvoiceForm, 'editProductSerialNumber')}">
          <input type="text" class="form-control" placeholder="Serial Number"
                 name="editProductSerialNumber"
                 ng-model="editProduct.serialNumber" ng-maxlength="36">
        </div>

        <div class="col-3" ng-class="{'has-error': isShowingErrors(editProductInvoiceForm, 'editProductQuantity')}">
          <input type="text" class="form-control" placeholder="Qty"
                 ng-model="editProduct.quantity" hard-reset-required="true" name="editProductQuantity"
                 hard-reset-pattern="numberPattern">
        </div>

        <div class="col-4" ng-class="{'has-error': isShowingErrors(editProductInvoiceForm, 'amount')}">
          <input type="text" class="form-control" placeholder="Amount" name="amount"
                 tooltip="Product cost {{ editProduct.item.cost | currency: '$':2  }}"
                 product-cost-validate="editProduct"
                 hard-reset-required="true" ng-model="editProduct.sum" hard-reset-pattern="decimalNumberPattern">
        </div>

      </li>
      <li class="qt-form-actions">

        <div class="text-error pull-left">{{ getValidationMessage(editProductInvoiceForm) }}</div>

        <div class="btn btn-lg btn-info pull-right"
             ng-click="saveProduct(editProductInvoiceForm)"
             custom-disabled="{{ disabledCreateProductButton || (editProductInvoiceForm.$invalid && triedToSaveProduct) }}">
          {{ product === undefined ? 'Add' : 'Save' }}
        </div>

        <div class="btn btn-lg btn-primary pull-right" ng-click="cancelEditProduct()">
          Cancel
        </div>

      </li>
    </ul>
  </form>
</div>
