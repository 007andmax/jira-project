<div class="qt-add-service clearfix" ng-controller="quicktech.core.recurring.editProductCtrl">
  <form name="editProductInvoiceForm">
    <ul class="qt-list qt-invoices">
      <li class="add-product-item">
        <i class="icn icn-sm icn-update-product pull-left"></i>

        <div class="col-1" ng-class="{'has-error': isShowingErrors(editProductInvoiceForm, 'product')}">
          <div class="dropdown">

            <input type="text" class="form-control has-dropdown" placeholder="Product" data-toggle="dropdown"
                   aria-expanded="false" name="productName"
                   ng-change="isProductNameCorrect()" ng-model="editProduct.item.name">
            <i class="icn-sm icn-caret-gray"></i>

            <input type="hidden" name="product" ng-model="editProduct.item.versionedId.id" ng-required="true">

            <div class="dropdown-menu dropdown-product"
                 ng-include="'/html/scripts/common/templates/choose-product-dropdown.tpl.html'"></div>

          </div>
        </div>

        <div class="col-2" ng-class="{'has-error': isShowingErrors(editProductInvoiceForm, 'editProductDescription')}">
          <input type="text" class="form-control" placeholder="Description"
                 name="editProductDescription" ng-required="true"
                 ng-model="editProduct.description" ng-maxlength="1000">
        </div>

        <div class="col-3" ng-class="{'has-error': isShowingErrors(editProductInvoiceForm, 'editProductQuantity')}">
          <input type="text" class="form-control" placeholder="Qty"
                 ng-model="editProduct.quantity" ng-required="true" name="editProductQuantity"
                 hard-reset-pattern="numberPattern">
        </div>

        <div class="col-4" ng-class="{'has-error': isShowingErrors(editProductInvoiceForm, 'amount')}">
          <input type="text" class="form-control" placeholder="Amount" name="amount"
                 tooltip="Product cost {{ editProduct.item.cost | currency: '$'  }}" product-cost-validate="editProduct"
                 ng-required="true" ng-model="editProduct.sum" hard-reset-pattern="decimalNumberPattern">
        </div>

      </li>
      <li class="qt-form-actions">

        <div class="text-error pull-left">{{ getValidationMessage(editProductInvoiceForm) }}</div>

        <div class="btn btn-lg btn-info pull-right"
             ng-click="saveProduct(editProductInvoiceForm)"
             ng-class="{disabled: disabledCreateProductButton}">
          {{ product === undefined ? 'Add' : 'Save' }}
        </div>

        <div class="btn btn-lg btn-primary pull-right" ng-click="cancelEditProduct()">
          Cancel
        </div>

      </li>
    </ul>
  </form>
</div>
