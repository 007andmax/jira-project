<div ng-repeat="service in invoice.services"
     ng-controller="quicktech.core.recurring.serviceCtrl">

  <div class="table-content pull-left" ng-if="!showEditService">
    <i class="icn icn-sm icn-update-service"></i>

    <div class="col-1">{{ service.item.name }}</div>
    <div class="col-2">Checked the search indexing service and svchost services to find the anomaly.</div>

    <div class="col-4">{{ service.sum | currency: '$': 0 }}</div>
    <div class="col-3">Duration <span class="model">{{ service.quantity | durationFilter }}</span></div>

    <a href="javascript:void(0)" class="ha-edit hit-area has-tooltip"
       ng-click="showEditProductForm()"
       tooltip-placement="top" tooltip-append-to-body="true" tooltip="edit service">
      <i class="icn-sm icn-edit"></i>
    </a>

    <a href="javascript:void(0)" class="ha-delete hit-area has-tooltip"
       ng-click="deleteProductInvoice()"
       tooltip-placement="top" tooltip-append-to-body="true" tooltip="Delete">
      <i class="icn-sm icn-delete"></i>
    </a>

  </div>

  <div ng-if="showEditService" ng-include="'/html/scripts/core/recurring/edit-service-invoice.tpl.html'"></div>

</div>
