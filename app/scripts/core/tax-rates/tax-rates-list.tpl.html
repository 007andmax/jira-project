<ul class="qt-list tax-rates-list">

  <li class="list-heading" ng-show="taxRates.length > 0">
    <div class="col-1" ng-click="setOrderForTaxRates('code')">
      <span class="sort-span">Tax Description<i class="icn-sm sort-icon icn-sort"
                                                ng-class="{'rotate': orderTaxRates.reverse, 'active': orderTaxRates.field === 'code'}"></i></span>

    </div>
    <div class="col-2" ng-click="setOrderForTaxRates('rate')">
      <span class="sort-span">Tax Percent<i class="icn-sm sort-icon icn-sort"
                                            ng-class="{'rotate': orderTaxRates.reverse, 'active': orderTaxRates.field === 'rate'}"></i></span>

    </div>
    <div class="col-3">&nbsp;</div>
  </li>

  <li ng-repeat="taxRate in taxRates | orderBy : orderByForTaxRates : orderTaxRates.reverse"
      ng-class="{'edit-form': editTaxKey === taxRate.versionedId.id}">

    <div class="intermediate-parent-elem" ng-if="editTaxKey !== taxRate.versionedId.id">

      <div class="col-1">

        <label class="control checkbox pull-left" ng-if="showCheckboxes">
          <input type="checkbox" ng-model="checkedTax[taxRate.versionedId.id]" ng-change="onChangeCheckbox()">
          <span class="control-indicator"></span>
        </label>

        <div ng-class="{'checkbox-caption': showCheckboxes}">{{ taxRate.code }}</div>
      </div>

      <div class="col-2">
        {{ taxRate.rate + '%' }}
      </div>

      <div class="col-3" stop-propagation="click">

        <a href="javascript:void(0)" class="ha-delete hit-area pull-right has-tooltip"
           ng-click="deleteTax(taxRate)"
           tooltip-placement="top" tooltip-append-to-body="true" uib-tooltip="Delete">
          <i class="icon-sm icn-delete"></i>
        </a>

        <a href="javascript:void(0)" class="ha-edit hit-area pull-right has-tooltip" ng-show="isTechCompanyTax"
           ng-click="showEditTaxForm(taxRate.versionedId.id)"
           tooltip-placement="top" tooltip-append-to-body="true" uib-tooltip="edit">
          <i class="icon-sm edit-icon"></i>
        </a>

      </div>

    </div>

    <div class="edit-form-content" ng-if="editTaxKey === taxRate.versionedId.id"
         ng-controller="quicktech.core.taxRates.editTaxRateCtrl"
         ng-include="'/html/scripts/core/tax-rates/edit-tax-rates.tpl.html'"></div>

  </li>

  <li class="edit-form" ng-if="editTaxKey === 'create_new'">
    <div class="edit-form-content" ng-controller="quicktech.core.taxRates.editTaxRateCtrl"
         ng-include="'/html/scripts/core/tax-rates/edit-tax-rates.tpl.html'"></div>
  </li>

</ul>
