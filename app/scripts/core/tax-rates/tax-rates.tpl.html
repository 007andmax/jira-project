<div class="tax-rates-content">
  <div class="default-tax-rates-header" ng-controller="quicktech.core.taxRates.defaultTaxRatesCtrl">

    <div class="default-tax-rate-count">Default Tax Rates
      <span class="text-muted">{{ taxRates.length }}</span>
    </div>

    <div class="dropdown pull-right" ng-controller="quicktech.core.taxRates.taxMovingCtrl">

      <div class="btn btn-icn btn-primary has-tooltip" data-toggle="dropdown" ng-click="openDropdown()"
           aria-expanded="false" tooltip-placement="top" tooltip-append-to-body="true"
           uib-tooltip="Move Tax Rate(s) to..."
           ng-click="cancelEditForm(); generateMovementData()" qt-hide-dropdown="hideMovementDropdown"
           custom-disabled="{{ !quantitySelectTAx }}">
        <i class="icn-sm icn-add-services"></i>
      </div>

      <div class="dropdown-menu dropdown-menu-right checkbox-dropdown">

        <div role="presentation" class="checkbox-dropdown-header" stop-propagation="click">
          <div class="form-group">
            <input type="text" class="form-control-filter" placeholder="Search company..." ng-model="searchCompany">
            <i class="icn-sm icn-search-input" tabindex="-1"></i>
          </div>
        </div>

        <div class="list-container" stop-propagation="click">
          <ul class="qt-table" style="overflow-y: scroll; height: 164px;background-color: #f1f5fa;">
            <li ng-repeat="clientCompany in clientCompanies | orderBy:'name' | filter: searchCompany"
                style="padding-left: 14px;" ng-click="changeCompanyMapping(clientCompany.id)">
              <label class="control checkbox">
                <input type="checkbox" ng-disabled="true"
                       ng-checked="companyMapping[clientCompany.id].checked">
                <span class="control-indicator pull-left"
                      ng-class="{'alternate': companyMapping[clientCompany.id] && companyMapping[clientCompany.id].notAll}"
                      style="    margin-top: -1px;"></span>
                {{ clientCompany.name }}
              </label>
            </li>
          </ul>
        </div>
        <div role="presentation" class="checkbox-dropdown-footer clearfix">
          <div class="number-selected pull-left" stop-propagation="click">
            <i class="pull-left icn-sm icn-tick-blue"></i>
            <strong>{{ quantitySelectTAx }}</strong> selected
          </div>
          <div class="btn btn-primary btn-lg pull-right" custom-disabled="{{ isDisabledMove() }}" ng-click="moveTax()">
            Move
          </div>
        </div>
      </div>

    </div>

    <div ng-include="'/html/scripts/core/tax-rates/tax-rates-list.tpl.html'"></div>

    <div class="add-tax-rate-btn-wrapper">
      <div class="btn btn-icn btn-primary has-tooltip"
           ng-click="showEditTaxForm('create_new')"
           custom-disabled="{{ showCreateTax }}"
           tooltip-placement="top" tooltip-append-to-body="true" uib-tooltip="Add Tax Rate">
        <i class="icn-sm icn-service-add"></i>
      </div>
    </div>

  </div>


  <div class="all-companies-heading">
    All Companies <span class="text-muted">Tax Rates Lists</span>
  </div>

  <ul class="qt-list qt-tax-rates">

    <li qt-toggle-slider ng-repeat="company in companies | orderBy: 'name'"
        ng-controller="quicktech.core.taxRates.companyTaxRatesCtrl"
        event-toggle-slider="toggleTax" ng-show="taxRates.length > 0">

      <div style="position: absolute;width: 100%;height: 71px;top: 0;z-index: 1;" ng-click="toggleTax()"></div>

      <div class="col-1">{{ company.name }}</div>
      <div class="col-2">{{ taxRates.length || 0 }} Tax Rates</div>

      <div ets-slider style="display: none;"
           ng-include="'/html/scripts/core/tax-rates/tax-rates-list.tpl.html'"></div>

    </li>

  </ul>
</div>
