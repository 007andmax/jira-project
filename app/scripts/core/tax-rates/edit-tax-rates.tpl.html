<div class="service-form-wrapper" ng-form="editTaxForm">

  <div class="col-1" ng-class="{'has-error': isShowingErrors(editTaxForm, 'editTaxCode')}">
    <input type="text" class="form-control" placeholder="Tax Description"
           ng-model="editTax.code" name="editTaxCode" ng-required="true"
           is-uniq-validation validation-func="validateTaxCode" model-id="editTax.versionedId.id"
           ng-maxlength="100">
  </div>

  <div class="col-2" ng-class="{'has-error': isShowingErrors(editTaxForm, 'editTaxRate')}">
    <input type="text" class="form-control" placeholder="Tax Percent" ng-model="editTax.rate" qt-to-fixed="2"
           name="editTaxRate" hard-reset-required="true" hard-reset-pattern="decimalNumberPattern">
    <span class="procent-rate">%</span>
  </div>


  <div class="qt-form-actions">
    <div class="pull-left text-error">{{ getValidationMessage(editTaxForm) }}</div>

    <div class="btn btn-lg btn-info pull-right"
         ng-click="saveEditTax(editTaxForm)"
         custom-disabled="{{ disabledSaveButton }}">
      {{ editTax.versionedId && editTax.versionedId.id ? 'Save' : 'Add' }}
    </div>

    <div class="btn btn-lg btn-primary btn-primary-outline pull-right" ng-click="showEditTaxForm()">Cancel</div>
  </div>
</div>
