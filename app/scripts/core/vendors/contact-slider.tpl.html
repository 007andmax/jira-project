<div class="contact-slider">

  <div class="vendor-contact" ng-class="{active: $index === 0, nactive: $index !== 0}"
       ng-repeat="contact in contacts | orderBy: contactsOrder" cs-slide ng-show="$index <= 1"
       ng-init="initializeContact($index)">

    <div class="user-info">

      <div class="avatar" ng-click="showNext(contact.id)">
        <img ng-src="{{ getContactAvatarUrl(contact) }}" alt="..." class="img-circle avatar-50">
      </div>

      <div class="name-designation" style="display:none" contact-hide-info>
        <h4>{{ getUserName(contact) }}</h4>
        <span class="label label-light">{{ contact.designation }}</span>
      </div>

    </div>

    <div class="user-contact-no" style="display:none" contact-hide-info>
      <i class="icn-sm"
         ng-class="{'icn-iphone': getPhoneWithLowestNumber(contact.phoneNumbers).typeNumber === 'MOBILE',
                           'icn-user-fax': getPhoneWithLowestNumber(contact.phoneNumbers).typeNumber === 'FAX',
                           'icn-user-phone': getPhoneWithLowestNumber(contact.phoneNumbers).typeNumber === 'OFFICE'}"></i>
      {{ getPhoneWithLowestNumber(contact.phoneNumbers).number }}
    </div>

  </div>

</div>
