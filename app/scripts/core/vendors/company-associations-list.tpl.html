<div class="panel-body">
  <div class="assc-companies-list">
    <ul style="height: 345px; overflow-y: scroll">
      <li ng-repeat="associationsCompany in vendor.companyAssociations">
        <div class="vendor-company-name">{{ associationsCompany.company.name }}</div>
        <div class="vendor-company-address"
             ng-if="associationsCompany.company.addresses && associationsCompany.company.addresses[0]">
          {{ associationsCompany.company.addresses[0].address }}
        </div>
      </li>
    </ul>
  </div>
</div>
