<ul class="custom-scroll" style="max-height: 346px;">

  <li ng-repeat="product in vendor.products">

    <div class="vp-price">{{ product.sale | currency: '$': 2 }}</div>

    <div class="vp-name"><span>{{ product.name }}</span>
      <a href="javascript:void(0)" class="hit-area ha-desc pull-left"
         popover-placement="bottom" popover="{{ product.description }}"
         popover-trigger="mouseenter" popover-class="description-popover" popover-append-to-body="true">
        <i class="icn-sm icn-description"></i>
      </a>
    </div>

    <div class="vp-code">{{ product.category.name }} #{{ product.code }}</div>
  </li>

</ul>
