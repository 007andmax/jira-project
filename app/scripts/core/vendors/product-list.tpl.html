<ul class="custom-scroll" style="max-height: 346px;">

  <li ng-repeat="product in vendor.products | orderBy: 'description'">

    <div class="vp-price">{{ product.sale | currency: '$': 2 }}</div>

    <div class="vp-name"><span>{{ product.description }}</span></div>

    <div class="vp-code">
      <span ng-show="product.ilc">ILC: {{ product.ilc }}</span>
      <span ng-show="product.manufacture" style="margin-left: 15px;">P/N: {{ product.manufacture }}</span>
    </div>
    <div class="vp-code">{{ product.category.name }}</div>
  </li>

</ul>
