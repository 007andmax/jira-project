<div class="vendor-company company vendors clearfix"
     ng-class="{
      product: shownSection === 'products',
      'company-profile loc': shownSection === 'more',
     }"
     ng-controller="quicktech.core.vendors.vendorCtrl">
  <a href="javascript:void(0)" class="close-btn close " ng-show="shownSection"
     ng-click="setShownSection()">
    <span aria-hidden="true" class="icn-close-modal"></span>
  </a>

  <div class="over-wrapper">
    <div class="company-wrapper">
      <div class="company-cover-wrapper" style="background-image:url('images/company/cover.png')">
        <div class="overlay"></div>
        <div class="archive-btn thide " ng-hide="(user.role!=='SUPER_TECH_ADMIN') || shownSection">
          <a class="black-btn " href="javascript:void(0)" ng-click="archiveVendor()"
             tooltip="Archive Vendor" tooltip-placement="top">
            <span class="icn archive-company"></span></a>
        </div>
        <div class="company-info">
          <h3 class="name thide " ng-hide="shownSection">{{ vendor.name }}</h3>

          <div class="ac-start-wrapper clearfix">
            <div class="product pull-left" ng-click="setShownSection('products')" ng-hide="shownSection === 'more'">
              <span class="icn product-icn"></span>
              <span class="bold">Products</span> {{ vendor.products.length }}
            </div>

            <div class="dot-sep pull-left thide " ng-hide="shownSection"></div>

            <a href="javascript:void(0)" class="icn-wrapper pull-left thide "
               ng-hide="shownSection" popover-placement="bottom"
               popover-trigger="mouseenter"
               popover-template="'/html/scripts/core/vendors/popover.tpl.html'">
              <span class="icn company-detail"></span>
            </a>
            <a href="javascript:void(0)" class="tp-hide pull-left icn-wrapper thide "
               ng-hide="shownSection" tooltip="Change Cover" tooltip-placement="top">
              <span class="icn camera"></span></a>

            <a href="javascript:void(0)" class="icn-wrapper tp-hide pull-left thide "
               ng-hide="shownSection" tooltip="Edit info" tooltip-placement="top"
               ui-sref="editVendor( { vendorId: vendor.id } )">
              <span class="icn icn-edit-tag"></span>
            </a>
          </div>
        </div>
      </div>

      <div class="company-information clearfix thide " ng-hide="shownSection">
        <div class="users-list" contacts-slider ng-model="vendor.contacts">

        </div>
        <div class="ci location clearfix">
          <span class="icn icn-sb-location"></span>
          <span class="txt">{{ vendor.primaryAddress.address }}</span>
        </div>
        <div class="clearfix company-actions">
          <a href="javascript:void(0)" class="btn btn-scooter btn-update pull-left"
             style="margin-right: 10px;" ng-click="sendMail()">
            <div class="icn-white-mail"></div>
          </a>

        </div>

        <a href="javascript:void(0)" class="icn-reset-user more tp-hide" ng-click="setShownSection('more')"></a>
      </div>
    </div>

    <div class="company-profile-wrapper" ng-show="shownSection === 'more'">
      <div class="primary" ng-init="accordionStatus.openClients = true">
        <accordion close-others="true">
          <accordion-group is-open="accordionStatus.openLocations" is-disabled="accordionStatus.openLocations"
                           ng-class="{active: accordionStatus.openLocations}">
            <accordion-heading ng-class="{active: accordionStatus.openLocations}">
              <a class="collapsed" style="padding:0px;" data-toggle="collapse" href="javascript:void(0)">
                Site/Location(s) <span class="total">{{ vendor.addresses.length }}</span>
                <span class="expand icn" ng-show="!accordionStatus.openLocations"></span>
              </a>

              <div class="arrows" ng-show="accordionStatus.openLocations" style="display: block;">
                <a href="javascript:void(0)" class="icn left-arrow"
                   ng-class="{disabled: locationIndex <= 0}"
                   ng-click="changeCurrentLocation(locationIndex - 1)"></a>
                <a href="javascript:void(0)" class="icn right-arrow"
                   ng-click="changeCurrentLocation(locationIndex + 1)"
                   ng-class="{disabled: locationIndex >= vendor.addresses.length - 1 }"></a>

              </div>
            </accordion-heading>

            <div class="location-slider" ng-include="'/html/scripts/core/vendors/location-slider.tpl.html'"></div>

          </accordion-group>

          <accordion-group is-open="accordionStatus.openClients" is-disabled="accordionStatus.openClients"
                           ng-class="{'active': accordionStatus.openClients}">
            <accordion-heading ng-class="{'active': accordionStatus.openClients}">
              <a class="collapsed" style="padding:0px;" data-toggle="collapse" href="javascript:void(0)">
                Assc. Client Companies <span class="total">{{ vendor.companyAssociations.length }}</span>
                <span ng-show="!accordionStatus.openClients" class="expand icn"></span>
              </a>
            </accordion-heading>

            <div class="products clearfix scroll-pane" qt-scroll-pane
                 ng-include="'/html/scripts/core/vendors/company-associations-list.tpl.html'">
            </div>
          </accordion-group>
        </accordion>

      </div>
    </div>


    <div class="product-wrapper" ng-show="shownSection === 'products'">
      <div class="products clearfix scroll-pane" qt-scroll-pane
           ng-include="'/html/scripts/core/vendors/product-list.tpl.html'">
      </div>
    </div>

  </div>


</div>
