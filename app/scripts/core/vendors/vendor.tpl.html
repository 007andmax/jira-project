<div ng-controller="quicktech.core.vendors.vendorCtrl" vendor-card
     ng-class="{'hide': company.isDefault, 'large': location.length > 50}">

  <div class="company-cover-area"
       style="background: url('images/company/cover.png') transparent right no-repeat; background-size: cover}">

    <div class="name-rating" style="height: 10%">
      <div class="company-name">{{ vendor.name }}</div>
    </div>
  </div>

  <div class="company-primary-contact">
    <div class="user-location"><i class="icn-sm icn-sb-location"></i>
        <span class="company-address-formatting">{{ getPrimaryBillengAddress() }}</span>
    </div>

    <div class="user-contact-no">
      <i class="icn-sm {{ getPhoneNumberCssClass(vendor.contacts[0].phoneNumbers[0]) }}"></i>
      {{ vendor.contacts[0].phoneNumbers[0].number }}
    </div>

    <div class="user-info">

      <div class="name-designation">

        <h4>{{ getUserName(vendor.contacts[0]) }}</h4>

        <i class="dot" ng-class="{'on': vendor.contacts[0].online, 'off': !vendor.contacts[0].online}"></i>

        <span class="label label-light">{{ vendor.contacts[0].designation }}</span>

      </div>
    </div>
  </div>

  <div class="vendor-actions user-actions">

    <div class="btn btn-info has-tooltip" email-to="getPriorityContact().email"
         tooltip-placement="top" tooltip-append-to-body="true" tooltip="Email">
      <i class="icn-sm icn-email-white"></i>
    </div>

    <div class="vendor-card-icons">
      <a href="javascript:void(0)" class="hit-area ha-14-16" show-popover>
        <i class="icn-sm icn-description-white" style="background-position: -780px -206px;"></i>
      </a>
      <a href="javascript:void(0)" class="hit-area has-tooltip"
         ui-sref="editVendor( { vendorId: vendor.id } )"
         tooltip-placement="top" tooltip="Edit"
         ng-show="PermissionsService.isAllowed('inventry/vendors', currentUser.role, 'u')">
        <i class="icn-md icn-edit-tag"></i>
      </a>

      <a class="hit-area has-tooltip" ng-show="PermissionsService.isAllowed('inventry/vendors', currentUser.role, 'd')"
         ng-click="archiveVendor()" archive-vendor-button
         tooltip-placement="top" tooltip-append-to-body="true" tooltip="Archive Vendor">
        <i class="icn-sm icn-archive-company"></i>
      </a>
    </div>

  </div>

</div>
