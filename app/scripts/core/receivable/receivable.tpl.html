<div>

  <div class="invoices">
    <div class="invoices-header">
      <h3>Invoices</h3>
      <div class="invoices-header-filters">
        <div>
          <input class="pointer" type="text" placeholder="Filter by date">
          <i class="report-calendar"></i>
        </div>
        <div>
          <input class="pointer" type="text" placeholder="Search by company, invoice" ng-model="invoiceFilter">
        </div>
        <div>
          <input class="pointer" type="text" placeholder="Sort By">
          <i class="icn-sm report-caret-icon"></i>
        </div>

         <!--НЕ ОБВОРАЧИВАЙ БАТТОН В ДИВ-->
        <button class="btn btn-success"
                custom-disabled="{{ !selectedInvoiceCount }}"
                modal-window-button="/html/scripts/core/receivable/receive-payment.tpl.html"
                modal-window-class="modal-receive-payment"
                mw-controller="quicktech.core.receivable.receivePaymentCtrl">
          Received Payment
        </button>
      </div>
    </div>
    <div ng-hide="loadingInProgress"
         ng-include="'/html/scripts/core/receivable/invoices-'+ mode +'.tpl.html'"></div>
    <loading-indicator loading-trigger="loadingInProgress"></loading-indicator>
  </div>




  <div class="receivable-content">
    <div class="tabs-container" style="height: 55px">

      <div class="payment-receive-fixed" fixed-block-top>
        <div class="btn btn-primary pull-right has-tooltip"
             custom-disabled="{{ !selectedInvoiceCount }}"
             modal-window-button="/html/scripts/core/receivable/receive-payment.tpl.html"
             modal-window-class="modal-receive-payment"
             mw-controller="quicktech.core.receivable.receivePaymentCtrl">
          Receive Payment
        </div>

        <button-with-loading-indicator class="btn btn-primary pull-right" ng-click="resendSelectedInvoices()"
                                       custom-disabled="{{ !selectedInvoiceCount || sendingInvoices }}"
                                       loading="sendingInvoices"
                                       label="Resend Selected"></button-with-loading-indicator>

        <ul class="nav nav-qt" role="tablist">

          <li role="presentation" ng-class="{active: mode === 'group-by-company'}">
            <a ui-sref="receivable({mode: 'group-by-company'})">
              Invoice by Company
            </a>
          </li>

          <li role="presentation" ng-class="{active: mode === 'list'}">
            <a ui-sref="receivable({mode: 'list'})">
              Invoice by Number
            </a>
          </li>

        </ul>
      </div>

    </div>

    <div class="tab-content" ng-hide="loadingInProgress"
         ng-include="'/html/scripts/core/receivable/'+ mode +'.tpl.html'"></div>
    <loading-indicator loading-trigger="loadingInProgress"></loading-indicator>

  </div>
</div>
