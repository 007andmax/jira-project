<div>

  <div  class="invoices clearfix" ng-style="{'padding': isInvoiceShown ? '0px' : '25px'}">
    <div ng-show="!isInvoiceShown" class="fixed-block-top" fixed-block-top style=" background-color: #f3f7f9; right: 25px; ">
      <div class="invoices-header">
        <h3>Invoices</h3>
        <div class="invoices-header-filters" slyle="position: relative;">
          <div>
            <input class="pointer" type="text" placeholder="Filter by date" date-range-picker
                   ng-model="invoiceDateFilter"
                   options="invoiceDateFilterOptions">
            <i class="new-calendar" ng-show="!invoiceDateFilter.startDate && !invoiceDateFilter.endDate"></i>
            <i class="icn-sm icn-remove-old pointer"
               ng-show="invoiceDateFilter.startDate && invoiceDateFilter.endDate"
               uib-tooltip="clear date filter" tooltip-placement="top" ng-click="clearInvoiceDateFilter()"></i>
          </div>
          <div>
            <input type="text"
                   class="has-dropdown pointer"
                   placeholder="Search by company or number"
                   ng-trim="false"
                   autocomplete="off"
                   ng-model="invoiceFilterCompany"
                   ng-change="filterInvoicesBy(invoiceFilterCompany)"

                   uib-typeahead="company.name as company.name for company in receivableCompanies | filter:{'name': $viewValue, 'isDefault': false}:stateComparator | orderBy:'name'"
                   qt-typeahead-async-show-on-focus smart-dropdown-menu-position>

            <div typeahead-input-icon="invoiceFilter"></div>
          </div>
          <div class="clearfix sort-by">

            <div uib-dropdown smart-dropdown-menu-position="dropdown-menu">
              <div uib-dropdown-toggle>
                <input class="pointer" type="text" placeholder="Sort By" readonly ng-model="sortByValue">
                <div>
                  <i class="icn-sm report-caret-icon pointer" ng-show="!sortByValue"></i>
                  <i class="icn-sm icn-remove-old pointer"
                     ng-show="sortByValue"
                     uib-tooltip="clear" tooltip-placement="top" ng-click="sortBy('')"></i>
                </div>
              </div>
              <ul class="dropdown-menu" role="menu" style="margin-top: -3px;">
                <li><a ng-click="sortBy('Paid invoices')">Paid invoices</a></li>
                <li><a ng-click="sortBy('Unpaid invoices')">Unpaid invoices</a></li>
                <li><a ng-click="sortBy('Overdue invoices')">Overdue invoices</a></li>
                <li><a ng-click="sortBy('Group by companies')">Group by companies</a></li>
              </ul>
            </div>

          </div>

          <div uib-dropdown class="save-invoice-button" custom-disabled="{{!!invoiceNumError}}">
            <button ng-disabled="(savingInvoiceInProcess.indexOf(invoiceLocks[showInvoiceLockIndex].id) > -1) || invoiceLocks[showInvoiceLockIndex].expired"
                    tooltip-append-to-body="true"
                    class="btn btn-success"
                    modal-window-button="/html/scripts/core/billable/new-billable-modals/single-payments.tpl.html"
                    mw-controller="quicktech.core.receivable.receivePaymentCtrl"
                    modal-window-class="modal-receive-payment"
                    tooltip-placement="bottom">


              Receive single payment

              <!--<div class="caret-wrapper pointer" style="color: white; padding: 10px" >-->
              <i class="icn-sm pointer report-caret-icon-white"></i>
              <!--</div>-->
              <div class="open-dropdown-zone" uib-dropdown-toggle ng-click="$event.stopPropagation()"></div>
            </button>


            <ul class="dropdown-menu">
              <li class="create-invoice-dropdown">
                <button
                        ng-disabled="(savingInvoiceInProcess.indexOf(invoiceLocks[showInvoiceLockIndex].id) > -1) || invoiceLocks[showInvoiceLockIndex].expired || selectedInvoiceCount <= 1"
                        tooltip-append-to-body="true"
                        class="btn btn-success"
                        custom-disabled="{{ !selectedInvoiceCount || !selectableCompanyId}}"
                        modal-window-button="/html/scripts/core/billable/new-billable-modals/multiple-payments.tpl.html"
                        mw-controller="quicktech.core.receivable.receivePaymentCtrl"
                        modal-window-class="modal-receive-payment"
                        tooltip-placement="bottom">


                  Receive multiple payments


                </button>
              </li>

              <li class="create-invoice-dropdown"
                  ng-click="receivablePreview ? download() : createInvoice(invoiceLocks[showInvoiceLockIndex], download)">
                Save and Download
              </li>
            </ul>
          </div>

          <!-- <button class="btn btn-success"
                  custom-disabled="{{ !selectedInvoiceCount || !selectableCompanyId}}"
                  modal-window-button="/html/scripts/core/receivable/receive-payment.tpl.html"
                  modal-window-class="modal-receive-payment"
                  mw-controller="quicktech.core.receivable.receivePaymentCtrl">
            Received Payment
          </button>


          <button class="btn btn-success resend-btn"
                  ng-click="resendSelectedInvoices()"
                  ng-show="selectedInvoiceCount > 0 ">
            Resend invoices
          </button> -->




        </div>
      </div>
      <ul class="qt-list company-devices qt-users invoices-list" ng-show="mode === 'list'">
        <li class="list-heading clearfix" style="z-index: 2;box-shadow: 0 10px 10px -2px rgba(0,0,0,0.05);">
          <div class="col-md-1 pointer w-11" ng-click="setOrderForInvoices('number')">
            <label class="control checkbox pull-left">
              <input type="checkbox" ng-click="selectAllInvoices()" ng-checked="isAllinvoicesSelected()">
              <span class="control-indicator"></span>
            </label>
            Invoice#
          </div>
          <div class="col-md-3 pointer w-22" ng-click="setOrderForInvoices('company')">Company</div>
          <div class="col-md-2 pointer" ng-click="setOrderForInvoices('date')">Invoice date</div>
          <div class="col-md-2 pointer" ng-click="setOrderForInvoices('readedAt')">Read On</div>
          <div class="col-md-1 pointer" style="width: 13.6%;" ng-click="setOrderForInvoices('sum')">Amount</div>
          <div class="col-md-2 pointer" ng-click="setOrderForInvoices('dueDate')">Due Date</div>
          <div class="col-md-1" style="width: 3%;"></div>
        </li>
      </ul>
    </div>

    <div ng-hide="loadingInProgress"
         ng-include="'/html/scripts/core/receivable/invoices-'+ mode +'.tpl.html'"
         ng-style="{'margin-top': isInvoiceShown ? '0' : mode === 'list' ? '93px' : '50px'}"></div>
    <loading-indicator loading-trigger="loadingInProgress"></loading-indicator>

  </div>


</div>
