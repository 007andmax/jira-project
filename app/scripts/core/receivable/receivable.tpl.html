<div>
  <div class="receivable-head clearfix">

    <div class="chart-wrapper">
      <div class="heading">

        <strong>Total Collected</strong>
        <span>Last 30 Days</span>
        <span class="dot-sep"></span>
        <span>{{ totalCollectedLast30Days | currency: '$': 2 }}</span>

        <ul class="chart-legend">
          <li><i class="circle-indicator red"></i>Receivable</li>
          <li><i class="circle-indicator blue"></i>Received</li>
        </ul>

      </div>

      <div receivable-chart ng-model="receivableGraphData"></div>

    </div>

    <div class="all-time-stats">

      <div class="heading"><strong>RECEIVED AMOUNT <span>ALL TIME</span></strong>
        <span class="amount">{{ receivedAmountAllTime.value | currency: '$': 2 }}</span>
      </div>

      <div class="total-billable">
        <div class="pie-chart" pie-chart pie-chart-size="40" pie-chart-color="['#7fd5e0', '#e53935']"
             pie-chart-value="[totalReceivables, totalCollectedLast30Days]"></div>
        <div class="pull-left">
          <strong>TOTAL RECEIVABLES</strong>
          <strong class="amount">{{ totalReceivables | currency:'$' :2 }}</strong>
        </div>
      </div>

    </div>

  </div>

  <div class="receivable-content">
    <div class="tabs-container" style="height: 55px">

      <div class="payment-receive-fixed" fixed-block-top>
        <div class="btn btn-info pull-right has-tooltip" style="width: 96px; margin: 16px 40px 0 0;"
             tooltip-placement="top" tooltip-append-to-body="true" tooltip="Payment Received"
             custom-disabled="{{ !countInvoice }}"
             modal-window-button="/html/scripts/core/receivable/receive-payment.tpl.html"
             modal-window-class="modal-receive-payment"
             mw-controller="quicktech.core.receivable.receivePaymentCtrl">
          <i class="icn-sm small-icn-tick"></i>
        </div>

        <ul class="nav nav-qt" role="tablist">

          <li role="presentation" ng-class="{active: mode === 'group-by-company'}">
            <a ui-sref="receivable({mode: 'group-by-company'})">
              Invoice by Company
            </a>
          </li>

          <li role="presentation" ng-class="{active: mode === 'list'}">
            <a ui-sref="receivable({mode: 'list'})">
              Invoice by Number
            </a>
          </li>

        </ul>
      </div>

    </div>

    <div class="tab-content" ng-if="!loadingInProgress" ng-include="'/html/scripts/core/receivable/'+ mode +'.tpl.html'"></div>
    <loading-indicator loading-trigger="loadingInProgress"></loading-indicator>

  </div>
</div>
