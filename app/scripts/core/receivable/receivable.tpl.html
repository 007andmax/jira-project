<div>

  <div class="invoices clearfix">
    <div class="invoices-header">
      <h3>Invoices</h3>
      <div class="invoices-header-filters">
        <div>
          <input class="pointer" type="text" placeholder="Filter by date" date-range-picker ng-model="invoiceDateFilter"
                 options="invoiceDateFilterOptions">
          <i class="report-calendar"></i>
        </div>
        <div>
          <input type="text" class="has-dropdown pointer"
                 placeholder="Search by company or number" ng-trim="false"
                 autocomplete="off" ng-model="invoiceFilterCompany"
                 uib-typeahead="company.name as company.name for company in receivableCompanies | filter:{'name': $viewValue, 'isDefault': false}:stateComparator | orderBy:'name'"
                 qt-typeahead-async-show-on-focus smart-dropdown-menu-position>
          <div typeahead-input-icon="invoiceFilter"></div>
        </div>
        <div class="clearfix sort-by">
          <!--<input class="pointer" type="text" placeholder="Sort By">-->
          <!--<i class="icn-sm report-caret-icon"></i>-->
          <!--<input  type="text" class="pointer" placeholder="Sort by"-->
          <!--ng-model="sortBy"-->
          <!--uib-typeahead="interval for interval in sortByItems"-->
          <!--qt-typeahead-async-show-on-focus readonly >-->
          <!--<div>-->
          <!--<i class="icn-sm icn-caret-gray pointer" ng-show="!sortBy"></i>-->
          <!--<i class="icn-sm icn-remove-old pointer"-->
          <!--ng-show="sortBy"-->
          <!--uib-tooltip="clear" tooltip-placement="top" ng-click="sortBy = ''"></i>-->
          <!--</div>-->
          <div uib-dropdown smart-dropdown-menu-position="dropdown-menu">
            <div uib-dropdown-toggle>
              <input class="pointer" type="text" placeholder="Sort By" readonly ng-model="sortByValue">
              <div>
                <i class="icn-sm report-caret-icon pointer" ng-show="!sortByValue"></i>
                <i class="icn-sm icn-remove-old pointer"
                   ng-show="sortByValue"
                   uib-tooltip="clear" tooltip-placement="top" ng-click="sortBy('')"></i>
              </div>
            </div>
            <ul class="dropdown-menu" role="menu" style="margin-top: -3px;">
              <li><a ng-click="sortBy('Paid invoices')">Paid invoices</a></li>
              <li><a ng-click="sortBy('Outstanding invoices')">Outstanding invoices</a></li>
              <li><a ng-click="sortBy('Overdue invoices')">Overdue invoices</a></li>
              <li><a ng-click="sortBy('Group by companies')">Group by companies</a></li>
            </ul>
          </div>
        </div>

        <button class="btn btn-success"
                custom-disabled="{{ !selectedInvoiceCount }}"
                modal-window-button="/html/scripts/core/receivable/receive-payment.tpl.html"
                modal-window-class="modal-receive-payment"
                mw-controller="quicktech.core.receivable.receivePaymentCtrl">
          Received Payment
        </button>
      </div>
    </div>
    <div ng-hide="loadingInProgress"
         ng-include="'/html/scripts/core/receivable/invoices-'+ mode +'.tpl.html'"></div>
    <loading-indicator loading-trigger="loadingInProgress"></loading-indicator>
  </div>

</div>
