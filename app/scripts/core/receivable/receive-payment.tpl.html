<div class=" modal-receive-payment fade in show" style="margin-top: 150px;">
  <div class="modal-dialog payment-received">
    <div class="modal-content">
      <div class="modal-header clearfix">
        <button type="button" class="close" ng-click="close()">
          <span aria-hidden="true" class="icn-close-modal"></span>
        </button>
        <h4 class="modal-title pull-left">Receive Payment(s) </h4>
      </div>


      <div class="modal-footer ">
        <div class="row-wrapper clearfix">
          <div class="form-group dropdown cs-type pull-left">
            <label>Payment Method</label>
            <!--TODO here should be angular ui dropdown-->
            <input type="text" class="form-control form-method-dropdown form-control-dropdown dropdown-toggle " READONLY
                   data-toggle="dropdown" aria-expanded="true" ng-model="paymentMethod[invoiceToReceive.method]">
            <ul class="dropdown-menu dropdown-payment-method ">
              <li ng-repeat="(value, label) in paymentMethod" ng-click="invoiceToReceive.method = value">
                <a tabindex="-1" href="javascript:void(0)">{{ label }}</a></li>
            </ul>
          </div>


        </div>
        <ul class="invoices-sticky invoices" >
          <li class="head clearfix">
            <div class="">
              <div class="col-1"><div class="ui-checkbox ui-checkbox-warning pull-left"><label class="control checkbox">
                <input type="checkbox" ng-model="invoiceToReceive.chooseAll" ng-change="changeChooseAll()">
                <span class="control-indicator"></span>
              </label></div> <span class="name">INVOICE NO.</span> </div>
              <div class="col-2">SENT ON</div>
              <div class="col-3">AMOUNT</div>
            </div>
          </li></ul>
        <div class="invoices-list" id="invoiceList">
          <ul class="invoices" qt-scroll-pane>
            <li class="clearfix" ng-repeat="invoice in choosenInvoices"
                ng-controller="quicktech.core.receivable.invoiceToReceiveCtrl">
              <span class="icns icn-green-calendar calendar" data-toggle="tooltip" data-container='#invoiceList'
                    data-placement="top" title="" data-original-title="recurring: monthly"></span>
              <div class="hover">
                <div class="col-1"> <div class="ui-checkbox ui-checkbox-warning pull-left"><label class="control checkbox">
                  <input type="checkbox" ng-model="invoiceToReceive.invoices[invoice.id]">
                  <span class="control-indicator"></span>
                </label></div>
                  <span class="name">{{ invoiceProperty('number') }}</span></div>
                <div class="col-2 normal">{{ invoiceProperty('date') | date:'dd MMM yyyy' }}</div>
                <div class="col-3 normal">{{ totalInvoiceSum | currency }}</div>
              </div>
            </li>
          </ul></div>
        <div class="total-amount pull-right">Total amount <span
          class="bold">{{ receivePaymentSum | currency: '$': 0 }}</span></div>
        <div class="row-wrapper clearfix">
          <div class=" actions-wrapper pull-left">
            <button type="button" class="btn btn-scooter" ng-click="receivePayment()">Receive</button>
            <button type="button" class="btn btn-gray"
                    ng-click="close()" data-dismiss="modal">Cancel
            </button>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
