<div ng-form="paymentRecieveForm">

  <div class="modal-header clearfix">
    <a href="javascript:void(0)" class="hit-area pull-right" ng-click="close()"
       data-dismiss="modal" aria-label="Close">
      <i class="icn-sm icn-remove-token"></i>
    </a>
    <h4 class="modal-title pull-left">Receive Payment</h4>
  </div>

  <div class="modal-body clearfix">

    <div class="invoices-header">
      <div class="form-group">
        <label class="control-label">Payment Method</label>
        <div uib-dropdown>
          <input class="form-control has-dropdown readonly-normal" type="text" READONLY
                 uib-dropdown-toggle aria-expanded="true" ng-model="paymentMethod[invoiceToReceive.method]">
          <i class="icn-sm icn-caret-gray"></i>

          <ul class="dropdown-menu">
            <li ng-repeat="(value, label) in paymentMethod"
                ng-click="invoiceToReceive.method = value">
              <a tabindex="-1" href="javascript:void(0)"> {{ label }} </a>
            </li>
          </ul>

        </div>
      </div>
    </div>

    <div class="form-group" style="width: 90%; margin: 10px auto;"
         ng-class="{'has-error': isShowingErrors(paymentRecieveForm, 'note')}">

      <label class="control-label" ng-class="{ 'hide': isShowingErrors(paymentRecieveForm, 'note')}">
        NOTE
      </label>

      <div ng-messages="paymentRecieveForm.note.$error"
           ng-class="{ 'hide': !isShowingErrors(paymentRecieveForm, 'note')}">
        <label class="control-label" ng-message="maxlength">NOTE IS TOO LARGE</label>
      </div>

      <textarea class="form-control" name="note" ng-model="note" ng-maxlength="250"></textarea>
    </div>

    <ul class="qt-list invoice-list-heading">
      <li class="list-heading">

        <div class="col-1">
          <label class="control checkbox pull-left">
            <input type="checkbox" ng-model="invoiceToReceive.chooseAll" ng-change="changeChooseAll()">
            <span class="control-indicator"></span>
          </label>
          INVOICE NO.
        </div>

        <div class="col-2">SENT ON</div>
        <div class="col-3">AMOUNT</div>

      </li>
    </ul>

    <ul class="qt-list receive-payment-list">
      <li ng-repeat="invoice in receivePaymentInvoices">

        <div class="col-1">
          <label class="control checkbox pull-left">
            <input type="checkbox" ng-model="invoiceToReceive.invoices[invoice.id]">
            <span class="control-indicator"></span>
          </label>
          {{ invoice.number }}
        </div>

        <div class="col-2">{{ invoice.date | date:'dd MMM yyyy' }}</div>
        <div class="col-3">{{ invoice.sum | currency: '$': 2 }}</div>

      </li>
    </ul>

  </div>

  <div class="modal-footer">
    <div class="clearfix justify-flex">

      <div class="form-group pull-left">

        <div class="btn btn-primary btn-lg"
             custom-disabled="{{ !countReceiveInvoice || disableReceiveButton || paymentRecieveForm.$invalid }}"
             ng-click="receivePayment()">
          Receive
        </div>

        <div class="btn btn-primary   btn-lg" ng-click="close()">
          Cancel
        </div>

      </div>

      <div class="pull-right total-amount">
        <div>
          <label class="control checkbox pull-left" style="margin-top: 2px;">
            <input type="checkbox" ng-model="invoiceToReceive.isSendNotification">
            <span class="control-indicator"></span>
          </label>
          <div class="checkbox-caption">Send Notification</div>
        </div>
        <div>
          <span class="text-muted">Total amount</span>
          <strong class="ng-binding">{{ receivePaymentSum | currency: '$': 2 }}</strong>
        </div>
      </div>

    </div>
  </div>
</div>
