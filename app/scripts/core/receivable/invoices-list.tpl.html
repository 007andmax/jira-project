<ul class="qt-list company-devices qt-users invoices-list">
  <li class="list-heading clearfix">
    <div class="col-md-1">
      <label class="control checkbox pull-left">
        <input type="checkbox">
        <span class="control-indicator"></span>
      </label>
      Invoice#
    </div>
    <div class="col-md-3">Company</div>
    <div class="col-md-2">Invoice date</div>
    <div class="col-md-2">Read On</div>
    <div class="col-md-1" style="width: 13.6%;">Amount</div>
    <div class="col-md-2">Due Date</div>
    <div class="col-md-1" style="width: 3%;"></div>
  </li>
  <li class="list-item" ng-repeat="invoice in receivableInvoicesData.list | filter: filterByCompany | orderBy: orderByForInvoices : orderInvoices.reverse track by invoice.id"
      ng-controller="quicktech.core.receivable.invoiceCtrl">
    <div class="col-md-1">
      <label class="control checkbox pull-left">
        <input type="checkbox">
        <span class="control-indicator"></span>
      </label>
      INV {{invoice.number}}
    </div>
    <div class="col-md-3">
      <bold>{{company.name}}</bold>
    </div>
    <div class="col-md-2">{{invoice.date | date:'dd MMM yyyy'}}</div>
    <div class="col-md-2">10 Dec 2018</div>
    <div class="col-md-1" style="width: 13.6%;">{{invoice.sum | currency: '$': 2 }}</div>
    <div class="col-md-2">
      <p class="invoice-status status-success">Over due by 5 days</p>
      <!--<p class="network-scan-status status-success"></p>-->
      <!--<p class="network-scan-status status-danger"></p>-->
    </div>
    <div class="col-md-1" style="width: 3%;">
      <div uib-dropdown smart-dropdown-menu-position="dropdown-menu">
        <div uib-dropdown-toggle uib-tooltip="more"
             tooltip-placement="top"
             tooltip-append-to-body="true"
             tooltip-popup-delay="2000">
          <i style="margin-left: 5px;" class="icn-more-light-grey icn-sm pointer dev-btn"></i>
        </div>
        <ul class="dropdown-menu" role="menu">
          <li><a>Resend</a></li>
          <li><a>Rollback</a></li>
          <li><a>Remove</a></li>
        </ul>
      </div>
    </div>
  </li>
