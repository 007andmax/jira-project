<div class="product-list-report" convert-to-pdf="/reports/pdf" email-endpoint="/reports/email"
     selector=".product-list-ticket" disable-selector=".open-pdf-btn" file-name="{{ reportName }}">
  <p class="report-title">Tech Ticket Report</p>

  <div class="tech-button">
    <report-menu is-tech-report="true" send-to-mail="sendToMail" get-user-name="getUserName"
                 is-radio-button-hidden="true"open-in-pdf="openInPdf"
                 download-as-pdf="downloadAsPdf" email-pattern="emailPattern"></report-menu>
  </div>
  <div class="product-list-ticket product-list-ticket-tech">
    <div class="header-product-list-ticket" ng-if="techReportTicketCreated.lines">
      <h4>Created Tickets vs Closed</h4>
    </div>
    <nvd3 options="options" data="data" ng-if="responseSuccess"></nvd3>
    <div class="header-product-list-ticket clearfix" ng-if="techReportTicketCreated.lines">
      <div class="col-md-3">Total New Tickets: <span>{{techReportTicketCreated.totalCreated}} tickets</span></div>
      <div class="col-md-3">Completed Tickets: <span>{{techReportTicketCreated.totalClosed}} tickets</span></div>
    </div>
  </div>
</div>
