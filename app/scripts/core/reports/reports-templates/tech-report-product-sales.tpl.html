<div class="product-list-report" convert-to-pdf="/reports/pdf" email-endpoint="/reports/email"
     selector=".product-list-ticket" disable-selector=".open-pdf-btn" file-name="{{ reportName }}" orientation="LANDSCAPE">
  <p class="report-title">Tech Sales Report </p>
  <i class="back-page" ui-sref="reports"></i>
  <div class="tech-button">
    <report-menu is-tech-report="true" send-to-mail="sendToMail" get-user-name="getUserName" is-report-available="isReportAvailable"
                 open-in-pdf="openInPdf" download-as-pdf="downloadAsPdf" email-pattern="emailPattern"></report-menu>
  </div>
  <div class="product-list-ticket product-list-ticket-tech">
    <div class="header-product-list-ticket" ng-if="techReportProductSales.lines">
      <h4 ng-show="techReportProductSales.type =='BILLED_TIME'">Billed Time</h4>
      <p ng-show="techReportProductSales.type =='PRODUCT_SOLD'">Products Sold</p>
    </div>
    <nvd3 options="options" data="data" ng-if="responseSuccess"></nvd3>
    <div class="clearfix" ng-if="techReportProductSales.lines">
      <div ng-show="techReportProductSales.type == 'BILLED_TIME'">Total Hours: <span>{{techReportProductSales.total}} hours</span>
      </div>
      <div ng-show="techReportProductSales.type == 'PRODUCT_SOLD'">Potential revenue: <span>${{techReportProductSales.total}}</span>
      </div>
    </div>
  </div>
</div>
