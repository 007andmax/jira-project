<div class="panel-body">
  <div class="primary-contacts-wrapper">

    <div class="primary-contact active" change-contact
         contact-index="contactIndex" ng-model="currentContact" style="display: block;">

      <div class="avatar">
        <img ng-src="{{ getContactAvatarUrl(currentContact) }}" alt="..." class="img-circle avatar-120">
      </div>

      <div class="person-name">{{ getUserName(currentContact) }}</div>

      <div class="status-designation clearfix">
        <div class="status-inner" style="display: inline-block;">
        <i class="dot" ng-class="{'on': currentContact.online, 'off': !currentContact.online}"></i>

        <span class="label label-light">{{ currentContact.designation }}</span>

        <div class="icn-sm {{ getUserSubscribeClass(currentContact) }} persistent-tooltip"
             tooltip-append-to-body="true" tooltip-placement="top"
             uib-tooltip="{{ getUserSubscribeTooltip(currentContact) }}"></div>
        </div>
      </div>

      <div class="contact-number"
           ng-repeat="phoneNumber in currentContact.phoneNumbers | orderBy: 'priority' | limitTo: 1">
        <i class="icn-sm"
           ng-class="{'icn-iphone': phoneNumber.typeNumber === 'MOBILE',
                      'icn-user-fax': phoneNumber.typeNumber === 'FAX',
                      'icn-user-phone': phoneNumber.typeNumber === 'OFFICE'}"></i>
        {{ phoneNumber.number }}
      </div>

      <div class="contact-actions">

        <div class="btn btn-default pull-left has-tooltip"
             tooltip-placement="top" tooltip-append-to-body="true" uib-tooltip="Email">
          <i class="icn-sm icn-user-mail"></i>
        </div>

        <div class="btn btn-default pull-left has-tooltip"
             tooltip-placement="top" tooltip-append-to-body="true" uib-tooltip="chat">
          <i class="icn-sm icn-user-chat"></i>
        </div>

      </div>

    </div>

  </div>
</div>
