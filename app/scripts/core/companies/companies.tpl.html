  <div class="companies-list clearfix">

    <div class="company clearfix" ng-repeat="company in companies" ng-controller="quicktech.core.companies.companyCtrl">
      <div class="company-cover-wrapper" style="background-image:url('/company/{{ company.id }}/cover')">
        <div class="overlay"></div>
        <div class="archive-btn"><a class="black-btn" href="#"><span class="icn archive-company"></span></a></div>
        <div class="company-info">
          <h3 class="name"> {{ company.name }} </h3>

          <div class="ac-start-wrapper clearfix">
            <ul class="rating rating-5 clearfix pull-left">
              <li class="icn-star-full star-1"></li>
              <li class="icn-star-full star-2"></li>
              <li class="icn-star-full star-3"></li>
              <li class="icn-star-full star-4"></li>
              <li class="icn-star-half star-5"></li>
            </ul>

            <div class="dot-sep pull-left"></div>

            <a href="#" class="icn-wrapper pull-left" popover="{{ company.description }}" popover-placement="bottom"
               popover-trigger="mouseenter">
              <span class="icn company-detail"></span>
            </a>

            <a href="#" class="icn-wrapper tp-hide pull-left" tooltip-placement="top" tooltip="Edit Company info">
              <span class="icn icn-edit-tag"></span>
            </a>
          </div>
        </div>
      </div>

      <div class="company-information clearfix">
        <div class="clearfix name-wrpper">
          <a herf="" class="pull-left thumb avatar m-r">
            <img ng-src="{{ getContactAvatarUrl(primaryContact) }}" alt="..." class="img-circle">
          </a>

          <div class="user-inf pull-left">
            <h4 class="name">{{ primaryContact.firstName }} {{ primaryContact.lastName }}</h4>

            <div class="status pull-left"><span class="dot on"></span> <span
              class="label label-white pull-left label-ticket-number">{{ primaryContact.designation }}</span>


              <ul class="user-badges pull-left">
                <li id="has-ticket-updates1" class="icn icn-ticket-updates tp-hide" tooltip="subscriber ticket updates"
                    tooltip-placement="top" ng-show="primaryContact.subscription.ticket"></li>
                <li id="has-invoice-updates1" class="icn icn-invoice-updates tp-hide" tooltip-placement="top"
                    tooltip="subscriber invoice updates" ng-show="primaryContact.subscription.ticket"></li>
                <!--<li id="has-admin1" class="icn admin tp-hide" data-title="admin" data-toggle="tooltip"-->
                <!--data-container="#has-admin1" data-placement="top" data-original-title="" title=""></li>-->
              </ul>

            </div>
          </div>
        </div>

        <div class="clearfix">
          <div class="ci number clearfix">
            <span class="icn icn-fax-machine"></span>
            <span class="txt">{{ primaryPhone.number }}</span>
          </div>
          <div class="ci location clearfix">
            <span class="icn icn-sb-location"></span>
            <span class="txt">{{ primaryAddress.address }}</span>
          </div>
        </div>

        <div class="clearfix company-actions">
          <a href="#" class="btn btn-scooter btn-update pull-left" style="margin-right: 10px;">
            <div class="icn-white-mail"></div>
          </a>

          <div class="btn pull-left btn-white-gray btn-cr dropdown-toggle tooltip-dp" data-placement="top"
               data-original-title="chat">
            <span class="icn icn-user-chat"></span>
          </div>
        </div>
      </div>
    </div>
