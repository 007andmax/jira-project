<div role="tabpanel" class="tab-pane" style="display: block">
  <ul class="qt-list qt-users" style="margin-bottom: 150px">

    <li class="list-heading" style="cursor: pointer !important;">

      <div class="col-1" ng-click="setOrderByUsers('name')">

        <label class="control checkbox pull-left" ng-show="users.length > 0">
          <input type="checkbox" class="ng-pristine ng-untouched ng-valid ng-empty"
                 ng-checked="isSelectAllUsers" ng-click="selectAllUsers()">
          <span class="control-indicator"></span>
        </label>

        <span>Name</span>
        <i class="icn-sm sort-icon icn-sort"
           ng-class="{'rotate': orderUsersTab.reverse, 'active': orderUsersTab.field === 'name'}"></i>
      </div>

      <div class="col-2"><span>Contact No.</span></div>

      <div class="col-3" ng-click="setOrderByUsers('type')">
        <span>Type</span>
        <i class="icn-sm sort-icon icn-sort"
           ng-class="{'rotate': orderUsersTab.reverse, 'active': orderUsersTab.field === 'type'}"></i>
      </div>

      <div class="col-3-2">Subscription</div>

      <div class="col-4" ng-click="setOrderByUsers('ticket')">
        <span>Tickets</span>
        <i class="icn-sm sort-icon icn-sort"
           ng-class="{'rotate': orderUsersTab.reverse, 'active': orderUsersTab.field === 'ticket'}"></i>
      </div>

      <div class="col-5"></div>

    </li>

    <li ng-repeat="user in users | orderBy: orderByForUsers: orderUsersTab.reverse"
        ng-controller="quicktech.core.companies.userTabCtrl">

      <div class="col-1">
        <div class="user-bio">

          <label class="control checkbox pull-left">
            <input type="checkbox" ng-change="changeSelectedUsers()" ng-model="selectedUsers[user.id]">
            <span class="control-indicator"></span>
          </label>

          <div class="pull-left avatar">
            <img ng-src="{{ getUserAvatarUrl(user) }}" alt="..." class="img-circle avatar-38">
            <i class="on bottom"></i>
          </div>

          <div class="user-name pull-left">{{ getUserName(user) }}</div>
          <span class="label label-light">{{ user.designation }}</span>

        </div>
      </div>

      <div class="col-2">
        <div class="clearfix">

          <span class="user-contact-no" ng-repeat="phoneNumber in user.phoneNumbers">
            <i class="icn-sm" ng-class="{'icn-iphone': phoneNumber.typeNumber === 'MOBILE',
                      'icn-user-fax': phoneNumber.typeNumber === 'FAX',
                      'icn-user-phone': phoneNumber.typeNumber === 'OFFICE'}"></i>
            {{ phoneNumber.number }}
          </span>

        </div>
      </div>

      <div class="col-3">
        <div class="user-account-type dropdown">

          <div class="label-wrapper" aria-expanded="false" data-toggle="dropdown">
            <span>
              {{ user.role }}
            </span>
          </div>

          <ul class="dropdown-menu dropdown-privilege">

            <li ng-class="{'active': user.role === 'USER'}">
              <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserRole('USER')">
                User
              </a>
            </li>

            <li ng-class="{'active': user.role === 'ADMIN'}">
              <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserRole('ADMIN')">
                Administrator
              </a>
            </li>

          </ul>

        </div>
      </div>

      <div class="col-3-2 dropdown">

        <div id="has-invoice-updates1" class="persistent-tooltip" aria-expanded="false" data-toggle="dropdown"
             tooltip="{{ getUserSubscribeTooltip(user) }}" tooltip-placement="top">
          <i class="icn-sm {{ getUserSubscribeClass(user) }}"></i>
        </div>

        <ul class="dropdown-menu dropdown-subscribe">

          <li>
            <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserSubscription('ticket')">
              <div class="clearfix">
                <label class="control checkbox pull-left">
                  <input type="checkbox" ng-checked="userSubscriptionsByCompanyId[user.id].ticket">
                  <span class="control-indicator"></span> Ticket Updates
                </label>
              </div>
            </a>
          </li>

          <li ng-hide="users.length === 1 || isLastUserWithInvoiceSubscription(user.id)">
            <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserSubscription('invoice')">
              <div class="clearfix">
                <label class="control checkbox pull-left">
                  <input type="checkbox" ng-checked="userSubscriptionsByCompanyId[user.id].invoice">
                  <span class="control-indicator"></span> Invoice Updates
                </label>
              </div>
            </a>
          </li>

        </ul>

      </div>

      <div class="col-4">
        <span class="user-submitted-tickets">
          {{ user.userStatistic.ticketsSubmitted || '0' }}
        </span>
      </div>

      <div class="col-5">
        <div class="list-actions pull-right">

          <!--<div class="dropdown pull-left">-->

          <!--<div class="btn btn-default pull-left has-tooltip disabled"-->
          <!--data-toggle="dropdown" tooltip-placement="top" tooltip="logged in devices">-->
          <!--<i class="icn-sm icn-user-devices"></i>-->
          <!--</div>-->

          <!--<ul class="dropdown-menu devices-menu dropdown-menu-right" role="menu">-->
          <!--<li><a tabindex="-1" href="javascript:void(0)"><i class="icn-lg icn-server"></i>File.Server</a></li>-->
          <!--<li><a tabindex="-1" href="javascript:void(0)"><i class="icn-lg icn-computer"></i>Skynet.2013</a></li>-->
          <!--<li><a tabindex="-1" href="javascript:void(0)"><i class="icn-lg icn-mobile"></i>Mobile.Jack</a></li>-->
          <!--<li><a tabindex="-1" href="javascript:void(0)"><i class="icn-lg icn-fax"></i>Fax.Sublime</a></li>-->
          <!--</ul>-->
          <!--</div>-->

          <div class="btn btn-default btn-user-mail pull-left has-tooltip" ng-show="user.primaryEmail"
               email-to="user.primaryEmail" tooltip-placement="top" tooltip="Email">
            <i class="icn-sm icn-user-mail"></i>
          </div>

          <div class="btn btn-default pull-left has-tooltip" ng-click="archiveUser()" ng-if="users.length > 1"
               tooltip-placement="top" tooltip="Archive this Contact">
            <i class="icn-sm icn-remove-token"></i>
          </div>

          <!--<div class="btn btn-default btn-user-chat pull-left has-tooltip disabled"-->
          <!--tooltip-placement="top" tooltip="chat" ng-click="startChat()">-->
          <!--<i class="icn-sm icn-user-chat"></i>-->
          <!--</div>-->

        </div>
      </div>
    </li>

  </ul>
</div>
