<div role="tabpanel" class="tab-pane" style="display: block;">

  <ul class="qt-list qt-devices" style="margin-bottom: 150px" ng-controller="quicktech.core.companies.deviceTabCtrl">

    <li class="list-heading">
      <div class="col-1" ng-click="sortDevicesTab('hostName')">

        <label class="control checkbox pull-left">
          <input type="checkbox" class="ng-pristine ng-untouched ng-valid ng-empty"
                 ng-checked="isSelectAllDevices" ng-click="selectAllDevices()">
          <span class="control-indicator"></span>
        </label>

        <span>NAME</span>
        <i class="icn-sm" style="margin-left: 65px;"
           ng-class="{'icn-collapse': orderDevicesBy === '-hostName', 'icn-expand': orderDevicesBy === 'hostName'}"></i>
      </div>
      <div class="col-2" style="width: 367px; height: 12px">
        <!--<span>DESCRIPTION</span>-->
      </div>

      <div class="col-3" ng-click="sortDevicesTab('type')">
        <!--style="width: 145px; height: 12px"-->
        <span>TYPE</span>
        <i class="icn-sm" style="margin-left: 35px;"
           ng-class="{'icn-collapse': orderDevicesBy === '-type', 'icn-expand': orderDevicesBy === 'type'}"></i>
      </div>

      <div class="col-4" ng-click="sortDevicesTab('userName')">
        <span>USERNAME</span>
        <i class="icn-sm" style="margin-left: 60px;"
           ng-class="{'icn-collapse': orderDevicesBy === '-userName', 'icn-expand': orderDevicesBy === 'userName'}"></i>
      </div>

      <div class="col-5" ng-click="sortDevicesTab('ip')">
        <span>LAN IP</span>
        <i class="icn-sm" style="margin-left: 45px;"
           ng-class="{'icn-collapse': orderDevicesBy === '-ip', 'icn-expand': orderDevicesBy === 'ip'}"></i>
      </div>
      <div class="col-6">&nbsp;</div>
    </li>

        <div>

          <i class="device-status" ng-class="{'on': agent.online, 'off': !agent.online}"></i>

          <label class="control checkbox pull-left">
            <input type="checkbox" ng-model="selectDevices[agent.agentId]" ng-change="changeSelectDevices()">
            <span class="control-indicator" ng-show="agent.online"></span>
          </label>

          <div class="checkbox-caption">
            <span>{{ (agent.hostName | unknownFilter) || 'Name is not defined' }}</span>
          </div>
        </div>
      </div>
