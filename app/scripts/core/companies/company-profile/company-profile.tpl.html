<div class="company-profile-content">

  <div class="company-profile-header">

    <div class="company-new-cover-wrapper" ng-if="!isShowEditCover"
         ng-style="{'background': company.cover ? 'url(' + getCompanyCoverUrl(company) + ')' : 'rgba(0,0,0,.8)', 'background-size': 'cover'}">
      <div class="background-layer">
        <!--company-cover-wrapper-->

        <div class="container company-info">
          <ul class="company-name">
            <div class="company-short-info">
              <div class="dropdown" style="transform: translateY(50%)"
                   ng-if="PermissionsService.isAllowed('ARCHIVE_COMPANIES')"
                   ng-click="archiveCompany()"
                   tooltip-placement="top" tooltip-append-to-body="true" tooltip="Archive Company">
                <i class="icn-sm icn-archive-company"></i>
              </div>

              <div class="dropdown">

                <a href="javascript:void(0)" class="hit-area ha-20-16 has-tooltip"
                   data-toggle="dropdown" aria-expanded="false"
                   tooltip-placement="top" tooltip-append-to-body="true" tooltip="Change Cover">
                  <i class="icn-md icn-cover"></i>
                </a>

                <ul class="dropdown-menu">

                  <li role="presentation">
                    <a role="menuitem" tabindex="-1" href="javascript:void(0)" ng-click="showEditCover(true)">
                      Upload Photo...
                    </a>
                  </li>

                  <li role="presentation" ng-show="company.cover">
                    <a role="menuitem" tabindex="-1" href="javascript:void(0)" ng-click="restoreDefaultCover()">
                      Restore Default Photo...
                    </a>
                  </li>

                  <li role="presentation" ng-show="company.cover">
                    <a role="menuitem" tabindex="-1" href="javascript:void(0)" ng-click="showEditCover()">
                      Reposition...
                    </a>
                  </li>

                </ul>
              </div>

              <a href="javascript:void(0)" class="hit-area has-tooltip"
                 ng-if="PermissionsService.isAllowed('EDIT_COMPANIES')"
                 ui-sref="editCompany( { companyId: company.id } )"
                 tooltip-placement="top" tooltip-append-to-body="true" tooltip="Edit">
                <i class="icn-md icn-edit-tag"></i>
              </a>

            </div>
            {{ companyData.name }}
            <li class="info-type">Address:</li>
            <li class="info-type">Phone:</li>
          </ul>



          <div class="avatar company-user-avatar img-circle" ng-hide="getError().loadingInProcess">

          <img style="width: 100%;" ng-src="/users/default/image" class="no-avatar img-circle" ng-class="{'hide': model.cropped.id}" src="/users/default/image">
          <img style="width: 100%;" ng-class="{'hide': !model.cropped.id}" style="max-height: 100%;" class="hide img-circle">

          <div class="reposition ng-hide" ng-show="model.origin &amp;&amp; !getError().loadingInProcess" change-position-button="">
            Reposition...
          </div>

        </div>
            <ul class="user-company-contact clearfix">
              <li class="info-type">Primary contact:</li>
              <li class="info-type">Contact email:</li>
              <li class="info-type">Contact phone:</li>
            </ul>


        <div class="button-container">
          <i class="icn-retina new-ticket pull-left"></i>
          <i class="icn-retina new-user pull-left"></i>
          <i class="icn-retina save-download pull-right"></i>
        </div>
