<div ng-controller="quicktech.core.companies.ticketsTabCtrl" ticket-uploader>

  <div class="container-ticket-list pull-left">
    <div class="empty-page-helper" ng-if="!tickets.length && !loadingOrRendering">
      <p style="opacity: 0.57">There are no tickets</p>
    </div>

    <div class="ticket-list">
      <ul class="tickets" tu-tickets-container>
        <li class="ticket {{ ticket.priorityLevel.toLowerCase() }}-priority-border" ng-repeat="ticket in tickets track by ticket.id"
            ng-controller="quicktech.core.tickets.ticketCtrl" on-finish-render="onFinishRendering()"
            ng-class="{'selected' : selectedTickets[ticket.id], 'closed': ticket.status === 'COMPLETED', 'active': ticket.id === currentOpeningTicket}"
            ng-click="openTicket(ticket.id)">
          <div ng-include="'/htdml/scripts/core/tickets/ticket.tpl.html'"></div>
        </li>
      </ul>
    </div>
  </div>

  <!--<div ui-view></div>-->
  <div ng-if="openTicketDetailsPage" ng-include="'/html/scripts/core/tickets/ticket-details.tpl.html'" ng-controller="quicktech.core.tickets.ticketDetailsCtrl"></div>

</div>
