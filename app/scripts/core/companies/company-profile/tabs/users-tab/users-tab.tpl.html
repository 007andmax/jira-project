<div role="tabpanel" class="tab-pane" style="display: block" ng-if="PermissionsService.isAllowed('VIEW_USERS')">
  <ul class="qt-list qt-users" style="margin-bottom: 75px; margin-top: 70px">

    <li class="list-heading" fixed-block-top offset-top="132">
      <div class="col-md-3" style="width: 26%;" ng-click="setOrderByUsers('name')">
        <label class="control checkbox pull-left" ng-show="users.length > 0">
          <input type="checkbox" class="ng-pristine ng-untouched ng-valid ng-empty"
                 ng-model="selectedUsers['all']" ng-click="selectAllUsers(selectedUsers['all'])">
          <span class="control-indicator"></span>
        </label>

        <span class="sort-span">Name<i class="icn-sm sort-icon icn-sort"
                                       ng-class="{'rotate': orderUsersTab.reverse, 'active': orderUsersTab.field === 'name'}"></i></span>
      </div>

      <div class="col-md-2">
        <span>E-Mail</span>
      </div>

      <div class="col-md-2"><span>Contact No.</span></div>

      <div class="col-md-1" style="width: 6%;" ng-click="setOrderByUsers('type')">
        <span class="sort-span">Type<i class="icn-sm sort-icon icn-sort"
                                       ng-class="{'rotate': orderUsersTab.reverse, 'active': orderUsersTab.field === 'type'}"></i></span>
      </div>
      <div class="col-md-1 text-center">
        <span>Primary contact</span>
      </div>
      <div class="col-md-1 text-center sub-col">Subscription</div>


      <div class="col-md-1 " ng-click="setOrderByUsers('ticket')">
        <span class="sort-span" style="text-align: center; width: 100%;">Tickets<i class="icn-sm sort-icon icn-sort"
                                                                                   ng-class="{'rotate': orderUsersTab.reverse, 'active': orderUsersTab.field === 'ticket'}"></i></span>
      </div>

      <div class="col-md-1"></div>

    </li>

    <li ng-repeat="user in users | orderBy: orderByForUsers: orderUsersTab.reverse track by user.id"
        ng-controller="quicktech.core.companies.usersTabCtrl" ng-if="!user.deletedAt"
        show-model-element="{{ 'show-user-on-save-' + user.id }}">

      <div class="users-list-wrapper">
        <div class="col-md-3 column-name" style="display: flex;align-items: center; width: 26%;">
          <label class="control checkbox ">
            <input type="checkbox" ng-model="selectedUsers[user.id]" ng-change="changeSelectedUsers(selectedUsers)">
            <span class="control-indicator"></span>
          </label>

          <div style="display: flex; overflow: hidden;">
            <div class=" avatar">
              <img ng-src="{{ getUserAvatarUrl(user) }}" alt="..." class="img-circle avatar-38">
              <i class="on bottom"></i>
            </div>
            <div style="width: 90%;">
              <p style="padding-right: 10px;" class="user-name" uib-tooltip="{{ getUserName(user) }}"
                 trimmed-tooltip-checker="getUserName(user)">
              </p>
              <p class="label label-light">{{ user.designation }}</p>
            </div>
          </div>
        </div>

        <div class="col-md-2">
          <p class="ellipsis" uib-tooltip="{{ user.primaryEmail }}"
             trimmed-tooltip-checker="user.primaryEmail">
          </p>
        </div>

        <div class="col-md-2">
          <div class="clearfix">
          <span class="user-contact-no ellipsis" ng-repeat="phoneNumber in user.phoneNumbers">
            <i class="icon-sm" ng-class="{'icn-iphone': phoneNumber.typeNumber === 'MOBILE',
            'icn-user-fax': phoneNumber.typeNumber === 'FAX',
            'icn-user-phone': phoneNumber.typeNumber === 'OFFICE'}"></i>
            {{ phoneNumber.number }}
          </span>
          </div>
        </div>

        <div class="col-md-1" style="width: 6%;">
          <div class="user-account-type" uib-dropdown>

            <div aria-expanded="false" uib-dropdown-toggle>
            <span>
              {{ user.role }}
            </span>
            </div>

            <ul class="dropdown-menu dropdown-privilege">

              <li ng-class="{'active': user.role === 'USER'}">
                <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserRole('USER')">
                  User
                </a>
              </li>

              <li ng-class="{'active': user.role === 'ADMIN'}">
                <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserRole('ADMIN')">
                  Administrator
                </a>
              </li>

            </ul>

          </div>
        </div>

        <div class="col-md-1 text-center">
          <label class="control checkbox" style="margin-right: 0;">
            <!--<input type="radio" name="primaryContact"-->
            <!--ng-checked="user.isContact" ng-value="true"-->
            <!--ng-change="changePrimaryContact(user)" ng-model="user.isContact">-->
            <input type="radio" name="radio-isContact"
                   ng-value="true" ng-model="user.isContact"
                   ng-checked="user.isContact"
                   ng-click="changePrimaryContact(user)"/>
            <span class="control-indicator"></span>
          </label>
        </div>

        <div class="col-md-1" uib-dropdown>

          <div id="has-invoice-updates1" class="persistent-tooltip" aria-expanded="false" uib-dropdown-toggle
               tooltip-placement="top">
            <img src="images/input-icons/ticket-update-green.png" alt="" ng-show="user.subscription.ticket"
                 uib-tooltip="Ticket Updates">
            <img src="images/input-icons/invoice-update-orange.png" alt="" ng-show="user.subscription.invoice"
                 uib-tooltip="Invoice Updates">
            <img src="images/input-icons/tick-manager-blue.png" alt="" ng-show="user.subscription.ticketManager"
                 uib-tooltip="Ticket Manager">
            <div class="no-subscribe" uib-tooltip="No Subscriptions"
                 ng-show="!user.subscription.ticket && !user.subscription.invoice && !user.subscription.ticketManager"></div>
          </div>

          <ul class="dropdown-menu dropdown-subscribe" style="width: 105%;">

            <li>
              <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserSubscription('ticket')">
                <div class="clearfix">
                  <label class="control checkbox pull-left">
                    <input type="checkbox" ng-checked="userSubscriptionsByCompanyId[user.id].ticket">
                    <span class="control-indicator"></span> Ticket Updates
                  </label>
                </div>
              </a>
            </li>

            <li>
              <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserSubscription('ticketManager')">
                <div class="clearfix">
                  <label class="control checkbox pull-left">
                    <input type="checkbox" ng-checked="userSubscriptionsByCompanyId[user.id].ticketManager">
                    <span class="control-indicator"></span> Ticket Manager
                  </label>
                </div>
              </a>
            </li>

            <li>
              <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserSubscription('invoice')">
                <div class="clearfix">
                  <label class="control checkbox pull-left"
                         ng-disabled="users.length === 1 || isLastUserWithInvoiceSubscription(user.id)">
                    <input type="checkbox" ng-checked="userSubscriptionsByCompanyId[user.id].invoice"
                           ng-disabled="users.length === 1 || isLastUserWithInvoiceSubscription(user.id)">
                    <span class="control-indicator"></span> Invoice Updates
                  </label>
                </div>
              </a>
            </li>

          </ul>

        </div>

        <div class="col-md-1 text-center">
        <span class="user-submitted-tickets ">
          {{ user.userStatistic.ticketsSubmitted || '0' }}
        </span>
        </div>

        <div class="col-md-1" style="padding: 0;">
          <div class="list-actions">

            <div class="btn btn-icn btn-default  has-tooltip" create-new-entity="user" item="user"
                 ng-if="PermissionsService.isAllowed('EDIT_USERS')"
                 tooltip-placement="top" uib-tooltip="Edit">
              <i class="icon-sm edit-icon"></i>
            </div>

            <div class="btn btn-icn btn-default btn-user-mail  has-tooltip" custom-disabled="{{ !user.primaryEmail }}"
                 email-to="user.primaryEmail" tooltip-placement="top" uib-tooltip="Email">
              <i class="icon-sm icn-user-mail"></i>
            </div>

            <div class="right-align-tooltip">
              <div class="btn btn-icn btn-default pad-top has-tooltip" ng-click="archiveUser()"
                   custom-disabled="{{ !PermissionsService.isAllowed('ARCHIVE_USERS')
                      || user.isContact || isLastUserWithInvoiceSubscription(user.id) }}"
                   tooltip-placement="top" uib-tooltip="Archive this User">
                <i class="icn-sm icn-remove-old"></i>
              </div>
            </div>

          </div>
        </div>
      </div>
    </li>

  </ul>
</div>
