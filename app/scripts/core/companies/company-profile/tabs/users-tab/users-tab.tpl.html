<div role="tabpanel" class="tab-pane" style="display: block" ng-if="PermissionsService.isAllowed('VIEW_USERS')">
  <ul class="qt-list qt-users" style="margin-bottom: 150px; margin-top: 70px">

    <li class="list-heading" fixed-block-top offset-top="148">
      <div class="col-1" ng-click="setOrderByUsers('name')">
        <label class="control checkbox pull-left" ng-show="users.length > 0">
          <input type="checkbox" class="ng-pristine ng-untouched ng-valid ng-empty"
                 ng-model="selectedUsers['all']" ng-click="selectAllUsers(selectedUsers['all'])">
          <span class="control-indicator"></span>
        </label>

        <span class="sort-span">Name<i class="icn-sm sort-icon icn-sort"
                                       ng-class="{'rotate': orderUsersTab.reverse, 'active': orderUsersTab.field === 'name'}"></i></span>
      </div>

      <div class="col-1-1">
        <span>E-Mail</span>
      </div>

      <div class="col-2"><span>Contact No.</span></div>

      <div class="col-3" ng-click="setOrderByUsers('type')">
        <span class="sort-span">Type<i class="icn-sm sort-icon icn-sort"
                                       ng-class="{'rotate': orderUsersTab.reverse, 'active': orderUsersTab.field === 'type'}"></i></span>
      </div>

      <div class="col-3-2">Subscription</div>

      <div class="col-4" ng-click="setOrderByUsers('ticket')">
        <span class="sort-span">Tickets<i class="icn-sm sort-icon icn-sort"
                                          ng-class="{'rotate': orderUsersTab.reverse, 'active': orderUsersTab.field === 'ticket'}"></i></span>
      </div>

      <div class="col-5"></div>

    </li>

    <li ng-repeat="user in users | orderBy: orderByForUsers: orderUsersTab.reverse track by user.id"
        ng-controller="quicktech.core.companies.usersTabCtrl"
        show-model-element="{{ 'show-user-on-save-' + user.id }}">

      <div class="users-list-wrapper">
        <div class="col-1">
          <div class="user-bio">

            <label class="control checkbox pull-left">
              <input type="checkbox" ng-model="selectedUsers[user.id]" ng-change="changeSelectedUsers(selectedUsers)">
              <span class="control-indicator"></span>
            </label>

            <div class="pull-left avatar">
              <img ng-src="{{ getUserAvatarUrl(user) }}" alt="..." class="img-circle avatar-38">
              <i class="on bottom"></i>
            </div>

            <div class="user-name pull-left" trimmed-tooltip="0"
                 uib-tooltip="{{ getUserName(user) }}" tooltip-enable="{{ isShowTooltip[0]() }}">
              <span trimmed-tooltip-container>{{ getUserName(user) }}</span>
            </div>
            <span class="label label-light">{{ user.designation }}</span>

          </div>
        </div>

        <div class="col-1-1">
          <p class="ellipsis">{{ user.primaryEmail }}</p>
        </div>

        <div class="col-2">
          <div class="clearfix">
          <span class="user-contact-no" ng-repeat="phoneNumber in user.phoneNumbers">
            <i class="icn-sm" ng-class="{'icn-iphone': phoneNumber.typeNumber === 'MOBILE',
            'icn-user-fax': phoneNumber.typeNumber === 'FAX',
            'icn-user-phone': phoneNumber.typeNumber === 'OFFICE'}"></i>
            {{ phoneNumber.number }}
          </span>
          </div>
        </div>

        <div class="col-3">
          <div class="user-account-type" uib-dropdown>

            <div class="label-wrapper text-center" aria-expanded="false" uib-dropdown-toggle>
            <span>
              {{ user.role }}
            </span>
            </div>

            <ul class="dropdown-menu dropdown-privilege">

              <li ng-class="{'active': user.role === 'USER'}">
                <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserRole('USER')">
                  User
                </a>
              </li>

              <li ng-class="{'active': user.role === 'ADMIN'}">
                <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserRole('ADMIN')">
                  Administrator
                </a>
              </li>

            </ul>

          </div>
        </div>

        <div class="col-3-2" uib-dropdown>

          <div id="has-invoice-updates1" class="persistent-tooltip" aria-expanded="false" uib-dropdown-toggle
               uib-tooltip="{{ getUserSubscribeTooltip(user) }}" tooltip-placement="top">
            <i class="icn-sm {{ getUserSubscribeClass(user) }}"></i>
          </div>

          <ul class="dropdown-menu dropdown-subscribe">

            <li>
              <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserSubscription('ticket')">
                <div class="clearfix">
                  <label class="control checkbox pull-left">
                    <input type="checkbox" ng-checked="userSubscriptionsByCompanyId[user.id].ticket">
                    <span class="control-indicator"></span> Ticket Updates
                  </label>
                </div>
              </a>
            </li>

            <li>
              <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserSubscription('ticketManager')">
                <div class="clearfix">
                  <label class="control checkbox pull-left">
                    <input type="checkbox" ng-checked="userSubscriptionsByCompanyId[user.id].ticketManager">
                    <span class="control-indicator"></span> Ticket Manages
                  </label>
                </div>
              </a>
            </li>

            <li ng-hide="users.length === 1 || isLastUserWithInvoiceSubscription(user.id)">
              <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserSubscription('invoice')">
                <div class="clearfix">
                  <label class="control checkbox pull-left">
                    <input type="checkbox" ng-checked="userSubscriptionsByCompanyId[user.id].invoice">
                    <span class="control-indicator"></span> Invoice Updates
                  </label>
                </div>
              </a>
            </li>

          </ul>

        </div>

        <div class="col-4">
        <span class="user-submitted-tickets">
          {{ user.userStatistic.ticketsSubmitted || '0' }}
        </span>
        </div>

        <div class="col-5">
          <div class="list-actions pull-right">

            <div class="btn btn-default pull-left has-tooltip" create-new-entity="user" item="user"
                 ng-if="PermissionsService.isAllowed('EDIT_USERS')"
                 tooltip-placement="top" uib-tooltip="Edit">
              <i class="icn-sm icn-edit"></i>
            </div>

            <div class="btn btn-default btn-user-mail pull-left has-tooltip" custom-disabled="{{ !user.primaryEmail }}"
                 email-to="user.primaryEmail" tooltip-placement="top" uib-tooltip="Email">
              <i class="icn-sm icn-user-mail"></i>
            </div>

            <div class="btn btn-default pull-left has-tooltip" ng-click="archiveUser()"
                 custom-disabled="{{ !PermissionsService.isAllowed('ARCHIVE_USERS')
                      || user.isContact || isLastUserWithInvoiceSubscription(user.id) }}"
                 tooltip-placement="top" uib-tooltip="Archive this User">
              <i class="icn-sm icn-remove-token"></i>
            </div>
          </div>
        </div>
      </div>
    </li>

  </ul>
</div>
