<div class="tab-pane active">
  <ul class="qt-list qt-agents" style="margin-top: 34px">
    <li class="list-heading" fixed-block-top offset-top="148">

      <div class="col-1" ng-click="sortAgentTab('hostName')">
            <span class="sort-span">INSTALLED ON<i class="icn-sm sort-icon icn-sort"
                                                   ng-class="{'rotate': orderAgentBy === '-hostName', 'active': orderAgentBy.indexOf('hostName') > -1}"></i></span>

      </div>

      <div class="col-2" ng-click="sortAgentTab('userName')">
            <span class="sort-span">DOMAIN/USERNAME<i class="icn-sm sort-icon icn-sort"
                                                      ng-class="{'rotate': orderAgentBy === '-userName', 'active': orderAgentBy.indexOf('userName') > -1}"></i></span>

      </div>

      <div class="col-3" ng-click="sortAgentTab('ip')">
            <span class="sort-span">LAN IP<i class="icn-sm sort-icon icn-sort"
                                             ng-class="{'rotate': orderAgentBy === '-ip', 'active': orderAgentBy.indexOf('ip') > -1}"></i></span>

      </div>

      <div class="col-4"><span>&nbsp;</span></div>
      <!--<div class="col-4"><span>WAN IP</span></div>-->

      <div class="col-5" ng-click="sortAgentTab('agentVersion')">
            <span class="sort-span">AGENT VERSION<i class="icn-sm sort-icon icn-sort"
                                                    ng-class="{'rotate': orderAgentBy === '-agentVersion', 'active': orderAgentBy.indexOf('agentVersion') > -1}"></i></span>

      </div>

      <div class="col-6">&nbsp;</div>

    </li>

    <li ng-repeat="agent in agents | orderBy: orderAgentBy"
        ng-controller="quicktech.core.companies.agentsTabsCtrl"
        ng-if="agent.agentVersion && (agent.agentVersion !== 'unknown')">

      <div class="col-1">
        <div>
          <i class="device-status" ng-class="{'on': agent.online, 'off': !agent.online}"></i>
          <!--<label class="control checkbox pull-left">-->
          <!--<input type="checkbox">-->
          <!--<span class="control-indicator"></span>-->
          <!--</label>-->

          <div class="checkbox-caption">
            <i class="icn-lg icn-computer pull-left"></i>
            {{ (agent.hostName | unknownFilter) || agent.ip }}
          </div>
        </div>
      </div>

      <div class="col-2">
        <div class="agent-username" ng-class="{'no-value': !agent.login}">

          <span>
            {{ agent.login }}
          </span>

          <!--<a href="javascript:void(0)" class="hit-area has-tooltip pull-right">-->
          <!--<i class="icn-sm icn-password-key"></i>-->
          <!--<i class="icn-sm icn-password-key-unique"></i>-->
          <!--</a>-->


        </div>
      </div>

      <div class="col-3">
        <div class="agent-ip">{{ agent.ip }}</div>
      </div>

      <div class="col-4">
        <div class="agent-ip">&nbsp;</div>
      </div>

      <div class="col-5">
        <div class="agent-version">
          {{ agent.agentVersion }}
          <i class="icn-md icn-agent-version-updated pull-right" ng-show="!agentDeprecated"></i>
          <i class="icn-md icn-agent-version-old pull-right" ng-show="agentDeprecated"></i>
        </div>
      </div>

      <div class="col-6">
        <div class="list-actions pull-right">

          <div class="btn btn-default pull-left has-tooltip"
               ng-if="(agent.type === 'workstation') && agent.online"
               tooltip-placement="top" tooltip="Remote Access"
               dropdown-toogle aria-haspopup="true" aria-expanded="false" data-toggle="dropdown">
            <i class="icn-sm icn-remote-access"></i>
          </div>

          <ul class="dropdown-menu dropdown-menu-custom" role="menu">

            <li ng-click="remoteAccess('CSS')">
              <a tabindex="-1" href="javascript:void(0)">CSS – Custom Share Screen</a>
            </li>

            <li ng-click="remoteAccess('RDP')">
              <a tabindex="-1" href="javascript:void(0)">RDP – Remote desktop protocol</a>
            </li>

          </ul>

          <div class="btn btn-default pull-left has-tooltip" tooltip-placement="top" ng-if="agentDeprecated && agent.online"
               tooltip="Update Agent" ng-click="updateAgent()">
            <i class="icn-sm icn-attachments-download"></i>
          </div>

          <div class="btn btn-default has-tooltip pull-right" ng-click="remove()"
               tooltip-placement="top" tooltip="Remove">
            <i class="icn-sm icn-remove-token"></i>
          </div>

        </div>
      </div>
    </li>

  </ul>
  <!--<div class="qt-list-loading">-->
  <!--<div class="loader"></div>-->
  <!--</div>-->
</div>
