<div ng-controller="quicktech.core.companies.companyProfileTabsCtrl">

  <div class="tabs-container">
    <div class="fixed-block-top" fixed-block-top
         style="margin-top: 340px">
      <ul class="nav nav-qt clearfix" style="padding: 0 30px;" company-bulk-option>

        <!--<li class="activity-tab active">-->
        <!--<a data-toggle="tab" href="javascript:void(0)">Activity</a>-->
        <!--<div class="activity-nav">-->
        <!--<a href="javascript:void(0)" class="hourly active">Hour</a>-->
        <!--<a href="javascript:void(0)" class="weekly">Week</a>-->
        <!--<a href="javascript:void(0)" class="monthly">Month</a>-->
        <!--</div>-->
        <!--</li>-->

        <li ng-class="{'active': currentOpenTab === 'users'}" style="cursor: pointer;" ng-if="PermissionsService.isAllowed('VIEW_USERS')">
          <a ui-sref="companyProfile({ tabName: 'users' })">
            Users
            <span class="text-muted">{{ users.length }}</span>
          </a>
        </li>

        <li ng-class="{'active': currentOpenTab === 'devices', 'hide': !isHasDevices}" style="cursor: pointer;">
          <a ui-sref="companyProfile({ tabName: 'devices' })">
            Agents
            <span class="text-muted">{{ agents.length }}</span>
          </a>
        </li>

        <li ng-class="{'active': currentOpenTab === 'network-scan', 'hide': !isHasDevices}"
            ng-if="PermissionsService.isAllowed('NETWORK_SCAN_CLIENTS')"
            style="cursor: pointer;">
          <a ui-sref="companyProfile({ tabName: 'network-scan' })">
            Network Scan
          </a>
        </li>

        <li ng-class="{'active': currentOpenTab === 'settings'}" style="cursor: pointer;">
          <a ui-sref="companyProfile({ tabName: 'settings' })">
            Device Settings
          </a>
        </li>

        <li ng-class="{'active': currentOpenTab === 'products'}" style="cursor: pointer;"
            ng-if="company.clientType.toLowerCase() === 'vendor' && (company.hasProducts || productsData.length)">
          <a ui-sref="companyProfile({ tabName: 'products' })">
            Products
          </a>
        </li>

        <!--<li ng-class="{active: mode === 'vendors'}">-->
        <!--<a data-toggle="tab" href="javascript:void(0)" ng-click="mode = 'vendors'">-->
        <!--Assc. Vendors-->
        <!--<span class="text-muted">{{ companyData.companyAssociations.length }}</span>-->
        <!--</a>-->
        <!--</li>-->

        <li class="bulk-option" bulk-option-content
            ng-class="{'hide': !(bulkOptionMode === 'users') && !(bulkOptionMode === 'devices')}"
            ng-controller="quicktech.core.companies.bulkOptionCtrl">

          <div class="topNavbarLeft-Left pull-left" ng-if="bulkOptionMode === 'users'">

            <p class="pull-left select" style="white-space: nowrap;">
              <strong>{{ selectUsersIds.length }}</strong>&nbsp;<span class="text-muted">Selected</span>
            </p>

            <div class="topNavbar-filter pull-right">

              <div class="btn btn-default has-tooltip pull-right" ng-click="archiveUsers()"
                   tooltip-placement="bottom" uib-tooltip="Archive">
                <i class="icn-sm icn-remove-token"></i>
              </div>

              <div uib-dropdown>
                <div class="btn btn-default has-tooltip pull-right" uib-dropdown-toggle
                     tooltip-placement="bottom" uib-tooltip="Subscribe to...">
                  <i class="icn-sm icn-user-subscription"></i>
                </div>

                <ul class="dropdown-menu dropdown-subscribe" stop-propagation="click">

                  <li ng-click="changeUserSubscription('ticket')">
                    <a tabindex="-1" href="javascript:void(0)">
                      <div class="clearfix">
                        <label class="control checkbox pull-left">
                          <input type="checkbox" ng-model="usersSbscr['ticket']" ng-disabled="disabledSubscr">
                          <span class="control-indicator"></span> Ticket Updates
                        </label>
                      </div>
                    </a>
                  </li>

                  <li ng-click="changeUserSubscription('ticketManager')">
                    <a tabindex="-1" href="javascript:void(0)">
                      <div class="clearfix">
                        <label class="control checkbox pull-left">
                          <input type="checkbox" ng-model="usersSbscr['ticketManager']" ng-disabled="disabledSubscr">
                          <span class="control-indicator"></span> Ticket Manages
                        </label>
                      </div>
                    </a>
                  </li>

                  <li ng-click="changeUserSubscription('invoice')" ng-if="!isInvoiceSubscriptionForbidden()">
                    <a tabindex="-1" href="javascript:void(0)">
                      <div class="clearfix">
                        <label class="control checkbox pull-left">
                          <input type="checkbox" ng-model="usersSbscr['invoice']" ng-disabled="disabledSubscr">
                          <span class="control-indicator"></span> Invoice Updates
                        </label>
                      </div>
                    </a>
                  </li>

                </ul>
              </div>

              <div uib-dropdown>
                <div class="btn btn-default has-tooltip pull-right" uib-dropdown-toggle
                     tooltip-placement="bottom" uib-tooltip="Set Privilege to...">
                  <i class="icn-sm icn-user-privilege"></i>
                </div>

                <ul class="dropdown-menu dropdown-privilege">

                  <li>
                    <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserRole('USER')">
                      User
                    </a>
                  </li>

                  <li>
                    <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserRole('ADMIN')">
                      Administrator
                    </a>
                  </li>

                </ul>
              </div>

            </div>

          </div>

          <div class="topNavbarLeft-Left pull-left" ng-if="bulkOptionMode === 'devices'"
               style="transform: translateY(50%);">

            <p class="pull-left" style="white-space: nowrap;">
              <strong>{{ selectDevicesIds.length }}</strong>&nbsp;<span class="text-muted">Selected</span>
            </p>

            <div class="topNavbar-filter pull-right" style="transform: translateY(-40%);">

              <div class="btn btn-default has-tooltip pull-right" ng-click="removeDevices()"
                   tooltip-placement="bottom" uib-tooltip="Remove">
                <i class="icn-sm icn-remove-token"></i>
              </div>

              <div class="btn btn-default has-tooltip pull-right" ng-click="shutdownDevices()"
                   tooltip-placement="bottom" uib-tooltip="Shutdown" ng-if="!companyProfileHeader.isOfflineDeviceSelected">
                <i class="icn-sm icn-shutdown-device"></i>
              </div>

              <div class="btn btn-default has-tooltip pull-right" ng-click="restartDevices()"
                   tooltip-placement="bottom" uib-tooltip="Restart" ng-if="!companyProfileHeader.isOfflineDeviceSelected">
                <i class="icn-sm icn-restart-device"></i>
              </div>

              <!--<div class="btn btn-default has-tooltip pull-left" append-html-to-body data="deviceReport"-->
                   <!--url="/html/scripts/core/companies/company-profile/tabs/devices-tab/report-device.tpl.html"-->
                   <!--tooltip-placement="top" uib-tooltip="Open Report" ng-click="getDeviceReport(selectDevicesIds)">-->
                <!--<i class="icn-sm icn-description"></i>-->
              <!--</div>-->

            </div>
          </div>


        </li>

      </ul>

      <div class="pull-right for-network-tab" tooltip-placement="top" tooltip-append-to-body="true"
           ng-show="currentOpenTab === 'network-scan'"
           uib-tooltip="{{ masterAgentOffline ? 'Master Agent Offline' : isScanDevicesLoad ? 'Scan in progress' : 'Scan Network' }}">
        <div class="btn btn-info has-tooltip" style="width: 62px;" ng-click="runScanDevices()"
             custom-disabled="{{ masterAgentOffline || isScanDevicesLoad }}">
          <i class="icn-sm icn-scan-network"></i>
        </div>
      </div>
    </div>
  </div>

  <div class="tab-content clearfix"
       ng-include="'/html/scripts/core/companies/company-profile/tabs/'  + currentOpenTab + '-tab/' + currentOpenTab + '-tab.tpl.html'"></div>

</div>
