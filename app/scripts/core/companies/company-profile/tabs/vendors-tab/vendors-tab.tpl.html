<div role="tabpanel" class="tab-pane" style="display: block">
  <ul class="qt-list qt-assc-vendors" style="margin-bottom: 150px">

    <li class="list-heading">
      <div class="col-1"><span>Name</span></div>
      <div class="col-2"><span>Primary Contact</span></div>
      <div class="col-3"><span>Contact No.</span></div>
      <div class="col-4"><span>Products</span></div>
      <div class="col-5"></div>
    </li>

    <li ng-repeat="association in companyData.companyAssociations | orderBy: 'vendor.name'"
        ng-controller="quicktech.core.companies.vendorsTabCtrl">

      <div class="col-1">
        <div class="vendor-name pull-left">{{ association.vendor.name }}</div>
      </div>

      <div class="col-2">
        <div class="user-bio">

          <div class="pull-left avatar">
            <img ng-src="{{ getContactAvatarUrl(getPriorityContact()) }}"
                 alt="..." class="img-circle no-avatar avatar-38">
          </div>

          <div class="user-name pull-left">{{ getUserName(getPriorityContact()) }}</div>
          <span class="label label-light">{{ getPriorityContact().designation }}</span>

        </div>
      </div>

      <div class="col-3">
        <div class="vendor-contact-no">
          <i class="icn-sm" ng-class="{'icn-iphone': getPriorityNumber(getPriorityContact(), true) === 'MOBILE',
                                       'icn-user-fax': getPriorityNumber(getPriorityContact(), true) === 'FAX',
                                       'icn-user-phone': getPriorityNumber(getPriorityContact(), true) === 'OFFICE'}"></i>
          {{ getPriorityNumber(getPriorityContact()) }}
        </div>
      </div>

      <div class="col-4">
        <div class="vendor-products">{{ association.vendor.products.length }}</div>
      </div>

      <div class="col-5">
        <div class="list-actions pull-right">

          <div class="btn btn-default pull-left has-tooltip disabled"
               tooltip-placement="top" uib-tooltip="Email" ng-click="sendMail()">
            <i class="icn-sm icn-user-mail"></i>
          </div>

          <div class="btn btn-default pull-left has-tooltip"
               tooltip-placement="top" uib-tooltip="dissociate" ng-click="dissociateVendor()">
            <i class="icn-sm icn-remove-token"></i>
          </div>

        </div>
      </div>

    </li>

  </ul>
</div>
