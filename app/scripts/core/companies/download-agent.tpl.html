<div class="download-agent-modal" ng-controller="quicktech.core.companies.downloadAgent" ng-form="downloadAgentForm">
  <button class="close-modal" ng-click="close()"></button>
  <h3>Download the installer</h3>
  <button class="btn btn-primary" ng-click="downloadAgent(downloadAgentForm)"><i class="windows-icn"></i><span>Download for Windows</span></button>
  <button class="btn btn-primary not-active"><i class="apple-icn"></i><span>Download for Mac</span></button>
  <button class="btn btn-primary not-active"><i class="linux-icn"></i><span>Download for Linux</span></button>
  <p>OR</p>
  <button class="btn primary-default" copy-key="downloadLink"
       custom-disabled="{{ gettingLink }}">Copy a installer link to clipboard</button>
</div>
