<div ng-form="addressForm">

  <div class="form-group zipcode-field"
       ng-class="{'has-error': isShowingErrors(addressForm, 'suiteNumber')}">

    <label class="control-label" ng-class="{'hide': isShowingErrors(addressForm, 'suiteNumber')}">
      suite number
    </label>

    <div ng-messages="addressForm.suiteNumber.$error"
         ng-class="{'hide': !isShowingErrors(addressForm, 'suiteNumber')}">
      <div class="control-label" ng-message="maxlength">too large</div>
    </div>

    <input class="form-control" type="text" name="suiteNumber" autocomplete="off"
           ng-model="model.suiteNumber" ng-maxlength="15">
  </div>

  <div class="form-group address-field"
       ng-class="{'has-error': (addressForm.address.$dirty || showValidationMessages) && !addressForm.address.$valid}">

    <label class="control-label"
           ng-class="{'hide': ((addressForm.address.$dirty || showValidationMessages) && !addressForm.address.$valid)}">
      Address
    </label>

    <div ng-messages="addressForm.address.$error"
         ng-class="{'hide': !((addressForm.address.$dirty || showValidationMessages) && !addressForm.address.$valid)}">

      <label class="control-label" ng-message="required">
        PLEASE ENTER THE COMPANY’S ADDRESS.
      </label>

      <label class="control-label" ng-message="correct">
        PLEASE SELECT ADDRESS FROM AUTOCOMPLETE RESULTS
      </label>

    </div>

    <input class="form-control" type="text" ng-model="model.address" autocomplete="off"
           name="address" map-input required make-dirty-on-blur>
  </div>

  <div class="form-group zipcode-field"
       ng-class="{'has-error': isShowingErrors(addressForm, 'zip')}">

    <label class="control-label" ng-class="{'hide': isShowingErrors(addressForm, 'zip')}">Zip</label>

    <div ng-messages="addressForm.zip.$error"
         ng-class="{'hide': !isShowingErrors(addressForm, 'zip')}">
      <div class="control-label" ng-message="maxlength">too large</div>
    </div>
    <input class="form-control" type="text" name="zip" ng-model="model.postalCode" ng-maxlength="15">
  </div>

  <div class="map-container" map></div>

</div>
