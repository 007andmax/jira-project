<div class="row-wrapper clearfix" ng-form="addressForm">
  <div class="form-group form-group-full" ng-class="{error: (addressForm.address.$dirty || showValidationMessages) && !addressForm.address.$valid}">
    <label>address</label>

    <div ng-messages="addressForm.address.$error" ng-if="addressForm.address.$dirty || showValidationMessages">
      <div class="error-msg" ng-message="required">Please enter the company’s address.</div>
      <div class="error-msg" ng-message="correct">Please select address from atocomplete results or set marker on map
      </div>
    </div>
    <input type="text" class="form-control" popover="Enter the company's full address."
           name="address"
           popover-placement="bottom" popover-trigger="qtCustomPopover" qt-custom-popover required="true"
           make-dirty-on-blur
           ng-model="model.address">
  </div>
</div>
<div class="row-wrapper  locmap clearfix">
  <div class="form-group full">
    <div map style="width: 100%; height: 224px;"></div>
  </div>
</div>
