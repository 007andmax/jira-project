<div class="password-manager-wrapper">
  <div class="container-fluid">
    <ul class="pass-list qt-list">
      <li class="list-heading" style="display: flex; align-items: center;">
        <div class="col-md-3" ng-click="setOrderForPasswords('company')">
          <span class="sort-span">
            Company
            <i class="icn-sm sort-icon icn-sort"
               ng-class="{'rotate': orderPasswords.reverse, 'active': orderPasswords.field === 'company'}"></i>
          </span>
        </div>
        <div class="col-md-2" ng-click="setOrderForPasswords('type')">
          <span class="sort-span">
            Type
            <i class="icn-sm sort-icon icn-sort"
               ng-class="{'rotate': orderPasswords.reverse, 'active': orderPasswords.field === 'type'}"></i>
          </span>
        </div>
        <div class="col-md-3" ng-click="setOrderForPasswords('description')">
          <span class="sort-span">
            Description
            <i class="icn-sm sort-icon icn-sort"
               ng-class="{'rotate': orderPasswords.reverse, 'active': orderPasswords.field === 'description'}"></i>
          </span>
        </div>
        <div class="col-md-2" ng-click="setOrderForPasswords('firstLink')">
          <span class="sort-span">
            User/Device
            <i class="icn-sm sort-icon icn-sort"
               ng-class="{'rotate': orderPasswords.reverse, 'active': orderPasswords.field === 'firstLink'}"></i>
          </span>
        </div>
        <div class="col-md-2 text-right">
          <div class="btn btn-primary btn-create" open-password-modal
               custom-disabled="{{ !PermissionsService.isAllowed('CREATE_PASSWORD') }}">Create</div>
        </div>
      </li>
      <li open-password-modal="password" not-editable
          custom-disabled="{{ !PermissionsService.isAllowed('VIEW_PASSWORD') }}"
          ng-repeat="password in passwords | filter: filterPasswords | orderBy : orderByForPasswords : orderPasswords.reverse track by password.id">
        <div class="col-md-3"><p class="ellipsis">{{ getCompanyById(password.companyId).name }}</p></div>
        <div class="col-md-2"><p class="ellipsis">{{ userReadable(password.template) }}</p></div>
        <div class="col-md-3"><p class="ellipsis">{{ password.description }}</p></div>
        <div class="col-md-2"><p class="ellipsis pull-left" style="margin-right: 10px;">
          <span class="pull-left">{{ getLinkName(password.links[0], password.companyId) }}</span>
          <div ng-if="password.links.length > 1" qt-popover-position="bottom"
               qt-custom-popover-template="/html/scripts/core/password-manager/password-links.tpl.html">
            <span class="pass-icn pass-link pull-left" qt-popover-trigger="mouseenter" stop-propagation="click"></span>
          </div>
          </p></div>
        <div class="col-md-2 text-right">
          <div class="pass-icn pass-delete" ng-click="deletePassword(password)"
               custom-disabled="{{ !PermissionsService.isAllowed('DELETE_PASSWORD') }}"
               uib-tooltip="Delete" tooltip-placement="top" stop-propagation="click"></div>
          <div qt-popover-position="bottom-right-align" style="float: right;"
               custom-disabled="{{ !password.histories.length }}"
               qt-custom-popover-template="/html/scripts/core/password-manager/password-history.tpl.html">
            <div class="pass-icn pass-history" qt-popover-trigger="mouseenter" stop-propagation="click"
                 uib-tooltip="History" tooltip-placement="top"></div>
          </div>
          <div class="pass-icn pass-edit" open-password-modal="password" stop-propagation="click"
               uib-tooltip="Edit" tooltip-placement="top"
               custom-disabled="{{ !PermissionsService.isAllowed('EDIT_PASSWORD') }}"></div>
          <div class="pass-icn pass-warning" ng-if="isPasswordExpired(password)"
               uib-tooltip="Expired password" tooltip-placement="top" stop-propagation="click"></div>
        </div>
      </li>
    </ul>
  </div>
</div>
