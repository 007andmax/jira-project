<div class="ticket-post-update-wrapper" ng-form="ticketUpdateForm">

  <!--<div class="btn btn-primary pull-right has-tooltip" custom-disabled="{{ true }}"-->
  <!--tooltip-placement="top" uib-tooltip="Remote Access" style="width: 92px;">-->
  <!--<i class="icn-sm icn-remote-access"></i>-->
  <!--</div>-->

  <ul class="nav nav-ticket-add"
      ng-if="TicketsPermissionsService.isActionVisible('add_expense', ticketDetails)">

    <li ng-class="{'active': currentOpenTab === 'NOTE'}">
      <a href="javascript:void(0)" ng-click="openedTab('NOTE')">
        <i class="icon-lg icon-add-note"></i>Note
      </a>
    </li>

    <li ng-class="{'active': currentOpenTab === 'PRODUCT'}">
      <a href="javascript:void(0)" ng-click="openedTab('PRODUCT')">
        <i class="icon-lg icon-add-product"></i>Product
      </a>
    </li>

    <li ng-class="{'active': currentOpenTab === 'SERVICE'}">
      <a href="javascript:void(0)" ng-click="openedTab('SERVICE')">
        <i class="icon-lg icon-add-service"></i>Service
      </a>
    </li>

  </ul>

  <div class="tab-content"
       ng-style="{'margin-top': TicketsPermissionsService.isActionVisible('add_expense', ticketDetails) ? '0' : '68px' }">

    <div class="tab-pane in active" id="Note" ng-if="currentOpenTab === 'NOTE'"
         ng-controller="quicktech.core.tickets.ticketAddUpdateNoteCtrl">

      <div class="ticket-add clearfix" ng-form="updateTicketNote">

        <!--  <div class="avator pull-left">
           <img ng-src="{{ getUserAvatarUrl(currentUser) }}" alt="..." class="img-circle avatar-38">
         </div> -->

        <div class="ticket-add-content clearfix">

          <div ng-include="'/html/scripts/core/tickets/note/ticket-add-note.tpl.html'"></div>

          <div class="ticket-add-content-actions pull-left">

            <div class="ticket-add-content-actions-attachment pull-left"
                 ticket-attachment-files attachment-func="addAttachmentFiles"
                 ng-model="ticketUpdate.ticketAttachments">

              <a href="javascript:void(0)" class="hit-area ha-16-26 has-tooltip"
                 uib-tooltip="Attach files" tooltip-placement="top">
                <i class="icon-sm attachment"></i>
              </a>

              <input type="file" style="display:none" multiple=""/>
            </div>

            <div class="line-sep pull-left"></div>

            <span class="pull-right" ng-show="errorAttachSize"
                  style="color: rgb(229, 57, 53);">{{ errorAttachSize }}</span>

          </div>
        </div>

        <div ng-include="'/html/scripts/core/tickets/ticket-update/update-submit.tpl.html'"></div>

      </div>
    </div>

    <div class="tab-pane in active" id="Product"
         ng-if="currentOpenTab === 'PRODUCT' && TicketsPermissionsService.isActionVisible('add_expense', ticketDetails)"
         ng-controller="quicktech.core.tickets.ticketAddUpdateProductsCtrl">

      <div class="ticket-add clearfix" ng-form="addProductsForm">

        <!-- <div class="avator pull-left">
          <img ng-src="{{ getUserAvatarUrl(currentUser) }}" alt="..." class="img-circle avatar-38">
        </div> -->
        <div class="ticket-add-content clearfix">

          <div>
            <div ng-repeat="productExpense in ticketUpdate.products" ng-init="productExpense.itemOrder = $index">

              <div ng-controller="quicktech.core.tickets.ticketAddUpdateProductCtrl"
                   ng-include="'/html/scripts/core/tickets/products/ticket-add-update-product.tpl.html'"></div>

            </div>
            <!-- <div class="col-1 form-group discount-input" uib-dropdown keyboard-nav="true">

              <input type="text" class="form-control has-dropdown" style="cursor: text; background-color: #f7f7f7;" uib-dropdown-toggle readonly
                     value="Discount: {{ ticketDetails.discount ? getDiscountLabel(ticketDetails.discount) : getDiscountLabel(ticketUpdate.selectedDiscount) }}"
                     placeholder="{{ 'Select discount...' }}"/>


              <i class="icn-sm icn-remove-old" ng-show="ticketUpdate.selectedDiscount || ticketDetails.discount"
                 ng-click="updateDiscount()"
                 uib-tooltip="remove discount" tooltip-placement="top"></i>
              <i class="icn-sm icn-caret-gray" ng-hide="ticketUpdate.selectedDiscount || ticketDetails.discount"></i>
              <ul uib-dropdown-menu>
                <li ng-repeat="discount in discounts | orderBy: 'name' track by discount.id">
                  <a href="javascript:void(0)" ng-click="updateDiscount(discount)">
                    {{ getDiscountLabel(discount) }}
                  </a>
                </li>
              </ul>
            </div>-->
          </div>

          <div class="ticket-add-content-actions pull-left">

            <div class="ticket-add-amount pull-right">
              <span class="text-muted">Total amount </span>
              <strong>{{ (productTotalAmount | currency: '$': 2) || '$0.00' }}</strong>
            </div>

          </div>
        </div>

        <div ng-include="'/html/scripts/core/tickets/ticket-update/update-submit.tpl.html'"></div>

      </div>
    </div>

    <div class="tab-pane in active" id="Service"
         ng-if="currentOpenTab === 'SERVICE' && TicketsPermissionsService.isActionVisible('add_expense', ticketDetails)"
         ng-controller="quicktech.core.tickets.ticketAddUpdateServicesCtrl">

      <div class="ticket-add clearfix" ng-form="addServicesForm">

        <!--<div class="avator pull-left">
           <img ng-src="{{ getUserAvatarUrl(currentUser) }}" alt="..." class="img-circle avatar-38">
         </div>-->

        <div class="ticket-add-content clearfix">

          <div>
            <div ng-repeat="serviceExpense in ticketUpdate.services" ng-init="serviceExpense.itemOrder = $index">

              <div ng-controller="quicktech.core.tickets.ticketAddUpdateServiceCtrl"
                   ng-include="'/html/scripts/core/tickets/services/ticket-add-update-service.tpl.html'"></div>

            </div>
          </div>

        </div>

        <div ng-include="'/html/scripts/core/tickets/ticket-update/update-submit.tpl.html'"></div>
      </div>

    </div>
  </div>
</div>
