<div class="ticket-add-footer clearfix">

  <div class="pull-left" style="width: 100%;">
    <div style="font-weight: bold;">Notify</div>
    <div>The people you select will get an email when you add this update. They'll also be notified every time a comment is added.</div>

    <div class="ticket-add-content-actions-dropdown pull-left"
         ng-include="'/html/scripts/core/tickets/ticket-update/update-add-user.tpl.html'"></div>

    <div class="pull-left shared-user-add">
      <div class="notify-select">
        <span ng-click="toggleAllShared(true)">Select Everyone</span> | <span ng-click="toggleAllShared(false)">Select None</span>
      </div>

      <label class="control checkbox pull-left" ng-repeat="sharedUser in ticketSharedUsersList"
             ng-mousedown="validateNotifying(sharedUser, $event)">
        <input type="checkbox" ng-model="sharedUser.notify">
        <span class="control-indicator"></span>
        {{ getUserName(sharedUser.user) }}
      </label>
    </div>
  </div>

  <div class="pull-right" style="padding-top: 15px;">
    <div class="btn btn-primary"
         custom-disabled="{{ (!haveNote() && !haveAttachments() && isCurrentTab('NOTE')) || disabledWhenLoadAttachment || isSavingUpdate || errorAttachSize || ticketClosing }}"
         ng-click="saveTicketUpdate(ticketUpdateForm)">
      Update
    </div>
    <div ng-show="TicketsPermissionsService.isActionVisible('update_and_close', ticketDetails)"
         class="btn btn-success btn-update"
         custom-disabled="{{ ticketDetails.status === 'COMPLETED' || disabledWhenLoadAttachment || isSavingUpdate || errorAttachSize || ticketClosing }}"
         ng-click="updateAndCloseTicket(ticketUpdateForm)">
      Update &amp; Close
    </div>
  </div>

</div>
