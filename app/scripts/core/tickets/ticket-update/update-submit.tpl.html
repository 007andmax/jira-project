<div class="ticket-add-footer clearfix">

  <div class="pull-left" ng-if="!(currentUser.role === 'USER')">
    <label class="control checkbox pull-left">
      <input type="checkbox" ng-model="ticketUpdate.notifyTicketCreator">
      <span class="control-indicator"></span>
      {{ getUserName(user) }}
    </label>
  </div>

  <div class="pull-right">
    <div class="btn btn-info"
         ng-class="{'disabled': (updateTicketNote.$invalid || addProductsForm.$invalid || addServicesForm.$invalid || disabledWhenLoadAttachment)}"
         ng-disabled="(updateTicketNote.$invalid || addProductsForm.$invalid || addServicesForm.$invalid || disabledWhenLoadAttachment)"
         ng-click="saveTicketUpdate()">
      <i class="icn-sm icn-send"></i>
    </div>
  </div>

</div>
