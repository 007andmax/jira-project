<div class="ticket-add-footer clearfix">

  <div class="ticket-add-content-actions-dropdown pull-left"
       ng-include="'/html/scripts/core/tickets/ticket-update/update-add-user.tpl.html'"></div>

  <div class="pull-left shared-user-add">
    <label class="control checkbox pull-left" ng-repeat="sharedUser in ticketSharedUsersList">
      <input type="checkbox" ng-model="sharedUser.notify">
      <span class="control-indicator"></span>
      {{ getUserName(sharedUser.user || sharedUser.contact) }}
    </label>
  </div>

  <div class="pull-right">
    <div class="btn btn-lg btn-info"
         custom-disabled="{{ updateTicketNote.$invalid || disabledWhenLoadAttachment || isSavingUpdate || errorAttachSize || ticketClosing }}"
         ng-click="saveTicketUpdate(ticketUpdateForm)">
      Update
    </div>
    <div ng-show="TicketsPermissionsService.isActionVisible('update_and_close', ticketDetails)"
         class="btn btn-lg btn-info btn-update"
         custom-disabled="{{ ticketDetails.status === 'COMPLETED' || disabledWhenLoadAttachment || isSavingUpdate || errorAttachSize || ticketClosing }}"
         ng-click="updateAndCloseTicket(ticketUpdateForm)">
      Update &amp; Close
    </div>
  </div>

</div>
