<div class="pull-left" uib-dropdown>

  <a href="javascript:void(0)" class="hit-area ha-16-26 pull-left add-users-plus has-tooltip"
     tooltip-placement="top" uib-tooltip="Add users to this update" uib-dropdown-toggle aria-haspopup="true"
     aria-expanded="false" tooltip-append-to-body="true">
    <i class="icn-sm icn-add-update"></i>
  </a>

  <ul class="dropdown-menu dropdown-menu-tabs">

    <li ng-controller="quicktech.core.tickets.updateAddUserCtrl"
        stop-propagation="click">

      <ul class="nav nav-justified nav-tabs-dropdown" role="tablist">

        <li ng-class="{'active': currentAddUserTab === 'TEAM_MEMBER'}">
          <a href="javascript:void(0)" role="tab" data-toggle="tab"
             ng-click="openAddUserTab('TEAM_MEMBER')">
            Agents
          </a>
        </li>

        <li ng-class="{'active': currentAddUserTab === 'CLIENT_USER'}">
          <a href="javascript:void(0)" role="tab" data-toggle="tab"
             ng-click="openAddUserTab('CLIENT_USER')">
            Client Users
          </a>
        </li>

      </ul>

      <div class="tab-content">

        <div class="tab-pane active" ng-if="currentAddUserTab === 'TEAM_MEMBER'" update-add-user>
          <div class="form-group">
            <input type="email" class="form-control form-control-filter"
                   placeholder="Search agent...">
            <i class="icn-sm icn-search-input" tabindex="-1"></i>
          </div>
          <div class="scroll-pane"></div>
        </div>

        <div class="tab-pane active" ng-if="currentAddUserTab === 'CLIENT_USER' && !isNeedReset" update-add-user>
          <div class="form-group">
            <input type="email" class="form-control form-control-filter"
                   placeholder="Search agent...">
            <i class="icn-sm icn-search-input" tabindex="-1"></i>
          </div>
          <div class="scroll-pane"></div>

        </div>

      </div>
    </li>
  </ul>

</div>
