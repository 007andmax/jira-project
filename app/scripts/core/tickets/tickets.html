<div ng-controller="quicktech.core.tickets.ticketsCtrl">
  <div class="ticket-sidebar tickets-list"
       ng-controller="quicktech.core.tickets.ticketsListCtrl" ng-if="listType">

    <!--{{ tickets.length }}-->
    <div  ng-repeat="ticket in tickets" ng-controller="quicktech.core.tickets.ticketCtrl">
      <div ng-include="'/html/scripts/core/tickets/ticket.tpl.html'"></div>
    </div>
  </div>

  <!-- Ticket Detail -->
  <div class="ticket-content" ui-view></div>

</div>
