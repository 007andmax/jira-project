<div class="ticket-update-product-edit" ng-controller="quicktech.core.tickets.ticketEditUpdateProductCtrl">
  <i class="icon-edit icn-sm icn-update-product"></i>
  <form name="updateTicketProduct">
    <ul class="qt-table">
      <li>
        <div class="edit-col1"
             ng-class="{'has-error': isShowingErrors(updateTicketProduct, 'productName') || !editProduct.item.versionedId.id}">
          <div class="dropdown" product-autocomplete>
            <input type="text" class="form-control has-dropdown" ng-model="editProduct.item.name "
                   placeholder="Product" data-toggle="dropdown" aria-expanded="false"
                   name="productName" ng-required="true">
            <i class="icn-sm icn-caret-gray"></i>

            <div ng-include="'/html/scripts/common/templates/choose-product-dropdown.tpl.html'"></div>

          </div>
        </div>

        <div class="edit-col2" ng-class="{'has-error': isShowingErrors(updateTicketProduct, 'productDescription')}">
          <input type="text" class="form-control" placeholder="Description"
                 name="productDescription" ng-maxlength="2000" max-length-word="30"
                 ng-model="editProduct.description">
        </div>

        <div class="edit-col3" ng-class="{'has-error': isShowingErrors(updateTicketProduct, 'productQty')}">
          <input type="text" class="form-control" placeholder="Qty"
                 ng-model="editProduct.quantity" ng-maxlength="10"
                 name="productQty" hard-reset-required="true" ng-change="controlProductQty(updateTicketProduct)"
                 hard-reset-pattern="numberPattern">
        </div>

        <div class="edit-col4">
          <input type="text" class="form-control" placeholder="Amount" readonly
                 value="{{ editProduct.item.sale * editProduct.quantity || '' }}">
        </div>

      </li>
    </ul>

    <div class="ticket-update-edit-actions clearfix" ng-show="editProduct.id">

      <div class="validation-msg pull-left">{{ validationMessage() }}</div>

      <div class="btn btn-lg btn-info pull-right"
           ng-click="saveUpdateProduct(updateTicketProduct)">
        Save
      </div>

      <div class="btn btn-lg btn-primary pull-right"
           ng-click="setEditExpenseId()">
        Cancel
      </div>

    </div>

  </form>
</div>
