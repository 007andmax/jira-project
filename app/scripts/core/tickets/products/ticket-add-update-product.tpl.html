<div>
  <form name="addProductForm" class="ticket-add-product">
    <ul class="qt-table">

      <li>

        <div class="col-1" style="float: left;" ng-class="{'has-error': isShowingErrors(addProductForm, 'product')}">
          <div products-list id="product-list-cont"
               click-outside="closeDropdown()" outside-if-not="product-list-cont">

            <div>

              <input ng-hide="isPLOpen" type="text" class="form-control has-dropdown" pl-product-input
                     placeholder="Product" autocomplete="off">

              <input ng-show="isPLOpen" type="text" class="form-control has-dropdown" pl-search-product-input
                     placeholder="Search or Add Product" autocomplete="off" ng-model="searchProduct">

              <i class="icn-sm icn-caret-gray"></i>
            </div>

            <input type="hidden" name="product" ng-model="productExpense.item.description" ng-required="true">

            <div class="nano dropdown-menu custom-product-list" pl-conteiner
                 ng-include="'/html/scripts/common/templates/products-list.tpl.html'"></div>

          </div>
        </div>

        <div class="col-3" style="margin-bottom: 10px; float: left;" ng-class="{'has-error': isShowingErrors(addProductForm, 'productSerialNumber')}"
             style="width: 140px; float: left;">

          <input type="text" class="form-control" name="productSerialNumber"
                 placeholder="Serial Number" ng-model="productExpense.serialNumber" ng-maxlength="25"
                 uib-tooltip="{{ productExpense.serialNumber }}" tooltip-placement="top" tooltip-append-to-body="true"/>
        </div>

        <div class="col-4" style="width: 70px; float: left;"
             ng-class="{'has-error': isShowingErrors(addProductForm, 'productQty')}">

          <input type="text" class="form-control" placeholder="Qty" maxlength="4"
                 name="productQty" hard-reset-required="true" ng-change="controlProductQty(addProductForm)"
                 ng-model="productExpense.quantity" ng-maxlength="10"
                 hard-reset-pattern="quantityPattern">
        </div>

        <div class="col-3 price-width" style="width: 115px; float: left;"
             ng-class="{'has-error': isShowingErrors(addProductForm, 'productPrice')}">

          <input type="text" class="form-control" placeholder="Price" qt-to-fixed="2"
                 ng-readonly="!PermissionsService.isAllowed('MANAGE_PRODUCTS')"
                 name="productPrice" ng-required="true" ng-model="productExpense.item.sale"
                 hard-reset-pattern="pricePattern" hard-reset-required="true"/>
        </div>

        <!--DISCOUNTS-->
          <div class="col-4" style="width: 100px; float: left;">
            <!--Discount amount-->
            <div class="form-group" ng-class="{'has-error': isShowingErrors(addProductForm, 'discountAmount')}">
              <input type="number"
                     class="form-control"
                     placeholder="Discount"
                     name="discountAmount"
                     ng-model="productExpense.discountAmount"
                     ng-max="productExpense.discountType == 'FIXED' ? productExpense.quantity*productExpense.item.sale : 100"
                     ng-min="0"
                     ng-required="productExpense.discountType == 'PERCENT' || productExpense.discountType == 'FIXED'"
                     ng-disabled="!productExpense.discountType"
                     qt-to-fixed="2"
                     hard-reset-pattern="{{productExpense.discountType}}">
            </div>
          </div>
          <div class="col-4" style="width: 85px; float: left; padding-left: 5px;">
            <!--Discount type-->
            <div class="form-group">
              <div uib-dropdown keyboard-nav="true">

                <button class="form-control form-control-dropdown account-type no-cursor has-dropdown"
                        uib-dropdown-toggle aria-expanded="true"
                        tabindex="32">
                  {{discountTypes[productExpense.discountType]}} <b ng-hide="productExpense.discountType"
                                                                    style="color: rgba(76, 92, 111, 0.36)">Type </b>
                </button>
                <i class="icn-sm icn-caret-gray"></i>

                <ul class="dropdown-menu dropdown-account-type">
                  <li ng-click="productExpense.discountType = 'PERCENT'; discountAmountMsxLength = 100; productExpense.discountAmount>100 ? productExpense.discountAmount=null : true ">
                    <a href="javascript:void(0)"> Percent</a>
                  </li>
                  <li ng-click="productExpense.discountType = 'FIXED'; discountAmountMsxLength = null; productExpense.quantity * productExpense.item.sale < productExpense.discountAmount ? productExpense.discountAmount = null : true">
                    <a href="javascript:void(0)"> Fixed </a>
                  </li>
                  <li
                    ng-click="productExpense.discountType = ''; discountAmountMsxLength = ''; productExpense.discountAmount = null">
                    <a href="javascript:void(0)"> No Discount </a>
                  </li>
                </ul>

              </div>
            </div>
          </div>

        <div class="col-6" style="float: left;" ng-if="ticketUpdate.products.length > 1">
          <div class="btn-icn btn btn-primary has-tooltip" uib-tooltip="Remove" tooltip-placement="top"
               ng-click="removeProduct()">
            <i class="icn-sm icn-remove-token-light"></i>
          </div>
        </div>

        <div style="float: left;" ng-if="$last">
          <div class="btn-icn btn btn-primary has-tooltip add-expense-btn" uib-tooltip="Add Product"
               tooltip-placement="top"
               ng-click="addProduct()">
            <i class="icn-sm icn-plus"></i>
          </div>
        </div>
      </li>
    </ul>
  </form>
</div>
