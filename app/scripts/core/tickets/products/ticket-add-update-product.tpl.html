<div>
  <form name="addProductForm" class="ticket-add-product">

    <div class="ticket-add-product-content">
      <div class="col-1" style="margin-bottom: 8px;"
           ng-class="{'has-error': isShowingErrors(addProductForm, 'product')}">
        <div products-list id="product-list-cont"
             click-outside="closeDropdown()" outside-if-not="product-list-cont" append-to-top="products-list">


          <input ng-hide="isPLOpen" type="text" class="has-dropdown pointer new-input" pl-product-input
                 placeholder="Product" autocomplete="off" append-input>

          <input ng-show="isPLOpen" type="text" class="has-dropdown pointer new-input" pl-search-product-input
                 placeholder="Search or Add Product" autocomplete="off" ng-model="searchProduct"
                 smart-dropdown-menu-position="product-list">


          <input type="hidden" name="product" ng-model="productExpense.item.description" ng-required="true">

          <div class="nano dropdown-menu custom-product-list" pl-conteiner append-container
               ng-include="'/html/scripts/common/templates/products-list.tpl.html'"></div>

        </div>
      </div>

      <div class="col-2" ng-class="{'has-error': isShowingErrors(addProductForm, 'productSerialNumber')}">

        <input type="text"
               class="new-input"
               name="productSerialNumber"
               placeholder="Serial number"
               ng-model="productExpense.serialNumber"
               ng-maxlength="55"
               execute-when-outfocused="isShowBarcotInputField = false"
               uib-tooltip="{{ productExpense.serialNumber }}"
               tooltip-placement="top"
               ng-init="setModel(productExpense)"
               tooltip-append-to-body="true" />
      </div>

      <div class="col-3 mob-cost-input"
           ng-class="{'has-error': isShowingErrors(addProductForm, 'productCost')}">

        <input type="number"
               class="new-input"
               name="productCost"
               qt-to-fixed="2"
               hard-reset-pattern="pricePattern"
               placeholder=""
               ng-max="productExpense.item.sale"
               ng-model="productExpense.item.cost"
               tooltip-append-to-body="true"
               step="0.01"
               ng-readonly="!PermissionsService.isAllowed('MANAGE_PRODUCTS')" />
      </div>

      <div class="col-4 mob-qty-input"
           ng-class="{'has-error': isShowingErrors(addProductForm, 'productQty')}">

        <input type="text" class="new-input" placeholder="" maxlength="4"
               name="productQty" hard-reset-required="true" ng-change="controlProductQty(addProductForm)"
               ng-model="productExpense.quantity" ng-maxlength="10"
               hard-reset-pattern="quantityPattern">
      </div>

      <div class="col-3 mob-price-input"
           ng-class="{'has-error': isShowingErrors(addProductForm, 'productPrice')}">

        <input type="number" class="new-input"
               placeholder="" qt-to-fixed="2"
               ng-readonly="!PermissionsService.isAllowed('MANAGE_PRODUCTS')"
               name="productPrice"
               ng-required="true"
               ng-model="productExpense.item.sale"
               hard-reset-pattern="pricePattern"
               step="0.01"
               hard-reset-required="true" />
      </div>

      <div class="col-4 mob-disc-input"
           ng-class="{'has-error': isShowingErrors(addProductForm, 'discountAmount')}">
        <input maxlength="3"
               type="text"
               placeholder=""
               class="new-input"
               name="discountAmount"
               ng-model="productExpense.discountAmount"
               ng-max="100"
               ng-min="0"
               hard-reset-pattern="PERCENT"
               execute-when-outfocused="isShowInputField = false"
               ng-keydown="$event.which === 13 && $event.preventDefault()">
      </div>
    </div>

    <div class="ticket-add-product-actions">
      <div style="margin-bottom: 25px;" class="has-tooltip" uib-tooltip="Remove" tooltip-placement="top"
           ng-click="removeProduct()">
        <i class="icon-sm icn-delete pointer"></i>
      </div>
      <div ng-if="$last" class="has-tooltip add-expense-btn" uib-tooltip="Add"
           tooltip-placement="top"
           ng-click="addProduct()">
        <i class="icon-sm icn-add-action"></i>
      </div>
    </div>
