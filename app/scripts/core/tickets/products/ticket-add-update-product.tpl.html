<div ng-init="formName = 'addProductForm' + $id"></div>
<form name="addProductForm">
  <ul class="qt-table">

    <li>

      <div class="col-1" ng-class="{'has-error': isShowingErrors(addProductForm, 'product')}">
        <div class="dropdown">

          <input type="text" class="form-control has-dropdown" placeholder="Product"
                 name="productName"
                 data-toggle="dropdown" aria-expanded="true" ng-model="productNameFilter">
          <i class="icn-sm icn-caret-gray"></i>

          <input type="hidden" name="product" ng-model="productExpense.item.versionedId.id" ng-required="true">

          <div class="dropdown-menu dropdown-product"
               ng-include="'/html/scripts/core/tickets/products/choose-product-dropdown.tpl.html'"></div>

        </div>
      </div>

      <div class="col-2" ng-class="{'has-error': isShowingErrors(addProductForm, 'productDescription')}">

        <input type="text" class="form-control" name="productDescription" ng-required="true"
               placeholder="Description" ng-model="productExpense.description" ng-maxlength="2000"/>
      </div>

      <div class="col-3" ng-class="{'has-error': isShowingErrors(addProductForm, 'productQty')}">

        <input type="text" class="form-control" placeholder="Qty"
               name="productQty" ng-required="true"
               ng-model="productExpense.quantity" ng-maxlength="10"
               hard-reset-pattern="numberPattern"/>
      </div>

      <div class="col-4">

        <input type="text" class="form-control" placeholder="Amount"
               value="{{ productExpense.item.sale * productExpense.quantity || '' }}" readonly/>
      </div>

      <div class="col-5" ng-if="isAddMode">
        <div class="btn btn-dark has-tooltip" tooltip="Add More" tooltip-placement="top"
             ng-click="addProduct(addProductForm)">
          <i class="icn-sm icn-plus"></i>
        </div>
      </div>

      <div class="col-5" ng-if="!isAddMode">
        <div class="btn btn-primary has-tooltip" tooltip="Remove" tooltip-placement="top"
             ng-click="removeProduct(index)">
          <i class="icn-sm icn-remove-token"></i>
        </div>
      </div>

    </li>

  </ul>
</form>
