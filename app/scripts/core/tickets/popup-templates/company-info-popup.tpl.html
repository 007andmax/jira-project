<div style="max-width: unset;">
  <div style="display: inline-flex;">
    <div class="pull-left" style="margin-right: 10px;">
      <img width="50px" ng-src="{{ getCompanyLogoUrl(company) }}" alt="...">
    </div>

    <div class="pull-right" style="width: calc(100% - 50px)">
      <p style="font-weight: 700;">{{ company.name }}</p>
      <div style="display: inline-flex;">
        <i style="margin: 4px 5px 0 0 ; float: left;" class="icn-sm icn-sb-location"></i>
        <strong>Address:</strong>&nbsp;
        <span style="white-space: nowrap">{{ companyAddress.addressWithSuitNumberAndPostalCode }}</span>
      </div>

      <div style="display: inline-flex;" ng-if="companyAddress.phoneNumbers && companyAddress.phoneNumbers.length && companyPhoneNumber">
        <i style="margin: 4px 5px 0 0 ; float: left;" class="icon-sm" ng-class="{'icn-iphone': companyAddress.phoneNumbers[0].typeNumber === 'MOBILE',
            'icn-user-fax': companyAddress.phoneNumbers[0].typeNumber === 'FAX',
            'icn-user-phone': companyAddress.phoneNumbers[0].typeNumber === 'OFFICE'}"></i>
        <strong>Phone: &nbsp;</strong> <span style="white-space: nowrap;">{{ companyPhoneNumber }}</span>
      </div>

      <div ng-if="company.serviceType">
        <strong>Service type: &nbsp;</strong> {{ userReadable(company.serviceType) }}
      </div>
      <div style="display: inline-flex;" ng-if="company.clientType">
        <strong>Client type: &nbsp;</strong> {{ userReadable(company.clientType) }}
      </div>
    </div>
  </div>

</div>

  (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),

  })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');

  ga('create', 'UA-93441341-1', 'auto');
  ga('send', 'pageview');

</script>
