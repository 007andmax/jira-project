<div class="modal-create-ticket fade in show">
  <form name="ticketForm">
    <div class="modal-dialog create-ticket">
      <div class="modal-content">
        <div class="modal-header clearfix">
          <button type="button" class="close" data-dismiss="modal" aria-label="Close"
                  ng-click="closeCreateTicketForm()">
            <span aria-hidden="true" class="icn-close-modal"></span></button>
          <h4 class="modal-title pull-left">Create Ticket <span class="dot-sep"></span></h4><span
          class="ticket-numer pull-left">TKT# {{ ticketNumber }}</span>
        </div>
        <div class="modal-body">
          <div class="form-group" ng-class="{error: isShowingErrors(ticketForm, 'ticketSubject')}">
            <div ng-messages="ticketForm.ticketSubject.$error" ng-if="isShowingErrors(ticketForm, 'ticketSubject')">
              <div class="qt-error-msg" ng-message="required">Subject is required.</div>
              <div class="qt-error-msg" ng-message="maxlength">Subject is too large.</div>
            </div>
            <input type="text" class="form-control form-control-subject" placeholder="Subject" name="ticketSubject"
                   required="true"
                   ng-model="ticket.subject" ng-maxlength="300">
          </div>
          <div text-editor ng-model="ticket.note">
            <div class="scroll-pane create-ticket-scroll" scroll-pane scroll-max-height-px="400">
              <div class="form-group">
                <div te-editor class="editor" contenteditable="true" placeholder="Type your message..."></div>
              </div>
              <div class="form-group">
                <!--<ul class="note-attachments clearfix">-->
                <!--<li>-->
                <!--<span class="filename">Photo_1.png</span>-->
                <!--<span class="filesize">1.4 MB</span>-->
                <!--<a href="#" class="icn-remove-attachment pull-right"></a>-->
                <!--</li>-->
                <!--<li>-->
                <!--<span class="filename">Products_List.doc</span>-->
                <!--<span class="filesize">2 KB</span>-->
                <!--<a href="#" class="icn-remove-attachment pull-right"></a>-->
                <!--<a href="#" class="icn-restart-uploading pull-right" data-toggle="tooltip" data-placement="top" title="re-upload"></a>-->
                <!--<div class="progress progress-attachment error pull-right">-->
                <!--<div class="progress-bar" role="progressbar" aria-valuenow="39.5" aria-valuemin="0" aria-valuemax="100" style="width: 39.5%;">-->
                <!--<span class="sr-only">39.5% Complete</span>-->
                <!--</div>-->
                <!--</div>-->
                <!--</li>-->
                <!--</ul>-->
              </div>
              <!--<input  id="file" name="file"/>-->
            </div>
            <div class="wysiwyg-controls-wrapper btn-toolbar  clearfix" data-role="editor-toolbar"
                 data-target="#editor">
              <a href="javascript:void(0)" class="pull-left icn-wysiwyg-attachment tp-hide" data-toggle="tooltip"
                 data-placement="top"
                 type="file"
                 title="Attach Files"></a>
              <span class="pull-left line-sep"></span>

              <div class="font-styles pull-left">
                <a href="javascript:void(0)" class="icon pull-left icn-wysiwyg-bold " data-edit="bold"
                   data-toggle="tooltip"
                   data-placement="top" title="Bold"></a>
                <a href="javascript:void(0)" class="icon pull-left icn-wysiwyg-italic " data-edit="italic"
                   data-toggle="tooltip"
                   data-placement="top" title="Italic"></a>
                <a href="javascript:void(0)" class="icon pull-left icn-wysiwyg-underline  " data-edit="underline"
                   data-toggle="tooltip"
                   data-placement="top" title="Underline"></a>
              </div>
              <div class="text-bullets pull-left">
                <a href="javascript:void(0)" class="icon pull-left icn-wysiwyg-bn " data-edit="insertorderedlist"
                   data-toggle="tooltip"
                   data-placement="top" title="Numbered List"></a>
                <a href="javascript:void(0)" class="icon pull-left icn-wysiwyg-bp " data-edit="insertunorderedlist"
                   data-toggle="tooltip"
                   data-placement="top" title="Bulleted List"></a>
              </div>

              <div class="">
                <div class="text-styles pull-left ql-picker-options">
                  <a href="javascript:void(0)" class="icon pull-left icn-wysiwyg-tal" data-edit="justifyleft"
                     data-value="left"
                     data-toggle="tooltip" data-placement="top" title="Align Left"></a>
                  <a href="javascript:void(0)" class="icon pull-left icn-wysiwyg-tac" data-edit="justifycenter"
                     data-toggle="tooltip"
                     data-placement="top" title="Align Center"></a>
                  <a href="javascript:void(0)" class="icon pull-left icn-wysiwyg-tar" data-edit="justifyright"
                     data-toggle="tooltip"
                     data-placement="top" title="Align right"></a>
                  <a href="javascript:void(0)" class="icon pull-left icn-wysiwyg-iless" data-edit="outdent"
                     data-toggle="tooltip"
                     data-placement="top" title="Indent less"></a>
                  <a href="javascript:void(0)" class="icon pull-left icn-wysiwyg-imore" data-edit="indent"
                     data-toggle="tooltip"
                     data-placement="top" title="Indent More"></a>
                </div>
                <a href="javascript:void(0)" class="pull-left icn-wysiwyg-quote" data-edit="cblock"
                   data-toggle="tooltip"
                   data-placement="top" title="Quote"></a>

                <div class="dropdown">
                  <a href="javascript:void(0)" class="pull-left icn icn-wysiwyg-link tooltip-dp" data-edit=""
                     data-toggle="dropdown"
                     data-placement="top" title="Add or Remove Link"></a>

                  <div class="dropdown-menu dropdown-link">
                    <div class="assign-ticket-header">
                      <div class="clearfix">
                        <div class="form-group clearfix">
                          <input type="text" class="form-control " data-edit="createLink" placeholder="http://">
                        </div>
                        <div class="btn-groups clearfix">
                          <button type="button" class="btn btn-scooter disabled ">Add</button>
                          <button type="button" class="btn btn-gray" data-edit="unlink">Cancel</button>
                        </div>
                      </div>
                      <div class="btn-groups clearfix">
                        <button type="button" class="btn btn-scooter disabled ">Add</button>
                        <button type="button" class="btn btn-gray" data-edit="unlink">Cancel</button>
                      </div>
                    </div>
                  </div>
                </div>

                <a href="javascript:void(0)" class="pull-right icn-wysiwyg-reset" data-edit="removeformat"
                   data-toggle="tooltip"
                   data-placement="top" title="Reset Formatting"></a>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <div class="row-wrapper clearfix">
            <div class="form-group dropdown pull-left" ng-class="{error: isShowingErrors(ticketForm, 'ticketCompany')}">
              <label>company</label>

              <div class="qt-error-msg"
                   ng-show="isShowingErrors(ticketForm, 'ticketCompany') && ticketForm.ticketCompany.$error">
                Please select the company.
              </div>
              <input type="text"
                     class="form-control form-control-dropdown form-control-dropdown-company dropdown-toggle"
                     data-toggle="dropdown" ng-model="ticketCompany" name="ticketCompany"
                     typeahead="company as company.name for company in clientCompanies | filter:$viewValue:stateComparator | orderBy:'name'"
                     typeahead-min-length="0" required="true" typeahead-editable="false"
                     qt-typeahead-show-on-focus ng-trim="false"
                     custom-style="{width: '100%', 'max-height': '170px', 'overflow-y': 'scroll'}">
            </div>
            <div class="form-group dropdown pull-left created-for"
                 ng-class="{error: isShowingErrors(ticketForm, 'ticketCreatedUser')}">
              <label>created for</label>

              <div class="qt-error-msg"
                   ng-show="isShowingErrors(ticketForm, 'ticketCreatedUser') && ticketForm.ticketCreatedUser.$error">
                Please select the user.
              </div>

              <input type="text"
                     class="form-control form-control-dropdown dropdown-toggle tokenfield form-control-dropdown-user"
                     data-toggle="dropdown" ng-model="ticketCreatedUser" name="ticketCreatedUser"
                     typeahead-editable="false" typeahead-template-url="/html/partials/user-autocomplete.tpl.html"
                     typeahead="user as getUserName(user) for user in usersCompany | filter:$viewValue:stateComparator | orderBy:'name'"
                     qt-typeahead-show-on-focus ng-trim="false" required="true" ng-disabled="!ticketCompany"
                     custom-style="{width: '382px', 'max-height': '204px', 'overflow-y': 'scroll'}">
            </div>

            <div class="form-group dropdown  cs-type pull-right prority" ng-model="ticket.priorityLevel"
                 ng-class="{error: isShowingErrors(ticketForm, 'ticketPriority')}">
              <label>priority</label>

              <div ng-messages="ticketForm.ticketPriority.$error" ng-if="isShowingErrors(ticketForm, 'ticketPriority')">
                <div class="qt-error-msg" ng-message="required">Priority is required.</div>
              </div>
              <input type="text" class="form-control  form-control-dropdown dropdown-toggle hide-cursor" value=""
                     data-toggle="dropdown" aria-expanded="true" ng-model="ticketPriorityValue[ticket.priorityLevel]"
                     name="ticketPriority" required="true">

              <ul class="dropdown-menu dropdown-account-type">
                <li ng-repeat="(priority, label) in ticketPriorityValue" ng-click="ticket.priorityLevel = priority">
                  <a tabindex="-1" href="javascript:void(0)">{{ label }}</a>
                </li>
              </ul>
            </div>
          </div>
          <div class="row-wrapper clearfix">
            <div class="form-group dropdown pull-left">
              <label>assign to</label>
              <input type="text" class="form-control form-control-dropdown dropdown-toggle" data-toggle="dropdown"
                     aria-expanded="true" ng-model="ticketAssignTo" name="ticketAssignTo"
                     typeahead-editable="false" typeahead-template-url="/html/partials/user-autocomplete.tpl.html"
                     typeahead="user as getUserName(user) for user in usersCurrentCompany | filter:$viewValue:stateComparator | orderBy:'name'"
                     qt-typeahead-show-on-focus custom-style="{width: '382px', 'max-height': '204px', 'overflow-y': 'scroll'}">
            </div>

            <div class="form-group actions-wrapper pull-right">
              <button type="button" class="btn btn-gray" data-dismiss="modal" ng-click="closeCreateTicketForm()">
                Cancel
              </button>
              <button type="button" class="btn btn-scooter" ng-click="saveTicket()">Create</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
