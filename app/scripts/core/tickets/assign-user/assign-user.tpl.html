<div class="assign-ticket">

  <div class="assign-ticket-content" up-down-key ng-model="userToAssign">

    <div class="assign-ticket-header">
      <div class="clearfix">
        <div class="form-group">

          <input type="text" class="form-control tokenfield" data-limit="1"
                 placeholder="Add agent" ng-model="assignToModel"/>

          <div class="label-add-btn">
            <a href="javascript:void(0)"
               class="btn input-btn-cr btn-success  btn-add-more pull-left"
               ng-class="{'disabled': !userToAssign.id}" ng-disabled="!userToAssign.id"
               ng-click="assignUserToTicket()">
              <i class="icn-sm small-icn-tick"></i>
            </a>
          </div>

        </div>
      </div>
    </div>

    <div class="scroll-pane">

      <ul class="users-list custom-scroll nano-content" style="height:204px;">
        <li ng-repeat="assignUser in usersCurrentCompany | filter: filterAssignUser"
            assign-user="{{ assignUser.id }}" ng-click="setUserToAssign(assignUser)"
            ng-class="{'active': $index === currentAssignUser}">

          <a href="javascript:void(0)" class="pull-left avatar">
            <img ng-src="{{ getUserAvatarUrl(assignUser) }}" alt="..." class="img-circle avatar-26">
          </a>

          <div class="clearfix">
            <div class="user-name">
              <a href="javascript:void(0)">{{ getUserName(assignUser, true) }}</a>
            </div>
          </div>

        </li>

      </ul>

    </div>
  </div>

</div>
