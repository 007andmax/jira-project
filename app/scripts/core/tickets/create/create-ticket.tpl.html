<div>
  <form name="ticketForm">

    <div class="modal-header clearfix">
      <a href="javascript:void(0)" class="hit-area pull-right" ng-click="closeCreateTicketForm()">
        <i class="icn-sm icn-remove-token"></i>
      </a>

      <h4 class="modal-title pull-left">Create Ticket <span class="dot-sep"></span></h4>
      <span class="ticket-number pull-left">TKT# {{ ticketNumber }}</span>

      <div class="validation-msg pull-left" style="padding-left: 40px;color: rgb(229, 57, 53);margin-top:-2px;">
        {{ validationMessage(ticketForm) }}
      </div>
    </div>

    <div class="modal-body">

      <div class="form-group" ng-class="{'has-error': isShowingErrors(ticketForm, 'ticketSubject')}">

        <input type="text" class="form-control" placeholder="Subject"
               name="ticketSubject"
               required="true" make-dirty-on-blur
               ng-model="ticket.subject">
      </div>

      <div class="form-group" ng-class="{'has-error': isShowingErrors(ticketForm, 'note')}"
           style="margin-bottom: 8px;">

        <div text-editor ng-model="ticket.note" te-required="true" name="note">

          <div te-editor class="form-control editor" contenteditable="true"
               placeholder="Type your message..." style="min-height: 75px;"></div>

          <div class="form-group">
            <ul class="upload-attachments">
              <li ng-repeat="file in ticketAttachments" ng-style="fileInfo[file.name].error && {'background-color': '#fff2f2'}">

                <span class="file-name">{{ file.name }}</span>
                <span class="file-size">{{ file.size | fileSizeFilter }}</span>

                <a href="javascript:void(0)" class="hit-area pull-right"
                   tooltip="Remove file" tooltip-placement="top"
                   ng-click="removeAttachment($index, fileInfo[file.name].error)">
                  <i class="icn-sm icn-remove-token"></i>
                </a>

                 <span class="pull-right" ng-show="fileInfo[file.name].error" style="color:#e53935">
                   {{ fileInfo[file.name].message }}
                 </span>

                <a href="javascript:void(0)" class="hit-area pull-right"
                   ng-show="file.progress !== 100"
                   tooltip="Re-Upload" tooltip-placement="top" ng-click="reloadAttachment(file)">
                  <i class="icn-sm icn-reupload"></i>
                </a>

                <div class="progress progress-attachment pull-right" ng-show="file.progress !== 100">
                  <div class="progress-bar" role="progressbar"
                       aria-valuenow="{{ file.progress }}" aria-valuemin="0" aria-valuemax="100"
                       ng-style="styleProgressBar(file.progress)">
                    <span class="sr-only">{{ file.progress }}% Complete</span>
                  </div>
                </div>

              </li>
            </ul>
          </div>

          <div class="wysiwyg-controls-wrapper clearfix">
            <div class="control-wrappers pull-left clearfix" data-role="editor-toolbar"
                 style="width: 318px;">

              <div ticket-attachment-files attachment-func="addAttachmentFiles" ng-model="ticketAttachments">
                <a href="javascript:void(0)" class="pull-left hit-area ha-16-18 has-tooltip"
                   tooltip-append-to-body="true" tooltip="Attach Files"
                   tooltip-placement="top">
                  <i class="icn-sm icn-attachment"></i>
                </a>
                <input type="file" style="display:none" multiple=""/>
              </div>

              <span class="pull-left line-sep"></span>

              <div class="font-styles pull-left">
                <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
                   data-edit="bold"
                   tooltip-append-to-body="true" tooltip-placement="top" tooltip="Bold">
                  <i class="icn-sm icn-wysiwyg-bold active"></i>
                </a>
                <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
                   data-edit="italic"
                   tooltip-append-to-body="true" tooltip-placement="top" tooltip="Italic">
                  <i class="icn-sm icn-wysiwyg-italic"></i>
                </a>
                <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
                   data-edit="underline"
                   tooltip-append-to-body="true" tooltip-placement="top" tooltip="Underline">
                  <i class="icn-sm icn-wysiwyg-underline"></i>
                </a>
              </div>

              <div class="text-bullets pull-left">
                <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
                   data-edit="insertorderedlist"
                   tooltip-append-to-body="true" tooltip-placement="top" tooltip="Numbered List">
                  <i class="icn-sm icn-wysiwyg-ol"></i>
                </a>
                <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
                   data-edit="insertunorderedlist"
                   tooltip-append-to-body="true" tooltip-placement="top" tooltip="Bulleted List">
                  <i class="icn-sm icn-wysiwyg-ul"></i>
                </a>
              </div>

              <div class="text-styles pull-left">
                <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
                   data-edit="justifyleft"
                   tooltip-append-to-body="true" tooltip-placement="top" tooltip="Left Align">
                  <i class="icn-sm icn-wysiwyg-align-left"></i>
                </a>
                <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
                   data-edit="justifycenter"
                   tooltip-append-to-body="true" tooltip-placement="top" tooltip="Center Align">
                  <i class="icn-sm icn-wysiwyg-align-center"></i>
                </a>
                <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
                   data-edit="justifyright"
                   tooltip-append-to-body="true" tooltip-placement="top" tooltip="Right Align">
                  <i class="icn-sm icn-wysiwyg-align-right"></i>
                </a>
                <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
                   data-edit="outdent"
                   tooltip-append-to-body="true" tooltip-placement="top" tooltip="Decrease Indent">
                  <i class="icn-sm icn-wysiwyg-unindent"></i>
                </a>
                <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
                   data-edit="indent"
                   tooltip-append-to-body="true" tooltip-placement="top" tooltip="Increase Indent">
                  <i class="icn-sm icn-wysiwyg-indent"></i>
                </a>
              </div>

              <div class="quote-link pull-left">

                <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
                   data-edit="cblock"
                   tooltip-append-to-body="true" tooltip-placement="top" tooltip="Quote">
                  <i class="icn-sm icn-wysiwyg-quote"></i>
                </a>

                <div class="dropup pull-left">

                  <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
                     data-toggle="dropdown" data-container="body" data-placement="top" tooltip="Add or Remove Link">
                    <i class="icn-sm icn-wysiwyg-link"></i>
                  </a>

                  <ul class="dropdown-menu">
                    <li>
                      <div class="add-link-form">

                        <div class="form-group">
                          <input type="text" placeholder="http://" class="form-control"
                                 data-edit="createLink" ng-model="ticketEditorLink" ng-change="validateLink()">
                        </div>

                        <div class="form-group">
                          <div class="btn btn-lg btn-info" ng-disabled="validLink.pattern">Add</div>
                          <div class="btn btn-lg btn-primary" data-edit="unlink">Cancel</div>
                        </div>

                      </div>
                    </li>
                  </ul>

                </div>

              </div>
            </div>

            <a href="javascript:void(0)" class="hit-area ha-14 pull-right disabled has-tooltip"
               data-edit="removeformat"
               tooltip-append-to-body="true" tooltip-placement="top" tooltip="Reset Formating">
              <i class="icn-sm icn-wysiwyg-reset"></i>
            </a>

          </div>

        </div>
      </div>

    </div>

    <div class="modal-footer">
      <ul class="qt-table">
        <li>

          <div>
            <div class="form-group" ng-class="{'has-error': isShowingErrors(ticketForm, 'ticketCompany')}">

              <label>Company</label>

              <input type="text" class="form-control has-dropdown"
                     ng-model="ticketCompany" name="ticketCompany"
                     typeahead="company as company.name for company in clientCompanies | filter:$viewValue:stateComparator | orderBy:'name'"
                     typeahead-min-length="0" ng-required="true" typeahead-editable="false"
                     qt-typeahead-show-on-focus ng-trim="false"
                     custom-style="{width: '174px', 'max-height': '170px', 'overflow-y': 'scroll'}">

            </div>
          </div>

          <div>
            <div class="form-group dropdown-user-parent"
                 ng-class="{'has-error': isShowingErrors(ticketForm, 'ticketCreatedUser')}">

              <label>Created for</label>

              <input type="text" class="form-control has-dropdown"
                     ng-model="ticketCreatedUser" name="ticketCreatedUser"
                     typeahead-editable="false" typeahead-template-url="/html/partials/user-autocomplete.tpl.html"
                     typeahead="user as getUserName(user) for user in usersCompany | filter:$viewValue:stateComparator | orderBy:'name'"
                     qt-typeahead-show-on-focus ng-trim="false" ng-required="true" ng-disabled="!ticketCompany"
                     custom-style="{width: '380px', 'max-height': '204px', 'overflow-y': 'scroll'}">

            </div>
          </div>
          <div>
            <div class="form-group">

              <label>Priority</label>

              <input type="text" class="form-control has-dropdown" data-toggle="dropdown"
                     ng-model="ticketPriorityValue[ticket.priorityLevel]" readonly>

              <ul class="dropdown-menu dropdown-priority" role="menu">

                <li ng-repeat="(priority, label) in ticketPriorityValue" ng-click="ticket.priorityLevel = priority">
                  <a tabindex="-1" href="javascript:void(0)">
                    <span class="priority-dot {{ label.toLowerCase() }}"></span>{{ label }}
                  </a>
                </li>

              </ul>

            </div>
          </div>
        </li>

        <li>
          <div>
            <div class="form-group dropdown-user-parent">

              <label>Assign to</label>

              <input type="text" class="form-control has-dropdown"
                     ng-model="ticketAssignTo" name="ticketAssignTo"
                     typeahead-editable="false" typeahead-template-url="/html/partials/user-autocomplete.tpl.html"
                     typeahead="user as getUserName(user) for user in usersCurrentCompany | filter:$viewValue:stateComparator | orderBy:'name'"
                     qt-typeahead-show-on-focus assign-to-validation ng-required="false"
                     custom-style="{width: '380px', 'max-height': '204px', 'overflow-y': 'scroll'}">

            </div>
          </div>

          <div></div>

          <div>
            <div class="actions-wrapper" style="width: 171px;bottom: 0px;">

              <div class="btn btn-lg btn-primary" data-dismiss="modal"
                   ng-click="closeCreateTicketForm()">
                Cancel
              </div>

              <div class="btn btn-lg btn-info" ng-click="saveTicket(ticketForm)"
                   ng-disabled="(ticketForm.$invalid || ticketForm.$pristine || savingInProcess) && triedToSaveTicket">
                Create
              </div>

            </div>
          </div>
        </li>
      </ul>
    </div>
  </form>
</div>
