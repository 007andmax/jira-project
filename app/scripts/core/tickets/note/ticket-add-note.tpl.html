<div class="ticket-update-note">

  <input type="hidden" ng-model="ticketUpdate.note" ng-required="true" ng-maxlength="65000" name="updateNote"/>

  <div text-editor te-initial-value="{{ ticketUpdate.note }}" ng-model="ticketUpdate.note" name="note">

    <div te-editor class="form-control editor" contenteditable="true"
         style="min-height: 92px;height: auto;border: none;" data-text="Click here to respond to the Ticket"></div>

    <div class="wysiwyg-controls-wrapper clearfix">
      <div class="control-wrappers pull-left clearfix" data-role="editor-toolbar">

        <div class="font-styles pull-left">
          <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
             data-edit="bold"
             tooltip-append-to-body="true" tooltip-placement="top" uib-tooltip="Bold">
            <i class="icon-sm wysiwyg-bold "></i>
          </a>
          <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
             data-edit="italic"
             tooltip-append-to-body="true" tooltip-placement="top" uib-tooltip="Italic">
            <i class="icon-sm wysiwyg-italic"></i>
          </a>
          <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
             data-edit="underline"
             tooltip-append-to-body="true" tooltip-placement="top" uib-tooltip="Underline">
            <i class="icon-sm wysiwyg-underline"></i>
          </a>
        </div>

        <div class="text-bullets pull-left">
          <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
             data-edit="insertorderedlist"
             tooltip-append-to-body="true" tooltip-placement="top" uib-tooltip="Numbered List">
            <i class="icon-sm wysiwyg-ol"></i>
          </a>
          <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
             data-edit="insertunorderedlist"
             tooltip-append-to-body="true" tooltip-placement="top" uib-tooltip="Bulleted List">
            <i class="icon-sm wysiwyg-ul"></i>
          </a>
        </div>

        <div class="text-styles pull-left">
          <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
             data-edit="justifyleft"
             tooltip-append-to-body="true" tooltip-placement="top" uib-tooltip="Left Align">
            <i class="icn-sm icn-wysiwyg-align-left"></i>
          </a>
          <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
             data-edit="justifycenter"
             tooltip-append-to-body="true" tooltip-placement="top" uib-tooltip="Center Align">
            <i class="icn-sm icn-wysiwyg-align-center"></i>
          </a>
          <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
             data-edit="justifyright"
             tooltip-append-to-body="true" tooltip-placement="top" uib-tooltip="Right Align">
            <i class="icn-sm icn-wysiwyg-align-right"></i>
          </a>
          <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
             data-edit="outdent"
             tooltip-append-to-body="true" tooltip-placement="top" uib-tooltip="Decrease Indent">
            <i class="icon-sm wysiwyg-unindent"></i>
          </a>
          <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
             data-edit="indent"
             tooltip-append-to-body="true" tooltip-placement="top" uib-tooltip="Increase Indent">
            <i class="icon-sm wysiwyg-indent"></i>
          </a>
        </div>

        <div class="quote-link pull-left">

          <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
             data-edit="cblock"
             tooltip-append-to-body="true" tooltip-placement="top" uib-tooltip="Quote">
            <i class="icon-sm wysiwyg-quote"></i>
          </a>

          <div class="dropup pull-left" uib-dropdown>

            <a href="javascript:void(0)" class="hit-area ha-14 pull-left has-tooltip"
               uib-dropdown-toggle data-container="body" data-placement="top"
               uib-tooltip="Add or Remove Link">
              <i class="icon-sm wysiwyg-link"></i>
            </a>

            <ul class="dropdown-menu">
              <li>
                <div class="add-link-form">

                  <div class="form-group">
                    <input type="text" placeholder="http://" class="form-control"
                           data-edit="createLink" ng-model="ticketEditorLink"
                           ng-change="validateLink(ticketEditorLink)">
                  </div>

                  <div class="form-group">
                    <div class="btn btn-lg btn-primary" custom-disabled="{{ validLink.pattern }}">Add</div>
                    <div class="btn btn-lg btn-primary  " data-edit="unlink">Cancel</div>
                  </div>

                </div>
              </li>
            </ul>

          </div>

        </div>
      </div>

      <a href="javascript:void(0)" class="hit-area ha-14 pull-right has-tooltip reset-formatting"
         data-edit="removeformat"
         tooltip-append-to-body="true" tooltip-placement="top" uib-tooltip="Reset Formating">
        <i class="icon-sm wysiwyg-reset"></i>
      </a>

    </div>

  </div>

  <div class="form-group">
    <ul class="upload-attachments">

      <li ng-repeat="file in ticketUpdate.attachments"
          ng-style="fileInfo[file.name].error && {'background-color': '#fff2f2'}">

        <span class="file-name">{{ file.name }}</span>
        <span class="file-size">{{ file.size | fileSizeFilter }}</span>

        <a href="javascript:void(0)" class="hit-area pull-right"
           uib-tooltip="Remove file" tooltip-placement="top" ng-click="removeAttachment($index, fileInfo[file.name].error)">
          <i class="icon-sm icn-remove-token"></i>
        </a>

         <span class="pull-right" ng-show="fileInfo[file.name].error"
               style="color: rgb(229, 57, 53);white-space: nowrap;overflow: hidden;max-width: 300px;">
          {{ fileInfo[file.name].message }}
        </span>

        <a href="" class="hit-area pull-right" data-toggle="tooltip" data-placement="top" title="Re-Upload"
           ng-show="file.progress !== 100 && (fileInfo[file.name].code !== 500)"
           uib-tooltip="Re-Upload" tooltip-placement="top" ng-click="reloadAttachment(file)">
          <i class="icn-sm icn-reupload"></i>
        </a>

        <div class="progress progress-attachment pull-right" ng-show="file.progress !== 100">
          <div class="progress-bar" role="progressbar"
               aria-valuenow="{{ file.progress }}" aria-valuemin="0" aria-valuemax="100"
               ng-style="styleProgressBar(file.progress)">
            <span class="sr-only">{{ file.progress }}% Complete</span>
          </div>
        </div>

      </li>

    </ul>
  </div>
</div>
