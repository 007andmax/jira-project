<div>

  <input type="hidden" ng-model="ticketUpdate.note" ng-required="true" ng-maxlength="65000" name="updateNote"/>

  <textarea class="form-control" placeholder="Click here to respond to the Ticket"
            contenteditable="true" ticket-note-fild ng-model="ticketUpdate.note"></textarea>

  <div class="form-group">
    <ul class="upload-attachments">

      <li ng-repeat="file in ticketUpdate.attachments"
          ng-style="fileInfo[file.name].error && {'background-color': '#fff2f2'}">

        <span class="file-name">{{ file.name }}</span>
        <span class="file-size">{{ file.size | fileSizeFilter }}</span>

        <a href="javascript:void(0)" class="hit-area pull-right"
           tooltip="Remove file" tooltip-placement="top" ng-click="removeAttachment($index, fileInfo[file.name].error)">
          <i class="icn-sm icn-remove-token"></i>
        </a>

         <span class="pull-right" ng-show="fileInfo[file.name].error"
               style="color: rgb(229, 57, 53);white-space: nowrap;overflow: hidden;max-width: 300px;">
          {{ fileInfo[file.name].message }}
        </span>

        <a href="" class="hit-area pull-right" data-toggle="tooltip" data-placement="top" title="Re-Upload"
           ng-show="file.progress !== 100 && (fileInfo[file.name].code !== 500)"
           tooltip="Re-Upload" tooltip-placement="top" ng-click="reloadAttachment(file)">
          <i class="icn-sm icn-reupload"></i>
        </a>

        <div class="progress progress-attachment pull-right" ng-show="file.progress !== 100">
          <div class="progress-bar" role="progressbar"
               aria-valuenow="{{ file.progress }}" aria-valuemin="0" aria-valuemax="100"
               ng-style="styleProgressBar(file.progress)">
            <span class="sr-only">{{ file.progress }}% Complete</span>
          </div>
        </div>

      </li>

    </ul>
  </div>
</div>
