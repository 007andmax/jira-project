<div ng-controller="quicktech.core.tickets.ticketsCtrl" ticket-uploader
     ng-if="!(listType === 'spam' && currentUser.role !== 'USER')">
  <div class="ticket-sidebar tickets-list" tu-tickets-container ng-if="listType">

    <div ng-repeat="ticket in tickets" ng-init="onTicketRendering($last)"
         ng-controller="quicktech.core.tickets.ticketCtrl">
      <div ng-include="'/html/scripts/core/tickets/ticket.tpl.html'"></div>
    </div>
  </div>

  <div ui-view ticket-fixed-header></div>

</div>

<div ng-controller="quicktech.core.tickets.ticketsCtrl" ticket-uploader
     ng-if="listType === 'spam' && currentUser.role !== 'USER'">
  <div class="ticket-sidebar tickets-list" tu-tickets-container ng-if="listType">

    <div  upload-admin-spam="true">

      <div class="spam-msg" ng-show="markedSpamMesage">Tickets Marked as Spam</div>

      <div ng-repeat="ticket in tickets" ng-init="onTicketRendering($last)"
           ng-controller="quicktech.core.tickets.ticketCtrl">
        <div ng-include="'/html/scripts/core/tickets/ticket.tpl.html'"></div>
      </div>

      <div class="spam-msg-default" ng-show="reportedSpamMesage">Tickets Reported as Spam</div>

      <div ng-repeat="ticket in reportSpamTickets" ng-init="onReportedAsSpamTicketRendering($last)"
           ng-controller="quicktech.core.tickets.ticketCtrl">
        <div ng-include="'/html/scripts/core/tickets/ticket.tpl.html'"></div>
      </div>
    </div>
  </div>

  <div ui-view ticket-fixed-header></div>

</div>
