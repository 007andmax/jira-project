<div ng-controller="quicktech.core.tickets.ticketsCtrl" ticket-uploader
     ng-if="!(listType === 'spam' && currentUser.role !== 'USER')">
  <div class="container-ticket-list pull-left" tu-tickets-container
       ng-if="listType && listType !== 'preview'">

    <div class="ticket-list">
      <ul class="tickets">
        <li class="ticket" ng-repeat="ticket in tickets" ng-init="onTicketRendering($last)"
            ng-controller="quicktech.core.tickets.ticketCtrl" ticket-review-size
            ng-class="{'selected' : selectedTickets[ticket.id], 'closed': ticket.status === 'COMPLETED', 'active': ticket.id === currentOpeningTicket}"
            ng-click="srefToDetails($event)">
          <div ng-include="'/html/scripts/core/tickets/ticket.tpl.html'"></div>
        </li>
      </ul>
    </div>
  </div>

  <div ui-view ticket-fixed-header></div>

</div>

<div ng-controller="quicktech.core.tickets.ticketsCtrl" ticket-uploader
     ng-if="listType === 'spam' && currentUser.role !== 'USER'">
  <div class="container-ticket-list pull-left" tu-tickets-container ng-if="listType">

    <div class="ticket-list" upload-admin-spam="true">

      <ul class="tickets">

        <li class="ticket-type" ng-show="markedSpamMesage && tickets.length !== 0">
          <small><b>TICKETS MARKED AS SPAM</b></small>
        </li>

        <li class="ticket" ng-repeat="ticket in tickets" ng-init="onTicketRendering($last)" ticket-review-size
            ng-class="{'selected' : selectedTickets[ticket.id], 'closed': ticket.status === 'COMPLETED', 'active': ticket.id === currentOpeningTicket}"
            ng-controller="quicktech.core.tickets.ticketCtrl" ng-click="srefToDetails($event)">
          <div ng-include="'/html/scripts/core/tickets/ticket.tpl.html'"></div>
        </li>

        <li class="ticket-type" ng-show="reportedSpamMesage && reportSpamTickets.length !== 0">
          <small><b>TICKETS REPORTED AS SPAM</b></small>
        </li>

        <li class="ticket" ng-repeat="ticket in reportSpamTickets"
            ng-init="onReportedAsSpamTicketRendering($last)" ticket-review-size
            ng-class="{'selected' : selectedTickets[ticket.id], 'closed': ticket.status === 'COMPLETED', 'active': ticket.id === currentOpeningTicket}"
            ng-controller="quicktech.core.tickets.ticketCtrl" ng-click="srefToDetails($event)">
          <div ng-include="'/html/scripts/core/tickets/ticket.tpl.html'"></div>
        </li>

      </ul>
    </div>
  </div>

  <div ui-view ticket-fixed-header></div>

</div>
