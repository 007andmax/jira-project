<div ng-controller="quicktech.core.tickets.ticketsCtrl" ticket-uploader>

  <div class="container-ticket-list pull-left">

      <p style="opacity: 0.57">There are no tickets</p>

            ng-controller="quicktech.core.tickets.ticketCtrl" on-finish-render="onFinishRendering()"
            ng-class="{'selected' : selectedTickets[ticket.id], 'closed': ticket.status === 'COMPLETED', 'active': ticket.id === currentOpeningTicket}"
            ui-sref="tickets.details({ ticketId: ticket.id, remoteParams: null })">
          <div ng-include="'/html/scripts/core/tickets/ticket.tpl.html'"></div>
        </li>

                ng-click="toggleMobileTicketsFilters(true)">
          Filters
