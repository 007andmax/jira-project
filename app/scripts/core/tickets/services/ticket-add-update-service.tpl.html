<form name="addServiceForm" class="ticket-add-service">

  <div class="ticket-add-service-content">
    <div class="col-5" ng-class="{'has-error': isShowingErrors(addServiceForm, 'service')}">
      <div uib-dropdown>
        <input type="text"
               name="serviceName"
               ng-disabled="!serviceList.length"
               ng-model="serviceExpense.item"
               ng-minlength="1"
               autocomplete="off"
               placeholder="Service"
               class="new-input form-control-dropdown dropdown-toggle new-service-input"
               uib-typeahead="service as service.name for service in serviceList |  orderBy:'name'"
               typeahead-append-to-body="true"
               qt-typeahead-async-show-on-focus>

        <div style="position: absolute;right: 10px;top: 9px;cursor: pointer;"
             typeahead-input-icon="serviceExpense.item"></div>
        <div class="service-list-container"></div>
        <input type="hidden" name="service" ng-model="serviceExpense.item.versionedId.id"
               ng-required="serviceExpense.item ? true : false">
      </div>
    </div>
    <div ng-if="isMobileUpdateShown">
      <div class="col-2" service-quantity-picker="serviceExpense.quantity" sqp-is-show-format="false"
           ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceTime')}">
        <input uib-tooltip="Hr(s) : Min(s)" tooltip-placement="top"
               id="service-quantity-picker" type="text" class="form-control"
               placeholder="Hr(s) : Min(s)" sqp-input
               autocomplete="off" aria-expanded="true"/>
        <input type="hidden" ng-model="serviceExpense.quantity" name="serviceTime"
               ng-required="serviceExpense.item ? true : false"/>
      </div>
    </div>
    <div  ng-if="serviceExpenseDurationPresentation==='DURATION_PICKER' && !isMobileUpdateShown ">
      <div class="col-4 new-quantity-picker"
           service-quantity-picker="serviceExpense.quantity"
           type="hours"
           sqp-is-show-format="false"
           ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceTime')}">
        <input id="service-quantity-picker-hour" type="text" class="pointer new-input"
               placeholder="Hr(s)" sqp-input
               autocomplete="off" aria-expanded="true"  smart-dropdown-menu-position="hour" />
        <input type="hidden" ng-model="serviceExpense.quantity" name="serviceTime"
               ng-required="serviceExpense.item ? true : false" smart-dropdown-menu-position />
      </div>
      <div class="col-4 new-quantity-picker"
           service-quantity-picker="serviceExpense.quantity"
           sqp-is-show-format="false"
           type="minutes"
           ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceTime')}">
        <input id="service-quantity-picker-minutes" type="text" class="pointer new-input"
               placeholder="Mn" sqp-input
               autocomplete="off" aria-expanded="true" smart-dropdown-menu-position="hour" />
        <input type="hidden" ng-model="serviceExpense.quantity" name="serviceTime"
               ng-required="serviceExpense.item ? true : false" smart-dropdown-menu-position />
      </div>
    </div>

    <div class="col-2 new-quantity-picker" ng-if="serviceExpenseDurationPresentation==='TIME_PICKER'">
      <input type="text" class="pointer new-input"
             placeholder="Start date | End date"
             value="{{saveStartDate.hour}}:{{saveStartDate.minute}} {{saveStartDate.time}} | {{saveEndDate.hour}}:{{saveEndDate.minute}} {{saveEndDate.time}}"
             ng-click="showTimePickerBlock()"
             autocomplete="off" />
      <div class="timepicker-wrap" ng-if="showTimePicker">
        <div class="timepicker">
          <div class="timepicker-choosen-time">
            <div class="col-6 timepicker-choosen-time__start-time">
              <p class="col-12">Start time</p>
              <p class="col-12">{{startDate.hour}}:{{startDate.minute}} {{startDate.time}}</p>
            </div>
            <div class="col-6 timepicker-choosen-time__end-time">
              <p class="col-12">End time</p>
              <p class="col-12">{{endDate.hour}}:{{endDate.minute}} {{endDate.time}}</p>
            </div>
          </div>
          <div class="timepicker-start-time timepicker-time">
            <proton:multi-list-picker ng-model="startDate" attachment="{{attachment}}" bind-html="{{bindHtml}}"
                                      done="showTimePicker = false">
              <proton:multi-list-picker-divider>
              </proton:multi-list-picker-divider>
              <proton:multi-list-picker-list alias="hour" cycle="true">
                <proton:multi-list-picker-list-item>01</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>02</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>03</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>04</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>05</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>06</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>07</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>08</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>09</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>10</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>11</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>12</proton:multi-list-picker-list-item>
              </proton:multi-list-picker-list>
              <proton:multi-list-picker-divider>:</proton:multi-list-picker-divider>
              <proton:multi-list-picker-list alias="minute" source="getMinutes()" cycle="true">
              </proton:multi-list-picker-list>
              <proton:multi-list-picker-list alias="time">
                <proton-multi-list-picker-list-item>AM</proton-multi-list-picker-list-item>
                <proton-multi-list-picker-list-item>PM</proton-multi-list-picker-list-item>
              </proton:multi-list-picker-list>
            </proton:multi-list-picker>
          </div>
          <div class="timepicker-end-time timepicker-time">
            <proton:multi-list-picker ng-model="endDate" attachment="{{attachment}}" bind-html="{{bindHtml}}"
                                      done="showTimePicker = false">
              <proton:multi-list-picker-divider>
              </proton:multi-list-picker-divider>
              <proton:multi-list-picker-list alias="hour" cycle="true">
                <proton:multi-list-picker-list-item>01</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>02</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>03</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>04</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>05</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>06</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>07</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>08</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>09</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>10</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>11</proton:multi-list-picker-list-item>
                <proton:multi-list-picker-list-item>12</proton:multi-list-picker-list-item>
              </proton:multi-list-picker-list>
              <proton:multi-list-picker-divider>:</proton:multi-list-picker-divider>
              <proton:multi-list-picker-list alias="minute" source="getMinutes()" cycle="true">
              </proton:multi-list-picker-list>
              <proton:multi-list-picker-list alias="time">
                <proton-multi-list-picker-list-item>AM</proton-multi-list-picker-list-item>
                <proton-multi-list-picker-list-item>PM</proton-multi-list-picker-list-item>
              </proton:multi-list-picker-list>
            </proton:multi-list-picker>
          </div>
          <div class="timepicker-action-button">
            <p class="timepicker-action-button__save pointer" ng-click="saveTime()">Save</p>
            <p class="timepicker-action-button__cancel pointer" ng-click="cancelTime()">Cancel</p>
          </div>
        </div>
      </div>

      <input type="hidden" ng-model="serviceExpense.quantity" name="serviceTime"
      ng-required="serviceExpense.item ? true : false" smart-dropdown-menu-position/>
    </div>
    <div class="col-2 new-date-picker" style="position: relative"
         ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceData')}">
      <input type="text" class="new-input absolute-stick-datepicker has-dropdown" placeholder="Date"
             qt-data-time-picker data-position="ticket" max-date="maxServiceDate" ng-model="serviceExpense.date"
             name="serviceData" ng-required="true">
    </div>
    <div class="col-1" ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceDescription')}">
      <!--<textarea type="text" class="new-input" placeholder="Description"-->
      <!--ng-model="serviceExpense.description" ng-maxlength="2000"-->
      <!--name="serviceDescription" max-length-word="100"></textarea>-->
      <div class="ticket-update-service-description">
        <div text-editor te-initial-value="{{ ticketUpdate.note }}" ng-model="serviceExpense.description"
             name="note" te-text-maxlength="5000" te-html-maxlength="50000">
          <div te-editor class="editor" contenteditable="true" data-text="Description"></div>
        </div>
      </div>
  </div>

  <div class="ticket-add-service-actions">
    <div style="margin-bottom: 25px;" class="has-tooltip" tooltip-placement="top" uib-tooltip="Remove"
         ng-click="removeService()">
      <i class="icon-sm icn-delete"></i>
    </div>
    <div ng-if="$last">
      <div class="has-tooltip add-expense-btn" uib-tooltip="Add" tooltip-placement="top"
           ng-click="addService()">
        <i class="icon-sm icn-add-action"></i>
      </div>
    </div>
  </div>
</form>
