<form name="addServiceForm">
  <ul class="qt-table">
    <li class="discount-barcode">

      <div ng-show="isShowServiceDiscountInputField && checkAgreementTypeToShowDiscount(serviceExpense)"
           class="col-3 form-group discount-input"
           ng-class="{'has-error': isShowingErrors(addServiceForm, 'discountAmount')}">
        <input maxlength="3"
               type="text"
               placeholder="Discount"
               class="form-control"
               name="discountAmount"
               ng-model="serviceExpense.discountAmount"
               ng-max="100"
               ng-min="0"
               hard-reset-pattern="PERCENT"
               execute-when-outfocused="isShowInputField = false"
               ng-keydown="$event.which === 13 && $event.preventDefault()">
      </div>
    </li>
    <!--<li>-->
    <!--<div class="col-1">Service</div>-->
    <!--<div class="col-2">Hr(s) : Min(s)</div>-->
    <!--<div class="col-3">Description</div>-->
    <!--</li>-->
    <li class="service-add-width">
      <div class="col-1" ng-class="{'has-error': isShowingErrors(addServiceForm, 'service')}">
        <div uib-dropdown>
          <input type="text" class="form-control has-dropdown"
                 name="serviceName" autocomplete="off" ng-disabled="!serviceList.length"
                 placeholder="Service" autocomplete-service-item="serviceExpense.item"
                 ng-model="serviceExpense.item.name" service-list="serviceList"
                 autocomplete-service-list uib-dropdown-toggle/>
          <i class="icn-sm icn-caret-gray"></i>
          <div class="service-list-container"></div>
          <input type="hidden" name="service" ng-model="serviceExpense.item.versionedId.id" ng-required="true">
        </div>
      </div>
      <div class="col-2" service-quantity-picker="serviceExpense.quantity" sqp-is-show-format="false"
           ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceTime')}">
        <input id="service-quantity-picker" type="text" class="form-control"
               placeholder="Hr(s) : Min(s)" sqp-input
               autocomplete="off" aria-expanded="true"/>
        <input type="hidden" ng-model="serviceExpense.quantity" name="serviceTime" ng-required="true"/>
      </div>
      <div class="col-3"
           ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceDescription')}">
        <input type="text" class="form-control" placeholder="Description"
               ng-model="serviceExpense.description" ng-maxlength="2000"
               name="serviceDescription" max-length-word="100"/>
      </div>

      <div class="col-4" style="width: 60px;">
        <div>
          <div>
            <i class="icon-sm sale-icon-for-isDicount"
               ng-click="isShowServiceDiscountInputField = !isShowServiceDiscountInputField"
               ng-show="checkAgreementTypeToShowDiscount(serviceExpense)" uib-tooltip="Discount"></i>
          </div>

          <!--<div ng-show="isShowServiceDiscountInputField || serviceExpense.discountAmount != null" class="form-group discount-input" ng-class="{'has-error': isShowingErrors(addServiceForm, 'discountAmount')}">-->
          <!--<input maxlength="3"-->
          <!--type="text"-->
          <!--class="form-control"-->
          <!--name="discountAmount"-->
          <!--ng-model="serviceExpense.discountAmount"-->
          <!--ng-max="100"-->
          <!--ng-min="0"-->
          <!--hard-reset-pattern="PERCENT"-->
          <!--ng-keydown="$event.which === 13 && $event.preventDefault()">-->
          <!--</div>-->
          <!--<div ng-show="false">-->
          <!--<select ng-model="serviceExpense.discountType = 'PERCENT'">-->
          <!--<option value="PERCENT" selected>PERCENT</option>-->
          <!--<option value="null">null</option>-->
          <!--</select>-->
          <!--</div>-->
        </div>
      </div>


      <div style="width: 43px;" ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceData')}">
        <div>
          <input type="text" class="form-control absolute-stick-datepicker has-dropdown" placeholder="Date"
                 qt-data-time-picker max-date="maxServiceDate" ng-model="serviceExpense.date"
                 name="serviceData" ng-required="true">
          <div>
            <i class="report-calendar"></i>
          </div>
        </div>
      </div>

      <div style="width: 25px">
        <div class="col-5" ng-if="ticketUpdate.services.length > 1 && !$last" style="float: left; width: 36px;">
              <span class="has-tooltip" tooltip-placement="top" uib-tooltip="Remove"
                    ng-click="removeService()">
                <i class="icon-sm icn-delete"></i>
              </span>
        </div>

        <div style="float: left;" ng-if="$last">
          <div class="has-tooltip add-expense-btn" uib-tooltip="Add Service" tooltip-placement="top"
               ng-click="addService()">
            <i class="icon-sm icn-add-action"></i>
          </div>
        </div>
      </div>
    </li>
  </ul>
</form>
