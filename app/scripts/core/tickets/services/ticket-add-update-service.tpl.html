<div ng-init="formName = 'addServiceForm' + $id"></div>
<form name="addServiceForm">

  <ul class="qt-table">
    <li>

      <div class="col-1" ng-class="{'has-error': isShowingErrors(addServiceForm, 'service')}">
        <div class="dropdown">

          <input type="text" class="form-control has-dropdown"
                 name="serviceName"
                 placeholder="Service" data-toggle="dropdown" aria-expanded="true"
                 ng-model="serviceExpense.item.name"/>
          <i class="icn-sm icn-caret-gray"></i>

          <input type="hidden" name="service" ng-model="serviceExpense.item.versionedId.id" ng-required="true">


          <ul class="dropdown-menu dropdown-menu-services">

            <li role="presentation" ng-repeat="service in serviceList | filter: {name: serviceNameFilter} ">
              <a role="menuitem" tabindex="-1" href="javascript:void(0)" ng-click="setNewService(service)">
                {{ service.name }}
              </a>
            </li>

          </ul>

        </div>
      </div>

      <div class="col-2" ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceTime')}">

        <input type="text" class="form-control" placeholder="Minutes"
               ng-model="serviceExpense.quantity"
               name="serviceTime" hard-reset-required="true" ng-maxlength="10"
               aria-expanded="true" hard-reset-pattern="numberPattern"/>
      </div>

      <div class="col-3" ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceDescription')}">

        <input type="text" class="form-control" placeholder="Description"
               ng-model="serviceExpense.description" ng-maxlength="2000"
               name="serviceDescription"/>
      </div>

      <div class="col-4" ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceData')}">

        <div class="dropdown">

          <i class="icn-sm icn-caret-gray" style="position: absolute;top: 13px;right: 13px;z-index: 1;"></i>
          <input type="text" class="form-control has-dropdown" qt-data-time-picker max-date="maxServiceDate"
                 data-toggle="dropdown" aria-expanded="false" placeholder="Date"
                 ng-model="serviceExpense.date"
                 name="serviceData" ng-required="true">

        </div>

      </div>

      <div class="col-5" ng-if="$last">
        <span class="btn btn-dark has-tooltip" tooltip-placement="top" tooltip="Add more"
              ng-click="addService(addServiceForm)">
          <i class="icn-sm icn-plus"></i>
        </span>
      </div>

      <div class="col-5" ng-if="!$last">
        <span class="btn btn-primary has-tooltip" tooltip-placement="top" tooltip="Remove"
              ng-click="removeService()">
          <i class="icn-sm icn-remove-token"></i>
        </span>
      </div>

    </li>
  </ul>

</form>
