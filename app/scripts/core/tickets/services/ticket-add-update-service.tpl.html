<form name="addServiceForm">
  <ul class="qt-table">
    <li class="service-add-width">
      <div class="col-1" ng-class="{'has-error': isShowingErrors(addServiceForm, 'service')}">
        <div uib-dropdown>
          <input type="text" class="form-control has-dropdown"
                 name="serviceName" autocomplete="off" ng-disabled="!serviceList.length"
                 placeholder="Service" autocomplete-service-item="serviceExpense.item"
                 ng-model="serviceExpense.item.name" service-list="serviceList"
                 autocomplete-service-list uib-dropdown-toggle/>
          <i class="icn-sm icn-caret-gray"></i>
          <div class="service-list-container"></div>
          <input type="hidden" name="service" ng-model="serviceExpense.item.versionedId.id" ng-required="true">
        </div>
      </div>
      <div class="col-2" service-quantity-picker="serviceExpense.quantity" sqp-is-show-format="false"
           ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceTime')}">
        <input id="service-quantity-picker" type="text" class="form-control"
               placeholder="Hr(s) : Min(s)" sqp-input
               autocomplete="off" aria-expanded="true"/>
        <input type="hidden" ng-model="serviceExpense.quantity" name="serviceTime" ng-required="true"/>
      </div>
      <div class="col-3"
           ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceDescription')}">
        <input type="text" class="form-control" placeholder="Description"
               ng-model="serviceExpense.description" ng-maxlength="2000"
               name="serviceDescription" max-length-word="100"/>
      </div>

      <!--DISCOUNTS-->
      <!--Discount amount-->
        <div class="col-1" style="width: 100px;">
          <div class="form-group" ng-class="{'has-error': isShowingErrors(addServiceForm, 'discountAmount')}">
            <input type="text"
                   class="form-control"
                   placeholder="Discount"
                   name="discountAmount"
                   ng-model="serviceExpense.discountAmount"
                   ng-max="discountAmountMsxLength"
                   ng-min="0"
                   hard-reset-pattern="pricePattern"
                   ng-required="serviceExpense.discountType == 'PERCENT' || serviceExpense.discountType == 'FIXED'"
                   ng-disabled="!serviceExpense.discountType"
                   qt-to-fixed="2">
          </div>
        </div>
      <!--Discount type-->
        <div class="col-1" style="width: 85px;">
          <div class="form-group">
            <div uib-dropdown keyboard-nav="true">

              <button class="form-control form-control-dropdown account-type no-cursor has-dropdown"
                      uib-dropdown-toggle aria-expanded="true"
                      tabindex="32">
                {{discountTypes[serviceExpense.discountType]}} <b ng-hide="serviceExpense.discountType"
                                                                  style="color: rgba(76, 92, 111, 0.36)">Type</b>
              </button>
              <i class="icn-sm icn-caret-gray"></i>

              <ul class="dropdown-menu dropdown-account-type">
                <li ng-click="serviceExpense.discountType = 'PERCENT'; discountAmountMsxLength = 100">
                  <a href="javascript:void(0)"> Percent</a>
                </li>
                <li ng-click="serviceExpense.discountType = 'FIXED'; discountAmountMsxLength = null">
                  <a href="javascript:void(0)"> Fixed </a>
                </li>
                <li
                  ng-click="serviceExpense.discountType = ''; discountAmountMsxLength = ''; serviceExpense.discountAmount = null">
                  <a href="javascript:void(0)"> No Discount </a>
                </li>
              </ul>

            </div>
          </div>
        </div>

      <div style="width: 43px;" ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceData')}">
        <div>
          <input type="text" class="form-control absolute-stick-datepicker has-dropdown" placeholder="Date"
                 qt-data-time-picker max-date="maxServiceDate" ng-model="serviceExpense.date"
                 name="serviceData" ng-required="true">
          <div class="btn-icn btn btn-primary">
            <img src="images/input-icons/calendar.svg" width="100%" height="100%" alt="">
          </div>
        </div>
      </div>

      <div style="width: 100px">
        <div class="col-5" ng-if="ticketUpdate.services.length > 1" style="float: left; width: 36px;">
              <span class="btn-icn btn btn-primary has-tooltip" tooltip-placement="top" uib-tooltip="Remove"
                    ng-click="removeService()">
                <i class="icn-sm icn-remove-token-light"></i>
              </span>
        </div>

        <div style="float: left;" ng-if="$last">
          <div class="btn-icn btn btn-primary has-tooltip add-expense-btn" uib-tooltip="Add Service" tooltip-placement="top"
               ng-click="addService()">
            <i class="icn-sm icn-plus"></i>
          </div>
        </div>
      </div>
    </li>
  </ul>
</form>
