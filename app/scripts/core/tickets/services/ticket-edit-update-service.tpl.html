<div class="ticket-update-service-edit" ng-controller="quicktech.core.tickets.ticketEditUpdateServiceCtrl">
  <i class="icon-edit icn-sm icn-update-service"></i>

  <form name="updateTicketService">
    <ul class="qt-table">
      <li>

        <div class="edit-col1" ng-class="{'has-error': !editService.item.versionedId.id}">
          <div uib-dropdown>

            <input type="text" value="Onsite" class="form-control has-dropdown" placeholder="Service"
                   name="serviceName" placeholder="Service" uib-dropdown-toggle aria-expanded="false"
                   ng-model="editService.item.name">
            <i class="icn-sm icn-caret-gray"></i>

            <ul class="dropdown-menu dropdown-menu-services">

              <li role="presentation"
                  ng-repeat="companyService in companyServices | filter: {name: editService.item.name} | orderBy: 'name'">
                <a role="menuitem" tabindex="-1" href="javascript:void(0)" ng-click="setNewService(companyService)">
                  {{ companyService.name }}
                </a>
              </li>

            </ul>
          </div>
        </div>

        <div class="edit-col2" service-quantity-picker="editService.quantity" sqp-is-show-format="false"
             ng-class="{'has-error': isShowingErrors(updateTicketService, 'serviceTime')}">

          <input id="service-quantity-picker" type="text" class="form-control"
                 placeholder="Hr(s) : Min(s)" sqp-input
                 autocomplete="off" aria-expanded="true"/>

          <input type="hidden" name="serviceTime" ng-model="editService.quantity" ng-required="true"/>

        </div>

        <div class="edit-col3" ng-class="{'has-error': isShowingErrors(updateTicketService, 'serviceDescription')}">

          <input type="text" class="form-control service-description" placeholder="Description"
                 ng-model="editService.description" max-length-word="100"
                 name="serviceDescription" ng-maxlength="2000">
        </div>

        <div class="edit-col4" ng-class="{'has-error': isShowingErrors(updateTicketService, 'serviceData')}">

          <div uib-dropdown>

            <i class="icn-sm icn-caret-gray" style="position: absolute;top: 13px;right: 13px;z-index: 1;"></i>
            <input type="text" qt-data-time-picker max-date="maxServiceDate"
                   class="form-control has-dropdown" uib-dropdown-toggle aria-expanded="false"
                   placeholder="Date" ng-model="editService.date"
                   name="serviceData" ng-required="true">

          </div>
        </div>

        <!--DISCOUNT-->
        <div class="col-4" style="width: 100px;">
          <div>
            <div  ng-hide="isShowServiceEditDiscountInputField || editService.discountAmount != null">
              <i class="icon-sm sale-icon-for-isDicount" ng-click="isShowServiceEditDiscountInputField = !isShowServiceEditDiscountInputField" uib-tooltip="Click to choose Discount"></i>
            </div>

            <div ng-show="isShowServiceEditDiscountInputField || editService.discountAmount != null" class="form-group" ng-class="{'has-error': isShowingErrors(updateTicketService, 'discountAmount')}">
              <input type="number"
                     class="form-control"
                     placeholder="Discount Amount"
                     name="discountAmount"
                     ng-model="editService.discountAmount"
                     ng-max="100"
                     ng-min="0"
                     qt-to-fixed="2"
                     hard-reset-pattern="{{editService.discountType}}"
                     ng-keydown="$event.which === 13 && $event.preventDefault()">
            </div>
          </div>
        </div>

      </li>
    </ul>

    <div class="ticket-update-edit-actions clearfix">

      <div class="validation-msg pull-left">{{ validationMessage() }}</div>

      <div class="btn btn-primary" ng-click="setEditExpenseId()">
        Cancel
      </div>

      <div class="btn btn-success"
           custom-disabled="{{ disabledSave || updateTicketService.$invalid }}"
           ng-click="saveUpdateService(updateTicketService)">
        Save
      </div>

    </div>
  </form>
</div>
