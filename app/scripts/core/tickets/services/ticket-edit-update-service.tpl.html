    <div class="table-content service-table">
      <div class="table-content-top clearfix">
        <div class="col-md-2" ng-class="{'has-error': isShowingErrors(updateTicketService, 'serviceData')}">
          <div uib-dropdown>
            <i class="icn-sm icn-caret-gray" style="position: absolute;top: 13px;right: 13px;z-index: 1;"></i>
            <input type="text" qt-data-time-picker max-date="maxServiceDate"
                   class="form-control has-dropdown" uib-dropdown-toggle aria-expanded="false"
                   placeholder="Date" ng-model="editService.date"
                   name="serviceData" ng-required="true"
                   uib-tooltip="Date"
                   tooltip-placement="top"
                   tooltip-append-to-body="true">
          </div>
        </div>
        <div class="col-md-8" ng-class="{'has-error': !editService.item.versionedId.id}">
          <div uib-dropdown>
            <input type="text" value="Onsite" class="form-control has-dropdown" placeholder="Service"
                   name="serviceName" placeholder="Service" uib-dropdown-toggle aria-expanded="false"
                   ng-model="editService.item.name" required
                   uib-tooltip="Service"
                   tooltip-placement="top"
                   tooltip-append-to-body="true">
            <i class="icn-sm icn-caret-gray"></i>

            <ul class="dropdown-menu dropdown-menu-services">

              <li role="presentation"
                  ng-repeat="companyService in companyServices | orderBy: 'name'">
                <a role="menuitem" tabindex="-1" href="javascript:void(0)" ng-click="setNewService(companyService)">
                  {{ companyService.name }}
                </a>
              </li>

            </ul>
          </div>
        </div>
        <div class="col-md-2" service-quantity-picker="editService.quantity" sqp-is-show-format="false"
             ng-class="{'has-error': isShowingErrors(updateTicketService, 'serviceTime')}">
          <input id="service-quantity-picker" type="text" class="form-control"
                 placeholder="Hr(s) : Min(s)" sqp-input
                 autocomplete="off" aria-expanded="true"
                 uib-tooltip="Duration"
                 tooltip-placement="top"
                 tooltip-append-to-body="true"/>

          <input type="hidden" name="serviceTime" ng-model="editService.quantity" ng-required="true" />
        </div>
      </div>
      <div class="table-content-bottom clearfix">
        <div class="col-md-12" ng-class="{'has-error': isShowingErrors(updateTicketService, 'serviceDescription')}">
          <input type="text" class="form-control service-description" placeholder="Description"
                 ng-model="editService.description" max-length-word="100"
                 name="serviceDescription" ng-maxlength="2000"
                 uib-tooltip="Description"
                 tooltip-placement="top"
                 tooltip-append-to-body="true">
        </div>
      </div>
    </div>
    <div class="ticket-update-edit-actions clearfix">

      <div class="validation-msg pull-left">{{ validationMessage() }}</div>

      <div class="btn btn-primary" ng-click="setEditExpenseId()">
        Cancel
      </div>

      <div class="btn btn-success"
           custom-disabled="{{ disabledSave || updateTicketService.$invalid}}"
           ng-click="saveUpdateService(updateTicketService)">
        Save
      </div>

    </div>
  </form>
