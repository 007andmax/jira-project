<div class="ticket-post-update-wrapper">

  <div class="btn btn-primary pull-right has-tooltip" ng-disabled="true"
       tooltip-placement="top" tooltip="Remote Access" style="width: 92px;">
    <i class="icn-sm icn-remote-access"></i>
  </div>

  <ul class="nav nav-ticket-add"
      ng-if="PermissionsService.isAditionalActionAccessForUser(ticketDetails, currentUser)">

    <li ng-class="{'active': currentOpenTab === 'NOTE'}">
      <a data-toggle="pill" href="javascript:void(0)" ng-click="openedTab('NOTE')">
        <i class="icn-lg icn-add-note"></i>Note
      </a>
    </li>

    <li ng-class="{'active': currentOpenTab === 'PRODUCT'}">
      <a data-toggle="pill" href="javascript:void(0)" ng-click="openedTab('PRODUCT')">
        <i class="icn-lg icn-add-product"></i>Product
      </a>
    </li>

    <li ng-class="{'active': currentOpenTab === 'SERVICE'}">
      <a data-toggle="pill" href="javascript:void(0)" ng-click="openedTab('SERVICE')">
        <i class="icn-lg icn-add-service"></i>Service
      </a>
    </li>

  </ul>

  <div class="tab-content">

    <div class="tab-pane in active" ng-if="currentOpenTab === 'NOTE'"
         ng-controller="quicktech.core.tickets.ticketAddUpdateNoteCtrl">

      <div class="ticket-add clearfix">

        <div class="avator pull-left">
          <img ng-src="{{ getUserAvatarUrl(currentUser) }}" alt="..." class="img-circle avatar-38">
        </div>

        <div class="ticket-add-content clearfix">

          <div ng-include="'/html/scripts/core/tickets/note/ticket-add-note.tpl.html'"></div>

          <div class="ticket-add-content-actions pull-left">

            <div class="ticket-add-content-actions-attachment pull-left"
                 ticket-attachment-files attachment-func="addAttachmentFiles"
                 ng-model="ticketUpdate.ticketAttachments">

              <a href="javascript:void(0)" class="hit-area ha-16-26 has-tooltip"
                 tooltip="Attach files" tooltip-placement="top">
                <i class="icn-sm icn-attachment"></i>
              </a>

              <input type="file" style="display:none" multiple=""/>
            </div>

            <div class="line-sep pull-left"></div>

            <div class="ticket-add-content-actions-dropdown pull-left" style="display: inline">
              <div class="dropdown pull-left">

                <a href="javascript:void(0)" class="hit-area ha-16-26 pull-left add-users-plus has-tooltip"
                   tooltip="add users to this update" tooltip-placement="top"
                   data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                  <i class="icn-sm icn-add-update"></i>
                </a>

                <ul class="dropdown-menu dropdown-menu-tabs">
                  <div ng-include="'/html/scripts/core/tickets/update-add-user.tpl.html'"></div>
                </ul>

              </div>
            </div>

            <div class="ticket-add-content-actions-users pull-left">

              <a ng-repeat="sharedUser in updateSharedUsersList" ng-click="deleteUpdateSharedUser(sharedUser)"
                 class="has-tooltip" href="javascript:void(0)" tooltip-placement="top"
                 tooltip-html-unsafe="<p class='tooltip-name'>{{ sharedUser.user ? getUserName(getUserById(sharedUser.user.id)) : getContactName(sharedUser.contact) }}</p>
                                      <span class='tooltip-designation'>{{  getSharedTitle(sharedUser) }}</span>">
                <img
                  ng-src="{{ sharedUser.user ? getUserAvatarUrl(sharedUser.user) : getContactAvatarUrl(sharedUser.contact) }}"
                  alt="..." class="img-circle avatar-26">
                <i class="icn-sm icn-x"></i>
              </a>

            </div>

          </div>
        </div>

        <div ng-include="'/html/scripts/core/tickets/update-submit.tpl.html'"></div>

      </div>
    </div>

    <div class="tab-pane in active"
         ng-if="PermissionsService.isAditionalActionAccessForUser(ticketDetails, currentUser) && currentOpenTab === 'PRODUCT'"
         ng-controller="quicktech.core.tickets.ticketAddUpdateProductCtrl">

      <div class="ticket-add clearfix">

        <div class="avator pull-left">
          <img ng-src="{{ getUserAvatarUrl(currentUser) }}" alt="..." class="img-circle avatar-38">
        </div>
        <div class="ticket-add-content clearfix">


          <div ng-form="addProductsForm">
            <div ng-repeat="productExpense in ticketUpdate.products">
              <div ng-model="productExpense"
                   ticket-add-product
                   product-categories="productCategories"
                   remove-product-func="removeProduct"
                   index="$index"
                   number-pattern="numberPattern"
                   show-errors="true"></div>
            </div>
          </div>

          <div ng-model="productExpenseToAdd"
               ticket-add-product enable-add-mode="true" add-product-func="addProduct"
               remove-product-func="removeProduct"
               product-categories="productCategories"
               number-pattern="numberPattern"
               show-errors="triedToAddProduct"></div>

          <div class="ticket-add-content-actions pull-left">

            <div class="ticket-add-content-actions-dropdown pull-left" style="display: inline">

              <div class="dropdown pull-left">

                <a href="javascript:void(0)" class="hit-area ha-16-26 pull-left add-users-plus has-tooltip"
                   data-placement="top" title="Add users to this update" data-toggle="dropdown" aria-haspopup="true"
                   aria-expanded="false">
                  <i class="icn-sm icn-add-update"></i>
                </a>

                <ul class="dropdown-menu dropdown-menu-tabs">
                  <div ng-include="'/html/scripts/core/tickets/update-add-user.tpl.html'"></div>
                </ul>

              </div>
            </div>

            <div class="ticket-add-content-actions-users pull-left">

              <a ng-repeat="sharedUser in updateSharedUsersList" ng-click="deleteUpdateSharedUser(sharedUser)"
                 class="has-tooltip" href="javascript:void(0)" tooltip-placement="top"
                 tooltip-html-unsafe="<p class='tooltip-name'>{{ sharedUser.user ? getUserName(getUserById(sharedUser.user.id)) : getContactName(sharedUser.contact) }}</p>
                                      <span class='tooltip-designation'>{{  getSharedTitle(sharedUser) }}</span>">
                <img
                  ng-src="{{ sharedUser.user ? getUserAvatarUrl(sharedUser.user) : getContactAvatarUrl(sharedUser.contact) }}"
                  alt="..." class="img-circle avatar-26">
                <i class="icn-sm icn-x"></i>
              </a>

            </div>

            <div class="ticket-add-amount pull-right">
              <span class="text-muted">Total amount </span>
              <strong>{{ productTotalAmount | currency }}</strong>
            </div>

          </div>
        </div>

        <div ng-include="'/html/scripts/core/tickets/update-submit.tpl.html'"></div>

      </div>
    </div>

    <div class="tab-pane in active"
         ng-if="PermissionsService.isAditionalActionAccessForUser(ticketDetails, currentUser) && currentOpenTab === 'SERVICE'"
         ng-controller="quicktech.core.tickets.ticketAddUpdateServiceCtrl">

      <div class="ticket-add clearfix">

        <div class="avator pull-left">
          <img ng-src="{{ getUserAvatarUrl(currentUser) }}" alt="..." class="img-circle avatar-38">
        </div>

        <div class="ticket-add-content clearfix">

          <div ng-form="addServicesForm">
            <div ng-repeat="serviceExpense in ticketUpdate.services">
              <div ng-model="serviceExpense"
                   ticket-add-service
                   service-list="serviceList"
                   remove-service-func="removeService"
                   number-pattern="numberPattern"
                   index="$index"
                   show-errors="true"></div>
            </div>
          </div>

          <div ng-model="serviceExpenseToAdd"
               ticket-add-service enable-add-mode="true" add-service-func="addService"
               remove-service-func="removeService"
               service-list="serviceList"
               number-pattern="numberPattern"
               show-errors="triedToAddService"></div>

          <div class="ticket-add-content-actions pull-left">

            <div class="ticket-add-content-actions-dropdown pull-left" style="display: inline">
              <div class="dropdown pull-left">

                <a href="javascript:void(0)" class="hit-area ha-16-26 pull-left add-users-plus has-tooltip"
                   tooltip-placement="top" tooltip="Add users to this update" data-toggle="dropdown"
                   aria-haspopup="true" aria-expanded="false">
                  <i class="icn-sm icn-add-update"></i>
                </a>

                <ul id="myTabs" class="dropdown-menu dropdown-menu-tabs">
                  <div ng-include="'/html/scripts/core/tickets/update-add-user.tpl.html'"></div>
                </ul>

              </div>
            </div>

            <div class="ticket-add-content-actions-users pull-left">

              <a ng-repeat="sharedUser in updateSharedUsersList" ng-click="deleteUpdateSharedUser(sharedUser)"
                 class="has-tooltip" href="javascript:void(0)" tooltip-placement="top"
                 tooltip-html-unsafe="<p class='tooltip-name'>{{ sharedUser.user ? getUserName(getUserById(sharedUser.user.id)) : getContactName(sharedUser.contact) }}</p>
                                      <span class='tooltip-designation'>{{  getSharedTitle(sharedUser) }}</span>">
                <img
                  ng-src="{{ sharedUser.user ? getUserAvatarUrl(sharedUser.user) : getContactAvatarUrl(sharedUser.contact) }}"
                  alt="..." class="img-circle avatar-26">
                <i class="icn-sm icn-x"></i>
              </a>

            </div>

          </div>
        </div>
      </div>

      <div ng-include="'/html/scripts/core/tickets/update-submit.tpl.html'"></div>

    </div>
  </div>
</div>
