<ng-form name="labelsForm">

  <li>
    <ul class="custom-scroll">
      <li ng-repeat="tag in tags">
        <label class="control checkbox">

          <input type="checkbox" ng-model="ticketTags[tag.id]" name="ticketTags"
                 ng-class="{'disabled': disabledTags && !ticketTags[tag.id]}"
                 ng-disabled="disabledTags && !ticketTags[tag.id]">

          <span class="control-indicator pull-left"
                ng-click="disabledTags && !ticketTags[tag.id] && showNotificationMessage()"></span>

          <span class="tag-color color{{ tag.color }}"></span>
          {{ tag.name }}
        </label>
      </li>
    </ul>
  </li>

  <li class="apply">
    <div class="btn btn-lg btn-block btn-info"
         ng-disabled="labelsForm.$pristine || disabledApplyButton" ng-click="applyTagsToTicket()">
      Apply
    </div>
  </li>

</ng-form>
