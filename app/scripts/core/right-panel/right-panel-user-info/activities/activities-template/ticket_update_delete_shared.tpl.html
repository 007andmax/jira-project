<div>
  <a href="javascript:void(0)" class="pull-left avatar-38 avatar m-r">
    <img ng-src="{{ userAvatarUrl }}" alt="..." class="img-circle">
  </a>

  <div class="clearfix">

    <div class="user-name"><strong>{{ userName }}</strong> removed
      {{ activity.firstList.length === 1 ? aditionalUserName : aditionalUserName + ' and ' + activity.firstList.length + ' others' }} from ticket


    <span class="text-muted ticket-number">Tkt# {{ ticketNumber }}</span>

    </div>

    <small class="time-ago text-muted">{{ activity.createdAt | activitiesTime }}</small>
  </div>
</div>
