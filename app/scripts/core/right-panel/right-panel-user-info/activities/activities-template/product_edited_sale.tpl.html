<div>
  <a href="javascript:void(0)" class="pull-left avatar">
    <img ng-src="{{ userAvatarUrl }}" alt="..." class="img-circle avatar-38">
  </a>

  <div class="clearfix">
    <div class="user-name"><strong>{{ userName }}</strong> edited the Sale Price of

      <span class="text-muted ticket-number">{{ productName }}</span>
      from
      <span class="text-muted ticket-number">{{ categoryName }}</span>

    </div>

    <small class="time-ago text-muted">{{ activity.createdAt | activitiesTime }}</small>
  </div>
</div>
