<div>
  <a href="javascript:void(0)" class="pull-left avatar-38 avatar m-r">
    <img ng-src="{{ userAvatarUrl }}" alt="..." class="img-circle">
  </a>

  <div class="clearfix">
    <div class="user-name"><strong>{{ userName }}</strong> marked </div>

    <small class="user-title text-muted ticket-number">
      {{ activity.firstList.length === 1 ? 'invoice  ' + invoiceNumber : activity.firstList.length + ' invoices ' + invoiceNumber + (activity.firstList.length - 1) + ' others' }}
    </small>

    <div class="user-name"> as paid</div>

    <small class="time-ago text-muted">{{ activity.createdAt | activitiesTime }}</small>
  </div>
</div>
