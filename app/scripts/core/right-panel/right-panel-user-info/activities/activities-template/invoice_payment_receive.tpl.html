<div>
  <a href="javascript:void(0)" class="pull-left avatar">
    <img ng-src="{{ userAvatarUrl }}" alt="..." class="img-circle avatar-38">
  </a>

  <div class="clearfix">
    <div class="user-name"><strong>{{ userName }}</strong> marked

      <span class="text-muted ticket-number">
        {{ activity.firstList.length === 1 ? 'invoice ' + invoiceNumber : activity.firstList.length + ' invoices ' +
        invoiceNumber + ' and ' + (activity.firstList.length - 1) + ' others' }}
      </span>
      as paid
    </div>

    <small class="time-ago text-muted">{{ activity.createdAt | activitiesTime }}</small>
  </div>
</div>
