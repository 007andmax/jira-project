<div>
  <a href="javascript:void(0)" class="pull-left avatar-38 avatar m-r">
    <img ng-src="{{ userAvatarUrl }}" alt="..." class="img-circle">
  </a>

  <div class="clearfix">
    <div class="user-name"><strong>{{ userName }}</strong> renamed the product

      <small class="text-muted ticket-number">{{ productName }}</small>
      to
      <small class="text-muted ticket-number">{{ newProductName }}</small>

    </div>

    <small class="time-ago text-muted">{{ activity.createdAt | activitiesTime }}</small>
  </div>
</div>
