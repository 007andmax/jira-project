<div>
  <a href="javascript:void(0)" class="pull-left avatar">
    <img ng-src="{{ userAvatarUrl }}" alt="..." class="img-circle avatar-38">
  </a>

  <div class="clearfix">
    <div class="user-name"><strong>{{ userName }}</strong> added Primary Contact

      <span class="text-muted ticket-number">{{ contactFirstName + ' ' + contactLastName }}</span>
      <span ng-if="companyName !== 'Unassigned'">
        to company
        <span class="text-muted ticket-number">{{ companyName }}</span>
      </span>
    </div>

    <small class="time-ago text-muted">{{ activity.createdAt | activitiesTime }}</small>
  </div>
</div>
