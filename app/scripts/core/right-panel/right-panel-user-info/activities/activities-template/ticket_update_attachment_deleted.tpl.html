<div>
  <a href="javascript:void(0)" class="pull-left avatar">
    <img ng-src="{{ userAvatarUrl }}" alt="..." class="img-circle avatar-38">
  </a>

  <div class="clearfix">

    <div class="user-name">
      <strong>{{ userName }}</strong>
      removed
      {{ activity.firstList.length === 1 ? 'an Attachment' : activity.firstList.length + ' attachments' }} from ticket
      <a class="text-muted ticket-number"
         href="javascript:void(0)">
            <!--ui-sref="tickets.details({listType: 'listTypepreview', ticketId: ticketId})">-->
        Tkt# {{ ticketNumber }}
      </a>

    </div>

    <small class="time-ago text-muted">{{ activity.createdAt | activitiesTime }}</small>
  </div>
</div>
