<div>
  <a href="javascript:void(0)" class="pull-left avatar-38 avatar m-r">
    <img ng-src="{{ userAvatarUrl }}" alt="..." class="img-circle">
  </a>

  <div class="clearfix">
    <div class="user-name"><strong>{{ userName }}</strong> re-sent
      {{ activity.firstList[0] && activity.firstList[0].recurringInvoiceFrequency ? activity.firstList[0].recurringInvoiceFrequency + ' recurring ' : '' }}
      invoice

    <span class="text-muted ticket-number">{{ invoiceNumber }}</span>
    to
    <span class="text-muted ticket-number">{{ companyName }}</span>

  </div>

  <small class="time-ago text-muted">{{ activity.createdAt | activitiesTime }}</small>
  </div>
</div>
