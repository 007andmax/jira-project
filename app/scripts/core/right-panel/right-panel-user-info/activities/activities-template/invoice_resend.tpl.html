<div>
  <a href="javascript:void(0)" class="pull-left avatar-38 avatar m-r">
    <img ng-src="{{ userAvatarUrl }}" alt="..." class="img-circle">
  </a>

  <div class="clearfix">
    <div class="user-name"><strong>{{ userName }}</strong> re-sent
      {{ activity.firstList[0] && activity.firstList[0].RecurringInvoiceFrequency ? 'activity.firstList[0].RecurringInvoiceFrequency' : '' }} invoice </div>

    <small class="user-title text-muted ticket-number">{{ invoiceNumber }}</small>

    <div class="user-name"> to </div>

    <small class="user-title text-muted ticket-number">{{ companyName }}</small>

    <small class="time-ago text-muted">{{ activity.createdAt | activitiesTime }}</small>
  </div>
</div>
