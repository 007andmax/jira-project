<div>
  <a href="javascript:void(0)" class="pull-left avatar-38 avatar m-r">
    <img ng-src="{{ userAvatarUrl }}" alt="..." class="img-circle">
  </a>

  <div class="clearfix">
    <div class="user-name">

      <strong>{{ userName }}</strong> re-assigned the ticket
      <a class="text-muted ticket-number"
         ui-sref="tickets.details({listType: 'preview', ticketId: activity.firstList[0].ticketId})">Tkt# {{ ticketNumber }}</a>
      to <strong>{{ aditionalUserName }}</strong>

    </div>

    <small class="time-ago text-muted">{{ activity.createdAt | activitiesTime }}</small>
  </div>
</div>
