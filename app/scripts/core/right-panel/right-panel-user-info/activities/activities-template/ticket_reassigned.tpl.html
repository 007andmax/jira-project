<div>
  <a href="javascript:void(0)" class="pull-left avatar">
    <img ng-src="{{ userAvatarUrl }}" alt="..." class="img-circle avatar-38">
  </a>

  <div class="clearfix">
    <div class="user-name">

      <strong>{{ userName }}</strong> re-assigned the ticket
      <a class="text-muted ticket-number"
         href="javascript:void(0)">Tkt# {{ ticketNumber }}</a>
         <!--ui-sref="tickets.details({listType: 'preview', ticketId: ticketId})">Tkt# {{ ticketNumber }}</a>-->
      to <strong>{{ aditionalUserName }}</strong>

    </div>

    <small class="time-ago text-muted">{{ activity.createdAt | activitiesTime }}</small>
  </div>
</div>
