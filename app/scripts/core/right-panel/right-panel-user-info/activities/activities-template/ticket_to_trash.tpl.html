<div>
  <a href="javascript:void(0)" class="pull-left avatar">
    <img ng-src="{{ userAvatarUrl }}" alt="..." class="img-circle avatar-38">
  </a>

  <div class="clearfix">
    <div class="user-name"><strong>{{ userName }}</strong> moved

    <span class="text-muted ticket-number">
      {{ activity.firstList.length === 1 ? 'the ticket Tkt# ' + ticketNumber : activity.firstList.length + ' tickets' }}
    </span>
    to Trash

  </div>

    <small class="time-ago text-muted">{{ activity.createdAt | activitiesTime }}</small>
  </div>
</div>
