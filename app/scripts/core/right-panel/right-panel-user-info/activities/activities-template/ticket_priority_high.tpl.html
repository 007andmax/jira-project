<div>
  <a href="javascript:void(0)" class="pull-left avatar-38 avatar m-r">
    <img ng-src="{{ userAvatarUrl }}" alt="..." class="img-circle">
  </a>

  <div class="clearfix">
    <div class="user-name"><strong>{{ userName }}</strong> changed

      <span class="text-muted ticket-number">
        {{ activity.firstList.length === 1 ? 'ticket Tkt# ' + ticketNumber : activity.firstList.length + ' tickets' }}
      </span>
      {{ activity.firstList.length === 1 ? 'Priority' : 'priorities' }} to <strong>High</strong>

    </div>
    <small class="time-ago text-muted">{{ activity.createdAt | activitiesTime }}</small>
  </div>
</div>
