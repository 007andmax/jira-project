<div ng-controller="quicktech.core.header.companyProfileCtrl">
  <div class="topNavbarLeft-Left pull-left" ng-hide="bulkOptionMode">
    <!--ng-hide="selectUsersIds.length > 0"-->

    <div class="pull-left">
      <a href="javascript:void(0)" class="hit-area ha-20-16 has-tooltip"
         style="margin: 11px 8px 0 0;" ui-sref="companies"
         tooltip-append-to-body="true" tooltip-placement="bottom" tooltip="Back to Companies">
        <i class="icn-sm icn-back-arrow"></i>
      </a>
    </div>

    <p class="pull-left" style="white-space: nowrap;"><strong>{{ company.name }}</strong></p>

  </div>

  <div class="topNavbarLeft-Left pull-left" ng-show="bulkOptionMode === 'USERS'">

    <div class="pull-left">
      <a href="javascript:void(0)" class="hit-area ha-20-16 has-tooltip"
         tooltip-append-to-body="true" ng-click="uncheckSelect()"
         tooltip-placement="bottom" style="margin: 11px 8px 0 0;"
         tooltip="Reset Selected Items">
        <i class="icn-sm icn-back-arrow"></i>
      </a>
    </div>

    <p class="pull-left" style="white-space: nowrap;">
      <strong>{{ selectUsersIds.length }}</strong>&nbsp;<span class="text-muted">Selected</span>
    </p>

    <div class="topNavbar-filter pull-right">

      <div class="btn btn-default has-tooltip pull-right" ng-click="archiveUsers()"
           tooltip-placement="bottom" tooltip="Archive">
        <i class="icn-sm icn-remove-token"></i>
      </div>

      <div class="dropdown">
        <div class="btn btn-default has-tooltip pull-right" data-toggle="dropdown"
             tooltip-placement="bottom" tooltip="Subscribe to...">
          <i class="icn-sm icn-user-subscription"></i>
        </div>

        <ul class="dropdown-menu dropdown-subscribe" stop-propagation="click">

          <li ng-click="changeUserSubscription('ticket')">
            <a tabindex="-1" href="javascript:void(0)">
              <div class="clearfix">
                <label class="control checkbox pull-left">
                  <input type="checkbox" ng-model="usersSbscr['ticket']" ng-disabled="disabledSubscr">
                  <span class="control-indicator"></span> Ticket Updates
                </label>
              </div>
            </a>
          </li>

          <li ng-click="changeUserSubscription('invoice')">
            <a tabindex="-1" href="javascript:void(0)">
              <div class="clearfix">
                <label class="control checkbox pull-left">
                  <input type="checkbox" ng-model="usersSbscr['invoice']" ng-disabled="disabledSubscr">
                  <span class="control-indicator"></span> Invoice Updates
                </label>
              </div>
            </a>
          </li>

        </ul>
      </div>

      <div class="dropdown">
        <div class="btn btn-default has-tooltip pull-right" data-toggle="dropdown"
             tooltip-placement="bottom" tooltip="Set Privilege to...">
          <i class="icn-sm icn-user-privilege"></i>
        </div>

        <ul class="dropdown-menu dropdown-privilege">

          <li>
            <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserRole('USER')">
              User
            </a>
          </li>

          <li>
            <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserRole('ADMIN')">
              Administrator
            </a>
          </li>

        </ul>
      </div>

      <!--<div class="btn btn-default has-tooltip pull-right disabled"-->
      <!--tooltip-placement="bottom" tooltip="Email">-->
      <!--<i class="icn-sm icn-user-mail"></i>-->
      <!--</div>-->

    </div>

  </div>

  <div class="topNavbarLeft-Left pull-left" ng-show="bulkOptionMode === 'DEVICES'">

    <div class="pull-left">
      <a href="javascript:void(0)" class="hit-area ha-20-16 has-tooltip" ng-click="uncheckSelect()"
         tooltip-append-to-body="true" tooltip="Reset Selected Items" tooltip-placement="bottom"
         style="margin: 11px 8px 0 0;">
        <i class="icn-sm icn-back-arrow"></i>
      </a>
    </div>

    <p class="pull-left" style="white-space: nowrap;">
      <strong>{{ selectDevicesIds.length }}</strong>&nbsp;<span class="text-muted">Selected</span>
    </p>

    <div class="topNavbar-filter pull-right">

      <div class="btn btn-default has-tooltip pull-right" ng-click="removeDevices()"
           tooltip-placement="bottom" tooltip="Remove">
        <i class="icn-sm icn-remove-token"></i>
      </div>

      <div class="btn btn-default has-tooltip pull-right" ng-click="shutdownDevices()"
           tooltip-placement="bottom" tooltip="Shutdown">
        <i class="icn-sm icn-shutdown-device"></i>
      </div>

      <div class="btn btn-default has-tooltip pull-right" ng-click="restartDevices()"
           tooltip-placement="bottom" tooltip="Restart">
        <i class="icn-sm icn-restart-device"></i>
      </div>

      <!--<div class="btn btn-default has-tooltip pull-right" ng-click="sendAlertDevices()"-->
      <!--tooltip-placement="bottom" tooltip="Send Alert">-->
      <!--<i class="icn-sm icn-send-alert"></i>-->
      <!--</div>-->

    </div>
  </div>

</div>
