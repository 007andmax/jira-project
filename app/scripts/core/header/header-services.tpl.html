<div class="topNavbarLeft-Left pull-left" ng-controller="quicktech.core.header.servicesCtrl">

  <div class="topNavbar-search pull-left">
    <div class="input-group-search">
      <input type="text" class="form-control-top-search user-search" placeholder="Search service..."
             ng-model="service" typeahead-on-select="showService(service)" autocomplete="off"
             typeahead="service as service.name for service in searchServices($viewValue)"
             typeahead-template-url="/html/scripts/core/header/typeahead-template/service.tpl.html"
             custom-style="{'max-height': '160px', 'overflow-y': 'auto'}">

      <span class="input-group-addon-search">
       <div typeahead-input-icon="service" style="position: absolute;top: 13px;right: 13px;"></div>
      </span>

    </div>
  </div>

</div>
