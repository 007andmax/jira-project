<div class="nav-left ticket-nav" ng-controller="quicktech.core.header.billableCtrl">

  <div class="" id="search-and-filter">
    <h4>Billable</h4>

    <div class="form-group search-form pull-left">
      <input type="text" class="form-control form-control-round form-control-search"
             placeholder="Search company or ticket..."
             ng-model="searchItem" typeahead-on-select="showItem(searchItem)"
             typeahead="item as ((+$viewValue || item.name === undefined) ? item.number : item.name) for item in ((+$viewValue || ($viewValue == 0)) ? (searchTicket($viewValue)) : (sharedState.companies | filter: $viewValue:stateComparator  | orderBy:'name'))"
             custom-style="{'max-height': '160px', 'overflow-y': 'scroll'}">
      <a href="" class="close icn-remove-token" tabindex="-1" ng-click="searchItem = undefined"></a>
    </div>
  </div>
</div>
