<div class="topNavbarLeft-Left pull-left" ng-controller="quicktech.core.header.billableCtrl">

  <p class="pull-left" style="white-space: nowrap;"><strong>Billable</strong></p>

  <div class="topNavbar-search pull-left">
    <div class="input-group-search">
      <input type="text" class="form-control-top-search user-search"
             placeholder="Search company or ticket..." autocomplete="off"
             ng-model="searchItem" typeahead-on-select="showItem(searchItem)"
             typeahead="item as ((+$viewValue || item.name === undefined) ? item.number : item.name) for item in ((+$viewValue || ($viewValue == 0)) ? (searchTicket($viewValue)) : (sharedState.companies | filter: $viewValue:stateComparator  | orderBy:'name'))"
             custom-style="{'max-height': '160px', 'overflow-y': 'scroll'}">

      <span class="input-group-addon-search">
        <i class="icn-sm icn-search form-control-top-search-icn disabled"></i>
      </span>

    </div>
  </div>

</div>
