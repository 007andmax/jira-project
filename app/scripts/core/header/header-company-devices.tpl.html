<div ng-controller="quicktech.core.header.companyDevicesCtrl">

  <div class="topNavbarLeft-Left pull-left" ng-show="!isShowBulkAction">
    <div class="pull-left">
      <a href="javascript:void(0)" class="hit-area ha-20-16 has-tooltip"
         style="margin: 11px 8px 0 0;" ui-sref="devices"
         tolltip-placement="bottom" tolltip-append-to-body="true" tolltip="Back to Devices">
        <i class="icn-sm icn-back-arrow"></i>
      </a>
    </div>

    <p class="pull-left" style="white-space: nowrap;"><strong>{{ company.name }}</strong></p>

    <div class="topNavbar-search pull-left">
      <div class="input-group-search">

        <input type="text" class="form-control-top-search user-search" placeholder="Search device...">

      <span class="input-group-addon-search">
        <i class="icn-sm icn-search form-control-top-search-icn disabled"></i>
      </span>

      </div>
    </div>
  </div>

  <div class="topNavbarLeft-Left pull-left" ng-show="isShowBulkAction">

    <div class="pull-left">
      <a href="javascript:void(0)" class="hit-area ha-20-16 has-tooltip"
         data-container="body" title="Reset Selected Items" data-placement="bottom"
         style="margin: 11px 8px 0 0;" data-template="<div class='tooltip body-tooltip'><div class='tooltip-inner'></div></div>">
        <i class="icn-sm icn-back-arrow"></i>
      </a>
    </div>

    <p class="pull-left" style="white-space: nowrap;">
      <strong>{{ devicesHeaderState.checkedDevicesId.length }}</strong>&nbsp;<span class="text-muted">Selected</span>
    </p>

    <div class="topNavbar-filter pull-right">

      <div class="btn btn-default has-tooltip pull-right" ng-click="removeDevices()"
           tooltip-placement="bottom" tooltip="Remove">
        <i class="icn-sm icn-remove-token"></i>
      </div>

      <div class="btn btn-default has-tooltip pull-right" ng-click="shutdownDevices()"
           tooltip-placement="bottom" tooltip="Shutdown">
        <i class="icn-sm icn-shutdown-device"></i>
      </div>

      <div class="btn btn-default has-tooltip pull-right" ng-click="restartDevices()"
           tooltip-placement="bottom" tooltip="Restart">
        <i class="icn-sm icn-restart-device"></i>
      </div>

      <div class="btn btn-default has-tooltip pull-right" ng-click="sendAlertDevices()"
           tooltip-placement="bottom" tooltip="Send Alert">
        <i class="icn-sm icn-send-alert"></i>
      </div>

    </div>
  </div>



</div>
