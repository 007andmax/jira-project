<div class="create-new create-ticket-form" ng-controller="quicktech.createTicketCtrl" ng-form="ticketForm" >
  <div class="ticket--header">
    <div>
      <h2>Create New Ticket</h2>
      <span>QT 23904</span>
      <div class="ticket-priority create-dropdown" uib-dropdown>

          <input type="text" class="form-control ticket-drop has-dropdown readonly-normal" uib-dropdown-toggle
                 readonly>
          <i class="icn-sm report-caret-icon"></i>

          <ul class="dropdown-menu dropdown-priority" role="menu">

            <li ng-repeat="(priority, label) in ticketPriorityValue" ng-click="ticket.priorityLevel = priority">
              <a tabindex="-1" href="javascript:void(0)">
                <span class="priority-dot {{ label.toLowerCase() }}"></span>{{ label }}
              </a>
            </li>

          </ul>

          <div class="default-value"><span
            class="priority-dot {{ ticketPriorityValue[ticket.priorityLevel].toLowerCase() }}"></span> {{
            ticketPriorityValue[ticket.priorityLevel] }}
          </div>

      </div>
    </div>
    <button class="close-modal icn-sm icn-remove-old" ng-click="closeWindowWithConfirm()"></button>
  </div>
  <div class="ticket--content row">
    <div class="col-md-12 ticket-subject">
      <input type="text" class="form-validation"
            placeholder="Type ticket subject here"
             name="ticketSubject" ng-maxlength="300"
             required="true" make-dirty-on-blur
             ng-model="ticket.subject">
    </div>
    <div class="col-md-12" style="position: relative">
      <div class="drop-area-wrapper" attach-files attach-func="addAttachmentFiles">
          <span class="drop-area-subwrapper">
            <span class="drop-area">
              Drop Files Here
            </span>
          </span>
      </div>

      <div class="drag-n-drop-body">
        <h2>DRAG N DROP HERE</h2>
        <ul class="upload-attachments"><!--
            -->
          <li ng-repeat="file in ticketAttachments"
              ng-style="fileInfo[file.name].error && {'background-color': '#fff2f2'}">

            <span class="file-name">{{ file.name }}</span>
            <span class="file-size">{{ file.size | fileSizeFilter }}</span>

            <a href="javascript:void(0)" class="hit-area pull-right"
               uib-tooltip="Remove file" tooltip-placement="top"
               ng-click="removeAttachment($index, fileInfo[file.name].error)">
              <i class="icn-sm icn-remove-old"></i>
            </a>

            <a href="javascript:void(0)" class="hit-area pull-right"
               ng-show="file.progress !== 100"
               uib-tooltip="Re-Upload" tooltip-placement="top" ng-click="reloadAttachment(file)">
              <i class="icn-sm icn-reupload"></i>
            </a>

            <div class="progress progress-attachment pull-right" ng-show="file.progress !== 100">
              <div class="progress-bar" role="progressbar"
                   aria-valuenow="{{ file.progress }}" aria-valuemin="0" aria-valuemax="100"
                   ng-style="styleProgressBar(file.progress)">
                <span class="sr-only">{{ file.progress }}% Complete</span>
              </div>
            </div>

            <span class="pull-right" ng-show="fileInfo[file.name].error"
                  uib-tooltip="{{ fileInfo[file.name].message }}"
                  tooltip-append-to-body tooltip-placement="top"
                  style="color: rgb(229, 57, 53);white-space: nowrap;overflow: hidden;max-width: 250px;text-overflow: ellipsis">
                {{ fileInfo[file.name].message }}
              </span>

          </li>
        </ul>
      </div>
    </div>
    <div class="col-md-12 description">
      <input ng-model="ticket.note" placeholder="Write issue here…" type="text">
    </div>
    <div class="col-md-6" add-create-new-button="company">
      <!-- <input placeholder="Select Company" type="text"> -->
      <input type="text" class="form-validation has-dropdown"
             smart-dropdown-menu-position
             next-after-text-editor
             ng-model="ticketCompany"
             name="ticketCompany"
             placeholder="Select Company"
             autocomplete="off"
             uib-typeahead="company as company.name for company in clientCompanies | filter:{'name': $viewValue}:stateComparator | orderBy:'name'"
             typeahead-min-length="0"
             qt-typeahead-async-show-on-focus
             ng-trim="false"
             custom-style="{'max-height': '190px', 'overflow-y': 'auto', 'width': '100%'}">

        <div typeahead-input-icon="userCompany" ></div>

        <!--<qt-dropdown-typehead list-for-dropdown="clientCompanies" qt-add-create-new-button="company"-->
                              <!--selected-item="ticketCompany"-->
                              <!--display-property="'name'"-->
                              <!--filter-property="'name'"-->
                              <!--qt-ng-minlength="40"-->
                              <!--qt-ng-trim="'false'"-->
                              <!--qt-name="'ticketCompany'"-->
                              <!--qt-class="'form-control'"-->
                              <!--qt-ng-style="'{\'max-height\': \'190px\', \'overflow-y\': \'auto\', \'width\': \'100%\'}'">-->

        <!--</qt-dropdown-typehead>-->


    </div>
    <div class="col-md-6 dropdown-user-parent" add-create-new-button="user" ng-class="{'has-error': isShowingErrors(ticketForm, 'ticketCreatedUser')}">
      <!-- <input placeholder="Select User" type="text"> -->

        <input type="text" class="form-validation has-dropdown-with-label" autocomplete="off"
               smart-dropdown-menu-position
               ng-model="ticketCreatedUser"
               typeahead-template-url="/html/partials/user-autocomplete.tpl.html"
               uib-typeahead="user as getUserName(user) for user in clients | filter: filterUserFullName($viewValue) | orderBy:'firstName'"
               qt-typeahead-async-show-on-focus ng-trim="false"
               placeholder="Select User"
               custom-style="{'overflow-y': 'auto', 'width': '100%', 'max-height': '190px'}">

        <input placeholder="Select User" type="hidden" ng-model="ticket.createdUser.firstName" name="ticketCreatedUser" ng-required="true">

        <div typeahead-input-icon-sm="ticketCreatedUser"></div>
        <div class="ng-scope" typeahead-input-icon="userCompany">
          <span class="x-mark" ng-click="clearInput($event)" ng-show="showClearIcon">
            <i class="icn-sm icn-remove-old" ng-click="clearInput($event)" tooltip="clear"
               tooltip-placement="top"></i>
        </span>
          <span class="x-mark ng-hide" ng-hide="showClearIcon">
            <i class="icn-sm icn-caret-gray"></i>
          </span>
        </div>



    </div>
    <div class="col-md-6 dropdown-user-parent" ng-class="{'has-error': isShowingErrors(ticketForm, 'ticketAssignTo')}">
      <!-- <input placeholder="Assign to" type="text"> -->



        <input type="text" class="form-validation has-dropdown-with-label"
               smart-dropdown-menu-position autocomplete="off"
               ng-model="ticket.ticketAssignTo" name="ticketAssignTo"
               typeahead-on-select="userAssigned(ticketAssignTo)"
               placeholder="Assign to"
               typeahead-editable="false" typeahead-template-url="/html/partials/user-autocomplete.tpl.html"
               uib-typeahead="user as getUserName(user) for user in usersCurrentCompany | filter:filterUserFullName($viewValue) | orderBy:'firstName'"
               qt-typeahead-async-show-on-focus ng-required="false"
               custom-style="{'max-height': '152px', 'overflow-y': 'auto', 'width': '100%'}">

        <div typeahead-input-icon-sm="ticketAssignTo"></div>

        <div class="ng-scope" typeahead-input-icon="userCompany">
          <span class="x-mark" ng-click="clearInput($event)" ng-show="showClearIcon">
            <i class="icn-sm icn-remove-old" ng-click="clearInput($event)" tooltip="clear"
               tooltip-placement="top"></i>
        </span>
          <span class="x-mark ng-hide" ng-hide="showClearIcon">
            <i class="icn-sm icn-caret-gray"></i>
          </span>
        </div>


    </div>
    <div class="col-md-6" ng-class="{'has-error': isShowingErrors(ticketForm, 'ticketAgent')}">
      <!-- <input placeholder="Select Device" type="text"> -->

        <input type="text" class="form-validation has-dropdown-with-label" autocomplete="off"
               smart-dropdown-menu-position
               ng-model="ticketAgent" name="ticketAgent"
               placeholder="Select Device"
               ng-disabled="(ticket.createdUser && ticket.createdUser.companyId === unassignedCompany.id) || !filteredAgentList || !filteredAgentList.length"
               uib-typeahead="agent as (agent.hostName || agent.ip) for agent in filteredAgentList | filter:filterAgents($viewValue) | orderBy:'hostName'"
               qt-typeahead-async-show-on-focus
               custom-style="{'max-height': '113px', 'overflow-y': 'auto', 'width': '356px'}">

        <div typeahead-input-icon-sm="ticketAgent"></div>

        <div class="ng-scope" typeahead-input-icon="userCompany">
            <span class="x-mark" ng-click="clearInput($event)" ng-show="showClearIcon">
              <i class="icn-sm icn-remove-old" ng-click="clearInput($event)" tooltip="clear"
                 tooltip-placement="top"></i>
          </span>
          <span class="x-mark ng-hide" ng-hide="showClearIcon">
              <i class="icn-sm icn-caret-gray"></i>
            </span>
        </div>


    </div>
  </div>
  <div class="ticket--footer">
    <button-with-loading-indicator class="btn btn-primary"
                                   ng-click="saveTicket(ticketForm)"
                                   loading="savingInProcess" label="Create"
                                   custom-disabled="{{ (((ticketForm.$invalid && !isTicketFormValid(ticketForm)) || ticketForm.$pristine) && triedToSaveTicket) || fileLoadOrError || errorFileMessage }}">
    </button-with-loading-indicator>
    <button class="btn btn-default">Cancel</button>
  </div>
</div>
