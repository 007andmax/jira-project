

<div class="create-new create-ticket-form" ng-form="ticketForm" ng-controller="quicktech.createTicketCtrl">
  <div class="ticket--header">
    <h2>Create New Ticket</h2>
    <button class="close-modal">X</button>
  </div>
  <div class="ticket--content row">
    <h2>Type ticket subject here</h2>
    <div class="col-md-12 description"><input placeholder="Write issue here…" type="text"></div>
    <div class="col-md-6"><input placeholder="Select Company" type="text"></div>
    <div class="col-md-6"><input placeholder="Select User" type="text"></div>
    <div class="col-md-6"><input placeholder="Assign to" type="text"></div>
    <div class="col-md-6"><input placeholder="Select Device" type="text"></div>
  </div>
  <div class="ticket--footer">
    <button class="btn btn-primary">Create Ticket</button>
    <button class="btn btn-default">Cancel</button>
  </div>
</div>
