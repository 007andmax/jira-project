
<div class="pass-man-popup">
  <div class="close-btn btn" ng-click="closeWindowWithConfirm()" tabindex="1">
    <i class="icn-sm icn-remove-token"></i>
  </div>
  <div class="form-group justify-flex">
    <span>Template</span>
    <input type="text" class="form-control">
    <div class="features">
      <div class="expire-date justify-flex">
        <div>
          <p>Expiry date</p>
          <p>11/29/2016</p>
        </div>
        <i class="icn-sm calendar"></i>
      </div>
    </div>
  </div>
  <div class="form-group justify-flex">
    <span>Client</span>
    <input type="text" class="form-control">
    <div class="features">

    </div>
  </div>
  <div class="form-group justify-flex">
    <span>Username</span>
    <input type="text" class="form-control">
    <div class="features">

    </div>
  </div>
  <div class="form-group justify-flex">
    <span>Password</span>
    <input type="text" class="form-control">
    <div class="features">
      <img src="./images/input-icons/pass-manager-icn/generate-password.png" alt="">
      <img src="./images/input-icons/pass-manager-icn/hide.png" alt="">
      <img src="./images/input-icons/pass-manager-icn/copy.png" alt="">
    </div>
  </div>
  <div class="clearfix device-field">
    <div class="form-group justify-flex">
      <span>Device/User</span>
      <input type="text" class="form-control">
      <div class="features">
        <img src="./images/input-icons/pass-manager-icn/link.png" alt="">
      </div>
    </div>
    <div class="clearfix" style="margin-left: 120px; padding-bottom: 10px;">
      <ul class="device-list clearfix">
        <div class="clearfix">
          <div class="device-list-tabs active">Device</div>
          <div class="device-list-tabs">User</div>
        </div>
        <li class="clearfix"">
          <label class="control checkbox pull-left ng-scope" stop-propagation="click">
            <input type="checkbox">
            <span class="control-indicator"></span>
            Office06.absolute.local.sega.mega drive2
          </label>
        </li>
        <li class="clearfix"">
          <label class="control checkbox pull-left ng-scope" stop-propagation="click">
            <input type="checkbox">
            <span class="control-indicator"></span>
            Office06.absolute.local.sega.mega drive2
          </label>
        </li>
        <li class="clearfix"">
          <label class="control checkbox pull-left ng-scope" stop-propagation="click">
            <input type="checkbox">
            <span class="control-indicator"></span>
            Office06.absolute.local.sega.mega drive2
          </label>
        </li>
      </ul>
    </div>
  </div>

  <div class="clearfix ip-field">
    <div class="form-group justify-flex">
      <span>IP</span>
      <input type="text" class="form-control">
      <div class="features justify-flex">
        <span style="margin-right: 10px;">Port:</span>
        <input type="text" class="form-control">
      </div>
    </div>
    <div class="clearfix" style="margin-left: 130px; padding-bottom: 10px;">
      <label class="control checkbox pull-left ng-scope" stop-propagation="click">
        <input type="checkbox">
        <span class="control-indicator"></span>
        https://
      </label>
      <label class="control checkbox pull-left ng-scope" stop-propagation="click">
        <input type="checkbox">
        <span class="control-indicator"></span>
        SSH
      </label>
      <label class="control checkbox pull-left ng-scope" stop-propagation="click">
        <input type="checkbox">
        <span class="control-indicator"></span>
        Telnet
      </label>
    </div>
  </div>
  <div class="form-group justify-flex">
    <span>Description</span>
    <textarea type="text" class="form-control"></textarea>
  </div>
  <div class="form-group clearfix">
    <div class="btn btn-success pull-right">Save</div>
  </div>
</div>
