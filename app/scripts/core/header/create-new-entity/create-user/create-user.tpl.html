<div class="create-new" ng-controller="quicktech.createUserCtrl">
  <div class="user--header">
    <div>
      <h2>Create New User</h2>
    </div>
    <button class="close-modal icn-sm icn-remove-old"></button>
  </div>
  <div class="user--content row">
    <div edit-avatar class="col-xs-12" model="editUser" model-name="user"></div>
    <div class="col-md-6"><input placeholder="First Name" type="text"></div>
    <div class="col-md-6"><input placeholder="Last Name" type="text"></div>
    <div class="col-md-6"><input placeholder="Email" type="text"></div>
    <div class="col-md-6"><input placeholder="Select Company" type="text"></div>
    <div class="col-md-6"><input placeholder="Title" type="text"></div>
    <div class="col-md-6"><input placeholder="Contact Type" type="text"></div>
    <div class="col-md-6"><input placeholder="Subscribe for" type="text"></div>
    <div class="col-md-6 phone-number"><input placeholder="Phone Number" type="text"></div>
  </div>
  <div class="user--footer">
    <button class="btn btn-primary">Create User</button>
    <button class="btn btn-default">Cancel</button>
  </div>
</div>
