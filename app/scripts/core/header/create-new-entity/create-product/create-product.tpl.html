<div class="create-new" ng-controller="quicktech.createProductCtrl">
  <div class="product--header">
    <h2>Create Product</h2>
    <button class="close-modal" ng-click="closeWindowWithConfirm()">X</button>
  </div>
  <div class="product--content row">
    <div class="col-md-6"><input placeholder="Item number" type="text"></div>
    <div class="col-md-6"><input placeholder="Description" type="text"></div>
    <div class="col-md-6"><input placeholder="Enter Category" type="text"></div>
    <div class="col-md-3"><input placeholder="Cost" type="text"></div>
    <div class="col-md-3"><input placeholder="Price" type="text"></div>
    <div class="col-md-6"><input placeholder="Select Tax" type="text"></div>
    <div class="col-md-6"><p>Add New Tax</p></div>
    <div class="col-md-6"><input placeholder="ILC Number" type="text"></div>
    <div class="col-md-6"><input placeholder="Select Vendor" type="text"></div>
  </div>
  <div class="product--footer">
    <button class="btn btn-primary">Create Product</button>
    <button class="btn btn-default">Cancel</button>
  </div>
</div>
