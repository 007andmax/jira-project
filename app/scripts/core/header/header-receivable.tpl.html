<div class="topNavbarLeft-Left pull-left" ng-controller="quicktech.core.header.receivableCtrl">

  <div class="topNavbar-search pull-left">
    <div class="input-group-search">

      <input class="form-control-top-search user-search" placeholder="Search invoice..."
             ng-model="searchValue" typeahead-on-select="showInvoice(searchValue)" autocomplete="off"
             typeahead="item as (item.name ? item.name : item.number) for item in (isNaN(+$viewValue) ? (sharedState.companies | filter: {name: $viewValue}:stateComparator  | orderBy:'name') : searchInvoice($viewValue))"
             custom-style="{'max-height': '160px', 'overflow-y': 'auto'}">

      <span class="input-group-addon-search">
        <div typeahead-input-icon="searchValue" style="position: absolute;top: 13px;right: 13px;"></div>
      </span>

    </div>
  </div>

</div>
