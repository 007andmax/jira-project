<div class="topNavbarLeft-Left pull-left" ng-controller="quicktech.core.header.receivableCtrl">

  <p class="pull-left" style="white-space: nowrap;"><strong>Receivable</strong></p>

  <div class="topNavbar-search pull-left">
    <div class="input-group-search">

      <input class="form-control-top-search user-search" placeholder="Search invoice..."
             ng-model="invoice" typeahead-on-select="showInvoice(invoice)"
             typeahead="invoice as invoice.number for invoice in searchInvoice($viewValue)"
             custom-style="{'max-height': '160px', 'overflow-y': 'scroll'}">

      <span class="input-group-addon-search">
        <i class="icn-sm icn-search form-control-top-search-icn disabled"></i>
      </span>

    </div>
  </div>

</div>
