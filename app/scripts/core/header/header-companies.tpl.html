<div class="topNavbarLeft-Left pull-left" ng-controller="quicktech.core.header.companiesCtrl">

  <p class="pull-left" style="white-space: nowrap;"><strong>Companies</strong>&nbsp;<span class="text-muted">{{ sharedState.count }}</span>
  </p>

  <div class="topNavbar-search pull-left">
    <div class="input-group-search">

      <input type="text" class="form-control-top-search user-search" placeholder="Search company..."
             ng-model="searchValue">

      <span class="input-group-addon-search">
        <i class="icn-sm icn-search form-control-top-search-icn disabled" ng-hide="searchValue"></i>

        <i class="icn-sm icn-remove-token" style="cursor:pointer;pointer-events: auto;"
           ng-show="searchValue" ng-click="searchValue = ''"
           tooltip="clear" tooltip-placement="top"></i>
      </span>

    </div>
  </div>
</div>
