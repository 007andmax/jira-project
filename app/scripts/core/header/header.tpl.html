<nav class="navbar navbar-default topNavbar">
  <div class="topNavbar-content" ng-controller="quicktech.core.header.headerCtrl">

    <div class="topNavbar-logo pull-left" style="position: fixed">
      <a href="javascript:void(0)" class="hit-area ha-36-36">
        <i class="icn-lg logo"></i>
      </a>
    </div>

    <div class="topNavbarLeft pull-left">

      <div class="pull-left" ng-if="goBack.isEnabled">
        <a href="javascript:void(0)" class="hit-area ha-20-16 has-tooltip"
           style="margin: 11px 8px 0 0;" ng-click="goBack.func()"
           tooltip-append-to-body="true" tooltip-placement="bottom" tooltip="{{ goBack.tooltip }}">
          <i class="icn-sm icn-back-arrow"></i>
        </a>
      </div>

      <p class="pull-left" style="white-space: nowrap;"
         ng-if="!globalSearch.selectedItemsCount && (globalSearch.openedItemName || getTemplateNameByState())">
        <strong>{{ globalSearch.openedItemName ? globalSearch.openedItemName : userReadable(getTemplateNameByState()) }}</strong>
        <span class="text-muted" ng-if="count = getCurrentCount()">
          &nbsp;{{ count }}
        </span>
      </p>

      <p class="pull-left" style="white-space: nowrap;" ng-if="globalSearch.selectedItemsCount">
        <strong>{{ globalSearch.selectedItemsCount }}</strong>&nbsp;
        <span class="text-muted">Selected</span>
      </p>

      <label class="global-search-trigger" ng-click="changeSearchStatus()">
        <input type="checkbox" ng-model="globalSearch.isGlobalSearchOn">
        <span class="toggle-bg" tooltip="{{ globalSearch.isGlobalSearchOn ? 'Off' : 'On'}} global search"
              tooltip-placement="bottom" tooltip-append-to-body="true"></span>
        <span class="toggle-indicator"></span>
      </label>

      <div ng-if="getTemplateNameByState() || globalSearch.isGlobalSearchOn" class="searchField">
        <div ng-include="'/html/scripts/core/header/' + (globalSearch.isGlobalSearchOn ? 'global-search/global-search.tpl.html'
                         : 'header-' + getTemplateNameByState() + '.tpl.html')"></div>
      </div>

      <div class="topNavbarLeft-Right pull-right">

        <div class="topNavbar-filter pull-left"></div>

        <div class="topNavbar-create pull-right">
          <div class="dropdown">

            <div class="btn btn-success has-tooltip" data-toggle="dropdown">
              <div class="create-new-wrap">
                <span class="create-new-label">Create New</span>
                <i class="icn-sm icn-plus"></i>
              </div>
            </div>

            <ul class="dropdown-menu dropdown-menu-right">

              <li role="presentation">
                <a role="menuitem" tabindex="-1" create-ticket-open-modal>Ticket</a>
              </li>

              <li role="presentation">
                <a role="menuitem" tabindex="-1" ng-if="clientCompanies.length" ui-sref="users.create">User</a>
              </li>

              <li role="presentation"
                  ng-show="PermissionsService.isAllowed('header', currentUser.role, 'c_company')">
                <a role="menuitem" tabindex="-1" ui-sref="createCompany">Company</a>
              </li>

              <li role="presentation"
                  ng-show="PermissionsService.isAllowed('header', currentUser.role, 'c_vendor')">
                <a role="menuitem" tabindex="-1" ui-sref="createVendor">Vendor</a>
              </li>

              <li role="presentation">
                <a role="menuitem" tabindex="-1" href="javascript:void(0)">Lead</a>
              </li>

              <li role="presentation">
                <a role="menuitem" tabindex="-1" href="javascript:void(0)">Agent</a>
              </li>

            </ul>

          </div>
        </div>

      </div>

    </div>

    <div class="topNavbarRight pull-right">

      <div dropdown>
        <div class="nickname-wrap" dropdown-toggle>
          <!--<i ng-class="{'on': currentUser.online, 'busy': !currentUser.online}"-->
             <!--ng-click="currentUser.online = !currentUser.online"></i>-->
          <i class="on"></i>

         <div class="nickname">{{ getUserName(currentUser) }}</div>

         <i class="icn-sm icn-expand"></i>
         <i class="icn-sm icn-collapse"></i>
       </div>

       <ul class="dropdown-menu tag-list">
         <li class="topNavbar-logout" logout-btn>
           <a href="javascript:void(0)" class="ha-20-16">
             <i class="icn-md icn-logout" style="margin-top: 6px;"></i>
             <span>Logout</span>
           </a>
         </li>
       </ul>
     </div>

     <a ui-sref="settings" class="settings-href has-tooltip"
        tooltip="Settings" tooltip-placement="bottom" append-to-body="true">
       <i class="icn-sm icn-settings"></i>
     </a>

   </div>

 </div>
</nav>
