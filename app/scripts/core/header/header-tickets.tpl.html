<div ng-controller="quicktech.core.header.ticketsCtrl">

  <div class="topNavbarLeft-Left pull-left" ng-if="!isShowBulkAction && listType !== 'preview'">

    <div class="topNavbar-search pull-left">

      <div class="input-group-search">

        <div class="input-group-btn-search" dropdown
             ng-init="searchByParamsDropdown = {}" is-open="searchByParamsDropdown.isOpen">

          <div class="btn-search btn-primary has-tooltip"
               aria-haspopup="true" dropdown-toggle
               tooltip="Filter Tickets..." tooltip-placement="bottom">
            <i id="btn-search-icn-filter" class="icn-sm icn-ticket-filter"></i>
          </div>

          <div class="dropdown-menu dropdown-filter clearfix" stop-propagation="click">
            <div class="filter-by-wrapper filter-priority clearfix">

              <div class="pull-left">
                <label class="control checkbox">
                  <input type="checkbox" ng-model="searchParams.priority.enabled">
                  <span class="control-indicator"></span> Filter by Priority
                </label>
              </div>

              <div class="pull-right">
                <span class="current-label">{{ showPriorityParamsMap[searchParams.priority.value] }}</span>
              </div>

              <div class="filter-slider-wrapper clearfix"
                   ng-class="{ 'disabled': !searchParams.priority.enabled }">

                <div class="filter-slider-range">
                  <input type="range" min="0" max="2" step="1"
                         ng-model="searchParams.priority.value"/>
                </div>

                <div class="filter-slider-track">

                  <div class="filter-slider-starts icn-lg icn-slider-start pull-left"></div>

                  <div class="filter-slider-center icn-lg icn-slider-center pull-left"></div>

                  <div class="filter-slider-ends icn-lg icn-slider-end pull-left"></div>

                </div>
              </div>
            </div>

            <div class="filter-by-wrapper filter-status clearfix">

              <div class="pull-left">
                <label class="control checkbox">
                  <input type="checkbox" ng-model="searchParams.status.enabled">
                  <span class="control-indicator"></span> Filter by Status
                </label>
              </div>

              <div class="pull-right">
                <span class="current-label">{{ showStatusParamsMap[searchParams.status.value] }}</span>
              </div>

              <div class="filter-slider-wrapper clearfix"
                   ng-class="{ 'disabled': !searchParams.status.enabled }">

                <div class="filter-slider-range">
                  <input type="range" min="0" max="2" step="1"
                         ng-model="searchParams.status.value"/>
                </div>

                <div class="filter-slider-track" id="filter-slider-track">

                  <div class="filter-slider-starts icn-lg icn-slider-start pull-left"></div>

                  <div class="filter-slider-center icn-lg icn-slider-center pull-left"></div>

                  <div class="filter-slider-ends icn-lg icn-slider-end pull-left"></div>

                </div>
              </div>
            </div>

            <div class="filter-by-wrapper-footer clearfix">

              <div class="btn btn-lg btn-info pull-left"
                   ng-click="searchByParams(); searchByParamsDropdown.isOpen = false">
                Search
              </div>

              <div class="btn btn-lg btn-primary pull-left"
                   ng-click="searchByParamsDropdown.isOpen = false">
                Cancel
              </div>

            </div>

          </div>
        </div>

        <input type="text" class="form-control-top-search" placeholder="Search tickets..." style="width: 220px;"
               autocomplete="off" typeahead-on-select="selectItem(filter.searchItem)"
               ng-model="filter.searchItem"
               typeahead="item as item.label for item in search($viewValue)"
               custom-style="{'max-height': '160px', 'overflow-y': 'auto', 'width':'250px'}">


        <span class="input-group-addon-search">
          <i class="icn-sm icn-search form-control-top-search-icn disabled" ng-hide="filter.searchItem"></i>

          <i class="icn-sm icn-remove-token" style="cursor:pointer;pointer-events: auto;"
             ng-show="filter.searchItem" ng-click="cancelSearch()"
             tooltip="clear" tooltip-placement="top"></i>
        </span>

      </div>
    </div>
  </div>

</div>
