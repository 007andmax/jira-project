<div class="topNavbarLeft-Left pull-left" ng-controller="quicktech.core.header.productsCtrl">

  <p class="pull-left" style="white-space: nowrap;"><strong>Products</strong></p>

  <div class="topNavbar-search pull-left">
    <div class="input-group-search" header-search-user>

      <input type="text" class="form-control-top-search user-search" placeholder="Search product..."
             ng-model="searchValue" typeahead-on-select="onSelect(searchValue)" autocomplete="off"
             typeahead="item as item.name for item in shownCategories | filter:{'name': $viewValue}:stateComparator | orderBy:['order','name']"
             typeahead-editable="true" ng-trim="true" qt-typeahead-show-on-focus
             custom-style="{'max-height': '200px', 'width': '269px', 'overflow-y': 'auto'}">

      <span class="input-group-addon-search">
        <i class="icn-sm icn-search form-control-top-search-icn disabled" ng-hide="choosedCategory"></i>

        <i class="icn-sm icn-remove-token" style="cursor:pointer;pointer-events: auto;"
           ng-show="choosedCategory" ng-click="clearInput()"
           tooltip="clear" tooltip-placement="top"></i>
      </span>

    </div>
  </div>

</div>
