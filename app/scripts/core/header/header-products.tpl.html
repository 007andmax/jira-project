<div class="nav-left ticket-nav" ng-controller="quicktech.core.header.productsCtrl">

  <div class="" id="search-and-filter">
    <h4>Manage Products & Services</h4>

    <div class="form-group search-form pull-left">
      <input type="text" class="form-control form-control-round form-control-search" placeholder="Search product..."
             ng-model="product" typeahead-on-select="showProduct(product)"
             typeahead="product as product.name for product in searchProducts($viewValue)"
             typeahead-template-url="/html/scripts/core/header/typeahead-template/product.tpl.html"
             custom-style="{'max-height': '160px', 'overflow-y': 'scroll'}">
      <a href="" class="close icn-remove-token" tabindex="-1" ng-click="product = undefined"></a>
    </div>
  </div>
</div>
