<div class="topNavbarLeft-Left pull-left" ng-controller="quicktech.core.header.receiptArchiveCtrl">

  <p class="pull-left" style="white-space: nowrap;"><strong>Receipt Archive</strong></p>

  <div class="topNavbar-search pull-left">
    <div class="input-group-search">
      <input type="text" class="form-control-top-search user-search" placeholder="Search invoice..."
             ng-model="invoice" typeahead-on-select="showInvoice(invoice)"
             typeahead="invoice as invoice.number for invoice in sharedState.invoices | filter:{number: $viewValue} | orderBy:'invoice.number'"
             custom-style="{'max-height': '160px', 'overflow-y': 'scroll'}">

      <span class="input-group-addon-search">
        <i class="icn-sm icn-search form-control-top-search-icn disabled"></i>
      </span>

    </div>
  </div>

</div>
