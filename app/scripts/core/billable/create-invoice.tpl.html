<div ng-if="locksInitialized" ng-class="{'invoice-list-open': showThumbs}">
  <div create-invoice="invoiceLocks" show-lock="invoiceLocks[showInvoiceLockIndex]" invoice-scale="invoiceScale">
    <div class="topbar">
      <center class="animator stop" style="width: 500px;">
        <div class="alert alert-danger" expire-notifications-box></div>
      </center>
      <center class="animator stop" style="width: 300px;">
        <div class="alert alert-yellow" notifications-box> Loading invoice</div>
      </center>
      <div class="paging" page-number-box style="display: none"></div>
      <span class="close-ico" ng-click="close()"></span>
    </div>

    <div class="nav-arrows">
      <div class="next-arrow" ng-click="setShowInvoiceLockIndex(showInvoiceLockIndex + 1)"></div>
      <div class="previous-arrow" ng-click="setShowInvoiceLockIndex(showInvoiceLockIndex - 1)"></div>
    </div>

    <div class="invoice-list">
      <div class="invoice-titlebar" ng-click="showThumbs = !showThumbs" style="height: 98px">
        <div class="current-invoice-info" stop-propagation="click">
          <div class="invoice-icon">
            <span class="ico"></span>
          </div>
          <div class="invoice-info">
            <h4 class="modal-title pull-left">{{ invoiceLocks[showInvoiceLockIndex].company.name }}<span
              class="dot-sep"></span>
            </h4>
            <span class="ticket-numer pull-left">INVOICE NO. {{ invoiceNumber }}</span>

            <div class="total-invoices">{{ showInvoiceLockIndex + 1 }} of {{ invoiceLocks.length }}</div>
          </div>
        </div>
        <div class="invoice-controls" stop-propagation="click">
          <div zoom-slider ng-model="invoiceScale"></div>
          <a href="" ivoice-print-button>
            <span tooltip="Print" tooltip-placement="top" class="print-ico pull-left tp-hide"></span>
          </a>
          <button type="button" class="pull-left btn btn-scooter"
                  ng-click="createInvoice(invoiceLocks[showInvoiceLockIndex])"
                  ng-disabled="savingInvoiceInProcess.indexOf(invoiceLocks[showInvoiceLockIndex].id) > -1"
                  ng-disabled="invoiceLocks[showInvoiceLockIndex].expired"><span class="ico-arrow"></span>
          </button>
        </div>
      </div>
      <div class="invoice-thumbs" invoice-thumbs>
        <ul>
          <li ng-repeat="lock in invoiceLocks" ng-class="{active: showInvoiceLockIndex === $index}"
              ng-click="setShowInvoiceLockIndex($index)">
            <span id="invoice-thumb-{{ invoiceLocks[$index].id }}">
            </span>
          </li>
        </ul>
      </div>
    </div>

    <div class="inv-container container" invoice-container style="background-color: rgba(0, 0, 0, 0);">

    </div>
  </div>
</div>
