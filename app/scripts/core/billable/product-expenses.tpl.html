<div class="table-content pull-right accounting-prod-list" ng-repeat="product in ticket.productExpense">
  <i class="icn icn-sm icn-update-product"></i>

  <div class="col-sm-2">
    ILC: <span class="model">{{ product.item.ilc }}</span>
  </div>

  <div class="col-sm-2" style="border-left: 1px solid #e7ecf2;">
    P/N: <span class="model">{{ product.item.manufacture }}</span>
  </div>

  <div class="{{ product.serialNumber ? 'col-sm-2' : 'col-sm-4' }}"
       trimmed-popover trimmed-popover-content="product.item.description">
    {{ product.item.description }}
  </div>

  <div class="col-sm-2" ng-show="product.serialNumber && (product.serialNumber.length > 0)"
       trimmed-popover trimmed-popover-content="product.serialNumber">
    {{ product.serialNumber }}
  </div>

  <div class="col-sm-2">{{ product.sum | currency: '$': 2 }}</div>

  <div class="col-sm-2">{{ product.price | currency: '$': 2 }}
    <span class="model">Qty {{ product.billableQuantity }}</span>
  </div>
  <!--DISCOUNT-->


  <form name="billableEditDiscountForm"
        stop-propagation="click">
    <!--DISCOUNTS-->
    <!--Discount amount-->
    <div class="form-group">
      <input type="text"
             class="form-control"
             placeholder="Discount Amount"
             name="discountAmount"
             ng-model="product.discountAmount"
             ng-max="discountAmountMsxLength"
             ng-min="0"
             ng-required="product.discountType == 'PERCENT' || product.discountType == 'FIXED'"
             ng-disabled="!product.discountType"
             execute-when-outfocused="addDiscountInBillable(product.id, product.discountAmount, product.discountType, false)"
             qt-to-fixed="2"
             hard-reset-pattern="decimalNumberPattern">
    </div>
    <div>
      <!--Discount type-->
      <div class="form-group">
        <div uib-dropdown keyboard-nav="true" dropdown-append-to-body="true">

          <button class="form-control form-control-dropdown account-type no-cursor has-dropdown"
                  uib-dropdown-toggle aria-expanded="true"
                  tabindex="32">
            {{discountTypes[product.discountType]}}
            <b ng-hide="product.discountType" style="color: rgba(76, 92, 111, 0.36)">
              Choose Discount Type
            </b>
          </button>
          <i class="icn-sm icn-caret-gray"></i>

          <ul class="dropdown-menu dropdown-account-type" uib-dropdown-menu>
            <li ng-click="product.discountType = 'PERCENT'; discountAmountMsxLength = 100; addDiscountInBillable(product.id, product.discountAmount, product.discountType, false)">
              <a href="javascript:void(0)"> Percent</a>
            </li>
            <li ng-click="product.discountType = 'FIXED'; discountAmountMsxLength = null; addDiscountInBillable(product.id, product.discountAmount, product.discountType, false)">
              <a href="javascript:void(0)"> Fixed </a>
            </li>
            <li
              ng-click="product.discountType = ''; discountAmountMsxLength = ''; product.discountAmount = null; addDiscountInBillable(product.id, product.discountAmount, product.discountType, true)">
              <a href="javascript:void(0)"> No Discount </a>
            </li>
          </ul>

        </div>
      </div>
    </div>
  </form>



  <div>
    <select-taxes taxes="taxes" entity="product" entity-type="product" on-close="saveTaxes"></select-taxes>
  </div>

</div>
