<div class="table-content pull-right" ng-repeat="product in ticket.productExpenses">
  <i class="icn icn-sm icn-update-product"></i>

  <div class="col-1">{{ product.item.name }}
    <span class="model">#{{ product.item.code }}</span>
  </div>

  <div class="col-2 description"
       popover="{{ product.description }}" popover-trigger="mouseenter" popover-placement="bottom">
    {{ product.description }}
  </div>

  <div class="col-4">{{ product.sum | currency: '$': 0 }}</div>

  <div class="col-3">{{ product.price | currency: '$': 0 }}
    <span class="model">Qty {{ product.billableQuantity }}</span>
  </div>

</div>
