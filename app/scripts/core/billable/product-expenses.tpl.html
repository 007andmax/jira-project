<div class="table-content pull-right accounting-prod-list" ng-repeat="product in ticket.productExpense">
  <i class="icn icn-sm icn-update-product"></i>

  <div class="col-sm-2">
    ILC: <span class="model">{{ product.item.ilc }}</span>
  </div>

  <div class="col-sm-2" style="border-left: 1px solid #e7ecf2;">
    P/N: <span class="model">{{ product.item.manufacture }}</span>
  </div>

  <div class="{{ product.serialNumber ? 'col-sm-2' : 'col-sm-4' }}"
       trimmed-popover trimmed-popover-content="product.item.description">
    {{ product.item.description }}
  </div>

  <div class="col-sm-2 ellipsis" ng-show="product.serialNumber && (product.serialNumber.length > 0)"
       trimmed-popover trimmed-popover-content="product.serialNumber">
    {{ product.serialNumber }}
  </div>

  <div class="col-sm-2">{{ product.sum | currency: '$': 2 }}
    <form name="billableEditDiscountForm"
          stop-propagation="click">
      <!--DISCOUNTS-->
      <!--Discount amount-->
      <div  ng-hide="isShowBillableDiscountInput || product.discountAmount != null">
        <i class="icon-sm sale-icon-for-isDicount" ng-click="isShowBillableDiscountInput = !isShowBillableDiscountInput" uib-tooltip="Click to choose Discount"></i>
      </div>
      <div class="form-group discount-recurring" ng-show="isShowBillableDiscountInput || product.discountAmount != null">
        <input type="text"
               class="form-control"
               placeholder="Discount Amount"
               name="discountAmount"
               ng-model="product.discountAmount"
               ng-max=100"
               ng-min="0"
               execute-when-outfocused="addDiscountInBillable(product.id, product.discountAmount)"
               qt-to-fixed="2"
               hard-reset-pattern="{{service.discountType}}"
               ng-keydown="$event.which === 13 && $event.preventDefault()">

      </div>
    </form>
  </div>

  <div class="col-sm-2">{{ product.price | currency: '$': 2 }}
    <span class="model">Qty {{ product.billableQuantity }}</span>
    <div class="tax-recurring">
      <select-taxes taxes="taxes" entity="product" entity-type="product" on-close="saveTaxes"></select-taxes>
    </div>
  </div>
