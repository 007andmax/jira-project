<div class="table-content service-table pull-right" ng-repeat="service in ticket.serviceExpense">

  <i class="icn icn-sm icn-update-service"></i>

  <div class="col-1">{{ service.createdAt | date:'dd MMM yyyy' }}</div>
  <div class="col-2">{{ service.item.name }}</div>
  <div class="col-5">{{ service.sum | currency: '$': 2 }}</div>
  <div class="col-4">Duration <span class="model">{{ service.billableQuantity | durationFilter }}</span></div>

  <div class="col-3" trimmed-popover trimmed-popover-content="service.description">
    {{ service.description }}
  </div>
  <!--DISOCUNT-->
  <div ng-if="service.discount">
    Discount: {{ service.discount}} <b ng-if="service.disocunt =='PERCENT' ">%</b>
  </div>

  <div>
    <select-taxes taxes="taxes" entity="service" entity-type="service" on-close="saveTaxes"></select-taxes>
  </div>

</div>
