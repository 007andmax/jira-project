<div class="table-content service-table pull-right" ng-repeat="service in ticket.serviceExpense">

  <i class="icn icn-sm icn-update-service"></i>

  <div class="col-1">{{ service.createdAt | date:'dd MMM yyyy' }}</div>
  <div class="col-2">{{ service.item.name }}</div>
  <div class="col-sm-2" style="float: right;" >{{ service.sum | currency: '$': 2 }}
    <div class="tax-recurring">
      <select-taxes taxes="taxes" entity="service" entity-type="service" on-close="saveTaxes"></select-taxes>
    </div>
  </div>
  <div class="col-sm-2" style="float: right;" >Duration <span class="model">{{ service.billableQuantity | durationFilter }}</span>
    <form name="billableEditDiscountForm"
          stop-propagation="click">

      <div class="form-group discount-recurring">
        <input type="number"
               class="form-control"
               placeholder="Discount Amount"
               name="discountAmount"
               ng-model="service.discountAmount"
               ng-max="discountAmountMsxLength"
               ng-min="0"
               ng-required="service.discountType == 'PERCENT' || service.discountType == 'FIXED'"
               ng-disabled="!service.discountType"
               execute-when-outfocused="addDiscountInBillable(service.id, service.discountAmount, service.discountType, false)"
               qt-to-fixed="2"
               hard-reset-pattern="decimalNumberPattern">

        <div class="form-group " style="display: inline-block;">
          <div uib-dropdown keyboard-nav="true" dropdown-append-to-body="true">

            <button class="form-control form-control-dropdown account-type no-cursor has-dropdown"
                    uib-dropdown-toggle aria-expanded="true"
                    tabindex="32">
              {{discountTypes[service.discountType]}}
              <b ng-hide="service.discountType" style="color: rgba(76, 92, 111, 0.36)">
                Type
              </b>
            </button>
            <i class="icn-sm icn-caret-gray"></i>

            <ul class="dropdown-menu dropdown-account-type" uib-dropdown-menu>
              <li
                ng-click="service.discountType = 'PERCENT'; discountAmountMsxLength = 100; addDiscountInBillable(service.id, service.discountAmount, service.discountType, false)">
                <a href="javascript:void(0)"> Percent</a>
              </li>
              <li
                ng-click="service.discountType = 'FIXED'; discountAmountMsxLength = null; addDiscountInBillable(service.id, service.discountAmount, service.discountType, false)">
                <a href="javascript:void(0)"> Fixed </a>
              </li>
              <li
                ng-click="service.discountType = ''; discountAmountMsxLength = ''; service.discountAmount = null; addDiscountInBillable(service.id, service.discountAmount, service.discountType, true)">
                <a href="javascript:void(0)"> No Discount </a>
              </li>
            </ul>

          </div>
        </div>
      </div>

    </form>
  </div>

  <div class="col-3" trimmed-popover trimmed-popover-content="service.description">
    {{ service.description }}
  </div>


</div>
