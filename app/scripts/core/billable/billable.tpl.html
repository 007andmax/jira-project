<div>
  <div class="billable-content">
    <div class="tabs-container">
      <div class="fixed-block-top" style="width: auto; height: 55px; right: -20px;" fixed-block-top>

        <ul class="nav nav-qt" role="tablist">

          <div ng-if="PermissionsService.isAllowed('CREATE_INVOICE')" style="text-align: right">
            <div qt-popover-position="bottom-right-align" custom-disabled="{{ !isCurrentCompanyAddressEmpty }}"
                 qt-custom-popover-template="/html/scripts/common/templates/company-has-no-address-popover.tpl.html"
                 style="display: inline-block;">
              <div qt-popover-trigger="mouseenter" style="display: inline-block">
                <div class="btn btn-create-invoice btn-primary pull-right has-tooltip" style="width: 98px;"
                     custom-disabled="{{ !countTicket || isCurrentCompanyAddressEmpty || isCurrentCompanyAddressEmpty === undefined }}"
                     tooltip-placement="top" tooltip-append-to-body="true" uib-tooltip="Create Invoice"
                     modal-window-button="/html/scripts/core/billable/create-invoice.tpl.html"
                     modal-window-class="invoice-modal-not-background"
                     mw-window-template-url="/html/scripts/core/billable/create-invoice-modal.tpl.html"
                     mw-controller="quicktech.core.billable.createInvoiceCtrl">
                  <i class="icon-sm icn-create-invoice"></i>
                </div>
              </div>
            </div>
          </div>
        </ul>
      </div>

    </div>

    <div class="tab-content" style="margin-top: 20px;">
      <div role="tabpanel" class="tab-pane active">
        <ul class="qt-list qt-billable-clients" ng-hide="loadingInProgress" ftt-tab-content>

          <li class="billable-main" event-toggle-slider="toggleBillableTickets"
              ng-controller="quicktech.core.billable.companyCtrl"
              ng-repeat="billableCompany in billableData | filterBillableCompany"
              on-finish-render="loadingFinished()">

            <div ng-click="toggleBillableTickets()"
                 class="clickable-layer"></div>

            <div class="col-1">

              <a href="javascript:void(0)" class="hit-area ha-16-18 lock-icon pull-left" stop-propagation="click"
                 ng-show="billableCompany.lockType !== 'NONE'">
                <i class="icn-sm icn-locked"></i>
              </a>

              <label ng-if="billableCompany.lockType === 'NONE' && PermissionsService.isAllowed('CREATE_INVOICE')"
                     class="control checkbox pull-left"
                     stop-propagation="click" style="z-index: 2;">
                <input type="checkbox" ng-model="ticketsSelection[company.id].checked"
                       ng-click="changeCompanyCheckbox(billableCompany.companyId)"
                       ng-disabled="anotherCompanySelected(billableCompany.companyId)">
                <span class="control-indicator"></span>
              </label>

              <div class="checkbox-caption bold">{{ company.name }}</div>
              <span class="label label-light">{{ billableCompany.tickets.length }}</span>

            </div>

            <div class="col-2">

              <div style="float: left;" ng-if="isDisocuntForIcon(billableCompany)">
                <i class="icon-sm sale-icon-for-isDicount"></i>
              </div>

              <div class="billable-amount bold">
                {{ billableCompany.totalSum | currency: '$': 2 }}
              </div>

            </div>

            <ul class="qt-list qt-billable-sub" ets-slider ng-if="showTickets" qt-scroll-to="top"
                ng-controller="quicktech.core.billable.companyTicketsCtrl">

              <li class="inventory-details"
                  ng-repeat="ticket in billableCompany.tickets | orderBy:'closedAt'" qt-toggle-slider
                  show-model-element="{{ 'showTicket-' + ticket.id }}">

                <div qt-ts-toggler
                     class="clickable-layer"></div>

                <div class="col-1">
                  <div class="clearfix">

                    <a href="javascript:void(0)" class="hit-area ha-16-18 lock-icon has-tooltip pull-left"
                       ng-if="ticket.lockedBy" stop-propagation="click"
                       tooltip-placement="top" tooltip-append-to-body="true"
                       uib-tooltip="{{ getTooltipName(ticket.lockedBy) }}">
                      <i class="icn-sm icn-locked-blue"></i>
                    </a>

                    <label class="control checkbox pull-left"
                           ng-if="!ticket.lockedBy && PermissionsService.isAllowed('CREATE_INVOICE')"
                           stop-propagation="click">
                      <input type="checkbox" ng-model="ticketsSelection[company.id].tickets[ticket.id]"
                             ng-change="changeTicketCheckbox(billableCompany.companyId)"
                             ng-disabled="anotherCompanySelected(billableCompany.companyId)">
                      <span class="control-indicator"></span>
                    </label>

                    <div class="checkbox-caption">{{ ticket.subject }}</div>
                    <a class="label label-primary" stop-propagation="click"
                       style="cursor: pointer; position: absolute; z-index: 10" custom-disabled="{{ ticket.isOrder }}"
                       ui-sref="tickets.details({ listType: 'all', ticketId: ticket.id, remoteParams: null })">
                      Tkt# {{ ticket.ticketNumber }}
                    </a>
                  </div>
                </div>

                <div class="col-2">
                  <div ng-if="ticket.discountSum > 0">
                    <i class="icon-sm sale-icon-for-isDicount"></i>
                  </div>
                  <div class="billable-amount bold">{{ ticket.sum | currency: '$': 2 }}</div>
                </div>

                <div class="table-wrapper clearfix" qt-ts-slider style="display: none;">

                  <div ng-include="'/html/scripts/core/billable/product-expenses.tpl.html'"></div>
                  <div ng-include="'/html/scripts/core/billable/service-expenses.tpl.html'"></div>

                </div>
              </li>

            </ul>
          </li>
        </ul>
        <loading-indicator loading-trigger="loadingInProgress"></loading-indicator>
      </div>
    </div>
  </div>
</div>

    i['GoogleAnalyticsObject'] = r;
    i[r] = i[r] || function () {

      }, i[r].l = 1 * new Date();
    a = s.createElement(o),

    a.async = 1;
