<div class="create-note-modal">
  <div class="modal-header clearfix">
    <a href="javascript:void(0)"
       style="position: absolute;right: 20px;top: 20px;"
       ng-click="close()"
       data-dismiss="modal"
       aria-label="Close">
      <i class="icn-sm icn-remove-old"></i>
    </a>
    <div class="col-md-8">
      <h4 class="modal-title pull-left">Create Credit</h4>
    </div>
    <div class="col-md-4">
      <input type="text" class="form-control absolute-stick-datepicker has-dropdown" placeholder="Date"
             qt-data-time-picker max-date="maxServiceDate" ng-model="serviceExpense.date"
             name="serviceData" ng-required="true" uib-tooltip="select date">
      <div>
        <i class="report-calendar"></i>
      </div>
    </div>
  </div>
  <div class="note-modal-content clearfix">
    <p>Create a Credit for the following</p>
    <div class="form-group">
      <label class="control-label">Select Company</label>
      <div uib-dropdown style="position: relative;">
        <input class="form-control has-dropdown readonly-normal" type="text" READONLY
               uib-dropdown-toggle aria-expanded="true" ng-model="">
        <i class="icn-sm report-caret-icon pointer" style="top: 16px;right: 16px;"></i>

        <ul class="dropdown-menu">
          <li ng-repeat=""
              ng-click="">
            <a tabindex="-1" href="javascript:void(0)"> {{  }} </a>
          </li>
        </ul>

      </div>
    </div>
    <div class="pull-right total-amount">
      <div>
        <span>Total</span>
        <strong>$425</strong>
      </div>
    </div>
    <div class="form-group note"
         ng-class="{'has-error': isShowingErrors(paymentRecieveForm, 'note')}">

      <label class="control-label" ng-class="{ 'hide': isShowingErrors(paymentRecieveForm, 'note')}">
        Note
      </label>

      <div ng-messages="paymentRecieveForm.note.$error"
           ng-class="{ 'hide': !isShowingErrors(paymentRecieveForm, 'note')}">
        <label class="control-label" ng-message="maxlength">NOTE IS TOO LARGE</label>
      </div>

      <textarea placeholder="Write Note here" class="form-control" name="note" ng-model="note"
                ng-maxlength="250"></textarea>
    </div>
    <div>
      <label class="control checkbox pull-left" style="margin-top: 2px;width: auto;">
        <input type="checkbox" ng-model="invoiceToReceive.isSendNotification">
        <span class="control-indicator"></span>
      </label>
      <div class="checkbox-caption">Email Credit receipt</div>
    </div>
    <div class="row">
      <div class="col-md-12" style="padding: 0;">
        <div class="btn btn-success"
             ng-click="receivePayment()">
          Save Credit
        </div>
        <div class="btn btn-default" ng-click="close()">
          Cancel
        </div>
      </div>
    </div>
  </div>
</div>
