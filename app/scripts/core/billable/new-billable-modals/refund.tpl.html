<div class="create-note-modal refund-modal">
  <div class="modal-header clearfix">
    <a href="javascript:void(0)"
       style="position: absolute;right: 30px;top: 30px;"
       ng-click="close()"
       data-dismiss="modal"
       aria-label="Close">
      <i class="icn-sm icn-remove-old"></i>
    </a>
    <h4 class="modal-title">Refund</h4>
  </div>
  <div class="note-modal-content clearfix">
    <p>You can refund the payment, or create a credit note</p>
    <div class="col-md-6">Amount Paid</div>
    <div class="col-md-6 text-right">
      <strong>${{ paymentAmount }}</strong>
    </div>
    <div class="col-md-6">Paid by</div>
    <div class="col-md-6 text-right">
      <strong>Credit Card</strong>
    </div>
    <div class="col-md-6">Refund Amount</div>
    <div class="col-md-6 text-right">
      <strong class="alyosha-strong">${{ paymentAmount }}</strong>
    </div>
    <div class="form-group note"
         ng-class="{'has-error': isShowingErrors(paymentRecieveForm, 'note')}">

      <label class="control-label" ng-class="{ 'hide': isShowingErrors(paymentRecieveForm, 'note')}">
        Note
      </label>

      <div ng-messages="paymentRecieveForm.note.$error"
           ng-class="{ 'hide': !isShowingErrors(paymentRecieveForm, 'note')}">
        <label class="control-label" ng-message="maxlength">NOTE IS TOO LARGE</label>
      </div>

      <textarea placeholder="Write Note here" class="form-control" name="note" ng-model="note"
                ng-maxlength="250"></textarea>
    </div>
    <div class="form-group" style="margin-bottom: 25px;">
      <label class="control-label">Refund Mode</label>
      <div uib-dropdown style="position: relative;">
        <input class="form-control has-dropdown readonly-normal" type="text" READONLY
               uib-dropdown-toggle aria-expanded="true" ng-model="paymentMethods[paymentMethod]">
        <i class="icn-sm report-caret-icon pointer" style="top: 16px;right: 16px;"></i>

        <ul class="dropdown-menu">
          <li ng-repeat="(value, label) in paymentMethods"
              ng-click="setPaymentMethod(value)">
            <a tabindex="-1" href="javascript:void(0)"> {{ label }} </a>
          </li>
        </ul>

      </div>
    </div>
    <div>
      <label class="control checkbox pull-left" style="margin-top: 2px;width: auto;">
        <input type="checkbox" ng-model="isSendNotification">
        <span class="control-indicator"></span>
      </label>
      <div class="checkbox-caption">Email Refund receipt</div>
    </div>
    <div class="row">
      <div class="col-md-12" style="padding: 0;">
        <div class="btn btn-primary"
             ng-click="refundPayment()">
          Refund Payment
        </div>
        <div class="btn btn-default" ng-click="close()">
          Cancel
        </div>
      </div>
    </div>
  </div>
</div>
