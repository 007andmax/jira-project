<div class="deposit-split">
  <div class="product-list-ticket product-list-ticket-deposit">
    <ul>
      <li class="top-product-list-ticket top-product-list-ticket-deposit clearfix">
        <div class="col-md-1"><strong>Date</strong></div>
        <div class="col-md-1"><strong>Number</strong></div>
        <div class="col-md-3"><strong>Note</strong></div>
        <div class="col-md-2"><strong>Type</strong></div>
        <div class="col-md-2" style="text-align: right"><strong>Total Amount</strong></div>
      </li>
      <li class="content-product-list-ticket clearfix" style="position: relative;" ng-repeat="slip in depositSlips"
          ng-init="payments = slip.payments" event-toggle-slider="{{ 'toggleDepositSlip-' + slip.id }}">
        <div ng-click="toggleDeposit(slip.id)" style="width: 97%" class="clickable-layer"></div>
        <div class="col-md-1">{{ parseDate(slip.createdAt) | date: 'dd.MM.yy' }}</div>
        <div class="col-md-1">{{ slip.number }}</div>
        <div class="col-md-3">{{slip.note}}</div>
        <div class="col-md-2"><span class="payment-type">{{parseType(slip.type)}}</span></div>
        <div class="col-md-2" style="text-align: right">{{slip.totalSum | currency: '$': 2 }}</div>
        <a class="deposit-printer" href="/payments/deposits/print?depositId={{slip.id}}" target="_blank"
           uib-tooltip="print" tooltip-placement="top"></a>
        <div class="sub-wrapper" ets-slider>
          <div ng-include="'/html/scripts/core/billable/payments/payments-list.tpl.html'"></div>
        </div>
      </li>
    </ul>
    <!--<div class="product-report-total-sales clearfix">-->
    <!--<p><strong>Total Deposit: <span>$22664.94</span></strong></p>-->
    <!--</div>-->
  </div>
</div>
