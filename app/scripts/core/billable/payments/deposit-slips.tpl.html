<div class="deposit-split">
  <div class="product-list-ticket product-list-ticket-deposit">
    <div class="header-product-list-ticket">
      <!--<h3>Company Name</h3>-->
      <h3>Deposit Slip</h3>
      <!--<h3><span>jan 1,2017</span> to <span>jan 31, 2017</span></h3>-->
    </div>
    <ul>
      <li class="top-product-list-ticket top-product-list-ticket-deposit clearfix">
        <div class="col-md-3"><strong>Date</strong><i class="icn-sm icn-caret-gray"></i></div>
        <div class="col-md-3"><strong>Note</strong></div>
        <div class="col-md-1"><strong>Type</strong><i class="icn-sm icn-caret-gray"></i></div>
        <div class="col-md-2"><strong>Total</strong></div>
      </li>
      <li class="content-product-list-ticket clearfix" ng-repeat="slip in depositSlips">
        <div class="col-md-3">{{slip.createdAt }}</div>
        <div class="col-md-3">{{slip.note}}</div>
        <div class="col-md-1">{{slip.type}}</div>
        <div class="col-md-2">{{slip.totalSum | currency: '$': 2 }}</div>
      </li>
    </ul>
    <!--<div class="product-report-total-sales clearfix">-->
      <!--<p><strong>Total Deposit: <span>$22664.94</span></strong></p>-->
    <!--</div>-->
  </div>
</div>
