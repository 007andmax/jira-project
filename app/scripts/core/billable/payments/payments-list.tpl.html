<div class="deposit-create">
  <h3 class="report-title">Deposit Slips</h3>
  <div class="product-list-ticket clearfix">
    <ul>
      <li class="top-product-list-ticket top-product-list-ticket-deposit clearfix">
        <div class="col-md-1" ng-click="changeOrder('createdAt')"><strong>Date</strong><i class="icn-sm icn-caret-gray"></i></div>
        <div class="col-md-3" ng-click="changeOrder('clientCompanyName')"><strong>Company</strong><i class="icn-sm icn-caret-gray"></i></div>
        <div class="col-md-1" ng-click="changeOrder('invoiceNumbers')"><strong>Invoice</strong><i class="icn-sm icn-caret-gray"></i></div>
        <div class="col-md-3"><strong>Note</strong></div>
        <div class="col-md-2" ng-click="changeOrder('paymentMethod')"><strong>Type</strong><i class="icn-sm icn-caret-gray"></i></div>
        <!--<div class="col-md-2"><strong>Status</strong><i class="icn-sm icn-caret-gray"></i></div>-->
        <div class="col-md-2" style="text-align: right" ng-click="changeOrder('totalSum')"><strong>Total</strong></div>
      </li>
      <li class="content-product-list-ticket clearfix" ng-repeat = "payment in payments | orderBy: orderType">
        <div class="col-md-1">
          <label class="control checkbox pull-left ng-scope">
            <input type="checkbox" ng-model="idDictionary[payment.id]">
            <span class="control-indicator"></span>
          </label>
          {{ parseDate(payment.createdAt) | date: 'dd.MM.yy' }}</div>
        <div class="col-md-3">{{payment.clientCompanyName}}</div>
        <div class="col-md-1 ellipsis"><div ng-repeat="invoice in payment.invoiceNumbers">{{invoice}} </div></div>
        <div class="col-md-3">{{payment.note}}</div>
        <div class="col-md-2">{{payment.paymentMethod}}</div>
        <!--<div class="col-md-2"> -status-</div>-->
        <div class="col-md-2" style="text-align: right">{{payment.totalSum | currency: '$': 2 }}</div>
      </li>
    </ul>
    <button ng-click="openDepositModal()" class="btn btn-primary">Create Deposit Slip</button>
  </div>
</div>
