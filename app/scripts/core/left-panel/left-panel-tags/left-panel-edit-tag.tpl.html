<form name="editTagForm">
  <div class="label-edit">
    <div class="label-heading" ng-class="{'has-error': isShowingErrors(editTagForm, 'editTagName')}">

      <div ng-messages="editTagForm.editTagName.$error"
           ng-show="isShowingErrors(editTagForm, 'editTagName')">
        <div class="control-label" ng-message="required">Label name is required.</div>
        <div class="control-label" ng-message="unique">Label name already occupied.</div>
        <div class="control-label" ng-message="maxlength">Label name is too large.</div>
        <div class="control-label" ng-message="minlength">Label name is too short.</div>
      </div>

      <div class="color{{ editTag.color }} tag-color tag-color-lg"></div>

      <input type="text" class="form-control-edit" placeholder="Name"
             ng-model="editTag.name" name="editTagName" ng-required="true"
             ng-minlength="3" ng-maxlength="16"
             is-uniq-validation validation-func="validateTagName">
    </div>

    <ul class="indctr-list clearfix">

      <li ng-repeat="tagColor in tagColors"
          ng-class="{'last': ($index === 4 || $index === 9), 'active': editTag.color === $index }"
          ng-click="editTag.color = $index">

        <i class="color{{ $index }} tag-color tag-color-md"></i>
      </li>
    </ul>

    <div class="label-actions clearfix">

      <a href="javascript:void(0)" class="hit-area pull-left has-tooltip"
         ng-show="editTag.id" ng-click="deleteTag(editTagForm)"
         tooltip-placement="top" tooltip="delete label">
        <i class="icn-sm icn-label-delete"></i>
      </a>

      <div class="pull-right">

        <a href="javascript:void(0)" class="hit-area ha-18-16 pull-right has-tooltip"
           ng-click="saveTag(editTagForm)"
           tooltip-placement="top" tooltip="save" tooltip-append-to-body="true">
          <i class="icn-sm icn-label-save"></i>
        </a>

        <a href="javascript:void(0)" class="hit-area ha-14-16 pull-right has-tooltip"
           ng-click="openEditTagForm()"
           tooltip-placement="top" tooltip="cancel">
          <i class="icn-sm icn-label-cancel"></i>
        </a>

      </div>
    </div>
  </div>
</form>
