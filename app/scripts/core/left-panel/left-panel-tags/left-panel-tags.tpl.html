<div>

  <div class="clearfix divider"></div>
  <div class="nav-title" style="width: 100%;cursor: pointer;padding-bottom: 32px;"
       ng-class="{'collapsed-nav': collapseItem === 'LABELS'}"
       ng-click="toogleCollapse('LABELS')">
    labels
  </div>

  <nav class="clearfix label-nav" ng-class="{'collapsed-nav': collapseItem === 'LABELS'}">

    <ul class="nav" collapse="collapseItem !== 'LABELS'" style="width: 100%;">
      <li ng-repeat="tag in tags" ng-class="{'edit': tag.id === editTagId}">
        <a href="javascript:void(0)" ng-if="tag.id !== editTagId">

          <i class="tag-color tag-color-lg color{{ tag.color }}"></i> {{ tag.name }}

          <i class="icn-md icn-edit-tag has-tooltip" ng-click="openEditTagForm(tag.id)"
             tooltip-placement="top" tooltip="edit label"></i>

          <span class="badge badge-gray">{{ tagsCount[tag.id] }}</span>
        </a>

        <div ng-if="tag.id === editTagId"
             ng-controller="quicktech.core.leftPanel.leftPanelEditTagCtrl"
             ng-include="'/html/scripts/core/left-panel/left-panel-tags/left-panel-edit-tag.tpl.html'"></div>

      </li>

      <li class="edit">

        <div ng-if="editTagId === 'CREATE_TAG'"
             ng-controller="quicktech.core.leftPanel.leftPanelEditTagCtrl"
             ng-include="'/html/scripts/core/left-panel/left-panel-tags/left-panel-edit-tag.tpl.html'"></div>

        <a href="javascript:void(0)" ng-click="openEditTagForm('CREATE_TAG')"
           ng-hide="editTagId === 'CREATE_TAG'">
          <i class="icn-md pull-left icn-add-new"></i> Create Label
        </a>
      </li>
    </ul>

  </nav>
</div>
