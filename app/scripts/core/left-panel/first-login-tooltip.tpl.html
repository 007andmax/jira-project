<div ng-init="initCompanyStatusWatch(hidePopover)">
  <div class="pull-right" ng-click="hidePopover(changeCompanyStatusToActive())"
       style="cursor: pointer;"><i class="icn-sm icn-remove-old"></i></div>
  <div>
    <span ng-init="currentCompany.status === 'SIGN_UP' && forceShowPopover()" style="white-space: pre;">
      If you want to work with invoices, <br>please, go to the settings page and <br>enter the company's address.
    </span>
  </div>
</div>
