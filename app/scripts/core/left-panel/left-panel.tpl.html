<div ng-controller="quicktech.core.leftPanel.leftPanelCtrl">
  <div class="left-panel">
    <div class="left-panel-head"></div>

    <div class="left-panel__category" ng-class="{'active': openedCategory === 'dashboard'}"
         ng-click="toggleLeftPanel('dashboard')">
      <i class="nav-icon icn-lg icn-unassigned"></i>
    </div>
    <div class="left-panel__category" ng-class="{'active': openedCategory === 'tickets'}"
         ng-click="toggleLeftPanel('tickets')">
      <i class="nav-icon icn-lg icn-tickets"></i>
    </div>
    <div class="left-panel__category" ng-class="{'active': openedCategory === 'clients'}"
         ng-click="toggleLeftPanel('clients')">
      <i class="nav-icon icn-lg icn-companies"></i>
    </div>
    <div class="left-panel__category" ng-class="{'active': openedCategory === 'accounting'}"
         ng-click="toggleLeftPanel('accounting')" ng-if="PermissionsService.isAllowed('VIEW_ACCOUNTING')">
      <i class="nav-icon icn-billable icn-lg"></i>
    </div>
    <div class="left-panel__category" ng-class="{'active': openedCategory === 'products'}"
         ng-click="toggleLeftPanel('products')">
      <i class="nav-icon icn-products icn-lg"></i>
    </div>
  </div>
  <div class="left-panel-full" ng-if="!isLeftPanelHidden">
    <div class="left-panel-full-wrapper" ng-if="openedCategory === 'dashboard' && !isLeftPanelHidden">
      <div class="left-panel-full__head">
        <span class="left-panel-full__head--header">My Dashboard</span>
      </div>
      <div class="center-category collapsed-nav">
        <div class="center-category__category" ng-if="PermissionsService.isAllowed('ALLOW_QUICK_CONNECT')"
             ng-click="stateGo($event, 'quickSupport');">
          <div class="btn btn-success add-session-button has-tooltip fu" style="top: 11px" ng-click="addQuickSession()"
               tooltip-placement="top" tooltip="Create">
            <i class="icn-sm icn-plus"></i>
          </div>
          Quick Support
        </div>
      </div>
    </div>
    <div class="left-panel-full-wrapper" ng-if="openedCategory === 'tickets' && !isLeftPanelHidden">
      <div class="left-panel-full__head">
        <span class="left-panel-full__head--header">Tickets</span>
      </div>
      <div class="center-category collapsed-nav">
        <div class="center-category__category"
             ng-class="{active: $state.includes('tickets', {listType: 'all'})}"
             ng-click="stateGo($event, 'tickets', {listType: 'all'})">
          <i class="nav-icon icn-lg icn-tickets fu"></i> All Tickets
        </div>
        <div class="center-category__category"
             ng-class="{active: $state.includes('tickets', {listType: 'unassigned'})}"
             ng-click="stateGo($event, 'tickets', {listType: 'unassigned'})">
          <i class="nav-icon icn-lg icn-unassigned fu"></i> Unassigned
        </div>
        <div class="center-category__category"
             ng-class="{active: $state.includes('tickets', {listType: 'user'})}"
             ng-click="stateGo($event, 'tickets', {listType: 'user'})">
          <i class="nav-icon icn-lg icn-user-lg fu"></i> My Tickets
        </div>
        <div class="center-category__category"
             ng-class="{active: $state.includes('tickets', {listType: 'shared'})}"
             ng-click="stateGo($event, 'tickets', {listType: 'shared'})">
          <i class="nav-icon icn-lg icn-shared fu"></i> Shared
        </div>
        <div class="center-category__category"
             ng-class="{active: $state.includes('tickets', {listType: 'open'})}"
             ng-click="stateGo($event, 'tickets', {listType: 'open'})">
          <i class="nav-icon icn-lg icn-open fu"></i> Open
        </div>
        <div class="center-category__category"
             ng-class="{active: $state.includes('tickets', {listType: 'closed'})}"
             ng-click="stateGo($event, 'tickets', {listType: 'closed'})">
          <i class="nav-icon icn-lg icn-closed fu"></i> Closed
        </div>
        <div class="center-category__category"
             ng-class="{active: $state.includes('tickets', {listType: 'trash'})}"
             ng-click="stateGo($event, 'tickets', {listType: 'trash'})">
          <i class="nav-icon icn-lg icn-trash fu"></i> Trash
        </div>
        <div class="center-category__category"
             ng-class="{active: $state.includes('tickets', {listType: 'spam'})}"
             ng-click="stateGo($event, 'tickets', {listType: 'spam'})">
          <i class="nav-icon icn-lg icn-spam fu"></i> Spam
        </div>
      </div>
    </div>
    <div class="left-panel-full-wrapper" ng-if="openedCategory === 'clients' && !isLeftPanelHidden">
      <div class="left-panel-full__head">
        <span class="left-panel-full__head--header">Clients</span>
      </div>
      <div class="center-category collapsed-nav">
        <div class="center-category__category" ng-if="PermissionsService.isAllowed('VIEW_COMPANIES')"
             ng-class="{active: $state.includes('companies')}"
             ng-click="stateGo($event, 'companies')">
          <i class="nav-icon icn-lg icn-companies fu"></i> Companies
        </div>
        <div class="center-category__category" ng-if="PermissionsService.isAllowed('VIEW_USERS')"
             ng-class="{active: $state.includes('users')}"
             ng-click="stateGo($event, 'users')">
          <i class="nav-icon icn-lg icn-users fu"></i> Users
        </div>
        <!--<div class="center-category__category">-->
        <!--<i class="nav-icon icn-lg icn-leads fu"></i> Leads-->
        <!--</div>-->
      </div>
    </div>
    <div class="left-panel-full-wrapper" ng-if="openedCategory === 'accounting' && !isLeftPanelHidden">
      <div class="left-panel-full__head">
        <span class="left-panel-full__head--header">Billing</span>
      </div>
      <div class="center-category collapsed-nav">
        <div class="center-category__category"
             ng-class="{active: $state.includes('accounting')}"
             ng-click="stateGo($event, 'accounting')">
          <i class="nav-icon icn-billable icn-lg fu"></i> Billiable
        </div>
        <div class="center-category__category"
             ng-class="{active: $state.includes('receivable')}"
             ng-click="stateGo($event, 'receivable', {mode: 'group-by-company'})">
          <i class="nav-icon icn-lg icn-receivable fu"></i> Receivable
        </div>
        <div class="center-category__category"
             ng-class="{active: $state.includes('receipt-archive')}"
             ng-click="stateGo($event, 'receipt-archive', {mode: 'group-by-company'})">
          <i class="nav-icon icn-lg icn-receipt-archive fu"></i> Receipt Archive
        </div>
      </div>
    </div>
    <div class="left-panel-full-wrapper" ng-if="openedCategory === 'products' && !isLeftPanelHidden">
      <div class="left-panel-full__head">
        <span class="left-panel-full__head--header">Product</span>
      </div>
      <div class="center-category collapsed-nav">
        <div class="center-category__category"
             ng-class="{active: $state.includes('vendors')}"
             ng-click="stateGo($event, 'vendors')">
          <i class="nav-icon icn-vendors icn-lg fu"></i> Vendors
        </div>
        <div class="center-category__category" ng-if="PermissionsService.isAllowed('MANAGE_PRODUCTS')"
             ng-class="{active: $state.includes('products')}"
             ng-click="stateGo($event, 'products', { tabName: 'category' })">
          <i class="nav-icon icn-lg icn-products fu"></i> Products
        </div>
        <div class="center-category__category" ng-if="PermissionsService.isAllowed('MANAGE_SERVICES')"
             ng-class="{active: $state.includes('services')}"
             ng-click="stateGo($event, 'services')">
          <i class="nav-icon icn-lg icn-services fu"></i> Services
        </div>
      </div>
    </div>
  </div>
</div>
