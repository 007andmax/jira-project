<div class="error-delete-role" ng-controller="quicktech.core.settings.permissionsManagementCtrl">
  <div class="close-btn btn" ng-click="closeModal()" tabindex="1">
    <i class="icn-sm icn-remove-old"></i>
  </div>
  <h3>There tech users belong to this group, you must assign a different group to existing users to delete the group.</h3>

  <div class="change-users-role" ng-repeat="user in usersToShift">
    <p>{{ user.firstName + ' ' + user.lastName }}</p>

    <div uib-dropdown style="max-width: 150px;">

      <input type="text"class="form-control has-dropdown form-control-dropdown dropdown-toggle no-cursor"
             ng-model="user.techRole" uib-dropdown-toggle aria-expanded="true" READONLY>
      <i class="icn-sm icn-caret-gray"></i>

      <ul class="dropdown-menu dropdown-account-type">
        <li ng-repeat="role in allTechRoles" ng-click="user.techRole = role; changeUsersRole(user)">
          <a tabindex="-1" href="javascript:void(0)"> {{ role }} </a>
        </li>
      </ul>

    </div>
  </div>


  <div class="form-row clearfix" style="padding: 0 15px;">

    <div class="btn btn-success pull-right"
         custom-disabled="{{ allRolesAreChanged(roleToDelete) }}"
         ng-click="deleteRole(roleToDelete, true); closeModal()">
      Remove
    </div>

    <div class="btn btn-primary pull-right" style="margin-right: 10px"
         ng-click="closeModal()">
      Cancel
    </div>

  </div>




</div>
