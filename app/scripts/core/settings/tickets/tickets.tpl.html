<div class="settings-main-wrapper" ng-form="invoiceAndTicketForm">
  <div class="ticket-and-invoice-wrapper">

    <h3>Ticket Settings</h3>

    <div class="template-form-wrapper" ticket-config>
      <div class="form-row clearfix">
        <div class="form-group full-width"
             ng-class="{'has-error': isShowingErrors(invoiceAndTicketForm, 'ticketCount')}">

          <label class="control-label" ng-class="{ 'hide': isShowingErrors(invoiceAndTicketForm, 'ticketCount')}">
            Starting ticket number
          </label>

          <div ng-messages="invoiceAndTicketForm.ticketCount.$error"
               ng-class="{ 'hide': !isShowingErrors(invoiceAndTicketForm, 'ticketCount')}">
            <label class="control-label" ng-message="required" for="">cannot be left empty</label>
            <label class="control-label" ng-message="maxlength" for="">too large</label>
            <label class="control-label" ng-message="minlength" for="">too short</label>
            <label class="control-label" ng-message="pattern" for="">Please enter a valid number starts.</label>
            <label class="control-label" ng-message="used">
              Already used. Next free is
              <span class="free-number-link" ng-click="saveTicketNumber(ticketConfig)">
                {{ ticketConfig.nextValid }}</span>.
            </label>
          </div>

          <input class="form-control" tc-number-input type="text" ng-model="ticketConfig.count"
                 name="ticketCount" aria-expanded="true" make-dirty-on-blur ng-pattern="numberPattern"
                 hard-reset-required="true" ng-minlength="1" ng-maxlength="7" hard-reset-pattern="numberPattern">
        </div>
      </div>
    </div>


    <h3>Invoice Settings</h3>

    <div class="template-form-wrapper" invoice-config>
      <div class="template-form-wrapper">
        <div class="form-row clearfix">
          <div class="form-group"
               ng-class="{'has-error': isShowingErrors(invoiceAndTicketForm, 'invoiceCount')}">

            <label class="control-label" ng-class="{ 'hide': isShowingErrors(invoiceAndTicketForm, 'invoiceCount')}">
              Starting invoice number
            </label>

            <div ng-messages="invoiceAndTicketForm.invoiceCount.$error"
                 ng-class="{ 'hide': !isShowingErrors(invoiceAndTicketForm, 'invoiceCount')}">
              <label class="control-label" ng-message="required">cannot be left empty.</label>
              <label class="control-label" ng-message="maxlength">too large</label>
              <label class="control-label" ng-message="minlength">too short</label>
              <label class="control-label" ng-message="pattern">Please enter a valid number starts.</label>
              <label class="control-label" ng-message="used">
                Already used. Next free is
                <span class="free-number-link" ng-click="saveInvoiceNumber(invoiceConfig)">
                {{ invoiceConfig.nextValid }}</span>.
              </label>
            </div>

            <input class="form-control" type="text" ic-number-input ng-model="invoiceConfig.count"
                   name="invoiceCount" aria-expanded="true" make-dirty-on-blur ng-pattern="numberPattern"
                   hard-reset-required="true" ng-minlength="1" ng-maxlength="7" hard-reset-pattern="numberPattern">
          </div>

          <div class="form-group"
               ng-class="{'has-error': isShowingErrors(invoiceAndTicketForm, 'invoiceTerms')}">

            <label class="control-label" style="white-space: nowrap;" ng-class="{ 'hide': isShowingErrors(invoiceAndTicketForm, 'invoiceTerms')}">
              Default invoice terms
            </label>

            <div ng-messages="invoiceAndTicketForm.invoiceTerms.$error"
                 ng-class="{ 'hide': !isShowingErrors(invoiceAndTicketForm, 'invoiceTerms')}">
              <label class="control-label" ng-message="required" for="">cannot be left empty.</label>
              <label class="control-label" ng-message="maxlength" for="">too large</label>
              <label class="control-label" ng-message="minlength" for="">too short</label>
              <label class="control-label" ng-message="pattern" for="">Please enter a valid Terms.</label>
            </div>

            <input class="form-control default-invoice-terms" type="text" ic-terms-input ng-model="invoiceConfig.term"
                   name="invoiceTerms" aria-expanded="true" make-dirty-on-blur ng-pattern="numberPattern"
                   hard-reset-required="true" ng-minlength="1" ng-maxlength="3" hard-reset-pattern="numberPattern">

            <span class="days">days</span>
          </div>
        </div>
      </div>

      <h3>Reference Date</h3>

      <div class="template-form-wrapper">

        <div class="form-row clearfix">
          <div class="form-group" ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceData')}">

              <input type="text" class="form-control has-dropdown pointer" placeholder="Date"
                     qt-data-time-picker max-date="maxServiceDate" ng-model="referenceDate"
                     name="referenceDate" ng-required="true" uib-tooltip="select date">
              <div>
                <i class="report-calendar"></i>
              </div>

          </div>


          <div class="form-group">
            <button ng-click="resetReferenceDate()">Reset date</button>
          </div>

        </div>


      </div>


      <h3>Tax Number</h3>
      <div class="template-form-wrapper">
        <div class="form-row clearfix">
          <div class="form-group">

            <label class="control-label">
              Tax ID description
            </label>

            <input class="form-control" type="text" ng-model="taxIdData.taxIdDescription"
                   name="taxIdDescription" aria-expanded="true" make-dirty-on-blur
                   hard-reset-required="true" ng-minlength="1" ng-maxlength="15"
                   execute-when-outfocused="changeTaxIdData()" hard-reset-pattern="taxIdDescriptionPattern">
          </div>

          <div class="form-group">
            <label class="control-label">
              Tax ID
            </label>

            <input class="form-control" type="text" ng-model="taxIdData.taxId"
                   name="taxId" aria-expanded="true" make-dirty-on-blur
                   hard-reset-required="true" ng-minlength="1" ng-maxlength="15"
                   hard-reset-pattern="taxIdPattern" execute-when-outfocused="changeTaxIdData()">
          </div>
        </div>
      </div>

      <div class="ar-department" ng-controller="quicktech.core.settings.invoiceContactCtrl">
        <div class="create-user-container">

          <div class="create-user-header clearfix">
            <h3 class="pull-left">Invoice Contact</h3>
          </div>
          <div class="create-user-form" ng-form="invoiceContactForm">

            <div class="form-row clearfix">
              <div class="form-group full-width">
                <div class="clearfix">
                  <label class="control checkbox pull-left">
                    <input type="checkbox" ng-model="invoiceContact.enabled"
                           ng-change="toggleInvoiceContact(invoiceContact.enabled)">
                    <span class="control-indicator"></span> enables to set primary invoice contacts
                  </label>
                </div>
              </div>
            </div>

            <div class="form-row clearfix">

              <div class="form-group" ng-class="{'has-error': isShowingErrors(invoiceContactForm, 'firstName')}">

                <label class="control-label" ng-class="{'hide': isShowingErrors(invoiceContactForm, 'firstName')}">
                  First Name
                </label>

                <div ng-messages="invoiceContactForm.firstName.$error"
                     ng-class="{'hide': !isShowingErrors(invoiceContactForm, 'firstName')}">
                  <label class="control-label" ng-message="minlength">First name is too small.</label>
                  <label class="control-label" ng-message="maxlength">First name is too large.</label>
                </div>

                <input type="text" class="form-control" aria-expanded="true" ng-minlength="2" ng-maxlength="15"
                       name="firstName" ng-model="invoiceContact.firstName" make-dirty-on-blur
                       ng-disabled="!invoiceContact.enabled"
                       execute-when-outfocused="saveInvoiceContact(invoiceContactForm)">
              </div>

              <div class="form-group" ng-class="{'has-error': isShowingErrors(invoiceContactForm, 'lastName')}">

                <label class="control-label" ng-class="{'hide': isShowingErrors(invoiceContactForm, 'lastName')}">
                  Last Name
                </label>

                <div ng-messages="invoiceContactForm.lastName.$error"
                     ng-class="{'hide': !isShowingErrors(invoiceContactForm, 'lastName')}">
                  <label class="control-label" ng-message="maxlength">Last name is too large.</label>
                </div>

                <input type="text" class="form-control" ng-maxlength="15"
                       ng-disabled="!invoiceContact.enabled"
                       name="lastName" ng-model="invoiceContact.lastName" make-dirty-on-blur
                       execute-when-outfocused="saveInvoiceContact(invoiceContactForm)">
              </div>
            </div>

            <div class="form-row clearfix">

              <div class="form-group" ng-class="{'has-error': isShowingErrors(invoiceContactForm, 'designation')}">

                <label class="control-label" ng-class="{'hide': isShowingErrors(invoiceContactForm, 'designation')}">
                  Designation
                </label>

                <div ng-messages="invoiceContactForm.designation.$error"
                     ng-class="{'hide': !isShowingErrors(invoiceContactForm, 'designation')}">
                  <label class="control-label" ng-message="maxlength">Designation is too large</label>
                  <label class="control-label" ng-message="minlength">Designation is too short</label>
                </div>

                <input type="text" class="form-control" name="designation" make-dirty-on-blur
                       ng-model="invoiceContact.designation" ng-minlength="3" ng-maxlength="30"
                       ng-disabled="!invoiceContact.enabled"
                       execute-when-outfocused="saveInvoiceContact(invoiceContactForm)">
              </div>

              <div class="form-group" ng-class="{'has-error': isShowingErrors(invoiceContactForm, 'email')}">

                <label class="control-label" ng-class="{'hide': isShowingErrors(invoiceContactForm, 'email')}">
                  Email
                </label>

                <div ng-messages="invoiceContactForm.email.$error"
                     ng-class="{'hide': !isShowingErrors(invoiceContactForm, 'email')}">
                  <label class="control-label" ng-message="pattern">Please enter a valid email address.</label>
                </div>

                <input type="text" class="form-control" name="email" make-dirty-on-blur
                       ng-model="invoiceContact.email" ng-pattern="emailPattern"
                       ng-disabled="!invoiceContact.enabled"
                       execute-when-outfocused="saveInvoiceContact(invoiceContactForm)">
              </div>

            </div>

            <div class="form-row clearfix" phone-numbers-edit ng-model="invoiceContact.phoneNumbers"
                 is-try-to-save="isTryToSave" country-code="{{ companyForSettingPage.addresses[0].countryCode }}"
                 disabled="{{ !invoiceContact.enabled }}"
                 on-lost-focus="saveInvoiceContact"></div>
          </div>
        </div>
      </div>

      <div class="form-row clearfix">

        <div class="form-group full-width"
             ng-class="{'has-error': isShowingErrors(invoiceAndTicketForm, 'invoiceConditions')}">

          <label class="control-label"
                 ng-class="{ 'hide': isShowingErrors(invoiceAndTicketForm, 'invoiceConditions')}">
            Memo of invoice
          </label>

          <div ng-messages="invoiceAndTicketForm.invoiceConditions.$error"
               ng-class="{ 'hide': !isShowingErrors(invoiceAndTicketForm, 'invoiceConditions')}">
            <label class="control-label" ng-message="required" for="">Memo field cannot be left
              empty.</label>
          </div>

          <textarea class="form-control" ic-conditions-input ng-model="invoiceConfig.termsAndConditions"
                    name="invoiceConditions" aria-expanded="true" make-dirty-on-blur
                    maxlength="400" ng-trim="false"></textarea>

          <div class="word-count">{{ 400 - invoiceConfig.termsAndConditions.length }}</div>
        </div>
      </div>

      <div class="form-row clearfix">
        <div class="form-group no-label full-width">
          <div qt-popover-position="bottom-left-align" custom-disabled="{{ !isCurrentCompanyAddressEmpty }}"
               qt-custom-popover-template="/html/scripts/common/templates/company-has-no-address-popover.tpl.html"
               style="display: inline-block;">
            <div qt-popover-trigger="mouseenter" style="display: inline-block">
              <div class="btn btn-lg btn-primary pull-right"
                   custom-disabled="{{ isCurrentCompanyAddressEmpty || isCurrentCompanyAddressEmpty === undefined }}"
                   modal-window-button="/html/scripts/core/billable/create-invoice.tpl.html"
                   modal-window-class="invoice-modal-not-background"
                   mw-window-template-url="/html/scripts/core/billable/create-invoice-modal.tpl.html"
                   mw-controller="quicktech.core.settings.invoicePreviewCtrl">
                Preview Invoice
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
