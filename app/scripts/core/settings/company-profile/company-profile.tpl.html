<div class="settings-main-wrapper">
  <div class="help-text">Manage your company's information, enter support &amp; business email addresses, and set weekly
    schedule. Here, you can set when to notify agents, users, and vendors via email.
  </div>

  <div class="basic-info-wrapper"
       id="companyInfoBasicInfo">

    <div class="create-new-user settings-basic-info clearfix"
         ng-if="companyForSettingLoad"
         ng-controller="quicktech.core.settings.companyInfoBasicInfoCtrl">
      <form name="basicInfoForm">

        <div class="create-user-container">

          <div class="create-user-header clearfix">
            <h3 class="pull-left">Basic Info</h3>
          </div>

          <div class="tech-company-logo" edit-avatar model="editCompany" model-name="techCompany"></div>

          <div class="create-user-form">
            <div class="form-row clearfix">

              <div class="form-group full-width"
                   ng-class="{'has-error': isShowingErrors(basicInfoForm, 'companyName')}">

                <label class="control-label" ng-class="{'hide': isShowingErrors(basicInfoForm, 'companyName')}">
                  Company Name
                </label>

                <div ng-messages="basicInfoForm.companyName.$error"
                     ng-class="{'hide': !isShowingErrors(basicInfoForm, 'companyName')}">
                  <label class="control-label" ng-message="required" for="">Company name is required.</label>
                  <label class="control-label" ng-message="maxlength" for="">Company name is too large.</label>
                  <label class="control-label" ng-message="minlength" for="">Company name is too short.</label>
                  <label class="control-label" ng-message="unique" for="">This company name already occupied.</label>
                </div>

                <input type="text" class="form-control" ng-model="editCompany.name" aria-expanded="true"
                       ng-minlength="2" ng-maxlength="40" name="companyName" required="true" make-dirty-on-blur
                       is-uniq-validation validation-func="validateCompanyName" model-id="editCompany.name"
                       execute-when-outfocused="saveBasicInfo(basicInfoForm)">

              </div>
            </div>

            <div class="form-row clearfix">

              <div class="form-group full-width">

                <label class="control-label">Company URL</label>

                <input class="form-control text-center" style="user-select: all" type="text" readonly
                       value="{{ companyForSettingPage.supportMailBox + '.' + currentUrl }}">
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="contact-info-wrapper" id="companyInfoContactInfo">
    <div class="create-new-user settings-basic-info clearfix"
         ng-if="companyForSettingLoad" ng-form="addressesWrapForm"
         ng-controller="quicktech.core.settings.companyInfoContactInfoCtrl">
      <div class="company-address-list" ng-repeat="address in companyForSettingPage.addresses">
        <div class="create-user-container">
          <div class="create-user-header clearfix">
            <h3 class="pull-left">Contact Info</h3>
          </div>

          <div>
            <div class="create-user-form">

              <div address-autocomplete template-page="settings" save-func="saveContactInfo"
                   is-address-required="isAddressRequired"
                   ng-model="address" show-validation-messages="isTryToSave" focus-address="isAddressFocused"></div>

              <div phone-numbers-edit ng-model="address.phoneNumbers" is-try-to-save="isTryToSave"
                   is-first-required="isFromWelcomeWizard"
                   country-code="{{address.countryCode}}" on-lost-focus="saveContactInfo"></div>

              <div class="form-row clearfix">
                <time-zone-autocomplete address="address" time-zones="timeZones"
                                        save-func="saveContactInfo"></time-zone-autocomplete>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="response-time-settings-wrapper" id="responseTimeSettings">
    <div ng-form="responseTimeSettingsForm" ng-controller="quicktech.core.settings.workingHoursCtrl">
      <div class="create-user-container">

        <div class="create-user-header clearfix">
          <h3 class="pull-left">Ticket Response Time Settings</h3>
        </div>

        <div class="create-user-form">

          <div class="form-row clearfix">

            <div class="form-group full-width out-time" style="width: 100%;"
                 ng-class="{'has-error': isShowingErrors(responseTimeSettingsForm, 'outliersTime')}">

              <label class="control-label" ng-hide="isShowingErrors(responseTimeSettingsForm, 'outliersTime')">
                Outliers Time
              </label>

              <div ng-messages="responseTimeSettingsForm.outliersTime.$error">
                <label class="control-label" ng-message="required">Outliers Time is required.</label>
                <label class="control-label" ng-message="min">Outliers Time must not be less than 1 hour.</label>
                <label class="control-label" ng-message="max">Outliers Time must not be greater than 120 hour.</label>
                <label class="control-label" ng-message="number">Outliers Time must be a number of hours.</label>
              </div>

              <input type="number" min="1" max="120" class="form-control" ng-model="outliersTime" name="outliersTime"
                     required execute-when-outfocused="saveTicketResponseTimeSettings(responseTimeSettingsForm)">

            </div>
          </div>

          <div class="row" ng-repeat="day in companyForSettingPage.responseTimeSettings.workingDays">

            <div class="form-row clearfix" ng-form="workingHoursForm">
              <div class="form-group">
                <label class="control-label" style="position: relative;top: -10px;" ng-if="$first">
                  Working Days
                </label>
                <div>
                  <label class="control checkbox pull-left">
                    <input type="checkbox" ng-model="day.isSelected"
                           ng-disabled="isLastEnabledDay(companyForSettingPage.responseTimeSettings.workingDays, day)"
                           ng-change="saveTicketResponseTimeSettings(responseTimeSettingsForm)">
                    <span class="control-indicator"></span>
                  </label>
                  <span style="text-transform: capitalize;">{{ day.dayOfWeek.toLowerCase() }}</span>
                </div>
              </div>

              <div class="form-group"
                   ng-class="{'has-error': isShowingErrors(workingHoursForm, 'workingHours' + day.dayOfWeek)}">

                <label class="control-label"
                       ng-if="$first && (workingHoursForm.$pristine || workingHoursForm.$valid)">
                  Working Hours
                </label>

                <div class="has-error" ng-if="$first && workingHoursForm.$dirty && workingHoursForm.$invalid">
                  <label class="control-label">
                    "from" must be less than "to".
                  </label>
                </div>

                <input type="text" class="form-control" placeholder="from 00:00 to 23:59"
                       name="workingHours{{ day.dayOfWeek }}"
                       format-working-hours from="day.startTime" to="day.endTime" ng-disabled="!day.isSelected"
                       ng-model="day.workingHours"
                       execute-when-outfocused="saveTicketResponseTimeSettings(responseTimeSettingsForm)">
              </div>
            </div>

          </div>
        </div>
      </div>

    </div>
  </div>

</div>
