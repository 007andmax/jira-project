<div class="settings-main-wrapper">
  <div  class="default-tax-wrapper clearfix"
       ng-controller="quicktech.core.settings.taxRatesCtrl">

    <div ng-form="taxRatesForm">
      <h3>Tax Rates</h3>

      <ul class="qt-list default-tax-list">

        <li class="list-heading" ng-show="taxRates.length > 0">
          <div class="col-1">TAX DESCRIPTION</div>
          <div class="col-2">TAX PERCENT</div>
        </li>

        <li class="tax-list" ng-repeat="tax in taxRates | orderBy: 'code'" ng-class="{'new-tax': isEditing}"
            ng-controller="quicktech.core.settings.taxRateCtrl"
            ng-form="editTaxRateForm">

          <div class="helping-additional-class" ng-class="{'hide': isEditing}">

            <div class="col-1">{{ tax.code }}</div>

            <div class="col-2">{{ tax.rate }}%</div>

            <a href="javascript:void(0)" class="ha-delete hit-area pull-right has-tooltip"
               ng-click="deleteTaxRate()"
               tooltip-placement="top" tooltip-append-to-body="true" tooltip="Delete">
              <i class="icn-sm icn-delete"></i>
            </a>

            <a href="javascript:void(0)" class="ha-edit hit-area has-tooltip"
               ng-click="editTaxRate(editTaxRateForm)"
               tooltip-placement="top" tooltip-append-to-body="true" tooltip="edit">
              <i class="icn-sm icn-edit"></i>
            </a>

          </div>

          <div class="helping-additional-class" ng-if="isEditing">

            <div class="col-1"
                 ng-class="{'has-error': isShowingErrors(editTaxRateForm, 'currentlyTaxType')}">

              <p ng-style="{ opacity: isShowingErrors(editTaxRateForm, 'currentlyTaxType') ? '0' : '1' }">Edit Tax
                Rate</p>

              <div ng-messages="editTaxRateForm.currentlyTaxType.$error"
                   style="position: absolute;margin-top: -19px;"
                   ng-class="{'hide': !isShowingErrors(editTaxRateForm, 'currentlyTaxType')}">

                <label class="control-label" ng-message="required">
                  TAX TYPE IS REQUIRED.
                </label>
                <label class="control-label" ng-message="maxlength">
                  TAX TYPE IS TOO LARGE.
                </label>
                <label class="control-label" ng-message="unique">
                  THIS TAX TYPE ALREADY OCCUPIED.
                </label>
              </div>

              <input type="text" class="form-control"
                     ng-model="tax.code" name="currentlyTaxType" required
                     is-uniq-validation validation-func="validateTaxRateCode" model-id="tax.versionedId.id"
                     ng-maxlength="32" placeholder="Tax Type">
            </div>

            <div class="col-1" ng-class="{'has-error': isShowingErrors(editTaxRateForm, 'currentlyTaxRate')}">
              <p>&nbsp;</p>

              <div ng-messages="editTaxRateForm.currentlyTaxRate.$error"
                   style="position: absolute;margin-top: -19px;"
                   ng-if="isShowingErrors(editTaxRateForm, 'currentlyTaxRate')">
                <label class="control-label" ng-message="required">
                  RATE IS REQUIRED.
                </label>
              </div>

              <input type="text" class="form-control" placeholder="Rate"
                     ng-model="tax.rate" name="currentlyTaxRate" hard-reset-required="true"
                     hard-reset-pattern="taxRateNumberPattern">

            </div>

            <div style="padding-top: 85px;">
              <div class="btn btn-lg btn-info pull-right"
                   ng-click="saveTax()"
                   custom-disabled="{{ editTaxRateForm.$invalid || editTaxRateForm.$pristine }}">
                Save
              </div>

              <div class="btn btn-lg btn-primary pull-right" style="margin-right: 10px;"
                   ng-click="cancelTax(editTaxRateForm)">Cancel
              </div>
            </div>
          </div>
        </li>

        <li class="new-tax" ng-form="newTaxRateForm">

          <div class="helping-additional-class">

            <div class="col-1" ng-class="{'has-error': isShowingErrors(newTaxRateForm, 'code')}">

              <!--<p ng-style="{'opacity': isShowingErrors(newTaxRateForm, 'code') ? 0 : 1}">New Tax Rate</p>-->

              <label class="control-label" ng-class="{'hide': isShowingErrors(newTaxRateForm, 'code')}">
                TAX DESCRIPTION
              </label>

              <div ng-messages="newTaxRateForm.code.$error"
                   ng-class="{'hide': !isShowingErrors(newTaxRateForm, 'code')}">

                <label class="control-label" ng-message="required">
                  TAX DESCRIPTION IS REQUIRED.
                </label>
                <label class="control-label" ng-message="maxlength">
                  TAX DESCRIPTION IS TOO LARGE.
                </label>
                <label class="control-label" ng-message="unique">
                  THIS DESCRIPTION TYPE ALREADY OCCUPIED.
                </label>
              </div>

              <input type="text" class="form-control" name="code"
                     ng-model="newTaxRate.code" ng-required="true" ng-maxlength="32"
                     ng-change="validateNewTaxRate(newTaxRateForm)" name="code">
            </div>

            <div class="col-1" ng-class="{'has-error': isShowingErrors(newTaxRateForm, 'rate')}">

              <p style="margin-bottom: 0">
                <label class="control-label" ng-class="{'hide': isShowingErrors(newTaxRateForm, 'rate')}">
                  TAX PERCENT
                </label>
              </p>

              <div ng-messages="newTaxRateForm.rate.$error"
                   ng-class="{'hide': !isShowingErrors(newTaxRateForm, 'rate')}">
                <label class="control-label" ng-message="required">TAX PERCENT IS REQUIRED.</label>
              </div>

              <input type="text" class="form-control" required
                     ng-model="newTaxRate.rate" name="rate"
                     hard-reset-pattern="taxRateNumberPattern" ng-maxlength="30">

              <span class="procent-rate">%</span>

            </div>
          </div>

        </li>

      </ul>

      <div class="btn btn-lg btn-info pull-right"
           ng-click="saveNewTax(newTaxRateForm)"
           custom-disabled="{{ newTaxRateForm.$invalid || newTaxRateForm.$pristine }}">
        Add
      </div>

    </div>
  </div>
</div>
