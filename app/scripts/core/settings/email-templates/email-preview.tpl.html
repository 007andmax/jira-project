<div class="email-preview-tpl" prevent-hash-change="close()" ng-show="data">
  <div class="email-preview-header">
    <div class="email-preview-close-btn pull-right" ng-click="close()"
         uib-tooltip="Close" tooltip-placement="bottom" append-to-body="true">
      <i class="icn-sm icn-remove-token"></i>
    </div>
  </div>

  <div class="email-preview-body">
    <div ng-bind-html="data"></div>
  </div>
</div>
