<div class="form-row clearfix" ng-form="addressForm" style="margin-bottom: 13px;">

  <div class="form-group zipcode-field"
       ng-class="{'has-error': isShowingErrors(addressForm, 'suiteNumber')}">

    <label class="control-label" ng-class="{'hide': isShowingErrors(addressForm, 'suiteNumber')}">
      Suite Number
    </label>

    <div ng-messages="addressForm.suiteNumber.$error"
         ng-class="{'hide': !isShowingErrors(addressForm, 'suiteNumber')}">
      <div style="padding-top: 4px;padding-bottom: 4px;" class="control-label" ng-message="maxlength">too large</div>
    </div>

    <input class="form-control" type="text" name="suiteNumber" autocomplete="off"
           ng-model="model.suiteNumber" ng-maxlength="20"
           execute-when-outfocused="saveFunc(addressForm)">
  </div>

  <div class="form-group address-field"
       ng-class="{'has-error': (addressForm.address.$dirty || showValidationMessages) && !addressForm.address.$valid}">

    <label class="control-label"
           ng-class="{'hide': (addressForm.address.$dirty || showValidationMessages) && !addressForm.address.$valid}">
      Mailing Address
    </label>

    <div ng-messages="addressForm.address.$error"
         ng-class="{'hide': !((addressForm.address.$dirty || showValidationMessages) && !addressForm.address.$valid)}">
      <label class="control-label" ng-message="required">Please enter the address.</label>
      <label class="control-label" ng-message="correct">Please select address from autocomplete.</label>
    </div>

    <input class="form-control pointer" type="text" ng-required="isAddressRequired"
           name="address" autocomplete="off" map-input focus-on="{{ focusAddress }}" delay="{{ focusAddress ? 500 : 0 }}"
           make-dirty-on-blur ng-model="model.address">
  </div>

  <div class="form-group zipcode-field">
    <label class="control-label">Zip</label>
    <input class="form-control" type="text" ng-model="model.postalCode"
           execute-when-outfocused="saveFunc(addressForm)" maxlength="15">
  </div>

  <div class="map-container">
    <div map style="width: 500px; height:110px; frameborder: 0; border:0"></div>
  </div>

</div>

  (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
    m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
  })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');

  ga('create', 'UA-93441341-1', 'auto');
  ga('send', 'pageview');

</script>
