<div class="modal ng-isolate-scope in preview-invoice"
     style="z-index: 110131; display: none;overflow-y: scroll;background-color: rgba(49, 57, 64, 0.74902);"
     id="create-invoice-modal-window">
  <div style="width: 1905px;">
    <div class="inv-modal">

      <div class="topbar">

        <div class="dropdown pull-left company-dropdown" style="width: 810px;">

          <h4 class="inv-company-name">
            <span>CompanyName</span>
            <span>Invoice No. InvoiceNumber</span>
            <i class="icn icn-caret-gray"></i>
          </h4>

        </div>

        <div class="zoom-slider pull-left" style="margin-top: 0; margin-left: 810px;">

          <a href="javascript:void(0)" class="pull-left icn icn-zoom-minus-invoice"></a>

          <div class="range-wrapper pull-left">
            <input type="range" min="1" max="3" step="0.1" class="ng-pristine ng-untouched">
          </div>

          <a href="javascript:void(0)" class="pull-right icn icn-zoom-plus-invoice"></a>

        </div>

        <div class="invoice-actions">

          <div class="btn btn-default pull-left" tooltip-placement="bottom" tooltip-append-to-body="true"
               tooltip="Print">
            <i class="icn icn-print"></i>
          </div>

          <div style="margin-left: 10px;" class="btn btn-default pull-left"
               tooltip-placement="bottom" tooltip-append-to-body="true" tooltip="Download">
            <i class="icn icn-download"></i>
          </div>

          <div style="width: 92px;margin-left: 10px;" class="btn btn-info pull-left"
               tooltip-placement="bottom" tooltip-append-to-body="true" tooltip="Create and Send Invoice">
            <i class="icn icn-send"></i>
          </div>

          <a href="javascript:void(0)" class="close-icon hit-area pull-left">
            <i class="icn icn-close"></i>
          </a>

        </div>

      </div>

      <div class="paging" style="opacity: 0;">
        <div class="tooltip body-tooltip top in" style="display: block;">
          <div class="tooltip-inner">1 of 2</div>
        </div>
      </div>

      <div class="qt-inv-container ng-pristine ng-untouched" style="opacity: 1;">
        <div class="inner-wrapper-all"
             style="transform-origin: 50% 0px 0px; transform: scale(1);">
          <div class="invoice-page inner-wrapper clearfix">

            <div class="header">
              <div class="invoice-label">
                <span class="pull-right">INVOICE</span>
              </div>
              <div id="logo"><img width="64" height="64" alt="tech"></div>
              <div class="company-info ">
                <div class="tech-company-name">CompanyName</div>
                <div class="address">CompanyAddress</div>
              </div>
            </div>

            <div class="sub-header">

              <div class="billed">
                <div class="dropdown"><h3 class="heading">BILL TO<i class="icn icn-caret-gray"></i></h3></div>
              </div>

              <div class="shipto">
                <div class="dropdown"><h3 class="heading">SHIP TO <i class="icn icn-caret-gray"></i></h3></div>
              </div>

              <div class="invoice-info">
                <h3 class="heading">INVOICE NO. <span class="total"></span></h3>
              </div>

            </div>

            <div class="footer">

              <div class="terms">
                <span></span>
              </div>
            </div>

          </div>

        </div>
      </div>

    </div>

  </div>
</div>
