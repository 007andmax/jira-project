<div class="service-form-wrapper edit-is-billable" ng-form="editServiceForm">

  <div class="col-1" style="width: calc(100% - 205px);"
       ng-class="{'has-error': isShowingErrors(editServiceForm, 'editServiceName')}">
    <!--style for TODO hide timeAllotment-->

    <label class="control-label" ng-class="{'hide': isShowingErrors(editServiceForm, 'editServiceName')}">
      SERVICE NAME
    </label>

    <div ng-messages="editServiceForm.editServiceName.$error"
         ng-class="{'hide': !isShowingErrors(editServiceForm, 'editServiceName')}">

      <label class="control-label" ng-message="required">
        SERVICE NAME IS REQUIRED.
      </label>
      <label class="control-label" ng-message="maxlength">
        SERVICE NAME IS TOO LARGE.
      </label>
      <label class="control-label" ng-message="minlength">
        SERVICE NAME IS TOO SHORT.
      </label>
      <label class="control-label" ng-message="unique">
        THIS SERVICE NAME ALREADY OCCUPIED.
      </label>
    </div>

    <input type="text" class="form-control"
           ng-model="editService.name" name="editServiceName"
           ng-required="true" custom-disabled="{{ !!(!service.isDefault && service) }}"
           is-uniq-validation validation-func="validateServiceName" model-id="service.versionedId.id"
           ng-maxlength="50" ng-minlength="3">
  </div>

  <div class="col-2" style="padding-right: 0"
       ng-class="{'has-error': isShowingErrors(editServiceForm, 'editServiceRate')}">
    <!--style for TODO hide timeAllotment-->

    <label class="control-label" ng-class="{'hide': isShowingErrors(editServiceForm, 'editServiceRate')}">
      PER HOUR
    </label>

    <div ng-messages="editServiceForm.editServiceRate.$error"
         ng-class="{'hide': !isShowingErrors(editServiceForm, 'editServiceRate')}">
      <label class="control-label" ng-message="required">
        PER HOUR IS REQUIRED.
      </label>
    </div>

    <input type="text" class="form-control"
           ng-model="editService.rate"
           name="editServiceRate" hard-reset-required="true" hard-reset-pattern="decimalNumberPattern">
  </div>

  <div class="col-3">

    <label class="control-label">
      IS BILLABLE
    </label>

    <label class="control checkbox pull-left">
      <input type="checkbox" ng-model="editService.billable">
      <span class="control-indicator"></span>
    </label>

  </div>

      <!--TIME ALLOTMENT-->

       <!--IS REQUIRED.-->
      <!--</label>-->

    <!--<input id="service-quantity-picker" type="text" class="form-control"-->

    <!--<input type="hidden" invalid-when="!editService.timeBlock || editService.timeBlock <= 0"-->
           <!--name="timeBlock" ng-model="editService.timeBlock" hard-reset-required="true"/>-->

  <!--</div>-->

  <div class="qt-form-actions">
    <!--<div class="pull-left text-error">{{ getValidationMessage(editServiceForm) }}</div>-->

    <div class="btn btn-lg btn-info pull-right"
         ng-click="saveEditService(editServiceForm)"
         custom-disabled="{{ editServiceForm.$pristine || editServiceForm.$invalid || disabledSaveButton }}">
      {{ editService.id ? 'Save' : 'Add' }}
    </div>

    <div class="btn btn-lg btn-primary pull-right" ng-click="cancelEditForm()">Cancel</div>
  </div>
</div>
