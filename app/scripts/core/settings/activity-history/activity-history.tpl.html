<div class="settings-main-wrapper activity-history">
  <div class="row">
    <div class="col-md-12" style="padding: 0px">
      <div class="col-md-12" style="padding: 0px">
        <h4>Activity History</h4>
      </div>

      <div class="clearfix" style="margin-bottom: 15px;">
        <label class="control checkbox pull-left">
          <input type="checkbox" ng-model="enableTwoFactorAuthentication"
                 ng-change="toggle2FA(enableTwoFactorAuthentication)">
          <span class="control-indicator"></span> two-factor authentication
        </label>
      </div>

      <div google-map class="activity-map" latitude="selectedDevice.latitude" longitude="selectedDevice.longitude"
           title="{{ (selectedDevice.city ? selectedDevice.city + ', ' : '') + selectedDevice.country }}"></div>
      <div class="col-md-12 col-xs-12">
        <p class="remove">
          <span ng-click="closeSession($event)" ng-if="activityHistory.length > 1">remove all devices</span>
        </p>
      </div>
      <div class="col-md-12 logged">
        <div class="device-id"
             ng-repeat="device in activityHistory | orderBy: 'lastAccessDate': true track by device.id"
             ng-click="selectDevice(device)" ng-class="{'selected': selectedDevice.id === device.id}">
          <p>
            <span ng-if="device.browserName">{{ device.browserName + ', ' }}</span>
            <span ng-if="device.osName">{{ device.osName + ' ' }}</span>
            (<span ng-if="device.city">{{ device.city + ', ' }}</span><span ng-if="device.country">{{ device.country + ', ' }}</span><span
            ng-if="device.ipAddress">{{ device.ipAddress }}</span>)&nbsp;
          <span ng-if="device.current || device.lastAccessDate" class="current">
            last seen: {{ device.current ? 'now' : (device.lastAccessDate | date) }}
          </span>
            <i class="icn-sm icn-remove-token unlog" ng-click="closeSession($event, device)"
               ng-if="!device.current"></i>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
