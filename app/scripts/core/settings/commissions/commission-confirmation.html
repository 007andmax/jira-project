<div>
  <div class="close-btn btn pull-right" ng-click="closeModal()" tabindex="1" style="z-index: 1000">
    <i class="icn-sm icn-remove-old" uib-tooltip="Close"></i>
  </div>
  <div class="modal-body">
    <p>{{ messageConfirm }}</p>
  </div>
  <div class="modal-footer">
    <div class="btn btn-lg btn-primary" ng-class="{'hide': hideCancel}"
         data-dismiss='modal' ng-click=cancelConfirm()>
      {{ btnCancel }}
    </div>
    <div class="btn btn-lg btn-primary" ng-click=approveConfirm()>{{ buttonConfirm }}</div>
  </div>
</div>
