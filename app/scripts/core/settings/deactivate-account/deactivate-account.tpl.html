<div>
  <div class="modal-body">
    <p>Are you sure you want to delete this account? All information will be lost, without the possibility of restoration.</p>
    <br>
    <div class="form-group">
      <label class="control-label" style="text-transform: uppercase;">Describe the reason for deleting</label>
      <textarea class="form-control" ng-model="modalData.note" rows="3"></textarea>
    </div>
  </div>
  <div class="modal-footer">
    <div class="btn btn-lg btn-primary  " ng-click="dismiss()">Cancel</div>
    <div class="btn btn-lg btn-primary" ng-click="confirm()">OK</div>
  </div>
</div>
