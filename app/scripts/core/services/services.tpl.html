<div class="content-body receipt">
  <div role="tabpanel" fixed-tab-topbar>
    <div class="tabs-topbar" ftt-topbar-to-be-fixed>
      <div class="dropdown pull-right service-move-to" ng-controller="quicktech.core.services.servicesMovingCtrl">
        <a href="javascript:void(0)" class="btn btn-sr btn-create-company  btn-gray    dropdown-toggle tooltip-dp"
           data-placement="top" title="" data-original-title="move service(s) to..." data-toggle="dropdown"
           ng-click="generateMovementData()" qt-hide-dropdown="hideMovementDropdown">
          <span class="icns icn icn-move-services "></span>
        </a>

        <div class="dropdown-menu assign-ticket-menu" stop-propagation="click">
          <div class=" assign-ticket service-move-to-menu">
            <div class="assign-ticket-content">
              <div class="assign-ticket-header">
                <div class="clearfix">
                  <div class="form-group">
                    <input class="form-control form-control-search form-control-dropdown-input"
                           placeholder="Search company..." ng-model="searchCompany.name">
                    <a href="javascript:void(0)" class="close icn-remove-token" tabindex="-1"></a>
                  </div>
                </div>
              </div>
              <div move-services-scroll style="width: 300px !important; max-height: 350px; height: 350px;">

                <ul class="users-list" style="padding-top: 0px;">

                  <li ng-repeat="company in companies | filter : searchCompany | orderBy: 'name'">

                    <div class="clearfix"><label class="control checkbox pull-left">
                      <input type="checkbox" ng-model="movementStates[company.id].checked"
                             ng-change="updateMovementState(company.id)">
                      <span class="control-indicator"
                            ng-class="{ intermediate: movementStates[company.id].hasPartOfSelectedServices }"></span>
                    </label>
                      {{ company.name }}
                    </div>
                  </li>
                </ul>
              </div>
              <div class="form-group btm-btn">
                <button type="button" class="btn btn-scooter" ng-click="moveServices()" ng-disabled="disableMoveButton">
                  Move
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Nav tabs -->
      <ul class="nav nav-tabs" role="tablist">
        <li role="presentation">
          <a ui-sref="ps.products">Products</a>
        </li>
        <li role="presentation" class="active">
          <a href="">Services & Rates</a>
        </li>
      </ul>
    </div>

    <!-- Tab panes -->
    <div class="tab-content">
      <div role="tabpanel" class="tab-pane active">
        <ul class="companies-list recurring products services-list" ftt-tab-content>
          <li class="opened default" ng-controller="quicktech.core.services.defaultServicesCtrl"
              style="padding-bottom: 100px">
            <a href='javascript:void(0)'>
              <span class="name">DEFAULT SERVICES</span>
              <span class="amount pull-right">{{ services.length }} services</span>

              <div class="clearfix"></div>
            </a>

            <div ng-include="'/html/scripts/core/services/services-list.tpl.html'"></div>

            <div ng-if="showCreateService" ng-include="'/html/scripts/core/services/edit-service.tpl.html'"></div>

            <button class="btn btn-sr btn-create-in btn-scooter btn-create-service pull-right"
                    tooltip-placement="top" tooltip="Add Service" ng-click="showCreateServiceForm()"
                    ng-disabled="showCreateService">
              <span class="icns icn wt-icn-add-service "></span></button>

          </li>
          <li class="heading-warraper">
            <div class="heading"><span class="bold">All Companies</span><span class="dot-sep"></span> Service & Rate
              Lists
            </div>
            <div class="clearfix"></div>

          </li>
          <li qt-toggle-slider ng-repeat="(companyId, services) in servicesData"
              ng-controller="quicktech.core.services.companyCtrl"
              ng-if="companyId != 'default' && companyId != 'staticCopy'">
            <a href='javascript:void(0)' qt-ts-toggler>
              <span class="name">{{ company.name }}</span>
              <span class="amount pull-right">{{ services.length }} services</span>

              <div class="clearfix"></div>
            </a>

            <div ng-include="'/html/scripts/core/services/services-list.tpl.html'"></div>
          </li>
        </ul>
      </div>
    </div>

  </div>
</div>
