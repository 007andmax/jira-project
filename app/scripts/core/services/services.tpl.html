<div class="services-content">
  <div class="default-services-header" ng-controller="quicktech.core.services.defaultServicesCtrl">

    <div class="default-service-count">Default Services
      <span class="text-muted">{{ services.length }}</span>
    </div>

    <div class="dropdown pull-right" ng-controller="quicktech.core.services.servicesMovingCtrl">

      <div class="btn btn-primary has-tooltip" data-toggle="dropdown"
           aria-expanded="false" tooltip-placement="top" tooltip-append-to-body="true"
           tooltip="Move service(s) to..."
           ng-click="cancelEditForm(); generateMovementData()" qt-hide-dropdown="hideMovementDropdown"
           custom-disabled="{{ !hasDefaultServicesChecked }}">
        <i class="icn-sm icn-add-services"></i>
      </div>

      <div class="dropdown-menu dropdown-menu-right checkbox-dropdown" stop-propagation="click">

        <div role="presentation" class="checkbox-dropdown-header">
          <div class="form-group">
            <input type="text" class="form-control-filter" placeholder="Search company..."
                   ng-model="searchCompany.name">
            <i class="icn-sm icn-search-input" tabindex="-1"></i>
          </div>
        </div>

        <div class="nano">
          <div class="nano-content">
            <div class="checkbox-dd-list">

              <div class="checkbox-dd-item"
                   ng-repeat="company in companies | filter : searchCompany | orderBy: 'name'">

                <label class="control checkbox">
                  <input type="checkbox" ng-model="movementStates[company.id].checked"
                         ng-change="updateMovementState(company.id)">
                  <span class="control-indicator pull-left"
                        ng-class="{ 'alternate': movementStates[company.id].hasPartOfSelectedServices }"></span>
                  {{ company.name }}
                </label>

              </div>

            </div>
          </div>
        </div>
        <div role="presentation" class="checkbox-dropdown-footer clearfix">
          <div class="number-selected pull-left">
            <i class="pull-left icn-sm icn-tick-blue"></i>
            <strong>{{ checkedDefaultServices }}</strong> selected
          </div>
          <div class="btn btn-info btn-lg pull-right"
               ng-click="moveServices()"
               custom-disabled="{{ disableMoveButton }}">Move
          </div>
        </div>
      </div>
    </div>

    <div ng-include="'/html/scripts/core/services/services-list.tpl.html'"></div>

    <div class="add-service-btn-wrapper">
      <div class="btn btn-info has-tooltip"
           ng-click="showCreateServiceForm()"
           custom-disabled="{{ showCreateService }}"
           tooltip-placement="top" tooltip-append-to-body="true" tooltip="Add service">
        <i class="icn-sm icn-service-add"></i>
      </div>
    </div>

  </div>


  <div class="all-companies-heading">
    All Companies <span class="text-muted">Service &amp; Rate Lists</span>
  </div>

  <ul class="qt-list qt-services">

    <li qt-toggle-slider ng-repeat="company in companies | orderBy: 'name'"
        ng-controller="quicktech.core.services.companyCtrl"
        event-toggle-slider="toggleServices">

      <div style="position: absolute;width: 100%;height: 71px;top: 0;z-index: 1;"
           ng-click="toggleServices()"></div>

      <div class="col-1">{{ company.name }}</div>
      <div class="col-2">{{ services.length || 0 }} services</div>

      <div ets-slider style="display: none;"
           ng-include="'/html/scripts/core/services/services-list.tpl.html'"></div>

    </li>

  </ul>
</div>
