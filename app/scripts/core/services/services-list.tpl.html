<ul class="qt-list" ng-class="{'qt-services-list': companyService, 'qt-default-services': !companyService}">

  <li class="list-heading" ng-show="services.length > 0" style="cursor: pointer !important;">
    <div class="col-1" ng-click="setOrderForServices('name')">
      <span class="sort-span">SERVICE NAME<i class="icn-sm sort-icon icn-sort"
                                             ng-class="{'rotate': orderServices.reverse, 'active': orderServices.field === 'name'}"></i></span>

    </div>

    <div class="col-2" ng-click="setOrderForServices('rate')">
      <span class="sort-span">PER HOUR<i class="icn-sm sort-icon icn-sort"
                                         ng-class="{'rotate': orderServices.reverse, 'active': orderServices.field === 'rate'}"></i></span>

    </div>
    <div class="col-5 is-billable" ng-click="setOrderForServices('billable')">
      <span class="sort-span">IS BILLABLE<i class="icn-sm sort-icon icn-sort"
                                            ng-class="{'rotate': orderServices.reverse, 'active': orderServices.field === 'billable'}"></i></span>

    </div>
    <!--<div class="col-3" ng-show="currentUser.role === 'SUPER_TECH_ADMIN'">TIME ALLOTMENT</div> TODO hide timeAllotment-->
    <div class="col-4">&nbsp;</div>
  </li>

  <li ng-repeat="service in services | orderBy : orderByForServices : orderServices.reverse"
      ng-controller="quicktech.core.services.serviceCtrl"
      style="padding-left: 10px;padding-right: 10px;"
      on-finish-render="loadingFinished('default')"
      ng-class="{'no-border': isEditService, 'add-new': isEditService, 'qt-service-form': isEditService}"
      show-model-element="{{ 'show-' + service.versionedId.id }}">

    <div class="intermediate-parent-elem" ng-if="!isEditService">

      <div class="col-1">
        <div>{{ service.name }}</div>
      </div>

      <div class="col-2">
        {{ service.rate | currency: '$': 2 }}
      </div>
      <div class="col-5 is-billable">
        <label class="control checkbox pull-left" style="margin-top: 4px;left:25px">
          <input type="checkbox" ng-checked="service.billable"
                 custom-disabled="{{ disabledCheckbox || !PermissionsService.isAllowed('MANAGE_SERVICES') }}"
                 ng-click="onChangeBillable()">
          <span class="control-indicator"></span>
        </label>
      </div>

      <div class="col-4" ng-if="PermissionsService.isAllowed('MANAGE_SERVICES')">

        <a href="javascript:void(0)" class="ha-delete hit-area pull-right has-tooltip"
           ng-click="deleteService()"
           tooltip-placement="top" tooltip-append-to-body="true" uib-tooltip="Delete">
          <i class="icn-sm icn-delete"></i>
        </a>

        <a href="javascript:void(0)" class="ha-edit hit-area pull-right has-tooltip"
           ng-click="showEditServiceForm()"
           tooltip-placement="top" tooltip-append-to-body="true" uib-tooltip="edit">
          <i class="icn-sm icn-edit"></i>
        </a>

      </div>

    </div>

    <div ng-if="isEditService" ng-controller="quicktech.core.services.editServiceCtrl"
         ng-include="'/html/scripts/core/services/edit-service.tpl.html'"></div>

  </li>

  <li class="qt-service-form" ng-if="showCreateService">
    <div ng-controller="quicktech.core.services.editServiceCtrl"
         ng-include="'/html/scripts/core/services/edit-service.tpl.html'"></div>
  </li>

</ul>
