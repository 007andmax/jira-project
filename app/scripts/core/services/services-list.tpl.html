<ul class="qt-list" ng-class="{'qt-services-list': companyService, 'qt-default-services': !companyService}">

  <li class="list-heading" ng-show="services.length > 0">
    <div class="col-1">TYPE</div>
    <div class="col-2" ng-show="currentUser.role === 'SUPER_TECH_ADMIN'">MIN. TIME SLICE</div>
    <div class="col-3" ng-show="currentUser.role === 'SUPER_TECH_ADMIN'">RATE</div>
    <div class="col-4">&nbsp;</div>
  </li>

  <li ng-repeat="service in services | orderBy : 'createdAt'"
      ng-controller="quicktech.core.services.serviceCtrl"
      ng-class="{'no-border': isEditService, 'add-new': isEditService, 'qt-service-form': isEditService}"
      show-model-element="{{ 'show-' + service.versionedId.id }}">

    <div class="intermediate-parent-elem" ng-if="!isEditService">

      <div class="col-1">
        <label class="control checkbox pull-left" ng-if="showCheckboxes">
          <input type="checkbox" ng-model="checkedServices[service.versionedId.id]" ng-change="onChangeCheckbox()">
          <span class="control-indicator"></span>
        </label>

        <div class="checkbox-caption">{{ service.name }}</div>
      </div>

      <div class="col-2" ng-show="currentUser.role === 'SUPER_TECH_ADMIN'">
        {{ service.timeBlock | timeFilter }}
      </div>

      <div class="col-3" ng-show="currentUser.role === 'SUPER_TECH_ADMIN'">
        {{ service.rate | currency: '$': 2 }}
      </div>

      <div class="col-4" ng-show="currentUser.role === 'SUPER_TECH_ADMIN'">

        <a href="javascript:void(0)" class="ha-delete hit-area pull-right has-tooltip"
           ng-click="deleteService()"
           tooltip-placement="top" tooltip-append-to-body="true" tooltip="Delete">
          <i class="icn-sm icn-delete"></i>
        </a>

        <a href="javascript:void(0)" class="ha-edit hit-area pull-right has-tooltip"
           ng-click="showEditServiceForm()"
           tooltip-placement="top" tooltip-append-to-body="true" tooltip="edit">
          <i class="icn-sm icn-edit"></i>
        </a>

      </div>

    </div>

    <div ng-if="isEditService" ng-include="'/html/scripts/core/services/edit-service.tpl.html'"></div>

  </li>

  <li class="qt-service-form" ng-if="showCreateService">
    <div ng-include="'/html/scripts/core/services/edit-service.tpl.html'"></div>
  </li>

</ul>
