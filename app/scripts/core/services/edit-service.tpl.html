<div ng-controller="quicktech.core.services.editServiceCtrl" class="clearfix no-border add-new opened">
  <form name="editServiceForm">
    <div class="hover">
      <div class="col-1">
        <div class="col-wrapper one" ng-class="{error: isShowingErrors(editServiceForm, 'editServiceName')}">
          <input type="text" class="form-control" placeholder="Type" ng-model="editService.name"
                 name="editServiceName" ng-required="true" ng-disabled="!service.isDefault && service"
                 is-uniq-validation validation-func="validateServiceName" model-id="service.versionedId.id"
                 ng-maxlength="100" ng-minlength="3">
        </div>
      </div>
      <div class="col-2 normal">
        <div class="col-wrapper one" ng-class="{error: isShowingErrors(editServiceForm, 'timeBlock')}">
          <input type="text" class="form-control" placeholder="Min. Time Slice" ng-model="editService.timeBlock"
                 ng-disabled="!service.isDefault && service" hard-reset-pattern="numberPattern"
                 invalid-when="editService.timeBlock <= 0" ng-required="true" name="timeBlock">
        </div>
      </div>


      <div class="col-5 normal">
        <div class="col-wrapper" ng-class="{error: isShowingErrors(editServiceForm, 'editServiceRate')}">
          <input type="text" class="form-control" placeholder="Price" ng-model="editService.rate"
                 name="editServiceRate" ng-required="true" hard-reset-pattern="decimalNumberPattern">
        </div>
      </div>

    </div>
    <div class="add-more  new clearfix">
      <div class="service-add-table-message pull-left">

        <div ng-show="showIsRequiredMessage(editServiceForm)">
          <div class="qt-error-msg">Please fill in the required field(s).</div>
        </div>

        <div ng-messages="editServiceForm.editServiceName.$error"
             ng-show="isShowingErrors(editServiceForm, 'editServiceName')">
          <div class="qt-error-msg" ng-message="maxlength">Service name exceeds maximum length.</div>
          <div class="qt-error-msg" ng-message="minlength">Service name is too short!</div>
          <div class="qt-error-msg" ng-message="unique">Service name already exists!</div>
        </div>

        <div ng-messages="editServiceForm.timeBlock.$error" ng-if="isShowingErrors(editServiceForm, 'timeBlock')">
          <div class="qt-error-msg" ng-message="invalidwhen">Minimal Time Slice should be greater than 0.</div>
        </div>

      </div>
      <div class="add-table-actions pull-right">
        <a href="javascript:void(0)" class="btn btn-sr btn-gray btn-apply-filter pull-left"
           ng-click="cancelEditForm()">Cancel</a>
        <a href="javascript:void(0)" class="btn btn-sr btn-scooter btn-reset-filter pull-left"
           ng-click="saveEditService(editServiceForm)" ng-disabled="disabledSaveButton">
          {{ editService.id ? 'Save Changes' : 'Create' }}</a>
      </div>
    </div>
  </form>
</div>
