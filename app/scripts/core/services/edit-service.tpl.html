<div class="service-form-wrapper edit-form-checkbox" ng-form="editServiceForm">

  <div class="col-1" ng-class="{'has-error': isShowingErrors(editServiceForm, 'editServiceName')}">

    <input type="text" class="form-control" placeholder="Service Name"
           ng-model="editService.name"
           name="editServiceName" ng-required="true" custom-disabled="{{ !!(!service.isDefault && service) }}"
           is-uniq-validation validation-func="validateServiceName" model-id="service.versionedId.id"
           ng-maxlength="100" ng-minlength="3">
  </div>

  <div class="col-2" ng-class="{'has-error': isShowingErrors(editServiceForm, 'editServiceRate')}">
    <input type="text" class="form-control" placeholder="Per Hour"
           ng-model="editService.rate" qt-to-fixed="2"
           name="editServiceRate" hard-reset-required="true" hard-reset-pattern="decimalNumberPattern">
  </div>

  <div class="col-3">
    <label class="control checkbox pull-left" uib-tooltip="Is Billable" toltip-placement="top">
      <input type="checkbox" ng-model="editService.billable">
      <span class="control-indicator"></span> &nbsp; Is Billable
    </label>
  </div>

  <!--<div ng-if="!(!service.isDefault && service)" class="col-3" style="position: relative;" TODO hide timeAllotment-->
       <!--service-quantity-picker="editService.timeBlock" sqp-is-show-format="false" sqp-form="editServiceForm.timeBlock"-->
       <!--ng-class="{'has-error': isShowingErrors(editServiceForm, 'timeBlock')}">-->

    <!--<input id="service-quantity-picker" type="text" class="form-control" placeholder="Time Allotment"-->
           <!--sqp-input readonly>-->

    <!--<input type="hidden" invalid-when="!editService.timeBlock || editService.timeBlock <= 0"-->
           <!--name="timeBlock" ng-model="editService.timeBlock" hard-reset-required="true"/>-->

  <!--</div>-->

  <!--<div ng-if="(!service.isDefault && service)" class="col-3"-->
       <!--ng-class="{'has-error': isShowingErrors(editServiceForm, 'timeBlock')}">-->

    <!--<input type="text" class="form-control disabled" placeholder="Time Allotment"-->
           <!--ng-value="(editService.timeBlock / 60) | timeFilter"-->
           <!--ng-disabled="true">-->
  <!--</div>-->

  <div class="qt-form-actions">
    <div class="pull-left text-error">{{ getValidationMessage(editServiceForm) }}</div>

    <div class="btn btn-lg btn-info pull-right"
         ng-click="saveEditService(editServiceForm)"
         custom-disabled="{{ disabledSaveButton }}">
      {{ editService.id ? 'Save' : 'Add' }}
    </div>

    <div class="btn btn-lg btn-primary pull-right" ng-click="cancelEditForm()">Cancel</div>
  </div>
</div>
