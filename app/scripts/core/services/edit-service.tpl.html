<div class="service-form-wrapper" ng-form="editServiceForm"
     ng-controller="quicktech.core.services.editServiceCtrl">

  <div class="col-1" ng-class="{'has-error': isShowingErrors(editServiceForm, 'editServiceName')}">

    <input type="text" class="form-control" placeholder="Service"
           ng-model="editService.name"
           name="editServiceName" ng-required="true" custom-disabled="{{ !service.isDefault && service }}"
           is-uniq-validation validation-func="validateServiceName" model-id="service.versionedId.id"
           ng-maxlength="100" ng-minlength="3">
  </div>

  <div class="col-2" ng-class="{'has-error': isShowingErrors(editServiceForm, 'timeBlock')}">

    <input type="text" class="form-control" placeholder="Min. Time Slice"
           ng-model="editService.timeBlock"
           custom-disabled="{{ !service.isDefault && service }}" hard-reset-pattern="numberPattern"
           invalid-when="editService.timeBlock <= 0" ng-required="true" name="timeBlock">
  </div>

  <div class="col-3" ng-class="{'has-error': isShowingErrors(editServiceForm, 'editServiceRate')}">
    <input type="text" class="form-control" placeholder="Rate"
           ng-model="editService.rate"
           name="editServiceRate" ng-required="true" hard-reset-pattern="decimalNumberPattern">
  </div>

  <div class="qt-form-actions">
    <div class="pull-left text-error">{{ getValidationMessage(editServiceForm) }}</div>

    <div class="btn btn-lg btn-info pull-right"
         ng-click="saveEditService(editServiceForm)"
         custom-disabled="{{ disabledSaveButton }}">
      {{ editService.id ? 'Save' : 'Add' }}
    </div>

    <div class="btn btn-lg btn-primary pull-right" ng-click="cancelEditForm()">Cancel</div>
  </div>
</div>
