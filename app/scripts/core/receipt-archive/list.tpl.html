<div role="tabpanel" class="tab-pane" id="invoice-number">
  <ul class="invoices recurring receivable receipt in-number">
    <li class="head clearfix">
      <div class="">
        <div class="col-1">  <span class="name">INVOICE NO.</span></div>
        <div class="col-1-2">CLIENT</div>
        <div class="col-2">INVOICE DATE</div>
        <div class="col-3">PAID ON</div>
        <div class="col-5">AMOUNT</div>
      </div>
    </li>
    <li class="clearfix" ng-repeat="invoice in receiptArchiveData.list | orderBy: 'number'"
        ng-controller="quicktech.core.receiptArchive.invoiceCtrl"
        show-model-element="{{ 'showInvoice-' + invoice.id }}">
      <span class="icns calendar" ng-if="invoice.recurring"
            tooltip="recurring: {{ invoice.frequency }}" tooltip-placement="top"
            ng-class="{'icn-green-calendar': invoice.frequency === 'MONTHLY',
                           'icn-orange-calendar': invoice.frequency === 'YEARLY',
                           'icn-red-calendar': invoice.frequency === 'WEEKLY'}"></span>

      <div class="hover">
        <div class="col-1"><span class="name">{{ invoice.number }}</span>
          <span class=" badge badge-light " ng-if="invoice.invoicesCount">{{ invoice.invoicesCount }}</span></div>
        <div class="col-1-2 normal">{{ company.name }}</div>
        <div class="col-2 normal">{{ invoice.date | date:'dd MMM yyyy' }}</div>
        <div class="col-3"><span class="label label-dark-orange">{{ invoice.paidOn | date:'dd MMM yyyy' }}</span></div>
        <div class="col-5 normal">{{ invoice.sum | currency:'$' :0 }}</div>
      </div>
    </li>
  </ul>
</div>
