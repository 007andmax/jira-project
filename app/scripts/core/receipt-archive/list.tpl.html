<div role="tabpanel" class="tab-pane active">
  <ul class="qt-list qt-receipt-number">

    <li class="list-heading">
      <div class="col-1">INVOICE NO.</div>
      <div class="col-2">COMPANY</div>
      <div class="col-3">INVOICE DATE</div>
      <div class="col-4">PAID ON</div>
      <div class="col-5">AMOUNT</div>
    </li>

    <li ng-repeat="invoice in receiptArchiveData.list | orderBy: 'number'"
        ng-controller="quicktech.core.receiptArchive.invoiceCtrl"
        show-model-element="{{ 'showInvoice-' + invoice.id }}">

      <div class="col-1">
        <div class="checkbox-caption free-number-link"
             tooltip-placement="top" tooltip="Invoice Preview"
             modal-window-button="/html/scripts/core/billable/create-invoice.tpl.html"
             modal-window-class="invoice-modal-not-background"
             mw-window-template-url="/html/scripts/core/billable/create-invoice-modal.tpl.html"
             mw-controller="quicktech.core.receivable.invoicePreviewCtrl">{{ invoice.number }}</div>
      </div>

      <div class="col-2">{{ company.name }}</div>
      <div class="col-3">{{ invoice.date | date:'dd MMM yyyy' }}</div>

      <div class="col-4">
        <span class="label label-warning">{{ invoice.paidOn | date:'dd MMM yyyy' }}</span>
      </div>

      <div class="col-5">{{ invoice.sum | currency:'$' :2 }}</div>
    </li>

  </ul>
</div>
