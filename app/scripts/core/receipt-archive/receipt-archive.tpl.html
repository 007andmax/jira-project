<div class="receipt-archive-content">

  <div class="tabs-container" style="margin-top: 40px">
    <div class="payment-receive-fixed" style="margin-top: 20px" fixed-block-top>

      <div class="btn btn-info pull-right" ng-click="deleteSelectedInvoices()"
           custom-disabled="{{ !selectedInvoiceCount }}">
        Deleted Selected
      </div>
      <button-with-loading-indicator class="btn btn-info pull-right" ng-click="resendSelectedInvoices()"
                                     custom-disabled="{{ !selectedInvoiceCount || sendingInvoices }}"
                                     loading="sendingInvoices" label="Resend Selected"></button-with-loading-indicator>

      <ul class="nav nav-qt" role="tablist">

        <li role="presentation" ng-class="{active: mode === 'group-by-company'}">
          <a ui-sref="receipt-archive({mode: 'group-by-company'})">Invoice by Company</a>
        </li>

        <li role="presentation" ng-class="{active: mode === 'list'}">
          <a ui-sref="receipt-archive({mode: 'list'})">Invoice by Number</a>
        </li>

      </ul>
    </div>
  </div>

  <div class="tab-content" ng-hide="loadingInProgress" ng-include="'/html/scripts/core/receipt-archive/'+ mode +'.tpl.html'"></div>
  <loading-indicator loading-trigger="loadingInProgress"></loading-indicator>

</div>
