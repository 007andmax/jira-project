<div class="new-intermediate-parent-elem clearfix">

  <div class="col-md-5 pre-line" ng-class="{'product-description': category.default}"
       uib-tooltip="{{ product.description }}"
       trimmed-tooltip-checker="product.description">
  </div>

  <div class="col-md-1" ng-if="PermissionsService.isAllowed('VIEW_PRODUCT_COST')">
    {{ product.cost | currency: '$': 2 }}
  </div>

  <div class="col-md-1">{{ product.sale | currency: '$': 2 }}</div>

  <div class="col-md-1" ng-if="showCategory">
    {{ product.category.default ? '' : product.category.name}}
  </div>

  <div class="col-md-1">{{ getCompanyById(product.companyId).name}}</div>

  <div class="col-md-1" style="padding-left: 10px;">
    {{ product.ilc}}
  </div>

  <div class="col-md-1">
    {{ product.manufacture}}
  </div>

  <div class="col-md-1">
    {{ getSelectedTaxNames(product.taxIds) }}
  </div>

  <div class="col-md-1 product-list-btn pull-right" uib-dropdown dropdown-append-to-body="true" keyboard-nav="true"
       ng-if="PermissionsService.isAllowed('MANAGE_PRODUCTS')">

    <a href="javascript:void(0)" class="ha-delete hit-area pull-right has-tooltip"
       ng-click="deleteProduct()"
       tooltip-placement="top" tooltip-append-to-body="true" uib-tooltip="Delete">
      <i class="icon-sm icn-delete"></i>
    </a>

    <a href="javascript:void(0)" class="ha-edit hit-area pull-right has-tooltip"
       create-new-entity="product" item="product" category-for-modal="product.category"
       tooltip-placement="top" tooltip-append-to-body="true" uib-tooltip="edit">
      <i class="icon-sm edit-icon"></i>
    </a>

    <a href="javascript:void(0)" class="ha-edit hit-area pull-right has-tooltip"
       aria-expanded="false" uib-dropdown-toggle
       tooltip-placement="top" tooltip-append-to-body="true" uib-tooltip="move to other category">
      <i class="icn-sm icn-send-again"></i>
    </a>

    <ul class="dropdown-menu move-prod" role="menu" uib-dropdown-menu>

      <li ng-repeat="category in productsData.categories | orderBy: 'name'"
          ng-hide="category.default || product.category.id === category.id">
        <a tabindex="-1" href="javascript:void(0)" ng-click="moveToCategory(category)">
          {{ category.name }}
        </a>
      </li>

    </ul>

  </div>
</div>
