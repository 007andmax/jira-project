<div>
  <div ng-hide="loadingInProgress" style="width: 100%; display: inline-block;">

    <div class="products-content" ng-controller="quicktech.core.products.productsListCtrl">

      <div class="products-content__header">
        <h3>Products</h3>
        <div class="products-content__header--search-result">
          3 product found successfully
        </div>
        <div class="products-content__header--search">
          <input type="text" placeholder="Search Products…" ng-model="productSearchName">
          <button class="plus-btn" create-new-entity="product">+</button>
        </div>
      </div>
      <div class="products-content__list">
        <div class="products-content__list--header clearfix">
          <div class="col-md-3 pointer"
               ng-click="setOrderForProducts('description')">Product Name
          </div>
          <div class="col-md-2 pointer"
               ng-click="setOrderForProducts('vendor')">Vendor
          </div>
          <div class="col-md-1 pointer"
               ng-click="setOrderForProducts('cost')"
               ng-if="PermissionsService.isAllowed('VIEW_PRODUCT_COST')">Cost
          </div>
          <div class="col-md-1 pointer"
               ng-click="setOrderForProducts('sale')">Sale Price
          </div>
          <div class="col-md-1 pointer"
               ng-click="setOrderForProducts('manufacture')">#Mfg
          </div>
          <div class="col-md-1">Tax</div>
          <div class="col-md-1 pointer"
               ng-click="setOrderForProducts('ilc')">ILC
          </div>
          <div class="col-md-1">GL</div>
        </div>
        <div class="products-content__list--item clearfix"
             ng-repeat="product in productsData.list | filterProductByName: productSearchName| filter : filterByCategory | orderBy : orderByForProducts : orderProducts.reverse track by product.versionedId.id"
             ng-controller="quicktech.core.products.productCtrl"
             show-model-element="{{ 'show-' + product.versionedId.id}}"
             on-finish-render="loadingFinished()"
             ng-init="setHighlightCreatedProductId(product.versionedId.id)">

          <div class="col-md-3 pre-line"
               ng-class="{'product-description': category.default}"
               uib-tooltip="{{ product.description }}"
               trimmed-tooltip-checker="product.description"></div>

          <div class="col-md-2"> {{ getCompanyById(product.companyId).name}}</div>

          <div class="col-md-1"
               ng-if="PermissionsService.isAllowed('VIEW_PRODUCT_COST')">
            {{ product.cost | currency: '$': 2 }}
          </div>

          <div class="col-md-1"> {{ product.sale | currency: '$': 2 }}</div>

          <div class="col-md-1">{{ product.manufacture}}</div>

          <div class="col-md-1">{{ getSelectedTaxNames(product.taxIds) }}</div>

          <div class="col-md-1">{{ product.ilc}}</div>

          <div class="col-md-1"></div>

          <div class="col-md-1 btn-actions">
            <i class="icon-sm edit-icon pointer has-tooltip"
               create-new-entity="product"
               item="product"
               category-for-modal="product.category"
               tooltip-placement="top"
               tooltip-append-to-body="true"
               uib-tooltip="edit"></i>
            <i class="icon-sm icn-delete pointer has-tooltip"
               ng-click="deleteProduct()"
               tooltip-placement="top"
               tooltip-append-to-body="true"
               uib-tooltip="Delete"></i>
          </div>

        </div>
      </div>

      <!--<div class="tabs-container" style="margin-left: 15px">-->
      <!--<div class="fixed-block-top" style="" fixed-block-top>-->

      <!--</li>-->

      <!--<div ng-if="currentOpenTab === 'category'"-->
      <!--ng-include="'/html/scripts/core/products/group-by-category.tpl.html'"></div> -->
    </div>
    <!--<div ng-include="'/html/scripts/core/products/products-list.tpl.html'"></div>-->


  </div>
  <loading-indicator loading-trigger="loadingInProgress" style="width: 100%;position: absolute;top: calc(50vh - 25px);"></loading-indicator>

</div>
