<div>
  <div class="products-content">

    <div class="tabs-container" style="margin-top: 60px; margin-left: 15px">
      <div class="fixed-block-top" style="margin-top: 40px;" fixed-block-top>
        <ul class="nav nav-qt" role="tablist" style="margin-left: 20px">

          <li role="presentation" ng-class="{'active': pageTab === 'category'}">
            <a ui-sref="products({ tabName: 'category' })">Product by Category</a>
          </li>

          <li role="presentation" ng-class="{'active': pageTab === 'list'}">
            <a ui-sref="products({ tabName: 'list' })">Products List</a>
          </li>

        </ul>
      </div>

    </div>

    <div ng-hide="loadingInProgress" style="width: 100%; display: inline-block; margin-top: 20px;">

      <div ng-include="'/html/scripts/core/products/' + (pageTab === 'list' ? 'products-' : 'group-by-') + pageTab + '.tpl.html'"></div>

    </div>

    <loading-indicator loading-trigger="loadingInProgress"></loading-indicator>

  </div>
</div>
