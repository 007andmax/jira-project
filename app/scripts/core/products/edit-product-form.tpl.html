<div class="product-form-wrapper" ng-form="editProductForm" ng-controller="quicktech.core.products.editProductCtrl">

  <div class="col-1" ng-class="{'has-error': isShowingErrors(editProductForm, 'editProductILC')}">
    <input type="text" class="form-control" placeholder="ILC" name="editProductILC"
           ng-required="false" ng-model="editProduct.ilc" ng-maxlength="64"
           is-uniq-validation validation-func="validateProductIls" model-id="product.versionedId.id">
  </div>

  <div class="col-2" ng-class="{'has-error': isShowingErrors(editProductForm, 'editProductMfg')}">
    <input type="text" class="form-control" placeholder="Mfg#" name="editProductMfg"
           ng-required="false" ng-model="editProduct.manufacture" ng-maxlength="64"
           is-uniq-validation validation-func="validateProductMnf" model-id="product.versionedId.id">
  </div>

  <div class="col-3" ng-class="{'has-error': isShowingErrors(editProductForm, 'editProductCategory')}"
       ng-if="withCategory">
    <div class="dropdown">

      <input type="text" class="form-control has-dropdown" placeholder="Category"
             data-toggle="dropdown" aria-expanded="false" autocomplete="off"
             ng-model="editProduct.category" name="editProductCategory" typeahead-editable="true"
             typeahead-on-select="validateCategory(editProduct.category, editProductForm)"
             typeahead="category as category.name for category in productsData.categories | filter: { name: $viewValue, default: false }:stateComparator | orderBy:'name'"
             qt-typeahead-show-on-focus custom-style="{width: '100%', 'max-height': '160px', 'overflow-y': 'auto'}">

      <div typeahead-input-icon="editProduct.category" style="position: absolute;top: 13px;right: 13px;"></div>

    </div>
  </div>

  <div class="col-desc" ng-class="{'has-error': isShowingErrors(editProductForm, 'editProductDescription')}">
    <input type="text" class="form-control" placeholder="Description"
           ng-model="editProduct.description" ng-required="true"
           ng-maxlength="490" name="editProductDescription">
  </div>

  <div class="col-3" ng-class="{'has-error': isShowingErrors(editProductForm, 'editProductVendor')}">
    <div class="dropdown">

      <input type="text" class="form-control has-dropdown" placeholder="Vendor/Supplier"
             data-toggle="dropdown" aria-expanded="false" autocomplete="off"
             ng-model="editProduct.vendor" name="editProductVendor"
             typeahead="vendor as vendor.name for vendor in vendors | filter:$viewValue:stateComparator | orderBy:'name'"
             typeahead-editable="true" qt-typeahead-show-on-focus
             custom-style="{width: '97%', 'max-height': '160px', 'overflow-y': 'auto'}">

      <div typeahead-input-icon="editProduct.vendor" style="position: absolute;top: 13px;right: 13px;"></div>

    </div>
  </div>

  <div class="col-4" ng-class="{'has-error': isShowingErrors(editProductForm, 'cost')}"
       ng-if="PermissionsService.isAllowed('VIEW_PRODUCT_COST')">
    <input type="text" class="form-control" placeholder="Cost" ng-model="editProduct.cost"
           name="cost" ng-change="validateSaleAndCost(editProductForm)"
           hard-reset-pattern="decimalNumberPattern">
  </div>

  <div class="col-5" ng-class="{'has-error': isShowingErrors(editProductForm, 'sale')}">
    <input type="text" class="form-control" placeholder="S. Price" ng-model="editProduct.sale"
           name="sale" ng-change="validateSaleAndCost(editProductForm)"
           hard-reset-pattern="decimalNumberPattern" hard-reset-required="true">
  </div>

  <div class="qt-form-actions">

    <div class="pull-left text-error">{{ getValidationMessage(editProductForm) }}</div>

    <div class="btn btn-lg btn-info pull-right" ng-click="saveChangeProduct(editProductForm)"
         custom-disabled="{{ disabledSaveChangeButton }}">
      {{ product ? 'Save' : 'Add' }}
    </div>

    <div class="btn btn-lg btn-primary pull-right" ng-click="cancelEditProduct()">Cancel</div>
  </div>

</div>
