<div class="product-form-wrapper" ng-form="editProductForm" ng-controller="quicktech.core.products.editProductCtrl">

  <div class="col-1">{{ product ? product.code : actualCode.value }}</div>

  <div class="col-2" ng-class="{'has-error': isShowingErrors(editProductForm, 'editProductName')}">
    <input type="text" class="form-control" placeholder="Product" name="editProductName"
           ng-required="true" ng-model="editProduct.name" ng-maxlength="100" ng-minlength="3"
           is-uniq-validation validation-func="validateProductName" model-id="product.versionedId.id">
  </div>

  <div class="col-3" ng-class="{'has-error': isShowingErrors(editProductForm, 'editProductVendor')}">
    <div class="dropdown">

      <input type="text" class="form-control has-dropdown" placeholder="Vendor/Supplier"
             data-toggle="dropdown" aria-expanded="false"
             typeahead-on-select="validateProductName(editProductForm.editProductName, product.versionedId.id)"
             ng-model="editProduct.vendor" name="editProductVendor" ng-required="true"
             typeahead="vendor as vendor.name for vendor in vendors | filter:$viewValue:stateComparator | orderBy:'name'"
             typeahead-min-length="0" typeahead-editable="false"
             qt-typeahead-show-on-focus ng-trim="false"
             custom-style="{width: '97%', 'max-height': '160px', 'overflow-y': 'scroll'}">
      <i class="icn-sm icn-caret-gray"></i>

    </div>
  </div>

  <div class="col-4" ng-class="{'has-error': isShowingErrors(editProductForm, 'cost')}">
    <input type="text" class="form-control" placeholder="Cost" ng-model="editProduct.cost"
           name="cost" ng-change="validateSaleAndCost(editProductForm)"
           hard-reset-pattern="decimalNumberPattern" hard-reset-required="true">
  </div>

  <div class="col-5" ng-class="{'has-error': isShowingErrors(editProductForm, 'sale')}">
    <input type="text" class="form-control" placeholder="S. Price" ng-model="editProduct.sale"
           name="sale" ng-change="validateSaleAndCost(editProductForm)"
           hard-reset-pattern="decimalNumberPattern" hard-reset-required="true">
  </div>

  <div class="col-desc" ng-class="{'has-error': isShowingErrors(editProductForm, 'editProductDescription')}">
    <input type="text" class="form-control" placeholder="Description"
           ng-model="editProduct.description"
           ng-maxlength="500" name="editProductDescription">
  </div>

  <div class="qt-form-actions">

    <div class="pull-left text-error">{{ getValidationMessage(editProductForm) }}</div>

    <div class="btn btn-lg btn-info pull-right" ng-click="saveChangeProduct(editProductForm)"
         custom-disabled="{{ disabledSaveChangeButton }}">
      {{ product ? 'Save' : 'Add' }}
    </div>

    <div class="btn btn-lg btn-primary pull-right" ng-click="cancelEditProduct()">Cancel</div>
  </div>

</div>
