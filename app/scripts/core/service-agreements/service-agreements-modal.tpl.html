<div class="pass-man-popup">
  <div class="close-btn btn" ng-click="closeModal()" tabindex="1">
    <i class="icn-sm icn-remove-old"></i>
  </div>
  <p>Service Contracts</p>
  <form name="serviceContractForm">
    <div class="container">

      <div class="form-group">
        <label class="control-label">Service Bill type</label>
        <div uib-dropdown keyboard-nav="true">
          <button class="form-control form-control-dropdown account-type no-cursor has-dropdown"
                  uib-dropdown-toggle aria-expanded="true">
            {{serviceBillType[serviceContracts.contractType]}}
          </button>
          <i class="icn-sm icn-caret-gray"></i>
          <ul class="dropdown-menu dropdown-account-type">
            <li ng-repeat="(role, label) in serviceBillType" ng-click="changeCOntractType(role)">
              <a href="javascript:void(0)"> {{ label }} </a>
            </li>
          </ul>
        </div>
      </div>

      <div class="form-group panel">
        <div class="col-xs-6 clearfix">
          <label class="control checkbox pull-left">
            <input type="checkbox" ng-model="serviceContracts.isAdditionalServices">
            <span class="control-indicator"></span>
            We will our customers for additional services
          </label>
        </div>
      </div>

      <div class="form-group col-md-12">
        <ul>
          <li>
            <div class="col-md-4">Service Name</div>
            <div class="col-md-3">Per Houe</div>
            <div class="col-md-3">Make billable</div>
            <div class="col-md-2">Action</div>
          </li>
          <li ng-repeat="service in contactServiceList">
            <div class="col-md-3">
              <form name="inputServiceForm"><input type="text" ng-model="service.serviceName"></form>
            </div>
            <div class="col-md-3">
              <input type="number" ng-model="service.perHour">
            </div>
            <div class="col-md-3">

              <div class="col-xs-6 clearfix">
                <label class="control checkbox pull-left">
                  <input type="checkbox" ng-model="service.isBillable">
                  <span class="control-indicator"></span>
                </label>
              </div>
            </div>
            <div class="col-md-2">
              <div class="col-6" style="float: left;" ng-if="contactServiceList.length > 1 && !$last">
                <div class="btn-icn btn btn-primary has-tooltip" uib-tooltip="Remove" tooltip-placement="top"
                     ng-click="deleteService(service)">
                  <i style="margin-top: 12px;" class="icn-sm icn-remove-token-light"></i>
                </div>
              </div>

              <div style="float: left;" ng-if="$last">
                <div class="btn-icn btn btn-primary has-tooltip add-expense-btn" uib-tooltip="Add Product"
                     tooltip-placement="top"
                     ng-click="addNewService()">
                  <i class="icn-sm icn-plus" style="margin-top: 12px;"></i>
                </div>
              </div>
            </div>
          </li>
        </ul>
      </div>


    </div>
  </form>

</div>
