<div class="service-agreement-modal" ng-show="editMode">
  <div class="service-form-wrapper" ng-form="hourlyContractForm">
    <div class="hourly clearfix">
      <div class="close-btn btn" ng-click="closeModal()" tabindex="1">
        <i class="icn-sm icn-remove-old"></i>
      </div>

      <div class="service-header">
        <h4 class="title-services">Hourly Service</h4>
      </div>
      <div class="service-contract-details clearfix">
        <div class="col-md-7">
          <div class="form-group">
            Description
            <input placeholder="Description"
                   type="text"
                   class="form-control"
                   ng-model="editContract.description"
                   hard-reset-pattern="descriptionPattern" required>
          </div>
        </div>
        <div class="col-md-12"></div>
        <div class="col-md-3" style="margin-right: 33px;">
          <div class="form-group">
            Select Date:
            <input type="text"
                   class="form-control has-dropdown readonly-normal"
                   name="StartDate"
                   readonly
                   date-format="yyyy/mm/dd"
                   date-range-picker="startDatePicker"
                   min-date="{{today}}"
                   ng-model="editContract.startDate"
                   placeholder="Start Date" required>
            <i class="report-calendar"></i>
          </div>
        </div>
        <div class="col-md-3">
          <div class="form-group">
            <input style="margin-top: 25px;"
                   type="text"
                   class="form-control has-dropdown readonly-normal"
                   name="EndDate"
                   readonly
                   date-format="yyyy/mm/dd"
                   date-range-picker="endDatePicker"
                   min-date="{{minDateForEndDatePicker}}"
                   ng-model="editContract.endDate"
                   placeholder="End Date" required>
            <i class="report-calendar"></i>
          </div>
        </div>
      </div>

      <div class="service-bill-hide-content clearfix">

        <div class="col-md-4">Service name</div>
        <div class="col-md-2">Per hour</div>
        <div class="col-md-2 text-center">Make Billable</div>
        <div class="col-md-3 text-center">Tax</div>
        <div class="col-md-1 text-center">Action</div>
        <div class="bill-hide-content-item clearfix" ng-repeat="service in editContract.services">
          <div class="col-md-4 form-group"
               ng-class="{'has-error': checkHourlyServiceErrorForm(service)}">
            <input placeholder="Service Name" type="text" class="form-control" ng-model="service.name"
                   hard-reset-pattern="serviceNamePattern" required>
          </div>
          <div class="col-md-2 form-group before-icon">
            <input placeholder="0.00" type="text" class="form-control"
                   ng-model="service.rate"
                   hard-reset-pattern="decimalNumberPattern" qt-to-fixed="2">
          </div>
          <div class="col-md-2 fourm-group text-center">
            <label class="control checkbox">
              <input ng-model="service.billable" type="checkbox">
              <span class="control-indicator"></span>
            </label>
          </div>
          <div class="col-md-3 form-group text-center">
            <div>
              <div>
                <!--<i class="icn-sm icn-tax"> </i>-->
                <select-taxes taxes="taxes" entity="service"></select-taxes>
                <!--<p>{{service.taxes.length}}</p>-->
              </div>
            </div>
          </div>
          <div class="col-md-1 form-group text-center">
            <div class="add-remove-service">
              <div ng-click="deleteService(service)">
                <i class="icon-sm icn-delete"></i>
              </div>
            </div>
          </div>
        </div>

        <p style="padding-left: 15px;">Create new Service</p>

        <div class="bill-hide-content-item clearfix" ng-form="newServiceForm" ng-if="reinitNewServiceForm">
          <div ng-show="newServiceNameIsError">
            <p style="color: red;padding-left: 15px;">{{newServiceNameErrorMessage}}</p>
          </div>
          <div ng-show="!isNameUnique(editService.name) && editService.name">
            <p style="color: red;padding-left: 15px;">Duplicate name</p>
          </div>
          <div class="col-md-4 form-group" ng-class="{'has-error': isShowingErrors(newServiceForm, 'editServiceName')}">

            <input placeholder="New Service Name"
                   type="text"
                   name="editServiceName"
                   class="form-control"
                   ng-model="editService.name"
                   required hard-reset-pattern="serviceNamePattern"
                   invalid-when="!isNameUnique(editService.name)">
          </div>
          <div class="col-md-2 fourm-group before-icon">
            <input placeholder="0.00"
                   type="text"
                   class="form-control"
                   ng-model="editService.rate"
                   hard-reset-pattern="decimalNumberPattern" qt-to-fixed="2">
          </div>
          <div class="col-md-2 fourm-group text-center">
            <label class="control checkbox">
              <input type="checkbox" ng-model="editService.billable">
              <span class="control-indicator"></span>
            </label>
          </div>
          <div class="col-md-3 fourm-group text-center">
            <div class="" ng-hide="editContract.services.length > 19">
              <div>
                <select-taxes taxes="taxes" entity="editService" ></select-taxes>
                <!--<p>{{editService.taxes.length}}</p>-->
              </div>
            </div>
          </div>
          <div class="col-md-1 fourm-group text-center">
            <div class="add-remove-service" ng-hide="editContract.services.length > 19">
              <div ng-click="addNewService(newServiceForm, editService)">
                <i class="icon-sm icn-add-action"></i>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>
    <div class="col-md-12 agreement-fixed-button text-right">
      <div class="col-md-8" ng-show="showErrorInHourlyContract">
        <p style="color: red; text-align: left">{{errorMessage}}</p>
      </div>
      <div class="btn btn-success btn-create" ng-click="validateAndCreateHourlyContract(editService)"
           ng-disabled="dissableHourlyCreateButton()">Create
      </div>
      <!--<div class="btn btn-primary btn-create">Terminate</div>-->
    </div>

  </div>
</div>


<!--READONLY MODE-->

<div class="service-agreement-modal" ng-show="!editMode">
  <div ng-include="'/html/scripts/core/service-agreements/modal/hourly-service-preview-modal.tpl.html'"> </div>

</div>
