<div class="add-product clearfix" ng-repeat="addedProduct in products">
  <div class="col-1">
    <div class="col-wrapper dropdown">
      <input type="text" class="form-control form-control-dropdown dropdown-toggle" placeholder="Product" value="Printers   #18240" data-toggle="dropdown" aria-expanded="true" ng-model="addedProduct.item.name" tabindex="1">
      <input type="hidden" value="" ng-model="addedProduct.item.versionedId.id">
      <div class="dropdown-menu dropdown-menu-transparent">
        <ul class="dropdown-menu dropdown-menu-categories">
          <li role="presentation" ng-repeat=" category in productCategories" ng-click=" loadCategoryProducts($event, category);" ng-class="{active: category.isSelected}">
            <a role="menuitem" tabindex="-1" href="#">
              <span class="title" ng-bind="category.name"></span>
              <span class="pull-right total-count">{{category.productsAmount}} items</span>
              <span class="clearfix"></span>
            </a>
          </li>
        </ul>
        <ul class="dropdown-menu dropdown-menu-products">
          <li role="presentation" class="dropdown-header">
            <div class="form-group">
              <input type="text" class="form-control form-control-search form-control-dropdown-input" placeholder="Filter product..." ng-model="productFilter.query" ng-click="$event.stopPropagation();">
              <a href="#" class="close icn-remove-token" tabindex="-1"></a>
            </div>
          </li>
          <li>
            <ul class="subdropdown-menu dropdown-menu-products">

              <li role="presentation" ng-repeat="prod in catProducts | filter: searchProduct ">
                <a role="menuitem" tabindex="-1" href="javascript:void(0)" ng-click="selectProduct($event, prod, $parent.$index)">
                  <span class="title" ng-bind="prod.name"></span>
                  <!--span class="pull-right total-count">#{{ prod.code }}</span-->
                </a>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <div class="col-2">
    <div class="col-wrapper">
      <input type="text" class="form-control" placeholder="Description" value="" tabindex="2" ng-model="addedProduct.item.description">
    </div>
  </div>
  <div class="col-5">
    <div class="col-wrapper">
      <a href="javascript:void(0)" class="btn btn-cr btn-gray btn-remove-update pull-left tp-hide" data-toggle="tooltip" data-original-title="Remove Product" data-placement="top" ng-click="removeProduct($index);">
        <span class="icn-remove-update"></span>
      </a>
    </div>
  </div>
  <div class="col-4">
    <div class="col-wrapper">
      <input type="text" class="form-control" placeholder="Amount" value="" readonly="" ng-model="addedProduct.sum">
    </div>
  </div>
  <div class="col-3">
    <div class="col-wrapper">
      <input type="text" class="form-control" placeholder="Qty" value="" ng-model="addedProduct.quantity" tabindex="3">
    </div>
  </div>
</div> <!-- / added products -->
