<div class="qt-modal quote-email-modal">
    <div class="qt-modal__header">
        <div class="qt-modal__header-title qt-fw-600">Emall info</div>
        <div
            class="qt-modal__close qt-icon icon__close qt-pointer"
            (click)="onCheckForClose()"
        ></div>
    </div>
    <div class="qt-modal__body">
        <div class="qt-inputs-row">
            <div class="qt-input-block">
                <div class="qt-input-block__label">Subject</div>
                <input
                    type="text"
                    placeholder="Write Subject"
                    [(ngModel)]="subject"
                    (ngModelChange)="setSubject($event)"
                    maxlength="500"
                >
            </div>
        </div>
        <div
            class="qt-inputs-row"
            ngbDropdown
            container="body"
            (openChange)="onToggleDropDown($event)"
        >
            <div class="qt-input-block email-selects quote-email-dropdown-container">
                <div class="qt-input-block__label">Recipient Email Address</div>
                <app-mat-form-field #formField>
                    <app-mat-chip-list
                        #chipList
                        ngbDropdownAnchor
                        id="dropdownServices"
                        aria-label="Fruit selection"
                        [items]="selectedUsers"
                        (onChangeItems)="formField.checkSelectedItems(selectedUsers)"
                    >
                        <app-mat-chip
                            *ngFor="let user of selectedUsers; let i = index"
                            [isRemove]="removable"
                            (onClose)="remove(i)"
                        >
                            {{user}}
                        </app-mat-chip>
                        <input
                            placeholder="Add receipt email address"
                            #userInput
                            class="pointer"
                            ngbDropdownToggle
                            [formControl]="userCtrl"
                            autocomplete="new-password"
                            (input)="onSearch($event)"
                            (keyup)="keyup($event)"
                            (blur)="onAdd($event)"
                        >
                    </app-mat-chip-list>
                    <div
                        class="app-drop-down__dropdown"
                        ngbDropdownMenu
                        aria-labelledby="dropdownServices"
                    >
                        <div
                            class="qt-df user-container pointer"
                            *ngFor="let user of usersClients"
                            ngbDropdownItem
                            (click)="selected(user)"
                        >
                            <div class="qt-df">
                                <div
                                    class="assigne-user-avatar qt-mr-12"
                                    [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                                    [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                                ></div>
                                <div>
                                    <div class="user-name qt-mb-2">{{getFirstLastName(user)}}</div>
                                    <div class="user-email qt-mb-2">{{user.primaryEmail}}</div>
                                    <div
                                        class="qt-df qt-ai-c"
                                        *ngIf="companyId && getJobTitleDto(user)"
                                    >
                                        <div class="qt-icon icon__permission-role qt-sz-16 qt-mr-4"></div>
                                        <span
                                            class="user-description"
                                            [textContent]="getJobTitleDto(user).name"
                                        ></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <hr>
                        <div
                            class="qt-df user-container pointer"
                            *ngFor="let user of usersTechnical"
                            ngbDropdownItem
                            (click)="selected(user)"
                        >
                            <div class="qt-df">
                                <div
                                    class="assigne-user-avatar qt-mr-12"
                                    [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                                    [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                                ></div>
                                <div>
                                    <div class="user-name qt-mb-2">{{getFirstLastName(user)}}</div>
                                    <div class="user-email qt-mb-2">{{user.primaryEmail}}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </app-mat-form-field>
                <div
                    *ngIf="showError"
                    class="invalid-feedback"
                >
                    at least 1 user
                </div>
            </div>
        </div>
        <div class="qt-inputs-row">
            <div class="qt-input-block">
                <div class="qt-input-block__label">Message</div>
                <textarea
                    class="qt-input-block__textarea"
                    placeholder="Write message here…"
                    [(ngModel)]="message"
                    appTextArea
                    cols="5"
                    rows="5"
                    (ngModelChange)="setMessage($event)"
                ></textarea>
            </div>
        </div>
    </div>
    <div class="qt-modal__footer">
        <button
            class="qt-button --gray qt-mr-12 qt-w100 qt-jc-c"
            (click)="onCheckForClose()"
        >
            Cancel
        </button>
        <button
            class="qt-button qt-w100 qt-jc-c"
            (click)="save()"
        >
            Send Message
        </button>
    </div>
</div>
