<div class="confirm-modal image-confirm-modal">
    <div class="qt-df qt-jc-sb qt-ai-c qt-mb-20">
        <div class="confirm-modal__title qt-d-none qt-d-md-block">Crop Logo</div>
        <div
            class="close-modal"
            (click)="cancelConfirm()"
            tabindex="1"
        ></div>
    </div>
    <div
        class="image-confirm-modal__body"
        *ngIf="show"
    >
        <image-cropper
            #imageCroper
            [imageBase64]="imageBase64"
            [maintainAspectRatio]="true"
            [aspectRatio]="4 / 3"
            [resizeToWidth]="128"
            (cropperReady)="cropperReady()"
            format="png"
            (imageCropped)="imageCropped($event)"
        ></image-cropper>
        <img [src]="img">
    </div>
    <div class="image-confirm-modal__footer">
        <div class="d-f jc-fe">
          <a
            href="javascript:;"
            class="qt-button --gray qt-jc-c qt-w100 qt-mr-12"
            data-dismiss='modal'
            (click)="cancelConfirm()"
          >
            Cancel
          </a>
            <a
                href="javascript:;"
                class="qt-button qt-jc-c qt-w100"
                (click)="approveConfirm()"
            >
              Upload
            </a>
        </div>
    </div>
</div>
<div
    class="image-confirm-modal__overlay"
    [ngClass]="{'--open':show}"
></div>
