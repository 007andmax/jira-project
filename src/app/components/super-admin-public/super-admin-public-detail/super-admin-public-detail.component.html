<div class="topic-detail-page">
    <div class="topic-detail-page__header">
        <a
            href="javascript:;"
            class="qt-logo pointer"
            alt="Quicktech logo"
            (click)="gotoHelpCenter()"
        >
            <span class="qt-logo__quicktech icon__quicktech-logo"></span>
            <span class="qt-logo__beta">Beta</span>
        </a>
        <div class="qt-df qt-jc-sb qt-ai-c qt-f-1">
            <div class="qt-page-list__search">
                <input
                    type="text"
                    placeholder="Search Help Topics"
                >
            </div>
            <div class="icon__help-center qt-bg-contain qt-sz-24 pointer qt-ml-16 qt-mr-16"></div>
        </div>
    </div>
    <div class="topic-detail-page__body">
        <div class="topic-detail-page__body-left-panel">
            <div class="container-categories">
                <div class="category-item category-item-category-body">
                    <div class="category-item-category">
                        <div
                            class="category-item-category__name"
                            (click)="gotoHelpCenter()"
                        >
                            <span class="category-item-category__help-center pointer">Help center</span>
                        </div>
                    </div>
                </div>
                <ng-template
                    ngFor
                    let-category
                    [ngForOf]="categories"
                    [ngForTrackBy]="trackById"
                >
                    <div [attr.id]="category.id">
                        <div class="category-item category-item-category-body">

                            <div
                                class="category-item-category__name"
                                [ngClass]="{'--active':selectedCategory && selectedCategory.id === category.id}"
                            >
                                <div
                                    class="icon__down-arrow qt-mr-8 qt-sz-16 qt-bg-contain pointer"
                                    [ngClass]="{'toggle-category':category.toggleSubCategory}"
                                    (click)="category.toggleSubCategory = !category.toggleSubCategory"
                                    *ngIf="category.subcategories.length > 0"
                                ></div>
                                <span
                                    [ngClass]="{'pointer':category.document}"
                                    [textContent]="category.name"
                                    (click)="showPreview(category)"
                                ></span>
                            </div>

                        </div>
                        <div
                            class="category-item-sub-category qt-ml-20"
                            *ngIf="category.toggleSubCategory"
                        >
                            <ng-template
                                ngFor
                                let-subcategory
                                [ngForOf]="category.subcategories"
                                [ngForTrackBy]="trackById"
                            >
                                <div
                                    class="category-item-sub-category-body"
                                    [attr.id]="subcategory.id"
                                    [attr.category-id]="category.id"
                                >
                                    <div class="category-item-category">
                                        <div
                                            class="category-item-category__name"
                                            [ngClass]="{'--active':selectedCategory && selectedCategory.id === subcategory.id}"
                                        >
                                            <div
                                                class="icon__down-arrow qt-mr-8 qt-sz-16 qt-bg-contain pointer"
                                                [ngClass]="{'toggle-category':subcategory.toggleSubCategory}"
                                                (click)="subcategory.toggleSubCategory = !subcategory.toggleSubCategory"
                                                *ngIf="subcategory.subcategories.length > 0"
                                            ></div>
                                            <span
                                                [ngClass]="{'pointer':subcategory.document}"
                                                [textContent]="subcategory.name"
                                                (click)="showPreview(subcategory)"
                                            ></span>
                                        </div>

                                    </div>
                                    <div
                                        class="category-item-sub-sub-category"
                                        *ngIf="subcategory.toggleSubCategory"
                                    >
                                        <ng-template
                                            ngFor
                                            let-subsubcategory
                                            [ngForOf]="subcategory.subcategories"
                                            [ngForTrackBy]="trackById"
                                        >
                                            <div
                                                class="category-item-sub-sub-category-body"
                                                [attr.id]="subsubcategory.id"
                                                [attr.category-id]="subcategory.id"
                                            >
                                                <div class="category-item-category">
                                                    <div
                                                        class="category-item-category__name"
                                                        [ngClass]="{'--active':selectedCategory && selectedCategory.id === subsubcategory.id}"
                                                    >
                                                        <div
                                                            class="icon__down-arrow qt-mr-8 qt-sz-16 qt-bg-contain pointer"
                                                            [ngClass]="{'toggle-category':subsubcategory.toggleSubCategory}"
                                                            (click)="subsubcategory.toggleSubCategory = !subsubcategory.toggleSubCategory"
                                                            *ngIf="subsubcategory.subcategories.length > 0"
                                                        ></div>
                                                        <span
                                                            [ngClass]="{'pointer':subsubcategory.document}"
                                                            [textContent]="subsubcategory.name"
                                                            (click)="showPreview(subsubcategory)"
                                                        ></span>
                                                    </div>
                                                </div>

                                                <div
                                                    class="category-item-sub-sub-sub-category"
                                                    *ngIf="subsubcategory.toggleSubCategory"
                                                >
                                                    <ng-template
                                                        ngFor
                                                        let-subsubsubcategory
                                                        [ngForOf]="subsubcategory.subcategories"
                                                        [ngForTrackBy]="trackById"
                                                    >
                                                        <div
                                                            class="category-item-sub-sub-sub-category-body"
                                                            [attr.id]="subsubsubcategory.id"
                                                            [attr.category-id]="subsubcategory.id"
                                                        >
                                                            <div class="category-item-category">
                                                                <div class="category-item-category">
                                                                    <div
                                                                        class="category-item-category__name"
                                                                        [ngClass]="{'--active':selectedCategory && selectedCategory.id === subsubsubcategory.id}"
                                                                    >
                                                                        <span
                                                                            [ngClass]="{'pointer':subsubsubcategory.document}"
                                                                            [textContent]="subsubsubcategory.name"
                                                                            (click)="showPreview(subsubsubcategory)"
                                                                        ></span>
                                                                    </div>
                                                                </div>

                                                            </div>
                                                        </div>
                                                    </ng-template>
                                                </div>
                                            </div>
                                        </ng-template>
                                    </div>
                                </div>
                            </ng-template>
                        </div>
                    </div>
                </ng-template>

        <div
            class="topic-detail-page__body-content"
            [hidden]="!supportPageCategoryContent.document"
        >
            <div id="content"></div>
            <div class="profile-cmp-board tags-area d-flex">

                <div class="tags-tab d-flex">
                    <span
                        class="tag"
                        *ngFor="let tag of supportPageCategoryContent.tags; let i = index;"
                    >
                        {{tag.word}}
                    </span>
                </div>
            </div>
        </div>
