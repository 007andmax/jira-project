<div
    class="filter-tags-body --required"
    ngbDropdown
    (openChange)="openChange($event)"
    #dp="ngbDropdown"
>
    <app-mat-form-field
        ngbDropdownAnchor
        #formField
        [placeholder]="'Search By Associated Companies'"
    >
        <app-mat-chip-list>
            <app-mat-chip
                *ngFor="let company of selectedCompanies; let i = index"
                (onClose)="remove(i)"
                [isRemove]="getPermissions('EDIT_COMPANIES')"
            >
                {{company.name}}
            </app-mat-chip>
            <input
                id="dropdownServices"
                ngbDropdownToggle
                #userInput
                class="pointer"
                [formControl]="tagCtrl"
                (input)="onSearch($event)"
                [disabled]="!getPermissions('EDIT_COMPANIES')"
            >
            <!-- (keyup)="onKeyUp($event)" -->
        </app-mat-chip-list>
    </app-mat-form-field>
    <div
        class="select-wrapper"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <div
            class="content"
            (click)="$event.preventDefault()"
        >
            <ng-template
                ngFor
                let-item
                let-i="index"
                [ngForOf]="companies"
                [ngForTrackBy]="trackById"
            >
                <div
                    (click)="toggleItem(item)"
                    class="company-tag-item"
                    [ngClass]="{'is-hover':item.isHover,'--selected':isSeleted(item)}"
                    [id]="'company-' + item.id"
                >
                    <label class="qt-checkbox pointer">
                        <input
                            type="checkbox"
                            [checked]="isSeleted(item)"
                            readonly
                        >
                        <span></span>
                        <div class="text-content">
                            <div class="name">{{item.name}}</div>
                        </div>
                    </label>
                </div>
            </ng-template>
        </div>
    </div>
</div>
