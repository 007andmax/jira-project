<div class="cmp-board-tickets cmn-box qt-df">
    <div class="cmp-board-title-wrap qt-df">
        <h6>Tickets</h6>
        <div
            ngbDropdown
            class="qt-df qt-ai-c"
        >
            <div class="qt-icon icon__calendar qt-sz-20 qt-fs-0"></div>
            <button
                class="selected-item"
                id="dropdownBasic1"
                ngbDropdownToggle
                [textContent]="ticketFrequency"
            ></button>
            <div
                ngbDropdownMenu
                aria-labelledby="dropdownBasic1"
            >
                <button
                    class="item"
                    ngbDropdownItem
                    (click)="getTicketGraph('Monthly')"
                >
                    Monthly
                </button>
                <button
                    class="item"
                    ngbDropdownItem
                    (click)="getTicketGraph('Weekly')"
                >
                    Weekly
                </button>
                <button
                    class="item"
                    ngbDropdownItem
                    (click)="getTicketGraph('Daily')"
                >
                    Daily
                </button>
            </div>
            <div class="qt-icon icon__arrow-down qt-sz-16 qt-fs-0"></div>
        </div>
    </div>
    <div
        class="prelaoder-body"
        *ngIf="showPreloader"
    >
        <div class="loading pengind-loading"></div>
    </div>
    <ngx-charts-line-chart
        #nvd3
        [legend]="true"
        [legendPosition]="'below'"
        [view]="[710,250]"
        *ngIf="!showPreloader"
        [scheme]="chartColors"
        [showXAxisLabel]="true"
        [showYAxisLabel]="true"
        [xAxisTickFormatting]="xAxisTickFormatting"
        [trimXAxisTicks]="false"
        [xAxis]="true"
        [yAxis]="true"
        [results]="lineData"
    >
        <ng-template
            #seriesTooltipTemplate
            let-model="model"
        >
            <div>
                <span
                    class="position-right tooltip-caret"
                    style="top: 44.9844px; left: -7px;display: none;"
                ></span>
                <div class="tooltip-content">
                    <span>
                        {{xAxisTickFormattingChart(model[0].name)}}
                        <div class="area-tooltip-container">
                            <ng-template
                                ngFor
                                let-item
                                [ngForOf]="model"
                            >
                                <div
                                    class="tooltip-item"
                                    style="width: max-content;"
                                >
                                    <span
                                        class="tooltip-item-color"
                                        [ngStyle]="{'background-color':item.color}"
                                    ></span>
                                    {{item.series}}: {{item.value}}
                                </div>
                            </ng-template>
                            <!--  -->
                        </div>
                        <!--  -->
                    </span>
                    <!--  -->
                    <!--  -->
                </div>
            </div>
        </ng-template>
    </ngx-charts-line-chart>
</div>
