<div
    class="cmp-board-invoice cmn-box qt-df"
    *ngIf="recentInvoiceList.length > 0"
>
    <h6>Recent Invoices</h6>
    <div class="cmp-dash-table-wrap">
        <table *ngIf="recentInvoiceList.length > 0">
            <thead>
                <tr>
                    <th>Invoice#</th>
                    <th>Date</th>
                    <th>Status</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody>
                <ng-template
                    ngFor
                    let-invoice
                    [ngForOf]="recentInvoiceList"
                    [ngForTrackBy]="trackById"
                >
                    <tr *ngIf="invoice.status != 'ROLLBACK'">
                        <td
                            (click)="onPreviewInvoice(invoice)"
                            class="pointer"
                        >
                            {{invoice.number}}
                        </td>
                        <td>{{invoice.dateName}}</td>
                        <td
                            *ngIf="invoice.paidOn"
                            class="paid"
                        >
                            Paid
                        </td>
                        <td
                            *ngIf="invoice.isOverDue && !invoice.paidOn"
                            class="ov-d"
                        >
                            Over Due
                        </td>
                        <td
                            *ngIf="!invoice.isOverDue && !invoice.paidOn"
                            class="ov-d"
                        >
                            Outstanding
                        </td>
                        <td>{{invoice.totalSum | currency}}</td>
                    </tr>
                </ng-template>
            </tbody>
        </table>
    </div>
</div>
