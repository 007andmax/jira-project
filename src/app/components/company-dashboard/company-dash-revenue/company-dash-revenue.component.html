<div>
    <div class="cmp-board-title-wrap qt-df">
        <h6>Invoice Revenue</h6>
        <div
            ngbDropdown
            [placement]="'bottom-right'"
            class="qt-df qt-ai-c"
        >
            <button
                class="selected-item"
                id="dropdownBasic1"
                ngbDropdownToggle
                [textContent]="'Last ' + month + ' months'"
            ></button>
            <div
                ngbDropdownMenu
                aria-labelledby="dropdownBasic1"
            >
                <button
                    class="item"
                    ngbDropdownItem
                    (click)="getInvoiceRevenue('12')"
                >
                    Last 12 months
                </button>
                <button
                    class="item"
                    ngbDropdownItem
                    (click)="getInvoiceRevenue('6')"
                >
                    Last 6 months
                </button>
                <button
                    class="item"
                    ngbDropdownItem
                    (click)="getInvoiceRevenue('3')"
                >
                    Last 3 months
                </button>
            </div>
            <div class="qt-icon icon__arrow-down qt-sz-16 qt-fs-0"></div>
        </div>
    </div>
    <div class="donalt-chart-wrapper">
        <!-- <nvd3
            [options]="chartOptions"
            [data]="data"
        ></nvd3> -->
        <div class="chart-content">
            <h4
                class
                [textContent]="'$' + totalRevenue"
            ></h4>
            <span>Total Revenue</span>
        </div>
    </div>
    <ul class=" list-unstyled chart-status">
        <li class="invoice">
            <span class="title">Invoiced</span>
            <span
                class="title-data"
                [textContent]="'$' + invoicedSum"
            ></span>
        </li>
        <li class="collect">
            <span class="title">Collected</span>
            <span
                class="title-data"
                [textContent]="'$' + collectedSum"
            ></span>
        </li>
        <li class="out-standing">
            <span class="title">Outstanding</span>
            <span
                class="title-data"
                [textContent]="'$' + outstandingSum"
            ></span>
        </li>
    </ul>
</div>
