<div class="cmp-dboard-stastics cmn-box qt-df">
    <ul class="list-unstyled qt-df">
        <li class="qt-df">
            <div class="cmp-profile-dp qt-df">
                <figure class="qt-dflex">
                    <span class="qt-icon icon__users qt-sz-20 qt-dib"></span>
                </figure>
            </div>
            <div class="stastics-info qt-df">
                <h4 class>{{countUsers}}</h4>
                <span>Total Users</span>
            </div>
        </li>
        <li class="qt-df">
            <div class="cmp-profile-dp qt-df">
                <figure class="qt-dflex">
                    <span class="qt-icon icon__devices qt-sz-20 qt-dib"></span>
                </figure>
            </div>
            <div class="stastics-info qt-df">
                <h4 class>{{countDevices}}</h4>
                <span>Total Devices</span>
            </div>
        </li>
        <li class="qt-df">
            <div class="cmp-profile-dp qt-df">
                <figure class="qt-dflex">
                    <span class="icon__tickets-on-time qt-bg-contain qt-sz-20 qt-dib"></span>
                </figure>
            </div>
            <div class="stastics-info qt-df">
                <h4 class>{{totalTickets}}</h4>
                <span>Total Tickets</span>
            </div>
        </li>
        <li class="qt-df">
            <div class="cmp-profile-dp qt-df">
                <figure class="qt-dflex">
                    <span class="icon__avg-response qt-bg-contain qt-sz-20 qt-dib"></span>
                </figure>
            </div>
            <div class="stastics-info qt-df">
                <h4 class>{{averageResponseTime}} min</h4>
                <span>Avg. Response time</span>
            </div>
        </li>
    </ul>
</div>
