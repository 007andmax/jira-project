<div class="cmp-dashboard-body">
    <div
        class="loading"
        *ngIf="showPreloader"
    ></div>
    <div
        class="cmp-dboard-container d-flex"
        [hidden]="showPreloader"
    >
        <div class="cmp-dboard-row d-flex">
            <app-company-dash-detail
                class="cmp-dboard-col left-profilebar cmn-box d-flex"
                (companyNameChanged)="companyNameChangedHandler($event)"
                (totalTicketsChanged)="totalTicketsChangedHandler($event)"
                (averageResponseTimeChanged)="averageResponseTimeChangedHandler($event)"
                (companyChanged)="onCompanyChanged($event)"
            ></app-company-dash-detail>
            <div
                class="cmp-dboard-col right-stasticsbar d-flex"
                *ngIf="company && (company.clientType === 'VENDOR' || company.clientType === 'SUPPLIER') && !appService.checkMobile()"
            >
                <company-dash-associate [company]="company"></company-dash-associate>
            </div>
            <div
                class="cmp-dboard-col right-stasticsbar d-flex"
                *ngIf="company && company.clientType !== 'VENDOR' && company.clientType !== 'SUPPLIER' && !appService.checkMobile()"
            >
                <app-company-dash-stats
                    [totalTickets]="totalTickets"
                    [averageResponseTime]="averageResponseTime"
                ></app-company-dash-stats>
                <app-company-dash-ticket></app-company-dash-ticket>
                <div class="cmp-board-information d-flex">
                    <div class="cmp-board-info-row d-flex">
                        <div class="cmp-board-info-col d-flex">
                            <app-company-dash-revenue
                                *ngIf="getPermissions('VIEW_ACCOUNTING')"
                                class="cmp-board-revenue cmn-box d-flex"
                            ></app-company-dash-revenue>
                            <app-company-dash-invoice
                                *ngIf="getPermissions('VIEW_ACCOUNTING')"
                                [companyName]="companyName"
                            ></app-company-dash-invoice>
                        </div>
                        <div class="cmp-board-info-col d-flex">
                            <app-company-dash-contract *ngIf="getPermissions('VIEW_SERVICE_AGREEMENTS')"></app-company-dash-contract>
                            <company-dash-associate-info
                                class="d-flex"
                                [company]="company"
                            ></company-dash-associate-info>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<app-company-edit-aside></app-company-edit-aside>
