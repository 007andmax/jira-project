<div class="cmp-board-invoice cmn-box qt-df">
    <h6>Associated companies</h6>
    <div class="cmp-dash-table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Phone</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let item of company.associatedCompanies">
                    <td [textContent]="getCompanyName(item.id)"></td>
                    <td>
                        <preview-phone-mask
                            *ngIf="getPhoneNumber(item.id)"
                            [number]="getPhoneNumber(item.id)"
                        ></preview-phone-mask>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
