<div
    class="item-file-container"
    ngbDropdown
>
    <div class="qt-sz-48 qt-bg-contain qt-mb-8 qt-fs-0 icon__folder-type"></div>
    <div class>
        <h3 [textContent]="item.name"></h3>
    </div>
    <div
        class="qt-button --square-md --gray pointer actions"
        ngbDropdownToggle
    >
        <div class="icon__more qt-sz-16 qt-bg-contain"></div>
    </div>
    <div
        ngbDropdownMenu
        class="dropdown-menu-qt icon__more-dropdown"
    >
        <ul
            class
            role="menu"
            class="dropdown-qt"
        >
            <li
                class="pointer"
                ngbDropdownItem
                (click)="rename()"
            >
                <div class="icon__go-to qt-sz-16 qt-bg-contain qt-mr-8"></div>
                Rename
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                (click)="fileInfo()"
            >
                <div class="icon__company-info qt-sz-16 qt-bg-contain qt-mr-8"></div>
                File Info
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                class="remove-item"
                (click)="removeCategory()"
            >
                <div class="icon__remove qt-sz-16 qt-bg-contain qt-mr-8"></div>
                Delete
            </li>
        </ul>
    </div>
</div>

<div
    class="qt-table-modern__row"
    *ngIf="false"
>
    <div
        class="documents-table__title ellipsis pointer"
        (click)="navigateToCategory()"
    >
        <div class="documents-table__title-menu ellipsis">
            <div class="qt-sz-16 qt-bg-contain qt-mr-8 qt-fs-0 icon__folder"></div>
            <div
                class="title ellipsis"
                [textContent]="item.name"
            ></div>
        </div>
    </div>
    <div
        class="documents-table__create-by ellipsis pointer"
        (click)="navigateToCategory()"
    ></div>
    <div
        class="documents-table__menu"
        (click)="$event.stopPropagation();"
    >
        <div
            ngbDropdown
            [container]="'body'"
            [placement]="'bottom-right'"
        >
            <div
                class="qt-ic-c icon__more  qt-pointer qt-sz-16 qt-bg-contain"
                id="dropdownBasic1"
                ngbDropdownToggle
            ></div>
            <ul
                class="qt-dropdown-menu"
                ngbDropdownMenu
                aria-labelledby="dropdownBasic1"
            >
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="rename()"
                >
                    <div class="icon__rename-folder qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Rename
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    class="remove-item"
                    (click)="removeCategory()"
                >
                    <div class="icon__remove qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Delete
                </li>
            </ul>
        </div>
    </div>
</div>
