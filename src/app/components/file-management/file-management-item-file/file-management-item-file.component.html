<div class="item-file-container">
    <div
        class="qt-sz-48 qt-bg-contain qt-mb-8 qt-fs-0"
        [ngClass]="{'icon__file-type-pdf': item.contentType == 'application/pdf',
    'icon__file-type-txt': item.contentType == 'text/plain',
 'icon__file-type-csv': item.contentType == 'text/csv',
'icon__file-type-doc': item.contentType == 'application/msword',
'icon__file-type-html': item.contentType == 'text/html',
'icon__file-type-odt': item.contentType == 'application/vnd.oasis.opendocument.text'}"
        *ngIf="!isImage()"
    ></div>
    <div
        class="qt-sz-48 qt-bg-contain qt-mb-8 qt-fs-0"
        *ngIf="isImage()"
    >
        <img [src]="item.url">
    </div>
    <div class>
        <h3 [textContent]="item.name"></h3>
        <span [textContent]="getCreateBy()"></span>
    </div>
</div>

<div
    class="qt-table-modern__row"
    *ngIf="false"
>
    <div
        class="documents-table__title ellipsis pointer"
        (click)="preview()"
    >
        <div class="documents-table__title-menu ellipsis">
            <div class="qt-sz-16 qt-bg-contain qt-mr-8 qt-fs-0 icon__templete-thumb"></div>
            <div
                class="title ellipsis"
                [textContent]="item.name"
            ></div>
        </div>
    </div>
    <div
        class="documents-table__create-by ellipsis pointer"
        [textContent]="getCreateBy()"
        (click)="preview()"
    ></div>
    <div
        class="documents-table__menu"
        (click)="$event.stopPropagation();"
    >
        <div
            ngbDropdown
            [container]="'body'"
            [placement]="'bottom-right'"
        >
            <div
                class="qt-ic-c icon__more  qt-pointer qt-sz-16 qt-bg-contain"
                id="dropdownBasic1"
                ngbDropdownToggle
            ></div>
            <ul
                class="qt-dropdown-menu"
                ngbDropdownMenu
                aria-labelledby="dropdownBasic1"
            >
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="download()"
                >
                    <div class="icon__go-to qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Download
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    class="remove-item"
                    (click)="remove()"
                >
                    <div class="icon__remove qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Delete
                </li>
            </ul>
        </div>
    </div>
</div>
