<div
    class="item-file-container"
    ngbDropdown
    (click)="fileInfo()"
>
    <div class="item-file-avatar qt-df qt-ai-c qt-jc-c qt-mb-12">
        <div
            class="qt-sz-64 qt-bg-contain qt-mb-8 qt-fs-0"
            [ngClass]="{'icon__file-type-pdf': item.contentType == 'application/pdf',
    'icon__file-type-txt': item.contentType == 'text/plain',
 'icon__file-type-csv': item.contentType == 'text/csv',
'icon__file-type-doc': item.contentType == 'application/msword',
'icon__file-type-html': item.contentType == 'text/html',
'icon__file-type-odt': item.contentType == 'application/vnd.oasis.opendocument.text'}"
            *ngIf="!isImage()"
        ></div>
        <div
            class="qt-sz-64 qt-bg-contain qt-mb-8 qt-fs-0"
            *ngIf="isImage()"
        >
            <img
                width="48px"
                [src]="item.url"
            >
        </div>
    </div>
    <div class>
        <span
            class="item-file-h"
            [textContent]="item.name"
        ></span>
        <div class="qt-df qt-ai-c">
            <span [textContent]="getCreateBy()"></span>
            <span
                class="item-file-type qt-ml-16"
                [textContent]="getTypeFile()"
            ></span>
        </div>
    </div>
    <div
        class="qt-button --square-md --gray pointer actions"
        ngbDropdownToggle
        (click)="$event.stopPropagation();"
    >
        <div class="icon__more qt-sz-16 qt-bg-contain"></div>
    </div>
    <div
        ngbDropdownMenu
        class="dropdown-menu-qt icon__more-dropdown"
        (click)="$event.stopPropagation();"
    >
        <ul
            class
            role="menu"
            class="dropdown-qt"
        >
            <li
                class="pointer"
                ngbDropdownItem
                (click)="download()"
            >
                <div class="icon__download  qt-sz-20 qt-bg-contain qt-mr-12"></div>
                Download
            </li>
            <li
                class="pointer qt-dropdown-menu__item-red qt-dropdown-menu__top-line qt-color-red-600"
                ngbDropdownItem
                (click)="remove()"
            >
                <div class="icon__remove icon__remove--red-600 qt-bg-contain qt-sz-20 qt-mr-12"></div>
                Delete
            </li>
        </ul>
    </div>
</div>
