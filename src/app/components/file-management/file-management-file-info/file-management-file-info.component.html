<div class="left-panel-ng2__content--filters aside-filters-content__main">
    <div class="content-filters-header">
        <div
            class="icon__close-white qt-sz-20 qt-bg-contain"
            (click)="close()"
        ></div>
        <div class="content-filters-header__title pointer"></div>
    </div>
    <form [formGroup]="modelForm">
        <div class="file-info-avatar qt-df qt-fd-c qt-ai-c qt-mb-16 qt-pb-16">
            <div
                class="qt-sz-80 qt-bg-contain qt-mb-16 qt-fs-0"
                [ngClass]="{'icon__file-type-pdf': file && file.contentType == 'application/pdf',
    'icon__file-type-txt': file && file.contentType == 'text/plain',
 'icon__file-type-csv': file && file.contentType == 'text/csv',
'icon__file-type-doc': file && file.contentType == 'application/msword',
'icon__file-type-html': file && file.contentType == 'text/html',
'icon__file-type-odt': file && file.contentType == 'application/vnd.oasis.opendocument.text',
'icon__folder': category}"
                *ngIf="file && !isImage() || category"
            ></div>
            <div
                class="qt-sz-80 qt-bg-contain qt-mb-16 qt-fs-0"
                *ngIf="isImage()"
            >
                <img
                    width="80px"
                    [src]="file.url"
                >
            </div>
            <div class="error-container qt-df qt-ai-c">
                <input
                    class="qt-editable-input qt-fs-16 qt-fw-500 qt-color-gray-900 file-info-name"
                    type="text"
                    [ngClass]="{'--input-error' : submitted && f2.name.errors}"
                    formControlName="name"
                    maxlength="100"
                    (blur)="onChange()"
                    appKeyUpEnter
                    (onChange)="onChange()"
                >
                <mat-error
                    class="invalid-feedback"
                    *ngIf="submitted && f2.name.errors"
                >
                    Field is required
                </mat-error>
                <div class="qt-button --square-md --gray qt-ml-8 info-file-label-edit">
                    <div class="icon__edit qt-sz-16 qt-bg-contain"></div>
                </div>
            </div>
        </div>
        <div class="file-info-field qt-df qt-ai-c qt-mb-16">
            <span class="file-info-field-header qt-fs-12 qt-color-gray-500">File Type</span>
            <span
                class="file-info-field-header qt-fs-14 qt-color-gray-900"
                *ngIf="category"
            >
                Folder
            </span>
            <span
                class="qt-fs-14 qt-color-gray-900"
                *ngIf="file && file.contentType == 'application/pdf'"
            >
                PDF
            </span>
            <span
                class="qt-fs-14 qt-color-gray-900"
                *ngIf="file && (file.contentType == 'text/plain' || file.contentType == 'application/msword' || file.contentType == 'application/vnd.oasis.opendocument.text')"
            >
                Document
            </span>
            <span
                class="qt-fs-14 qt-color-gray-900"
                *ngIf="file && file.contentType == 'text/csv'"
            >
                CSV
            </span>
            <span
                class="qt-fs-14 qt-color-gray-900"
                *ngIf="file && file.contentType == 'text/html'"
            >
                HTML
            </span>
        </div>
        <div class="file-info-field qt-df qt-ai-c qt-mb-16">
            <span class="file-info-field-header qt-fs-12 qt-color-gray-500">Created on</span>
            <span
                class="qt-fs-14 qt-color-gray-900"
                [textContent]="file && file.createdAt || category && category.createdAt"
            ></span>
        </div>
        <div class="file-info-field qt-df qt-ai-c qt-mb-16">
            <span class="file-info-field-header qt-fs-12 qt-color-gray-500">Edited on</span>
            <span
                class="qt-fs-14 qt-color-gray-900"
                [textContent]="file && file.createdAt || category && category.createdAt"
            ></span>
        </div>
        <div class="file-info-field qt-df qt-ai-c qt-mb-16">
            <span class="file-info-field-header qt-fs-12 qt-color-gray-500">Author</span>
            <span
                class="qt-fs-14 qt-color-gray-900"
                [textContent]="file && file.uploaderName || category && category.creatorName"
            ></span>
        </div>
        <div
            class="file-info-description file-info-field qt-mb-16 qt-pt-16 qt-pb-16"
            *ngIf="file"
        >
            <div class="file-info-field-header qt-fs-12 qt-color-gray-500 qt-mb-8">Description</div>
            <textarea
                class="qt-editable-input"
                appTextArea
                [(ngModel)]="file.description"
                maxlength="1000"
                [default]="2"
                cols="2"
                rows="1"
                (blur)="onChange()"
                [ngModelOptions]="{standalone: true}"
            ></textarea>
        </div>
    </form>
    <app-file-management-file-info-tags
        *ngIf="file"
        [selectedTag]="selectedTags"
        (tagsChange)="onChangeTags($event)"
        (tagsRemove)="onChangeTags($event)"
    ></app-file-management-file-info-tags>
</div>
<div class="aside-filters-content__footer">
    <div class="qt-df qt-ai-c qt-jc-c qt-w100 info-file-view pointer">
        <span class="icon__view qt-sz-16 qt-bg-contain qt-mr-8 pointer"></span>
        View
    </div>
</div>
