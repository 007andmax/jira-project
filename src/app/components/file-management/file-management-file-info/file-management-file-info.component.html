<div class="left-panel-ng2__content--filters aside-filters-content__main">
    <div class="content-filters-header">
        <div
            class="icon__close-white qt-sz-20 qt-bg-contain"
            (click)="close()"
        ></div>
        <div class="content-filters-header__title pointer">File Info</div>
    </div>
    <div>
        <div
            class="qt-sz-48 qt-bg-contain qt-mb-8 qt-fs-0"
            [ngClass]="{'icon__file-type-pdf': file.contentType == 'application/pdf',
    'icon__file-type-txt': file.contentType == 'text/plain',
 'icon__file-type-csv': file.contentType == 'text/csv',
'icon__file-type-doc': file.contentType == 'application/msword',
'icon__file-type-html': file.contentType == 'text/html',
'icon__file-type-odt': file.contentType == 'application/vnd.oasis.opendocument.text'}"
            *ngIf="!isImage()"
        ></div>
        <h3 [textContent]="file.name"></h3>
    </div>
    <div class="qt-inputs-row --required">
        <div class="qt-input-block">
            <span
                for="add-ticket-subject"
                class="qt-input-block__label"
            >
                File Type
            </span>
            <span></span>
        </div>
    </div>
    <div class="qt-inputs-row --required">
        <div class="qt-input-block">
            <span
                for="add-ticket-subject"
                class="qt-input-block__label"
            >
                File Size
            </span>
            <span></span>
        </div>
    </div>
    <div class="qt-inputs-row --required">
        <div class="qt-input-block">
            <span
                for="add-ticket-subject"
                class="qt-input-block__label"
            >
                Created on
            </span>
            <span></span>
        </div>
    </div>
    <div class="qt-inputs-row --required">
        <div class="qt-input-block">
            <span
                for="add-ticket-subject"
                class="qt-input-block__label"
            >
                Edited on
            </span>
            <span></span>
        </div>
    </div>
    <div class="qt-inputs-row --required">
        <div class="qt-input-block">
            <span
                for="add-ticket-subject"
                class="qt-input-block__label"
            >
                Author
            </span>
            <span></span>
        </div>
    </div>
</div>
<div class="aside-filters-content__footer">
    <div class="qt-df">
        <button
            class="qt-button --md --gray qt-mr-12 qt-w100 qt-jc-c"
            (click)="clearAll()"
        >
            Clear All
        </button>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="qt-df qt-w100">
            <button
                class="qt-button --gray qt-mr-12 qt-w100 qt-jc-c"
                (click)="clearAll()"
            >
                Clear All
            </button>
        </div>
    </div>
</div>
