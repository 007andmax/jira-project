<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line">
        <div class="qt-page-list__header-title-line--left">
            <div
                class="qt-page-list__back-button icon__collapse-arrow button-icon pointer"
                *ngIf="activePage === 'file-management-category'"
                (click)="back()"
            ></div>
            <h3
                class="qt-page-list__header-title"
                [textContent]="'File Manager'"
            ></h3>
        </div>
        <div class="qt-page-list__header-title-line--rigth">
            <div class="qt-df qt-ai-c">
                <app-drop-down
                    *ngIf="isShowCompanyArchived"
                    class="dropdown"
                    [placeholder]="'Select Active'"
                    [editItem]="selectedActive"
                    [list]="listActive"
                    [field]="'title'"
                    [search]="true"
                    [change]="true"
                    [isBlockClear]="true"
                    (onSelectedItem)="selectActive($event)"
                    heightInput="36px"
                ></app-drop-down>
                <div class="qt-input-search qt-ml-12">
                    <input
                        type="text"
                        placeholder="Search files"
                        [(ngModel)]="searchText"
                        (keyup)="onKeyUp($event)"
                    >
                    <span
                        class="search-clear icon__close-round"
                        *ngIf="searchText.length > 0"
                        (click)="clearSearch()"
                    ></span>
                </div>
                <div
                    class="file-info-sort qt-ml-12"
                    ngbDropdown
                >
                    <button
                        class="qt-button --gray --md filter-button qt-df"
                        ngbDropdownToggle
                    >
                        Sort By: {{sort}}
                        <i class="icn-sm report-caret-icon"></i>
                    </button>
                    <div
                        ngbDropdownMenu
                        class="app-drop-down__dropdown"
                    >
                        <button
                            ngbDropdownItem
                            (click)="setSort('Name')"
                        >
                            Name
                        </button>
                        <button
                            ngbDropdownItem
                            (click)="setSort('Date')"
                        >
                            Date
                        </button>
                    </div>
                </div>
                <a
                    href="javascript:;"
                    class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                    (click)="toggleAddCategory = !toggleAddCategory"
                >
                    <span class="icon__add--grey-500 qt-sz-16 qt-bg-contain qt-dib qt-mr-8 qt-button-icon"></span>
                    Create Folder
                </a>
                <button
                    class=" qt-button qt-ml-12 upload-file"
                    (click)="addFile()"
                >
                    <span class="icon__upload-white qt-sz-16 qt-bg-contain qt-dib qt-mr-8 qt-button-icon"></span>
                    <span>Upload file</span>
                </button>
                <div class="qt-df">
                    <div class="qt-pos-rel">






                        <app-file-management-add-category
                            *ngIf="toggleAddCategory"
                            (onClose)="toggleAddCategory = false"
                        ></app-file-management-add-category>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
