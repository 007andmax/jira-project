<div
    class="light-dropdown"
    ngbDropdown
    [autoClose]="'outside'"
    #products="ngbDropdown"
    (openChange)="openChange($event)"
>
    <input
        class="pointer qt-input-block__input qt-dropdown-input"
        type="text"
        [ngClass]="{'no-valid': isFormValid,'disabled': isDisabled}"
        placeholder="Service"
        (input)="onSearch($event)"
        id="dropdownServices"
        autocomplete="new-password"
        (focus)="onFocus($event)"
        [disabled]="isDisabled"
        ngbDropdownAnchor
    >
    <i
        class="icn-sm qt-icon icon__arrow-down report-caret-icon"
        *ngIf="!preloader && isBlockClear || !preloader && !isBlockClear && !selectedItem"
    ></i>
    <i
        class="icn-remove-old qt-icon icon__close qt-icon__gray-400 qt-sz-20"
        *ngIf="!preloader && !isBlockClear && selectedItem && !isDisabled"
        (click)="clearClient()"
    ></i>
    <i
        class="loading xs"
        *ngIf="preloader"
    ></i>
    <div
        class="dropdown-menu services-container"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <button
            class="dropdown-item"
            *ngFor="let item of itemList | service:searchName"
            [ngClass]="{'--selected':isSelected(item.versionedId.id)}"
            (click)="selectServicesItem(item)"
        >
            {{item.name}}
        </button>
    </div>
</div>
