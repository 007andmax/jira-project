<div
    class="light-dropdown"
    ngbDropdown
    [autoClose]="'outside'"
    #products="ngbDropdown"
>
    <input
        class="pointer qt-input-block__input qt-dropdown-input"
        type="text"
        [ngClass]="{'no-valid': isFormValid}"
        placeholder="Service"
        (input)="onSearch($event)"
        id="dropdownServices"
        autocomplete="new-password"
        (focus)="onFocus($event)"
        [disabled]="isDisabled"
        ngbDropdownAnchor
    >
    <i
        class="icn-sm report-caret-icon"
        *ngIf="!preloader"
    ></i>
    <i
        class="loading xs"
        *ngIf="preloader"
    ></i>
    <div
        class="dropdown-menu services-container"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <button
            class="dropdown-item"
            *ngFor="let item of itemList | service:searchName"
            [ngClass]="{'--selected':isSelected(item.versionedId.id)}"
            (click)="selectServicesItem(item)"
        >
            {{item.name}}
        </button>
    </div>
</div>
