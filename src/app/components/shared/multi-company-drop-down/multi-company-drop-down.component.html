<div
    class="light-dropdown"
    ngbDropdown
    #products="ngbDropdown"
    (openChange)="onOpenChange($event)"
>
    <mat-form-field ngbDropdownAnchor>
        <mat-chip-list
            #chipList
            aria-label="Fruit selection"
        >
            <app-dynamic-tooltip
                [position]="'top'"
                #productTooltip
            ></app-dynamic-tooltip>
            <mat-chip
                *ngFor="let company of selectedCompanies; let i = index"
                [selectable]="true"
                [removable]="true"
                (removed)="remove(i)"
            >
                <div
                    class="clip-text"
                    *ngIf="company.name.length >= 30"
                    (mouseenter)="productTooltip.setContent(company.name);productTooltip.show($event.target)"
                    (mouseleave)="productTooltip.hide()"
                >
                    {{company.name}}
                </div>
                <div
                    class="clip-text"
                    *ngIf="company.name.length < 30"
                >
                    {{company.name}}
                </div>
                <mat-icon matChipRemove>cancel</mat-icon>
            </mat-chip>
            <input
                id="dropdownServices"
                ngbDropdownToggle
                placeholder="Select Company"
                #userInput
                class="pointer"
                [matChipInputFor]="chipList"
                [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                [matChipInputAddOnBlur]="true"
                autocomplete="off"
                (input)="onSearch($event)"
            >
        </mat-chip-list>
    </mat-form-field>
    <div
        class="dropdown-menu"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <ng-template
            ngFor
            let-company
            [ngForOf]="list"
            [ngForTrackBy]="trackById"
        >
            <div class="qt-pos-rel">
                <button
                    ngbDropdownItem
                    class="dropdown-item"
                    (click)="toggleItem(company)"
                    [textContent]="company.name"
                    [ngClass]="{'--selected':isSeleted(company)}"
                >
                </button>
                <div
                    *ngIf="isSeleted(company)"
                    class="qt-icon icon__done qt-za-20 qt-sz-20 qt-bg-contain filter-tags-check"
                ></div>
            </div>
        </ng-template>
    </div>
</div>
