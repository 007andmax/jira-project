<div
    class="mat-chip mat-primary mat-standard-chip mat-chip-with-trailing-icon"
    tabindex="-1"
    role="option"
>
    <div
        class="clip-text"
        [textContent]="value"
        *ngIf="value.length >= 30"
    ></div>
    <div
        class="clip-text"
        [textContent]="value"
        *ngIf="value.length < 30"
    ></div>
    <div
        class="mat-chip-remove mat-chip-trailing-icon mat-icon material-icons"
        *ngIf="isRemove"
        (click)="remove()"
    >
        cancel
    </div>
</div>
