<div
    id="tooltip"
    role="tooltip"
    class="tooltip ng-star-inserted"
    [ngClass]="{'bs-tooltip-top' : position === 'top',
    'bs-tooltip-bottom' : position === 'bottom',
'bs-tooltip-left' : position === 'left'}"
>
    <div class="arrow"></div>
    <div
        class="tooltip-inner"
        [innerHTML]="content"
    ></div>
</div>
