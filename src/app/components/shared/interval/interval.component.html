<div
    class="light-dropdown right"
    ngbDropdown
    [autoClose]="'outside'"
>
    <input
        type="text"
        class="pointer"
        [ngClass]="(!valid) ? 'no-valid' : ''"
        [value]="title"
        placeholder="Select Interval"
        id="dropdownForm2"
        ngbDropdownToggle
    >
    <i class="icn-sm report-caret-icon"></i>
    <div
        class="recurring-interval-dropdown"
        ngbDropdownMenu
        aria-labelledby="dropdownForm2"
    >
        <form>
            <div class="recurring-interval-dropdown__header">
                <label class="radio-container">
                    Daily
                    <input
                        type="radio"
                        [(ngModel)]="activeTab"
                        value="daily"
                        (change)="setActiveTab('daily', $event)"
                        name="recurring-interval"
                    >
                    <span class="radio-mark"></span>
                </label>
                <label class="radio-container">
                    Weekly
                    <input
                        type="radio"
                        [(ngModel)]="activeTab"
                        value="weekly"
                        (change)="setActiveTab('weekly', $event)"
                        name="recurring-interval"
                    >
                    <span class="radio-mark"></span>
                </label>
                <label class="radio-container">
                    Monthly
                    <input
                        type="radio"
                        [(ngModel)]="activeTab"
                        value="monthly"
                        (change)="setActiveTab('monthly', $event)"
                        name="recurring-interval"
                    >
                    <span class="radio-mark"></span>
                </label>
            </div>
        </form>
        <!-- IF TYPE 'daily'------------------------------ -->
        <div
            class="recurring-interval-dropdown__content clearfix"
            *ngIf="activeTab === 'daily'"
        >
            <div class="qt-w50 qt-mr-12">
                <label class="qt-checkbox qt-mb-16">
                    <input
                        type="checkbox"
                        [disabled]="isActiveTabMonthly()"
                        (change)="regenerateCron()"
                        [(ngModel)]="state.daily.MON"
                        [ngClass]="options.formCheckboxClass"
                    >
                    <span></span>
                    <div class="qt-ml-8">Monday</div>
                </label>
                <label class="qt-checkbox qt-mb-16">
                    <input
                        type="checkbox"
                        [disabled]="isActiveTabMonthly()"
                        (change)="regenerateCron()"
                        [(ngModel)]="state.daily.TUE"
                        [ngClass]="options.formCheckboxClass"
                    >
                    <span></span>
                    <div class="qt-ml-8">Tuesday</div>
                </label>
                <label class="qt-checkbox qt-mb-16">
                    <input
                        type="checkbox"
                        [disabled]="isActiveTabMonthly()"
                        (change)="regenerateCron()"
                        [(ngModel)]="state.daily.WED"
                        [ngClass]="options.formCheckboxClass"
                    >
                    <span></span>
                    <div class="qt-ml-8">Wednesday</div>
                </label>
                <label class="qt-checkbox">
                    <input
                        type="checkbox"
                        [disabled]="isActiveTabMonthly()"
                        (change)="regenerateCron()"
                        [(ngModel)]="state.daily.THU"
                        [ngClass]="options.formCheckboxClass"
                    >
                    <span></span>
                    <div class="qt-ml-8">Thursday</div>
                </label>
            </div>
            <div class="qt-w50">
                <label class="qt-checkbox qt-mb-16">
                    <input
                        type="checkbox"
                        [disabled]="isActiveTabMonthly()"
                        (change)="regenerateCron()"
                        [(ngModel)]="state.daily.FRI"
                        [ngClass]="options.formCheckboxClass"
                    >
                    <span></span>
                    <div class="qt-ml-8">Friday</div>
                </label>
                <label class="qt-checkbox qt-mb-16">
                    <input
                        type="checkbox"
                        [disabled]="isActiveTabMonthly()"
                        (change)="regenerateCron()"
                        [(ngModel)]="state.daily.SAT"
                        [ngClass]="options.formCheckboxClass"
                    >
                    <span></span>
                    <div class="qt-ml-8">Saturday</div>
                </label>
                <label class="qt-checkbox">
                    <input
                        type="checkbox"
                        [disabled]="isActiveTabMonthly()"
                        (change)="regenerateCron()"
                        [(ngModel)]="state.daily.SUN"
                        [ngClass]="options.formCheckboxClass"
                    >
                    <span></span>
                    <div class="qt-ml-8">Sunday</div>
                </label>
            </div>
        </div>
        <!-- --------------------------------------------------------- -->
        <!-- IF TYPE 'weekly' OR ------------------------------ -->
        <div
            class="recurring-interval-dropdown__content clearfix"
            *ngIf="activeTab === 'weekly'"
        >
            <div class="qt-w50 qt-mr-12">
                <label class="qt-checkbox qt-mb-16">
                    <input
                        type="radio"
                        [disabled]="isActiveTabMonthly()"
                        (change)="setWeekly('MON')"
                        [checked]="state.weekly.MON"
                        [ngClass]="options.formCheckboxClass"
                    >
                    <span></span>
                    <div class="qt-ml-8">Monday</div>
                </label>
                <label class="qt-checkbox qt-mb-16">
                    <input
                        type="radio"
                        [disabled]="isActiveTabMonthly()"
                        (change)="setWeekly('TUE')"
                        [checked]="state.weekly.TUE"
                        [ngClass]="options.formCheckboxClass"
                    >
                    <span></span>
                    <div class="qt-ml-8">Tuesday</div>
                </label>
                <label class="qt-checkbox qt-mb-16">
                    <input
                        type="radio"
                        [disabled]="isActiveTabMonthly()"
                        (change)="setWeekly('WED')"
                        [checked]="state.weekly.WED"
                        [ngClass]="options.formCheckboxClass"
                    >
                    <span></span>
                    <div class="qt-ml-8">Wednesday</div>
                </label>
                <label class="qt-checkbox">
                    <input
                        type="radio"
                        [disabled]="isActiveTabMonthly()"
                        (change)="setWeekly('THU')"
                        [checked]="state.weekly.THU"
                        [ngClass]="options.formCheckboxClass"
                    >
                    <span></span>
                    <div class="qt-ml-8">Thursday</div>
                </label>
            </div>
            <div class="qt-w50">
                <label class="qt-checkbox qt-mb-16">
                    <input
                        type="radio"
                        [disabled]="isActiveTabMonthly()"
                        (change)="setWeekly('FRI')"
                        [checked]="state.weekly.FRI"
                        [ngClass]="options.formCheckboxClass"
                    >
                    <span></span>
                    <div class="qt-ml-8">Friday</div>
                </label>
                <label class="qt-checkbox qt-mb-16">
                    <input
                        type="radio"
                        [disabled]="isActiveTabMonthly()"
                        (change)="setWeekly('SAT')"
                        [checked]="state.weekly.SAT"
                        [ngClass]="options.formCheckboxClass"
                    >
                    <span></span>
                    <div class="qt-ml-8">Saturday</div>
                </label>
                <label class="qt-checkbox">
                    <input
                        type="radio"
                        [disabled]="isActiveTabMonthly()"
                        (change)="setWeekly('SUN')"
                        [checked]="state.weekly.SUN"
                        [ngClass]="options.formCheckboxClass"
                    >
                    <span></span>
                    <div class="qt-ml-8">Sunday</div>
                </label>
            </div>
        </div>
        <!-- --------------------------------------------------------- -->
        <!-- IF TYPE 'MONTHLY'---------------------------------------- -->
        <div
            class="date-picker"
            *ngIf="activeTab === 'monthly'"
        >
            <ngb-datepicker
                [navigation]="navigation"
                [(ngModel)]="datepicker"
                [outsideDays]="outsideDays"
                (select)="selectDate($event)"
                [startDate]="datepicker"
                [ngModelOptions]="{standalone: true}"
            ></ngb-datepicker>
            <div class="date-picker-actions qt-df">
                <button
                    class="btn-new btn-primary-white qt-fs-0"
                    (click)="selectStartMonth();"
                >
                    Start of Month
                </button>
                <button
                    class="btn-new btn-primary-white qt-fs-0"
                    (click)="selectEndMonth();"
                >
                    End of Month
                </button>
            </div>
        </div>
        <!-- --------------------------------------------------------- -->
    </div>
</div>
