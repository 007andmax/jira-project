<div
    *ngIf="opened"
    class="qt-aside-modern draft-email-aside"
    [ngStyle]="{'z-index':opened ? '6' : '5'}"
>
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-title">Write Email</div>
        <div
            class="qt-aside-modern__header-close qt-icon icon__close"
            (click)="close()"
        ></div>
    </div>
    <div class="qt-aside-modern__content new-companies-content__modal--content">
        <div class="qt-inputs-row">
            <div
                class="qt-input-block"
                [ngClass]="{'--input-error':!validate.getSubject()}"
            >
                <label class="qt-input-block__label">Subject</label>
                <input
                    [(ngModel)]="draftEmail.subject"
                    type="text"
                    maxlength="250"
                    placeholder="Write Subject line"
                    (input)="validate.resetSubject()"
                >
                <app-mat-error
                    class="invalid-feedback"
                    *ngIf="!validate.getSubject()"
                >
                    Subject is required
                </app-mat-error>
            </div>
        </div>
        <div class="qt-inputs-row">
            <div class="qt-input-block">
                <div class="qt-input-block__label qt-mb-18">Add Recipient</div>
                <app-draft-email-recipients
                    [companiesSelected]="companiesSelected"
                    *ngIf="action === 'COMPANIES'"
                    [validate]="validate.getEmail()"
                    (onCompanyEmails)="onChangeCompanyEmails($event)"
                ></app-draft-email-recipients>
                <draft-email-user-recipients
                    [usersSelected]="usersSelected"
                    *ngIf="action === 'USERS'"
                    [validate]="validate.getEmail()"
                    (onCompanyEmails)="onChangeCompanyEmails($event)"
                ></draft-email-user-recipients>
            </div>
        </div>
        <div class="draft-email-container">
            <div class="qt-w100 draft-email-sidebar__editor-tab">
                <div
                    class="draft-email-sidebar__editor-tab-item"
                    [ngClass]="{active: tab == 'plain'}"
                    (click)="tab = 'plain'"
                >
                    Plain Text
                </div>
                <div
                    class="draft-email-sidebar__editor-tab-item"
                    [ngClass]="{active: tab == 'html'}"
                    (click)="tab = 'html'"
                >
                    Past Html
                </div>
            </div>
            <div class="qt-w100 editor-container qt-mt-0">
                <div
                    id="test-drag"
                    style="position:relative;"
                    [ngStyle]="{'height':((tab == 'plain') ? '100%' : 'auto')}"
                    appDnd
                    (fileDropped)="onFileDropped($event)"
                    *ngIf="tab == 'plain'"
                >
                    <div class="file-background">
                        <div class="file-background-mask"></div>
                        <div class="file-background-footer">
                            <p>Drop to Attach file</p>
                        </div>
                    </div>
                    <angular-editor
                        [(ngModel)]="messageContent"
                        [config]="editorConfig"
                    ></angular-editor>
                    <div
                        *ngIf="tab == 'plain'"
                        class="editor-container-attachments"
                    >
                        <i class="icn-16 icn-text-attachment"></i>
                        <input
                            id="upload-file-email"
                            type="file"
                            (input)="uploadFileOnBrower($event)"
                        >
                    </div>
                </div>
                <textarea
                    *ngIf="tab == 'html'"
                    [(ngModel)]="messageHTML"
                    class="email-text-block textarea"
                    placeholder="Put here your HTML"
                ></textarea>
                <app-upload-area
                    #uplaodFile
                    (changeFiles)="onChangeFiles($event)"
                    class="ticket-fileupload"
                ></app-upload-area>
                <div
                    *ngIf="tab == 'plain'"
                    class="form-group"
                >
                    <ul class="upload-attachments">
                        <ng-template
                            ngFor
                            let-file
                            [ngForOf]="uploadFiles"
                            let-i="index"
                            [ngForTrackBy]="trackByIndex"
                        >
                            <li [ngStyle]="filesInfo.files[i].error && {'background-color': '#fff2f2'}">
                                <span class="file-name">{{ file.name }}</span>
                                <span class="file-size">{{ file.size }}</span>
                                <a
                                    href="javascript:void(0)"
                                    class="hit-area pull-right"
                                    uib-tooltip="Remove file"
                                    tooltip-placement="top"
                                    (click)="removeAttachment(i)"
                                >
                                    <i class="icn-remove-old qt-icon icon__close qt-icon__gray-400 qt-sz-20"></i>
                                </a>
                                <span
                                    class="pull-right"
                                    *ngIf="filesInfo.files[i].error"
                                    style="color: rgb(229, 57, 53);white-space: nowrap;overflow: hidden;max-width: 300px;"
                                >
                                    {{ filesInfo.files[i].message }}
                                </span>
                                <a
                                    href
                                    class="hit-area pull-right"
                                    data-toggle="tooltip"
                                    data-placement="top"
                                    title="Re-Upload"
                                    *ngIf="filesInfo.files[i].progress !== 100 && (filesInfo.files[i].code !== 500)"
                                    uib-tooltip="Re-Upload"
                                    tooltip-placement="top"
                                    (click)="reloadAttachment(filesInfo.files[i],file)"
                                >
                                    <i class="icn-sm icn-reupload"></i>
                                </a>
                                <div
                                    class="progress progress-attachment pull-right"
                                    *ngIf="filesInfo.files[i].progress !== 100 || filesInfo.files[i].error"
                                >
                                    <div
                                        class="progress-bar"
                                        role="progressbar"
                                        aria-valuemin="0"
                                        aria-valuemax="100"
                                        [ngStyle]="styleProgressBar(filesInfo.files[i].progress)"
                                    >
                                        <span class="sr-only">{{ file.progress }}% Complete</span>
                                    </div>
                                </div>
                            </li>
                        </ng-template>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="qt-df qt-w100">
            <button
                class="qt-button --gray qt-mr-12 qt-w100 qt-jc-c"
                (click)="close()"
            >
                Cancel
            </button>
            <button
                class="qt-button qt-w100 qt-jc-c"
                appDisabledBtn
                #addBtn="disabled"
                (onClick)="onSend()"
            >
                <span *ngIf="!addBtn.isBlock()">Send Email</span>
                <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
            </button>
        </div>
    </div>
</div>
