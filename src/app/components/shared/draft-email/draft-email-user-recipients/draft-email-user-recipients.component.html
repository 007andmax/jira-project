<div
    class
    ngbDropdown
    #products="ngbDropdown"
    [ngClass]="{'hide-all-user':!toggleAllUsers}"
    (openChange)="onToggleDropDown($event)"
>
    <div
        class="dropdown-recipients-body"
        ngbDropdownToggle
        [ngClass]="{'--input-error':!validate}"
    >
        <app-mat-form-field #formField>
            <app-mat-chip-list
                #chipList
                aria-label="Fruit selection"
                [items]="selectedUsers"
                (onChangeItems)="formField.checkSelectedItems(selectedUsers)"
            >
                <app-mat-chip
                    *ngFor="let user of selectedUsers; let i = index"
                    [isRemove]="removable"
                    (onClose)="remove(i)"
                >
                    {{user}}
                </app-mat-chip>
                <input
                    id="dropdownServices"
                    placeholder="Add receipt email address"
                    #userInput
                    class="pointer"
                    [formControl]="userCtrl"
                    autocomplete="new-password"
                    (input)="onSearch($event)"
                    (keyup)="onKeyUp($event)"
                    (blur)="onAdd($event)"
                >
            </app-mat-chip-list>
        </app-mat-form-field>
    </div>
    <app-mat-error
        class="invalid-feedback"
        *ngIf="!validate"
    >
        At least one email address must be added
    </app-mat-error>
    <div
        class="app-drop-down__dropdown"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <ng-template
            ngFor
            let-user
            [ngForOf]="usersClients"
            [ngForTrackBy]="trackByIndex"
        >
            <div
                class="qt-df user-container pointer"
                ngbDropdownItem
                (click)="selected(user)"
                [ngClass]="{'--selected':isSelected(user.primaryEmail)}"
            >
                <div class="qt-df qt-ai-c qt-w100">
                    <div
                        class="assigne-user-avatar qt-mr-8 qt-fs-0"
                        [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                        [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                    ></div>
                  <div class="user-name ellipsis">{{getFirstLastName(user)}}</div>
                  <div class="user-description qt-mr-4 ellipsis">{{user.primaryEmail}}</div>
                  <div
                    class="qt-df qt-ai-c"
                    *ngIf="selectedClient && getJobTitleDto(user)"
                  >
                    <div class="qt-icon icon__permission-role qt-sz-16 qt-mr-4"></div>
                    <span
                      class="user-description"
                      [textContent]="getJobTitleDto(user).name"
                    ></span>
                  </div>
                  <i
                    *ngIf="isSelected(user.primaryEmail)"
                    class="qt-icon icon__done qt-za-20 qt-sz-20 qt-bg-contain qt-ml-auto qt-fs-0"
                  ></i>
                </div>
            </div>
        </ng-template>
        <ng-template
            ngFor
            let-user
            [ngForOf]="usersTechnical"
            [ngForTrackBy]="trackByIndex"
        >
            <div
                class="qt-df user-container pointer"
                ngbDropdownItem
                (click)="selected(user)"
                [ngClass]="{'--selected':isSelected(user.primaryEmail)}"
            >
                <div class="qt-df qt-ai-c qt-w100">
                    <div
                        class="assigne-user-avatar qt-mr-8 qt-fs-0"
                        [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                        [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                    ></div>
                  <div class="user-name">{{getFirstLastName(user)}}</div>
                  <div class="user-description qt-mr-4">{{user.primaryEmail}}</div>
                </div>
                <i
                    *ngIf="isSelected(user.primaryEmail)"
                    class="qt-icon icon__done qt-za-20 qt-sz-20 qt-bg-contain qt-ml-auto qt-fs-0"
                ></i>
            </div>
        </ng-template>
    </div>
    <div
        class="toggle-all-users qt-df qt-ai-c"
        *ngIf="!toggleAllUsers"
        (click)="onToggleAllUsers(true)"
    >
        <div class="qt-icon icon__show qt-za-16 qt-sz-16 qt-bg-contain qt-mr-4 pointer"></div>
        <span [textContent]="'Show All Emails (' + selectedUsers.length +')'"></span>
    </div>
    <div
        class="toggle-all-users qt-df qt-ai-c"
        *ngIf="toggleAllUsers"
        (click)="onToggleAllUsers(false)"
    >
        <div class="qt-icon icon__hide qt-za-16 qt-sz-16 qt-bg-contain qt-mr-4 pointer"></div>
        <span [textContent]="'Hide Multiple Emails'"></span>
    </div>
</div>
