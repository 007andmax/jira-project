<div
    class="col-md-12 light-dropdown"
    ngbDropdown
    #products="ngbDropdown"
    [ngClass]="{'hide-all-user':!toggleAllUsers}"
>
    <div
        class="dropdown-recipients-body"
        ngbDropdownToggle
    >
        <mat-form-field>
            <mat-chip-list
                #chipList
                aria-label="Fruit selection"
            >
                <mat-chip
                    *ngFor="let user of selectedCompanies; let i = index"
                    [selectable]="selectable"
                    [removable]="removable"
                    (removed)="remove(i)"
                >
                    {{user}}
                    <mat-icon
                        matChipRemove
                        *ngIf="removable"
                    >
                        cancel
                    </mat-icon>
                </mat-chip>
                <input
                    id="dropdownServices"
                    placeholder="Add receipt email address"
                    #userInput
                    class="pointer"
                    [formControl]="companyCtrl"
                    autocomplete="new-password"
                    [matChipInputFor]="chipList"
                    [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                    [matChipInputAddOnBlur]="addOnBlur"
                    (input)="onSearch($event)"
                    (keyup)="onKeyUp($event)"
                >
            </mat-chip-list>
        </mat-form-field>
    </div>
    <div
        class="dropdown-menu unique-down"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <ng-template
            ngFor
            let-company
            [ngForOf]="companyList"
            [ngForTrackBy]="trackByIndex"
        >
            <button
                ngbDropdownItem
                class="dropdown-item"
                (click)="selected(company)"
            >
                <span class="user-name">
                    {{getFirstLastName(company.companyInfo.contacts[0])}}
                </span>
                <span class="user-email qt-ml-8">
                    {{company.companyInfo.contacts[0].primaryEmail}}
                </span>
            </button>
        </ng-template>
    </div>
    <p *ngIf="showError">at least 1 user</p>
    <p *ngIf="showErrorClient">please choose Client</p>
    <p
        class="toggle-all-users"
        [textContent]="'Show all ' + selectedCompanies.length + ' emails'"
        *ngIf="!toggleAllUsers"
        (click)="toggleAllUsers = true"
    ></p>
    <p
        class="toggle-all-users"
        *ngIf="toggleAllUsers"
        (click)="toggleAllUsers = false"
    >
        Hide
    </p>
</div>
