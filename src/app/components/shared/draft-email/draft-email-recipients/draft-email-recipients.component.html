<div
    class="qt-temporary-col-fix light-dropdown"
    ngbDropdown
    #products="ngbDropdown"
    [ngClass]="{'hide-all-user':!toggleAllUsers}"
    (openChange)="onToggleDropDown($event)"
>
    <div
        class="dropdown-recipients-body"
        ngbDropdownToggle
        [ngClass]="{'--input-error':!validate}"
    >
        <app-mat-form-field #formField>
            <app-mat-chip-list
                #chipList
                aria-label="Fruit selection"
                [items]="selectedCompanies"
                (onChangeItems)="formField.checkSelectedItems(selectedCompanies)"
            >
                <app-mat-chip
                    *ngFor="let user of selectedCompanies; let i = index"
                    [isRemove]="removable"
                    (onClose)="remove(i)"
                >
                    {{user}}
                </app-mat-chip>
                <input
                    id="dropdownServices"
                    placeholder="Add receipt email address"
                    #userInput
                    class="pointer"
                    [formControl]="companyCtrl"
                    autocomplete="new-password"
                    (input)="onSearch($event)"
                    (keyup)="onKeyUp($event)"
                    (blur)="onAdd($event)"
                >
            </app-mat-chip-list>
        </app-mat-form-field>
    </div>
    <app-mat-error
        class="invalid-feedback"
        *ngIf="!validate"
    >
        At least one email address must be added
    </app-mat-error>
    <div
        class="dropdown-menu unique-down"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <ng-template
            ngFor
            let-company
            [ngForOf]="companyList"
            [ngForTrackBy]="trackByIndex"
        >
            <button
                ngbDropdownItem
                class="dropdown-item"
                [ngClass]="{'--selected':isSelected(company.companyInfo.contacts[0].primaryEmail)}"
                (click)="selected(company)"
            >
                <span class="user-name">
                    {{getFirstLastName(company.companyInfo.contacts[0])}}
                </span>
                <span class="user-email qt-ml-8">
                    {{company.companyInfo.contacts[0].primaryEmail}}
                </span>
            </button>
        </ng-template>
    </div>
    <p *ngIf="showError">at least 1 user</p>
    <p *ngIf="showErrorClient">please choose Client</p>
    <p
        class="toggle-all-users"
        [textContent]="'Show all ' + selectedCompanies.length + ' emails'"
        *ngIf="!toggleAllUsers"
        (click)="toggleAllUsers = true"
    ></p>
    <p
        class="toggle-all-users"
        *ngIf="toggleAllUsers"
        (click)="toggleAllUsers = false"
    >
        Hide
    </p>
</div>
