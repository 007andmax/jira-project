<div
    class=""
    ngbDropdown
    #products="ngbDropdown"
    [ngClass]="{'hide-all-user':!toggleAllUsers}"
    (openChange)="onToggleDropDown($event)"
>
    <div
        class="dropdown-recipients-body"
        ngbDropdownToggle
        [ngClass]="{'--input-error':!validate}"
    >
        <app-mat-form-field #formField>
            <app-mat-chip-list
                #chipList
                aria-label="Fruit selection"
                [items]="selectedCompanies"
                (onChangeItems)="formField.checkSelectedItems(selectedCompanies)"
            >
                <app-mat-chip
                    *ngFor="let user of selectedCompanies; let i = index"
                    [isRemove]="removable"
                    (onClose)="remove(i)"
                >
                    {{user}}
                </app-mat-chip>
                <input
                    id="dropdownServices"
                    placeholder="Add receipt email address"
                    #userInput
                    class="pointer"
                    [formControl]="companyCtrl"
                    autocomplete="new-password"
                    (input)="onSearch($event)"
                    (keyup)="onKeyUp($event)"
                    (blur)="onAdd($event)"
                >
            </app-mat-chip-list>
        </app-mat-form-field>
    </div>
    <app-mat-error
        class="invalid-feedback"
        *ngIf="!validate"
    >
        At least one email address must be added
    </app-mat-error>
    <div
        class="app-drop-down__dropdown"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <ng-template
            ngFor
            let-company
            [ngForOf]="companyList"
            [ngForTrackBy]="trackByIndex"
        >
            <div
                class="qt-df user-container pointer"
                ngbDropdownItem
                (click)="selected(company)"
                [ngClass]="{'--selected':isSelected(company.companyInfo.contacts[0].primaryEmail)}"
            >
                <div class="qt-df qt-ai-c qt-w100">
                    <div
                        class="assigne-user-avatar qt-mr-8 qt-fs-0"
                        [textContent]="ticketsListService.getAssignedUserNameForAvatar(company.companyInfo.contacts[0])"
                        [ngStyle]="{'background': ticketsListService.getStyleAvatar(company.companyInfo.contacts[0])}"
                    ></div>
                  <div class="user-name ellipsis">
                    {{getFirstLastName(company.companyInfo.contacts[0])}}
                  </div>
                  <div class="user-description qt-ml-4 ellipsis">
                    {{company.companyInfo.contacts[0].primaryEmail}}
                  </div>
                  <div
                    class="qt-df qt-ai-c qt-ml-4 ellipsis"
                    *ngIf="getJobTitleDto(company.companyInfo.contacts[0],company)"
                  >
                    <div class="qt-icon icon__permission-role qt-sz-16 qt-ml-4 qt-mr-2 qt-fs-0"></div>
                    <span
                      class="user-description ellipsis"
                      [textContent]="getJobTitleDto(company.companyInfo.contacts[0],company).name"
                    ></span>
                  </div>
                  <i
                    *ngIf="isSelected(company.companyInfo.contacts[0].primaryEmail)"
                    class="qt-icon icon__done qt-za-20 qt-sz-20 qt-bg-contain qt-ml-auto qt-fs-0"
                  ></i>
                </div>
            </div>
        </ng-template>
    </div>
    <p *ngIf="showError">at least 1 user</p>
    <p *ngIf="showErrorClient">please choose Client</p>
    <div
        class="toggle-all-users qt-df qt-ai-c"
        *ngIf="!toggleAllUsers"
        (click)="toggleAllUsers = true"
    >
        <div class="qt-icon icon__show qt-za-16 qt-sz-16 qt-bg-contain qt-mr-4 pointer"></div>
        <span [textContent]="'Show All Emails (' + selectedCompanies.length +')'"></span>
    </div>
    <div
        class="toggle-all-users qt-df qt-ai-c"
        *ngIf="toggleAllUsers"
        (click)="toggleAllUsers = false"
    >
        <div class="qt-icon icon__hide qt-za-16 qt-sz-16 qt-bg-contain qt-mr-4 pointer"></div>
        <span [textContent]="'Hide Multiple Emails'"></span>
    </div>
</div>
