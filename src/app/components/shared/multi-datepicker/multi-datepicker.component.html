<div
    class="date-picker"
    (clickOutside)="hideDatePicker()"
>
    <mat-error
        class="app-drop-down__error qt-tooltip-error mat-error"
        *ngIf="!validate"
        [textContent]="errorMessage"
    >
    </mat-error>
    <input
        type="text"
        placeholder="Filter by date"
        (click)="toggleDatePicker()"
        [(ngModel)]="selectedDateModel"
        [ngClass]="{'disabled': isDisabled,'--input-error' : !validate}"
        [disabled]="isDisabled"
        class="pointer"
    >
    <i
        *ngIf="selectedDateModel"
        class="icn-sm icn-remove-old"
        (click)="clearDate()"
    ></i>
    <i
        *ngIf="!selectedDateModel"
        class="icn-16 icn-calendar-light pointer"
    ></i>
    <div
        class="dropdown-menu show"
        *ngIf="showDatePicker"
    >
        <ngb-datepicker
            #dp
            (select)="onDateSelection($event)"
            [displayMonths]="2"
            [dayTemplate]="t"
            [outsideDays]="outsideDays"
        >
        </ngb-datepicker>
        <ng-template
            #t
            let-date
            let-focused="focused"
        >
            <span
                class="custom-day"
                [class.focused]="focused"
                [class.range]="isRange(date)"
                [class.faded]="isHovered(date) || isInside(date)"
                (mouseenter)="hoveredDate = date"
                (mouseleave)="hoveredDate = null"
            >
                {{ date.day }}
            </span>
        </ng-template>
    </div>
</div>
