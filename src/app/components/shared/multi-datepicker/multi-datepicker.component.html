<div
    class="date-picker multi-datepicker-container"
    [ngClass]="class"
    ngbDropdown
    [container]="container"
    #dp="ngbDropdown"
>
    <app-mat-error
        class="app-drop-down__error invalid-feedback mat-error"
        *ngIf="!validate"
        [textContent]="errorMessage"
    >
    </app-mat-error>
    <input
        type="text"
        [attr.placeholder]="placeholder"
        (click)="toggleDatePicker()"
        [(ngModel)]="selectedDateModel"
        [ngClass]="{'disabled': isDisabled,'no-click':isDisabled,'--input-error' : !validate}"
        [disabled]="isDisabled"
        class="pointer"
        ngbDropdownToggle
    >
    <i
        *ngIf="selectedDateModel"
        class="icn-remove-old qt-icon icon__close qt-icon__gray-400 qt-sz-20"
        (click)="clearDate()"
    ></i>
    <i
        *ngIf="!selectedDateModel"
        class="icn-16 qt-icon icon__calendar pointer"
    ></i>
    <div
         ngbDropdownMenu
        [ngStyle]="{'width':   '100%', 'max-height':  'initial'}"
        aria-labelledby="dropdown1"
        class="app-drop-down__dropdown date-picker"
    >
        <ngb-datepicker
            #dp
            (dateSelect)="onDateSelection($event)"
            [displayMonths]="2"
            [dayTemplate]="t"
            [outsideDays]="outsideDays"
        >
        </ngb-datepicker>
        <ng-template
            #t
            let-date
            let-focused="focused"
        >
            <span
                class="custom-day"
                [class.focused]="focused"
                [class.range]="isRange(date)"
                [class.faded]="isHovered(date) || isInside(date)"
                (mouseenter)="hoveredDate = date"
                (mouseleave)="hoveredDate = null"
            >
                {{ date.day }}
            </span>
        </ng-template>
    </div>
</div>
