<div
    class="date-picker"
    appClickOtside
    [class]="'.date-picker'"
    [init]="true"
    (onOutSide)="hideDatePicker()"
>
    <mat-error
        class="app-drop-down__error invalid-feedback mat-error"
        *ngIf="!validate"
        [textContent]="errorMessage"
    >
    </mat-error>
    <input
        type="text"
        [attr.placeholder]="placeholder"
        (click)="toggleDatePicker()"
        [(ngModel)]="selectedDateModel"
        [ngClass]="{'disabled': isDisabled,'--input-error' : !validate}"
        [disabled]="isDisabled"
        class="pointer"
    >
    <i
        *ngIf="selectedDateModel"
        class="icn-remove-old qt-icon icon__close qt-icon__gray-400 qt-sz-20"
        (click)="clearDate()"
    ></i>
    <i
        *ngIf="!selectedDateModel"
        class="icn-16 qt-icon icon__calendar pointer"
    ></i>
    <div
        class="dropdown-menu show"
        *ngIf="showDatePicker"
    >
        <ngb-datepicker
            #dp
            (select)="onDateSelection($event)"
            [displayMonths]="2"
            [dayTemplate]="t"
            [outsideDays]="outsideDays"
        >
        </ngb-datepicker>
        <ng-template
            #t
            let-date
            let-focused="focused"
        >
            <span
                class="custom-day"
                [class.focused]="focused"
                [class.range]="isRange(date)"
                [class.faded]="isHovered(date) || isInside(date)"
                (mouseenter)="hoveredDate = date"
                (mouseleave)="hoveredDate = null"
            >
                {{ date.day }}
            </span>
        </ng-template>
    </div>
</div>
