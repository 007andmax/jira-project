<div
    class="qt-temporary-col-fix light-dropdown"
    ngbDropdown
    #products="ngbDropdown"
>
    <app-mat-form-field #formField>
        <app-mat-chip-list
            #chipList
            aria-label="Fruit selection"
            [items]="selectedTag"
            (onChangeItems)="formField.checkSelectedItems(selectedTag)"
        >
            <app-mat-chip
                *ngFor="let tag of selectedTag; let i = index"
                [selectable]="selectable"
                [isRemove]="removable"
                (onClose)="remove(i)"
            >
                {{tag.word}}
            </app-mat-chip>
            <input
                id="dropdownServices"
                ngbDropdownToggle
                placeholder="eg. Window update, Monthly maintainace"
                #userInput
                class="pointer"
                [formControl]="tagCtrl"
                [matChipInputFor]="chipList"
                [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                [matChipInputAddOnBlur]="addOnBlur"
                (matChipInputTokenEnd)="add($event)"
            >
        </app-mat-chip-list>
    </app-mat-form-field>
    <div
        class="dropdown-menu"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <ng-template
            ngFor
            let-tag
            [ngForOf]="tags"
            [ngForTrackBy]="trackById"
        >
            <button
                ngbDropdownItem
                class="dropdown-item"
                (click)="selected(tag)"
                [ngClass]="{'--selected':isSelected(tag.id)}"
                [textContent]="tag.word"
            >
            </button>
        </ng-template>
    </div>
</div>
