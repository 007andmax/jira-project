<div
    class="archive-modal delete-marketing-subscribes"
>
 <div class="archive-modal__body qt-text-center">
        <div class="qt-dif qt-ai-c qt-jc-c qt-sz-80 qt-bg-red-100 qt-circle">
          <div class="qt-icon icon__alert-triangle qt-icon__red-600 qt-sz-48"></div>
        </div>
        <div class="archive-modal__body-title qt-mt-24 qt-fw-600 qt-color-gray-900" [textContent]="header"></div>
        <div class="archive-modal__body-text qt-mt-8 qt-color-gray-500" [innerHTML]="message"></div>
    </div>
    <div class="archive-modal__footer">
        <div class="qt-df qt-jc-fe">
            <button
                class="qt-button --gray qt-w100"
                (click)=cancelConfirm()
            >
                Cancel
            </button>
            <button
                class="qt-button --red qt-w100"
                appDisabledBtn
                #approveBtn="disabled"
                (onClick)="approveConfirmByRequest()"
                [ngClass]="{'--loading':approveBtn.isBlock()}"
        >       <span *ngIf="!approveBtn.isBlock()"> Yes, I am sure</span>
                <app-preloader-ticket *ngIf="approveBtn.isBlock()"></app-preloader-ticket>
            </button>
        </div>
    </div>
</div>
