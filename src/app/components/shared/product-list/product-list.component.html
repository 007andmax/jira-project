<div
    class="product-dropdown-new-ng light-dropdown select-product"
    ngbDropdown
    [autoClose]="'outside'"
    #products="ngbDropdown"
    (openChange)="onCloseProducts($event)"
>
    <mat-error
        class="qt-tooltip-error qt-w-auto-important"
        *ngIf="!validate"
    >
        Product is required
    </mat-error>
    <input
        class="pointer qt-input-block__input qt-dropdown-input"
        type="text"
        autocomplete="new-password"
        [ngClass]="{'--input-error' : !validate}"
        placeholder="Search or Add product"
        (input)="onSearch($event)"
        (focus)="onFocus($event)"
        id="dropdownProducts"
        [disabled]="inventoryStateService.preloader"
        ngbDropdownAnchor
    >
    <span>
        <i
            *ngIf="selectedItem && !inventoryStateService.preloader"
            class="icn-remove-old qt-icon icon__close qt-icon__gray-400 qt-sz-20"
            (click)="clear()"
        ></i>
        <i
            *ngIf="!selectedItem && !inventoryStateService.preloader"
            class="icn-sm qt-icon icon__arrow-down report-caret-icon"
        ></i>
        <i
            class="loading xs"
            *ngIf="inventoryStateService.preloader"
        ></i>
    </span>
    <div
        class=select-product__dropdown
        ngbDropdownMenu
        aria-labelledby="dropdownProducts"
    >
        <div class="select-product__header">
            <div class="qt-df qt-jc-sb qt-mb-8 qt-ai-c">
                <div class="select-product__header-title">Product list</div>
                <div
                    class="qt-button qt-button--with-icon --gray --sm select-product__header-add-product"
                    (click)="onCreateProduct()"
                    *ngIf="getPermissions('MANAGE_PRODUCTS')"
                >
                    <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-4 qt-button-icon"></span>
                    Create Product
                </div>
            </div>
            <div class="qt-input-search">
                <input
                    class="pointer qt-input-search qt-dropdown-input"
                    type="text"
                    autocomplete="new-password"
                    [ngClass]="{'--input-error' : !validate}"
                    placeholder="Search Products"
                    (input)="onSearch($event)"
                    id="search-drop-down"
                >
            </div>
        </div>
        <ngb-accordion
            #acc="ngbAccordion"
            class="item-list products-accordion"
        >
            <ngb-panel *ngFor="let item of itemList | filter : resetSearch : search">
                <!-- | filter :'name' : search -->
                <ng-template
                    ngbPanelHeader
                    let-opened="opened"
                >
                    <button
                        ngbPanelToggle
                        class="btn select-product__item-title"
                        (click)="togglePanel(opened,$event)"
                    >
                        <div>
                            {{item.name}}
                            <span *ngIf="item.products.length">({{item.products.length}})</span>
                        </div>
                        <div class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-8 qt-sz-16"></div>
                    </button>
                </ng-template>
                <ng-template ngbPanelContent>
                    <div
                        class="category-product"
                        *ngFor="let productItem of item.products"
                        (click)="setProduct(productItem)"
                    >
                        <div class="qt-df category-product__main-info">
                            <div class="qt-df qt-ai-c qt-jc-sb category-product__title-price">
                                <div class="title">{{productItem.description}}</div>
                                <div class="total-count qt-mt-4">{{ productItem.sale | currency: '$' }}</div>
                            </div>
                            <div class="manufacture">
                                <span *ngIf="productItem.ilc">ILC: {{ productItem.ilc }}</span>
                                <span *ngIf="productItem.manufacture">P/N: {{ productItem.manufacture }}</span>
                            </div>
                        </div>
                        <div class="qt-button-square pointer qt-ml-20 qt-bg-white">
                            <app-dynamic-tooltip
                                [content]="'Click to add'"
                                [position]="'top'"
                                #pointerTooltip
                            ></app-dynamic-tooltip>
                            <div
                                class="t-icon icon__add-grey qt-sz-16"
                                (mouseenter)="pointerTooltip.show($event.target)"
                                (mouseleave)="pointerTooltip.hide()"
                            ></div>
                        </div>
                    </div>
                </ng-template>
            </ngb-panel>
        </ngb-accordion>
    </div>
</div>
