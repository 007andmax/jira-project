<div
    class="mat-form-field mat-primary mat-form-field-type-mat-chip-list mat-form-field-appearance-legacy mat-form-field-can-float mat-form-field-hide-placeholder mat-form-field-should-float"
    [ngClass]="classes"
>
    <div class="mat-form-field-wrapper">
        <div class="mat-form-field-flex">
            <!--  -->
            <div class="mat-form-field-infix">
                <ng-content></ng-content>
                <span class="mat-form-field-label-wrapper">
                    <!--  -->
                    <label
                        class="mat-form-field-label mat-empty mat-form-field-empty"
                        for="mat-form-field"
                        [textContent]="placeholder"
                    >
                    </label>
                </span>
            </div>
            <!--  -->
        </div>
        <!--  -->
        <div class="mat-form-field-underline">
            <span class="mat-form-field-ripple"></span>
        </div>
        <!--  -->
        <div class="mat-form-field-subscript-wrapper">
            <!--  -->
            <!--  -->
            <div
                class="mat-form-field-hint-wrapper"
                style="opacity: 1; transform: translateY(0%);"
            >
                <!--  -->
                <div class="mat-form-field-hint-spacer"></div>
            </div>
        </div>
    </div>
</div>
