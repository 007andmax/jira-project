<div
    class="light-dropdown new-taxes-area"
    ngbDropdown
    #taxesDropDown="ngbDropdown"
>
    <div
        class="qt-input-block__label"
        *ngIf="isLabel"
    >
        Taxes
    </div>
    <div
        class="add-tax add-tax-inventory"
        *ngIf="isAdd"
    >
        <span (click)="onInitAddTax()">+ Add Tax</span>
        <div
            class="d-inline-block "
            ngbDropdown
            #addTax="ngbDropdown"
            placement="bottom-right"
        >
            <a
                style="display: none;"
                class="nav-link"
                id="dropdownManual"
                ngbDropdownToggle
            >
                Contribute
            </a>
            <div
                ngbDropdownMenu
                aria-labelledby="dropdownManual"
                class="dropdown-menu new-tax add-tax-container"
                role="menu"
            >
                <div class="add-tax-dropdown">
                    <div class="tax-title">Add Tax</div>
                    <form
                        *ngIf="taxForm"
                        [formGroup]="taxForm"
                        novalidate
                    >
                        <div class="qt-input-block qt-mb-24">
                            <div class="qt-input-block__label">Tax Name</div>
                            <input
                                placeholder="Enter Tax Name"
                                type="text"
                                class="form-validation"
                                formControlName="name"
                                minlength="2"
                                maxlength="30"
                                required
                            >
                            <div
                                class="invalid-feedback"
                                *ngIf="taxForm.controls['name'].invalid && (taxForm.controls['name'].dirty || taxForm.controls['name'].touched)"
                            >
                                <div *ngIf="taxForm.controls['name'].errors.required">Name is required.</div>
                                <div *ngIf="taxForm.controls['name'].errors.minlength">Name is too short.</div>
                                <div *ngIf="taxForm.controls['name'].errors.maxlength">Name is too long.</div>
                            </div>
                        </div>
                        <div class="qt-input-block qt-mb-24">
                            <div class="qt-input-block__label">Rate (%)</div>
                            <input
                                placeholder="Rate (%)"
                                type="number"
                                class="form-validation"
                                formControlName="rate"
                                required
                                min="0.01"
                                max="99"
                            >
                            <div
                                class="invalid-feedback"
                                *ngIf="taxForm.controls['rate'].invalid && (taxForm.controls['rate'].dirty || taxForm.controls['rate'].touched)"
                            >
                                <div *ngIf="taxForm.controls['rate'].errors.required">Field is required.</div>
                                <div *ngIf="taxForm.controls['rate'].errors.min">To small.</div>
                                <div *ngIf="taxForm.controls['rate'].errors.max">To large.</div>
                            </div>
                        </div>
                        <div class="qt-input-block">
                            <label class="qt-checkbox">
                                <input
                                    type="checkbox"
                                    formControlName="isDefault"
                                >
                                <span></span>
                                <div class="qt-ml-8">Set as Default</div>
                            </label>
                        </div>
                        <div class="qt-df qt-mt-24">
                            <button
                                class="qt-button qt-mr-12"
                                type="submit"
                                [disabled]="taxForm.pristine || taxForm.invalid"
                                (click)="onAddTax()"
                            >
                                Save
                            </button>
                            <button
                                class="qt-button --gray"
                                ngbDropdownToggle
                            >
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="light-dropdown new-product-gl-select qt-select-input-40 qt-dropdown-input">
        <i
            class="icn-sm qt-icon icon__arrow-down report-caret-icon"
            ngbDropdownToggle
            *ngIf="!isDisabled"
        ></i>
        <input
            type="text"
            [value]="getSelectedTaxes()"
            autocomplete="new-password"
            readonly
            [attr.placeholder]="placeholder"
            id="dropdownTypeTaxes"
            class="qt-dropdown-input"
            [disabled]="isDisabled"
            ngbDropdownToggle
        >
    </div>
    <ul
        ngbDropdownMenu
        class="dropdown-menu"
        aria-labelledby="dropdownTypeTaxes"
    >
        <ng-template
            ngFor
            let-tax
            [ngForOf]="taxes"
            [ngForTrackBy]="trackById"
        >
            <li
                class="dropdown-item"
                ngbDropdownItem
                (click)="selected(tax)"
                [ngClass]="{'--selected':checkTaxIsSelected(tax)}"
            >
                <span [textContent]="tax.name + ' ' + tax.rate + '%'"></span>
                <i
                    class="qt-sz-20 icon__done qt-icon__blue-light-600 icn-label-save taxes-dropdown__check-icon"
                    *ngIf="checkTaxIsSelected(tax)"
                ></i>
            </li>
        </ng-template>
    </ul>
</div>
