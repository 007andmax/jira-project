<div
    class="light-dropdown new-taxes-area"
    ngbDropdown
    #taxesDropDown="ngbDropdown"
>
    <p
        class="label-name"
        *ngIf="isLabel"
    >
        Taxes
    </p>
    <div
        class="add-tax add-tax-inventory"
        *ngIf="isAdd"
    >
        <span (click)="onInitAddTax()">+ Add Tax</span>
        <div
            class="d-inline-block "
            ngbDropdown
            #addTax="ngbDropdown"
        >
            <a
                style="display: none;"
                class="nav-link"
                id="dropdownManual"
                ngbDropdownToggle
            >
                Contribute
            </a>
            <div
                ngbDropdownMenu
                aria-labelledby="dropdownManual"
                class="dropdown-menu new-tax add-tax-container"
                role="menu"
            >
                <div class="add-tax-dropdown">
                    <div class="tax-title">Add Tax</div>
                    <form
                        *ngIf="taxForm"
                        [formGroup]="taxForm"
                        novalidate
                    >
                        <div class="add-tax-label">Tax Name</div>
                        <input
                            placeholder="Enter Tax Name"
                            type="text"
                            class="form-validation"
                            formControlName="name"
                            minlength="2"
                            maxlength="30"
                            required
                        >
                        <div
                            style="position: relative"
                            *ngIf="taxForm.controls['name'].invalid && (taxForm.controls['name'].dirty || taxForm.controls['name'].touched)"
                        >
                            <label
                                class="control-label"
                                *ngIf="taxForm.controls['name'].errors.required"
                            >
                                Name is required.
                            </label>
                            <label
                                class="control-label"
                                *ngIf="taxForm.controls['name'].errors.minlength"
                            >
                                Name is too short.
                            </label>
                            <label
                                class="control-label"
                                *ngIf="taxForm.controls['name'].errors.maxlength"
                            >
                                Name is too long.
                            </label>
                        </div>
                        <div class="add-tax-label">Rate (%)</div>
                        <input
                            placeholder="Rate (%)"
                            type="number"
                            class="form-validation"
                            formControlName="rate"
                            required
                            min="0.01"
                            max="99"
                        >
                        <div
                            style="position: relative"
                            *ngIf="taxForm.controls['rate'].invalid && (taxForm.controls['rate'].dirty || taxForm.controls['rate'].touched)"
                        >
                            <label
                                style="white-space: nowrap;"
                                class="control-label"
                                *ngIf="taxForm.controls['rate'].errors.required"
                            >
                                Field is required.
                            </label>
                            <label
                                style="white-space: nowrap;"
                                class="control-label"
                                *ngIf="taxForm.controls['rate'].errors.min"
                            >
                                To small.
                            </label>
                            <label
                                style="white-space: nowrap;"
                                class="control-label"
                                *ngIf="taxForm.controls['rate'].errors.max"
                            >
                                To large.
                            </label>
                        </div>
                        <label class="qt-checkbox qt-mb-20">
                          <input
                            type="checkbox"
                            formControlName="isDefault"
                          >
                          <span></span>
                          <div class="qt-ml-8">Set as Default</div>
                        </label>
                        <div class="d-f">
                            <button
                                class="qt-button qt-mr-12"
                                type="submit"
                                [disabled]="taxForm.pristine || taxForm.invalid"
                                (click)="onAddTax()"
                            >
                                Save
                            </button>
                            <button
                                class="qt-button --gray"
                                ngbDropdownToggle
                            >
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div
        class="light-dropdown new-product-gl-select qt-select-input-40"
        ngbDropdownToggle
    >
        <i class="icn-sm report-caret-icon"></i>
        <input
            type="text"
            [value]="getSelectedTaxes()"
            autocomplete="new-password"
            readonly
            [attr.placeholder]="placeholder"
            id="dropdownTypeTaxes"
        >
    </div>
    <ul
        ngbDropdownMenu
        class="dropdown-menu"
        aria-labelledby="dropdownTypeTaxes"
    >
        <ng-template
            ngFor
            let-tax
            [ngForOf]="taxes"
            [ngForTrackBy]="trackById"
        >
            <li
                class="dropdown-item"
                ngbDropdownItem
                (click)="selected(tax)"
                [ngClass]="{'--selected':checkTaxIsSelected(tax)}"
            >
                <span [textContent]="tax.name + ' ' + tax.rate + '%'"></span>
                <i
                    class="qt-sz-20 qt-bg-contain icn-label-save taxes-dropdown__check-icon"
                    *ngIf="checkTaxIsSelected(tax)"
                ></i>
            </li>
        </ng-template>
    </ul>
</div>
