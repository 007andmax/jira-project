<div class="map-modal" *ngIf="show">
  <div
    (click)="show = false"
    class="close-map-icon qt-icon icon__close">
  </div>

  <div class="map-area">
    <google-map
      height="300px"
      width="100%"
      [center]="{ lat: latitude, lng: longitude }"
      [zoom]="15"
      [options]="{ mapTypeControl: true }"
      [attr.aria-label]="title">

      <map-marker
        [position]="{ lat: latitude, lng: longitude }"
        [title]="title">
      </map-marker>
    </google-map>
  </div>
</div>
