<div class="qt-modal quote-email-modal">
    <div class="qt-modal__header">
        <div class="qt-modal__header-title qt-fw-600">Enable Google authenticator</div>
        <div
            class="qt-modal__close icon__close qt-pointer"
            (click)="closeModal()"
        ></div>
    </div>
    <div class="qt-modal__body">
        <img [src]="qrCode">
        <ol>
            <li>{{secretCode}}</li>
        </ol>
        <div class="qt-input-block qt-mb-24 qt-w100">
            <label>Verefication code</label>
            <input
                type="text"
                placeholder="Write Subject"
                [(ngModel)]="authCode"
            >
        </div>
    </div>
    <div class="qt-modal__footer">
        <button
            class="qt-button --gray qt-mr-12"
            (click)="closeModal()"
        >
            Cancel
        </button>
        <button
            class="qt-button qt-mr-12"
            (click)="submit()"
        >
            Submit
        </button>
    </div>
</div>
