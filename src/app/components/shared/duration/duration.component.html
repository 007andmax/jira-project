<div class="qt-inputs-row">
    <div class="qt-input-block qt-f50 hours-container">
        <input
            id="typeahead-focus3"
            placeholder="Hr(s)"
            type="text"
            [(ngModel)]="selectedHours"
            class="pointer"
            [inputFormatter]="formatter"
            [resultFormatter]="formatter"
            [ngbTypeahead]="searchHours"
            (selectItem)="selectHours($event)"
            (focus)="focusHours$.next('')"
            (click)="clickHours$.next('')"
            #instanceHours="ngbTypeahead"
            (input)="onChange($event,'hours')"
        >
        <span>
            <i
                *ngIf="selectedHours"
                class="icn-remove-old qt-icon icon__close qt-icon__gray-400 qt-sz-20"
                (click)="clearHours()"
            ></i>
            <i
                *ngIf="!selectedHours"
                class="icn-sm qt-icon icon__arrow-down report-caret-icon"
            ></i>
        </span>
    </div>
    <div class="qt-input-block qt-f50 minutes-container">
        <input
            id="typeahead-focus4"
            placeholder="Mn"
            type="text"
            [(ngModel)]="selectedMin"
            class="pointer"
            [inputFormatter]="formatter"
            [resultFormatter]="formatter"
            [ngbTypeahead]="searchMin"
            (selectItem)="selectMin($event)"
            (focus)="focusMin$.next('')"
            (click)="clickMin$.next('')"
            #instanceMin="ngbTypeahead"
            (input)="onChange($event,'minutes')"
        >
        <span>
            <i
                *ngIf="selectedMin"
                class="icn-remove-old qt-icon icon__close qt-icon__gray-400 qt-sz-20"
                (click)="clearMin()"
            ></i>
            <i
                *ngIf="!selectedMin"
                class="icn-sm qt-icon icon__arrow-down report-caret-icon"
            ></i>
        </span>
    </div>
</div>
