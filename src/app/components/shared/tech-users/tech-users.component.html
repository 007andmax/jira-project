<div
    class="tech-users-container"
    ngbDropdown
    [container]="container"
    [autoClose]="'outside'"
    [placement]="placement"
    (openChange)="onCloseDropDown($event)"
>
    <div
        class="device-user pointer"
        *ngIf="type === 'DETAIL_TICKET' && selectedUsers.length === 0"
        id="dropdownTechuser"
        style="margin-bottom: 10px;"
        ngbDropdownToggle
    >
        <div class="qt-df qt-ai-c">
            <div class="add-user qt-sz-36 qt-circle qt-bg-contain qt-mr-8"></div>
            <span>Assign User</span>
        </div>
    </div>
    <div
        class="device-user pointer"
        *ngIf="type === 'RECURRING_TICEKTS' || type === 'COMPANY_SETTINGS' && selectedUsers.length === 0"
        id="dropdownTechuser"
        style="margin-bottom: 10px;"
        ngbDropdownToggle
    >
        <!-- FOR RECURRING_TICEKTS -->
        <div class="qt-df qt-ai-c">
            <div
                *ngIf="type === 'RECURRING_TICEKTS'"
                class="icon__upload-avtar qt-mr-8"
            ></div>
            <span *ngIf="type === 'RECURRING_TICEKTS'">Assigned Users</span>
        </div>
        <!-- FOR RECURRING_TICEKTS -->
        <!-- COMPANY_SETTINGS -->
        <div
            class="company-settings-user"
            *ngIf="type === 'COMPANY_SETTINGS'"
        >
            <div class="icon__user-avatar qt-sz-36 qt-circle qt-bg-contain"></div>
            <div class="qt-ml-12 qt-f-1 ellipsis">
                <div class="tab-pane__table-user-item-name qt-fw-600 qt-color-gray-900 ellipsis">Assign Sales Person</div>
                <div class="tab-pane__table-user-item-email qt-color-gray-500 ellipsis qt-mt-4">
                    <div
                        class="preview-container"
                        style="border: 1px solid #FECDCA"
                    >
                        <span
                            class="qt-fw-500"
                            style="color: #D92D20;"
                        >
                            Not Assigned
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <!-- COMPANY_SETTINGS -->
    </div>
    <div
        class="device-user pointer company-settings-user"
        *ngIf="type === 'DETAIL_TICKET' && selectedUsers.length === 1"
        id="dropdownTechuser"
        ngbDropdownToggle
    >
        <div class="user-tech-dp">
            <div
                class="tab-pane__table-avatar user-dp qt-sz-16 qt-ic-c qt-circle"
                [textContent]="ticketsListService.getAssignedUserNameForAvatar(selectedUsers[0])"
                [ngStyle]="{'background': ticketsListService.getStyleAvatar(selectedUsers[0])}"
            >
            </div>
        </div>
        <div class="qt-ml-12 qt-f-1 ellipsis">
            <div
                class="tab-pane__table-user-item-name qt-fw-500 ellipsis"
                [textContent]="ticketsListService.getUserName(selectedUsers[0])"
            ></div>
        </div>
    </div>
    <div
        class="device-user pointer company-settings-user"
        *ngIf="type === 'COMPANY_SETTINGS' && selectedUsers.length === 1"
        id="dropdownTechuser"
        ngbDropdownToggle
    >
        <div class="user-tech-dp">
            <div
                class="tab-pane__table-avatar user-dp"
                [textContent]="ticketsListService.getAssignedUserNameForAvatar(selectedUsers[0])"
                [ngStyle]="{'background': ticketsListService.getStyleAvatar(selectedUsers[0])}"
            >
            </div>
        </div>
        <div class="qt-ml-12 qt-f-1 ellipsis">
            <div
                class="tab-pane__table-user-item-name qt-fw-600 qt-color-gray-900 ellipsis"
                [textContent]="ticketsListService.getUserName(selectedUsers[0])"
            ></div>
            <div
                class="tab-pane__table-user-item-email qt-color-gray-500 ellipsis qt-mt-2"
                [textContent]="selectedUsers[0].primaryEmail"
            ></div>
        </div>
    </div>
    <app-dynamic-tooltip
        [content]="'Select User'"
        [position]="'top'"
        #selectUserTooltip
    ></app-dynamic-tooltip>
    <div
        class="tech__user-icon icon__assign-user pointer"
        *ngIf="type === 'TICEKTS' && selectedUsers.length === 0 || type === 'CONTRACT'"
        id="dropdownTechuser"
        (mouseenter)="selectUserTooltip.show($event.target)"
        (mouseleave)="selectUserTooltip.hide()"
        ngbDropdownToggle
    ></div>
    <app-dynamic-tooltip
        [content]="ticketsListService.getUserName(selectedUsers[0])"
        [position]="'top'"
        #techUserTooltip
    ></app-dynamic-tooltip>
    <button
        class="ticket-updates__photo-people"
        *ngIf="type === 'TICEKTS' && selectedUsers.length === 1"
        [textContent]="ticketsListService.getAssignedUserNameForAvatar(selectedUsers[0])"
        [ngStyle]="{'background': ticketsListService.getStyleAvatar(selectedUsers[0])}"
        id="dropdownTechuser"
        ngbDropdownToggle
        [disabled]="isDisabled"
        (mouseenter)="techUserTooltip.show($event.target)"
        (mouseleave)="techUserTooltip.hide()"
    ></button>
    <div
        class="tech-user-body"
        ngbDropdownMenu
        aria-labelledby="dropdownTechuser"
        *ngIf="!isDisabled"
    >
        <!-- **** Old Component Dropdown ***** -->
        <div
            class="select-wrapper dropdown-assign-ticket fixed-assign"
            *ngIf="type !== 'COMPANY_SETTINGS'"
        >
            <div class="content">
                <form class="px-4 py-3">
                    <div
                        class="assign-ticket"
                        assign-user
                    >
                        <div class="assign-ticket-content">
                            <div class="assign-ticket-header">
                                <div class="clearfix">
                                    <div class="qt-input-search">
                                        <input
                                            placeholder="Search Users"
                                            autocomplete="off"
                                            id="search-user"
                                            (input)="onSearch($event)"
                                        >
                                    </div>
                                </div>
                            </div>
                            <div class="scroll-pane">
                                <div
                                    class="users-list"
                                    tabindex="-1"
                                >
                                    <ng-template
                                        ngFor
                                        let-user
                                        [ngForOf]="usersList"
                                        let-i="index"
                                        [ngForTrackBy]="trackByIndex"
                                    >
                                        <div
                                            class="user-item-detail pointer"
                                            data-index="1"
                                            (click)="selectUser(i)"
                                            [ngClass]="(user.selected) ? 'active' : ''"
                                        >
                                            <div
                                                class="user-item-user-avatar"
                                                [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                                                [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                                            ></div>
                                            <div
                                                class="user-item-user-name"
                                                [textContent]="getUserName(user)"
                                            ></div>
                                            <span
                                                class="user-item-user-email"
                                                [textContent]="user.primaryEmail"
                                            ></span>
                                            <i
                                                *ngIf="isSelected(user)"
                                                class="icon__assign-user-check qt-za-20 qt-sz-20 qt-bg-contain qt-ml-auto"
                                            ></i>
                                        </div>
                                    </ng-template>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <!-- **** Old Component Dropdown ***** -->
        <!-- **** New Component Dropdown ***** -->
        <div
            class="select-wrapper --tooltip-shadow dropdown-assign-ticket dropdown-assign-ticket__assigned-sales-person fixed-assign"
            *ngIf="type === 'COMPANY_SETTINGS'"
        >
            <div class="content dropdown-assign-ticket">
                <form class="px-4 py-3">
                    <div
                        class="assign-ticket"
                        assign-user
                    >
                        <div class="assign-sales-person__header">
                            <div class="assign-sales-person__title qt-mb-16">Assign Sales Person</div>
                            <div class="qt-input-search__page-settings qt-f-1">
                                <input
                                    class="qt-input-search__page-settings-input"
                                    placeholder="Search Users"
                                    autocomplete="off"
                                    id="search-user"
                                    (input)="onSearch($event)"
                                >
                            </div>
                        </div>
                        <div class="assign-sales-person__scroll-pane">
                            <div
                                class="users-list"
                                tabindex="-1"
                            >
                                <ng-template
                                    ngFor
                                    let-user
                                    [ngForOf]="usersList"
                                    let-i="index"
                                    [ngForTrackBy]="trackByIndex"
                                >
                                    <div
                                        class="user-item"
                                        data-index="1"
                                        (click)="selectUser(i)"
                                        [ngClass]="(user.selected) ? 'active' : ''"
                                    >
                                        <a
                                            href="javascript:void(0)"
                                            [id]="user.id"
                                            class="dropdown-link"
                                        >
                                            <div
                                                class="default-user-avatar avatar-background-color-odd ng-scope"
                                                *ngIf="!user.avatar"
                                            >
                                                <span
                                                    class="qt-color-white qt-fs-16"
                                                    [textContent]="(user.firstName) ? user.firstName[0].toUpperCase() : ''"
                                                ></span>
                                            </div>
                                            <div
                                                class="default-user-avatar avatar-background-color-odd ng-scope"
                                                *ngIf="user.avatar"
                                            >
                                                <img
                                                    ng-if="user.avatar"
                                                    class="qt-circle avatar-26"
                                                    style="margin: 0;"
                                                    [src]="'/users/' + (user.id || 'default') + '/image' + (user.avatar ? '.jpg?t=' + user.avatar.updatedAt : '')"
                                                    alt="..."
                                                >
                                            </div>
                                            <span>
                                                <p
                                                    class="dropdown-avatar__name"
                                                    [textContent]="user.firstName + ' ' + user.lastName"
                                                ></p>
                                                <p
                                                    class="dropdown-avatar__email"
                                                    [textContent]="user.primaryEmail"
                                                ></p>
                                            </span>
                                        </a>
                                    </div>
                                </ng-template>
                            </div>
                        </div>
                        <div class="assign-sales-person__footer">
                            <div class="qt-df qt-w100">
                                <button class="qt-button --gray qt-jc-c qt-w100 qt-mr-12">Cancel</button>
                                <button class="qt-button qt-jc-c qt-w100">Save</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <!-- **** New Component Dropdown ***** -->
    </div>
</div>
