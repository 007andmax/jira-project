<ng-template
    ngFor
    let-task
    let-index="index"
    [ngForOf]="getListStartOfHour()"
>
    <div
        class="task"
        [ngStyle]="{
        top: parseStyle(task,index).top + 'px',
        height: parseStyle(task,index).height + 'px',
        left: parseStyle(task,index).left + '%',
        width: parseStyle(task,index).width + '%'
     }"
        [ngClass]="{'--meeting':task.type == 'Meeting',
                                            '--phone-call':task.type == 'Phone call',
                                            '--to-do':task.type == 'To do'
                                        }"
        (click)="editTask(task)"
    >
        <span
            class="calendar-body__hour-cell-title"
            [textContent]="task.title"
        ></span>
        <span
            class="calendar-body__hour-cell-text qt-mt-4"
            [textContent]="parseDate(task)"
        ></span>
    </div>
</ng-template>
