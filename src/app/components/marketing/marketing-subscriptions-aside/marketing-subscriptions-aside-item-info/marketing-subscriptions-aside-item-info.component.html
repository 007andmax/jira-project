<div class="qt-inputs-row qt-mb-12 qt-mt-12">
    <label
        class="qt-checkbox"
        [attr.for]="'subscribe-' + subscription.id"
    >
        <input
            [attr.id]="'subscribe-' + subscription.id"
            type="checkbox"
            [(ngModel)]="subscription.selected"
        >
        <span></span>
        <div
            class="qt-ml-8 qt-fw-400 qt-lh-1 qt-fs-14 qt-color-gray-700"
            [textContent]="subscription.name"
        ></div>
    </label>
</div>
