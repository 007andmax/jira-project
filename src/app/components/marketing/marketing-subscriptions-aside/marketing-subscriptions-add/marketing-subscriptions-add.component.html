<div class="archive-modal de-archive">
    <button
        class="close-modal"
        (click)=cancelConfirm()
    ></button>
    <div class="archive-modal__body">
        <h3>Add Subscription</h3>
        <div class="qt-inputs-row">
            <div
                class="qt-input-block qt-f100"
                [ngClass]="{'--input-error' : disableCreate}"
            >
                <div class="qt-input-block__label">Subscription Name</div>
                <input
                    type="text"
                    placeholder="Enter Subscription Name"
                    [(ngModel)]="name"
                    (input)="checkDublicate()"
                    (keyup)="onKeyUp($event)"
                    maxlength="30"
                    required
                >
                <mat-error
                    class="qt-tooltip-error"
                    *ngIf="disableCreate"
                >
                    This industry is already occupied
                </mat-error>
            </div>
        </div>
    </div>
    <div class="archive-modal__footer">
        <div class="qt-df qt-jc-fe">
            <button
                class="btn-new btn-primary qt-w100 qt-jc-c"
                (click)=save()
            >
                Yes, I am sure
            </button>
            <button
                class="btn-new disabled qt-w100 qt-jc-c"
                (click)=close()
            >
                Cancel
            </button>
        </div>
    </div>
</div>
