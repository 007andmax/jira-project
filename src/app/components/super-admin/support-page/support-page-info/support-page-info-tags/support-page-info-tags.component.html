<div
    class="profile-cmp-board tags-area d-flex"
    ngbDropdown
>
    <div class="qt-page-list__search">
        <input
            type="text"
            autocomplete="off"
            id="dropdown1"
            [(ngModel)]="newTag"
            placeholder="Add/filter tags"
            (input)="onSearch($event)"
            ngbDropdownToggle
        >
    </div>
    <div
        ngbDropdownMenu
        aria-labelledby="dropdown1"
        class="app-drop-down__dropdown"
    >
        <div
            class="no-exist"
            *ngIf="tags.length == 0"
        >
            <div class="no-matching">No matching tags</div>
            <span>
                Try a different keyword or press Cmd+Enter to create a new tag.
            </span>
        </div>
        <div
            class="list-tags-body"
            [ngClass]="{'--closed':tags.length == 0}"
        >
            <ng-template
                ngFor
                let-item
                [ngForOf]="tags"
                let-i="index"
            >
                <div
                    class="company-tag-item"
                    [ngClass]="{'is-hover':item.isHover}"
                    [id]="'tag-' + item.id"
                >
                    <label class="qt-checkbox pointer">
                        <input
                            type="checkbox"
                            [checked]="isSeleted(item)"
                            (change)="toggleItem(item)"
                            readonly
                        >
                        <span></span>
                    </label>
                    <div class="text-content qt-mr-4">
                        <input
                            type="text"
                            [value]="item.word"
                            [readonly]="!item.isEditMode()"
                        >
                        <!-- <div class="name">{{item.word}}</div> -->
                    </div>
                    <i
                        class="icon__save-support-tag qt-sz-16"
                        *ngIf="isSeleted(item) && item.isEditMode()"
                        (click)="item.setEditMode(false);editTag(item.id,$event)"
                    ></i>
                    <i
                        class="icon__edit-category qt-sz-16 qt-mr-8"
                        *ngIf="isSeleted(item) && !item.isEditMode()"
                        (click)="item.setEditMode(true)"
                    ></i>
                    <i
                        class="icon__remove-category qt-sz-16"
                        *ngIf="isSeleted(item) && !item.isEditMode()"
                        (click)="removeTag(item)"
                    ></i>
                </div>
            </ng-template>
        </div>
        <div
            class="crate-tag pointer"
            (click)="addTag()"
        >
            <span class="icon__add-grey qt-sz-12 qt-bg-contain qt-dib qt-mr-6"></span>
            <span [textContent]="(newTag.length > 0) ? ('Create a tag ' + '“' + newTag + '”') : 'Create a tag'"></span>
        </div>
    </div>
    <div class="tags-tab d-flex">
        <span
            class="tag"
            *ngFor="let tag of selectedTag; let i = index;"
        >
            {{getSelectedTag(tag).word}}
            <a
                href="javascript:;"
                (click)="toggleItem(getSelectedTag(tag))"
                class="close"
            >
                <img
                    src="html/assets/img/company-details/tag-close-12.svg"
                    alt="tags"
                >
            </a>
        </span>
    </div>
</div>
