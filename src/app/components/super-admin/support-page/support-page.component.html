<div class="container-page">
    <aside>
        <left-panel-super-admin-categories class="app-left-panel-super-admin-categories"></left-panel-super-admin-categories>
        <hr>
    </aside>
    <div
        class="resize-handle--x"
        data-target="aside"
    ></div>
    <main>
        <support-page-header
            [selectedCategory]="selectedCategory"
            [supportPageCategoryContent]="supportPageCategoryContent"
            (onPreview)="onPreview($event)"
            [hidden]="isShowHelpCenter"
        ></support-page-header>
        <div
            class="support-page-body"
            *ngIf="selectedCategory && !isShowHelpCenter"
        >
            <div
                class="support-page-body__editor"
                *ngIf="!isPreview"
            >
                <support-page-body
                    [editorContent]="content"
                    (onChangeContent)="onChangeContent($event)"
                ></support-page-body>
            </div>
            <div
                class="support-page-body__preview"
                *ngIf="supportPageCategoryContent.document && isPreview"
                [innerHTML]="supportPageCategoryContent.newContent"
            >
            </div>
            <support-page-info
                [isPreview]="isPreview"
                [selectedCategory]="selectedCategory"
                [supportPageCategoryContent]="supportPageCategoryContent"
            ></support-page-info>
        </div>
        <div
            class="support-page-body"
            *ngIf="isShowHelpCenter"
        >
            <div class="help-center">
                <div class="help-center__header">
                    <div class="icon__quicktech_partical_bottom qt-bg-contain"></div>
                    <div class="help-center__header-title">Welcome to Quicktech</div>
                    <div class="help-center__header-text">
                        Demystify Quicktech with our help resources. Learn how to use its features and modules.
                    </div>
                    <div class="icon__quicktech_partical_top qt-bg-contain"></div>
                </div>
                <div class="help-center__body">
                    <div class="help-center__body-row">
                        <ng-template
                            ngFor
                            let-category
                            [ngForOf]="helpCenterCategories"
                            [ngForTrackBy]="trackById"
                        >
                            <div class="support-page-body-category">
                                <div
                                    class="support-page-body-category__header"
                                    [textContent]="category.name"
                                ></div>
                                <ul class="support-page-body-category__body">
                                    <ng-template
                                        ngFor
                                        let-subcategory
                                        [ngForOf]="category.subcategories"
                                        [ngForTrackBy]="trackById"
                                    >
                                        <li [textContent]="subcategory.name"></li>
                                    </ng-template>
                                </ul>
                            </div>
                        </ng-template>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
