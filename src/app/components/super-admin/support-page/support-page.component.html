<div class="container-page">
    <aside>
        <left-panel-super-admin-categories class="app-left-panel-super-admin-categories"></left-panel-super-admin-categories>
        <hr>
    </aside>
    <div
        class="resize-handle--x"
        data-target="aside"
    ></div>
    <main>
        <support-page-header
            #header
            [selectedCategory]="selectedCategory"
            [supportPageCategoryContent]="supportPageCategoryContent"
            (onPreview)="onPreview($event)"
            [hidden]="isShowHelpCenter"
        ></support-page-header>
        <div
            class="support-page-body"
            *ngIf="selectedCategory && !isShowHelpCenter"
        >
            <div
                class="support-page-body__editor"
                *ngIf="!isPreview"
            >
                <support-page-body
                    [editorContent]="content"
                    (onChangeContent)="onChangeContent($event)"
                ></support-page-body>
            </div>
            <div
                class="support-page-body__preview"
                *ngIf="supportPageCategoryContent.document && isPreview"
                [innerHTML]="supportPageCategoryContent.newContent"
            >
            </div>
            <support-page-info
                [isPreview]="isPreview"
                [selectedCategory]="selectedCategory"
                [supportPageCategoryContent]="supportPageCategoryContent"
            ></support-page-info>
        </div>
        <div
            class="support-page-body"
            *ngIf="isShowHelpCenter"
        >
            <div class="help-center">
                <div class="help-center__header">
                    <div class="icon__quicktech_partical_bottom qt-bg-contain"></div>
                    <div class="help-center__header-title">Welcome to Quicktech</div>
                    <div class="help-center__header-text">
                        Demystify Quicktech with our help resources. Learn how to use its features and modules.
                    </div>
                    <div class="icon__quicktech_partical_top qt-bg-contain"></div>
                </div>
                <div class="help-center__body">
                    <div class="help-center__body-row">
                        <ng-template
                            ngFor
                            let-category
                            [ngForOf]="categories"
                            [ngForTrackBy]="trackById"
                        >
                            <div class="support-page-body-category">
                                <div
                                    class="support-page-body-category__header"
                                    [ngClass]="{'pointer':category.document}"
                                    [textContent]="category.name"
                                    (click)="showPreview(category)"
                                ></div>
                                <ul class="support-page-body-category__body">
                                    <ng-template
                                        ngFor
                                        let-subcategory
                                        [ngForOf]="category.subcategories"
                                        [ngForTrackBy]="trackById"
                                    >
                                        <li>
                                            <div class="qt-df qt-ai-c">
                                              <div
                                                class="icon__category-closed qt-mr-10 pointer"
                                                [ngClass]="{'toggle-category':subcategory.toggleSubCategory}"
                                                (click)="subcategory.toggleSubCategory = !subcategory.toggleSubCategory"
                                                *ngIf="subcategory.subcategories.length > 0"
                                              ></div>
                                              <span
                                                class="category-item-category__name-text"
                                                [ngClass]="{'pointer':subcategory.document}"
                                                [textContent]="subcategory.name"
                                                (click)="showPreview(subcategory)"
                                              ></span>
                                            </div>
                                            <ul
                                                class="category-item-sub-category qt-ml-20"
                                                *ngIf="subcategory.toggleSubCategory"
                                            >
                                                <ng-template
                                                    ngFor
                                                    let-subsubcategory
                                                    [ngForOf]="subcategory.subcategories"
                                                    [ngForTrackBy]="trackById"
                                                >
                                                    <li
                                                        class="category-item-sub-sub-category-body"
                                                        [attr.id]="subsubcategory.id"
                                                        [attr.category-id]="subcategory.id"
                                                    >
                                                        <div class="category-item-category">
                                                            <div class="category-item-category__name">
                                                               <div class="qt-df qt-ai-c">
                                                                 <div
                                                                   class="icon__category-closed qt-mr-10 pointer"
                                                                   [ngClass]="{'toggle-category':subsubcategory.toggleSubCategory}"
                                                                   (click)="subsubcategory.toggleSubCategory = !subsubcategory.toggleSubCategory"
                                                                   *ngIf="subsubcategory.subcategories.length > 0"
                                                                 ></div>
                                                                 <span
                                                                   class="category-item-category__name-text"
                                                                   [ngClass]="{'pointer':subsubcategory.document}"
                                                                   [textContent]="subsubcategory.name"
                                                                   (click)="showPreview(subsubcategory)"
                                                                 ></span>
                                                               </div>
                                                            </div>
                                                        </div>
                                                        <ul
                                                            class="category-item-sub-sub-sub-category qt-ml-20"
                                                            *ngIf="subsubcategory.toggleSubCategory"
                                                        >
                                                            <ng-template
                                                                ngFor
                                                                let-subsubsubcategory
                                                                [ngForOf]="subsubcategory.subcategories"
                                                                [ngForTrackBy]="trackById"
                                                            >
                                                                <li
                                                                    class="category-item-sub-sub-sub-category-body"
                                                                    [attr.id]="subsubsubcategory.id"
                                                                    [attr.category-id]="subsubcategory.id"
                                                                >
                                                                    <div class="category-item-category">
                                                                        <div class="category-item-category__name">
                                                                            <span
                                                                                class="category-item-category__name-text"
                                                                                [ngClass]="{'pointer':subsubsubcategory.document}"
                                                                                [textContent]="subsubsubcategory.name"
                                                                                (click)="showPreview(subsubsubcategory)"
                                                                            ></span>
                                                                        </div>
                                                                    </div>
                                                                </li>
                                                            </ng-template>
                                                        </ul>
                                                    </li>
                                                </ng-template>
                                            </ul>
                                        </li>
                                    </ng-template>
                                </ul>
                            </div>
                        </ng-template>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
