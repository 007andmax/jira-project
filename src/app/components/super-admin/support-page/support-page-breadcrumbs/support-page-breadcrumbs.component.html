<div
    class="breadcrumbs"
    *ngIf="selectedCategory"
>
    <div class="breadcrumbs-location qt-fs-0 pointer">
        <span [textContent]="category"></span>
        <div class="breadcrumb-separator">/</div>
    </div>
    <div
        class="breadcrumbs-attribute qt-fs-0"
        *ngIf="subCategory"
    >
        <span [textContent]="subCategory"></span>
        <div class="breadcrumb-separator">/</div>
    </div>
    <div
        class="breadcrumbs-path qt-fs-0"
        *ngIf="subsubCategory"
    >
        <span [textContent]="subsubCategory"></span>
        <div class="breadcrumb-separator">/</div>
    </div>
    <div
        class="breadcrumbs-path qt-fs-0"
        *ngIf="subsubSubCategory"
    >
        <span [textContent]="subsubSubCategory"></span>
    </div>
</div>
