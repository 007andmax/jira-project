<div class="aside-filters">
    <div class="aside-filters-header qt-df qt-ai-c qt-jc-sb">
        <div class="aside-filters-header__title">Create Topic</div>
        <div
            class="qt-button --square-md --gray pointer"
            (click)="close()"
        >
            <div class="qt-icon icon__close qt-bg-contain qt-sz-16 pointer"></div>
        </div>
    </div>
    <div class="aside-filters-content">
        <div class="left-panel-ng2__content--filters aside-filters-content__main">
            <div class="draft-email-container">
                <div class="qt-w100 editor-container qt-mt-0 qt-mb-16">
                    <div class="qt-inputs-row qt-mb-4">
                        <div class="qt-input-block">
                            <input
                                id="add-ticket-subject"
                                class="qt-input-block__input"
                                [ngClass]="{'--input-error' : !validate.getTitle()}"
                                [(ngModel)]="news.title"
                                type="text"
                                placeholder="Title"
                                minlength="1"
                                maxlength="255"
                                (input)="onChangeTitle()"
                            >
                            <app-mat-error
                                class="invalid-feedback error-title"
                                *ngIf="!validate.getTitle()"
                            >
                                Title is required
                            </app-mat-error>
                        </div>
                    </div>
                    <div
                        id="froala-editor"
                        class="CodeMirror-scroll cm-s-default"
                        [froalaEditor]="options"
                        [(froalaModel)]="news.content"
                        (froalaInit)="initialize($event)"
                    >
                        Hello, Froala!
                    </div>
                    <app-mat-error
                        class="invalid-feedback error-description"
                        *ngIf="!validate.getContent()"
                    >
                        Content is required
                    </app-mat-error>
                </div>
                <div class="qt-inputs-row">
                    <div class="qt-input-block qt-f100">
                        <app-drop-down
                            [class]="['qt-select-input-40']"
                            [placeholder]="'Select'"
                            [container]="'body'"
                            [editItem]="selectedStatus"
                            [field]="'title'"
                            [list]="list"
                            [isBlockClear]="true"
                            [search]="true"
                            [change]="true"
                            [title]="'Status'"
                            (onSelectedItem)="onSelectStatus($event)"
                        >
                        </app-drop-down>
                    </div>
                </div>
            </div>
        </div>
        <div class="aside-filters-content__footer">
            <div class="qt-df">
                <button
                    class="qt-button --md --gray qt-mr-12 qt-w100 qt-jc-c"
                    (click)="close()"
                >
                    Cancel
                </button>
                <button
                    class="qt-button --md qt-w100 qt-jc-c"
                    [ngClass]="{'--loading':addBtn.isBlock()}"
                    appDisabledBtn
                    #addBtn="disabled"
                    (onClick)="add()"
                >
                    <span>Save</span>
                    <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
                </button>
            </div>
        </div>
    </div>
</div>
