<div
    class="aside-filters"
    [hidden]="!open"
>
    <div class="aside-filters-header qt-df qt-ai-c qt-jc-sb">
        <div class="aside-filters-header__title">Edit Topic</div>
        <div
            class="qt-button --square-md --gray pointer"
            (click)="close()"
        >
            <div class="icon__close qt-bg-contain qt-sz-16 pointer"></div>
        </div>
    </div>
    <div class="aside-filters-content">
        <div class="left-panel-ng2__content--filters aside-filters-content__main">
            <div class="draft-email-container">
                <div class="qt-w100 editor-container qt-mt-0 qt-mb-16">
                    <div class="qt-inputs-row qt-mb-8">
                        <div class="qt-input-block">
                            <input
                                id="add-ticket-subject"
                                class="qt-input-block__input"
                                [ngClass]="{'--input-error' : !validate.getTitle()}"
                                [(ngModel)]="news.title"
                                type="text"
                                placeholder="Title"
                                minlength="1"
                                maxlength="255"
                                (input)="onChangeTitle()"
                            >
                            <mat-error
                                class="invalid-feedback"
                                *ngIf="!validate.getTitle()"
                            >
                                Title is required
                            </mat-error>
                        </div>
                    </div>
                    <div
                        id="froala-editor"
                        class="CodeMirror-scroll cm-s-default"
                        [froalaEditor]="options"
                        [(froalaModel)]="content"
                        (froalaInit)="initialize($event)"
                    >
                        Hello, Froala!
                    </div>
                    <mat-error
                        class="invalid-feedback"
                        *ngIf="!validate.getContent()"
                    >
                        Content is required
                    </mat-error>
                </div>
                <div class="qt-inputs-row">
                    <div class="qt-input-block qt-f100">
                        <app-drop-down
                            [class]="['qt-select-input-40']"
                            [placeholder]="'Select'"
                            [container]="'body'"
                            [editItem]="selectedStatus"
                            [field]="'title'"
                            [list]="list"
                            [isBlockClear]="true"
                            [search]="true"
                            [change]="true"
                            [title]="'Status'"
                            (onSelectedItem)="onSelectStatus($event)"
                        >
                        </app-drop-down>
                    </div>
                </div>
            </div>
        </div>
        <div class="aside-filters-content__footer">
            <div class="qt-df">
                <button
                    class="qt-button --md --gray qt-mr-12 qt-w100 qt-jc-c"
                    (click)="close()"
                >
                    Cancel
                </button>
                <button
                    class="qt-button --md qt-w100 qt-jc-c"
                    (click)="edit()"
                >
                    Save
                </button>
            </div>
        </div>
    </div>
</div>
