<div class="app-left-panel__header">
    <div class="app-left-panel__systems-info">
        <div
            class="qt-df qt-ai-c"
            ngbDropdown
        >
            <app-dynamic-tooltip
                [content]="getFullUserName()"
                [position]="'right'"
                #userTooltip
            ></app-dynamic-tooltip>
            <div
                class="qt-table-modern__circle-avatar pointer"
                [ngClass]="!usersStateService.getNameForAvatar(usersStateService.getCurrentUser()).length ? 'transparent-text' : ''"
                [textContent]="usersStateService.getNameForAvatar(usersStateService.getCurrentUser())"
                [ngStyle]="{'background': ticketsListService.getStyleAvatar(usersStateService.getCurrentUser(),'#7C77CB') }"
                id="dropdownSupperUser"
                ngbDropdownToggle
                (mouseenter)="userTooltip.show($event.target)"
                (mouseleave)="userTooltip.hide()"
            ></div>
            <ul
                class="qt-dropdown-menu"
                ngbDropdownMenu
                aria-labelledby="dropdownSupperUser"
            >
                <li
                    ngbDropdownItem
                    (click)="logOut()"
                >
                    Logout
                </li>
            </ul>
        </div>
    </div>
</div>
<div class="app-left-panel__body">
    <div>
        <div
            class="app-left-panel__menu-icon-wrap"
            [ngClass]="{'--active':state === 'support-page' }"
            (click)="onChangeState('support-page');"
        >
            <div class="app-left-panel__menu-icon icon__support-page qt-sz-20"></div>
        </div>
        <div
            class="app-left-panel__menu-icon-wrap"
            (click)="onChangeState('tech-companies');"
            [ngClass]="{'--active':state === 'tech-companies' }"
        >
            <div class="app-left-panel__menu-icon icon__menu-company qt-sz-20"></div>
        </div>
    </div>
</div>
