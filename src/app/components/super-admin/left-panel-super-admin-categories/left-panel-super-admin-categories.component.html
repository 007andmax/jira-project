<button
    class="qt-button qt-mr-12"
    (click)="add()"
>
    Add Category
</button>
<div>
    <ng-template
        ngFor
        let-category
        [ngForOf]="categories"
        [ngForTrackBy]="trackById"
    >
        <div class="category-item">
            <div class="category-item-category">
                <div
                    class="icon__category-closed qt-mr-25"
                    [ngClass]="{'toggle-category':category.toggleSubCategory}"
                    (click)="category.toggleSubCategory = !category.toggleSubCategory"
                ></div>
                <span
                    [ngClass]="{'status-published':category.type === 'PUBLISHED',
            'status-draft':category.type === 'DRAFT'}"
                    [textContent]="category.name"
                ></span>
                <left-panel-super-admin-categories-actions [category]="category"></left-panel-super-admin-categories-actions>
            </div>
            <div
                class="category-item-sub-category qt-ml-10"
                *ngIf="category.toggleSubCategory"
                appDragMenu
                (dropEnd)="onDropEnd($event)"
            >
                <ng-template
                    ngFor
                    let-subcategory
                    [ngForOf]="category.subcategories"
                >
                    <div
                        class="category-item-category-body"
                        [attr.id]="subcategory.id"
                    >
                        <div class="category-item-category">
                            <div class="icon__drag qt-sz-20 qt-mr-25"></div>
                            <div
                                class="icon__category-closed qt-mr-25"
                                [ngClass]="{'toggle-category':subcategory.toggleSubCategory}"
                                (click)="subcategory.toggleSubCategory = !subcategory.toggleSubCategory"
                            ></div>
                            <span [textContent]="subcategory.name"></span>
                            <left-panel-super-admin-categories-actions [category]="subcategory"></left-panel-super-admin-categories-actions>
                        </div>
                        <div
                            class="category-item-sub-category qt-ml-10"
                            *ngIf="subcategory.toggleSubCategory"
                        >
                            <ng-template
                                ngFor
                                let-subsubcategory
                                [ngForOf]="subcategory.subcategories"
                                [ngForTrackBy]="trackById"
                            >
                                <div class="category-item-category">
                                    <div
                                        class="icon__category-closed qt-mr-25"
                                        [ngClass]="{'toggle-category':subsubcategory.toggleSubCategory}"
                                        (click)="subsubcategory.toggleSubCategory = !subsubcategory.toggleSubCategory"
                                    ></div>
                                    <span [textContent]="subsubcategory.name"></span>
                                    <left-panel-super-admin-categories-actions [category]="subsubcategory"></left-panel-super-admin-categories-actions>
                                </div>
                                <div
                                    class="category-item-sub-category qt-ml-10"
                                    *ngIf="subsubcategory.toggleSubCategory"
                                >
                                    <ng-template
                                        ngFor
                                        let-subsubsubcategory
                                        [ngForOf]="subsubcategory.subcategories"
                                        [ngForTrackBy]="trackById"
                                    >
                                        <div class="category-item-category">
                                            <span [textContent]="subsubsubcategory.name"></span>
                                            <left-panel-super-admin-categories-actions [category]="subsubsubcategory"></left-panel-super-admin-categories-actions>
                                        </div>
                                    </ng-template>
                                </div>
                            </ng-template>
                        </div>
                    </div>
                </ng-template>
            </div>
        </div>
    </ng-template>
</div>
