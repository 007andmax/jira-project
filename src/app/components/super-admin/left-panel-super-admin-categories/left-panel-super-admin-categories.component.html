<button
    class="qt-button qt-mr-12"
    (click)="add()"
>
    Add Category
</button>
<div>
    <ng-template
        ngFor
        let-category
        [ngForOf]="categories"
        [ngForTrackBy]="trackById"
    >
        <div class="category-item">
            <div class="icon__category-closed qt-mr-25"></div>
            <span
                [ngClass]="{'status-published':category.type === 'PUBLISHED',
            'status-draft':category.type === 'DRAFT'}"
                [textContent]="category.name"
            ></span>
            <div
                class="category-actions"
                ngbDropdown
            >
                <div
                    class="icon__category-more qt-sz-20 pointer"
                    ngbDropdownToggle
                ></div>
                <div
                    ngbDropdownMenu
                    class="app-drop-down__dropdown"
                >
                    <div
                        class="add-sub-category-item"
                        (click)="addSubCategory(category.id)"
                        ngbDropdownToggle
                    >
                        <div class="icon__add-sub-category qt-sz-20 pointer qt-mr-10"></div>
                        <span>Add Sub Category</span>
                    </div>
                    <div
                        class="add-sub-category-item"
                        ngbDropdownToggle
                    >
                        <div class="icon__add-article qt-sz-20 pointer qt-mr-10"></div>
                        <span>Add Article</span>
                    </div>
                    <div
                        class="add-sub-category-item"
                        ngbDropdownToggle
                        (click)="editCategory(category)"
                    >
                        <div class="icon__edit-category qt-sz-20 pointer qt-mr-10"></div>
                        <span>Edit</span>
                    </div>
                    <div
                        class="add-sub-category-item"
                        ngbDropdownToggle
                        (click)="delete(category)"
                    >
                        <div class="icon__remove-category qt-sz-20 pointer qt-mr-10"></div>
                        <span>Delete</span>
                    </div>
                </div>
            </div>
        </div>
    </ng-template>
</div>
