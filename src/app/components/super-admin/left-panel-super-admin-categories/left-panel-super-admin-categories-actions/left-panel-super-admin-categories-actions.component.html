<div
    class="category-actions"
    ngbDropdown
    container="body"
>
    <app-dynamic-tooltip
        [content]="'More'"
        [position]="'top'"
        #moreTooltip
    ></app-dynamic-tooltip>
    <div
        class="icon__category-more qt-sz-20 pointer"
        ngbDropdownToggle
        id="dropdown1"
    ></div>
    <div
        ngbDropdownMenu
        class="app-drop-down__dropdown"
        aria-labelledby="dropdown1"
    >
        <div
            class="add-sub-category-item"
            (click)="addSubCategory(category.id)"
            ngbDropdownToggle
            *ngIf="!disabledAddSub"
        >
            <div class="icon__add-sub-category qt-sz-20 pointer qt-mr-10"></div>
            <span>Add Sub Category</span>
        </div>
        <div
            class="add-sub-category-item"
            ngbDropdownToggle
            (click)="addArticle()"
            *ngIf="!category.document"
        >
            <div class="icon__add-article qt-sz-20 pointer qt-mr-10"></div>
            <span>Add Article</span>
        </div>
        <div
            class="add-sub-category-item"
            ngbDropdownToggle
            (click)="editCategory(category)"
        >
            <div class="icon__edit qt-sz-20 pointer qt-bg-contain qt-mr-10"></div>
            <span>Edit</span>
        </div>
        <div
            class="add-sub-category-item"
            ngbDropdownToggle
            (click)="delete(category)"
        >
            <div class="icon__new-remove qt-sz-20 pointer qt-bg-contain qt-mr-10"></div>
            <span>Delete</span>
        </div>
    </div>
</div>
