<div class="sidebar-network qt-pt-24 qt-pb-24 qt-pl-24 qt-pr-24">
    <div
        class="company-device-aside__info-block"
        [ngClass]="{'--collapsed' :toggleIpSettings}"
    >
        <div class="qt-df qt-jc-sb">
            <div class="sidebar-network__title qt-fw-600">IP Settings</div>
            <div
                class="company-device-aside__expand-collapse qt-sz-16"
                (click)="toggleIpSettings = !toggleIpSettings"
            ></div>
        </div>
        <div class="sidebar-network__info">
            <div class="sidebar-network__info-title">Model(s):</div>
            <div
                class="sidebar-network__info-text"
                [textContent]="chackDefaultValue(getNetworkAdapterField('description'))"
            ></div>
        </div>
        <div class="sidebar-network__info">
            <div class="sidebar-network__info-title">IP:</div>
            <div
                class="sidebar-network__info-text"
                [textContent]="chackDefaultValue(getNetworkAdapterField('ip_address'))"
            ></div>
        </div>
        <div class="sidebar-network__info">
            <div class="sidebar-network__info-title">Subnet Mask:</div>
            <div
                class="sidebar-network__info-text"
                [textContent]="chackDefaultValue(getNetworkAdapterField('subnet'))"
            ></div>
        </div>
        <div class="sidebar-network__info">
            <div class="sidebar-network__info-title">DNS 1:</div>
            <div
                class="sidebar-network__info-text"
                [textContent]="chackDefaultValue(getNetworkAdapterField('dns'))"
            ></div>
        </div>
        <div class="sidebar-network__info">
            <div class="sidebar-network__info-title">Link Speed:</div>
            <div
                class="sidebar-network__info-text"
                [textContent]="getLinkSpeed() + ' (MegaBit)'"
            ></div>
        </div>
        <div class="sidebar-network__info">
            <div class="sidebar-network__info-title">External IP:</div>
            <div
                class="sidebar-network__info-text"
                [textContent]="chackDefaultValue(device.report.externalIp)"
            ></div>
        </div>
        <div class="sidebar-network__info">
            <div class="sidebar-network__info-title">MAC:</div>
            <div
                class="sidebar-network__info-text"
                [textContent]="chackDefaultValue(formatMacAddress(getNetworkAdapterField('mac')))"
            >
            </div>
        </div>
        <div class="sidebar-network__info">
            <div class="sidebar-network__info-title">DHCP:</div>
            <div
                class="sidebar-network__info-text"
                [textContent]="chackDefaultValue(getNetworkAdapterField('dhcp_server'))"
            ></div>
        </div>
    </div>
    <div class="qt-divider qt-mt-24 qt-mb-24"></div>
</div>
