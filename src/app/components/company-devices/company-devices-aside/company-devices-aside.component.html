<div
    class="company-devices-page__aside company-device-aside"
    *ngIf="open"
>
    <div
        class="loading"
        *ngIf="showPreloader"
    ></div>
    <div *ngIf="!showPreloader">
        <div class="company-device-aside__menu">
            <ng-template
                ngFor
                let-item
                [ngForOf]="devices"
                [ngForTrackBy]="trackById"
            >
                <app-company-devices-aside-device-icon
                    (onSelect)="setCurrentDevice(item)"
                    [currentDevice]="currentDevice"
                    [device]="item"
                ></app-company-devices-aside-device-icon>
            </ng-template>
            <ng-template
                ngFor
                let-item
                [ngForOf]="customDevices"
                [ngForTrackBy]="trackById"
            >
                <app-company-devices-aside-device-icon
                    (onSelect)="setCustomDevice(item)"
                    [currentDevice]="customDevice"
                    [customDevice]="item"
                ></app-company-devices-aside-device-icon>
            </ng-template>
        </div>
        <div class="company-device-aside__header qt-df qt-ai-c qt-jc-sb">
            <div class="qt-df qt-ai-c">
                <div
                    class="icon qt-sz-24 qt-mr-12 qt-icon"
                    [ngClass]="{'qt-icon icon__devices' : getFieldForCheckIcon() === 'workstation' || !getFieldForCheckIcon(),
               'icon__router' : getFieldForCheckIcon() === 'router',
            'icon__print' : getFieldForCheckIcon() === 'printer',
                'qt-icon icon__network-switch' : getFieldForCheckIcon() === 'switch',
          'icon__server' : getFieldForCheckIcon() === 'server',
            'icon__tablet' : getFieldForCheckIcon() === 'tablet',
            'icon__network_device' : getFieldForCheckIcon() === 'network device',
            'icon__old-phone' : getFieldForCheckIcon() === 'phone',
             'icon__generic_device' : getFieldForCheckIcon() === 'generic device',
        '--offline': currentDevice && !currentDevice.online,
    '--online':currentDevice &&currentDevice.online }"
                ></div>
                <div
                    class="qt-fs-13 qt-fw-600 qt-lh-154 company-device-aside__header-title"
                    [textContent]="getTextForDisplayName()"
                >
                </div>
            </div>
            <div class="qt-df qt-ai-c">
                <div
                    ngbDropdown
                    container="body"
                    class="qt-overflow-v"
                >
                    <div
                        class="qt-sz-24 qt-mr-8 qt-pointer company-device-aside__more-icon qt-df qt-ai-c qt-jc-c"
                        ngbDropdownToggle
                    >
                      <div class="qt-icon icon__more qt-sz-18"></div>
                    </div>
                    <ul
                        class="qt-dropdown-menu --open-bot qt-overflow-v"
                        ngbDropdownMenu
                    >
                        <li
                            class="pointer"
                            ngbDropdownItem
                            (click)="gotiDetailDevice()"
                            *ngIf="currentDevice && !customerPortalStateService.isCustomerPortal"
                        >
                            <div class="qt-ic-c qt-icon icon__external-link qt-pointer qt-sz-20 qt-mr-12"></div>
                            Device Detail
                        </li>
                        <li
                            class="pointer"
                            ngbDropdownItem
                            *ngIf="currentDevice && currentDevice.type !== 'workstation' && currentDevice.online && (getPermissions('REMOTE_CONNECTIONS') || customerPortalStateService.checkRemoteAccess(usersStateService.getCurrentUser()))"
                            (click)="remoteAccess('PROXY')"
                        >
                            <div class="qt-ic-c qt-icon icon__remote-access qt-pointer qt-sz-20 qt-mr-12"></div>
                            Remote Access
                        </li>
                        <li
                            class="pointer"
                            *ngIf="currentDevice && currentDevice.type === 'workstation' && currentDevice.online && (getPermissions('REMOTE_CONNECTIONS') || customerPortalStateService.checkRemoteAccess(usersStateService.getCurrentUser()))"
                            (click)="showRemoteAccess = !showRemoteAccess "
                        >
                            <div class="qt-ic-c qt-icon icon__remote-access qt-pointer qt-sz-20 qt-mr-12"></div>
                            Remote Access
                            <ul
                                class="dropdown-menu-qt__submenu dropdown-menu"
                                *ngIf="showRemoteAccess"
                            >
                                <li
                                    ngbDropdownItem
                                    (click)="remoteAccess('CSS')"
                                >
                                    Custom Share Screen
                                </li>
                                <li
                                    ngbDropdownItem
                                    (click)="remoteAccess('RDP')"
                                >
                                    Remote desktop protocol
                                </li>
                            </ul>
                        </li>
                        <li
                            class="pointer"
                            (click)="turnOff('reboot')"
                            ngbDropdownItem
                            *ngIf="currentDevice && !customerPortalStateService.isCustomerPortal"
                        >
                            <div class="qt-icon icon__reset qt-bg-contain qt-sz-20 qt-mr-12"></div>
                            Restart
                        </li>
                        <li
                            class="pointer"
                            (click)="turnOff('shutdown')"
                            ngbDropdownItem
                            *ngIf="currentDevice && !customerPortalStateService.isCustomerPortal"
                        >
                            <div class="qt-icon icon__shutdown qt-bg-contain qt-sz-20 qt-mr-12"></div>
                            Shutdown
                        </li>
                        <li
                            class="pointer"
                            (click)="setMasterAgent()"
                            *ngIf="currentDevice && !currentDevice.master && !customerPortalStateService.isCustomerPortal"
                            ngbDropdownItem
                        >
                            <div class="qt-icon icon__agent qt-sz-20 qt-mr-12"></div>
                            Set as Master Agent
                        </li>
                        <li
                            class="pointer"
                            (click)="removeCurrentDevice()"
                            *ngIf="!customerPortalStateService.isCustomerPortal"
                        >
                            <div class="qt-icon icon__remove pointer qt-bg-contain qt-sz-20 qt-mr-12"></div>
                            Remove
                        </li>
                    </ul>
                </div>
                <div
                    class="qt-sz-24 qt-pointer company-device-aside__close-icon qt-icon icon__close"
                    *ngIf="devices.length > 1"
                    (click)="removeDevice()"
                ></div>
                <div
                    class="qt-pointer company-device-aside__arrow-right-icon qt-df qt-ai-c qt-jc-c"
                    (click)="close()"
                >
                  <div class="qt-icon icon__arrow-right qt-sz-24"></div>
                </div>
            </div>
        </div>
        <div class="company-device-aside__subheader">
            <div
                class="company-device-aside__subheader-item subheader-item-system"
                [ngClass]="{'--active':tab === 'SYSTEM'}"
                (click)="tab = 'SYSTEM'"
            ></div>
            <div
                class="company-device-aside__subheader-item subheader-item-network"
                [ngClass]="{'--active':tab === 'NETWORK'}"
                (click)="tab = 'NETWORK'"
            ></div>
            <div
                *ngIf="currentDevice"
                class="company-device-aside__subheader-item subheader-item-software"
                [ngClass]="{'--active':tab === 'SOFTWARE'}"
                (click)="tab = 'SOFTWARE'"
            ></div>
            <div
                *ngIf="currentDevice"
                class="company-device-aside__subheader-item qt-df qt-ai-c qt-jc-c"
                [ngClass]="{'--active':tab === 'UPDATES'}"
                (click)="tab = 'UPDATES'"
            >
              <div class="qt-icon icon__update qt-sz-16"></div>
            </div>
        </div>
        <div class="company-device-aside__body">
            <app-company-devices-aside-system
                #system
                [device]="currentDevice"
                [customDevice]="customDevice"
                *ngIf="tab === 'SYSTEM'"
            ></app-company-devices-aside-system>
            <app-company-devices-aside-network-tab
                #network
                [device]="currentDevice"
                [customDevice]="customDevice"
                *ngIf="tab === 'NETWORK'"
            ></app-company-devices-aside-network-tab>
            <app-company-devices-aside-software
                [device]="currentDevice"
                *ngIf="tab === 'SOFTWARE'"
            ></app-company-devices-aside-software>
            <app-company-devices-aside-updates
                [device]="currentDevice"
                *ngIf="tab === 'UPDATES'"
            ></app-company-devices-aside-updates>
        </div>
    </div>
</div>
