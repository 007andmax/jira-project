<div
    class="company-device-aside__menu-item qt-pointer"
    [ngClass]="{'--active': currentDevice && (currentDevice.id === (device && device.id) || currentDevice.id === (customDevice && customDevice.id))}"
    (click)="select()"
>
    <ng-template
        #asideMenuItem
        class="tooltip"
    >
        {{getTextForTooltip()}}
    </ng-template>
    <div
        placement="left"
        [ngbTooltip]="asideMenuItem"
        class="qt-sz-24 qt-icon"
        [ngClass]="{'qt-icon icon__devices' : getFieldForCheckIcon() === 'workstation' || !getFieldForCheckIcon(),
               'qt-icon icon__router' : getFieldForCheckIcon() === 'router',
            'qt-icon icon__print' : getFieldForCheckIcon() === 'printer',
                'qt-icon icon__network-switch' : getFieldForCheckIcon() === 'switch',
          'qt-icon icon__server' : getFieldForCheckIcon() === 'server',
            'qt-icon icon__tablet' : getFieldForCheckIcon() === 'tablet',
            'qt-icon icon__network_device' : getFieldForCheckIcon() === 'network device',
            'qt-icon icon__old-phone' : getFieldForCheckIcon() === 'phone',
             'qt-icon icon__generic_device' : getFieldForCheckIcon() === 'generic device',
        '--ofline': !(device || customDevice).online }"
    ></div>
</div>
