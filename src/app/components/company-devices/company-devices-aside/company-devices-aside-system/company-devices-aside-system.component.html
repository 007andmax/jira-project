<div class="sidebar-system qt-pt-24 qt-pb-24 qt-pl-24 qt-pr-24">
    <div
        class="company-device-aside__info-block"
        [ngClass]="{'--collapsed' :toggleDeviceSpecifications}"
    >
        <div class="qt-df qt-jc-sb">
            <div class="sidebar-system__title qt-fw-600">Device Specifications</div>
            <div
                class="company-device-aside__expand-collapse qt-sz-16"
                (click)="toggleDeviceSpecifications = !toggleDeviceSpecifications"
            ></div>
        </div>
        <div>
            <div class="sidebar-system__info edit-field">
                <div class="sidebar-system__info-title">Name</div>
                <app-company-devices-edit-label
                    *ngIf="device"
                    #nameLabel
                    [field]="getLabelForEdit()"
                    [placeholder]="'Enter Name here'"
                    [isDisabled]="customerPortalStateService.isCustomerPortal"
                    class="company-device-edit-name"
                    (onChange)="onChangeName($event)"
                ></app-company-devices-edit-label>
                <app-company-devices-edit-label
                    #nameLabel
                    *ngIf="customDevice"
                    [field]="customDevice.name"
                    [placeholder]="'Enter device name'"
                    [isDisabled]="customerPortalStateService.isCustomerPortal"
                    class="company-device-edit-name"
                    (onChange)="onChangeName($event)"
                ></app-company-devices-edit-label>
            </div>
        </div>
        <div>
            <div class="sidebar-system__info">
                <div class="sidebar-system__info-title">Asset type</div>
                <app-company-devices-edit-label
                    *ngIf="device"
                    #assetTagLabel
                    [field]="getSystemField('assetTag') || ''"
                    [placeholder]="'Enter Asset type'"
                    class="company-device-edit-name"
                    [isDisabled]="customerPortalStateService.isCustomerPortal"
                    (onChange)="onChangeHardware(device.getDataForUpdateAssetTag($event),'assetTag',$event)"
                ></app-company-devices-edit-label>
                <app-drop-down
                    #assestTypeDd
                    *ngIf="customDevice"
                    class="qt-editable-dropdown qt-w100 company-devices-aside-system-dp"
                    [placeholder]="'Select'"
                    [field]="'name'"
                    [list]="assestType"
                    [editItem]="customDevice.type"
                    [search]="true"
                    [change]="true"
                    [isDisabled]="customerPortalStateService.isCustomerPortal"
                    (onSelectedItem)="onSelectAssestType($event)"
                    heightInput="auto"
                ></app-drop-down>
            </div>
        </div>
        <div>
            <div class="sidebar-system__info">
                <div class="sidebar-system__info-title">Manufacturer</div>
                <app-company-devices-edit-label
                    *ngIf="device"
                    [field]="getSystemField('manufacturer') || ''"
                    [placeholder]="'Enter Manufacturer'"
                    class="company-device-edit-name"
                    [isDisabled]="customerPortalStateService.isCustomerPortal"
                    (onChange)="onChangeHardware(device.getDataForUpdateManufacturer($event),'manufacturer',$event)"
                ></app-company-devices-edit-label>
                <app-drop-down
                    #manufacturerDd
                    *ngIf="customDevice"
                    class="qt-editable-dropdown qt-w100 company-devices-aside-system-dp"
                    [placeholder]="'Select'"
                    [field]="'name'"
                    [list]="manufactures"
                    [editItem]="customDevice.manufacturer"
                    [search]="true"
                    [change]="true"
                    [isDisabled]="customerPortalStateService.isCustomerPortal"
                    (onSelectedItem)="onSelectManufacture($event)"
                    heightInput="auto"
                ></app-drop-down>
            </div>
        </div>
        <div class="sidebar-system__info">
            <div class="sidebar-system__info-title">IP address</div>
            <div
                *ngIf="device"
                class="sidebar-system__info-text qt-df qt-ai-c"
                [textContent]="chackDefaultValue(getNetworkAdapterField('ipAddress'))"
            ></div>
            <app-company-devices-edit-ip
                #ipAddressLabel
                *ngIf="customDevice"
                [field]="customDevice.ip"
                [placeholder]="'Enter ip address'"
                [isDisabled]="customerPortalStateService.isCustomerPortal"
                class="company-device-edit-name"
                (onChange)="onChangeIp($event)"
            ></app-company-devices-edit-ip>
        </div>
        <div>
            <div class="sidebar-system__info">
                <div class="sidebar-system__info-title">Computer Model</div>
                <app-company-devices-edit-label
                    *ngIf="device"
                    [field]="getSystemField('model') || ''"
                    [placeholder]="'Enter Model'"
                    class="company-device-edit-name"
                    [isDisabled]="customerPortalStateService.isCustomerPortal"
                    (onChange)="onChangeHardware(device.getDataForUpdateModel($event),'model',$event)"
                ></app-company-devices-edit-label>
                <app-drop-down
                    #modelDd
                    *ngIf="customDevice"
                    class="qt-editable-dropdown qt-w100 company-devices-aside-system-dp"
                    [placeholder]="'Select'"
                    [field]="'name'"
                    [list]="models"
                    [editItem]="customDevice.model"
                    [isDisabled]="!customDevice.manufacturer || customerPortalStateService.isCustomerPortal"
                    [search]="true"
                    [change]="true"
                    (onSelectedItem)="onSelectModel($event)"
                    heightInput="auto"
                ></app-drop-down>
            </div>
        </div>
    </div>
    <div class="qt-divider qt-mt-24 qt-mb-24"></div>
    <div
        class="company-device-aside__info-block"
        [ngClass]="{'--collapsed' :toggleWindowSpecifications}"
    >
        <div class="qt-df qt-jc-sb">
            <div class="sidebar-system__title qt-fw-600">Window Specifications</div>
            <div
                class="company-device-aside__expand-collapse qt-sz-16"
                (click)="toggleWindowSpecifications = !toggleWindowSpecifications"
            ></div>
        </div>
        <div class="sidebar-system__info warranty-info date-picker">
            <div class="sidebar-system__info-title">Warranty</div>
            <app-date-picker
                *ngIf="device"
                #datePickerWarranty
                [dropdownClass]="['date-picker']"
                [container]="'body'"
                [type]="'INPUT'"
                [formatDate]="formatDate"
                [editMode]="true"
                [editDate]="device.report.system.warranty"
                [useMinDate]="false"
                [placement]="'top-right'"
                [isDisabled]="customerPortalStateService.isCustomerPortal"
                (onChange)="onChangeHardware(device.getDataForUpdateWarranty(parseDateFromDatePicker($event)),'warranty',parseDateFromDatePicker($event))"
            ></app-date-picker>
            <app-date-picker
                *ngIf="customDevice"
                #datePickerWarranty
                [dropdownClass]="['date-picker']"
                [container]="'body'"
                [type]="'COMPANY_DEVICE'"
                [formatDate]="formatDate"
                [editMode]="true"
                [editDate]="customDevice.warrantyDateInt"
                [useMinDate]="false"
                [placement]="'top-right'"
                [isDisabled]="customerPortalStateService.isCustomerPortal"
                (onChange)="onChangeWarrentyDate($event)"
            ></app-date-picker>
        </div>
        <div
            class="sidebar-system__info"
            *ngIf="device"
        >
            <div class="sidebar-system__info-title">Windows Info</div>
            <div
                class="sidebar-system__info-text qt-df qt-ai-c"
                [textContent]="chackDefaultValue(getWindowsInfo())"
            ></div>
        </div>
        <div class="sidebar-system__info installed-info date-picker">
            <div class="sidebar-system__info-title">Installed on</div>
            <app-date-picker
                #datePickerInstalledOn
                *ngIf="device"
                [type]="'INPUT'"
                [formatDate]="formatDate"
                [editMode]="true"
                [dropdownClass]="['date-picker']"
                [container]="'body'"
                [editDate]="device.report.system.installDate"
                [useMinDate]="false"
                [placement]="'top-right'"
                [isDisabled]="customerPortalStateService.isCustomerPortal"
                (onChange)="onChangeHardware(device.getDataForUpdateInstallDate(parseDateFromDatePicker($event)),'installDate',parseDateFromDatePicker($event))"
            ></app-date-picker>
            <app-date-picker
                #datePickerInstalledOn
                *ngIf="customDevice"
                [type]="'COMPANY_DEVICE'"
                [formatDate]="formatDate"
                [editMode]="true"
                [dropdownClass]="['date-picker']"
                [container]="'body'"
                [editDate]="customDevice.installDateInt"
                [useMinDate]="false"
                [placement]="'top-right'"
                [isDisabled]="customerPortalStateService.isCustomerPortal"
                (onChange)="onChangeInstallDate($event)"
            ></app-date-picker>
        </div>
        <div *ngIf="device">
            <div class="sidebar-system__info">
                <div class="sidebar-system__info-title">System Type</div>
                <app-company-devices-edit-label
                    [field]="getSystemField('architecture') || ''"
                    [placeholder]="'Enter System Type'"
                    class="company-device-edit-name"
                    [isDisabled]="customerPortalStateService.isCustomerPortal"
                    (onChange)="onChangeHardware(device.getDataForUpdateArchitecture($event),'architecture',$event)"
                ></app-company-devices-edit-label>
            </div>
        </div>
        <div *ngIf="customDevice">
            <div class="sidebar-system__info edit-field">
                <div class="sidebar-system__info-title">Location</div>
                <app-company-devices-edit-label
                    #locationLabel
                    [field]="customDevice.location"
                    [placeholder]="'Enter location'"
                    [isDisabled]="customerPortalStateService.isCustomerPortal"
                    class="company-device-edit-name"
                    (onChange)="onChangeLocation($event)"
                ></app-company-devices-edit-label>
            </div>
        </div>
        <div *ngIf="customDevice">
            <div
                class="sidebar-system__info edit-field edit-note-container"
                [init]="isInitEditNote"
                appClickOtside
                [class]="'.edit-note-container'"
                (onOutSide)="onChangeNote()"
            >
                <div class="sidebar-system__info-title">Note</div>
                <textarea
                    class="qt-editable-input ng-untouched ng-pristine ng-valid"
                    appTextArea
                    placeholder="Write Note"
                    [(ngModel)]="customDevice.notes"
                    maxlength="65535"
                    appKeyUpEnter
                    (onChange)="onChangeNote()"
                    (input)="setIsInitEditNote(true)"
                    [disabled]="customerPortalStateService.isCustomerPortal"
                    cols="2"
                    rows="1"
                ></textarea>
            </div>
        </div>
    </div>
</div>
