<div
    ngbDropdown
    #dp="ngbDropdown"
    [ngClass]="class"
    [container]="container"
    [ngStyle]="{'width':widthInput ? widthInput : '100%'}"
>
    <div class="qt-df qt-ai-c">
        <div
            *ngIf="title"
            class="qt-input-block__label"
            [textContent]="title"
        ></div>
        <div
            class="qt-ic-c qt-pointer device-type-icon qt-sz-24 qt-mb-8 qt-ml-8 qt-icon"
            [ngClass]="{'icon__devices' : selectedItem && selectedItem.name === 'workstation',
               'icon__router' : selectedItem && selectedItem.name === 'router',
            'icon__print' : selectedItem && selectedItem.name === 'printer',
                'qt-icon icon__network-switch' : selectedItem && selectedItem.name === 'switch',
          'icon__server' : selectedItem && selectedItem.name === 'server',
            'icon__tablet' : selectedItem && selectedItem.name === 'tablet',
            'icon__network_device' : selectedItem && selectedItem.name === 'network device',
            'icon__old-phone' : selectedItem && selectedItem.name === 'phone',
             'icon__generic_device' : selectedItem && selectedItem.name === 'generic device'}"
        >
        </div>
    </div>
    <div
        class="invalid-feedback"
        *ngIf="!validate"
        [textContent]="errorMessage"
    >
    </div>
    <input
        type="text"
        [ngStyle]="{'width': '100%', 'height': heightInput ? heightInput : '40px' }"
        [ngClass]="{'disabled': isDisabled, '--input-error' : !validate}"
        [disabled]="isDisabled"
        [value]="getSelectedItemText()"
        autocomplete="off"
        [placeholder]="placeholder"
        id="dropdown1"
        class="qt-dropdown-input"
        [attr.maxlength]="maxlength"
        (input)="onCheckAdd($event)"
        (focus)="onFocus($event)"
        [readonly]="!change"
        ngbDropdownAnchor
    >
    <span
        class="app-drop-down__right-icon pointer"
        *ngIf="list && !isDisabled"
        [ngStyle]="{'bottom': heightInput ? dividePosition(heightInput) : '20px' }"
    >
        <i
            *ngIf="selectedItem && !isAdd && !isBlockClear"
            class="icn-remove-old qt-icon icon__close qt-icon__gray-400 qt-sz-20"
            (click)="clearClient()"
        ></i>
        <i
            *ngIf="(!selectedItem || isBlockClear) && !isAdd && !preloader"
            class="icn-sm qt-icon icon__arrow-down report-caret-icon"
        ></i>
        <i
            *ngIf="isAdd"
            (click)="addItem()"
            class="icn-sm icn-product-save qt-icon icon__done qt-icon__blue-light-600"
        ></i>
    </span>
    <i
        class="loading xs"
        *ngIf="preloader"
    ></i>
    <div
        ngbDropdownMenu
        [ngStyle]="{'width': dropdownWidth ? dropdownWidth : '100%', 'max-height': dropdownHeight ? dropdownHeight : '192px'}"
        aria-labelledby="dropdown1"
        class="app-drop-down__dropdown"
    >
        <ng-template
            ngFor
            let-item
            [ngForOf]="list"
            let-i="index"
        >
            <div class="qt-df qt-ai-c qt-pl-8">
                <div
                    class="qt-ic-c qt-pointer device-type-icon qt-sz-24 qt-icon"
                    [ngClass]="{'icon__devices' : item.name === 'workstation',
               'icon__router' : item.name === 'router',
            'icon__print' : item.name === 'printer',
                'icon__network-switch' : item.name === 'switch',
          'icon__server' : item.name === 'server',
            'icon__tablet' : item.name === 'tablet',
            'icon__network_device' : item.name === 'network device',
            'icon__old-phone' : item.name === 'phone',
             'icon__generic_device' : item.name === 'generic device',
            'icon__custom-device' : !checkDefaultName(item.name)}"
                >
                </div>
                <button
                    ngbDropdownItem
                    [textContent]="reduceItemName(item)"
                    (click)="onSelect(item)"
                    [title]="reduceItemName(item)"
                    [ngClass]="{'--selected':isSelected(item)}"
                ></button>
            </div>
        </ng-template>
    </div>
</div>
