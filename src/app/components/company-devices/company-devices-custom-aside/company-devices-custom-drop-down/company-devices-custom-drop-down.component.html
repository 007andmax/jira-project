<div
    class="light-dropdown"
    ngbDropdown
    [placement]="placement"
    #dp="ngbDropdown"
>
    <app-mat-form-field
        ngbDropdownAnchor
        #formField
        [placeholder]="'Search By Tags'"
    >
        <app-mat-chip-list
            [items]="selectedTag"
            (onChangeItems)="formField.checkSelectedItems(selectedTag)"
        >
            <app-dynamic-tooltip
                [position]="'top'"
                #productTooltip
            ></app-dynamic-tooltip>
            <app-mat-chip
                *ngFor="let tag of selectedTag; let i = index"
                (onClose)="remove(i)"
                [isRemove]="removable"
            >
                <div
                    class="clip-text"
                    *ngIf="tag.name.length >= 30"
                    (mouseenter)="productTooltip.setContent(tag.name);productTooltip.show($event.target)"
                    (mouseleave)="productTooltip.hide()"
                    [textContent]="tag.name"
                >
                </div>
                <div
                    class="clip-text"
                    *ngIf="tag.name.length < 30"
                    [textContent]="tag.name"
                >
                </div>
            </app-mat-chip>
            <input
                id="dropdownServices"
                ngbDropdownToggle
                #userInput
                class="pointer mat-chip-input mat-input-element"
                autocomplete="off"
                (input)="onSearch($event)"
                (keyup)="onKeyUp($event)"
            >
        </app-mat-chip-list>
    </app-mat-form-field>
    <div
        class="dropdown-menu"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <ng-template
            ngFor
            let-tag
            [ngForOf]="tags"
            [ngForTrackBy]="trackById"
        >
            <div class="qt-pos-rel">
                <button
                    ngbDropdownItem
                    class="dropdown-item"
                    (click)="toggleItem(tag)"
                    [textContent]="tag.name"
                    [ngClass]="{'--selected':isSelected(tag.id)}"
                >
                </button>
                <div
                    *ngIf="isSelected(tag.id)"
                    class="qt-icon icon__done qt-za-20 qt-sz-20 filter-tags-check"
                ></div>
            </div>
        </ng-template>
    </div>
</div>
