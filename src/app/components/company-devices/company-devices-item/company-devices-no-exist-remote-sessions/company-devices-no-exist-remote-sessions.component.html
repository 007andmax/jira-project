<div>
    <ng-template
        #tipRemoteAccess
        class="tooltip"
    >
        Remote Access
    </ng-template>
    <div
        [hidden]="!(device.remoteSessions.length == 0 && device.type !== 'workstation' && device.online && (getPermissions('REMOTE_CONNECTIONS') || customerPortalStateService.isCustomerPortal))"
        class="qt-ic-c qt-icon icon__remote-access qt-pointer qt-sz-18"
        placement="top"
        [ngbTooltip]="tipRemoteAccess"
        (click)="remoteAccess('PROXY')"
    >
    </div>
    <div
        [hidden]="!(device.remoteSessions.length == 0 && device.type === 'workstation' && device.online && (getPermissions('REMOTE_CONNECTIONS') || customerPortalStateService.isCustomerPortal))"
        class="qt-ic-c qt-icon icon__remote-access qt-pointer qt-sz-18"
        placement="top"
        container="body"
        [ngbTooltip]="tipRemoteAccess"
        (click)="remoteAccess('CSS')"
    >
    </div>
</div>
