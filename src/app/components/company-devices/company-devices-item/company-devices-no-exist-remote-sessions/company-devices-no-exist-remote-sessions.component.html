<div>
    <ng-template
        #tipRemoteAccess
        class="tooltip"
    >
        Remote Access
    </ng-template>
    <div
        [hidden]="!(device.remoteSessions.length == 0 && device.type !== 'workstation' && device.online && getPermissions('REMOTE_CONNECTIONS'))"
        class="qt-ic-c icon__quick-connect qt-pointer qt-sz-24 qt-bg-contain"
        placement="top"
        [ngbTooltip]="tipRemoteAccess"
        (click)="remoteAccess('PROXY')"
    >
    </div>
    <div
        [hidden]="!(device.remoteSessions.length == 0 && device.type === 'workstation' && device.online && getPermissions('REMOTE_CONNECTIONS'))"
        class="qt-ic-c icon__quick-connect qt-pointer qt-sz-24 qt-bg-contain"
        placement="top"
        container="body"
        [ngbTooltip]="tipRemoteAccess"
        (click)="remoteAccess('CSS')"
    >
    </div>
</div>
