<div class="qt-page-list__header-title-line">
    <div class="qt-page-list__header-title-line--left">
        <h6
            class="qt-page-list__header-title qt-mb-16"
            [textContent]="'All Devices (' + devices.length + ')'"
        ></h6>
    </div>
    <div class="qt-page-list__header-title-line--rigth">
        <div
            class="company-devices-page__list-header-buttons"
            *ngIf="getCountSelected() > 0"
        >
            <div [textContent]="getCountSelected() + ' Devices Selected'"></div>
            <div
                class="qt-ml-16 qt-fw-600 qt-df qt-color-info qt-ai-c qt-pointer"
                *ngIf="!isExistCustomDevices() && !isOfflineDeviceSelected && !customerPortalStateService.isCustomerPortal"
                (click)="turnOff('reboot')"
            >
                <div class="qt-icon icon__reset qt-icon__blue-light-600 qt-sz-16 qt-ic-c qt-mr-6"></div>
                <div>Restart</div>
            </div>
            <div
                class="qt-ml-16 qt-fw-600 qt-df qt-color-info qt-ai-c qt-pointer"
                *ngIf="!isExistCustomDevices() && !isOfflineDeviceSelected && !customerPortalStateService.isCustomerPortal"
                (click)="turnOff('shutdown')"
            >
                <div class="qt-icon icon__shutdown qt-icon__blue-light-600 qt-sz-16 qt-ic-c qt-mr-6"></div>
                <div>Shutdown</div>
            </div>
            <div
                class="qt-ml-16 qt-fw-600 qt-df qt-color-info qt-ai-c qt-pointer"
                (click)="removeAgents()"
                *ngIf="!customerPortalStateService.isCustomerPortal"
            >
                <div class="qt-icon icon__delete qt-icon__blue-light-600 qt-sz-16 qt-ic-c qt-mr-6"></div>
                <div>Remove Agent</div>
            </div>
            <div
                class="qt-ml-16 qt-fw-600 qt-df qt-color-info qt-ai-c qt-pointer"
                (click)="openSidebar()"
            >
                <div class="qt-icon icon__sidebar qt-icon__blue-light-600 qt-sz-16 qt-ic-c qt-mr-6"></div>
                <div>Sidebar</div>
            </div>
        </div>
        <div class="qt-df qt-ai-c">
            <button
                class="qt-button --gray --md qt-ml-8"
                (click)="addDevice()"
                *ngIf="!customerPortalStateService.isCustomerPortal"
            >
                Create Custom Device
            </button>
        </div>
    </div>
</div>
