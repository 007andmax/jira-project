<div class="qt-page-list company-devices-page --sticky-breadcrumbs">
    <div class="qt-page-list__header --sticky">
        <app-company-devices-header
            [devices]="devices"
            [isOfflineDeviceSelected]="isOfflineDeviceSelected"
            (onTurnOff)="onTurnOff($event)"
            (onRemoveAgents)="onRemoveAgents()"
        ></app-company-devices-header>
        <div class="qt-page-list__header-thead-container">
            <div class="qt-table-modern qt-page-list__header-thead">
                <div class="qt-page-list__header-thead__row">
                    <div class="company-devices-table__check">
                        <div class="qt-df">
                            <label class="qt-checkbox">
                                <input
                                    type="checkbox"
                                    [(ngModel)]="selectAllDevices"
                                    (change)="toogleDevices()"
                                >
                                <span></span>
                            </label>
                        </div>
                    </div>
                    <div class="company-devices-table__device-type"></div>
                    <div
                        class="company-devices-table__device-name pointer"
                        (click)="onFilter('name')"
                    >
                        Device Name
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div class="company-devices-table__tags">Tags</div>
                    <div
                        class="company-devices-table__logged-user pointer"
                        (click)="onFilter('user_name')"
                    >
                        Logged in user
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div class="company-devices-table__up-time">
                        Up time
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div class="company-devices-table__windows">Windows</div>
                    <div class="company-devices-table__ip-address">
                        <span class="">Ip address</span>
                    </div>
                    <div class="company-devices-table__go-to"></div>
                    <div class="company-devices-table__connect"></div>
                    <div class="company-devices-table__menu"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="qt-df qt-fd-c qt-jc-sb">
        <div class="qt-page-list__body">
            <div class="qt-page-list__body-table-container">
                <div class="qt-page-list__body-tbody qt-table-modern company-devices-table">
                    <div class="tbody">
                        <ng-template
                            ngFor
                            let-item
                            [ngForOf]="devices"
                            [ngForTrackBy]="trackById"
                        >
                            <app-company-devices-item
                                [companyId]="companyId"
                                [device]="item"
                                (onChangeSelect)="onChangeSelect()"
                            ></app-company-devices-item>
                        </ng-template>
                    </div>
                </div>
            </div>
            <div
                class="loading"
                *ngIf="showPreloader"
            ></div>
            <div
                class="no-exist-elements"
                *ngIf="!showPreloader && devices.length == 0"
            >
                We couldn't find any results
            </div>
        </div>
    </div>
    <app-company-devices-aside
        [companyId]="companyId"
        [devicesCompany]="devices"
    ></app-company-devices-aside>
    <app-company-devices-custom-aside></app-company-devices-custom-aside>
</div>
