<div class="qt-aside-modern__content">
  <div class="qt-inputs-row">
    <div class="qt-input-block qt-f50">
      <div class="qt-input-block__label">Company Name</div>
      <app-drop-down
        class="search-company"
        [placeholder]="'Select Company'"
        [editItem]="selectedCompany"
        [class]="['qt-dropdown']"
        [field]="'name'"
        [isDisabled]="true"
      ></app-drop-down>
    </div>
    <div class="qt-input-block qt-f50">
      <div class="qt-input-block__label">Contract Type</div>
      <app-drop-down
        class="search-users"
        [isDisabled]="true"
        [placeholder]="'Contract Type'"
        [editItem]="selectedType"
        [class]="['qt-dropdown']"
        [field]="'title'"
      ></app-drop-down>
    </div>
  </div>
  <div class="qt-inputs-row">
    <div class="qt-input-block qt-f50">
      <div class="qt-inputs-row">
        <div class="qt-input-block qt-f50 --required">
          <div class="qt-input-block__label">Start Date</div>
          <app-date-picker
            [formatDate]="formatDate"
            [disabled]="true"
            [editMode]="true"
            [editDate]="contractsHourly.startDate"
          ></app-date-picker>
        </div>
        <div class="qt-input-block qt-f50 --required">
          <div class="qt-input-block__label">Review Date</div>
          <app-date-picker
            [formatDate]="formatDate"
            [disabled]="true"
            [editMode]="true"
            [editDate]="contractsHourly.reviewDate"
          ></app-date-picker>
        </div>
      </div>
    </div>
  </div>
  <div class="qt-inputs-row">
    <div class="qt-input-block --required">
      <div class="qt-input-block__label">Description</div>
      <input
        placeholder="Write contract description"
        type="text"
        [(ngModel)]="contractsHourly.description"
        disabled
      >
    </div>
  </div>
  <div class="qt-inputs-row qt-inputs-row__divider"></div>
  <div class="qt-mb-16 qt-fw-600 qt-fs-15 qt-lh-147 qt-color-gray-900">Check this services you want for this customer</div>
  <table
    class="qt-gray-table service-table --preview qt-mb-16"
    colspan="0"
  >
    <thead>
    <tr>
      <th class="service-table__name">Service Name</th>
      <th class="service-table__billable">
        <div class="qt-df qt-ai-c qt-jc-fe">
          <div>Billable</div>
          <div class="qt-sz-12 icon__help"></div>
        </div>
      </th>
      <th class="service-table__tax">
        <div class="qt-df qt-ai-c qt-jc-fe">
          <div>Tax</div>
          <div class="qt-sz-12 icon__help"></div>
        </div>
      </th>
      <th class="service-table__rate">
        <div class="qt-df qt-ai-c qt-jc-fe">
          <div>Hourly Rate</div>
          <div class="qt-sz-12 icon__help"></div>
        </div>
      </th>
    </tr>
    </thead>
    <tbody>
    <ng-template
      ngFor
      let-item
      [ngForOf]="contractsHourly.services"
      [ngForTrackBy]="trackById"
    >
      <tr>
        <td
          class="service-table__name"
          [textContent]="item.name"
        >
        </td>
        <td class="service-table__billable">
          <label class="qt-checkbox">
            <input
              type="checkbox"
              [(ngModel)]="item.billable"
              disabled
            >
            <span></span>
          </label>
        </td>
        <td
          class="service-table__tax"
          [textContent]="getSelectedTaxes(item.taxIds)"
        ></td>
        <td
          class="service-table__rate"
          [textContent]="item.rate | currency"
        >
        </td>
      </tr>
    </ng-template>
    </tbody>
  </table>
</div>
