<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line">
        <div class="qt-page-list__header-title-line--left">
            <h6
                class="qt-page-list__header-title"
                [textContent]="'Contracts'"
            ></h6>
        </div>






        <div class="qt-page-list__header-title-line--rigth">
            <div class="qt-df qt-ai-c">
                <button
                    class="qt-button --gray --md btn-mr-8"
                    (click)="clearAll()"
                    *ngIf="countFilter > 0"
                >
                    Clear all
                </button>
                <button
                    class="qt-button qt-button-filter --md --gray qt-ml-8"
                    [ngClass]="{'active':!toggleFilter}"
                    (click)="toggleFilter = !toggleFilter"
                >
                    <span class="qt-icon icon__filter qt-sz-16 qt-bg-contain qt-dib qt-mr-8"></span>
                    <span [textContent]="getTextCountFilters()"></span>
                </button>
                <button
                    class="qt-button --gray --md qt-ml-8"
                    (click)="showCreate()"
                >
                    Create Contract
                </button>
            </div>
        </div>
    </div>






    <div class="qt-page-list__header-filters">
        <app-contracts-filter
            class="qt-w100"
            #filter
            [companyContracts]="companyContracts"
            (changeCountFilter)="onChangeCountFilter($event)"
            [hidden]="toggleFilter"
        ></app-contracts-filter>
    </div>






    <div class="qt-page-list__header-thead-container">
        <div class="qt-table-modern qt-page-list__header-thead contracts-table">
            <div class="qt-table-modern qt-page-list__header-thead">
                <div class="qt-page-list__header-thead__row contracts-table-row-item">
                    <div
                        class="contracts-table__company pointer"
                        (click)="setSort('company')"
                    >
                        Company
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div
                        class="contracts-table__description pointer"
                        (click)="setSort('description')"
                    >
                        Description
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div
                        class="contracts-table__contract-type pointer"
                        (click)="setSort('type')"
                    >
                        Contract Type
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div class="contracts-table__status  ">Options</div>
                    <div
                        class="contracts-table__status pointer"
                        (click)="setSort('status')"
                    >
                        Status
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div
                        class="contracts-table__start-date pointer"
                        (click)="setSort('start_date')"
                    >
                        Start Date
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div
                        class="contracts-table__review-date pointer"
                        (click)="setSort('review_date')"
                    >
                        Review Date
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div
                        class="contracts-table__review-date pointer"
                        (click)="setSort('end_date')"
                    >
                        End Date
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div
                        class="contracts-table__amount pointer"
                        (click)="setSort('amount')"
                    >
                        Amount
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div class="contracts-table__menu"></div>
                </div>
            </div>
        </div>
    </div>
</div>
