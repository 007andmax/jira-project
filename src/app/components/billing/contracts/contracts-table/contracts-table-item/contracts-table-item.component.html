<div
    class="contracts-table-row-item qt-table-modern__row"
    [ngClass]="(showNotificationReview) ? 'no-valid' : ''"
>
    <div
        class="contracts-table__company"
        (click)="preview()"
    >
 <ng-template #popCompanyContent let-greeting="greeting"
	>
    <app-users-table-company-by
    [company]="company"
    [indexNoAvatar]="indexNoAvatar"
    [listColorNoAvatar]="listColorNoAvatar"
    ></app-users-table-company-by>
    </ng-template
>
        <div
            class="tooltip__circle-avatar"
            [textContent]="company.name[0].toUpperCase()"
            [ngStyle]="{'background': parseLogo() }"
             [ngbPopover]="popCompanyContent"
            [popoverClass]="'requested-by-popover'"
                [autoClose]="'outside'"
                [container]="'body'"
            #pCompany="ngbPopover"
            triggers="manual"
            appCompanyLogoPopover
            [company]="company"
            [popover]="pCompany"
            [disabled]="!company"
            [disablePopover]="!company"
        ></div>
        <div
            class="ellipsis"
            [textContent]="company.name"
        >
        </div>
</div>
    <div
        class="contracts-table__description "
        (click)="preview()"
    >
        <div
            class="ellipsis"
            [textContent]="contract.description"
        ></div>
    </div>
    <div
        class="contracts-table__contract-type"
        [textContent]="getType()"
        (click)="preview()"
    ></div>
    <div
        class="contracts-table__status tooltip-contract-list"
        (click)="preview()"
    >
        <ng-template
            #manualContent
            class="tooltip"
        >
            Automatically create and send invoice
        </ng-template>
        <div
            class="qt-icon icon__automatically-create-invoice  qt-sz-20"
            *ngIf="contract.enableInvoiceAutoCreate"
            placement="top"
            [ngbTooltip]="manualContent"
        ></div>
        <div
            class="qt-icon icon__manual-create-billable  qt-sz-20"
            *ngIf="contract.manualCreateBillableItem"
            placement="top"
            ngbTooltip="Manual create billable item"
        ></div>
    </div>
    <div
        class="contracts-table__status"
        (click)="preview()"
    >
        <span
            class="tag__modern"
            [ngClass]="{'--error' : contract.status === 'TERMINATED',
    '--warning' : contract.status === 'EXPIRED' || contract.status === 'PENDING',
    '--info' : contract.status === 'CURRENT'}"
            [textContent]="contractStatusDictionary[contract.status]"
        ></span>
    </div>
    <div
        class="contracts-table__start-date"
        [textContent]="getDate(contract.startDate)"
        (click)="preview()"
    ></div>
    <div
        class="contracts-table__review-date"
        [textContent]="getDate(contract.reviewDate)"
        (click)="preview()"
    ></div>
    <div
        class="contracts-table__review-date"
        [textContent]="getDate(contract.endDate)"
        (click)="preview()"
    ></div>
    <div
        class="contracts-table__amount"
        [textContent]="(contract.subtotalExcludingTax + contract.taxSum) | currency"
        (click)="preview()"
    ></div>
    <div
        class="contracts-table__menu"
        ngbDropdown
        container="body"
    >
        <div
            class="qt-ic-c qt-icon icon__more qt-pointer qt-sz-16 qt-bg-contain"
            id="dropdownBasic1"
            ngbDropdownToggle
        ></div>
        <ul
            class="qt-dropdown-menu invoice-items-dropdown"
            ngbDropdownMenu
            aria-labelledby="dropdownBasic1"
        >
            <li
                class="pointer"
                ngbDropdownItem
                (click)="copyContract()"
            >
                <div class="qt-icon icon__copy qt-sz-20 qt-bg-contain qt-mr-12"></div>
                Copy contract
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                [hidden]="!getPermissions('EDIT_SERVICE_AGREEMENTS') || contract.status == 'TERMINATED' || contract.status == 'EXPIRED' || contract.type == 'HOURLY'"
                (click)="forceCreate()"
            >
                <div class="qt-icon icon__force-create qt-sz-20 qt-mr-12"></div>
                Force create
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                (click)="editContract()"
                *ngIf="getPermissions('EDIT_SERVICE_AGREEMENTS') && contract.status !== 'TERMINATED'"
            >
                <div class="qt-icon icon__edit qt-sz-20 qt-mr-12"></div>
                Edit contract
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                (click)="terminateContract()"
                *ngIf="getPermissions('EDIT_SERVICE_AGREEMENTS') && contract.status !== 'TERMINATED'"
            >
                <div class="qt-icon icon__block qt-sz-20 qt-mr-12"></div>
                Terminate
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                (click)="deleteContract()"
                *ngIf="getPermissions('DELETE_SERVICE_AGREEMENTS') && contract.status !== 'CURRENT'"
            >
                <div class="qt-icon icon__delete qt-sz-20 qt-bg-contain qt-mr-12"></div>
                Delete agreement
            </li>
        </ul>
    </div>
</div>
