<div class="qt-page-list__body">
    <div class="qt-page-list__body-table-container"   [ngStyle]="{'padding-bottom': (showPendingPreloader) ? '65px' : '0px'}">
        <div class="qt-page-list__body-tbody qt-table-modern contracts-table">
            <div class="tbody"   infiniteScroll
                                [infiniteScrollContainer]="container"
                                [infiniteScrollDistance]="2"
                                [infiniteScrollThrottle]="50"
                                [infiniteScrollDisabled]="infiniteScrollDisabled"
                                (scrolled)="onScroll()">
                <ng-template
                    ngFor
                    let-item
                    [ngForOf]="list"
                    [ngForTrackBy]="trackById"
                >
                    <app-contracts-table-item
                        [contract]="item"
                        (onEdit)="onEdit($event)"
                        (onPreview)="onPreview($event)"
                        (onTerminate)="onTerminate($event)"
                        (onCopy)="onCopy($event)"
                        (onForceCreate)="onForceCreate($event)"
                    ></app-contracts-table-item>
                </ng-template>
            </div>
        </div>
        <div
            class="loading"
            *ngIf="showPreloader"
        ></div>
        <div
            class="no-exist-elements"
            *ngIf="!showPreloader && list.length == 0"
        >
            We couldn't find any results
        </div>
          <div
                            class="loading pengind-loading"
                            *ngIf="showPendingPreloader"
                        ></div>
    </div>
</div>
