<div class="qt-inputs-row">
    <div class="qt-input-block qt-f50">
        <company-drop-down
            #companiesDP
            [title]="'Company Name'"
            [placeholder]="'Select Company'"
            [validate]="validateCompany && validateServicesDate"
            [errorMessage]="!validateCompany ? 'Company is required' : 'There is already an existing hourly contract for the current company.'"
            [clientType]="'CLIENT'"
            [field]="'name'"
            [search]="true"
            [change]="true"
            (onSelectedItem)="selectCompany($event)"
        ></company-drop-down>
    </div>
    <div class="qt-input-block qt-f50">
        <app-drop-down
            [title]="'Contract Type'"
            [placeholder]="'Contract Type'"
            [isBlockClear]="true"
            [editItem]="selectedType"
            [list]="listsTypes"
            [field]="'title'"
            (onSelectedItem)="onSelectType($event)"
        ></app-drop-down>
    </div>
</div>
