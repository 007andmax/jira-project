<div class="ticket-edit-user-tags contract-time-users">
    <app-mat-chip-list class="example-chip">
        <app-mat-chip
            class="selected-tag-user"
            *ngFor="let user of selectedUsers; let i = index"
            [isRemove]="true"
            (onClose)="remove(i)"
        >
            <div class="assigne-user-item">
                <div
                    class="assigne-user-avatar"
                    [textContent]="getAssignedUserNameForAvatar(user)"
                    [ngStyle]="{'background': getStyleAvatar(user),'background-size': 'contain'}"
                ></div>
                <div
                    class="assigne-user-name"
                    [textContent]="getUserName(user)"
                ></div>
            </div>
        </app-mat-chip>
    </app-mat-chip-list>
</div>
