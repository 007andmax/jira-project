<div class="ticket-edit-user-tags contract-time-users app-mat-tags-without-border">
    <app-mat-chip-list class="example-chip">
        <app-mat-chip
            class="app-mat-tags-with-avatar app-mat-tags-with-avatar--lg"
            *ngFor="let user of selectedUsers; let i = index"
            [isRemove]="true"
            (onClose)="remove(i)"
        >
            <div class="qt-df qt-ai-c">
                <div
                    class="app-mat-tags-with-avatar__avatar"
                    [textContent]="getAssignedUserNameForAvatar(user)"
                    [ngStyle]="{'background': getStyleAvatar(user),'background-size': 'contain'}"
                ></div>
                <div
                    [textContent]="getUserName(user)"
                ></div>
            </div>
        </app-mat-chip>
    </app-mat-chip-list>
</div>
