<div
    class="add-service-container qt-pos-rel"
    ngbDropdown
    placement="top-right"
>
    <button
        class="qt-btn --outline --small"
        id="dropdownBasic2"
        ngbDropdownToggle
    >
        + Add Service
    </button>
    <ul
        class="qt-dropdown-menu list-services --open-bot"
        ngbDropdownMenu
        aria-labelledby="dropdownBasic2"
    >
        <ng-template
            ngFor
            let-item
            [ngForOf]="defaultServices"
            let-i="index"
        >
            <li
                class="pointer"
                ngbDropdownItem
                [textContent]="item.name"
                (click)="select(item)"
            ></li>
        </ng-template>
    </ul>
</div>
