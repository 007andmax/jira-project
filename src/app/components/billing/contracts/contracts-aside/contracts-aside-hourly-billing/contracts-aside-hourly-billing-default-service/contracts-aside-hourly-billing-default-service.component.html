<tr [ngClass]="{'service-disabled':!defaultService.selected}">
    <td class="service-table__check">
        <label class="qt-checkbox">
            <input
                type="checkbox"
                [(ngModel)]="defaultService.selected"
                (change)="toggleService($event)"
            >
            <span></span>
        </label>
    </td>
    <td class="service-table__name">
        <input
            class="qt-input-in-table"
            type="text"
            [value]="defaultService.name"
            readonly
        >
        <app-mat-error
            class="qt-tooltip-error qt-w-auto-important"
            *ngIf="!defaultService.validate"
        >
            A contract with the current service exists for the current company. The contract description - "{{defaultService.descriptionValidate}}"
        </app-mat-error>
    </td>
    <td class="service-table__billable">
        <label
            class="qt-checkbox"
            [ngClass]="{'--disabled':!defaultService.selected}"
        >
            <input
                type="checkbox"
                [(ngModel)]="defaultService.billable"
                (change)="onChangeBillable($event)"
                [disabled]="!defaultService.selected"
            >
            <span></span>
        </label>
    </td>
    <td class="service-table__discount">
        <div class="qt-df">
            <input
                type="text"
                class="qt-input-in-table qt-text-right"
                decimalNumber
                placeholder="0.00"
                [defaultValue]="''"
                [value]="defaultService.discountAmount ? defaultService.discountAmount : ''"
                (onChange)="onChangeDiscountAmount($event)"
                [disabled]="!defaultService.selected"
            >
            <input
                type="text"
                value="%"
                autocomplete="new-password"
                readonly
                placeholder="Discount"
                id="dropdownTypeTaxes"
                class="qt-input-block__input"
                [disabled]="!defaultService.selected"
            >
        </div>
    </td>
    <td class="service-table__tax">
        <app-taxes
            class="qt-taxes-multiselect"
            #taxes
            [isLabel]="false"
            [isAdd]="false"
            (taxesChange)="onTaxesChange($event)"
            [isDisabled]="!defaultService.selected"
        ></app-taxes>
    </td>
    <td class="service-table__rate">
        <input
            class="payment-input qt-input-in-table"
            number
            [money]="true"
            [ngModel]="defaultService.rate_str"
            (ngModelChange)="onChangeRate($event)"
            (blur)="onCeckRate()"
            appToFixed
            [disabled]="!defaultService.selected"
        >
        <app-mat-error
            class="qt-tooltip-error qt-w-auto-important"
            *ngIf="!defaultService.validateRate"
        >
            The price cannot $0.00 if the service is billable
        </app-mat-error>
    </td>
</tr>
