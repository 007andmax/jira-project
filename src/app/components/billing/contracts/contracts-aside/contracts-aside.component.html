<div class="contracts-page__aside --x-large qt-aside-modern ">
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-title">Create Contract</div>
        <div class="qt-aside-modern__header-close icon__close" (click)="closed()"></div>
    </div>
    <app-contracts-aside-select-type
        *ngIf="step === 1"
        (onSelect)="onSelectType($event)"
    ></app-contracts-aside-select-type>
    <app-contracts-aside-hourly-billing
        #hourlyContract
        *ngIf="step === 2 && type === 'HOURLY'"
        (onClose)="closed()"
    ></app-contracts-aside-hourly-billing>
    <app-contracts-aside-block-time-billing
        #blockTimeContract
        *ngIf="step === 2 && type === 'BLOCK_TIME'"
        (onClose)="closed()"
    ></app-contracts-aside-block-time-billing>
    <app-contracts-aside-user-device-billing
        #deviceUserContract
        *ngIf="step === 2 && (type === 'SERVICE_CONTRACT_DEVICE' || type === 'SERVICE_CONTRACT_USER')"
        (onClose)="closed()"
    ></app-contracts-aside-user-device-billing>
    <app-contracts-aside-product-service-contracts
        #otherContract
        *ngIf="step === 2 && type === 'SERVICE_CONTRACT_OTHER'"
        (onClose)="closed()"
    ></app-contracts-aside-product-service-contracts>
    <div class="qt-aside-modern__footer">
        <div class="qt-df">
            <button
                class="qt-button qt-mr-12"
                *ngIf="step === 1"
                (click)="continue()"
            >
                Continue
            </button>
            <button
                class="qt-button qt-mr-12"
                *ngIf="step === 2"
                (click)="onCreate()"
            >
                Create Contract
            </button>
            <button
                class="qt-button --gray"
                (click)="closed()"
            >
                Cancel
            </button>
        </div>
    </div>
</div>
