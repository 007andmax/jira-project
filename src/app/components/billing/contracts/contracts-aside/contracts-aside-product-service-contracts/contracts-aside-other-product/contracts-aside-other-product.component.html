<tr>
    <td class="contract-product-products-table__name --editable">
        <app-product-list
            [editItem]="editProduct"
            class="product-item__prodect-list contract-aside-product-list"
            [validate]="product.validate"
            (selectedProductItem)="onChangeProduct($event)"
        ></app-product-list>
    </td>
    <td class="contract-product-products-table__quantity --editable">
        <input
            class="payment-input qt-input-in-table"
            decimalNumber
            [value]="product.quantity"
            (onChange)="onChangeQuantity($event)"
        >
    </td>
    <td class="contract-product-products-table__price --editable">
        <input
            class="payment-input qt-input-in-table"
            decimalNumber
            [useFixed]="true"
            appToFixed
            [value]="product.salePrice"
            (onChange)="onChangeSalePrice($event)"
        >
    </td>
    <td class="contract-product-products-table__price --editable">
        <input
            type="text"
            class="qt-input-in-table qt-text-right"
            decimalNumber
            placeholder="0.00"
            [defaultValue]="''"
            [value]="product.discountAmount ? product.discountAmount : ''"
            (onChange)="onChangeDiscountAmount($event)"
        >
    </td>
    <td
        class="contract-product-products-table__price"
        [textContent]="getSubTotal()"
    ></td>
    <td>
        <div
            class="qt-icon icon__inactive qt-ic-c qt-sz-16"
            (click)="remove()"
        ></div>
    </td>
</tr>
