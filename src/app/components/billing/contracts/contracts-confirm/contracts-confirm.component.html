
<div class="archive-modal"  >
  <button class="close-modal" (click)=closeModal()></button>
  <div class="archive-modal__body modal-body">
    <p [textContent]="message"></p>
  </div>
  <div class="archive-modal__footer">
    <div class="qt-df">
      <button class="qt-button --gray qt-w100" (click)=cancelConfirm()>No, don't create</button>
        <button class="qt-button --red qt-w100"  (click)=approveConfirm()>Yes, create</button>
    </div>
  </div>
</div>
