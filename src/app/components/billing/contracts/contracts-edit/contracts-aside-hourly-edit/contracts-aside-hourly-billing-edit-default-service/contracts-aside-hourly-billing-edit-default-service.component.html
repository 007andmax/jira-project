<tr [ngClass]="{'service-disabled':!service.selected}">
    <td class="service-table__check">
        <label class="qt-checkbox">
            <input
                type="checkbox"
                [(ngModel)]="service.selected"
                (change)="toggleService($event)"
            >
            <span></span>
        </label>
    </td>
    <td class="service-table__name">
        <input
            class="qt-input-in-table"
            type="text"
            [value]="service.name"
            readonly
        >
    </td>
    <td class="service-table__billable">
        <label class="qt-checkbox">
            <input
                type="checkbox"
                [(ngModel)]="service.billable"
                (change)="onChangeBillable($event)"
            >
            <span></span>
        </label>
    </td>
    <td class="service-table__discount">
        <div class="qt-df">
            <input
                type="text"
                class="qt-input-in-table qt-text-right"
                decimalNumber
                placeholder="0.00"
                [defaultValue]="''"
                [value]="service.discountAmount ? service.discountAmount : ''"
                (onChange)="onChangeDiscountAmount($event)"
            >
            <input
                type="text"
                value="%"
                autocomplete="new-password"
                readonly
                placeholder="Discount"
                id="dropdownTypeTaxes"
                class="qt-input-block__input"
            >
        </div>
    </td>
    <td class="service-table__tax">
        <app-taxes
            class="qt-taxes-multiselect"
            #taxes
            [isLabel]="false"
            [isAdd]="false"
            (taxesChange)="onTaxesChange($event)"
        ></app-taxes>
    </td>
    <td class="service-table__rate">
        <input
            class="payment-input qt-input-in-table"
            number
            [money]="true"
            [ngModel]="service.rate_str"
            (ngModelChange)="onChangeRate($event)"
            (blur)="onCeckRate()"
            appToFixed
        >
        <app-mat-error
            class="qt-tooltip-error qt-w-auto-important"
            *ngIf="!service.validateRate"
        >
            The price cannot $0.00 if the service is billable
        </app-mat-error>
    </td>
</tr>
