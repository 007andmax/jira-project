<div class="qt-df qt-pos-rel">
    <div class="contract-aside-hourly-add-service__name">
        <app-drop-down
            #serviceDropDown
            [placeholder]="'Service Name'"
            [list]="defaultServices"
            [field]="'name'"
            [change]="true"
            [search]="true"
            container="body"
            dropdownWidth="509px"
            (onSelectedItem)="selectService($event)"
        ></app-drop-down>
        <app-mat-error
            class="invalid-feedback"
            *ngIf="!validate.getValidate()"
        >
            A contract with the current service exists for the current company. The contract description - "{{validate.descriptionValidate}}"
        </app-mat-error>
        <app-mat-error
            class="invalid-feedback"
            *ngIf="!validate.getDuplicateName()"
        >
            Duplicate Service
        </app-mat-error>
        <app-mat-error
            class="invalid-feedback"
            *ngIf="!validate.getName()"
        >
            Service name is required
        </app-mat-error>
    </div>
    <div class="contract-aside-hourly-add-service__billable">
        <label
            class="qt-checkbox receive-full-amount-check qt-mb-0 pointer"
            for="email-payment"
        >
            <input
                id="email-payment"
                type="checkbox"
                [(ngModel)]="service.billable"
            >
            <span></span>
        </label>
    </div>
    <div class="contract-aside-hourly-add-service__tax ">
        <div class="create-product-taxes-select">
            <app-taxes
                [isLabel]="false"
                [isAdd]="false"
                class="qt-taxes-multiselect"
                [selectedTax]="defaultSelectedTax"
                (taxesChange)="onTaxesChange($event)"
            ></app-taxes>
        </div>
    </div>
    <div
        class="qt-input-block contract-aside-hourly-add-service__rate"
        [ngClass]="{'--input-error':!validate.getRate()}"
    >
        <input
            [(ngModel)]="service.rate_str"
            type="text"
            number
            placeholder="Per Hour Rate"
            [money]="true"
            (input)="onChangeRate($event)"
            appToFixed
        >
        <app-mat-error
            class="qt-tooltip-error"
            *ngIf="!validate.getRate()"
        >
            Hour rate is required
        </app-mat-error>
    </div>
    <div
        class="qt-icon icon__close contract-aside-hourly-add-service__add qt-sz-16 qt-pointer qt-ic-c"
        appDisabledBtn
        #addBtn="disabled"
        (onClick)="searchDuplicatedServiceNames()"
    ></div>
    <div
        class="qt-icon icon__close contract-aside-hourly-add-service__cancel qt-sz-16 qt-pointer qt-ic-c"
        (click)="closed()"
    ></div>
</div>
