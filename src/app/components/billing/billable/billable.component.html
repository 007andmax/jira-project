<div class="qt-page-list page-list-billable billing-page">
    <div class="qt-page-list__header --sticky">
        <div class="qt-page-list__header-title-line">
            <div class="qt-page-list__header-title-line--left">
                <h6
                    class="qt-page-list__header-title"
                    [textContent]="'Billable Items (' + count + ')'"
                ></h6>
            </div>
            <div class="qt-page-list__header-title-line--right">
                <button
                    *ngIf="getPermissions('CREATE_INVOICE')"
                    class="qt-button --gray --md qt-mr-8 btn-invoice-all"
                    [disabled]="!isExistSelected()"
                    appDisabledBtn
                    #saveAndDownloadBtn="disabled"
                    (onClick)="onInvoiceAll()"
                >
                    <span *ngIf="!saveAndDownloadBtn.isBlock()">Invoice All</span>
                    <app-preloader-ticket *ngIf="saveAndDownloadBtn.isBlock()"></app-preloader-ticket>
                </button>
                <span class="qt-input-search">
                    <input
                        class="qt-input-search billable-list-search"
                        name="ticket_search"
                        placeholder="Search Company…"
                        title="Company Search"
                        type="text"
                        (input)="onSearch($event)"
                    >
                </span>
            </div>
        </div>
        <div class="qt-page-list__header-thead-container">
            <div class="qt-table-modern qt-page-list__header-thead">
                <div class="qt-page-list__header-thead__row">
                  <div
                    class="billable-item-table__check"
                    *ngIf="getPermissions('CREATE_INVOICE')"
                  >
                    <div class="qt-df">
                      <label class="qt-checkbox">
                        <input
                          type="checkbox"
                          (change)="onToggleAll($event)"
                        >
                        <span></span>
                      </label>
                    </div>
                  </div>
                  <div
                    class="billable-table__company-name"
                    (click)="onFilter('name')"
                  >
                    Company Name
                    <span class="qt-table-modern__sorting"></span>
                  </div>
                  <div
                    class="billable-table__tickets"
                    (click)="onFilter('salesPerson')"
                  >
                    Sales Person
                    <span class="qt-table-modern__sorting"></span>
                  </div>
                  <div
                    class="billable-table__sales"
                    (click)="onFilter('countTickets')"
                  >
                    Tickets
                    <span class="qt-table-modern__sorting"></span>
                  </div>
                  <div
                    class="billable-table__billable"
                    (click)="onFilter('total')"
                  >
                    Billable Amount
                    <span class="qt-table-modern__sorting"></span>
                  </div>
                  <div
                    class="billable-table__menu"
                    *ngIf="getPermissions('CREATE_INVOICE')"
                  ></div>
                </div>
            </div>
        </div>
    </div>
    <div class="qt-page-list__body">
        <div class="qt-page-list__body-table-container">
            <div
                class="qt-page-list__body-tbody qt-table-modern billable-table"
                *ngIf="!showPreloader"
            >
                <div class="tbody">
                    <ng-template
                        ngFor
                        let-item
                        [ngForOf]="list"
                        [ngForTrackBy]="trackById"
                    >
                        <app-billable-item
                            [item]="item"
                            *ngIf="!item.isDefault"
                            (onSelect)="onSelectItem($event,item)"
                        ></app-billable-item>
                    </ng-template>
                </div>
            </div>
            <div
                class="loading"
                *ngIf="showPreloader"
            ></div>
            <div
                class="no-exist-elements"
                *ngIf="!showPreloader && list.length == 0"
            >
                We couldn't find any results
            </div>
        </div>
    </div>
</div>
