<div class="qt-df qt-pos-rel address-block">
    <hr class="address-block__horisontal-divider">
    <div
        class="qt-w50 qt-pt-30 qt-pl-24 qt-pr-24 qt-pb-30 billing-address"
        ngbDropdown
        [autoClose]="'inside'"
        #editCustomer="ngbDropdown"
    >
        <div
            class="qt-fs-10 qt-mb-12 qt-lh-154"
            ngbDropdown
        >
            <div class="qt-df qt-ai-c">
                <span class="address-h qt-fw-600">BILLING ADDRESS</span>
                <i
                    class="icn-16 icon__edit-gray qt-ml-8 pointer"
                    ngbDropdownToggle
                    id="dropdownForm2"
                    placement="top"
                    ngbTooltip="Change Address"
                    container="body"
                ></i>
            </div>
            <invoice-change-address
                [quoteCompany]="company"
                aria-labelledby="dropdownForm2"
                ngbDropdownMenu
                (onSelectAddress)="selectAddress(0,$event)"
            ></invoice-change-address>
        </div>
        <div
            class="qt-fs-13 qt-lh-154 qt-fw-b qt-color-dark"
            [textContent]="company.addresses[0].locationName"
        ></div>
        <div
            class="qt-fs-13 qt-lh-154"
            [textContent]="company.addresses[0].addressWithSuitNumberAndPostalCode"
        ></div>
        <div
            class="qt-fs-13 qt-color-info  qt-pointer"
            id="dropdownForm1"
            ngbDropdownToggle
            (click)="onEditCustomer()"
            *ngIf="getPermissions('EDIT_COMPANIES')"
        >
            Edit Customer
        </div>
        <div
            ngbDropdownMenu
            aria-labelledby="dropdownForm1"
        >
            <app-invoice-form-edit-customer
                #companyEdit
                (onUpdateCompany)="onUpdateCompany()"
                [dropDown]="editCustomer"
            ></app-invoice-form-edit-customer>
        </div>
    </div>
    <div
        class="qt-w50 qt-pt-30 qt-pl-24 qt-pr-24 qt-pb-30"
        ngbDropdown
    >
        <div *ngIf="company.addresses.length == 2">
            <div class="qt-fs-10 qt-fw-600  qt-df qt-ai-c qt-mb-12 qt-lh-154">
                <span class="address-h">SHIPPING ADDRESS</span>
                <i
                    class="icn-16 icon__edit-gray qt-ml-8 pointer"
                    ngbDropdownToggle
                    placement="top"
                    ngbTooltip="Change Address"
                    container="body"
                ></i>
            </div>
            <div
                class="qt-fs-13 qt-lh-154 qt-fw-b qt-color-dark"
                [textContent]="company.addresses[1].locationName"
            ></div>
            <div
                class="qt-fs-13 qt-lh-154"
                [textContent]="company.addresses[1].addressWithSuitNumberAndPostalCode"
            ></div>
            <invoice-change-address
                ngbDropdownMenu
                [quoteCompany]="company"
                (onSelectAddress)="selectAddress(1,$event)"
            ></invoice-change-address>
        </div>
    </div>
</div>
<div class="infoice-info-row qt-df qt-pt-16 qt-pl-30 qt-pr-30 qt-mb-24 ">
    <div class="qt-input-block qt-mr-16 qt-w100">
        <div class="qt-input-block__label">Invoice#</div>
        <input
            [ngClass]="{'--input-error':!validate.getNumber()}"
            [(ngModel)]="invoiceNumber"
            (blur)="onChangeInvoiceNumber()"
            type="text"
        >
        <mat-error
            class="invalid-feedback"
            *ngIf="!validate.getNumber()"
            [textContent]="'Invoice with number ' + invoiceNumber + ' is already occupied'"
        >
        </mat-error>
    </div>
    <div
        class="qt-input-block qt-mr-16 qt-w100"
        *ngIf="invoiceTaxNumber"
    >
        <div class="qt-input-block__label" [textContent]="invoiceTaxNumber.taxIdDescription"></div>
        <input
            [(ngModel)]="invoiceTaxNumber.taxId"
            (blur)="onChangeTax()"
            type="text"
        >
    </div>
    <div class="qt-input-block qt-mr-16 qt-w100 input_inside_white_important">
        <div class="qt-input-block__label">Invoice Date</div>
        <app-date-picker
            [formatDate]="formatDate"
            [editMode]="true"
            [editDate]="invoice.invoiceDataDto.date"
            [useMinDate]="false"
            (onChange)="onChangeDate($event)"
        ></app-date-picker>
    </div>
    <div class="qt-input-block qt-w100 input_inside_white_important">
        <div class="qt-input-block__label">Due Date</div>
        <app-date-picker
            [placement]="'bottom-right'"
            [formatDate]="formatDate"
            [editMode]="true"
            [editDate]="invoice.invoiceDataDto.dueDate"
            [useMinDate]="true"
            (onChange)="onChangeDueDate($event)"
        ></app-date-picker>
    </div>
</div>
<div class="invoice-items">
    <div class="qt-df qt-jc-fe qt-mb-10 qt-pr-30 qt-pl-30">
        <button
            class="billing-aside-edit-mode"
            *ngIf="!editMode"
            (click)="editMode = true"
        >
            Edit
        </button>
        <button
            class="qt-ml-10 billing-aside-save-mode"
            *ngIf="editMode"
            appDisabledBtn
            #editTicketsBtn="disabled"
            (onClick)="onEditTickets()"
        >
            <span *ngIf="!editTicketsBtn.isBlock()">Save</span>
            <app-preloader-ticket *ngIf="editTicketsBtn.isBlock()"></app-preloader-ticket>
        </button>
        <button
            class="qt-ml-10 billing-aside-cancel-mode"
            *ngIf="editMode"
            (click)="onCancelTickets()"
        >
            Cancel
        </button>
    </div>
    <div *ngIf="!editMode">
        <ng-template
            ngFor
            let-ticket
            [ngForOf]="invoice.invoiceDataDto.tickets"
            let-i="index"
            [ngForTrackBy]="trackByIndex"
        >
            <app-invoice-form-ticket-info
                [ticketsLength]="invoice.invoiceDataDto.tickets.length"
                (onDelete)="delete(i)"
                [ticket]="ticket"
            ></app-invoice-form-ticket-info>
        </ng-template>
    </div>
    <div *ngIf="editMode">
        <ng-template
            ngFor
            let-ticket
            [ngForOf]="editTickets"
            let-i="index"
            [ngForTrackBy]="trackByIndex"
        >
            <app-invoice-form-ticket-edit
                (onUpdateSubject)="onUpdateSubjectTicket($event,i)"
                [ticket]="ticket"
            ></app-invoice-form-ticket-edit>
        </ng-template>
    </div>
    <app-invoice-discount
        (onDelete)="onDeleteDiscount($event)"
        (onUpdate)="onUpdateDiscount($event)"
        [lockId]="invoice.lockId"
        *ngIf="toggleDiscount"
    ></app-invoice-discount>
</div>
<div class="summary-info qt-df qt-pl-30 qt-pr-30 qt-pb-24 qt-jc-sb">
    <div>
        <div
            class="qt-mb-30"
            *ngIf="!toggleDiscount"
        >
            <div
                class="info-button-sm qt-fw-600"
                (click)="toggleDiscount = !toggleDiscount"
            >
                <div class="icon__discount qt-mr-4 qt-sz-16 qt-ic-c"></div>
                Apply Discount
            </div>
        </div>
        <app-invoice-regular-note
            [invoiceNotes]="invoiceNotes"
            (onUpdateInvoiceData)="updateInvoiceData($event)"
        ></app-invoice-regular-note>
    </div>
    <div>
        <div class="invoice-total qt-color-dark">
            <div class="qt-df qt-jc-sb qt-fs-13 qt-mb-15">
                <div>Sub Total</div>
                <div [textContent]="(invoice.invoiceDataDto.productsSum + invoice.invoiceDataDto.servicesSum ) |
          currency"></div>
            </div>
            <div
                class="qt-df qt-jc-sb qt-fs-13 qt-mb-15"
                *ngIf="invoice.invoiceDataDto.invoiceDiscount"
            >
                <div>Discount</div>
                <div [textContent]="(-invoice.invoiceDataDto.invoiceDiscount.amount) |
          currency"></div>
            </div>
            <div class="qt-df qt-jc-sb qt-fs-13 qt-mb-15">
                <div>Tax</div>
                <div [textContent]="invoice.invoiceDataDto.taxSum | currency"></div>
            </div>
            <div class="qt-df qt-jc-sb qt-pt-15 invoice-total__total-line">
                <div class="qt-fs-13 qt-fw-b">Total</div>
                <div
                    class="qt-fs-16 qt-fw-b"
                    [textContent]="invoice.invoiceDataDto.totalSum | currency"
                ></div>
            </div>
        </div>
    </div>
</div>
<div class="terms-n-conditions qt-pl-30 qt-pr-30 qt-pb-24 qt-pt-16">
    <div class="qt-fs-13 qt-fw-600 qt-mb-12">Terms & Conditions</div>
    <div
        class="qt-fs-12 qt-color-info qt-fw-600 pointer"
        *ngIf="changeGlobalNote"
        (click)="onUpdateGlobalNote()"
    >
        Save Terms & Conditions
    </div>
    <textarea
        id="description-global-note"
        (input)="onCheckUpdateGlobalNote()"
        class="terms-n-conditions__textarea qt-textarea"
        placeholder="Enter the terms and conditions of your business to be displayed in your transaction"
        appTextArea
        maxlength="250"
        cols="30"
        rows="1"
    ></textarea>
</div>
<div class="qt-pl-30 qt-pr-30 qt-pb-24 qt-pt-16">
    <div class="qt-df qt-ai-c  qt-mb-10">
        <label
            class="qt-checkbox qt-dif qt-ai-c receive-full-amount-check qt-mb-0 pointer"
            for="includeInvoiceAsAttachmentSetting"
        >
            <input
                id="includeInvoiceAsAttachmentSetting"
                type="checkbox"
                [(ngModel)]="invoice.includeInvoiceAsAttachmentSetting"
            >
            <span></span>
            <div class="qt-fs-13 qt-lh-154 qt-ml-8">Attach a PDF copy of the invoice</div>
        </label>
    </div>
    <div
        class="qt-df qt-ai-c"
        *ngIf="invoice.allowToGenerateAccountReceivableReport"
    >
        <label
            class="qt-checkbox qt-dif qt-ai-c receive-full-amount-check qt-mb-0 pointer"
            for="includeAccountReceivableReportAsAttachmentSetting"
        >
            <input
                id="includeAccountReceivableReportAsAttachmentSetting"
                type="checkbox"
                [(ngModel)]="invoice.includeAccountReceivableReportAsAttachmentSetting"
            >
            <span></span>
            <div class="qt-fs-13 qt-lh-154 qt-ml-8">
                Client has past due invoice, Include a PDF, Account receivable report
            </div>
        </label>
    </div>
</div>
