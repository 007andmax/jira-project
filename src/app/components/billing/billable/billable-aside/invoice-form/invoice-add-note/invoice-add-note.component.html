<div class="qt-pt-24 qt-pb-24 qt-pl-24 qt-pr-24 qt-pos-rel">
    <div class="qt-popup-arrow --bottom"></div>
    <div class="qt-mb-20 qt-fw-600 qt-fs-15 qt-lh-133">Add Saved Note</div>
    <div class="qt-mb-16 --required">
        <div class="qt-input-block qt-lh-154">
            <mat-error
                class="invalid-feedback"
                *ngIf="!validate.getTitle()"
            >
                Title is required
            </mat-error>
            <label>Note Subject</label>
            <input
                minlength="1"
                maxlength="30"
                (input)="validate.resetTitle();"
                [ngClass]="{'--input-error' : !validate.getTitle()}"
                type="text"
                [(ngModel)]="createNote.title"
                placeholder="Write Note Subject"
            >
        </div>
    </div>
    <div class="qt-mb-24 --required">
        <div class="qt-input-block qt-text-area-block">
            <mat-error
                class="invalid-feedback"
                *ngIf="!validate.getContent()"
            >
                Description is required
            </mat-error>
            <label class="qt-lh-154">Note Description</label>
            <textarea
                class="qt-input-block__textarea"
                [(ngModel)]="createNote.content"
                placeholder="Write your note description"
                (input)="validate.resetContent();"
                [ngClass]="{'--input-error' : !validate.getContent()}"
                row="8"
                minlength="1"
                maxlength="500"
            ></textarea>
        </div>
    </div>
    <div class="qt-df">
        <button
            class="qt-button qt-mr-12"
            (click)="add()"
        >
            Save Note
        </button>
        <button
            class="qt-button --gray"
            (click)="close()"
        >
            Cancel
        </button>
    </div>
</div>
