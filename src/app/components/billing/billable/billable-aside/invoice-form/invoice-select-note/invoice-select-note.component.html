<div
    [ngClass]="class"
    class="invoice-select-note"
>
    <input
        [id]="id"
        [placeholder]="placeholder"
        type="text"
        [(ngModel)]="selectedItem"
        class="pointer typeahead-focus1"
        [ngClass]="(!valid) ? 'no-valid' : ''"
        [inputFormatter]="formatter"
        [resultFormatter]="formatter"
        [ngbTypeahead]="search"
        (selectItem)="selectItem($event)"
        (input)="onCheckChange($event)"
        (focus)="focus$.next('')"
        (click)="click$.next('')"
        #instance="ngbTypeahead"
        autocomplete="new-password"
        [attr.maxlength]="maxlength"
        (isPopupOpen)="isDropDownOpen()"
    >
    <mat-error
        class="invalid-feedback mat-error"
        *ngIf="!valid"
    >
        Title is required
    </mat-error>
    <span *ngIf="list">
        <i
            *ngIf="selectedItem"
            class="icn-remove-old qt-icon icon__close qt-icon__gray-400 qt-sz-20"
            (click)="clearClient()"
        ></i>
        <i
            *ngIf="!selectedItem"
            class="icn-sm qt-icon icon__arrow-down report-caret-icon"
        ></i>
    </span>
    <i
        class="loading xs"
        *ngIf="!list"
    ></i>
</div>
