<div class="qt-pt-24 qt-pb-24 qt-pl-24 qt-pr-24 billable-edit-customer qt-pos-rel">
    <div class="qt-popup-arrow"></div>
    <div class="qt-mb-16 qt-fs-15 qt-fw-600">Edit Customer</div>
    <div class="qt-inputs-row">
        <div class="qt-input-block">
            <div class="qt-input-block__label">Company Name</div>
            <input
                type="text"
                [(ngModel)]="company.name"
                placeholder="Write Company or Search Company"
                (blur)="onChangeName()"
            >
            <mat-error *ngIf="validate.getNameIsExist()">This company name already occupied</mat-error>
            <mat-error *ngIf="!validate.getName()">Company name is required</mat-error>
        </div>
    </div>
    <div class="qt-inputs-row">
        <div class="qt-input-block">
            <div class="qt-input-block__label">Location</div>
            <input
                type="text"
                #addresstext
                [(ngModel)]="company.addresses[0].address"
                (focus)="onCheckGoogleAutoComplete()"
                placeholder="Enter Location"
            >
        </div>
    </div>
    <div class="qt-inputs-row">
        <div class="qt-input-block qt-f50">
            <div class="qt-input-block__label">Suite No.</div>
            <input
                type="text"
                [(ngModel)]="company.addresses[0].suiteNumber"
                placeholder="Enter Suite Number"
            >
        </div>
        <div class="qt-input-block qt-f50">
            <div class="qt-input-block__label">Postal/Zip code</div>
            <input
                type="text"
                [(ngModel)]="company.addresses[0].postalCode"
                placeholder="Enter Zip"
            >
        </div>
    </div>
    <div class="qt-inputs-row">
        <div class="qt-input-block qt-f50">
            <div class="qt-input-block__label">First Name</div>
            <input
                type="text"
                [(ngModel)]="company.contacts[0].firstName"
                (input)="onChangeFirstName()"
                placeholder="Enter First Name"
            >
            <mat-error *ngIf="!validate.getFirstName()">First name is required</mat-error>
        </div>
        <div class="qt-input-block qt-f50">
            <div class="qt-input-block__label">Last Name</div>
            <input
                type="text"
                [(ngModel)]="company.contacts[0].lastName"
                (input)="onChangeLastName()"
                placeholder="Enter Last Name"
            >
            <mat-error *ngIf="!validate.getLastName()">Last name is required</mat-error>
        </div>
    </div>
    <div class="qt-inputs-row">
      <div class="qt-input-block">
        <div class="qt-input-block__label">Primary Contact Email</div>
        <input
          type="text"
          [(ngModel)]="company.contacts[0].primaryEmail"
          (input)="onChangePrimaryEmail()"
          placeholder="Primary Email Address"
        >
        <mat-error *ngIf="!validate.getPrimaryContactEmail()">Please enter a valid email address</mat-error>
      </div>
    </div>
    <div class="qt-inputs-row">
      <div class="qt-input-block">
        <div class="qt-input-block__label">Phone Number</div>
        <input
          type="text"
          *ngIf="company.contacts[0].phoneNumbers.length > 0"
          [(ngModel)]="company.contacts[0].phoneNumbers[0].number"
          placeholder="Enter Phone Number"
          (input)="onChangePhoneNumber()"
          prefix="+1"
          mask="(000) 000-0000 Ext: 999999||000-000-0000"
          [specialCharacters]="['(',')',' ','-','E','x','t',':']"
          [dropSpecialCharacters]="false"
        >
        <mat-error *ngIf="!validate.getPhoneNumber()">Phone number is required</mat-error>
      </div>
    </div>
    <div class="qt-df">
        <button
            class="qt-button qt-mr-12"
            (click)="onUpdate()"
        >
            Save Changes
        </button>
        <button
            class="qt-button --gray"
            (click)="close()"
        >
            Cancel
        </button>
    </div>
</div>
