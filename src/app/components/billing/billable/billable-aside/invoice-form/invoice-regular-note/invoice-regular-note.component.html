<div class="summary-info__notes">
    <div class="qt-df qt-jc-sb qt-mb-8">
        <div class="qt-input-block__label --without-offset qt-df qt-ai-c">
            <span class="qt-mr-6">Customer Note</span>
        </div>
        <div
            class="qt-fs-12 qt-color-info qt-fw-600 pointer"
            placement="top"
            ngbTooltip="Expand Notes"
            (click)="toogleCustomerNote = !toogleCustomerNote"
        >
            Saved Notes +
        </div>
    </div>
    <div>
        <div
            class="qt-input-block"
            *ngIf="toogleCustomerNote"
            ngbDropdown
            [autoClose]="'inside'"
            #addNoteDd="ngbDropdown"
            [ngClass]="{'qt-mb-16':validate.getTitle(),'qt-mb-30':!validate.getTitle()}"
        >
            <div class="qt-df qt-input-block--horizontal">
                <app-invoice-select-note
                    [editItem]="selectedNote"
                    [placeholder]="'Select Saved Notes'"
                    [class]="['light-dropdown']"
                    [field]="'title'"
                    [list]="invoiceNotes"
                    [valid]="validate.getTitle()"
                    [maxlength]="100"
                    (onChangeInput)="onCheckUpdateTitleNote($event)"
                    (onSelectedItem)="onSelectNotes($event)"
                ></app-invoice-select-note>
                <div
                    class="qt-square-btn --done qt-ml-8"
                    (click)="onUpdateRegularNote()"
                    *ngIf="changeRegularNote"
                    placement="top"
                    ngbTooltip="Edit Note"
                ></div>
                <div
                    class="qt-square-btn --add qt-ml-8"
                    placement="top"
                    ngbTooltip="Add Note"
                    id="dropdownAddNote"
                    ngbDropdownToggle
                >
                    <div
                        class="billable-popup-add-note"
                        ngbDropdownMenu
                        aria-labelledby="dropdownAddNote"
                    >
                        <app-invoice-add-note
                            (onUpdateNotes)="getInvoiceNote()"
                            [dropDown]="addNoteDd"
                        ></app-invoice-add-note>
                    </div>
                </div>
            </div>
        </div>
        <div class="qt-input-block qt-input-line">
            <textarea
                (input)="onCheckUpdateDescriptionNote()"
                (blur)="onChangeRegularNote()"
                class="summary-info__textarea qt-input-block__textarea"
                placeholder="Type your custom note here"
                name
                id="description-regular-note"
                appTextArea
                maxlength="250"
                cols="30"
                rows="1"
                [ngClass]="{'--error' : !validate.getContent()}"
            ></textarea>
            <mat-error
                class="invalid-feedback"
                *ngIf="!validate.getContent()"
            >
                Description is required
            </mat-error>
        </div>
    </div>
</div>
