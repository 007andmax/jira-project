<div>
    <div
        class="item-selected-address pointer"
        ngbDropdownItem
        (click)="selectAddress(company.addresses[1].id,company.addresses[0].id)"
    >
        <div
            class="qt-fs-13 qt-lh-154 qt-fw-b qt-color-dark"
            [textContent]="company.addresses[0].locationName"
        ></div>
        <div
            class="qt-fs-13 qt-lh-154"
            [textContent]="company.contacts[0].firstName + ' ' +
      company.contacts[0].lastName"
        ></div>
        <div
            class="qt-fs-13 qt-lh-154"
            [textContent]="company.addresses[0].addressWithSuitNumberAndPostalCode"
        ></div>
        <div
            class="qt-fs-13 qt-lh-154"
            [textContent]="company.contacts[0].primaryEmail"
        ></div>
        <div class="qt-fs-13 qt-mb-4">
            <preview-phone-mask
                [class]="'company-info-aside__row-info-value'"
                *ngIf="(company.contacts[0].phoneNumbers && company.contacts[0].phoneNumbers.length > 0)"
                [number]="company.contacts[0].phoneNumbers[0].number"
            ></preview-phone-mask>
        </div>
    </div>
    <div
        class="item-selected-address pointer"
        ngbDropdownItem
        (click)="selectAddress(company.addresses[1].id,company.addresses[1].id)"
    >
        <div
            class="qt-fs-13 qt-lh-154 qt-fw-b qt-color-dark"
            [textContent]="company.addresses[1].locationName"
        ></div>
        <div
            class="qt-fs-13 qt-lh-154"
            [textContent]="company.contacts[0].firstName + ' ' +
      company.contacts[0].lastName"
        ></div>
        <div
            class="qt-fs-13 qt-lh-154"
            [textContent]="company.addresses[1].addressWithSuitNumberAndPostalCode"
        ></div>
        <div
            class="qt-fs-13 qt-lh-154"
            [textContent]="company.contacts[0].primaryEmail"
        ></div>
        <div class="qt-fs-13 qt-mb-4">
            <preview-phone-mask
                [class]="'company-info-aside__row-info-value'"
                *ngIf="(company.addresses[1].phoneNumbers && company.addresses[1].phoneNumbers.length > 0)"
                [number]="company.addresses[1].phoneNumbers[0].number"
            ></preview-phone-mask>
        </div>
    </div>
</div>
