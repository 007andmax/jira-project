<div>
    <div
        class="item-selected-address pointer"
        ngbDropdownItem
        (click)="selectAddress(getShippingAddress())"
    >
        <div
            class="qt-fs-13 qt-lh-154 qt-fw-b qt-color-gray-900"
            [textContent]="getShippingAddress().locationName"
        ></div>
        <div
            class="qt-fs-13 qt-lh-154"
            [textContent]="getShippingAddress().addressWithSuitNumberAndPostalCode"
        ></div>
    </div>
    <div
        class="item-selected-address pointer"
        ngbDropdownItem
        *ngIf="getBillingAddress()"
        (click)="selectAddress(getBillingAddress())"
    >
        <div
            class="qt-fs-13 qt-lh-154 qt-fw-b qt-color-gray-900"
            [textContent]="getBillingAddress().locationName"
        ></div>
        <div
            class="qt-fs-13 qt-lh-154"
            [textContent]="getBillingAddress().addressWithSuitNumberAndPostalCode"
        ></div>
    </div>
</div>
