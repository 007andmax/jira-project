<div class="invoice-item qt-mb-16 qt-w100">
    <div class="qt-df qt-ai-c">
        <div class="invoice-item__header qt-w100 qt-ml-30 qt-df qt-ai-c qt-pt-10 qt-pb-10 qt-h40">
            <div
                class="invoice-item__number qt-color-white qt-fs-10 qt-pt-4 qt-pb-4 qt-pl-4 qt-pr-4 qt-mr-16"
                [textContent]="'Tkt# ' + ticket.number"
            ></div>
            <div class="qt-fs-12 qt-mr-16">
                <span class="qt-fs-11 qt-fw-600">Date</span>
                {{getDate(ticket.closedAt)}}
            </div>
            <div class="qt-fs-12 qt-df qt-ai-c qt-fg">
                <span class="qt-fs-11 qt-fw-600">Subject:</span>
                <input
                    class="qt-mr-10 qt-ml-10 qt-fg"
                    [(ngModel)]="ticket.newSubject"
                    (input)="onChangeSubject()"
                >
            </div>
        </div>
        <div class="delete-item-container qt-pl-4"></div>
    </div>
    <table class="invoice-item__table">
        <thead>
            <tr>
                <th></th>
                <th class="invoice-item__col-item  qt-fw-600">Item</th>
                <th class="invoice-item__col-desc  qt-fw-600">Description</th>
                <th class="invoice-item__col-price qt-fw-600">Unit Price</th>
                <th class="invoice-item__col-quentity qt-fw-600">Quantity</th>
                <th class="invoice-item__col-tax qt-fw-600">Tax</th>
                <th class="invoice-item__col-amount qt-fw-600">Amount</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <ng-template
                ngFor
                let-service
                [ngForOf]="ticket.serviceExpenses"
                [ngForTrackBy]="trackById"
            >
                <app-invoice-form-ticket-edit-service [service]="service"></app-invoice-form-ticket-edit-service>
            </ng-template>
            <ng-template
                ngFor
                let-product
                [ngForOf]="ticket.productExpenses"
                [ngForTrackBy]="trackById"
            >
                <app-invoice-form-ticket-edit-product [product]="product"></app-invoice-form-ticket-edit-product>
            </ng-template>
        </tbody>
    </table>
</div>
