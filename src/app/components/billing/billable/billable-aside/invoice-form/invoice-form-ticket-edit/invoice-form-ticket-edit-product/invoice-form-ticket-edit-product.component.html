<tr class="invoice-ticket-edit-service-product">
    <td></td>
    <td
        class="invoice-item__col-item  --product"
        [textContent]="product.item.manufacture"
    >
    </td>
    <td
        class="invoice-item__col-desc --product"
        [textContent]="product.item.description"
    ></td>
    <td class="invoice-item__col-price  --product">
        <input
            class="input-default input-price"
            [ngClass]="{'--input-error':!valdiateSaleCost}"
            number
            [money]="true"
            [ngModel]="product.item.sale"
            appToFixed
            (blur)="onValidateSaleCost()"
            (ngModelChange)="onChangeSale($event)"
            [disabled]="!getPermissions('MANAGE_PRODUCTS')"
        >
        <app-mat-error
            class="qt-tooltip-error"
            *ngIf="!valdiateSaleCost"
        >
            Product price can not be lower than cost
        </app-mat-error>
    </td>
    <td class="invoice-item__col-quentity  --product">
        <input
            class="input-default input-qty"
            [(ngModel)]="product.quantity"
        >
    </td>
    <td class="invoice-item__col-tax  --product">
        <app-taxes
            #taxes
            [isLabel]="false"
            [isAdd]="false"
            (taxesChange)="onTaxesChange($event)"
        ></app-taxes>
    </td>
    <td
        class="invoice-item__col-amount  --product"
        [textContent]="product.sum | currency"
    ></td>
    <td></td>
</tr>
