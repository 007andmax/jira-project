<div
    class="light-dropdown new-taxes-area-edit taxes-dropdown"
    ngbDropdown
    #taxesDropDown="ngbDropdown"
>
    <input
        type="text"
        [value]="getSelectedTaxes()"
        autocomplete="new-password"
        readonly
        [attr.placeholder]="(placeholder) ? placeholder : 'Taxes'"
        id="dropdownTypeTaxes"
        class="qt-input-block__input qt-dropdown-input"
        ngbDropdownToggle
    >
    <i class="icn-sm qt-icon icon__arrow-down report-caret-icon"></i>
    <div
        ngbDropdownMenu
        class="taxes-dropdown__dropdown"
        aria-labelledby="dropdownTypeTaxes"
    >
        <ng-template
            ngFor
            let-tax
            [ngForOf]="taxes"
            [ngForTrackBy]="trackById"
        >
            <div
                class="dropdown-item"
                ngbDropdownItem
                (click)="selected(tax)"
            >
                <button [textContent]="tax.name + ' ' + tax.rate + '%'"></button>
                <i
                    class="qt-sz-20 icon__done qt-icon__blue-light-600 icn-label-save taxes-dropdown__check-icon"
                    *ngIf="checkTaxIsSelected(tax)"
                ></i>
            </div>
        </ng-template>
    </div>
</div>
