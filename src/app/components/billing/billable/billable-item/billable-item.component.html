<div class="qt-table-modern__row">
    <div
        class="billable-item-table__check"
        *ngIf="getPermissions('CREATE_INVOICE')"
    >
        <div class="qt-df">
            <label
                class="qt-checkbox pointer"
                [attr.for]="'billable-' + item.id"
            >
                <input
                    [attr.id]="'billable-' + item.id"
                    [(ngModel)]="item.selected"
                    (change)="onChangeSelected($event)"
                    type="checkbox"
                >
                <span></span>
            </label>
        </div>
    </div>
    <div
        class="billable-table__company-name --strong"
        [textContent]="item.name"
        (click)="moToBillableTickets()"
    ></div>
    <div
        class="billable-table__tickets"
        (click)="moToBillableTickets()"
    >
        <div
            class="qt-df billable-table__user"
            *ngIf="salesPerson"
        >
         <ng-template #popContent let-greeting="greeting"
	>
    <app-tickets-table-item-requested-by  
    [requestedUser]="salesPerson"
    [indexNoAvatar]="indexNoAvatar"
    [listColorNoAvatar]="listColorNoAvatar"
    ></app-tickets-table-item-requested-by>
    </ng-template
>
            <div
                class="qt-table-modern__circle-avatar"
                [textContent]="ticketsListService.getAssignedUserNameForAvatar(salesPerson)"
                [ngStyle]="{'background': getStyleAvatar(salesPerson)}"
                [ngbPopover]="popContent"
                [popoverClass]="'requested-by-popover'"
                 [autoClose]="'outside'"
                 [container]="'body'"
                #p="ngbPopover"
                triggers="manual"
                 appUserLogoPopover
                [user]="salesPerson"
                [popover]="p"
                [disabled]="!salesPerson"
                [disablePopover]="!salesPerson"
            >
            </div>
            <div [textContent]="ticketsListService.getUserName(salesPerson)"></div>
        </div>
    </div>
    <div
        class="billable-table__sales"
        [textContent]="item.countTickets"
        (click)="moToBillableTickets()"
    ></div>
    <div
        class="billable-table__billable"
        [textContent]="(item.total | currency)"
        (click)="moToBillableTickets()"
    ></div>
    <div
        class="invoce-table__menu"
        ngbDropdown
        [container]="'body'"
        *ngIf="getPermissions('CREATE_INVOICE')"
    >
        <div
            class="qt-ic-c qt-icon icon__more  qt-pointer qt-sz-16 qt-bg-contain"
            id="dropdownBasic1"
            ngbDropdownToggle
        >
            <ul
                class="qt-dropdown-menu invoice-items-dropdown"
                ngbDropdownMenu
                aria-labelledby="dropdownBasic1"
            >
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="onInvoiceAll()"
                >
                    <div class="qt-icon icon__billing qt-sz-20 qt-mr-12"></div>
                    Invoice All
                </li>
            </ul>
        </div>
    </div>
</div>
