<div
    class="qt-page-list page-list-billable"
    *ngIf="billableProfile"
>
    <div
        class="billable-address-empty-popup"
        *ngIf="!isCurrentCompanyAddressEmpty"
    >
        <div
            class="modal-body"
            style="width: 250px;"
        >
            {{ currentUser.isOwner
          ? 'You can not use invoicing feature, because you have not entered the company\'s address.'
          : 'The owner of the company has not filled the address of the company, therefore you can not use invoicing feature.'
        }}
        </div>
        <div
            class="modal-footer"
            *ngIf="currentUser.isOwner"
        >
            <div
                class="btn btn-lg btn-primary"
                (click)="goToSettings()"
            >
                Enter Address
            </div>
        </div>
    </div>
    <div class="qt-page-list__header --sticky">
        <div class="qt-page-list__header-title-line">
            <div class="qt-page-list__header-title-line--left">
                <div
                    class="qt-page-list__back-button qt-icon icon__arrow-left button-icon pointer"
                    (click)="back()"
                ></div>
                <h6
                    class="qt-page-list__header-title"
                    [textContent]="billableProfile.name"
                ></h6>
            </div>
            <div class="qt-page-list__header-title-line--rigth">
                <div class="qt-df qt-ai-c">
                    <div
                        class="company-devices-page__list-header-buttons"
                        *ngIf="getSelectedCount() > 0 && !isInitMultyRemove"
                    >
                        <div [textContent]="getSelectedCount() + ' Ticket Selected'"></div>
                        <div
                            class="qt-ml-20 qt-fw-500 qt-df qt-ai-c qt-color-info qt-ai-c qt-pointer"
                            (click)="deleteSelectedTickets()"
                        >
                            <div class="qt-icon icon__remove qt-icon__red-600 qt-sz-16 qt-ic-c qt-mr-6"></div>
                            <div class="qt-lh-1">Delete</div>
                        </div>
                    </div>
                    <button
                        *ngIf="getPermissions('CREATE_INVOICE')"
                        class="qt-button --gray --md qt-ml-8"
                        [disabled]="!isCurrentCompanyAddressEmpty"
                        (click)="onCreateInvoice()"
                    >
                        Create Invoice
                    </button>
                </div>
            </div>
        </div>
        <div class="qt-page-list__header-thead-container">
            <div class="qt-table-modern qt-page-list__header-thead">
              <div class="qt-page-list__header-thead__row">
                <div class="billable-item-table__check">
                  <div class="qt-df">
                    <label class="qt-checkbox">
                      <input
                        type="checkbox"
                        (change)="onToggleAll($event)"
                      >
                      <span></span>
                    </label>
                  </div>
                </div>
                <div
                  class="billable-item-table__date"
                  (click)="onFilter('closedAt')"
                >
                  Date
                  <span class="qt-table-modern__sorting"></span>
                </div>
                <div
                  class="billable-item-table__ticket"
                  (click)="onFilter('ticketNumber')"
                >
                  Ticket#
                  <span class="qt-table-modern__sorting"></span>
                </div>
                <div
                  class="billable-item-table__subject"
                  (click)="onFilter('subject')"
                >
                  Ticket Subject
                  <span class="qt-table-modern__sorting"></span>
                </div>
                <div
                  class="billable-item-table__amount"
                  (click)="onFilter('sum')"
                >
                  Amount
                  <span class="qt-table-modern__sorting"></span>
                </div>
              </div>
            </div>
        </div>
    </div>
    <div class="qt-page-list__body">
        <div class="qt-page-list__body-table-container">
            <div class="qt-page-list__body-tbody qt-table-modern billable-item-table">
                <div class="tbody">
                    <ng-template
                        ngFor
                        let-item
                        [ngForOf]="billableProfile.tickets"
                        let-i="index"
                        [ngForTrackBy]="trackById"
                    >
                        <div class="qt-table-modern__row" [ngClass]="{'--selected': item.selected}">
                            <div
                                class="billable-item-table__check"
                                *ngIf="!item.lockedBy"
                            >
                                <div class="qt-df">
                                    <label
                                        class="qt-checkbox pointer"
                                        [attr.for]="'ticket-' + i"
                                    >
                                        <input
                                            [attr.id]="'ticket-' + i"
                                            [(ngModel)]="item.selected"
                                            type="checkbox"
                                        >
                                        <span></span>
                                    </label>
                                </div>
                            </div>
                            <div
                                class="billable-item-table__check"
                                *ngIf="item.lockedBy"
                            >
                                <div
                                    class="qt-icon icon__password qt-sz-16"
                                    placement="top"
                                    container="body"
                                    ngbTooltip="Is being used by other user"
                                ></div>
                            </div>
                            <div
                                class="billable-item-table__date"
                                [textContent]="getDate(item.closedAt)"
                            ></div>
                            <div
                                class="billable-item-table__ticket pointer"
                                *ngIf="!item.isOrder"
                                [textContent]="item.ticketNumber"
                                (click)="editTicket(item.id)"
                            ></div>
                            <div
                                class="billable-item-table__ticket no-edit-ticket"
                                *ngIf="item.isOrder"
                                [textContent]="'Contract'"
                            ></div>
                            <div
                                class="billable-item-table__subject"
                                [textContent]="item.subject"
                            ></div>
                            <div class="billable-item-table__check">
                                <div
                                    *ngIf="item.isOrder"
                                    class="qt-icon icon__remove qt-sz-20"
                                    (click)="deleteTicket(item)"
                                    placement="top"
                                    ngbTooltip="Delete"
                                ></div>
                            </div>
                            <div
                                class="billable-item-table__amount"
                                [textContent]="item.sum | currency"
                            ></div>
                        </div>
                    </ng-template>
                </div>
            </div>
        </div>
    </div>
</div>
<app-billable-aside (onSetSelectedTickets)="setSelectedTickets($event)"></app-billable-aside>
