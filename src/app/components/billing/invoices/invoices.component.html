<div class="qt-page-list invoices-page ">
    <div class="qt-df qt-fd-c qt-jc-sb invoices-page__list-container">
        <div>
            <app-invoices-header
                #invoiceHeader
                (onCreateInvoice)="onCreatePayment()"
               
            ></app-invoices-header>
             <div class="qt-page-list users-page qt-df">
            <div class="qt-page-list__body qt-pl-32"  [ngClass]="{'qt-pr-32':!toggleFilter,
        '--open-filters':toggleFilter}">
         <div class="qt-page-list__container">
                <div class="qt-page-list__body">
          <div class="qt-page-list__header-thead-container">
        <div class="qt-table-modern qt-page-list__header-thead">
            <div class="qt-table-modern qt-page-list__header-thead">
                <div class="qt-page-list__header-thead__row">
                    <div class="invoice-table__check"></div>
                    <div
                        class="invoce-table__date pointer"
                        (click)="sortList('INVOICE_DATE')"
                    >
                        Date
                        <span class="qt-table-modern__sorting"></span>
                         <div *ngIf="sortBy.sortBy == 'INVOICE_DATE'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div
                        class="invoce-table__invoice pointer"
                        (click)="sortList('INVOICE_NUMBER')"
                    >
                        Invoice#
                        <span class="qt-table-modern__sorting"></span>
                         <div *ngIf="sortBy.sortBy == 'INVOICE_NUMBER'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div
                        class="invoce-table__company pointer"
                        (click)="sortList('COMPANY_NAME')"
                    >
                        Company
                        <span class="qt-table-modern__sorting"></span>
                         <div *ngIf="sortBy.sortBy == 'COMPANY_NAME'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div class="invoce-table__status">Status</div>
                    <div
                        class="invoce-table__read-on pointer"
                        (click)="sortList('READ_ON')"
                    >
                        Read On
                        <span class="qt-table-modern__sorting"></span>
                         <div *ngIf="sortBy.sortBy == 'READ_ON'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div
                        class="invoce-table__amount pointer"
                        (click)="sortList('AMOUNT')"
                    >
                        Amount
                        <span class="qt-table-modern__sorting"></span>
                         <div *ngIf="sortBy.sortBy == 'AMOUNT'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div
                        class="invoce-table__balance-due pointer"
                        (click)="sortList('BALANCE')"
                    >
                        Balance Due
                        <span class="qt-table-modern__sorting"></span>
                         <div *ngIf="sortBy.sortBy == 'BALANCE'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div class="invoce-table__menu"></div>
                </div>
            </div>
        </div>
    </div>
                <div class="qt-page-list__body-table-container">
                    <div class="qt-page-list__body-tbody qt-table-modern invoice-table">
                        <div class="tbody"
                            infiniteScroll
                            [infiniteScrollContainer]="container"
                            [infiniteScrollDistance]="2"
                            [infiniteScrollThrottle]="50"
                            [infiniteScrollDisabled]="infiniteScrollDisabled"
                            (scrolled)="onScroll()"
                        >
                            <ng-template
                                ngFor
                                let-invoice
                                [ngForOf]="invoices"
                                [ngForTrackBy]="trackById"
                            >
                                <app-invoices-item
                                    (onSelectInvoice)="onSelectInvoice()"
                                    (onPreviewInvoice)="onPreviewInvoice($event)"
                                    [invoice]="invoice"
                                ></app-invoices-item>
                            </ng-template>
                        </div>
                    </div>
                    <div
                        class="loading"
                        *ngIf="showPreloader"
                    ></div>
                    <div
                        class="no-exist-elements"
                        *ngIf="!showPreloader && invoices.length == 0"
                    >
                        We couldn't find any results
                    </div>
                    <div class="total-info">
                        <div
                            class="loading pengind-loading"
                            *ngIf="showPendingPreloader"
                        ></div>
                        <div class="qt-df qt-jc-fe qt-mt-16">
                            <div>
                                <span class="qt-fw-600 qt-fs-13 qt-mr-5">Total:</span>
                                <span
                                    class="qt-fw-600 qt-fs-16"
                                    [textContent]="getTotal() | currency"
                                ></span>
                            </div>
                            <div class="qt-ml-20">
                                <span class="qt-fw-600 qt-fs-13 qt-mr-5">Total BD:</span>
                                <span
                                    class="qt-fw-600 qt-fs-16"
                                    [textContent]="getTotalBalanceDue() | currency"
                                ></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
             </div>
             </div>
              <div
            class="aside-filters qt-ml-16"
            [hidden]="!toggleFilter"
        >
            <div class="aside-filters-header qt-df qt-ai-c qt-jc-sb">
                <div class="aside-filters-header__title">Filters</div>
                <div
                    class="qt-button --square-md --gray pointer"
                    (click)="onCloseFilters()"
                >
                    <div class="qt-icon icon__close qt-sz-16 pointer"></div>
                </div>
            </div>
            <div class="aside-filters-content">
                <app-invoices-filter
                    class="qt-w100"
                    (onClose)="onCloseFilters()"
                ></app-invoices-filter>
            </div>
        </div>
        </div>
        </div>
    </div>
</div>
