<div class="qt-df qt-ai-c">
    <company-drop-down
        class="search-company invoices-company-filter"
        #companyDp
        [placeholder]="'Select Company'"
        [change]="true"
        [search]="true"
        [class]="['qt-dropdown']"
        [field]="'name'"
        (onSelectedItem)="onSelectCompany($event)"
    ></company-drop-down>
    <app-drop-down
        class="search-company invoices-status-filter"
        #statusDp
        [placeholder]="'Select Status'"
        [change]="false"
        [class]="['qt-dropdown']"
        [field]="'title'"
        [list]="statusTypes"
        (onSelectedItem)="onSelectStatus($event)"
    ></app-drop-down>
    <input
        type="text"
        appKeyUpEnter
        (onChange)="onSetNumberInvoice($event)"
        placeholder="Enter Invoice #"
        class="qt-mr-8 qt-input-block__input filter-invoice invoices-number-filter"
        [(ngModel)]="invoicesFilter.invoiceNumber"
    >
    <app-multi-datepicker
        class="qt-input-block invoices-date-filter qt-mr-8"
        #datesDp
        [container]="'body'"
        (selectedDate)="filterByDate($event)"
    ></app-multi-datepicker>
    <input
        number
        appKeyUpEnter
        (onChange)="onSetAmountInvoice($event)"
        placeholder="Enter Amount"
        class="qt-mr-8 qt-input-block__input filter-invoice invoices-number-filter"
        id="amount-filter"
    >
    <!-- <div class="qt-circle qt-sz-32 qt-icon icon__print qt-ic-c qt-mr-8 filters-icon"></div>
  <div class="qt-circle qt-sz-32 icon__download qt-ic-c filters-icon"></div> -->
</div>
