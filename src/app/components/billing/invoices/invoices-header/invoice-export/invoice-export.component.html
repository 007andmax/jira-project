<div class="qt-report__control-panel qt-ml-16">
    <div
        class="qt-report__control-panel-btn qt-df qt-ai-c qt-jc-c qt-mr-6 pointer"
        placement="top"
        container="body"
        ngbTooltip="Email"
        (click)="sendEmail()"
        *ngIf="!customerPortalStateService.isCustomerPortal"
    >
      <div class="qt-sz-20 qt-icon icon__email-send"></div>
    </div>
    <div
        class="qt-report__control-panel-btn qt-df qt-ai-c qt-jc-c qt-mr-6 pointer"
        placement="top"
        container="body"
        ngbTooltip="Print"
        (click)="print('pdf')"
    >
      <div class="qt-sz-20 qt-icon icon__print"></div>
    </div>
    <app-dynamic-tooltip
        [content]="'Export'"
        [position]="'top'"
        #exportTooltip
    ></app-dynamic-tooltip>
    <div
        placement="top"
        container="body"
        ngbTooltip="Export"
    >
        <div
            class="qt-report__control-panel-btn pointer"
            ngbDropdown
            container="body"
            ngbTooltip="Export"
        >
        <div  class="icon_export qt-df qt-ai-c qt-jc-c"  ngbDropdownToggle>
            <div class="qt-sz-20 qt-icon icon__share"></div>
            </div>
            <ul
                ngbDropdownMenu
                placement="bottom"
                aria-labelledby="dropdown1"
                class="additional-dropdown"
            >
                <ng-template
                    ngFor
                    let-item
                    [ngForOf]="listExport"
                    let-i="index"
                >
                    <li
                        class="open-pdf-btn "
                        ngbDropdownItem
                        [textContent]="item"
                        (click)="onSelectExport(item)"
                    ></li>
                </ng-template>
            </ul>
        </div>
    </div>
</div>
