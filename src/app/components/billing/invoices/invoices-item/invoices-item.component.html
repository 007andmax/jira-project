<div
    class="qt-table-modern__row"
    [ngClass]="{'--selected': invoice.selected}"
>
    <div
        class="invoice-table__check"
        [ngClass]="{'no-pointer':invoice.status == 'DELETED'}"
    >
        <div
            class="qt-df"
            *ngIf="invoice.status != 'DELETED'"
        >
            <label
                class="qt-checkbox pointer"
                [attr.for]="'invoice-' + invoice.id"
            >
                <input
                    [attr.id]="'invoice-' + invoice.id"
                    [(ngModel)]="invoice.selected"
                    type="checkbox"
                    (change)="onChangeSelect()"
                >
                <span></span>
            </label>
        </div>
    </div>
    <div
        class="invoce-table__date no-pointer"
        [textContent]="getDate(invoice.date)"
    ></div>
    <div
        class="invoce-table__invoice pointer"
        [textContent]="invoice.number"
        (click)="onShowPreviewInvoice()"
    ></div>
    <div class="invoce-table__company ellipsis no-pointer">
        <ng-template #popCompanyContent let-greeting="greeting"
	>
    <app-users-table-company-by
    [company]="company"
    [indexNoAvatar]="indexNoAvatar"
    [listColorNoAvatar]="listColorNoAvatar"
    ></app-users-table-company-by>
    </ng-template
>
        <div
            class="tooltip__circle-avatar"
            [textContent]="company.name[0].toUpperCase()"
            [ngStyle]="{'background': parseLogo() }"
             [ngbPopover]="popCompanyContent"
            [popoverClass]="'requested-by-popover'"
                [autoClose]="'outside'"
                [container]="'body'"
            #pCompany="ngbPopover"
            triggers="manual"
            appCompanyLogoPopover
            [company]="company"
            [popover]="pCompany"
            [disabled]="!company"
            [disablePopover]="!company"
        ></div>
        <div
            class="ellipsis"
            [textContent]="company.name"
        >
        </div>
    </div>
    <div class="invoce-table__status no-pointer">
        <span
            class="tag__modern --warning"
            *ngIf="invoice.isOverDue && !invoice.paidOn && invoice.status != 'DELETED'"
            [textContent]="'Overdue by ' + invoice.getOverDueDate() + ' days'"
        ></span>
        <span
            class="tag__modern --info"
            *ngIf="!invoice.isOverDue && !invoice.paidOn && invoice.status != 'DELETED'"
            [textContent]="'Due in ' + invoice.getDueDate() + ' days'"
        ></span>
        <span
            class="tag__modern --success"
            *ngIf="invoice.paidOn && invoice.status != 'DELETED'"
            [textContent]="'Paid ' + invoice.getPaidOnDate() + ' days ago'"
        ></span>
        <span
            class="tag__modern --saved"
            *ngIf="invoice.status == 'DELETED'"
            [textContent]="'Deleted'"
        ></span>
    </div>
    <div
        class="invoce-table__read-on no-pointer"
        [textContent]="getDate(invoice.readedAt)"
    ></div>
    <div class="invoce-table__amount ellipsis no-pointer">
        <span
            class="ellipsis"
            [textContent]="invoice.totalSum | currency"
        ></span>
    </div>
    <div class="invoce-table__balance-due no-pointer ellipsis">
        <span
            class="ellipsis"
            [textContent]="((invoice.totalSum || invoice.sum) - invoice.paidSum) | currency"
        ></span>
    </div>
    <div
        class="invoce-table__menu"
        ngbDropdown
        [container]="'body'"
    >
        <div
            class="qt-ic-c qt-icon icon__more  qt-pointer qt-sz-16 qt-bg-contain"
            id="dropdownBasic1"
            ngbDropdownToggle
        >
            <ul
                class="qt-dropdown-menu invoice-items-dropdown"
                ngbDropdownMenu
                aria-labelledby="dropdownBasic1"
            >
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="resendInvoices(false)"
                    *ngIf="!customerPortalStateService.isCustomerPortal && invoice.status != 'DELETED'"
                >
                    <div class="qt-icon icon__email-send qt-bg-contain qt-sz-20 qt-mr-12"></div>
                    Resend
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="resendInvoices(true)"
                    *ngIf="!customerPortalStateService.isCustomerPortal && invoice.status != 'DELETED'"
                >
                    <div class="qt-icon icon__resend qt-bg-contain qt-sz-20 qt-mr-12"></div>
                    Resend with PDF
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    *ngIf="!invoice.readedAt && !customerPortalStateService.isCustomerPortal && invoice.status != 'DELETED'"
                    (click)="markAsRead()"
                >
                    <div class="qt-icon icon__show qt-bg-contain qt-sz-20 qt-mr-12"></div>
                    Mark as Read
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="exportAsPDF()"
                >
                    <div class="qt-icon icon__download qt-bg-contain qt-sz-20 qt-mr-12"></div>
                    Export as PDF
                </li>
              <li
                    class="pointer"
                    ngbDropdownItem
                    *ngIf="invoice.paidOn && !customerPortalStateService.isCustomerPortal && getPermissions('ROLLBACK_INVOICE') && invoice.status != 'DELETED'"
                    (click)="refundPayments()"
                >
                    <div class="qt-icon icon__return-money qt-sz-20 qt-mr-12"></div>
                    Refund Payments
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    *ngIf="!invoice.paidOn && !customerPortalStateService.isCustomerPortal && getPermissions('ROLLBACK_INVOICE') && invoice.status != 'DELETED'"
                    (click)="rollbackInvoice()"
                >
                    <div class="qt-icon icon__subscription qt-bg-contain qt-sz-20 qt-mr-12"></div>
                    Rollback
                </li> 
                <li
                    ngbDropdownItem
                    class="payment-menu-item"
                    *ngIf="!customerPortalStateService.isCustomerPortal && invoice.status != 'DELETED'"
                >
                    <div class="qt-icon icon__updates qt-bg-contain qt-sz-20 qt-mr-12"></div>
                    Payment history
                    <div class="dropdown-submenu-wrapper payment-info-submenu">
                        <div class="payment-info">
                            <ng-template
                                ngFor
                                let-payment
                                [ngForOf]="allPayments"
                            >
                                <div class="qt-df qt-ai-c payment-info__cheque qt-mb-16">
                                    <div
                                        class="payment-info__data"
                                        [textContent]="payment.createdAt"
                                    >
                                    </div>
                                    <div
                                        class="payment-info__payment"
                                        [textContent]="parsePaymentMethod(payment.paymentMethod)"
                                    >
                                    </div>
                                    <div
                                        class="payment-info__amount"
                                        [textContent]="(payment.partialPaidAmount || paymentSum) | currency"
                                    >
                                    </div>
                                </div>
                            </ng-template>
                            <div class="payment-info__total">
                                <span>Total payment:</span>
                                <span
                                    class="payment-info__total-price"
                                    [textContent]="(allPaymentsSum || invoice.payment && invoice.payment.totalSum || invoice.sum) | currency"
                                ></span>
                            </div>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</div>
