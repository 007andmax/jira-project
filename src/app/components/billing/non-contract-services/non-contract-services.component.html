<div class="qt-page-list default-services-page">
    <div class="qt-page-list__header --sticky">
        <div class="qt-page-list__header-title-line">
            <div class="qt-page-list__header-title-line--left">
                <h6 class="qt-page-list__header-title">Non-contract Services</h6>
            </div>
            <div class="qt-page-list__header-title-line--rigth">
                <button
                    class="qt-button --gray --md"
                    (click)="onShowAddAside()"
                    *ngIf="getPermissions('MANAGE_SERVICES')"
                >
                    Create Service
                </button>
            </div>
        </div>
        <div class="qt-page-list__header-thead-container">
            <div class="qt-table-modern qt-page-list__header-thead">
                <div class="qt-table-modern qt-page-list__header-thead">
                    <div class="qt-page-list__header-thead__row">
                        <div
                            class="default-service-table__service-name pointer"
                            (click)="onFilter('name')"
                        >
                            Service Name
                            <span class="qt-table-modern__sorting"></span>
                        </div>
                        <div
                            class="default-service-table__rate pointer"
                            (click)="onFilter('rate')"
                        >
                            Hourly Rate($)
                            <span class="qt-table-modern__sorting"></span>
                        </div>
                        <div
                            class="default-service-table__taxes pointer"
                            (click)="onFilter('taxes')"
                        >
                            Taxes
                            <span class="qt-table-modern__sorting"></span>
                        </div>
                        <div class="default-service-table__gl">
                            GL Number
                            <ng-template
                                #tipContent
                                class="tooltip"
                            >
                                General ledger Number
                                <br>
                                are numerals you assign
                                <br>
                                to different debit or
                                <br>
                                credit entries to make
                                <br>
                                accounting easier and
                                <br>
                                more functional.
                            </ng-template>
                            <span
                                class="icon__help default-services-page__question-icon qt-sz-12 qt-ic-c"
                                placement="top"
                                [ngbTooltip]="tipContent"
                                container="body"
                            ></span>
                            <span class="qt-table-modern__sorting"></span>
                        </div>
                        <div class="default-service-table__billable">Make Billable</div>
                        <div class="default-service-table__default">Set as Default</div>
                        <div class="default-service-table__menu"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="qt-page-list__body">
        <div class="qt-page-list__body-table-container --height-unset services-list">
            <div class="qt-page-list__body-tbody  qt-table-modern default-service-table">
                <div class="tbody">
                    <ng-template
                        ngFor
                        let-item
                        [ngForOf]="list"
                        [ngForTrackBy]="trackById"
                    >
                        <app-non-contract-services-item
                            [service]="item"
                            (onEditService)="onEditService($event)"
                        ></app-non-contract-services-item>
                    </ng-template>
                </div>
            </div>
            <div
                class="no-exist-elements"
                *ngIf="!showPreloader && list.length == 0"
            >
                We couldn't find any results
            </div>
            <div
                class="loading"
                *ngIf="showPreloader"
            ></div>
        </div>
    </div>
    <div class="qt-page-list__body">
        <div
            class="qt-page-list__body-table-container --height-unset --visible"
            *ngIf="!showPreloader"
        >
            <div class="qt-page-list__body-tbody  qt-table-modern default-service-table">
                <div class="qt-table-modern qt-page-list__header-thead">
                    <div class="qt-page-list__header-thead__row">
                        <div class="default-service-table__contracts  qt-fw-600">Contracts</div>
                        <div class="default-service-table__rate"></div>
                        <div class="default-service-table__taxes"></div>
                        <div class="default-service-table__gl"></div>
                        <div class="default-service-table__billable"></div>
                        <div class="default-service-table__default"></div>
                        <div class="default-service-table__menu"></div>
                    </div>
                </div>
                <div class="tbody">
                    <app-non-contract-services-contracts [type]="'BLOCK_TIME'"></app-non-contract-services-contracts>
                    <app-non-contract-services-contracts [type]="'USER_DEVICE'"></app-non-contract-services-contracts>
                </div>
            </div>
        </div>
    </div>
</div>
