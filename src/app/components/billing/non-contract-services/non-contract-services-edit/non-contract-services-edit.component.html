<div
    class="qt-aside-modern default-services-page__aside"
    *ngIf="open"
>
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-title">Edit Service</div>
        <div
            class="qt-aside-modern__header-close icon__close"
            (click)="close()"
        ></div>
    </div>
    <div class="qt-aside-modern__content">
        <div class="qt-inputs-row qt-mb-16">
            <div
                class="qt-input-block"
                [ngClass]="{'--input-error':!validate.getName()}"
            >
                <div class="qt-input-block__label">Service Name</div>
                <input
                    [value]="'Checks & System Maintenance'"
                    placeholder="Service Name"
                    [(ngModel)]="service.name"
                    type="text"
                    (input)="onChangeName()"
                >
                <app-mat-error
                    class="invalid-feedback --pos-static"
                    *ngIf="!validate.getName()"
                >
                    Service name is required
                </app-mat-error>
            </div>
        </div>
        <div class="qt-inputs-row">
            <div class="qt-input-block qt-w50">
                <div
                    class="qt-input-block"
                    [ngClass]="{'--input-error':!validate.getRate()}"
                >
                    <div class="qt-input-block__label">Hourly Rate($)</div>
                    <input
                        number
                        [money]="true"
                        [ngModel]="service.rate_str"
                        (change)="onChangeRate($event)"
                        appToFixed
                    >
                    <app-mat-error
                        class="invalid-feedback"
                        *ngIf="!validate.getRate()"
                    >
                        Hour rate is required
                    </app-mat-error>
                </div>
            </div>
            <div class="qt-input-block qt-w50">
                <div class="create-product-taxes-select">
                    <app-taxes
                        #taxSelect
                        [selectedTax]="service.taxes"
                        (taxesChange)="onTaxesChange($event)"
                    ></app-taxes>
                </div>
            </div>
        </div>
        <div class="qt-df">
            <div class="qt-w100 qt-mb-16">
                <div class="qt-input-block">
                    <label>GL Number</label>
                    <gl-numbers-drop-down
                        [class]="['light-dropdown', 'new-product-gl-select', 'qt-select-input-40']"
                        [list]="glNumbers"
                        #glNumberSelect
                        [placeholder]="'Select GL'"
                        [container]="'body'"
                        [editItem]="service.glNumber"
                        [add]="true"
                        [search]="true"
                        [change]="true"
                        [field]="'glNumber'"
                        [reducerItem]="glDropDownItemName"
                        (onAddItem)="onAddGlNumber($event)"
                        (onSelectedItem)="onSelectGlNumbers($event)"
                    ></gl-numbers-drop-down>
                </div>
            </div>
        </div>
        <div class="qt-inputs-row">
            <label
                class="qt-checkbox receive-full-amount-check qt-mb-0 pointer"
                for="email-payment"
            >
                <input
                    id="email-payment"
                    type="checkbox"
                    [(ngModel)]="service.billable"
                >
                <span></span>
                <div class="qt-ml-8 qt-fw-400 qt-lh-1">Make this service billable</div>
            </label>
        </div>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="qt-df qt-w100">
            <button
                class="qt-button --gray qt-mr-12 qt-w100 qt-jc-c"
                (click)="close()"
            >
                Cancel
            </button>
            <button
                class="qt-button qt-w100 qt-jc-c"
                (click)="save()"
            >
                Edit Service
            </button>
        </div>
    </div>
</div>
