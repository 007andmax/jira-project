<div
    [hidden]="!showAdd"
    class="qt-aside-modern"
>
    <form
        class="qt-h100"
        [formGroup]="modelForm"
    >
        <div class="qt-aside-modern__header">
            <div class="qt-aside-modern__header-info qt-df qt-ai-c">
                <div class="qt-aside__title">Add Card</div>
            </div>
            <div>
                <div
                    class="qt-aside__close-modal"
                    (click)="closed()"
                >
                    <div class="qt-icon icon__close qt-sz-20"></div>
                </div>
            </div>
        </div>
        <div class="qt-aside-modern__content">
            <div class="qt-inputs-row --required">
                <div class="qt-input-block">
                    <label
                        for="add-ticket-subject"
                        class="qt-input-block__label"
                    >
                        Card Number
                    </label>
                    <input
                        [ngClass]="{'--input-error' : submitted && f2.cardNumber.errors}"
                        id="add-ticket-subject"
                        placeholder="1234 1234 1234 1234"
                        class="qt-input-block__input"
                        formControlName="cardNumber"
                        maxlength="20"
                    >
                    <app-mat-error
                        class="invalid-feedback"
                        *ngIf="submitted && f2.cardNumber.errors"
                    >
                        Card Number is required
                    </app-mat-error>
                </div>
            </div>
            <div class="qt-inputs-row">
                <div class="qt-input-block qt-f50">
                    <label
                        for="add-ticket-subject"
                        class="qt-input-block__label"
                    >
                        Expiration Date
                    </label>
                    <input
                        [ngClass]="{'--input-error' : submitted && f2.expiryDate.errors}"
                        id="add-ticket-subject"
                        class="qt-input-block__input"
                        formControlName="expiryDate"
                        placeholder="YYMM"
                        maxlength="4"
                    >
                    <app-mat-error
                        class="invalid-feedback"
                        *ngIf="submitted && f2.expiryDate.errors"
                    >
                        Expiration Date is required
                    </app-mat-error>
                </div>
                <div class="qt-input-block qt-f50">
                    <label
                        for="add-ticket-subject"
                        class="qt-input-block__label"
                    >
                        Security Code
                    </label>
                    <input
                        [ngClass]="{'--input-error' : submitted && f2.cvd.errors}"
                        id="add-ticket-subject"
                        class="qt-input-block__input"
                        formControlName="cvd"
                        placeholder="CVC"
                    >
                    <app-mat-error
                        class="invalid-feedback"
                        *ngIf="submitted && f2.cvd.errors"
                    >
                        Security Code is required
                    </app-mat-error>
                </div>
            </div>
            <div class="qt-inputs-row --required">
                <div class="qt-input-block">
                    <label
                        for="add-ticket-subject"
                        class="qt-input-block__label"
                    >
                        Address
                    </label>
                    <input
                        id="add-ticket-subject"
                        class="qt-input-block__input"
                        formControlName="address"
                        placeholder="Enter address"
                        maxlength="50"
                    >
                </div>
            </div>
            <div class="qt-inputs-row">
                <div class="qt-input-block qt-f50">
                    <label
                        for="add-ticket-subject"
                        class="qt-input-block__label"
                    >
                        Street Number
                    </label>
                    <input
                        [ngClass]="{'--input-error' : submitted && f2.streetnumber.errors}"
                        id="add-ticket-subject"
                        class="qt-input-block__input"
                        formControlName="streetnumber"
                        placeholder="Enter Street Number"
                        maxlength="19"
                    >
                    <app-mat-error
                        class="invalid-feedback"
                        *ngIf="submitted && f2.streetnumber.errors"
                    >
                        Street Number is required
                    </app-mat-error>
                </div>
                <div class="qt-input-block qt-f50">
                    <label
                        for="add-ticket-subject"
                        class="qt-input-block__label"
                    >
                        Street Name
                    </label>
                    <input
                        [ngClass]="{'--input-error' : submitted && f2.streetname.errors}"
                        id="add-ticket-subject"
                        class="qt-input-block__input"
                        formControlName="streetname"
                        placeholder="Enter Street Name"
                        maxlength="19"
                    >
                    <app-mat-error
                        class="invalid-feedback"
                        *ngIf="submitted && f2.streetname.errors"
                    >
                        Street Name is required
                    </app-mat-error>
                </div>
            </div>
            <div class="qt-inputs-row --required">
                <div class="qt-input-block">
                    <company-drop-down
                        #companyDP
                        [placeholder]="'Enter Company Name'"
                        [validate]="!(submitted && f2.companyId.errors)"
                        [errorMessage]="'The company name is required'"
                        [title]="'Company'"
                        [field]="'name'"
                        [search]="true"
                        [change]="true"
                        [isBlockClear]="true"
                        (onSelectedItem)="onSelectCompany($event)"
                    >
                    </company-drop-down>
                </div>
            </div>
            <div class="qt-inputs-row">
                <div class="qt-input-block qt-f50">
                     <label
                        for="add-ticket-subject"
                        class="qt-input-block__label"
                    >
                        Country or region
                    </label>
                    <input
                         id="add-ticket-subject"
                        class="qt-input-block__input"
                        formControlName="country"
                        placeholder="Enter Country or region"
                        maxlength="50"
                    >
                </div>
                <div class="qt-input-block qt-f50">
                     <label
                        for="add-ticket-subject"
                        class="qt-input-block__label"
                    >
                        Province/State
                    </label>
                    <input
                         id="add-ticket-subject"
                        class="qt-input-block__input"
                        formControlName="state"
                        placeholder="Enter Province/State"
                        maxlength="50"
                    >
                </div>
            </div>
            <div class="qt-inputs-row">
                <div class="qt-input-block qt-f50">
                    <label
                        for="add-ticket-subject"
                        class="qt-input-block__label"
                    >
                        City
                    </label>
                    <input
                        id="add-ticket-subject"
                        class="qt-input-block__input"
                        formControlName="city"
                        placeholder="City Name"
                        maxlength="50"
                    >
                </div>
                <div class="qt-input-block qt-f50">
                    <label
                        for="add-ticket-subject"
                        class="qt-input-block__label"
                    >
                        Postal Code
                    </label>
                    <input
                        [ngClass]="{'--input-error' : submitted && f2.zipcode.errors}"
                        id="add-ticket-subject"
                        class="qt-input-block__input"
                        formControlName="zipcode"
                        placeholder="Postal Code"
                        maxlength="9"
                    >
                    <app-mat-error
                        class="invalid-feedback"
                        *ngIf="submitted && f2.zipcode.errors"
                    >
                        Postal Code is required
                    </app-mat-error>
                </div>
            </div>
            <!-- <div class="qt-inputs-row">
                <label
                    class="qt-checkbox"
                    for="email-payment"
                >
                    <input
                        id="email-payment"
                        type="checkbox"
                    >
                    <span></span>
                    <div class="qt-ml-8 qt-fw-400 qt-lh-1">Set as Primary card</div>
                </label>
            </div> -->
        </div>
        <div class="qt-aside-modern__footer">
            <div class="qt-df qt-w100">
                <button
                    class="qt-button --gray qt-mr-12 qt-w100 qt-jc-c"
                    (click)="closed()"
                >
                    Cancel
                </button>
                <button
                    class="qt-button qt-w100 qt-jc-c"
                    appDisabledBtn
                    #addBtn="disabled"
                    (onClick)="add()"
                    [ngClass]="{'--loading':addBtn.isBlock()}"
                >
                    <span *ngIf="!addBtn.isBlock()">Save</span>
                    <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
                </button>
            </div>
        </div>
    </form>
</div>
