<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line">
        <div class="qt-page-list__header-title-line--left">
            <h6
                class="qt-page-list__header-title"
                [textContent]="'Quotes'"
            ></h6>
        </div>
        <div class="qt-page-list__header-title-line--right">
            <div class="qt-df qt-ai-c">
                <button
                    class="qt-button --gray --md qt-ml-8"
                    (click)="clearAll()"
                    *ngIf="countFilter > 0"
                >
                    Clear All
                </button>
                <div
                    class="company-devices-page__list-header-buttons"
                    *ngIf="getSelectedCount() > 0"
                >
                    <div [textContent]="getSelectedCount() + ' Quotes Selected'"></div>
                    <div
                        class="qt-ml-20 qt-fw-500 qt-df qt-ai-c qt-color-info qt-ai-c qt-pointer"
                        (click)="delete()"
                    >
                        <div class="qt-icon icon__delete qt-icon__red-600 qt-sz-16 qt-ic-c qt-mr-6"></div>
                        <div class="qt-lh-1 qt-color-red-600">Archive Quote</div>
                    </div>
                </div>
                <button
                    class="qt-button qt-button-filter --gray --md qt-ml-8"
                      [ngClass]="{'active':!toggleFilter}"
                    (click)="onToggleFilters(!toggleFilter)"
                >
                    <span class="qt-icon icon__filter qt-sz-16 qt-bg-contain qt-dib qt-mr-8"></span>
                    <span [textContent]="getTextCountFilters()"></span>
                </button>
                <button
                    class="qt-button --gray --md qt-ml-8"
                    (click)="onShowCreateQuote()"
                    *ngIf="!customerPortalStateService.isCustomerPortal"
                >
                    Create Quotation
                </button>
            </div>
        </div>
    </div>
</div>
