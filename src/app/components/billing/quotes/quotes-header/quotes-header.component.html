<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line">
        <div class="qt-page-list__header-title-line--left">
            <h6
                class="qt-page-list__header-title"
                [textContent]="'Quotes'"
            ></h6>
        </div>
        <div class="qt-page-list__header-title-line--right">
            <div class="qt-df qt-ai-c">
                <button
                    class="qt-button --gray --md qt-ml-8"
                    (click)="clearAll()"
                    *ngIf="countFilter > 0"
                >
                    Clear All
                </button>
                <div
                    class="company-devices-page__list-header-buttons"
                    *ngIf="getSelectedCount() > 0"
                >
                    <div [textContent]="getSelectedCount() + ' Quotes Selected'"></div>
                    <div
                        class="qt-ml-20 qt-fw-500 qt-df qt-ai-c qt-color-info qt-ai-c qt-pointer"
                        (click)="delete()"
                    >
                        <div class="qt-icon icon__delete qt-icon__red-600 qt-sz-16 qt-ic-c qt-mr-6"></div>
                        <div class="qt-lh-1 qt-color-red-600">Archive Quote</div>
                    </div>
                </div>
                <button
                    class="qt-button qt-button-filter --gray --md qt-ml-8"
                    [ngClass]="{'active':!toggleFilter}"
                    (click)="toggleFilter  = !toggleFilter"
                >
                    <span class="qt-icon icon__filter qt-sz-16 qt-bg-contain qt-dib qt-mr-8"></span>
                    <span [textContent]="getTextCountFilters()"></span>
                </button>
                <button
                    class="qt-button --gray --md qt-ml-8"
                    (click)="onShowCreateQuote()"
                    *ngIf="!customerPortalStateService.isCustomerPortal"
                >
                    Create Quotation
                </button>
            </div>
        </div>
    </div>
    <div class="qt-page-list__header-filters">
        <app-quotes-filter
            class="qt-w100"
            #filter
            (changeCountFilter)="onChangeCountFilter($event)"
            [hidden]="toggleFilter"
        ></app-quotes-filter>
    </div>
    <div class="qt-page-list__header-thead-container">
        <div class="qt-table-modern qt-page-list__header-thead">
            <div class="qt-table-modern qt-page-list__header-thead">
                <div class="qt-page-list__header-thead__row">
                    <div class="quotes-table__check">
                        <div class="qt-df">
                            <label
                                class="qt-checkbox"
                                for="all-quotes"
                            >
                                <input
                                    id="all-quotes"
                                    [(ngModel)]="selectAll"
                                    (change)="toggleAllQuotes($event)"
                                    type="checkbox"
                                >
                                <span></span>
                            </label>
                        </div>
                    </div>
                    <div
                        class="quotes-table__date pointer"
                        (click)="sortByItems('date')"
                    >
                        Date
                        <span class="qt-table-modern__sorting"></span>
                           <div *ngIf="sortBy.sortBy == 'date'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div
                        class="quotes-table__number"
                        (click)="sortByItems('number')"
                    >
                        Quote#
                          <span class="qt-table-modern__sorting"></span>
                           <div *ngIf="sortBy.sortBy == 'number'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div
                        class="quotes-table__company pointer"
                        (click)="sortByItems('customerName')"
                    >
                        Company
                        <span class="qt-table-modern__sorting"></span>
                         <div *ngIf="sortBy.sortBy == 'customerName'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div class="quotes-table__description pointer">
                        Description
                    </div>
                    <div class="quotes-table__recipients">Recipients</div>
                    <div class="quotes-table__create-by">Created By</div>
                    <div class="quotes-table__status">Status</div>
                    <div
                        class="quotes-table__valid pointer"
                        (click)="sortByItems('validUntil')"
                    >
                        Valid Until
                        <span class="qt-table-modern__sorting"></span>
                         <div *ngIf="sortBy.sortBy == 'validUntil'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div
                        class="quotes-table__total pointer"
                        (click)="sortByItems('amount')"
                    >
                        Amount
                        <span class="qt-table-modern__sorting"></span>
                         <div *ngIf="sortBy.sortBy == 'amount'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div class="quotes-table__menu"></div>
                </div>
            </div>
        </div>
    </div>
</div>
