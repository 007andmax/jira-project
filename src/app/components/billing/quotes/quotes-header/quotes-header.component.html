<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line">
        <div class="qt-page-list__header-title-line--left">
            <h6
                class="qt-page-list__header-title"
                [textContent]="'Quotes'"
            ></h6>
        </div>
        <div class="qt-page-list__header-title-line--rigth">
            <div class="qt-df qt-ai-c">
                <button
                    class="qt-btn --transparent"
                    (click)="clearAll()"
                    *ngIf="countFilter > 0"
                >
                    Clear All
                </button>
                <div
                    class="company-devices-page__list-header-buttons"
                    *ngIf="getSelectedCount() > 0"
                >
                    <div [textContent]="getSelectedCount() + ' Users Selected'"></div>
                    <div
                        class="qt-ml-20 qt-fw-500 qt-df qt-ai-c qt-color-info qt-ai-c qt-pointer"
                        (click)="delete()"
                    >
                        <div class="icon__archive-blue qt-sz-16 qt-ic-c qt-mr-6"></div>
                        <div class="qt-lh-1">Archive User</div>
                    </div>
                </div>
                <button
                    class="qt-btn btn-filter qt-ml-8"
                    [ngClass]="{'active':!toggleFilter}"
                    (click)="toggleFilter  = !toggleFilter"
                >
                    <span
                        class="filter-counter qt-circle qt-sz-18 qt-fw-600 qt-fs-10 qt-color-white qt-bg-info qt-mr-8 qt-df qt-ai-c qt-jc-c"
                        *ngIf="countFilter > 0"
                        [textContent]="countFilter"
                    ></span>
                    Filters
                </button>
                <button
                    class="qt-btn --outline-blue qt-ml-8"
                    (click)="onShowCreateQuote()"
                    *ngIf="!customerPortalStateService.isCustomerPortal"
                >
                    Create Quotation
                </button>
            </div>
        </div>
    </div>
    <div class="qt-page-list__header-filters">
        <app-quotes-filter
            class="qt-w100"
            #filter
            (changeCountFilter)="onChangeCountFilter($event)"
            [hidden]="toggleFilter"
        ></app-quotes-filter>
    </div>
    <div class="qt-page-list__header-thead-container">
        <table class="qt-table-modern qt-page-list__header-thead">
            <thead>
                <tr>
                    <th class="quotes-table__check">
                        <div class="qt-df">
                            <label
                                class="qt-checkbox"
                                for="all-quotes"
                            >
                                <input
                                    id="all-quotes"
                                    [(ngModel)]="selectAll"
                                    (change)="toggleAllQuotes($event)"
                                    type="checkbox"
                                >
                                <span></span>
                            </label>
                        </div>
                    </th>
                    <th
                        class="quotes-table__date pointer"
                        (click)="sortBy('date')"
                    >
                        Date
                        <span class="qt-table-modern__sorting"></span>
                    </th>
                    <th
                        class="quotes-table__number"
                        (click)="sortBy('number')"
                    >
                        Quote#
                    </th>
                    <th
                        class="quotes-table__company pointer"
                        (click)="sortBy('customerName')"
                    >
                        Company
                        <span class="qt-table-modern__sorting"></span>
                    </th>
                    <th class="quotes-table__description pointer">
                        Description
                        <span class="qt-table-modern__sorting"></span>
                    </th>
                    <th class="quotes-table__recipients">Recipients</th>
                    <th class="quotes-table__create-by">Created By</th>
                    <th class="quotes-table__status">Status</th>
                    <th
                        class="quotes-table__valid pointer"
                        (click)="sortBy('validUntil')"
                    >
                        Valid Until
                        <span class="qt-table-modern__sorting"></span>
                    </th>
                    <th
                        class="quotes-table__total pointer"
                        (click)="sortBy('amount')"
                    >
                        Amount
                        <span class="qt-table-modern__sorting"></span>
                    </th>
                    <th class="quotes-table__menu"></th>
                </tr>
            </thead>
        </table>
    </div>
</div>
