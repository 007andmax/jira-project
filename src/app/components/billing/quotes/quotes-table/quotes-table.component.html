  <app-quotes-header
        #header
        [quotes]="quotes"
        [selectAll]="selectAll"
    ></app-quotes-header>
 <div class="qt-page-list users-page qt-df">
    <div class="qt-page-list__body qt-pl-32"   [ngClass]="{'qt-pr-32':!toggleFilter,
        '--open-filters':toggleFilter}">
         <div class="qt-page-list__container">
    <div class="qt-page-list__body">
          <div class="qt-page-list__header-thead-container">
        <div class="qt-table-modern qt-page-list__header-thead">
            <div class="qt-table-modern qt-page-list__header-thead">
                <div class="qt-page-list__header-thead__row">
                    <div class="quotes-table__check">
                        <div class="qt-df">
                            <label
                                class="qt-checkbox"
                                for="all-quotes"
                            >
                                <input
                                    id="all-quotes"
                                    [(ngModel)]="selectAll"
                                    (change)="toggleAllQuotes($event)"
                                    type="checkbox"
                                >
                                <span></span>
                            </label>
                        </div>
                    </div>
                    <div
                        class="quotes-table__date pointer"
                        (click)="sortByItems('date')"
                    >
                        Date
                        <span class="qt-table-modern__sorting"></span>
                           <div *ngIf="sortBy.sortBy == 'date'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div
                        class="quotes-table__number pointer"
                        (click)="sortByItems('number')"
                    >
                        Quote#
                          <span class="qt-table-modern__sorting"></span>
                           <div *ngIf="sortBy.sortBy == 'number'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div
                        class="quotes-table__company pointer"
                        (click)="sortByItems('customerName')"
                    >
                        Company
                        <span class="qt-table-modern__sorting"></span>
                         <div *ngIf="sortBy.sortBy == 'customerName'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div class="quotes-table__description pointer">
                        Description
                    </div>
                    <div class="quotes-table__recipients">Recipients</div>
                    <div class="quotes-table__create-by">Created By</div>
                    <div class="quotes-table__status">Status</div>
                    <div
                        class="quotes-table__valid pointer"
                        (click)="sortByItems('validUntil')"
                    >
                        Valid Until
                        <span class="qt-table-modern__sorting"></span>
                         <div *ngIf="sortBy.sortBy == 'validUntil'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div
                        class="quotes-table__total pointer"
                        (click)="sortByItems('amount')"
                    >
                        Amount
                        <span class="qt-table-modern__sorting"></span>
                         <div *ngIf="sortBy.sortBy == 'amount'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div class="quotes-table__menu"></div>
                </div>
            </div>
        </div>
    </div>
        <div
            class="qt-page-list__body-table-container"
            *ngIf="!showPreloader"
        >
            <div class="qt-page-list__body-tbody qt-table-modern quotes-table">
                <div class="tbody"
                    infiniteScroll
                    [infiniteScrollContainer]="container"
                    [infiniteScrollDistance]="2"
                    [infiniteScrollThrottle]="50"
                    [infiniteScrollDisabled]="infiniteScrollDisabled"
                    (scrolled)="onScroll()"
                >
                    <ng-template
                        ngFor
                        let-quote
                        [ngForOf]="quotes"
                        [ngForTrackBy]="trackById"
                    >
                        <app-quotes-item
                            [quote]="quote"
                            (onResend)="resend($event)"
                            (onConvertToInvoice)="convertToInvoice($event)"
                            (onConvertToTicket)="convertToTicket($event)"
                            (onApproveQuote)="approveQuote($event)"
                            (onMarkAsRead)="markAsRead($event)"
                            (onCancelQuote)="cancelQuote($event)"
                            (onArchiveQuote)="archiveQuote($event)"
                            (onGoToQuoteEdit)="goToQuoteEdit($event)"
                            (onDownloadPdf)="downloadPdf($event)"
                            (onCopy)="copy($event)"
                            (onPreview)="preview($event)"
                            (onTicket)="openTikcet($event)"
                            (onInvoice)="onInvoice($event)"
                            (onConvertToBillable)="onConvertToBillable($event)"
                            (onSelected)="onSelected($event)"
                        ></app-quotes-item>
                    </ng-template>
                </div>
            </div>
            <div
                class="loading"
                *ngIf="showPreloader"
            ></div>
            <div
                class="no-exist-elements"
                *ngIf="!showPreloader && quotes.length == 0"
            >
                We couldn't find any results
            </div>
        </div>
    </div>
</div>
</div>
  <div
            class="aside-filters qt-ml-16"
            [hidden]="!toggleFilter"
        >
            <div class="aside-filters-header qt-df qt-ai-c qt-jc-sb">
                <div class="aside-filters-header__title">Filters</div>
                <div
                    class="qt-button --square-md --gray pointer"
                    (click)="onCloseFilters()"
                >
                    <div class="qt-icon icon__close qt-sz-16 pointer"></div>
                </div>
            </div>
            <div class="aside-filters-content">
                <app-quotes-filter
                (onClose)="onCloseFilters()"
                    class="qt-w100"
                ></app-quotes-filter>
            </div>
        </div>
</div>
