<div class="qt-table-modern__row">
    <div class="quotes-table__check">
        <div
            class="qt-df"
            *ngIf="quote.checkStatus(['UNREAD','SAVED', 'EXPIRED', 'INVOICED', 'TICKETED','CANCELED','BILLED'])"
        >
            <label
                class="qt-checkbox"
                [attr.for]="'quote-' + quote.id"
            >
                <input
                    [attr.id]="'quote-' + quote.id"
                    [(ngModel)]="quote.selected"
                    type="checkbox"
                    (change)="selectQuote($event)"
                >
                <span></span>
            </label>
        </div>
    </div>
    <div
        class="quotes-table__date"
        [textContent]="getDate(quote.date)"
    >
    </div>
    <div
        class="quotes-table__number pointer"
        [textContent]="'#' + quote.number"
        (click)="preview()"
    ></div>
    <div
        class="quotes-table__company"
        [textContent]="quote.company.name"
    ></div>
    <div
        class="quotes-table__description"
        [textContent]="quote.description"
    ></div>
    <div class="quotes-table__recipients ellipsis">
      <div
        class="ellipsis"
        [innerHtml]="quote.parseRecipients()"
      ></div>
    </div>
    <div class="quotes-table__create-by ellipsis">
        <div class="qt-df qt-ai-c qt-w100">
            <div
                class="qt-table-modern__circle-avatar"
                [ngClass]="!usersStateService.getNameForAvatar(createdUser).length ? 'transparent-text' : ''"
                [textContent]="usersStateService.getNameForAvatar(createdUser)"
                [ngStyle]="{'background': ticketsListService.getStyleAvatar(createdUser) }"
            ></div>
            <div
                [textContent]="getUserName(createdUser)"
                class="ellipsis quotes-table__create-by-user-name"
            ></div>
        </div>
    </div>
    <div class="quotes-table__status">
        <span
            class="tag__modern"
            [ngClass]="[getStatusClass(quote.status),(quote.status === 'TICKETED' || quote.status === 'INVOICED' && getPermissions('VIEW_ACCOUNTING')) ? 'pointer' : '']"
            [textContent]="getStatusText(quote.status)"
            (click)="openInvoiceTikcet()"
        >
            <!-- [ngClass]="payment.refundMethod ? '--error' : '--success'" -->
        </span>
    </div>
    <div
        class="quotes-table__valid"
        [textContent]="getDate(quote.validUntil)"
    >
    </div>
    <div
        class="quotes-table__total"
        [textContent]="quote.totalAmount | currency"
    ></div>
    <div
        class="quotes-table__menu"
        ngbDropdown
        [container]="'body'"
    >
        <div
            class="qt-ic-c qt-icon icon__more qt-pointer qt-sz-16 qt-bg-contain"
            id="dropdownBasic1"
            ngbDropdownToggle
        ></div>
        <ul
            class="qt-dropdown-menu invoice-items-dropdown"
            ngbDropdownMenu
            aria-labelledby="dropdownBasic1"
        >
            <li
                class="pointer"
                ngbDropdownItem
                (click)="resend()"
                *ngIf="!customerPortalStateService.isCustomerPortal"
            >
                <div class="qt-icon icon__email-send qt-bg-contain qt-sz-20 qt-mr-12"></div>
                Resend quote
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                (click)="downloadPdf()"
            >
                <div class="qt-icon icon__download-pdf qt-bg-contain qt-sz-20 qt-mr-12"></div>
                Export as PDF
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                (click)="convertToInvoice()"
                *ngIf="quote.checkStatus(['APPROVED']) && !customerPortalStateService.isCustomerPortal"
            >
                <div class="qt-icon icon__billing qt-sz-20 qt-mr-12"></div>
                Convert to Invoice
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                (click)="convertToTicket()"
                *ngIf="quote.checkStatus(['APPROVED']) && !customerPortalStateService.isCustomerPortal"
            >
                <div class="qt-icon icon__ticket qt-sz-20 qt-mr-12"></div>
                Convert to Ticket
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                (click)="approveQuote()"
                *ngIf="quote.checkStatus(['SAVED', 'READ', 'EXPIRED', 'UNREAD'])"
            >
                <div class="qt-icon icon__approve qt-sz-20 qt-mr-12"></div>
                Approve a quote
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                (click)="markAsRead()"
                *ngIf="quote.checkStatus(['UNREAD']) && !customerPortalStateService.isCustomerPortal"
            >
                <div class="qt-icon icon__show qt-bg-contain qt-sz-20 qt-mr-12"></div>
                Mark as Read
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                (click)="cancelQuote()"
                *ngIf="quote.checkStatus(['READ','UNREAD']) && !customerPortalStateService.isCustomerPortal"
            >
                <div class="qt-icon icon__uninstall qt-sz-20 qt-mr-12"></div>
                Cancel quote
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                (click)="archiveQuote()"
                *ngIf="quote.checkStatus(['UNREAD','SAVED', 'EXPIRED', 'INVOICED', 'TICKETED','CANCELED','BILLED'])"
            >
                <div class="qt-icon icon__remove qt-bg-contain qt-sz-20 qt-mr-12"></div>
                Archive a quote
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                (click)="convertToBillable()"
                *ngIf="quote.checkStatus([ 'APPROVED']) && !customerPortalStateService.isCustomerPortal"
            >
                <i class="convert-to-billable qt-bg-contain qt-sz-20 qt-mr-12"></i>
                Convert to billable item
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                (click)="goToQuoteEdit()"
                *ngIf="quote.checkStatus(['READ','UNREAD','SAVED', 'APPROVED', 'CANCELED', 'EXPIRED']) && !customerPortalStateService.isCustomerPortal"
            >
                <i class="qt-icon icon__edit qt-bg-contain qt-sz-20 qt-mr-12"></i>
                Edit a quote
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                (click)="copy()"
                *ngIf="!customerPortalStateService.isCustomerPortal"
            >
                <div class="qt-icon icon__copy qt-bg-contain qt-sz-20 qt-mr-12"></div>
                Copy a quote
            </li>
        </ul>
    </div>
</div>
