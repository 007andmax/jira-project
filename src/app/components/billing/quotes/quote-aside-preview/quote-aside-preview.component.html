<div
    class="invoices-page__aside aside-preview qt-aside-modern --x-large"
    [hidden]="!open"
>
    <div
        class="qt-aside-modern__header"
        *ngIf="!showPreloader"
    >
        <div
            class="qt-aside-modern__header-title"
            [textContent]="'Quote#' + quote.number"
        ></div>
        <div class="qt-df qt-ai-c">
            <div
                class="qt-sz-32 qt-circle qt-bg-white qt-mr-8 header-circle-icon qt-df qt-ai-c qt-jc-c"
                *ngIf="checkStatus(quote, ['READ','UNREAD','SAVED', 'APPROVED', 'CANCELED', 'EXPIRED']) && !customerPortalStateService.isCustomerPortal"
                (click)="editQuote()"
                placement="top"
                container="body"
                ngbTooltip="Edit"
            >
              <div class="qt-icon qt-sz-20 icon__edit"></div>
            </div>
            <div
                class="qt-sz-32 qt-circle qt-bg-white qt-mr-8 header-circle-icon qt-df qt-ai-c qt-jc-c"
                (click)="resend()"
                placement="top"
                container="body"
                ngbTooltip="Send"
                *ngIf="!customerPortalStateService.isCustomerPortal"
            >
              <div class="qt-sz-20 qt-icon icon__email-send"></div>
            </div>
            <div
                class="qt-sz-32 qt-circle qt-bg-white qt-mr-8 header-circle-icon qt-df qt-ai-c qt-jc-c"
                (click)="downloadPdf()"
                placement="top"
                container="body"
                ngbTooltip="Download"
            >
              <div class="qt-sz-20 qt-icon icon__download"></div>
            </div>
            <div
                class="qt-circle qt-bg-white qt-mr-16 header-circle-icon qt-sz-32 qt-df qt-ai-c qt-jc-c pointer"
                *ngIf="checkStatus(quote, ['UNREAD','SAVED', 'EXPIRED', 'INVOICED', 'TICKETED','CANCELED'])"
                (click)="archiveQuote()"
                placement="top"
                container="body"
                ngbTooltip="Archive"
            >
                <div class="qt-sz-20 qt-icon icon__delete"></div>
            </div>
            <div
                class="qt-sz-32 qt-circle qt-bg-white qt-mr-8 header-circle-icon qt-df qt-jc-c qt-ai-c"
                *ngIf="checkStatus(quote, ['APPROVED']) && !customerPortalStateService.isCustomerPortal"
                (click)="convertToInvoice()"
                placement="top"
                container="body"
                ngbTooltip="Convert to Invoice"
            >
              <div class="qt-icon icon__billing qt-sz-20"></div>
            </div>
            <div
                class="qt-sz-32 qt-circle qt-bg-white qt-mr-8 header-circle-icon qt-df qt-ai-c qt-jc-c"
                *ngIf="checkStatus(quote, ['APPROVED']) && !customerPortalStateService.isCustomerPortal"
                (click)="convertToTicket()"
                placement="top"
                container="body"
                ngbTooltip="Convert to Ticket"
            >
              <div class="qt-icon icon__tickets qt-sz-20"></div>
            </div>
            <div
                class="qt-icon icon__close qt-sz-24 qt-pointer qt-ic-c "
                (click)="close()"
            ></div>
        </div>
    </div>
    <div class="qt-aside-modern__content --no-padding --no-footer">
        <div
            class="loading"
            *ngIf="showPreloader"
        ></div>
        <div
            class="qt-pl-30 qt-pr-30 qt-pt-24 qt-pb-50"
            *ngIf="!showPreloader"
        >
            <div
                class="invoice-status-timeline qt-pt-10 qt-pl-16 qt-pr-16 qt-pb-20 qt-mb-24"
                [ngClass]="{'--closed': !toggleStatus}"
            >
                <div class="invoice-status-timeline__header qt-df qt-jc-sb">
                    <div class="qt-fs-13 qt-lh-154 qt-color-gray-900 qt-mb-15 qt-fw-600">Quote Status</div>
                    <div
                        class="qt-ic-c qt-sz-16 toggle-invoice-timeline"
                        (click)="toggleStatus = !toggleStatus"
                    ></div>
                </div>
                <div
                    class="invoice-status-timeline__line"
                    *ngIf="toggleStatus"
                >
                    <div
                        class="invoice-status-timeline__line-point"
                        [ngClass]="{'not-completed-status':!quote.createdAt}"
                    ></div>
                    <div
                        class="invoice-status-timeline__line-point"
                        [ngClass]="{'not-completed-status':!quote.sentAt}"
                    ></div>
                    <div
                        class="invoice-status-timeline__line-point"
                        [ngClass]="{'not-completed-status':!quote.readAt}"
                    ></div>
                    <div
                        class="invoice-status-timeline__line-point"
                        [ngClass]="{'not-completed-status':!quote.approvedAt}"
                    ></div>
                </div>
                <div
                    class="invoice-status-timeline__steps qt-df"
                    *ngIf="toggleStatus"
                >
                    <div class="qt-df qt-ai-c invoice-status-timeline__steps-info">
                        <div class="step-citcle qt-mr-5 qt-df qt-ai-c qt-jc-c">
                          <div class="qt-icon icon__billing qt-sz-20"></div>
                        </div>
                        <div>
                            <div class="qt-fs-12 qt-fw-600 qt-lh-133  qt-color-gray-900 ">Quote Created</div>
                            <div
                                class="qt-fs-11 qt-lh-145 qt-color-gray-600"
                                *ngIf="quote.createdAt"
                                [textContent]="getDate(quote.createdAt)"
                            ></div>
                        </div>
                    </div>
                    <div class="qt-df qt-ai-c invoice-status-timeline__steps-info">
                        <div class="step-citcle qt-mr-5 qt-df qt-ai-c qt-jc-c">
                          <div class="qt-icon icon__email-send qt-sz-20"></div>
                        </div>
                        <div>
                            <div class="qt-fs-12 qt-fw-600 qt-lh-133  qt-color-gray-900 ">Quote sent</div>
                            <div
                                class="qt-fs-11 qt-lh-145 qt-color-gray-600"
                                *ngIf="quote.sentAt"
                                [textContent]="getDate(quote.sentAt)"
                            ></div>
                        </div>
                    </div>
                    <div class="qt-df qt-ai-c invoice-status-timeline__steps-info">
                        <div class="step-citcle qt-mr-5 qt-df qt-ai-c qt-jc-c">
                          <div class="qt-icon icon__show qt-sz-20"></div>
                        </div>
                        <div>
                            <div class="qt-fs-12 qt-fw-600 qt-lh-133  qt-color-gray-900 ">Quote Read</div>
                            <div
                                class="qt-fs-11 qt-lh-145 qt-color-gray-600"
                                *ngIf="quote.readAt"
                                [textContent]="getDate(quote.readAt)"
                            ></div>
                        </div>
                    </div>
                    <div class="qt-df qt-ai-c invoice-status-timeline__steps-info">
                        <div class="step-citcle qt-mr-5 qt-df qt-ai-c qt-jc-c">
                          <div class="qt-icon icon__taxes qt-sz-20"></div>
                        </div>
                        <div>
                            <div class="qt-fs-12 qt-fw-600 qt-lh-133  qt-color-gray-900 ">Quote Approved</div>
                            <div
                                class="qt-fs-11 qt-lh-145 qt-color-gray-600"
                                *ngIf="quote.approvedAt"
                                [textContent]="getDate(quote.approvedAt)"
                            ></div>
                        </div>
                    </div>
                </div>
            </div>
            <div
                class="quote-message-block qt-pt-10 qt-pl-16 qt-pr-16 qt-pb-20 qt-mb-24"
                *ngIf="quote.message || quote.subject || quote.reviewNotes.length > 0"
                [ngClass]="{'--closed': !toggleQuoteMessage}"
            >
                <div class="quote-message-block__header qt-df qt-jc-sb">
                    <div class="qt-fs-13 qt-lh-154 qt-color-gray-900 qt-fw-600 qt-df qt-ai-c">
                        <div class="qt-sz-16 qt-ic-c qt-mr-12 qt-icon icon__email-send"></div>
                        Quote Message
                    </div>
                    <div
                        class="qt-ic-c qt-sz-16 toggle-message-block"
                        (click)="toggleQuoteMessage = !toggleQuoteMessage"
                    ></div>
                </div>
                <span
                    class="qt-ml-29"
                    [textContent]="'Sent to - ' + quote.parseRecipients()"
                ></span>
                <div class="quote-message">
                    <div [textContent]="quote.message"></div>
                </div>
                <div class="quote-message-list">
                    <div class="qt-fs-13 qt-lh-154 qt-color-gray-900 qt-mb-8 qt-fw-600 qt-df qt-ai-c">
                        <div class="qt-sz-16 qt-ic-c qt-mr-12 qt-icon icon__message-response"></div>
                        Response Message
                    </div>
                    <ng-template
                        ngFor
                        let-item
                        [ngForOf]="quote.reviewNotes"
                    >
                        <span
                            class="qt-ml-29"
                            [textContent]="item.getTextSentFrom()"
                        ></span>
                        <div class="quote-message-list-item">
                            <div [textContent]="item.note"></div>
                        </div>
                    </ng-template>
                </div>
            </div>
            <app-quote-aside-preview-body [quote]="quote"></app-quote-aside-preview-body>
        </div>
    </div>
</div>
