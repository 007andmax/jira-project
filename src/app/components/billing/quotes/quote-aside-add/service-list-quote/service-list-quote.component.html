<div
    class="add-service-container service-list-quote"
    ngbDropdown
    placement="bottom-left"
>
    <button
        *ngIf="isDisabled"
        class="qt-button --gray --sm --disabled"
        id="dropdownBasic2"
        placement="top"
        ngbTooltip="Your contacts are expired/terminated. Please recreate them in order to use contract's services or remove them in order to use default services"
    >
        + Add Service
    </button>
    <button
        *ngIf="!isDisabled"
        class="qt-button --gray --sm"
        id="dropdownBasic2"
        ngbDropdownToggle
    >
        + Add Service
    </button>
    <ul
        class="qt-dropdown-menu list-services --open-bot"
        style="max-height: 165px;"
        ngbDropdownMenu
        aria-labelledby="dropdownBasic2"
    >
        <ng-template
            ngFor
            let-item
            [ngForOf]="services"
            let-i="index"
        >
            <li
                class="pointer"
                ngbDropdownItem
                [textContent]="item.name"
                (click)="select(item)"
            ></li>
        </ng-template>
    </ul>
</div>
