<tr>
    <td
        class="new-quote-table__col-item"
        [textContent]="product.item.manufacture"
    >
    </td>
    <td class="new-quote-table__col-desc td-padding-side">
        <pre [textContent]="product.item.description"></pre>
    </td>
    <td class="new-quote-table__col-unit-price with-dollar">
        <input
            class="qt-input-in-table"
            number
            [money]="true"
            [ngModel]="product.item.cost_str"
            (change)="changeCost($event)"
            appToFixed
            placeholder="0.00"
            (blur)="onCheckSaleCost()"
            *ngIf="getPermissions('VIEW_PRODUCT_COST')"
        >
        <input
            class="qt-input-in-table"
            placeholder="0.00"
            disabled
            *ngIf="!getPermissions('VIEW_PRODUCT_COST')"
        >
    </td>
    <td class="new-quote-table__col-markup with-percent">
        <input
            class="qt-input-in-table"
            decimalNumber
            placeholder="0.00"
            [value]="product.markup"
            (onChange)="changeMarkup($event)"
            (blur)="onCheckSaleCost()"
        >
    </td>
    <td class="new-quote-table__col-sales-price with-dollar">
        <input
            class="qt-input-in-table"
            [ngClass]="{'--input-error':!product.validateSaleCost}"
            number
            [money]="true"
            [ngModel]="product.item.sale_str"
            (change)="changeSales($event)"
            appToFixed
            (blur)="onCheckSaleCost()"
        >
        <mat-error
            class="qt-tooltip-error"
            *ngIf="!product.validateSaleCost"
        >
            Product price can not be lower than cost
        </mat-error>
    </td>
    <td class="new-quote-table__col-quantify">
        <input
            class="qt-input-in-table"
            decimalNumber
            [value]="product.quantity"
            (onChange)="product.quantity=$event"
        >
    </td>
    <td
        class="new-quote-table__col-tax"
        [innerHTML]="getSelectedTaxes(product.item.taxes)"
    >
    </td>
    <td
        class="invoice-preview__col-amount"
        [textContent]="getPriceProduct(product) | currency"
    ></td>
    <td>
        <div
            class="icon__raw-clear qt-ic-c qt-sz-16"
            (click)="removeProduct()"
        ></div>
    </td>
</tr>
