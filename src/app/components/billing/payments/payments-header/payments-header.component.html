<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line">
        <div class="qt-page-list__header-title-line--left">
            <h6
                class="qt-page-list__header-title"
                [textContent]="'Payments'"
            ></h6>
        </div>
        <div class="qt-page-list__header-title-line--right">
            <invoice-export
                (onPrint)="print($event)"
                (onEmail)="sendEmail()"
                (onExport)="onSelectExport($event)"
            ></invoice-export>
            <div class="qt-df qt-ai-c">
                <button
                    class="qt-button --gray --md qt-ml-8"
                    (click)="clearAll()"
                    *ngIf="countFilter > 0"
                >
                    Clear All
                </button>
                <button
                    class="qt-button qt-button-filter --gray --md qt-ml-8"
                    [ngClass]="{'active':!toggleFilter}"
                    (click)="toggleFilter  = !toggleFilter"
                >
                    <span class="qt-icon icon__filter qt-sz-16 qt-bg-contain qt-dib qt-mr-8"></span>
                    <span [textContent]="getTextCountFilters()"></span>
                </button>
                <button
                    class="qt-button --gray --md qt-ml-8"
                    (click)="onShowCreatePayment()"
                    *ngIf="getPermissions('VIEW_ACCOUNTING')"
                >
                    Record Payment
                </button>
            </div>
        </div>
    </div>
    <div class="qt-page-list__header-filters">
        <app-payments-filter
            class="qt-w100"
            #filter
            (changeCountFilter)="onChangeCountFilter($event)"
            [hidden]="toggleFilter"
        ></app-payments-filter>
    </div>
    <div class="qt-page-list__header-thead-container">
        <div class="qt-table-modern qt-page-list__header-thead">
            <div class="qt-table-modern qt-page-list__header-thead">
                <div class="qt-page-list__header-thead__row">
                    <div
                        class="billable-payment-table__date pointer"
                        (click)="sortBy('PAYMENT_DATE')"
                    >
                        Date
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div class="billable-payment-table__invoice">Invoice#</div>
                    <div class="billable-payment-table__company">Company</div>
                    <div
                        class="billable-payment-table__payment-mode pointer"
                        (click)="sortBy('PAYMENT_METHOD')"
                    >
                        PaymentMode
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div class="billable-payment-table__reference">Reference#</div>
                    <div class="billable-payment-table__payment">Payment#</div>
                    <div
                        class="billable-payment-table__amount pointer"
                        (click)="sortBy('AMOUNT')"
                    >
                        Amount
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div
                        class="billable-payment-table__status"
                    >
                        Status
                    </div>
                    <div class="billable-payment-table__menu"></div>
                </div>
            </div>
        </div>
    </div>
</div>
