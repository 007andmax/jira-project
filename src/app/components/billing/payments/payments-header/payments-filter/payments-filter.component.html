<div class="left-panel-ng2__content--filters aside-filters-content__main">
    <div class="content-filters-header">
        <div
            class="qt-icon icon__close qt-icon__white qt-sz-20"
            (click)="close()"
        ></div>
        <div class="content-filters-header__title pointer">Filters</div>
    </div>
  <company-drop-down
        class="search-company"
        #companyDp
        [placeholder]="'Select Company'"
        [change]="true"
        [search]="true"
        [class]="['qt-dropdown']"
        [field]="'name'"
        (onSelectedItem)="onSelectCompany($event)"
    ></company-drop-down>
    <app-drop-down
        class="search-company"
        #statusDp
        [placeholder]="'Select Status'"
        [change]="false"
        [class]="['qt-dropdown']"
        [field]="'title'"
        [list]="statusTypes"
        (onSelectedItem)="onSelectStatus($event)"
    ></app-drop-down>
     <app-drop-down
        class="search-company"
        #statusDp
        [placeholder]="'Select Payment Mode'"
        [change]="false"
        [class]="['qt-dropdown']"
        [field]="'title'"
        [list]="paymentModes"
        (onSelectedItem)="onSelectPaymentMode($event)"
    ></app-drop-down>
    <input
        type="text"
        appKeyUpEnter
        (onChange)="onSetNumberInvoice($event)"
        placeholder="Enter Invoice #"
        class="qt-mr-8 qt-input-block__input filter-invoice"
        [(ngModel)]="paymentsFilter.invoiceNumber"
    >
    <app-multi-datepicker
        class="qt-input-block qt-mr-8"
        #datesDp
         [container]="'body'"
        (selectedDate)="filterByDate($event)"
    ></app-multi-datepicker>
    <input
        number
        appKeyUpEnter
        (onChange)="onSetAmountInvoice($event)"
        placeholder="Enter Amount"
        class="qt-input-block__input filter-invoice"
        id="amount-filter"
    >
</div>
<div class="aside-filters-content__footer">
    <div class="qt-df">
        <button
            class="qt-button --md --gray qt-mr-12 qt-w100 qt-jc-c"
            (click)="onClearAll()"
        >
            Clear All
        </button>
        <button
            class="qt-button --md qt-w100 qt-jc-c"
            (click)="applyFilters()"
        >
            Apply
        </button>
    </div>
</div>
