<div class="qt-df qt-ai-c">
    <company-drop-down
        class="search-company invoices-company-filter"
        #companyDp
        [placeholder]="'Select Company'"
        [change]="true"
        [search]="true"
        [class]="['qt-dropdown']"
        [field]="'name'"
        (onSelectedItem)="onSelectCompany($event)"
    ></company-drop-down>
    <app-select-search
        class="search-company invoices-status-filter"
        #statusDp
        [placeholder]="'Select Status'"
        [change]="false"
        [class]="['qt-dropdown']"
        [field]="'title'"
        [list]="statusTypes"
        (onSelectedItem)="onSelectStatus($event)"
    ></app-select-search>
    <input
        type="text"
        appKeyUpEnter
        (onChange)="onSetNumberInvoice($event)"
        placeholder="Enter invoice #"
        class="qt-mr-8 qt-input h36 filter-invoice invoices-number-filter"
        [(ngModel)]="paymentsFilter.invoiceNumber"
    >
    <app-multi-datepicker
        class="qt-input-block invoices-date-filter qt-mr-8"
        #datesDp
        (selectedDate)="filterByDate($event)"
    ></app-multi-datepicker>
    <input
        number
        appKeyUpEnter
        (onChange)="onSetAmountInvoice($event)"
        placeholder="Enter amount"
        class="qt-input h36 filter-invoice invoices-number-filter"
        id="amount-filter"
    >
</div>
