<div class="payments-page payments-page__aside qt-aside-modern --x-large">
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-title">Payment Detail</div>
        <div class="qt-df qt-ai-c">
            <div
                class="qt-sz-32 qt-circle qt-bg-white qt-mr-8 header-circle-icon qt-df qt-ai-c qt-jc-c"
                *ngIf="payment.paymentStatus && payment.paymentStatus == 'PAYMENT_COMPLETED' && !customerPortalStateService.isCustomerPortal"
                (click)="showEdit()"
                placement="top"
                ngbTooltip="Edit payment"
            >
                <div class="qt-icon icon__edit qt-sz-20"></div>
            </div>
            <div
                class="qt-sz-32 qt-circle qt-bg-white qt-mr-8 header-circle-icon qt-df qt-ai-c qt-jc-c"
                *ngIf="payment.paymentMethod != 'DEBIT_CARD' && payment.paymentMethod != 'CREDIT_CARD' && payment.paymentStatus && payment.paymentStatus == 'PAYMENT_COMPLETED' && !customerPortalStateService.isCustomerPortal && getPermissions('ROLLBACK_INVOICE')"
                 (click)="showRefund()"
                placement="top"
                ngbTooltip="Refund payment"
            >
            <!--*ngIf="payment.paymentStatus && payment.paymentStatus == 'PAYMENT_COMPLETED' && !customerPortalStateService.isCustomerPortal && getPermissions('ROLLBACK_INVOICE')"
              -->
                <div class="qt-icon icon__return-money qt-sz-20"></div>
            </div>
            <div
                class="qt-sz-32 qt-circle qt-bg-white qt-mr-8 header-circle-icon qt-df qt-ai-c qt-jc-c"
                (click)="resendPaymentReceipt()"
                placement="top"
                ngbTooltip="Resend payment receipt"
            >
                <div class="qt-icon icon__resend-receipt qt-sz-20"></div>
            </div>
            <div
                class="qt-circle qt-bg-white qt-mr-16 header-circle-icon qt-sz-32 qt-df qt-ai-c qt-jc-c pointer"
                (click)="deletePayment()"
                *ngIf="payment.paymentMethod != 'DEBIT_CARD' && payment.paymentMethod != 'CREDIT_CARD' && !customerPortalStateService.isCustomerPortal"
                placement="top"
                ngbTooltip="Delete payment"
            >
                <div class="qt-sz-20 qt-icon icon__delete"></div>
            </div>
               <div
                class="qt-sz-32 qt-circle qt-bg-white qt-mr-8 header-circle-icon qt-df qt-ai-c qt-jc-c"
                (click)="downloadPDF()"
                placement="top"
                ngbTooltip="Download"
                container="body"
            >
                <div class="qt-sz-20 qt-icon icon__download"></div>
            </div>
            <div
                class="qt-icon icon__close qt-sz-24 qt-pointer qt-ic-c"
                (click)="close()"
                placement="top"
                ngbTooltip="Closed"
            ></div>
        </div>
    </div>
    <div class="qt-aside-modern__content --no-footer">
        <div class="payment-preview qt-pt-40 qt-pl-40 qt-pr-40 qt-pb-40">
            <div
                class="qt-df company-info"
                *ngIf="currentCompany"
            >
                <div class="qt-lh-154">
                    <img
                        class="qt-mb-8"
                        [src]="companiesStateService.getCompanyLogoUrl(currentCompany)"
                    >
                    <div
                        class="qt-fs-13 qt-color-gray-900 qt-fw-600"
                        [textContent]="currentCompany.name"
                    ></div>
                    <div
                        class="qt-fs-13"
                        [textContent]="currentCompany.addresses[0].addressWithSuitNumberAndPostalCode"
                    ></div>
                    <div
                        class="qt-fs-13"
                        *ngIf="currentCompany.addresses[0].phoneNumbers.length > 0"
                    >
                        <preview-phone-mask [number]="currentCompany.addresses[0].phoneNumbers[0].number"></preview-phone-mask>
                    </div>
                </div>
            </div>
            <hr class="qt-divider qt-mt-24 qt-mb-40">
            <div class="qt-df">
                <div class="payments-page__payment-info qt-pr-15">
                    <div>
                        <div class="qt-fw-600 qt-fs-16 qt-lh-133 qt-mb-4 qt-color-gray-900 qt-df qt-ai-c">
                            <div [ngClass]="{'icon__unsubscribe' : payment.paymentStatus == 'PAYMENT_FAILED',
                                'icon__status-green' : payment.paymentStatus != 'PAYMENT_FAILED'
                            }" class="qt-mr-5 qt-ic-c qt-sz-24"></div>
                            {{payment.paymentStatus == 'PAYMENT_FAILED' ? 'Payment Failed' : 'Amount Received'}}
                        </div>
                        <div
                            class="qt-fs-40 qt-fw-600 qt-lh-12 qt-color-gray-900"
                            [textContent]="(payment.partialPaidAmount || payment.totalSum ) | currency"
                        ></div>
                    </div>
                    <div *ngIf="!isExistMultipleCompanies">
                        <div class="qt-fs-10 qt-mt-25 qt-lh-12 qt-fw-600  qt-mb-8 qt-text-upper qt-color-gray-400">Received From</div>
                        <div
                            class="qt-fs-13 qt-fw-600 qt-color-gray-900 qt-lh-154"
                            [textContent]="company.name"
                        ></div>
                        <div
                            class="qt-fs-13 qt-color-dark-light qt-lh-154"
                            *ngIf="company.companyInfo.contacts"
                            [textContent]="company.companyInfo.contacts[0].firstName + ' ' +
              company.companyInfo.contacts[0].lastName"
                        ></div>
                        <div
                            class="qt-fs-13 qt-color-gray-600 qt-lh-154"
                            [textContent]="company.companyInfo.addresses[0].addressWithSuitNumberAndPostalCode"
                        ></div>
                        <div
                            class="qt-fs-13 qt-color-dark-light qt-lh-154"
                            *ngIf="company.companyInfo.contacts"
                            [textContent]="company.companyInfo.contacts[0].primaryEmail"
                        ></div>
                        <div
                            class="qt-fs-13 qt-color-dark-light qt-lh-154"
                            *ngIf="company.companyInfo.contacts && company.companyInfo.contacts[0].phoneNumbers && company.companyInfo.contacts[0].phoneNumbers.length > 0"
                        >
                            <preview-phone-mask [number]="company.companyInfo.contacts[0].phoneNumbers[0].number"></preview-phone-mask>
                        </div>
                    </div>
                </div>
                <div class="qt-pl-40 qt-w100">
                    <div class="payment-info-lines qt-mb-16">
                        <div class="qt-df">
                            <div class="payment-info-lines__title">Payment Date</div>
                            <div
                                class="payment-info-lines__value"
                                [textContent]="getDate(this.payment.createdAt)"
                            ></div>
                        </div>
                        <div class="qt-df">
                            <div class="payment-info-lines__title">Reference Number</div>
                            <div
                                class="payment-info-lines__value"
                                [textContent]="payment.reference"
                            ></div>
                        </div>
                         <div class="qt-df" *ngIf="payment.transactionId">
                            <div class="payment-info-lines__title">Transaction Id</div>
                            <div
                                class="payment-info-lines__value"
                                [textContent]="payment.transactionId"
                            ></div>
                        </div>
                        <div class="qt-df">
                            <div class="payment-info-lines__title">Payment Mode</div>
                            <div
                                class="payment-info-lines__value"
                                [textContent]="parsePaymentMethod(payment.paymentMethod)"
                            ></div>
                        </div>
                    </div>
                    <div class="payment-info__notes">
                        <div class="qt-icon icon__documents qt-mb-5 qt-ic-c qt-sz-16"></div>
                        <div [textContent]="payment.note"></div>
                    </div>
                </div>
            </div>
            <hr class="qt-divider qt-mt-40 qt-mb-16">
            <div class="qt-fs-16 qt-fw-600 qt-color-dark qt-mb-12 qt-lh-163">Payment for</div>
            <table class="payment-table">
                <thead>
                    <tr>
                        <th class="payment-table__number">Invoice Number</th>
                        <th class="payment-table__company">Company Name</th>
                        <th class="payment-table__date">Invoice Date</th>
                        <th class="payment-table__inv-amount">Invoice Amount</th>
                        <th class="payment-table__pay-amount">Payment Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <ng-template
                        ngFor
                        let-item
                        [ngForOf]="payment.paymentData"
                        [ngForTrackBy]="trackById"
                    >
                        <tr>
                            <td
                                class="payment-table__number"
                                [textContent]="item.invoiceNumber"
                            ></td>
                            <td
                                class="payment-table__company"
                                [textContent]="item.companyName"
                            ></td>
                            <td
                                class="payment-table__date"
                                [textContent]="getDate(item.invoiceDate)"
                            ></td>
                            <td
                                class="payment-table__inv-amount"
                                [textContent]="item.invoiceAmount | currency"
                            ></td>
                            <td
                                class="payment-table__pay-amount"
                                [textContent]="item.paidAmount | currency"
                            ></td>
                        </tr>
                    </ng-template>
                </tbody>
            </table>
        </div>
    </div>
</div>
