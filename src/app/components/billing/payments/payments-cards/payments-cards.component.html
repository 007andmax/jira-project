<div
    ngbDropdown
    #dp="ngbDropdown"
    [ngClass]="class"
    [container]="container"
    (openChange)="onOpenChange($event)"
    [ngStyle]="{'width':widthInput ? widthInput : '100%'}"
>
    <div class="qt-pos-rel dropdown-wrap">
      <div
        *ngIf="title"
        class="qt-input-block__label"
        [textContent]="title"
      ></div>
      <div class="qt-color-red-600"  *ngIf="companiesStateService.currentCompany && !integrationsStateService.connected">Set up the 3rd party connection on the <span class="qt-color-info qt-pointer" (click)="goToIntegrationsPage()">Integration page</span></div>
       <div
       *ngIf="selectedItem"
                [ngClass]="{'icon__payment-method-master-card':selectedItem && selectedItem.cardType == 'MASTERCARD',
        'icon__payment-method-visa':selectedItem && selectedItem.cardType == 'VISA'}"
                class="qt-icon__background-unset qt-bg-contain card-item__icon icon-dropdown"
            ></div>
      <input
        [hidden]="companiesStateService.currentCompany && !integrationsStateService.connected"
        type="text"
        [ngStyle]="{'width': '100%', 'height': heightInput ? heightInput : '40px' }"
        [ngClass]="{'disabled': isDisabled, '--input-error' : !validate,'width-icon': selectedItem}"
        [disabled]="isDisabled"
        [value]="getSelectedItemText()"
        autocomplete="off"
        [placeholder]="placeholder"
        id="dropdown1"
        class="qt-dropdown-input"
        [attr.maxlength]="maxlength"
        (input)="onCheckAdd($event)"
        (focus)="onFocus($event)"
        [readonly]="!change"
        ngbDropdownAnchor
      >
      <span
        class="app-drop-down__right-icon pointer"
        *ngIf="list && !isDisabled && companiesStateService.currentCompany && integrationsStateService.connected"
        [ngStyle]="{'bottom': heightInput ? dividePosition(heightInput) : '20px' }"
      >
        <i
          *ngIf="selectedItem && !isAdd && !isBlockClear"
          class="icn-remove-old qt-icon icon__close qt-icon__gray-400 qt-sz-20"
          (click)="clearClient()"
        ></i>
        <i
          *ngIf="(!selectedItem || isBlockClear) && !isAdd && !preloader"
          class="icn-sm qt-icon icon__arrow-down report-caret-icon"
          ngbDropdownToggle
        ></i>
        <i
          *ngIf="isAdd"
          (click)="addItem()"
          class="icn-sm icn-product-save qt-icon icon__done qt-icon__blue-light-600"
        ></i>
    </span>
      <i
        class="loading xs"
        *ngIf="preloader"
      ></i>
      <div
        ngbDropdownMenu
        [ngStyle]="{'width': dropdownWidth ? dropdownWidth : '100%', 'max-height': dropdownHeight ? dropdownHeight : '192px'}"
        aria-labelledby="dropdown1"
        class="app-drop-down__dropdown"
      >
      <div class="no-exist-cards" *ngIf="!showPreloader && (!list || list.length === 0)">
        <div
          class="no-exist-cards__text"
        >
          <div
            class="no-exist-cards__icon-wrap qt-button --square-md --gray"
          >
            <div class="qt-icon icon__credit-cards qt-sz-24"></div>
          </div>
          <div class="no-exist-cards__title qt-mt-16">No Cards saved</div>
          <div class="no-exist-cards__text qt-mt-8">Add a cards here to prefilled for quicker checkout</div>
           <button
                class="qt-button --gray --md qt-ml-8 qt-mt-16"
                (click)="addCard()"
            >
               + Add Card
            </button>
        </div>
      </div>
       <div class="cards-container" *ngIf="!showPreloader && list.length > 0"
          #content
          infiniteScroll
          [infiniteScrollContainer]="content"
          [infiniteScrollDistance]="2"
          [infiniteScrollThrottle]="50"
          [infiniteScrollDisabled]="infiniteScrollDisabled"
          [fromRoot]="true"
          (scrolled)="onScroll()">
            <ng-template
              ngFor
              let-item
              [ngForOf]="list"
              let-i="index"
            >
            <div class="card-item" (click)="onSelect(item)">
               <div
                [ngClass]="{'icon__payment-method-master-card':item.cardType == 'MASTERCARD',
        'icon__payment-method-visa':item.cardType == 'VISA'}"
                class="qt-icon__background-unset card-item__icon qt-bg-contain qt-fs-0"
            ></div>
       <div [ngClass]="{'qt-w100' : item.cardholderName == 'N/A'}" class="card-item__number qt-fs-13 qt-fw-400 qt-color-gray-500" [textContent]="item.maskedCardNumber" ></div>
        <div *ngIf="item.cardholderName != 'N/A'" class="card-item__cardholder_name qt-ml-4 qt-fs-14 qt-fw-500 qt-color-gray-900 qt-w100" [textContent]="item.cardholderName" ></div>
   
     <div
                class="grey-dropdown right with-icons"
                ngbDropdown
                (click)="$event.stopPropagation()"
            >
                <i
                    class="icn-16 qt-bg-contain qt-icon icon__more pointer"
                    id="dropdownBasic1"
                    ngbDropdownToggle
                ></i>
                <div
                    class="qt-dropdown-menu"
                    ngbDropdownMenu
                    aria-labelledby="dropdownBasic1"
                >
                    <li
                        ngbDropdownItem
                         (click)="edit(item)"
                    >
                        <i class="qt-sz-20 qt-mr-12 qt-bg-contain qt-icon icon__edit"></i>
                        Edit
                    </li>
                    <li
                      class="qt-dropdown-menu__item-red qt-dropdown-menu__top-line qt-mt-2"
                      ngbDropdownItem
                      (click)="delete(item)"
                    >
                        <i class="qt-sz-20 qt-mr-12 qt-icon icon__delete qt-icon__red-600"></i>
                       Delete
                    </li>
                </div>
            </div>
            </div>
            </ng-template>
          </div>
           <div
             *ngIf="!showPreloader && list.length > 0"
             class="card-footer">
             <button
               class="qt-button --gray --md qt-ml-8"
               (click)="addCard()"
             >
               + Add Card
             </button>
           </div>
      </div>
    </div>
    <app-mat-error
      class="invalid-feedback"
      *ngIf="!validate"
      [textContent]="errorMessage"
    >
    </app-mat-error>
</div>
