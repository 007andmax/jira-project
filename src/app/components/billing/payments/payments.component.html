<div class="qt-page-list payments-page invoices-page">
    <app-payments-header
        (onCreatePayment)="onCreatePayment()"
        (onSortBy)="sortBy($event)"
    ></app-payments-header>
    <div class="qt-page-list__body">
        <div class="qt-page-list__body-table-container">
            <div class="qt-page-list__body-tbody qt-table-modern billable-table">
                <div
                    class="tbody"
                    infiniteScroll
                    [infiniteScrollContainer]="container"
                    [infiniteScrollDistance]="2"
                    [infiniteScrollThrottle]="50"
                    [infiniteScrollDisabled]="infiniteScrollDisabled"
                    (scrolled)="onScroll()"
                >
                    <ng-template
                        ngFor
                        let-payment
                        [ngForOf]="payments"
                        [ngForTrackBy]="trackById"
                    >
                        <app-payment-item
                            (onRefundPayment)="onRefundPayment($event)"
                            (onEditPayment)="onEditPayment($event)"
                            (onPreviewInvoice)="onPreviewInvoice($event)"
                            (onDetailsPayment)="onDetailsPayment($event)"
                            (onResendPaymentReceipt)="onResendPaymentReceipt($event)"
                            [payment]="payment"
                        ></app-payment-item>
                    </ng-template>
                </div>
            </div>
        </div>
        <div
            class="loading"
            *ngIf="showPreloader"
        ></div>
        <div
            class="no-exist-elements"
            *ngIf="!showPreloader && payments.length == 0"
        >
            We couldn't find any results
        </div>
        <div
            class="loading pengind-loading"
            *ngIf="showPendingPreloader"
        ></div>
    </div>
</div>
<app-refund-payment
    *ngIf="showRefundPayment"
    [payment]="refundPayment"
    (onClose)="showRefundPayment = false"
></app-refund-payment>
<app-payments-aside
    *ngIf="showDetailsPayment"
    [payment]="detailsPayment"
    (onClose)="showDetailsPayment = false"
    (onEditPayment)="onEditPayment($event)"
    (onRefundPayment)="onRefundPayment($event)"
></app-payments-aside>
<app-edit-payment
    *ngIf="showEditPayment"
    [payment]="editPayment"
    (onClose)="showEditPayment = false"
></app-edit-payment>
