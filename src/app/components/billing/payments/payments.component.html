<div class="qt-page-list payments-page invoices-page">
    <app-payments-header
        #header
        (onCreatePayment)="onCreatePayment()"
    ></app-payments-header>
     <div class="qt-page-list users-page qt-df">
    <div class="qt-page-list__body qt-pl-32"   [ngClass]="{'qt-pr-32':!toggleFilter,
        '--open-filters':toggleFilter}">
         <div class="qt-page-list__container">
    <div class="qt-page-list__body">
         <div class="qt-page-list__header-thead-container">
        <div class="qt-table-modern qt-page-list__header-thead">
            <div class="qt-table-modern qt-page-list__header-thead">
                <div class="qt-page-list__header-thead__row">
                    <div
                        class="billable-payment-table__date pointer"
                        (click)="sortItems('PAYMENT_DATE')"
                    >
                        Date
                        <span class="qt-table-modern__sorting"></span>
                           <div *ngIf="sortBy.sortBy == 'PAYMENT_DATE'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div class="billable-payment-table__invoice">Invoice#</div>
                    <div class="billable-payment-table__company">Company</div>
                    <div
                        class="billable-payment-table__payment-mode pointer"
                        (click)="sortItems('PAYMENT_METHOD')"
                    >
                        PaymentMode
                        <span class="qt-table-modern__sorting"></span>
                           <div *ngIf="sortBy.sortBy == 'PAYMENT_METHOD'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div class="billable-payment-table__reference">Reference#</div>
                    <div class="billable-payment-table__payment">Payment#</div>
                    <div
                        class="billable-payment-table__amount pointer"
                        (click)="sortItems('AMOUNT')"
                    >
                        Amount
                        <span class="qt-table-modern__sorting"></span>
                           <div *ngIf="sortBy.sortBy == 'AMOUNT'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                    </div>
                    <div
                        class="billable-payment-table__status"
                    >
                        Status
                    </div>
                    <div class="billable-payment-table__menu"></div>
                </div>
            </div>
        </div>
    </div>
        <div class="qt-page-list__body-table-container">
            <div class="qt-page-list__body-tbody qt-table-modern billable-table">
                <div
                    class="tbody"
                    infiniteScroll
                    [infiniteScrollContainer]="container"
                    [infiniteScrollDistance]="2"
                    [infiniteScrollThrottle]="50"
                    [infiniteScrollDisabled]="infiniteScrollDisabled"
                    (scrolled)="onScroll()"
                >
                    <ng-template
                        ngFor
                        let-payment
                        [ngForOf]="payments"
                        [ngForTrackBy]="trackById"
                    >
                        <app-payment-item
                            (onRefundPayment)="onRefundPayment($event)"
                            (onEditPayment)="onEditPayment($event)"
                            (onPreviewInvoice)="onPreviewInvoice($event)"
                            (onDetailsPayment)="onDetailsPayment($event)"
                            (onResendPaymentReceipt)="onResendPaymentReceipt($event)"
                            [payment]="payment"
                        ></app-payment-item>
                    </ng-template>
                </div>
            </div>
        </div>
        <div
            class="loading"
            *ngIf="showPreloader"
        ></div>
        <div
            class="no-exist-elements"
            *ngIf="!showPreloader && payments.length == 0"
        >
            We couldn't find any results
        </div>
        <div
            class="loading pengind-loading"
            *ngIf="showPendingPreloader"
        ></div>
    </div>
      </div>
        </div>
           <div
            class="aside-filters qt-ml-16"
            [hidden]="!toggleFilter"
        >
            <div class="aside-filters-header qt-df qt-ai-c qt-jc-sb">
                <div class="aside-filters-header__title">Filters</div>
                <div
                    class="qt-button --square-md --gray pointer"
                    (click)="onCloseFilters()"
                >
                    <div class="qt-icon icon__close qt-sz-16 pointer"></div>
                </div>
            </div>
            <div class="aside-filters-content">
                <app-payments-filter
                (onClose)="onCloseFilters()"
                    class="qt-w100"
                ></app-payments-filter>
            </div>
        </div>
        </div>
</div>
<app-refund-payment
    *ngIf="showRefundPayment"
    [payment]="refundPayment"
    (onClose)="showRefundPayment = false"
></app-refund-payment>
<app-payments-aside
    *ngIf="showDetailsPayment"
    [payment]="detailsPayment"
    (onClose)="showDetailsPayment = false"
    (onEditPayment)="onEditPayment($event)"
    (onRefundPayment)="onRefundPayment($event)"
></app-payments-aside>
<app-edit-payment
    *ngIf="showEditPayment"
    [payment]="editPayment"
    (onClose)="showEditPayment = false"
></app-edit-payment>
