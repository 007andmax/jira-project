<div class="qt-table-modern__row">
    <div
        class="billable-payment-table__date pointer"
        [textContent]="getDate()"
    ></div>
    <div class="billable-payment-table__invoice pointer">
        <ng-template
            ngFor
            let-invoice
            [ngForOf]="payment.paymentData"
            [ngForTrackBy]="trackById"
            let-i="index"
        >
            <span
                [textContent]="invoice.invoiceNumber"
                (click)="onShowPreviewInvoice(i)"
            ></span>
        </ng-template>
    </div>
    <div
        class="billable-payment-table__company pointer"
        [textContent]="payment.clientCompanyName"
        (click)="showDetailsPayment()"
    ></div>
    <div
        class="billable-payment-table__payment-mode pointer"
        [textContent]="parsePaymentMethod(payment.paymentMethod)"
        (click)="showDetailsPayment()"
    ></div>
    <div
        class="billable-payment-table__reference pointer"
        [textContent]="payment.reference"
        (click)="showDetailsPayment()"
    ></div>
    <div class="billable-payment-table__payment">
        <ng-template #tipContent>
            <div [textContent]="payment.note"></div>
        </ng-template>
        <div
            class="qt-icon icon__documents qt-sz-24 qt-ic-c qt-mr-8 payments-page__payment-note-table-icon pointer"
            *ngIf="payment.note && payment.note.length > 0"
            placement="left"
            [ngbTooltip]="tipContent"
        ></div>
    </div>
    <div
        class="billable-payment-table__amount pointer"
        [textContent]="(payment.partialPaidAmount || payment.totalSum ) | currency"
        (click)="showDetailsPayment()"
    ></div>
    <div
        class="billable-payment-table__status pointer"
        (click)="showDetailsPayment()"
    >
        <span
            class="tag__modern"
            [ngClass]="payment.refundMethod ? '--error' : '--success'"
            [textContent]="payment.refundMethod ? 'Refund' : 'Paid'"
        >
        </span>
    </div>
    <div
        class="billable-payment-table__menu"
        ngbDropdown
        [container]="'body'"
    >
        <div
            class="qt-ic-c qt-icon icon__more  qt-pointer qt-sz-16 qt-bg-contain"
            id="dropdownBasic1"
            ngbDropdownToggle
        ></div>
        <ul
            class="qt-dropdown-menu invoice-items-dropdown"
            ngbDropdownMenu
            aria-labelledby="dropdownBasic1"
        >
            <li
                class="pointer"
                ngbDropdownItem
                (click)="showEditPayment()"
                *ngIf="!payment.refundMethod && !customerPortalStateService.isCustomerPortal"
            >
                <div class="qt-icon icon__edit qt-bg-contain qt-sz-20 qt-mr-12"></div>
                Edit payment
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                (click)="showRefundPayment()"
                *ngIf="!payment.refundMethod && !customerPortalStateService.isCustomerPortal && getPermissions('ROLLBACK_INVOICE')"
            >
                <div class="qt-icon icon__return-money qt-sz-20 qt-mr-12"></div>
                Refund payment
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                (click)="resendPaymentReceipt()"
            >
                <div class="qt-icon icon__resend-receipt qt-sz-20 qt-mr-12"></div>
                Resend payment receipt
            </li>
            <li
                class="pointer"
                ngbDropdownItem
                (click)="deletePayment()"
                *ngIf="!customerPortalStateService.isCustomerPortal"
            >
                <div class="qt-icon icon__delete qt-bg-contain qt-sz-20 qt-mr-12"></div>
                Delete payment
            </li>
        </ul>
    </div>
</div>
