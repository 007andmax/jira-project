<div class="tikcet-preview-container">
<div  *ngIf="!showPreloader">
<ng-template
  ngFor
  let-ticket
  [ngForOf]="list"
  let-i="index"
  [ngForTrackBy]="trackByIndex"
>
  <div class="invoice-item qt-mb-16 qt-w100">
    <div class="qt-df qt-ai-c">
      <div class="invoice-item__header qt-w100 qt-ml-30 qt-df qt-ai-c qt-pt-10 qt-pb-10">
        <div
          class="invoice-item__number qt-fs-16 qt-ml-24 qt-mr-16 qt-pointer"
          [textContent]="'Tkt# ' + ticket.number"
          (click)="editTicket(ticket.id)"
        >
      </div>
        <app-tickets-table-item-status [type]="'TICKET_PREVIEW'" class="qt-mr-16" [ticket]="ticket"
    [ticketsStatus]="ticketsStatus"
    [listColors]="listColors"
    (onChangedStatus)="onChangedStatus(ticket)"
    ></app-tickets-table-item-status>
        <div class="qt-fs-12 qt-mr-16">
          <span class="qt-fs-11 qt-fw-600">Company</span>
          {{ ticket.companyName }}
        </div>
        <div
          class="qt-fs-12 qt-df qt-ai-c qt-fg"

        >
          <div
            class="qt-button --gray --md qt-ml-12"
            placement="left"
            ngbTooltip="You cannot close the ticket. It contains incomplete products / services / tasks."
            [disableTooltip]="checkClose(ticket)"
            appDisabledBtn
            #update_closeBtn="disabled"
            (onClick)="close(ticket)"
            [ngClass]="{'--disabled':!checkClose(ticket), '--loading':ticket.isUpdateAndClose}"
          >
            <span
              class="qt-icon icon__check qt-sz-16 qt-dib qt-mr-8 qt-button-icon"
              *ngIf="!ticket.isUpdateAndClose"
            ></span>
            <span>Close Ticket</span>
            <app-preloader-ticket *ngIf="ticket.isUpdateAndClose"></app-preloader-ticket>
          </div>
        </div>
        <!--  <div
             class="qt-fs-12 invoice-item__subject"
             *ngIf="!getPermissions('EDIT_TICKETS')"
         >
             <span class="qt-fs-11 qt-fw-600">Subject:</span>
             {{ticket.subject}}
         </div> -->
      </div>
      <div class="delete-item-container qt-pl-4"></div>
    </div>
    <table class="invoice-item__table">
      <thead>
      <tr>
        <th class="invoice-item__col-item  qt-fw-600 service-date">Date</th>
        <th class="invoice-item__col-servers  qt-fw-600">Item</th>
        <th class="invoice-item__col-desc  qt-fw-600">Description</th>
        <th class="invoice-item__col-quentity qt-fw-600">Quantity</th>
        <th class="invoice-item__col-price qt-fw-600">Cost</th>
        <th class="invoice-item__col-price qt-fw-600">Markup</th>
        <th class="invoice-item__col-price qt-fw-600">Price</th>
        <th class="invoice-item__col-tax qt-fw-600">Discount</th>
        <th class="invoice-item__col-amount qt-fw-600">Serial Number</th>
        <th class="invoice-item__col-status"></th>
        <th class="invoice-item__col-remove"></th>
      </tr>
      </thead>
      <tbody>
      <ng-template
        ngFor
        let-service
        [ngForOf]="ticket.services"
        [ngForTrackBy]="trackById"
      >
        <app-ticket-preview-report-service-item [service]="service"
        [servicesCompany]="servicesCompany"
                                                [ticket]="ticket"></app-ticket-preview-report-service-item>
      </ng-template>
      <ng-template
        ngFor
        let-product
        [ngForOf]="ticket.products"
        [ngForTrackBy]="trackById"
      >
        <app-ticket-preview-report-product-item [product]="product"
                                                [ticket]="ticket"></app-ticket-preview-report-product-item>
      </ng-template>
      </tbody>
    </table>
  </div>
</ng-template>
</div>
<div
  class="loading"
  *ngIf="showPreloader"
></div>
</div>
