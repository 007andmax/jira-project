  <tr>
        <td> <app-date-picker
                #startDateDP
                [dropdownClass]="['date-picker']"
                [formatDate]="formatDate"
                [editMode]="true"
                [editDate]="product.date"
                [container]="'body'"
                (onChange)="onChangeStartDate($event)"
            ></app-date-picker></td>
              <td  [textContent]="product.item.manufacture"></td>
        <td class="invoice-item__col-desc"   
  
    >
             <app-ticket-preview-report-product-item-drop-down  [type]="'TICKET'" [editItem]="product.item"     (selectedProductItem)="selectProduct($event)"></app-ticket-preview-report-product-item-drop-down>
        </td>
          <td
            class="invoice-item__col-quentity"   
        >
        <input
                type="text"
                decimalNumber
                [useFixed]="true"
                appToFixed
                [value]="product.quantity"
                placeholder="Enter Cost"
            ></td>
        <td class="invoice-item__col-price">
                <input
                type="text"
                decimalNumber
                [useFixed]="true"
                appToFixed
                [ngClass]="{'--input-error' : !validate.getCostSale()}"
                (blur)="validate.checkPriceCost(product.item.sale,product.item.cost);updateProduct()"
                [value]="product.item.cost"
                (onChange)="onChangeCost($event)"
                placeholder="Enter Cost"
            >
            <app-mat-error
                class="invalid-feedback --pos-static"
                *ngIf="!validate.getCostSale()"
            >
                Cost cannot be higher than Price
            </app-mat-error>
        </td>
          <td class="invoice-item__col-price">
            <input
                type="text"
                decimalNumber
                (blur)="validate.checkPriceCost(product.item.sale,product.item.cost);updateProduct()"
                (onChange)="changeMarkup($event)"
                [value]="markup"
                placeholder="Enter Cost"
            >
        </td>
            <td class="invoice-item__col-price">
            <input
                type="text"
                decimalNumber
                [useFixed]="true"
                [ngClass]="{'--input-error' : !validate.getSale()}"
                appToFixed
                [value]="product.item.sale"
                (input)="validate.resetSale()"
                (blur)="validate.checkPriceCost(product.item.sale,product.item.cost);updateProduct()"
                (onChange)="onChangeSale($event)"
                placeholder="Enter Price"
            >
            <app-mat-error
                class="invalid-feedback"
                *ngIf="!validate.getSale()"
            >
                Price is required
            </app-mat-error>
        </td>
          
        <td
            class="invoice-item__col-tax"
            
        >
         <input
            type="text"
            class="qt-input-in-table qt-text-right"
            decimalNumber
            placeholder="0.00"
            [defaultValue]="''"
            [value]="product.discountAmount ? product.discountAmount : ''"
            (onChange)="onChangeDiscountAmount($event)"
            (blur)="updateProduct()"
        >
    </td>
        <td class="invoice-item__col-amount">
            
               <input
                type="text"
                 [(ngModel)]="product.serialNumber"
                placeholder="Enter Cost"
                 (blur)="updateProduct()"
            >
        </td>
        <td> <div
                    class="qt-button qt-button--with-icon --sm --gray qt-ml-8"
                    (click)="setComplete()"
                    [ngClass]="{
                    'no-click':!getPermissions('MANAGE_EXPENSE_COMPLETION_STATUS'),
                'button-mark-complete': product.completed}"
                >
                    <i
                        class="qt-icon icon__check qt-icon__green-600 qt-mr-6 icn-16"
                        *ngIf="product.completed"
                    ></i>
                    <i
                        class="qt-icon icon__check qt-mr-6 icn-16"
                        *ngIf="!product.completed"
                    ></i>
                    <span [textContent]="(!product.completed) ? 'Mark completed' : 'Сompleted'"></span>
                </div></td>
                <td>  <app-dynamic-tooltip
                    [content]="'Delete Product'"
                    [position]="'top'"
                    #deleteProduct
                ></app-dynamic-tooltip> <div
                    class="qt-button-square pointer qt-ml-24"
                    (click)="removeProduct()"
                    (mouseenter)="deleteProduct.show($event.target)"
                    (mouseleave)="deleteProduct.hide()"
                >
                    <div class="qt-icon icon__delete qt-icon__red-600 qt-sz-16"></div>
                </div></td>
    </tr>
