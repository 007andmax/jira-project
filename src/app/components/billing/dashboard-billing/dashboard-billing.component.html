<div class="billing-dashboard-page">
    <div
        class="loading"
        *ngIf="showPreloader"
    ></div>
    <div
        class="billing-dashboard-page__content"
        *ngIf="!showPreloader"
    >
        <div class="qt-df qt-ai-c qt-jc-sb qt-mb-16">
            <h6 class="qt-fw-600 qt-color-gray-900">Dashboard</h6>
            <div class="header-dashboard">
                <span [textContent]="'Accounting date: ' + getTextAccountingStartDate()"></span>
                <app-date-picker
                    [placement]="'bottom-right'"
                    [useMinDate]="false"
                    [editMode]="true"
                    [editDate]="accountingStartDate"
                    [type]="'ICON'"
                    (onChange)="onChangeDatePicker($event)"
                ></app-date-picker>
            </div>
        </div>
        <div class="qt-df qt-jc-sb qt-mb-16">
            <app-dashboard-stats
                [title]="'Total Sales'"
                [total]="dashboard.totalSales | currency"
                [class]="'qt-icon icon__sales'"
                [tooltip]="'Represents the total amount of all created invoices from the accounting date to the current day inclusive.'"
            ></app-dashboard-stats>
            <app-dashboard-stats
                [title]="'Unpaid Invoices'"
                [total]="dashboard.totalCustomerDebt | currency"
                [class]="'icon__unpaid-invoice'"
                [tooltip]="'Represents the unpaid amount of all created invoices since the registration of the technical company to the current day inclusive.'"
            ></app-dashboard-stats>
            <app-dashboard-stats
                [title]="'Unbilled Amount'"
                [total]="dashboard.totalBillable | currency"
                [class]="'qt-icon icon__unbilled-amount'"
                [tooltip]="'Represents the total amount of products/services in tickets for which an invoice has not been created since the creation of the technical company. The current day is not taken into account.'"
                [customTooltipClass]="true"
            ></app-dashboard-stats>
            <app-dashboard-stats
                [title]="'Total Quotes'"
                [total]="dashboard.saleQuotesPossibleRevenue | currency"
                [class]="'qt-icon icon__manual-create-billable'"
                [tooltip]="'Represents the potential income for all quotas since the creation of the technical company to the current day inclusive. Only quotes with the following statuses are taken into account: SAVED, READ, APPROVED, UNREAD.'"
                [customTooltipClass]="true"
            ></app-dashboard-stats>
        </div>
        <app-dashboard-sales-analytics
            #dashboardStats
            (onSelectType)="getDashboard($event)"
            [chartData]="dashboard.chartData"
        ></app-dashboard-sales-analytics>
        <div class="qt-df qt-jc-sb qt-mb-16">
            <app-invoice-revenue
                *ngIf="getPermissions('VIEW_ACCOUNTING')"
                #invoiceRevenue
                [accountingStartDate]="accountingStartDate"
            ></app-invoice-revenue>
            <app-dashboard-quotes [stats]="dashboard.saleQuoteCounters"></app-dashboard-quotes>
            <app-contracts-dashboard
                #contractsDb
                [contractsDashboard]="contractsDashboard"
            ></app-contracts-dashboard>
        </div>
        <div
            class="qt-df qt-jc-sb"
            *ngIf="getPermissions('VIEW_ACCOUNTING')"
        >
            <div class="contract-info-list qt-mr-16">
                <app-top-dashboard
                    [title]="'Top Customer Sale'"
                    [list]="topDashboard.top5InvoicesSum"
                    [tooltip]="'Represents the total amount of created invoices for a certain company from the accounting date to the current day inclusive.'"
                ></app-top-dashboard>
            </div>
            <div class="contract-info-list qt-mr-16">
                <app-top-dashboard
                    [title]="'Top Outstanding Customer'"
                    [list]="topDashboard.top5OutstandingInvoicesSum"
                    [tooltip]="'Represents the unpaid amount of created invoices for a certain company from the accounting date to the current day inclusive.'"
                ></app-top-dashboard>
            </div>
            <div class="contract-info-list">
                <app-top-product-dashboard
                    [title]="'Top Selling Products'"
                    [list]="topDashboard.top5SellingProducts"
                ></app-top-product-dashboard>
            </div>
        </div>
    </div>
</div>
