<div
    class="contract-dashboard-chart-card qt-mb-16"
    ngbDropdown
>
    <div class="contract-dashboard-chart-card__header">
        <div class="contract-dashboard-chart-card__header-title">Sales Analytics</div>
        <div
            class="qt-df qt-ai-c dashboard-stats-info"
            ngbDropdownAnchor
        >
            <div
                class="qt-color-gray-600 qt-fs-12 qt-df qt-ai-c pointer"
                id="dropdown1"
                ngbDropdownToggle
            >
                <div
                    [textContent]="getSelectedType()"
                    class="qt-mr-5"
                ></div>
                <div class="qt-icon icon__arrow-down qt-ic-c qt-sz-16"></div>
            </div>
            <ng-template #tipContent>
                Sales - The total amount of all invoices created during a given period of time.
                <br>
                <br>
                Revenue - The total amount of all payments created a given period of time.
            </ng-template>
            <div
                class="qt-icon icon__help  qt-sz-12 qt-ic-c qt-ml-8"
                container="body"
                [ngbTooltip]="tipContent"
                [tooltipClass]="'dshboard-billable-tooltip'"
            ></div>
        </div>
        <ul
            class="qt-dropdown-menu --border"
            ngbDropdownMenu
            aria-labelledby="dropdown1"
        >
            <ng-template
                ngFor
                let-item
                [ngForOf]="listType"
                let-i="index"
            >
                <li
                    class="pointer"
                    ngbDropdownItem
                    [textContent]="item.title"
                    (click)="selectType(item.value)"
                ></li>
            </ng-template>
        </ul>
    </div>
    <div class="contract-dashboard-chart-card__chart-content">
        <nvd3
            #nvd3
            class="sales-analytic"
            [options]="options"
            [data]="data"
            #nvd3
        ></nvd3>
    </div>
</div>
