<div class="contract-info-card">
    <i
        class="icon__help dashboard-stats-info qt-sz-12 qt-ic-c qt-ml-8"
        placement="top"
        container="body"
        [ngbTooltip]="tooltip"
        *ngIf="tooltip"
    ></i>
    <div class="contract-info-card__container">
        <div class="contract-info-card__circle-outer">
            <div
                class="contract-info-card__circle-inner"
                [ngClass]="class"
            ></div>
        </div>
        <div class="contract-info-card__text-info">
            <div
                class="contract-info-card__title"
                [textContent]="total"
            ></div>
            <div
                class="contract-info-card__subtitle"
                [textContent]="title"
            ></div>
        </div>
    </div>
</div>
