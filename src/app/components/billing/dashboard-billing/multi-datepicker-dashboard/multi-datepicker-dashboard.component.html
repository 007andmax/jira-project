<div class="date-picker" (clickOutside)="hideDatePicker()">
  <div class="date-picker-header" (click)="toggleDatePicker()">
         <p  class="pointer" [textContent]="getSelectedInterval()"  ></p>
  <i *ngIf="selectedDateModel"
     class="icn-sm icn-remove-old"
     (click)="clearDate()"></i>
  <i *ngIf="!selectedDateModel"
     class="icn-16 icon__calendar pointer"></i>
    </div>
  <div  class="dropdown-menu show" *ngIf="showDatePicker">
    <ngb-datepicker #dp (select)="onDateSelection($event)" [displayMonths]="2" [dayTemplate]="t" [outsideDays]="outsideDays"  >
    </ngb-datepicker>
    <ng-template #t let-date let-focused="focused">
        <span class="custom-day"
              [class.focused]="focused"
              [class.range]="isRange(date)"
              [class.faded]="isHovered(date) || isInside(date)"
              (mouseenter)="hoveredDate = date"
              (mouseleave)="hoveredDate = null">
          {{ date.day }}
        </span>
    </ng-template>
    <div class="date-picker-actions clearfix">
      <div class="qt-df qt-mb-5">
        <button class="qt-button --md --gray qt-fs-0" (click)="selectCurrentMonth();">this month</button>
        <button class="qt-button --md --gray qt-fs-0" (click)="selectLastMonth();">last month</button>
        <button class="qt-button --md --gray qt-fs-0" (click)="selectLast90Days();">90 day</button>
        <button class="qt-button --md --gray qt-fs-0" (click)="selectYearToDate();">year to date</button>
      </div>

    </div>
  </div>
</div>
