<div class="archive-modal">
    <button
        class="close-modal"
        (click)=closeModal()
    ></button>
    <div class="archive-modal__body modal-body">
        <h3>Edit Service</h3>
        <p [textContent]="message"></p>
    </div>
    <div class="archive-modal__footer">
        <div class="qt-df qt-jc-fe">
            <button
                class="btn-new disabled"
                (click)=cancelConfirm()
            >
                Cancel
            </button>
            <button
                class="btn-new btn-primary"
                (click)=approveConfirm()
            >
                Yes, I am sure
            </button>
        </div>
    </div>
</div>
