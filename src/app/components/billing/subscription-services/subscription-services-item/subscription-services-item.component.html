<div class="qt-table-modern__row">
    <div
        class="default-service-table__service-name"
        [textContent]="service.name"
         (click)="edit()"
    ></div>
    <div
        class="default-service-table__rate"
        [textContent]="service.rate | currency"
         (click)="edit()"
    ></div>
    <div
        class="default-service-table__taxes"
        [textContent]="getSelectedTaxNames(service.taxIds)"
         (click)="edit()"
    ></div>
    <div class="default-service-table__gl">
        <app-drop-down
            #glNumberSelect
            [class]="['--small-padding']"
            [list]="glNumbers"
            [placeholder]="'Select GL'"
            [container]="'body'"
            [change]="false"
            [editItem]="selectedGlNumber"
            [add]="true"
            [field]="'glNumber'"
            uiType="dark"
            heightInput="32px"
            dropdownWidth="392px"
            [reducerItem]="glDropDownItemName"
            (onAddItem)="onAddGlNumber($event)"
            [isDisabled]="!getPermissions('MANAGE_SERVICES')"
            (onSelectedItem)="onSelectGlNumbers($event)"
        >
        </app-drop-down>
    </div>
    <div class="default-service-table__menu">
        <div
            *ngIf="getPermissions('MANAGE_SERVICES')"
            ngbDropdown
            container="body"
        >
            <div
                class="qt-ic-c qt-icon icon__more qt-pointer qt-sz-16 qt-bg-contain"
                ngbDropdownToggle
            ></div>
            <ul
                class="qt-dropdown-menu default-services-items-dropdown"
                ngbDropdownMenu
                aria-labelledby="dropdownBasic1"
            >
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="edit()"
                >
                    <div class="qt-icon icon__edit qt-sz-20 qt-mr-12 qt-bg-contain"></div>
                    Edit
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="delete()"
                >
                    <div class="qt-icon icon__delete qt-sz-20 qt-mr-12 qt-bg-contain"></div>
                    Delete
                </li>
            </ul>
        </div>
    </div>
</div>
