<div class="archive-modal de-archive">
    <button
        class="close-modal"
        (click)=cancelConfirm()
    ></button>
    <div class="archive-modal__body">
        <h3>Delete Service</h3>
        <div
            class="no-exist-agreements"
            *ngIf="!showPreloader && valid"
        >
            <span class="no-exist-agreements__info">
                Are you sure you want to delete this service?
            </span>
            <div class="info-product">
                <h3 [textContent]="service.name"></h3>
                <span>Associate with no contracts</span>
            </div>
        </div>
        <div
            class="exist-agreements"
            *ngIf="!showPreloader && !valid"
        >
            <p>
                You can’t delete a service that associate with contracts, Please remove the service from following contracts before you delete it.
            </p>
            <div class="contract-container qt-mt-16">
                <h3 [textContent]="service.name"></h3>
                <p [textContent]="'Associate with ' + list.length + ' following contracts'"></p>
                <div class="contract-container-agreements qt-mt-8">
                    <ng-template
                        ngFor
                        let-agreement
                        let-i="index"
                        [ngForOf]="list"
                        [ngForTrackBy]="trackById"
                    >
                        <div class="contract-item">




                            <div class="contract-item-info">
                                <h3 [textContent]="agreement.companyName"></h3>
                                <span [textContent]="agreement.description"></span>
                            </div>
                            <span
                                class="view-contract pointer"
                                (click)="showContract(agreement)"
                            >
                                View Contract
                            </span>
                        </div>
                    </ng-template>
                </div>
            </div>
        </div>
        <div
            class="preloader-container"
            *ngIf="showPreloader"
        >
            <div class="loading"></div>
        </div>
    </div>
    <div
        class="archive-modal__footer"
        *ngIf="!showPreloader && valid"
    >
        <div class="qt-df qt-jc-fe">
            <button
                class="qt-button --gray qt-w100"
                (click)=cancelConfirm()
            >
                Cancel
            </button>
            <button
                class="qt-button --red qt-w100"
                (click)=approveConfirm()
            >
                Yes, I am sure
            </button>
        </div>
    </div>
</div>
