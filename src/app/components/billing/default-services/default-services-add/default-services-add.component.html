<div
    class="default-services-page__aside qt-aside-modern"
    *ngIf="showAdd"
>

  <div class="qt-aside-modern__header">
      <div class="qt-aside-modern__header-title">Create Service</div>
      <div
          class="qt-aside-modern__header-close icon__close"
          (click)="close()"
      ></div>
  </div>


    <div class="qt-aside-modern__content">
        <div class="qt-w100 qt-mb-16">
            <div
                class="qt-input-block"
                [ngClass]="{'--input-error':!validate.getName()}"
            >
                <label>Customer Name</label>
                <input
                    [value]="'Checks & System Maintenance'"
                    placeholder="Service Name"
                    [(ngModel)]="service.name"
                    type="text"
                    (input)="onChangeName()"
                >
                <mat-error
                    class="qt-tooltip-error"
                    *ngIf="!validate.getName()"
                >
                    Service name is required
                </mat-error>
            </div>
        </div>


        <div class="qt-df">
            <div class="qt-w50 qt-mb-16 qt-mr-16">
                <div
                    class="qt-input-block"
                    [ngClass]="{'--input-error':!validate.getRate()}"
                >
                    <label>Hourly Rate($)</label>
                    <input
                        [(ngModel)]="service.rate"
                        type="text"
                        number
                        placeholder="Per Hour Rate"
                        [money]="true"
                        (input)="onChangeRate($event)"
                        appToFixed
                    >
                    <mat-error
                        class="qt-tooltip-error"
                        *ngIf="!validate.getRate()"
                    >
                        Hour rate is required
                    </mat-error>
                </div>
            </div>



            <div class="qt-w50 qt-mb-16">
                <div class="create-product-taxes-select">
                    <app-taxes
                        [selectedTax]="defaultSelectedTax"
                        (taxesChange)="onTaxesChange($event)"
                    ></app-taxes>
                </div>
            </div>
        </div>


        <div class="qt-df">


            <div class="qt-w50 qt-mb-16 qt-mr-16">
                <app-drop-down
                    [title]="'GL Number'"
                    [placeholder]="'Select GL'"
                    [list]="glNumbers"
                    [field]="'glNumber'"
                    [search]="true"
                    [add]="true"
                    [change]="true"
                    (onAddItem)="onAddGlNumber($event)"
                    (onSelectedItem)="onSelectGlNumbers($event)"
                >
                </app-drop-down>
            </div>


            <div class="qt-w50"></div>
        </div>



        <div class="qt-df qt-ai-c">
            <label
                class="qt-checkbox receive-full-amount-check qt-mb-0 pointer"
                for="email-payment"
            >
                <input
                    id="email-payment"
                    type="checkbox"
                    [(ngModel)]="service.billable"
                >
                <span></span>
            </label>


            <div class="qt-fs-12 qt-ml-5">Make this service billable</div>
        </div>


    </div>




    <div class="qt-aside-modern__footer">
        <div class="qt-df">
            <button
                class="qt-button qt-mr-12"
                appDisabledBtn
                #addBtn="disabled"
                (onClick)="add()"
            >
                <span *ngIf="!addBtn.isBlock()">Create Service</span>
                <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
            </button>
            <button
                class="qt-button --gray"
                (click)="close()"
            >
                Cancel
            </button>
        </div>


    </div>


</div>
