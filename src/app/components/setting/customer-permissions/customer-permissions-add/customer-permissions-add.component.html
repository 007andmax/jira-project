<div
    class="qt-df qt-ml-12"
    ngbDropdown
    #addCustomer="ngbDropdown"
>
    <a
        href="javascript:;"
        ngbDropdownToggle
        class="qt-button --md --gray qt-jc-c pointer qt-ml-12"
    >
        <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-8 qt-button-icon"></span>
        Create New Role
    </a>
    <div
        class="modal-content --tooltip toggle-area"
        ngbDropdownMenu
    >
        <div class="modal-wrapper">
            <div class="toggle-header">
                <h6 class="qt-fw-600 qt-color-dark qt-mb-24">Create Role</h6>
            </div>
            <div class>
                <div class="qt-input-block qt-mb-32">
                    <label class="qt-input-block__label">Role Name</label>
                    <input
                        type="text"
                        class="form-input"
                        [(ngModel)]="name"
                        placeholder="Enter Role Name"
                        minlength="1"
                        maxlength="50"
                    >
                </div>
                <div class="qt-df qt-w100">
                    <a
                        href="javascript:;"
                        class="qt-button --gray qt-jc-c qt-w100 qt-mr-12"
                        aria-label="Close"
                        (click)="close()"
                    >
                        Cancel
                    </a>
                    <input
                        type="button"
                        value="Save"
                        (click)="addRole()"
                        class="qt-button qt-jc-c qt-w100"
                    >
                </div>
            </div>
        </div>
    </div>
</div>
