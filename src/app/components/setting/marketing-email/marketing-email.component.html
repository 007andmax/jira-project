<div class="page-container products-settings-page-container">
    <div class="page-insider page-insider-marketing-email manage-taxes">
        <div class="heading qt-df qt-ai-fs qt-jc-sb">
            <h5 class="qt-fw-600">Marketing Email</h5>
            <div class="qt-df qt-ml-12">
                <app-dynamic-tooltip
                    [content]="'Remove'"
                    [position]="'top'"
                    #removeTooltip
                ></app-dynamic-tooltip>
                <div
                    class="qt-button --md --gray button-gl-number__delete"
                    (click)="removeList()"
                    *ngIf="getSelectedCount() > 0"
                    (mouseenter)="removeTooltip.show($event.target)"
                    (mouseleave)="removeTooltip.hide()"
                >
                    <div class="qt-icon icon__delete qt-sz-16 qt-bg-contain qt-ic-c"></div>
                </div>
                <a
                    href="javascript:;"
                    class="qt-button --md --gray qt-jc-c pointer qt-ml-12"
                    (click)="create()"
                >
                    <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-8 qt-sz-16 qt-dib qt-mr-8"></span>
                    Add Subscription Type
                </a>
            </div>
        </div>
        <ul
            ngbNav
            #nav="ngbNav"
            (navChange)="setTab($event)"
            class="nav-tabs"
            [(activeId)]="activeTab"
        >
            <li
                [ngbNavItem]="'subscriptionType'"
                [destroyOnHide]="true"
            >
                <a ngbNavLink>Subscription Type</a>
                <ng-template ngbNavContent>
                    <marketing-subscription-type
                        #subscriptionType
                        (onSelect)="onSelect($event)"
                    ></marketing-subscription-type>
                </ng-template>
            </li>
        </ul>
        <div
            [ngbNavOutlet]="nav"
            class="mt-2"
        ></div>
    </div>
</div>
<marketing-email-users></marketing-email-users>
