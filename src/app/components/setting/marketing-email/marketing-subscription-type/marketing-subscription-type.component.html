<div class="cmn-area">
    <div class="data-table-wrap">
        <table
            class="display dataTable"
            style="width:100%"
            [ngClass]="{'cleat-height-dataTable':!showPreloader}"
        >
            <thead>
                <tr>
                    <th class="checkbox-header"></th>
                    <th
                        class="tax-name pointer"
                        (click)="onFilter('name')"
                    >
                        Subscription Type
                        <div class="qt-table-modern__sorting"></div>
                    </th>
                    <th
                        class="rate pointer"
                        (click)="onFilter('count')"
                    >
                        Users
                        <div class="qt-table-modern__sorting"></div>
                    </th>
                    <th class="action">&nbsp;</th>
                </tr>
            </thead>
            <tbody *ngIf="!showPreloader">
                <add-marketing-subscription-type
                    *ngIf="showAdd"
                    [marketingSubscriptionList]="marketingSubscriptionList"
                    (onClose)="showAdd = false"
                ></add-marketing-subscription-type>
                <tr
                    *ngFor="let item of marketingSubscriptionList; let i = index"
                    appClickOtside
                    [init]="item.isInitEdit"
                    [ngClass]="'edit-crm-container-' + i"
                    [class]="'.edit-crm-container-' + i"
                    (onOutSide)="onEditSubscription(item,$event)"
                >
                    <td class="checkbox">
                        <label class="qt-checkbox">
                            <input
                                type="checkbox"
                                (change)="onSelect($event,item)"
                            >
                            <span></span>
                        </label>
                    </td>
                    <td
                        class="tax-name edit-category-name"
                        [ngClass]="{'--input-error' :  item.disableUpdate  }"
                    >
                        <input
                            type="text"
                            class="form-input"
                            placeholder="Enter Name Category"
                            [(ngModel)]="item.name"
                            appKeyUpEnter
                            (onChange)="onEditSubscription(item,$event)"
                            maxlength="30"
                            (input)="item.onInitEdit(true);item.checkDublicate(industryList)"
                        >
                        <mat-error
                            class="qt-tooltip-error"
                            *ngIf="item.disableUpdate"
                        >
                            This Industry is already occupied
                        </mat-error>
                    </td>
                    <td
                        class="rate"
                        [textContent]="item.usersCount"
                    ></td>
                    <td class="action">
                        <a
                            href="javascript:;"
                            data-tooltip="Remove"
                            class="remove"
                            (click)="removeSubscription(item)"
                        >
                            <div class="icon__remove qt-sz-16 qt-bg-contain"></div>
                        </a>
                    </td>
                </tr>
            </tbody>
            <div
                class="loading"
                *ngIf="showPreloader"
            ></div>
        </table>
    </div>
</div>
