<div class="cmn-area">
    <div
        class="tab-pane__table"
        [ngClass]="{'cleat-height-dataTable':!showPreloader}"
    >
        <div class="tab-pane__table-header">
            <div class="tab-pane__table-row">
                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                    <label class="qt-checkbox">
                        <input
                            type="checkbox"
                            (change)="onSelectAll($event)"
                        >
                        <span></span>
                    </label>
                </div>
                <div
                    class="tab-pane__table-cell marketing-email-table__subscription-type pointer"
                    (click)="onFilter('name')"
                >
                    Subscription Type
                    <div class="qt-table-modern__sorting--new"></div>
                </div>
                <div
                    class="tab-pane__table-cell marketing-email-table__subscribed-users pointer"
                    (click)="onFilter('subscribedCount')"
                >
                    Subscribed  Users
                    <div class="qt-table-modern__sorting--new"></div>
                </div>
                <div
                    class="tab-pane__table-cell marketing-email-table__unsubscribed-users pointer"
                    (click)="onFilter('unsubscribedCount')"
                >
                    Unsubscribed Users
                    <div class="qt-table-modern__sorting--new"></div>
                </div>
                <div class="tab-pane__table-cell marketing-email-table__action"></div>
            </div>
        </div>
        <div
            class="tab-pane__table-body"
            *ngIf="!showPreloader"
        >
            <add-marketing-subscription-type
                *ngIf="showAdd"
                [marketingSubscriptionList]="marketingSubscriptionList"
                (onClose)="showAdd = false"
            ></add-marketing-subscription-type>
            <div
                class="tab-pane__table-row"
                *ngFor="let item of marketingSubscriptionList; let i = index"
                appClickOtside
                [init]="item.isInitEdit"
                [ngClass]="'edit-crm-container-' + i"
                [class]="'.edit-crm-container-' + i"
                (onOutSide)="onEditSubscription(item,$event)"
            >
                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                    <label class="qt-checkbox">
                        <input
                            type="checkbox"
                            (change)="select($event,item)"
                            [(ngModel)]="item.selected"
                        >
                        <span></span>
                    </label>
                </div>
                <div
                    class="tab-pane__table-cell marketing-email-table__subscription-type"
                    [ngClass]="{'--input-error' :  item.disableUpdate  }"
                >
                    <input
                        type="text"
                        class="form-input --editable"
                        placeholder="Enter Name Category"
                        [(ngModel)]="item.name"
                        appKeyUpEnter
                        (onChange)="onEditSubscription(item,$event)"
                        maxlength="30"
                        (input)="item.onInitEdit(true);item.checkDublicate(marketingSubscriptionList)"
                    >
                    <app-mat-error
                        class="qt-tooltip-error"
                        *ngIf="item.disableUpdate"
                    >
                        This Industry is already occupied
                    </app-mat-error>
                </div>
                <div class="tab-pane__table-cell marketing-email-table__subscribed-users">
                    <div class="qt-df">
                        <div
                            class="tab-pane__table__circle-avatar"
                            *ngIf="item.subscribeUserIds.length > 0"
                            [ngStyle]="{'background':  (usersStateService.getUserAvatarUrl(getUser(item.subscribeUserIds[0]))) ? usersStateService.getUserAvatarUrl(getUser(item.subscribeUserIds[0])) : colors[item.subscribeUserIndexColor[0]]}"
                            [textContent]="usersStateService.getUserAvatarUrl(getUser(item.subscribeUserIds[0])) ? '' : getUserName(item.subscribeUserIds[0])"
                            placement="top"
                            [ngbTooltip]="getUserFirstLastName(item.subscribeUserIds[0])"
                        >
                        </div>
                        <div
                            class="tab-pane__table__circle-avatar --border --ml-6"
                            *ngIf="item.subscribeUserIds.length > 1"
                            [ngStyle]="{'background':  (usersStateService.getUserAvatarUrl(getUser(item.subscribeUserIds[1]))) ? usersStateService.getUserAvatarUrl(getUser(item.subscribeUserIds[1])) : colors[item.subscribeUserIndexColor[1]]}"
                            [textContent]="usersStateService.getUserAvatarUrl(getUser(item.subscribeUserIds[1])) ? '' : getUserName(item.subscribeUserIds[1])"
                            placement="top"
                            [ngbTooltip]="getUserFirstLastName(item.subscribeUserIds[1])"
                        >
                        </div>
                        <div
                            class="tab-pane__table__circle-avatar --count --border --ml-6 pointer"
                            (click)="openAside(item,true)"
                            [textContent]="getCount(item.subscribedCount,item.subscribeUserIds.length)"
                        ></div>
                    </div>
                </div>
                <div class="tab-pane__table-cell marketing-email-table__unsubscribed-users">
                    <div class="qt-df">
                        <div
                            class="tab-pane__table__circle-avatar"
                            *ngIf="item.unsubscribeUserIds.length > 0"
                            [ngStyle]="{'background':  (usersStateService.getUserAvatarUrl(getUser(item.unsubscribeUserIds[0]))) ? usersStateService.getUserAvatarUrl(getUser(item.unsubscribeUserIds[0])) : colors[item.subscribeUserIndexColor[0]]}"
                            [textContent]="usersStateService.getUserAvatarUrl(getUser(item.unsubscribeUserIds[0])) ? '' : getUserName(item.unsubscribeUserIds[0])"
                            placement="top"
                            [ngbTooltip]="getUserFirstLastName(item.unsubscribeUserIds[0])"
                        >
                        </div>
                        <div
                            class="tab-pane__table__circle-avatar --border --ml-6"
                            *ngIf="item.unsubscribeUserIds.length > 1"
                            [ngStyle]="{'background':  (usersStateService.getUserAvatarUrl(getUser(item.unsubscribeUserIds[1]))) ? usersStateService.getUserAvatarUrl(getUser(item.unsubscribeUserIds[1])) : colors[item.subscribeUserIndexColor[1]]}"
                            [textContent]="usersStateService.getUserAvatarUrl(getUser(item.unsubscribeUserIds[1])) ? '' : getUserName(item.unsubscribeUserIds[1])"
                            placement="top"
                            [ngbTooltip]="getUserFirstLastName(item.unsubscribeUserIds[1])"
                        >
                        </div>
                        <span
                            class="tab-pane__table__circle-avatar --count --border --ml-6 pointer"
                            [textContent]="getCount(item.unsubscribedCount,item.unsubscribeUserIds.length)"
                            (click)="openAside(item,false)"
                        ></span>
                    </div>
                </div>
                <div class="tab-pane__table-cell marketing-email-table__action">
                    <div class="qt-df">
                        <app-dynamic-tooltip
                            [content]="'Remove'"
                            [position]="'top'"
                            #removeTooltip
                        ></app-dynamic-tooltip>
                        <div
                            (mouseenter)="removeTooltip.show($event.target)"
                            (mouseleave)="removeTooltip.hide()"
                            class="qt-icon icon__delete qt-sz-20 qt-bg-contain pointer"
                            (click)="removeSubscription(item)"
                        >
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div
            class="loading"
            *ngIf="showPreloader"
        ></div>
    </div>
</div>
