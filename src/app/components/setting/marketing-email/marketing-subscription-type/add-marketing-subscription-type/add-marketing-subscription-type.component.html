<div
    class="tab-pane__table-row --border-bottom"
    appClickOtside
    #addStatusBtn="click"
    [init]="true"
    [classParent]="'.add-crm-industry-container'"
    (onOutSide)="save()"
>
    <div
        class="tab-pane__table-cell tab-pane__table-checkboxes"
        *ngIf="mode !== MODE_ADD_BY_MODAL"
    ></div>
    <div
        class="tab-pane__table-cell marketing-email-table__subscription-type qt-pos-rel"
        [ngClass]="{'--input-error' : disableCreate}"
    >
        <input
            type="text"
            class="form-input --editable"
            placeholder="Enter Name Category"
            [(ngModel)]="name"
            (input)="checkDublicate()"
            (keyup)="onKeyUp($event)"
            maxlength="30"
            required
        >
        <app-mat-error
            class="qt-tooltip-error"
            *ngIf="disableCreate"
        >
            This industry is already occupied
        </app-mat-error>
    </div>
    <div
        *ngIf="mode !== MODE_ADD_BY_MODAL"
        class="tab-pane__table-cell marketing-email-table__subscribed-users"
    ></div>
    <div
        *ngIf="mode !== MODE_ADD_BY_MODAL"
        class="tab-pane__table-cell marketing-email-table__unsubscribed-users"
    ></div>
    <div
        *ngIf="mode !== MODE_ADD_BY_MODAL"
        class="tab-pane__table-cell marketing-email-table__action"
    ></div>
</div>
