<tr
    class="add-crm-industry-container"
    appClickOtside
    #addStatusBtn="click"
    [init]="true"
    [class]="'.add-crm-industry-container'"
    (onOutSide)="save()"
>
    <td *ngIf="mode !== MODE_ADD_BY_MODAL"></td>
    <td
        class="tax-name add-industry-name"
        [ngClass]="{'--input-error' : disableCreate}"
    >
        <mat-error
            class="qt-tooltip-error"
            *ngIf="disableCreate"
        >
            This industry is already occupied
        </mat-error>
        <input
            type="text"
            class="form-input"
            placeholder="Enter Name Category"
            [(ngModel)]="name"
            (input)="checkDublicate()"
            (keyup)="onKeyUp($event)"
            maxlength="30"
            required
        >
    </td>
    <td
        *ngIf="mode !== MODE_ADD_BY_MODAL"
        class="rate"
    ></td>
    <td
        *ngIf="mode !== MODE_ADD_BY_MODAL"
        class="action"
    ></td>
</tr>
