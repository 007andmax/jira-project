<div class="assign-ticket-content assign-ticket-content--page-settings">
    <div class="assign-ticket-header">
      <div class="assign-ticket-content__header-title qt-fw-600 qt-color-gray-900 qt-mb-16">Add User</div>
       <span class="qt-input-search__page-settings qt-mb-16">
          <input
            class="qt-input-search__page-settings-input --max-w100"
            placeholder="Search Users"
            autocomplete="off"
            [(ngModel)]="search"
            (input)="onSearch()"
          >
      </span>
    </div>
    <div
        class="scroll-pane"
        #content
        (click)="$event.preventDefault()"
        infiniteScroll
        [infiniteScrollContainer]="content"
        [infiniteScrollDistance]="2"
        [infiniteScrollThrottle]="50"
        [infiniteScrollDisabled]="infiniteScrollDisabled"
        [fromRoot]="true"
        (scrolled)="onScroll()"
    >
        <div class="users-list custom-scroll">
            <ng-template
                ngFor
                let-user
                [ngForOf]="users"
                let-i="index"
                [ngForTrackBy]="trackById"
            >
                <marketing-email-users-item
                    (onSelect)="onSelect($event)"
                    [user]="user"
                ></marketing-email-users-item>
            </ng-template>
        </div>
    </div>
    <div class="qt-aside-modern__footer">
      <button
        class="qt-button --gray qt-jc-c qt-w100 qt-mr-12"
        ngbDropdownItem
        (click)="close()"
      >
        Cancel
      </button>
        <button
            class="qt-button qt-jc-c qt-w100"
            ngbDropdownItem
            appDisabledBtn
            #addBtn="disabled"
            (onClick)="onAdd()"
        >
            <span *ngIf="!addBtn.isBlock()">Save</span>
            <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
        </button>
    </div>
</div>
