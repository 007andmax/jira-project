<div
    class="qt-aside-modern qt-aside-modern--page-settings users-page__aside"
    *ngIf="opened"
>
    <div class="qt-aside-modern__header">
        <div
            class="qt-aside-modern__header-title"
            [textContent]="parseNameAside()"
        ></div>
    </div>
    <div class="qt-aside-modern__content">
        <div class="assign-ticket-content">
            <div class="assign-ticket-header">
                <div class="qt-df qt-ai-c qt-mb-16">
                    <span class="qt-input-search__page-settings qt-f-1">
                        <input
                            class="qt-input-search__page-settings-input"
                            placeholder="Search Users"
                            autocomplete="off"
                            [(ngModel)]="word"
                            (input)="onSearch($event)"
                        >
                        <span
                            class="global-search__close qt-icon icon__close-round qt-icon__gray-400"
                            *ngIf="word.length > 0"
                            (click)="clearWord()"
                        ></span>
                    </span>
                    <button
                        class="qt-button --md --padding-md --gray qt-jc-c pointer qt-ml-12"
                        (click)="toggleShowAddUser = !toggleShowAddUser"
                    >
                        <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-8 qt-sz-16 qt-dib qt-mr-8"></span>
                        Add User
                    </button>
                </div>
                <marketing-email-users-add
                    *ngIf="toggleShowAddUser"
                    (onClose)="toggleShowAddUser = false"
                    #addUserDP
                    [marketingSubscription]="marketingSubscription"
                ></marketing-email-users-add>
            </div>
            <div class="users-list custom-scroll">
                <ng-template
                    ngFor
                    let-user
                    [ngForOf]="users"
                    let-i="index"
                    [ngForTrackBy]="trackByIndex"
                >
                    <marketing-email-users-item
                        [user]="user"
                        (onRemove)="remove(user)"
                    ></marketing-email-users-item>
                </ng-template>
            </div>
        </div>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="qt-df qt-w100">
            <button
                (click)="close()"
                class="qt-button --gray qt-jc-c qt-w100 qt-mr-12"
            >
                Cancel
            </button>
            <button class="qt-button qt-jc-c qt-w100">Save</button>
        </div>
    </div>
</div>
