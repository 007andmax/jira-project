<div
    class="qt-aside-modern users-page__aside"
    *ngIf="opened"
>
    <div class="qt-aside-modern__header">
        <div
            class="qt-aside-modern__header-title"
            [textContent]="parseNameAside()"
        ></div>
        <div
            class="qt-aside-modern__header-close icon__close"
            (click)="close()"
        ></div>
    </div>
    <div class="qt-aside-modern__content">
        <div class="assign-ticket-content">
            <div class="assign-ticket-header">
                <div
                    class="clearfix"
                    ngbDropdown
                    (openChange)="onOpenChange($event)"
                >
                    <div class="qt-df qt-ai-c qt-mb-16">
                        <span class="qt-input-search qt-f-1">
                            <input
                                class="form-control"
                                placeholder="Search Users"
                                autocomplete="off"
                                [(ngModel)]="word"
                                (input)="onSearch($event)"
                            >
                            <span
                                class="global-search__close icon__close-round"
                                *ngIf="word.length > 0"
                                (click)="clearWord()"
                            ></span>
                        </span>
                        <button
                            class="qt-btn --outline-blue qt-fs-0 qt-ml-8"
                            ngbDropdownToggle
                        >
                            Add User
                        </button>
                    </div>
                    <marketing-email-users-add
                        #addUserDP
                        ngbDropdownMenu
                        [marketingSubscription]="marketingSubscription"
                    ></marketing-email-users-add>
                </div>
            </div>
            <div class="users-list custom-scroll">
                <ng-template
                    ngFor
                    let-user
                    [ngForOf]="users"
                    let-i="index"
                    [ngForTrackBy]="trackByIndex"
                >
                    <div class="user-item">
                        <div
                            href="javascript:void(0)"
                            [id]="user.id"
                            class="dropdown-link"
                        >
                            <div
                                class="default-user-avatar avatar-background-color-odd ng-scope"
                                *ngIf="!user.avatar"
                            >
                                <span [textContent]="(user.firstName) ? user.firstName[0].toUpperCase() : ''"></span>
                                <span [textContent]="(user.lastName) ? user.lastName[0].toUpperCase() : ''"></span>
                            </div>
                            <div
                                class="default-user-avatar avatar-background-color-odd ng-scope"
                                *ngIf="user.avatar"
                            >
                                <img
                                    ng-if="user.avatar"
                                    class="img-circle avatar-26"
                                    style="margin: 0;"
                                    [src]="'/users/' + (user.id || 'default') + '/image' + (user.avatar ? '.jpg?t=' + user.avatar.updatedAt : '')"
                                    alt="..."
                                >
                            </div>
                            <span class="qt-f-1 ellipsis">
                                <div
                                    class="qt-fw-500 qt-color-dark ellipsis"
                                    [textContent]="user.firstName + ' ' + user.lastName"
                                >
                                </div>
                                <div
                                    class="qt-color-gray-700 qt-fs-12 qt-lh-133 ellipsis"
                                    [textContent]="user.email"
                                ></div>
                            </span>
                            <a
                                href="javascript:;"
                                data-tooltip="Remove"
                                class="remove"
                                (click)="remove(user)"
                            >
                                <div class="icon__remove qt-sz-16 qt-bg-contain"></div>
                            </a>
                        </div>
                    </div>
                </ng-template>
            </div>
        </div>
    </div>
</div>
