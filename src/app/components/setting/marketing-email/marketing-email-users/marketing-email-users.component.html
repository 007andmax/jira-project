<div
    class="qt-aside-modern qt-aside-modern--page-settings users-page__aside"
    *ngIf="opened"
>
    <div class="qt-aside-modern__header">
        <div
            class="qt-aside-modern__header-title"
            [textContent]="parseNameAside()"
        ></div>
    </div>
    <div class="qt-aside-modern__content">
        <div class="assign-ticket-content">
            <div class="assign-ticket-header">
                <div class="qt-df qt-ai-c qt-mb-16">
                    <span class="qt-input-search__page-settings qt-f-1">
                        <input
                            class="qt-input-search__page-settings-input"
                            placeholder="Search Users"
                            autocomplete="off"
                            [(ngModel)]="word"
                            (input)="onSearch($event)"
                        >
                        <span
                            class="global-search__close icon__close-round"
                            *ngIf="word.length > 0"
                            (click)="clearWord()"
                        ></span>
                    </span>
                    <button
                        class="qt-button --md --padding-md --gray qt-jc-c pointer qt-ml-12"
                        (click)="toggleShowAddUser = !toggleShowAddUser"
                    >
                        <span class="icon__add-grey qt-sz-16 qt-bg-contain qt-dib qt-mr-8"></span>
                        Add User
                    </button>
                </div>
                <marketing-email-users-add
                    *ngIf="toggleShowAddUser"
                    (onClose)="toggleShowAddUser = false"
                    #addUserDP
                    [marketingSubscription]="marketingSubscription"
                ></marketing-email-users-add>
            </div>
            <div class="users-list custom-scroll">
                <ng-template
                    ngFor
                    let-user
                    [ngForOf]="users"
                    let-i="index"
                    [ngForTrackBy]="trackByIndex"
                >
                    <div class="user-item">
                        <div
                            href="javascript:void(0)"
                            [id]="user.id"
                            class="dropdown-link"
                        >
                            <div
                                class="default-user-avatar avatar-background-color-odd ng-scope"
                                *ngIf="!user.avatar"
                            >
                                <span [textContent]="(user.firstName) ? user.firstName[0].toUpperCase() : ''"></span>
                                <span [textContent]="(user.lastName) ? user.lastName[0].toUpperCase() : ''"></span>
                            </div>
                            <div
                                class="default-user-avatar avatar-background-color-odd ng-scope"
                                *ngIf="user.avatar"
                            >
                                <img
                                    ng-if="user.avatar"
                                    class="img-circle avatar-26"
                                    style="margin: 0;"
                                    [src]="'/users/' + (user.id || 'default') + '/image' + (user.avatar ? '.jpg?t=' + user.avatar.updatedAt : '')"
                                    alt="..."
                                >
                            </div>
                            <span class="qt-f-1 ellipsis">
                                <div
                                    class="user-item__name qt-fw-600 qt-color-gray-900 ellipsis"
                                    [textContent]="user.firstName + ' ' + user.lastName"
                                >
                                </div>
                                <div
                                    class="user-item__email qt-color-gray-500 qt-mt-2 ellipsis"
                                    [textContent]="user.email"
                                ></div>
                            </span>
                            <app-dynamic-tooltip
                                [content]="'Remove'"
                                [position]="'top'"
                                #removeTooltip
                            ></app-dynamic-tooltip>
                            <div
                                (mouseenter)="removeTooltip.show($event.target)"
                                (mouseleave)="removeTooltip.hide()"
                                class="icon__new-remove qt-sz-20 qt-bg-contain pointer"
                                (click)="remove(user)"
                            >
                            </div>
                        </div>
                    </div>
                </ng-template>
            </div>
        </div>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="qt-df qt-w100">
            <button
                (click)="close()"
                class="qt-button --gray qt-jc-c qt-w100 qt-mr-12"
            >
                Cancel
            </button>
            <button class="qt-button qt-jc-c qt-w100">Save</button>
        </div>
    </div>
</div>
