<div class="user-item">
    <div
        href="javascript:void(0)"
        [id]="user.id"
        class="dropdown-link"
    >
        <div
            class="default-user-avatar ng-scope"
            *ngIf="!user.avatar"
            [ngStyle]="{'background-color':listColorNoAvatar[indexNoAvatar]}"
        >
            <span [textContent]="(user.firstName) ? user.firstName[0].toUpperCase() : ''"></span>
            <span [textContent]="(user.lastName) ? user.lastName[0].toUpperCase() : ''"></span>
        </div>
        <div
            class="default-user-avatar ng-scope"
            *ngIf="user.avatar"
        >
            <img
                ng-if="user.avatar"
                class="img-circle avatar-36"
                style="margin: 0;"
                [src]="'/users/' + (user.id || 'default') + '/image' + (user.avatar ? '.jpg?t=' + user.avatar.updatedAt : '')"
                alt="..."
            >
        </div>
        <span class="qt-f-1 ellipsis">
            <div
                class="user-item__name qt-fw-600 qt-color-gray-900 ellipsis"
                [textContent]="user.firstName + ' ' + user.lastName"
            >
            </div>
            <div
                class="user-item__email qt-color-gray-500 qt-mt-2 ellipsis"
                [textContent]="user.email"
            ></div>
        </span>
        <app-dynamic-tooltip
            [content]="'Remove'"
            [position]="'top'"
            #removeTooltip
        ></app-dynamic-tooltip>
        <div
            (mouseenter)="removeTooltip.show($event.target)"
            (mouseleave)="removeTooltip.hide()"
            class="icon__remove qt-sz-20 qt-bg-contain pointer"
            (click)="remove(user)"
        >
        </div>
    </div>
</div>
