<div
    class="tab-pane__table-row"
    appClickOtside
    #addStatusBtn="click"
    [init]="true"
    [class]="'.add-crm-job-type-container'"
    (onOutSide)="save()"
>
    <div class="tab-pane__table-cell tab-pane__table-checkboxes"></div>
    <div
        class="tab-pane__table-cell crm-settings-table-job-type__job-type qt-pos-rel"
        [ngClass]="{'--input-error' : disableCreate}"
    >
        <input
            type="text"
            class="form-input --editable"
            placeholder="Enter Name Category"
            [(ngModel)]="name"
            (input)="checkDublicate()"
            (keyup)="onKeyUp($event)"
            maxlength="30"
            required
        >
        <mat-error
          class="invalid-feedback"
          *ngIf="disableCreate"
        >
          This job type is already occupied
        </mat-error>
    </div>
    <div class="tab-pane__table-cell crm-settings-table-job-type__action"></div>
</div>
