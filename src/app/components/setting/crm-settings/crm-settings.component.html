<div class="page-container products-settings-page-container">
    <div class="page-insider manage-taxes">
        <div class="heading qt-df qt-ai-fs qt-jc-sb">
            <h5 class="qt-fw-600">CRM Settings</h5>
            <div class="qt-df">
                <app-dynamic-tooltip
                    [content]="'Remove'"
                    [position]="'top'"
                    #removeTooltip
                ></app-dynamic-tooltip>
                <a
                    href="javascript:;"
                    (mouseenter)="removeTooltip.show($event.target)"
                    (mouseleave)="removeTooltip.hide()"
                    class="qt-button --md --gray button-gl-number__delete qt-ml-12"
                    *ngIf="getSelectedCount() > 0"
                    (click)="removeList()"
                >
                    <div class="qt-icon icon__delete qt-sz-16 qt-bg-contain qt-ic-c qt-button-icon"></div>
                </a>
                <a
                    href="javascript:;"
                    class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                    (click)="create()"
                >
                    <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-8 qt-button-icon"></span>
                    <span [textContent]="parseAddText()"></span>
                </a>
            </div>
        </div>
        <ul
            ngbNav
            (tabChange)="setTab($event)"
            class="nav-tabs"
            [(activeId)]="activeTab"
        >
            <li
                [ngbNavItem]="'companyIndustry'"
                [destroyOnHide]="true"
            >
                <a ngbNavLink>Company Industry</a>
                <ng-template ngbNavContent>
                    <crm-company-industry #industry></crm-company-industry>
                </ng-template>
            </li>
            <li
                [ngbNavItem]="'serviceType'"
                [destroyOnHide]="true"
            >
                <a ngbNavLink>Company Service Type</a>
                <ng-template ngbNavContent>
                    <crm-company-service-type #serviceType></crm-company-service-type>
                </ng-template>
            </li>
            <li
                [ngbNavItem]="'userJobTitle'"
                [destroyOnHide]="true"
            >
                <a ngbNavLink>User Job Title</a>
                <ng-template ngbNavContent>
                    <crm-company-job-title #jobTitle></crm-company-job-title>
                </ng-template>
            </li>
            <li
                [ngbNavItem]="'jobType'"
                [destroyOnHide]="true"
            >
                <a ngbNavLink>User Job Type</a>
                <ng-template ngbNavContent>
                    <crm-company-job-type #jobType></crm-company-job-type>
                </ng-template>
            </li>
        </ul>
    </div>
</div>
