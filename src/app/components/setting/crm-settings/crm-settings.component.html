<div class="page-container products-settings-page-container">
    <div class="page-insider manage-taxes">
        <div class="heading qt-df qt-ai-fs qt-jc-sb">
            <h5 class="qt-fw-600">CRM Settings</h5>
            <div class="qt-df">
                <a
                    href="javascript:;"
                    class="qt-button --md --gray button-gl-number__delete qt-ml-12"
                    *ngIf="getSelectedCount() > 0"
                    (click)="removeList()"
                >
                    <div class="icon__new-remove qt-sz-16 qt-bg-contain qt-ic-c qt-button-icon"></div>
                </a>
                <a
                    href="javascript:;"
                    class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                    (click)="create()"
                >
                  <span class="icon__add--grey-500 qt-sz-16 qt-bg-contain qt-dib qt-mr-8 qt-button-icon"></span>
                  <span
                    [textContent]="parseAddText()"
                  ></span>
                </a>
            </div>
        </div>
        <ngb-tabset
            #tabset="ngbTabset"
            (tabChange)="setTab($event)"
            [destroyOnHide]="true"
        >
            <ngb-tab
                title="Company Industry"
                id="companyIndustry"
            >
                <ng-template ngbTabContent>
                    <crm-company-industry #industry></crm-company-industry>
                </ng-template>
            </ngb-tab>
            <ngb-tab
                title="Company Service Type"
                id="serviceType"
            >
                <ng-template ngbTabContent>
                    <crm-company-service-type #serviceType></crm-company-service-type>
                </ng-template>
            </ngb-tab>
            <ngb-tab
                title="User Job Title"
                id="userJobTitle"
            >
                <ng-template ngbTabContent>
                    <crm-company-job-title #jobTitle></crm-company-job-title>
                </ng-template>
            </ngb-tab>
            <ngb-tab
                title="User Job Type"
                id="jobType"
            >
                <ng-template ngbTabContent>
                    <crm-company-job-type #jobType></crm-company-job-type>
                </ng-template>
            </ngb-tab>
        </ngb-tabset>
    </div>
</div>
