<div class="cmn-area">
    <div
        class="tab-pane__table dataTable"
        [ngClass]="{'cleat-height-dataTable':!showPreloader}"
    >
        <div class="tab-pane__table-header">
            <div class="tab-pane__table-row">
                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                    <label class="qt-checkbox">
                        <input
                            type="checkbox"
                            (change)="onSelectAll($event)"
                        >
                        <span></span>
                    </label>
                </div>
                <div
                    class="tab-pane__table-cell crm-settings-table-job-title__job-title pointer"
                    (click)="onFilter('name')"
                >
                    Job Title
                    <div class="qt-table-modern__sorting--new"></div>
                </div>
                <div class="crm-settings-table-job-title__action">&nbsp;</div>
            </div>
        </div>
        <div
            class="tab-pane__table-body"
            *ngIf="!showPreloader"
        >
            <add-crm-company-job-title
                *ngIf="showAdd"
                [jobTitleList]="jobTitleList"
                (onClose)="showAdd = false"
            ></add-crm-company-job-title>
            <div
                class="tab-pane__table-row"
                *ngFor="let item of jobTitleList; let i = index"
                appClickOtside
                [init]="item.isInitEdit"
                [ngClass]="'edit-crm-container-' + i"
                [class]="'.edit-crm-container-' + i"
                (onOutSide)="onEditJobTitle(item,$event)"
            >
                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                    <label class="qt-checkbox">
                        <input
                            type="checkbox"
                            [(ngModel)]="item.selected"
                            (change)="onSelect($event,item)"
                        >
                        <span></span>
                    </label>
                </div>
                <div
                    class="tab-pane__table-cell crm-settings-table-job-title__job-title"
                    [ngClass]="{'--input-error' :  item.disableUpdate  }"
                >
                    <input
                        type="text"
                        class="form-input --editable"
                        placeholder="Enter Name Category"
                        [(ngModel)]="item.name"
                        appKeyUpEnter
                        (onChange)="onEditJobTitle(item,$event)"
                        (input)="item.onInitEdit(true);item.checkDublicate(jobTitleList)"
                        maxlength="30"
                    >
                    <mat-error
                        class="qt-tooltip-error"
                        *ngIf="item.disableUpdate"
                    >
                        This Job Title is already occupied
                    </mat-error>
                </div>
                <div class="tab-pane__table-cell crm-settings-table-job-title__action">
                    <app-dynamic-tooltip
                        [content]="'Remove'"
                        [position]="'top'"
                        #removeTooltip
                    ></app-dynamic-tooltip>
                    <div
                        data-tooltip="Remove"
                        class="icon__new-remove qt-sz-20 qt-bg-contain pointer"
                        (click)="removeJobTitle(item)"
                        (mouseenter)="removeTooltip.show($event.target)"
                        (mouseleave)="removeTooltip.hide()"
                    >
                    </div>
                </div>
            </div>
        </div>
        <div
            class="loading"
            *ngIf="showPreloader"
        ></div>
    </div>
</div>
