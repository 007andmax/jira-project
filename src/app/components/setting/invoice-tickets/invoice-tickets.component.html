<!-- Middle Wrapper -->
<div class="page-container">
    <div class="page-insider invoice-ticket">
        <div class="heading">
            <h5 class="qt-fw-600">Invoice</h5>
        </div>
        <ngb-tabset>
            <!-- Invoice Settings -->
            <ngb-tab title="Invoice Settings">
                <ng-template ngbTabContent>
                    <app-invoice-settings
                        [taxIdDescInput]="taxIdDescription"
                        [taxIdInput]="taxId"
                        [termInput]="term"
                        [conditionInput]="condition"
                        *ngIf="showTab == true && showTerm == true"
                    ></app-invoice-settings>
                </ng-template>
            </ngb-tab>
            <!-- Quotes Settings -->
            <ngb-tab title="Quotes settings">
                <ng-template ngbTabContent>
                    <app-quotes-settings></app-quotes-settings>
                </ng-template>
            </ngb-tab>
        </ngb-tabset>
    </div>
</div>
