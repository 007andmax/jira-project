        <div class="cmn-area">
            <div class="data-table-wrap">
                <table
                    class="display dataTable"
                    style="width:100%"
                >
                    <thead>
                        <tr>
                            <th class="checkboxes"></th>
                            <th class="tax-name">Income Account Number</th>
                            <th class="rate">Description</th>
                            <th class="action">&nbsp;</th>
                        </tr>
                    </thead>
                    <tbody *ngIf="numberList">
                        <add-gl-number
                            *ngIf="showAddGl"
                            (onClose)="toggleShowAddGL(false)"
                        ></add-gl-number>
                        <tr
                            *ngFor="let gl of numberList; let i = index"
                            appClickOtside
                            [init]="gl.isInitEdit"
                            [ngClass]="['edit-gl-container-' + i,  gl.isInitEdit ? 'edit-gl-container' : '']"
                            [class]="'.edit-gl-container-' + i"
                            (onOutSide)="onEditGl(gl)"
                        >
                            <td class="checkbox">
                                <label class="qt-checkbox">
                                    <input
                                        type="checkbox"
                                        (change)="onSelect($event,gl)"
                                    >
                                    <span></span>
                                </label>
                            </td>
                            <td class="tax-name">
                                <input
                                    type="text"
                                    class="form-input"
                                    placeholder="Enter GL Number"
                                    [(ngModel)]="gl.glNumber"
                                    (input)="gl.onInitEdit(true)"
                                    maxlength="50"
                                >
                            </td>
                            <td class="rate">
                                <input
                                    type="text"
                                    class="form-input"
                                    placeholder="Enter Description"
                                    [(ngModel)]="gl.description"
                                    (input)="gl.onInitEdit(true)"
                                    maxlength="50"
                                >
                            </td>
                            <td class="action">
                                <a
                                    href="javascript:;"
                                    data-tooltip="Remove"
                                    class="remove"
                                    (click)="removeConfirm(gl)"
                                >
                                    <img
                                        src="/html/assets/img/icons/remove.svg"
                                        alt="Remove"
                                    >
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- <div class="loading" *ngIf="loading"></div> -->
    </div>
</div>
<!-- tag delete popup -->
<div
    class="img-croparea deletePopup"
    *ngIf="popup"
>
    <div class="crop-inner">
        <div class="cropping">
            <div class="popup-message">
                <div class="message-right">
                    <h3>Remove Income Account Number</h3>
                    <p>Are you sure you want to delete?</p>
                </div>
                <a
                    class="close-ico"
                    href="javascript:;"
                    (click)="popup = false"
                >
                    <img
                        src="/html/assets/img/icons/close.svg"
                        alt="close"
                    >
                </a>
            </div>
            <div class="btn-crops">
                <button
                    type="button"
                    class="btn btn-primary"
                    (click)="removeGL()"
                >
                    Yes, I am sure
                </button>
                <button
                    type="button"
                    class="btn btn-secondary"
                    (click)="popup = false"
                >
                    Cancel
                </button>
            </div>
        </div>
    </div>
</div>
