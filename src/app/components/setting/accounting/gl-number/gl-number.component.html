<div class="page-insider manage-taxes">
  <div class="cmn-area">
    <div class="tab-pane__table">
      <div class="tab-pane__table-header">
        <div class="tab-pane__table-row">
          <div class="tab-pane__table-cell tab-pane__table-checkboxes">
            <label class="qt-checkbox">
              <input
                type="checkbox"
              >
              <span></span>
            </label>
          </div>
          <div class="tab-pane__table-cell gl-numbers__table-account-number">Income Account Number</div>
          <div class="tab-pane__table-cell gl-numbers__table-description">Description</div>
          <div class="tab-pane__table-cell gl-numbers__table-action"></div>
        </div>
      </div>
      <div class="tab-pane__table-body">
        <add-gl-number
          *ngIf="showAddGl"
          [numberList]="numberList"
          (onClose)="toggleShowAddGL(false)"
        ></add-gl-number>
        <div
          class="tab-pane__table-row"
          *ngFor="let gl of numberList; let i = index"
          appClickOtside
          [init]="gl.isInitEdit"
          [ngClass]="['edit-gl-container-' + i]"
          [class]="'.edit-gl-container-' + i"
          (onOutSide)="onEditGl(gl)"
        >
          <div class="tab-pane__table-cell tab-pane__table-checkboxes">
            <label class="qt-checkbox">
              <input
                type="checkbox"
                (change)="onSelect($event,gl)"
              >
              <span></span>
            </label>
          </div>
          <div
            class="tab-pane__table-cell gl-numbers__table-account-number"
            [ngClass]="{'--input-error' :  gl.disableUpdate  }"
          >
            <input
              type="text"
              class="form-input"
              placeholder="Enter GL Number"
              [(ngModel)]="gl.glNumber"
              appKeyUpEnter
              (onChange)="onEditGl(gl)"
              (input)="gl.onInitEdit(true);gl.checkDublicate(numberList)"
              maxlength="50"
            >
            <mat-error
              class="qt-tooltip-error"
              *ngIf="gl.disableUpdate"
            >
              This Gl Number is already occupied
            </mat-error>
          </div>
          <div class="tab-pane__table-cell gl-numbers__table-description">
            <input
              type="text"
              class="form-input"
              placeholder="Enter Description"
              [(ngModel)]="gl.description"
              (input)="gl.onInitEdit(true)"
              appKeyUpEnter
              (onChange)="onEditGl(gl)"
              maxlength="50"
            >
          </div>
          <div class="tab-pane__table-cell gl-numbers__table-action">
            <div
              href="javascript:;"
              data-tooltip="Remove"
              class="icon__new-remove qt-sz-20 qt-bg-contain pointer"
              (click)="removeConfirm(gl)"
            >
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
  <!-- <div class="loading" *ngIf="loading"></div> -->
</div>
