<div class="modal-content --tooltip toggle-area opened">
    <div class="modal-wrapper">
        <div class="toggle-header">
            <h6 class="qt-fw-600 qt-color-dark qt-mb-24">Add Tax</h6>
        </div>
        <div>
            <form
                [formGroup]="taxForm"
                (ngSubmit)="onSubmit()"
            >
                <div class="qt-input-block qt-mb-24">
                    <label class="qt-input-block__label">Tax Name</label>
                    <input
                        type="text"
                        class="form-input"
                        formControlName="name"
                        placeholder="Enter Tax Name"
                        (input)="isUniqueName($event.target.value)"
                        [ngClass]="{
                                    'is-invalid': submitted && f.name.errors
                                  }"
                    >
                    <div
                        *ngIf="submitted && f.name.errors"
                        class="invalid-feedback error-text-align"
                    >
                        <div *ngIf="f.name.errors.required">Name is required</div>
                        <div *ngIf="f.name.errors.minlength">Name is too short.</div>
                        <div *ngIf="f.name.errors.maxlength">Name is too long.</div>
                    </div>
                    <div
                        *ngIf="!unique"
                        class="invalid-feedback error-text-align"
                    >
                        Name is already taken.
                    </div>
                </div>
                <div class="qt-input-block qt-mb-24">
                    <label class="qt-input-block__label">Tax Rate (%)</label>
                    <input
                        type="text"
                        class="form-input"
                        formControlName="rate"
                        placeholder="Set Tax Rate"
                    >
                    <div
                        *ngIf="submitted && f.rate.errors"
                        class="invalid-feedback error-text-align"
                    >
                        <div *ngIf="f.rate.errors.required">Rate is required</div>
                        <div *ngIf="f.rate.errors.min">To small.</div>
                        <div *ngIf="f.rate.errors.max">To large.</div>
                    </div>
                </div>
                <div class="div">
                    <label
                        for="set-as"
                        class="qt-checkbox"
                    >
                        <input
                            type="checkbox"
                            id="set-as"
                            formControlName="isDefault"
                        >
                        <span></span>
                        <div class="qt-ml-8">Set as Default</div>
                    </label>
                </div>
                <div class="qt-df qt-w100 qt-mt-32">
                    <a
                        href="javascript:;"
                        class="qt-button --gray qt-jc-c qt-w100 qt-mr-12"
                        aria-label="Close"
                        (click)="closed()"
                    >
                        Cancel
                    </a>
                    <input
                        type="submit"
                        value="Save"
                        class="qt-button qt-jc-c qt-w100"
                    >
                </div>
            </form>
        </div>
    </div>
</div>
