<div class="page-container">
    <div class="page-insider manage-taxes">
        <div class="cmn-area">
            <div class="tab-pane__table dataTable">
                <div class="tab-pane__table-header">
                    <div class="tab-pane__table-row">
                        <div class="tab-pane__table-cell taxes-table__tax-name">Tax Name</div>
                        <div class="tab-pane__table-cell taxes-table__rate">Rate (%)</div>
                        <div class="tab-pane__table-cell taxes-table__set-default">Set as Default</div>
                        <div class="tab-pane__table-cell taxes-table__action"></div>
                    </div>
                </div>
                <div
                    class="tab-pane__table-body"
                    *ngIf="taxes"
                >
                    <div
                        class="tab-pane__table-row"
                        *ngFor="let tax of taxes; let i = index"
                    >
                        <div class="tab-pane__table-cell taxes-table__tax-name">{{ tax.name }}</div>
                        <div class="tab-pane__table-cell taxes-table__rate">{{ tax.rate }}%</div>
                        <div class="tab-pane__table-cell taxes-table__set-default">
                            <label
                                for="gmi{{ i }}"
                                class="qt-checkbox qt-ml-40"
                            >
                                <input
                                    type="checkbox"
                                    id="gmi{{ i }}"
                                    (change)="defaultTax(tax)"
                                    [checked]="tax.isDefault"
                                >
                                <span></span>
                            </label>
                        </div>
                        <div class="tab-pane__table-cell taxes-table__action qt-pos-rel">
                            <div class="qt-df qt-ai-c">
                                <app-dynamic-tooltip
                                    [content]="'Edit'"
                                    [position]="'top'"
                                    #editTooltip
                                ></app-dynamic-tooltip>
                                <div
                                    data-tooltip="Edit"
                                    (click)="openModel(false, i, tax)"
                                    class="qt-icon icon__edit qt-icon__gray-400 qt-sz-20 qt-bg-contain qt-mr-16 pointer"
                                    (mouseenter)="editTooltip.show($event.target)"
                                    (mouseleave)="editTooltip.hide()"
                                >
                                </div>
                                <app-dynamic-tooltip
                                    [content]="'Remove'"
                                    [position]="'top'"
                                    #removeTooltip
                                ></app-dynamic-tooltip>
                                <div
                                    class="icon__remove qt-sz-20 qt-bg-contain pointer"
                                    (click)="removeConfirm(tax)"
                                    (mouseenter)="removeTooltip.show($event.target)"
                                    (mouseleave)="removeTooltip.hide()"
                                >
                                </div>
                            </div>
                            <div
                                class="modal-content --tooltip toggle-area"
                                [ngClass]="{ opened: selectedIdx === i }"
                            >
                                <div class="modal-wrapper">
                                    <div class="toggle-header">
                                        <h6 class="qt-fw-600 qt-color-gray-900 qt-mb-24">Edit Tax</h6>
                                    </div>
                                    <div>
                                        <form
                                            [formGroup]="taxForm"
                                            (ngSubmit)="onSubmit()"
                                        >
                                            <div class="qt-input-block qt-mb-24">
                                                <label class="qt-input-block__label">Tax Name</label>
                                                <input
                                                    type="text"
                                                    class="form-input"
                                                    formControlName="name"
                                                    placeholder="Enter Tax Name"
                                                    (input)="isUniqueName($event.target.value)"
                                                    [ngClass]="{
                                    'is-invalid': submitted && f.name.errors
                                  }"
                                                >
                                                <div
                                                    *ngIf="submitted && f.name.errors"
                                                    class="invalid-feedback error-text-align"
                                                >
                                                    <div *ngIf="f.name.errors.required">Name is required</div>
                                                    <div *ngIf="f.name.errors.minlength">Name is too short.</div>
                                                    <div *ngIf="f.name.errors.maxlength">Name is too long.</div>
                                                </div>
                                                <div
                                                    *ngIf="!unique"
                                                    class="invalid-feedback error-text-align"
                                                >
                                                    Name is already taken.
                                                </div>
                                            </div>
                                            <div class="qt-input-block qt-mb-24">
                                                <label class="qt-input-block__label">Tax Rate (%)</label>
                                                <input
                                                    type="text"
                                                    class="form-input"
                                                    formControlName="rate"
                                                    placeholder="Set Tax Rate"
                                                >
                                                <div
                                                    *ngIf="submitted && f.rate.errors"
                                                    class="invalid-feedback error-text-align"
                                                >
                                                    <div *ngIf="f.rate.errors.required">Rate is required</div>
                                                    <div *ngIf="f.rate.errors.min">To small.</div>
                                                    <div *ngIf="f.rate.errors.max">To large.</div>
                                                </div>
                                            </div>
                                            <div class="div">
                                                <label
                                                    for="set-as{{ i }}"
                                                    class="qt-checkbox"
                                                >
                                                    <input
                                                        type="checkbox"
                                                        id="set-as{{ i }}"
                                                        formControlName="isDefault"
                                                    >
                                                    <span></span>
                                                    <div class="qt-ml-8">Set as Default</div>
                                                </label>
                                            </div>
                                            <div class="qt-df qt-w100 qt-mt-32">
                                                <a
                                                    href="javascript:;"
                                                    class="qt-button --gray qt-jc-c qt-w100 qt-mr-12"
                                                    aria-label="Close"
                                                    (click)="selectedIdx = -1"
                                                >
                                                    Cancel
                                                </a>
                                                <input
                                                    type="submit"
                                                    value="Save"
                                                    class="qt-button qt-jc-c qt-w100"
                                                >
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
