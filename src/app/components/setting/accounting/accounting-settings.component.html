<div class="page-container app-invoice-tickets-page-container">
    <div class="page-insider invoice-ticket">
        <div class="heading qt-df qt-ai-fs qt-jc-sb">
            <h5 class="qt-fw-600">Finance</h5>
            <div class="qt-df">
                <a
                    href="javascript:;"
                    class="qt-button qt-ml-24 --md"
                    (click)="onSubmit()"
                    *ngIf="activeTab !== 'gLNumbers' && activeTab !== 'taxes' && activeTab !== 'notes'"
                >
                    Save Changes
                </a>
                <div class="qt-df qt-pos-rel">
                    <a
                        href="javascript:;"
                        class="qt-button --md --gray button-gl-number__delete qt-ml-12 pointer"
                        *ngIf="getSelectedCount() > 0"
                        (click)="removeGls()"
                    >
                        <div class="qt-icon icon__delete qt-sz-16 qt-bg-contain qt-ic-c qt-button-icon"></div>
                    </a>
                    <a
                        href="javascript:;"
                        class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                        (click)="create()"
                        *ngIf="activeTab === 'gLNumbers'"
                    >
                        <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-8 qt-button-icon"></span>
                        Add GL Number
                    </a>
                    <a
                        href="javascript:;"
                        class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                        (click)="toggleAddTax = !toggleAddTax"
                        *ngIf="activeTab === 'taxes'"
                    >
                        <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-8 qt-button-icon"></span>
                        Add Tax
                    </a>
                    <a
                        href="javascript:;"
                        class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                        (click)="addCustomeNote()"
                        *ngIf="activeTab === 'notes'"
                    >
                        <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-8 qt-button-icon"></span>
                        Create Note
                    </a>
                    <taxes-add
                        *ngIf="toggleAddTax"
                        (onClose)="toggleAddTax = false"
                    ></taxes-add>
                </div>
            </div>
        </div>
        <ul
            ngbNav
            #nav="ngbNav"
            (navChange)="setTab($event)"
            class="nav-tabs"
            [(activeId)]="activeTab"
            [ngClass]="{'clear-padding':activeTab === 'gLNumbers'}"
        >
            <li
                [ngbNavItem]="'invoiceSettings'"
                [destroyOnHide]="true"
            >
                <a ngbNavLink>Invoice Settings</a>
                <ng-template ngbNavContent>
                    <app-invoice-settings #invoiceSettings></app-invoice-settings>
                </ng-template>
            </li>
            <li
                [ngbNavItem]="'quoteSettings'"
                [destroyOnHide]="true"
            >
                <a ngbNavLink>Quote settings</a>
                <ng-template ngbNavContent>
                    <app-quotes-settings #quotesSettings></app-quotes-settings>
                </ng-template>
            </li>
            <li
                [ngbNavItem]="'gLNumbers'"
                [destroyOnHide]="true"
            >
                <a ngbNavLink>GL Numbers</a>
                <ng-template ngbNavContent>
                    <app-gl-number-settings #glNumber></app-gl-number-settings>
                </ng-template>
            </li>
            <li
                [ngbNavItem]="'accountingYear'"
                [destroyOnHide]="true"
            >
                <a ngbNavLink>Accounting Year</a>
                <ng-template ngbNavContent>
                    <accounting-year #accountingYear></accounting-year>
                </ng-template>
            </li>
            <li
                [ngbNavItem]="'taxes'"
                [destroyOnHide]="true"
                *ngIf="getPermissions('VIEW_TAXES_SETTINGS')"
            >
                <a ngbNavLink>Taxes</a>
                <ng-template ngbNavContent>
                    <app-taxes-settings #taxesSettings></app-taxes-settings>
                </ng-template>
            </li>
            <li
                [ngbNavItem]="'notes'"
                [destroyOnHide]="true"
            >
                <a ngbNavLink>Custom notes</a>
                <ng-template ngbNavContent>
                    <custom-notes-settings #customNotes></custom-notes-settings>
                </ng-template>
            </li>
        </ul>
        <div
            [ngbNavOutlet]="nav"
            class="mt-2"
        ></div>
    </div>
</div>
