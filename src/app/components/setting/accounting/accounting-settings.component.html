<div class="page-container app-invoice-tickets-page-container">
    <div class="page-insider invoice-ticket">
        <div class="heading qt-df qt-ai-fs qt-jc-sb">
            <h5 class="qt-fw-600">Finance</h5>
            <div class="qt-df">
                <a
                    href="javascript:;"
                    class="qt-button qt-ml-24 --md"
                    (click)="onSubmit()"
                    *ngIf="activeTab !== 'gLNumbers' && activeTab !== 'taxes' && activeTab !== 'notes'"
                >
                    Save Changes
                </a>
                <div class="qt-df qt-pos-rel">
                    <a
                        href="javascript:;"
                        class="qt-button --md --gray button-gl-number__delete qt-ml-12 pointer"
                        *ngIf="getSelectedCount() > 0"
                        (click)="removeGls()"
                    >
                        <div class="icon__remove qt-sz-16 qt-bg-contain qt-ic-c qt-button-icon"></div>
                    </a>
                    <a
                        href="javascript:;"
                        class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                        (click)="create()"
                        *ngIf="activeTab === 'gLNumbers'"
                    >
                        <span class="icon__add--grey-500 qt-sz-16 qt-bg-contain qt-dib qt-mr-8 qt-button-icon"></span>
                        Add GL Number
                    </a>
                    <a
                        href="javascript:;"
                        class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                        (click)="toggleAddTax = !toggleAddTax"
                        *ngIf="activeTab === 'taxes'"
                    >
                        <span class="icon__add--grey-500 qt-sz-16 qt-bg-contain qt-dib qt-mr-8 qt-button-icon"></span>
                        Add Tax
                    </a>
                    <a
                        href="javascript:;"
                        class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                        (click)="addCustomeNote()"
                        *ngIf="activeTab === 'notes'"
                    >
                        <span class="icon__add--grey-500 qt-sz-16 qt-bg-contain qt-dib qt-mr-8 qt-button-icon"></span>
                        Create Note
                    </a>
                    <taxes-add
                        *ngIf="toggleAddTax"
                        (onClose)="toggleAddTax = false"
                    ></taxes-add>
                </div>
            </div>
        </div>
        <ngb-tabset
            (tabChange)="setTab($event)"
            [destroyOnHide]="true"
            [ngClass]="{'clear-padding':activeTab === 'gLNumbers'}"
        >
            <!-- Invoice Settings -->
            <ngb-tab
                title="Invoice Settings"
                id="invoiceSettings"
            >
                <ng-template ngbTabContent>
                    <app-invoice-settings #invoiceSettings></app-invoice-settings>
                </ng-template>
            </ngb-tab>
            <!-- Quotes Settings -->
            <ngb-tab
                title="Quote settings"
                id="quoteSettings"
            >
                <ng-template ngbTabContent>
                    <app-quotes-settings #quotesSettings></app-quotes-settings>
                </ng-template>
            </ngb-tab>
            <ngb-tab
                title="GL Numbers"
                id="gLNumbers"
            >
                <ng-template ngbTabContent>
                    <app-gl-number-settings #glNumber></app-gl-number-settings>
                </ng-template>
            </ngb-tab>
            <ngb-tab
                title="Accounting Year"
                id="accountingYear"
            >
                <ng-template ngbTabContent>
                    <accounting-year #accountingYear></accounting-year>
                </ng-template>
            </ngb-tab>
            <ngb-tab
                title="Taxes"
                id="taxes"
                *ngIf="getPermissions('VIEW_TAXES_SETTINGS')"
            >
                <ng-template ngbTabContent>
                    <app-taxes-settings #taxesSettings></app-taxes-settings>
                </ng-template>
            </ngb-tab>
            <ngb-tab
                title="Custom notes"
                id="notes"
            >
                <ng-template ngbTabContent>
                    <custom-notes-settings #customNotes></custom-notes-settings>
                </ng-template>
            </ngb-tab>
        </ngb-tabset>
    </div>
</div>
