<div
    class="cmn-area invoice"
    [hidden]="loading"
>
    <div class="tab-pane__header">
        <div class="tab-pane__header-title">Quote Settings</div>
    </div>
    <div class="tab-pane__body">
        <form
            [formGroup]="quotesForm"
            (ngSubmit)="onSubmit()"
        >
            <div class="tab-pane__row">
                <div class="tab-pane__subtitle">Starting Quote Number</div>
                <div class="tab-pane-input__row">
                    <div class="qt-input-block qt-input-block-100">
                        <input
                            type="text"
                            formControlName="count"
                            class="form-input"
                            [ngClass]="{ 'is-invalid': submitted && f.count.errors }"
                            placeholder="Enter Starting ticket number"
                            maxlength="7"
                        >
                        <div
                            *ngIf="submitted && f.count.errors"
                            class="invalid-feedback --pos-static"
                        >
                            <div *ngIf="f.count.errors.required">Quote number is required</div>
                            <div *ngIf="f.count.errors.pattern">Only Number is allowed</div>
                        </div>
                    </div>
                    <div class="qt-input-help-text qt-mt-12">Maximum 7 Number</div>
                </div>
            </div>
        </form>
    </div>
</div>
<div
    class="loading-container"
    *ngIf="loading"
>
    <div class="loading"></div>
</div>
