<!-- Middle Wrapper -->
<div class="page-container">
    <div class="page-insider email-insider">
        <div class="heading qt-df qt-ai-fs qt-jc-sb">
            <h5 class="qt-fw-600">Email Settings</h5>
            <div
                class="qt-button qt-ml-24 --md"
                (click)="onSubmit()"
            >
                Save Changes
            </div>
        </div>
        <ngb-tabset>
            <!-- Profile -->
            <ngb-tab
                title="Incoming Email"
                id="tab1"
            >
                <ng-template ngbTabContent>
                    <app-incoming-email
                        #incomingEmail
                        [smtpSettingsInput]="smtpSettings"
                        [supportMailBoxInput]="supportMailBox"
                        *ngIf="showIn == true"
                    ></app-incoming-email>
                </ng-template>
            </ngb-tab>
            <!-- Account -->
            <ngb-tab title="Outgoing Email">
                <ng-template ngbTabContent>
                    <app-outgoing-email
                        #outgoingEmail
                        [smtpInput]="smtp"
                        [supportMailBoxInput]="supportMailBox"
                        [testEmailInput]="smtp.testEmail"
                        [savedSMTPSettingsInput]="savedSMTPSettings"
                        [portIsEmptyInput]="portIsEmpty"
                        [usedEmailViaInput]="usedEmailVia"
                        *ngIf="showIn == true"
                    ></app-outgoing-email>
                </ng-template>
            </ngb-tab>
        </ngb-tabset>
    </div>
</div>
