<div class="page-container">
    <div class="page-insider email-insider">
        <div class="heading qt-df qt-ai-fs qt-jc-sb">
            <h5 class="qt-fw-600">Email Settings</h5>
            <a
                href="javascript:;"
                class="qt-button qt-ml-24 --md"
                (click)="onSubmit()"
            >
                Save Changes
            </a>
        </div>
        <ul
            ngbNav
            #nav="ngbNav"
            class="nav-tabs"
        >
            <li [ngbNavItem]="'tab1'">
                <a ngbNavLink>Incoming Email</a>
                <ng-template ngbNavContent>
                    <app-incoming-email
                        #incomingEmail
                        [smtpSettingsInput]="smtpSettings"
                        [supportMailBoxInput]="supportMailBox"
                        *ngIf="showIn == true"
                    ></app-incoming-email>
                </ng-template>
            </li>
            <li [ngbNavItem]="'tab2'">
                <a ngbNavLink>Outgoing Email</a>
                <ng-template ngbNavContent>
                    <app-outgoing-email
                        #outgoingEmail
                        [smtpInput]="smtp"
                        [supportMailBoxInput]="supportMailBox"
                        [testEmailInput]="smtp.testEmail"
                        [savedSMTPSettingsInput]="savedSMTPSettings"
                        [portIsEmptyInput]="portIsEmpty"
                        [usedEmailViaInput]="usedEmailVia"
                        *ngIf="showIn == true"
                    ></app-outgoing-email>
                </ng-template>
            </li>
        </ul>
        <div
            [ngbNavOutlet]="nav"
            class="mt-2"
        ></div>
    </div>
</div>
