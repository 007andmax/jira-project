<div class="cmn-area service">
    <div class="tab-pane__table border-bottom dataTable">
        <div class="tab-pane__table-header">
            <div class="tab-pane__table-row">
                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                    <label class="qt-checkbox">
                        <input type="checkbox">
                        <span></span>
                    </label>
                </div>
                <div
                    class="tab-pane__table-cell commissions-service__service-name pointer"
                    (click)="onFilter('name')"
                >
                    Service Name
                    <div class="qt-table-modern__sorting--new"></div>
                </div>
                <div class="tab-pane__table-cell commissions-service__rate">Commission Rate (%)</div>
                <div class="tab-pane__table-cell commissions-service__action"></div>
            </div>
        </div>
        <div
            class="tab-pane__table-body"
            *ngIf="services"
        >
            <div
                class="tab-pane__table-row"
                *ngFor="
              let service of services;
              trackBy: service?.name;
              let i = index
            "
            >
                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                    <label class="qt-checkbox">
                        <input type="checkbox">
                        <span></span>
                    </label>
                </div>
                <div class="tab-pane__table-cell commissions-service__service-name">{{ service.name }}</div>
                <div class="tab-pane__table-cell commissions-service__rate">{{ service.commissionRate }}</div>
                <div class="tab-pane__table-cell commissions-service__action qt-pos-rel">
                    <div class="qt-df">
                        <div
                            placement="top"
                            ngbTooltip="Edit"
                            class="icon__edit-gray-dark qt-sz-20 qt-mr-16 qt-bg-contain pointer"
                            (click)="editService(i)"
                        >
                        </div>
                        <div
                            placement="top"
                            ngbTooltip="Remove"
                            class="icon__remove qt-sz-20 qt-bg-contain pointer"
                            (click)="confirmServiceDelete(i, service, false)"
                        >
                        </div>
                    </div>
                    <div
                        class="modal-content --tooltip toggle-area"
                        [ngClass]="{ opened: selectedIdx === i }"
                    >
                        <div class="modal-wrapper">
                            <div class="toggle-header">
                                <h6 class="qt-fw-600 qt-color-dark qt-mb-24">Edit Rate</h6>
                            </div>
                            <div class>
                                <form method="POST">
                                    <div class="qt-input-block qt-mb-32">
                                        <label class="qt-input-block__label">Commission Rate (%)</label>
                                        <input
                                            type="text"
                                            class="form-input"
                                            name="commissionRate"
                                            autocomplete="off"
                                            #commissionRate
                                            value="{{ service.commissionRate }}"
                                            placeholder="Enter Commission Rate"
                                        >
                                    </div>
                                    <div class="qt-df qt-w100">
                                        <a
                                            href="javascript:;"
                                            class="qt-button --gray qt-jc-c qt-w100 qt-mr-12"
                                            aria-label="Close"
                                            (click)="selectedIdx = -1"
                                        >
                                            Cancel
                                        </a>
                                        <input
                                            type="submit"
                                            (click)="
                              confirmServiceEdit(
                                  commissionRate.value,
                                  service.versionedId.id,
                                  service,
                                  false
                                )
                              "
                                            value="Save"
                                            class="qt-button qt-jc-c qt-w100"
                                        >
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="tab-pane__table dataTable">
        <div class="tab-pane__table-header">
            <div class="tab-pane__table-row">
                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                    <label class="qt-checkbox">
                        <input type="checkbox">
                        <span></span>
                    </label>
                </div>
                <div
                    class="tab-pane__table-cell commissions-service__service-name pointer"
                    (click)="onFilterSpecial('name')"
                >
                    Service Name
                    <div class="qt-table-modern__sorting--new"></div>
                </div>
                <div class="tab-pane__table-cell commissions-service__rate">Commission Rate (%)</div>
                <div class="tab-pane__table-cell commissions-service__action"></div>
            </div>
        </div>
        <div
            class="tab-pane__table-body"
            *ngIf="specialService"
        >
            <div
                class="tab-pane__table-row"
                *ngFor="
          let service of specialService;
          trackBy: service?.name;
          let i = index
        "
            >
                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                    <label class="qt-checkbox">
                        <input type="checkbox">
                        <span></span>
                    </label>
                </div>
                <div class="tab-pane__table-cell commissions-service__service-name ">{{ service.name }}</div>
                <div class="tab-pane__table-cell commissions-service__rate">{{ service.commissionRate }}</div>
                <div class="tab-pane__table-cell commissions-service__action qt-pos-rel">
                    <div class="qt-df">
                        <div
                            placement="top"
                            ngbTooltip="Edit"
                            class="icon__edit-gray-dark qt-sz-20 qt-mr-16 qt-bg-contain pointer"
                            (click)="editSpecService(i)"
                        >
                        </div>
                        <div
                            placement="top"
                            ngbTooltip="Remove"
                            class="icon__remove qt-sz-20 qt-bg-contain pointer"
                            (click)="removeServiceRate()"
                        >
                        </div>
                    </div>
                    <!-- Edit create Tags -->
                    <div
                        class="modal-content --tooltip toggle-area"
                        [ngClass]="{ opened: selectedSpecIdx === i }"
                    >
                        <div class="modal-wrapper">
                            <div class="toggle-header">
                                <h6 class="qt-fw-600 qt-color-dark qt-mb-24">Edit Rate</h6>
                            </div>
                            <div class>
                                <form method="POST">
                                    <div class="qt-input-block qt-mb-32">
                                        <label class="qt-input-block__label">Commission Rate (%)</label>
                                        <input
                                            type="text"
                                            class="form-input"
                                            name="commissionRate"
                                            autocomplete="off"
                                            #commissionRate
                                            value="{{ service.commissionRate }}"
                                            placeholder="Enter Commission Rate"
                                        >
                                    </div>
                                    <div class="m-btn-row">
                                        <div class="qt-df qt-w100">
                                            <a
                                                href="javascript:;"
                                                class="qt-button --gray qt-jc-c qt-w100 qt-mr-12"
                                                aria-label="Close"
                                                (click)="selectedSpecIdx = -1"
                                            >
                                                Cancel
                                            </a>
                                            <input
                                                type="submit"
                                                (click)="
                              confirmServiceEdit(
                                  commissionRate.value,
                                  service.id,
                                  service,
                                  true
                                )
                              "
                                                value="Save"
                                                class="qt-button qt-jc-c qt-w100"
                                            >
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div
    class="img-croparea deletePopup"
    *ngIf="confirmServicePopup"
>
    <div class="crop-inner">
        <div class="cropping">
            <div class="popup-message">
                <div class="message-right">
                    <p>
                        Do you want this commission to fact old items?
                    </p>
                </div>
                <a
                    class="close-ico"
                    href="javascript:;"
                    (click)="factItem = false;confirmServicePopup = false;setServiceRate()"
                >
                    <img
                        src="/html/assets/img/icons/close.svg"
                        alt="close"
                    >
                </a>
            </div>
            <div class="btn-crops">
                <button
                    type="button"
                    class="btn btn-primary"
                    (click)="factItem = true;confirmServicePopup = false;setServiceRate()"
                >
                    Yes, I want
                </button>
                <button
                    type="button"
                    class="btn btn-secondary"
                    (click)="factItem = false;confirmServicePopup = false;setServiceRate()"
                >
                    Cancel
                </button>
            </div>
        </div>
    </div>
</div>
