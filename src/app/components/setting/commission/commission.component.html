<div class="page-container commision-container">
    <div class="page-insider commision">
        <div class="heading">
            <h5 class="qt-fw-600">Commissions</h5>
        </div>
        <ul
            ngbNav
            #nav="ngbNav"
            class="nav-tabs"
        >
            <li [ngbNavItem]="'tab1'">
                <a ngbNavLink>Companies’s Sales Person</a>
                <ng-template ngbNavContent>
                    <app-company-commission></app-company-commission>
                </ng-template>
            </li>
            <li [ngbNavItem]="'tab2'">
                <a ngbNavLink>Product</a>
                <ng-template ngbNavContent>
                    <app-product></app-product>
                </ng-template>
            </li>
            <li [ngbNavItem]="'tab3'">
                <a ngbNavLink>Contract</a>
                <ng-template ngbNavContent>
                    <app-contract></app-contract>
                </ng-template>
            </li>
            <li [ngbNavItem]="'tab4'">
                <a ngbNavLink>Service</a>
                <ng-template ngbNavContent>
                    <app-service></app-service>
                </ng-template>
            </li>
        </ul>
        <div
            [ngbNavOutlet]="nav"
            class="mt-2"
        ></div>
    </div>
</div>
