<div
    class="cmn-area products-area"
    [hidden]="loading"
>
    <div class="tab-pane__table dataTable">
        <div class="tab-pane__table-header">
            <div class="tab-pane__table-row">
                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                    <label class="qt-checkbox">
                        <input type="checkbox">
                        <span></span>
                    </label>
                </div>
                <div
                    class="tab-pane__table-cell commissions-product__company-name pointer"
                    (click)="onFilter('name')"
                >
                    Product Name
                    <div class="qt-table-modern__sorting--new"></div>
                </div>
                <div class="tab-pane__table-cell commissions-product__rate">Commission Rate (%)</div>
                <div class="tab-pane__table-cell commissions-product__action"></div>
            </div>
        </div>
        <div
            class="tab-pane__table-body"
            *ngIf="categories"
        >
            <div
                class="tab-pane__table-row"
                *ngFor="let category of categories;trackBy:category?.name; let i = index"
            >
                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                    <label class="qt-checkbox">
                        <input type="checkbox">
                        <span></span>
                    </label>
                </div>
                <div class="tab-pane__table-cell commissions-product__company-name">{{ category.name }}</div>
                <div class="tab-pane__table-cell commissions-product__rate">{{ category.commissionRate }}</div>
                <div class="tab-pane__table-cell commissions-product__action qt-pos-rel">
                    <div class="qt-df">
                        <div
                            placement="top"
                            ngbTooltip="Edit"
                            class="qt-icon icon__edit qt-icon__gray-400 qt-sz-20 qt-bg-contain qt-mr-16 pointer"
                            (click)="editProduct(i)"
                        >
                        </div>
                        <div
                            placement="top"
                            ngbTooltip="Remove"
                            class="qt-icon icon__delete qt-sz-20 qt-bg-contain pointer"
                            (click)="confirmDelete(category)"
                            *ngIf="category.commissionRate"
                        >
                        </div>
                    </div>
                    <div
                        class="modal-content --tooltip toggle-area"
                        [ngClass]="{'opened': selectedIdx === i}"
                    >
                        <div class>
                            <div class="toggle-header">
                                <h6 class="qt-fw-600 qt-color-gray-900 qt-mb-24">Edit Commission Rate</h6>
                            </div>
                            <div>
                                <div class="qt-input-block qt-mb-32">
                                    <label class="qt-input-block__label">Commission Rate (%)</label>
                                    <input
                                        type="text"
                                        class="form-input"
                                        name="commissionRate"
                                        autocomplete="off"
                                        #commissionRate
                                        value="{{category.commissionRate}}"
                                        step="0.01"
                                        placeholder="Enter Commission Rate"
                                    >
                                </div>
                                <div class="qt-df qt-w100">
                                    <a
                                        href="javascript:;"
                                        class="qt-button --gray qt-jc-c qt-w100 qt-mr-12"
                                        aria-label="Close"
                                        (click)="selectedIdx = -1"
                                    >
                                        Cancel
                                    </a>
                                    <input
                                        type="button"
                                        (click)="confirmEdit(commissionRate.value,category.id,category)"
                                        value="Save"
                                        class="qt-button qt-jc-c qt-w100"
                                    >
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div
    class="loading-container"
    *ngIf="loading"
>
    <div class="loading"></div>
</div>
