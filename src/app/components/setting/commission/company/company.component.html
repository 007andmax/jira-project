<div class="cmn-area companies">
    <div class="data-table-wrap">
        <table
            class="display dataTable"
            style="width:100%"
        >
            <thead>
                <tr>
                    <th class="c-name">Company</th>
                    <th class="address">Address</th>
                    <th class="sp">Sales Person</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let company of clientsCompanies; let i = index">
                    <td class="c-name">
                        <div class="c-info">
                            <span class="c-logo">{{ displayFrstLstChar(company.name) }}</span>
                            <h5>{{ company.name }}</h5>
                        </div>
                    </td>
                    <td class="address">
                        {{
              company.companyInfo.addresses[0]
                .addressWithSuitNumberAndPostalCode
            }}
            {{ getClinetUrl(company) }}
                    </td>
                    <td class="sp">
                        <app-teh-users
                            [users]="activeTechUsers"
                            [editMode]="true"
                            [type]="'COMPANY_SETTINGS'"
                            [selectedMode]="'SINGLE'"
                            [editUsers]="selectedActiveTechUsers(company, i)"
                            (usersChange)="setTechLead($event,company)"
                        ></app-teh-users>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
