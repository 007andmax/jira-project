<!-- Message -->
<div class="heading qt-df qt-ai-fs qt-jc-sb">
    <h5 class="qt-fw-600">My Profile Settings</h5>
    <a
        href="javascript:;"
        class="qt-button qt-ml-24 --md"
        (click)="onSubmit()"
        *ngIf="activeTab !== 'history' && activeTab !== 'signature'"
    >
        Save Changes
    </a>
    <div
        class="qt-df qt-h36"
        *ngIf="activeTab == 'history'"
    ></div>
</div>
<ul
    ngbNav
    #nav="ngbNav"
    [(activeId)]="activeTab"
    class="nav-tabs"
    (navChange)="setTab($event)"
>
    <!-- Profile -->
    <li [ngbNavItem]="'profile'">
        <a ngbNavLink>Profile</a>
        <ng-template ngbNavContent>
            <app-profile #profile></app-profile>
        </ng-template>
    </li>
    <li [ngbNavItem]="'account'">
        <a ngbNavLink>Account</a>
        <ng-template ngbNavContent>
            <app-account #account></app-account>
        </ng-template>
    </li>
    <!-- Account -->
    <li
        [ngbNavItem]="'notifications'"
        *ngIf="!customerPortalStateService.isCustomerPortal"
    >
        <a ngbNavLink>Email Notifications</a>
        <ng-template ngbNavContent>
            <app-email-notifications #emailNotifications></app-email-notifications>
        </ng-template>
    </li>
    <!-- Email -->
    <li
        [ngbNavItem]="'history'"
        class="history"
    >
        <a ngbNavLink>Activity History</a>
        <ng-template ngbNavContent>
            <app-activity-history #activityHistory></app-activity-history>
        </ng-template>
    </li>
    <!-- Activity History -->
    <li
        [ngbNavItem]="'signature'"
        class="history"
        *ngIf="!customerPortalStateService.isCustomerPortal"
    >
        <a ngbNavLink>Signature</a>
        <ng-template ngbNavContent>
            <signature #signature></signature>
        </ng-template>
    </li>
    <li
        [ngbNavItem]="'tickets'"
        class="history"
        *ngIf="!customerPortalStateService.isCustomerPortal"
    >
        <a ngbNavLink>Tickets</a>
        <ng-template ngbNavContent>
            <tickets-my-profile #tickets></tickets-my-profile>
        </ng-template>
    </li>
</ul>
<div
    [ngbNavOutlet]="nav"
    class="mt-2"
></div>
