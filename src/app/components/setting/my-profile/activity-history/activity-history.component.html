<div class="cmn-area hs-area">
    <div class="tab-pane__header">
        <div class="tab-pane__header-title">Activity History</div>
    </div>
    <div class="tab-pane__body">
        <div class="tab-pane__row map-area">
            <div class="qt-w100">
                <agm-map
                    [latitude]="selectedDevice.latitude"
                    [longitude]="selectedDevice.longitude"
                    [mapTypeControl]='true'
                    [zoom]="15"
                    [title]="(selectedDevice.city ? selectedDevice.city + ', ' : '') + selectedDevice.country "
                >
                    <agm-marker
                        [latitude]="selectedDevice.latitude"
                        [longitude]="selectedDevice.longitude"
                    ></agm-marker>
                </agm-map>
            </div>
        </div>
        <div class="activity-history__table">
            <div class="activity-history__table-header">
                <div class="tab-pane__row">
                    <div class="activity-history__cell activity-history__cell-access-detail">Access Detail</div>
                    <div class="activity-history__cell activity-history__cell-last-seen">Last Seen</div>
                    <div class="activity-history__cell activity-history__cell-menu"></div>
                </div>
            </div>
            <div class="activity-history__table-body">
                <div
                    *ngFor="let device of activityHistory"
                    (click)="selectDevice(device)"
                    class="tab-pane__row {'selected': selectedDevice.id === device.id}"
                >
                    <div class="activity-history__cell activity-history__cell-access-detail qt-df qt-pr-15">
                        <div class="icon__google-chrome qt-sz-24 qt-bg-contain qt-mr-12 qt-fs-0"></div>
                        <!-- <div class="icon__safari qt-sz-24 qt-bg-contain qt-mr-12 qt-fs-0"></div> -->
                        <!-- <div class="icon__firefox qt-sz-24 qt-bg-contain qt-mr-12 qt-fs-0"></div> -->
                        <!-- <div class="icon__opera qt-sz-24 qt-bg-contain qt-mr-12 qt-fs-0"></div> -->
                        {{device.browserName}}, {{device.osName}} ({{device.city ? device.city + ',' : ''}}
            {{device.country}} {{device.ipAddress}})
                    </div>
                    <div class="activity-history__cell activity-history__cell-last-seen qt-pr-15">
                        {{device.current ? 'now' : (device.lastAccessDate | date) }}
                    </div>
                    <div class="activity-history__cell activity-history__cell-menu qt-df">
                        <a
                            href="javascript:;"
                            (click)="closeSession(device)"
                            placement="top"
                            ngbTooltip="Remove"
                        >
                            <img
                                src="html/assets/img/icons/new-remove.svg"
                                alt="Remove"
                            >
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
