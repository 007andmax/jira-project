<div class="modal-content --tooltip toggle-area opened">
    <div class>
        <div class="toggle-header">
            <h6 class="qt-fw-600 qt-color-dark qt-mb-24">Create Signature</h6>
        </div>
        <div class>
            <angular-editor
                [(ngModel)]="messageContent"
                [config]="editorConfig"
            ></angular-editor>
            <div class="qt-df qt-w100">
                <a
                    href="javascript:;"
                    class="qt-button --gray qt-jc-c qt-w100 qt-mr-12"
                    aria-label="Close"
                    (click)="selectedIdx = -1"
                >
                    Cancel
                </a>
                <input
                    type="submit"
                    (click)="confirmEdit(commissionRate.value,category.id,category)"
                    value="Save"
                    class="qt-button qt-jc-c qt-w100"
                >
            </div>
        </div>
    </div>
</div>
