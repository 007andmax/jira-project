<div class="cmn-area email-note">
    <div class="tab-pane__header">
        <div class="tab-pane__header-title">Email Notifications</div>
    </div>
    <div class="tab-pane__body">
        <div class="tab-pane__row">
            <div class="tab-pane__subtitle">Send me email notifications for:</div>
            <div class="tab-pane-input__row">
                <form
                    class="email-note-wrape"
                    (ngSubmit)="onSubmit()"
                    #emailForm="ngForm"
                    *ngIf="emailNotifications"
                >
                    <label class="qt-checkbox qt-mb-16">
                        <input
                            type="checkbox"
                            id="newDevice"
                            [(ngModel)]="emailNotifications.newDevice"
                            name="newDevice"
                            #newDevice1="ngModel"
                        >
                        <span></span>
                        <div class="qt-ml-8 qt-color-gray-900">
                            When my account is logged in from a new device
                        </div>
                    </label>
                    <label class="qt-checkbox qt-mb-16">
                        <input
                            type="checkbox"
                            id="ticketCreated"
                            [(ngModel)]="emailNotifications.ticketCreated"
                            name="ticketCreated"
                            #ticketCreated="ngModel"
                        >
                        <span></span>
                        <div class="qt-ml-8 qt-color-gray-900">When a New Ticket created</div>
                    </label>
                    <label class="qt-checkbox qt-mb-16">
                        <input
                            id="my"
                            type="checkbox"
                            [(ngModel)]="emailNotifications.myTicketUpdated"
                            name="myTicketUpdated"
                            #myTicketUpdated="ngModel"
                        >
                        <span></span>
                        <div class="qt-ml-8 qt-color-gray-900">
                            When a ticket that is assigned to me is updated
                        </div>
                    </label>
                    <label class="qt-checkbox">
                        <input
                            id="ticket"
                            type="checkbox"
                            [(ngModel)]="emailNotifications.ticketCloseNotifications"
                            name="ticketCloseNotifications"
                            #ticketCloseNotifications="ngModel"
                        >
                        <span></span>
                        <div class="qt-ml-8 qt-color-gray-900">When any ticket is closed</div>
                    </label>
                </form>
            </div>
        </div>
    </div>
</div>
