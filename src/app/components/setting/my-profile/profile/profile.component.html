    <form [formGroup]="profileForm">
      <div class="tab-pane__row">
        <label class="tab-pane__subtitle">First Name</label>
        <div class="tab-pane-input__row">
          <div class="qt-input-block qt-mr-24">
            <input
              type="text"
              placeholder="Enter Your First Name"
              formControlName="firstName"
            >
            <div
              *ngIf="submitted && f.firstName.errors"
              class="invalid-feedback"
            >
              <div *ngIf="f.firstName.errors.required">Full Name is required</div>
              <div *ngIf="f.firstName.errors.minlength">First name is too short.</div>
              <div *ngIf="f.firstName.errors.maxlength">First name is too large.</div>
            </div>
          </div>
          <div class="qt-input-block">
            <input
              type="text"
              placeholder="Enter Your Last Name"
              formControlName="lastName"
            >
            <div
              *ngIf="submitted && f.lastName.errors"
              class="invalid-feedback"
            >
              <div *ngIf="f.lastName.errors.required">Last Name is required</div>
              <div *ngIf="f.lastName.errors.minlength">Last name is too short.</div>
              <div *ngIf="f.lastName.errors.maxlength">Last name is too large.</div>
            </div>
          </div>
        </div>
      </div>
      <div class="tab-pane__row">
        <label class="tab-pane__subtitle">Email Address</label>
        <div class="qt-input-block">
          <input
            type="email"
            placeholder="Enter Your Email Address"
            (blur)="isEmailUnique()"
            formControlName="primaryEmail"
          >
          <div
            *ngIf="submitted && f.primaryEmail.errors"
            class="invalid-feedback"
          >
            <div *ngIf="f.primaryEmail.errors.required && uniqueEmail">Email is required</div>
            <div *ngIf="f.primaryEmail.errors.pattern && uniqueEmail">Email must be a valid email address</div>
          </div>
          <label
            *ngIf="!uniqueEmail"
            class="invalid-feedback"
          >
            This email already occupied.
          </label>
        </div>
      </div>
      <div class="tab-pane__row">
        <label class="tab-pane__subtitle">Role</label>
        <div class="qt-input-block">
          <app-drop-down
            #jobTitleDp
            [class]="['qt-select-input-40']"
            [placeholder]="'Select Your Role'"
            [editItem]="selectedJobTitle"
            [list]="jobTitleList"
            [field]="'name'"
            [search]="true"
            [change]="true"
            (onSelectedItem)="onSelectRole($event)"
          ></app-drop-down>
        </div>
      </div>
      <div class="tab-pane__row">
        <label class="tab-pane__subtitle">Mailing Address</label>
        <div class="qt-input-block">
          <input
            placeholder="search for location"
            autocorrect="off"
            autocapitalize="off"
            class="form-input"
            spellcheck="off"
            type="text"
            #search
            formControlName="mailingAddress"
          >
        </div>
      </div>
      <div class="tab-pane__row">
        <label class="tab-pane__subtitle">Suite Number & Zip Code</label>
        <div class="tab-pane-input__row">
          <div class="qt-input-block qt-mr-24">
            <input
              type="text"
              placeholder="123456"
              class="form-input"
              formControlName="suiteNumber"
            >
          </div>
          <div class="qt-input-block">
            <input
              type="text"
              placeholder="123456"
              class="form-input"
              formControlName="postalCode"
            >
          </div>
        </div>
      </div>
      <div class="tab-pane__row">
        <label class="tab-pane__subtitle">Primary Phone Number</label>
        <div class="tab-pane-input__row">
          <div class="qt-input-block qt-input-block-100">
            <div class="qt-df">
              <select
                class="cmn-select form-input qt-input-prefix"
                formControlName="primaryPhoneType"
              >
                <option value="MOBILE">mobile</option>
                <option value="OFFICE">office</option>
                <option value="FAX">fax</option>
              </select>
              <input
                type="text"
                class="form-input qt-input-prepend"
                placeholder="Primary Phone Number"
                formControlName="primaryPhone"
                [validation]="true"
                [suffix]="suffix"
                mask="(000) 000-0000 Ext: 999999||000-000-0000"
                [specialCharacters]="['(',')',' ','-','E','x','t',':']"
                [dropSpecialCharacters]="false"
                (keyup)="phonehandle($event)"
              >
            </div>
          </div>
          <div class="qt-input-block-100 qt-mt-16">
            <div
              (click)="onAddPhone()"
              *ngIf="!isAddPhone"
              href="javascript:;"
              class="qt-button --gray qt-jc-c"
            >
              + Add Phone
            </div>
          </div>
          <div
            class="qt-input-block-100"
            *ngIf="isAddPhone"
          >
            <div class="qt-input-block qt-input-block-100">
              <div class="qt-df">
                <select
                  class="cmn-select form-input qt-input-prefix"
                  formControlName="secondaryPhoneType"
                >
                  <option value="MOBILE">mobile</option>
                  <option value="OFFICE">office</option>
                  <option value="FAX">fax</option>
                </select>
                <input
                  type="text"
                  class="form-input qt-input-prepend"
                  formControlName="secondaryPhone"
                  placeholder="Secondary Phone Number"
                  formControlName="secondaryPhone"
                >
              </div>
            </div>
            <div class="qt-input-block-100 qt-mt-16">
              <div
                href="javascript:;"
                class="qt-button --gray qt-jc-c"
                (click)="onAddPhone()"
              >
                <div class="icon__new-remove-red qt-sz-20 qt-bg-contain qt-mr-8 pointer"></div>
                <div class="red-600">Remove</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="tab-pane__row">
        <label class="tab-pane__subtitle">About Me</label>
        <div class="tab-pane-input__row">
          <div class="qt-input-block">
            <textarea
              placeholder="Write About Your Self"
              class="form-input"
              formControlName="aboutMe"
            ></textarea>
          </div>
        </div>
      </div>
      <input
        type="submit"
        class="btn btn-primary"
        value="Save Changes"
        (click)="onSubmit()"
      >
    </form>
  </div>
</div>
