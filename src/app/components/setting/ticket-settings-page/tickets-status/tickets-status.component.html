<div class="cmn-area">
    <div class="data-table-wrap">
        <table
            class="display dataTable"
            style="width:100%"
        >
            <thead>
                <tr>
                    <th></th>
                    <th class="tax-name">
                        Ticket Status
                        <ng-template
                            #tipContent
                            class="tooltip"
                        >
                            The maximum number of custom statuses is 10
                        </ng-template>
                        <span
                            class="icon__info-question default-services-page__question-icon qt-sz-12 qt-ic-c"
                            placement="top"
                            [ngbTooltip]="tipContent"
                        ></span>
                    </th>
                    <th class="rate">Set Color</th>
                    <th>Preview</th>
                    <th class="action">&nbsp;</th>
                </tr>
            </thead>
            <tbody>
                <tr
                    *ngIf="showAddStatus"
                    class="add-ticket-container"
                    appClickOtside
                    #addStatusBtn="click"
                    [init]="true"
                    [class]="'.add-ticket-container'"
                    (onOutSide)="onAddTicketStatus()"
                >
                    <td></td>
                    <td class="tax-name add-status-name">
                        <input
                            type="text"
                            class="form-input"
                            placeholder="Enter Name Status"
                            [(ngModel)]="addStatus.name"
                            maxlength="20"
                        >
                    </td>
                    <td class="rate">
                        <div
                            class="form-row tag-color-container"
                            ngbDropdown
                        >
                            <div
                                id="dropdownBasic1"
                                ngbDropdownToggle
                            >
                                <i
                                    class="tag-color"
                                    [ngStyle]="{'background-color':statusColors[addStatus.color].borderColor ,
                            'border-color': statusColors[addStatus.color].borderColor}"
                                ></i>
                            </div>
                            <div
                                ngbDropdownMenu
                                class="status-container-db"
                                aria-labelledby="dropdownBasic1"
                            >
                                <div class="status-container">
                                    <div
                                        class="tag-color-item"
                                        *ngFor="let tagColor of statusColors; let i = index"
                                        (click)="setColor(i)"
                                        ngbDropdownItem
                                    >
                                        <i
                                            class="tag-color"
                                            [ngStyle]="{'background-color':tagColor.borderColor ,
                            'border-color': tagColor.borderColor}"
                                        ></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                    <td class="preview">
                        <div
                            class="preview-container"
                            [ngStyle]="{'border-color':  statusColors[addStatus.color].borderColor}"
                        >
                            <span
                                [ngStyle]="{'color':  statusColors[addStatus.color].borderColor}"
                                [textContent]="addStatus.name"
                            ></span>
                        </div>
                    </td>
                    <td class="action"></td>
                </tr>
                <tr
                    *ngFor="let item of ticketsStatus; let i = index"
                    appClickOtside
                    [init]="item.isInitEdit"
                    [ngClass]="'edit-ticket-container-' + i"
                    [class]="'.edit-ticket-container-' + i"
                    (onOutSide)="onEditTicketStatus(item)"
                >
                    <td
                        class="checkbox"
                        *ngIf="!item.custom"
                    >
                    </td>
                    <td
                        class="checkbox"
                        *ngIf="item.custom"
                    >
                        <label class="qt-checkbox">
                            <input
                                type="checkbox"
                                [(ngModel)]="item.selected"
                                (change)="onSelect($event,item)"
                            >
                            <span></span>
                        </label>
                    </td>
                    <td
                        class="tax-name add-status-name"
                        *ngIf="item.custom"
                    >
                        <input
                            type="text"
                            class="form-input"
                            placeholder="Enter Name Status"
                            [(ngModel)]="item.name"
                            maxlength="20"
                            (input)="item.onInitEdit(true)"
                        >
                    </td>
                    <td
                        class="tax-name add-status-name"
                        [textContent]="parseStatus(item.name)"
                        *ngIf="!item.custom"
                    >
                    </td>
                    <td class="rate">
                        <div
                            class="form-row tag-color-container"
                            ngbDropdown
                        >
                            <div
                                id="dropdownBasic1"
                                ngbDropdownToggle
                            >
                                <i
                                    class="tag-color"
                                    [ngStyle]="{'background-color':statusColors[item.color].borderColor ,
                            'border-color': statusColors[item.color].borderColor}"
                                ></i>
                            </div>
                            <div
                                ngbDropdownMenu
                                class="status-container-db"
                                aria-labelledby="dropdownBasic1"
                            >
                                <div class="status-container">
                                    <div
                                        class="tag-color-item"
                                        *ngFor="let tagColor of statusColors; let i = index"
                                        (click)="editColor(i,item)"
                                        ngbDropdownItem
                                    >
                                        <i
                                            class="tag-color"
                                            [ngStyle]="{'background-color':tagColor.borderColor ,
                            'border-color': tagColor.borderColor}"
                                        ></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </td>
                    <td class="preview">
                        <div
                            class="preview-container"
                            [ngStyle]="{'border-color':  statusColors[item.color].borderColor}"
                        >
                            <span
                                [ngStyle]="{'color':  statusColors[item.color].borderColor}"
                                [textContent]="item.name"
                            ></span>
                        </div>
                    </td>
                    <td class="action">
                        <a
                            href="javascript:;"
                            data-tooltip="Remove"
                            class="remove"
                            (click)="removeTicketStatus(item)"
                            *ngIf="item.custom"
                        >
                            <div class="icon__remove qt-sz-16 qt-bg-contain"></div>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
