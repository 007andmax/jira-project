<div class="cmn-area ticket-status-table">
    <div class="tab-pane__table dataTable">
        <div class="tab-pane__table-header">
            <div class="tab-pane__table-row">
                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                    <label class="qt-checkbox">
                        <input
                            type="checkbox"
                            (change)="onToggleAll($event)"
                        >
                        <span></span>
                    </label>
                </div>
                <div class="tab-pane__table-cell ticket-status-table__status">
                    Ticket Status
                    <ng-template
                        #tipContent
                        class="tooltip"
                    >
                        The maximum number of custom statuses is 10
                    </ng-template>
                    <span
                        class="qt-icon icon__info qt-sz-16 qt-ic-c qt-dib pointer"
                        placement="top"
                        [ngbTooltip]="tipContent"
                    ></span>
                </div>
                <div class="tab-pane__table-cell ticket-status-table__color">Assign Color</div>
                <div class="tab-pane__table-cell ticket-status-table__preview">Preview</div>
                <div class="tab-pane__table-cell ticket-status-table__action">&nbsp;</div>
            </div>
        </div>
        <div class="tab-pane__table-body">
            <div
                *ngIf="showAddStatus"
                class="add-ticket-container tab-pane__table-row --selected"
                appClickOtside
                #addStatusBtn="click"
                [init]="true"
                [classParent]="'.add-ticket-container'"
                (onOutSide)="onAddTicketStatus()"
            >
                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                    <label class="qt-checkbox">
                        <input type="checkbox">
                        <span></span>
                    </label>
                </div>
                <div
                    class="tab-pane__table-cell ticket-status-table__status"
                    [ngClass]="{'--input-error' : addStatus.disableCreate}"
                >
                    <input
                        type="text"
                        class="form-input --editable"
                        placeholder="Enter Name Status"
                        [(ngModel)]="addStatus.name"
                        (keyup)="onKeyUp($event)"
                        (input)="addStatus.checkDublicate(ticketsStatus)"
                        maxlength="20"
                    >
                    <app-mat-error
                        class="qt-tooltip-error"
                        *ngIf="addStatus.disableCreate"
                    >
                        This Ticket Status is already occupied
                    </app-mat-error>
                </div>
                <div class="tab-pane__table-cell ticket-status-table__color">
                    <div
                        class="form-row tag-color-container"
                        ngbDropdown
                    >
                        <div id="dropdownBasic2">
                            <div
                                class="qt-df qt-ai-c qt-jc-c qt-sz-24 tag-color pointer"
                                ngbDropdownToggle
                                [ngStyle]="{'background-color':statusColors[addStatus.color].textColor ,
                            'border-color': statusColors[addStatus.color].textColor}"
                            >
                                <div class="qt-icon icon__color-picker qt-icon__white qt-sz-16 qt-icon__white"></div>
                            </div>
                        </div>
                        <div
                            ngbDropdownMenu
                            class="status-container-db"
                            aria-labelledby="dropdownBasic2"
                        >
                            <div class="status-container">
                                <div
                                    class="tag-color-item"
                                    *ngFor="let tagColor of statusColors; let i = index"
                                    (click)="setColor(i)"
                                    ngbDropdownItem
                                >
                                    <div
                                        class="qt-df qt-ai-c qt-jc-c qt-sz-24 tag-color"
                                        [ngClass]="{'--active':addStatus.color == i}"
                                        [ngStyle]="{'background-color':tagColor.textColor ,
                            'border-color': tagColor.textColor}"
                                    >
                                        <div class="qt-icon icon__done qt-icon__white qt-sz-16 qt-icon__white"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane__table-cell ticket-status-table__preview">
                    <div
                        class="preview-container"
                        [ngStyle]="{'border-color':  statusColors[addStatus.color].textColor,'background-color':statusColors[addStatus.color].borderColor}"
                    >
                        <span
                            [ngStyle]="{'color':  statusColors[addStatus.color].textColor}"
                            [textContent]="addStatus.name"
                        ></span>
                    </div>
                </div>
                <div class="tab-pane__table-cell ticket-status-table__action">
                    <app-dynamic-tooltip
                        [content]="'Remove'"
                        [position]="'top'"
                        #removeTooltip
                    ></app-dynamic-tooltip>
                    <div
                        class="qt-icon icon__delete qt-sz-20 qt-bg-contain pointer"
                        (mouseenter)="removeTooltip.show($event.target)"
                        (mouseleave)="removeTooltip.hide()"
                    >
                    </div>
                </div>
            </div>
            <div
                class="tab-pane__table-row"
                *ngFor="let item of ticketsStatus; let i = index"
                appClickOtside
                [init]="item.isInitEdit"
                [ngClass]="['edit-ticket-container-' + i,item.selected ? '--selected' : '']"
                [classParent]="'.edit-ticket-container-' + i"
                (onOutSide)="onEditTicketStatus(item)"
            >
                <div
                    class="ab-pane__table-cell tab-pane__table-checkboxes"
                    *ngIf="!item.custom"
                >
                </div>
                <div
                    class="tab-pane__table-cell tab-pane__table-checkboxes"
                    *ngIf="item.custom"
                >
                    <label class="qt-checkbox">
                        <input
                            type="checkbox"
                            [(ngModel)]="item.selected"
                            (change)="onSelect($event,item)"
                        >
                        <span></span>
                    </label>
                </div>
                <div
                    class="tab-pane__table-cell ticket-status-table__status"
                    *ngIf="item.custom"
                    [ngClass]="{'--input-error' :  item.disableUpdate  }"
                >
                    <input
                        type="text"
                        class="form-input  --editable"
                        placeholder="Enter Name Status"
                        [(ngModel)]="item.name"
                        maxlength="20"
                        appKeyUpEnter
                        (onChange)="onEditTicketStatus(item)"
                        (input)="item.onInitEdit(true);item.checkDublicateUpdate(ticketsStatus)"
                    >
                    <app-mat-error
                        class="qt-tooltip-error"
                        *ngIf="item.disableUpdate"
                    >
                        This Ticket Status is already occupied
                    </app-mat-error>
                </div>
                <div
                    class="tab-pane__table-cell ticket-status-table__status --parse-status"
                    [textContent]="parseStatus(item.name)"
                    *ngIf="!item.custom"
                >
                </div>
                <div class="tab-pane__table-cell ticket-status-table__color">
                    <div
                        class="form-row tag-color-container"
                        ngbDropdown
                    >
                        <div id="dropdownBasic1">
                            <div
                                class="qt-df qt-ai-c qt-jc-c qt-sz-24 tag-color pointer"
                                ngbDropdownToggle
                                [ngStyle]="{'background-color':statusColors[item.color] && statusColors[item.color].textColor ,
                            'border-color': statusColors[item.color] && statusColors[item.color].textColor}"
                            >
                                <div class="qt-icon icon__color-picker qt-icon__white qt-sz-16 qt-icon__white"></div>
                            </div>
                        </div>
                        <div
                            ngbDropdownMenu
                            class="status-container-db"
                            aria-labelledby="dropdownBasic1"
                        >
                            <div class="status-container">
                                <div
                                    class="tag-color-item"
                                    *ngFor="let tagColor of statusColors; let i = index"
                                    (click)="editColor(i,item)"
                                    ngbDropdownItem
                                >
                                    <div
                                        class="qt-df qt-ai-c qt-jc-c qt-sz-24 tag-color"
                                        [ngClass]="{'--active':item.color == i}"
                                        [ngStyle]="{'background-color':tagColor.textColor ,
                            'border-color': tagColor.textColor}"
                                    >
                                        <div class="qt-icon icon__done qt-icon__white qt-sz-16 qt-icon__white"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane__table-cell ticket-status-table__preview">
                    <div
                        class="preview-container"
                        [ngStyle]="{'border-color':  statusColors[item.color] && statusColors[item.color].textColor,'background-color': statusColors[item.color] && statusColors[item.color].borderColor}"
                    >
                        <span
                            [ngStyle]="{'color': statusColors[item.color] && statusColors[item.color].textColor}"
                            [textContent]="parseStatus(item.name)"
                        ></span>
                    </div>
                </div>
                <div class="tab-pane__table-cell ticket-status-table__action">
                    <app-dynamic-tooltip
                        [content]="'Remove'"
                        [position]="'top'"
                        #removeTooltip
                    ></app-dynamic-tooltip>
                    <div
                        (mouseenter)="removeTooltip.show($event.target)"
                        (mouseleave)="removeTooltip.hide()"
                        class="qt-icon icon__delete qt-sz-20 qt-bg-contain pointer"
                        (click)="removeTicketStatus(item)"
                        *ngIf="item.custom"
                    >
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
