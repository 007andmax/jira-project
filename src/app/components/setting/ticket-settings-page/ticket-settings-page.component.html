<!-- Middle Wrapper -->
<div class="page-container ticket-settings-page-container">
    <div class="page-insider invoice-ticket">
        <div class="heading qt-df qt-ai-fs qt-jc-sb">
            <h6 class="qt-fw-600">Ticket Settings</h6>
            <div class="qt-df">
                <a
                    href="javascript:;"
                    class="qt-button qt-ml-24 --md"
                    (click)="onSubmit()"
                    *ngIf="activeTab !== 'cannedResponses' && activeTab !== 'ticketStatus' && activeTab !== 'ticketPriority'"
                >
                    Save Changes
                </a>
                <div
                    class="qt-df"
                    [ngClass]="{'--hidden':activeTab === 'ticketSettings'}"
                >
                    <a
                        href="javascript:;"
                        class="qt-button --md --gray button-gl-number__delete qt-ml-12"
                        *ngIf="getSelectedCount() > 0"
                        (click)="removeTicketsStatus()"
                    >
                        <div class="qt-icon icon__remove qt-sz-16 qt-bg-contain qt-ic-c"></div>
                    </a>
                    <a
                        href="javascript:;"
                        class="qt-button --md --gray button-gl-number__delete qt-ml-12"
                        *ngIf="getSelectedPriorityCount() > 0"
                        (click)="removeTicketsPriority()"
                    >
                        <div class="qt-icon icon__remove qt-sz-16 qt-bg-contain qt-ic-c"></div>
                    </a>
                    <a
                        class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                        *ngIf="activeTab === 'ticketStatus'"
                        href="javascript:;"
                        (click)="create()"
                    >
                        <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-8 qt-sz-16 qt-dib qt-mr-8"></span>
                        Add Status
                    </a>
                    <a
                        *ngIf="activeTab === 'cannedResponses' && getPermissions('CREATE_TICKET_NOTE_TEMPLATE')"
                        href="javascript:;"
                        class="qt-button --md --gray qt-jc-c pointer qt-ml-12"
                        (click)="createResponse()"
                    >
                        <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-8 qt-sz-16 qt-dib qt-mr-8"></span>
                        Create Response
                    </a>
                    <a
                        *ngIf="activeTab === 'ticketPriority'"
                        href="javascript:;"
                        class="qt-button --md --gray qt-jc-c pointer qt-ml-12"
                        (click)="createPriority()"
                    >
                        <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-8 qt-sz-16 qt-dib qt-mr-8"></span>
                        Add priority
                    </a>
                </div>
            </div>
        </div>
        <ngb-tabset (tabChange)="setTab($event)">
            <ngb-tab
                title="Ticket Settings"
                id="ticketSettings"
            >
                <ng-template ngbTabContent>
                    <app-ticket-settings #ticketSettings></app-ticket-settings>
                </ng-template>
            </ngb-tab>
            <ngb-tab
                title="Ticket Status"
                id="ticketStatus"
            >
                <ng-template ngbTabContent>
                    <tickets-status #ticketsStatus></tickets-status>
                </ng-template>
            </ngb-tab>
            <ngb-tab
                title="Ticket Priority"
                id="ticketPriority"
            >
                <ng-template ngbTabContent>
                    <app-tickets-priority #ticketPriority></app-tickets-priority>
                </ng-template>
            </ngb-tab>
            <ngb-tab
                title="Canned Responses"
                id="cannedResponses"
            >
                <ng-template ngbTabContent>
                    <canned-responses #cannedResponses></canned-responses>
                </ng-template>
            </ngb-tab>
        </ngb-tabset>
    </div>
</div>
