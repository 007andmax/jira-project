<!-- Middle Wrapper -->
<div class="page-container ticket-settings-page-container">
    <div class="page-insider invoice-ticket">
        <div
            class="heading qt-df qt-ai-fs qt-jc-sb"
            [ngClass]="{'heading-tickets-status':activeTab === 'ticketStatus',
        'heading-canned-responses':activeTab === 'cannedResponses'}"
        >
            <h6 class="qt-fw-600">Ticket Settings</h6>
            <div
                class="heading-serach add-category-container"
                [ngClass]="{'--hidden':activeTab === 'ticketSettings'}"
            >
                <div
                    class="tickets-status-header-buttons"
                    *ngIf="getSelectedCount() > 0"
                >
                    <div [textContent]="getSelectedCount() + ' Status Selected'"></div>
                    <div
                        class="qt-ml-16 qt-fw-600 qt-df qt-color-info qt-ai-c qt-pointer"
                        (click)="removeTicketsStatus()"
                    >
                        <div class="icon__new-remove-blue qt-sz-16 qt-bg-contain qt-ic-c qt-mr-6"></div>
                        <div>Delete</div>
                    </div>
                </div>
                <a
                    *ngIf="activeTab === 'ticketStatus'"
                    href="javascript:;"
                    class="btn-outline add-status-btn"
                    (click)="create()"
                >
                    Add Status
                </a>
                <a
                    *ngIf="activeTab === 'cannedResponses' && getPermissions('CREATE_TICKET_NOTE_TEMPLATE')"
                    href="javascript:;"
                    class="btn-outline add-response-btn"
                    (click)="createResponse()"
                >
                    Create Response
                </a>
            </div>
            <div class="qt-button qt-ml-24 --md">Save Changes</div>
        </div>
        <ngb-tabset
            (tabChange)="setTab($event)"
            [ngClass]="{'clear-padding' :activeTab === 'ticketStatus' || activeTab === 'cannedResponses'}"
        >
            <!-- Ticket Settings -->
            <ngb-tab
                title="Ticket Settings"
                id="ticketSettings"
            >
                <ng-template ngbTabContent>
                    <app-ticket-settings></app-ticket-settings>
                </ng-template>
            </ngb-tab>
            <ngb-tab
                title="Ticket Status"
                id="ticketStatus"
            >
                <ng-template ngbTabContent>
                    <tickets-status #ticketsStatus></tickets-status>
                </ng-template>
            </ngb-tab>
            <ngb-tab
                title="Canned Responses"
                id="cannedResponses"
            >
                <ng-template ngbTabContent>
                    <canned-responses #cannedResponses></canned-responses>
                </ng-template>
            </ngb-tab>
        </ngb-tabset>
    </div>
</div>
