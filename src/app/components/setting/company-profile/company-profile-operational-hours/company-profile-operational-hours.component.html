<div class="cmn-area --border-transparent">
    <form>
        <div>
            <div *ngFor="
                  let workingDay of  cProfile.timeSettings.workingDays;
                  let i = index
                "></div>
        </div>
        <div class="tab-pane__body">
            <div
                *ngFor="
                    let workingDay of  cProfile.timeSettings.workingDays;
                    let i = index
                  "
                class="tab-pane__row --border --border-radius --ai-c qt-mb-16"
            >
                <div class="tab-pane__subtitle">
                    <div class="qt-df qt-ai-c">
                        <label class="qt-switch">
                            <input
                                type="checkbox"
                                id="{{ workingDay.dayOfWeek }}"
                                [(ngModel)]="workingDay.isSelected"
                                name="{{ workingDay.dayOfWeek | titlecase }}"
                                [ngModelOptions]="{ standalone: true }"
                                class="qt-switch__input"
                            >
                            <span class="qt-switch__elem"></span>
                        </label>
                        <label
                            class="operations-hours__week"
                            for="{{ workingDay.dayOfWeek }}"
                        >
                            {{
                          workingDay.dayOfWeek | titlecase
                          }}
                        </label>
                        <div class="operations-hours__status">Open</div>
                    </div>
                </div>
                <div class="tab-pane-input__row">
                    <div class="qt-input-block">
                        <div class="qt-df">
                            <div class="qt-mr-24 qt-w50">
                                <app-drop-down
                                    [class]="['qt-select-input-40']"
                                    [placeholder]="'Select Company Type'"
                                    [field]="'name'"
                                    [list]="workHours"
                                    [editItem]="fromTime_convert(workingDay.startTime)"
                                    [search]="true"
                                    [sort]="false"
                                    [change]="true"
                                    [isBlockClear]="true"
                                    [isDisabled]="!workingDay.isSelected"
                                    (onSelectedItem)="startTimeChange(workingDay,$event.value)"
                                ></app-drop-down>
                            </div>
                            <div class="qt-w50">
                                <app-drop-down
                                    [class]="['qt-select-input-40']"
                                    [placeholder]="'Select Company Type'"
                                    [field]="'name'"
                                    [list]="workHours"
                                    [editItem]="toTime_convert(workingDay.endTime)"
                                    [search]="true"
                                    [sort]="false"
                                    [change]="true"
                                    [isBlockClear]="true"
                                    [isDisabled]="!workingDay.isSelected"
                                    (onSelectedItem)="endTimeChange(workingDay,$event.value)"
                                ></app-drop-down>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
