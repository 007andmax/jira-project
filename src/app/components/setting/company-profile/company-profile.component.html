<div class="page-container">
    <div class="page-insider company-profile">
        <div class="heading qt-df qt-ai-fs qt-jc-sb">
            <h5 class="qt-fw-600">Company Profile</h5>
            <a
                href="javascript:;"
                class="qt-button qt-ml-24 --md"
                (click)="onSubmit()"
                *ngIf="tabSet !== 'api-keys'"
            >
                Save Changes
            </a>
            <a
                href="javascript:;"
                (click)="addAPIKey()"
                class="qt-button --md --gray qt-jc-c pointer qt-ml-12"
                *ngIf="tabSet === 'api-keys'"
            >
                <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-8 qt-button-icon"></span>
                Add API Key
            </a>
        </div>
        <ul
            ngbNav
            #nav="ngbNav"
            (navChange)="setTab($event)"
            class="nav-tabs"
            [(activeId)]="tabSet"
        >
            <li [ngbNavItem]="'tab1'">
                <a ngbNavLink>Profile</a>
                <ng-template ngbNavContent>
                    <app-company-profile-profile
                        #profile
                        (onGetCurrentCompany)="getCompanyProfile()"
                    ></app-company-profile-profile>
                </ng-template>
            </li>
            <li [ngbNavItem]="'workspace'">
                <a ngbNavLink>Workspace</a>
                <ng-template ngbNavContent>
                    <app-company-profile-workspace #workspace></app-company-profile-workspace>
                </ng-template>
            </li>
            <li [ngbNavItem]="'operationalhours'">
                <a ngbNavLink>Operational Hours</a>
                <ng-template ngbNavContent>
                    <app-company-profile-operational-hours #operationalhours></app-company-profile-operational-hours>
                </ng-template>
            </li>
            <li [ngbNavItem]="'api-keys'">
                <a ngbNavLink>API Keys</a>
                <ng-template ngbNavContent>
                    <app-company-profile-api-keys #apiKeys></app-company-profile-api-keys>
                </ng-template>
            </li>
        </ul>
        <div
            [ngbNavOutlet]="nav"
            class="mt-2"
        ></div>
    </div>
</div>
<app-company-profile-api-keys-add-aside></app-company-profile-api-keys-add-aside>
<app-company-profile-api-keys-edit-aside></app-company-profile-api-keys-edit-aside>
