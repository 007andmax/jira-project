<div class="cmn-area workspace">
    <div class="tab-pane__header">
        <div class="tab-pane__header-title">Workspace</div>
    </div>
    <div class="tab-pane__body">
        <form
            [formGroup]="cProfileForm"
            (ngSubmit)="checkDomain()"
        >
            <div class="tab-pane__row">
                <div class="tab-pane__subtitle">Company URL</div>
                <div>
                    <div class="tab-pane-input__row">
                        <div class="qt-input-block --required">
                            <div class="qt-df">
                                <input
                                    [ngClass]="{'--input-error' : cProfileForm.get('url').getError('incorrect') || cProfileForm.get('url').getError('invalidate')}"
                                    type="text"
                                    class="qt-input-afterpend"
                                    placeholder="Enter Your Company URL"
                                    formControlName="url"
                                    (input)="checkValidateDomain()"
                                >
                                <span class="qt-input-afterfix">.quicktech.com</span>
                            </div>
                            <app-mat-error
                                class="invalid-feedback --pos-static"
                                *ngIf="cProfileForm.get('url').getError('incorrect')"
                            >
                                Domain is required
                            </app-mat-error>
                            <app-mat-error
                                class="invalid-feedback --pos-static"
                                *ngIf="cProfileForm.get('url').getError('invalidate')"
                            >
                                Please enter a valid company domain.
                            </app-mat-error>
                        </div>
                    </div>
                    <div class="qt-input-help-text qt-mt-12">
                        Your workspace URL can only contain lowercase letters, numbers and dashes
                      (and must start with a letter or number).
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
