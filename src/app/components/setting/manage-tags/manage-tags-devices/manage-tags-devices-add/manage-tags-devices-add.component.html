<div
    class="tab-pane__table-row"
    appClickOtside
    #addStatusBtn="click"
    [init]="true"
    [class]="'.add-tag-container'"
    (onOutSide)="save()"
>
    <div class="tab-pane__table-cell manage-tags-table__custom-tags">
        <input
            type="text"
            class="form-input  --editable"
            placeholder="Enter Name Status"
            [(ngModel)]="name"
            minlength="1"
            maxlength="30"
            (keyup)="onKeyUp($event)"
        >
    </div>
    <div class="tab-pane__table-cell manage-tags-table__action qt-pos-rel"></div>
</div>
