<div
    class="tab-pane__table-row"
    appClickOtside
    #addStatusBtn="click"
    [init]="true"
    [class]="'.add-tag-container'"
    (onOutSide)="save()"
>
    <div
        class="tab-pane__table-cell manage-tags-table__custom-tags"
        [ngClass]="{'--input-error' :  !isUniqueness  }"
    >
        <input
            type="text"
            class="form-input  --editable"
            placeholder="Enter Name Status"
            [(ngModel)]="name"
            (keyup)="onKeyUp($event)"
        >
        <app-mat-error
            class="qt-tooltip-error"
            *ngIf="!isUniqueness"
            [textContent]="'This Tag is already occupied'"
        >
        </app-mat-error>
    </div>
    <div
        class="tab-pane__table-cell manage-tags-table__count"
        *ngIf="setActiveTab != 'file'"
    ></div>
    <div class="tab-pane__table-cell manage-tags-table__action qt-pos-rel"></div>
</div>
