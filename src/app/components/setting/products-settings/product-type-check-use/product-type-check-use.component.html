<div class="archive-modal de-archive">
    <button
        class="close-modal"
        (click)=cancelConfirm()
    ></button>
    <div class="archive-modal__body">
        <h3>Delete Product Type</h3>
        <div
            class="no-exist-agreements"
            *ngIf="!showPreloader && valid"
        >
            <span class="no-exist-agreements__info">
                Are you sure you want to delete this Product Type?
            </span>
        </div>
        <div
            class="exist-agreements"
            *ngIf="!showPreloader && !valid"
        >
            <p class="qt-mb-16">
                You can’t delete the Product type associated with a product. Please remove the Product type from the following product, before you delete it.
            </p>
            <h3
                class="qt-mb-8"
                [textContent]="'Product Type - ' + productType.title"
            ></h3>
            <app-drop-down
                #typeSelect
                [class]="['qt-select-input-40']"
                [placeholder]="'Select Type'"
                [field]="'title'"
                [list]="listTypes"
                [errorMessage]="'The Product type is required'"
                [validate]="validate"
                [search]="true"
                [change]="true"
                (onSelectedItem)="onSelectProuctType($event)"
            >
            </app-drop-down>
            <div class="list-elements">
                <div
                    class="contract-container qt-mt-16"
                    *ngIf="products.length > 0"
                >
                    <h3>Products</h3>
                    <div class="contract-container-agreements qt-mt-8">
                        <ng-template
                            ngFor
                            let-product
                            let-i="index"
                            [ngForOf]="products"
                            [ngForTrackBy]="trackById"
                        >
                            <div class="contract-item">
                                <div class="contract-item-info">
                                    <h3 [textContent]="product.description"></h3>
                                </div>
                            </div>
                        </ng-template>
                    </div>
                </div>
            </div>
        </div>
        <div
            class="preloader-container"
            *ngIf="showPreloader"
        >
            <div class="loading"></div>
        </div>
    </div>
    <div
        class="archive-modal__footer"
        *ngIf="!showPreloader && valid"
    >
        <div class="qt-df qt-jc-fe">
            <button
                class="qt-button --red qt-w100"
                (click)=approveConfirm()
            >
                Yes, I am sure
            </button>
            <button
                class="qt-button --gray qt-w100"
                (click)=cancelConfirm()
            >
                Cancel
            </button>
        </div>
    </div>
    <div
        class="archive-modal__footer"
        *ngIf="!showPreloader && products.length > 0"
    >
        <div class="qt-df qt-jc-fe">
            <button
                class="qt-button --gray qt-w100"
                (click)=cancelConfirm()
            >
                Cancel
            </button>
            <button
                class="qt-button qt-w100 qt-jc-c"
                (click)=changeProductType()
            >
                Save
            </button>
        </div>
    </div>
</div>
