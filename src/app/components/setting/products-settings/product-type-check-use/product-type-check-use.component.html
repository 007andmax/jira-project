<div class="archive-modal de-archive">
    <button
        class="close-modal"
        (click)=cancelConfirm()
    ></button>
    <div class="archive-modal__body">
        <h3>Delete Product Type</h3>
        <div
            class="no-exist-agreements"
            *ngIf="!showPreloader && valid"
        >
            <span class="no-exist-agreements__info">
                Are you sure you want to delete this Product Type?
            </span>
            <div class="info-product">
                <h3 [textContent]="productType.title"></h3>
                <span>
                    Associate with no products, services, categories
                </span>
            </div>
        </div>
        <div
            class="exist-agreements"
            *ngIf="!showPreloader && !valid"
        >
            <p class="qt-mb-16">
                You can’t delete Product type that associate with a product. Please remove Product type from following product, before you delete it.
            </p>
            <h3 [textContent]="'Product Type - ' + productType.title"></h3>
            <app-drop-down
                #typeSelect
                [class]="['qt-select-input-40']"
                [placeholder]="'Select Type'"
                [field]="'title'"
                [list]="listTypes"
                [search]="true"
                [change]="true"
                (onSelectedItem)="onSelectProuctType($event)"
            >
            </app-drop-down>
            <div class="list-elements">
                <div
                    class="contract-container qt-mt-16"
                    *ngIf="products > 0"
                >
                    <h3>Products</h3>
                    <div class="contract-container-agreements qt-mt-8">
                        <ng-template
                            ngFor
                            let-product
                            let-i="index"
                            [ngForOf]="glNumberUse.products"
                            [ngForTrackBy]="trackById"
                        >
                            <div class="contract-item">
                                <div class="contract-item-info">
                                    <h3 [textContent]="product.description"></h3>
                                </div>
                                <span
                                    class="view-contract pointer"
                                    (click)="showProduct(product)"
                                >
                                    View Product
                                </span>
                            </div>
                        </ng-template>
                    </div>
                </div>
            </div>
        </div>
        <div
            class="preloader-container"
            *ngIf="showPreloader"
        >
            <div class="loading"></div>
        </div>
    </div>
    <div
        class="archive-modal__footer"
        *ngIf="!showPreloader && valid"
    >
        <div class="qt-df qt-jc-fe">
            <button
                class="btn-new btn-primary"
                (click)=approveConfirm()
            >
                Yes, I am sure
            </button>
            <button
                class="btn-new disabled"
                (click)=cancelConfirm()
            >
                Cancel
            </button>
        </div>
    </div>
</div>
