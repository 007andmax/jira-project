<!-- Middle Wrapper -->
<div class="page-container products-settings-page-container">
    <div class="page-insider manage-taxes">
        <div class="heading qt-df qt-ai-fs qt-jc-sb">
            <h5 class="qt-fw-600">Products</h5>
            <div class="qt-df">
                <a
                    href="javascript:;"
                    class="qt-button --md --gray qt-ml-12 qt-pl-9 qt-pr-9"
                    *ngIf="getSelectedCount() > 0"
                >
                    <div
                        class="qt-icon icon__delete delete qt-sz-16 qt-bg-contain qt-ic-c qt-button-icon"
                        (click)="removeCategoriesStatus()"
                    >
                    </div>
                </a>
                <a
                    href="javascript:;"
                    class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                    (click)="create()"
                >
                    <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-8 qt-button-icon"></span>
                    <span [textContent]="parseAddText()"></span>
                </a>
            </div>
        </div>
        <div
            class="loading-container"
            *ngIf="loading"
        >
            <div class="loading"></div>
        </div>
        <ngb-tabset
            #tabset="ngbTabset"
            [destroyOnHide]="false"
            (tabChange)="setTab($event)"
        >
            <ngb-tab
                title="Product Category"
                id="productCategories"
            >
                <ng-template ngbTabContent>
                    <app-products-settings-category
                        #categories
                        (onPreloader)="setPreloader($event)"
                    ></app-products-settings-category>
                </ng-template>
            </ngb-tab>
            <ngb-tab
                title="Product Type"
                id="productType"
            >
                <ng-template ngbTabContent>
                    <app-products-settings-type #productType></app-products-settings-type>
                </ng-template>
            </ngb-tab>
        </ngb-tabset>
    </div>
</div>
