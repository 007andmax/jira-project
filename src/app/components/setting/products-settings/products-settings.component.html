<!-- Middle Wrapper -->
<div class="page-container products-settings-page-container">
    <div class="page-insider manage-taxes">
        <div class="heading">
            <h6 class="qt-fw-600 qt-color-dark">Products</h6>
            <div class="heading-serach add-category-container">
                <div
                    class="tickets-status-header-buttons"
                    *ngIf="getSelectedCount() > 0"
                >
                    <div [textContent]="getSelectedCount() + ' Categories Selected'"></div>
                    <div
                        class="qt-ml-16 qt-fw-600 qt-df qt-color-info qt-ai-c qt-pointer"
                        (click)="removeCategoriesStatus()"
                    >
                        <div class="icon__remove-blue qt-sz-16 qt-bg-contain qt-ic-c qt-mr-6"></div>
                        <div>Delete</div>
                    </div>
                </div>
                <a
                    href="javascript:;"
                    class="btn-outline"
                    (click)="create()"
                >
                    Add category
                </a>
            </div>
        </div>
        <ngb-tabset
            #tabset="ngbTabset"
            [destroyOnHide]="false"
        >
            <ngb-tab
                title="Product Category"
                id="productCategories"
            >
                <ng-template ngbTabContent>
                    <div class="cmn-area">
                        <div class="data-table-wrap">
                            <table
                                class="display dataTable"
                                style="width:100%"
                            >
                                <thead>
                                    <tr>
                                        <th class="checkbox-header"></th>
                                        <th
                                            class="tax-name pointer"
                                            (click)="onFilter('name')"
                                        >
                                            Category Name
                                            <div class="qt-table-modern__sorting"></div>
                                        </th>
                                        <th
                                            class="rate pointer"
                                            (click)="onFilter('count')"
                                        >
                                            Count
                                            <div class="qt-table-modern__sorting"></div>
                                        </th>
                                        <th class="action">&nbsp;</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <add-category-product
                                        *ngIf="showAddCategory"
                                        (onClose)="showAddCategory = false"
                                    ></add-category-product>
                                    <tr
                                        *ngFor="let item of categoriesProducts; let i = index"
                                        appClickOtside
                                        [init]="item.isInitEdit"
                                        [ngClass]="'edit-category-container-' + i"
                                        [class]="'.edit-category-container-' + i"
                                        (onOutSide)="onEditCategory(item)"
                                    >
                                        <td class="checkbox">
                                            <label
                                                class="qt-checkbox"
                                                *ngIf="item.productsAmount === 0"
                                            >
                                                <input
                                                    type="checkbox"
                                                    [(ngModel)]="item.selected"
                                                    (change)="onSelect($event,item)"
                                                >
                                                <span></span>
                                            </label>
                                        </td>
                                        <td
                                            class="checkbox"
                                            *ngIf="item.productsAmount > 0"
                                        ></td>
                                        <td
                                            class="tax-name edit-category-name"
                                            [ngClass]="{'--input-error' :  item.disableUpdate  }"
                                        >
                                            <input
                                                type="text"
                                                class="form-input"
                                                placeholder="Enter Name Category"
                                                [(ngModel)]="item.name"
                                                maxlength="20"
                                                appKeyUpEnter
                                                (onChange)="onEditCategory(item)"
                                                (input)="item.onInitEdit(true);item.checkDublicate(categoriesProducts)"
                                            >
                                            <mat-error
                                                class="qt-tooltip-error"
                                                *ngIf="item.disableUpdate"
                                            >
                                                This Category is already occupied
                                            </mat-error>
                                        </td>
                                        <td
                                            class="rate"
                                            [textContent]="item.productsAmount"
                                        ></td>
                                        <td class="action">
                                            <a
                                                href="javascript:;"
                                                data-tooltip="Remove"
                                                class="remove"
                                                (click)="removeCategoryProduct(item)"
                                                *ngIf="item.productsAmount === 0"
                                            >
                                                <div class="icon__remove qt-sz-16 qt-bg-contain"></div>
                                            </a>
                                            <app-dynamic-tooltip
                                                [content]="'You cannot delete category with existing products'"
                                                [position]="'top'"
                                                #deleteTooltip
                                            ></app-dynamic-tooltip>
                                            <a
                                                href="javascript:;"
                                                (mouseenter)="deleteTooltip.show($event.target)"
                                                (mouseleave)="deleteTooltip.hide()"
                                                class="remove"
                                                *ngIf="item.productsAmount > 0"
                                            >
                                                <div class="icon__remove-disabled qt-sz-16 qt-bg-contain"></div>
                                            </a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </ng-template>
            </ngb-tab>
        </ngb-tabset>
    </div>
</div>
