<div
    class="tab-pane__table-row"
    appClickOtside
    #addStatusBtn="click"
    [init]="true"
    [classParent]="'.add-category-container'"
    (onOutSide)="save()"
>
    <div class="tab-pane__table-cell product-category-table__checkboxes"></div>
    <div
        class="tab-pane__table-cell product-category-table__category-name"
        [ngClass]="{'--input-error' : disableCreateCategory}"
    >
        <input
            type="text"
            class="form-input --editable"
            placeholder="Enter Name Category"
            [(ngModel)]="name"
            (input)="checkDublicateCategory()"
            (keyup)="onKeyUp($event)"
            required
        >
        <app-mat-error
            class="invalid-feedback"
            *ngIf="disableCreateCategory"
        >
            This category name is already occupied
        </app-mat-error>
    </div>
    <div class="tab-pane__table-cell product-category-table__count"></div>
    <div class="tab-pane__table-cell product-category-table__gl-number">
        <app-drop-down
            [class]="['--small-padding','gl-number-product-settings', '--editable-dropdown']"
            [list]="glNumbers"
            [placeholder]="'Select GL'"
            [container]="'body'"
            [change]="false"
            [add]="true"
            [field]="'glNumber'"
            uiType="dark"
            heightInput="32px"
            dropdownWidth="392px"
            [reducerItem]="glDropDownItemName"
            (onSelectedItem)="onSelectGlNumbers($event)"
        >
        </app-drop-down>
    </div>
    <div class="tab-pane__table-cell product-category-table__action"></div>
</div>
