<tr
    class="add-category-container"
    appClickOtside
    #addStatusBtn="click"
    [init]="true"
    [class]="'.add-category-container'"
    (onOutSide)="save()"
>
    <td></td>
    <td
        class="tax-name add-category-name"
        [ngClass]="{'--input-error' : disableCreateCategory}"
    >
        <mat-error
            class="qt-tooltip-error"
            *ngIf="disableCreateCategory"
        >
            This category name is already occupied
        </mat-error>
        <input
            type="text"
            class="form-input"
            placeholder="Enter Name Category"
            [(ngModel)]="name"
            (input)="checkDublicateCategory()"
            (keyup)="onKeyUp($event)"
            required
        >
    </td>
    <td class="rate"></td>
    <td class="gl-number">
        <app-drop-down
            [class]="['--small-padding','gl-number-product-settings']"
            [list]="glNumbers"
            [placeholder]="'Select GL'"
            [container]="'body'"
            [change]="false"
            [add]="true"
            [field]="'glNumber'"
            uiType="dark"
            heightInput="32px"
            dropdownWidth="392px"
            [reducerItem]="glDropDownItemName"
            (onAddItem)="onAddGlNumber($event)"
            (onSelectedItem)="onSelectGlNumbers($event)"
        >
        </app-drop-down>
    </td>
    <td class="action"></td>
</tr>
