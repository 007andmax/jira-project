<div class="modal-content --tooltip toggle-area opened">
    <div class="modal-wrapper">
        <div class="toggle-header">
            <h6 class="qt-fw-600 qt-color-dark qt-mb-24">Add Device Type</h6>
        </div>
        <div>
            <form
                [formGroup]="deviceForm"
                (ngSubmit)="onSubmit()"
            >
                <div class="qt-input-block qt-mb-24">
                    <label class="qt-input-block__label">Device Name</label>
                    <input
                        type="text"
                        class="form-input"
                        formControlName="Name"
                        placeholder="Enter Device Type Name"
                        #Name
                        [ngClass]="{ 'is-invalid': submitted && f.Name.errors }"
                    >
                    <div
                        *ngIf="submitted && f.Name.errors"
                        class="invalid-feedback error-text-align"
                    >
                        <div *ngIf="f.Name.errors.required">Name is required</div>
                    </div>
                </div>
                <div class="qt-df qt-w100 qt-mt-32">
                    <a
                        href="javascript:;"
                        class="qt-button --gray qt-jc-c qt-w100 qt-mr-12"
                        aria-label="Close"
                        (click)="closed()"
                    >
                        Cancel
                    </a>
                    <input
                        type="submit"
                        value="Save"
                        class="qt-button qt-jc-c qt-w100"
                    >
                </div>
            </form>
        </div>
    </div>
</div>
