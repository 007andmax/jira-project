<div
    *ngIf="opened"
    class="qt-aside-modern qt-aside-modern--page-settings"
>
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-info qt-df qt-ai-c">
            <div class="qt-aside__title">Delete Device Type</div>
        </div>
        <div>
            <div
                class="qt-aside__close-modal"
                (click)="closed()"
            >
                <div class="qt-icon icon__close qt-sz-20"></div>
            </div>
        </div>
    </div>
    <div class="qt-aside-modern__content">
        <div class="qt-mb-16">
            <div class="device-setting-type-check-use-info qt-fs-14">
                <div class="qt-icon icon__info qt-sz-20 qt-bg-contain qt-icon__yellow-800 qt-mr-8"></div>
                The device type cannot be removed as it is currently linked to multiple devices. Please reassign a different device type to the associated devices before attempting deletion.
            </div>
        </div>
        <div class="qt-inputs-row qt-ai-fe">
            <div class="qt-input-block qt-f50">
                <app-company-devices-assest-type-drop-down
                    [placeholder]="'Select type'"
                    [list]="assestType"
                    [editItem]="deviceType"
                    [field]="'name'"
                    [search]="true"
                    [change]="true"
                    [isDisabled]="true"
                    [title]="'Device Type'"
                ></app-company-devices-assest-type-drop-down>
            </div>
            <div class="qt-icon icon__transfer qt-sz-20 qt-bg-contain qt-mb-12"></div>
            <div class="qt-input-block qt-f50">
                <app-company-devices-assest-type-drop-down
                    [placeholder]="'Select type'"
                    [list]="assestType"
                    [field]="'name'"
                    [search]="true"
                    [change]="true"
                    [title]="'Device Type'"
                    [isBlockClear]="true"
                    (onSelectedItem)="onSelectAssestType($event)"
                ></app-company-devices-assest-type-drop-down>
            </div>
        </div>
        <div class="device-setting-type-check-use_device-type-companies">
            <div class="device-setting-type-check-use_device-type-info qt-df qt-ai-c">
                <div class="qt-sz-40 qt-bg-contain container-icon qt-ai-c qt-jc-c qt-df qt-mr-12">
                    <div
                        class="qt-ic-c qt-pointer device-type-icon qt-sz-20 qt-icon"
                        [ngClass]="{'icon__devices' : deviceType.name === 'workstation',
               'icon__router' : deviceType.name === 'router',
            'icon__print' : deviceType.name === 'printer',
                'icon__network-switch' : deviceType.name === 'switch',
          'icon__server' : deviceType.name === 'server',
            'icon__tablet' : deviceType.name === 'tablet',
            'icon__network_device' : deviceType.name === 'network device',
            'icon__old-phone' : deviceType.name === 'phone',
             'icon__generic_device' : deviceType.name === 'generic device',
            'icon__custom-device' : !checkDefaultName(deviceType.name)}"
                    >
                    </div>
                </div>
                <span class="qt-fs-14 qt-fw-400">
                    Following Devices associated with Device Type of
                    <u>{{deviceType.name}}</u>
                </span>
            </div>
            <ng-template
                ngFor
                let-company
                [ngForOf]="list"
                [ngForTrackBy]="trackById"
            >
                <div class="list-elements">
                    <div class="contract-container">
                        <div class="qt-df qt-ai-c">
                            <div class="icon__menu--submenu qt-icon icon__companies qt-sz-20 qt-icon__gray-500 qt-mr-8"></div>
                            <h3 [textContent]="company.name"></h3>
                        </div>
                        <div class="contract-container-agreements qt-mt-8 qt-pl-24">
                            <ng-template
                                ngFor
                                let-device
                                [ngForOf]="company.devices"
                                [ngForTrackBy]="trackById"
                            >
                                <div class="contract-item">
                                    <div class="qt-df qt-mr-16">
                                        <label class="qt-checkbox">
                                            <input
                                                type="checkbox"
                                                [(ngModel)]="device.selected"
                                            >
                                            <span></span>
                                        </label>
                                    </div>
                                    <div class="contract-item-info">
                                        <h3 [textContent]="device.name"></h3>
                                    </div>
                                </div>
                            </ng-template>
                        </div>
                    </div>
                </div>
            </ng-template>
        </div>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="qt-df qt-w100">
            <button
                class="qt-button --gray qt-mr-12 qt-w100 qt-jc-c"
                (click)="closed()"
            >
                Cancel
            </button>
            <button
                class="qt-button --red qt-w100 qt-jc-c"
                appDisabledBtn
                #addBtn="disabled"
                (onClick)="setAssignDeviceType()"
                [ngClass]="{'--loading':addBtn.isBlock()}"
            >
                <span *ngIf="!addBtn.isBlock()">Confirm</span>
                <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
            </button>
        </div>
    </div>
</div>
