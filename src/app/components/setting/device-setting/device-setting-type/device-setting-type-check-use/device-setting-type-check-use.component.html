<div class="archive-modal de-archive">
    <button
        class="close-modal"
        (click)=cancelConfirm()
    ></button>
    <div class="archive-modal__body">
        <h3>Device type</h3>
        <div
            class="no-exist-agreements"
            *ngIf="!showPreloader && valid"
        >
            <span class="no-exist-agreements__info">
                Are you sure you want to delete this GL number?
            </span>
            <div class="info-product">
                <h3 [textContent]="deviceType.name"></h3>
                <span>
                    Associate with no products, services, categories
                </span>
            </div>
        </div>
        <div
            class="exist-agreements"
            *ngIf="!showPreloader && !valid"
        >
            <p class="qt-mb-16">
                You can’t delete the type that associate with the existing devices. Please remove the Device type from following devices before deleting it.
            </p>
            <h3 [textContent]="'Device type - ' + deviceType.name"></h3>
            <app-company-devices-assest-type-drop-down
                [placeholder]="'Select type'"
                [list]="assestType"
                [field]="'name'"
                [search]="true"
                [change]="true"
                [title]="'Assest Type'"
                (onSelectedItem)="onSelectAssestType($event)"
            ></app-company-devices-assest-type-drop-down>
            <ng-template
                ngFor
                let-company
                [ngForOf]="list"
                [ngForTrackBy]="trackById"
            >
                <div class="list-elements">
                    <div class="contract-container qt-mt-16">
                        <h3 [textContent]="company.name"></h3>
                        <div class="contract-container-agreements qt-mt-8">
                            <ng-template
                                ngFor
                                let-device
                                [ngForOf]="company.devices"
                                [ngForTrackBy]="trackById"
                            >
                                <div class="contract-item">
                                    <div class="qt-df qt-mr-16">
                                        <label class="qt-checkbox">
                                            <input
                                                type="checkbox"
                                                [(ngModel)]="device.selected"
                                            >
                                            <span></span>
                                        </label>
                                    </div>
                                    <div class="contract-item-info">
                                        <h3 [textContent]="device.name"></h3>
                                    </div>
                                </div>
                            </ng-template>
                        </div>
                    </div>

                </div>
            </ng-template>
        </div>
        <div
            class="preloader-container"
            *ngIf="showPreloader"
        >
            <div class="loading"></div>
        </div>
    </div>
    <div
        class="archive-modal__footer"
        *ngIf="!showPreloader && !valid"
    >
        <div class="qt-df qt-jc-fe">
            <button
                class="qt-button --gray qt-w100"
                (click)=cancelConfirm()
            >
                Cancel
            </button>
            <button
                class="btn-new btn-primary"
                (click)=setAssignDeviceType()
            >
                Save
            </button>
        </div>
    </div>
    <div
        class="archive-modal__footer"
        *ngIf="!showPreloader && valid"
    >
        <div class="qt-df qt-jc-fe">
            <button
                class="qt-button --red qt-w100"
                (click)=approveConfirm()
            >
                Yes, I am sure
            </button>
            <button
                class="qt-button --gray qt-w100"
                (click)=cancelConfirm()
            >
                Cancel
            </button>
            <button
                class="btn-new btn-primary"
                (click)=approveConfirm()
            >
                Yes, I am sure
            </button>
        </div>
    </div>
</div>
