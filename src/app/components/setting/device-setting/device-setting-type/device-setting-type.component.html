<div class="cmn-area">
    <div
        class="tab-pane__table"
        [ngClass]="{'cleat-height-dataTable':!showPreloader}"
    >
        <div class="tab-pane__table-header">
            <div class="tab-pane__table-row">
                <div
                    class="tab-pane__table-cell crm-settings-company-industry-table__industry-type pointer qt-df"
                    (click)="onFilter('name')"
                >
                    Name
                    <div class="qt-table-modern__sorting--new"></div>
                        <div *ngIf="sortBy.sortBy == 'name'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                </div>
                <div class="tab-pane__table-cell crm-settings-company-industry-table__action"></div>
            </div>
        </div>
        <div
            class="tab-pane__table-body"
            *ngIf="!showPreloader"
        >
            <div
                class="text-center qt-df qt-jc-c qt-mb-24 qt-mt-24"
                *ngIf="deviceTypes.length == 0"
            >
                No device to show
            </div>
            <div
                class="tab-pane__table-row"
                *ngFor="let device of deviceTypes; let i = index"
                appClickOtside
                [init]="device.isInitEdit"
                [ngClass]="['edit-device-container-' + i,device.selected ? '--selected' : '']"
                [classParent]="'.edit-device-container-' + i"
                (onOutSide)="onEditDeviceType(device,$event)"
            >
                <div
                    class="tab-pane__table-cell crm-settings-company-industry-table__industry-type"
                    [ngClass]="{'--input-error' :  device.disableUpdate  }"
                >
                    <input
                        type="text"
                        class="form-input  --editable"
                        placeholder="Enter device Name"
                        [(ngModel)]="device.name"
                        maxlength="255"
                        appKeyUpEnter
                        (onChange)="onEditDeviceType(device,$event)"
                        (input)="device.onInitEdit(true);device.checkDublicate(deviceTypes)"
                    >
                    <app-mat-error
                        class="qt-tooltip-error"
                        *ngIf="device.disableUpdate"
                    >
                        This type is already occupied
                    </app-mat-error>
                </div>
                <div class="tab-pane__table-cell crm-settings-company-industry-table__action">
                    <div class="qt-df qt-ai-c">
                        <app-dynamic-tooltip
                            [content]="'Remove'"
                            [position]="'top'"
                            #removeTooltip
                        ></app-dynamic-tooltip>
                        <div
                            data-tooltip="Remove"
                            class="qt-icon icon__delete qt-sz-20 qt-bg-contain pointer"
                            (click)="onRemoveDeviceType(device)"
                            (mouseenter)="removeTooltip.show($event.target)"
                            (mouseleave)="removeTooltip.hide()"
                        >
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>










<div
    class="loading-container"
    *ngIf="showPreloader"
>
    <div class="loading"></div>
</div>
<app-device-setting-type-check-use></app-device-setting-type-check-use>
