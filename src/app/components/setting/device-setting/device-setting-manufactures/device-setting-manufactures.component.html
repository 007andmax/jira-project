<div class="cmn-area">
    <div
        class="tab-pane__table"
        [ngClass]="{'cleat-height-dataTable':!showPreloader}"
    >
        <div class="tab-pane__table-header">
            <div class="tab-pane__table-row">
                <div
                    class="tab-pane__table-cell crm-settings-company-industry-table__industry-type pointer"
                    (click)="onFilter('name')"
                >
                    Manufacture
                    <div class="qt-table-modern__sorting--new"></div>
                </div>
                <div class="tab-pane__table-cell crm-settings-company-industry-table__action"></div>
            </div>
        </div>
        <div
            class="tab-pane__table-body"
            *ngIf="!showPreloader"
        >
            <div
                class="text-center"
                *ngIf="manufactures.length == 0"
            >
                No manufacture to show
            </div>
            <div
                class="tab-pane__table-row"
                *ngFor="let manufacture of manufactures; let i = index"
                appClickOtside
                [init]="manufacture.isInitEdit"
                [ngClass]="['edit-manufacture-container-' + i,manufacture.selected ? '--selected' : '']"
                [class]="'.edit-manufacture-container-' + i"
                (onOutSide)="onEditManufactur(manufacture,$event)"
            >
                <div class="tab-pane__table-cell crm-settings-company-industry-table__industry-type">
                    <input
                        type="text"
                        class="form-input  --editable"
                        placeholder="Enter Manufacture Name"
                        [(ngModel)]="manufacture.name"
                        maxlength="255"
                        appKeyUpEnter
                        (onChange)="onEditManufactur(manufacture,$event)"
                        (input)="manufacture.onInitEdit(true)"
                    >
                </div>
                <div class="tab-pane__table-cell crm-settings-company-industry-table__action">
                    <div class="qt-df qt-ai-c">
                        <app-dynamic-tooltip
                            [content]="'Remove'"
                            [position]="'top'"
                            #removeTooltip
                        ></app-dynamic-tooltip>
                        <div
                            data-tooltip="Remove"
                            class="icon__remove qt-sz-20 qt-bg-contain pointer"
                            (click)="removeConfirmManufacturer(manufacture)"
                            (mouseenter)="removeTooltip.show($event.target)"
                            (mouseleave)="removeTooltip.hide()"
                        >
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div
    class="loading-container"
    *ngIf="showPreloader"
>
    <div class="loading"></div>
</div>
