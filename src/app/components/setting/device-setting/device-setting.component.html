<div class="page-container products-settings-page-container">
    <div class="page-insider manage-taxes">
        <div class="heading qt-df qt-ai-fs qt-jc-sb">
            <h5 class="qt-fw-600">Device Settings</h5>
            <div class="qt-df">
                <app-dynamic-tooltip
                    [content]="'Remove'"
                    [position]="'top'"
                    #removeTooltip
                ></app-dynamic-tooltip>
                <a
                    href="javascript:;"
                    (mouseenter)="removeTooltip.show($event.target)"
                    (mouseleave)="removeTooltip.hide()"
                    class="qt-button --md --gray button-gl-number__delete qt-ml-12"
                    
                    
                >
                    <div class="icon__remove qt-sz-16 qt-bg-contain qt-ic-c qt-button-icon"></div>
                </a>
                <a
                    href="javascript:;"
                    class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                    (click)="deviceSettingCreate()"
                >
                    <span class="icon__add--grey-500 qt-sz-16 qt-bg-contain qt-dib qt-mr-8 qt-button-icon"></span>
                    <span [textContent]="parseAddText()"></span>
                </a>
            </div>
        </div>
        <ngb-tabset
            #tabset="ngbTabset"  
            (tabChange)="setTab($event)"
            [destroyOnHide]="true"                      
        >
            <ngb-tab
                title="Device Type"
                id="deviceType"
            >
                <ng-template ngbTabContent>
                    <div class="cmn-area">
                        <div
                            class="tab-pane__table"
                            [ngClass]="{'cleat-height-dataTable':!showPreloader}"
                        >
                            <div class="tab-pane__table-header">
                                <div class="tab-pane__table-row">
                                    <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                                        <label class="qt-checkbox">
                                            <input
                                                type="checkbox"                                               
                                            >
                                            <span></span>
                                        </label>
                                    </div>
                                    <div
                                        class="tab-pane__table-cell crm-settings-company-industry-table__industry-type pointer"
                                        
                                    >
                                        Device Type
                                        <div class="qt-table-modern__sorting--new"></div>
                                    </div>
                                    <div
                                        class="tab-pane__table-cell crm-settings-company-industry-table__count pointer"
                                        
                                    >
                                        Count
                                        <div class="qt-table-modern__sorting--new"></div>
                                    </div>
                                    <div class="tab-pane__table-cell crm-settings-company-industry-table__action"></div>
                                </div>
                            </div>
                            <div
                                class="tab-pane__table-body"
                                *ngIf="!showPreloader"
                            >      
                            <div *ngIf="showAdd"
    class="tab-pane__table-row"
    appClickOtside
    #addStatusBtn="click"
    [init]="true"
    [class]="'.add-crm-industry-container'"
    (onOutSide)="save()"
>
    <div class="tab-pane__table-cell tab-pane__table-checkboxes"></div>
    <div
        class="tab-pane__table-cell crm-settings-company-industry-table__industry-type qt-pos-rel"
        [ngClass]="{'--input-error' : disableCreate}"
    >
        <input
            type="text"
            class="form-input --editable"
            placeholder="Enter Name DeviceType"
            [(ngModel)]="deviceTypeName"
            (input)="checkDublicateDeviceType()"
            (keyup)="onKeyUp($event)"
            maxlength="30"
            required
        >
        <mat-error
          class="invalid-feedback"
          *ngIf="disableCreate"
        >
          This devicetype is already exists.
        </mat-error>
    </div>
    <div class="tab-pane__table-cell crm-settings-company-industry-table__count"></div>
    <div class="tab-pane__table-cell crm-settings-company-industry-table__action"></div>
</div>                         
                                <div
                                    class="tab-pane__table-row"   
                                    *ngFor="let item of deviceTypeList; let i = index"
                                    appClickOtside
                                    [init]="item.isInitEdit"
                                    [ngClass]="'edit-crm-container-' + i"
                                    [class]="'.edit-crm-container-' + i"                                    
                                >
                                    <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                                        <label class="qt-checkbox">
                                            <input
                                                type="checkbox"                                                 
                                                [(ngModel)]="item.selected"                                              
                                            >
                                            <span></span>
                                        </label>
                                    </div>
                                    <div
                                        class="tab-pane__table-cell crm-settings-company-industry-table__industry-type"                                        
                                        [ngClass]="{'--input-error' :  item.disableUpdate  }"
                                    >   
                                        <input
                                            type="text"
                                            class="form-input --editable"
                                            placeholder="Enter DeviceType Name"
                                            [(ngModel)]="item.Name"
                                            appKeyUpEnter                                            
                                            maxlength="30"                                            
                                >
                                <mat-error
                                    class="qt-tooltip-error"
                                    *ngIf="item.disableUpdate"
                                >
                                    This DeviceType is already exists.
                                </mat-error>                                     
                                    </div>
                                    <div
                                        class="tab-pane__table-cell crm-settings-company-industry-table__count"
                                        [textContent]="item.Counter"
                                    ></div>
                                    <div class="tab-pane__table-cell crm-settings-company-industry-table__action">
                                        <div class="qt-df qt-ai-c">
                                            <app-dynamic-tooltip
                                                [content]="'Remove'"
                                                [position]="'top'"
                                                #removeTooltip
                                            ></app-dynamic-tooltip>
                                            <div
                                                data-tooltip="Remove"
                                                class="icon__remove qt-sz-20 qt-bg-contain pointer"
                                                (click)="removeDeviceType(item)"
                                                (mouseenter)="removeTooltip.show($event.target)"
                                                (mouseleave)="removeTooltip.hide()"
                                            >
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div
                                class="loading"
                                *ngIf="showPreloader"
                            ></div>
                        </div>
                    </div>
                </ng-template>
            </ngb-tab>
            <ngb-tab
                title="Manufacturer"
                id="deviceManufacturer"
            >
            <ng-template ngbTabContent>
                <div class="cmn-area">
                    <div

                    >

                            <div class="tab-pane__table-row">

                                    <label class="qt-checkbox">
                                        <input
                                            type="checkbox"                                               
                                        >
                                        <span></span>
                                    </label>
                                </div>
                                <div
                                    class="tab-pane__table-cell crm-settings-company-industry-table__industry-type pointer"

                                    Manufacturer

                                <div

                                </div>
                                <div class="tab-pane__table-cell crm-settings-company-industry-table__action"></div>
                            </div>
                        </div>
                        <div
                            class="tab-pane__table-body"

                            <div

                                <div

                                        [(ngModel)]="item.Name"

                                <mat-error
                                    class="qt-tooltip-error"
                                    *ngIf="item.disableUpdate"
                                >

                                </div>
                                <div

                                <div class="tab-pane__table-cell crm-settings-company-industry-table__action">
                                    <div class="qt-df qt-ai-c">
                                        <app-dynamic-tooltip

                                            [position]="'top'"
                                            #removeTooltip

                                        <div
                                            data-tooltip="Remove"
                                            class="icon__remove qt-sz-20 qt-bg-contain pointer"
                                            (click)="removeIndustry(item)"

                                        >

                                    </div>
                                </div>
                            </div>
                        </div>
                        <div
                            class="loading"

                                </div>
                                <div class="tab-pane__table-cell crm-settings-company-industry-table__action"></div>
                            </div>
                        </div>
                        <div

                            *ngIf="!showPreloader"

                            <div

                                        <input
                                            type="checkbox"

                                        >
                                        <span></span>
                                    </label>
                                </div>
                                <div
                                    class="tab-pane__table-cell crm-settings-company-industry-table__industry-type"  
                                    [ngClass]="{'--input-error' :  item.disableUpdate  }"                                      
                                > 
                                    <input
                                        type="text"
                                        class="form-input --editable"
                                        placeholder="Enter Model Name"
                                        [(ngModel)]="item.Name"
                                        appKeyUpEnter                                            
                                        maxlength="30"                                            
                                >
                                <mat-error
                                    class="qt-tooltip-error"
                                    *ngIf="item.disableUpdate"
                                >
                                    This Model is already exists.
                                </mat-error>                                                      
                                </div>
                                <div

            </ngb-tab>            
        </ngb-tabset>
    </div>
</div>

<div
    class="img-croparea deletePopup"
    *ngIf="popup"
>
    <div class="crop-inner">
        <div class="cropping">
            <div class="popup-message">
                <span class="icon-part">
                    <img
                        src="/html/assets/img/device/delete-red.svg"
                        alt="delete"
                    >
                </span>
                <div class="message-right">
                    <h2 class="h1">Delete DeviceType</h2>
                    <p>Are you sure you want to delete?</p>
                </div>
                <a
                    class="close-ico"
                    href="javascript:;"
                    (click)="popup = false"
                >
                    <img
                        src="/html/assets/img/icons/close.svg"
                        alt="close"
                    >
                </a>
            </div>
            <div class="btn-crops">
                <button
                    type="button"
                    class="btn btn-primary"
                    (click)="remove()"
                >
                    Yes, I am sure
                </button>
                <button
                    type="button"
                    class="btn btn-secondary"
                    (click)="popup = false"
                >
                    Cancel
                </button>
            </div>
        </div>
    </div>
</div>
