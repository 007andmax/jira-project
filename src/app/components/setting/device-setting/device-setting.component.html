<!-- Middle Wrapper -->
<div class="page-container">
  <div class="page-insider manage-tags">
      <div class="heading">
          <h1>Device Settings</h1>
          <span>
          <div class="heading-serach" *ngIf="devicebutton">
            <a
                href="javascript:;"
                class="btn-outline"
            >
                Add Device Type
            </a>
        </div>

        <div class="heading-serach" *ngIf="manufacturebutton">
          <a
              href="javascript:;"
              class="btn-outline"
          >
              Add Manufacture
          </a>
      </div>

      <div class="heading-serach" *ngIf="modelbutton">
        <a
            href="javascript:;"
            class="btn-outline"
        >
            Add Model
        </a>
    </div>
      </span>
      </div>
      <ngb-tabset  (tabChange)="toggle($event)">
          <!-- Device Type -->
          <ngb-tab
              title="Device Type"
              id="tab1"
          >
              <ng-template ngbTabContent >
                  <div class="cmn-area">
                      <div class="data-table-wrap">
                          <table
                              class="dataTable display"
                              style="width:100%"
                          >
                              <thead>
                                  <tr>
                                      <th class="t-name">Device Type
                                      </th>
                                      <th class="t-name">Count</th>
                                      <th class="action">&nbsp;</th>
                                  </tr>
                              </thead>
                              <tbody>
                              </tbody>
                          </table>
                      </div>
                  </div>
              </ng-template>
          </ngb-tab>
          <!-- Manufacture -->
          <ngb-tab title="Manufacture" id="tab2">
              <ng-template ngbTabContent>
                  <div class="cmn-area">
                      <div class="data-table-wrap">
                          <table
                              class="dataTable display"
                              style="width:100%"
                          >
                              <thead>
                                  <tr>
                                      <th class="t-name">Manufacture</th>
                                      <th class="t-name">Count</th>
                                      <th class="action">&nbsp;</th>
                                  </tr>
                              </thead>
                              <tbody>
                              </tbody>
                          </table>
                      </div>
                  </div>
              </ng-template>
          </ngb-tab>
          <!-- Model -->
          <ngb-tab title="Model" id="tab3">
              <ng-template ngbTabContent>
                  <div class="cmn-area">
                      <div class="data-table-wrap">
                          <table
                              class="dataTable display"
                              style="width:100%"
                          >
                              <thead>
                                  <tr>
                                      <th class="t-name">Model</th>
                                      <th class="t-name">Count</th>
                                      <th class="action">&nbsp;</th>
                                  </tr>
                              </thead>
                              <tbody>
                              </tbody>
                          </table>
                      </div>
                  </div>
              </ng-template>
          </ngb-tab>
      </ngb-tabset>
  </div>
</div>
