<!-- Middle Wrapper -->
<div class="page-container">
    <div class="page-insider manage-tags">
        <div class="heading qt-df qt-ai-fs qt-jc-sb">
            <h5 class="qt-fw-600">Device Settings</h5>
            <div class="qt-df">
                <app-dynamic-tooltip
                    [content]="'Remove'"
                    [position]="'top'"
                    #removeTooltip
                ></app-dynamic-tooltip>
                <a
                    href="javascript:;"
                    (mouseenter)="removeTooltip.show($event.target)"
                    (mouseleave)="removeTooltip.hide()"
                    class="qt-button --md --gray button-gl-number__delete qt-ml-12"
                    *ngIf="getSelectedCount() > 0"
                    (click)="removeList()"
                >
                    <div class="qt-icon icon__delete qt-sz-16 qt-bg-contain qt-ic-c qt-button-icon"></div>
                </a>
                <a
                    href="javascript:;"
                    class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                    (click)="openDeviceType()"
                >
                    <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-8 qt-button-icon"></span>
                    <span>Add Type</span>
                </a>
                <div class="qt-df qt-pos-rel">
                    <!-- <add-device-type
                        *ngIf="addDeviceType"
                        [techCompany]="techCompany"
                        (onClose)="onClosedAddDeviceType()"
                        (onAdded)="onAddDeviceType($event)"
                    ></add-device-type> -->
                    <app-add-device-setting-type
                        *ngIf="addDeviceType"
                        (onClose)="onClosedAddDeviceType()"
                        (onAdded)="addFastDeviceType($event)"
                    ></app-add-device-setting-type>
                    <!-- <add-manufacture
                        *ngIf="addManufacture"
                        [techCompany]="techCompany"
                        (onClose)="onClosedAddManufacture()"
                        (onAdded)="onAddManufacture($event)"
                    ></add-manufacture> -->
                    <!-- <add-model
                        *ngIf="addModel"
                        [techCompany]="techCompany"
                        (onClose)="onClosedAddModel()"
                        (onAdded)="onAddModel($event)"
                    ></add-model> -->
                </div>
            </div>
        </div>
        <ngb-tabset
            (tabChange)="toggle($event)"
            [destroyOnHide]="true"
        >
            <!-- Device Type -->
            <!-- <ngb-tab
                title="Device Type"
                id="deviceType"
            >
                <ng-template ngbTabContent>
                    <device-setting-device-type #deviceType></device-setting-device-type>
                </ng-template>
            </ngb-tab> -->
            <!-- Manufacture -->
            <ngb-tab
                title="Manufacturer / Model"
                id="manufacture"
            >
                <ng-template ngbTabContent>
                    <app-device-setting-manufactures #manufacture></app-device-setting-manufactures>
                </ng-template>
            </ngb-tab>
            <ngb-tab
                title="Device Type"
                id="device-type"
            >
                <ng-template ngbTabContent>
                    <app-device-setting-type #deviceType></app-device-setting-type>
                </ng-template>
            </ngb-tab>
        </ngb-tabset>
    </div>
</div>
<device-setting-aside></device-setting-aside>
