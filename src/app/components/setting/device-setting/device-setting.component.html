<!-- Middle Wrapper -->
<div class="page-container">
    <div class="page-insider manage-tags">
        <div class="heading qt-df qt-ai-fs qt-jc-sb">
            <h5 class="qt-fw-600">Device Settings</h5>
            <div class="qt-df">
                <div class="qt-df qt-pos-rel">
                    <a
                        href="javascript:;"
                        class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                        (click)="openModel(true, 0)"
                        *ngIf="devicebutton"
                    >
                        <span class="icon__add--grey-500 qt-sz-16 qt-bg-contain qt-dib qt-mr-8 qt-button-icon"></span>
                        Add Device Type
                    </a>
                    <a
                        href="javascript:;"
                        class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                        (click)="openModelManufacture(true, 0)"
                        *ngIf="manufacturebutton"
                    >
                        <span class="icon__add--grey-500 qt-sz-16 qt-bg-contain qt-dib qt-mr-8 qt-button-icon"></span>
                        Add Manufacture
                    </a>
                    <a
                        href="javascript:;"
                        class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                        (click)="openModelPopup(true, 0)"
                        *ngIf="modelbutton"
                    >
                        <span class="icon__add--grey-500 qt-sz-16 qt-bg-contain qt-dib qt-mr-8 qt-button-icon"></span>
                        Add Model
                    </a>
                    <add-device-type
                        *ngIf="addDeviceType"
                        [techCompany]="techCompany"
                        (onClose)="onClosedAddDeviceType()"
                        (onAdded)="onAddDeviceType()"
                    ></add-device-type>
                    <add-manufacture
                        *ngIf="addManufacture"
                        [techCompany]="techCompany"
                        (onClose)="onClosedAddManufacture()"
                        (onAdded)="onAddManufacture()"
                    ></add-manufacture>
                    <add-model
                        *ngIf="addModel"
                        [manufactureId]="manufactureId"
                        (onClose)="onClosedAddModel()"
                        (onAdded)="onAddModel()"
                    ></add-model>
                </div>
            </div>
        </div>
        <ngb-tabset (tabChange)="toggle($event)">
            <!-- Device Type -->
            <ngb-tab
                title="Device Type"
                id="tab1"
            >
                <ng-template ngbTabContent>
                    <device-setting-device-type #deviceType></device-setting-device-type>
                </ng-template>
            </ngb-tab>
            <!-- Manufacture -->
            <ngb-tab
                title="Manufacture"
                id="tab2"
            >
                <ng-template ngbTabContent>
                    <device-setting-manufacture #manufacture></device-setting-manufacture>
                </ng-template>
            </ngb-tab>
            <!-- Model -->
            <ngb-tab
                title="Model"
                id="tab3"
            >
                <ng-template ngbTabContent>
                    <device-setting-model
                        #model
                        (onSelectManufactureId)="onSelectManufactureId($event)"
                    ></device-setting-model>
                </ng-template>
            </ngb-tab>
        </ngb-tabset>
    </div>
</div>
<device-setting-aside></device-setting-aside>
