<div class="page-container products-settings-page-container">
    <div class="page-insider manage-taxes">
        <div class="heading qt-df qt-ai-fs qt-jc-sb">
            <h5 class="qt-fw-600">Device Settings</h5>
            <div class="qt-df">
                <app-dynamic-tooltip
                    [content]="'Remove'"
                    [position]="'top'"
                    #removeTooltip
                ></app-dynamic-tooltip>            
                <a
                    href="javascript:;"
                    (mouseenter)="removeTooltip.show($event.target)"
                    (mouseleave)="removeTooltip.hide()"
                    class="qt-button --md --gray button-gl-number__delete qt-ml-12"
                    
                    
                >
                    <div class="icon__remove qt-sz-16 qt-bg-contain qt-ic-c qt-button-icon"></div>
                </a>
                <form method="GET" class="qt-ml-12">
                    <span class="qt-input-search">
                        <input
                            type="search"
                            class="qt-input-search"
                            [(ngModel)]="searchAll"
                            name="searchAll"
                            placeholder="Search"                            
                        >
                    </span>
                </form>
                <a
                    href="javascript:;"
                    class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                    (click)="deviceSettingCreate()"
                >
                    <span class="icon__add--grey-500 qt-sz-16 qt-bg-contain qt-dib qt-mr-8 qt-button-icon"></span>
                    <span [textContent]="parseAddText()"></span>
                </a>
            </div>
        </div>
        <ngb-tabset
            #tabset="ngbTabset"  
            (tabChange)="setTab($event)"
            [destroyOnHide]="true"                      
        >
            <ngb-tab
                title="Device Type"
                id="deviceType"
            >
                <ng-template ngbTabContent>
                    <div class="cmn-area">
                        <div
                            class="tab-pane__table"
                            [ngClass]="{'cleat-height-dataTable':!showPreloader}"
                        >
                            <div class="tab-pane__table-header">
                                <div class="tab-pane__table-row">
                                    <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                                        <label class="qt-checkbox">
                                            <input
                                                type="checkbox"                                               
                                            >
                                            <span></span>
                                        </label>
                                    </div>
                                    <div
                                        class="tab-pane__table-cell crm-settings-company-industry-table__industry-type pointer"
                                        (click)="onFilter('name')"
                                    >
                                        Device Type
                                        <div class="qt-table-modern__sorting--new"></div>
                                    </div>
                                    <div
                                        class="tab-pane__table-cell crm-settings-company-industry-table__count pointer"
                                        (click)="onFilter('count')"
                                    >
                                        Count
                                        <div class="qt-table-modern__sorting--new"></div>
                                    </div>
                                    <div class="tab-pane__table-cell crm-settings-company-industry-table__action"></div>
                                </div>
                            </div>
                            <div
                                class="tab-pane__table-body"
                                *ngIf="!showPreloader"
                            >      
                            <div *ngIf="showAdd"
    class="tab-pane__table-row"
    appClickOtside
    #addStatusBtn="click"
    [init]="true"
    [class]="'.add-crm-industry-container'"
    (onOutSide)="deviceTypeSave()"
>
    <div class="tab-pane__table-cell tab-pane__table-checkboxes"></div>
    <div
        class="tab-pane__table-cell crm-settings-company-industry-table__industry-type qt-pos-rel"
        [ngClass]="{'--input-error' : disableCreate}"
    >
        <input
            type="text"
            class="form-input --editable"
            placeholder="Enter Name DeviceType"
            [(ngModel)]="deviceTypeName"            
            (keyup)="onKeyUp($event,DeviceType)"            
            required
        >
        <mat-error
          class="invalid-feedback"
          *ngIf="disableCreate"
        >
          This devicetype is already exists.
        </mat-error>
    </div>
    <div class="tab-pane__table-cell crm-settings-company-industry-table__count"></div>
    <div class="tab-pane__table-cell crm-settings-company-industry-table__action"></div>
</div>                         
                                <div
                                    class="tab-pane__table-row"   
                                    *ngFor="let item of deviceTypeList | modelFilter: searchAll; let i = index"
                                    appClickOtside
                                    [init]="item.isInitEdit"
                                    [ngClass]="'edit-crm-container-' + i"
                                    [class]="'.edit-crm-container-' + i"                                    
                                >
                                    <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                                        <label class="qt-checkbox">
                                            <input
                                                type="checkbox"                                                 
                                                [(ngModel)]="item.selected"                                              
                                            >
                                            <span></span>
                                        </label>
                                    </div>
                                    <div
                                        class="tab-pane__table-cell crm-settings-company-industry-table__industry-type crm-pd-l"
                                        [textContent]="item.Name">                                                                                          
                                    </div>
                                    <div
                                        class="tab-pane__table-cell crm-settings-company-industry-table__count"
                                        [textContent]="item.Counter"
                                    ></div>
                                    <div class="tab-pane__table-cell crm-settings-company-industry-table__action">
                                        <div class="qt-df qt-ai-c">
                                            <app-dynamic-tooltip
                                                [content]="'Remove'"
                                                [position]="'top'"
                                                #removeTooltip
                                            ></app-dynamic-tooltip>
                                            <div
                                                data-tooltip="Remove"
                                                class="icon__remove qt-sz-20 qt-bg-contain pointer"
                                                (click)="removeDeviceType(item,tag)"
                                                (mouseenter)="removeTooltip.show($event.target)"
                                                (mouseleave)="removeTooltip.hide()"
                                            >
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div
                                class="loading"
                                *ngIf="showPreloader"
                            ></div>
                        </div>
                    </div>
                </ng-template>
            </ngb-tab>
            <ngb-tab
                title="Manufacturer"
                id="deviceManufacturer"
            >
            <ng-template ngbTabContent>
                <div class="cmn-area">
                    <div
                        class="tab-pane__table"
                        [ngClass]="{'cleat-height-dataTable':!showPreloader}"
                    >
                        <div class="tab-pane__table-header">
                            <div class="tab-pane__table-row">
                                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                                    <label class="qt-checkbox">
                                        <input
                                            type="checkbox"                                               
                                        >
                                        <span></span>
                                    </label>
                                </div>
                                <div
                                    class="tab-pane__table-cell crm-settings-company-industry-table__industry-type pointer"
                                    (click)="onFilterManufacturer('name')"
                                >
                                    Manufacturer
                                    <div class="qt-table-modern__sorting--new"></div>
                                </div>
                                <div
                                    class="tab-pane__table-cell crm-settings-company-industry-table__count pointer"
                                    (click)="onFilterManufacturer('count')"
                                >
                                    Count
                                    <div class="qt-table-modern__sorting--new"></div>
                                </div>
                                <div class="tab-pane__table-cell crm-settings-company-industry-table__action"></div>
                            </div>
                        </div>
                        <div
                            class="tab-pane__table-body"
                            *ngIf="!showPreloader"
                        >     
                        <div *ngIf="showAdd"
                        class="tab-pane__table-row"
                        appClickOtside
                        #addStatusBtn="click"
                        [init]="true"
                        [class]="'.add-crm-industry-container'"
                        (onOutSide)="deviceManufacturerSave()"
                    >
                        <div class="tab-pane__table-cell tab-pane__table-checkboxes"></div>
                        <div
                            class="tab-pane__table-cell crm-settings-company-industry-table__industry-type qt-pos-rel"
                            [ngClass]="{'--input-error' : disableCreate}"
                        >
                            <input
                                type="text"
                                class="form-input --editable"
                                placeholder="Enter Name Manufacturer"
                                [(ngModel)]="deviceTypeManufacturer"                                
                                (keyup)="onKeyUp($event,Manufcaturer)"            
                                required
                            >
                            <mat-error
                              class="invalid-feedback"
                              *ngIf="disableCreate"
                            >
                              This Manufacture is already exists.
                            </mat-error>
                        </div>
                        <div class="tab-pane__table-cell crm-settings-company-industry-table__count"></div>
                        <div class="tab-pane__table-cell crm-settings-company-industry-table__action"></div>
                    </div>                            
                            <div
                                class="tab-pane__table-row"                                   
                                *ngFor="let item of manufacturerList | modelFilter: searchAll; let i = index"
                                appClickOtside
                                [init]="item.isInitEdit"
                                [ngClass]="'edit-crm-container-' + i"
                                [class]="'.edit-crm-container-' + i"                                    
                            >
                                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                                    <label class="qt-checkbox">
                                        <input
                                            type="checkbox" 
                                            [(ngModel)]="item.selected"                                              
                                        >
                                        <span></span>
                                    </label>
                                </div>
                                <div
                                    class="tab-pane__table-cell crm-settings-company-industry-table__industry-type crm-pd-l"
                                    [textContent]="item.Name">                                                                                                                                                                                                  
                                </div>
                                <div
                                    class="tab-pane__table-cell crm-settings-company-industry-table__count"
                                    [textContent]="item.Counter"
                                ></div>
                                <div class="tab-pane__table-cell crm-settings-company-industry-table__action">
                                    <div class="qt-df qt-ai-c">
                                        <app-dynamic-tooltip
                                            [content]="'Remove'"
                                            [position]="'top'"
                                            #removeTooltip
                                        ></app-dynamic-tooltip>
                                        <div
                                            data-tooltip="Remove"
                                            class="icon__remove qt-sz-20 qt-bg-contain pointer"
                                            (click)="removeManufacturer(item)"
                                            (mouseenter)="removeTooltip.show($event.target)"
                                            (mouseleave)="removeTooltip.hide()"
                                        >
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div
                            class="loading"
                            *ngIf="showPreloader"
                        ></div>
                    </div>
                </div>
            </ng-template>
            </ngb-tab>
            <ngb-tab
                title="Model"
                id="deviceModel"
            >
            <ng-template ngbTabContent>
                <div class="cmn-area">
                    <div
                        class="tab-pane__table"
                        [ngClass]="{'cleat-height-dataTable':!showPreloader}"
                    >
                        <div class="tab-pane__table-header">
                            <div class="tab-pane__table-row">
                                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                                    <label class="qt-checkbox">
                                        <input
                                            type="checkbox"                                               
                                        >
                                        <span></span>
                                    </label>
                                </div>
                                <div class="tab-pane__table-cell crm-settings-company-industry-table__industry-type pointer"
                                    (click)="onFilterModel('manufacturer')"
                                >
                                    Manufacturer
                                    <div class="qt-table-modern__sorting--new"></div>
                                </div>
                                <div
                                    class="tab-pane__table-cell crm-settings-company-industry-table__industry-type pointer"
                                    (click)="onFilterModel('name')"    
                                >
                                    Model
                                    <div class="qt-table-modern__sorting--new"></div>
                                </div>
                                <div
                                    class="tab-pane__table-cell crm-settings-company-industry-table__count pointer"
                                    (click)="onFilterModel('count')"
                                >
                                    Count
                                    <div class="qt-table-modern__sorting--new"></div>
                                </div>
                                <div class="tab-pane__table-cell crm-settings-company-industry-table__action"></div>
                            </div>
                        </div>
                        <div
                            class="tab-pane__table-body"
                            *ngIf="!showPreloader"
                        >        
                        <div *ngIf="showAdd"
                        class="tab-pane__table-row"
                        appClickOtside
                        #addStatusBtn="click"
                        [init]="true"
                        [class]="'.add-crm-industry-container'"
                        (onOutSide)="deviceModelSave()"
                    >
                        <div class="tab-pane__table-cell tab-pane__table-checkboxes"></div>
                        <div
                            class="tab-pane__table-cell crm-settings-company-industry-table__industry-type qt-pos-rel"                            
                        >
                        <app-drop-down
                                #manufacturer
                                [class]="['light-dropdown', 'qt-select-input-40']"
                                [placeholder]="'Select Manufacture'"
                                [list]="manufacturerList"
                                [field]="'Name'"
                                [search]="true"
                                [change]="true"
                                (onSelectedItem)="onSelectManufactureName($event)"
                                ></app-drop-down>        
                        </div>
                        <div class="tab-pane__table-cell crm-settings-company-industry-table__count">   
                            <span *ngIf="showModel">                         
                            <input
                            type="text"
                            class="form-input --editable"
                            placeholder="Enter Name Model"
                            [(ngModel)]="deviceTypeModel"                                
                            (keyup)="onKeyUp($event,Model)"            
                            required
                        >                          
                    </span>
                        </div>
                        <div class="tab-pane__table-cell crm-settings-company-industry-table__action"></div>
                    </div>                         
                            <div
                                class="tab-pane__table-row"  
                                *ngFor="let item of modelList | modelFilter: searchAll; let i = index"
                                appClickOtside
                                [init]="item.isInitEdit"
                                [ngClass]="'edit-crm-container-' + i"
                                [class]="'.edit-crm-container-' + i"                                  
                            >
                                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                                    <label class="qt-checkbox">
                                        <input
                                            type="checkbox" 
                                            [(ngModel)]="item.selected"                                               
                                        >
                                        <span></span>
                                    </label>
                                </div>
                                <div class="tab-pane__table-cell crm-settings-company-industry-table__industry-type crm-pd-l"
                                    [textContent]="item.ManufactureName">

                                </div>
                                <div
                                    class="tab-pane__table-cell crm-settings-company-industry-table__industry-type"
                                    [textContent]="item.Name">                                                                                                                           
                                </div>
                                <div
                                    class="tab-pane__table-cell crm-settings-company-industry-table__count"
                                    [textContent]="item.Counter"
                                ></div>
                                <div class="tab-pane__table-cell crm-settings-company-industry-table__action">
                                    <div class="qt-df qt-ai-c">
                                        <app-dynamic-tooltip
                                            [content]="'Remove'"
                                            [position]="'top'"
                                            #removeTooltip
                                        ></app-dynamic-tooltip>
                                        <div
                                            data-tooltip="Remove"
                                            class="icon__remove qt-sz-20 qt-bg-contain pointer"
                                            (click)="removeModel(item)"
                                            (mouseenter)="removeTooltip.show($event.target)"
                                            (mouseleave)="removeTooltip.hide()"
                                        >
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div
                            class="loading"
                            *ngIf="showPreloader"
                        ></div>
                    </div>
                </div>
            </ng-template>
            </ngb-tab>            
        </ngb-tabset>
    </div>
</div>


<div
    class="archive-modal device-setting-center"
    *ngIf="popup"
>
    <button
        class="close-modal device-setting-close-model"
        (click)=closeModal()
    ></button>
    <div class="archive-modal__body">
        <h3 [textContent]="message"></h3>
        <p>Are you sure want to delete?</p>
    </div>
    <div class="archive-modal__footer">
        <div class="d-f qt-jc-fe">
            <button
                class="btn-new btn-primary"
                (click)="removeConfirm(removeType)"
            >
                Yes, I am sure
            </button>
            <button
                class="btn-new disabled"
                (click)=cancelConfirm()
            >
                Cancel
            </button>
        </div>
    </div>
</div>
