<!-- Middle Wrapper -->
<div class="page-container">
    <div class="page-insider manage-tags">
        <div class="heading qt-df qt-ai-fs qt-jc-sb">
            <h5 class="qt-fw-600">Device Settings</h5>
            <div class="qt-df">
                <app-dynamic-tooltip
                    [content]="'Remove'"
                    [position]="'top'"
                    #removeTooltip
                ></app-dynamic-tooltip>
                <a
                    href="javascript:;"
                    (mouseenter)="removeTooltip.show($event.target)"
                    (mouseleave)="removeTooltip.hide()"
                    class="qt-button --md --gray button-gl-number__delete qt-ml-12"
                    *ngIf="getSelectedCount() > 0"
                    (click)="removeList()"
                >
                    <div class="qt-icon icon__remove qt-sz-16 qt-bg-contain qt-ic-c qt-button-icon"></div>
                </a>
                <div class="qt-df qt-pos-rel">
                    <a
                        href="javascript:;"
                        class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                        (click)="openModel()"
                        *ngIf="devicebutton"
                    >
                        <span class="icon__add--grey-500 qt-sz-16 qt-bg-contain qt-dib qt-mr-8 qt-button-icon"></span>
                        Add Device Type
                    </a>
                    <a
                        href="javascript:;"
                        class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                        (click)="openModelManufacture()"
                        *ngIf="manufacturebutton"
                    >
                        <span class="icon__add--grey-500 qt-sz-16 qt-bg-contain qt-dib qt-mr-8 qt-button-icon"></span>
                        Add Manufacture
                    </a>
                    <a
                        href="javascript:;"
                        class="qt-button --md --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
                        (click)="openModelPopup()"
                        *ngIf="modelbutton"
                    >
                        <span class="icon__add--grey-500 qt-sz-16 qt-bg-contain qt-dib qt-mr-8 qt-button-icon"></span>
                        Add Model
                    </a>
                    <add-device-type
                        *ngIf="addDeviceType"
                        [techCompany]="techCompany"
                        (onClose)="onClosedAddDeviceType()"
                        (onAdded)="onAddDeviceType($event)"
                    ></add-device-type>
                    <add-manufacture
                        *ngIf="addManufacture"
                        [techCompany]="techCompany"
                        (onClose)="onClosedAddManufacture()"
                        (onAdded)="onAddManufacture($event)"
                    ></add-manufacture>
                    <add-model
                        *ngIf="addModel"
                        [techCompany]="techCompany"
                        (onClose)="onClosedAddModel()"
                        (onAdded)="onAddModel($event)"
                    ></add-model>
                </div>
            </div>
        </div>
        <ngb-tabset
            (tabChange)="toggle($event)"
            [destroyOnHide]="true"
        >
            <!-- Device Type -->
            <ngb-tab
                title="Device Type"
                id="deviceType"
            >
                <ng-template ngbTabContent>
                    <device-setting-device-type #deviceType></device-setting-device-type>
                </ng-template>
            </ngb-tab>
            <!-- Manufacture -->
            <ngb-tab
                title="Manufacture"
                id="manufacture"
            >
                <ng-template ngbTabContent>
                    <device-setting-manufacture #manufacture></device-setting-manufacture>
                </ng-template>
            </ngb-tab>
            <!-- Model -->
            <ngb-tab
                title="Model"
                id="model"
            >
                <ng-template ngbTabContent>
                    <device-setting-model
                        #model
                        (onSelectManufactureId)="onSelectManufactureId($event)"
                    ></device-setting-model>
                </ng-template>
            </ngb-tab>
        </ngb-tabset>
    </div>
</div>
<device-setting-aside></device-setting-aside>
