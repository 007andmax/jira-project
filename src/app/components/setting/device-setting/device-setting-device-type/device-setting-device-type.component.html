<div class="cmn-area">
    <div
        class="tab-pane__table"
        [ngClass]="{'cleat-height-dataTable':!showPreloader}"
    >
        <div class="tab-pane__table-header">
            <div class="tab-pane__table-row">
                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                    <label class="qt-checkbox">
                        <input
                            type="checkbox"
                            [(ngModel)]="selectAllDevices"
                            (change)="toogleDevices($event.target.checked)"
                        >
                        <span></span>
                    </label>
                </div>
                <div
                    class="tab-pane__table-cell crm-settings-company-industry-table__industry-type pointer"
                    (click)="onFilter('Name')"
                >
                    Device Type
                    <div class="qt-table-modern__sorting--new"></div>
                </div>
                <div
                    class="tab-pane__table-cell crm-settings-company-industry-table__count pointer"
                    (click)="onFilter('Counter')"
                >
                    Count
                    <div class="qt-table-modern__sorting--new"></div>
                </div>
                <div class="tab-pane__table-cell crm-settings-company-industry-table__action"></div>
            </div>
        </div>
        <div
            class="tab-pane__table-body"
            *ngIf="!showPreloader"
        >
            <div
                class="text-center"
                *ngIf="!deviceTypeList || deviceTypeList.length == 0"
            >
                No devices type to show
            </div>
            <div
                class="tab-pane__table-row"
                *ngFor="let deviceType of deviceTypeList; let i = index"
            >
                <div class="tab-pane__table-cell tab-pane__table-checkboxes">
                    <label class="qt-checkbox">
                        <input
                            type="checkbox"
                            [(ngModel)]="deviceType.selected"
                            (change)="onSelect(i,$event.target.checked)"
                        >
                        <span></span>
                    </label>
                </div>
                <div
                    class="tab-pane__table-cell crm-settings-company-industry-table__industry-type"
                    [textContent]="deviceType.Name"
                ></div>
                <div class="tab-pane__table-cell crm-settings-company-industry-table__count">
                    <div
                        *ngIf="deviceType.Counter != 0"
                        (click)="counterPopup(deviceType)"
                        [textContent]="deviceType.Counter"
                    >
                    </div>
                    <div
                        *ngIf="deviceType.Counter == 0"
                        [textContent]="deviceType.Counter"
                    ></div>
                </div>
                <div class="tab-pane__table-cell crm-settings-company-industry-table__action">
                    <div class="qt-df qt-ai-c">
                        <app-dynamic-tooltip
                            [content]="'Remove'"
                            [position]="'top'"
                            #removeTooltip
                        ></app-dynamic-tooltip>
                        <div
                            data-tooltip="Remove"
                            class="qt-icon icon__remove qt-sz-20 qt-bg-contain pointer"
                            (click)="removeConfirm(deviceType)"
                            (mouseenter)="removeTooltip.show($event.target)"
                            (mouseleave)="removeTooltip.hide()"
                        >
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div
    class="loading-container"
    *ngIf="showPreloader"
>
    <div class="loading"></div>
</div>
