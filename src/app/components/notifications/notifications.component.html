<div
    [hidden]="!opened"
    class="qt-aside-modern"
>
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-info qt-df qt-ai-c">
            <div class="qt-aside__title">Create New Ticket</div>
        </div>
        <div>
            <div
                class="qt-aside__close-modal"
                (click)="closed()"
            >
                <div class="qt-icon icon__close qt-sz-20"></div>
            </div>
        </div>
    </div>
    <div
        class="qt-aside-modern__content"
        infiniteScroll
        [infiniteScrollDistance]="2"
        [infiniteScrollThrottle]="30"
        [infiniteScrollDisabled]="infiniteScrollDisabled"
        (scrolled)="onScroll()"
    >
        <ng-template
            ngFor
            let-item
            [ngForOf]="list"
            [ngForTrackBy]="trackById"
        >
            <div class="notification-item">
                <div
                    class="notification-item__title"
                    [textContent]="item.title"
                ></div>
                <div
                    class="notification-item__subject"
                    *ngIf="item.type === 'TICKET_ASSIGNED'"
                    [textContent]="item.ticket.subject"
                ></div>
                <div
                    class="notification-item__company"
                    *ngIf="item.type === 'TICKET_ASSIGNED'"
                    [textContent]="item.ticket.companyName"
                ></div>
                <div
                    class="notification-item__date"
                    *ngIf="item.type === 'TICKET_ASSIGNED'"
                    [textContent]="parsedate(item.ticket.createdAt)"
                ></div>
                <div
                    class="notification-item__link"
                    *ngIf="item.type === 'TICKET_ASSIGNED'"
                >
                    View Ticket
                </div>
            </div>
        </ng-template>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="qt-df qt-w100">
            <button
                class="qt-button --gray qt-mr-12 qt-w100 qt-jc-c"
                (click)="closed()"
            >
                Cancel
            </button>
        </div>
    </div>
</div>
