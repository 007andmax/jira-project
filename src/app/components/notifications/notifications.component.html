<div
    [hidden]="!opened"
    class="qt-aside-modern"
>
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-info qt-df qt-ai-c">
            <div class="qt-aside__title">Notifications</div>
        </div>
        <div class="qt-df qt-ai-c">
            <div
                class="qt-df qt-ai-c"
                *ngIf="checkMarkAsReadAll()"
            >
                <div class="qt-icon qt-icon__blue-light-600 icon__mark-read qt-bg-contain qt-sz-20  qt-mr-8"></div>
                <div
                    class="qt-color-info pointer qt-mr-8 qt-fs-14 qt-fw-500"
                    (click)="markAsReadAll()"
                >
                    Mark all as read
                </div>
            </div>
            <div
                class="qt-button --square-md --gray pointer"
                (click)="closed()"
            >
                <div class="qt-icon icon__close qt-sz-16 pointer"></div>
            </div>
        </div>
    </div>
    <div class="qt-df qt-ai-c qt-pl-24 qt-pr-24 qt-fs-14 qt-fw-500 qt-aside-modern__tabs">
        <div
            class="qt-aside-modern__tabs-item pointer qt-mr-24"
            [ngClass]="{'--active':!onlyUnread}"
            (click)="setOnlyUnread(false); setDefaultScoll()"
        >
            All
        </div>
        <div
            class="qt-aside-modern__tabs-item pointer qt-mr-6"
            [ngClass]="{'--active':onlyUnread}"
            (click)="setOnlyUnread(true); setDefaultScoll()"
        >
            Unread
        </div>
        <div
            class="count"
            [textContent]="getNotificationCounter()"
        ></div>
    </div>
    <div
        #content
        class="qt-aside-modern__content"
        infiniteScroll
        [infiniteScrollContainer]="content"
        [infiniteScrollDistance]="2"
        [infiniteScrollThrottle]="50"
        [infiniteScrollDisabled]="infiniteScrollDisabled"
        (scrolled)="onScroll()"
    >
        <div
            class="qt-aside-modern__content-empty qt-df qt-ai-c qt-jc-c qt-fd-c"
            *ngIf="!list || list.length === 0 && !showPreloader"
        >
            <div class="qt-aside-modern__content-empty-icon qt-mb-16">
                <div class="qt-icon icon__notification qt-bg-contain qt-sz-24 pointer"></div>
            </div>
            <div class="qt-fs-14 qt-fw-600 qt-color-gray-900 qt-mb-4">You’re up to date</div>
            <div class="qt-fs-14 qt-fw-400 qt-color-gray-500">
                We’ll keep you updated on any future notifications
            </div>
        </div>
        <ng-template
            ngFor
            let-item
            [ngForOf]="list"
            [ngForTrackBy]="trackById"
        >
            <div
                class="notification-item qt-df qt-ai-c pointer"
                (click)="showDetails(item)"
            >
                <div
                    class="notification-item__delete qt-button --square-md --gray pointer"
                    placement="top"
                    ngbTooltip="Delete"
                    container="body"
                    (click)="remove($event,item)"
                >
                    <div class="qt-icon icon__close qt-sz-12 pointer"></div>
                </div>
                <!-- <div class="notification-item__mark-read pointer">
                    <div
                        class="qt-icon icon__mark-as-read qt-sz-20 qt-bg-contain qt-mb-8"
                        *ngIf="!item.read"
                        placement="top"
                        ngbTooltip="Mark as read"
                        container="body"
                        (click)="markAsRead(item)"
                    ></div>
                    <div
                        class="qt-icon icon__delete qt-icon__red-600 qt-bg-contain qt-sz-20 "
                        placement="top"
                        ngbTooltip="Delete"
                        container="body"
                        (click)="remove(item)"
                    ></div>
                </div> -->
                <div class="notification-item__icon qt-mr-12">
                    <div
                        [ngClass]="{'icon__tickets':item.type === 'TICKET_ASSIGNED',
                        'icon__products':item.type === 'PRODUCT_ASSIGNED' || item.type === 'PRODUCT_UPDATED',
                        'icon__service':item.type === 'SERVICE_ASSIGNED' || item.type === 'SERVICE_UPDATED',
                         'icon__done':item.type === 'PRODUCT_COMPLETED' || item.type === 'SERVICE_COMPLETED',
                          'icon__edit':item.type === 'NOTE_CREATED',
                           'icon__quotes':item.type === 'QUOTE_STATUS_UPDATED',
                    }"
                        class="qt-icon qt-bg-contain qt-sz-18"
                    ></div>
                    <div
                        class="notification-item__mark-read"
                        *ngIf="!item.read"
                    ></div>
                </div>
                <div
                    class="notification-item__title qt-fs-14"
                    [innerHTML]="item.title"
                ></div>
                <!-- <div
                    class="notification-item__subject qt-df qt-ai-c qt-mb-8"
                    *ngIf="item.type === 'TICKET_ASSIGNED' || item.type === 'PRODUCT_UPDATED' || item.type === 'SERVICE_UPDATED' || item.type ===  'NOTE_CREATED' || item.type === 'SERVICE_COMPLETED' || item.type === 'PRODUCT_COMPLETED'"
                >
                    <div class="qt-icon icon__tickets qt-bg-contain  qt-mr-8"></div>
                    Subject: {{item.ticket.subject}}
                </div>
                <div
                    class="notification-item__number qt-mb-8 qt-df qt-ai-c"
                    *ngIf="item.type === 'PRODUCT_UPDATED' || item.type === 'SERVICE_UPDATED' || item.type ===  'NOTE_CREATED' || item.type === 'SERVICE_COMPLETED' || item.type === 'PRODUCT_COMPLETED'"
                >
                    <div class="qt-icon icon__info qt-bg-contain qt-sz-18  qt-mr-8"></div>
                    Ticket number: {{item.ticket.number}}
                </div>
                <div
                    class="notification-item__note qt-mb-8 qt-df qt-ai-fs"
                    *ngIf="item.type === 'NOTE_CREATED'"
                >
                    <div class="qt-icon icon__messages  qt-bg-contain qt-sz-18  qt-mr-8"></div>
                    <div class="qt-w100">
                        <div class="qt-df qt-ai-c qt-jc-sb qt-w100">
                            <div>Note:</div>
                            <span
                                class="qt-color-info qt-fs-13 qt-fw-600 pointer"
                                *ngIf="item.shortNote"
                                (click)="item.showMoreNote = !item.showMoreNote"
                                [textContent]="item.showMoreNote ? 'Show less' : 'Show more'"
                            ></span>
                        </div>
                        <div [innerHTML]="!item.showMoreNote ? item.shortNote : item.note"></div>
                    </div>
                </div>
                <div
                    class="notification-item__service-name qt-mb-8 qt-df qt-ai-c"
                    *ngIf="item.type === 'SERVICE_UPDATED' || item.type === 'SERVICE_COMPLETED'"
                >
                    <div class="qt-icon icon__service  qt-bg-contain  qt-mr-8"></div>
                    {{item.service.name}}
                </div>
                <div
                    class="notification-item__product-name qt-mb-8 qt-df qt-ai-c"
                    *ngIf="item.type === 'PRODUCT_UPDATED' || item.type === 'PRODUCT_COMPLETED'"
                >
                    <div class="qt-icon icon__products qt-bg-contain qt-mr-8"></div>
                    <div [innerHTML]="item.product.description"></div>
                </div>
                <div
                    class="notification-item__date qt-df qt-ai-c qt-mb-8"
                    *ngIf="item.type === 'SERVICE_UPDATED'"
                >
                    <div class="qt-icon icon__time  qt-bg-contain qt-sz-18  qt-mr-8"></div>
                    {{parsedate(item.service.createdAt)}}
                </div>
                <div
                    class="notification-item__date qt-df qt-ai-c qt-mb-8"
                    *ngIf="item.type === 'PRODUCT_UPDATED'"
                >
                    <div class="qt-icon icon__time  qt-bg-contain qt-sz-18  qt-mr-8"></div>
                    {{parsedate(item.product.createdAt)}}
                </div>
                <div
                    class="notification-item__company qt-df qt-ai-c qt-mb-8"
                    *ngIf="item.type === 'TICKET_ASSIGNED'"
                >
                    <div class="qt-icon icon__companies qt-bg-contain qt-sz-18  qt-mr-8"></div>
                    Company: {{item.ticket.companyName}}
                </div>
                <div
                    class="notification-item__company qt-df qt-ai-c qt-mb-8"
                    *ngIf="item.type === 'QUOTE_STATUS_UPDATED'"
                >
                    <div class="qt-icon icon__companies qt-bg-contain qt-sz-18  qt-mr-8"></div>
                    Company: {{item.saleQuote.companyName}}
                </div>
                <div
                    class="notification-item__company qt-df qt-ai-c qt-mb-8"
                    *ngIf="item.type === 'QUOTE_STATUS_UPDATED'"
                >
                    <div class="qt-icon icon__companies qt-bg-contain qt-sz-18  qt-mr-8"></div>
                    Status: {{item.saleQuote.status}}
                </div>
                <div
                    class="notification-item__date qt-df qt-ai-c qt-mb-8"
                    *ngIf="item.type === 'TICKET_ASSIGNED'"
                >
                    <div class="qt-icon icon__time  qt-bg-contain qt-sz-18  qt-mr-8"></div>
                    {{parsedate(item.ticket.createdAt)}}
                </div>
                <div
                    class="notification-item__link qt-color-info qt-fs-13 qt-fw-600 pointer"
                    *ngIf="item.type === 'TICKET_ASSIGNED' || item.type === 'PRODUCT_UPDATED' || item.type === 'SERVICE_UPDATED' || item.type === 'SERVICE_COMPLETED' || item.type === 'PRODUCT_COMPLETED' || item.type === 'NOTE_CREATED'"
                    (click)="editTicket(item)"
                >
                    View Ticket
                </div>
                <div
                    class="notification-item__link qt-color-info qt-fs-13 qt-fw-600 pointer"
                    *ngIf="item.type === 'QUOTE_STATUS_UPDATED'"
                    (click)="editQuote(item)"
                >
                    View Quote
                </div> -->
            </div>
        </ng-template>
    </div>
    <div
        class="loading"
        *ngIf="showPreloader"
    ></div>
</div>
