<div
    class="app-left-panel__menu"
    [ngClass]="{'--active': open}"
    (click)="open = !open;openPanel()"
>
    <div class="icon__collapse-arrow-white qt-sz-24 qt-mr-12 qt-d-none qt-d-md-block"></div>
    <div class="app-left-panel__menu-title">Tickets</div>
</div>
<ul
    class="app-left-panel__menu-expand"
    [ngClass]="{'menu-expand-show': open, 'menu-expand-hide': !open}"
    *ngIf="currentUser"
>
    <ng-template
        ngFor
        let-customerCompany
        [ngForOf]="currentUser.customerCompaniesInfo"
        [ngForTrackBy]="trackById"
    >
        <li
            [ngClass]="{'--active': listType === 'DASHBOARD' && activePage === 'new-tickets-dashboard'}"
            class="desktop-version"
        >
            <div class="qt-df qt-ai-c">
                <i class="icon__companies qt-bg-contain qt-sz-16 qt-mr-8"></i>
                <div [textContent]="customerCompany.clientCompany.name"></div>
            </div>
            <ul>
                <a
                    href
                    [link]="getLinkSection(customerCompany.clientCompany.id,'dashboard')"
                    target="_blank"
                    appRightClickBlank
                    *ngIf="customerCompany.customerUserRole.getPermission('VIEW_MY_TICKETS')"
                >
                    <li
                        [ngClass]="{'--active':activePage === 'company-dashboard'}"
                        (click)="setCompnayIdInfo(customerCompany.clientCompany.id);goToCompanySection(customerCompany.clientCompany.id,'dashboard')"
                    >
                        Dashboard
                    </li>
                </a>
                <a
                    href
                    [link]="'tickets'"
                    target="_blank"
                    appRightClickBlank
                    *ngIf="customerCompany.customerUserRole.getPermission('VIEW_MY_TICKETS')"
                >
                    <li
                        [ngClass]="{'--active':activePage === 'company-tickets'}"
                        (click)="setCompnayIdInfo(customerCompany.clientCompany.id);setTypeFilter(customerCompany,'ALL')"
                    >
                        Tickets
                    </li>
                </a>
                <a
                    href
                    [link]="'invoices'"
                    target="_blank"
                    appRightClickBlank
                    *ngIf="customerCompany.customerUserRole.getPermission('VIEW_ALL_INVOICES')"
                >
                    <li
                        [ngClass]="{'--active':activePage === 'company-contracts'}"
                        (click)="setCompnayIdInfo(customerCompany.clientCompany.id);goToState('new-billable-invoices')"
                    >
                        Invoices
                    </li>
                </a>
                <a
                    href
                    [link]="'users'"
                    target="_blank"
                    appRightClickBlank
                    *ngIf="customerCompany.customerUserRole.getPermission('VIEW_MY_PROFILE')"
                >
                    <li
                        [ngClass]="{'--active':activePage === 'company-user'}"
                        (click)="setCompnayIdInfo(customerCompany.clientCompany.id);goToAllUsers(customerCompany.clientCompany.id)"
                    >
                        Users
                    </li>
                </a>
                <a
                    href
                    [link]="getLinkSection(customerCompany.clientCompany.id,'devices')"
                    target="_blank"
                    appRightClickBlank
                    *ngIf="customerCompany.customerUserRole.getPermission('VIEW_ALL_DEVICES')"
                >
                    <li
                        [ngClass]="{'--active':activePage === 'company-devices'}"
                        (click)="setCompnayIdInfo(customerCompany.clientCompany.id);goToCompanySection(customerCompany.clientCompany.id,'devices')"
                    >
                        Devices
                    </li>
                </a>
                <a
                    href
                    [link]="'quotes'"
                    target="_blank"
                    appRightClickBlank
                    *ngIf="customerCompany.customerUserRole.getPermission('VIEW_ALL_QUOTES')"
                >
                    <li
                        [ngClass]="{'--active':activePage === 'company-devices'}"
                        (click)="setCompnayIdInfo(customerCompany.clientCompany.id);goToState('quotes-component')"
                    >
                        Quotes
                    </li>
                </a>
                <a
                    href
                    [link]="'contracts'"
                    target="_blank"
                    appRightClickBlank
                    *ngIf="customerCompany.customerUserRole.getPermission('VIEW_ALL_CONTRACTS')"
                >
                    <li
                        [ngClass]="{'--active':activePage === 'company-devices'}"
                        (click)="setCompnayIdInfo(customerCompany.clientCompany.id);goToState('new-contracts')"
                    >
                        Contracts
                    </li>
                </a>
                <a
                    href
                    [link]="'payments'"
                    target="_blank"
                    appRightClickBlank
                    *ngIf="customerCompany.customerUserRole.getPermission('VIEW_ALL_PAYMENTS')"
                >
                    <li
                        [ngClass]="{'--active':activePage === 'company-devices'}"
                        (click)="setCompnayIdInfo(customerCompany.clientCompany.id);goToState('new-payments-ng2')"
                    >
                        Payments
                    </li>
                </a>
            </ul>
        </li>
    </ng-template>
</ul>
