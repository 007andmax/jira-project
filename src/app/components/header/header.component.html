<div class="nav-header__left-side">
    <app-global-search *ngIf="!customerPortalStateService.isCustomerPortal"></app-global-search>
</div>
<div class="nav-header__rigth-side">
    <div ngbDropdown>
        <div class="actions-body">
            <div
                id="dropdownCreate"
                ngbDropdownToggle
                class="nav-header__add-btn tooltip-max--content qt-df qt-ai-c qt-jc-c"
                placement="left"
                ngbTooltip="Quick Create"
            >
                <div class="qt-icon icon__add qt-icon__white qt-sz-16"></div>
            </div>
            <div
                class="qt-icon icon__notification qt-bg-contain qt-sz-18 pointer qt-mr-24"
                (click)="showNotifications()"
            ></div>
            <div
                *ngIf="!customerPortalStateService.isCustomerPortal"
                class="qt-icon icon__help qt-bg-contain qt-sz-18 pointer qt-mr-24"
                (click)="showHelpCanterAside()"
            ></div>
        </div>
        <ul
            class="qt-dropdown-menu"
            ngbDropdownMenu
            aria-labelledby="dropdownCreate"
        >
            <li
                ngbDropdownItem
                (click)="onAddTicket()"
            >
                <div class="qt-icon icon__tickets qt-icon__gray-600 qt-sz-20 qt-mr-12"></div>
                Ticket
            </li>
            <li
                ngbDropdownItem
                (click)="onAddCompany()"
                *ngIf="getPermissions('CREATE_COMPANIES')"
            >
                <div class="qt-icon icon__companies qt-sz-20 qt-icon__gray-600 qt-sz-20 qt-mr-12"></div>
                Company
            </li>
            <li
                ngbDropdownItem
                (click)="onAddUser()"
                *ngIf="getPermissions('CREATE_USERS')"
            >
                <div class="qt-icon icon__users qt-icon__gray-600 qt-sz-20 qt-mr-12"></div>
                Users
            </li>
            <li
                ngbDropdownItem
                (click)="onAddService()"
                *ngIf="getPermissions('MANAGE_SERVICES')"
            >
                <div class="qt-icon icon__service qt-icon__gray-600 qt-sz-20 qt-mr-12"></div>
                Service
            </li>
            <li
                ngbDropdownItem
                (click)="onAddProduct()"
                *ngIf="getPermissions('MANAGE_PRODUCTS')"
            >
                <div class="qt-icon icon__products qt-icon__gray-600 qt-sz-20 qt-mr-12"></div>
                Product
            </li>
        </ul>
    </div>
    <!-- <div class="nav-header__notifications-bell --notifications-exits icon__notifications"></div> -->
    <div class="nav-header__account-info">
        <!-- <div class="qt-df qt-ai-fe qt-fd-c"> -->
        <!-- <div class="nav-header__account-info-company-name"> -->
        <!-- {{ (currentCompany) ? currentCompany.name : ''}} -->
        <!-- </div> -->
        <!-- <div -->
        <!-- class="nav-header__account-info-user-name" -->
        <!-- [textContent]="getCurrentUserName()" -->
        <!-- ></div> -->
        <!-- </div> -->
        <div ngbDropdown>
            <div
                id="dropdownCompany"
                ngbDropdownToggle
                class="nav-header__account-info-menu qt-df qt-ai-c pointer"
            >
                <img
                    [src]="checkLogo()"
                    class="qt-sz-36 qt-img-cover qt-circle tooltip-max--content"
                    alt
                    *ngIf="checkLogo()"
                    placement="bottom-right"
                    [ngbTooltip]="tipContent"
                >
                <div
                    class="nav-header__account-info-avatar tooltip-max--content"
                    [textContent]="getCurrentUserName()[0]"
                    placement="bottom-right"
                    [ngbTooltip]="tipContent"
                    *ngIf="!checkLogo()"
                ></div>
                <ng-template #tipContent>
                    {{getCurrentUserName()}}
                    <br>
                    <span class="header-tooltip-t">
                        {{(currentCompany) ? currentCompany.name : ''}}
                    </span>
                </ng-template>
                <div class="nav-header__account-info-menu-arrow qt-icon icon__arrow-down"></div>
            </div>
            <ul
                class="qt-dropdown-menu"
                ngbDropdownMenu
                aria-labelledby="dropdownCompany"
            >
                <li
                    ngbDropdownItem
                    (click)="goToSettings()"
                >
                    <div class="qt-icon icon__settings qt-sz-20 qt-mr-12"></div>
                    My Profile
                </li>
                <li
                    ngbDropdownItem
                    (click)="logOut()"
                >
                    <div class="qt-icon icon__logout qt-icon__red-600 qt-bg-contain qt-sz-20 qt-mr-12"></div>
                    Logout
                </li>
            </ul>
        </div>
    </div>
</div>
