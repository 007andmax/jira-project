<div class="nav-header__left-side">
    <app-global-search></app-global-search>
</div>
<div class="nav-header__rigth-side">
    <div ngbDropdown>
        <div class="actions-body">
            <div
                id="dropdownCreate"
                ngbDropdownToggle
                class="nav-header__add-btn icon__add-product"
            ></div>
            <div
                class="icon__help-center qt-bg-contain qt-sz-24 pointer qt-mr-16"
                (click)="showHelpCanterAside()"
            ></div>
        </div>
        <ul
            class="qt-dropdown-menu"
            ngbDropdownMenu
            aria-labelledby="dropdownCreate"
        >
            <li
                ngbDropdownItem
                (click)="onAddTicket()"
            >
                Ticket
            </li>
            <li
                ngbDropdownItem
                (click)="onAddCompany()"
                *ngIf="getPermissions('CREATE_COMPANIES')"
            >
                Company
            </li>
            <li
                ngbDropdownItem
                (click)="onAddUser()"
                *ngIf="getPermissions('CREATE_USERS')"
            >
                Users
            </li>
            <li
                ngbDropdownItem
                (click)="onAddService()"
                *ngIf="getPermissions('MANAGE_SERVICES')"
            >
                Service
            </li>
            <li
                ngbDropdownItem
                (click)="onAddProduct()"
                *ngIf="getPermissions('MANAGE_PRODUCTS')"
            >
                Product
            </li>
        </ul>
    </div>
    <!-- <div class="nav-header__notifications-bell --notifications-exits icon__notifications"></div> -->
    <div class="nav-header__account-info">
        <div class="qt-df qt-ai-fe qt-fd-c">
            <div class="nav-header__account-info-company-name">
                {{ (currentCompany) ? currentCompany.name : ''}}
            </div>
            <div
                class="nav-header__account-info-user-name"
                [textContent]="getCurrentUserName()"
            ></div>
        </div>
        <div ngbDropdown>
            <div
                id="dropdownCompany"
                ngbDropdownToggle
                class="nav-header__account-info-menu icon__down-arrow--sm"
            ></div>
            <ul
                class="qt-dropdown-menu"
                ngbDropdownMenu
                aria-labelledby="dropdownCompany"
            >
                <li
                    ngbDropdownItem
                    (click)="goToSettings()"
                >
                    My Profile
                </li>
                <li
                    ngbDropdownItem
                    (click)="logOut()"
                >
                    Logout
                </li>
            </ul>
        </div>
    </div>
</div>
