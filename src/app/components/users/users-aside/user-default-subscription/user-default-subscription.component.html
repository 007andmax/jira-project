<div
    class="grey-dropdown"
    ngbDropdown
    container="body"
>
    <i class="icn-sm report-caret-icon"></i>
    <div
        class="user-subscription"
        id="dropdownServices"
        ngbDropdownToggle
        [ngClass]="{'placeholder-subscription': !showPlaceholder()}"
    >
        <div
            *ngIf="defaultSubscriptions.invoiceSubscription.enabled"
            [ngClass]="{'active':defaultSubscriptions.invoiceSubscription.activated && defaultSubscriptions.invoiceSubscription.isExist,
            'no-active':!defaultSubscriptions.invoiceSubscription.activated && defaultSubscriptions.invoiceSubscription.isExist}"
        >
            <i
                class="qt-sz-16 qt-bg-contain qt-dib"
                *ngIf="defaultSubscriptions.invoiceSubscription.isExist"
                [ngClass]="{'icon__unsubscribe-user':!defaultSubscriptions.invoiceSubscription.activated,'icon__subscribe-user':defaultSubscriptions.invoiceSubscription.activated}"
            ></i>
            Invoice Updates
        </div>
        <div
            *ngIf="defaultSubscriptions.ticketSubscription.enabled"
            [ngClass]="{'active':defaultSubscriptions.ticketSubscription.activated && defaultSubscriptions.ticketSubscription.isExist,
            'no-active':!defaultSubscriptions.ticketSubscription.activated && defaultSubscriptions.ticketSubscription.isExist}"
        >
            <i
                class="qt-sz-16 qt-bg-contain qt-dib"
                *ngIf="defaultSubscriptions.ticketSubscription.isExist"
                [ngClass]="{'icon__unsubscribe-user':!defaultSubscriptions.ticketSubscription.activated,'icon__subscribe-user':defaultSubscriptions.ticketSubscription.activated}"
            ></i>
            Ticket Updates
        </div>
        <div
            *ngIf="defaultSubscriptions.ticketManagerSubscription.enabled"
            [ngClass]="{'active':defaultSubscriptions.ticketManagerSubscription.activated && defaultSubscriptions.ticketManagerSubscription.isExist,
            'no-active':!defaultSubscriptions.ticketManagerSubscription.activated && defaultSubscriptions.ticketManagerSubscription.isExist}"
        >
            <i
                class="qt-sz-16 qt-bg-contain qt-dib"
                *ngIf="defaultSubscriptions.ticketManagerSubscription.isExist"
                [ngClass]="{'icon__unsubscribe-user':!defaultSubscriptions.ticketManagerSubscription.activated,'icon__subscribe-user':defaultSubscriptions.ticketManagerSubscription.activated}"
            ></i>
            Ticket Manager
        </div>
    </div>
    <ul
        class="qt-dropdown-menu company-subscription-dropdown"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <li
            ngbDropdownItem
            (click)="selected('invoiceSubscription')"
        >
            Invoice Updates
        </li>
        <li
            ngbDropdownItem
            (click)="selected('ticketSubscription')"
        >
            Ticket Updates
        </li>
        <li
            ngbDropdownItem
            (click)="selected('ticketManagerSubscription')"
        >
            Ticket Manager
        </li>
    </ul>
</div>
