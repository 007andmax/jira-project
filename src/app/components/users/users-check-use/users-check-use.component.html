<div class="archive-modal de-archive">
    <button
        class="close-modal"
        (click)=cancelConfirm()
    ></button>
    <div class="archive-modal__body">
        <h3>Archive User</h3>
        <div class="exist-agreements">
            <p>
                You cannot archive this user while they are the primary contact for the following customer companies:
            </p>
            <div class="contract-container qt-mt-16">
                <div class="contract-container-agreements qt-mt-8">
                    <ng-template
                        ngFor
                        let-companyInfo
                        let-i="index"
                        [ngForOf]="user.customerCompaniesInfo"
                        [ngForTrackBy]="trackById"
                    >
                        <div
                            class="contract-item"
                            *ngIf="companyInfo.isPrimaryContact"
                        >
                            <div class="contract-item-info">
                                <h3 [textContent]="getCompanyName(companyInfo.companyId)"></h3>
                            </div>
                        </div>
                    </ng-template>
                </div>
            </div>
        </div>
    </div>
    <div class="archive-modal__footer">
        <div class="qt-df qt-jc-fe">
            <button
                class="btn-new disabled"
                (click)=cancelConfirm()
            >
                Cancel
            </button>
        </div>
    </div>
</div>
