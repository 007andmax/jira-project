<tr [ngClass]="{'--selected': selected || user.selected}">
    <td class="users-table__check">
        <div class="qt-df">
            <label
                class="qt-checkbox"
                [attr.for]="'user-' + user.id"
            >
                <input
                    [attr.id]="'user-' + user.id"
                    [(ngModel)]="user.selected"
                    type="checkbox"
                    (change)="selectUser($event)"
                >
                <span></span>
            </label>
        </div>
    </td>
    <td
        class="users-table__name"
        (click)="showDetailUser()"
    >
        <div class="qt-df qt-ai-c">
            <div
                class="users-table__name--avatar"
                [ngStyle]="{'background':  usersStateService.getUserAvatarUrl(user)}"
                [textContent]="usersStateService.getNameForAvatar(user)"
            ></div>
            <div>
                <div
                    class="users-table__name--user-name"
                    [textContent]="getUserName()"
                ></div>
                <div
                    class="users-table__name--profession"
                    [textContent]="getJobTitle()"
                ></div>
            </div>
            <div
                class="icon__mark-as-master qt-bg-contain qt-sz-20 qt-ml-12"
                *ngIf="type == TYPE_LIST_COMPANY_USERS && isPrimaryContact()"
                (mouseenter)="addTooltip.show($event.target)"
                (mouseleave)="addTooltip.hide()"
            ></div>
            <app-dynamic-tooltip
                [content]="'Primary Contact'"
                [position]="'top'"
                #addTooltip
            ></app-dynamic-tooltip>
        </div>
    </td>
    <td
        class="users-table__company"
        [ngClass]="{'users-table__company-full': type === TYPE_LIST_ALL_USERS}"
        *ngIf="type === TYPE_LIST_ALL_USERS || type === TYPE_LIST_MARKETING_USERS"
        (click)="showDetailUser()"
    >
        <ng-template
            ngFor
            let-company
            [ngForOf]="user.customerCompaniesInfo"
            [ngForTrackBy]="trackByIndex"
        >
            <div class="qt-df qt-ai-c">
                <div [textContent]="company.clientCompanyName"></div>
            </div>
        </ng-template>
    </td>
    <td
        class="users-table__company"
        (click)="showDetailUser()"
        *ngIf="type !== TYPE_LIST_MARKETING_USERS"
    >
        <span>{{ user.portalAccessStatus }}</span>
    </td>
    <td
        class="users-table__company ellipsis"
        *ngIf="type === TYPE_LIST_COMPANY_USERS"
        (click)="showDetailUser()"
    >
        <app-dynamic-tooltip
            [content]="user.primaryEmail"
            [position]="'top'"
            #emailTooltip
        ></app-dynamic-tooltip>
        <span
            (mouseenter)="emailTooltip.show($event.target)"
            (mouseleave)="emailTooltip.hide()"
        >
            {{ user.primaryEmail }}
        </span>
    </td>
    <td
        class="users-table__company"
        (click)="showDetailUser()"
    >
        <span>{{ getUserIndustry() }}</span>
    </td>
    <td
        class="users-table__contract-no"
        (click)="showDetailUser()"
    >
        <ng-template
            ngFor
            let-phone
            [ngForOf]="user.phoneNumbers"
            [ngForTrackBy]="trackById"
        >
            <div class="qt-df qt-ai-c">
                <div>
                    <div
                        *ngIf="phone.typeNumber === 'FAX'"
                        class="qt-sz-16 qt-mr-6 icon__office-phone-gray"
                    ></div>
                    <div
                        *ngIf="phone.typeNumber === 'MOBILE' || phone.typeNumber === 'OFFICE'"
                        class="qt-sz-16 qt-mr-6 icon__phone-gray"
                    ></div>
                </div>
                <preview-phone-mask
                    [class]="'users-table__contract-no--number'"
                    *ngIf="phone.number"
                    [number]="phone.number"
                ></preview-phone-mask>
            </div>
        </ng-template>
    </td>
    <td
        class="users-table__subscription"
        *ngIf="type === TYPE_LIST_COMPANY_USERS"
    >
        <user-table-default-subscription
            class="users-table__subscription--dropdown"
            (onChangeDefault)="onChangeDefaultSubscriptions($event)"
            [defaultSubscriptions]="getDefaultSubscriptions()"
        >
        </user-table-default-subscription>
    </td>
    <td
        class="users-table__subscription"
        *ngIf="type === TYPE_LIST_MARKETING_USERS"
    >
        <user-table-custom-subscription
            #customSubscription
            class="users-table__subscription--dropdown"
            (onChangeCustom)="onChangeCustomSubscriptions($event)"
            [listCustomSubscription]="listCustomSubscription"
            [customSubscriptions]="user.customSubscriptions"
        >
        </user-table-custom-subscription>
    </td>
    <td
        *ngIf="type === TYPE_LIST_ALL_USERS || type === TYPE_LIST_COMPANY_USERS"
        class="users-table__tickets"
        [textContent]="user.userStatistic.ticketsSubmitted || 0"
        (click)="showDetailUser()"
    ></td>
    <td class="users-table__email">
        <app-dynamic-tooltip
            [content]="'Draft Email'"
            [position]="'top'"
            #draftEmailTooltip
        ></app-dynamic-tooltip>
        <div
            class="icon__email-dark qt-sz-16 pointer"
            *ngIf="!showArchivedUsers && !customerPortalStateService.isCustomerPortal"
            (click)="showAsideForDraftEmail()"
            (mouseenter)="draftEmailTooltip.show($event.target)"
            (mouseleave)="draftEmailTooltip.hide()"
        ></div>
    </td>
    <td class="users-table__menu">
        <div
            ngbDropdown
            [container]="'body'"
            [placement]="'bottom-right'"
        >
            <div
                class="qt-ic-c icon__more  qt-pointer qt-sz-16 qt-bg-contain"
                id="dropdownBasic1"
                ngbDropdownToggle
            ></div>
            <ul
                class="qt-dropdown-menu"
                ngbDropdownMenu
                aria-labelledby="dropdownBasic1"
            >
                <li
                    class="pointer"
                    *ngIf="!showArchivedUsers && (getPermissions('EDIT_USERS') || customerPortalStateService.checkEditUser(usersStateService.getCurrentUser(),user))"
                    (click)="edit()"
                    ngbDropdownItem
                >
                    <div class="icon__edit qt-bg-contain qt-sz-20 qt-mr-12"></div>
                    Edit
                </li>
                <li
                    class="pointer"
                    *ngIf="!showArchivedUsers && getPermissions('EDIT_USERS') && type !== TYPE_LIST_MARKETING_USERS && (user.portalAccessStatus == 'Unauthorized' || user.portalAccessStatus == 'Invite sent')"
                    (click)="sendInvite(user.primaryEmail)"
                    ngbDropdownItem
                >
                    <div class="icon__email-resend qt-sz-20 qt-bg-contain pointer qt-mr-10"></div>
                    Send Invite
                </li>
                <li
                    class="pointer"
                    *ngIf="type == TYPE_LIST_COMPANY_USERS && !isPrimaryContact()"
                    (click)="resetPrimaryContact()"
                    ngbDropdownItem
                >
                    <div class="icon__mark-as-master qt-bg-contain qt-sz-20 qt-mr-12"></div>
                    Set as Primary contact
                </li>
                <li
                    class="pointer"
                    *ngIf="currentUser && (!customerPortalStateService.isCustomerPortal && currentUser.checkPermission('ARCHIVE_USERS') ||  customerPortalStateService.checkEditUser(usersStateService.getCurrentUser(),user) && !isPrimaryContact())  && !showArchivedUsers"
                    (click)="delete()"
                    ngbDropdownItem
                >
                    <div class="icon__remove qt-bg-contain qt-sz-20 qt-mr-12"></div>
                    Archive
                </li>
                <li
                    class="pointer"
                    *ngIf="currentUser && currentUser.checkPermission('ARCHIVE_USERS') && showArchivedUsers"
                    (click)="restore()"
                    ngbDropdownItem
                >
                    <div class="icon__archive qt-bg-contain qt-sz-20 qt-mr-12"></div>
                    Restore
                </li>
            </ul>
        </div>
    </td>
</tr>
