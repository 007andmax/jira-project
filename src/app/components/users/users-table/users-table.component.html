<div
    class="qt-table-modern__row qt-table-modern__row--height-auto"
    [ngClass]="{'--selected': selected || user.selected}"
>
    <div class="users-table__check">
        <div class="qt-df">
            <label
                class="qt-checkbox"
                [attr.for]="'user-' + user.id"
            >
                <input
                    [attr.id]="'user-' + user.id"
                    [(ngModel)]="user.selected"
                    type="checkbox"
                    (change)="selectUser($event)"
                >
                <span></span>
            </label>
        </div>
    </div>
    <div
        class="users-table__name"
       
    >
      <ng-template #popContent let-greeting="greeting"
	>
    <app-tickets-table-item-requested-by  
    [requestedUser]="user"
    [indexNoAvatar]="indexNoAvatar"
    [listColorNoAvatar]="listColorNoAvatar"
    ></app-tickets-table-item-requested-by>
    </ng-template
>
        <div class="qt-df qt-ai-c">
            <div
                class="users-table__name--avatar"
                [ngStyle]="{'background':  ticketsListService.getStyleAvatar(user,listColorNoAvatar[indexNoAvatar])}"
                [textContent]="usersStateService.getNameForAvatar(user)"
                  [ngbPopover]="popContent"
                [popoverClass]="'requested-by-popover'"
                 [autoClose]="'outside'"
                 [container]="'body'"
                #p="ngbPopover"
                triggers="manual"
                (mouseenter)="openPopover(p)"
                (mouseleave)="startCloseTimer(p)"
                [disablePopover]="!user"
            ></div>
            <div>
                <div
                    class="ellipsis qt-fs-14 qt-fw-500 qt-color-gray-900 qt-mb-4"
                    [textContent]="getUserName()"
                ></div>
                <div
                    class="qt-fs-12 qt-fw-400 qt-color-gray-500"
                    [textContent]="user.primaryEmail"
                ></div>
            </div>
            <div
                class="qt-icon icon__permission-role qt-sz-20 qt-ml-12"
                *ngIf="type == TYPE_LIST_COMPANY_USERS && isPrimaryContact()"
                (mouseenter)="addTooltip.show($event.target)"
                (mouseleave)="addTooltip.hide()"
            ></div>
            <app-dynamic-tooltip
                [content]="'Primary Contact'"
                [position]="'top'"
                #addTooltip
            ></app-dynamic-tooltip>
        </div>
    </div>
    <div
        class="users-table__company qt-fd-c qt-ai-fs qt-jc-c"
        [ngClass]="{'users-table__company-full': type === TYPE_LIST_ALL_USERS}"
        *ngIf="type === TYPE_LIST_ALL_USERS || type === TYPE_LIST_MARKETING_USERS"
        (click)="showDetailUser()"
    >
        <div
class="qt-w100"
    >
         <div class="qt-df multi-assign-user-container qt-ai-c"  >
            <ng-template
                ngFor
                let-company
                let-i="index"
                [ngForOf]="user.customerCompaniesInfo"
                [ngForTrackBy]="trackById"
            >
             <ng-template #companyContent>
                <div
                    class="qt-df qt-ai-c qt-mb-8"
                >
                    <div
                        class="tooltip__circle-avatar"
                        [textContent]="checkLogo(getCompany(company)) ? '' : company.clientCompanyName[0].toUpperCase()"
                        [ngStyle]="{'background': getStyleAvatarCompany(getCompany(company),listColorNoAvatar[indexNoAvatar]) }"
                    ></div>
                    <div >
                    <div
                       class="ellipsis qt-fs-14 qt-fw-500 qt-color-white qt-mb-4"
                        [textContent]="company.clientCompanyName"
                    ></div>
                     <div
                     *ngIf="company.jobTitleDto"
                       class="ellipsis qt-fs-12 qt-fw-400 qt-color-gray-400"
                        [textContent]="company.jobTitleDto.name"
                    ></div>
                    </div>
                </div>
        </ng-template>
                <div
                    [ngbTooltip]="companyContent"
                    [container]="'body'"
                    class="qt-table-modern__circle-avatar multi-assign-user"
                    *ngIf="i < 3"
                    [textContent]="checkLogo(getCompany(company)) ? '' : company.clientCompanyName[0].toUpperCase()"
                    [ngStyle]="{'background': getStyleAvatarCompany(getCompany(company),listColorNoAvatar[indexNoAvatar]) ,
                'left': getStyleNetAvatar(i)}"
                ></div>
            </ng-template>
            <div class="ellipsis qt-fs-14 qt-fw-400 qt-color-gray-900 qt-ml-32" *ngIf="user.customerCompaniesInfo.length == 1" [textContent]="user.customerCompaniesInfo[0].clientCompanyName"></div>
            <div
                class="more-users qt-table-modern__circle-avatar"
                 [tooltipClass]="'users-tooltip'"
                [ngbTooltip]="tipContent"
                *ngIf="user.customerCompaniesInfo.length > 3"
                [ngStyle]="{'left': getStyleNetAvatar(3)}"
            >
                <span [textContent]="'+' + (user.customerCompaniesInfo.length - 3)"></span>
            </div>
        </div>
        <ng-template #tipContent>
            <ng-template
                ngFor
                let-company
                let-i="index"
                [ngForOf]="user.customerCompaniesInfo"
                [ngForTrackBy]="trackById"
            >
                <div
                    class="qt-df qt-ai-c qt-mb-8"
                    *ngIf="i >= 3"
                >
                    <div
                        class="tooltip__circle-avatar"
                        [textContent]="checkLogo(getCompany(company)) ? '' : company.clientCompanyName[0].toUpperCase()"
                        [ngStyle]="{'background': getStyleAvatarCompany(getCompany(company),listColorNoAvatar[indexNoAvatar]) }"
                    ></div>
                    <div>
                     <div >
                    <div
                       class="ellipsis qt-fs-14 qt-fw-500 qt-color-white qt-mb-4"
                        [textContent]="company.clientCompanyName"
                    ></div>
                     <div
                     *ngIf="company.jobTitleDto"
                       class="ellipsis qt-fs-12 qt-fw-400 qt-color-gray-400"
                        [textContent]="company.jobTitleDto.name"
                    ></div>
                    </div>
                    </div>
                </div>
            </ng-template>
        </ng-template>
    </div> 
    </div>
    <div
        class="users-table__contract-no qt-fd-c qt-ai-fs qt-jc-c"
        (click)="showDetailUser()"
    >
        <ng-template
            ngFor
            let-phone
            [ngForOf]="user.phoneNumbers"
            [ngForTrackBy]="trackById"
        >
            <div class="qt-df qt-ai-c">
                <div>
                    <div
                        [ngClass]="{'icon__old-phone':phone.typeNumber == 'FAX',
                        'icon__mobile':phone.typeNumber == 'MOBILE',
                         'icon__phone':phone.typeNumber == 'OFFICE'}"
                        class="qt-za-16 qt-sz-16 qt-bg-contain qt-fs-0 qt-mr-6 qt-icon"
                    ></div>
                </div>
                <preview-phone-mask
                    [class]="'users-table__contract-no--number'"
                    *ngIf="phone.number"
                    [number]="phone.number"
                ></preview-phone-mask>
            </div>
        </ng-template>
    </div>
    <div
        class="users-table__subscription"
        *ngIf="type === TYPE_LIST_COMPANY_USERS"
    >
        <user-table-default-subscription
            class="users-table__subscription--dropdown"
            (onChangeDefault)="onChangeDefaultSubscriptions($event)"
            [defaultSubscriptions]="defaultSubscriptions"
        >
        </user-table-default-subscription>
    </div>
    <div
        class="users-table__subscription"
        *ngIf="type === TYPE_LIST_MARKETING_USERS"
    >
        <user-table-custom-subscription
            #customSubscription
            class="users-table__subscription--dropdown"
            (onChangeCustom)="onChangeCustomSubscriptions($event)"
            [listCustomSubscription]="listCustomSubscription"
            [customSubscriptions]="user.customSubscriptions"
        >
        </user-table-custom-subscription>
    </div>
    <div
        *ngIf="type === TYPE_LIST_ALL_USERS || type === TYPE_LIST_COMPANY_USERS"
        class="users-table__tickets"
        [textContent]="user.userStatistic.ticketsSubmitted || 0"
        (click)="showDetailUser()"
    ></div>
    <div
        *ngIf="type === TYPE_LIST_COMPANY_USERS"
        class="users-table__tickets"
    >
        <div
            class="qt-df"
            *ngIf="getCustomerCompaniesInfo()"
        >
            <label
                class="qt-checkbox"
                [attr.for]="'user-display-' + user.id"
            >
                <input
                    [attr.id]="'user-display-' + user.id"
                    [(ngModel)]="getCustomerCompaniesInfo().eligibleForTicket"
                    type="checkbox"
                    (change)="changeDisplay($event)"
                >
                <span></span>
            </label>
        </div>
    </div>
    <div
        class="users-table__portal-status"
        (click)="showDetailUser()"
        *ngIf="type !== TYPE_LIST_MARKETING_USERS"
    >
        <span
            class="tag__modern"
            [ngClass]="{'--registered':user.portalAccessStatus == 'Registered',
        '--invite-sent':user.portalAccessStatus == 'Invite sent',
    '--unauthorized':user.portalAccessStatus == 'Unauthorized'}"
        >
            {{ user.portalAccessStatus }}
        </span>
    </div>
    <div class="users-table__menu">
        <div class="qt-df qt-button-square-wrap">
            <div
                class="qt-button-square qt-button-square__prepend pointer"
                *ngIf="!showArchivedUsers && !customerPortalStateService.isCustomerPortal"
                (click)="showAsideForDraftEmail()"
                (mouseenter)="draftEmailTooltip.show($event.target)"
                (mouseleave)="draftEmailTooltip.hide()"
            >
                <app-dynamic-tooltip
                    [content]="'Draft Email'"
                    [position]="'top'"
                    #draftEmailTooltip
                ></app-dynamic-tooltip>
                <div class="qt-icon icon__email qt-sz-16 pointer qt-bg-contain"></div>
            </div>
            <div
                ngbDropdown
                [container]="'body'"
            >
                <div
                    class="qt-button-square qt-button-square__afterpend pointer"
                    id="dropdownBasic1"
                    ngbDropdownToggle
                >
                    <div class="qt-ic-c qt-icon icon__more qt-pointer qt-sz-16 qt-bg-contain"></div>
                </div>
                <ul
                    class="qt-dropdown-menu"
                    ngbDropdownMenu
                    aria-labelledby="dropdownBasic1"
                >
                    <li
                        class="pointer"
                        *ngIf="!showArchivedUsers && (getPermissions('EDIT_USERS') || customerPortalStateService.checkEditUser(usersStateService.getCurrentUser(),user))"
                        (click)="edit()"
                        ngbDropdownItem
                    >
                        <div class="qt-icon icon__edit qt-bg-contain qt-sz-20 qt-mr-12"></div>
                        Edit
                    </li>
                    <li
                        class="pointer"
                        *ngIf="!showArchivedUsers && getPermissions('EDIT_USERS') && type !== TYPE_LIST_MARKETING_USERS && (user.portalAccessStatus == 'Unauthorized' || user.portalAccessStatus == 'Invite sent')"
                        (click)="sendInvite(user.primaryEmail)"
                        ngbDropdownItem
                    >
                        <div class="qt-icon icon__email qt-sz-20 qt-bg-contain pointer qt-mr-10"></div>
                        Send Invite
                    </li>
                    <li
                        class="pointer"
                        *ngIf="type == TYPE_LIST_COMPANY_USERS && !isPrimaryContact()"
                        (click)="resetPrimaryContact()"
                        ngbDropdownItem
                    >
                        <div class="qt-icon icon__permission-role qt-sz-20 qt-mr-12"></div>
                        Set as Primary contact
                    </li>
                    <li
                        class="pointer qt-dropdown-menu__item-red qt-dropdown-menu__top-line"
                        *ngIf="currentUser && (!customerPortalStateService.isCustomerPortal && currentUser.checkPermission('ARCHIVE_USERS') ||  customerPortalStateService.checkEditUser(usersStateService.getCurrentUser(),user) && !isPrimaryContact())  && !showArchivedUsers"
                        (click)="delete()"
                        ngbDropdownItem
                    >
                        <div class="qt-icon icon__delete qt-icon__red-600 qt-bg-contain qt-sz-20 qt-mr-12"></div>
                        Archive
                    </li>
                    <li
                        class="pointer qt-dropdown-menu__item-red qt-dropdown-menu__top-line"
                        *ngIf="currentUser && currentUser.checkPermission('ARCHIVE_USERS') && showArchivedUsers"
                        (click)="restore()"
                        ngbDropdownItem
                    >
                        <div class="qt-icon__red-600 icon__updates qt-bg-contain qt-sz-20 qt-mr-12"></div>
                        Restore
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
