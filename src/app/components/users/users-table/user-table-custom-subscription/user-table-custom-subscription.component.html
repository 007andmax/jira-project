<div
    ngbDropdown
    container="body"
>
    <div
        class="list-custom-subscriptions"
        id="dropdownBasic"
        *ngIf="listCustomSubscription.length === 0"
    ></div>
    <div
        class="list-custom-subscriptions"
        id="dropdownBasic"
        ngbDropdownToggle
        *ngIf="listCustomSubscription.length > 0"
    >
        <ng-template
            ngFor
            let-custom
            [ngForOf]="customSubscriptions"
            let-i="index"
            [ngForTrackBy]="trackById"
        >
            <div
                class="selected-item"
                *ngIf="i < 2"
            >
                {{custom.name}}
                <div
                    class="qt-sz-10 qt-ml-4 qt-icon icon__close qt-icon__gray-400 qt-dib"
                    (click)="selected(custom)"
                ></div>
            </div>
        </ng-template>
        <app-dynamic-tooltip
            [content]="getListHiveSubscribes()"
            [position]="'top'"
            #subscribe
        ></app-dynamic-tooltip>
        <div
            class="selected-item"
            *ngIf="customSubscriptions.length > 2"
            (mouseenter)="subscribe.show($event.target)"
            (mouseleave)="subscribe.hide()"
        >
            + {{customSubscriptions.length - 2}}
        </div>
    </div>
    <ul
        class="select-wrapper"
        ngbDropdownMenu
        aria-labelledby="dropdownBasic"
        *ngIf="listCustomSubscription.length > 0"
    >
        <div
            class="content"
            (click)="$event.preventDefault()"
        >
            <ng-template
                ngFor
                let-custom
                [ngForOf]="listCustomSubscription"
                let-i="index"
                [ngForTrackBy]="trackById"
            >
                <div
                    (click)="selected(custom)"
                    class="company-tag-item"
                    [ngClass]="{'is-hover':isSeleted(custom),'is-update':isUpdate}"
                >
                    <label class="qt-checkbox pointer">
                        <input
                            type="checkbox"
                            [checked]="isSeleted(custom)"
                            [disabled]="isUpdate"
                            readonly
                        >
                        <span></span>
                        <div class="text-content">
                            <div
                                class="name"
                                [textContent]="custom.name"
                            >
                            </div>
                        </div>
                    </label>
                </div>
            </ng-template>
        </div>
    </ul>
</div>
