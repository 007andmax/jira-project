<div
    ngbDropdown
    container="body"
>
    <div
        class="list-default-subscriptions"
        id="dropdownBasic"
        ngbDropdownToggle
        [ngClass]="{'block-click':isDisabled}"
    >
        <div
            *ngIf="defaultSubscriptions && defaultSubscriptions.invoiceSubscription && defaultSubscriptions.invoiceSubscription.enabled"
            [ngClass]="{'active':defaultSubscriptions.invoiceSubscription.activated && defaultSubscriptions.invoiceSubscription.isExist,
            'no-active':!defaultSubscriptions.invoiceSubscription.activated && defaultSubscriptions.invoiceSubscription.isExist}"
            class="selected-item"
        >
            Invoice Updates
            <div
                class="qt-sz-10 qt-ml-4 qt-icon icon__close qt-icon__gray-400 qt-bg-contain qt-dib"
                (click)="updateDefault('invoiceSubscription')"
            ></div>
        </div>
        <div
            class="selected-item"
            *ngIf="defaultSubscriptions && defaultSubscriptions.ticketSubscription && defaultSubscriptions.ticketSubscription.enabled"
            [ngClass]="{'active':defaultSubscriptions.ticketSubscription.activated && defaultSubscriptions.ticketSubscription.isExist,
            'no-active':!defaultSubscriptions.ticketSubscription.activated && defaultSubscriptions.ticketSubscription.isExist}"
        >
            Ticket Updates
            <div
                class="qt-sz-10 qt-ml-4 qt-icon icon__close qt-icon__gray-400 qt-bg-contain qt-dib"
                (click)="updateDefault('ticketSubscription')"
            ></div>
        </div>
        <div
            class="selected-item"
            *ngIf="defaultSubscriptions && defaultSubscriptions.ticketManagerSubscription && defaultSubscriptions.ticketManagerSubscription.enabled"
            [ngClass]="{'active':defaultSubscriptions.ticketManagerSubscription.activated && defaultSubscriptions.ticketManagerSubscription.isExist,
            'no-active':!defaultSubscriptions.ticketManagerSubscription.activated && defaultSubscriptions.ticketManagerSubscription.isExist}"
        >
            Ticket Manager
            <div
                class="qt-sz-10 qt-ml-4 qt-icon icon__close qt-icon__gray-400 qt-bg-contain qt-dib"
                (click)="updateDefault('ticketManagerSubscription')"
            ></div>
        </div>
        <div class="qt-button-square pointer list-default-subscriptions-button pointer">
          <div class="qt-icon icon__arrow-down qt-sz-16"></div>
        </div>
    </div>
    <div
        class="select-wrapper"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <div
            class="content"
            (click)="$event.preventDefault()"
        >
            <div
                (click)="updateDefault('invoiceSubscription')"
                class="company-tag-item"
                [ngClass]="{'is-hover':isSeleted('invoiceSubscription')}"
            >
                <label class="qt-checkbox pointer">
                    <input
                        type="checkbox"
                        [checked]="isSeleted('invoiceSubscription')"
                        readonly
                    >
                    <span></span>
                    <div class="text-content">
                        <div class="name">Invoice Updates</div>
                    </div>
                </label>
            </div>
            <div
                (click)="updateDefault('ticketSubscription')"
                class="company-tag-item"
                [ngClass]="{'is-hover':isSeleted('ticketSubscription')}"
            >
                <label class="qt-checkbox pointer">
                    <input
                        type="checkbox"
                        [checked]="isSeleted('ticketSubscription')"
                        readonly
                    >
                    <span></span>
                    <div class="text-content">
                        <div class="name">Ticket Updates</div>
                    </div>
                </label>
            </div>
            <div
                (click)="updateDefault('ticketManagerSubscription')"
                class="company-tag-item"
                [ngClass]="{'is-hover':isSeleted('ticketManagerSubscription')}"
            >
                <label class="qt-checkbox pointer">
                    <input
                        type="checkbox"
                        [checked]="isSeleted('ticketManagerSubscription')"
                        readonly
                    >
                    <span></span>
                    <div class="text-content">
                        <div class="name">Ticket Manager</div>
                    </div>
                </label>
            </div>
        </div>
    </div>
</div>
