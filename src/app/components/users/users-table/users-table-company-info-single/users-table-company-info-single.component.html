<div
    [ngbTooltip]="companyContent"
    [tooltipClass]="'users-tooltip'"
    [disableTooltip]="disableTooltip"
    class="qt-table-modern__circle-avatar multi-assign-user"
    *ngIf="i < 3"
    [textContent]="checkLogo(getCompany(company)) ? '' : company.clientCompanyName[0].toUpperCase()"
    [ngStyle]="{'background': getStyleAvatarCompany(getCompany(company),listColorNoAvatar[indexNoAvatar]) ,
'left': getStyleNetAvatar(i)}"
></div>
