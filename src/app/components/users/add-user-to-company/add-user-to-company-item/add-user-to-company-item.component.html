<div
    [ngClass]="{'--selected': selected || user.selected}"
    class="qt-df qt-ai-c qt-pt-12 qt-pb-12 user-company-item qt-pointer"
    (click)="selectUser()"
>
    <div class="qt-mr-16">
        <div class="qt-df">
            <label
                class="qt-checkbox"
                [attr.for]="'user-company-' + user.id"
            >
                <input
                    [attr.id]="'user-company-' + user.id"
                    [checked]="user.selected"
                    type="checkbox"
                    disabled
                >
                <span></span>
            </label>
        </div>
    </div>
    <div>
        <div class="qt-df qt-ai-c">
            <div
                class="user-company--avatar qt-mr-12"
                [ngStyle]="{'background':  usersStateService.getUserAvatarUrl(user)}"
                [textContent]="usersStateService.getFirstNameForAvatar(user)"
            ></div>
            <div class="qt-df qt-fd-c user-company--name">
                <span
                    class="user-company-name"
                    [textContent]="getUserName()"
                ></span>
                <span
                    class="user-company-email"
                    [textContent]="user.primaryEmail"
                ></span>
            </div>
        </div>
    </div>
</div>
