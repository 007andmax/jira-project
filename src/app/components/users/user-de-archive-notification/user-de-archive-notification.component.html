<div class="archive-modal de-archive">
    <button
        class="close-modal"
        (click)=cancelConfirm()
    ></button>
    <div class="archive-modal__body">
        <h3>Restore User</h3>
        <div class="exist-agreements">
            <p>You cannot restore the user.</p>
            <p>
                There exists an active user with the same email address.
            </p>
            <p [textContent]="'The existing active user: ' + user.firstName + ' ' + user.lastName"></p>
        </div>
    </div>
</div>
