<!-- for show filters add class "show" for app-left-panel -->
<app-users-header
    #header
    [type]="TYPE_LIST_ALL_USERS"
    [count]="users.length"
    [selectAll]="selectAll"
    (onChangeFilterField)="onFilter($event)"
    [users]="users"
    (onSearch)="onSearch($event)"
    (onSelectAllUser)="onSelectAllUser($event)"
    (onToggleFilter)="toggleFilter = $event"
></app-users-header>
<div class="qt-page-list users-page qt-df">
    <div class="qt-page-list__body">
        <div class="qt-page-list__header-thead-container">
            <table class="qt-table-modern qt-page-list__header-thead">
                <thead>
                    <tr>
                        <th class="users-table__check">
                            <div class="qt-df">
                                <label
                                    class="qt-checkbox"
                                    for="all-users"
                                >
                                    <input
                                        id="all-users"
                                        [(ngModel)]="selectAll"
                                        (change)="toggleAllUser($event)"
                                        type="checkbox"
                                    >
                                    <span></span>
                                </label>
                            </div>
                        </th>
                        <th
                            class="users-table__name pointer"
                            (click)="onFilter('name')"
                        >
                            Name
                            <span class="qt-table-modern__sorting"></span>
                        </th>
                        <th
                            class="users-table__company pointer users-table__company-full"
                            (click)="onFilter('company')"
                        >
                            Company
                            <span class="qt-table-modern__sorting"></span>
                        </th>
                        <th
                            class="users-table__company pointer"
                            (click)="onFilter('portalAccessStatus')"
                        >
                            Portal Status
                            <span class="qt-table-modern__sorting"></span>
                        </th>
                        <th
                            class="users-table__company pointer"
                            (click)="onFilter('industry')"
                        >
                            Industry
                            <span class="qt-table-modern__sorting"></span>
                        </th>
                        <th
                            class="users-table__contract-no pointer"
                            (click)="onFilter('contact')"
                        >
                            Contact No
                            <span class="qt-table-modern__sorting"></span>
                        </th>
                        <th
                            class="users-table__tickets pointer"
                            (click)="onFilter('tickets')"
                        >
                            Tickets
                            <span class="qt-table-modern__sorting"></span>
                        </th>
                        <th class="users-table__email"></th>
                        <th class="users-table__menu"></th>
                    </tr>
                </thead>
            </table>
        </div>
        <div class="qt-page-list__body-table-container">
            <table class="qt-page-list__body-tbody qt-table-modern users-table">
                <tbody
                    infiniteScroll
                    [infiniteScrollContainer]="container"
                    [infiniteScrollDistance]="2"
                    [infiniteScrollThrottle]="50"
                    [infiniteScrollDisabled]="infiniteScrollDisabled"
                    (scrolled)="onScroll()"
                >
                    <ng-template
                        ngFor
                        let-user
                        [ngForOf]="users"
                        [ngForTrackBy]="trackById"
                    >
                        <app-users-table
                            [selected]="idDetailUser === user.id"
                            (click)="setIdDetailUser(user.id)"
                            [type]="TYPE_LIST_ALL_USERS"
                            [showArchivedUsers]="filter.isArchive"
                            (onSelectUser)="onSelectUser($event)"
                            [user]="user"
                            [listCustomSubscription]="listCustomSubscription"
                            [jobTitleList]="jobTitleList"
                        ></app-users-table>
                    </ng-template>
                </tbody>
            </table>
            <div
                class="loading"
                *ngIf="showPreloader"
            ></div>
            <div
                class="no-exist-elements"
                *ngIf="!showPreloader && users.length == 0"
            >
                We couldn't find any results
            </div>
            <div
                class="loading pengind-loading"
                *ngIf="showPendingPreloader"
            ></div>
        </div>
    </div>
    <div
        class="aside-filters"
        [hidden]="!toggleFilter"
    >
        <div class="aside-filters-header qt-df qt-ai-c qt-jc-sb">
            <div class="aside-filters-header__title">Filters</div>
            <div
                class="qt-button --square-md --gray pointer"
                (click)="onCloseFilters()"
            >
                <div class="icon__close qt-bg-contain qt-sz-16 pointer"></div>
            </div>
        </div>
        <div class="aside-filters-content">
            <app-users-filter
                class="qt-w100"
                #filter
                (onClearAll)="onClearAll()"
                (onClose)="onCloseFilters()"
            ></app-users-filter>
        </div>
    </div>
</div>
