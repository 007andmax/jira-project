<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line">
        <app-users-filter-info></app-users-filter-info>
        <div class="qt-page-list__header-title-line--rigth">
            <div class="qt-df qt-ai-c">
                <div class="qt-input-search qt-ml-8">
                    <!-- *ngIf="getSelectedCount() === 0" -->
                    <input
                        type="text"
                        placeholder="Search User"
                        [(ngModel)]="searchText"
                        (keyup)="onKeyUp($event)"
                    >
                    <span
                        class="search-clear qt-icon icon__close-round qt-icon__gray-400"
                        *ngIf="searchText.length > 0"
                        (click)="clearSearch()"
                    ></span>
                </div>
                <div
                    class="company-devices-page__list-header-buttons qt-fs-0 qt-ml-8"
                    *ngIf="getSelectedCount() > 0"
                >
                    <div class="qt-fs-0" [textContent]="getSelectedCount() + ' Users Selected'"></div>
                    <div
                        class="qt-ml-20 qt-fw-500 qt-df qt-ai-c qt-color-info qt-ai-c qt-pointer qt-fs-0"
                        *ngIf="!isExistArchiveUser() && (type === TYPE_LIST_MARKETING_USERS || type === TYPE_LIST_COMPANY_USERS)"
                        (click)="showAsideForDraftEmail()"
                    >
                        <div class="qt-icon icon__email qt-icon__blue-light-600 qt-sz-16 qt-ic-c qt-mr-6"></div>
                        <div class="qt-lh-1">Send Email</div>
                    </div>
                    <div
                        class="qt-ml-20 qt-fw-500 qt-df qt-ai-c qt-color-info qt-ai-c qt-pointer qt-fs-0"
                        *ngIf="!isExistArchiveUser() && (type === TYPE_LIST_MARKETING_USERS || type === TYPE_LIST_COMPANY_USERS)"
                        (click)="showAddToSubscription()"
                    >
                        <div class="qt-icon icon__documents qt-icon__blue-light-600 qt-sz-16 qt-ic-c qt-mr-6 qt-fs-0"></div>
                        <div class="qt-lh-1">Save to Subscriptions</div>
                    </div>
                    <div
                        class="qt-ml-20 qt-fw-500 qt-df qt-ai-c qt-color-info qt-ai-c qt-pointer qt-fs-0"
                        *ngIf="!isExistArchiveUser() && isUserOneCustomSubscription()"
                        (click)="removeUsersFromSubscription()"
                    >
                        <div class="icon__new-remove-user qt-sz-16 qt-ic-c qt-mr-6 qt-fs-0"></div>
                        <div class="qt-lh-1">Remove From Marketing Subscription</div>
                    </div>
                    <div
                        class="qt-ml-20 qt-fw-500 qt-df qt-ai-c qt-color-info qt-ai-c qt-pointer qt-fs-0"
                        *ngIf="!isExistArchiveUser() && !isExistPrimaryContact() && currentUser && currentUser.checkPermission('ARCHIVE_USERS')"
                        (click)="delete()"
                    >
                        <div class="qt-icon icon__delete qt-icon__red-600 qt-sz-16 qt-ic-c qt-mr-6"></div>
                        <div class="qt-lh-1 qt-color-red-600">Archive User</div>
                    </div>
                </div>
                <button
                    class="qt-button --gray --md qt-button-filter qt-ml-8 qt-df"
                    [ngClass]="{'active':toggleFilter}"
                    (click)="setToggleFilter(!toggleFilter)"
                >
                    <span class="qt-icon icon__filter qt-sz-16 qt-bg-contain qt-dib qt-mr-8"></span>
                    <span
                        class="filter-counter qt-circle qt-sz-18 qt-fw-600 qt-fs-10 qt-color-white qt-bg-info qt-mr-8 qt-df qt-ai-c qt-jc-c"
                        *ngIf="countFilter > 0"
                        [textContent]="countFilter"
                    ></span>
                    Filters
                </button>
                <!-- add class 'active' if filters open -->
                <button
                    [ngClass]="(type == TYPE_LIST_COMPANY_USERS) ? 'qt-button --md qt-ml-8' : 'qt-button --gray --md qt-ml-8'"
                    class="qt-button --md"
                    (click)="addUser()"
                    *ngIf="getPermissions('CREATE_USERS')"
                >
                    Add User
                </button>
            </div>
        </div>
    </div>
    <!-- <app-users-filter
        #filter
        (changeCountFilter)="onChangeCountFilter($event)"
        [hidden]="toggleFilter"
    ></app-users-filter> -->
</div>
