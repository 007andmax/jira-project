<div
    class="light-dropdown"
    ngbDropdown
    #products="ngbDropdown"
    (openChange)="openChange($event)"
    [placement]="placement"
>
    <mat-form-field ngbDropdownAnchor>
        <mat-chip-list
            #chipList
            aria-label="Fruit selection"
        >
            <app-dynamic-tooltip
                [position]="'top'"
                #productTooltip
            ></app-dynamic-tooltip>
            <mat-chip
                *ngFor="let tag of selectedTag; let i = index"
                [selectable]="selectable"
                [removable]="removable"
                (removed)="remove(i)"
            >
                <div
                    class="clip-text"
                    *ngIf="tag.word.length >= 30"
                    (mouseenter)="productTooltip.setContent(tag.word);productTooltip.show($event.target)"
                    (mouseleave)="productTooltip.hide()"
                >
                    {{tag.word}}
                </div>
                <div
                    class="clip-text"
                    *ngIf="tag.word.length < 30"
                >
                    {{tag.word}}
                </div>
                <mat-icon
                    matChipRemove
                    *ngIf="removable"
                >
                    cancel
                </mat-icon>
            </mat-chip>
            <input
                id="dropdownServices"
                ngbDropdownToggle
                placeholder="Select tag"
                #userInput
                class="pointer"
                [matChipInputFor]="chipList"
                [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                [matChipInputAddOnBlur]="addOnBlur"
                autocomplete="off"
                (input)="onSearch($event)"
                (keyup)="onKeyUp($event)"
            >
        </mat-chip-list>
    </mat-form-field>
    <div
        class="dropdown-menu"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
        #content
        (click)="$event.preventDefault()"
        infiniteScroll
        [infiniteScrollContainer]="content"
        [infiniteScrollDistance]="2"
        [infiniteScrollThrottle]="50"
        [infiniteScrollDisabled]="infiniteScrollDisabled"
        [fromRoot]="true"
        (scrolled)="onScroll()"
    >
        <ng-template
            ngFor
            let-tag
            [ngForOf]="tags"
            [ngForTrackBy]="trackById"
        >
            <div
                class="qt-pos-rel"
                *ngIf="tag.defaultTag == 'COMMON' || tag.defaultTag == 'COMPANY_TAG'"
            >
                <button
                    ngbDropdownItem
                    class="dropdown-item"
                    (click)="toggleItem(tag)"
                    [textContent]="tag.word"
                    [ngClass]="{'--selected':isSeleted(tag)}"
                >
                </button>
                <div
                    *ngIf="isSeleted(tag)"
                    class="icon__done qt-za-20 qt-sz-20 qt-bg-contain filter-tags-check"
                ></div>
                <i
                    *ngIf="tag.defaultTag && tag.defaultTag === 'USER_TAG'"
                    class="qt-icon icon__user qt-sz-16 qt-ml-8"
                ></i>
                <i
                    *ngIf="tag.defaultTag && tag.defaultTag === 'COMMON'"
                    class="qt-icon icon__tags qt-sz-16 qt-ml-8"
                ></i>
                <i
                    *ngIf="tag.defaultTag && tag.defaultTag === 'COMPANY_TAG'"
                    class="icon__companies qt-za-16 qt-sz-16 qt-bg-contain qt-ml-8"
                ></i>
            </div>
        </ng-template>
    </div>
</div>
