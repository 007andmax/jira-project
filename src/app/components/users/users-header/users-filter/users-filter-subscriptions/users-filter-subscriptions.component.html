            <mat-chip
                *ngFor="let subscription of selectedSubscriptions; let i = index"
                [selectable]="selectable"
                [removable]="removable"
                (removed)="toggleSubscription(subscription)"
            >
                {{subscription.name}}
                <mat-icon
                    matChipRemove
                    *ngIf="removable"
                >
                    cancel
                </mat-icon>
            </mat-chip>
            <input
                id="dropdownServices"
                ngbDropdownToggle
                placeholder="Search By Tags"
                #userInput
                class="pointer"
                [formControl]="tagCtrl"
                [matChipInputFor]="chipList"
                [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                [matChipInputAddOnBlur]="addOnBlur"
                (input)="onSearch($event)"
                autocomplete="off"
            >
        </mat-chip-list>
    </mat-form-field>
    <div
        class="select-wrapper"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
        (click)="$event.preventDefault()"
    >

            <ng-template
                ngFor
                let-subscription
                let-i="index"
                [ngForOf]="subscriptions"
                [ngForTrackBy]="trackById"
            >
                <div
                    (click)="toggleSubscription(subscription)"
                    class="company-tag-item"
                    [ngClass]="{'is-hover':isSelected(subscription)}"
                >
                    <label class="qt-checkbox pointer">
                        <input
                            type="checkbox"
                            [checked]="isSelected(subscription)"
                            readonly
                        >
                        <span></span>
                        <div class="text-content">
                            <div class="name">{{subscription.name}}</div>
                        </div>
                    </label>
                </div>
            </ng-template>
            <div
                class="loading pengind-loading"
                *ngIf="showPreloader"
            ></div>
