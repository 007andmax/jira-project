<div
    class="light-dropdown"
    ngbDropdown
    #products="ngbDropdown"
>
    <p class="qt-input-block__label">Subscription Title</p>
    <app-mat-form-field
        ngbDropdownAnchor
        #formField
    >
        <app-mat-chip-list
            #chipList
            aria-label="Fruit selection"
        >
            <app-mat-chip
                [isRemove]="true"
                (onClose)="selected('invoiceSubscription')"
                *ngIf="defaultSubscriptions.invoiceSubscription.enabled"
            >
                <div class="clip-text">Invoice Updates</div>
            </app-mat-chip>
            <app-mat-chip
                [isRemove]="true"
                (onClose)="selected('ticketSubscription')"
                *ngIf="defaultSubscriptions.ticketSubscription.enabled"
            >
                <div class="clip-text">Ticket Updates</div>
            </app-mat-chip>
            <app-mat-chip
                [isRemove]="true"
                (onClose)="selected('ticketManagerSubscription')"
                *ngIf="defaultSubscriptions.ticketManagerSubscription.enabled"
            >
                <div class="clip-text">Ticket Manager</div>
            </app-mat-chip>
            <input
                id="dropdownServices"
                ngbDropdownToggle
                placeholder="Search By Subscription Title"
                class="pointer"
                autocomplete="off"
                readonly
            >
        </app-mat-chip-list>
    </app-mat-form-field>
    <div
        class="dropdown-menu"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <div class="qt-pos-rel">
            <button
                ngbDropdownItem
                class="dropdown-item"
                (click)="selected('invoiceSubscription')"
                [ngClass]="{'--selected':isSeleted('invoiceSubscription')}"
            >
                Invoice Updates
            </button>
            <div
                *ngIf="isSeleted('invoiceSubscription')"
                class="qt-icon icon__done qt-za-20 qt-sz-20 qt-bg-contain filter-company-check"
            ></div>
        </div>
        <div class="qt-pos-rel">
            <button
                ngbDropdownItem
                class="dropdown-item"
                (click)="selected('ticketSubscription')"
                [ngClass]="{'--selected':isSeleted('ticketSubscription')}"
            >
                Ticket Updates
            </button>
            <div
                *ngIf="isSeleted('ticketSubscription')"
                class="qt-icon icon__done qt-za-20 qt-sz-20 qt-bg-contain filter-company-check"
            ></div>
        </div>
        <div class="qt-pos-rel">
            <button
                ngbDropdownItem
                class="dropdown-item"
                (click)="selected('ticketManagerSubscription')"
                [ngClass]="{'--selected':isSeleted('ticketManagerSubscription')}"
            >
                Ticket Manager
            </button>
            <div
                *ngIf="isSeleted('ticketManagerSubscription')"
                class="qt-icon icon__done qt-za-20 qt-sz-20 qt-bg-contain filter-company-check"
            ></div>
        </div>
    </div>
</div>
