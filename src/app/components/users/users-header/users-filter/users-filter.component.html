<div class="qt-page-list__header-filters">
    <app-drop-down
        #titlesDp
        class="qt-w100 qt-mr-8"
        [placeholder]="'Select Title'"
        [list]="jobTitleList"
        [field]="'name'"
        [search]="true"
        [change]="true"
        [heightInput]="'36px'"
        (onSelectedItem)="onSelectTitle($event)"
    ></app-drop-down>
    <app-drop-down
        #companiesDp
        class="qt-w100 qt-mr-8"
        [placeholder]="'Search By Company'"
        [field]="'name'"
        [list]="companies"
        [search]="true"
        [change]="true"
        [heightInput]="'36px'"
        (onSelectedItem)="onSelectCompany($event)"
    ></app-drop-down>
    <users-filter-subscriptions
        #subscriptionDp
        class="qt-w100 qt-mr-8"
        (onChangeDefault)="onChangeDefaultSubscription($event)"
        (onChangeCustom)="onChangeCustomSubscription($event)"
    ></users-filter-subscriptions>
    <app-drop-down
        #industriesDp
        class="qt-w100"
        [placeholder]="'Search By Industry'"
        [list]="industries"
        [field]="'name'"
        [search]="true"
        [change]="true"
        [heightInput]="'36px'"
        (onSelectedItem)="onSelectClientIndustry($event)"
    ></app-drop-down>
</div>
