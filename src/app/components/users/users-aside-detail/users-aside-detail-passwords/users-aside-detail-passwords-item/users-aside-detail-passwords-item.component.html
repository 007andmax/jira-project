<tr [ngClass]="{'--selected':item.selected}">
    <td
        class="password-table__account pointer"
        (click)="editRecord()"
    >
        <div class="qt-df qt-ai-fs">
            <div
                *ngIf="item.template.name === 'OFFICE_365_ACCOUNT' && item.isDefaultType()"
                class="icon__office-account qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
            ></div>
            <div
                *ngIf="item.template.name === 'GENERIC' && item.isDefaultType()"
                class="icon__generic qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
            ></div>
            <div
                *ngIf="item.template.name === 'LOCAL_USER_ACCOUNT' && item.isDefaultType()"
                class="icon__user-account qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
            ></div>
            <div
                *ngIf="item.template.name === 'EMAIL_ACCOUNT' && item.isDefaultType()"
                class="icon__email qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
            ></div>
            <div
                *ngIf="item.template.name === 'WIFI_NETWORK' && item.isDefaultType()"
                class="icon__wifi qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
            ></div>
            <div
                *ngIf="item.template.name === 'AGENT' && item.isDefaultType()"
                class="icon__agent qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
            ></div>
            <div
                *ngIf="item.template.name === 'DEVICE' && item.isDefaultType()"
                class="icon__devices-grey qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
            ></div>
            <div
                *ngIf="item.template.name === 'MICROSOFT_ACCOUNT' && item.isDefaultType()"
                class="icon__microsoft qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
            ></div>
            <div
                *ngIf="item.template.name === 'HOSTING' && item.isDefaultType()"
                class="icon__hosting qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
            ></div>
            <div
                *ngIf="!item.isDefaultType()"
                class="icon__custom-category qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
            ></div>
            <div class="user-data">
                <span [textContent]="item.username"></span>
                <div class="user-password">
                    <span
                        *ngIf="togglePassword"
                        [textContent]="item.password"
                    ></span>
                    <span
                        *ngIf="!togglePassword"
                        class="active"
                    >
                        •••••
                    </span>
                </div>
            </div>
        </div>
    </td>
    <td class="password-table__user-password">
        <div class="user-action">
            <div class="user-password">
                <div
                    *ngIf="!togglePassword"
                    class="icon__view qt-za-16 qt-sz-16 qt-bg-contain qt-ml-6 pointer"
                    (click)="showPassword()"
                ></div>
                <div
                    *ngIf="togglePassword"
                    class="icon__hide qt-za-16 qt-sz-16 qt-bg-contain qt-ml-6 pointer"
                    (click)="togglePassword = false"
                ></div>
                <div
                    class="icon__copy-gray qt-za-16 qt-sz-16 qt-bg-contain qt-ml-16 pointer"
                    *ngIf="togglePassword"
                    (click)="copy(item.password)"
                ></div>
            </div>
        </div>
    </td>
</tr>
