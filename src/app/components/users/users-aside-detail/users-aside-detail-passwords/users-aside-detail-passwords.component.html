<div class="qt-page-list password-page">
    <div class="qt-page-list__body">
        <div
            class="qt-page-list__body-table-container"
            [ngStyle]="{'height': (showPendingPreloader) ? 'calc(100% - 80px)' : '100%'}"
            #content
        >
            <table class="qt-page-list__body-tbody qt-table-modern password-table">
                <tbody
                    infiniteScroll
                    [infiniteScrollContainer]="content"
                    [infiniteScrollDistance]="2"
                    [infiniteScrollThrottle]="50"
                    [infiniteScrollDisabled]="infiniteScrollDisabled"
                    (scrolled)="onScroll()"
                >
                    <ng-template
                        ngFor
                        let-item
                        [ngForOf]="list_records"
                        [ngForTrackBy]="trackById"
                    >
                        <users-aside-detail-passwords-item
                            [item]="item"
                            (onSelectRecord)="onSelectRecord($event)"
                        ></users-aside-detail-passwords-item>
                    </ng-template>
                </tbody>
            </table>
        </div>
    </div>
    <div
        class="loading"
        *ngIf="showPreloader"
    ></div>
    <div
        class="loading pengind-loading"
        *ngIf="showPendingPreloader"
    ></div>
    <div
        class="no-exist-passwords"
        *ngIf="!showPreloader && list_records.length === 0"
    >
        No passwords
    </div>
</div>
