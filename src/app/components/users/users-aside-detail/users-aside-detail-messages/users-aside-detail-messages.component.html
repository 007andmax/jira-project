<div class="qt-page-list__body">
    <div
        class="qt-page-list__body-table-container"
        [ngStyle]="{'padding-bottom':  '0px'}"
        #content
    >
        <table class="qt-page-list__body-tbody qt-table-modern ticket-table">
            <tbody
                infiniteScroll
                [infiniteScrollContainer]="content"
                [infiniteScrollDistance]="2"
                [infiniteScrollThrottle]="15"
                [infiniteScrollDisabled]="infiniteScrollDisabled"
                [fromRoot]="true"
                (scrolled)="onScroll()"
            >
                <ng-template
                    ngFor
                    let-message
                    [ngForOf]="messages"
                    let-i="index"
                    [ngForTrackBy]="trackById"
                >
                    <tr>
                        <td class="messages-table__account">
                            <div
                                class="messages-table__account-header"
                                [textContent]="message.type"
                            ></div>
                            <div class="messages-table__account-data">
                                <span
                                    class="messages-table__account-author"
                                    [textContent]="'Sender - ' + message.senderName + ', '"
                                ></span>
                                <time
                                    datetime="2021-03-20"
                                    class="messages-table__account-date"
                                    [textContent]="getDate(message.createdAt) + ' '"
                                >
                                </time>
                                <time
                                    datetime="12-59"
                                    class="messages-table__account-time"
                                    [textContent]="getTime(message.createdAt)"
                                >
                                </time>
                            </div>
                            <div class="messages-table__account-data">
                                <span
                                    class="messages-table__account-author"
                                    [textContent]="'Sender email - ' + message.emailFrom"
                                ></span>
                            </div>
                            <div class="messages-table__account-text">
                                <span [innerHTML]="getHtml(message.subject)"></span>
                            </div>
                        </td>
                    </tr>
                </ng-template>
            </tbody>
        </table>
    </div>
    <div
        class="loading"
        *ngIf="showPreloader"
    ></div>
</div>
