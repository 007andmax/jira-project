<tr [ngClass]="{'--selected': selected}">
    <td class="--strong ticket-table__subject">
        <div class="ellipsis">{{'Tkt# ' + ticket.number + ' - ' + ticket.subject}}</div>
        <span [ngClass]="getClassType()"></span>
    </td>
    <td class="ticket-table__status">
        <span
            class="tag__modern"
            [ngStyle]="getStyleStatus('inProgress')"
            *ngIf="ticket.status === 'IN_PROGRESS'"
        >
            In Progress
        </span>
        <span
            class="tag__modern"
            [ngStyle]="getStyleStatus('completed')"
            *ngIf="ticket.status === 'COMPLETED'"
        >
            Completed
        </span>
        <span
            class="tag__modern"
            [ngStyle]="getStyleStatus('unassigned')"
            *ngIf="ticket.status === null"
        >
            Unassigned
        </span>
        <span
            class="tag__modern"
            [ngStyle]="getStyleStatus('onHold')"
            *ngIf="ticket.status === 'ON_HOLD'"
        >
            On Hold
        </span>
    </td>
    <td
        class="ticket-table__created-date"
        [textContent]="getCreateAt()"
    ></td>
</tr>
