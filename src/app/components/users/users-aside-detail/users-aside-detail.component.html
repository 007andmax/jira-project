<div
    class="invoices-page__aside qt-aside-modern --x-large aside-preview user-aside-detail-page__aside"
    *ngIf="open"
>
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-title">User Detail</div>
        <div class="qt-df qt-ai-c">
            <div
                class="qt-sz-32 qt-circle qt-bg-white qt-mr-8 header-circle-icon qt-df qt-jc-c qt-ai-c"
                (click)="editUser()"
                placement="top"
                container="body"
                ngbTooltip="Edit"
                *ngIf="getPermissions('EDIT_USERS')"
            >
                <div class="qt-icon icon__edit qt-sz-20"></div>
            </div>
            <div
                class="qt-sz-32 qt-circle qt-bg-white qt-mr-16 header-circle-icon qt-df qt-jc-c qt-ai-c qt-mr-16 pointer"
                (click)="showAsideForDraftEmail()"
                placement="top"
                container="body"
                [ngbTooltip]="'Draft Email'"
                *ngIf="!customerPortalStateService.isCustomerPortal"
            >
                <div class="qt-icon icon__email-send qt-sz-20"></div>
            </div>
            <div
                class="qt-icon icon__close qt-aside-modern__header-close"
                (click)="close()"
            ></div>
        </div>
    </div>
    <div class="qt-aside-modern__content --no-padding --no-footer ">
        <div class="user-detail-info">
            <div class="user-detail-aside__header qt-df qt-jc-sb qt-ai-c">
                <div class="qt-df">
                    <!-- <div
                        class="upload-photo__img-block"
                        *ngIf="user.avatar"
                    >
                        <img
                            class="upload-photo__avatar"
                            [src]="getLogoUrl()"
                        >
                    </div> -->
                    <div
                        class="user-detail-aside__header-avatar"
                        [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                        [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                    ></div>
                    <div>
                        <div class="qt-df qt-ai-c">
                            <div class="user-detail-aside__header-company">
                                <span [textContent]="ticketsListService.getUserName(user)"></span>
                            </div>
                        </div>
                        <div class="user-detail-aside__header-info">
                            <span [textContent]="user.designation"></span>
                        </div>
                    </div>
                </div>
            </div>
            <hr class="user-detail-aside__divider">
            <div class="user-detail__row-info">
                <ng-template
                    ngFor
                    let-customerCompaniesInfo
                    [ngForOf]="user.customerCompaniesInfo"
                    [ngForTrackBy]="trackByCompanyId"
                >
                    <users-aside-detail-company-info
                        #companyInfo
                        [user]="user"
                        [customerCompaniesInfo]="customerCompaniesInfo"
                        (onUpdate)="updateUser()"
                    ></users-aside-detail-company-info>
                </ng-template>
                <div
                    class="qt-input-block qt-mb-16 qt-mt-24"
                    [ngClass]="{'--input-error':!validate.getPrimaryContactEmail() || !validate.getExistPrimaryContactEmail()}"
                >
                    <label class="qt-input-block__label">Email Address</label>
                    <div
                        class="qt-icon icon__edit qt-icon__gray-400 qt-za-16 qt-sz-16 qt-bg-contain pointer"
                        *ngIf="getPermissions('EDIT_USERS')"
                    ></div>
                    <input
                        class="qt-editable-input"
                        type="text"
                        [(ngModel)]="user.primaryEmail"
                        (blur)="onCheckEmail()"
                        placeholder="Enter Email"
                        [disabled]="!getPermissions('EDIT_USERS')"
                    >
                    <mat-error
                        class="invalid-feedback"
                        *ngIf="!validate.getPrimaryContactEmail()"
                    >
                        Please enter a valid email address
                    </mat-error>
                    <mat-error
                        class="invalid-feedback"
                        *ngIf="!validate.getExistPrimaryContactEmail()"
                    >
                        The email address is already occupied
                    </mat-error>
                </div>
                <div
                    class="qt-input-block"
                    [ngClass]="{'--input-error':!validate.getPhoneNumber(0)}"
                >
                    <label class="qt-input-block__label">Contact No.</label>
                    <div
                        class="qt-icon icon__edit qt-icon__gray-400 qt-za-16 qt-sz-16 qt-bg-contain pointer"
                        *ngIf="getPermissions('EDIT_USERS')"
                    ></div>
                    <ng-template
                        ngFor
                        let-number
                        let-i="index"
                        [ngForOf]="user.phoneNumbers"
                        [ngForTrackBy]="trackById"
                    >
                        <div class="qt-df qt-ai-c">
                            <div
                                [ngClass]="{'icon__old-phone':number.typeNumber == 'FAX',
                        'icon__mobile':number.typeNumber == 'MOBILE',
                         'icon__phone':number.typeNumber == 'OFFICE'}"
                                class=" qt-za-16 qt-sz-16 qt-bg-contain qt-fs-0 qt-mr-6 qt-icon"
                            ></div>
                            <input
                                type="text"
                                class="qt-editable-input qt-w100"
                                [(ngModel)]="number.number"
                                (input)="onCheckPhoneNumber(i)"
                                (blur)="onUpdatePhoneNumber()"
                                placeholder="Enter Primary Phone"
                                prefix="+1"
                                mask="(000) 000-0000 Ext: 999999||000-000-0000"
                                [specialCharacters]="['(',')',' ','-','E','x','t',':']"
                                [dropSpecialCharacters]="false"
                                [disabled]="!getPermissions('EDIT_USERS')"
                            >
                            <mat-error
                                class="invalid-feedback"
                                *ngIf="!validate.getPhoneNumber(i)"
                            >
                                Phone number is required
                            </mat-error>
                        </div>
                    </ng-template>
                </div>
            </div>
            <hr class="user-detail-aside__divider">
            <div class="user-detail__row-info">
                <div class="user-detail__row-info-line user-detail-aside-subscription">
                    <div class="qt-df qt-jc-sb qt-ai-c">
                        <div class="user-detail__row-info-label">Marketing</div>
                        <div
                            class="qt-icon icon__edit qt-icon__gray-400 qt-za-16 qt-sz-16 qt-bg-contain pointer"
                            *ngIf="getPermissions('EDIT_USERS')"
                        ></div>
                    </div>
                    <user-custom-subscription
                        [isDisabled]="!getPermissions('EDIT_USERS')"
                        [classDropDown]="'user-aside-detail-custom-subscription'"
                        [customSubscriptions]="user.customSubscriptions"
                        (onChange)="onChangeCustomSubscriptions($event)"
                    ></user-custom-subscription>
                </div>
                <div class="user-detail__row-info-line">
                    <div class="user-detail__row-info-label">Job description</div>
                    <div
                        class="user-detail__row-info-value"
                        [ngClass]="{'container':!showFullJobDescription}"
                    >
                        <span
                            [textContent]="getJobDescription(user.jobDescription)"
                            (click)="toggleEditJobDescription = true"
                            *ngIf="!toggleEditJobDescription"
                        ></span>
                        <button
                            *ngIf="!showFullJobDescription && user.jobDescription && user.jobDescription.length > 120 && !toggleEditJobDescription"
                            (click)="showFullJobDescription = !showFullJobDescription"
                            class="read-more"
                        >
                            read more...
                        </button>
                        <textarea
                            id="description-global-note"
                            *ngIf="toggleEditJobDescription"
                            [value]="user.jobDescription"
                            (input)="onChangeJobDescription($event)"
                            (blur)="updateUser()"
                            class="terms-n-conditions__textarea qt-input-block__textarea"
                            placeholder="Enter job description"
                            appTextArea
                            cols="30"
                            rows="3"
                            [disabled]="!getPermissions('EDIT_USERS')"
                        ></textarea>
                    </div>
                </div>
                <hr class="user-detail-aside__divider">
                <div class="user-detail__row-info-line">
                    <div class="qt-df qt-jc-sb qt-ai-c qt-mb-4">
                        <div class="user-detail__row-info-label">Tags</div>
                        <div
                            class="qt-icon icon__edit qt-icon__gray-400 qt-za-16 qt-sz-16 qt-bg-contain pointer"
                            *ngIf="getPermissions('EDIT_USERS')"
                        ></div>
                    </div>
                    <app-company-tags
                        #companyTags
                        [showLabel]="false"
                        [selectedTag]="user.tags"
                        [placement]="'top'"
                        [blockUserTag]="true"
                        [isDisabled]="!getPermissions('EDIT_USERS')"
                        (tagsChange)="onChangeTags($event)"
                    ></app-company-tags>
                </div>
            </div>
        </div>
        <div class="user-detail-statictics">
            <div class="tabs">
                <span
                    class="pointer"
                    [ngClass]="{'active':tab === 'tickets'}"
                    (click)="setTab('tickets')"
                    *ngIf="customerPortalStateService.checkShowTabTicketsAsideUserDetail( usersStateService.getCurrentUser(),  user)"
                >
                    Tickets
                </span>
                <span
                    class="pointer"
                    [ngClass]="{'active':tab === 'passwords'}"
                    (click)="setTab('passwords')"
                    *ngIf="getPermissions('VIEW_PASSWORD_SECTION') && !customerPortalStateService.isCustomerPortal"
                >
                    Passwords
                </span>
                <span
                    class="pointer"
                    [ngClass]="{'active':tab === 'documents'}"
                    (click)="setTab('documents')"
                    *ngIf="!customerPortalStateService.isCustomerPortal"
                >
                    Documents
                </span>
                <span
                    class="pointer"
                    [ngClass]="{'active':tab === 'messages'}"
                    (click)="setTab('messages')"
                >
                    Messages
                </span>
            </div>
            <users-aside-detail-tickets
                *ngIf="tab === 'tickets'"
                #ticketsDetail
                [setUser]="user"
            ></users-aside-detail-tickets>
            <users-aside-detail-documents
                *ngIf="tab === 'documents'"
                [user]="user"
            ></users-aside-detail-documents>
            <users-aside-detail-passwords
                *ngIf="tab === 'passwords' && getPermissions('VIEW_PASSWORD_SECTION')"
                [user]="user"
            ></users-aside-detail-passwords>
            <users-aside-detail-messages
                *ngIf="tab === 'messages'"
                [user]="user"
            ></users-aside-detail-messages>
        </div>
    </div>
</div>
<users-aside-detail-messages-full-body></users-aside-detail-messages-full-body>
