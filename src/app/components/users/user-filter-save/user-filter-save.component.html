<div class="archive-modal de-archive tickets-edit-filter-modal">
    <button
        class="close-modal"
        (click)=cancelConfirm()
    ></button>
    <div class="archive-modal__body">
        <h3 class="archive-modal__title qt-mb-24">Save Filter</h3>
        <div class="exist-agreements">
            <div class="contract-container qt-mt-16">
                <div class="contract-container-agreements qt-mt-8">
                    <div class="qt-inputs-row">
                        <div
                            class="qt-input-block qt-f100"
                            [ngClass]="{'--input-error':!validate.getName()}"
                        >
                            <div class="qt-input-block__label">Save Filter view as</div>
                            <input
                                type="text"
                                minlength="1"
                                maxlength="50"
                                [disabled]="globalFilter.global && !getPermissions('CREATE_GLOBAL_USER_FILTER') && getPermissions('EDIT_GLOBAL_USER_FILTER')"
                                [(ngModel)]="globalFilter.name"
                                (input)="onChangeName()"
                                placeholder="Give this filter view a name"
                            >
                            <mat-error
                                class="invalid-feedback first-name-invalid"
                                *ngIf="!validate.getName()"
                            >
                                The field is required
                            </mat-error>
                        </div>
                    </div>
                    <div class="qt-inputs-row">
                        <div class="qt-input-block qt-f100">
                            <div class="qt-input-block__label">Visible to</div>
                            <app-dynamic-tooltip
                                [content]="'You don`t have the permission to create a global saved filter'"
                                [position]="'top'"
                                #productTooltip
                            ></app-dynamic-tooltip>
                            <label
                                class="radio-container"
                                for="global-filter-1"
                            >
                                Just me
                                <input
                                    type="radio"
                                    [(ngModel)]="globalFilter.global"
                                    [value]="false"
                                    name="global-filter"
                                    id="global-filter-1"
                                >
                                <span class="radio-mark"></span>
                            </label>
                            <label
                                class="radio-container"
                                [ngClass]="{'no-pointer':!getPermissions('CREATE_GLOBAL_USER_FILTER') && !getPermissions('EDIT_GLOBAL_USER_FILTER')}"
                            >
                                <div
                                    (mouseenter)="!getPermissions('CREATE_GLOBAL_USER_FILTER') && !getPermissions('EDIT_GLOBAL_USER_FILTER') ? productTooltip.show($event.target) : null"
                                    (mouseleave)="!getPermissions('CREATE_GLOBAL_USER_FILTER') && !getPermissions('EDIT_GLOBAL_USER_FILTER') ? productTooltip.hide() : null"
                                >
                                    All Tech users
                                </div>
                                <input
                                    type="radio"
                                    [(ngModel)]="globalFilter.global"
                                    [value]="true"
                                    name="global-filter"
                                    id="global-filter-2"
                                    [disabled]="!getPermissions('CREATE_GLOBAL_USER_FILTER') && !getPermissions('EDIT_GLOBAL_USER_FILTER')"
                                >
                                <span
                                    class="radio-mark"
                                    (mouseenter)="!getPermissions('CREATE_GLOBAL_USER_FILTER') && !getPermissions('EDIT_GLOBAL_USER_FILTER') ? productTooltip.show($event.target) : null"
                                    (mouseleave)="!getPermissions('CREATE_GLOBAL_USER_FILTER') && !getPermissions('EDIT_GLOBAL_USER_FILTER') ? productTooltip.hide() : null"
                                ></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="archive-modal__footer">
        <div class="qt-df qt-jc-fe">
            <app-dynamic-tooltip
                [content]="'You don`t have the permission to edit a global saved filter'"
                [position]="'top'"
                #addTooltip
            ></app-dynamic-tooltip>
            <button
                class="qt-button --gray qt-mr-12 qt-jc-c qt-w100"
                (click)=cancelConfirm()
            >
                Cancel
            </button>
            <button
                (mouseenter)="isDisabled ? addTooltip.show($event.target) : null"
                (mouseleave)="isDisabled ? addTooltip.hide() : null"
                [disabled]="isDisabled"
                class="qt-button qt-jc-c qt-w100"
                [ngClass]="{'--loading':addBtn.isBlock(),'--disabled':isDisabled}"
                appDisabledBtn
                #addBtn="disabled"
                (onClick)="save()"
            >
                <span>Save</span>
                <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
            </button>
        </div>
    </div>
</div>
