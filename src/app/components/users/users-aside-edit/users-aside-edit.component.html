<div
    class="qt-aside-modern users-page__aside"
    [ngStyle]="{'z-index':opened ? '6' : '5'}"
    [hidden]="!opened"
>
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-title">Edit user</div>
        <div
            class="qt-aside-modern__header-close icon__close"
            (click)="close()"
        ></div>
    </div>
    <div class="qt-aside-modern__content">
        <div class="upload-photo qt-mb-24">
            <div class="upload-photo__img-block">
                <div
                    *ngIf="user.avatar"
                    class="user__header-avatar"
                    [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                    [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                ></div>
                <div
                    class="upload-photo__no-avatar-icon icon__upload-avtar"
                    *ngIf="!user.avatar"
                ></div>
            </div>
            <div>
                <div class="upload-photo__title">
                    <span (click)="uploadFile.click()">Upload your photo</span>
                    <span
                        *ngIf="user.avatar"
                        class="remove-link pointer"
                        (click)="removeLogo()"
                    >
                        Remove logo
                    </span>
                </div>
                <div class="upload-photo__subtitle">Maximum size of 2MB. JPG, GIF, PNG</div>
            </div>
            <input
                #uploadFile
                id="upload-file"
                class="upload-photo__input pointer"
                type="file"
                accept="image/gif, image/jpeg, image/png, image/jpg"
                (input)="uploadFileOnBrower($event)"
            >
        </div>
        <div class="qt-inputs-row">
            <div class="qt-input-block qt-f50">
                <div
                    class="qt-input-block"
                    [ngClass]="{'--input-error':!validate.getFirstName()}"
                >
                    <label class="qt-input-block__label">First Name</label>
                    <input
                        type="text"
                        minlength="2"
                        (blur)="onChangeFistname()"
                        [(ngModel)]="user.firstName"
                        placeholder="Enter First Name"
                    >
                    <mat-error
                        class="invalid-feedback"
                        *ngIf="!validate.getFirstName()"
                    >
                        Please enter first name
                    </mat-error>
                </div>
            </div>
            <div class="qt-input-block qt-f50">
                <div class="qt-input-block">
                    <label class="qt-input-block__label">Last Name</label>
                    <input
                        type="text"
                        [(ngModel)]="user.lastName"
                        placeholder="Enter Last Name"
                    >
                </div>
            </div>
        </div>
        <div class="qt-inputs-row qt-ai-fe">
            <div class="qt-input-block qt-f50">
                <div
                    class="qt-input-block"
                    [ngClass]="{'--input-error':!validate.getPrimaryContactEmail() || !validate.getExistPrimaryContactEmail()}"
                >
                    <label class="qt-input-block__label">Email</label>
                    <input
                        type="text"
                        [(ngModel)]="user.primaryEmail"
                        (blur)="onCheckEmail()"
                        placeholder="Enter Email"
                    >
                    <mat-error
                        class="invalid-feedback"
                        *ngIf="!validate.getPrimaryContactEmail()"
                    >
                        Please enter a valid email address
                    </mat-error>
                    <mat-error
                        class="invalid-feedback"
                        *ngIf="!validate.getExistPrimaryContactEmail()"
                    >
                        The email address is already occupied
                    </mat-error>
                </div>
            </div>
            <div
                class="qt-inputs-row qt-f50"
                *ngIf="user.portalAccessStatus == 'Unauthorized' || user.portalAccessStatus == 'Invite sent'"
            >
                <div class="qt-input-block">
                    <div class="qt-df qt-ai-c qt-mt-15 qt-mb-12">
                        <label
                            class="qt-checkbox receive-full-amount-check qt-mb-0 pointer"
                            for="sendPortalInvitation"
                        >
                            <input
                                id="sendPortalInvitation"
                                type="checkbox"
                                [(ngModel)]="user.sendPortalInvitation"
                            >
                            <span></span>
                            <div class="qt-ml-8">Send Invite to Customer Portal</div>
                        </label>
                    </div>
                </div>
            </div>
        </div>
        <div class="qt-inputs-row">
            <div class="qt-f50">
                <app-drop-down
                    #jobIndustryDp
                    [class]="['qt-select-input-40']"
                    [placeholder]="'Select Industry'"
                    [list]="industries"
                    [field]="'name'"
                    [search]="true"
                    [change]="true"
                    [title]="'Industry'"
                    [editItem]="selectedUserIndustry"
                    (onSelectedItem)="onSelectClientIndustry($event)"
                ></app-drop-down>
            </div>
        </div>
        <div class="qt-inputs-row">
            <div class="qt-input-block job-description">
                <label class="qt-input-block__label">Job Description</label>
                <textarea
                    id="description-global-note"
                    [ngModel]="user.jobDescription"
                    (input)="onChangeJobDescription($event)"
                    class="terms-n-conditions__textarea qt-input-block__textarea"
                    placeholder="Enter job description"
                    appTextArea
                    maxlength="500"
                    cols="30"
                    rows="3"
                    [default]="3"
                ></textarea>
            </div>
        </div>
        <div class="qt-inputs-row">
            <div class="qt-input-block qt-f50 with-new-link">
                <div
                    class="qt-input-block"
                    [ngClass]="{'--input-error':!validate.getPhoneNumber(0)}"
                >
                    <div class="qt-df qt-jc-sb qt-ai-c">
                        <label class="qt-input-block__label">Primary Phone</label>
                        <span
                            class="qt-fw-600 qt-fs-12 qt-pb-10 qt-lh-133 qt-color-info"
                            (click)="addPhoneNumber()"
                            *ngIf="user.phoneNumbers.length < 3"
                        >
                            + Add Phone
                        </span>
                    </div>
                    <div class="qt-with-number-types">
                        <input
                            type="text"
                            class="qt-with-number-types__input"
                            [(ngModel)]="user.phoneNumbers[0].number"
                            (input)="onCheckPhoneNumber(0)"
                            placeholder="Enter Primary Phone"
                            prefix="+1"
                            mask="(000) 000-0000 Ext: 999999||000-000-0000"
                            [specialCharacters]="['(',')',' ','-','E','x','t',':']"
                            [dropSpecialCharacters]="false"
                        >
                        <div
                            class="grey-dropdown primary-phone-selector"
                            ngbDropdown
                        >
                            <button
                                class="qt-with-number-types__types-btn dropdown-toggle"
                                id="dropdownBasic0"
                                ngbDropdownToggle
                                [textContent]="user.phoneNumbers[0].typeNumber"
                            ></button>
                            <i class="icn-sm report-caret-icon"></i>
                            <div
                                ngbDropdownMenu
                                aria-labelledby="dropdownBasic0"
                            >
                                <ng-template
                                    ngFor
                                    let-item
                                    [ngForOf]="phoneTypes"
                                >
                                    <button
                                        ngbDropdownItem
                                        [textContent]="item"
                                        (click)="user.phoneNumbers[0].typeNumber = item.toUpperCase()"
                                    ></button>
                                </ng-template>
                            </div>
                        </div>
                    </div>
                    <mat-error
                        class="invalid-feedback"
                        *ngIf="!validate.getPhoneNumber(0)"
                    >
                        Please enter a valid phone number
                    </mat-error>
                </div>
            </div>
            <div class="qt-w50">
                <app-drop-down
                    #jobTypeDp
                    [title]="'User Type'"
                    [field]="'name'"
                    [placeholder]="'Select User Type'"
                    [list]="userTypes"
                    [editItem]="selectedUserType"
                    [isBlockClear]="true"
                    (onSelectedItem)="onSelectRole($event)"
                ></app-drop-down>
            </div>
        </div>
        <ng-template
            ngFor
            let-phone
            *ngIf="user.phoneNumbers.length > 1"
            [ngForOf]="user.phoneNumbers"
            [ngForTrackBy]="trackById"
            let-i="index"
            [ngForTrackBy]="trackByIndex"
        >
            <div
                *ngIf="i > 0"
                class="with-new-link qt-inputs-row"
                ngbDropdown
            >
                <div
                    class="qt-input-block qt-f50"
                    [ngClass]="{'--input-error':!validate.getPhoneNumber(i)}"
                >
                    <div class="qt-df qt-jc-sb qt-ai-c">
                        <label class="qt-input-block__label">Additional phone</label>
                        <span
                            class="qt-fw-600 qt-fs-12 qt-pb-10 qt-lh-133 qt-color-info"
                            (click)="removePhoneNumber(i)"
                        >
                            Remove Phone
                        </span>
                    </div>
                    <div class="qt-with-number-types right">
                        <input
                            type="text"
                            class="qt-with-number-types__input"
                            [(ngModel)]="phone.number"
                            (input)="onCheckPhoneNumber(i)"
                            placeholder="Enter Primary Phone"
                            prefix="+1"
                            mask="(000) 000-0000 Ext: 999999||000-000-0000"
                            [specialCharacters]="['(',')',' ','-','E','x','t',':']"
                            [dropSpecialCharacters]="false"
                        >
                        <div
                            class="grey-dropdown primary-phone-selector"
                            ngbDropdown
                        >
                            <button
                                class="qt-with-number-types__types-btn"
                                [id]="'dropdownBasic' + i"
                                ngbDropdownToggle
                                [textContent]="phone.typeNumber"
                            ></button>
                            <i class="icn-sm report-caret-icon"></i>
                            <div
                                ngbDropdownMenu
                                [attr.aria-labelledby]="'dropdownBasic' + i"
                            >
                                <ng-template
                                    ngFor
                                    let-item
                                    [ngForOf]="phoneTypes"
                                >
                                    <button
                                        ngbDropdownItem
                                        [textContent]="item"
                                        (click)="phone.typeNumber = item.toUpperCase()"
                                    ></button>
                                </ng-template>
                            </div>
                        </div>
                        <mat-error
                            class="invalid-feedback"
                            *ngIf="!validate.getPhoneNumber(i)"
                        >
                            Phone number is required
                        </mat-error>
                    </div>
                </div>
            </div>
        </ng-template>
        <ng-template
            ngFor
            let-companyInfo
            [ngForOf]="user.customerCompaniesInfo"
            let-i="index"
        >
            <div class="qt-inputs-row-background">
                <div class="qt-inputs-row qt-pos-rel">
                    <div class="qt-df qt-ai-c company-actions">
                        <span
                            class="qt-fw-600 qt-fs-12 qt-pb-10 qt-lh-133 qt-color-info pointer"
                            *ngIf="i == 0"
                            (click)="addCompnay()"
                        >
                            + Add Company
                        </span>
                        <span
                            class="qt-fw-600 qt-fs-12 qt-pb-10 qt-lh-133 qt-color-info qt-ml-8 pointer"
                            *ngIf="user.customerCompaniesInfo.length > 1"
                            (click)="removeCompnay(i)"
                        >
                            Remove Company
                        </span>
                    </div>
                    <div class="qt-input-block">
                        <company-drop-down
                            [placeholder]="'Company'"
                            [validate]="validate.getCompany()"
                            [errorMessage]="'The company name is required'"
                            [title]="'Company'"
                            [field]="'name'"
                            [search]="true"
                            [change]="true"
                            [isBlockClear]="user.customerCompaniesInfo.length == 1"
                            [editItem]="getCompany(companyInfo)"
                            (onSelectedItem)="onSelectCompany($event,i)"
                        >
                        </company-drop-down>
                    </div>
                </div>
                <div class="qt-inputs-row">
                    <div class="qt-input-block qt-f50">
                        <app-drop-down
                            #jobTitleDp
                            [title]="'Job Title'"
                            [placeholder]="'Select Job Title'"
                            [list]="jobTitleList"
                            [field]="'name'"
                            [search]="true"
                            [change]="true"
                            [isDisabled]="!companyInfo.companyId"
                            [editItem]="companyInfo.jobTitleDto"
                            (onSelectedItem)="onSelectJobTitle($event,i)"
                        ></app-drop-down>
                    </div>
                    <div class="qt-input-block qt-f50">
                        <app-drop-down
                            #userRolesDP
                            *ngIf="customerRoleStateService.isGetUserRole"
                            [title]="'Permission Role'"
                            [placeholder]="'Select role'"
                            [list]="userRoles"
                            [field]="'name'"
                            [search]="true"
                            [change]="true"
                            [isDisabled]="!companyInfo.companyId"
                            [editItem]="companyInfo.customerUserRole"
                            (onSelectedItem)="onSelectUserRole($event,i)"
                        ></app-drop-down>
                    </div>
                </div>
                <div class="qt-inputs-row">
                    <div class="qt-input-block">
                        <label class="qt-input-block__label">Subscription</label>
                        <user-default-subscription
                            [mode]="MODE_EDIT_USER_SUBSCRIPTION"
                            [defaultSubscriptions]="companyInfo.defaultSubscriptions"
                            (onChange)="onChangeDefaultSubscriptions($event,i)"
                            [isDisabled]="!companyInfo.companyId"
                        ></user-default-subscription>
                    </div>
                </div>
                <div class="qt-inputs-row">
                    <div class="qt-input-block qt-f50">
                        <div class="qt-df qt-ai-c">
                            <label
                                class="qt-checkbox receive-full-amount-check qt-mb-0"
                                [attr.for]="'access-' + i"
                                [ngClass]="{'pointer' : companyInfo.companyId && companyInfo.customerUserRole,
                            'access-customer-portal': !(companyInfo.companyId && companyInfo.customerUserRole),
                        '--disabled': !(companyInfo.companyId && companyInfo.customerUserRole)}"
                            >
                                <input
                                    [attr.id]="'access-' + i"
                                    type="checkbox"
                                    [(ngModel)]="companyInfo.hasAccess"
                                    [disabled]="!companyInfo.companyId || !companyInfo.customerUserRole"
                                >
                                <span></span>
                                <div class="qt-ml-8">
                                    Access to the Customer portal
                                    <i
                                        class="icon__help default-services-page__question-icon qt-sz-12 qt-ic-c"
                                        (mouseenter)="customerPortalTooltip.show($event.target)"
                                        (mouseleave)="customerPortalTooltip.hide()"
                                    ></i>
                                </div>
                                <app-dynamic-tooltip
                                    class="user-companies-tooltip"
                                    [content]="'This option can be enabled only if the permission role has been set'"
                                    [position]="'bottom'"
                                    #customerPortalTooltip
                                ></app-dynamic-tooltip>
                            </label>
                        </div>
                    </div>
                    <div class="qt-input-block qt-f50">
                        <div class="qt-df qt-ai-c">
                            <label
                                class="qt-checkbox receive-full-amount-check qt-mb-0 pointer --disabled"
                                [attr.for]="'primary-contact-' + i"
                            >
                                <input
                                    [attr.id]="'primary-contact-' + i"
                                    type="checkbox"
                                    [(ngModel)]="companyInfo.isPrimaryContact"
                                    disabled
                                >
                                <span></span>
                                <div class="qt-ml-8">Set as a primary user</div>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </ng-template>
        <div class="qt-inputs-row qt-mt-24">
            <div class="qt-input-block">
                <label class="qt-input-block__label">Marketing Subscription</label>
                <user-custom-subscription
                    [customSubscriptions]="user.customSubscriptions"
                    (onChange)="onChangeCustomSubscriptions($event)"
                ></user-custom-subscription>
            </div>
        </div>
        <div class="qt-inputs-row">
            <div class="qt-input-block">
                <div class="qt-input-block__label">Tags</div>
                <app-company-tags
                    #companyTags
                    [placement]="'top'"
                    [blockUserTag]="true"
                    (tagsChange)="onChangeTags($event)"
                ></app-company-tags>
            </div>
        </div>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="qt-df">
            <button
                class="qt-button qt-mr-12"
                appDisabledBtn
                #editBtn="disabled"
                (onClick)="onSave()"
                [ngClass]="{'--loading':editBtn.isBlock()}"
            >
                <span>Save</span>
                <app-preloader-ticket *ngIf="editBtn.isBlock()"></app-preloader-ticket>
            </button>
            <button
                class="qt-button --gray"
                (click)="close()"
            >
                Cancel
            </button>
        </div>
    </div>
</div>
