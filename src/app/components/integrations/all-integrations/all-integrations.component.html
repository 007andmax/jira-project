<div class="qt-page-list__body integrations-table__body">
    <div class="qt-page-list__header --sticky">
      <div class="qt-page-list__header-title-line">
        <div class="integrations-table__body-head qt-dif qt-gap-16">
          <div class="integrations-table__moneris-logo icon__moneris qt-bg-contain qt-fs-0"></div>

          <div>
            <div class="integrations-table__moneris-title qt-fw-500 qt-color-gray-900">Github</div>
            <div class="tag__modern --success qt-mt-8">Connected</div>
          </div>
        </div>

        <div>
          <button class="qt-button --md qt-fs-0 qt-ml-8">
            Save
          </button>
        </div>
      </div>

    </div>

    <div class="qt-page-list__header-tabs-line">
        <ul
            ngbNav
            #nav="ngbNav"
            [(activeId)]="activeTab"
            class="qt-page-list__header-tabs"
            (navChange)="setTab($event)"
        >
            <li
                class="qt-page-list__header-tabs-item"
                [ngbNavItem]="'overview'"
            >
                <a
                    class="qt-page-list__header-tabs-item-link"
                    ngbNavLink
                >
                    <span class="qt-page-list__header-tabs-item-text">Overview</span>
                </a>
                <ng-template ngbNavContent>
                    <app-all-integrations-overview></app-all-integrations-overview>
                </ng-template>
            </li>
        </ul>
    </div>
    <div
        [ngbNavOutlet]="nav"
        class="mt-2"
    ></div>
</div>
