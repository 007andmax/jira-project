<div
  class="app-password-manager-edit-linked__col --required password-manager-linked-container"
  ngbDropdown
  #dp="ngbDropdown"
  [placement]="'bottom-start'"
  appClickOtside
  [init]="true"
  [classParent]="'.password-manager-linked-container'"
  (onOutSide)="hideSelectWrapper()"
>
  <p
    class="password-edit-aside__linked-devices-title qt-mt-16"
    [textContent]="getTitle()"
  ></p>

  <app-mat-form-field
    class="app-mat-tags-without-border device-user pointer"
    ngbDropdownAnchor
    #formField
  >
    <app-mat-chip-list
      [items]="selectedUserAndDevices"
      (onChangeItems)="formField.checkSelectedItems(selectedUserAndDevices)"
    >
      <app-mat-chip
        class="app-mat-tags-with-avatar app-mat-tags-with-avatar--lg"
        *ngFor="let item of selectedUserAndDevices; let i = index"
        [value]="item.name"
        [isRemove]="true"
        (onClose)="removeItem(i)"
      >
        <div class="qt-df qt-ai-c">
          <i
            class="app-mat-tags-with-avatar__avatar qt-icon icon__user"
            *ngIf="item.type === 'USER'"
          ></i>
          <i
            class="qt-icon icon__devices qt-sz-16"
            *ngIf="item.type === 'DEVICE'"
          ></i>
          {{ item.name }}
        </div>
      </app-mat-chip>

      <span
        class="placeholder"
        *ngIf="!selectedUserAndDevices.length"
        [textContent]="placeholder"
      ></span>

      <input
        ngbDropdownToggle
        class="pointer mat-chip-input mat-input-element"
        autocomplete="off"
        placeholder="Select user or device"
        (click)="showSelectWrapper($event)"
        [readonly]="!selectedClient || preloader"
      >
      <i class="loading xs" *ngIf="preloader"></i>
    </app-mat-chip-list>
  </app-mat-form-field>

  <div
    class="select-wrapper"
    *ngIf="showSelect"
  >
    <div
      class="content"
      (click)="$event.preventDefault()"
    >
      <div
        class="dropdown-item"
        *ngFor="let item of list; let i = index"
        (click)="toggleItem(item)"
      >
        <label class="qt-checkbox pointer">
          <input
            type="checkbox"
            [checked]="isSeleted(item)"
            readonly
          >
          <span></span>
          <div class="name">{{item.name}}</div>
        </label>
      </div>
    </div>
  </div>
</div>
