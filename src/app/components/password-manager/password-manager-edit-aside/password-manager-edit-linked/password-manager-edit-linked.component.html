<div
    class="app-password-manager-edit-linked__col --required password-manager-linked-container"
    appClickOtside
    [init]="true"
    [class]="'.password-manager-linked-container'"
    (onOutSide)="hideSelectWrapper()"
>
    <p
        class="password-edit-aside__linked-devices-title qt-mt-16"
        [textContent]="getTitle()"
    ></p>
    <div
        class="device-user pointer"
        [ngClass]="{
              'avoid-clicks': !selectedClient || preloader,
                'has-placeholder': !selectedUserAndDevices.length}"
        (click)="showSelectWrapper($event)"
    >
        <span
            class="placeholder"
            [textContent]="placeholder"
        ></span>
        <ng-template
            ngFor
            let-item
            let-i="index"
            [ngForOf]="selectedUserAndDevices"
            [ngForTrackBy]="trackByIndex"
        >
            <div class="selected-user">
                <i
                    class="icon__user-grey qt-sz-16 qt-bg-contain"
                    *ngIf="item.type === 'USER'"
                ></i>
                <i
                    class="icon__devices-grey qt-sz-16 qt-bg-contain"
                    *ngIf="item.type === 'DEVICE'"
                ></i>
                {{item.name}}
                <i
                    class="icn-sm icon__close--light-gray"
                    (click)="removeItem(i)"
                ></i>
            </div>
        </ng-template>
        <i
            class="loading xs"
            *ngIf="preloader"
        ></i>
    </div>
    <div
        class="select-wrapper"
        *ngIf="showSelect"
    >
        <div
            class="content"
            (click)="$event.preventDefault()"
        >
            <div
                class="dropdown-item"
                *ngFor="let item of list; let i = index"
                (click)="toggleItem(item)"
            >
                <label class="qt-checkbox pointer">
                    <input
                        type="checkbox"
                        [checked]="isSeleted(item)"
                        readonly
                    >
                    <span></span>
                    <div class="name">{{item.name}}</div>
                </label>
            </div>
        </div>
    </div>
</div>
