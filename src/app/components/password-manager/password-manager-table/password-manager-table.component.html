<div
    [ngClass]="{'--selected':item.selected}"
    class="qt-table-modern__row qt-table-modern__row--lg"
>
    <div class="password-table__check">
        <div class="qt-df">
            <label
                class="qt-checkbox"
                [attr.for]="'record-' + item.id"
            >
                <input
                    [attr.id]="'record-' + item.id"
                    [(ngModel)]="item.selected"
                    type="checkbox"
                    (change)="selectRecord($event)"
                >
                <span></span>
            </label>
        </div>
    </div>
    <div
        class="password-table__account pointer"
        (click)="editRecord()"
    >
        <div class="qt-df qt-ai-c qt-lh-1">
            <div
                *ngIf="item.template.name === 'OFFICE_365_ACCOUNT' && item.isDefaultType()"
                class="qt-icon icon__office-account qt-za-16 qt-sz-16 qt-fs-0 qt-mr-6"
            ></div>
            <div
                *ngIf="item.template.name === 'GENERIC' && item.isDefaultType()"
                class="qt-icon icon__globe qt-za-16 qt-sz-16 qt-bg-contain qt-fs-0 qt-mr-6"
            ></div>
            <div
                *ngIf="item.template.name === 'LOCAL_USER_ACCOUNT' && item.isDefaultType()"
                class="qt-icon icon__user-account qt-za-16 qt-sz-16 qt-fs-0 qt-mr-6"
            ></div>
            <div
                *ngIf="item.template.name === 'EMAIL_ACCOUNT' && item.isDefaultType()"
                class="qt-icon icon__email qt-za-16 qt-sz-16 qt-bg-contain qt-fs-0 qt-mr-6"
            ></div>
            <div
                *ngIf="item.template.name === 'WIFI_NETWORK' && item.isDefaultType()"
                class="icon__wifi qt-za-16 qt-sz-16 qt-bg-contain qt-fs-0 qt-mr-6"
            ></div>
            <div
                *ngIf="item.template.name === 'AGENT' && item.isDefaultType()"
                class="icon__agent qt-za-16 qt-sz-16 qt-bg-contain  qt-fs-0 qt-mr-6"
            ></div>
            <div
                *ngIf="item.template.name === 'DEVICE' && item.isDefaultType()"
                class="qt-icon icon__devices qt-za-16 qt-sz-16 qt-fs-0 qt-mr-6"
            ></div>
            <div
                *ngIf="item.template.name === 'MICROSOFT_ACCOUNT' && item.isDefaultType()"
                class="icon__microsoft qt-za-16 qt-sz-16 qt-bg-contain  qt-fs-0 qt-mr-6"
            ></div>
            <div
                *ngIf="item.template.name === 'HOSTING' && item.isDefaultType()"
                class="icon__hosting qt-za-16 qt-sz-16 qt-bg-contain  qt-fs-0 qt-mr-6"
            ></div>
            <div
                *ngIf="!item.isDefaultType()"
                class="qt-icon icon__custom-category qt-za-16 qt-sz-16 qt-fs-0 qt-mr-6"
            ></div>
            <span [textContent]="item.template.title"></span>
        </div>
    </div>
    <div
        (click)="editRecord()"
        class="password-table__company-name pointer"
        [textContent]="(item.companyName) ? item.companyName : ''"
    >
    </div>
    <div
        class="password-table__description pointer"
        (click)="editRecord()"
    >
        <span
            class="text-description"
            [textContent]="(item.description) ? item.description : ''"
        >
        </span>
    </div>
    <div class="password-table__user-password ellipsis">
        <div class="ellipsis">
            <div class="user-email ellipsis">
                <span
                    *ngIf="item.template.name === 'WIFI_NETWORK'"
                    class="email ellipsis"
                    [textContent]="'SSID: ' + item.ssid"
                ></span>
                <div
                    *ngIf="item.template.name === 'WIFI_NETWORK'"
                    class="qt-icon icon__copy qt-za-16 qt-sz-16 qt-bg-contain qt-ml-6 pointer qt-fs-0"
                    (click)="copy(item.ssid)"
                ></div>
                <span
                    *ngIf="item.template.name !== 'WIFI_NETWORK'"
                    class="email ellipsis"
                    [textContent]="item.username"
                ></span>
                <div
                    *ngIf="item.template.name !== 'WIFI_NETWORK' && item.username"
                    class="qt-icon icon__copy qt-za-16 qt-sz-16 qt-bg-contain qt-ml-6 pointer qt-fs-0"
                    (click)="copy(item.username)"
                    (mouseenter)="copyNameTooltip.show($event.target)"
                    (mouseleave)="copyNameTooltip.hide()"
                ></div>
                <app-dynamic-tooltip
                    [content]="'Copy'"
                    [position]="'top'"
                    #copyNameTooltip
                ></app-dynamic-tooltip>
            </div>
            <div class="user-password">
                <span
                    *ngIf="togglePassword"
                    [textContent]="item.password"
                ></span>
                <span
                    *ngIf="!togglePassword"
                    class="active"
                >
                    •••••
                </span>
                <div
                    *ngIf="!togglePassword && getPermissions('VIEW_PASSWORD')"
                    class="icon__view qt-za-16 qt-sz-16 qt-bg-contain qt-ml-6 pointer"
                    (click)="showPassword();showTooltip.hide()"
                    (mouseenter)="showTooltip.show($event.target)"
                    (mouseleave)="showTooltip.hide()"
                ></div>
                <app-dynamic-tooltip
                    [content]="'Show'"
                    [position]="'top'"
                    #showTooltip
                ></app-dynamic-tooltip>
                <div
                    *ngIf="togglePassword"
                    class="icon__hide qt-za-16 qt-sz-16 qt-bg-contain qt-ml-6 pointer"
                    (click)="togglePassword = false;hideTooltip.hide()"
                    (mouseenter)="hideTooltip.show($event.target)"
                    (mouseleave)="hideTooltip.hide()"
                ></div>
                <app-dynamic-tooltip
                    [content]="'Hide'"
                    [position]="'top'"
                    #hideTooltip
                ></app-dynamic-tooltip>
                <div
                    class="qt-icon icon__copy qt-za-16 qt-sz-16 qt-bg-contain qt-ml-6 pointer"
                    *ngIf="togglePassword"
                    (mouseenter)="copyTooltip.show($event.target)"
                    (mouseleave)="copyTooltip.hide()"
                    (click)="copy(item.password)"
                ></div>
                <app-dynamic-tooltip
                    [content]="'Copy'"
                    [position]="'top'"
                    #copyTooltip
                ></app-dynamic-tooltip>
            </div>
        </div>
    </div>
    <div
        class="password-table__status pointer"
        (click)="editRecord()"
    >
        <span
            *ngIf="item.expiredDate && isExpired()"
            class="tag__modern &#45;&#45;warning"
            [textContent]="'Expired'"
        ></span>
        <span
            *ngIf="item.expiredDate && !isExpired() && isExpiredLess30()"
            class="tag__modern --error"
            [textContent]="parseExpiredDate()"
        ></span>
    </div>
    <div
        class="password-table__otp pointer"
        (click)="editRecord()"
    >
        <div class="qt-df qt-ai-c qt-lh-1">
            <i
                class="icon__subscribe-user qt-sz-16 qt-bg-contain qt-dib"
                *ngIf="item.otpEnable"
            ></i>
        </div>
    </div>
    <div class="password-table__menu">
        <!-- <div class="qt-ic-c qt-icon icon__more  qt-pointer qt-sz-16 qt-bg-contain"></div> -->
        <div
            ngbDropdown
            [container]="'body'"
            [placement]="'bottom-right'"
            *ngIf="getPermissions('DELETE_PASSWORD')"
        >
            <div
                class="qt-ic-c qt-icon icon__more  qt-pointer qt-sz-16 qt-bg-contain"
                id="dropdownBasic1"
                ngbDropdownToggle
            ></div>
            <ul
                class="qt-dropdown-menu"
                ngbDropdownMenu
                aria-labelledby="dropdownBasic1"
            >
                <li
                    class="pointer"
                    (click)="deleteRecord()"
                    ngbDropdownItem
                >
                    <div class="qt-icon icon__remove qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Remove
                </li>
            </ul>
        </div>
    </div>
</div>
