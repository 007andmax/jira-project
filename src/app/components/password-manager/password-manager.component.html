<div class="qt-page-list password-page">
    <app-passwoord-manager-header
        (onChangeFilterField)="onFilter($event)"
        (onSearch)="onSearch($event)"
        [recordsData]="list_records"
    ></app-passwoord-manager-header>
    <div
        class="qt-page-list__body"
        [ngClass]="{'--open-filters':toggleFilter}"
    >
        <div class="qt-page-list__table">
            <!-- Start Header Table -->
            <div class="qt-page-list__header-thead-container">
                <div class="qt-table-modern qt-page-list__header-thead">
                    <div class="qt-page-list__header-thead__row">
                        <div class="password-table__check">
                            <div class="qt-df">
                                <label class="qt-checkbox">
                                    <input
                                        type="checkbox"
                                        [(ngModel)]="selectAll"
                                        (change)="toggleAll($event)"
                                    >
                                    <span></span>
                                </label>
                            </div>
                        </div>
                        <div
                            class="password-table__account pointer"
                            (click)="onFilter('CATEGORY')"
                        >
                            Account Type
                            <span class="qt-table-modern__sorting"></span>
                               <div *ngIf="sortBy.sortBy == 'CATEGORY'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                        </div>
                        <div
                            class="password-table__company-name pointer"
                            (click)="onFilter('COMPANY_NAME')"
                        >
                            Company name
                            <span class="qt-table-modern__sorting"></span>
                               <div *ngIf="sortBy.sortBy == 'COMPANY_NAME'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                        </div>
                        <div
                            class="password-table__description pointer"
                            (click)="onFilter('DESCRIPTION')"
                        >
                            Description
                            <span class="qt-table-modern__sorting"></span>
                               <div *ngIf="sortBy.sortBy == 'DESCRIPTION'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                        </div>
                        <div
                            class="password-table__user-password pointer"
                            (click)="onFilter('USERNAME')"
                        >
                            User & Password
                            <span class="qt-table-modern__sorting"></span>
                               <div *ngIf="sortBy.sortBy == 'USERNAME'"
                  [ngClass]="{'icon__arrow_narrow_down': sortBy.sortDirection === 'DESC', 'icon__arrow_narrow_up': sortBy.sortDirection === 'ASC'}"
                class="qt-icon__background-unset qt-bg-contain qt-sz-20"
            ></div>
                        </div>
                        <div class="password-table__status">Status</div>
                        <div class="password-table__otp">OTP</div>
                        <div class="password-table__menu"></div>
                    </div>
                </div>
            </div>
            <!-- End Header Table -->
            <div
                class="qt-page-list__body-table-container"
                [ngStyle]="{'padding-bottom': (showPendingPreloader) ? '65px' : '0px'}"
            >
                <div class="qt-page-list__body-tbody qt-table-modern password-table">
                    <div
                        infiniteScroll
                        [infiniteScrollContainer]="container"
                        [infiniteScrollDistance]="2"
                        [infiniteScrollThrottle]="50"
                        [infiniteScrollDisabled]="infiniteScrollDisabled"
                        (scrolled)="onScroll()"
                    >
                        <ng-template
                            ngFor
                            let-item
                            [ngForOf]="list_records"
                            [ngForTrackBy]="trackById"
                        >
                            <app-password-manager-table
                                [item]="item"
                                (onSelectRecord)="onSelectRecord($event)"
                            ></app-password-manager-table>
                        </ng-template>
                    </div>
                </div>
                <div
                    class="no-exist-elements"
                    *ngIf="!showPreloader && list_records.length == 0"
                >
                    We couldn't find any results
                </div>
                <div
                    class="loading pengind-loading"
                    *ngIf="showPendingPreloader"
                ></div>
                <div
                    class="loading"
                    *ngIf="showPreloader"
                ></div>
            </div>
            <div
                *ngIf="getPermissions('CREATE_PASSWORD')"
                class="mobile-action-btn qt-df qt-ai-c qt-jc-c"
                (click)="addRecord()"
            >
                <div class="qt-icon icon__add qt-icon__white qt-sz-16"></div>
            </div>
        </div>
        <!-- Start Filter Aside -->
        <div
            class="aside-filters"
            [hidden]="!toggleFilter"
        >
            <div class="aside-filters-header qt-df qt-ai-c qt-jc-sb">
                <div class="aside-filters-header__title">Filters</div>
                <div
                    class="qt-button --square-md --gray pointer"
                    (click)="onToggleFilter(false)"
                >
                    <div class="qt-icon icon__close qt-sz-16 pointer"></div>
                </div>
            </div>
            <div class="aside-filters-content">
                <!-- Add Filter -->
                <app-passwoord-manager-filters
                    #filters
                    (onClose)="onToggleFilter(false)"
                ></app-passwoord-manager-filters>
            </div>
        </div>
        <!-- End Filter Aside -->
    </div>
</div>
<app-password-manager-edit-aside></app-password-manager-edit-aside>
<app-password-manager-add-aside></app-password-manager-add-aside>
