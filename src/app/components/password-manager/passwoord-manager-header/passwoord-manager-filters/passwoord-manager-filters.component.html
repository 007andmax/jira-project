<div class="aside-filters-content__main">
    <app-drop-down
        #categoriesSelect
        class="filter-category qt-mr-8 dropdown"
        [placeholder]="'Select by Category'"
        [list]="categories"
        [field]="'title'"
        [search]="true"
        [change]="true"
        (onSelectedItem)="onSelectCategory($event)"
    ></app-drop-down>


    <company-drop-down
        #companiesSelect
        class="filter-company qt-w100 qt-mr-8 dropdown"
        [placeholder]="'Select Company'"
        [isDisabled]="disabledCompany"
        [editItem]="selectedCompany"
        [field]="'name'"
        [search]="true"
        [change]="true"
        (onSelectedItem)="selectCompany($event)"
    ></company-drop-down>
    <app-passwoord-manager-devices-users
        #deviceUserSelect
        class="filter-device qt-mr-8 dropdown dropdown-devices-users"
        [placeholder]="'Select Device or User'"
        [preloader]="filter.getPreloaderDevices()"
        [isDisabled]="disabledDevicesUsers || filter.getPreloaderDevices()"
        [list]="devicesUsers"
        [field]="'name'"
        [search]="true"
        [change]="true"
        [sort]="true"
        (onSelectedItem)="selectDeviceUser($event)"
    ></app-passwoord-manager-devices-users>
    <app-drop-down
        #dateSelect
        class="filter-data-picker dropdown"
        [placeholder]="'Search by Expire Date'"
        [list]="listDates"
        [sort]="false"
        [field]="'title'"
        (onSelectedItem)="selectDate($event)"
    ></app-drop-down>
</div>
<div class="aside-filters-content__footer">
    <div class="qt-df qt-w100">
        <button
            class="qt-button --gray qt-mr-12"
            (click)="onClearAll()"
        >
            Clear All
        </button>
        <button
            class="qt-button"
            (click)="applyFilters()"
        >
            Apply Filters
        </button>
    </div>
</div>
