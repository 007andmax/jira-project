<div class="aside-filters-content__main">
    <app-drop-down
        #categoriesSelect
        class="filter-category dropdown"
        [placeholder]="'Select by Category'"
        [list]="categories"
        [field]="'title'"
        [title]="'Category'"
        [search]="true"
        [change]="true"
        (onSelectedItem)="onSelectCategory($event)"
    ></app-drop-down>
    <company-drop-down
        #companiesSelect
        class="filter-company qt-w100 dropdown"
        [placeholder]="'Select Company'"
        [isDisabled]="disabledCompany"
        [editItem]="selectedCompany"
        [title]="'Company'"
        [field]="'name'"
        [search]="true"
        [change]="true"
        (onSelectedItem)="selectCompany($event)"
    ></company-drop-down>
    <app-passwoord-manager-devices-users
        #deviceUserSelect
        class="filter-device dropdown dropdown-devices-users"
        [placeholder]="'Select Device or User'"
        [preloader]="filter.getPreloaderDevices()"
        [isDisabled]="disabledDevicesUsers || filter.getPreloaderDevices()"
        [title]="'Device/User'"
        [list]="devicesUsers"
        [field]="'name'"
        [search]="true"
        [change]="true"
        [sort]="true"
        (onSelectedItem)="selectDeviceUser($event)"
    ></app-passwoord-manager-devices-users>
    <app-drop-down
        #dateSelect
        class="filter-data-picker dropdown"
        [placeholder]="'Search by Expire Date'"
        [title]="'Expire date'"
        [list]="listDates"
        [sort]="false"
        [field]="'title'"
        (onSelectedItem)="selectDate($event)"
    ></app-drop-down>
</div>
<div class="aside-filters-content__footer">
    <div class="qt-df qt-w100">
        <button
            class="qt-button --gray qt-w100 qt-jc-c qt-mr-12"
            (click)="onClearAll()"
        >
            Clear All
        </button>
        <button
            class="qt-button qt-w100 qt-jc-c"
            (click)="applyFilters()"
        >
            Apply
        </button>
    </div>
</div>
