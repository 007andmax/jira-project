<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line">
        <div class="qt-page-list__header-title-line--left">
            <h6
                class="qt-page-list__header-title"
                [textContent]="'Password Manager'"
            ></h6>
        </div>
        <div class="qt-page-list__header-title-line--right">
            <div class="qt-df qt-ai-c">
                <div class="password-add-category qt-pos-rel">
                    <button
                        class="plus-btn qt-mr-8"
                        (click)="showAddCategory = true"
                    >
                        +
                    </button>
                    <app-password-manager-add-category
                        *ngIf="showAddCategory"
                        (onClose)="showAddCategory = false"
                    ></app-password-manager-add-category>
                </div>
                <div
                    class="qt-icon icon__close qt-icon__white qt-sz-20 qt-bg-contain closed-search"
                    *ngIf="toggleSearch"
                    (click)="toggleSearch = false"
                ></div>
                <div
                    class="qt-input-search qt-ml-8"
                    [ngClass]="{'--open':toggleSearch}"
                >
                    <!-- *ngIf="getSelectedCount() === 0" -->
                    <input
                        type="text"
                        placeholder="Search Password"
                        [(ngModel)]="searchText"
                        (keyup)="onKeyUp($event)"
                    >
                    <span
                        class="search-clear qt-icon icon__close-round qt-icon__gray-400"
                        *ngIf="searchText.length > 0"
                        (click)="clearSearch()"
                    ></span>
                </div>
                <button
                    class="qt-button qt-button-filter --gray --md qt-ml-8 qt-df"
                    [ngClass]="{'active':toggleFilter,
                 'is-exist-filters':isExistFilters()}"
                    (click)="onToggleFilter(!toggleFilter)"
                >
                    <span class="qt-icon icon__filter qt-sz-16 qt-bg-contain qt-dib qt-mr-8"></span>
                    <span [textContent]="getTextCountFilters()"></span>
                </button>
                <button
                    class="qt-button --gray --md qt-ml-8"
                    *ngIf="getPermissions('CREATE_PASSWORD')"
                    (click)="addRecord()"
                >
                    Create Password
                </button>
            </div>
        </div>
    </div>
</div>
