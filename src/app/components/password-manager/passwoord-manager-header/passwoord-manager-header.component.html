<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line qt-mb-16">
        <div
            class="icon__menu-white qt-sz-24 qt-bg-contain qt-ml-6 pointer"
            (click)="toggleMobileLeftPanel()"
        ></div>
        <div class="qt-page-list__header-title-line--left">
            <h6
                class="qt-page-list__header-title"
                [textContent]="'Password Manager'"
            ></h6>
        </div>
        <div class="qt-page-list__header-title-line--rigth">
            <div class="qt-df qt-ai-c">
                <div
                    class="icon__close-white qt-sz-20 qt-bg-contain closed-search"
                    *ngIf="toggleSearch"
                    (click)="toggleSearch = false"
                ></div>
                <div
                    class="qt-page-list__search qt-ml-8 search-container"
                    [ngClass]="{'--open':toggleSearch}"
                >
                    <!-- *ngIf="getSelectedCount() === 0" -->
                    <input
                        type="text"
                        placeholder="Search password"
                        (input)="search($event)"
                        [(ngModel)]="searchText"
                    >
                    <span
                        class="search-clear icon__close-round"
                        *ngIf="searchText.length > 0"
                        (click)="clearSearch()"
                    ></span>
                </div>
                <button
                    class="qt-btn btn-filter qt-ml-8 d-f"
                    [ngClass]="{'active':toggleFilter,
                 'is-exist-filters':isExistFilters()}"
                    (click)="onToggleFilter(true)"
                >
                    <span
                        class="filter-counter qt-circle qt-sz-18 qt-fw-600 qt-fs-10 qt-color-white qt-bg-info qt-mr-8 qt-df qt-ai-c qt-jc-c"
                        *ngIf="countFilter > 0"
                        [textContent]="countFilter"
                    ></span>
                    <span class="qt-d-md-none">Filters</span>
                </button>
                <button
                    class="qt-btn --outline-blue qt-ml-8 qt-d-md-none"
                    *ngIf="getPermissions('CREATE_PASSWORD')"
                    (click)="addRecord()"
                >
                    Create Password
                </button>
                <div
                    class="icon__search-white qt-sz-24 qt-bg-contain qt-ml-16 pointer qt-d-none qt-d-md-block"
                    (click)="toggleSearch  = true"
                ></div>
            </div>
        </div>
    </div>
    <app-passwoord-manager-filters
        #filters
        [hidden]="!toggleFilter"
        [disabledCompany]="disabledCompany"
        (onChangeCountFilter)="onChangeCountFilter($event)"
        (onClose)="onToggleFilter(false)"
    ></app-passwoord-manager-filters>
    <div class="qt-page-list__header-thead-container">
        <div class="qt-table-modern qt-page-list__header-thead">
            <div class="qt-page-list__header-thead__row">
                <div class="password-table__check">
                    <div class="d-f">
                        <label class="qt-checkbox">
                            <input
                                type="checkbox"
                                [(ngModel)]="selectAll"
                                (change)="toggleAll($event)"
                            >
                            <span></span>
                        </label>
                    </div>
                </div>
                <div
                    class="password-table__account pointer"
                    (click)="onFilter('account_type')"
                >
                    Account Type
                    <span class="qt-table-modern__sorting"></span>
                </div>
                <div
                    class="password-table__company-name pointer"
                    (click)="onFilter('company')"
                >
                    Company name
                    <span class="qt-table-modern__sorting"></span>
                </div>
                <div
                    class="password-table__description pointer"
                    (click)="onFilter('description')"
                >
                    Description
                    <span class="qt-table-modern__sorting"></span>
                </div>
                <div
                    class="password-table__user-password pointer"
                    (click)="onFilter('user_password')"
                >
                    User & Password
                    <span class="qt-table-modern__sorting"></span>
                </div>
                <div class="password-table__status">Status</div>
                <div class="password-table__otp">OTP</div>
                <div class="password-table__menu"></div>
            </div>
        </div>
    </div>
</div>
<div
    class="list-filters"
    *ngIf="filter.selectedCompany ||
    filter.selectedDate ||
    filter.selectedUserOrDevice ||
    filter.selectedCategory"
>
    <mat-form-field>
        <mat-chip-list aria-label="Fruit selection">
            <mat-chip
                *ngIf="filter.selectedCompany"
                (removed)="filters.companiesSelect.clearClient();refreshFilters()"
            >
                {{filter.selectedCompany.name}}
                <mat-icon matChipRemove>cancel</mat-icon>
            </mat-chip>
            <mat-chip
                *ngIf="filter.selectedDate"
                (removed)="filters.dateSelect.clearClient();refreshFilters()"
            >
                {{filter.selectedDate.title}}
                <mat-icon matChipRemove>cancel</mat-icon>
            </mat-chip>
            <mat-chip
                *ngIf="filter.selectedUserOrDevice"
                (removed)="filters.deviceUserSelect.clearClient();refreshFilters()"
            >
                {{filter.selectedUserOrDevice.name}}
                <mat-icon matChipRemove>cancel</mat-icon>
            </mat-chip>
            <mat-chip
                *ngIf="filter.selectedCategory"
                (removed)="filters.categoriesSelect.clearClient();refreshFilters()"
                class="status"
            >
                {{filter.selectedCategory.title}}
                <mat-icon matChipRemove>cancel</mat-icon>
            </mat-chip>
        </mat-chip-list>
    </mat-form-field>
</div>
