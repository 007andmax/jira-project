<div class="add-tax-dropdown">
    <div class="d-inline-block">
        <div class="qt-df qt-ai-c qt-jc-sb  qt-mb-16">
            <div class="tax-title">Add Category</div>
            <div
                class="icon__close qt-sz-20 qt-bg-contain pointer qt-d-none qt-d-md-block"
                (click)="close()"
            ></div>
        </div>
        <div
            class="qt-input-block qt-mb-24"
            [ngClass]="{'--input-error' : disableCreateCategory}"
        >
            <div class="qt-input-block__label">Category Name</div>
            <input
                placeholder="Category Name"
                type="text"
                class="qt-input-block__input"
                [(ngModel)]="name"
                (input)="checkDublicateCategory()"
                required
            >
            <mat-error
              class="invalid-feedback"
              *ngIf="disableCreateCategory"
            >
              This category name is already ocсupied.
            </mat-error>
        </div>
        <div class="qt-df">
            <button
                class="qt-button qt-mr-12"
                type="submit"
                [disabled]="disableCreateCategory"
                (click)="save()"
            >
                Save
            </button>
            <button
                class="qt-button --gray"
                (click)="close()"
            >
                Cancel
            </button>
        </div>
    </div>
</div>
