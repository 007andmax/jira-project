<div
    class="col-md-12 --required"
    (clickOutside)="hideSelectWrapper()"
    *ngIf="(passwordRecordAdd.template.name !== 'HOSTING' && passwordRecordAdd.template.name !== 'AGENT')"
>
    <p class="title-link-to">Link To</p>
    <div
        class="device-user pointer"
        [ngClass]="{'--input-error': !validate.getLinkTo(),
              'avoid-clicks': !passwordRecordAdd.client,
                'has-placeholder': !selectedUserAndDevices.length}"
        (click)="showSelectWrapper($event)"
    >
        <ng-template
            ngFor
            let-item
            let-i="index"
            [ngForOf]="selectedUserAndDevices"
            [ngForTrackBy]="trackByIndex"
        >
            <div class="selected-user">
                <i
                    class="icon__user-grey qt-sz-16 qt-bg-contain"
                    *ngIf="item.type === 'USER'"
                ></i>
                <i
                    class="icon__devices-grey qt-sz-16 qt-bg-contain"
                    *ngIf="item.type === 'DEVICE'"
                ></i>
                {{item.name}}
                <i
                    class="icn-sm icn-remove-old"
                    (click)="removeItem(i)"
                ></i>
            </div>
        </ng-template>
    </div>
    <mat-error
        class="qt-tooltip-error"
        *ngIf="!validate.getLinkTo()"
    >
        Field is required
    </mat-error>
    <div
        class="select-wrapper"
        *ngIf="showSelect"
    >
        <div class="tab-wrapper">
            <div
                class="tab"
                (click)="setCurrentTab($event, item)"
                *ngFor="let item of tabs"
                [ngClass]="{'active' : (currentTab === item)}"
            >
                {{item}}
            </div>
        </div>
        <div
            class="content"
            (click)="$event.preventDefault()"
        >
            <div *ngIf="currentTab === 'Device'">
                <div
                    *ngFor="let item of devicesList; let i = index"
                    (click)="toggleItem(item)"
                >
                    <label class="qt-checkbox pointer">
                        <input
                            type="checkbox"
                            [checked]="isSeleted(item)"
                            readonly
                        >
                        <span></span>
                        {{item.name}}
                    </label>
                </div>
            </div>
            <div *ngIf="currentTab === 'User'">
                <div
                    *ngFor="let item of usersList; let i = index"
                    (click)="toggleItem(item)"
                >
                    <label class="qt-checkbox pointer">
                        <input
                            type="checkbox"
                            [checked]="isSeleted(item)"
                            readonly
                        >
                        <span></span>
                        {{item.name}}
                    </label>
                </div>
            </div>
            <div *ngIf="currentTab === 'Not monitored'">
                <div
                    class="content-btn"
                    style="width: 50px"
                    *ngIf="!showGadgetsForm"
                    (click)="showGadgetsAddForm($event);$event.stopPropagation()"
                >
                    Add
                </div>
                <div
                    class="content-header"
                    *ngIf="showGadgetsForm"
                >
                    <input
                        [ngModelOptions]="{standalone: true}"
                        type="text"
                        [(ngModel)]="newGadgets"
                    >
                    <div
                        class="new-link"
                        (click)="addGadgetsform()"
                    >
                        Add
                    </div>
                </div>
                <div
                    class="gadget-wrap"
                    *ngFor="let item of gadgets;  let i = index"
                    (click)="toggleItem(item)"
                >
                    <label class="qt-checkbox pointer">
                        <input
                            type="checkbox"
                            [checked]="isSeleted(item)"
                            readonly
                        >
                        <span></span>
                    </label>
                    {{item.name}}
                    <i
                        class="icn-sm icn-remove-old"
                        (click)="deleteGadget($event, item.id)"
                    ></i>
                </div>
            </div>
        </div>
    </div>
</div>
