<div
    class="qt-input-block --required password-manager-linked-container"
    appClickOtside
    [init]="true"
    [classParent]="'.password-manager-linked-container'"
    (onOutSide)="hideSelectWrapper()"
    *ngIf="(passwordRecordAdd.template.name !== 'HOSTING' && passwordRecordAdd.template.name !== 'AGENT')"
>
    <div class="qt-input-block__label">Link To</div>
    <div
        class="device-user pointer"
        [ngClass]="{'--input-error': !validate.getLinkTo(),
              'avoid-clicks': !passwordRecordAdd.client || preloader,
                'has-placeholder': !selectedUserAndDevices.length}"
        (click)="showSelectWrapper($event)"
    >
        <ng-template
            ngFor
            let-item
            let-i="index"
            [ngForOf]="selectedUserAndDevices"
            [ngForTrackBy]="trackByIndex"
        >
            <div class="selected-user">
                <i
                    class="qt-icon icon__user qt-sz-16"
                    *ngIf="item.type === 'USER'"
                ></i>
                <i
                    class="qt-icon icon__devices qt-sz-16"
                    *ngIf="item.type === 'DEVICE'"
                ></i>
                {{item.name}}
                <i
                    class="icn-sm qt-icon icon__close qt-icon__gray-400"
                    (click)="removeItem(i)"
                ></i>
            </div>
        </ng-template>
        <i
            class="loading xs"
            *ngIf="preloader"
        ></i>
    </div>
    <app-mat-error
        class="invalid-feedback"
        *ngIf="!validate.getLinkTo()"
    >
        You must select at least one link
    </app-mat-error>
    <div
        class="select-wrapper"
        *ngIf="showSelect"
    >
        <div class="tab-wrapper">
            <div
                class="tab"
                (click)="setCurrentTab($event, item)"
                *ngFor="let item of tabs"
                [ngClass]="{'active' : (currentTab === item)}"
            >
                {{item}}
            </div>
        </div>
        <div
            class="content"
            (click)="$event.preventDefault()"
        >
            <div *ngIf="currentTab === 'Device'">
                <div
                    class="dropdown-item"
                    *ngFor="let item of devicesList; let i = index"
                    (click)="toggleItem(item)"
                >
                    <label class="qt-checkbox pointer">
                        <input
                            type="checkbox"
                            [checked]="isSeleted(item)"
                            readonly
                        >
                        <span></span>
                        <div class="name">{{item.name}}</div>
                    </label>
                </div>
            </div>
            <div *ngIf="currentTab === 'User'">
                <div
                    class="dropdown-item"
                    *ngFor="let item of usersList; let i = index"
                    (click)="toggleItem(item)"
                >
                    <label class="qt-checkbox pointer">
                        <input
                            type="checkbox"
                            [checked]="isSeleted(item)"
                            readonly
                        >
                        <span></span>
                        <div class="name">{{item.name}}</div>
                    </label>
                </div>
            </div>
            <div *ngIf="currentTab === 'Not monitored'">
                <div
                    class="content-btn"
                    style="width: 50px"
                    *ngIf="!showGadgetsForm"
                    (click)="showGadgetsAddForm($event);$event.stopPropagation()"
                >
                    Add
                </div>
                <div
                    class="content-header"
                    *ngIf="showGadgetsForm"
                >
                    <input
                        [ngModelOptions]="{standalone: true}"
                        type="text"
                        [(ngModel)]="newGadgets"
                    >
                    <div
                        class="new-link"
                        (click)="addGadgetsform()"
                    >
                        Add
                    </div>
                </div>
                <div
                    class="gadget-wrap dropdown-item"
                    *ngFor="let item of gadgets;  let i = index"
                    (click)="toggleItem(item)"
                >
                    <label class="qt-checkbox pointer">
                        <input
                            type="checkbox"
                            [checked]="isSeleted(item)"
                            readonly
                        >
                        <span></span>
                        <div class="name">{{item.name}}</div>
                        <i
                            class="icn-remove-old qt-icon icon__close qt-icon__gray-400 qt-sz-20"
                            (click)="deleteGadget($event, item.id)"
                        ></i>
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>
