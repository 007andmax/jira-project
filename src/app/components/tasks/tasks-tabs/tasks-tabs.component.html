<div class="qt-page-list__header-tabs-line">
    <ul
        ngbNav
        #nav="ngbNav"
        [(activeId)]="activeTab"
        class="qt-page-list__header-tabs"
        (navChange)="setTab($event)"
    >
        <!-- Profile -->
        <li
            class="qt-page-list__header-tabs-item"
            [ngbNavItem]="'list'"
        >
            <a
                class="qt-page-list__header-tabs-item-link"
                ngbNavLink
            >
                <i class="icn-16 qt-icon qt-dib icon__list-view qt-page-list__header-tabs-item-icon"></i>
                <span class="qt-page-list__header-tabs-item-text">List</span>
            </a>
            <ng-template ngbNavContent>
                <app-tasks-list #profile></app-tasks-list>
            </ng-template>
        </li>
        <li
            class="qt-page-list__header-tabs-item"
            [ngbNavItem]="'calendar'"
        >
            <a
                class="qt-page-list__header-tabs-item-link"
                ngbNavLink
            >
                <i class="icn-16 qt-icon qt-dib icon__calendar qt-page-list__header-tabs-item-icon"></i>
                <span class="qt-page-list__header-tabs-item-text">Calendar</span>
            </a>
            <ng-template ngbNavContent>
                <app-tasks-calendar></app-tasks-calendar>
            </ng-template>
        </li>




        <!-- <li class="qt-page-list__header-tabs-item"  [ngbNavItem]="'calendar'">
          <a
            class="qt-page-list__header-tabs-item-link"
            ngbNavLink
          >
            <i class="icn-16 qt-icon qt-dib icon__calendar qt-page-list__header-tabs-item-icon"></i>
            <span class="qt-page-list__header-tabs-item-text">Calendar</span>
          </a>
          <ng-template ngbNavContent></ng-template>
      </li> -->
    </ul>
</div>
<div
    [ngbNavOutlet]="nav"
    class="mt-2"
></div>
