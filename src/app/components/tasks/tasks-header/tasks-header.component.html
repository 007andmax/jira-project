<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line qt-mb-6">
        <div class="qt-page-list__header-title-line--left">
            <h6 class="qt-page-list__header-title">My Tasks</h6>
        </div>
        <div class="qt-page-list__header-title-line--right">
            <div class="new-companies-content__header--search">
                <button
                    class="qt-button --gray --md qt-button-filter qt-ml-8 qt-df"
                    [ngClass]="{'active':toggleFilter,
                  'is-exist-filters':isExistFilters()}"
                    (click)="onToggleFilter(!toggleFilter)"
                >
                    <span class="qt-icon icon__filter qt-sz-16 qt-bg-contain qt-dib qt-mr-8"></span>
                    <span>Filters</span>
                </button>
                <button
                    class="qt-button --md qt-fs-0 qt-ml-8"
                    (click)="showAsideForAdd()"
                >
                    <span class="qt-icon icon__add qt-sz-16 qt-icon__white qt-dib qt-mr-8"></span>
                    Add Task
                </button>
            </div>
        </div>
    </div>
</div>
