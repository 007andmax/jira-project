<div
    class="input-group pointer"
    ngbDropdown
    container="body"
>
    <span
        *ngIf="selectedType"
        [textContent]="selectedType.title"
        ngbDropdownToggle
        id="dropdownAddType"
        placement="top"
        ngbTooltip="Set Type"
    ></span>
    <div
        *ngIf="!selectedType"
        class="tab-pane__user-circle qt-button --gray --circle"
        ngbDropdownToggle
        id="dropdownAddType"
        placement="top"
        ngbTooltip="Set Type"
    >
        <div class="qt-icon icon__task-type qt-sz-16"></div>
    </div>
    <div
        ngbDropdownMenu
        aria-labelledby="dropdownAddType"
        class="app-drop-down__dropdown"
    >
        <ng-template
            ngFor
            let-item
            [ngForOf]="listTypes"
            let-i="index"
        >
            <button
                ngbDropdownItem
                (click)="onSelect(item)"
                [ngClass]="{'--selected':isSelected(item)}"
            >
                <span
                    class="tag__modern"
                    [textContent]="item.title"
                ></span>
            </button>
        </ng-template>
    </div>
</div>
