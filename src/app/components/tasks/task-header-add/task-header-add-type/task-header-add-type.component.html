<div
    class="input-group pointer"
    ngbDropdown
    [container]="container"
>
    <span
        *ngIf="selectedType"
        [textContent]="selectedType.title"
        ngbDropdownToggle
        id="dropdownAddType"
        placement="top"
        ngbTooltip="Set Type"
        class="tag__modern --meeting --phone-call --to-do"
    ></span>
    <div
        *ngIf="!selectedType"
        class="tab-pane__user-circle qt-button --gray --circle"
        ngbDropdownToggle
        id="dropdownAddType"
        placement="top"
        ngbTooltip="Set Type"
    >
        <div class="qt-icon icon__task-type qt-sz-16"></div>
    </div>
    <div
        ngbDropdownMenu
        aria-labelledby="dropdownAddType"
        class="app-drop-down__dropdown"
    >
        <ng-template
            ngFor
            let-item
            [ngForOf]="listTypes"
            let-i="index"
        >
            <button
                ngbDropdownItem
                (click)="onSelect(item)"
                [ngClass]="{'--selected':isSelected(item)}"
            >
                <span
                    [ngClass]="{'--meeting':item.value == 'Meeting',
                        '--phone-call':item.value == 'Phone call',
                        '--to-do':item.value == 'To do'
                    }"
                    class="tag__modern"
                    [textContent]="item.title"
                ></span>
                <span class="qt-icon icon__done qt-za-20 qt-sz-20 qt-bg-contain qt-ml-auto"></span>
            </button>
        </ng-template>
    </div>
</div>
