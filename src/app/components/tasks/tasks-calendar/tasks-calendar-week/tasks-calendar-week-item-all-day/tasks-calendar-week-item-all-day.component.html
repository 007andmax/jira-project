<ng-template
    ngFor
    let-p
    let-index="index"
    [ngForOf]="list"
    [ngForTrackBy]="trackById"
>
    <div
        *ngIf="index < 3 || showMore"
        [ngStyle]="{
            top: (32 * index) + 'px',
          left: p.left + '%',
        width: p.width + '%',
     }"
        class="task"
        [ngClass]="{'--meeting':p.task.type == 'Meeting',
                                            '--phone-call':p.task.type == 'Phone call',
                                            '--to-do':p.task.type == 'To do'
                                        }"
        [textContent]="p.task.title"
        (click)="editTask(p.task)"
    >
    </div>
</ng-template>
<div
    *ngIf="list.length > 4 && showMore == false"
    class="more-tasks qt-mt-2 qt-dif qt-ai-c"
    (click)="setShowMore(true)"
>
    <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-4"></span>
    <span [textContent]="(list.length - 4) + ' more'"></span>
</div>
<div
    *ngIf="showMore"
    class="more-tasks qt-mt-2 qt-dif qt-ai-c"
    (click)="setShowMore(false)"
>
    <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-4"></span>
    <span>Show less</span>
</div>
