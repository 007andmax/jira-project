<div class="calendar-header">
    <div class="calendar-header__item"></div>
    <ng-template
        ngFor
        let-day
        [ngForOf]="days"
    >
        <div class="calendar-header__item">
            <div>{{ day | date: 'EEE' }}</div>
            <div>{{ day | date: 'd' }}</div>
        </div>
    </ng-template>
</div>
<div class="qt-df">
    <div class="time-column">
        <div *ngFor="let h of hours">
            {{ h === 0 ? '12am' : (h < 12 ? h + 'am' : (h === 12 ? '12pm' : (h - 12) + 'pm')) }}
        </div>
    </div>
    <div class="days-grid">
        <div
            class="day-column"
            *ngFor="let day of days"
        >
            <div
                class="hour-cell"
                *ngFor="let h of hours"
            >
                <ng-template
                    ngFor
                    let-task
                    [ngForOf]="day.tasks"
                >
                    <div
                        class="task"
                        [ngClass]="{'--meeting':task.type == 'Meeting',
                                            '--phone-call':task.type == 'Phone call',
                                            '--to-do':task.type == 'To do'
                                        }"
                        [textContent]="task.title"
                    >
                    </div>
                </ng-template>
            </div>

        </div>
    </div>
</div>
