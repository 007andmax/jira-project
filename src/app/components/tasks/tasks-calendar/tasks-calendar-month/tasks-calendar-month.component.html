<div class="calendar-header">
    <ng-template
        ngFor
        let-item
        [ngForOf]="daysInWeek"
    >
        <div
            class="calendar-header__item"
            [textContent]="item"
        ></div>
    </ng-template>
</div>
<div class="weeks">
    <div
        *ngFor="let week of weeks"
        class="week"
    >
        <div
            *ngFor="let day of week"
            class="day"
            [class.empty]="!day.date"
        >
            <app-tasks-calendar-month-item-week [day]="day"></app-tasks-calendar-month-item-week>
        </div>
    </div>
</div>
