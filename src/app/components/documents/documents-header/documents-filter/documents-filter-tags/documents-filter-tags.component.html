<div
    class="col-md-12 --required documents-filter-tags-body"
    (clickOutside)="hideSelectWrapper()"
>
    <div
        class="device-user pointer"
        [ngClass]="{
                'has-placeholder': !selected.length}"
        (click)="showSelectWrapper($event)"
    >
        <ng-template
            ngFor
            let-item
            let-i="index"
            [ngForOf]="selected"
            [ngForTrackBy]="trackByIndex"
        >
            <div class="selected-user">
                {{item.name}}
                <i
                    class="icn-sm icn-remove-old"
                    (click)="removeItem(i)"
                ></i>
            </div>
        </ng-template>
    </div>

    <div
        class="select-wrapper"
        *ngIf="showSelect"
    >
        <div
            class="content"
            (click)="$event.preventDefault()"
        >
            <div>
                <div
                    *ngFor="let item of usersList; let i = index"
                    (click)="toggleItem(item)"
                >
                    <label class="qt-checkbox pointer">
                        <input
                            type="checkbox"
                            [checked]="isSeleted(item)"
                            readonly
                        >
                        <span></span>
                        {{item.name}}
                    </label>
                </div>
            </div>

        </div>
    </div>
</div>
