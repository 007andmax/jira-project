<div class="qt-df qt-ai-fs">
    <app-select-search
        class="search-company documents-company-filter qt-mr-8"
        #companyDp
        [placeholder]="'Select Company'"
        [change]="false"
        [class]="['qt-dropdown']"
        [field]="'name'"
        [list]="companies"
        (onSelectedItem)="onSelectCompany($event)"
    ></app-select-search>
    <documents-filter-tags
        class="documents-filter-tags qt-mr-8"
        (onSelectedItems)="onSelectTags($event)"
    ></documents-filter-tags>
    <div class="grey-dropdown form-group content qt-mr-8">
        <app-tech-users-list-report
            #usersDp
            [class]="['filter-users-documents']"
            [sort]="true"
            [search]="true"
            [change]="true"
            [errorMessage]="'Select any user'"
            (onSelectedItem)="onSelectTechUser($event)"
        ></app-tech-users-list-report>
    </div>
    <app-multi-datepicker
        class="qt-input-block qt-header-date-filter filter-documents-date"
        #datesDp
        (selectedDate)="filterByDate($event)"
    ></app-multi-datepicker>
</div>
