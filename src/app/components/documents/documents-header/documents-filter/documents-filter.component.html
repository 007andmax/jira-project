<div class="left-panel-ng2__content--filters">
    <app-tickets-filter-tags (tagsChange)="onChangeTags($event)"></app-tickets-filter-tags>
    <app-tech-users-list-report
        [sort]="true"
        [search]="true"
        [change]="true"
        [errorMessage]="'Select any user'"
        (onSelectedItem)="onSelectTechUser($event)"
    ></app-tech-users-list-report>
    <app-date-picker
        [formatDate]="formatDate"
        [useMinDate]="false"
        [editMode]="true"
        [editDate]="defaultDate"
        (onChange)="onChangeDate($event)"
    ></app-date-picker>
    <app-date-picker
        [formatDate]="formatDate"
        [useMinDate]="false"
        [editMode]="true"
        [editDate]="defaultDate"
        (onChange)="onChangeDate($event)"
    ></app-date-picker>
</div>
