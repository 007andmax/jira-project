<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line">
        <div class="qt-page-list__header-title-line--left">
            <div
                class="qt-page-list__back-button qt-df qt-ai-c qt-jc-c pointer"
                *ngIf="activePage === 'new-category-documents'"
                (click)="back()"
            >
                <div class="qt-icon icon__arrow-left button-icon qt-sz-16"></div>
            </div>
            <h3
                class="qt-page-list__header-title"
                [textContent]="'Documents'"
            ></h3>
        </div>
        <div class="qt-page-list__header-title-line--right">
            <div class="qt-df qt-ai-c">
                <!-- <div class="qt-page-list__search qt-ml-8 search-container">
                    <input
                        type="text"
                        placeholder="Search document"
                        (input)="search($event)"
                        [(ngModel)]="searchText"
                    >
                    <span
                        class="search-clear qt-icon icon__close-round qt-icon__gray-400"
                        *ngIf="searchText.length > 0"
                        (click)="clearSearch()"
                    ></span>
                </div> -->
                <button
                    class="qt-button --gray --md qt-ml-8"
                    (click)="clearAll()"
                    *ngIf="countFilter > 0"
                >
                    Clear All
                </button>
                <button
                    class="qt-button qt-button-filter --gray --md qt-ml-8"
                     [ngClass]="{'active':!toggleFilter}"
                    (click)="onToggleFilters(!toggleFilter)"
                >
                    <span class="qt-icon icon__filter qt-sz-16 qt-bg-contain qt-dib qt-mr-8"></span>
                    <span [textContent]="getTextCountFilters()"></span>
                </button>
                <div class="qt-df">
                    <div
                        class="qt-pos-rel"
                        ngbDropdown
                        [placement]="'bottom-right'"
                        [container]="'body'"
                    >
                        <button
                            class=" qt-button --with-menu qt-ml-8"
                            [ngClass]="{'disabled':!getPermissions('CREATE_DOCUMENT')}"
                        >
                            <span
                                class="save-billable-aside-btn left-side"
                                (click)="goToAddDocument()"
                            >
                                <span>Create Document</span>
                            </span>
                            <div
                                class="button-menu"
                                id="dropdownSave"
                                ngbDropdownToggle
                            >
                                <div class="qt-sz-16 qt-ic-c qt-icon icon__arrow-up qt-icon__white"></div>
                            </div>
                        </button>
                        <ul
                            class="qt-dropdown-menu"
                            ngbDropdownMenu
                            aria-labelledby="dropdownSave"
                        >
                            <li
                                ngbDropdownItem
                                (click)="goToTemplates()"
                            >
                                <div class="qt-icon icon__add-document qt-sz-20 qt-mr-12"></div>
                                Create from Template
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>  
</div>
