<tr
    [ngClass]="{'pointer':!item.isCategory && getPermissions('VIEW_DOCUMENT'),
    'documents-no-valid' : showNotificationReview}"
    (click)="showTemplate()"
>
    <td
        class="documents-table__title"
        (click)="navigateToCategory()"
        [ngClass]="{'pointer':item.isCategory}"
    >
        <div class="documents-table__title-menu">
            <div
                class="qt-sz-16 qt-bg-contain qt-mr-8 qt-fs-0"
                [ngClass]="{'icon__folder':item.isCategory,
            'icon__templete-thumb':!item.isCategory}"
            ></div>
            <div
                class="title ellipsis"
                [textContent]="item.isCategory ? item.categoryName : item.title"
            ></div>
        </div>
    </td>
    <td
        class="documents-table__create-by ellipsis"
        [textContent]="item.isCategory ? '' : getCreateBy()"
        (click)="navigateToCategory()"
        [ngClass]="{'pointer':item.isCategory}"
    ></td>
    <td
        class="documents-table__created-date ellipsis"
        [textContent]="item.isCategory ? '' : parseCreateAt()"
        (click)="navigateToCategory()"
        [ngClass]="{'pointer':item.isCategory}"
    ></td>
    <td
        class="documents-table__review-date ellipsis"
        [textContent]="item.isCategory ? '' : parseReviewAt()"
        (click)="navigateToCategory()"
        [ngClass]="{'pointer':item.isCategory}"
    ></td>
    <td
        class="documents-table__company ellipsis"
        [textContent]="item.isCategory ? '' : getCompanies()"
        (click)="navigateToCategory()"
        [ngClass]="{'pointer':item.isCategory}"
    ></td>
    <td
        class="documents-table__assigned-companies ellipsis"
        (click)="navigateToCategory()"
        [ngClass]="{'pointer':item.isCategory}"
        *ngIf="showAssignedCompanies"
    >
        <div class="qt-df qt-ai-c qt-lh-1">
            <i
                class="icon__subscribe-user qt-sz-16 qt-bg-contain qt-dib qt-mr-4"
                *ngIf="item.assignedToCompany"
            ></i>
            <span *ngIf="item.assignedToCompany">Yes</span>
        </div>
    </td>
    <td
        class="documents-table__menu"
        (click)="$event.stopPropagation();"
    >
        <div
            ngbDropdown
            [container]="'body'"
            [placement]="'bottom-right'"
        >
            <div
                class="qt-ic-c icon__more  qt-pointer qt-sz-16 qt-bg-contain"
                id="dropdownBasic1"
                ngbDropdownToggle
            ></div>
            <ul
                class="qt-dropdown-menu"
                ngbDropdownMenu
                *ngIf="item.isCategory"
                aria-labelledby="dropdownBasic1"
            >
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="goToAddDocument()"
                    *ngIf="getPermissions('CREATE_DOCUMENT')"
                >
                    <div class="icon__add-document qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Add New Document
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="assigToCompanies()"
                >
                    <div class="icon__mark-as-master qt-bg-contain  qt-sz-16 qt-mr-8"></div>
                    Assign to Companies
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                >
                    <div class="icon__rename qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Rename Folder
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="removeCategory()"
                >
                    <div class="icon__remove qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Delete
                </li>
            </ul>
            <ul
                class="qt-dropdown-menu"
                ngbDropdownMenu
                *ngIf="!item.isCategory"
                aria-labelledby="dropdownBasic1"
            >
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="goToEditDocument()"
                    *ngIf="getPermissions('EDIT_DOCUMENT')"
                >
                    <div class="icon__edit qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Edit
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="goToCloneDocument()"
                    *ngIf="getPermissions('CREATE_DOCUMENT')"
                >
                    <div class="icon__clone-document qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Clone Document
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="printPdf()"
                >
                    <div class="icon__print qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Print
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="exportPdf()"
                >
                    <div class="icon__download-pdf qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Export PDF
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="previewDocument()"
                >
                    <div class="icon__go-to qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Open in new tab
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    class="remove-item"
                    (click)="removeDocument()"
                    *ngIf="getPermissions('DELETE_DOCUMENT')"
                >
                    <div class="icon__remove qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Delete
                </li>
            </ul>
        </div>
    </td>
</tr>
