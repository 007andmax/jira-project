<tr>
    <td class="documents-table__title">
        <div class="documents-table__title-menu">
            <div
                class="qt-sz-16 qt-bg-contain qt-mr-8"
                [ngClass]="{'icon__folder':item.categoryId,
            'icon__documents':!item.categoryId}"
            ></div>
            <div
                class="title ellipsis"
                [textContent]="isCategory() ? item.categoryName : item.title"
            ></div>
        </div>
    </td>
    <td
        class="documents-table__create-by ellipsis"
        [textContent]="isCategory() ? '' : getCreateBy()"
    ></td>
    <td
        class="documents-table__created-date ellipsis"
        [textContent]="isCategory() ? '' : parseCreateAt()"
    ></td>
    <td
        class="documents-table__review-date ellipsis"
        [textContent]="isCategory() ? '' : parseReviewAt()"
    ></td>
    <td
        class="documents-table__company ellipsis"
        [textContent]="isCategory() ? '' : getCompanies()"
    ></td>
    <td class="documents-table__shared">
        <div></div>
    </td>
    <td class="documents-table__menu">
        <div
            ngbDropdown
            [container]="'body'"
            [placement]="'bottom-right'"
        >
            <div
                class="qt-ic-c icon__more  qt-pointer qt-sz-16 qt-bg-contain"
                id="dropdownBasic1"
                ngbDropdownToggle
            ></div>
            <ul
                class="qt-dropdown-menu"
                ngbDropdownMenu
                *ngIf="isCategory()"
                aria-labelledby="dropdownBasic1"
            >
                <li
                    class="pointer"
                    ngbDropdownItem
                >
                    <div class="icon__add-document qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Add New Document
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                >
                    <div class="icon__share-folder qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Share Folder
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                >
                    <div class="icon__rename qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Rename Folder
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                >
                    <div class="icon__remove qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Delete Folder
                </li>
            </ul>
            <ul
                class="qt-dropdown-menu"
                ngbDropdownMenu
                *ngIf="!isCategory()"
                aria-labelledby="dropdownBasic1"
            >
                <li
                    class="pointer"
                    ngbDropdownItem
                >
                    <div class="icon__share-folder qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Share...
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                >
                    <div class="icon__move qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Move...
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                >
                    <div class="icon__copy-gray qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Copy to…
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                >
                    <div class="icon__clone-document qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Clone Document
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                >
                    <div class="icon__search-gray qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Find within document
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                >
                    <div class="icon__link-gray qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Copy Internal Link
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                >
                    <div class="icon__print qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Print
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                >
                    <div class="icon__download-pdf qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Export PDF
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    class="remove-item"
                >
                    <div class="icon__remove qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Move to Trash
                </li>
            </ul>
        </div>
    </td>
</tr>
