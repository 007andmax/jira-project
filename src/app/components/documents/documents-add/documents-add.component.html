<div
    class="documents-details qt-page-list"
    [ngClass]="{'--large' : !openAside}"
>
    <app-documents-add-header></app-documents-add-header>
    <app-documents-add-body (onChangeContent)="onChangeContent($event)"></app-documents-add-body>
    <app-documents-add-footer
        [documentValidate]="documentValidate"
        [documentAdd]="documentAdd"
    ></app-documents-add-footer>
    <app-documents-add-info
        [documentValidate]="documentValidate"
        [documentAdd]="documentAdd"
        (onToggleAside)="openAside  =$event"
    ></app-documents-add-info>
</div>
