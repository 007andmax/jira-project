<div class="qt-temporary-col-fix --required qt-mb-24">
    <div class="qt-df qt-ai-c">
        <div class="qt-input-block__label">Link to company</div>
        <i
            class="icn-sm qt-icon icon__help"
            placement="right"
            ngbTooltip='The "Link to company" value can be used only for documents'
        ></i>
    </div>
    <div
        class="--required documents-linkeds-body"
        ngbDropdown
        #products="ngbDropdown"
        [ngClass]="{ 'disabled': isDisabled}"
    >
        <app-mat-form-field
            ngbDropdownAnchor
            #formField
            [placeholder]="'Select company to link'"
        >
            <app-mat-chip-list
                #chipListCompanies
                aria-label="Fruit selection"
                [items]="selectedUserAndCompanies"
                (onChangeItems)="formField.checkSelectedItems(selectedUserAndCompanies)"
            >
                <ng-template
                    ngFor
                    let-item
                    [ngForOf]="selectedUserAndCompanies"
                    let-i="index"
                    [ngForTrackBy]="trackByIndex"
                >
                    <app-mat-chip
                        *ngIf="item.type === 'COMPANY'"
                        [isRemove]="true"
                        (onClose)="removeItem(i)"
                    >
                        <i class="qt-icon icon__devices qt-sz-16"></i>
                        {{item.name}}
                    </app-mat-chip>
                </ng-template>
                <input
                    id="dropdownCompanies"
                    ngbDropdownToggle
                    class="pointer mat-chip-input mat-input-element"
                    [formControl]="linkedCtrl"
                    [disabled]="isDisabled"
                    (input)="onSearch($event)"
                >
            </app-mat-chip-list>
        </app-mat-form-field>
        <div
            class="select-wrapper"
            ngbDropdownMenu
            aria-labelledby="dropdownCompanies"
        >
            <div
                class="content"
                (click)="$event.preventDefault()"
            >
                <div>
                    <div
                        class="content-item"
                        *ngFor="let item of companiesList; let i = index"
                        (click)="toggleItem(item,'COMPANY')"
                    >
                        <label class="qt-checkbox pointer">
                            <input
                                type="checkbox"
                                [checked]="isSeleted(item)"
                                readonly
                            >
                            <span></span>
                            {{item.name}}
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="qt-temporary-col-fix --required">
    <div class="qt-df qt-ai-c">
        <div class="qt-input-block__label">Link to user</div>
        <i
            class="icn-sm qt-icon icon__help"
            placement="right"
            ngbTooltip='The "Link to user" value can be used only for documents'
        ></i>
    </div>
    <div
        class="--required documents-linkeds-body"
        ngbDropdown
        #products="ngbDropdown"
        [ngClass]="{ 'disabled': isDisabled}"
    >
        <app-mat-form-field
            ngbDropdownAnchor
            #formField1
            [placeholder]="'Select user to link'"
        >
            <app-mat-chip-list
                [items]="selectedUserAndCompanies"
                (onChangeItems)="formField1.checkSelectedItems(selectedUserAndCompanies)"
            >
                <ng-template
                    ngFor
                    let-item
                    [ngForOf]="selectedUserAndCompanies"
                    let-i="index"
                    [ngForTrackBy]="trackByIndex"
                >
                    <app-mat-chip
                        *ngIf="item.type === 'USER'"
                        [isRemove]="true"
                        (onClose)="removeItem(i)"
                    >
                        <i class="qt-icon icon__user qt-sz-16"></i>
                        {{item.name}}
                    </app-mat-chip>
                </ng-template>
                <input
                    id="dropdownUsers"
                    ngbDropdownToggle
                    class="pointer mat-chip-input mat-input-element"
                    [formControl]="linkedCtrl"
                    [disabled]="isDisabled"
                    (input)="onSearch($event)"
                >
            </app-mat-chip-list>
        </app-mat-form-field>
        <div
            class="select-wrapper"
            ngbDropdownMenu
            aria-labelledby="dropdownUsers"
        >
            <div
                class="content"
                (click)="$event.preventDefault()"
            >
                <div>
                    <div
                        class="content-item"
                        *ngFor="let item of usersList; let i = index"
                        (click)="toggleItem(item,'USER')"
                    >
                        <label class="qt-checkbox pointer">
                            <input
                                type="checkbox"
                                [checked]="isSeleted(item)"
                                readonly
                            >
                            <span></span>
                            <div class="name">{{item.firstName}} {{item.lastName}}</div>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
