<div class="document-header">
  <div class="qt-df qt-ai-c">
    <!--<p>documents-add-header works!</p>-->
    <button (click)="onToggleLeftPanel()"
        class="btn-expand qt-mr-16"
    >
      <div class="icon__expand-redactor qt-za-16 qt-sz-16 qt-bg-contain"></div>
    </button>
  <div class="qt-df qt-ai-c qt-jc-sb qt-ml-16">
    <div class="icon__documents qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"></div>
    <app-drop-down
      class="dropdown document-header__dropdown"
      [placeholder]="'How it Work'"
      [list]=""
      [search]="true"
      [change]="true"
      heightInput="24px"
      widthInput="120px"
    ></app-drop-down>
  </div>
  </div>
 <div class="qt-df qt-ai-c">
   <div class="document-header__info">Only you</div>
   <button class="qt-button qt-mr-16 qt-ml-16">
     <span>Invite</span>
   </button>
   <div
     class="invoce-table__menu"
     ngbDropdown
     [container]="'body'"
   >
     <div
       class="qt-ic-c icon__more  qt-pointer qt-sz-16 qt-bg-contain"
       id="dropdownBasic1"
       ngbDropdownToggle
     >
       <ul
         class="qt-dropdown-menu invoice-items-dropdown"
         ngbDropdownMenu
         aria-labelledby="dropdownBasic1"
       >
         <li
           class="pointer"
           ngbDropdownItem
         >
           Share...
         </li>
         <li
           class="pointer"
           ngbDropdownItem
         >
           Move...
         </li>
         <li
           class="pointer"
           ngbDropdownItem
         >
           Copy to...
         </li>
         <li
           class="pointer"
           ngbDropdownItem
         >
           Clone Document
         </li>
         <li
           class="pointer"
           ngbDropdownItem
         >
           Find within document
         </li>
         <li
           class="pointer"
           ngbDropdownItem
         >
           Copy Internal Link
         </li>
         <li
           class="pointer"
           ngbDropdownItem
         >
           Print
         </li>
         <li
           class="pointer"
           ngbDropdownItem
         >
           Export PDF
         </li>
         <hr>
         <li
           class="pointer"
           ngbDropdownItem
         >
           Move to Trash
         </li>
       </ul>
     </div>
   </div>
 </div>
</div>
