<div class="qt-aside-modern__footer">
    <div class="qt-df">
        <button
            class="qt-button qt-mr-12"
            appDisabledBtn
            #addBtn="disabled"
            (onClick)="documentAdd ? add('DOCUMENT') : edit()"
        >
            <span *ngIf="!addBtn.isBlock()">Save Document</span>
            <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
        </button>
        <button
            class="qt-button --gray"
            [disabled]="documentAdd && !documentAdd.isTemplate() || documentEdit && !documentEdit.isTemplate()"
            (click)="documentAdd ? add('TEMPLATE') : edit()"
        >
            Save as Template
        </button>
    </div>
</div>
