<div class="qt-aside-modern__footer">
    <div class="qt-df">
        <button
            class="qt-button qt-mr-12"
            appDisabledBtn
            #addBtn="disabled"
            (onClick)="add('DOCUMENT')"
        >
            <span *ngIf="!addBtn.isBlock()">Save Document</span>
            <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
        </button>
        <button
            class="qt-button --gray"
            [disabled]="!documentAdd.isTemplate()"
            (click)="add('TEMPLATE')"
        >
            Save as Template
        </button>
    </div>
</div>
