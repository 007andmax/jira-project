<div
    class="qt-aside-modern documents-create"
    [ngClass]="{'--mini' : !openAside}"
>
    <div class="qt-aside-modern__header">
        <div
            class="toggle-aside icon__panel-open qt-mr-16"
            [ngClass]="{'opened' : openAside}"
            (click)="toggleAside()"
        ></div>
        <div class="qt-aside-modern__header-title qt-mr-auto">Create Document</div>
        <div
            class="qt-aside-modern__header-close icon__close"
            (click)="backFromEdit()"
        >
        </div>
    </div>
    <div class="qt-aside-modern__content --no-padding">
        <div class="documents-create-panel__subheader">
            <div
                class="documents-create-panel__subheader-item subheader-item-system pointer"
                [ngClass]="{'--active':tab === 'DOCUMENT_INFO'}"
                (click)="tab = 'DOCUMENT_INFO'"
            >
                Document Info
            </div>
            <div
                class="documents-create-panel__subheader-item subheader-item-network pointer"
                [ngClass]="{'--active':tab === 'PERMISSIONS'}"
                (click)="tab = 'PERMISSIONS'"
            >
                Permissions
            </div>
            <div
                class="documents-create-panel__subheader-item subheader-item-software pointer"
                [ngClass]="{'--active':tab === 'DOCUMENT_HISTORY'}"
                (click)="tab = 'DOCUMENT_HISTORY'"
            >
                Document History
            </div>
        </div>
        <div class="documents-create-panel__body">
            <div
                class="qt-pt-24 qt-pb-24 qt-pl-24 qt-pr-24"
                *ngIf="tab === 'DOCUMENT_INFO'"
            >
                <div class="qt-inputs-row --required">
                    <div class="qt-input-block">
                      <p class="qt-input-block__label">Document Title</p>
                      <input
                        type="text"
                        class="qt-input-40 documents-add-body__input"
                        placeholder="Printer Installation Guide"
                        [(ngModel)]="documentEdit.title"
                        [ngClass]="{'--input-error':!documentValidate.getTitle() || !documentValidate.getUniqueTittle()}"
                        (blur)="onChangeTitle()"
                        min="1"
                        max="250"
                      >
                      <mat-error
                        class="invalid-feedback"
                        *ngIf="!documentValidate.getTitle()"
                        [textContent]="'Document title is required'"
                      >
                      </mat-error>
                      <mat-error
                        class="invalid-feedback"
                        *ngIf="!documentValidate.getUniqueTittle()"
                        [textContent]="'Document title value must be unique'"
                      >
                      </mat-error>
                    </div>
                </div>
                <div class="qt-inputs-row --required">
                    <div class="qt-input-block">
                      <div class="qt-input-block__label">Document Description</div>
                      <textarea
                        class="qt-input-block__textarea"
                        appTextArea
                        [limit]="160"
                        minlength="1"
                        maxlength="1000"
                        placeholder="Write Description"
                        [(ngModel)]="documentEdit.description"
                      ></textarea>
                    </div>
                </div>
                <div class="qt-inputs-row --required">
                    <div class="qt-input-block">
                      <div class="qt-df qt-jc-sb">
                        <div class="qt-input-block__label">Document Category</div>
                        <div
                          class="qt-fs-13 qt-lh-133 qt-color-info"
                          (click)="toggleEditCategories = true"
                          *ngIf="getPermissions('EDIT_CATEGORY')"
                        >
                          Edit
                        </div>
                      </div>
                      <app-drop-down
                        #categoriesDp
                        [class]="['qt-select-input-40']"
                        [placeholder]="'Select Category'"
                        [errorMessage]="'Category is required'"
                        [editItem]="getSelectedCategory()"
                        [field]="'name'"
                        [add]="getPermissions('CREATE_CATEGORY')"
                        [list]="categories"
                        [search]="true"
                        [change]="true"
                        (onSelectedItem)="onSelectCategory($event)"
                        (onAddItem)="onAddCategory($event)"
                      >
                      </app-drop-down>
                    </div>
                </div>
                <div class="qt-inputs-row">
                    <div class="qt-input-block">
                      <documents-linked
                        #linked
                        [isDisabled]="documentEdit.isTemplateForEdit()"
                        [editItems]="documentEdit.linked"
                        (onSelectedItem)="onChangeLinked($event)"
                      ></documents-linked>
                    </div>
                </div>
                <div class="qt-inputs-row">
                    <div class="qt-input-block">
                      <div class="qt-input-block__label">Tags</div>
                      <app-company-tags
                        #tagsDp
                        class="documents-filter-tags"
                        [selectedTag]="documentEdit.tags"
                        (tagsChange)="onSelectTags($event)"
                      ></app-company-tags>
                    </div>
                </div>
                <div class="qt-inputs-row checkbox-wrapper">
                    <div class="with-checkbox">
                        <label
                          class="qt-checkbox"
                          [ngClass]="{'disabled':documentEdit.documentType === 'DOCUMENT'}"
                        >
                          <input
                            id
                            type="checkbox"
                            [disabled]="documentEdit.documentType === 'DOCUMENT'"
                            [(ngModel)]="requiredCompanyType"
                            (change)="onResetCompanyType()"
                          >
                          <span></span>
                          <div>Required by Company Type</div>
                          <i
                            class="icn-sm icon__help"
                            placement="top"
                            ngbTooltip="The required type value can be used only for templates"
                          ></i>
                        </label>
                    </div>
                </div>
                <div class="qt-inputs-row">
                    <div class="qt-input-block">
                      <app-drop-down
                        #companyTypeDp
                        class="dropdown"
                        [placeholder]="'Select Company Type'"
                        [editItem]="getSelectedClientType()"
                        [list]="companyTypes"
                        [field]="'title'"
                        [search]="true"
                        [change]="true"
                        [isDisabled]="!requiredCompanyType"
                        heightInput="40px"
                        widthInput="100%"
                        (onSelectedItem)="onSelectCompanyType($event)"
                      ></app-drop-down>
                    </div>
                </div>
                <div class="qt-inputs-row">
                    <div class="qt-input-block qt-f50">
                      <div class="qt-input-block__label">Document Review Date</div>
                      <app-date-picker
                        [editMode]="true"
                        [placement]="'top'"
                        [editDate]="documentEdit.parseReviewDate()"
                        [useMinDate]="false"
                        (onChange)="onChangeReviewDate($event)"
                      ></app-date-picker>
                    </div>
                </div>
            </div>
            <div
                class="qt-pt-12 qt-pl-24 qt-pr-24"
                *ngIf="tab === 'PERMISSIONS'"
            >
            </div>
            <div
                class="qt-pb-24"
                *ngIf="tab === 'DOCUMENT_HISTORY'"
            >
                <documents-edit-history [documentEdit]="documentEdit"></documents-edit-history>
            </div>
        </div>
    </div>
</div>
<documents-add-edit-categories
    *ngIf="toggleEditCategories"
    (onClosed)="toggleEditCategories = false"
></documents-add-edit-categories>
