<div class="qt-pt-24 qt-pb-24 qt-pl-24 qt-pr-24">
    <ng-template
        ngFor
        let-item
        [ngForOf]="list"
        [ngForTrackBy]="trackById"
    >
        <div class="documents-create__document-history-item">
             <ng-template #popContent let-greeting="greeting"
                >
                <app-tickets-table-item-requested-by
                [requestedUser]="getUserById(item.userId)"
                [indexNoAvatar]="indexNoAvatar"
                [listColorNoAvatar]="listColorNoAvatar"
                ></app-tickets-table-item-requested-by>
                </ng-template>
            <div
                class="documents-create__document-history-avatar qt-pointer"
                [ngStyle]="{'background':  getUserAvatarUrl(getUserById(item.userId))}"
                [textContent]="usersStateService.getNameForAvatar(getUserById(item.userId))"
                  [ngbPopover]="popContent"
                [popoverClass]="'requested-by-popover'"
                [autoClose]="'outside'"
                [container]="'body'"
                #p="ngbPopover"
                triggers="manual"
                appUserLogoPopover
                [user]="getUserById(item.userId)"
                [popover]="p"
                [disabled]="!getUserById(item.userId)"
                [disablePopover]="!getUserById(item.userId)"
            ></div>
            <div class="history-user-info">
                <p
                    class="documents-create__document-history-name"
                    [textContent]="item.userName"
                ></p>
                <p
                    class="documents-create__document-history-text"
                    [textContent]="parseDate(item)"
                >
                </p>
            </div>
        </div>
    </ng-template>
    <div
        class="loading loading--without-text"
        *ngIf="showPreloader"
    ></div>
    <div
        *ngIf="showLoadMore && list.length > 0"
        class="button-loader"
        (click)="getHistory()"
    >
        Load More Updates
        <span
            *ngIf="showMiniPreloader"
            class="loading xs"
        ></span>
    </div>
</div>
