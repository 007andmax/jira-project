<div class="documents-templates-page qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line">
        <div class="qt-page-list__header-title-line--left"></div>
        <div class="qt-page-list__header-title-line--rigth">
            <div class="qt-df qt-ai-c">
                <div class="qt-page-list__search qt-ml-8 search-container">
                    <input
                        type="text"
                        placeholder="Search document"
                        (input)="search($event)"
                        [(ngModel)]="searchText"
                    >
                    <span
                        class="search-clear qt-icon icon__close-round qt-icon__gray-400"
                        *ngIf="searchText.length > 0"
                        (click)="clearSearch()"
                    ></span>
                </div>
                <button
                    class="qt-button --gray --md qt-ml-8"
                    (click)="clearAll()"
                    *ngIf="countFilter > 0"
                >
                    Clear All
                </button>
                <button
                    class="qt-button qt-button-filter --gray --md qt-ml-8"
                    [ngClass]="{'active':!toggleFilter}"
                    (click)="toggleFilter  = !toggleFilter"
                >
                    <span class="qt-icon icon__filter qt-sz-16 qt-bg-contain qt-dib qt-mr-8"></span>
                    <span [textContent]="getTextCountFilters()"></span>
                </button>
            </div>
        </div>
    </div>
    <div class="qt-page-list__header-filters">
        <documents-templates-filter
            class="qt-w100"
            #filter
            (changeCountFilter)="onChangeCountFilter($event)"
            [hidden]="toggleFilter"
        ></documents-templates-filter>
    </div>
</div>
