<div class="qt-page-list__header documents-templates-page">
    <div class="qt-page-list__header-title-line">
        <h3 class="qt-page-list__header-title">Templates</h3>
        <div class="documents-templates-panel__subheader">
            <!-- Template Gallery -->
            <div
                [ngClass]="{'--active':tab === 'TEMPLATE_GALLERY'}"
                (click)="onChangeTemplate('TEMPLATE_GALLERY')"
                class="documents-templates-panel__subheader-item pointer"
            >
                Template Gallery
            </div>
            <!-- End Template Gallery -->
            <!-- My Templates -->
            <div
                [ngClass]="{'--active':tab === 'MY_TEMPLATES'}"
                (click)="onChangeTemplate('MY_TEMPLATES')"
                class="documents-templates-panel__subheader-item pointer"
            >
                My Templates
            </div>
            <!-- END My Templates -->
        </div>
        <div
            class="qt-aside-modern__header-close icon__close"
            routerLink="/ng2/documents"
        ></div>
    </div>
</div>
<documents-templates-header
    #header
    (onSearch)="onSearch($event)"
></documents-templates-header>
<div class="qt-page-list documents-templates-page">
    <div class="documents-create-panel__body">
        <!-- TEMPLATE_GALLERY Tab Content -->
        <div
            class="loading"
            *ngIf="showPreloader"
        ></div>
        <div
            class
            *ngIf="tab === 'TEMPLATE_GALLERY'"
        >
            <div class="card-line">
                <ng-template
                    ngFor
                    let-item
                    [ngForOf]="list"
                    [ngForTrackBy]="trackById"
                >
                    <div
                        class="card"
                        (click)="showTemplate(item)"
                    >
                        <div class="qt-df qt-ai-c qt-jc-sb">
                            <div class="card__icon">
                                <div class="icon__templete-thumb qt-za-16 qt-sz-16 qt-bg-contain"></div>
                            </div>
                            <div
                                class="qt-button qt-ml-6"
                                (click)="editDocument(item)"
                            >
                                Use
                            </div>
                        </div>
                        <div
                            class="card__title"
                            [textContent]="item.title"
                        ></div>
                        <div class="qt-df qt-ai-c qt-jc-sb">
                            <div
                                class="card__description"
                                [textContent]="item.description"
                            ></div>
                            <div class="card__description__menu">
                                <div
                                    ngbDropdown
                                    [container]="'body'"
                                    [placement]="'bottom-right'"
                                >
                                    <div
                                        class="qt-ic-c icon__more  qt-pointer qt-sz-16 qt-bg-contain"
                                        ngbDropdownToggle
                                    ></div>
                                    <ul
                                        class="qt-dropdown-menu"
                                        ngbDropdownMenu
                                        aria-labelledby="dropdownBasic1"
                                    >
                                        <li
                                            class="pointer"
                                            ngbDropdownItem
                                        >
                                            <div class="icon__share-folder qt-sz-16 qt-bg-contain qt-mr-8"></div>
                                            Share...
                                        </li>
                                        <li
                                            class="pointer"
                                            ngbDropdownItem
                                        >
                                            <div class="icon__edit qt-sz-16 qt-bg-contain qt-mr-8"></div>
                                            Edit
                                        </li>
                                        <li
                                            class="pointer"
                                            ngbDropdownItem
                                        >
                                            <div class="icon__move qt-sz-16 qt-bg-contain qt-mr-8"></div>
                                            Move...
                                        </li>
                                        <li
                                            class="pointer"
                                            ngbDropdownItem
                                        >
                                            <div class="icon__copy-gray qt-sz-16 qt-bg-contain qt-mr-8"></div>
                                            Copy to…
                                        </li>
                                        <li
                                            class="pointer"
                                            ngbDropdownItem
                                        >
                                            <div class="icon__clone-document qt-sz-16 qt-bg-contain qt-mr-8"></div>
                                            Clone Document
                                        </li>
                                        <li
                                            class="pointer"
                                            ngbDropdownItem
                                        >
                                            <div class="icon__search-gray qt-sz-16 qt-bg-contain qt-mr-8"></div>
                                            Find within document
                                        </li>
                                        <li
                                            class="pointer"
                                            ngbDropdownItem
                                        >
                                            <div class="icon__link-gray qt-sz-16 qt-bg-contain qt-mr-8"></div>
                                            Copy Internal Link
                                        </li>
                                        <li
                                            class="pointer"
                                            ngbDropdownItem
                                        >
                                            <div class="icon__print qt-sz-16 qt-bg-contain qt-mr-8"></div>
                                            Print
                                        </li>
                                        <li
                                            class="pointer"
                                            ngbDropdownItem
                                        >
                                            <div class="icon__download-pdf qt-sz-16 qt-bg-contain qt-mr-8"></div>
                                            Export PDF
                                        </li>
                                        <li
                                            class="pointer"
                                            ngbDropdownItem
                                            class="remove-item"
                                            (click)="removeDocument()"
                                        >
                                            <div class="icon__remove qt-sz-16 qt-bg-contain qt-mr-8"></div>
                                            Move to Trash
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </ng-template>
            </div>
        </div>
        <!-- END TEMPLATE_GALLERY Tab Content -->
        <!-- MY_TEMPLATES Tab Content -->
        <div *ngIf="tab === 'MY_TEMPLATES'">
            <div class="card-line">
                <ng-template
                    ngFor
                    let-item
                    [ngForOf]="list"
                    [ngForTrackBy]="trackById"
                >
                    <div
                        class="card"
                        (click)="showTemplate(item)"
                    >
                        <div class="qt-df qt-ai-c qt-jc-sb">
                            <div class="card__icon">
                                <div class="icon__templete-thumb qt-za-16 qt-sz-16 qt-bg-contain"></div>
                            </div>
                            <div class="qt-button qt-ml-6">Use</div>
                        </div>
                        <div
                            class="card__title"
                            [textContent]="item.title"
                        ></div>
                        <div class="qt-df qt-ai-c qt-jc-sb">
                            <div
                                class="card__description"
                                [textContent]="item.description"
                            ></div>
                            <div class="card__description__menu">
                                <div
                                    ngbDropdown
                                    [container]="'body'"
                                    [placement]="'bottom-right'"
                                >
                                    <div
                                        class="qt-ic-c icon__more  qt-pointer qt-sz-16 qt-bg-contain"
                                        ngbDropdownToggle
                                    ></div>
                                    <ul
                                        class="qt-dropdown-menu"
                                        ngbDropdownMenu
                                        aria-labelledby="dropdownBasic1"
                                    >
                                        <li class="pointer">
                                            <div class="icon__remove qt-sz-16 qt-bg-contain qt-mr-8"></div>
                                            Remove
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </ng-template>
            </div>
        </div>
        <!-- END MY_TEMPLATES Tab Content -->
    </div>
</div>
<documents-templates-info></documents-templates-info>
