<div class="qt-page-list__header documents-templates-page">
    <div class="qt-page-list__header-title-line">
        <h3 class="qt-page-list__header-title">Templates</h3>
        <div class="documents-templates-panel__subheader">
            <!-- Template Gallery -->
            <div
                [ngClass]="{'--active':tab === 'TEMPLATE_GALLERY'}"
                (click)="onChangeTemplate('TEMPLATE_GALLERY')"
                class="documents-templates-panel__subheader-item pointer"
            >
                Template Gallery
            </div>
            <!-- End Template Gallery -->
            <!-- My Templates -->
            <div
                [ngClass]="{'--active':tab === 'MY_TEMPLATES'}"
                (click)="onChangeTemplate('MY_TEMPLATES')"
                class="documents-templates-panel__subheader-item pointer"
            >
                My Templates
            </div>
            <!-- END My Templates -->
        </div>
        <div
            class="qt-aside-modern__header-close icon__close"
            routerLink="/ng2/documents"
        ></div>
    </div>
</div>
<documents-templates-header
    #header
    (onSearch)="onSearch($event)"
></documents-templates-header>
<div class="qt-page-list documents-templates-page">
    <div class="documents-create-panel__body">
        <!-- TEMPLATE_GALLERY Tab Content -->
        <div
            class="loading"
            *ngIf="showPreloader"
        ></div>
        <div
            class
            *ngIf="tab === 'TEMPLATE_GALLERY'"
        >
            <div class="card-line">
                <ng-template
                    ngFor
                    let-item
                    [ngForOf]="list"
                    [ngForTrackBy]="trackById"
                >
                    <div
                        class="card"
                        (click)="showTemplate(item)"
                    >
                        <div class="qt-df qt-ai-c qt-jc-sb">
                            <div class="card__icon">
                                <div class="icon__templete-thumb qt-za-16 qt-sz-16 qt-bg-contain"></div>
                            </div>
                            <div class="qt-button qt-ml-6">Use</div>
                        </div>
                        <div
                            class="card__title"
                            [textContent]="item.title"
                        ></div>
                        <div
                            class="card__description"
                            [textContent]="item.description"
                        ></div>
                    </div>
                </ng-template>
            </div>
        </div>
        <!-- END TEMPLATE_GALLERY Tab Content -->
        <!-- MY_TEMPLATES Tab Content -->
        <div
            class="qt-pt-24 qt-pb-24 qt-pl-24 qt-pr-24"
            *ngIf="tab === 'MY_TEMPLATES'"
        >
            <div class="card-line">
                <ng-template
                    ngFor
                    let-item
                    [ngForOf]="list"
                    [ngForTrackBy]="trackById"
                >
                    <div
                        class="card"
                        (click)="showTemplate(item)"
                    >
                        <div class="qt-df qt-ai-c qt-jc-sb">
                            <div class="card__icon">
                                <div class="icon__templete-thumb qt-za-16 qt-sz-16 qt-bg-contain"></div>
                            </div>
                            <div class="qt-button qt-ml-6">Use</div>
                        </div>
                        <div
                            class="card__title"
                            [textContent]="item.title"
                        ></div>
                        <div
                            class="card__description"
                            [textContent]="item.description"
                        ></div>
                    </div>
                </ng-template>
            </div>
        </div>
        <!-- END MY_TEMPLATES Tab Content -->
    </div>
</div>
<documents-templates-info></documents-templates-info>
