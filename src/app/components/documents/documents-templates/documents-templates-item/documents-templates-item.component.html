<div
    class="card pointer"
    (click)="showTemplate(item)"
>
    <div class="qt-df qt-ai-c qt-jc-sb">
        <div class="card__icon">
            <div class="icon__documents qt-za-16 qt-sz-16 qt-bg-contain"></div>
        </div>
        <div
            class="card__label"
            [textContent]="getCompanyType()"
        >
        </div>
        <div
            class="qt-button qt-ml-6"
            (click)="$event.stopPropagation();goToAddDocument()"
            *ngIf="getPermissions('CREATE_TEMPLATE') || getPermissions('CREATE_DOCUMENT')"
        >
            Use
        </div>
    </div>
    <div
        class="card__title"
        [textContent]="item.title"
    ></div>
    <div class="qt-df qt-ai-c qt-jc-sb">
        <div
            class="card__description"
            [textContent]="getCategoryName()"
        ></div>
        <div
            class="card__description__menu"
            (click)="$event.stopPropagation();"
        >
            <div
                ngbDropdown
                [container]="'body'"
                [placement]="'bottom-right'"
            >
                <div
                    class="qt-ic-c icon__more  qt-pointer qt-sz-16 qt-bg-contain"
                    ngbDropdownToggle
                ></div>
                <ul
                    class="qt-dropdown-menu"
                    ngbDropdownMenu
                    aria-labelledby="dropdownBasic1"
                >
                    <li
                        class="pointer"
                        ngbDropdownItem
                        *ngIf="!item.isDefault && getPermissions('EDIT_TEMPLATE')"
                        (click)="editDocument(item)"
                    >
                        <div class="icon__edit qt-sz-20 qt-bg-contain qt-mr-12"></div>
                        Edit
                    </li>
                    <li
                        class="pointer"
                        ngbDropdownItem
                        (click)="goToAddDocument()"
                        *ngIf="getPermissions('CREATE_TEMPLATE') || getPermissions('CREATE_DOCUMENT')"
                    >
                        <div class="icon__clone-document qt-sz-20 qt-bg-contain qt-mr-12"></div>
                        Clone Document
                    </li>
                    <li
                        class="pointer"
                        ngbDropdownItem
                        (click)="printPdf()"
                    >
                        <div class="icon__print qt-sz-20 qt-bg-contain qt-mr-12"></div>
                        Print
                    </li>
                    <li
                        class="pointer"
                        ngbDropdownItem
                        (click)="exportPdf()"
                    >
                        <div class="icon__download-pdf qt-sz-20 qt-bg-contain qt-mr-12"></div>
                        Export PDF
                    </li>
                    <li
                        class="pointer"
                        ngbDropdownItem
                        *ngIf="!item.isDefault && getPermissions('DELETE_TEMPLATE')"
                        class="remove-item"
                        (click)="removeDocument()"
                    >
                        <div class="icon__new-remove qt-sz-20 qt-bg-contain qt-mr-12"></div>
                        Delete
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
