<div class="list-companies-item qt-mb-4">
  <label class="qt-checkbox">
    <input
      type="checkbox"
      [checked]="checkSelected(company.id)"
      (change)="onSelectCompany($event,company)"
    >
    <span></span>
    <div
      class="square-avatar qt-ml-12 qt-mr-8"
      [ngStyle]="{'background': ticketsListService.getStyleAvatar(null,listColorNoAvatar[indexNoAvatar]) }"
    >
      <div class="square-avatar__text" [textContent]="company.name[0].toUpperCase()"></div>
    </div>
    <p [textContent]="company.name"></p>
  </label>
</div>
