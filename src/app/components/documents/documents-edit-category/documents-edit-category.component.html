<div
    class="qt-aside-modern users-page__aside"
    *ngIf="opened"
>
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-title">Edit Category</div>
        <div
            class="qt-aside-modern__header-close icon__close"
            (click)="close()"
        ></div>
    </div>
    <div class="qt-aside-modern__content">

        <div class="qt-w100 qt-mb-24">
            <div class="qt-input-block">
                <label>Category Name</label>
                <input
                    type="text"
                    [(ngModel)]="documentEditCategory.name"
                    placeholder="Enter Category Name"
                >
            </div>
        </div>
        <div class="qt-w100 qt-mb-24">
            <div class="qt-input-block">
                <label>Assign Category to Companies</label>
                <input
                    type="text"
                    placeholder="Search Companies..."
                    (input)="onSearch($event)"
                >
            </div>
        </div>
        <div class="qt-w100 qt-mb-24 list-companies-container">
            <div class="qt-df qt-w100 qt-mb-16">
                <div class="qt-w50">
                    <div class="qt-df qt-ai-c qt-w100 qt-mb-16 item-type-company">
                        <label class="checkbox-container">
                            <input
                                type="checkbox"
                                [checked]="checkSelectedType('CLIENT')"
                                (change)="onChangedType($event,'CLIENT')"
                            >
                            <span class="checkbox-mark"></span>
                        </label>
                        <span class="qt-ml-12">All Client Companies</span>
                    </div>
                    <div class="qt-df qt-ai-c qt-w100 qt-mb-16 item-type-company">
                        <label class="checkbox-container">
                            <input
                                type="checkbox"
                                [checked]="checkSelectedType('VENDOR')"
                                (change)="onChangedType($event,'VENDOR')"
                            >
                            <span class="checkbox-mark"></span>
                        </label>
                        <span class="qt-ml-12">All Vendor Companies</span>
                    </div>
                    <div class="qt-df qt-ai-c qt-w100 qt-mb-16 item-type-company">
                        <label class="checkbox-container">
                            <input
                                type="checkbox"
                                [checked]="checkSelectedType('LEAD')"
                                (change)="onChangedType($event,'LEAD')"
                            >
                            <span class="checkbox-mark"></span>
                        </label>
                        <span class="qt-ml-12">All Lead Companies</span>
                    </div>
                    <div class="qt-df qt-ai-c qt-w100 item-type-company">
                        <label class="checkbox-container">
                            <input
                                type="checkbox"
                                [checked]="checkSelectedType('SUPPLIER')"
                                (change)="onChangedType($event,'SUPPLIER')"
                            >
                            <span class="checkbox-mark"></span>
                        </label>
                        <span class="qt-ml-12">All Supplier Companies</span>
                    </div>
                </div>
            </div>
            <div class="list-companies">
                <ng-template
                    ngFor
                    let-company
                    [ngForOf]="companies"
                    [ngForTrackBy]="trackById"
                >
                    <div class="list-companies-item qt-mb-16">
                        <label class="checkbox-container">
                            <input
                                type="checkbox"
                                [checked]="checkSelected(company.id)"
                                (change)="onSelectCompany($event,company)"
                            >
                            <span class="checkbox-mark"></span>
                        </label>
                        <div
                            class="circle-avatar qt-ml-12 qt-mr-8"
                            [ngClass]="{'with-logo': checkLogo(company)}"
                        >
                            <img
                                [src]="getCompanyLogoUrl(company)"
                                class="qwe"
                                alt
                                *ngIf="checkLogo(company)"
                            >
                            <span
                                *ngIf="!checkLogo(company)"
                                [textContent]="company.name[0].toUpperCase()"
                            ></span>
                        </div>
                        <p [textContent]="company.name"></p>
                    </div>
                </ng-template>
            </div>
        </div>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="qt-df">
            <button
                class="qt-button qt-mr-12"
                appDisabledBtn
                #addBtn="disabled"
                (onClick)="onSave()"
            >
                Save
            </button>
            <button
                class="qt-button --gray"
                (click)="close()"
            >
                Cancel
            </button>
        </div>
    </div>
</div>
