<div class="report-menu">
    <div *ngIf="report === 'tech-ticket'">
        <div class="qt-report__header qt-df qt-ai-fs">
            <div class="qt-report__header-content qt-df qt-ai-c qt-jc-sb">
                <div class="qt-df qt-ai-c qt-jc-sb qt-f-1">
                    <div
                        class="qt-report__filter qt-f-1 qt-df qt-ai-c qt-jc-c"
                        [ngClass]="className"
                    >
                        <div class="grey-dropdown qt-report__dropdown qt-mr-8">
                            <app-drop-down
                                #durationsTechSaleDP
                                [placeholder]="'No interval'"
                                [list]="techTicketReport.durations"
                                [sort]="false"
                                [isDisabled]="techTicketReport.isDisabledDuration"
                                [editItem]="techTicketReport.selectedDuration"
                                [dropdownHeight]="'192px'"
                                [heightInput]="'36px'"
                                [field]="'title'"
                                [isBlockClear]="true"
                                (onSelectedItem)="onSelectDurationTechSale($event)"
                            ></app-drop-down>
                        </div>
                        <div class="qt-report__dropdown qt-input-block qt-mr-8">
                            <app-multi-datepicker
                                #dp
                                (selectedDate)="filterByDate($event)"
                            ></app-multi-datepicker>
                        </div>
                        <button
                            class="btn-new btn-primary-white qt-fs-0"
                            (click)="getReportByTechTicketReport()"
                        >
                            Get
                Report
                        </button>
                    </div>
                </div>
                <app-report-additional-actions
                    [report]="'tech-ticket'"
                    [orientation]="'LANDSCAPE'"
                    [fileName]="'tech-ticket-report'"
                ></app-report-additional-actions>
            </div>
            <div
                class="qt-report__control-panel-btn-close pointer icon__close"
                (click)="back()"
            ></div>
        </div>
    </div>
    <div *ngIf="report === 'tech-sales'">
        <div class="qt-report__header qt-df qt-ai-fs">
            <div class="qt-report__header-content qt-df qt-ai-c qt-jc-sb">
                <div class="qt-df qt-ai-c qt-jc-sb qt-f-1">
                    <div
                        class="qt-report__filter qt-f-1 qt-df qt-ai-c qt-jc-c"
                        [ngClass]="className"
                    >
                        <div class="grey-dropdown qt-report__dropdown qt-mr-8">
                            <app-drop-down
                                [list]="techSalesReport.types"
                                [editItem]="techSalesReport.selectedType"
                                [dropdownHeight]="'192px'"
                                [heightInput]="'36px'"
                                [field]="'title'"
                                [isBlockClear]="true"
                                (onSelectedItem)="onSelectTypeTechSale($event)"
                            ></app-drop-down>
                        </div>
                        <div class="grey-dropdown qt-report__dropdown qt-mr-8">
                            <app-drop-down
                                #durationsTechSaleDP
                                [placeholder]="'No interval'"
                                [list]="techSalesReport.durations"
                                [isDisabled]="techTicketReport.isDisabledDuration"
                                [editItem]="techSalesReport.selectedDuration"
                                [dropdownHeight]="'192px'"
                                [heightInput]="'36px'"
                                [field]="'title'"
                                [sort]="false"
                                [isBlockClear]="true"
                                (onSelectedItem)="onSelectDurationTechSale($event)"
                            ></app-drop-down>
                        </div>
                        <div class="qt-report__dropdown qt-input-block qt-mr-8">
                            <app-multi-datepicker
                                #dp
                                (selectedDate)="filterByDate($event)"
                            ></app-multi-datepicker>
                        </div>
                        <button
                            class="btn-new btn-primary-white qt-fs-0"
                            (click)="getReportByTechSaleReport()"
                        >
                            Get
                Report
                        </button>
                    </div>
                </div>
                <app-report-additional-actions
                    [report]="'tech-sales'"
                    [orientation]="'LANDSCAPE'"
                    [fileName]="'tech-sales-report'"
                ></app-report-additional-actions>
            </div>
            <div
                class="qt-report__control-panel-btn-close pointer icon__close"
                (click)="back()"
            ></div>
        </div>
    </div>
    <div *ngIf="report === 'remote-access'">
        <div class="qt-report__header qt-df qt-ai-fs">
            <div class="qt-report__header-content qt-df qt-ai-c qt-jc-sb">
                <div class="qt-df qt-ai-c qt-jc-sb qt-f-1">
                    <div
                        class="qt-report__filter qt-f-1 qt-df qt-ai-c qt-jc-c"
                        [ngClass]="className"
                    >
                        <div class="qt-report__dropdown qt-report__dropdown-xl qt-mr-8">
                            <company-drop-down
                                [placeholder]="'Select Company'"
                                [dropdownHeight]="'192px'"
                                [heightInput]="'36px'"
                                [validate]="validate.getCompany()"
                                [errorMessage]="'Please select the company name'"
                                [field]="'name'"
                                [search]="true"
                                [change]="true"
                                (onSelectedItem)="selectClient($event)"
                            ></company-drop-down>
                        </div>
                        <div class="qt-report__dropdown qt-input-block qt-mr-8">
                            <app-multi-datepicker
                                #dp
                                [validate]="validate.getDates()"
                                [errorMessage]="'Please select the dates'"
                                (selectedDate)="filterByDate($event)"
                            ></app-multi-datepicker>
                        </div>
                        <div class="qt-report__dropdown qt-mr-8">
                            <software-summary-devices-dro-down
                                #dpDevices
                                [sort]="true"
                                [search]="true"
                                [change]="true"
                                [placeholder]="'All devices'"
                                [dropdownHeight]="'300px'"
                                [heightInput]="'36px'"
                                [list]="devices"
                                [isDisabled]="!remoteConnectionReport.companyId || remoteConnectionReport.preloaderDevices"
                                [preloader]="remoteConnectionReport.preloaderDevices"
                                (onSelectedItem)="onSelectDevice($event)"
                            ></software-summary-devices-dro-down>
                        </div>
                        <div class="grey-dropdown qt-report__dropdown qt-mr-8 dropdown-button dropdown">
                            <app-tech-users-list-report
                                [sort]="true"
                                [search]="true"
                                [change]="true"
                                [heightInput]="'36px'"
                                [validate]="validate.getTechUser()"
                                [errorMessage]="'Select any user'"
                                (onSelectedItem)="onSelectTechUser($event)"
                            ></app-tech-users-list-report>
                        </div>
                        <button
                            class="btn-new btn-primary-white qt-fs-0"
                            (click)="getReportByRemoteConnectionReport()"
                            [disabled]="remoteConnectionReport.preloaderDevices || !remoteConnectionReport.companyId"
                            [ngClass]="{'--disabled':remoteConnectionReport.preloaderDevices || !remoteConnectionReport.companyId}"
                        >
                            Get
                Report
                        </button>
                    </div>
                </div>
                <app-report-additional-actions
                    [orientation]="'LANDSCAPE'"
                    [report]="'remote-access'"
                    [fileName]="'remote-access-report'"
                ></app-report-additional-actions>
            </div>
            <div
                class="qt-report__control-panel-btn-close pointer icon__close"
                (click)="back()"
            ></div>
        </div>
    </div>
    <div *ngIf="report === 'block-time-report'">
        <div class="qt-report__header qt-df qt-ai-fs">
            <div class="qt-report__header-content qt-df qt-ai-c qt-jc-sb">
                <div class="qt-df qt-ai-c qt-jc-sb qt-f-1">
                    <div
                        class="qt-report__filter qt-f-1 qt-df qt-ai-c qt-jc-c"
                        [ngClass]="className"
                    >
                        <div class="qt-report__dropdown qt-report__dropdown-xl qt-mr-8">
                            <contract-company-drop-down
                                [placeholder]="'Select Company'"
                                [dropdownHeight]="'192px'"
                                [heightInput]="'36px'"
                                [validate]="validate.getCompany()"
                                [errorMessage]="'Please select the company name'"
                                [field]="'name'"
                                [search]="true"
                                [change]="true"
                                (onSelectedItem)="selectClient($event)"
                            ></contract-company-drop-down>
                        </div>
                        <div class="qt-report__dropdown qt-input-block qt-mr-8">
                            <contract-detail-drop-down
                                #contractDetailDp
                                [placeholder]="'Select contract'"
                                [list]="detailContractReport.agreements"
                                [isDisabled]="detailContractReport.isDisabledAgreements"
                                [dropdownHeight]="'192px'"
                                [dropdownWidth]="'500px'"
                                [heightInput]="'36px'"
                                [search]="true"
                                [change]="true"
                                [sort]="false"
                                (onSelectedItem)="onSelectAgreements($event)"
                            ></contract-detail-drop-down>
                        </div>
                        <div class="qt-report__dropdown qt-mr-8">
                            <contract-detail-intervals-drop-down
                                #dpInterval
                                [sort]="false"
                                [search]="true"
                                [change]="true"
                                [placeholder]="'Select interval'"
                                [dropdownWidth]="'375px'"
                                [dropdownHeight]="'300px'"
                                [heightInput]="'36px'"
                                [list]="detailContractReport.intervals"
                                [isDisabled]="detailContractReport.isDisabledIntervals"
                                (onSelectedItem)="onSelectInterval($event)"
                            ></contract-detail-intervals-drop-down>
                        </div>
                        <button
                            class="btn-new btn-primary-white qt-fs-0"
                            (click)="getReportByDetailedContractsReport()"
                            [disabled]="detailContractReport.isDisabledAgreements || !detailContractReport.selectedAgreement"
                            [ngClass]="{'--disabled':detailContractReport.isDisabledAgreements || !detailContractReport.selectedAgreement}"
                        >
                            Get
                Report
                        </button>
                    </div>
                </div>
                <app-report-additional-actions
                    [orientation]="'LANDSCAPE'"
                    [report]="'block-time-report'"
                    [fileName]="'detailed-contract-report'"
                ></app-report-additional-actions>
            </div>
            <div
                class="qt-report__control-panel-btn-close pointer icon__close"
                (click)="back()"
            ></div>
        </div>
    </div>
    <div *ngIf="report === 'device-ip-summary' || report === 'device-ip-summary-device'">
        <div class="qt-report__header">
            <div class="qt-df qt-ai-fs">
                <div class="qt-report__header-content">
                    <div class="qt-df qt-ai-c qt-jc-sb">
                        <div class="qt-df qt-ai-c qt-jc-sb qt-f-1">
                            <div
                                class="qt-report__filter qt-f-1"
                                [ngClass]="className"
                            >
                                <div class="qt-df qt-ai-c qt-jc-c">
                                    <div class="qt-report__dropdown qt-mr-8 select-users-list">
                                        <company-drop-down
                                            [placeholder]="'Select Company'"
                                            [dropdownHeight]="'192px'"
                                            [validate]="validate.getCompany()"
                                            [errorMessage]="'Please select the company name'"
                                            [heightInput]="'36px'"
                                            [field]="'name'"
                                            [search]="true"
                                            [change]="true"
                                            (onSelectedItem)="selectClient($event)"
                                        ></company-drop-down>
                                    </div>
                                    <div class="qt-report__dropdown qt-mr-8">
                                        <software-summary-devices-dro-down
                                            #dpDevices
                                            [sort]="true"
                                            [search]="true"
                                            [change]="true"
                                            [placeholder]="'All devices'"
                                            [dropdownHeight]="'300px'"
                                            [heightInput]="'36px'"
                                            [list]="devices"
                                            [isDisabled]="!deviceIpSummary.companyId || deviceIpSummary.preloaderDevices || devices.length == 0"
                                            [preloader]="deviceIpSummary.preloaderDevices"
                                            (onSelectedItem)="onSelectDevice($event)"
                                        ></software-summary-devices-dro-down>
                                    </div>
                                    <button
                                        class="btn-new btn-primary-white qt-fs-0"
                                        (click)="getReportByDeviceIpSummary()"
                                        [disabled]="deviceIpSummary.preloaderDevices || !deviceIpSummary.companyId"
                                        [ngClass]="{'--disabled':deviceIpSummary.preloaderDevices || !deviceIpSummary.companyId}"
                                    >
                                        Get Report
                                    </button>
                                </div>
                            </div>
                            <!-- End Filter -->
                        </div>
                        <app-report-additional-actions
                            [orientation]="'LANDSCAPE'"
                            [report]="'device-ip-summary'"
                            [fileName]="'device-ip-summary-report'"
                        ></app-report-additional-actions>
                    </div>
                    <div class="qt-report__include-columns-panel qt-mt-16">
                        <p class="qt-mb-4">
                            Include the following columns in the report
                        </p>
                        <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                            <input
                                type="checkbox"
                                [(ngModel)]="deviceIpSummary.deviceIpSummaryWithDevice"
                            >
                            <span></span>
                            <div class="qt-ml-8">Device</div>
                        </label>
                        <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                            <input
                                type="checkbox"
                                [(ngModel)]="deviceIpSummary.deviceIpSummaryWithNetworkName"
                            >
                            <span></span>
                            <div class="qt-ml-8">Network Name</div>
                        </label>
                        <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                            <input
                                type="checkbox"
                                [(ngModel)]="deviceIpSummary.deviceIpSummaryWithLinkSpeed"
                            >
                            <span></span>
                            <div class="qt-ml-8">Link Speed</div>
                        </label>
                        <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                            <input
                                type="checkbox"
                                [(ngModel)]="deviceIpSummary.deviceIpSummaryWithDhcp"
                            >
                            <span></span>
                            <div class="qt-ml-8">DHCP</div>
                        </label>
                        <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                            <input
                                type="checkbox"
                                [(ngModel)]="deviceIpSummary.deviceIpSummaryWithIpAddress"
                            >
                            <span></span>
                            <div class="qt-ml-8">IP Address</div>
                        </label>
                        <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                            <input
                                type="checkbox"
                                [(ngModel)]="deviceIpSummary.deviceIpSummaryWithSubnet"
                            >
                            <span></span>
                            <div class="qt-ml-8">Subnet</div>
                        </label>
                        <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                            <input
                                type="checkbox"
                                [(ngModel)]="deviceIpSummary.deviceIpSummaryWithGateway"
                            >
                            <span></span>
                            <div class="qt-ml-8">Gateway</div>
                        </label>
                        <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                            <input
                                type="checkbox"
                                [(ngModel)]="deviceIpSummary.deviceIpSummaryWithDns1"
                            >
                            <span></span>
                            <div class="qt-ml-8">DNS 1</div>
                        </label>
                        <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                            <input
                                type="checkbox"
                                [(ngModel)]="deviceIpSummary.deviceIpSummaryWithDns2"
                            >
                            <span></span>
                            <div class="qt-ml-8">DNS 2</div>
                        </label>
                        <label class="qt-checkbox qt-dif qt-ai-c pointer">
                            <input
                                type="checkbox"
                                [(ngModel)]="deviceIpSummary.deviceIpSummaryWithWanIp"
                            >
                            <span></span>
                            <div class="qt-ml-8">WAN IP</div>
                        </label>
                    </div>
                </div>
                <div
                    class="qt-report__control-panel-btn-close pointer icon__close"
                    (click)="back()"
                ></div>
            </div>
        </div>
    </div>
    <div *ngIf="report === 'hardware-summary' || report === 'hardware-summary-device'">
        <div class="qt-report__header">
            <div class="qt-df qt-ai-fs">
                <div class="qt-report__header-content">
                    <div class="qt-df qt-ai-c qt-jc-sb">
                        <div class="qt-df qt-ai-c qt-jc-sb qt-f-1">
                            <div
                                class="qt-report__filter qt-f-1"
                                [ngClass]="className"
                            >
                                <div class="qt-df qt-ai-c qt-jc-c">
                                    <div class="qt-report__dropdown qt-mr-8 select-users-list">
                                        <company-drop-down
                                            [placeholder]="'Select Company'"
                                            [dropdownHeight]="'192px'"
                                            [validate]="validate.getCompany()"
                                            [errorMessage]="'Please select the company name'"
                                            [field]="'name'"
                                            [heightInput]="'36px'"
                                            [search]="true"
                                            [change]="true"
                                            (onSelectedItem)="selectClient($event)"
                                        ></company-drop-down>
                                    </div>
                                    <div class="fqt-report__dropdown qt-mr-8">
                                        <software-summary-devices-dro-down
                                            #dpDevices
                                            [sort]="true"
                                            [search]="true"

                        <app-report-additional-actions

                    </div>
                    <div class="qt-report__include-columns-panel qt-mt-16">
                        <p class="qt-mb-4">

                        <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                            <input
                                type="checkbox"

                            <div class="qt-ml-8">Device</div>

                            <input
                                type="checkbox"
                                [(ngModel)]="hardwareSummaryReport.hardwareSummaryWithOperationSystem"
                            >
                            <span></span>
                            <div class="qt-ml-8">Operating System</div>
                        </label>
                        <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                            <input
                                type="checkbox"
                                [(ngModel)]="hardwareSummaryReport.hardwareSummaryWithCpu"
                            >
                            <span></span>
                            <div class="qt-ml-8">CPU</div>
                        </label>
                        <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                            <input
                                type="checkbox"
                                [(ngModel)]="hardwareSummaryReport.hardwareSummaryWithRam"
                            >
                            <span></span>
                            <div class="qt-ml-8">Ram</div>
                        </label>
                        <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                            <input
                                type="checkbox"
                                [(ngModel)]="hardwareSummaryReport.hardwareSummaryWithDisk"
                            >
                            <span></span>
                            <div class="qt-ml-8">Disk</div>
                        </label>
                        <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                            <input
                                type="checkbox"
                                [(ngModel)]="hardwareSummaryReport.hardwareSummaryWithWarrenty"
                            >
                            <span></span>
                            <div class="qt-ml-8">Warranty</div>
                        </label>
                        <label class="qt-checkbox qt-dif qt-ai-c pointer">
                            <input
                                type="checkbox"
                                [(ngModel)]="hardwareSummaryReport.hardwareSummaryWithSerialNumber"
                            >
                            <span></span>
                            <div class="qt-ml-8">Serial Number</div>

                    class="qt-report__control-panel-btn-close pointer icon__close"

                ></div>
            </div>
        </div>
    </div>
    <div *ngIf="report === 'software-summary' || report === 'software-summary-device'">
        <div class="qt-report__header">
            <div class="qt-df qt-ai-fs">
                <div class="qt-report__header-content">
                    <div class="qt-df qt-ai-c qt-jc-sb">
                        <div class="qt-df qt-ai-c qt-jc-sb qt-f-1">
                            <div
                                class="qt-report__filter qt-f-1"
                                [ngClass]="className"
                            >
                                <div class="qt-df qt-ai-c qt-jc-c">
                                    <div class="qt-report__dropdown qt-mr-8">
                                        <company-drop-down
                                            [placeholder]="'Select Company'"
                                            [validate]="validate.getCompany()"
                                            [errorMessage]="'Please select the company name'"
                                            [field]="'name'"
                                            [heightInput]="'36px'"
                                            [search]="true"
                                            [change]="true"
                                            (onSelectedItem)="selectClient($event)"
                                        ></company-drop-down>
                                    </div>
                                    <div class="qt-report__dropdown qt-mr-8">
                                        <software-summary-devices-dro-down
                                            #dpDevices
                                            [sort]="true"
                                            [search]="true"
                                            [change]="true"
                                            [placeholder]="'All devices'"
                                            [preloader]="softwareSummaryReport.preloaderDevices"
                                            [isDisabled]="!softwareSummaryReport.companyId || softwareSummaryReport.preloaderDevices || devices.length == 0"
                                            [dropdownHeight]="'300px'"
                                            [heightInput]="'36px'"
                                            [list]="devices"
                                            (onSelectedItem)="onSelectDevice($event)"
                                        ></software-summary-devices-dro-down>
                                    </div>
                                    <div class="qt-report__dropdown qt-mr-8">
                                        <app-drop-down
                                            [sort]="true"
                                            [placeholder]="'Search software / publisher'"
                                            [dropdownHeight]="'300px'"
                                            [heightInput]="'36px'"
                                            [field]="'name'"
                                            [search]="true"
                                            [change]="true"
                                            [isDisabled]="!softwareSummaryReport.companyId || softwareSummaryReport.preloaderDevices || softwareSummaryReport.soft.length == 0"
                                            [preloader]="softwareSummaryReport.preloaderSoft"
                                            [list]="softwareSummaryReport.soft"
                                            (onSelectedItem)="onSelectSoftware($event)"
                                        ></app-drop-down>
                                    </div>
                                    <button
                                        class="btn-new btn-primary-white qt-fs-0"
                                        (click)="getReportBySoftwareSummary()"
                                        [disabled]="softwareSummaryReport.preloaderDevices || !softwareSummaryReport.companyId"
                                        [ngClass]="{'--disabled':softwareSummaryReport.preloaderDevices || !softwareSummaryReport.companyId}"
                                    >
                                        Get Report
                                    </button>
                                </div>
                            </div>
                            <!-- End Filter -->
                        </div>
                        <app-report-additional-actions
                            [orientation]="'LANDSCAPE'"
                            [report]="'software-summary'"
                            [fileName]="'software-summary-report'"
                        ></app-report-additional-actions>
                    </div>
                    <div class="qt-report__include-columns-panel qt-mt-16">
                        <p class="qt-mb-4">
                            Include the following columns in the report
                        </p>
                        <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                            <input
                                type="checkbox"
                                [(ngModel)]="softwareSummaryReport.softwareSummaryWithDevice"
                                [disabled]="softwareSummaryReport.soft && !softwareSummaryReport.companyId"
                            >
                            <span></span>
                            <div class="qt-ml-8">Device</div>
                        </label>
                        <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                            <input
                                type="checkbox"
                                [(ngModel)]="softwareSummaryReport.softwareSummaryWithSoftwareTitle"
                            >
                            <span></span>
                            <div class="qt-ml-8">Software Title</div>
                        </label>
                        <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                            <input

                            <div class="grey-dropdown qt-report__dropdown qt-mr-8">
                                <app-tech-users-list-report
                                    [sort]="true"
                                    [search]="true"
                                    [change]="true"
                                    (onSelectedItem)="onSelectTechUser($event)"
                                ></app-tech-users-list-report>
                            </div>
                            <div class="grey-dropdown qt-report__dropdown qt-mr-8">
                                <app-drop-down
                                    #durationsTechSaleDP
                                    [placeholder]="'No interval'"
                                    [list]="ticketsReport.companySelectionType"
                                    [sort]="false"
                                    [editItem]="ticketsReport.selectedCompanySelectionType"
                                    [dropdownHeight]="'192px'"
                                    [heightInput]="'36px'"
                                    [field]="'title'"
                                    [isBlockClear]="true"
                                    (onSelectedItem)="onSelectCompanySelectionType($event)"
                                ></app-drop-down>
                            </div>
                            <button
                                class="btn-new btn-primary-white qt-fs-0"
                                (click)="getReportByTickets()"
                            >
                                Get
                  Report
                            </button>
                        </div>
                    </div>
                    <app-report-additional-actions
                        [report]="'ticket-report'"
                        [fileName]="'customer-report-' + getSelectedClientName()"
                        [template]="'CUSTOMER_REPORT'"
                        [selectedClient]="selectedClient"
                    ></app-report-additional-actions>
                </div>
            </div>
            <div
                class="qt-report__control-panel-btn-close pointer icon__close"
                (click)="back()"
            ></div>
        </div>
    </div>
    <div *ngIf="report === 'service-report'">
        <div class="qt-report__header qt-df qt-ai-fs">
            <div class="qt-report__header-content">
                <div class="qt-df qt-ai-c qt-jc-sb">
                    <div class="qt-df qt-ai-c qt-jc-sb qt-f-1">
                        <div
                            class="qt-report__filter qt-f-1 qt-df qt-ai-c qt-jc-c"
                            [ngClass]="className"
                        >
                            <div class="qt-report__dropdown qt-mr-8">
                                <company-drop-down
                                    [isDisabled]="isDisabledCompany"
                                    [placeholder]="'Select Company'"
                                    [validate]="validate.getCompany()"
                                    [errorMessage]="'Please select the company name'"
                                    [field]="'name'"
                                    [heightInput]="'36px'"
                                    [search]="true"
                                    [change]="true"
                                    (onSelectedItem)="selectClient($event)"
                                ></company-drop-down>
                            </div>
                            <div class="qt-report__dropdown qt-input-block qt-mr-8">
                                <app-multi-datepicker
                                    #dp
                                    (selectedDate)="filterByDate($event)"
                                ></app-multi-datepicker>
                            </div>
                            <button
                                class="btn-new btn-primary-white qt-fs-0"
                                (click)="getReportByService()"
                            >
                                Get
                  Report
                            </button>
                        </div>
                    </div>
                    <app-report-additional-actions
                        [report]="'service-report'"
                        [fileName]="'customer-report-' + getSelectedClientName()"
                        [template]="'CUSTOMER_REPORT'"
                        [selectedClient]="selectedClient"
                    ></app-report-additional-actions>
                </div>
                <div class="qt-report__include-columns-panel qt-mt-16">
                    <p class="qt-mb-4">What to include</p>
                    <label class="qt-checkbox qt-dif qt-ai-c pointer">
                        <input
                            type="checkbox"
                            (change)="toggleShowDashboard($event)"
                            checked
                        >
                        <span></span>
                        <div class="qt-ml-8">Show dashboard</div>
                    </label>
                </div>
            </div>
            <div
                class="qt-report__control-panel-btn-close pointer icon__close"
                (click)="back()"
            ></div>
        </div>
    </div>
    <div *ngIf="report === 'company-roducts-report'">
        <div class="qt-report__header qt-df qt-ai-fs">
            <div class="qt-report__header-content qt-w100">
                <div class="qt-df qt-ai-c qt-jc-sb">
                    <div class="qt-df qt-ai-c qt-jc-sb qt-f-1">
                        <div
                            class="qt-report__filter qt-f-1 qt-df qt-ai-c qt-jc-c"
                            [ngClass]="className"
                        >
                            <div class="qt-report__dropdown product-dropdown-new-ng light-dropdown select-product qt-mr-8">
                                <app-product-list
                                    [type]="'REPORT'"
                                    (selectedProductItem)="selectProduct($event)"
                                ></app-product-list>
                            </div>
                            <div class="qt-report__dropdown qt-mr-8">
                                <div>
                                    <input
                                        type="text"
                                        name="serialNumber"
                                        [(ngModel)]="productsCompanyReport.serialNumber"
                                        autocomplete="off"
                                        class="form-control"
                                        placeholder="Serial Number"
                                        custom-style="{width: '100%', 'max-height': '160px', 'overflow-y': 'auto'}"
                                    >
                                </div>
                            </div>
                            <div class="qt-report__dropdown qt-input-block qt-mr-8">
                                <app-multi-datepicker
                                    #dp
                                    (selectedDate)="filterByDate($event)"
                                ></app-multi-datepicker>
                            </div>
                            <button
                                class="btn-new btn-primary-white qt-fs-0"
                                (click)="getReportCompanyProducts()"
                            >
                                Get
                  Report
                            </button>
                        </div>
                    </div>
                    <app-report-additional-actions
                        [orientation]="'LANDSCAPE'"
                        [report]="'company-roducts-report'"
                        [fileName]="'products_report'"
                        [selectedClient]="selectedClient"
                        (changePurchaseCost)="togglePurchaseCost($event)"
                    ></app-report-additional-actions>
                </div>
                <div
                    *ngIf="report === 'company-roducts-report'"
                    class="qt-report__include-columns-panel qt-mt-16"
                >
                    <label class="qt-checkbox qt-dif qt-ai-c qt-mr-20 pointer">
                        <input
                            type="checkbox"
                            (change)="togglePurchaseCost($event)"
                            checked
                        >
                        <span class></span>
                        <div class="qt-ml-8">Include product cost in report</div>
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>
