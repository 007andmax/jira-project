<div
    class="light-dropdown"
    [ngClass]="class"
    ngbDropdown
>
    <app-mat-error
        class="app-drop-down__error qt-tooltip-error mat-error"
        *ngIf="!validate"
        [textContent]="errorMessage"
    >
    </app-mat-error>
     <div class="qt-pos-rel dropdown-wrap" >
      <div
        *ngIf="title"
        class="qt-input-block__label"
        [textContent]="title"
      ></div>
    <input
        [ngClass]="{'--input-error' : !validate}"
        type="text"
        [value]="getSelectedUser()"
        autocomplete="new-password"
        [attr.placeholder]="placeholder"
        id="dropdown1"
        (input)="onCheckAdd($event)"
        ngbDropdownToggle
        class="qt-input-block__input"
    >
    <span *ngIf="list" [ngClass]="{'exist-title-icon':title}">
        <i
            *ngIf="selectedItem"
            class="icn-remove-old qt-icon icon__close qt-icon__gray-400 qt-sz-20"
            (click)="clearClient()"
        ></i>
        <i
            *ngIf="!selectedItem"
            class="icn-sm qt-icon icon__arrow-down report-caret-icon"
        ></i>
    </span>
    <div
        ngbDropdownMenu
        aria-labelledby="dropdown1"
         class="dropdown-menu"
    >
        <ng-template
            ngFor
            let-user
            [ngForOf]="list"
            let-i="index"
            [ngForTrackBy]="trackByIndex"
        >
            <div
               class="assigne-user-item"
               ngbDropdownItem
                [ngClass]="{'--selected':isSelected(user)}"
                (click)="onSelect(user)"
            >
                    <div
                    class="assigne-user-avatar"
                    [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                    [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                ></div>
                <div
                    class="assigne-user-name"
                    [textContent]="reduceItemName(user)"
                ></div>
                <div
                    *ngIf="isSelected(user)"
                    class="qt-icon icon__done qt-za-20 qt-sz-20 qt-bg-contain filter-users-check"
                ></div>
            </div>
        </ng-template>
    </div>
</div>
</div>
