<div>
  <app-report-menu
    [report]="'tech-ticket'"
    (onRequest)="onRequest($event)"
    (getReport)="getReport($event)"
  ></app-report-menu>
</div>
<!--<app-report-additional-actions-->
<!--  [report]="'tech-ticket'"-->
<!--  [orientation]="'LANDSCAPE'"-->
<!--  [fileName]="'tech-ticket-report'"-->
<!--&gt;</app-report-additional-actions>-->
<!--  -->
<div
  class="loading"
  *ngIf="loadingInProgress"
></div>
<div
  class="qt-report__body"
  id="product-list-ticket-data"
>
  <div
    class="qt-report__product-list"
    *ngIf="!loadingInProgress"
  >
    <div
      class=""
      *ngIf="onInit"
    >
      <div class="qt-report__body-header">
        <h6 class="qt-fw-600 qt-color-dark">Tech Ticket Report</h6>
        <div
          class="body-m qt-color-dark-light"
            *ngIf="techTicketReport.startDate !== '' && techTicketReport.endDate !== ''"
          >
            <span>
              {{getDateForHeader(techTicketReport.startDate)}}
            </span>
              -
            <span>
              {{getDateForHeader(techTicketReport.endDate)}}
            </span>
        </div>
      </div>
      <table class="qt-report__body-table-body" *ngIf="onInit">
<!--        <nvd3-->
<!--          [options]="chartOptionsToggler"-->
<!--          [data]="chartData"-->
<!--        ></nvd3>-->
        <thead>
          <tr>
            <th class="qt-fw-600 qt-color-dark">Tech User</th>
            <th style="width: 135px;" class="qt-fw-600 qt-color-dark">Created Tickets</th>
            <th style="width: 135px;" class="qt-fw-600 qt-color-dark">Closed Tickets</th>
          </tr>
        </thead>
        <tbody>
          <tr class="qt-report__body-row">
            <td>Theresa Garcia</td>
            <td style="width: 135px;">63</td>
            <td style="width: 135px;">56</td>
          </tr>
          <tr class="qt-report__body-row">
            <td>Jeanette Elliott</td>
            <td style="width: 135px;">33</td>
            <td style="width: 135px;">22</td>
          </tr>
          <tr class="qt-report__body-row qt-fw-600">
            <td>Total</td>
            <td style="width: 135px;">{{techTicketReport.totalCreated}}</td>
            <td style="width: 135px;">{{techTicketReport.totalClosed}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
