<div>
    <app-report-menu
        [report]="'tech-ticket'"
        (onRequest)="onRequest($event)"
        (getReport)="getReport($event)"
    ></app-report-menu>
</div>
<app-report-additional-actions
    [report]="'tech-ticket'"
    [orientation]="'LANDSCAPE'"
    [fileName]="'tech-ticket-report'"
></app-report-additional-actions>
<!--  -->
<div
    class="loading"
    *ngIf="loadingInProgress"
></div>
<div
    class="product-list___ticket report-show-footer-header"
    id="product-list-ticket-data"
>
    <div
        class="product-list-ticket product-list-ticket-tech"
        style="padding: 0px;"
        *ngIf="!loadingInProgress"
    >
        <div
            class="customer-ticket"
            *ngIf="onInit"
        >
            <div class="customer-ticket__report">
                <div class="report-header">
                    <h5 class="qt-fw-600 qt-color-white">Tech Ticket Report</h5>
                    <div
                        class="company-info"
                        *ngIf="techTicketReport.startDate !== '' && techTicketReport.endDate !== ''"
                    >
                        <p>
                            <span>
                                {{getDateForHeader(techTicketReport.startDate)}}
                            </span>
                            -
                            <span>
                                {{getDateForHeader(techTicketReport.endDate)}}
                            </span>
                        </p>
                    </div>
                </div>
                <div *ngIf="onInit">
                    <div class="header-product-list-ticket">
                        <div class="header-product-list-ticket__title">Created Tickets vs Closed</div>
                    </div>
                    <nvd3
                        [options]="chartOptionsToggler"
                        [data]="chartData"
                    ></nvd3>
                    <div class="header-product-list-ticket clearfix">
                        <div class="ticket-total">
                            Total New Tickets:
                            <span>
                                {{techTicketReport.totalCreated}} tickets
                            </span>
                        </div>
                        <div class="ticket-total">
                            Completed Tickets:
                            <span>
                                {{techTicketReport.totalClosed}} tickets
                            </span>
                        </div>
                    </div>
                </div>
                <app-report-footer *ngIf="onInit"></app-report-footer>
            </div>
        </div>
    </div>
</div>
