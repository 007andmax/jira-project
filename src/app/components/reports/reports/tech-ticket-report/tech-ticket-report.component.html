<div>
    <app-report-menu
        [report]="'tech-ticket'"
        (onRequest)="onRequest($event)"
        (getReport)="getReport($event)"
    ></app-report-menu>
</div>
<div
    class="loading"
    *ngIf="loadingInProgress"
></div>
<div
    class="qt-report__body"
    id="product-list-ticket-data"
>
    <div
        class="qt-report__product-list"
        *ngIf="!loadingInProgress"
    >
        <div class>
            <div class="qt-report__body-header">
                <h6 class="qt-fw-600 qt-color-gray-900">Tech Ticket Report</h6>
                <div
                    class="body-m qt-color-gray-600"
                    *ngIf="techTicketReport.startDate !== '' && techTicketReport.endDate !== ''"
                >
                    <span>
                        {{getDateForHeader(techTicketReport.startDate)}}
                    </span>
                    -
                    <span>
                        {{getDateForHeader(techTicketReport.endDate)}}
                    </span>
                </div>
            </div>
            <table
                class="qt-report__body-table-body"
                *ngIf="onInit"
            >
                <thead>
                    <tr>
                        <th class="qt-fw-600 qt-color-gray-900">Tech User</th>
                        <th
                            style="width: 135px;"
                            class="qt-fw-600 qt-color-gray-900"
                        >
                            Created Tickets
                        </th>
                        <th
                            style="width: 135px;"
                            class="qt-fw-600 qt-color-gray-900"
                        >
                            Closed Tickets
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <ng-template
                        ngFor
                        let-item
                        [ngForOf]="techTicketReport.lines"
                        let-i="index"
                        [ngForTrackBy]="trackByIndex"
                    >
                        <tr class="qt-report__body-row">
                            <td>{{item.fullName}}</td>
                            <td style="width: 135px;">{{item.claimed}}</td>
                            <td style="width: 135px;">{{item.closed}}</td>
                        </tr>
                    </ng-template>
                    <tr class="qt-report__body-row qt-fw-600">
                        <td>Total</td>
                        <td style="width: 135px;">{{techTicketReport.totalClaimed}}</td>
                        <td style="width: 135px;">{{techTicketReport.totalClosed}}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
