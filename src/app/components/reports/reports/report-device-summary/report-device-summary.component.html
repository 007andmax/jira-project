<div>
  <div class="report-menu">
      <div class="run-report-content clearfix">
          <div class="new-reports-reverse">
              <button class="qt-btn --outline-white qt-ml-8" (click)="downloadCsv()">
                  <i class="icon__download qt-za-16 qt-sz-16 qt-dib qt-bg-contain summarydownload"></i>
              </button>
              <button class="qt-btn --outline-white qt-ml-8" (click)="printPdf()">
                  <i class="icon__print qt-sz-16 qt-bg-contain qt-mr-8 summaryprint"></i>
              </button>
              <button class="qt-btn --outline-white qt-ml-8">
                  <i class="icon__email-dark qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6 summaryemail"></i>
              </button>
              <button
                  class="qt-btn --outline-blue qt-ml-8"
                  (click)="getReportByDeviceSummary()"
              >
                  Get Report
              </button>
              <div class="form-group content custom-width dropdown-height">
                  <app-drop-down
                      [sort]="true"
                      [search]="true"
                      [change]="true"
                      [field]="'Description'"
                      [placeholder]="'All devices'"
                      [isDisabled]="!deviceSummaryReport.companyId"
                      [dropdownHeight]="'300px'"
                      [list]="devices"
                      (onSelectedItem)="onSelectDevice($event)"
                  ></app-drop-down>
              </div>
              <div class="grey-dropdown form-group content select-users-list">
                  <app-drop-down
                      [placeholder]="'Select Company'"
                      [list]="companies"
                      [validate]="validate.getCompany()"
                      [errorMessage]="'Please select the company name'"
                      [field]="'name'"
                      [search]="true"
                      [change]="true"
                      (onSelectedItem)="selectClient($event)"
                  ></app-drop-down>
              </div>
          </div>
      </div>
  </div>
</div>
<div *ngIf="loadingInProgress">
  <div class="device-header">
      <div>
          <span>{{ clientName }}</span>
      </div>
      <div>
          <span>
              <b>{{ "Device Summary Report" }}</b>
          </span>
      </div>
      <div>
        <span>
          {{ "As on" + " " + (date | date: DateFormat) }}
      </span>
      </div>
  </div>

  <div class="contant-area">
      <div class="table-wrap">
          <table class="dataTable cmn-tab-head">
              <thead>
                  <tr>
                      <th
                          class="device"
                          (click)="onFilter('name')"
                      >
                          Device Name
                          <span class="qt-table-modern__sorting"></span>
                      </th>
                      <th
                          class="s-name"
                          (click)="onFilter('manufacturer')"
                      >
                          Manufacturer
                          <span class="qt-table-modern__sorting"></span>
                      </th>
                      <th
                          class="pulisher"
                          (click)="onFilter('model')"
                      >
                          Model
                          <span class="qt-table-modern__sorting"></span>
                      </th>
                      <th class="version">Serial Number</th>
                  </tr>
              </thead>
              <tbody class="device-summary-report-table">
                  <tr *ngFor="let deviceSummary of deviceSummaryList">
                      <td class="device">{{deviceSummary.Name}}</td>
                      <td class="s-name">{{deviceSummary.Manufacturer}}</td>
                      <td class="pulisher">{{deviceSummary.Model}}</td>
                      <td class="version">{{deviceSummary.SerialNumber}}</td>
                  </tr>
              </tbody>
          </table>
      </div>
  </div>
</div>
