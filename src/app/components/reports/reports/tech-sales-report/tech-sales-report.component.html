<div>
  <app-report-menu
    [report]="'tech-sales'"
    (onRequest)="onRequest($event)"
    (getReport)="getReport($event)"
  ></app-report-menu>
</div>
<!--<app-report-additional-actions-->
<!--  [report]="'tech-sales'"-->
<!--  [orientation]="'LANDSCAPE'"-->
<!--  [fileName]="'tech-sales-report'"-->
<!--&gt;</app-report-additional-actions>-->
<!--  -->
<div
  class="loading"
  *ngIf="loadingInProgress"
></div>
<div
  class="qt-report__body"
  id="product-list-ticket-data"
>
  <div
    class="qt-report__product-list"
    *ngIf="!loadingInProgress"
  >
    <div
      class=""
      *ngIf="onInit"
    >
      <div class="qt-report__body-header">
        <h6 class="qt-fw-600 qt-color-dark">Tech Sales Report</h6>
        <div
          class="body-m qt-color-dark-light"
          *ngIf="techSalesReport.startDate !== '' && techSalesReport.endDate !== ''"
        >
          <span>
            {{getDateForHeader(techSalesReport.startDate)}}
          </span>
          -
          <span>
            {{getDateForHeader(techSalesReport.endDate)}}
          </span>
        </div>
      </div>
      <table class="qt-report__body-table-body" *ngIf="onInit">
<!--          <nvd3-->
<!--            [options]="chartOptionsToggler"-->
<!--            [data]="chartData"-->
<!--          ></nvd3>-->
        <thead>
          <tr>
            <th class="qt-fw-600 qt-color-dark ng-star-inserted">Tech User</th>
            <th style="width: 130px;" class="qt-fw-600 qt-color-dark ng-star-inserted" *ngIf="techSalesReport.selectedType.type =='BILLED_TIME'">Billed Time</th>
            <th style="width: 130px;" class="qt-fw-600 qt-color-dark ng-star-inserted" *ngIf="techSalesReport.selectedType.type =='PRODUCT_SOLD'">Products Sold</th>
          </tr>
        </thead>
        <tbody>
          <tr class="qt-report__body-row">
            <td>Theresa Garcia</td>
            <td style="width: 130px;">2.30</td>
          </tr>
          <tr class="qt-report__body-row">
            <td>Jeanette Elliott</td>
            <td style="width: 130px;">1.56</td>
          </tr>
          <tr class="qt-report__body-row qt-fw-600">
            <td>Total</td>
            <td style="width: 130px;" *ngIf="techSalesReport.selectedType.type == 'BILLED_TIME'">
              {{techSalesReport.total}} hour
            </td>
            <td style="width: 130px;" *ngIf="techSalesReport.selectedType.type == 'PRODUCT_SOLD'">
              ${{techSalesReport.total}}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
