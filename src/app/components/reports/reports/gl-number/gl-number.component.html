<div>
    <app-report-menu
        [report]="'income-accounts'"
        (onSelectedClient)="onSelectedClient($event)"
        (onRequest)="onRequest($event)"
        (getReport)="getReport($event)"
    ></app-report-menu>
</div>
<!-- <app-report-additional-actions [orientation]="(glNumber.getMonthlyDetailed()) ? 'LANDSCAPE' : 'PORTRAIT'"    [fileName]="'income_accounts'" [selectedClient]="selectedClient"></app-report-additional-actions> -->
<div
    class="loading"
    *ngIf="loadingInProgress"
></div>
<div
    class="product-list___ticket"
    id="product-list-ticket-data"
    *ngIf="!loadingInProgress"
>
    <div class="qt-report__body-header">
        <div
            class="body-m-sb qt-color-dark"
            [textContent]="(selectedClient) ? selectedClient.name : 'All companies'"
        ></div>
        <h6 class="qt-fw-600 qt-color-dark">Income accounts</h6>
        <div
            class="body-m qt-color-dark-light"
            *ngIf="list.length > 0"
        >
            <span [textContent]="perseStartDate()"></span>
            -
            <span [textContent]="perseEndDate()"></span>
        </div>
    </div>
    <div>
        <app-overview-report
            [headers]="headers"
            [list]="list"
        ></app-overview-report>
    </div>
</div>
