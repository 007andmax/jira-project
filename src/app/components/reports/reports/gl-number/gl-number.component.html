<div>
    <app-report-menu
        [report]="'income-accounts'"
        (onSelectedClient)="onSelectedClient($event)"
        (onRequest)="onRequest($event)"
        (getReport)="getReport($event)"
    ></app-report-menu>
</div>
<div
    class="loading"
    *ngIf="loadingInProgress"
></div>
<div
    class="product-list___ticket"
    id="product-list-ticket-data"
    *ngIf="!loadingInProgress"
>
    <div class="qt-report__body-header">
        <div
            class="body-m__sb qt-color-gray-900"
            [textContent]="(selectedClient) ? selectedClient.name : 'All companies'"
        ></div>
        <h6 class="qt-fw-600 qt-color-gray-900">Income Accounts</h6>
        <div
            class="body-m qt-color-gray-600"
            *ngIf="list.length > 0"
        >
            <span [textContent]="perseStartDate()"></span>
            -
            <span [textContent]="perseEndDate()"></span>
        </div>
    </div>
    <div>
        <app-overview-report
            [headers]="headers"
            [list]="list"
        ></app-overview-report>
    </div>
</div>
