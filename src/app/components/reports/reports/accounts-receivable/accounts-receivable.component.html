<div>
  <app-report-menu [report]="'accounts-receivable'" (onSelectedClient)="onSelectedClient($event)" (onRequest)="onRequest($event)" (getReport)="getReport($event)"></app-report-menu>
</div>
<!--<app-report-additional-actions  [fileName]="'accounts_receivable'" [selectedClient]="selectedClient"></app-report-additional-actions>-->
<div class="loading" *ngIf="loadingInProgress"></div>
<div class="qt-report__body" id="product-list-ticket-data" >

  <div  class="qt-report__product-list" *ngIf="!loadingInProgress">
    <div class="qt-report__body-header">
      <div class="body-m-sb qt-color-dark" [textContent]="(selectedClient) ? selectedClient.name : 'All companies'"></div>
      <h6 class="qt-fw-600 qt-color-dark">Accounts Receivable</h6>
      <div class="body-m-sb qt-color-dark" [textContent]="(accountsReceivable.clientCompanyName) ? accountsReceivable.clientCompanyName : 'All companies'"></div>
      <div *ngIf="accountsReceivable.lines.length > 0">
        <div class="qt-fw-600 body-m-sb qt-color-dark" [textContent]="accountsReceivable.techCompanyName"></div>
        <div class="body-m-sb qt-color-dark" *ngIf="accountsReceivable.type ==='DETAILED' ">Account Recivable for <span [textContent]="accountsReceivable.clientCompanyName"></span>
        </div>
      </div>
    </div>
    <div>
      <app-overview-report [headers]="headers" [list]="list"></app-overview-report>
    </div>
<!--    <app-report-footer></app-report-footer>-->
  </div>
</div>
