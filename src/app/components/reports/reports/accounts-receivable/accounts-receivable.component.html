<div>
    <app-report-menu
        [report]="'accounts-receivable'"
        (onSelectedClient)="onSelectedClient($event)"
        (onRequest)="onRequest($event)"
        (getReport)="getReport($event)"
    ></app-report-menu>
</div>
<div
    class="loading"
    *ngIf="loadingInProgress"
></div>
<div
    class="qt-report__body"
    id="product-list-ticket-data"
>
    <div
        class="qt-report__product-list"
        *ngIf="!loadingInProgress"
    >
        <div class="qt-report__body-header">
            <div
                class="body-m__sb qt-color-gray-900"
                [textContent]="(selectedClient) ? selectedClient.name : 'All companies'"
            ></div>
            <h6 class="qt-fw-600 qt-color-gray-900">Accounts Receivable</h6>
            <div *ngIf="accountsReceivable.reportData.length > 0">
                <div
                    class="qt-fw-600 body-m__sb qt-color-gray-900"
                    [textContent]="accountsReceivable.techCompanyName"
                ></div>
            </div>
        </div>
        <div>
            <table class="qt-report__body-table-body">
                <thead>
                    <tr>
                        <ng-template
                            ngFor
                            let-item
                            [ngForOf]="headers"
                            let-i="index"
                            [ngForTrackBy]="trackByIndex"
                        >
                            <th
                                [ngClass]="(classes.length > 0) ? classes[i] : ''"
                                [textContent]="item"
                                class="qt-fw-600 qt-color-gray-900"
                            ></th>
                        </ng-template>
                    </tr>
                </thead>
                <tbody class="qt-report__body-table-body">
                    <ng-template
                        ngFor
                        let-item
                        [ngForOf]="list"
                        let-i="index"
                        [ngForTrackBy]="trackByIndex"
                    >
                        <tr class="qt-report__body-row ng-star-inserted">
                            <ng-template
                                ngFor
                                let-child
                                [ngForOf]="item"
                                let-u="index"
                                [ngForTrackBy]="trackByIndex"
                            >
                                <td
                                    [ngClass]="child.class"
                                    [textContent]="child.value"
                                ></td>
                            </ng-template>
                        </tr>
                    </ng-template>
                </tbody>
            </table>
        </div>
    </div>
</div>
