<div>
  <app-report-menu [report]="'accounts-receivable'" (onSelectedClient)="onSelectedClient($event)" (onRequest)="onRequest($event)" (getReport)="getReport($event)"></app-report-menu>
 </div>
 <app-report-additional-actions  [fileName]="'accounts_receivable'" [selectedClient]="selectedClient"></app-report-additional-actions>
 <div class="loading" *ngIf="loadingInProgress"></div>
 <div class="product-list___ticket" id="product-list-ticket-data" >

  <div  class="product-list-ticket acc-col"   style="height: 100%;" *ngIf="!loadingInProgress">
    <div class="report-header"  >
       <h1>Accounts Receivable</h1>
       <div class="company-info">
         <h3  [textContent]="(selectedClient) ? selectedClient.name : 'All companies'"></h3>
         <!--  <p><span [textContent]="perseStartDate()"></span> - <span [textContent]="perseEndDate()"></span></p>-->
       </div>
     </div>

     <div class="report-header">
      <h1>Accounts Receivable</h1>
      <div class="company-info">
        <h3 [textContent]="(accountsReceivable.clientCompanyName) ? accountsReceivable.clientCompanyName : 'All companies'"></h3>
        <!-- <p><span>1 Dec 2018</span> - <span>31 Dec 2018</span></p> -->
      </div>
    </div>
    <div class="header-product-list-ticket" *ngIf="accountsReceivable.lines.length > 0">
      <!--HEADER-->
      <h5 class="qt-fw-600 qt-mb-6 qt-mt-20" [textContent]="accountsReceivable.techCompanyName"></h5>
      <p *ngIf="accountsReceivable.type ==='DETAILED' ">Account Recivable for <span [textContent]="accountsReceivable.clientCompanyName"></span>
      </p>
    </div>

     <div>
       <app-overview-report [headers]="headers" [list]="list"></app-overview-report>

     </div>
  <app-report-footer></app-report-footer>
   </div>
 </div>
