<div>
    <app-report-menu
        [report]="'byProducts'"
        (onSelectedClient)="onSelectedClient($event)"
        (onRequest)="onRequest($event)"
        (getReport)="getReport($event)"
    ></app-report-menu>
</div>

<div
    class="loading"
    *ngIf="loadingInProgress"
></div>
<div
    class="qt-report__body"
    id="product-list-ticket-data"
>
    <div
        class="qt-report__product-list"
        *ngIf="!loadingInProgress"
    >
        <div class="qt-report__body-header">
            <div
                class="client-company-name"
                *ngIf="productSalesReport.lines.length > 0"
            >
                <div
                    class="body-m-sb qt-color-dark"
                    *ngIf="productSalesReport.type ==='DETAILED' "
                >
                    {{ productSalesReport.clientCompanyName }}
                </div>
            </div>
            <div
                class="body-m-sb qt-color-dark"
                [textContent]="(productSalesReport.clientCompanyName) ? productSalesReport.clientCompanyName : 'All companies'"
            ></div>
            <h6 class="qt-fw-600 qt-color-dark">Product Sales Report</h6>
            <div
                class="body-m qt-color-dark-light"
                *ngIf="productSalesReport.init"
            >
                <span [textContent]="perseStartDate()"></span>
                -
                <span [textContent]="perseEndDate()"></span>
            </div>
            <div
                class="tech-company-name"
                *ngIf="productSalesReport.init"
            >
                <div class="body-m-sb qt-color-dark">
                    {{ productSalesReport.techCompanyName }}
                </div>
            </div>
        </div>
        <div>
            <app-overview-report
                [classes]="classes"
                [styles]="styles"
                [headers]="headers"
                [list]="list"
            ></app-overview-report>
        </div>
    </div>
</div>
