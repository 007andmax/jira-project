<div>
    <app-report-menu
        [report]="'byTaxes'"
        (onSelectedClient)="onSelectedClient($event)"
        (onRequest)="onRequest($event)"
        (getReport)="getReport($event)"
    ></app-report-menu>
</div>
<!-- <app-report-additional-actions -->
<!-- [fileName]="'taxes_report'" -->
<!-- [selectedClient]="selectedClient" -->
<!-- &gt;</app-report-additional-actions> -->
<div
    class="loading"
    *ngIf="loadingInProgress"
></div>
<div
    class="qt-report__body"
    id="product-list-ticket-data"
>
    <div
        class="qt-report__product-list"
        style="height: 100%;"
        *ngIf="!loadingInProgress"
    >
        <div class="qt-report__body-header">
            <div
                class="body-m-sb qt-color-dark"
                [textContent]="(selectedClient) ? selectedClient.name : 'All companies'"
            ></div>
            <h6 class="qt-fw-600 qt-color-dark">Tax Report</h6>
            <div
                class
                *ngIf="taxes.lines.length > 0"
            >
                <div
                    class="body-m-sb qt-color-dark"
                    [textContent]="taxes.techCompanyName"
                ></div>
            </div>
        </div>
        <div>
            <app-overview-report
                [headers]="headers"
                [list]="list"
            ></app-overview-report>
        </div>
    </div>
</div>
