<div>
    <app-report-menu
        [report]="'byCustomers'"
        (onSelectedClient)="onSelectedClient($event)"
        (onRequest)="onRequest($event)"
        (getReport)="getReport($event)"
    ></app-report-menu>
</div>
<div
    class="loading"
    *ngIf="loadingInProgress"
></div>
<div
    class="product-list___ticket product-list__ticket-customer-sales-report"
    id="product-list-ticket-data"
>
    <div *ngIf="!loadingInProgress">
        <div class="qt-report__body-header">
            <div class="body-m__sb qt-color-gray-900">
                {{customerSalesReport.clientCompanyName || 'All companies'}}
            </div>
            <h6 class="qt-fw-600 qt-color-gray-900">Customer Sales Report</h6>
            <div
                class="body-m qt-color-gray-600"
                *ngIf="customerSalesReport.init"
            >
                <span>
                    {{getDateForHeader(customerSalesReport.startDate)}}
                </span>
                -
                <span>
                    {{getDateForHeader(customerSalesReport.endDate)}}
                </span>
            </div>
            <div *ngIf="customerSalesReport.init">
                <!-- HEADER -->
                <div class="body-m__sb qt-color-gray-900">
                    {{ customerSalesReport.techCompanyName }}
                </div>
            </div>
        </div>
        <div>
            <app-overview-report
                class="customer-sales-report__table"
                [headers]="headers"
                [list]="list"
            ></app-overview-report>
            <div
                class="product-report-detail-customer clearfix"
                *ngIf="customerSalesReport.type === 'DETAILED'"
            >
                <div class="product-report-detail-customer__total">
                    <strong>
                        Total Sales:
                        <span [textContent]="parseTotal(customerSalesReport.totalSum)"></span>
                    </strong>
                </div>
            </div>
        </div>
    </div>
</div>
