<div class="report">
    <div class="report-header qt-df qt-ai-c qt-jc-sb">
  <div class="report-header-name" [textContent]="title"></div>
       <div class="qt-icon qt-sz-20" [ngClass]="img"></div>
    </div>
    <div class="report-body">
      
        <ul>
            <!-- ui-sref="byProducts" -->
            <ng-template
                ngFor
                let-item
                [ngForOf]="listTitles"
                let-i="index"
                [ngForTrackBy]="trackByIndex"
            >
                <li
                    class="content-report"
                    (click)="goToState(listStates[i])"
                    [textContent]="item"
                >
                </li>
            </ng-template>
        </ul>
    </div>
</div>
