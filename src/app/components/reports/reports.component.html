<div>
  <div class="report-page qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line">
      <div class="qt-page-list__header-title-line--left">
        <h3 class="qt-page-list__header-title" [textContent]="title"></h3>
      </div>
      <div class="qt-page-list__header-title-line--rigth">
        <div class="d-f ai-c">
          <div class="qt-page-list__search qt-ml-8 search-container">
            <input
              type="text"
              placeholder="Search Reports"
              (input)="search($event)"
            />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="outsideheader">
<div class="reports-all">
    <div
    class="col-sm-3"
    *ngIf="
      getPermissions('VIEW_SALES_REPORT') || getPermissions('VIEW_TAXES_REPORT')
    "
  >
    <app-report-list-item
      *ngIf="getPermissions('VIEW_SALES_REPORT')"
      [img]="'/html/assets/img/icons/Report-sales.svg'"
      [title]="'Sales'"
      [listTitles]="getListTitles('SALES')"
      [listStates]="getListStates('SALES')"
    ></app-report-list-item>
    <app-report-list-item
      *ngIf="getPermissions('VIEW_REMOTE_ACCESS_REPORT')"
      [img]="'/html/assets/img/icons/Report-Remoteaccess.svg'"
      [title]="'Remote Access'"
      [listTitles]="getListTitles('REMOTE_ACCESS')"
      [listStates]="getListStates('REMOTE_ACCESS')"
    ></app-report-list-item>
    <app-report-list-item
      [img]="'/html/assets/img/icons/report-tickets.svg'"
      [title]="'Income accounts'"
      [listTitles]="getListTitles('INCOME_ACCOUNTS')"
      [listStates]="getListStates('INCOME_ACCOUNTS')"
    ></app-report-list-item>
  </div>
  <div class="col-sm-3">
    <app-report-list-item
      *ngIf="getPermissions('VIEW_FINANCIAL_REPORT')"
      [img]="'/html/assets/img/icons/Report-Financial.svg'"
      [title]="'Financial'"
      [listTitles]="getListTitles('FINANCIAL')"
      [listStates]="getListStates('FINANCIAL')"
    ></app-report-list-item>
    <app-report-list-item
      [img]="'/html/assets/img/icons/report-tickets.svg'"
      [title]="'Tickets'"
      [listTitles]="getListTitles('TICKETS')"
      [listStates]="getListStates('TICKETS')"
    ></app-report-list-item>
  </div>
  <div class="col-sm-3" *ngIf="getPermissions('VIEW_PERFORMANCE_REPORT')">
    <app-report-list-item
      *ngIf="getPermissions('VIEW_PERFORMANCE_REPORT')"
      [img]="'/html/assets/img/icons/Report-Perforrmance.svg'"
      [title]="'Performance'"
      [listTitles]="getListTitles('PERFORMANCE')"
      [listStates]="getListStates('PERFORMANCE')"
    ></app-report-list-item>
    <app-report-list-item
      *ngIf="getPermissions('VIEW_PERFORMANCE_REPORT')"
      [img]="'/html/assets/img/icons/Report-Perforrmance.svg'"
      [title]="'Commissions'"
      [listTitles]="getListTitles('COMMISSIONS')"
      [listStates]="getListStates('COMMISSIONS')"
    ></app-report-list-item>
  </div>
  <div class="col-sm-3">
    <app-report-list-item
      *ngIf="getPermissions('VIEW_TAXES_REPORT')"
      [img]="'/html/assets/img/icons/Report-Taxes.svg'"
      [title]="'Taxes'"
      [listTitles]="getListTitles('TAXES')"
      [listStates]="getListStates('TAXES')"
    ></app-report-list-item>
    <app-report-list-item
      *ngIf="getPermissions('VIEW_DEVICES_REPORTS')"
      [img]="'/html/assets/img/icons/Report-Perforrmance.svg'"
      [title]="'Devices'"
      [listTitles]="getListTitles('DEVICES')"
      [listStates]="getListStates('DEVICES')"
    ></app-report-list-item>
  </div>
</div>
</div>
