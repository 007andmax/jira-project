<div
    class="report-footer"
    [ngStyle]="{'width': (orientation === 'LANDSCAPE') ? '1180px' : '' }"
>
    <p>
        Prepare by :
        <span [textContent]="currentUser.firstName + ' ' + currentUser.lastName"></span>
    </p>
    <p
        *ngIf="currentCompany"
        [textContent]="currentCompany.name"
    ></p>
    <p>
        Quicktech
        <span>2021</span>
        ©. All rights reserved
    </p>
</div>
