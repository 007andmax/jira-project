<div class="new-companies-content__modal send-modal-center">
    <div class="new-companies-content__modal--header">
        <h3>Write Draft for Companies
          <span>
            <button
                class="close-modal"
                (click)="close()"
            ></button>
          </span>
        </h3>
    </div>
    <div class="new-companies-content__modal--content">
        <draft-email-user-recipients
            [selectedClient]="selectedClient"
            [accountType]="accountType"
            [usersSelected]="usersSelected"
            (onCompanyEmails)="onChangeCompanyEmails($event)"
        ></draft-email-user-recipients>
        <div class="col-md-12 tab-btns">
            <div
                [ngClass]="{active: tab == 'plain'}"
                (click)="tab = 'plain'"
            >
                Plain Text
            </div>
        </div>
        <div
            class="col-md-12 editor-container"
            style="margin-top: 0;"
        >
            <!-- EDITOR -->
            <div style="position:relative;">
                <angular-editor
                    *ngIf="tab == 'plain'"
                    [(ngModel)]="messageContent"
                    [config]="editorConfig"
                ></angular-editor>
            </div>
        </div>
        <div class="col-md-12 new-companies-content__modal--content-footer">
            <div class="d-f">
                <button
                    class="btn-new btn-primary"
                    (click)="onSend()"
                >
                    Send Email
                </button>
                <button
                    class="btn-new disabled"
                    (click)="close()"
                >
                    Cancel
                </button>
            </div>
        </div>
    </div>
</div>
