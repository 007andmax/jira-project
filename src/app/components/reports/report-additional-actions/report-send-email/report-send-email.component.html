<div
    *ngIf="opened"
    class="qt-aside-modern draft-email-aside send-email-report"
>
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-title">Write Email</div>
        <div
            class="qt-aside-modern__header-close qt-icon icon__close"
            (click)="close()"
        ></div>
    </div>
    <div class="qt-aside-modern__content new-companies-content__modal--content">
        <div class="qt-inputs-row">
            <div
                class="qt-input-block"
                [ngClass]="{'--input-error':!validateReport.getSubject()}"
            >
                <div class="qt-input-block__label">Subject</div>
                <input
                    [(ngModel)]="draftReport.subject"
                    type="text"
                    maxlength="250"
                    placeholder="Write Subject line"
                    (input)="validateReport.resetSubject()"
                >
                <mat-error
                    class="invalid-feedback"
                    *ngIf="!validateReport.getSubject()"
                >
                    Subject is required
                </mat-error>
            </div>
        </div>
        <div class="qt-inputs-row draft-email-sidebar__select-users-container">
            <div class="qt-input-block">
                <div class="qt-input-block__label">Add Recipient</div>
                <draft-email-user-recipients
                    [usersSelected]="usersSelected"
                    [selectedClient]="selectedClient"
                    [accountType]="accountType"
                    [validate]="validateReport.getEmail()"
                    (onCompanyEmails)="onChangeCompanyEmails($event)"
                ></draft-email-user-recipients>
            </div>
        </div>
        <div class="draft-email-container">
            <div class="qt-w100 draft-email-sidebar__editor-tab">
                <div
                    class="draft-email-sidebar__editor-tab-item"
                    [ngClass]="{active: tab == 'plain'}"
                    (click)="tab = 'plain'"
                >
                    Plain Text
                </div>
            </div>
            <div class="qt-w100 editor-container qt-mt-0">
                <div
                    id="test-drag"
                    style="position:relative;"
                    [ngStyle]="{'height':((tab == 'plain') ? '100%' : 'auto')}"
                    *ngIf="tab == 'plain'"
                >
                    <div class="file-background">
                        <div class="file-background-mask"></div>
                        <div class="file-background-footer">
                            <p>Drop to Attach file</p>
                        </div>
                    </div>
                    <angular-editor
                        [(ngModel)]="messageContent"
                        [config]="editorConfig"
                    ></angular-editor>
                </div>
            </div>
        </div>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="qt-df qt-w100">
            <button
                class="qt-button --gray qt-mr-12 qt-w100 qt-jc-c"
                (click)="close()"
            >
                Cancel
            </button>
            <button
                class="qt-button qt-w100 qt-jc-c"
                appDisabledBtn
                #addBtn="disabled"
                (onClick)="onSend()"
            >
                <span *ngIf="!addBtn.isBlock()">Send Email</span>
                <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
            </button>
        </div>
    </div>
</div>
