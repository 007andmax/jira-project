<div class="qt-report__control-panel qt-ml-16">
    <div
        class="qt-report__control-panel-btn qt-df qt-ai-c qt-jc-c qt-mr-6 pointer"
        uib-tooltip="send mail"
        tooltip-placement="top"
        (click)="sendEmail()"
    >
      <div class="qt-sz-20 qt-icon icon__email-dark"></div>
    </div>
    <div
        class="qt-report__control-panel-btn qt-df qt-jc-c qt-ai-c qt-mr-6 pointer"
        uib-tooltip="print"
        tooltip-placement="top"
        (click)="getPdfIdFromRest(ACION_OPEN_PDF)"
    >
      <div class="qt-sz-20 qt-icon icon__print"></div>
    </div>
    <div
        class="qt-report__control-panel-btn qt-df qt-ai-c qt-jc-c pointer"
        ngbDropdown
        keyboard-nav="true"
        uib-tooltip="export"
        tooltip-placement="top"
    >
        <div class="qt-sz-20 qt-icon icon__export"></div>
        <div
            class="mask-dp pointer"
            ngbDropdownToggle
        ></div>
        <ul
            ngbDropdownMenu
            aria-labelledby="dropdown1"
            class="additional-dropdown"
        >
            <ng-template
                ngFor
                let-item
                [ngForOf]="listExport"
                let-i="index"
            >
                <li
                    class="open-pdf-btn "
                    ngbDropdownItem
                    [textContent]="item"
                    (click)="onSelectExport(item)"
                ></li>
            </ng-template>
        </ul>
    </div>
</div>
