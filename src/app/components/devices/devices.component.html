<div class="qt-page-list company-devices-page">
  <div class="qt-page-list__header --sticky">
      <div class="qt-page-list__header-title-line--left">
          <h3
              class="qt-page-list__header-title"
              [textContent]="'Devices'"
          ></h3>
                <div class="Rectangle">
                    <img src="/assets/img/icons/search.svg"
                  class="Online-Search">
                  <div class="SearchRectangle">
                    <mat-form-field class="example-chip-list" appearance="none">
                      <mat-chip-list #chipList>
                          <mat-chip *ngFor="let tag of selectedTag; let i=index" (removed)="remove(i)">
                            {{tag}}
                            <mat-icon
                          matChipRemove
                      >
                          cancel
                      </mat-icon>
                          </mat-chip>
                          <input autofocus
                  id="dropdownServices"
                  [(ngModel)]="tagFilterValue"
                  class="pointer"
                  [matChipInputFor]="chipList"
                  (keyup.enter)="add($event.target.value)"

              >
                      </mat-chip-list>
                    </mat-form-field>
                  </div>
                  <div class="StarRectangle">
                    <img src="/assets/img/device/favourite.svg"
     class="Favourite">
                  </div>
                </div>
      </div>

      <div class="qt-page-list__header-thead-container">
          <table class="qt-table-modern qt-page-list__header-thead">
              <thead>
                  <tr>
                      <th class="company-devices-table__check">
                          <div class="d-f">
                              <label class="qt-checkbox">
                                  <input
                                      type="checkbox"
                                      [(ngModel)]="selectAllDevices"
                                      (change)="toogleDevices()"
                                  >
                                  <span></span>
                              </label>
                          </div>
                      </th>
                      <th class="company-devices-table__device-type">
                      </th>
                      <th
                          class="company-devices-table__device-name pointer"
                      >
                          Device Name
                          <span class="qt-table-modern__sorting"></span>
                      </th>
                      <th class="company-devices-table__logged-user pointer">Logged in user</th>
                      <th class="company-devices-table__up-time">Up time</th>
                      <th class="company-devices-table__windows">Windows</th>
                      <th class="company-devices-table__ip-address">
                          <span class="qt-pl-30">IP address</span>
                      </th>
                      <th class="company-devices-table__device-agent">Agent</th>
                      <th class="company-devices-table__go-to"></th>
                      <th class="company-devices-table__connect"></th>
                      <th class="company-devices-table__menu"></th>
                  </tr>
              </thead>
          </table>
      </div>
  </div>
  <div class="qt-df qt-fd-c qt-jc-sb">
      <div class="qt-page-list__body">
          <div class="qt-page-list__body-table-container">
              <table class="qt-page-list__body-tbody qt-table-modern company-devices-table">
                  <tbody>
                      <tr class="company-device-hover" *ngFor="let asset of assetList">
                          <td class="company-devices-table__check">
                              <div class="d-f">
                                  <label class="qt-checkbox">
                                      <input
                                          type="checkbox"
                                          [(ngModel)]="asset.selected"
                                          (change)="onSelectDevice()"
                                      >
                                      <span></span>
                                  </label>
                              </div>
                          </td>
                          <td class="company-devices-table__device-type">
                            <div
                            ngbDropdown
                            placement="bottom-left"
                            container="body"
                            class="qt-ic-c qt-pointer device-type-icon qt-sz-24"
                            [ngClass]="{
            icon__computer:
            asset.iconName === 'Workstation' || !asset.iconName,
            icon__tablet: asset.iconName === 'Networking Hardware',
            icon__printer: asset.iconName === 'Printer',
            icon__server: asset.iconName === 'Server',
            '--ofline': !asset.online
          }"
                            ngbDropdownToggle
                        >
                            <div ngbDropdownMenu>
                                <ul class="
                icon-list
                qt-dropdown-menu
                --dropdown-icons
                device-type-dropdown
              ">
                                    <li
                                        *ngFor="let hardwar of hardwareTypes"
                                        (click)="setIcon(asset.ID, hardwar.ID)"
                                    >
                                        <span>
                                            <i
                                                class="qt-ic-c qt-pointer device-type-icon qt-sz-24"
                                                ngbDropdownItem
                                                [ngClass]="{
                      icon__computer:
                        hardwar.Name === 'Workstation' || !hardwar.Name,
                      icon__tablet:
                        hardwar.Name === 'Networking Hardware',
                      icon__printer: hardwar.Name === 'Printer',
                      icon__server: hardwar.Name === 'Server'
                    }"
                                            ></i>
                                        </span>
                                    </li>
                                </ul>
                            </div>
                        </div>
                          </td>
                          <td class="company-devices-table__device-name">
                            <div>
                              <div class="qt-df qt-fd-c">
                                  <div class="
                  company-devices-table-device-name
                  qt-ff-gm qt-df qt-ai-c
                ">
                                      <span [textContent]="asset.Title ? asset.Title: asset.Name"></span>
                                  </div>
                                  <span
                                      class="company-device-desc"
                                      [textContent]
                                  ></span>
                              </div>
                          </div>
                          </td>
                          <td class="company-devices-table__logged-user">
                            <div class="qt-df qt-fd-c">
                              <span
                                  class="logged-name qt-ff-gm"
                                  [textContent]="asset.CurrentUser || ''"
                              ></span>
                              <span
                                  class="logged-time"
                                  *ngIf="asset.IdelTime"
                              >
                                  Idle:
                                  <span>{{ asset.IdelTime }}</span>
                              </span>
                          </div>
                          </td>
                          <td class="company-devices-table__up-time">
                            <div class="qt-df qt-fd-c">
                              <span>
                                  <span>{{ asset.IdelTime }}</span>
                                  <ng-template
                                      #tipOfflineDevice
                                      class="tooltip"
                                  >
                                      <span>{{ asset.IdelTime }}</span>
                                  </ng-template>
                              </span>
                              <span
                                  *ngIf="
                asset.IdelTime != '' &&
                asset.IdelTime != undefined &&
                asset.IdelTime != null
              "
                                  class="uptime-tag qt-ff-gm"
                                  [textContent]="'Online'"
                              ></span>
                              <span
                                  *ngIf="
                asset.IdelTime == '' ||
                asset.IdelTime == undefined ||
                asset.IdelTime == null
              "
                                  placement="top"
                                  container="body"
                                  [ngbTooltip]="tipOfflineDevice"
                                  class="uptime-tag qt-ff-gm --offline"
                                  [textContent]="'Offline'"
                              ></span>
                          </div>
                          </td>
                          <td class="company-devices-table__windows">
                            <span
                            class="company-devices-table__ip-windows-text"
                            [textContent]="asset.Caption"
                        ></span>
                          </td>
                          <td class="company-devices-table__ip-address">
                            <span
                            class="qt-pl-30 company-devices-table__ip-address-text"
                            [textContent]="asset.InternalIPAddress"
                            ></span>
                          </td>
                          <td class="company-devices-table__device-agent">
                            <div class="qt-df qt-fd-c">
                              <span>
                                <span>{{ asset.InstallDate | date: 'dd/MM/yyyy' }}</span>
                            </span>
                            <span
                                *ngIf="asset.IsAgentCurrent"
                                class="agent-tag qt-ff-gm"
                            >{{asset.CurrentVersion}}</span>
                            <span
                                *ngIf="!asset.IsAgentCurrent"
                                class="agent-tag qt-ff-gm --offline"
                            >{{asset.CurrentVersion}}</span>

                          </div>
                          </td>
                          <td class="company-devices-table__go-to"></td>
                          <td class="company-devices-table__connect"></td>
                          <td class="company-devices-table__menu"></td>
                      </tr>
                  </tbody>
              </table>
          </div>
          <div
              class="loading"
              *ngIf="showPreloader"
          ></div>
      </div>
  </div>
</div>
