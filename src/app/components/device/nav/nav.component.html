<div class="header-top">
    <div class="avn-dental">
        <span class="av-short">
            {{commonServices.getCharacter(currentCompany) || ''}}
        </span>
    </div>
    <h5>{{currentCompany}}</h5>
    <div class="user-info-hp">
        <span class="user-hp-dp">
            <img
                [src]="imgUrl"
                alt="user"
            >
        </span>
        <div class="user-log-info">
            <h6>{{currentUser}}</h6>
            <span>logged in user</span>
        </div>
        <span class="user-status online">online</span>
    </div>
</div>
<nav>
    <ul class="list-unstyled">
        <li
            [routerLinkActive]="['active']"
            [routerLinkActiveOptions]="{ exact: true }"
        >
            <a (click)="goToDashboard()">Dashboard</a>
        </li>
        <li
            [routerLinkActive]="['active']"
            *ngIf="deviceType !== 'printer'"
        >
            <a (click)="goToHardware()">Hardware</a>
        </li>
        <li
            [routerLinkActive]="['active']"
            *ngIf="deviceType !== 'printer'"
        >
            <a (click)="goToSoftware()">Software list</a>
        </li>
        <li [routerLinkActive]="['active']">
          <a (click)="goToStartProgrames()">Startup Programmes</a>
        </li>
        <li [routerLinkActive]="['active']">
          <a (click)="goToServices()">Services</a>
        </li>
        <li [routerLinkActive]="['active']">
          <a (click)="goToAntivirus()">Antivirus</a>
        </li>
        <li [routerLinkActive]="['active']">
          <a (click)="goToTerminal()">Terminal</a>
        </li>
        <li [routerLinkActive]="['active']">
          <a (click)="goToWindowUpdate()">Window Update</a>
        </li>
        <li [routerLinkActive]="['active']">
          <a (click)="goToFileExplorer()">File Explorer</a>
        </li>
        <li [routerLinkActive]="['active']">
          <a (click)="goToPasswords()">Passwords</a>
        </li>
    </ul>
</nav>
