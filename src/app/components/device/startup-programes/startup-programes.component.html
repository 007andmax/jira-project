<main>
  <div class="cmn-wrapper">
      <div class="device-container">
          <div class="page-container startup-list">
              <!-- Page Title -->
              <div class="page-header">
                  <h3>Startup Programs</h3>
                  <div class="page-header-opt">
                      
                  </div>
                  <div class="download-print">
                      <form method="GET">
                          <input
                              type="search"
                              class="form-input"
                              [(ngModel)]="search"
                              name="search"
                              placeholder="Search Software…"
                              autocomplete="off"
                          >
                      </form>
                      <a
                          (click)="printPdf();"
                          data-tooltip="Print"
                      >
                          <img src="/html/assets/img/device/print.svg">
                      </a>
                      <a
                          (click)="downloadCsv();"
                          data-tooltip="Download CSV"
                      >
                          <img src="/html/assets/img/device/download_csv.svg">
                      </a>
                  </div>
              </div>
              <!-- Page Content -->
              <div class="contant-area">
                  <div class="table-wrap">
                      <table
                          #dataTable
                          datatable
                          *ngIf="startupList"
                          class="dataTable cmn-tab-head"
                      >
                          <thead>
                              <tr>
                                  <th
                                      class="s-name"
                                      (click)="onFilter('Name')"
                                  >
                                      Name
                                      <span class="qt-table-modern__sorting"></span>
                                  </th>
                                  <th
                                      class="command"
                                      (click)="onFilter('Command')"
                                  >
                                      Command
                                      <span class="qt-table-modern__sorting"></span>
                                  </th>
                                  <th
                                      class="user"
                                      (click)="onFilter('User')"
                                  >
                                      User
                                      <span class="qt-table-modern__sorting"></span>
                                  </th>                                 
                              </tr>
                          </thead>
                          <tbody class="startup-table">
                              <tr *ngFor="let item of startupList | serv: search; let i = index;">
                                  
                                  <td class="s-name">
                                      <h5>{{item.Name || 'N/A'}}</h5>
                                  </td>
                                  <td class="command">{{item.Command || 'N/A'}}</td>
                                  <td class="user">{{item.User || 'N/A'}}</td>
                                  
                              </tr>
                          </tbody>
                      </table>
                  </div>
              </div>
          </div>
      </div>
  </div>
</main>
<div
  class="loading"
  *ngIf="loading"
></div>
