<div
    class="user-detail-aside__header-avatar"
    [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
    [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
></div>
<div>
    <div class="qt-df qt-ai-c">
        <div class="user-detail-aside__header-company">
            <span [textContent]="ticketsListService.getUserName(user)"></span>
        </div>
    </div>
    <div class="user-detail-aside__header-info">
        <span [textContent]="user.designation"></span>
    </div>
    <div class="user-detail-aside__header-info">
        <span [textContent]="user.portalAccessStatus"></span>
    </div>
</div>
<div>
    <button class="qt-button --md">
        <span class="qt-icon icon__add qt-sz-16 qt-icon__white qt-dib qt-mr-8"></span>
        Add to a New Company
    </button>
    <div
        class="qt-button-square qt-button-square__prepend pointer"
        *ngIf="!user.deletedAt && !customerPortalStateService.isCustomerPortal"
        (click)="showAsideForDraftEmail()"
        (mouseenter)="draftEmailTooltip.show($event.target)"
        (mouseleave)="draftEmailTooltip.hide()"
    >
        <app-dynamic-tooltip
            [content]="'Draft Email'"
            [position]="'top'"
            #draftEmailTooltip
        ></app-dynamic-tooltip>
        <div class="qt-icon icon__email qt-sz-16 pointer qt-bg-contain"></div>
    </div>
    <div
        ngbDropdown
        [container]="'body'"
    >
        <div
            class="qt-button-square qt-button-square__afterpend pointer"
            id="dropdownBasic1"
            ngbDropdownToggle
        >
            <div class="qt-ic-c qt-icon icon__more qt-pointer qt-sz-16 qt-bg-contain"></div>
        </div>
        <ul
            class="qt-dropdown-menu"
            ngbDropdownMenu
            aria-labelledby="dropdownBasic1"
        >
            <li
                class="pointer"
                *ngIf="!showArchivedUsers && (getPermissions('EDIT_USERS') || customerPortalStateService.checkEditUser(usersStateService.getCurrentUser(),user))"
                (click)="edit()"
                ngbDropdownItem
            >
                <div class="qt-icon icon__edit qt-bg-contain qt-sz-20 qt-mr-12"></div>
                Edit
            </li>
            <li
                class="pointer"
                *ngIf="!showArchivedUsers && getPermissions('EDIT_USERS') && type !== TYPE_LIST_MARKETING_USERS && (user.portalAccessStatus == 'Unauthorized' || user.portalAccessStatus == 'Invite sent')"
                (click)="sendInvite(user.primaryEmail)"
                ngbDropdownItem
            >
                <div class="qt-icon icon__email qt-sz-20 qt-bg-contain pointer qt-mr-10"></div>
                Send Invite
            </li>
            <li
                class="pointer"
                *ngIf="type == TYPE_LIST_COMPANY_USERS && !isPrimaryContact()"
                (click)="resetPrimaryContact()"
                ngbDropdownItem
            >
                <div class="qt-icon icon__permission-role qt-sz-20 qt-mr-12"></div>
                Set as Primary contact
            </li>
            <li
                class="pointer qt-dropdown-menu__item-red qt-dropdown-menu__top-line"
                *ngIf="currentUser && (!customerPortalStateService.isCustomerPortal && currentUser.checkPermission('ARCHIVE_USERS') ||  customerPortalStateService.checkEditUser(usersStateService.getCurrentUser(),user) && !isPrimaryContact())  && !showArchivedUsers"
                (click)="delete()"
                ngbDropdownItem
            >
                <div class="qt-icon icon__delete qt-icon__red-600 qt-bg-contain qt-sz-20 qt-mr-12"></div>
                Archive
            </li>
            <li
                class="pointer qt-dropdown-menu__item-red qt-dropdown-menu__top-line"
                *ngIf="currentUser && currentUser.checkPermission('ARCHIVE_USERS') && showArchivedUsers"
                (click)="restore()"
                ngbDropdownItem
            >
                <div class="qt-icon icon__archive-red qt-bg-contain qt-sz-20 qt-mr-12"></div>
                Restore
            </li>
        </ul>
    </div>
</div>
