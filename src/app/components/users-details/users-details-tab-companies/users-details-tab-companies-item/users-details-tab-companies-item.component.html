<div
    class="qt-table-modern__row qt-table-modern__row--height-auto"
    [ngClass]="{'--selected': customerCompaniesInfo.selected}"
>
    <div class="users-table__check">
        <div class="qt-df">
            <label
                class="qt-checkbox"
                [attr.for]="'customerCompaniesInfo-' + customerCompaniesInfo.id"
            >
                <input
                    [attr.id]="'customerCompaniesInfo-' + customerCompaniesInfo.id"
                    [(ngModel)]="customerCompaniesInfo.selected"
                    type="checkbox"
                    (change)="selectUser($event)"
                >
                <span></span>
            </label>
        </div>
    </div>
    <div class="users-table__name">
        <div>
            <span class="qt-icon icon__companies qt-sz-16 qt-dib"></span>
        </div>
        <span [textContent]="customerCompaniesInfo.clientCompanyName"></span>
    </div>
    <div class="users-table__company qt-fd-c qt-ai-fs qt-jc-c">
        <app-drop-down
            #jobTitleDp
            [placeholder]="'Select Job Title'"
            [list]="jobTitleList"
            [field]="'name'"
            [search]="true"
            [change]="true"
            [editItem]="customerCompaniesInfo.jobTitleDto"
            (onSelectedItem)="onSelectJobTitle($event)"
        ></app-drop-down>
    </div>
    <div class="users-table__email ellipsis">
        <user-table-default-subscription
            class="users-table__subscription--dropdown"
            (onChangeDefault)="onChangeDefaultSubscriptions($event)"
            [defaultSubscriptions]="defaultSubscriptions"
        >
        </user-table-default-subscription>
    </div>
    <div
        class="users-table__industry qt-fd-c qt-ai-fs qt-jc-c ellipsis"
        [textContent]="(primaryContact) ? primaryContact.primaryEmail : ''"
    ></div>
    <div
        class="users-table__contract-no qt-fd-c qt-ai-fs qt-jc-c"
        (click)="showDetailUser()"
    >
        <ng-template
            ngFor
            let-phone
            [ngForOf]="primaryPhone"
            [ngForTrackBy]="trackById"
        >
            <div class="qt-df qt-ai-c">
                <div>
                    <div
                        [ngClass]="{'icon__old-phone':phone.typeNumber == 'FAX',
                        'icon__mobile':phone.typeNumber == 'MOBILE',
                         'icon__phone':phone.typeNumber == 'OFFICE'}"
                        class="qt-za-16 qt-sz-16 qt-bg-contain qt-fs-0 qt-mr-6 qt-icon"
                    ></div>
                </div>
                <preview-phone-mask
                    [class]="'users-table__contract-no--number'"
                    *ngIf="phone.number"
                    [number]="phone.number"
                ></preview-phone-mask>
            </div>
        </ng-template>
    </div>
    <div class="users-table__portal-status">
        <app-drop-down
            [placeholder]="'Select Job Title'"
            [list]="portalAccessList"
            [search]="true"
            [change]="true"
            [editItem]="user.portalAccessStatus"
            (onSelectedItem)="onSelectPortalAccessStatus($event)"
        ></app-drop-down>
    </div>
</div>
