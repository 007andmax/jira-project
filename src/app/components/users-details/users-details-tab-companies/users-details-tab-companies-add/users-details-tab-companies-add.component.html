<div class="qt-table-modern__row qt-table-modern__row--height-auto add-customer-companies-info">
    <div class="users-table__check">
        <div
            class="add-company-icon-container qt-df qt-ai-c qt-jc-c"
            [ngClass]="{'add-company-icon-container-disable':!customerCompaniesInfo.companyId}"
            placement="top"
            container="body"
            ngbTooltip="You have to select company"
            [disableTooltip]="customerCompaniesInfo.companyId"
            appDisabledBtn
            #addBtn="disabled"
            (onClick)="addCompany()"
        >
            <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
            <span
                class="qt-icon icon__done qt-sz-16 qt-dib"
                *ngIf="!addBtn.isBlock()"
            ></span>
        </div>
    </div>
    <div class="users-table__company-full">
        <div class="company-icon-container qt-df qt-ai-c qt-jc-c qt-mr-8">
            <span class="qt-icon icon__companies qt-sz-16 qt-dib"></span>
        </div>
        <company-drop-down
            class="users-details-select-company"
            [container]="'body'"
            [placeholder]="'Select Company'"
            [errorMessage]="'The company name is required'"
            [field]="'name'"
            [search]="true"
            [change]="true"
            [isBlockClear]="true"
            (onSelectedItem)="onSelectCompany($event)"
            [dropdownWidth]="'400px'"
            [heightInput]="'32px'"
        >
        </company-drop-down>
    </div>
    <div class="users-table__industry qt-fd-c qt-ai-fs qt-jc-c">
        <app-drop-down
            #jobTitleDp
            [class]="['qt-dropdown']"
            [heightInput]="'32px'"
            [placeholder]="'Select Job Title'"
            [list]="jobTitleList"
            [field]="'name'"
            [search]="true"
            [change]="true"
            (onSelectedItem)="onSelectJobTitle($event)"
        ></app-drop-down>
    </div>
    <div class="users-table__contract-no">
        <user-table-default-subscription
            class="users-table__subscription--dropdown"
            (onChangeDefault)="onChangeDefaultSubscriptions($event)"
            [defaultSubscriptions]="defaultSubscriptions"
        >
        </user-table-default-subscription>
    </div>
    <div class="users-table__tickets">
        <div class="qt-df">
            <label
                class="qt-checkbox"
                [attr.for]="'eligibleForTicket-add'"
            >
                <input
                    [attr.id]="'eligibleForTicket-add'"
                    [(ngModel)]="customerCompaniesInfo.eligibleForTicket"
                    type="checkbox"
                >
                <span></span>
            </label>
        </div>
    </div>
    <div class="users-table__primary qt-fd-c qt-ai-fs qt-jc-c">
        <ng-template
            ngFor
            let-phone
            [ngForOf]="primaryPhone"
        >
            <div class="qt-df qt-ai-c">
                <div>
                    <div
                        [ngClass]="{'icon__old-phone':phone.typeNumber == 'FAX',
                        'icon__mobile':phone.typeNumber == 'MOBILE',
                         'icon__phone':phone.typeNumber == 'OFFICE'}"
                        class="qt-za-16 qt-sz-16 qt-bg-contain qt-fs-0 qt-mr-6 qt-icon"
                    ></div>
                </div>
                <preview-phone-mask
                    [class]="'users-table__contract-no--number'"
                    *ngIf="phone.number"
                    [number]="phone.number"
                ></preview-phone-mask>
            </div>
        </ng-template>
    </div>
    <div class="users-table__portal-status">
        <app-drop-down
            #userRolesDP
            [class]="['qt-dropdown']"
            [heightInput]="'32px'"
            *ngIf="customerRoleStateService.isGetUserRole"
            [placeholder]="'Select role'"
            [list]="userRoles"
            [field]="'name'"
            [search]="true"
            [change]="true"
            (onSelectedItem)="onSelectPortalAccessStatus($event)"
        ></app-drop-down>
    </div>
</div>
