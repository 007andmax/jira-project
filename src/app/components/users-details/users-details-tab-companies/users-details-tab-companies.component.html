<div class="qt-page-list users-page qt-df">
    <div class="qt-page-list__body">
        <div class="qt-page-list__container">
            <div class="qt-page-list__body">
                <!-- New Header -->
                <div class="qt-page-list__header-thead-container">
                    <div class="qt-table-modern qt-page-list__header-thead">
                        <div class="qt-page-list__header-thead__row">
                            <div class="users-table__check">
                                <div class="qt-df">
                                    <label
                                        class="qt-checkbox"
                                        for="all-users"
                                    >
                                        <input
                                            id="all-users"
                                            [(ngModel)]="selectAll"
                                            (change)="toggleAllUser($event)"
                                            type="checkbox"
                                        >
                                        <span></span>
                                    </label>
                                </div>
                            </div>
                            <div
                                class="users-table__company-full qt-pointer"
                                (click)="sortCompanies()"
                            >
                                Company
                                <span class="qt-table-modern__sorting"></span>
                            </div>
                            <div class="users-table__industry">Job Title</div>
                            <div class="users-table__contract-no">Subscription</div>
                            <div class="users-table__tickets pointer">Display in tickets</div>
                            <div class="users-table__primary pointer">Primary Contact</div>
                            <div class="users-table__portal-status pointer">Portal Access</div>
                        </div>
                    </div>
                </div>
                <!-- / New Header -->
                <div class="qt-page-list__body-table-container">
                    <div class="qt-page-list__body-tbody qt-table-modern users-table">
                        <div class="tbody">
                            <app-users-details-tab-companies-add
                                *ngIf="isShowAdd"
                                [user]="user"
                                (onClose)="isShowAdd = false"
                            ></app-users-details-tab-companies-add>
                            <ng-template
                                ngFor
                                let-customerCompaniesInfo
                                [ngForOf]="user.customerCompaniesInfo"
                                [ngForTrackBy]="trackByCompanyId"
                            >
                                <app-users-details-tab-companies-item
                                    [customerCompaniesInfo]="customerCompaniesInfo"
                                    [user]="user"
                                    (onUpdate)="updateUser()"
                                    (onSelect)="onSelectCustomerCompaniesInfo()"
                                ></app-users-details-tab-companies-item>
                            </ng-template>
                        </div>
                    </div>
                    <div
                        class="no-exist-elements"
                        *ngIf="user.customerCompaniesInfo.length == 0"
                    >
                        We couldn't find any results
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
