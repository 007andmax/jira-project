<div class="qt-table-modern__row qt-table-modern__row--height-auto">
    <div class="users-table__company-full">
        <div class="qt-df qt-ai-fs">
            <div
                *ngIf="item.template.name === 'OFFICE_365_ACCOUNT' && item.isDefaultType()"
                class="qt-icon icon__office-365 qt-za-16 qt-sz-16 qt-mr-8"
            ></div>
            <div
                *ngIf="item.template.name === 'GENERIC' && item.isDefaultType()"
                class="qt-icon icon__globe qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
            ></div>
            <div
                *ngIf="item.template.name === 'LOCAL_USER_ACCOUNT' && item.isDefaultType()"
                class="qt-icon icon__my-profile qt-za-16 qt-sz-16 qt-mr-8"
            ></div>
            <div
                *ngIf="item.template.name === 'EMAIL_ACCOUNT' && item.isDefaultType()"
                class="qt-icon icon__email qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
            ></div>
            <div
                *ngIf="item.template.name === 'WIFI_NETWORK' && item.isDefaultType()"
                class="qt-icon icon__wifi-network qt-za-16 qt-sz-16 qt-mr-8"
            ></div>
            <div
                *ngIf="item.template.name === 'AGENT' && item.isDefaultType()"
                class="qt-icon icon__agent qt-za-16 qt-sz-16 qt-mr-8"
            ></div>
            <div
                *ngIf="item.template.name === 'DEVICE' && item.isDefaultType()"
                class="qt-icon icon__devices qt-za-16 qt-sz-16 qt-mr-8"
            ></div>
            <div
                *ngIf="item.template.name === 'MICROSOFT_ACCOUNT' && item.isDefaultType()"
                class="qt-icon icon__microsoft qt-za-16 qt-sz-16 qt-mr-8"
            ></div>
            <div
                *ngIf="item.template.name === 'HOSTING' && item.isDefaultType()"
                class="qt-icon icon__hosting qt-za-16 qt-sz-16 qt-mr-8"
            ></div>
            <div
                *ngIf="!item.isDefaultType()"
                class="qt-icon icon__custom-category qt-za-16 qt-sz-16 qt-mr-8"
            ></div>
            <div class="user-data">
                <span [textContent]="item.username"></span>
                <div class="user-password">
                    <span
                        *ngIf="togglePassword"
                        [textContent]="item.password"
                    ></span>
                    <span
                        *ngIf="!togglePassword"
                        class="active"
                    >
                        •••••
                    </span>
                </div>
            </div>
        </div>
    </div>
    <div class="users-table__industry qt-fd-c qt-ai-fs qt-jc-c">
        <div class="user-action">
            <div class="user-password">
                <div
                    *ngIf="!togglePassword && getPermissions('VIEW_PASSWORD')"
                    class="qt-icon icon__show qt-za-16 qt-sz-16 qt-bg-contain qt-ml-6 pointer"
                    (click)="showPassword()"
                ></div>
                <div
                    *ngIf="togglePassword"
                    class="qt-icon icon__hide qt-za-16 qt-sz-16 qt-ml-6 pointer"
                    (click)="togglePassword = false"
                ></div>
                <div
                    class="qt-icon icon__copy qt-za-16 qt-sz-16 qt-bg-contain qt-ml-16 pointer"
                    *ngIf="togglePassword"
                    (click)="copy(item.password)"
                ></div>
            </div>
        </div>
    </div>
</div>
