<div class="qt-page-list users-page qt-df qt-pos-rel">
    <div
        class="qt-page-list__body"
        #content
    >
        <div class="qt-page-list__container">
            <div class="qt-page-list__body">
                <!-- New Header -->
                <div class="qt-page-list__header-thead-container">
                    <div class="qt-table-modern qt-page-list__header-thead">
                        <div class="qt-page-list__header-thead__row">
                            <div class="users-table__company-full">Subject</div>
                            <div class="users-table__industry">Status</div>
                            <div class="users-table__contract-no">Created date</div>
                        </div>
                    </div>
                </div>
                <!-- / New Header -->
                <div
                    class="qt-page-list__body-table-container"
                    [ngStyle]="{'padding-bottom': (showPendingPreloader) ? '65px' : '0px'}"
                >
                    <div class="qt-page-list__body-tbody qt-table-modern users-table">
                        <div
                            class="tbody"
                            infiniteScroll
                            [infiniteScrollContainer]="content"
                            [infiniteScrollDistance]="2"
                            [infiniteScrollThrottle]="15"
                            [infiniteScrollDisabled]="infiniteScrollDisabled"
                            [fromRoot]="true"
                            (scrolled)="onScroll()"
                        >
                            <ng-template
                                ngFor
                                let-ticket
                                [ngForOf]="tickets"
                                [ngForTrackBy]="trackById"
                            >
                                <app-users-details-tab-tickets-item
                                    (click)="editTicket(ticket.id)"
                                    [listColors]="listColors"
                                    [ticketsStatus]="ticketsStatus"
                                    [ticket]="ticket"
                                ></app-users-details-tab-tickets-item>
                            </ng-template>
                        </div>
                    </div>
                    <div
                        class="loading loading--without-text"
                        *ngIf="showPreloader"
                    ></div>
                    <div
                        class="no-exist-elements"
                        *ngIf="!showPreloader && tickets.length == 0"
                    >
                        We couldn't find any results
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
