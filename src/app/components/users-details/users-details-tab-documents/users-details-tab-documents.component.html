<div class="qt-page-list users-page qt-df qt-pos-rel">
    <div class="qt-page-list__body">
        <div class="qt-page-list__container">
            <div class="qt-page-list__body">
                <!-- New Header -->
                <div class="qt-page-list__header-thead-container">
                    <div class="qt-table-modern qt-page-list__header-thead">
                        <div class="qt-page-list__header-thead__row">
                            <div class="users-table__company-full">Title</div>
                            <div class="users-table__industry">Create By</div>
                            <div class="users-table__contract-no">Created Date</div>
                            <div class="users-table__tickets pointer">Review Date</div>
                            <div class="users-table__portal-status pointer"></div>
                        </div>
                    </div>
                </div>
                <!-- / New Header -->
                <div class="qt-page-list__body-table-container">
                    <div class="qt-page-list__body-tbody qt-table-modern users-table">
                        <div class="tbody">
                            <ng-template
                                ngFor
                                let-item
                                [ngForOf]="list"
                                [ngForTrackBy]="trackById"
                            >
                                <app-users-details-tab-documents-item
                                    [item]="item"
                                    (onRemoveCategory)="onRemoveCategory($event)"
                                    (onRemoveDocument)="onRemoveDocument($event)"
                                >
                                </app-users-details-tab-documents-item>
                            </ng-template>
                        </div>
                    </div>
                    <div
                        class="loading loading--without-text"
                        *ngIf="showPreloader"
                    ></div>
                    <div
                        class="no-exist-elements"
                        *ngIf="!showPreloader && list.length === 0"
                    >
                        No documents
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<documents-templates-info></documents-templates-info>
