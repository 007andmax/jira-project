<div class="qt-page-list file-manager-page">
    <app-file-manager-header
        [isShowCompanyArchived]="true"
        (onSort)="onSort($event)"
        (onChangeArchived)="onChangeArchived($event)"
    ></app-file-manager-header>
    <div class="qt-page-list-container qt-df">
        <div
            class="qt-page-list__body"
            [ngClass]="{'qt-page-list__body-color':!showPreloader}"
        >
            <div class="qt-page-list__body-table-container">
                <div class="qt-page-list__body-tbody qt-table-modern documents-table">
                    <div
                        class="tbody"
                        *ngIf="sort == 'Name'"
                    >
                        <div class="qt-df categories-container">
                            <ng-template
                                ngFor
                                let-item
                                [ngForOf]="categories"
                                [ngForTrackBy]="trackById"
                            >
                                <app-file-manager-item-category
                                    [item]="item"
                                    class
                                    (onRemove)="onRemoveCategory($event)"
                                    (onFileInfo)="onCategoryInfo($event)"
                                ></app-file-manager-item-category>
                            </ng-template>
                        </div>
                    </div>
                    <div
                        class="tbody"
                        *ngIf="sort == 'Date'"
                    >
                        <div class="qt-df categories-container">
                            <ng-template
                                ngFor
                                let-item
                                [ngForOf]="categories"
                                [ngForTrackBy]="trackById"
                            >
                                <app-file-manager-item-category
                                    [item]="item"
                                    class
                                    (onRemove)="onRemoveCategory($event)"
                                    (onFileInfo)="onCategoryInfo($event)"
                                ></app-file-manager-item-category>
                            </ng-template>
                        </div>
                    </div>
                </div>
                <div
                    class="no-exist-elements"
                    *ngIf="!showPreloader && categories.length == 0 && files.length == 0"
                >
                    We couldn't find any results
                </div>
                <div
                    class="loading"
                    *ngIf="showPreloader"
                ></div>
            </div>
        </div>
        <div
            class="aside-filters"
            *ngIf="toggleFileInfo"
        >
            <div class="aside-filters-header qt-df qt-ai-c qt-jc-sb">
                <div class="aside-filters-header__title">File Info</div>
                <div
                    class="qt-button --square-md --gray pointer"
                    (click)="onToggleFileInfo(false)"
                >
                    <div class="qt-icon icon__close qt-sz-16 pointer"></div>
                </div>
            </div>
            <div class="aside-filters-content">
                <app-file-manager-file-info
                    #fileInfoContainer
                    class="qt-w100"
                    [file]="fileInfo"
                    [category]="cateforyInfo"
                ></app-file-manager-file-info>
            </div>
        </div>
    </div>
</div>
