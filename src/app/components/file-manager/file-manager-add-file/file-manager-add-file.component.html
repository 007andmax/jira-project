<div class="archive-modal de-archive">
    <div class="archive-modal__body">
        <div class="qt-df qt-ai-c qt-jc-sb qt-mb-24">
            <h3>Upload a File</h3>
            <div
                class="qt-button --square-md --gray pointer"
                (click)="close()"
            >
                <div class="icon__close qt-bg-contain qt-sz-16 pointer"></div>
            </div>
        </div>
        <div class="exist-agreements">
            <app-file-manager-add-file-drag-drop
                #uplaodFile
                (changeFiles)="onChangeFiles($event)"
                (isUploadingFile)="onUploadingFile($event)"
                (onRemoveFile)="onRemoveFile($event)"
                class="ticket-fileupload"
            ></app-file-manager-add-file-drag-drop>
            <div class="contract-container qt-mt-24">
                <form [formGroup]="addForm">
                    <div class="qt-inputs-row --required">
                        <div class="qt-input-block">
                            <label
                                for="add-ticket-subject"
                                class="qt-input-block__label"
                            >
                                Name
                                <span class="qt-color-red-600">*</span>
                            </label>
                            <input
                                id="add-ticket-subject"
                                [ngClass]="{'--input-error' : submitted && f2.name.errors}"
                                class="qt-input-block__input"
                                formControlName="name"
                                maxlength="100"
                                type="text"
                                placeholder="File Name"
                            >
                            <mat-error
                                class="invalid-feedback"
                                *ngIf="submitted && f2.name.errors"
                            >
                                Name is required
                            </mat-error>
                        </div>
                    </div>
                    <div class="qt-inputs-row">
                        <div class="qt-input-block">
                            <div class="qt-df qt-ai-c qt-jc-sb">
                                <label
                                    for="add-ticket-describe-issue"
                                    class="qt-input-block__label"
                                >
                                    Description
                                </label>
                                <span class="qt-fs-12 qt-color-gray-500">
                                    {{f2.description.value ? f2.description.value.length : "0"}}/1000
                                </span>
                            </div>
                            <textarea
                                id="description-global-note"
                                formControlName="description"
                                class="terms-n-conditions__textarea qt-input-block__textarea"
                                placeholder="Add a file description"
                                appTextArea
                                maxlength="1000"
                                cols="30"
                                [default]="3"
                                rows="3"
                            ></textarea>
                        </div>
                    </div>
                    <div class="qt-inputs-row">
                        <div class="qt-input-block">
                            <label
                                for="add-ticket-describe-issue"
                                class="qt-input-block__label"
                            >
                                Tags
                            </label>
                            <app-file-manager-add-file-tags
                                #companyTags
                                [isRemoveCompanySelectedTag]="false"
                                (tagsChange)="onChangeTags($event)"
                            ></app-file-manager-add-file-tags>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="archive-modal__footer">
        <div class="qt-df qt-jc-fe">
            <button
                class="qt-button --gray qt-w100 qt-jc-c"
                (click)="close()"
            >
                Cancel
            </button>
            <button
                class="qt-button qt-w100 qt-jc-c --upload qt-ml-12"
                appDisabledBtn
                #addBtn="disabled"
                (onClick)="onSend()"
                [ngClass]="{'--loading':addBtn.isBlock()}"
            >
                <span *ngIf="!addBtn.isBlock()">Upload</span>
                <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
            </button>
        </div>
    </div>
</div>
