<div class="hardware-col">
    <div class="hardware-col-title">
        <span class="hardware-ico">
            <img
                src="/html/assets/img/device/memory.svg"
                alt="memory"
            >
        </span>
        <div class="hardware-col__title">Memory</div>
    </div>
    <ul class="hardware-col__list">
        <li class="hardware-col__list-item"
          *ngIf="memory.capacity != undefined">
            <span class="hardware-col__list-title">Size:</span>
            <div class="hardware-col__list-text">{{memory.capacity/1024/1024}} MB RAM</div>
            <!-- <div>DIMM 1: 4,096 MB RAM (DDR3-1066 PC3-85— 533 MHz, DIMM)</div>
                                <div>DIMM 1: 4,096 MB RAM (DDR3-1066 PC3-85— 533 MHz, DIMM)</div>
                                <div>DIMM 1: 4,096 MB RAM (DDR3-1066 PC3-85— 533 MHz, DIMM)</div>
                                <div>DIMM 1: 4,096 MB RAM (DDR3-1066 PC3-85— 533 MHz, DIMM)</div>
                                <div>DIMM 1: 4,096 MB RAM (DDR3-1066 PC3-85— 533 MHz, DIMM)</div>
                                <div>DIMM 1: 4,096 MB RAM (DDR3-1066 PC3-85— 533 MHz, DIMM)</div> -->
        </li>
        <li class="hardware-col__list-item"
          *ngIf="memory.capacity == undefined">
            <span class="hardware-col__list-title">Size:</span>
            <div class="hardware-col__list-text">{{memory.capacity/1024/1024}}   N/A</div>
        </li>
    </ul>
</div>
