<div class="hardware-col">
    <div class="hardware-col-title">
        <span class="hardware-ico">
            <span class="icon__memory qt-sz-40 qt-bg-contain qt-va-m qt-dib"></span>
        </span>
        <div class="hardware-col__title">Memory</div>
    </div>
    <ul class="hardware-col__list">
        <li class="hardware-col__list-item">
            <span class="hardware-col__list-title">Size:</span>
            <div class="hardware-col__list-text">
                <ng-template
                    ngFor
                    let-item
                    [ngForOf]="memory"
                >
                    <p *ngIf="item.capacity != undefined">
                        {{item.deviceLocator}} - {{item.capacity/1024/1024}} MB RAM
                    </p>
                </ng-template>
            </div>
        </li>
    </ul>
</div>
