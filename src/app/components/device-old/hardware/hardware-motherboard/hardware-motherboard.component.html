<div class="hardware-col">
    <div class="col-title">
        <span class="hardware-ico">
            <img
                src="/html/assets/img/device/motherboard.svg"
                alt="motherboard"
            >
        </span>
        <h3>Motherboard</h3>
    </div>
    <ul class="list-unstyled">
        <li>
            <span>Manufacturer:</span>
            {{motherBoard.manufacturer || 'N/A'}}
        </li>
        <li>
            <span>Model:</span>
            {{motherBoard.serial_number || 'N/A'}}
        </li>
        <li>
            <span>BIOS Manufacture:</span>
            {{bios.manufacturer || 'N/A'}}
        </li>
        <li>
            <span>BIOS Model:</span>
            BIOS Date {{(bios.release_date | date : DateTimeFormat) || 'N/A'}} Version: {{bios.version || 'N/A'}}
        </li>

    </ul>

</div>
