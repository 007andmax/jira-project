<div class="hardware-col">
    <div class="col-title">
        <span class="hardware-ico">
            <img
                src="/html/assets/img/device/display.svg"
                alt="Display"
            >
        </span>
        <h3>Display</h3>
    </div>
    <ul class="list-unstyled">
        <li>
            <span>Manufacturer:</span>
            {{display.manufacturer || 'N/A'}}
        </li>
        <li>
            <span>Model:</span>
            {{display.name || 'N/A'}}
        </li>
        <li>
            <span>Color Depth:</span>
            N/A
        </li>
        <li>
            <span>Refresh Rate:</span>
            N/A
        </li>
    </ul>
</div>
