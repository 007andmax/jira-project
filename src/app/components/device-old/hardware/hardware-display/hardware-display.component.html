<div class="hardware-col">
    <div class="hardware-col-title">
        <span class="hardware-ico">
            <span class="icon__display qt-sz-40 qt-bg-contain qt-va-m qt-dib"></span>
        </span>
        <div class="hardware-col__title">Display</div>
    </div>
    <ul class="hardware-col__list">
        <li class="hardware-col__list-item">
            <span class="hardware-col__list-title">Manufacturer:</span>
            <div class="hardware-col__list-text">{{display.manufacturer || 'N/A'}}</div>
        </li>
        <li class="hardware-col__list-item">
            <span class="hardware-col__list-title">Model:</span>
            <div class="hardware-col__list-text">{{display.name || 'N/A'}}</div>
        </li>
        <li class="hardware-col__list-item">
            <span class="hardware-col__list-title">Color Depth:</span>
            <div class="hardware-col__list-text">N/A</div>
        </li>
        <li class="hardware-col__list-item">
            <span class="hardware-col__list-title">Refresh Rate:</span>
            <div class="hardware-col__list-text">N/A</div>
        </li>
    </ul>
</div>
