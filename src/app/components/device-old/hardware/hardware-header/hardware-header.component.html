<div class="device-page-header qt-df qt-jc-sb qt-ai-c">
    <div>Hardware</div>
    <div class="download-print">
        <a
          class="qt-icon icon__print qt-dib qt-mr-6 pointer device-tooltip qt-sz-16 qt-bg-contain qt-ml-16 pointer"
          (click)="printPdf();"
          data-tooltip="Print"
        ></a>
        <a
          class="qt-icon icon__export qt-dib qt-mr-6 pointer device-tooltip device-tooltip--width-auto qt-sz-16 qt-bg-contain qt-ml-12 pointer"
          (click)="downloadCsv();"
          data-tooltip="Download CSV"
        ></a>
    </div>
</div>
