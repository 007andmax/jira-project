<div class="hardware-col">
    <div class="hardware-col-title">
        <span class="hardware-ico">
            <span class="icon__graphic-card qt-sz-40 qt-bg-contain qt-va-m qt-dib"></span>
        </span>
        <div class="hardware-col__title">Graphics Card</div>
    </div>
    <ul class="hardware-col__list">
        <li class="hardware-col__list-item">
            <span class="hardware-col__list-title">Model:</span>
            <div class="hardware-col__list-text">{{graphics.hardwareDeviceName || 'N/A'}}</div>
        </li>
        <li class="hardware-col__list-item">
            <span class="hardware-col__list-title">Video Processor:</span>
            <div class="hardware-col__list-text">N/A</div>
        </li>
        <li class="hardware-col__list-item"
          *ngIf="graphics.memory != undefined">
            <span class="hardware-col__list-title">Memory Size:</span>
            <div class="hardware-col__list-text">{{graphics.memory/1024/1024}} MB VRAM</div>
        </li>
        <li class="hardware-col__list-item"
             *ngIf="graphics.memory == undefined">
            <span class="hardware-col__list-title">Memory Size:</span>
            <div class="hardware-col__list-text">N/A</div>
        </li>
        <li class="hardware-col__list-item">
            <span class="hardware-col__list-title">Driver:</span>
            <div class="hardware-col__list-text">version {{graphics.driverVersion}}</div>
        </li>
    </ul>
</div>
