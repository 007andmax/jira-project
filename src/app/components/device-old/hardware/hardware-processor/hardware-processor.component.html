<div class="hardware-col">
    <div class="hardware-col-title">
        <span class="hardware-ico">
            <img
                src="/html/assets/img/device/processor.svg"
                alt="processor"
            >
        </span>
        <div class="hardware-col__title">Processor</div>
    </div>
    <ul class="hardware-col__list">
        <li class="hardware-col__list-item">
            <span class="hardware-col__item-title">Model:</span>
            <div class="hardware-col__item-text">{{processors.name}}</div>
        </li>
        <li class="hardware-col__list-item">
            <span class="hardware-col__item-title">Clock Speed:</span>
            <div class="hardware-col__item-text">N/A</div>
        </li>
        <li class="hardware-col__list-item">
            <span class="hardware-col__item-title">Socket & Cache(s):</span>
            <div class="hardware-col__item-text">N/A</div>
        </li>
    </ul>
</div>
