<div class="dashboard-col col-50 disk-drive">
    <div class="dashboard-col__title">Disk Drives</div>
    <ul class="disk-drive__list">
        <li
            class="disk-drive__item"
            [ngClass]="{'e-drive':drive.isSystem == false,'c-drive':drive.isSystem == true, 'd-drive':drive.isSystem == false && drive.deviceId == 'D:', 'f-drive':drive.isSystem == false && drive.deviceId == 'F:'}"
            *ngFor="let drive of logicalDisk"
        >
            <div
                class="progress-circle p{{drive.percent}}"
                [ngClass]="{'over50': drive.percent >= 50}"
            >
                <span [textContent]="drive.percent + '%'"></span>
                <div class="left-half-clipper">
                    <div class="first50-bar"></div>
                    <div
                        class="value-bar"
                        [ngStyle]="{'border-color': drive.color}"
                    ></div>
                </div>
            </div>
            <div class="drive-status">
                <span class="disk-drive__name">
                    {{drive.deviceId}} ({{drive.fileSystem}} on drive {{drive.diskIndex + 1}})
                </span>
                <span
                    class="disk-drive__limit"
                    *ngIf="drive.freeSpace != '' && drive.size != ''"
                >
                    {{diskSpaceDiff(drive.size, drive.freeSpace)}}GB / {{convertToGB(drive.size)}}GB
                </span>
            </div>
        </li>
    </ul>
</div>
