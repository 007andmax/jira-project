<div class="dashboard-col col-50 disk-drive">
    <div class="dashboard-col__title">Disk Drives</div>
    <ul class="disk-drive__list">
        <li
            class="disk-drive__item"
            [ngClass]="{'e-drive':drive.is_system == false,'c-drive':drive.is_system == true, 'd-drive':drive.is_system == false && drive.device_id == 'D:', 'f-drive':drive.is_system == false && drive.device_id == 'F:'}"
            *ngFor="let drive of logicalDisk"
        >
            <div
                class="progress-circle p{{drive.percent}}"
                [ngClass]="{'over50': drive.percent >= 50}"
            >
                <span [textContent]="drive.percent + '%'"></span>
                <div class="left-half-clipper">
                    <div class="first50-bar"></div>
                    <div
                        class="value-bar"
                        [ngStyle]="{'border-color': drive.color}"
                    ></div>
                </div>
            </div>
            <div class="drive-status">
                <span class="disk-drive__name">
                    {{drive.device_id}} ({{drive.file_system}} on drive {{drive.disk_index + 1}})
                </span>
                <!-- <span class="drive-limit" *ngIf="drive.free_space != '' && drive.size != ''">{{convertToGB(drive.size) - convertToGB(drive.free_space)}}GB / {{convertToGB(drive.size)}}GB</span> -->
                <span
                    class="disk-drive__limit"
                    *ngIf="drive.free_space != '' && drive.size != ''"
                >
                    {{diskSpaceDiff(drive.size, drive.free_space)}}GB / {{convertToGB(drive.size)}}GB
                </span>
            </div>
        </li>
    </ul>
</div>
