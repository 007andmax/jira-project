<div class="dashboard-col col-50 services">
    <div class="dashboard-col__title">Services</div>
    <ul class="dashboard-services__list">
        <li
          [ngClass]="{'updated': virusInfo?.isUpToDate == true, 'alert': virusInfo?.isUpToDate == false}"
          class="dashboard-services__item"
        >
            <figure class="qt-df qt-jc-c">
              <span class="icon__virus-protection qt-bg-contain qt-sz-40"></span>
              <span class="icon__status-green qt-bg-contain qt-sz-20 dashboard-services__list-sup-icon"></span>
            </figure>
            <div class="dashboard-services__title">Virus Protection</div>
            <span
              *ngIf="virusInfo?.isUpToDate == true"
              class="dashboard-services__text"
            >
              Up-to-date
            </span>
            <span
              *ngIf="virusInfo?.isUpToDate == false"
              class="dashboard-services__text"
            >
              Out-of-date
            </span>
        </li>
        <li class="alert dashboard-services__item">
            <figure class="qt-df qt-jc-c">
              <span class="icon__security-update qt-bg-contain qt-sz-40"></span>
              <span class="icon__alert qt-bg-contain qt-sz-20 dashboard-services__list-sup-icon"></span>
            </figure>
            <div class="dashboard-services__title">Security Update</div>
            <span class="dashboard-services__text">7 missing Updates</span>
        </li>
        <li class="updated dashboard-services__item">
            <figure class="qt-df qt-jc-c">
              <figure class="qt-df qt-jc-c">
                <span class="icon__drivers-missing qt-bg-contain qt-sz-40"></span>
                <span class="icon__status-green qt-bg-contain qt-sz-20 dashboard-services__list-sup-icon"></span>
              </figure>
            </figure>
            <div class="dashboard-services__title">Drivers Missing</div>
            <span class="dashboard-services__text">Up-to-date</span>
        </li>
    </ul>
</div>
