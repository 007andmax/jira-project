<div class="dashboard-col  work-group">
    <div class="col-title qt-df qt-ai-c qt-mb-16">
        <span class="hardware-ico">
            <img
                src="html/assets/img/device/computer.svg"
                alt="computer"
            >
        </span>
        <!-- <h3 (mouseenter)="showInput = true;" [ngStyle]="{'display':showInput === true ? 'none' : 'block' }">{{label}}</h3> -->
        <span class="edit-field qt-ml-4">
            <input
                type="text"
                class="dashboard-list__input dashboard-list__input--main-title --editable"
                [(ngModel)]="label"
                (blur)="saveLabel();"
            >
        </span>

    </div>
    <ul class="dashboard-list">
        <li class="dashboard-list__item">
            <span class="dashboard-list__title">Host Name</span>
            <div class="dashboard-list__text">{{hostName || 'N/A'}}</div>
        </li>
        <li class="dashboard-list__item">
            <span class="dashboard-list__title">Warranty</span>
            <!-- <div>{{system?.warranty || 'N/A'}}</div> -->
            <span
                class="edit-field"
                *ngIf="system.warrantyTime"
            >
                <app-date-picker
                    [formatDate]="formatDate"
                    [editMode]="true"
                    [useMinDate]="false"
                    [editDate]="system.warrantyTime"
                    (onChange)="changeWarranty($event)"
                    class="dashboard-datepicker__wrap"
                ></app-date-picker>
            </span>
        </li>
        <li class="dashboard-list__item">
            <span class="dashboard-list__title">Windows Info</span>
            <div class="dashboard-list__text">{{windows_info || 'N/A'}}</div>

        </li>
        <li class="dashboard-list__item">
            <span class="dashboard-list__title">Asset Tag</span>
            <!-- <div>{{system?.asset_tag || 'N/A'}}</div> -->
            <span
                id="tag"
                class="edit-field"
                data-tooltip
            >
                <input
                    type="text"
                    class="dashboard-list__input --editable"
                    [(ngModel)]="system.asset_tag"
                    (blur)="updateDashboard('asset_tag')"
                >
            </span>
        </li>
        <li class="dashboard-list__item">
            <span class="dashboard-list__title">Manufacturer</span>
            <!-- <div>{{system?.manufacturer || 'N/A'}}</div> -->
            <span
                id="manufacture"
                class="edit-field"
                data-tooltip
            >
                <input
                    type="text"
                    class="dashboard-list__input --editable"
                    [(ngModel)]="system.manufacturer"
                    (blur)="updateDashboard('manufacturer')"
                >
            </span>
        </li>
        <li class="dashboard-list__item">
            <span class="dashboard-list__title">IP</span>
            <div class="dashboard-list__text">{{networkAdapters.ip_address || 'N/A'}}</div>
        </li>
        <li class="dashboard-list__item">
            <span class="dashboard-list__title">Install Date</span>
            <!-- <div (click)="visible = !visible">{{(system?.install_date | date : DateFormat) || 'N/A'}}</div> -->
            <!-- <ngb-datepicker class="dropdown-menu p-0"
                    [class.show]="visible">
                  </ngb-datepicker> -->
            <span
                class="edit-field"
                *ngIf="system.install_dateTime"
            >
                <app-date-picker
                    [formatDate]="formatDate"
                    [editMode]="true"
                    [useMinDate]="false"
                    [editDate]="system.install_dateTime"
                    (onChange)="changeInstallDate($event)"
                    class="dashboard-datepicker__wrap"
                ></app-date-picker>
            </span>
        </li>
        <!-- <li>
                    <span>Warranty Date</span>
                    <span class="edit-field">
                      <input type="text" class="form-control sub-label-field" [(ngModel)]="system.warranty" (dateSelect)="updateDashboard('warranty')" ngbDatepicker #dWarranty="ngbDatepicker" (click)="dWarranty.toggle()">
                    </span>
                  </li> -->
        <li class="dashboard-list__item">
            <span class="dashboard-list__title">Computer Model</span>
            <!-- <div>{{system?.model || 'N/A'}}</div> -->
            <span class="edit-field">
                <input
                    type="text"
                    class="dashboard-list__input --editable"
                    [(ngModel)]="system.model"
                    (blur)="updateDashboard('model')"
                >
            </span>
        </li>
        <!-- <li>
                    <span>Site</span>
                    <div>N/A</div>
                  </li> -->
        <!-- <li>
                    <span>Bought Date</span>
                    <span class="edit-field">
                      <input type="text" class="form-control sub-label-field" [(ngModel)]="system.install_date" (dateSelect)="updateDashboard('install_date')" ngbDatepicker #dInstall="ngbDatepicker" (click)="dInstall.toggle()">
                    </span>
                  </li> -->
        <li class="dashboard-list__item">
            <span class="dashboard-list__title">System Type</span>
            <!-- <div *ngIf="system?.architecture != undefined && system?.architecture != ''">({{system?.architecture}}) system</div>
                    <div *ngIf="system?.architecture == undefined || system?.architecture == ''">N/A</div> -->
            <span class="edit-field">
                <input
                    type="text"
                    class="dashboard-list__input --editable"
                    [(ngModel)]="system.architecture"
                    (blur)="updateDashboard('architecture')"
                >
            </span>
        </li>
        <!-- <li>
                    <span>Time Zone</span>
                    <div>(UTC +08:00) Perth</div>
                  </li> -->
        <!-- <li>
                    <span>Expire Date</span>
                    <div>2019-03-12</div>
                  </li> -->

    </ul>
</div>
