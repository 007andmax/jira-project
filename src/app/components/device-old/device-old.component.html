<div class="page-wrapper">
    <!-- header -->
    <header id="deviceHeader">
        <div class="cmn-wrapper">
            <div class="header-left">
                <div class="hp-device-info">
                    <span class="device-icn">
                        <img
                            [attr.src]="deviceType === 'printer' ? '/html/assets/img/device/Device_printer.svg' : '/html/assets/img/device/device.svg'"
                            alt="device"
                        >
                    </span>
                    <div class="head-device">
                        <h6>Device</h6>
                        <h5 id="head-label">
                            {{deviceDetail.label || deviceDetail.hostName || deviceDetail.ip}}
                        </h5>
                    </div>
                </div>
                <div class="hp-device-info">
                    <span class="device-icn">
                        <img
                            src="/html/assets/img/device/uptime.svg"
                            alt="device"
                        >
                    </span>
                    <div class="head-device">
                        <h6>Up Time</h6>
                        <h5>5 hrs 5 min</h5>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <a
                    href="javascript:;"
                    class="head-btn"
                    (click)="openModal()"
                >
                    Remote Control
                </a>
                <a
                    href="javascript:;"
                    (click)="sendCommand('r')"
                    class="head-btn-info btn-refresh"
                >
                    <img
                        src="/html/assets/img/device/restart.svg"
                        alt="restart"
                    >
                </a>
                <a
                    href="javascript:;"
                    (click)="sendCommand('s')"
                    class="head-btn-info btn-shutDown"
                >
                    <img
                        src="/html/assets/img/device/shutdown.svg"
                        alt="shutdown"
                    >
                </a>
            </div>
        </div>
        <div class="head-counter">
            <div class="sub-head-counter pointer">
                <img
                    src="/html/assets/img/device/restart.svg"
                    alt="Play"
                    (click)="restartTimerControl()"
                >
            </div>
            <div class="sub-head-counter pointer">
                <img
                    [attr.src]="interval && !playTimer ? '/html/assets/img/device/play.svg' : '/html/assets/img/device/pause.svg'"
                    alt="Play"
                    (click)="timerControl()"
                >
            </div>
            <div class="sub-head-counter">
                <img
                    src="/html/assets/img/device/counter.svg"
                    alt="Print"
                >
                <span id="counter">
                    {{padNumber(this.totalHours)}} hr : {{padNumber(this.totalMinutes)}} min : {{padNumber(this.totalSeconds)}} sec
                </span>
            </div>
        </div>
        <!-- <div class="head-counter"><img src="/html/assets/img/device/counter.svg" alt="Print" /> 00 hr : 00 min : 00 sec</div> -->
    </header>
    <!-- left sidebar nav -->
    <aside class="left-sidebar">
        <nav-old></nav-old>
    </aside>
    <!-- Main content bar -->
    <router-outlet></router-outlet>
</div>
<!-- Modal create Tags -->
<div
    class="loading"
    *ngIf="loading"
></div>
