<div class="page-header">
    <h3>Software list</h3>
    <div class="download-print">
        <input
            type="search"
            class="form-input"
            (input)="search($event)"
            placeholder="Search Software…"
            autocomplete="off"
        >
        <a
            (click)="printPdf();"
            data-tooltip="Print"
        >
            <img src="/html/assets/img/device/print.svg">
        </a>
        <a
            (click)="downloadCsv();"
            data-tooltip="Download CSV"
        >
            <img src="/html/assets/img/device/download_csv.svg">
        </a>
    </div>

                </div>
              </div> -->
</div>
