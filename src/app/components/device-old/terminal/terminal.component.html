<main class="terminal-page-area">
    <div class="cmn-wrapper">
        <div class="device-container">
            <div class="page-container terminal">
                <!-- Page Title -->
                <div class="page-header">
                    <h3>Terminal</h3>
                    <div class="page-header-opt">
                        <div class="update-info">
                            <a
                                class="Command"
                                [ngClass]="{'active': scriptTyped == 'cmd'}"
                                (click)="switchTerminal('cmd')"
                            >
                                Command Line
                            </a>
                            <a
                                class="Power"
                                [ngClass]="{'active': scriptTyped == 'powershell'}"
                                (click)="switchTerminal('powershell')"
                            >
                                Power Shell
                            </a>
                        </div>
                    </div>
                </div>
                <!-- Page Content -->
                <div class="contant-area">
                    <div class="terminal-area">
                        <div
                            id="terminal"
                            class="terminal-box"
                            [ngStyle]="{'background-color':scriptTyped == 'powershell' ? '#012456' : '#151b21' }"
                        >
                            <p *ngFor="let split of splitCommand">
                                <span>{{split}}</span>
                            </p>
                            <!-- <textarea>C:\Users\Sam\Desktop></textarea> -->
                        </div>
                        <div class="terminal-btn-row">
                            <textarea
                                id="editCmd"
                                class="editCmd"
                                [(ngModel)]="editCmd"
                                rows="4"
                                placeholder="> Enter a command"
                                (keyup.enter)="setHeight('enter');"
                                (keyup.backspace)="setHeight('backspace');"
                            ></textarea>
                            <button
                                id="button-cmd"
                                type="button"
                                class="btn btn-primary"
                                (click)="copyToTerminalFunc(editCmd, '', false);"
                            >
                                Run Command
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Right Side bar -->
        <terminal-aside
            #aside
            [submitted]="submitted"
            [showDescription]="showDescription"
            [commandList]="commandList"
            [loading]="loading"
            [_id]="_id"
            [cmdCategoryReadList]="cmdCategoryReadList"
            [copyToTerminal]="copyToTerminal"
            [openEditModal]="openEditModal"
            [getCommandList]="getCommandList"
            [openModal]="openModal"
        ></terminal-aside>
        <!-- Script Sidebar -->
        <aside
            class="right-sidebar script-sidebar"
            [class.opened]="runScript"
        >
            <div>
                <div class="script-side-heder">
                    <h2>Script Library</h2>
                    <a
                        href="javascript:;"
                        class="close-btn"
                        title="Close"
                        (click)="runScript = !runScript"
                    >
                        <img
                            src="/html/assets/img/icons/close.svg"
                            alt="close"
                            title="close"
                        >
                    </a>
                </div>
                <ngb-tabset>
                    <ngb-tab [title]="'My Scripts (' + myScriptList.length + ')'">
                        <ng-template ngbTabContent>
                            <div class="cmn-tbs-content myScript">
                                <form method="POST">
                                    <div class="f-row">
                                        <div class="f-col col-50">
                                            <label for="command">Category</label>
                                            <div class="form-row">
                                                <div
                                                    class="grey-dropdown w-100"
                                                    ngbDropdown
                                                >
                                                    <input
                                                        type="text"
                                                        placeholder="Select Category"
                                                        [(ngModel)]="myScriptModal.category"
                                                        id="my_category"
                                                        ngbDropdownToggle
                                                        autocomplete="off"
                                                        class="cmn-select form-input"
                                                        name="my_category"
                                                        readonly
                                                    >
                                                    <img
                                                        class="icn-sm report-caret-icon"
                                                        src="./..//html/assets/img/device/selct-arrow.svg"
                                                    >
                                                    <div
                                                        ngbDropdownMenu
                                                        aria-labelledby="dropdownBasic2"
                                                    >
                                                        <button
                                                            ngbDropdownItem
                                                            (click)="filterMyScript(undefined);"
                                                        >
                                                            All Category
                                                        </button>
                                                        <button
                                                            *ngFor="let category of cmdCategoryReadList"
                                                            ngbDropdownItem
                                                            (click)="filterMyScript(category);"
                                                        >
                                                            {{category.name}}
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="f-col col-50">
                                            <label for="command">Search Scripts</label>
                                            <div class="form-row">
                                                <input
                                                    type="text"
                                                    placeholder="Search Scripts"
                                                    class="form-input script-search"
                                                    [(ngModel)]="myScriptModal.search"
                                                    (keyup)="filterMyScript(undefined)"
                                                    id="my_search"
                                                    name="my_search"
                                                >
                                            </div>
                                        </div>
                                    </div>
                                </form>
                                <ul
                                    class="list-unstyled script-list"
                                    *ngIf="myScriptListFilter.length > 0"
                                >
                                    <li *ngFor="let script of myScriptListFilter">
                                        <div class="script-left">
                                            <h5>{{script.title}}</h5>
                                            <span>{{script.command}}</span>
                                            <span class="clone-cat">Cloned Scripts</span>
                                        </div>
                                        <div class="script-right">
                                            <a
                                                href="javascript:;"
                                                class="play-btn"
                                                data-tooltip="Run Script"
                                                (click)="copyToTerminal(script.command, script.type, true)"
                                            >
                                                <img
                                                    src="/html/assets/img/device/play-script.svg"
                                                    alt="play-script"
                                                    title="play-script"
                                                >
                                            </a>
                                            <!-- <a
                      href="javascript:;"
                      class="play-btn"
                      data-tooltip="Clone Script"
                      (click)="cloneScript(script.id)"
                    >
                      <img
                        src="/html/assets/img/device/copy-script.svg"
                        alt="copy-script"
                        title="copy-script"
                      />
                    </a> -->
                                            <a
                                                href="javascript:;"
                                                class="view-btn"
                                                data-tooltip="View Script"
                                                (click)="viewScriptDetail(script);"
                                            >
                                                <img
                                                    src="/html/assets/img/device/view-script.svg"
                                                    alt="view-script"
                                                    title="view-script"
                                                >
                                            </a>
                                        </div>
                                    </li>
                                </ul>
                            </div>
                        </ng-template>
                    </ngb-tab>
                    <ngb-tab [title]="'Shared Script Library (' + sharedScriptList.length + ')'">
                        <ng-template ngbTabContent>
                            <div class="cmn-tbs-content script-library">
                                <form method="POST">
                                    <div class="f-row">
                                        <div class="f-col col-50">
                                            <label for="command">Category</label>
                                            <div class="form-row">
                                                <div
                                                    class="grey-dropdown w-100"
                                                    ngbDropdown
                                                >
                                                    <input
                                                        type="text"
                                                        placeholder="Select Category"
                                                        [(ngModel)]="sharedScriptModal.category"
                                                        id="shared_category"
                                                        ngbDropdownToggle
                                                        autocomplete="off"
                                                        class="cmn-select form-input"
                                                        name="shared_category"
                                                        readonly
                                                    >
                                                    <img
                                                        class="icn-sm report-caret-icon"
                                                        src="./..//html/assets/img/device/selct-arrow.svg"
                                                    >
                                                    <div
                                                        ngbDropdownMenu
                                                        aria-labelledby="dropdownBasic2"
                                                    >
                                                        <button
                                                            ngbDropdownItem
                                                            (click)="filterSharedScript(undefined);"
                                                        >
                                                            All Category
                                                        </button>
                                                        <button
                                                            *ngFor="let category of cmdCategoryReadList"
                                                            ngbDropdownItem
                                                            (click)="filterSharedScript(category);"
                                                        >
                                                            {{category.name}}
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="f-col col-50">
                                            <label for="command">Search Scripts</label>
                                            <div class="form-row">
                                                <input
                                                    type="text"
                                                    placeholder="Search description or filename"
                                                    class="form-input script-search"
                                                    (keyup)="filterSharedScript(undefined)"
                                                    id="shared_search"
                                                    name="shared_search"
                                                    [(ngModel)]="sharedScriptModal.search"
                                                >
                                            </div>
                                        </div>
                                    </div>
                                </form>
                                <ul
                                    class="list-unstyled script-list"
                                    *ngIf="sharedScriptListFilter.length > 0"
                                >
                                    <li *ngFor="let shared of sharedScriptListFilter">
                                        <div class="script-left">
                                            <h5>{{shared.title}}</h5>
                                            <span>{{shared.command}}</span>
                                            <!-- <span class="clone-cat">Cloned Scripts</span> -->
                                        </div>
                                        <div class="script-right">
                                            <a
                                                href="javascript:;"
                                                class="play-btn"
                                                data-tooltip="Clone Script"
                                                (click)="cloneScript(shared.id)"
                                            >
                                                <img
                                                    src="/html/assets/img/device/copy-script.svg"
                                                    alt="copy-script"
                                                    title="copy-script"
                                                >
                                            </a>
                                            <a
                                                href="javascript:;"
                                                class="view-btn"
                                                data-tooltip="View Script"
                                                (click)="viewScriptDetail(shared);"
                                            >
                                                <img
                                                    src="/html/assets/img/device/view-script.svg"
                                                    alt="view-script"
                                                    title="view-script"
                                                >
                                            </a>
                                        </div>
                                    </li>
                                </ul>
                                <!-- <ul class="list-unstyled pagination" *ngIf="sharedScriptListFilter.length > 0">
                <li class="next">
                  <a href="javascript:;">
                    <img
                      src="/html/assets/img/device/prev-pag.svg"
                      alt="prev"
                      title="prev"
                    />
                  </a>
                </li>
                <li>
                  <a href="javascript:;">1</a>
                </li>
                <li>
                  <a href="javascript:;">2</a>
                </li>
                <li class="current">
                  <a href="javascript:;">3</a>
                </li>
                <li>
                  <a href="javascript:;">4</a>
                </li>
                <li>
                  <a href="javascript:;">…</a>
                </li>
                <li>
                  <a href="javascript:;">17</a>
                </li>
                <li class="prev">
                  <a href="javascript:;">
                    <img
                      src="/html/assets/img/device/next-pag.svg"
                      alt="next-pag"
                      title="next-pag"
                    />
                  </a>
                </li>
              </ul> -->
                            </div>
                        </ng-template>
                    </ngb-tab>
                </ngb-tabset>
            </div>
        </aside>
        <!-- Script Details Sidebar -->
        <aside
            class="right-sidebar script-sidebar script-details"
            [class.opened]="scriptDetail"
        >
            <div>
                <div class="script-side-heder">
                    <h2>
                        <a
                            href="javascript:;"
                            class="close-btn"
                            title="Close"
                            (click)="emptyScriptDetail()"
                        >
                            <img
                                src="/html/assets/img/device/back.svg"
                                alt="close"
                                title="close"
                            >
                        </a>
                        Script Library
                    </h2>
                    <span class="clone-cat">Cloned Scripts</span>
                </div>
                <div class="script-details-area">
                    <!-- <h2>
            {{scriptDetailModal.title}}
          </h2> -->
                    <!-- <div class="script-info">
            <div class="script-col">
              <h5>File Type</h5>
              <span>.bat</span>
            </div>
            <div class="script-col">
              <h5>Run as:</h5>
              <span>Current User</span>
            </div>
            <div class="script-col">
              <h5>Variables</h5>
              <span>No</span>
            </div>
            <div class="script-col">
              <h5>Max Run Time</h5>
              <span>10</span>
            </div>
          </div> -->
                    <form method="POST">
                        <div class="f-row">
                            <div class="f-col col-100">
                                <label for="Title">Command Title</label>
                                <div class="form-row">
                                    <input
                                        type="text"
                                        id="title"
                                        class="form-input"
                                        placeholder="Command Title"
                                        [(ngModel)]="scriptDetailModal.title"
                                        name="title"
                                        #Title1="ngModel"
                                        [disabled]="scriptDetailModal.default === true"
                                        required
                                        [class.validation-error]="submitted == true && Title1.errors && Title1.errors.required"
                                    >
                                </div>
                            </div>
                            <div class="f-col col-70">
                                <label for="command">Category</label>
                                <div class="form-row">
                                    <div
                                        class="grey-dropdown w-100"
                                        ngbDropdown
                                    >
                                        <input
                                            type="text"
                                            placeholder="Select Category"
                                            [(ngModel)]="scriptDetailModal.category"
                                            id="category"
                                            ngbDropdownToggle
                                            autocomplete="off"
                                            class="cmn-select form-input"
                                            name="category"
                                            #Category1="ngModel"
                                            [disabled]="scriptDetailModal.default === true"
                                            required
                                            readonly
                                            [class.validation-error]="Category1.errors && Category1.errors.required"
                                        >
                                        <img
                                            class="icn-sm report-caret-icon"
                                            src="./..//html/assets/img/device/selct-arrow.svg"
                                        >
                                        <div
                                            ngbDropdownMenu
                                            aria-labelledby="dropdownBasic1"
                                        >
                                            <button
                                                *ngFor="let category of cmdCategoryReadList"
                                                ngbDropdownItem
                                                (click)="setScriptDetail(category.name, category.id)"
                                            >
                                                {{category.name}}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="f-col col-30">
                                <label for="command">Script Type</label>
                                <div class="form-row">
                                    <div
                                        class="grey-dropdown w-100"
                                        ngbDropdown
                                    >
                                        <input
                                            type="text"
                                            placeholder="Select Script Type"
                                            [(ngModel)]="scriptDetailModal.typeName"
                                            id="scriptType"
                                            ngbDropdownToggle
                                            autocomplete="off"
                                            class="cmn-select form-input"
                                            name="scriptType"
                                            #scriptType1="ngModel"
                                            required
                                            readonly
                                            [class.validation-error]="scriptType1.errors && scriptType1.errors.required"
                                        >
                                        <img
                                            class="icn-sm report-caret-icon"
                                            src="./..//html/assets/img/device/selct-arrow.svg"
                                        >
                                        <div
                                            ngbDropdownMenu
                                            aria-labelledby="dropdownType2"
                                        >
                                            <button
                                                ngbDropdownItem
                                                (click)="toggleDetailTerminal('CMD', 'Command Line')"
                                            >
                                                Command Line
                                            </button>
                                            <button
                                                ngbDropdownItem
                                                (click)="toggleDetailTerminal('POWERSHELL', 'Powershell')"
                                            >
                                                Powershell
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="f-col col-100 cmd-description">
                                <div class="label cmn-tabs">
                                    <a
                                        (click)="showDescription = false"
                                        href="javascript:;"
                                        [ngClass]="{'active': showDescription == false}"
                                    >
                                        Command
                                    </a>
                                    <a
                                        (click)="showDescription = true"
                                        href="javascript:;"
                                        [ngClass]="{'active': showDescription == true}"
                                    >
                                        Description
                                    </a>
                                </div>
                                <div class="form-row">
                                    <div
                                        id="cmd_detail"
                                        *ngIf="showDescription === false"
                                    >
                                        <ul id="cmd_detail_line">
                                            <li *ngFor="let line of lineNumberDetail">{{line}}</li>
                                        </ul>
                                        <textarea
                                            wrap="off"
                                            class="form-input"
                                            [(ngModel)]="scriptDetailModal.command"
                                            name="command1"
                                            (keyup)="countLineNumberDetail()"
                                            [disabled]="scriptDetailModal.default === true"
                                        >














                                        </textarea>
                                    </div>
                                    <textarea
                                        *ngIf="showDescription === true"
                                        class="form-input"
                                        [(ngModel)]="scriptDetailModal.description"
                                        name="description1"
                                        [disabled]="scriptDetailModal.default === true"
                                    ></textarea>
                                </div>
                            </div>
                        </div>
                        <div class="f-row">
                            <div class="f-col col-100">
                                <div class="form-row">
                                    <button
                                        type="button"
                                        *ngIf="scriptDetailModal.default === false"
                                        class="btn btn-primary"
                                        (click)="updateMyScript()"
                                    >
                                        Save
                                    </button>
                                    <button
                                        type="button"
                                        *ngIf="scriptDetailModal.default === true"
                                        class="btn btn-primary"
                                        (click)="cloneScript(scriptDetailModal.id)"
                                    >
                                        Clone Script
                                    </button>
                                    <button
                                        type="button"
                                        class="btn btn-primary"
                                        (click)="copyScriptToggle(scriptDetailModal, 'copy')"
                                    >
                                        Copy Script
                                    </button>
                                    <button
                                        type="button"
                                        class="btn btn-secondary"
                                        (click)="scriptDetail = !scriptDetail"
                                    >
                                        Back
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </aside>














        <!-- Delete Confirmation -->
    </div>
</main>
<div
    class="loading"
    *ngIf="loading"
></div>
