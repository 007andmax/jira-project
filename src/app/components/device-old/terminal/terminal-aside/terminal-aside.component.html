<aside class="right-sidebar terminal-sidebar">
    <!-- <a href="javascript:;" class="panel-bar" (click)="toggleTicket();">
      <img src="/html/assets/img/device/panel-open.svg" alt="Open" title="Ticket" />
    </a> -->
    <div>
        <a
            href="javascript:;"
            class="add-btn"
            (click)="openAddModal();"
        >
            <img
                src="/html/assets/img/device/add.svg"
                alt="add"
            >
        </a>
        <!-- Modal Add New Command -->
        <div
            class="modal-content toggle-area"
            [class.opened]="create"
        >
            <div class="toggle-header">
                <h2 class="h1">
                    {{commandModal.id == '' ? 'Create' : 'Edit'}} Command
                </h2>
            </div>
            <div class="modal-body">
                <form
                    novalidate
                    #commandFrm="ngForm"
                >
                    <div class="f-row">
                        <div class="f-col col-100">
                            <label for="Title">Command Title</label>
                            <div class="form-row">
                                <input
                                    type="text"
                                    id="title"
                                    class="form-input"
                                    placeholder="Command Title"
                                    [(ngModel)]="commandModal.title"
                                    name="title"
                                    #Title="ngModel"
                                    required
                                    [class.validation-error]="submitted == true && Title.errors && Title.errors.required"
                                >
                            </div>
                        </div>
                        <div class="f-col col-70">
                            <label for="command">Category</label>
                            <div class="form-row">
                                <div
                                    class="grey-dropdown w-100"
                                    ngbDropdown
                                >
                                    <input
                                        type="text"
                                        placeholder="Select Category"
                                        [(ngModel)]="commandModal.category"
                                        id="category"
                                        ngbDropdownToggle
                                        autocomplete="off"
                                        class="cmn-select form-input"
                                        name="category"
                                        #Category="ngModel"
                                        required
                                        readonly
                                        [class.validation-error]="submitted == true && Category.errors && Category.errors.required"
                                    >
                                    <img
                                        class="icn-sm report-caret-icon"
                                        src="/html/assets/img/device/selct-arrow.svg"
                                    >
                                    <div
                                        ngbDropdownMenu
                                        aria-labelledby="dropdownBasic1"
                                    >
                                        <button
                                            *ngFor="let category of cmdCategoryReadList"
                                            ngbDropdownItem
                                            (click)="setCommand(category.name, category.id)"
                                        >
                                            {{category.name}}
                                        </button>
                                        <button
                                            ngbDropdownItem
                                            (click)="manageCategory();"
                                        >
                                            Manage Category
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="f-col col-30 drp-black">
                            <label for="command">Script Type</label>
                            <div class="form-row">
                                <div
                                    class="grey-dropdown w-100"
                                    ngbDropdown
                                >
                                    <input
                                        type="text"
                                        placeholder="Select Script Type"
                                        [(ngModel)]="commandModal.typeName"
                                        id="scriptType"
                                        ngbDropdownToggle
                                        autocomplete="off"
                                        class="cmn-select form-input"
                                        name="scriptType"
                                        #scriptType="ngModel"
                                        required
                                        readonly
                                        [class.validation-error]="submitted == true && scriptType.errors && scriptType.errors.required"
                                    >
                                    <img
                                        class="icn-sm report-caret-icon"
                                        src="./..//html/assets/img/device/selct-arrow.svg"
                                    >
                                    <div
                                        ngbDropdownMenu
                                        aria-labelledby="dropdownType1"
                                    >
                                        <button
                                            ngbDropdownItem
                                            (click)="toggleTerminal('CMD', 'Command Line')"
                                        >
                                            Command Line
                                        </button>
                                        <button
                                            ngbDropdownItem
                                            (click)="toggleTerminal('POWERSHELL', 'Powershell')"
                                        >
                                            Powershell
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="f-col col-100 cmd-description">
                            <div class="label cmn-tabs">
                                <a
                                    (click)="showDescription = false"
                                    href="javascript:;"
                                    [ngClass]="{'active': showDescription == false}"
                                >
                                    Command
                                </a>
                                <a
                                    (click)="showDescription = true"
                                    href="javascript:;"
                                    [ngClass]="{'active': showDescription == true}"
                                >
                                    Description
                                </a>
                            </div>
                            <div class="form-row">
                                <div
                                    id="cmd"
                                    *ngIf="showDescription === false"
                                >
                                    <ul id="cmd_line">
                                        <li *ngFor="let line of lineNumber">{{line}}</li>
                                    </ul>
                                    <textarea
                                        wrap="off"
                                        class="form-input"
                                        [(ngModel)]="commandModal.command"
                                        name="command"
                                        (keyup)="countLineNumber()"
                                    >

                                    </textarea>
                                </div>
                                <textarea
                                    class="form-input"
                                    [(ngModel)]="commandModal.description"
                                    name="description"
                                    *ngIf="showDescription === true"
                                ></textarea>
                            </div>
                        </div>
                        <div class="m-btn-row">
                            <div class="m-btn-col">
                                <input
                                    type="submit"
                                    value="Save"
                                    (click)="createCommand()"
                                    class="btn btn-primary"
                                >
                                <a
                                    href="javascript:;"
                                    class="btn btn-secondary"
                                    aria-label="Close"
                                    (click)="resetCmdModal();create = !create"
                                >
                                    Cancel
                                </a>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <ngb-tabset>
            <ngb-tab title="Command">
                <ng-template ngbTabContent>
                    <div class="cmn-tbs-content command">
                        <ul class="list-unstyled">
                            <li *ngFor="let cmd of commandList">
                                <div class="terminal-cmd-opt">
                                    <div class="cmd-list-left">
                                        <img
                                            src="/html/assets/img/device/command-line.svg"
                                            class="cmd-list-left__image"
                                            alt="command-line"
                                            title="command-line"
                                        >
                                        <div class="cmd-list-left__title ellipsis">{{cmd.title}}</div>
                                    </div>
                                    <div class="cmd-list-right">
                                        <a
                                            href="javascript:;"
                                            class="copy"
                                            data-tooltip="Run script"
                                            (click)="copyToTerminal(cmd.command, cmd.type, true);"
                                        >
                                            Run script
                                        </a>
                                        <div
                                            class="btn-group"
                                            ngbDropdown
                                        >
                                            <button
                                                id="button-basic"
                                                ngbDropdownToggle
                                                type="button"
                                                class="dropdown-toggle"
                                                aria-controls="dropdown-basic"
                                            >
                                                Button dropdown
                                            </button>
                                            <ul
                                                id="dropdown-basic"
                                                ngbDropdownMenu
                                                class="dropdown-menu"
                                                role="menu"
                                                aria-labelledby="button-basic"
                                            >
                                                <li
                                                    role="menuitem"
                                                    ngbDropdownItem
                                                >
                                                    <a
                                                        class="dropdown-item"
                                                        href="javascript:void(0);"
                                                        (click)="openEditModal(cmd, 'edit')"
                                                    >
                                                        <img
                                                            src="/html/assets/img/device/edit-cmd.svg"
                                                            alt="edit-cmd"
                                                            title="edit-cmd"
                                                        >
                                                        Edit
                                                    </a>
                                                </li>
                                                <!-- <li role="menuitem" ngbDropdownItem>
                            <a class="dropdown-item" href="javascript:void(0);" (click)="cloneScript(cmd.id)">
                              <img
                                src="/html/assets/img/device/copy-script.svg"
                                alt="clone-cmd"
                                title="clone-cmd"
                              />
                              Clone</a
                            >
                          </li> -->
                                                <li
                                                    role="menuitem"
                                                    ngbDropdownItem
                                                >
                                                    <a
                                                        class="dropdown-item"
                                                        href="javascript:void(0);"
                                                        (click)="openModal(cmd.id, cmd.title, 'deleteCmd')"
                                                    >
                                                        <img
                                                            src="/html/assets/img/device/remove-terminal.svg"
                                                            alt="delete-cmd"
                                                            title="delete-cmd"
                                                        >
                                                        Delete
                                                    </a>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                                <div class="cmd-details">
                                    <span>{{cmd.command}}</span>
                                </div>
                            </li>
                        </ul>
                    </div>
                </ng-template>
            </ngb-tab>
            <ngb-tab title="History">
                <ng-template ngbTabContent>
                    <div class="cmn-tbs-content history-cmd">
                        <ul class="list-unstyled">
                            <li *ngFor="let history of historyList">
                                <div class="terminal-cmd-opt">
                                    <div class="cmd-list-left">
                                        <h5>{{history[1]}}</h5>
                                    </div>
                                    <div class="cmd-list-right">
                                        <span class="date">
                                            {{history[0] | date : DateTimeHistoryFormat}}
                                        </span>
                                    </div>
                                </div>
                                <div
                                    class="cmd-details"
                                    *ngFor="let sub of history"
                                >
                                    <!-- <h5>ipconfig / all</h5> -->
                                    <!-- <span
                      >Window IP Configuration Ethernet adapter Local Area
                      Connection 2:</span -->
                                    <span>{{sub}}</span>
                                    >
                                </div>
                            </li>
                        </ul>
                    </div>
                </ng-template>
            </ngb-tab>
        </ngb-tabset>
        <a
            href="javascript:;"
            (click)="openRunScript();"
            class="btn btn-primary"
        >
            <img
                src="/html/assets/img/device/run-script-blue.svg"
                alt="run-script"
            >
            Script Library
        </a>
    </div>
</aside>
