<aside
    class="right-sidebar script-sidebar script-details"
    [class.opened]="scriptDetail"
>
    <div>
        <div class="script-side-heder">
            <h2>
                <a
                    href="javascript:;"
                    class="close-btn"
                    title="Close"
                    (click)="emptyScriptDetail()"
                >
                    <img
                        src="/html/assets/img/device/back.svg"
                        alt="close"
                        title="close"
                    >
                </a>
                Script Library
            </h2>
            <span class="clone-cat">Cloned Scripts</span>
        </div>
        <div class="script-details-area">
            <!-- <h2>
            {{scriptDetailModal.title}}
          </h2> -->
            <!-- <div class="script-info">
            <div class="script-col">
              <h5>File Type</h5>
              <span>.bat</span>
            </div>
            <div class="script-col">
              <h5>Run as:</h5>
              <span>Current User</span>
            </div>
            <div class="script-col">
              <h5>Variables</h5>
              <span>No</span>
            </div>
            <div class="script-col">
              <h5>Max Run Time</h5>
              <span>10</span>
            </div>
          </div> -->
            <form method="POST">
                <div class="f-row">
                    <div class="f-col col-100">
                        <label for="Title">Command Title</label>
                        <div class="form-row">
                            <input
                                type="text"
                                id="title"
                                class="form-input"
                                placeholder="Command Title"
                                [(ngModel)]="scriptDetailModal.title"
                                name="title"
                                #Title1="ngModel"
                                [disabled]="scriptDetailModal.default === true"
                                required
                                [class.validation-error]="submitted == true && Title1.errors && Title1.errors.required"
                            >
                        </div>
                    </div>
                    <div class="f-col col-70">
                        <label for="command">Category</label>
                        <div class="form-row">
                            <div
                                class="grey-dropdown w-100"
                                ngbDropdown
                            >
                                <input
                                    type="text"
                                    placeholder="Select Category"
                                    [(ngModel)]="scriptDetailModal.category"
                                    id="category"
                                    ngbDropdownToggle
                                    autocomplete="off"
                                    class="cmn-select form-input"
                                    name="category"
                                    #Category1="ngModel"
                                    [disabled]="scriptDetailModal.default === true"
                                    required
                                    readonly
                                    [class.validation-error]="Category1.errors && Category1.errors.required"
                                >
                                <img
                                    class="icn-sm report-caret-icon"
                                    src="./..//html/assets/img/device/selct-arrow.svg"
                                >
                                <div
                                    ngbDropdownMenu
                                    aria-labelledby="dropdownBasic1"
                                >
                                    <button
                                        *ngFor="let category of cmdCategoryReadList"
                                        ngbDropdownItem
                                        (click)="setScriptDetail(category.name, category.id)"
                                    >
                                        {{category.name}}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="f-col col-30">
                        <label for="command">Script Type</label>
                        <div class="form-row">
                            <div
                                class="grey-dropdown w-100"
                                ngbDropdown
                            >
                                <input
                                    type="text"
                                    placeholder="Select Script Type"
                                    [(ngModel)]="scriptDetailModal.typeName"
                                    id="scriptType"
                                    ngbDropdownToggle
                                    autocomplete="off"
                                    class="cmn-select form-input"
                                    name="scriptType"
                                    #scriptType1="ngModel"
                                    required
                                    readonly
                                    [class.validation-error]="scriptType1.errors && scriptType1.errors.required"
                                >
                                <img
                                    class="icn-sm report-caret-icon"
                                    src="./..//html/assets/img/device/selct-arrow.svg"
                                >
                                <div
                                    ngbDropdownMenu
                                    aria-labelledby="dropdownType2"
                                >
                                    <button
                                        ngbDropdownItem
                                        (click)="toggleDetailTerminal('CMD', 'Command Line')"
                                    >
                                        Command Line
                                    </button>
                                    <button
                                        ngbDropdownItem
                                        (click)="toggleDetailTerminal('POWERSHELL', 'Powershell')"
                                    >
                                        Powershell
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="f-col col-100 cmd-description">
                        <div class="label cmn-tabs">
                            <a
                                (click)="showDescription = false"
                                href="javascript:;"
                                [ngClass]="{'active': showDescription == false}"
                            >
                                Command
                            </a>
                            <a
                                (click)="showDescription = true"
                                href="javascript:;"
                                [ngClass]="{'active': showDescription == true}"
                            >
                                Description
                            </a>
                        </div>
                        <div class="form-row">
                            <div
                                id="cmd_detail"
                                *ngIf="showDescription === false"
                            >
                                <ul id="cmd_detail_line">
                                    <li *ngFor="let line of lineNumberDetail">{{line}}</li>
                                </ul>
                                <textarea
                                    wrap="off"
                                    class="form-input"
                                    [(ngModel)]="scriptDetailModal.command"
                                    name="command1"
                                    (keyup)="countLineNumberDetail()"
                                    [disabled]="scriptDetailModal.default === true"
                                >

                                </textarea>
                            </div>
                            <textarea
                                *ngIf="showDescription === true"
                                class="form-input"
                                [(ngModel)]="scriptDetailModal.description"
                                name="description1"
                                [disabled]="scriptDetailModal.default === true"
                            ></textarea>
                        </div>
                    </div>
                </div>
                <div class="f-row">
                    <div class="f-col col-100">
                        <div class="form-row">
                            <button
                                type="button"
                                *ngIf="scriptDetailModal.default === false"
                                class="btn btn-primary"
                                (click)="updateMyScript()"
                            >
                                Save
                            </button>
                            <button
                                type="button"
                                *ngIf="scriptDetailModal.default === true"
                                class="btn btn-primary"
                                (click)="cloneScript(scriptDetailModal.id)"
                            >
                                Clone Script
                            </button>
                            <button
                                type="button"
                                class="btn btn-primary"
                                (click)="copyScriptToggle(scriptDetailModal, 'copy')"
                            >
                                Copy Script
                            </button>
                            <button
                                type="button"
                                class="btn btn-secondary"
                                (click)="scriptDetail = !scriptDetail"
                            >
                                Back
                            </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</aside>
