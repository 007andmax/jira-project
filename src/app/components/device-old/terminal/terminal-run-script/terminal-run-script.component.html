<aside class="right-sidebar script-sidebar opened">
    <div>
        <div class="script-side-header">
            <div class="script-side-header__title">Script Library</div>
            <a
                href="javascript:;"
                class="qt-aside__close-modal qt-icon icon__close"
                title="Close"
                (click)="close()"
            >
            </a>
        </div>
        <ngb-tabset>
            <ngb-tab [title]="'My Scripts (' + myScriptList.length + ')'">
                <ng-template ngbTabContent>
                    <div class="cmn-tbs-content myScript">
                        <form method="POST">
                            <div class="qt-inputs-row">
                              <div class="qt-input-block qt-f50">
                                <app-drop-down
                                  #selectCategory
                                  [sort]="false"
                                  [title]="'Category'"
                                  [placeholder]="'Select Category'"
                                  [field]="'name'"
                                  [list]="cmdCategoryReadList"
                                  (onSelectedItem)="filterMyScript($event)"
                                ></app-drop-down>
                              </div>
                              <div class="qt-input-block qt-f50">
                                <label class="qt-input-block__label" for="command">Search Scripts</label>
                                <div class="qt-input-search">
                                  <input
                                    type="text"
                                    placeholder="Search Scripts"
                                    class="form-input script-search"
                                    [(ngModel)]="myScriptModal.search"
                                    (keyup)="filterMyScript(undefined)"
                                    id="my_search"
                                    name="my_search"
                                  >
                                </div>
                              </div>
                            </div>
                        </form>
                        <ul
                            class="list-unstyled script-list qt-mt-24"
                            *ngIf="myScriptListFilter.length > 0"
                        >
                            <li *ngFor="let script of myScriptListFilter">
                                <div class="script-left">
                                    <div class="script-left__title">{{script.title}}</div>
                                    <span class="script-left__text">{{script.command}}</span>
                                    <span class="clone-cat">Cloned Scripts</span>
                                </div>
                                <div class="script-right">
                                    <div
                                      class="qt-button --square-md --gray pointer qt-mr-8 device-tooltip"
                                      data-tooltip="Run Script"
                                      (click)="copyToTerminal(script.command, script.type, true)"
                                    >
                                      <div class="icon__play-script qt-sz-16 qt-bg-contain "></div>
                                    </div>
                                    <div
                                      class="qt-button --square-md --gray pointer qt-bg-contain device-tooltip"
                                      data-tooltip="View Script"
                                      (click)="viewScriptDetail(script);"
                                    >
                                      <div class="icon__view qt-sz-16 qt-bg-contain"></div>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </ng-template>
            </ngb-tab>
            <ngb-tab [title]="'Shared Script Library (' + sharedScriptList.length + ')'">
                <ng-template ngbTabContent>
                    <div class="cmn-tbs-content script-library">
                        <form method="POST">
                            <div class="qt-inputs-row">
                              <div class="qt-input-block qt-f50">
                                <div class="qt-input-block__label">Category</div>
                                <app-drop-down
                                  #selectCategory
                                  [sort]="false"
                                  [placeholder]="'Select Category'"
                                  [field]="'name'"
                                  [list]="cmdCategoryReadList"
                                  (onSelectedItem)="filterSharedScript($event)"
                                ></app-drop-down>
                              </div>
                              <div class="qt-input-block qt-f50">
                                <label class="qt-input-block__label">Search Scripts</label>
                                <div class="qt-input-search">
                                  <input
                                    type="text"
                                    placeholder="Search description or filename"
                                    class="form-input script-search"
                                    (keyup)="filterSharedScript(undefined)"
                                    id="shared_search"
                                    name="shared_search"
                                    [(ngModel)]="sharedScriptModal.search"
                                  >
                                </div>
                              </div>
                            </div>
                        </form>
                        <ul
                            class="list-unstyled script-list qt-mt-24"
                            *ngIf="sharedScriptListFilter.length > 0"
                        >
                            <li *ngFor="let shared of sharedScriptListFilter">
                                <div class="script-left">
                                    <div class="script-left__title">{{shared.title}}</div>
                                    <span class="script-left__text">{{shared.command}}</span>
                                    <!-- <span class="clone-cat">Cloned Scripts</span> -->
                                </div>
                                <div class="script-right">
                                    <div
                                      class="qt-button --square-md --gray pointer qt-mr-8 device-tooltip"
                                      data-tooltip="Clone Script"
                                      (click)="cloneScript(shared.id)"
                                    >
                                      <div class="qt-icon icon__copy qt-sz-16 qt-bg-contain"></div>
                                    </div>
                                    <div
                                      class="qt-button --square-md --gray pointer device-tooltip"
                                      data-tooltip="View Script"
                                      (click)="viewScriptDetail(shared);"
                                    >
                                      <div class="icon__view qt-sz-16 qt-bg-contain"></div>
                                    </div>
                                </div>
                            </li>
                        </ul>

                </ng-template>
            </ngb-tab>
