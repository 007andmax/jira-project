<input
    id="typeahead-focus2"
    placeholder="Select Devices"
    type="text"
    [(ngModel)]="selectedDevice"
    class="pointer"
    [inputFormatter]="formatter"
    [resultFormatter]="formatter"
    [ngbTypeahead]="search"
    (selectItem)="selectItem($event)"
    (focus)="focus$.next('')"
    (click)="click$.next('')"
    #instance="ngbTypeahead"
    [disabled]="!devicesList || preloader"
>
<span>
    <i
        *ngIf="selectedDevice"
        class="icn-remove-old qt-icon icon__close qt-icon__gray-400 qt-sz-20"
        (click)="clearDevices()"
    ></i>
    <i
        *ngIf="!selectedDevice && !preloader"
        class="icn-sm qt-icon icon__arrow-down report-caret-icon"
    ></i>
    <i
        class="loading xs"
        *ngIf="preloader"
    ></i>
</span>
