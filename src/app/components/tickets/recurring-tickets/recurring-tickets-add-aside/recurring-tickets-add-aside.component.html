<div
    class="qt-aside-modern --large recurring-tickets-content__modal"
    *ngIf="opened"
>
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-title">Create Recurring Service</div>
        <div
            class="qt-aside-modern__header-close icon__close"
            (click)="close()"
        ></div>
    </div>
    <div class="qt-aside-modern__content recurring-tickets-content__modal--content">
        <div class="qt-inputs-row">
            <div class="qt-input-block">
              <div class="qt-input-block__label">Service Description</div>
              <div class="editable-description">
                <textarea
                  appTextArea
                  [limit]="250"
                  id="service-description"
                  placeholder="Write Description"
                  (input)="onChangeDescription($event)"
                  (onPast)="onPastDescription($event)"
                  class="qt-input-block__textarea"
                ></textarea>
              </div>
            </div>
        </div>
        <div class="qt-inputs-row recuring-assign-company">
            <div class="qt-input-block">
              <company-drop-down
                [class]="['light-dropdown']"
                [title]="'Assign to Company'"
                [placeholder]="'Select Company'"
                [editItem]="selectedClient"
                [field]="'name'"
                [search]="true"
                [change]="true"
                [validate]="validate.getCompany()"
                [errorMessage]="'Company name is required'"
                (onSelectedItem)="selectClient($event)"
                heightInput="auto"
              ></company-drop-down>
            </div>
        </div>
        <div class="qt-inputs-row">
          <div class="qt-f33 qt-input-block qt-w-md-100">
            <div class="qt-input-block__label">Device Name</div>
            <app-devices-recurring-tickets
              class="light-dropdown w-150"
              [companyId]="(selectedClient) ? selectedClient.id : ''"
              (selectedItem)="selectDevice($event)"
            >
            </app-devices-recurring-tickets>
          </div>
          <div class="qt-f33 qt-input-block qt-w-md-100">
            <div class="qt-input-block__label">Date</div>
            <app-date-picker
              [formatDate]="formatDate"
              [editMode]="true"
              [editDate]="recurringState.getCreateTicket().startDate"
              (onChange)="onChangeDatePicker($event)"
            ></app-date-picker>
          </div>
          <div class="qt-f33 qt-input-block qt-w-md-100">
            <div class="qt-input-block__label">Set Interval</div>
            <app-interval
              [valid]="validate.getInterval()"
              (cronChange)="onChangeCron($event)"
            ></app-interval>
            <mat-error *ngIf="!validate.getInterval()">Interval is required</mat-error>
          </div>
        </div>
        <div class="qt-inputs-row ticket-tabs">
            <!-- ONCLICK ADD CLASS 'active-tab'---------------------------------- -->
            <div
                class="ticket-tabs-service qt-df qt-ai-c"
                (click)="type = 'services'"
                [ngClass]="(type === 'services') ? 'active-tab' : ''"
            >
                <i class="icn-20 tab-service"></i>
                Service
            </div>
            <!-- ---------------------------------------------------------------- -->
            <!-- ONCLICK ADD CLASS 'active-tab'---------------------------------- -->
            <div
                class="ticket-tabs-product qt-df qt-ai-c"
                (click)="type = 'products'"
                [ngClass]="(type === 'products') ? 'active-tab' : ''"
            >
                <i class="icn-20 tab-product"></i>
                Products
            </div>
            <!-- ---------------------------------------------------------------- -->
        </div>
        <!-- IF TAB IS 'PRODUCT'----------------------------------------------- -->
        <div
            class="product-tab-content"
            *ngIf="type === 'products'"
        >
            <!-- <div class="error-products" *ngIf="errors.products.show"><p [textContent]="errors.products.text"></p></div> -->
            <ng-template
                ngFor
                let-product
                [ngForOf]="products"
                let-i="index"
                [ngForTrackBy]="trackByIndex"
            >
                <div
                    [ngClass]="{'separator-hr': products.length > 1}"
                    class="product-tab-content__item"
                >
                    <div
                      class="qt-inputs-row"
                      *ngIf="product.noValid"
                    >
                        <div class="qt-input-block">
                          <div class="product-errors">
                            <ng-template
                              ngFor
                              let-error
                              [ngForOf]="product.errors"
                            >
                              <p
                                [textContent]="error"
                                style="color:red;"
                              ></p>
                            </ng-template>
                          </div>
                        </div>
                    </div>
                    <div
                        class="qt-inputs-row"
                        [ngClass]="(product.noValid) ? 'no-valid-product' : ''"
                    >
                        <div class="qt-input-block">
                          <div class="qt-input-block__label">Search Product</div>
                          <app-product-list
                            [type]="'RECURRING-TICKET'"
                            [editItem]="product"
                            (selectedProductItem)="selectProduct($event,i)"
                          ></app-product-list>
                        </div>
                        <div
                          class="qt-input-block--icon qt-f33"
                          *ngIf="products.length > 1"
                        >
                          <i
                            class="icon__remove icn-16"
                            (click)="removeProduct(i)"
                          ></i>
                        </div>
                    </div>
                    <div class="qt-inputs-row">
                      <div class="qt-f33 qt-input-block">
                        <div class="qt-input-block__label">Serial No.</div>
                        <input
                          type="text"
                          [(ngModel)]="product.manufacture"
                          placeholder="Write Serial No."
                        >
                      </div>
                      <div class="qt-f33 qt-input-block">
                        <div class="qt-input-block__label">Product Cost</div>
                        <input
                          type="text"
                          number
                          [money]="'true'"
                          [(ngModel)]="product.cost"
                          placeholder="Write Product Cost"
                        >
                      </div>
                      <div class="qt-f33 qt-input-block">
                        <div class="qt-input-block__label">Quantity</div>
                        <input
                          type="text"
                          [(ngModel)]="product.quantity"
                          placeholder="Write Quantity"
                        >
                      </div>
                    </div>
                    <div class="qt-inputs-row">
                      <div class="qt-f33 qt-input-block">
                        <div class="qt-input-block__label">Product Price</div>
                        <input
                          type="text"
                          number
                          [money]="'true'"
                          [(ngModel)]="product.sale"
                          placeholder="Write Product Price"
                        >
                      </div>
                      <div class="qt-f33 qt-input-block">
                        <div class="qt-input-block__label">Discount</div>
                        <input
                          type="text"
                          [(ngModel)]="product.discount"
                          placeholder="Write Discount"
                        >
                      </div>
                    </div>
                </div>
            </ng-template>
        </div>
        <div
            class="new-link"
            *ngIf="type === 'products'"
            (click)="addProduct()"
        >
            +Add Product
        </div>
        <!-- ------------------------------------------------------------------ -->
        <!-- IF TAB IS 'SERVICE'----------------------------------------------- -->
        <div
            class="service-tab-content"
            *ngIf="type === 'services'"
        >
            <ng-template
                ngFor
                let-service
                [ngForOf]="services"
                let-i="index"
                [ngForTrackBy]="trackById"
            >
                <div
                    [ngClass]="{'separator-hr': services.length > 1}"
                    class="service-tab-content__item"
                >
                    <div
                      class="qt-inputs-row"
                      *ngIf="service.noValid"
                    >
                        <div class="qt-input-block">
                          <div
                            class="service-errors"
                          >
                            <ng-template
                              ngFor
                              let-error
                              [ngForOf]="service.errors"
                            >
                              <p
                                [textContent]="error"
                                style="color: red;"
                              ></p>
                            </ng-template>
                          </div>
                        </div>
                    </div>
                    <div class="qt-inputs-row">
                      <div
                        class="qt-input-block"
                        [ngClass]="(service.noValid) ? 'no-valid-service' : ''"
                      >
                        <div class="qt-input-block__label">Service</div>
                        <app-services-list
                          [editItem]="service"
                          [itemList]="servicesList"
                          (selectedServicesItem)="setService($event,i)"
                        ></app-services-list>
                      </div>
                      <div class="qt-input-block qt-f33 qt-flex-md-100">
                        <div class="qt-input-block__label">Duration</div>
                        <app-duration
                          class="light-dropdown"
                          (selectedDucation)="selectDuration($event,i)"
                          [editItem]="service.duration"
                        ></app-duration>
                      </div>
                      <div
                        class="qt-input-block--icon qt-f33"
                        *ngIf="services.length > 1"
                      >
                        <i
                          class="icon__remove icn-16"
                          (click)="removeService(i)"
                        ></i>
                      </div>
                    </div>
                    <div class="qt-inputs-row">
                        <div class="qt-input-block">
                          <div class="qt-input-block__label">Description</div>
                          <div class="editable-description">
                            <textarea
                              appTextArea
                              [limit]="250"
                              [(ngModel)]="service.description"
                              placeholder="Write Description"
                              (onPast)="onPastDescriptionService($event,i)"
                              class="qt-input-block__textarea"
                            ></textarea>
                          </div>
                        </div>
                    </div>
                </div>
            </ng-template>
        </div>
        <div
          class="new-link"
          *ngIf="type === 'services'"
          (click)="addService()"
        >
          +Add Service
        </div>
        <!-- ------------------------------------------------------------------ -->
        <div class="qt-inputs-row">
          <div class="qt-input-block">
            <app-tags (tagsChange)="onChangeTags($event)"></app-tags>
          </div>
        </div>
        <div class="qt-inputs-row checkbox-wrapper">
            <div class="qt-input-block with-checkbox">
                <label class="qt-checkbox pointer">
                    <input
                        id="requireUpdate-add"
                        type="checkbox"
                    >
                    <span></span>
                    <div class="qt-ml-8">Require update Notes</div>
                </label>
            </div>
            <div class="qt-input-block with-checkbox">
                <label class="qt-checkbox pointer">
                    <input
                        id="quickClose-add"
                        type="checkbox"
                    >
                    <span></span>
                    <div class="qt-ml-8">Quick Close</div>
                </label>
            </div>
            <div class="qt-input-block with-checkbox">
                <label class="qt-checkbox pointer">
                    <input
                        id="createTask-add"
                        type="checkbox"
                    >
                    <span></span>
                    <div class="qt-ml-8">Create Task for user</div>
                </label>
            </div>
        </div>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="qt-df qt-ai-c qt-jc-sb qt-w100">
            <div class="qt-df">
                <button
                    class="qt-button qt-mr-12"
                    (click)="onInitAddAndCopy()"
                >
                    Save & Copy
                </button>
                <button
                    class="qt-button qt-mr-12"
                    (click)="onInitAdd()"
                >
                    Save
                </button>
                <button
                    class="qt-button --gray"
                    (click)="close()"
                >
                    Cancel
                </button>
            </div>
            <div class="save-template">
                <app-tech-users
                    [users]="listTechUsers"
                    (usersChange)="onChangeTechUsers($event)"
                ></app-tech-users>
                <div class="assigned-users-list">
                    <ng-template
                        ngFor
                        let-user
                        [ngForOf]="techUsers"
                        let-i="index"
                        [ngForTrackBy]="trackByIndex"
                    >
                        <div *ngIf="user.avatar">
                            <img
                                ng-if="user.avatar"
                                class="img-circle avatar-26"
                                [src]="'/users/' + (user.id || 'default') + '/image' + (user.avatar ? '.jpg?t=' + user.avatar.updatedAt : '')"
                                alt="..."
                            >
                        </div>
                        <div *ngIf="!user.avatar">
                            <div class="default-user-avatar avatar-background-color-odd ng-scope">
                                <span [textContent]="user.firstName[0].toUpperCase()"></span>
                                <span [textContent]="user.lastName[0].toUpperCase()"></span>
                            </div>
                        </div>
                    </ng-template>
                </div>
            </div>
        </div>
    </div>
</div>
