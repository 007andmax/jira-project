<div
    class="qt-table-modern__row qt-table-modern__row--lg"
    [ngClass]="(ticket.noValid) ? 'no-valid' : ''"
>
    <div
        class="recurring-tickets__company-name pointer"
        (click)="editTicket()"
    >
        <div
            class="circle-avatar qt-ml-16 qt-mr-16"
            [textContent]="getParseShortName(ticket.company.name)"
        ></div>
        <p [textContent]="ticket.company.name"></p>
    </div>
    <div
        class="recurring-tickets__device pointer"
        (click)="editTicket()"
        [textContent]="(ticket.agent) ? ticket.agent.label : ''"
    ></div>
    <div
        class="recurring-tickets__description pointer"
        (click)="editTicket()"
        [textContent]="ticket.description"
    ></div>
    <div
        class="recurring-tickets__start-date pointer"
        (click)="editTicket()"
        [textContent]="getPareDate(ticket.startDate)"
    ></div>
    <div
        class="recurring-tickets__interval pointer"
        (click)="editTicket()"
        *ngIf="!ticket.suspended"
        [textContent]="recurringState.getTypeCron(ticket.cronExpression)"
    ></div>
    <div
        class="recurring-tickets__interval pointer"
        (click)="editTicket()"
        *ngIf="ticket.suspended"
    >
        Suspend
    </div>
    <div
        class="recurring-tickets__assigned-user assigned-container pointer"
        (click)="editTicket()"
    >
        <div class="qt-df multi-assign-user-container">
            <ng-template
                ngFor
                let-user
                let-i="index"
                [ngForOf]="ticket.assignedUsers"
                [ngForTrackBy]="trackById"
            >
                <app-recurring-tickets-table-assigned-user
                    class="multi-assign-user"
                    *ngIf="i < 3"
                    [user]="user"
                    [ngStyle]="{'left': getStyleNetAvatar(i)}"
                ></app-recurring-tickets-table-assigned-user>
            </ng-template>
            <div
                class="more-users qt-table-modern__circle-avatar"
                [ngbTooltip]="tipContent"
                [container]="'body'"
                *ngIf="ticket.assignedUsers.length > 3"
                [ngStyle]="{'left': getStyleNetAvatar(3)}"
                (click)="showSelectWrapper($event)"
            >
                <span [textContent]="'+' + (ticket.assignedUsers.length - 3)"></span>
            </div>
        </div>
        <ng-template #tipContent>
            <ng-template
                ngFor
                let-user
                let-i="index"
                [ngForOf]="ticket.assignedUsers"
                [ngForTrackBy]="trackById"
            >
                <app-recurring-tickets-table-assigned-user-more
                    *ngIf="i >= 3"
                    [user]="user"
                ></app-recurring-tickets-table-assigned-user-more>
            </ng-template>
        </ng-template>
    </div>
    <div class="recurring-tickets__menu">
        <div
            class="grey-dropdown right with-icons"
            ngbDropdown
        >
            <div
                class="qt-ic-c qt-icon icon__more qt-pointer qt-sz-16 qt-bg-contain pointer"
                id="dropdownBasic"
                ngbDropdownToggle
            >
            </div>
            <div
                ngbDropdownMenu
                aria-labelledby="dropdownBasic"
            >
                <button
                    ngbDropdownItem
                    (click)="editTicket()"
                >
                    <i class="qt-sz-20 qt-mr-12 qt-bg-contain qt-bg-contain qt-icon icon__edit"></i>
                    Edit
                </button>
                <button
                    ngbDropdownItem
                    (click)="suspendTicket()"
                    *ngIf="!ticket.suspended"
                >
                    <i class="qt-sz-20 qt-mr-12 qt-icon icon__block"></i>
                    Suspend
                </button>
                <button
                    ngbDropdownItem
                    (click)="resumeTicket()"
                    *ngIf="ticket.suspended"
                >
                    <i class="qt-sz-20 qt-mr-12 qt-icon icon__delete qt-icon__red-600"></i>
                    Resume
                </button>
                <button
                    ngbDropdownItem
                    (click)="removeTicket()"
                >
                    <i class="qt-sz-20 qt-mr-12 qt-icon icon__delete qt-icon__red-600"></i>
                    Delete
                </button>
            </div>
        </div>
    </div>
    <i
        class="icon__new-update qt-db no-valid-label"
        *ngIf="(ticket.noValid)"
    ></i>
</div>
