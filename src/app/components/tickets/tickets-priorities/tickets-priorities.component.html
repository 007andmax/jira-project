<div class="light-dropdown" ngbDropdown>
  <i class="icn-sm report-caret-icon"></i>
  <span [ngClass]="getSelectedClass()"></span>
  <input type="text" [value]="getSelectedPriority()" autocomplete="new-password"
         placeholder="Select Service Type"
         id="dropdownPaymentType" ngbDropdownToggle />
  <div ngbDropdownMenu aria-labelledby="dropdownPaymentType">
    <ng-template ngFor let-item [ngForOf]="list" let-i="index">
      <a tabindex="-1" href="javascript:void(0)" ngbDropdownItem (click)="onSelectPriority(i)">
        <span [ngClass]="getItemClass(item)"></span>
        {{item.title}}
      </a>
    </ng-template>
  </div>
</div>
