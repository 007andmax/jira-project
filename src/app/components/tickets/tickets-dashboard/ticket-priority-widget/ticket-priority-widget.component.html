<div class="contract-dashboard-chart-card contract-dashboard-chart-card__open-ticket-priority qt-mr-16">
    <div class="contract-dashboard-chart-card__header">
        <div class="contract-dashboard-chart-card__header-title">Created Ticket Priority</div>
    </div>
    <div class="contract-dashboard-chart-card__chart-content">
        <ngx-charts-pie-chart
            #nvd3
            [view]="[210,210]"
            [customColors]="customColors"
            [results]="data"
            [legend]="false"
            [labels]="false"
            [doughnut]="true"
            [arcWidth]="0.2"
        >
        </ngx-charts-pie-chart>
        <div class="contract-dashboard-chart-card__chart-info">
            <div
                class="contract-dashboard-chart-card__title"
                [textContent]="getTotal()"
            ></div>
            <div class="contract-dashboard-chart-card__subtitle">Total Ticket</div>
        </div>
    </div>
    <div
        *ngIf="ticketsPriorities.length > 0"
        class="button-loader qt-df qt-jc-fe qt-mt-4 qt-mb-10"
        (click)="toggleAllPriorities = !toggleAllPriorities"
    >
        <span
            class="qt-fw-600 qt-fs-12 qt-lh-133 qt-color-info qt-pointer qt-pr-20"
            [textContent]="toggleAllPriorities ? '- hide' : '+ show more'"
        ></span>
    </div>
    <div class="contract-dashboard-chart-card__footer">
        <ng-template
            ngFor
            let-priority
            let-i="index"
            [ngForOf]="ticketsPriorities"
            [ngForTrackBy]="trackById"
        >
            <div
                class="contract-dashboard-chart-card__footer-item"
                *ngIf="toggleAllPriorities ? true : i < 4"
            >
                <div class="contract-dashboard-chart-card__footer-item-title-block">
                    <div
                        [ngStyle]="{'background-color':statusColors[priority.color].textColor ,
                            'border-color': statusColors[priority.color].textColor}"
                        class="contract-dashboard-chart-card__footer-item-box"
                    ></div>
                    <div>
                        <div
                            class="contract-dashboard-chart-card__footer-item-title"
                            [textContent]="priority.name"
                        ></div>
                        <div
                            class="contract-dashboard-chart-card__footer-item-value"
                            [textContent]="dashboardTicketsStats.counts[priority.getNameForCounts()]"
                        ></div>
                    </div>
                </div>
            </div>
        </ng-template>
