<div class="qt-card billing-hours qt-mr-16">
  <div class="contract-dashboard-chart-card__header">
    <div class="billing-hours__header-title">Billable Hours</div>
    <div class="list-type" ngbDropdown>
      <div class="billing-hours__interval-title pointer" ngbDropdownToggle [textContent]="currentInterval.title"  id="dropdownIntervals"></div>
      <ul class="qt-dropdown-menu --border --open-left" ngbDropdownMenu aria-labelledby="dropdownIntervals">
        <ng-template ngFor let-item [ngForOf]="listIntervals" >
          <li class="pointer" tabindex="-1" href="javascript:void(0)" ngbDropdownItem [textContent]="item.title" (click)="onSelectInterval(item)"></li>
        </ng-template>
      </ul>
    </div>
  </div>
  <div class="qt-pl-24 qt-pr-24 qt-pb-12 qt-pt-12 qt-df">
    <div class="labels-container">
      <ng-template ngFor let-item [ngForOf]="dashboardTicketsBillableHours.lines">
        <div class="labels-container-item qt-fw-600">{{ item.title }}</div>
      </ng-template>
    </div>
    <div class="cols-container">
      <ng-template ngFor let-item [ngForOf]="dashboardTicketsBillableHours.counters">
        <div class="cols-container-item">
          <div class="cols-container-item-number">{{ item }}</div>
        </div>
      </ng-template>
      <div class="lines-container">
        <ng-template ngFor let-item [ngForOf]="dashboardTicketsBillableHours.lines">
          <ng-template #tipContent class="tooltip lines-container-tooltip">
            <div class="lines-container-tooltip-header qt-fw-600">{{ item.title }}</div>
            <div class="lines-container-tooltip-header" [textContent]="getTime(item.value)"></div>
          </ng-template>
          <div class="lines-container__line pointer" placement="top" [ngbTooltip]="tipContent"  [ngStyle]="{'width': item.percent + '%'}" placement="right" [ngbTooltip]="tipContent"></div>
        </ng-template>
      </div>
    </div>
  </div>
</div>
