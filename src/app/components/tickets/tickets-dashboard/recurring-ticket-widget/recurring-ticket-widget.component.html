<div class="contract-dashboard-chart-card qt-mr-16">
    <div class="contract-dashboard-chart-card__header">
        <div class="contract-dashboard-chart-card__header-title">Recurring Ticket</div>
    </div>
    <div class="contract-dashboard-chart-card__chart-content">
        <ngx-charts-pie-chart
            #nvd3
            [view]="[210,210]"
            [scheme]="chartColors"
            [results]="data"
            [legend]="false"
            [labels]="false"
            [doughnut]="true"
            [arcWidth]="0.2"
        >
        </ngx-charts-pie-chart>
        <div class="contract-dashboard-chart-card__chart-info">
            <div
                class="contract-dashboard-chart-card__title"
                [textContent]="getTotal()"
            ></div>
            <div class="contract-dashboard-chart-card__subtitle">Total Ticket</div>
        </div>
    </div>
    <div class="contract-dashboard-chart-card__footer">
        <div class="contract-dashboard-chart-card__footer-item">
            <div class="contract-dashboard-chart-card__footer-item-title-block">
                <div
                    style="background-color: #0747a6;"
                    class="contract-dashboard-chart-card__footer-item-box"
                ></div>
                <div>
                    <div class="contract-dashboard-chart-card__footer-item-title">Recurring Open Tickets</div>
                    <div
                        class="contract-dashboard-chart-card__footer-item-value"
                        [textContent]="dashboardTicketsStats.RECURRING_TICKETS_OPEN"
                    ></div>
                </div>
            </div>
        </div>
        <div class="contract-dashboard-chart-card__footer-item">
            <div class="contract-dashboard-chart-card__footer-item-title-block">
                <div
                    style="background-color: #00ccff;"
                    class="contract-dashboard-chart-card__footer-item-box"
                ></div>
                <div>
                    <div class="contract-dashboard-chart-card__footer-item-title">Recurirng Close Tickets</div>
                    <div
                        class="contract-dashboard-chart-card__footer-item-value"
                        [textContent]="dashboardTicketsStats.RECURRING_TICKETS_CLOSED"
                    ></div>
                </div>
            </div>
        </div>
    </div>
</div>
