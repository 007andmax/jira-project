<div
    [ngClass]="{'--selected': selected}"
    class="qt-table-modern__row"
>
    <div class="ticket-table__check">
        <div class="qt-df">
            <label
                class="qt-checkbox"
               
                [attr.for]="'ticket-' + ticket.id"
            >
                <input
                    [attr.id]="'ticket-' + ticket.id"
                    [(ngModel)]="ticket.selected"
                    type="checkbox"
                    (change)="selectTicket($event)"
                   
                >
                <span></span>
            </label>
        </div>
    </div>
    <div
        class="ticket-table__requested-by"
        (click)="selectForDetail()"
    >
    <ng-template #popContent let-greeting="greeting"
	>
    <app-tickets-table-item-requested-by 
    [requestedUser]="requestedUser"
    [indexNoAvatar]="indexNoAvatar"
    [listColorNoAvatar]="listColorNoAvatar"
    ></app-tickets-table-item-requested-by>
    </ng-template
>
        <div class="qt-df qt-ai-c ticket-table__requested-by-inner" 
        	[ngbPopover]="popContent"
            [popoverClass]="'requested-by-popover'"
          [autoClose]="'outside'"
        [container]="'body'"
		triggers="mouseenter">
            <div
                class="qt-table-modern__circle-avatar"
                [ngClass]="!usersStateService.getNameForAvatar(requestedUser).length ? 'transparent-text' : ''"
                [textContent]="usersStateService.getNameForAvatar(requestedUser)"
                [ngStyle]="{'background': ticketsListService.getStyleAvatar(requestedUser,listColorNoAvatar[indexNoAvatar]) }"
            ></div>
            <div
                [textContent]="getUserName(requestedUser)"
                class="ellipsis"
            ></div>
        </div>
    </div>
     <div
        class="ticket-table__number"
    >
        <div class="ellipsis">
            {{'Tkt# ' + ticket.number}}
        </div>
    </div>
    <div
        class="--strong ticket-table__subject"
        (click)="selectForDetail()"
    >
        <div class="ellipsis">
            {{ticket.subject}}
            <span
                *ngIf="ticket.priorityLevel && ticket.priorityLevel.isDisplay"
                class="priority-icon"
                [ngStyle]="{'background-color':  listColors[ticket.priorityLevel.color] && listColors[ticket.priorityLevel.color].textColor,'border-color':  listColors[ticket.priorityLevel.color] && listColors[ticket.priorityLevel.color].textColor}"
            ></span>
        </div>
    </div>
    <div
        class="ticket-table__company"
        (click)="selectForDetail()"
    >
        <div
            class="ellipsis"
            [ngClass]="{'qt-color-red-600':ticket.isCompanyDeleted}"
            [textContent]="getCompanyName()"
        >
        </div>
        <div
            class="qt-color-red-600 qt-ml-8"
            *ngIf="ticket.isCompanyDeleted"
        >
            Archived
        </div>
    </div>
    <div
        class="ticket-table__assignee"
    >
    <app-tickets-table-item-assigned-user 
     class="assigned-user-ticket-detail"
    [reqUserList]="userList"
    [ticket]="ticket"
    [assignedUser]="assignedUser"
    [listColorNoAvatar]="listColorNoAvatar"
    [indexNoAvatar]="indexNoAvatar"
    [listAssignedUser]="listAssignedUser"
    ></app-tickets-table-item-assigned-user>
    </div> 
    <div
        class="ticket-table__status"
         
    >
    <app-tickets-table-item-status [ticket]="ticket"
    [ticketsStatus]="ticketsStatus"
    [listColors]="listColors"
    ></app-tickets-table-item-status>
    </div>
    <div
        (click)="selectForDetail()"
        class="ticket-table__created-date"
        [textContent]="getCreateAt()"
    ></div>
    <div
        (click)="selectForDetail()"
        class="ticket-table__created-date"
        [textContent]="ticket.lastUpdatedAt_text"
    ></div>
</div>
