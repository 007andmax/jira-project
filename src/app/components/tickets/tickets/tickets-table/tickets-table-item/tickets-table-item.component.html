<div
    [ngClass]="{'--selected': selected}"
    class="qt-table-modern__row"
    *ngIf="requestedUser"
>
    <div class="ticket-table__requested-by">
        <div class="qt-df qt-ai-c ticket-table__requested-by-inner">
            <div
                class="qt-table-modern__circle-avatar"
                [ngClass]="!usersStateService.getNameForAvatar(requestedUser).length ? 'transparent-text' : ''"
                [textContent]="usersStateService.getNameForAvatar(requestedUser)"
                [ngStyle]="{'background': ticketsListService.getStyleAvatar(requestedUser,listColorNoAvatar[indexNoAvatar]) }"
            ></div>
            <div
                [textContent]="getUserName(requestedUser)"
                class="ellipsis"
            ></div>
        </div>
    </div>
    <div class="--strong ticket-table__subject">
        <div class="ellipsis">
            {{'Tkt# ' + ticket.number + ' - ' + ticket.subject}}
            <span
                *ngIf="ticket.priorityLevel && ticket.priorityLevel.isDisplay"
                class="priority-icon"
                [ngStyle]="{'background-color':  listColors[ticket.priorityLevel.color] && listColors[ticket.priorityLevel.color].textColor ,
                            'border-color':  listColors[ticket.priorityLevel.color] && listColors[ticket.priorityLevel.color].textColor}"
            ></span>
        </div>
    </div>
    <div class="ticket-table__company">
        <div
            class="ellipsis"
            [ngClass]="{'qt-color-red-600':ticket.isCompanyDeleted}"
            [textContent]="getCompanyName()"
        >
        </div>
        <div
            class="qt-color-red-600 qt-ml-8"
            *ngIf="ticket.isCompanyDeleted"
        >
            Archived
        </div>
    </div>
    <div
        class="ticket-table__assignee"
        *ngIf="!ticket.assignedUserId && ticket.multiAssignedUsers &&  ticket.multiAssignedUsers.length > 0"
    >
        <div class="qt-df multi-assign-user-container">
            <ng-template
                ngFor
                let-user
                let-i="index"
                [ngForOf]="ticket.multiAssignedUsers"
                [ngForTrackBy]="trackById"
            >
                <div
                    class="qt-table-modern__circle-avatar multi-assign-user"
                    *ngIf="i < 5"
                    [textContent]="getAssignedUserNameForAvatar(user)"
                    [ngStyle]="{'background': ticketsListService.getStyleAvatar(user,listColorNoAvatar[indexNoAvatar]) ,
                'left': getStyleNetAvatar(i)}"
                    [ngbTooltip]="user.firstName + ' ' + user.lastName"
                    [container]="'body'"
                ></div>
            </ng-template>
            <div
                class="more-users qt-table-modern__circle-avatar"
                [ngbTooltip]="tipContent"
                [container]="'body'"
                *ngIf="ticket.multiAssignedUsers.length > 5"
                [ngStyle]="{'left': getStyleNetAvatar(5)}"
            >
                <span [textContent]="'+' + (ticket.multiAssignedUsers.length - 5)"></span>
            </div>
        </div>
        <ng-template #tipContent>
            <ng-template
                ngFor
                let-user
                let-i="index"
                [ngForOf]="ticket.multiAssignedUsers"
                [ngForTrackBy]="trackById"
            >
                <div
                    class="qt-df qt-ai-c qt-mb-8"
                    *ngIf="i >= 5"
                >
                    <div
                        class="tooltip__circle-avatar"
                        [textContent]="getAssignedUserNameForAvatar(user)"
                        [ngStyle]="{'background': ticketsListService.getStyleAvatar(user,listColorNoAvatar[indexNoAvatar]) }"
                    ></div>
                    <span
                        class="qt-ml-8"
                        [textContent]="user.firstName + ' ' + user.lastName"
                    ></span>
                </div>
            </ng-template>
        </ng-template>
    </div>
    <div
        class="ticket-table__assignee"
        *ngIf="!ticket.assignedUserId && ticket.multiAssignedUsers &&  ticket.multiAssignedUsers.length === 0 || !ticket.assignedUserId && !ticket.multiAssignedUsers"
    ></div>
    <div
        class="ticket-table__assignee"
        *ngIf="ticket.assignedUserId && ticket.multiAssignedUsers &&  ticket.multiAssignedUsers.length === 0 || ticket.assignedUserId && !ticket.multiAssignedUsers"
    >
        <div class="qt-df">
            <div
                class="qt-table-modern__circle-avatar"
                [textContent]="getAssignedUserNameForAvatar(assignedUser)"
                [ngStyle]="{'background': ticketsListService.getStyleAvatar(assignedUser,listColorNoAvatar[indexNoAvatar])}"
            ></div>
            <div
                class="ellipsis"
                [textContent]="getUserName(assignedUser)"
            ></div>
        </div>
    </div>
    <div class="ticket-table__status">
        <span
            class="tag__modern"
            [ngStyle]="getStyleStatus((ticket.customStatus) ? ticket.customStatus : ticket.status)"
            *ngIf="ticket.status === 'IN_PROGRESS'"
        >
            {{(!ticket.customStatus) ? 'In Progress' : ticket.customStatus}}
        </span>
        <span
            class="tag__modern"
            [ngStyle]="getStyleStatus(ticket.status)"
            *ngIf="ticket.status === 'COMPLETED'"
        >
            Completed
        </span>
        <span
            class="tag__modern"
            [ngStyle]="getStyleStatus('UNASSIGNED')"
            *ngIf="ticket.status === null"
        >
            Unassigned
        </span>
        <span
            class="tag__modern"
            [ngStyle]="getStyleStatus(ticket.status)"
            *ngIf="ticket.status === 'ON_HOLD'"
        >
            On Hold
        </span>
    </div>
    <div
        class="ticket-table__created-date"
        [textContent]="getCreateAt()"
    ></div>
</div>
