<div class="ticket-detail-page__header">
    <div class="breadcrumbs">
        <div class="breadcrumbs-location qt-fs-0 pointer">
            All Tickets
            <div class="breadcrumb-separator">/</div>
        </div>
        <div class="breadcrumbs-attribute qt-fs-0">
            <span [textContent]="'Tkt #' + ticketProfile.number"></span>
        </div>
    </div>
    <div class="qt-df qt-ai-c qt-pos-rel ticket-detail-page__management-block">
        <div class="qt-button qt-button-timer --gray qt-ml-12">
            <span class="qt-icon icon__timer qt-sz-16 qt-dib qt-mr-8 qt-button-icon qt-fs-0"></span>
            {{dateTxt}}
        </div>
         <div
            [hidden]="!(ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null) && (customerPortalStateService.isCustomerPortal && isAddNoteForCustomerUser() || !customerPortalStateService.isCustomerPortal))"
            class="qt-button qt-ml-12"
            *ngIf="!ticketProfile.hasIncompleteItems"
            appDisabledBtn
            #update_closeBtn="disabled"
            (onClick)="close()"
            [ngClass]="{ '--loading':isUpdateAndClose}"
        >
            <span
                class="qt-icon icon__check qt-icon__white qt-sz-16 qt-dib qt-mr-8 qt-button-icon"
                *ngIf="!isUpdateAndClose"
            ></span>
            <span>Close Ticket</span>
            <app-preloader-ticket *ngIf="isUpdateAndClose"></app-preloader-ticket>
        </div>
        <div
            [hidden]="!(ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null) && (customerPortalStateService.isCustomerPortal && isAddNoteForCustomerUser() || !customerPortalStateService.isCustomerPortal))"
            class="qt-button qt-ml-12"
            *ngIf="ticketProfile.hasIncompleteItems"
            appDisabledBtn
            #update_closeBtn="disabled"
            (onClick)="closeForPeview()"
            [ngClass]="{'--loading':isUpdateAndClose}"
        >
            <span
                class="qt-icon icon__check qt-icon__white qt-sz-16 qt-dib qt-mr-8 qt-button-icon"
                *ngIf="!isUpdateAndClose"
            ></span>
            <span>Close For Preview</span>
            <app-preloader-ticket *ngIf="isUpdateAndClose"></app-preloader-ticket>
        </div>
    </div>
</div>
<div class="ticket-detail-page__panel">
    <div class="ticket-detail-page__panel-container">
        <div class="qt-df qt-ai-c">
               <ng-template #popContent let-greeting="greeting"
	>
            <app-tickets-table-item-requested-by
            [requestedUser]="getUserById(currentUser.id)"
            [indexNoAvatar]="indexNoAvatar"
            [listColorNoAvatar]="listColorNoAvatar"
            [ticket]="ticketProfile"
            ></app-tickets-table-item-requested-by>
            </ng-template
        >
            <div
                class="qt-sz-36 qt-img-cover qt-circle qt-mr-16 header-avatar qt-pointer"
                [textContent]="ticketsListService.getAssignedUserNameForAvatar(currentUser)"
                [ngStyle]="{'background': ticketsListService.getStyleAvatar(currentUser)}"
                   [ngbPopover]="popContent"
                [popoverClass]="'requested-by-popover'"
                 [autoClose]="'outside'"
                 [container]="'body'"
                #p="ngbPopover"
                triggers="manual"
                appUserLogoPopover
                [user]="getUserById(currentUser.id)"
                [popover]="p"
                [disabled]="!currentUser"
                [disablePopover]="!currentUser"
            ></div>
            <div
                class="qt-df qt-ai-c"
                *ngIf="ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null) && (customerPortalStateService.isCustomerPortal && isAddNoteForCustomerUser() || !customerPortalStateService.isCustomerPortal)"
            >
                <div
                    class="qt-button qt-button--with-icon --gray --md pointer qt-mr-8"
                    (click)="setNoteType('PUBLIC');addUpdate('NOTE')"
                >
                    <div class="qt-icon icon__reply qt-sz-16 qt-bg-contain qt-button-icon qt-mr-6"></div>
                    Reply
                </div>
                <div
                    class="qt-button qt-button--with-icon --gray --md pointer qt-mr-8"
                    (click)="setNoteType('PRIVATE');addUpdate('NOTE')"
                    *ngIf="!customerPortalStateService.isCustomerPortal"
                >
                    <div class="qt-icon icon__messages qt-sz-16 qt-bg-contain qt-button-icon qt-mr-6"></div>
                    Private Note
                </div>
                <div
                    class="qt-button qt-button--with-icon --gray --md pointer qt-mr-8"
                    (click)="setNoteType('PRIVATE');addUpdate('PRODUCT')"
                    *ngIf="!customerPortalStateService.isCustomerPortal"
                >
                    <div class="qt-icon icon__products qt-sz-16 qt-button-icon qt-mr-6"></div>
                    Products
                </div>
                <div
                    class="qt-button qt-button--with-icon --gray --md pointer qt-mr-8"
                    (click)="setNoteType('PRIVATE');addUpdate('SERVICE')"
                    *ngIf="!customerPortalStateService.isCustomerPortal"
                >
                    <div class="qt-icon icon__service qt-sz-16 qt-bg-contain qt-button-icon qt-mr-6"></div>
                    Service
                </div>
                <div
                    class="qt-button qt-button--with-icon --gray --md pointer qt-mr-8"
                    (click)="setNoteType('PUBLIC');addUpdate('QUICK_SUPPORT')"
                    *ngIf="!customerPortalStateService.isCustomerPortal"
                >
                    <div class="qt-icon icon__zap-fast qt-sz-16 qt-bg-contain qt-button-icon qt-mr-6"></div>
                    Quick Support
                </div>
            </div>
        </div>
        <div
            class="qt-df qt-ai-c ticket-detail-page__dropdown-category-more"
            ngbDropdown
            *ngIf="ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null) && !customerPortalStateService.isCustomerPortal"
        >
            <div
                class="qt-button --square-md --gray pointer qt-ml-8"
                ngbDropdownToggle
            >
                <div class="qt-icon icon__more qt-sz-16 qt-bg-contain"></div>
            </div>
            <div
                ngbDropdownMenu
                class="dropdown-menu-qt icon__more-dropdown"
            >
                <ul
                    class
                    role="menu"
                    class="dropdown-qt"
                >
                    <li
                        *ngIf="ticketsPermissionsService.isActionVisible('claim_ticket', ticketProfile,null,null)"
                        (click)="claimTicket()"
                    >
                        <a
                            tabindex="-1"
                            class="dropdown-item"
                            href="javascript:void(0)"
                        >
                            <i class="qt-sz-20 qt-icon icon__claim-edit-ticket"></i>
                            Claim Ticket
                        </a>
                    </li>
                    <li
                        *ngIf="ticketsPermissionsService.isActionVisible('send_to_spam', ticketProfile,null,null)"
                        (click)="moveIntoSpam()"
                    >
                        <a
                            tabindex="-1"
                            class="dropdown-item spam-user"
                            href="javascript:void(0)"
                            *ngIf="currentUser && currentUser.isOwner"
                        >
                            <i class="qt-sz-20 qt-icon icon__block"></i>
                            Mark as Spam
                        </a>
                        <a
                            tabindex="-1"
                            class="dropdown-item spam-user"
                            href="javascript:void(0)"
                            *ngIf="currentUser && !currentUser.isOwner"
                        >
                            <i class="qt-sz-20 qt-icon icon__spam"></i>
                            Report as Spam
                        </a>
                    </li>
                    <li
                        class="trash-user-list"
                        *ngIf="ticketsPermissionsService.isActionVisible('send_to_trash', ticketProfile,null,null)"
                        (click)="moveToTrash(true)"
                    >
                        <a
                            tabindex="-1"
                            class="dropdown-item trash-user"
                            href="javascript:void(0)"
                        >
                            <i class="qt-sz-20 qt-bg-contain qt-icon icon__delete"></i>
                            Move to Trash
                        </a>
                    </li>
                </ul>
            </div>
            <div class="ticket-detail-page__separator"></div>
            <div
                class="qt-button --square-md --gray pointer"
                (click)="toggleRigthPanel()"
            >
                <div class="qt-icon icon__panel-open qt-sz-16"></div>
            </div>
        </div>
    </div>
</div>
