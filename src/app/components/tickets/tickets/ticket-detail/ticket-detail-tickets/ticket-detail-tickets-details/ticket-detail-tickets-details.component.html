<div class="ticket-detail-tickets ticket-detail-contact__full">
    <div class="ticket-detail-tickets__header qt-df qt-ai-c qt-jc-sb">
        <div class="ticket-detail-tickets__title">Tickets</div>
        <div
            class="qt-button --square-md --gray pointer"
            (click)="close()"
        >
            <div class="qt-icon icon__close qt-bg-contain qt-sz-16 pointer"></div>
        </div>
    </div>
    <div class="qt-input-search qt-mt-16 qt-mb-16 qt-ml-16 qt-mr-16">
        <input
            id="search-tickets"
            placeholder="Search tickets"
            (keyup)="onKeyUp($event)"
        >
        <span
            *ngIf="isSearch"
            (click)="clearSearch()"
            class="search-clear icon__close-round"
        ></span>
    </div>
    <div
        class="ticket-detail-tickets__body"
        [ngStyle]="{'height': (showPendingPreloader) ? 'calc(100% - 200px)' : 'calc(100% - 124px)'}"
    >
        <div
            class="ticket-detail-tickets__history"
            infiniteScroll
            [infiniteScrollContainer]="container"
            [infiniteScrollDistance]="2"
            [infiniteScrollThrottle]="50"
            [infiniteScrollDisabled]="infiniteScrollDisabled"
            (scrolled)="onScroll()"
        >
            <div
                class="no-find-tickets"
                *ngIf="tickets.length == 0 && !showPreloader"
            >
                <div class="no-find-tickets-avatar">
                    <div class="qt-icon icon__tickets-detail-contact qt-sz-24 qt-bg-contain"></div>
                </div>
                <h4 class="qt-mt-16">No Tickets Found</h4>
                <span>Try using another word</span>
            </div>
            <ng-template
                ngFor
                let-ticket
                [ngForOf]="tickets"
                [ngForTrackBy]="trackById"
            >
                <div
                    class="ticket-detail-tickets__history-block"
                    (click)="editTicket(ticket.id)"
                >
                    <div class="qt-df qt-ai-fs">
                        <div class="ticket-detail-tickets__icon-wrap qt-dif qt-jc-c qt-ai-c qt-mr-8">
                            <i class="qt-icon icon__tickets-detail-contact qt-sz-20 qt-dib"></i>
                        </div>
                        <div>
                            <div
                                class="ticket-detail-tickets__history-block-title"
                                [textContent]="ticket.subject"
                            >
                            </div>
                            <div
                                class="ticket-detail-tickets__history-block-date"
                                [textContent]="'Tkt# ' + ticket.number + ' · ' + getCreateAt(ticket.createdAt)"
                            >
                            </div>
                            <ticket-detail-tickets-status [ticketProfile]="ticket"></ticket-detail-tickets-status>
                        </div>
                    </div>
                </div>
            </ng-template>
            <div
                class="loading pengind-loading"
                *ngIf="showPendingPreloader"
            ></div>
        </div>
        <div
            class="loading"
            *ngIf="showPreloader"
        ></div>
    </div>
</div>
