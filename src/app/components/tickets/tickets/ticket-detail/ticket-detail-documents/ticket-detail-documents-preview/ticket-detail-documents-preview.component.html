<div class="ticket-detail-documents qt-mb-8">
    <div class="ticket-detail-documents__header qt-pos-rel pointer">
        <div class="ticket-detail-documents__title">Document Preview</div>
        <i class="icn-sm report-caret-icon pointer"></i>
    </div>
    <div
        class="ticket-detail-documents__body"
        [hidden]="showPreloader"
    >
        <div class="documents-create-panel__body qt-pt-24 qt-pb-24 qt-pl-24 qt-pr-24">
            <div class="documents-create-panel__header">
                <h3 [textContent]="document.title"></h3>
            </div>
            <div class="documents-create-panel__content"></div>
        </div>
    </div>
    <div
        class="loading"
        *ngIf="showPreloader"
    ></div>
</div>
