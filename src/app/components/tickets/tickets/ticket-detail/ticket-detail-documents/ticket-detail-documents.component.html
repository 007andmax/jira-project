<div class="ticket-detail-documents qt-mb-8">
    <div
        class="ticket-detail-documents__header qt-pos-rel pointer"
        (click)="toggleContainer = !toggleContainer"
    >
        <div class="ticket-detail-documents__title">Documents</div>
        <i class="icn-sm report-caret-icon pointer"></i>
    </div>
    <div
        class="ticket-detail-documents__body"
        *ngIf="documents.length > 0"
    >
        <ng-template
            ngFor
            let-document
            [ngForOf]="documents"
            [ngForTrackBy]="trackByIndex"
        >
            <div class="ticket-detail-documents__container">
                <div
                    class="ticket-detail-documents__title"
                    [textContent]="document.title"
                ></div>
                <div class="qt-df qt-ai-c qt-mb-12">
                    <i class="icon__ticket-document qt-bg-contain qt-sz-16 qt-mr-8"></i>
                    <div
                        class="ticket-detail-documents__subtitle"
                        [textContent]="document.categoryName"
                    ></div>
                </div>
                <div
                    class="ticket-detail-documents__view pointer"
                    (click)="viewDocument(document)"
                >
                    View
                </div>
            </div>
        </ng-template>
        <button
            class="qt-button --gray --sm qt-w100 qt-jc-c"
            (click)="showMore()"
        >
            View more info
        </button>
    </div>
</div>
