<div class="ticket-detail-documents ticket-detail-documents__full">
    <div class="ticket-detail-documents__header qt-df qt-ai-c qt-jc-sb">
        <div class="ticket-detail-documents__main-title">Documents</div>
    </div>
    <div class="qt-input-search qt-mt-16 qt-mb-16 qt-ml-16 qt-mr-16">
        <input
            id="search-documents"
            placeholder="Search Documents"
            (input)="search($event)"
        >
        <span
            *ngIf="isSearch"
            (click)="clearSearch()"
            class="search-clear qt-icon icon__close-round qt-icon__gray-400"
        ></span>
    </div>
    <div class="ticket-detail-documents__body">
        <div
            class="no-find-documents"
            *ngIf="documents.length == 0 && !showPreloader"
        >
            <div class="no-find-documents-avatar">
                <div class="qt-icon icon__documents qt-sz-24 qt-bg-contain"></div>
            </div>
            <h4
                class="qt-mt-16"
                [textContent]="documents.length == 0 && !isSearch ? 'No Documents' : 'No Documents found'"
            ></h4>
            <span [textContent]="documents.length == 0 && !isSearch ? 'New Documents will appear here' : 'Try using another word'"></span>
        </div>
        <ng-template
            ngFor
            let-document
            [ngForOf]="documents"
            [ngForTrackBy]="trackByIndex"
        >
            <div
                class="ticket-detail-documents__item"
                [ngClass]="{'--active-document-preview': ticketStateService.getDocumentForPreview() && ticketStateService.getDocumentForPreview().id === document.id }"
            >
                <div
                    class="ticket-detail-documents__title qt-mb-8"
                    [textContent]="document.title"
                ></div>
                <div class="qt-df qt-ai-c">
                    <i class="qt-icon icon__folder qt-sz-16 qt-mr-8"></i>
                    <div
                        class="ticket-detail-documents__subtitle"
                        [textContent]="document.categoryName"
                    ></div>
                </div>
                <div
                    class="ticket-detail-documents__view pointer"
                    (click)="viewDocument(document)"
                >
                    View
                </div>
            </div>
        </ng-template>
        <div
            class="loading loading--without-text"
            *ngIf="showPreloader"
        ></div>
    </div>
</div>
