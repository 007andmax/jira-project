<div
    class="qt-df"
    ngbDropdown
>
    <i
        *ngIf="type == 'PUBLIC'"
        class="icon__generic qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"
    ></i>
    <i
        *ngIf="type == 'PRIVATE'"
        class="icon__private qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"
    ></i>
    <span [textContent]="getText()"></span>
    <i
        class="icon__down-arrow qt-za-20 qt-sz-20 qt-bg-contain"
        ngbDropdownToggle
    ></i>
    <div
        class="autocomplete-user-tags"
        ngbDropdownMenu
        aria-labelledby="dropdown"
    >
        <div
            class="visible-users-item"
            (click)="changeType('PUBLIC')"
            ngbDropdownItem
        >
            <div class="icon__generic qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"></div>
            <p>Public</p>
            <span>Visible to all users</span>
        </div>
        <div
            class="visible-users-item"
            (click)="changeType('PRIVATE')"
            ngbDropdownItem
        >
            <div class="icon__private qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"></div>
            <p>Private</p>
            <span>Visible to tech users only</span>
        </div>
    </div>
</div>
