<div
    class="qt-df qt-ai-c visible-to-all-user-dropdown"
    ngbDropdown
>
    <div class="button-globe qt-mr-8">
        <i
            *ngIf="type == 'PUBLIC'"
            class="icon__globe qt-za-16 qt-sz-16 qt-bg-contain"
        ></i>
        <i
            *ngIf="type == 'PRIVATE'"
            class="icon__private qt-za-16 qt-sz-16 qt-bg-contain"
        ></i>
    </div>
    <div
        class="qt-toggle qt-mr-8"
        [ngClass]="{'--on':toggleType}"
        (click)="changeType(!toggleType)"
    >
        <div class="qt-toggle__circle"></div>
    </div>
    <span
        class="pointer"
        [textContent]="getText()"
    ></span>
