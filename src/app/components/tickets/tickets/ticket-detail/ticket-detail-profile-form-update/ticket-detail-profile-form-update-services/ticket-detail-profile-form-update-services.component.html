<div
    class="cps-block__service-block"
    *ngIf="areTicketsPresented && !areTicketsTerminated || !areTicketsPresented"
>
    <ng-template
        class="assigned-ticket-user"
        ngFor
        let-service
        [ngForOf]="addedServiceList"
        let-i="index"
        [ngForTrackBy]="trackByIndex"
    >
        <div class="service-item">
            <div class="service-item__first-line relative">
                <div class="service-item__input device qt-mb-8">
                    <app-services-list
                        [ngClass]="{'--input-error':!service.validate}"
                        [type]="'TICKET'"
                        [editItem]="service.item"
                        [itemList]="servicesList"
                        (selectedServicesItem)="onSelectService($event,i)"
                    ></app-services-list>
                    <mat-error
                        class="invalid-feedback --pos-static"
                        *ngIf="!service.validate"
                    >
                        The Service is required
                    </mat-error>
                    <mat-error
                        class="invalid-feedback --pos-static"
                        *ngIf="!service.validateQuantity"
                    >
                        You have to set any time value
                    </mat-error>
                </div>
                <div class="qt-df">
                    <app-ticket-profile-updates-service-timepicker
                        *ngIf="currentCompany.serviceExpenseDurationPresentation === 'TIME_PICKER'"
                        [validate]="service.validateQuantity"
                        [errorMessage]="'You have to set any time value'"
                        (onChangeStart)="onChangeStartTimePickerService($event,i)"
                        (onChangeEnd)="onChangeEndTimePickerSerice($event,i)"
                        #editTimePicker
                        [quantity]="service.quantity"
                        [editMode]="true"
                        [start]="service.durationStart"
                        [end]="service.durationEnd"
                    ></app-ticket-profile-updates-service-timepicker>
                    <app-ticket-profile-updates-service-duration
                        [validate]="service.validateQuantity"
                        [errorMessage]="'You have to set any time value'"
                        (onChange)="onChangeDurationService($event,i)"
                        [hour]="getHours(service)"
                        [minute]="getMinutes(service)"
                        *ngIf="currentCompany.serviceExpenseDurationPresentation === 'DURATION_PICKER'"
                    ></app-ticket-profile-updates-service-duration>
                    <app-date-picker
                        [placement]="'top'"
                        [editMode]="true"
                        [editDate]="service.getDateTimeWithTimeOffset(companiesStateService.getCurrentCompany())"
                        [useMinDate]="false"
                        (onChange)="onChangeDatePickerService($event,i)"
                    ></app-date-picker>
                </div>
            </div>
            <div class="qt-df">
                <div class="editable-description editable-chat">
                    <textarea
                        name="cps-chat"
                        class="cps-block__content-textarea"
                        appTextArea
                        maxlength="500"
                        [(ngModel)]="service.description"
                        cols="5"
                        rows="1"
                        placeholder="Write ticket conversation here…"
                    ></textarea>
                </div>
            </div>
            <button
                class="service-item__btn-del qt-button --gray --md qt-jc-c"
                (click)="removeService(i)"
            >
                <span class="icon__remove--red-600 qt-ic-c qt-sz-16 qt-mr-4"></span>
                <span class="qt-color-red-600 qt-fw-500">Remove</span>
            </button>
        </div>
    </ng-template>
    <div class="service-item">
        <div class="service-item__first-line relative">
            <div class="service-item__input device qt-mb-8">
                <app-services-list
                    #serviceDP
                    [ngClass]="{'--input-error':!currentService.validate}"
                    [itemList]="servicesList"
                    (selectedServicesItem)="selectService($event)"
                ></app-services-list>
                <mat-error
                    class="invalid-feedback --pos-static"
                    *ngIf="!currentService.validate"
                >
                    The Service is required
                </mat-error>
            </div>
            <div class="qt-df qt-fw-wrap-md qt-jc-sb-md">
                <app-ticket-profile-updates-service-timepicker
                    #timePicker
                    [validate]="currentService.validateQuantity"
                    [errorMessage]="'You have to set any time value'"
                    (onChangeStart)="onChangeStartTimePicker($event)"
                    (onChangeEnd)="onChangeEndTimePicker($event)"
                    *ngIf="currentCompany.serviceExpenseDurationPresentation === 'TIME_PICKER'"
                ></app-ticket-profile-updates-service-timepicker>
                <app-ticket-profile-updates-service-duration
                    #durationPicker
                    [validate]="currentService.validateQuantity"
                    [errorMessage]="'You have to set any time value'"
                    (onChange)="onChangeDuration($event)"
                    *ngIf="currentCompany.serviceExpenseDurationPresentation === 'DURATION_PICKER'"
                ></app-ticket-profile-updates-service-duration>
                <app-date-picker
                    #datePicker
                    [placement]="'top'"
                    [editMode]="true"
                    [editDate]="currentService.getDateTimeWithTimeOffset(companiesStateService.getCurrentCompany())"
                    [useMinDate]="false"
                    (onChange)="onChangeDatePicker($event)"
                ></app-date-picker>
            </div>
        </div>
        <div class="qt-df">
            <div class="editable-description editable-chat">
                <textarea
                    name="cps-chat"
                    class="cps-block__content-textarea"
                    appTextArea
                    [(ngModel)]="currentService.description"
                    maxlength="500"
                    cols="5"
                    rows="1"
                    id="service-description"
                    placeholder="Write ticket conversation here…"
                ></textarea>
            </div>
        </div>
        <button
            class="service-item__btn-del qt-button --gray --md qt-jc-c"
            (click)="clearForm()"
            *ngIf="addedServiceList.length > 0"
        >
            <span class="icon__remove--red-600 qt-ic-c qt-sz-16 qt-mr-4"></span>
            <span class="qt-color-red-600 qt-fw-500">Remove</span>
        </button>
    </div>

<p *ngIf="areTicketsPresented && areTicketsTerminated">
    Your contacts are expired/terminated. Please recreate them in order to use contract's services or remove them in order to use default services
</p>
