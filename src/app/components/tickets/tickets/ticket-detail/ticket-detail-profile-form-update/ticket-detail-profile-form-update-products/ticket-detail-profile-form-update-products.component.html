<div class="cps-block__products-block">
    <ng-template
        class="assigned-ticket-user"
        ngFor
        let-product
        [ngForOf]="addedProductList"
        let-i="index"
        [ngForTrackBy]="trackByIndex"
    >
        <div class="product-item">
            <div class="product-item__first-line qt-df">
                <app-product-list
                    [type]="'TICKET'"
                    [editItem]="product.item"
                    class="product-item__prodect-list"
                    (selectedProductItem)="onChangeProduct($event,i,taxesDropDown)"
                ></app-product-list>
            </div>
            <div class="qt-df">
                <div class="qt-df">
                    <label class="product-item__serial-num-input">
                        <input
                            class="qt-input-block__input serial-num"
                            type="text"
                            [(ngModel)]="product.serialNumber"
                        >
                    </label>
                    <label class="product-item__cost-input">
                        <input
                            class="qt-input-block__input cost"
                            number
                            [money]="true"
                            [ngModel]="product.item.cost_str"
                            (change)="onChangeCostProduct($event,i)"
                            appToFixed
                            *ngIf="getPermissions('VIEW_PRODUCT_COST')"
                            (blur)="onValidateSaleCostProduct(i)"
                        >
                        <input
                            class="qt-input-block__input cost"
                            type="text"
                            *ngIf="!getPermissions('VIEW_PRODUCT_COST')"
                            disabled
                        >
                    </label>
                    <label class="product-item__qty-input">
                        <input
                            class="qt-input-block__input qty"
                            [(ngModel)]="product.item.quantity"
                            type="text"
                        >
                    </label>
                </div>
                <div class="qt-df">
                    <app-invoice-form-ticket-edit-taxes
                        class="qt-taxes-multiselect qt-mr-8"
                        #taxesDropDown
                        [placeholder]="(product.item.taxes.length === 0) ? 'No taxes' : null"
                        [selectedTax]="product.item.taxes"
                        (taxesChange)="onTaxesChangeProduct($event,i)"
                    ></app-invoice-form-ticket-edit-taxes>
                    <label class="product-item__price-input">
                        <input
                            class="qt-input-block__input price"
                            [ngClass]="{'--input-error':!product.valdiateSaleCost}"
                            number
                            [money]="true"
                            [ngModel]="product.item.sale_str"
                            (change)="onChangeSaleProduct($event,i)"
                            appToFixed
                            (blur)="onValidateSaleCostProduct(i)"
                        >
                        <mat-error
                            class="invalid-feedback --pos-static"
                            *ngIf="!product.valdiateSaleCost"
                        >
                            Product price can not be lower than cost
                        </mat-error>
                    </label>
                    <label class="product-item__discount-input">
                        <input
                            class="qt-input-block__input"
                            [(ngModel)]="product.discountAmount"
                            type="text"
                        >
                    </label>
                </div>
            </div>
            <button
                class="product-item__btn-del qt-button --gray --md qt-jc-c"
                (click)="removeProduct(i)"
            >
                <span class="icon__remove--red-600 qt-ic-c qt-sz-16 qt-mr-4"></span>
                <span class="qt-color-red-600 qt-fw-500">Remove</span>
            </button>
        </div>
    </ng-template>
    <div class="product-item">
        <div class="product-item__first-line qt-df">
            <app-product-list
                [type]="'TICKET'"
                #productDP
                class="product-item__prodect-list"
                (selectedProductItem)="selectProduct($event,taxesDropDown)"
            ></app-product-list>
        </div>
        <div>
            <div class="qt-df qt-jc-sb-md">
                <label class="product-item__serial-num-input">
                    <input
                        class="qt-input-block__input serial-num"
                        [(ngModel)]="currentProduct.serialNumber"
                        type="text"
                    >
                </label>
                <label class="product-item__cost-input">
                    <input
                        class="qt-input-block__input cost"
                        number
                        [money]="true"
                        [ngModel]="currentProduct.item.cost_str"
                        (change)="onChangeCost($event)"
                        appToFixed
                        (blur)="onValidateSaleCost()"
                        *ngIf="getPermissions('VIEW_PRODUCT_COST')"
                    >
                    <input
                        class="qt-input-block__input cost"
                        *ngIf="!getPermissions('VIEW_PRODUCT_COST')"
                        type="text"
                        disabled
                    >
                </label>
                <label class="product-item__qty-input">
                    <input
                        class="qt-input-block__input qty"
                        [(ngModel)]="currentProduct.quantity"
                    >
                </label>
            </div>
            <div class="qt-df qt-jc-sb-md">
                <app-invoice-form-ticket-edit-taxes
                    class="qt-taxes-multiselect qt-mr-8"
                    #taxesDropDown
                    [placeholder]="(currentProduct.item.taxes && currentProduct.item.taxes.length === 0) ? 'No taxes' : null"
                    (taxesChange)="onTaxesChange($event)"
                ></app-invoice-form-ticket-edit-taxes>
                <label class="product-item__price-input">
                    <input
                        class="qt-input-block__input price"
                        [ngClass]="{'--input-error':!currentProduct.valdiateSaleCost}"
                        number
                        [money]="true"
                        [ngModel]="currentProduct.item.sale_str"
                        (change)="onChangeSale($event)"
                        appToFixed
                        (blur)="onValidateSaleCost()"
                    >
                    <mat-error
                        class="invalid-feedback --pos-static"
                        *ngIf="!currentProduct.valdiateSaleCost"
                    >
                        Product price can not be lower than cost
                    </mat-error>
                </label>
                <label class="product-item__discount-input">
                    <input
                        class="qt-input-block__input discount"
                        [(ngModel)]="currentProduct.discountAmount"
                        type="text"
                    >
                </label>
            </div>
        </div>
        <button
            class="product-item__btn-del qt-button --gray --md qt-jc-c"
            (click)="clearForm(taxesDropDown)"
            *ngIf="addedProductList.length > 0"
        >
            <span class="icon__remove--red-600 qt-ic-c qt-sz-16 qt-mr-4"></span>
            <span class="qt-color-red-600 qt-fw-500">Remove</span>
        </button>
    </div>
