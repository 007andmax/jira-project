<div class="add-assigned-user-note">
    <span [textContent]="type == 'PUBLIC' ? 'Public note - Notify to:' : 'Private note - Notify to:'"></span>
    <app-mat-form-field
        class="app-mat-tags-without-border"
        #formField
        ngbDropdown
        [autoClose]="'outside'"
        #assignedUserDp="ngbDropdown"
        [container]="container"
        (openChange)="onCloseDropDown($event)"
    >
        <app-mat-chip-list
            #chipList
            aria-label="Fruit selection"
            ngbDropdownAnchor
            [items]="selectedUsers"
            (onChangeItems)="formField.checkSelectedItems(selectedUsers)"
        >
            <app-mat-chip
                class="app-mat-tags-with-avatar app-mat-tags-with-avatar--lg"
                *ngFor="let user of selectedUsers; let i = index"
                [isRemove]="removable"
                (onClose)="remove(i)"
            >
                <div class="qt-df qt-ai-c">
                    <div
                        class="app-mat-tags-with-avatar__avatar"
                        *ngIf="!user.isCustomEmail"
                        [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                        [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                    ></div>
                    <div
                        class="app-mat-tags-with-avatar__avatar"
                        *ngIf="user.isCustomEmail"
                        [textContent]="user.recipient[0]"
                        [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                    ></div>
                    <div
                        *ngIf="!user.isCustomEmail"
                        [textContent]="getUserName(user)"
                    ></div>
                    <div
                        *ngIf="user.isCustomEmail"
                        [textContent]="user.recipient"
                    ></div>
                </div>
            </app-mat-chip>
            <input
                #userInput
                class="pointer"
                [formControl]="userCtrl"
                (input)="onSearchUser($event)"
                (keyup)="onKeyUp($event)"
                id="dropdown"
                ngbDropdownToggle
            >
            <app-mat-error
                class="invalid-feedback"
                *ngIf="!validate.getEmail()"
            >
                Please enter a valid email address
            </app-mat-error>
        </app-mat-chip-list>
        <div
            ngbDropdownMenu
            aria-labelledby="dropdown"
            class="app-drop-down__dropdown add-assigned-user-note-db"
        >
            <ng-template
                ngFor
                let-user
                [ngForOf]="users"
                let-i="index"
            >
                <ng-container *ngIf="user.accountType == 'CLIENT'">
                    <ng-template
                        ngFor
                        let-customerCompany
                        [ngForOf]="user.customerCompaniesInfo"
                        let-i="index"
                    >
                        <div
                            ngbDropdownItem
                            (click)="selected(user)"
                            [ngClass]="{'--selected':isSelected(user)}"
                            class="qt-df user-container pointer"
                            *ngIf="type == 'PUBLIC' && customerCompany.companyId == compayId"
                        >
                            <div
                                class="assigne-user-avatar qt-mr-12"
                                [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                                [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                            ></div>
                            <div>
                                <div
                                    class="user-name"
                                    [textContent]="getUserName(user)"
                                ></div>
                                <div
                                    class="user-description"
                                    [textContent]="customerCompany.clientCompanyName"
                                ></div>
                                <div
                                    class="user-description"
                                    [textContent]="user.primaryEmail"
                                ></div>
                                <div
                                    class="qt-df qt-ai-c"
                                    *ngIf="customerCompany.jobTitleDto"
                                >
                                    <div class="qt-icon icon__permission-role qt-sz-16 qt-mr-4"></div>
                                    <span
                                        class="user-description"
                                        [textContent]="customerCompany.jobTitleDto.name"
                                    ></span>
                                </div>
                            </div>
                            <i
                                class="qt-icon icon__done qt-za-20 qt-sz-20 qt-bg-contain qt-ml-auto"
                                *ngIf="isSelected(user)"
                            ></i>
                        </div>
                    </ng-template>
                </ng-container>
                <ng-container *ngIf="user.accountType == 'TECH'">
                    <div
                        ngbDropdownItem
                        (click)="selected(user)"
                        [ngClass]="{'--selected':isSelected(user)}"
                        class="qt-df user-container pointer"
                    >
                        <div
                            class="assigne-user-avatar qt-mr-12"
                            [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                            [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                        ></div>
                        <div>
                            <div
                                class="user-name"
                                [textContent]="getUserName(user)"
                            ></div>
                            <div
                                class="user-description"
                                [textContent]="user.primaryEmail"
                            ></div>
                        </div>
                        <i
                            class="qt-icon icon__done qt-za-20 qt-sz-20 qt-bg-contain qt-ml-auto"
                            *ngIf="isSelected(user)"
                        ></i>
                    </div>
                </ng-container>
            </ng-template>
        </div>
    </app-mat-form-field>
    <button
        placement="top"
        [ngbTooltip]="!toggleModal ? 'Expand' : 'Collapse'"
        (click)="onExpand()"
        class="btn-expand"
        container="body"
    >
        <div
            class="qt-icon  qt-za-16 qt-sz-16"
            [ngClass]="{'icon__expand':!toggleModal,
    'icon__collapse':toggleModal}"
        ></div>
    </button>
</div>
