<div class="cps-block__header">
    <div class="cps-block__visible-user qt-df qt-ai-c qt-pt-10 qt-pb-10 qt-pl-16 qt-pr-16 qt-mb-4">
        <div ngbDropdown>
            <div
                class="cps-block__photo"
                [textContent]="ticketsListService.getAssignedUserNameForAvatar(ticketProfileFormUpdate.getTechUser())"
                [ngStyle]="{'background': ticketsListService.getStyleAvatar(ticketProfileFormUpdate.getTechUser())}"
                *ngIf="tab === 'NOTE'"
            ></div>
            <div
                class="cps-block__photo"
                [textContent]="ticketsListService.getAssignedUserNameForAvatar(ticketProfileFormUpdate.getTechUser())"
                [ngStyle]="{'background': ticketsListService.getStyleAvatar(ticketProfileFormUpdate.getTechUser())}"
                ngbDropdownToggle
                *ngIf="tab === 'SERVICE' || tab === 'PRODUCT'"
            ></div>
            <div ngbDropdownMenu>
                <ng-template
                    class="assigned-ticket-user"
                    ngFor
                    let-user
                    [ngForOf]="listTechUsers"
                    let-i="index"
                    [ngForTrackBy]="trackByIndex"
                >
                    <div
                        class="qt-df"
                        ngbDropdownItem
                        (click)="selectUser(user)"
                    >
                        <div
                            class="cps-block__photo"
                            [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                            [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                        ></div>
                        <span [textContent]="getUserName(user)"></span>
                        <span [textContent]="user.primaryEmail"></span>
                        <i
                            *ngIf="isSelected(user)"
                            class="qt-icon icon__done qt-za-20 qt-sz-20 qt-bg-contain qt-ml-auto"
                        ></i>
                    </div>
                </ng-template>
            </div>
        </div>
        <div class="divider-line"></div>
        <div
            class="qt-button qt-button--with-icon --gray --sm pointer qt-ml-auto"
            *ngIf="tab === 'SERVICE'"
            (click)="addService()"
        >
            <div class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-4 qt-button-icon"></div>
            Add Service
        </div>
        <div
            class="qt-button qt-button--with-icon --gray --sm pointer qt-ml-auto"
            *ngIf="tab === 'PRODUCT'"
            (click)="addProduct()"
        >
            <div class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-4 qt-button-icon"></div>
            Add Product
        </div>
        <button
            *ngIf="tab === 'NOTE'"
            placement="top"
            [ngbTooltip]="'Expand'"
            (click)="onExpand()"
            class="btn-expand qt-mr-16"
            container="body"
        >
            <div class="qt-icon icon__expand qt-za-16 qt-sz-16"></div>
        </button>
    </div>
    <add-assigned-user-note
        #addAssignedUser
        [container]="'body'"
        [compayId]="ticketProfile.company.id"
        [type]="ticketProfileFormUpdate.noteType"
        [userList]="usersForUpdate"
        [selectedUsers]="selectedUsers"
        (onSelected)="onSelectUpdateUser($event)"
    ></add-assigned-user-note>
</div>
