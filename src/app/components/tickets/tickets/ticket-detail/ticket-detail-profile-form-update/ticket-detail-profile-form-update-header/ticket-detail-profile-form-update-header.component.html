<div class="cps-block__header">
    <div
        *ngIf="tab !== 'NOTE'"
        class="cps-block__visible-user qt-df qt-ai-c qt-pt-10 qt-pb-10 qt-pl-16 qt-pr-16 qt-mb-4"
    >
        <div ngbDropdown>
             <ng-template #popContent let-greeting="greeting"
	>
            <app-tickets-table-item-requested-by
            [requestedUser]="getUserById(ticketProfileFormUpdate.getTechUser().id)"
            [indexNoAvatar]="indexNoAvatar"
            [listColorNoAvatar]="listColorNoAvatar"
            [ticket]="ticketProfile"
            ></app-tickets-table-item-requested-by>
            </ng-template
        >
            <div
                class="cps-block__photo qt-pointer"
                [textContent]="ticketsListService.getAssignedUserNameForAvatar(ticketProfileFormUpdate.getTechUser())"
                [ngStyle]="{'background': ticketsListService.getStyleAvatar(ticketProfileFormUpdate.getTechUser())}"
                *ngIf="tab === 'NOTE'"
                  [ngbPopover]="popContent"
                [popoverClass]="'requested-by-popover'"
                 [autoClose]="'outside'"
                 [container]="'body'"
                #p="ngbPopover"
                triggers="manual"
                appUserLogoPopover
                [user]="getUserById(ticketProfileFormUpdate.getTechUser().id)"
                [popover]="p"
                [disabled]="!ticketProfileFormUpdate.getTechUser()"
                [disablePopover]="!ticketProfileFormUpdate.getTechUser()"
            ></div>
            <div
                class="cps-block__photo qt-pointer"
                [textContent]="ticketsListService.getAssignedUserNameForAvatar(ticketProfileFormUpdate.getTechUser())"
                [ngStyle]="{'background': ticketsListService.getStyleAvatar(ticketProfileFormUpdate.getTechUser())}"
                ngbDropdownToggle
                *ngIf="tab === 'SERVICE' || tab === 'PRODUCT'"
                  [ngbPopover]="popContent"
                [popoverClass]="'requested-by-popover'"
                 [autoClose]="'outside'"
                 [container]="'body'"
                #p="ngbPopover"
                triggers="manual"
                appUserLogoPopover
                [user]="getUserById(ticketProfileFormUpdate.getTechUser().id)"
                [popover]="p"
                [disabled]="!ticketProfileFormUpdate.getTechUser()"
                [disablePopover]="!ticketProfileFormUpdate.getTechUser()"
            ></div>
            <div ngbDropdownMenu>
                <ng-template
                    class="assigned-ticket-user"
                    ngFor
                    let-user
                    [ngForOf]="listTechUsers"
                    let-i="index"
                    [ngForTrackBy]="trackByIndex"
                >
                    <div
                        class="qt-df"
                        ngbDropdownItem
                        (click)="selectUser(user)"
                    >
                        <div
                            class="cps-block__photo"
                            [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                            [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                        ></div>
                        <span [textContent]="getUserName(user)"></span>
                        <span [textContent]="user.primaryEmail"></span>
                        <i
                            *ngIf="isSelected(user)"
                            class="qt-icon icon__done qt-za-20 qt-sz-20 qt-bg-contain qt-ml-auto"
                        ></i>
                    </div>
                </ng-template>
            </div>
        </div>
        <div class="divider-line"></div>
        <div
            class="qt-button qt-button--with-icon --gray --sm pointer qt-ml-auto"
            *ngIf="tab === 'SERVICE'"
            (click)="addService()"
        >
            <div class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-4 qt-button-icon"></div>
            Add Service
        </div>
        <div
            class="qt-button qt-button--with-icon --gray --sm pointer qt-ml-auto"
            *ngIf="tab === 'PRODUCT'"
            (click)="addProduct()"
        >
            <div class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-4 qt-button-icon"></div>
            Add Product
        </div>
    </div>
    <add-assigned-user-note
        #addAssignedUser
        [container]="'body'"
        [toggleModal]="toggleModal"
        [compayId]="ticketProfile.company.id"
        [type]="ticketProfileFormUpdate.noteType"
        [userList]="usersForUpdate"
        [selectedUsers]="selectedUsers"
        (onSelected)="onSelectUpdateUser($event)"
        (onCloseModal)="onCloseModal()"
    ></add-assigned-user-note>
</div>
