<div class="csp-block-support">
    <div
        class="qt-df qt-ai-c qt-fd-c"
        *ngIf="item"
    >
        <div
            class="support-item-menu --big qt-mr-16"
            *ngIf="item.status === 'URL_GENERATED' || item.status === 'URL_OPENED'"
        >
            <div class="support-item-menu__key icon__key"></div>
            <div
                class="support-item-menu__number"
                [textContent]="item.key"
            ></div>
            <app-dynamic-tooltip
                [content]="'Copy Key'"
                [position]="'top'"
                #copyKeyTooltip
            ></app-dynamic-tooltip>
            <div
                class="support-item-menu__button icon__copy pointer"
                (mouseenter)="copyKeyTooltip.show($event.target)"
                (mouseleave)="copyKeyTooltip.hide()"
                (click)="copyKey()"
            ></div>
            <app-dynamic-tooltip
                [content]="'Email Info'"
                [position]="'top'"
                #emailInfoTooltip
            ></app-dynamic-tooltip>
            <div
                (mouseenter)="emailInfoTooltip.show($event.target)"
                (mouseleave)="emailInfoTooltip.hide()"
                class="support-item-menu__button icon__email-dark pointer"
                (click)="sendEmail()"
            ></div>
            <app-dynamic-tooltip
                [content]="'Copy Support URL'"
                [position]="'top'"
                #copySupportTooltip
            ></app-dynamic-tooltip>
            <div
                (mouseenter)="copySupportTooltip.show($event.target)"
                (mouseleave)="copySupportTooltip.hide()"
                class="support-item-menu__button icon__link-gray pointer"
                (click)="copyLink()"
            ></div>
        </div>
        <div class="support-timeline-status">
            <app-dynamic-tooltip
                [content]="getUserFirstLastName(item.performer)"
                [position]="'top'"
                #performerTooltip
            ></app-dynamic-tooltip>
            <div
                class="support-timeline-status__step1"
                [ngClass]="{'icon__monitor-green' : item.status === 'CONNECTED',
                'icon__monitor' : item.status !== 'CONNECTED'}"
                (mouseenter)="performerTooltip.show($event.target)"
                (mouseleave)="performerTooltip.hide()"
            ></div>
            <div
                class="support-timeline-status__line"
                [ngClass]="{'--success' : item.status === 'CONNECTED'}"
            >
            </div>
            <app-dynamic-tooltip
                [content]="'Agent Connected'"
                [position]="'top'"
                #agentConnectedTooltip
            ></app-dynamic-tooltip>
            <div
                *ngIf="item.status === 'CONNECTED' && item.online"
                class="support-timeline-status__step2 icon__connection-green"
                (mouseenter)="agentConnectedTooltip.show($event.target)"
                (mouseleave)="agentConnectedTooltip.hide()"
            ></div>
            <div
                *ngIf="!(item.status === 'CONNECTED' && item.online) && !(item.status === 'INSTALLED' && item.online)"
                class="support-timeline-status__step2 icon__connection"
            ></div>
            <div
                *ngIf="item.status === 'INSTALLED' && item.online"
                class="support-timeline-status__step2 icon__connection-green pointer"
                ngbDropdown
                container="body"
                ngbDropdownToggle
            >
                <ul
                    ngbDropdownMenu
                    class="qt-dropdown-menu"
                >
                    <li
                        ngbDropdownItem
                        (click)="connectRemoteAccess('CSS')"
                    >
                        CSS – Custom Share Screen
                    </li>
                    <li
                        ngbDropdownItem
                        (click)="connectRemoteAccess('RDP')"
                    >
                        RDP – Remote desktop protocol
                    </li>
                </ul>
            </div>
            <div
                class="support-timeline-status__line"
                [ngClass]="{'--success' : item.status === 'INSTALLED' && item.online || item.status === 'CONNECTED' && item.online}"
            >
            </div>
            <app-dynamic-tooltip
                [content]="item.userName"
                [position]="'top'"
                #userNameTooltip
            ></app-dynamic-tooltip>
            <div
                class="support-timeline-status__step3"
                [ngClass]="{'icon__monitor-green' : item.status === 'CONNECTED' && item.online,
                'icon__monitor' : item.status !== 'CONNECTED' || !item.online}"
                (mouseenter)="userNameTooltip.show($event.target)"
                (mouseleave)="userNameTooltip.hide()"
            ></div>
        </div>
    </div>
    <div
        class="csp-block-support__status-msg"
        *ngIf="item"
    >
        <span [innerHTML]="getMessage()"></span>
    </div>
    <div
        class="qt-df qt-ai-c qt-fd-c init-connection"
        *ngIf="!item"
    >
        <div class="icon__connection"></div>
        <h3>No Connection Establish</h3>
        <p>Click button to create new one</p>
        <a
            href="javascript:;"
            class="qt-button cps-block__create-connection-btn"
            (click)="create()"
        >
            <div class="qt-sz-16 icon__add--white qt-mr-8"></div>
            <span>Create Connection</span>
        </a>
    </div>
</div>
