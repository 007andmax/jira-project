<div class="csp-block-support">
    <div
        class="qt-df qt-ai-c qt-fd-c"
        *ngIf="item"
    >
        <div
            class="support-item-menu --big"
            *ngIf="item.status === 'URL_GENERATED' || item.status === 'URL_OPENED'"
        >
            <div
                class="support-item-menu__number"
                [textContent]="item.key"
            ></div>
            <app-dynamic-tooltip
                [content]="'Copy Key'"
                [position]="'top'"
                #copyKeyTooltip
            ></app-dynamic-tooltip>
            <div
                class="support-item-menu__button qt-df qt-ai-c qt-jc-c pointer"
                (mouseenter)="copyKeyTooltip.show($event.target)"
                (mouseleave)="copyKeyTooltip.hide()"
                (click)="copyKey()"
            >
              <div class="qt-icon icon__copy qt-sz-20"></div>
            </div>
            <app-dynamic-tooltip
                [content]="'Email Info'"
                [position]="'top'"
                #emailInfoTooltip
            ></app-dynamic-tooltip>
            <div
                (mouseenter)="emailInfoTooltip.show($event.target)"
                (mouseleave)="emailInfoTooltip.hide()"
                class="support-item-menu__button pointer qt-df qt-ai-c qt-jc-c"
                (click)="sendEmail()"
            >
              <div class="qt-icon icon__email-send qt-sz-20"></div>
            </div>
            <app-dynamic-tooltip
                [content]="'Copy Support URL'"
                [position]="'top'"
                #copySupportTooltip
            ></app-dynamic-tooltip>
            <div
                (mouseenter)="copySupportTooltip.show($event.target)"
                (mouseleave)="copySupportTooltip.hide()"
                class="support-item-menu__button qt-df qt-ai-c qt-jc-c pointer"
                (click)="copyLink()"
            >
              <div class="qt-icon icon__links qt-sz-20"></div>
            </div>
        </div>
        <div class="support-timeline-status">
            <app-dynamic-tooltip
                [content]="getUserFirstLastName(item.performer)"
                [position]="'top'"
                #performerTooltip
            ></app-dynamic-tooltip>
            <div
                class="support-timeline-status__step1 qt-fs-0 qt-icon icon__monitor"
                [ngClass]="{'qt-icon__green-600' : item.status === 'CONNECTED',
                'qt-icon__gray-500' : item.status !== 'CONNECTED'}"
                (mouseenter)="performerTooltip.show($event.target)"
                (mouseleave)="performerTooltip.hide()"
            ></div>
            <div
                class="support-timeline-status__line"
                [ngClass]="{'--success' : item.status === 'CONNECTED'}"
            >
            </div>
            <app-dynamic-tooltip
                [content]="'Agent Connected'"
                [position]="'top'"
                #agentConnectedTooltip
            ></app-dynamic-tooltip>
            <div
                *ngIf="item.status === 'CONNECTED' && item.online"
                class="support-timeline-status__step2 qt-fs-0"
                (mouseenter)="agentConnectedTooltip.show($event.target)"
                (mouseleave)="agentConnectedTooltip.hide()"
            >
                <i class="qt-icon icon__connection qt-icon__green-600"></i>
            </div>
            <div
                *ngIf="!(item.status === 'CONNECTED' && item.online) && !(item.status === 'INSTALLED' && item.online)"
                class="support-timeline-status__step2 qt-fs-0 qt-df qt-ai-c qt-jc-c"
            >
              <div class="qt-icon icon__connection qt-sz-20"></div>
            </div>
            <div
                *ngIf="item.status === 'INSTALLED' && item.online"
                class="support-timeline-status__step2 pointer"
                ngbDropdown
                container="body"
                ngbDropdownToggle
            >
                <i class="qt-icon icon__connection qt-icon__green-600"></i>
                <ul
                    ngbDropdownMenu
                    class="qt-dropdown-menu"
                >
                    <li
                        ngbDropdownItem
                        (click)="connectRemoteAccess('CSS')"
                    >
                        CSS – Custom Share Screen
                    </li>
                    <li
                        ngbDropdownItem
                        (click)="connectRemoteAccess('RDP')"
                    >
                        RDP – Remote desktop protocol
                    </li>
                </ul>
            </div>
            <div
                class="support-timeline-status__line"
                [ngClass]="{'--success' : item.status === 'INSTALLED' && item.online || item.status === 'CONNECTED' && item.online}"
            >
            </div>
            <app-dynamic-tooltip
                [content]="item.userName"
                [position]="'top'"
                #userNameTooltip
            ></app-dynamic-tooltip>
            <div
                class="support-timeline-status__step3 qt-fs-0 qt-icon icon__monitor"
                [ngClass]="{'qt-icon__green-600' : item.status === 'CONNECTED' && item.online,
                'qt-icon__gray-500' : item.status !== 'CONNECTED' || !item.online}"
                (mouseenter)="userNameTooltip.show($event.target)"
                (mouseleave)="userNameTooltip.hide()"
            ></div>
        </div>
    </div>
    <div
        class="tab-pane-input__row company-info-block company-info-block__yellow qt-mr-16 qt-ml-16 qt-mt-16 qt-mb-30"
        *ngIf="item"
    >
        <div class="qt-icon icon__info qt-icon__yellow-800 qt-sz-20 qt-ic-c qt-mr-8 qt-fs-0"></div>
        <span
            class="qt-f-1"
            [innerHTML]="getMessage()"
        ></span>
    </div>
    <div
        class="qt-df qt-ai-c qt-fd-c init-connection qt-pb-30 qt-pt-30"
        *ngIf="!item"
    >
        <div class="icon__connection-wrap qt-df qt-ai-c qt-jc-c qt-mb-16">
          <div class="qt-icon icon__connection qt-sz-24"></div>
        </div>
        <div class="csp-block-support__title qt-mb-8">No Connection Establish</div>
        <a
            href="javascript:;"
            class="qt-button qt-button--with-icon --gray --md pointer cps-block__create-connection-btn"
            (click)="create()"
        >
            <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-8 qt-button-icon"></span>
            Create Connection
        </a>
    </div>
</div>
