<div
    class="ticket-detail-page"
    [ngClass]="{'clear-bottom-padding' :!ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)}"
>
    <ticket-detail-header
        #detailHeader
        *ngIf="!showPreloader"
        [ticketProfile]="ticketProfile"
        (onAddUpdate)="onAddUpdate($event)"
        (onClaimTicket)="claimTicket()"
        (onMoveToSpam)="onMoveIntoSpam()"
        (onMoveToTrash)="onMoveToTrash($event)"
        (onToggleRigthPanel)="onToggleRigthPanel($event)"
    ></ticket-detail-header>
    <!-- <div -->
    <!-- class="collapse-arrow qt-icon icon__close" -->
    <!-- (click)="close()" -->
    <!-- ></div> -->
    <div
        class="prelaoder-body"
        *ngIf="showPreloader"
    >
        <div class="loading"></div>
    </div>
    <div
        class="ticket-detail-page-content"
        [hidden]="showPreloader"
    >
        <div
            class="ticket-detail-page-content-main"
            [ngClass]="{'--hide-sidebar-info':!toggleRigthPanelContainer}"
        >
            <div class="ticket-detail-page-content__body">
                <div class="ticket-detail-page-content__body-inner">
                    <ticket-detail-info-status [ticketProfile]="ticketProfile"></ticket-detail-info-status>
                    <div class="ticket-detail-page-title qt-mt-10 qt-mb-16 qt-mr-24 qt-ml-24">
                        <div
                            class="ticket-detail-page-title__text "
                            [ngClass]="{'pointer':ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)}"
                            [hidden]="modeSubject === 'edit'"
                            (click)="toggleSubject()"
                        >
                            <span [textContent]="ticketProfile.subject"></span>
                        </div>
                        <div
                            class
                            [hidden]="modeSubject === 'view'"
                            appClickOtside
                            [init]="modeSubject === 'edit' && ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
                            [classParent]="'.ticket-detail-page-title'"
                            (onOutSide)="toggleSubject()"
                        >
                            <input
                                id="ticket-subject"
                                class="--editable ticket-detail-page-title__input"
                                [value]="ticketProfile.subject"
                            >
                        </div>
                    </div>
                    <div class="ticket-detail-page-content__body-header qt-pl-24 qt-pr-24">
                        <div class="qt-df qt-ai-fs">
                             <ng-template #popContent let-greeting="greeting"
                        >
                                <app-tickets-table-item-requested-by
                                [requestedUser]="getCreatedUser()"
                                [indexNoAvatar]="indexNoAvatar"
                                [listColorNoAvatar]="listColorNoAvatar"
                                  [ticket]="ticketProfile"
                                ></app-tickets-table-item-requested-by>
                                </ng-template
                            >
                            <div
                                class="ticket-edit-aside__header-avatar qt-pointer"
                                [textContent]="ticketsListService.getAssignedUserNameForAvatar(ticketProfile.createdUser)"
                                [ngStyle]="{'background': ticketsListService.getStyleAvatar(ticketProfile.createdUser)}"
                                 [ngbPopover]="popContent"
                                [popoverClass]="'requested-by-popover'"
                                [autoClose]="'outside'"
                                [container]="'body'"
                                #p="ngbPopover"
                                triggers="manual"
                                appUserLogoPopover
                                [user]="getCreatedUser()"
                                [popover]="p"
                                [disabled]="!getCreatedUser()"
                                [disablePopover]="!getCreatedUser()"
                            ></div>
                            <div>
                                <div class="qt-df qt-ai-c">
                                    <div
                                        class
                                    >
                                     <div
                                          ngbDropdown
                                            container="body"
                                            placement="bottom-right"
                                    >
                                        <!-- <span [textContent]="parseTicketSource() + getAgentName()"></span> -->
                                        <div class="ticket-detail-page-content__body-header-info qt-mb-6" 
                                        >
                                            <span
                                                class="pointer"
                                                [textContent]="getNameCreateUser()"
                                                (click)="showDetailUser()"
                                            ></span>
                                            <span
                                                *ngIf="checkArchivedUser()"
                                                class="qt-color-red-600"
                                            >
                                                (archived)
                                            </span>
                                            <span
                                                class="ticket-detail-page-content__body-header-info-email"
                                                [textContent]="'sent ' + parseTicketSource() + getAgentName()"
                                            ></span>
                                            <i *ngIf="getAgentName() !== '' && getAgent() && getAgent().online"  placement="top"
                                            ngbDropdownToggle
        ngbTooltip="Remote Access" class="qt-icon icon__remote-access qt-sz-20 qt-ml-12 qt-fs-0 qt-dib"  ></i>
                                            <div ngbDropdownMenu>
                                            <ul class="qt-dropdown-menu">
                                                <li
                                                    (click)="remoteAccess('CSS')"
                                                    ngbDropdownItem
                                                >
                                                    QuickTech Connect
                                                </li>
                                                <li
                                                    (click)="remoteAccess('RDP')"
                                                    ngbDropdownItem
                                                >
                                                    Remote Desktop
                                                </li>
                                            </ul>
                                        </div>
                                        </div>
                                          </div>
                                        <div class="ticket-detail-page-content__body-header-data"   
                                        ngbDropdown
                                        (openChange)="onOpenCompaniesDropDown()"
                                        placement="bottom-left">
                                            <span [textContent]="getCreatAt()"></span>
                                            <div class="ticket-detail-page-content__body-header-data-divider"></div>
                                            <span class="qt-icon icon__companies qt-sz-16 qt-dib qt-mr-8"></span>
                                            <span
                                                class="pointer"
                                                [textContent]="getCompanyName()"
                                                (click)="goToCompanyDashboard()"
                                                id="dropdownCompany"
                                                ngbDropdownToggle
                                            ></span>
                                            <span
                                                class="qt-color-red-600"
                                                *ngIf="ticketProfile.company.isCompanyDeleted"
                                            >
                                                - Archived
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="qt-df qt-ai-fs qt-mt-24 qt-mb-24">
                            <div class="ticket-detail-page__desc-icon qt-mr-16 qt-fs-0">
                                <span
                                    class="qt-icon icon__email qt-sz-16 qt-dib"
                                    *ngIf="ticketProfile.ticketSource === 'FROM_EMAIL'"
                                ></span>
                                <span
                                    class="qt-icon icon__monitor qt-sz-16 qt-dib"
                                    *ngIf="ticketProfile.ticketSource === 'FROM_AGENT'"
                                ></span>
                                <span
                                    class="qt-icon icon__globe qt-sz-16 qt-dib"
                                    *ngIf="ticketProfile.ticketSource === 'FROM_WEB'"
                                ></span>
                                <span
                                    class="qt-icon qt-icon icon__calendar-tick qt-sz-16 qt-dib"
                                    *ngIf="ticketProfile.ticketSource === 'FROM_RECURRING_TICKET'"
                                ></span>
                                <span
                                    class="qt-icon icon__quotes qt-sz-16 qt-dib"
                                    *ngIf="ticketProfile.ticketSource === 'FROM_SALE_QUOTE'"
                                ></span>
                            </div>
                            <div class="ticket-detail-page__edit-wrap">
                                <div
                                    class="ticket-detail-page__edit"
                                    appClickOtside
                                    [init]="modeDescription === 'edit' && ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
                                    [classParent]="'.ticket-detail-page__edit-wrap'"
                                    (onOutSide)="toggleNote()"
                                >
                                    <div
                                        class="ticket-detail-page__editor"
                                        [ngClass]="{'no-edit-note':!ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null),'pointer':ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)}"
                                        (blur)="modeDescription = 'edit'"
                                        [attr.contenteditable]="ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
                                        id="ticket-note"
                                        placeholder="Enter description here"
                                    ></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <ticket-detail-tasks
                        *ngIf="!customerPortalStateService.isCustomerPortal"
                        #ticketTasks
                        [ticketProfile]="ticketProfile"
                    ></ticket-detail-tasks>
                    <ticket-detail-message
                        #ticketMessage
                        *ngIf="!customerPortalStateService.isCustomerPortal"
                        (onMoveToTrash)="onMoveToTrash($event)"
                        (onRestoreFromSpam)="restoreFromSpam()"
                        (onOpenTicket)="markAsOpen()"
                        (onClaimTicket)="claimTicket()"
                        [ticketProfile]="ticketProfile"
                    ></ticket-detail-message>
                    <ticket-detail-profile-updates
                        #ticketProfileUpdates
                        (onFetchUpdates)="onFetchUpdates($event)"
                        [ticketProfile]="ticketProfile"
                        [updates]="ticketProfile.updates"
                    ></ticket-detail-profile-updates>
                    <ticket-detail-profile-form-update
                        #ticketProfileFormUpdates
                        (onCloseForm)="showFormUpdate = false"
                        *ngIf="ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null) && showFormUpdate || showFormUpdate && customerPortalStateService.isCustomerPortal"
                        [ticket]="ticketProfile"
                        [lisUpdateUser]="lisUpdateUser"
                        [tab]="tabFormUpdate"
                    ></ticket-detail-profile-form-update>
                    <ticket-detail-profile-edit-updates
                        (onCloseForm)="showEditUpdate = false"
                        *ngIf="showEditUpdate"
                    ></ticket-detail-profile-edit-updates>
                </div>
            </div>
            <div
                class="ticket-detail-page-content__sidebar-preview"
                *ngIf="!showPreloader"
            >
                <div class="ticket-detail-page-content__sidebar-preview-inner">
                  <ticket-detail-claim-info [ticketProfile]="ticketProfile"></ticket-detail-claim-info>
                  <app-ticket-detail-total-statistics [ticketProfile]="ticketProfile"></app-ticket-detail-total-statistics>
                  <ticket-detail-change-status
                    #changeStatus
                    [ticketProfile]="ticketProfile"
                  ></ticket-detail-change-status>
                  <ticket-detail-change-priority [ticketProfile]="ticketProfile"></ticket-detail-change-priority>
                  <ticket-detail-change-company
                    #changeCompany
                    [ticketProfile]="ticketProfile"
                  ></ticket-detail-change-company>
                  <div class="qt-inputs-row">
                    <div class="qt-input-block qt-f100">
                      <company-users-drop-down
                        #userDP
                        [title]="' Ticket creator'"
                        [class]="['qt-dropdown']"
                        [placeholder]="'Select'"
                        [field]="'name'"
                        [dropdownHeight]="'345px'"
                        [search]="true"
                        [change]="true"
                        [sort]="false"
                        [isBlockClear]="true"
                        [selectedItem]="ticketProfile.createdUser"
                        [tooltipMessage]="'You can set a new company for the ticket unless the ticket contains at least one product/service update.'"
                        [selectedCustomerCompany]="ticketProfile.selectedCustomerCompany"
                        [isShowTooltip]="true"
                        [isDisabled]="!ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null) || getCompany(ticketProfile.company.id) && getCompany(ticketProfile.company.id).isUnknown || customerPortalStateService.isCustomerPortal"
                        (onSelectedItem)="onSelectUser($event.user,$event.customerCompany)"
                      ></company-users-drop-down>
                    </div>
                  </div>
                  <ticket-detail-add-assigned-user
                    [ticketProfile]="ticketProfile"
                    [listAssignedUser]="listAssignedUser"
                    (onSelectAssignedUser)="onSelectAssignedUser($event)"
                  ></ticket-detail-add-assigned-user>
                  <ticket-detail-linked-agents
                    [ticketProfile]="ticketProfile"
                    [selectedCompanyId]="ticketProfile.company.id"
                  ></ticket-detail-linked-agents>
                  <ticket-detail-edit-tags
                    #ticketTags
                    [ticketProfile]="ticketProfile"
                    [selectedTag]="ticketProfile.tags"
                    (tagsChange)="onChangeTags($event,false)"
                    (tagsRemove)="onChangeTags($event,true)"
                  ></ticket-detail-edit-tags>
                  <ticket-detail-attachments
                    [ticketProfile]="ticketProfile"
                    [attachments]="ticketProfile.attachments"
                  ></ticket-detail-attachments>
                  <!-- <div class="qt-input-block">
                      <span class="qt-input-block__label">Priority Level</span>
                      <app-drop-down
                          [class]="['qt-dropdown']"
                          [field]="'title'"
                          [isBlockClear]="true"
                          [editItem]="selectedTicketPriorities"
                          [list]="ticketPriorities"
                          (onSelectedItem)="setPriorityLevel($event)"
                          [placeholder]="'Low'"
                      ></app-drop-down>
                  </div> -->
                </div>
            </div>
            <div
                class="ticket-detail-page-content__sidebar-info"
                *ngIf="!showPreloader && !customerPortalStateService.isCustomerPortal"
            >
                <div
                    class="ticket-detail-page-content__sidebar-info-inner"
                    *ngIf="toggleRigthPanelContainer"
                >
                    <ticket-detail-contact-details
                        #contactDetail
                        *ngIf="typeRigthDetailAside == 'CONTACT'"
                        [ticketProfile]="ticketProfile"
                        (onClose)="onCloseDetails()"
                    ></ticket-detail-contact-details>
                    <!--  *ngIf="toggleRigthPanel"-->
                    <ticket-detail-contact
                        #contact
                        *ngIf="typeRigthDetailAside == 'TICKETS'"
                        [ticketProfile]="ticketProfile"
                        (onShowMore)="onShowMore('CONTACT')"
                    ></ticket-detail-contact>
                   <!-- <ticket-detail-passwords
                        *ngIf="toggleRigthPanel"
                        (onShowMore)="onShowMore('PASSWORD')"
                    ></ticket-detail-passwords>
                    <ticket-detail-documents
                        *ngIf="toggleRigthPanel"
                        (onViewDocument)="onViewDocument($event)"
                        (onShowMore)="onShowMore('DOCUMENT')"
                    ></ticket-detail-documents>
                    <ticket-detail-devices
                        [ticketProfile]="ticketProfile"
                        *ngIf="toggleRigthPanel"
                        (onShowMore)="onShowMore('DEVICES')"
                    ></ticket-detail-devices>-->
                   <!-- <ticket-detail-tickets
                        #ticketsDetail
                        *ngIf="toggleRigthPanel"
                        [ticketProfile]="ticketProfile"
                        (onShowMore)="onShowMore('TICKETS')"
                    ></ticket-detail-tickets>-->
                    <ticket-detail-documents-preview
                        [document]="ticketStateService.getDocumentForPreview()"
                        *ngIf="ticketStateService.getDocumentForPreview()"
                    ></ticket-detail-documents-preview>
                    <ticket-detail-documents-details
                        #documentsRecordDetail
                        [ticketProfile]="ticketProfile"
                        (onViewDocument)="onViewDocumentsPreview($event)"
                        *ngIf="typeRigthDetailAside == 'DOCUMENT'"
                        (onClose)="onCloseDetails()"
                    ></ticket-detail-documents-details>
                    <ticket-detail-passwords-details
                        #passwordRecordDetail
                        [ticketProfile]="ticketProfile"
                        *ngIf="typeRigthDetailAside == 'PASSWORD'"
                        (onClose)="onCloseDetails()"
                    ></ticket-detail-passwords-details>
                    <ticket-detail-devices-details
                        [ticketProfile]="ticketProfile"
                        *ngIf="typeRigthDetailAside == 'DEVICES'"
                        (onClose)="onCloseDetails()"
                    ></ticket-detail-devices-details>
                    <ticket-detail-tickets-details
                        #ticketsDetailList
                        [ticketProfile]="ticketProfile"
                        *ngIf="typeRigthDetailAside == 'TICKETS'"
                        (onClose)="onCloseDetails()"
                    ></ticket-detail-tickets-details>
                </div>
            </div>
            <div
                class="ticket-detail-page-content__sidebar-menu"
                *ngIf="!customerPortalStateService.isCustomerPortal"
            >
                <div
                    class="ticket-detail-page-content__sidebar-menu-button"
                    (click)="openDetailRigthPanel('CONTACT')"
                >
                    <div class="qt-icon icon__info qt-sz-20 qt-bg-contain"></div>
                </div>
                <div
                    class="ticket-detail-page-content__sidebar-menu-button"
                    (click)="openDetailRigthPanel('PASSWORD')"
                >
                    <div class="qt-icon icon__password qt-sz-20 qt-bg-contain"></div>
                </div>
                <div
                    class="ticket-detail-page-content__sidebar-menu-button"
                    (click)="openDetailRigthPanel('DEVICES')"
                >
                    <div class="qt-icon icon__devices qt-sz-20"></div>
                </div>
                <div
                    class="ticket-detail-page-content__sidebar-menu-button"
                    (click)="openDetailRigthPanel('DOCUMENT')"
                >
                    <div class="qt-icon icon__documents qt-sz-20 qt-bg-contain"></div>
                </div>
                <div
                    class="ticket-detail-page-content__sidebar-menu-button"
                    (click)="openDetailRigthPanel('TICKETS')"
                >
                    <div class="qt-icon icon__tickets qt-sz-20"></div>
                </div>
            </div>
        </div>
    </div>
</div>
