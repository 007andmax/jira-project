<div
    class="ticket-detail-page"
    [ngClass]="{'clear-bottom-padding' :!ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)}"
>
    <div class="ticket-detail-page__header">
      <div
        class="breadcrumbs"
      >
        <div class="breadcrumbs-location qt-fs-0 pointer">
          All Tickets
          <div class="breadcrumb-separator">/</div>
        </div>
        <div
          class="breadcrumbs-attribute qt-fs-0"
        >
          <span>Tkt #9765</span>
        </div>
      </div>
      <div class="qt-df qt-ai-c">
        <div class="qt-button --gray pointer qt-ml-12">
          <span class="icon__timer qt-sz-16 qt-bg-contain qt-dib qt-mr-8 qt-button-icon"></span>
          1 hr : 23 min : 56 sec
        </div>
        <div class="qt-button qt-ml-12">
          <span class="icon__check--white qt-sz-16 qt-bg-contain qt-dib qt-mr-8 qt-button-icon"></span>
          Close Ticket
        </div>
      </div>
    </div>
    <div class="ticket-detail-page__panel">
      <div class="qt-df qt-ai-c">
        <img
          src="/html/assets/img/screenConnect.png"
          class="чqt-sz-36 qt-img-cover qt-circle qt-mr-16"
          alt
        >
        <div class="qt-button --gray --md pointer qt-mr-8">
          <div class="icon__chat qt-sz-16 qt-bg-contain qt-button-icon qt-mr-6"></div>
          Chat
        </div>
        <div class="qt-button --gray --md pointer qt-mr-8">
          <div class="icon__products qt-sz-16 qt-bg-contain qt-button-icon qt-mr-6"></div>
          Products
        </div>
        <div class="qt-button --gray --md pointer qt-mr-8">
          <div class="icon__service qt-sz-16 qt-bg-contain qt-button-icon qt-mr-6"></div>
          Service
        </div>
        <div class="qt-button --gray --md pointer qt-mr-8">
          <div class="icon__quick-support-strip qt-sz-16 qt-bg-contain qt-button-icon qt-mr-6"></div>
          Quick Support
        </div>
        <div class="qt-button --gray --md pointer qt-mr-8">
          <div class="icon__quick-support-strip qt-sz-16 qt-bg-contain qt-button-icon qt-mr-6"></div>
          Merge Ticket
        </div>
      </div>
      <div class="qt-df qt-ai-c">
        <div class="qt-button --gray --md pointer qt-ml-8">
          <div class="icon__assign-user-plus qt-sz-16 qt-bg-contain qt-button-icon qt-mr-6"></div>
          Assign User
        </div>
        <div class="qt-button --gray --md pointer qt-ml-8">
          <div class="icon__tags qt-sz-16 qt-bg-contain qt-button-icon qt-mr-6"></div>
          Link Agent
        </div>
        <div class="qt-button --gray --md pointer qt-ml-8">
          <div class="icon__category-more qt-sz-16 qt-bg-contain qt-button-icon qt-mr-6"></div>
          Add Tag
        </div>
        <div class="qt-button --square-md --gray pointer qt-ml-8">
          <div class="icon__category-more qt-sz-16 qt-bg-contain"></div>
        </div>
        <div class="ticket-detail-page__separator"></div>
        <div class="qt-button --square-md --gray pointer">
          <div class="icon__panel-open qt-sz-16 qt-bg-contain"></div>
        </div>
      </div>
    </div>
    <div
        class="collapse-arrow icon__close"
        (click)="close()"
    ></div>
    <div class="ticket-edit-aside__ticket-info">
        <div
            class="prelaoder-body"
            *ngIf="showPreloader"
        >
            <div class="loading"></div>
        </div>
        <div class="qt-aside__body ticket-edit-aside__body">
            <app-ticket-change-status [ticketProfile]="ticketProfile"></app-ticket-change-status>
            <div class="ticket-edit-aside__ticket-text">
                <div
                    class="ticket-edit-aside__ticket-subject"
                    [hidden]="modeSubject === 'edit'"
                    (click)="toggleSubject()"
                >
                    <span [textContent]="ticketProfile.subject"></span>
                </div>
                <div
                    class="ticket-edit-aside__ticket-subject-edit qt-df qt-ai-c"
                    [hidden]="modeSubject === 'view'"
                    appClickOtside
                    [init]="modeSubject === 'edit'"
                    [class]="'.ticket-edit-aside__ticket-text'"
                    (onOutSide)="toggleSubject()"
                >
                    <input
                        id="ticket-subject"
                        [value]="ticketProfile.subject"
                        [readonly]="appService.checkMobile()"
                    >
                </div>
            </div>
            <div class="ticket-edit-aside__header qt-df jc-sb qt-ai-c">
                <div class="ticket-edit-aside__header-client-info">
                    <div
                        class="ticket-edit-aside__header-avatar"
                        [textContent]="ticketsListService.getAssignedUserNameForAvatar(ticketProfile.createdUser)"
                        [ngStyle]="{'background': ticketsListService.getStyleAvatar(ticketProfile.createdUser)}"
                    ></div>
                    <div>
                        <div class="qt-df qt-ai-c">
                            <div
                                class="ticket-edit-aside__header-company"
                                ngbDropdown
                                (openChange)="onOpenCompaniesDropDown()"
                                placement="bottom-left"
                            >
                                <span
                                    class="pointer"
                                    [textContent]="getNameCreateUser()"
                                    (click)="showDetailUser()"
                                ></span>
                                <div class="ticket-edit-aside__header-info">
                                    <span [textContent]="parseTicketSource() + getAgentName()"></span>
                                </div>
                                <app-dynamic-tooltip
                                    class="user-companies-tooltip"
                                    [content]="'You must remove all Product/Services updates from the ticket before changing the company.'"
                                    [position]="'bottom'"
                                    #userCompanyTooltip
                                    [disableTooltip]="ticketProfile.ticketSource !== 'FROM_EMAIL' && !checkExistServicesProducts() && getCompany(ticketProfile.company) && !getCompany(ticketProfile.company.id).isUnknown"
                                ></app-dynamic-tooltip>
                                <span [textContent]="getCreatAt()"></span>
                                <span
                                    class="pointer"
                                    [textContent]="getCompanyName()"
                                    (click)="goToCompanyDashboard()"
                                    id="dropdownCompany"
                                    ngbDropdownToggle
                                    (mouseenter)="showTooltipCompany(userCompanyTooltip,$event)"
                                    (mouseleave)="userCompanyTooltip.hide()"
                                ></span>
                                <span
                                    class="qt-color-red-600"
                                    *ngIf="ticketProfile.company.isCompanyDeleted"
                                >
                                    - Archived
                                </span>
                                <div
                                    *ngIf="ticketProfile.ticketSource === 'FROM_EMAIL' && !checkExistServicesProducts() && getCompany(ticketProfile.company.id) && getCompany(ticketProfile.company.id).isUnknown"
                                    ngbDropdownMenu
                                    aria-labelledby="dropdownCompany"
                                >
                                    <div class="dropdown-menu-qt">
                                        <ul>
                                            <ng-template
                                                ngFor
                                                let-item
                                                [ngForOf]="getClientsList()"
                                                let-i="index"
                                            >
                                                <li
                                                    ngbDropdownItem
                                                    [textContent]="item.name"
                                                    (click)="changeTicketCompany(item.id)"
                                                ></li>
                                            </ng-template>
                                        </ul>
                                    </div>
                                </div>
                            </div>

                        </div>

                    </div>
                </div>
                <div class="ticket-edit-aside__ticket-text">
                    <i class="icon__description-ticket icn-16"></i>
                    <div
                        class="ticket-edit-aside__ticket-description-edit"
                        appClickOtside
                        [init]="modeDescription === 'edit'"
                        [class]="'.ticket-edit-aside__ticket-text'"
                        (onOutSide)="toggleNote()"
                    >
                        <div
                            class="form-control editor"
                            [ngClass]="{'no-edit-note':!getPermissions('EDIT_TICKETS')}"
                            (blur)="modeDescription = 'edit'"
                            [attr.contenteditable]="!appService.checkMobile() && getPermissions('EDIT_TICKETS')"
                            id="ticket-note"
                            placeholder="Enter description here"
                        ></div>
                    </div>
                </div>
                <div class="ticket-edit-aside__header-menu">
                    <div
                        class="ticket-edit-aside__more-users-title"
                        *ngIf="listAssignedUser.length > 3"
                        [textContent]="'+' + (listAssignedUser.length- 3) + ' more'"
                    >
                    </div>
                    <div class="more-users-avatars">
                        <ng-template
                            class="assigned-ticket-user"
                            ngFor
                            let-user
                            [ngForOf]="listAssignedUser"
                            let-i="index"
                            [ngForTrackBy]="trackByIndex"
                        >
                            <div
                                class="more-users-avatars__avatar"
                                *ngIf="i < 3"
                                [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                                [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                            ></div>
                        </ng-template>
                    </div>
                    <div
                        class="qt-modal-circle-button add-user toggle-select-user"
                        (click)="onToggleAddAssignedUser()"
                        placement="top"
                        ngbTooltip="Assign"
                    ></div>
                    <!-- <app-ticket-profile-actions
                        (onClaimTicket)="claimTicket()"
                        [ticketProfile]="ticketProfile"
                        placement="top"
                        ngbTooltip="Settings"
                    ></app-ticket-profile-actions> -->
                </div>

            </div>
            <ticket-detail-profile-updates
                #ticketProfileUpdates
                [hidden]="!ticketProfile.updates || ticketProfile.updates.length === 0"
                (onFetchUpdates)="onFetchUpdates($event)"
                [ticketProfile]="ticketProfile"
                [updates]="ticketProfile.updates"
            ></ticket-detail-profile-updates>
            <!-- <app-ticket-edit-tags
                [selectedTag]="ticketProfile.tags"
                (tagsChange)="onChangeTags($event)"
                [hidden]="showAddAssignedUser"
            ></app-ticket-edit-tags>
            <app-add-assigned-user
                [placement]="'bottom-left'"
                [userList]="getUsersForAssign()"
                [selectedUsers]="listAssignedUser"
                (onSelected)="onSelectAssignedUser($event)"
                (hidden)="onToggleAddAssignedUser()"
                *ngIf="showAddAssignedUser"
            ></app-add-assigned-user> -->

            <!-- <app-ticket-claim-info [ticketProfile]="ticketProfile"></app-ticket-claim-info>
            <app-ticket-message
                #ticketMessage
                (onMoveToTrash)="moveToTrash($event)"
                (onRestoreFromSpam)="restoreFromSpam()"
                (onOpenTicket)="markAsOpen()"
                (onClaimTicket)="claimTicket()"
                [ticketProfile]="ticketProfile"
            ></app-ticket-message>
            <app-ticket-profile-attachments [attachments]="ticketProfile.attachments"></app-ticket-profile-attachments>

            <app-ticket-profile-form-update
                [ngClass]="{'--open':openedMobileUpdate}"
                (onClosed)="close()"
                [hidden]="!ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
                #updateForm
                [ticket]="ticketProfile"
                [lisUpdateUser]="lisUpdateUser"
            ></app-ticket-profile-form-update>
            <ticket-profile-edit-form-update
                [ngClass]="{'--open':openedMobileEditUpdate}"
                (onClosed)="openedMobileEditUpdate = false"

                #editUpdateForm
                [ticket]="ticketProfile"
                [lisUpdateUser]="lisUpdateUser"
            ></ticket-profile-edit-form-update> -->
        </div>
    </div>
    <!-- <app-ticket-edit-aside-right-panel
        #rightPanel
        [ticketProfile]="ticketProfile"
    ></app-ticket-edit-aside-right-panel>
    <div
        class="qt-aside-modern__footer updata-close"
        [hidden]="!ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
    >
        <button
            class="qt-button"
            (click)="updateAndCloseMobile()"
        >
            <span>Update & Close</span>
        </button>
    </div>
    <div
        class="mobile-action-btn"
        (click)="showModalAddUpdate()"
        [hidden]="!ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
    ></div> -->
</div>
