<div class="header-details">
    <h3>Contact Details</h3>
    <div
        class="qt-aside-modern__header-close icon__close"
        (click)="close()"
    ></div>
</div>
<div class="body-details">
    <div>
        <div
            class="company-info-aside__main-avatar"
            [ngStyle]="{'background': 'url('+getCompanyLogoUrl(getCompanyUser())+') center / cover no-repeat'}"
        >
            <span
                *ngIf="!checkLogo(getCompanyUser())"
                [textContent]="getCompanyUser().name[0].toUpperCase()"
            ></span>
        </div>
    </div>
    <div class="company-info-aside__row-info-line">
        <div class="company-info-aside__row-info-label">Telephone</div>
        <preview-phone-mask
            [class]="'company-info-aside__row-info-value'"
            *ngIf="getPrimaryPhone()"
            [number]="getPrimaryPhone()"
        ></preview-phone-mask>
    </div>
    <div class="company-info-aside__row-info-line">
        <div class="company-info-aside__row-info-label">Address</div>
        <div class="company-info-aside__row-info-value">{{location}}</div>
        <div
            class="company-info-aside__get-direction"
            (click)="onShowMap()"
        >
            <span class="icon__get-direction"></span>
            Get Direction
        </div>
    </div>
    <div class="company-info-aside__row-info-line">
        <div class="company-info-aside__row-info-label">Website</div>
        <div
            class="company-info-aside__row-info-value"
            [textContent]="company.domain"
        ></div>
    </div>
    <div class="company-info-aside__row-info-line">
        <div class="company-info-aside__row-info-label">Working Hours</div>
        <div
            class="company-info-aside__row-info-value"
            [textContent]="'Opens  ' + workingTime"
        ></div>
    </div>
    <div class="company-info-aside__row-info-line">
        <div class="company-info-aside__row-info-label">Industry</div>
        <div
            class="company-info-aside__row-info-value"
            [textContent]="(company.clientIndustry) ? company.clientIndustry.name : ''"
        ></div>
    </div>
    <hr class="company-info-aside__divider">
    <div class="company-info-aside__primary-contacts">
        <div class="company-info-aside__primary-contacts-title">PRIMARY CONTACT(S)</div>
        <div class="company-info-aside__primary-contact d-f">
            <div
                class="company-info-aside__primary-contact-avatar"
                [textContent]="ticketsListService.getAssignedUserNameForAvatar(ticketProfile.createdUser)"
                [ngStyle]="{'background': ticketsListService.getStyleAvatar(ticketProfile.createdUser)}"
            ></div>
            <div>
                <div
                    class="company-info-aside__primary-contact-name"
                    [textContent]="ticketsListService.getUserName(ticketProfile.createdUser)"
                ></div>
                <div
                    class="company-info-aside__primary-contact-name"
                    [textContent]="getCompanyUser().name"
                ></div>
                <div class="qt-df qt-ai-c">
                    <i class="icon__email qt-bg-contain qt-sz-16 qt-mr-8"></i>
                    <div
                        class="company-info-aside__primary-contact-name"
                        [textContent]="ticketProfile.createdUser.email"
                    ></div>
                </div>
                <ng-template
                    class="assigned-ticket-user"
                    ngFor
                    let-phoneNumber
                    [ngForOf]="getPhoneNumbers()"
                    [ngForTrackBy]="trackByIndex"
                >
                    <div class="qt-df qt-ai-c">
                        <i class="icon__phone-gray-500 qt-bg-contain qt-sz-16 qt-mr-8"></i>
                        <preview-phone-mask
                            [class]="'company-info-aside__ticket-created-name'"
                            *ngIf="phoneNumber.number"
                            [number]="phoneNumber.number"
                        ></preview-phone-mask>
                    </div>
                </ng-template>

            </div>
        </div>
        <ticket-detail-contact-details-history
            #companyHistory
            [user]="ticketProfile.createdUser"
            [company]="company"
            [hidden]="!ticketProfile.createdUser"
        ></ticket-detail-contact-details-history>
    </div>
</div>
