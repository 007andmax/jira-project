<div
    class="cps-block__service-block"
    *ngIf="areTicketsPresented && !areTicketsTerminated || !areTicketsPresented"
>
    <div class="service-item">
        <div class="service-item__first-line relative">
            <div class="service-item__input device qt-mb-8">
                <app-services-list
                    #serviceDP
                    [itemList]="servicesList"
                    [editItem]="service.item"
                    [type]="'TICKET'"
                    (selectedServicesItem)="selectService($event)"
                ></app-services-list>
            </div>
            <div class="qt-df qt-fw-wrap-md qt-jc-sb-md ticket-timepicker-time-in-out">
                <app-ticket-profile-updates-service-timepicker
                    #timePicker
                    [validate]="service.validateQuantity"
                    [errorMessage]="'You have to set any time value'"
                    (onChangeStart)="onChangeStartTimePicker($event)"
                    (onChangeEnd)="onChangeEndTimePicker($event)"
                    *ngIf="currentCompany.serviceExpenseDurationPresentation === 'TIME_PICKER'"
                    [quantity]="service.quantity"
                    [editMode]="true"
                    [start]="service.durationStart"
                    [end]="service.durationEnd"
                ></app-ticket-profile-updates-service-timepicker>
                <app-ticket-profile-updates-service-duration
                    #durationPicker
                    [validate]="service.validateQuantity"
                    [errorMessage]="'You have to set any time value'"
                    (onChange)="onChangeDuration($event)"
                    *ngIf="currentCompany.serviceExpenseDurationPresentation === 'DURATION_PICKER'"
                    [hour]="getHours(service)"
                    [minute]="getMinutes(service)"
                ></app-ticket-profile-updates-service-duration>
                <app-date-picker
                    #datePicker
                    [dropdownClass]="['date-picker']"
                    [placement]="'top'"
                    [editMode]="true"
                    [editDate]="service.getDateTimeWithTimeOffset(companiesStateService.getCurrentCompany())"
                    [useMinDate]="false"
                    [container]="'body'"
                    (onChange)="onChangeDatePicker($event)"
                ></app-date-picker>
            </div>
        </div>
        <div class="qt-df">
            <div class="editable-description editable-chat">
                <textarea
                    name="cps-chat"
                    class="cps-block__content-textarea"
                    appTextArea
                    [(ngModel)]="service.description"
                    maxlength="500"
                    cols="5"
                    rows="1"
                    id="service-description"
                    placeholder="Write ticket conversation here…"
                ></textarea>
            </div>
        </div>
    </div>
</div>
<p *ngIf="areTicketsPresented && areTicketsTerminated">
    Your contacts are expired/terminated. Please recreate them in order to use contract's services or remove them in order to use default services
</p>
