<div class="cps-block__products-block">
    <div class="product-item">
        <div class="product-item__first-line qt-df qt-mb-8">
            <app-product-list
                [type]="'TICKET'"
                [editItem]="product.item"
                #productDP
                class="product-item__prodect-list"
                (selectedProductItem)="selectProduct($event,taxesDropDown)"
            ></app-product-list>
        </div>
        <div>
            <div class="qt-df qt-mb-8">
                <label class="qt-input-block qt-w100 qt-mr-8">
                    <span class="qt-df">
                        <span class="qt-input-prefix">Cost</span>
                        <input
                            class="qt-input-block__input cost qt-input-prepend"
                            decimalNumber
                            [useFixed]="true"
                            appToFixed
                            [value]="product.item.cost"
                            (onChange)="onChangeCost($event)"
                            (blur)="onValidateSaleCost()"
                            *ngIf="getPermissions('VIEW_PRODUCT_COST')"
                        >
                        <input
                            class="qt-input-block__input cost qt-input-prepend"
                            *ngIf="!getPermissions('VIEW_PRODUCT_COST')"
                            type="text"
                            disabled
                        >
                    </span>
                </label>
                <label class="qt-input-block qt-w100 qt-mr-8">
                    <span class="qt-df">
                        <span class="qt-input-prefix">Qty</span>
                        <input
                            class="qt-input-block__input qty qt-input-prepend"
                            [(ngModel)]="product.quantity"
                        >
                    </span>
                </label>
                <label class="qt-input-block qt-w100">
                    <span class="qt-df">
                        <span class="qt-input-prefix">Price</span>
                        <input
                            class="qt-input-block__input price qt-input-prepend"
                            [ngClass]="{'--input-error':!product.valdiateSaleCost}"
                            decimalNumber
                            [useFixed]="true"
                            appToFixed
                            [value]="product.item.sale"
                            (onChange)="onChangeSale($event)"
                            (blur)="onValidateSaleCost()"
                        >
                        <app-mat-error
                            class="invalid-feedback --pos-static"
                            *ngIf="!product.valdiateSaleCost"
                        >
                            Product price can not be lower than cost
                        </app-mat-error>
                    </span>
                </label>
            </div>
            <div class="qt-df">
                <label class="qt-input-block qt-w100 qt-mr-8">
                    <div class="qt-df">
                        <span class="qt-input-prefix">Serial No.</span>
                        <input
                            class="qt-input-block__input serial-num qt-input-prepend"
                            [(ngModel)]="product.serialNumber"
                            type="text"
                            maxlength="100"
                        >
                    </div>
                </label>
                <label class="qt-input-block qt-w100 qt-mr-8">
                    <span class="qt-df">
                        <span class="qt-input-prefix">Discount (%)</span>
                        <input
                            class="qt-input-block__input discount qt-input-prepend"
                            [(ngModel)]="product.discountAmount"
                            type="text"
                        >
                    </span>
                </label>
                <app-invoice-form-ticket-edit-taxes
                    class="qt-taxes-multiselect qt-w100"
                    #taxesDropDown
                    [placeholder]="(product.taxes && product.taxes.length === 0) ? 'No taxes' : null"
                    (taxesChange)="onTaxesChange($event)"
                ></app-invoice-form-ticket-edit-taxes>
            </div>
        </div>
    </div>
</div>
