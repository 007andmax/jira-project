<div class="qt-input-block">
    <span class="qt-input-block__label">Assigned Users</span>
    <app-add-assigned-user
        [placement]="'bottom-left'"
        [userList]="getUsersForAssign()"
        [selectedUsers]="listAssignedUser"
        (onSelected)="onSelectAssignedUser($event)"
    ></app-add-assigned-user>
</div>
