<div class="qt-input-block">
    <div class="qt-df qt-ai-c qt-jc-sb qt-mb-16">
      <span class="qt-input-block__label">Assigned Users</span>
      <div class="qt-button qt-button--with-icon --sm --gray qt-jc-c pointer qt-ml-12 button-gl-number__add">
        <span class="icon__add--grey-500 qt-sz-16 qt-bg-contain qt-dib qt-mr-4 qt-button-icon"></span>
        Add
      </div>
    </div>
    <app-add-assigned-user
        [placement]="'bottom-left'"
        [userList]="getUsersForAssign()"
        [selectedUsers]="listAssignedUser"
        (onSelected)="onSelectAssignedUser($event)"
    ></app-add-assigned-user>
</div>
