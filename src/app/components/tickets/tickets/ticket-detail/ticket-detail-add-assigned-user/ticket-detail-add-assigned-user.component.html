<div class="qt-input-block">
    <div class="qt-df qt-ai-c qt-jc-sb qt-mb-16">
        <span class="qt-input-block__label">Assigned Users</span>
        <div
            class="qt-button qt-button--with-icon --sm --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
            (click)="openAssignedUser()"
            *ngIf="!customerPortalStateService.isCustomerPortal && ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
        >
            <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-4 qt-button-icon"></span>
            Add
        </div>
    </div>
    <app-add-assigned-user
        #assignedUser
        class="assigned-user-ticket-detail"
        [container]="'body'"
        [removable]="!customerPortalStateService.isCustomerPortal && ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
        [type]="'DETAIL_TICKET_ASSIGNED_USER'"
        [placement]="'bottom-left'"
        [userList]="userList"
        [selectedUsers]="listAssignedUser"
        (onSelected)="selectAssignedUser($event)"
    ></app-add-assigned-user>
</div>
