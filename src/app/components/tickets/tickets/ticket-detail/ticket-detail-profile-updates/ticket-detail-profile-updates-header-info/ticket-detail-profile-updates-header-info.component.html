<div class="qt-df qt-ai-c ticket-updates__update-info">
    <span
        class="ticket-updates__date"
        [textContent]="getDate()"
    ></span>
    <span class="divider-line"></span>
    <div class="ticket-updates__photo-row multi-assign-user-container">
        <ng-template
            ngFor
            let-share
            [ngForOf]="shares"
            let-i="index"
            [ngForTrackBy]="trackByIndex"
        >
            <ng-template #popContent let-greeting="greeting"
	>
            <app-tickets-table-item-requested-by
            [requestedUser]="getUserById(share.user.id)"
            [indexNoAvatar]="indexNoAvatar"
            [listColorNoAvatar]="listColorNoAvatar"
            [ticket]="ticketProfile"
            ></app-tickets-table-item-requested-by>
            </ng-template
        >

            <div
                class="ticket-updates__photo-people multi-assign-user qt-pointer"
                [textContent]="ticketsListService.getAssignedUserNameForAvatar(share.user)"
                [ngStyle]="{'background': ticketsListService.getStyleAvatar(share.user),'left': getStyleNetAvatar(i)}"
                 [ngbPopover]="popContent"
                [popoverClass]="'requested-by-popover'"
                 [autoClose]="'outside'"
                 [container]="'body'"
                #p="ngbPopover"
                triggers="manual"
                appUserLogoPopover
                [user]="getUserById(share.user.id)"
                [popover]="p"
                [disabled]="!share.user"
                [disablePopover]="!share.user"
            ></div>
        </ng-template>
        <ng-template
            ngFor
            let-recipient
            [ngForOf]="otherRecipients"
            let-i="index"
            [ngForTrackBy]="trackByIndex"
        >
            <ng-template #tipContent>
                <div [textContent]="recipient"></div>
                <div>Unregistered user</div>
            </ng-template>
            <div
                class="ticket-updates__photo-people multi-assign-user"
                [textContent]="recipient[0]"
                [ngStyle]="{'background': ticketsListService.getStyleAvatar(null),'left': getStyleNetAvatar(shares.length + i)}"
                placement="top"
                container="body"
                [ngbTooltip]="tipContent"
            ></div>
        </ng-template>
    </div>
    <span
        class="ticket-updates__people-added"
        [ngStyle]="{ 'margin-left': getStyleShareText(shares.length + otherRecipients.length)}"
        [textContent]="' ' + (shares.length + otherRecipients.length) + ' people added to this update'"
    ></span>
</div>
