<div class="ticket-updates__message-line">
    <div class="editable-description">
        <div
            class="editable-description-note"
            contenteditable="true"
            id="note-description"
            placeholder="Write ticket conversation here…"
        ></div>
    </div>
    <div class="editable-description__footer">
      <div class="qt-button-square pointer">
        <div class="icon__attachments qt-sz-16"></div>
      </div>
      <div class="qt-df">
        <div
          class="qt-button --md --gray qt-mr-12"
          (click)="cancelService()"
        >
          Cancel
        </div>
        <div
          class="qt-button --md"
          (click)="saveService()"
        >
          Update
        </div>
      </div>
    </div>
</div>
