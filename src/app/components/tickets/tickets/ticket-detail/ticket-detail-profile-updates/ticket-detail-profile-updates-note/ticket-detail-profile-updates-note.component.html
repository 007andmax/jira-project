<div class="qt-df ticket-updates__update-block">
    <div class="ticket-updates__content">
        <div class="qt-df qt-ai-fs">
             <ng-template #popContent let-greeting="greeting"
	>
            <app-tickets-table-item-requested-by
            [requestedUser]="getUserById(update.user ? update.user.id : null)"
            [indexNoAvatar]="indexNoAvatar"
            [listColorNoAvatar]="listColorNoAvatar"
             [ticket]="ticketProfile"
            ></app-tickets-table-item-requested-by>
            </ng-template
        >
            <div
                class="ticket-updates__ticket-photo qt-pointer"
                [textContent]="ticketsListService.getAssignedUserNameForAvatar(update.user ? update.user : null)"
                [ngStyle]="{'background': ticketsListService.getStyleAvatar(update.user ? update.user : null)}"
                  [ngbPopover]="popContent"
                [popoverClass]="'requested-by-popover'"
                 [autoClose]="'outside'"
                 [container]="'body'"
                #p="ngbPopover"
                triggers="manual"
                appUserLogoPopover
                [user]="getUserById(update.user ? update.user.id : null)"
                [popover]="p"
                [disabled]="!update.user"
                [disablePopover]="!update.user"
            ></div>
            <div class="ticket-updates__author-line qt-df jc-sb qt-ai-c ">
                <div>
                    <span
                        class="ticket-updates__author"
                        [textContent]="update.user ? ticketsListService.getUserName(update.user) : update.performerEmail"
                    ></span>
                    <span class="ticket-updates__add-note">
                        added a {{update.noteType === 'PRIVATE' ? 'private' : 'public'}} note
                    </span>
                    <ticket-detail-profile-updates-header-info
                        [date]="update.createdAt"
                        [otherRecipients]="update.otherRecipients"
                        [shares]="update.shares"
                         [ticketProfile]="ticketProfile"
                    ></ticket-detail-profile-updates-header-info>
                </div>
                <app-dynamic-tooltip
                    [content]="'Delete Update'"
                    [position]="'top'"
                    #deleteTooltip
                ></app-dynamic-tooltip>
                <div class="qt-button-square-wrap">
                    <div
                        class="qt-button-square qt-button-square__prepend pointer"
                        *ngIf="update.type === 'NOTE' && !isBlockChange && !isIOSDevice() && !updatesNoteItem.editMode"
                        (click)="updatesNoteItem.edit()"
                        placement="top"
                        ngbTooltip="Edit Update"
                    >
                        <div class="qt-icon icon__edit qt-sz-16"></div>
                    </div>
                    <div
                        class="qt-button-square qt-button-square__prepend pointer"
                        *ngIf="update.type === 'NOTE' && !isBlockChange && isIOSDevice() && !updatesNoteItem.editMode"
                        (touchstart)="updatesNoteItem.edit()"
                        placement="top"
                        ngbTooltip="Edit Update"
                    >
                        <div class="qt-icon icon__edit qt-sz-16"></div>
                    </div>
                    <div
                        class="qt-button-square qt-button-square__afterpend pointer"
                        *ngIf="!isBlockChange && !updatesNoteItem.editMode && !customerPortalStateService.isCustomerPortal"
                        (click)="remove()"
                        (mouseenter)="deleteTooltip.show($event.target)"
                        (mouseleave)="deleteTooltip.hide()"
                    >
                        <div class="qt-icon icon__delete qt-sz-16"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="qt-df">
            <div class="qt-df qt-fd-c qt-ai-c qt-mr-16">
                <div class="ticket-updates__ticket-icon qt-mb-4">
                    <i class="qt-icon icon__notes icn-16 qt-bg-contain"></i>
                </div>
                <div class="ticket-updates__ticket-line"></div>
            </div>
            <ticket-detail-profile-updates-note-item
                #updatesNoteItem
                class="qt-w100"
                [isBlockChange]="isBlockChange"
                [idTicket]="idTicket"
                [update]="update"
            ></ticket-detail-profile-updates-note-item>
        </div>
        <div class="qt-df qt-ai-c">
            <ng-template
                ngFor
                let-attachment
                [ngForOf]="update.attachments"
                [ngForTrackBy]="trackById"
            >
                <div
                    class="preview-attachment qt-mr-8"
                    *ngIf="attachment.file.contentType === 'image/jpg' || attachment.file.contentType === 'image/png' || attachment.file.contentType === 'image/jpeg'"
                     (click)="preview(attachment.file)"
                >
                    <img [src]="'/file/' + attachment.file.id">
                </div>
            </ng-template>
        </div>
        <div>
            <ng-template
                ngFor
                let-attachment
                [ngForOf]="update.attachments"
                [ngForTrackBy]="trackById"
            >
                <div class="single-file">
                    <div class="info qt-df qt-ai-c">
                        <div class="name">{{ attachment.file?.name }}</div>
                        <div class="size">
                            ({{ formatBytes(attachment.file?.size,2) }})
                        </div>
                    </div>
                </div>
                <!-- <ng-template #tipContent>
                    <div [textContent]="attachment.file.name"></div>
                    <div [textContent]="attachment.file.name.contentType"></div>
                </ng-template>
                <div
                    class="qt-sz-36 attachment-item__icon qt-circle qt-mr-8 qt-df qt-ai-c qt-jc-c qt-fs-0"
                    placement="top"
                    [ngbTooltip]="tipContent"
                >
                    <div class="qt-icon icon__attachments qt-sz-16"></div>
                </div> -->
            </ng-template>
        </div>
    </div>
</div>
