<div class="ticket-updates__message-line qt-df jc-sb qt-ai-c">
    <div>
        <span
            class="ticket-updates__message"
            [innerHTML]="note"
        ></span>
    </div>
    <div
        class="ticket-updates__edit icon__edit"
        *ngIf="update.type === 'NOTE' && !isBlockChange && !isIOSDevice()"
        (click)="edit()"
        placement="top"
        ngbTooltip="Edit Update"
    ></div>
    <div
        class="ticket-updates__edit icon__edit"
        *ngIf="update.type === 'NOTE' && !isBlockChange && isIOSDevice()"
        (touchstart)="edit()"
        placement="top"
        ngbTooltip="Edit Update"
    ></div>
</div>
