<div class="qt-df qt-mb-16 ticket-updates__update-block__inner">
    <div class="qt-df qt-fd-c qt-ai-c qt-mr-16">
        <div class="ticket-updates__ticket-icon qt-mb-4">
            <i class="icon__service icn-16"></i>
        </div>
        <div class="ticket-updates__ticket-line"></div>
    </div>
    <div class="ticket-updates__ticket-info-container">
        <div
            class="qt-df qt-jc-sb qt-ai-c qt-mb-16 ticket-updates-tag__modern-row"
            *ngIf="index > 0"
        >
            <div class="qt-df qt-ai-c">
                <div class="icn-16 icon__calendar pointer qt-mr-8 qt-fs-0"></div>
                <span
                    class="ticket-updates__tag-completed --completed"
                    *ngIf="service.completed && showCompleteLabel"
                    [textContent]="'Completed on ' + getDate(service.date)"
                ></span>
                <span
                    class="ticket-updates__tag-completed"
                    *ngIf="!service.completed && service.date && showCompleteLabel"
                    [textContent]="'Due date - ' + getDate(service.date)"
                ></span>
            </div>
            <div
                class="qt-button-square-wrap"
                *ngIf="!isBlockChange && index > 0"
            >
                <div
                    class="qt-button-square qt-button-square__prepend pointer"
                    (click)="edit()"
                    *ngIf="!isIOSDevice()"
                    (mouseenter)="editTooltip.show($event.target)"
                    (mouseleave)="editTooltip.hide()"
                >
                    <div class="icon__edit qt-sz-16"></div>
                </div>
                <div
                    class="qt-button-square qt-button-square__prepend pointer"
                    (touchstart)="edit()"
                    *ngIf="isIOSDevice()"
                    (mouseenter)="editTooltip.show($event.target)"
                    (mouseleave)="editTooltip.hide()"
                >
                    <div class="icon__edit qt-sz-16"></div>
                </div>
                <div
                    class="qt-button-square qt-button-square__afterpend pointer"
                    (click)="removeService()"
                    (mouseenter)="deleteTooltip.show($event.target)"
                    (mouseleave)="deleteTooltip.hide()"
                >
                    <div class="icon__remove qt-sz-16"></div>
                </div>
                <app-dynamic-tooltip
                    [content]="'Delete Service'"
                    [position]="'top'"
                    #deleteTooltip
                ></app-dynamic-tooltip>
                <app-dynamic-tooltip
                    [content]="'Edit'"
                    [position]="'top'"
                    #editTooltip
                ></app-dynamic-tooltip>
            </div>
        </div>
        <div class="ticket-updates__ticket-info">
            <div class="ticket-updates__ticket-header qt-df">
                <div class="ticket-updates__service-header-name">Service Name</div>
                <div class="ticket-updates__service-header-price">Time In</div>
                <div class="ticket-updates__service-header-qty">Time Out</div>
                <div class="ticket-updates__service-header-total">Duration</div>
            </div>
            <div class="ticket-updates__ticket-body">
                <div class="qt-df qt-ai-c">
                    <div
                        class="ticket-updates__service-title"
                        [textContent]="service.item.name"
                    ></div>
                    <div
                        class="ticket-updates__service-time-in"
                        [textContent]="getTime(service.durationStart)"
                    ></div>
                    <div
                        class="ticket-updates__service-time-out"
                        [textContent]="getTime(service.durationEnd)"
                    ></div>
                    <div
                        class="ticket-updates__service-duration"
                        [textContent]="getDuration(service.quantity)"
                    ></div>
                </div>
                <div class="ticket-updates__service-subinfo">
                    <pre [textContent]="service.description"></pre>
                </div>
            </div>
        </div>
        <div class="qt-df qt-jc-fe qt-ai-c qt-mt-8">
            <app-tech-users
                [type]="'DETAIL_TICKET'"
                [editMode]="true"
                [selectedMode]="'SINGLE'"
                [editUsers]="userService"
                [users]="listTechUsers"
                [placement]="'top-end'"
                (usersChange)="onChangeUser($event)"
            ></app-tech-users>
            <app-date-picker
                [isDisabled]="isBlockChange"
                [placement]="'bottom-right'"
                [useMinDate]="false"
                [editMode]="true"
                [editDate]="service.date"
                [type]="'DETAIL_TICKET_UPDATE'"
                (onChange)="onChangeDatePicker($event)"
            ></app-date-picker>
            <div
                class="qt-button qt-button--with-icon --sm --gray qt-ml-8 button-mark-complete"
                (click)="setComplete()"
            >
                <i
                    class="icon__inactive qt-bg-contain icn-16 qt-mr-6"
                    *ngIf="service.completed"
                ></i>
                <i
                    class="icon__active qt-bg-contain icn-16 qt-mr-6"
                    *ngIf="!service.completed"
                ></i>
                <span [textContent]="(!service.completed) ? 'Mark Completed' : 'Mark Incomplete'"></span>
            </div>
        </div>
    </div>
