<div class="ticket-updates__update-block qt-mb-16">
    <div class="qt-df qt-ai-c qt-mb-16 ticket-updates__update-block__inner">
         <ng-template #popContent let-greeting="greeting"
	>
            <app-tickets-table-item-requested-by
            [requestedUser]="getUserById(update.user.id)"
            [indexNoAvatar]="indexNoAvatar"
            [listColorNoAvatar]="listColorNoAvatar"
            [ticket]="ticketProfile"
            ></app-tickets-table-item-requested-by>
            </ng-template
        >
        <div
            class="ticket-updates__ticket-photo qt-pointer"
            [textContent]="ticketsListService.getAssignedUserNameForAvatar(update.user)"
            [ngStyle]="{'background': ticketsListService.getStyleAvatar(update.user)}"
              [ngbPopover]="popContent"
                [popoverClass]="'requested-by-popover'"
                 [autoClose]="'outside'"
                 [container]="'body'"
                #p="ngbPopover"
                triggers="manual"
                appUserLogoPopover
                [user]="getUserById(update.user.id)"
                [popover]="p"
                [disabled]="!update.user"
                [disablePopover]="!update.user"
        ></div>
        <div class="qt-f-1">
            <div class="qt-mb-4">
                <span
                    class="ticket-updates__author"
                    [textContent]="ticketsListService.getUserName(update.user)"
                ></span>
                <span class="ticket-updates__add-note">&nbsp;added a service</span>
            </div>
            <ticket-detail-profile-updates-service-header-info
                *ngIf="update.services.length > 0"
                [date]="update.createdAt"
                [shares]="update.shares"
                [otherRecipients]="update.otherRecipients"
                [service]="update.services[0]"
            ></ticket-detail-profile-updates-service-header-info>
        </div>
        <div
            class="qt-button-square-wrap"
            *ngIf="!isBlockChange"
            [ngClass]="classActions"
        >
            <div
                class="qt-button-square qt-button-square__prepend pointer"
                (click)="edit()"
                *ngIf="!isIOSDevice() && update.services.length > 0"
                (mouseenter)="editTooltip.show($event.target)"
                (mouseleave)="editTooltip.hide()"
            >
                <div class="qt-icon icon__edit qt-sz-16"></div>
            </div>
            <div
                class="qt-button-square qt-button-square__prepend pointer"
                (touchstart)="edit()"
                *ngIf="isIOSDevice() && update.services.length > 0"
                (mouseenter)="editTooltip.show($event.target)"
                (mouseleave)="editTooltip.hide()"
            >
                <div class="qt-icon icon__edit qt-sz-16"></div>
            </div>
            <div
                class="qt-button-square qt-button-square__afterpend pointer"
                (click)="removeService()"
                *ngIf="update.services.length > 0"
                (mouseenter)="deleteTooltip.show($event.target)"
                (mouseleave)="deleteTooltip.hide()"
            >
                <div class="qt-icon icon__delete qt-sz-16"></div>
            </div>
            <app-dynamic-tooltip
                [content]="'Delete Service'"
                [position]="'top'"
                #deleteTooltip
            >
            </app-dynamic-tooltip>
            <app-dynamic-tooltip
                [content]="'Edit'"
                [position]="'top'"
                #editTooltip
            ></app-dynamic-tooltip>
            <div
                class="qt-button-square qt-ml-24 pointer"
                (click)="remove()"
                (mouseenter)="deleteUpdate.show($event.target)"
                (mouseleave)="deleteUpdate.hide()"
            >
                <div class="qt-icon icon__delete qt-icon__red-600 qt-sz-16"></div>
            </div>
        </div>
    </div>
    <app-dynamic-tooltip
        [content]="'Delete Update'"
        [position]="'top'"
        #deleteUpdate
    ></app-dynamic-tooltip>
    <ng-template
        ngFor
        let-service
        [ngForOf]="update.services"
        let-i="index"
        [ngForTrackBy]="trackById"
    >
        <ticket-detail-profile-updates-service-item
            [update]="update"
            [service]="service"
            [isBlockChange]="isBlockChange"
            [showCompleteLabel]="i > 0"
            [index]="i"
            (mouseenter)="setClassForActions(i,'--show')"
            (mouseleave)="setClassForActions(i,'')"
        ></ticket-detail-profile-updates-service-item>
    </ng-template>
</div>
