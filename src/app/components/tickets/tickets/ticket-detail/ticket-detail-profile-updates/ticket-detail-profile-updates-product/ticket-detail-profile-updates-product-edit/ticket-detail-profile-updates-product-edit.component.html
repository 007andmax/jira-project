<div class="qt-df jc-sb ai-fs ticket-updates__ticket-info-container ticket-update-product-edit">
    <div class="ticket-updates__ticket-info">
        <div class="ticket-updates__ticket-header qt-df">
            <div class="ticket-updates__ticket-header-name">Product Name</div>
            <div class="ticket-updates__ticket-header-price">Price</div>
            <div class="ticket-updates__ticket-header-qty">Qty</div>
            <div class="ticket-updates__ticket-header-total">Total</div>
        </div>
        <div
            class="ticket-updates__ticket-body"
            [ngClass]="{'--done':editProduct.completed}"
        >
            <div class="d-f ai-c ">
                <div class="ticket-updates__done-status qt-icon icon__check qt-icon__green-600"></div>
                <app-product-list
                    [type]="'TICKET'"
                    [editItem]="editProduct.item"
                    class="product-item__prodect-list"
                    (selectedProductItem)="onChangeProduct($event)"
                ></app-product-list>
                <div style="position: relative;">
                    <input
                        class="input-default input-price"
                        [ngClass]="{'--input-error':!valdiateSaleCost}"
                        number
                        [money]="true"
                        [ngModel]="editProduct.item.sale_str"
                        (change)="onChangeSale($event)"
                        appToFixed
                        (blur)="onValidateSaleCost()"
                        [disabled]="!getPermissions('MANAGE_PRODUCTS')"
                    >
                    <mat-error
                        class="qt-tooltip-error"
                        *ngIf="!valdiateSaleCost"
                    >
                        Product price can not be lower than cost
                    </mat-error>
                </div>
                <input
                    class="input-default input-qty"
                    [(ngModel)]="editProduct.quantity"
                >
                <div
                    class="ticket-updates__ticket-total"
                    [textContent]="'$' + getTotal(editProduct.item.sale,editProduct.quantity)"
                ></div>
                <div class="ticket-updates__date-icon qt-icon icon__calendar qt-icon__blue-light-600"></div>
                <div
                    class="ticket-updates__photo-people"
                    [textContent]="ticketsListService.getAssignedUserNameForAvatar(editProduct.user)"
                    [ngStyle]="{'background': ticketsListService.getStyleAvatar(editProduct.user)}"
                ></div>
            </div>
            <div
                style="position: relative;"
                class="qt-mt-8 qt-ml-30"
            >
                <input
                    class="input-default"
                    [(ngModel)]="editProduct.serialNumber"
                    [disabled]="!getPermissions('MANAGE_PRODUCTS')"
                >
            </div>
            <span
                class="tag__modern ticket-updates__service-tag-completed"
                *ngIf="editProduct.completed"
                [textContent]="'Completed on ' + getDate(editProduct.date)"
            ></span>
            <span
                class="tag__modern ticket-updates__service-tag-completed"
                *ngIf="!editProduct.completed && editProduct.date"
                [textContent]="'Due date - ' + getDate(editProduct.date)"
            ></span>
        </div>
    </div>
    <div class="right-side-icons">
        <i
            (click)="saveProduct()"
            class="icn-20 qt-icon icon__done qt-icon__blue-light-600 save-product pointer"
        ></i>
        <i
            (click)="cancelProduct()"
            class="icn-20 qt-icon icon__close pointer"
        ></i>
    </div>
</div>
