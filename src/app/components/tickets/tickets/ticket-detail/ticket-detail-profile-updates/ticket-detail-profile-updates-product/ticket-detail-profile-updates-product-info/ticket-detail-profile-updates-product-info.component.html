<div class="qt-df qt-mb-16">
    <div class="qt-df qt-fd-c qt-ai-c qt-mr-16">
        <div class="ticket-updates__ticket-icon qt-mb-4">
            <i class="icon__products icn-16"></i>
        </div>
        <div class="ticket-updates__ticket-line"></div>
    </div>
    <div class="ticket-updates__ticket-info-container qt-w100">
        <span
            class="tag__modern ticket-updates__service-tag-completed qt-dib qt-mb-16"
            *ngIf="product.completed && showCompleteLabel"
            [textContent]="'Completed on ' + getDate(product.date)"
        ></span>
        <span
            class="tag__modern ticket-updates__service-tag-completed qt-dib qt-mb-16"
            *ngIf="!product.completed && product.date && showCompleteLabel"
            [textContent]="'Due date - ' + getDate(product.date)"
        ></span>
        <div class="ticket-updates__ticket-info">
            <div class="ticket-updates__ticket-header qt-df">
                <div class="ticket-updates__ticket-header-name">Product Name</div>
                <div class="ticket-updates__ticket-header-price">SN.</div>
                <div class="ticket-updates__ticket-header-price">Price</div>
                <div class="ticket-updates__ticket-header-qty">Qty</div>
                <div class="ticket-updates__ticket-header-total">Total</div>
            </div>
            <div class="qt-df ticket-updates__ticket-body">
                <div class="ticket-updates__ticket-title">
                    <pre [textContent]="product.item.description"></pre>
                </div>
                <div
                    class="ticket-updates__ticket-price"
                    [textContent]="product.serialNumber"
                ></div>
                <div
                    class="ticket-updates__ticket-price"
                    [textContent]="'$' + getPrice()"
                ></div>
                <div
                    class="ticket-updates__ticket-qty"
                    [textContent]="product.quantity"
                ></div>
                <div
                    class="ticket-updates__ticket-total"
                    [textContent]="'$' + getTotal(product.price,product.quantity)"
                ></div>
            </div>
        </div>
        <div class="qt-df qt-jc-fe qt-ai-c qt-mt-8">
            <app-tech-users
                [isDisabled]="isBlockChange"
                [type]="'DETAIL_TICKET'"
                [editMode]="true"
                [selectedMode]="'SINGLE'"
                [editUsers]="userService"
                [users]="listTechUsers"
                [placement]="'top-end'"
                (usersChange)="onChangeUser($event)"
            ></app-tech-users>
            <app-date-picker
                [isDisabled]="isBlockChange"
                [placement]="'bottom-right'"
                [useMinDate]="false"
                [editMode]="true"
                [editDate]="product.date"
                [type]="'DETAIL_TICKET_UPDATE'"
                (onChange)="onChangeDatePicker($event)"
            ></app-date-picker>
            <div
                class="qt-button --sm --gray qt-ml-8 button-mark-complete"
                (click)="setComplete()"
            >
                <i
                    class="icon__inactive qt-bg-contain qt-mr-6 icn-16"
                    *ngIf="!product.completed"
                ></i>
                <i
                    class="icon__active qt-bg-contain qt-mr-6 icn-16"
                    *ngIf="product.completed"
                ></i>
                <span [textContent]="(product.completed) ? 'Mark Completed' : 'Mark Incomplete'"></span>
            </div>
        </div>
    </div>
    <div
        class="qt-button-square-wrap"
        *ngIf="!isBlockChange"
    >
        <div
            class="qt-button-square qt-button-square__prepend pointer"
            (click)="edit()"
            *ngIf="!isIOSDevice()"
        >
            <div class="icon__edit qt-sz-16"></div>
        </div>
        <div
            class="qt-button-square qt-button-square__prepend pointer"
            (touchstart)="edit()"
            *ngIf="isIOSDevice()"
        >
            <div class="icon__edit qt-sz-16"></div>
        </div>
        <div
            class="qt-button-square qt-button-square__afterpend pointer"
            (click)="removeProduct()"
            (mouseenter)="deleteTooltip.show($event.target)"
            (mouseleave)="deleteTooltip.hide()"
        >
            <div class="icon__remove qt-sz-16"></div>
        </div>
        <app-dynamic-tooltip
            [content]="'Delete Product'"
            [position]="'top'"
            #deleteTooltip
        ></app-dynamic-tooltip>
    </div>
</div>
