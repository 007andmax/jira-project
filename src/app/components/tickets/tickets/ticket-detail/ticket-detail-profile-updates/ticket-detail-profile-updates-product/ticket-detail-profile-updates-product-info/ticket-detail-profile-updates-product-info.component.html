<div class="qt-df qt-mb-16 ticket-updates__update-block__inner">
    <div class="qt-df qt-fd-c qt-ai-c qt-mr-16">
        <div class="ticket-updates__ticket-icon qt-mb-4">
            <i class="qt-icon icon__products icn-16"></i>
        </div>
        <div class="ticket-updates__ticket-line"></div>
    </div>
    <div class="ticket-updates__ticket-info-container qt-w100">
        <div
            class="qt-df qt-jc-sb qt-ai-c qt-mb-16 ticket-updates-tag__modern-row"
            *ngIf="index > 0"
        >
            <div class="qt-df qt-ai-c">
                <div class="icn-16 qt-icon icon__calendar pointer qt-mr-8 qt-fs-0"></div>
                <span
                    class="ticket-updates__tag-completed --completed"
                    *ngIf="product.completed && showCompleteLabel"
                    [textContent]="'Completed on ' + getDate(product.date)"
                ></span>
                <span
                    class="ticket-updates__tag-completed"
                    *ngIf="!product.completed && product.date && showCompleteLabel"
                    [textContent]="'Due date - ' + getDate(product.date)"
                ></span>
            </div>
            <div
                class="qt-button-square-wrap qt-button-square-wrap__edit"
                *ngIf="!isBlockChange && index > 0"
            >
                <div
                    class="qt-button-square qt-button-square__prepend pointer"
                    (click)="edit()"
                    *ngIf="!isIOSDevice()"
                    (mouseenter)="editTooltip.show($event.target)"
                    (mouseleave)="editTooltip.hide()"
                >
                    <div class="qt-icon icon__edit qt-sz-16"></div>
                </div>
                <div
                    class="qt-button-square qt-button-square__prepend pointer"
                    (touchstart)="edit()"
                    *ngIf="isIOSDevice()"
                    (mouseenter)="editTooltip.show($event.target)"
                    (mouseleave)="editTooltip.hide()"
                >
                    <div class="qt-icon icon__edit qt-sz-16"></div>
                </div>
                <div
                    class="qt-button-square qt-button-square__afterpend pointer"
                    (click)="removeProduct()"
                    (mouseenter)="deleteTooltip.show($event.target)"
                    (mouseleave)="deleteTooltip.hide()"
                >
                    <div class="qt-icon icon__delete qt-sz-16"></div>
                </div>
                <app-dynamic-tooltip
                    [content]="'Delete Product'"
                    [position]="'top'"
                    #deleteTooltip
                ></app-dynamic-tooltip>
                <app-dynamic-tooltip
                    [content]="'Edit'"
                    [position]="'top'"
                    #editTooltip
                ></app-dynamic-tooltip>
            </div>
        </div>
        <div class="ticket-updates__ticket-info">
            <div class="ticket-updates__ticket-header qt-df">
                <div class="ticket-updates__ticket-header-name">Product Name</div>
                <div class="ticket-updates__ticket-header-price qt-df qt-ai-c">
                    Price
                    <app-dynamic-tooltip
                        [content]="'Applied discount - ' + product.discountAmount + ((product.discountType === 'PERCENT') ? '%' : ' amount')"
                        [position]="'top'"
                        #productTooltip
                    ></app-dynamic-tooltip>
                    <div
                        class="qt-icon icon__commissions qt-icon__blue-light-600 qt-ml-4 qt-sz-16 qt-ic-c"
                        *ngIf="product.discountAmount"
                        (mouseenter)="productTooltip.show($event.target)"
                        (mouseleave)="productTooltip.hide()"
                    ></div>
                </div>
                <div class="ticket-updates__ticket-header-qty">Qty</div>
                <div class="ticket-updates__ticket-header-total">Total</div>
            </div>
            <div class="qt-df ticket-updates__ticket-body">
                <div class="ticket-updates__ticket-title">
                    <pre [textContent]="product.item.description"></pre>
                </div>
                <div class="ticket-updates__ticket-price">{{'$' + getPrice()}}</div>
                <div
                    class="ticket-updates__ticket-qty"
                    [textContent]="product.quantity"
                ></div>
                <div
                    class="ticket-updates__ticket-total"
                    [textContent]="'$' + getTotal(product.price,product.quantity)"
                ></div>
            </div>
        </div>
        <div class="qt-df qt-ai-c qt-jc-sb qt-mt-8">
            <div class="ticket-updates__ticket-price qt-fs-0 qt-df qt-a">
                <span>Serial number -</span>
                <div
                    class="ellipsis serial-number"
                    [textContent]="product.serialNumber"
                ></div>
                <i
                    *ngIf="product.serialNumber && product.serialNumber.length > 19"
                    class="icon__help default-services-page__question-icon qt-sz-12 qt-ic-c qt-ml-8"
                    placement="top"
                    [ngbTooltip]="product.serialNumber"
                ></i>
            </div>
            <div class="qt-ml-16 qt-df qt-ai-c">
                <app-tech-users
                    *ngIf="listTechUsers.length > 0"
                    [isDisabled]="isBlockChange"
                    [type]="'DETAIL_TICKET'"
                    [editMode]="true"
                    [selectedMode]="'SINGLE'"
                    [editUsers]="userService"
                    [users]="listTechUsers"
                    [container]="'body'"
                    (usersChange)="onChangeUser($event)"
                ></app-tech-users>
                <app-date-picker
                    #dpDate
                    [dropdownClass]="['date-picker']"
                    [isDisabled]="isBlockChange"
                    [container]="'body'"
                    [useMinDate]="false"
                    [placement]="'top'"
                    [type]="'DETAIL_TICKET_UPDATE'"
                    (onChange)="onChangeDatePicker($event)"
                ></app-date-picker>
                <div
                    class="qt-button qt-button--with-icon --sm --gray qt-ml-8"
                    (click)="setComplete()"
                    [ngClass]="{'no-pointer':isBlockChange,
                'button-mark-complete': product.completed}"
                >
                    <i
                        class="qt-icon icon__check qt-icon__green-600 qt-mr-6 icn-16"
                        *ngIf="product.completed"
                    ></i>
                    <i
                        class="qt-icon icon__check qt-mr-6 icn-16"
                        *ngIf="!product.completed"
                    ></i>
                    <span [textContent]="(!product.completed) ? 'Mark completed' : 'Сompleted'"></span>
                </div>
            </div>
        </div>
    </div>
</div>
