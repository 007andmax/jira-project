<div class="ticket-updates__update-block qt-mb-16">
    <div>
        <div class="qt-df qt-ai-c qt-mb-16 ticket-updates__update-block__inner">
            <div
                class="ticket-updates__ticket-photo"
                [textContent]="ticketsListService.getAssignedUserNameForAvatar(update.user)"
                [ngStyle]="{'background': ticketsListService.getStyleAvatar(update.user)}"
            ></div>
            <div class="qt-f-1">
                <div class="qt-mb-4">
                    <span
                        class="ticket-updates__author"
                        [textContent]="ticketsListService.getUserName(update.user)"
                    >
                    </span>
                    <span class="ticket-updates__add-note">&nbsp;added a product</span>
                </div>
                <ticket-detail-profile-updates-product-header-info
                    *ngIf="update.products.length > 0"
                    [date]="update.createdAt"
                    [otherRecipients]="update.otherRecipients"
                    [shares]="update.shares"
                    [product]="update.products[0]"
                ></ticket-detail-profile-updates-product-header-info>
                <app-dynamic-tooltip
                    [content]="'Delete Update'"
                    [position]="'top'"
                    #deleteUpdate
                ></app-dynamic-tooltip>
            </div>
            <div
                class="qt-button-square-wrap"
                *ngIf="!isBlockChange"
                [ngClass]="classActions"
            >
                <div
                    class="qt-button-square qt-button-square__prepend pointer"
                    (click)="edit()"
                    *ngIf="!isIOSDevice() && update.products.length > 0"
                    (mouseenter)="editTooltip.show($event.target)"
                    (mouseleave)="editTooltip.hide()"
                >
                    <div class="qt-icon icon__edit qt-sz-16"></div>
                </div>
                <div
                    class="qt-button-square qt-button-square__prepend pointer"
                    (touchstart)="edit()"
                    *ngIf="isIOSDevice() && update.products.length > 0"
                    (mouseenter)="editTooltip.show($event.target)"
                    (mouseleave)="editTooltip.hide()"
                >
                    <div class="qt-icon icon__edit qt-sz-16"></div>
                </div>
                <div
                    class="qt-button-square qt-button-square__afterpend pointer"
                    (click)="removeProduct()"
                    *ngIf="update.products.length > 0"
                    (mouseenter)="deleteProduct.show($event.target)"
                    (mouseleave)="deleteProduct.hide()"
                >
                    <div class="qt-icon icon__delete qt-sz-16"></div>
                </div>
                <app-dynamic-tooltip
                    [content]="'Delete Product'"
                    [position]="'top'"
                    #deleteProduct
                ></app-dynamic-tooltip>
                <app-dynamic-tooltip
                    [content]="'Edit'"
                    [position]="'top'"
                    #editTooltip
                ></app-dynamic-tooltip>
                <div
                    class="qt-button-square pointer qt-ml-24"
                    (click)="remove()"
                    (mouseenter)="deleteUpdate.show($event.target)"
                    (mouseleave)="deleteUpdate.hide()"
                >
                    <div class="qt-icon icon__delete qt-icon__red-600 qt-sz-16"></div>
                </div>
            </div>
        </div>
    </div>
    <ng-template
        ngFor
        let-product
        [ngForOf]="update.products"
        let-i="index"
        [ngForTrackBy]="trackById"
    >
        <ticket-detail-profile-updates-product-item
            [isBlockChange]="isBlockChange"
            [update]="update"
            [product]="product"
            [showCompleteLabel]="i > 0"
            [index]="i"
            (mouseenter)="setClassForActions(i,'--show')"
            (mouseleave)="setClassForActions(i,'')"
        ></ticket-detail-profile-updates-product-item>
    </ng-template>
</div>
