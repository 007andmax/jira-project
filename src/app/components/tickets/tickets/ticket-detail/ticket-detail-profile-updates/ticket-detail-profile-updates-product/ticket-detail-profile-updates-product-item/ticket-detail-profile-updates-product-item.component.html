<ticket-detail-profile-updates-product-info
    [isBlockChange]="isBlockChange"
    [update]="update"
    [index]="index"
    *ngIf="!editMode"
    (onEdit)="editMode = true"
    [product]="product"
    [showCompleteLabel]="showCompleteLabel"
></ticket-detail-profile-updates-product-info>
<ticket-detail-profile-updates-product-edit
    [update]="update"
    *ngIf="editMode"
    (onEdit)="editMode = false"
    [product]="product"
    [ticketProfile]="ticketProfile"
></ticket-detail-profile-updates-product-edit>
