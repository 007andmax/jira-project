<div class="ticket-updates qt-mr-24 qt-ml-24">
    <div class="ticket-updates__title">
        <div class="ticket-updates__title-line"></div>
        <div class="ticket-updates__title-info">
            <span class="icon__arrow-down--blue-light-800 qt-dib qt-sz-12 qt-mr-4"></span>
            <span
                class="ticket-updates__count qt-mr-5"
                [textContent]="getCountUpdates()"
            ></span>
            Ticket Updates
        </div>
        <div class="ticket-updates__title-line"></div>
    </div>
    <div class="ticket-updates__ticket">
        <ng-template
            ngFor
            let-update
            [ngForOf]="updates"
            let-i="index"
            [ngForTrackBy]="trackById"
        >
            <ticket-detail-profile-updates-note
                class="ticket-updates__ticket-item"
                (onRemove)="removeUpdate()"
                *ngIf="update.type === 'NOTE' || update.type === 'SALE_QUOTE_REVIEW_NOTE'"
                [idTicket]="ticketProfile.id"
                [update]="update"
                [isBlockChange]="!ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
            >
            </ticket-detail-profile-updates-note>
            <ticket-detail-profile-updates-product
                class="ticket-updates__ticket-item"
                *ngIf="update.type === 'PRODUCT'"
                [update]="update"
                [isBlockChange]="!ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
            >
            </ticket-detail-profile-updates-product>
            <ticket-detail-profile-updates-service
                class="ticket-updates__ticket-item"
                *ngIf="update.type === 'SERVICE'"
                [update]="update"
                [isBlockChange]="!ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
            >
            </ticket-detail-profile-updates-service>
        </ng-template>
    </div>
    <div
        *ngIf="showLoadMoreUpdates && ticketProfile.unloadedUpdates > 0"
        class="button-loader"
        (click)="fetchUpdates()"
    >
        Load More Updates
        <span
            *ngIf="showPreloader"
            class="loading"
        ></span>
    </div>
</div>
