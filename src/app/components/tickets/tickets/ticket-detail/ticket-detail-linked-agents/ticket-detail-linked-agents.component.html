<div
    class="qt-input-block --required"
    ngbDropdown
    container="body"
    (openChange)="onCloseDropDown($event)"
>
    <div class="qt-df qt-ai-c qt-jc-sb qt-mb-16">
        <span class="qt-input-block__label">Linked Agents</span>
        <div
            class="qt-button qt-button--with-icon --sm --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
            ngbDropdownToggle
            *ngIf="!customerPortalStateService.isCustomerPortal && ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
        >
            <span class="icon__link-agent qt-sz-16 qt-bg-contain qt-dib qt-mr-4 qt-button-icon"></span>
            Link
        </div>
    </div>
    <div
        class="device-user"
        [ngClass]="{'has-placeholder': !selectedDevice}"
    >
        <span
            class="placeholder-detail-ticket"
            *ngIf="!selectedDevice"
        >
            Select device
        </span>
        <div
            class="selected-user"
            *ngIf="selectedDevice"
        >
            <i class="icon__monitor qt-sz-16 qt-bg-contain qt-mr-4"></i>
            {{getLabelDevice(selectedDevice)}}
            <i
                class="icn-sm icon__close--light-gray qt-ml-4 pointer"
                (click)="removeItem()"
            ></i>
        </div>
    </div>
    <div
        class="select-wrapper"
        ngbDropdownMenu
    >
        <div class="qt-input-search">
            <input
                type="text"
                id="search-user"
                autocomplete="off"
                class="qt-dropdown-input"
                placeholder="Search Agents"
                (input)="onSearch($event)"
            >
        </div>
        <div class="content">
            <div>
                <div
                    class="dropdown-item"
                    *ngFor="let item of devicesList; let i = index"
                    (click)="selected(item)"
                    ngbDropdownItem
                >
                    <label class="qt-checkbox pointer">
                        <div
                            class="name"
                            [textContent]="getLabelDevice(item)"
                        ></div>
                        <i
                            *ngIf="isSeletedDevice(item)"
                            class="icon__assign-user-check qt-za-20 qt-sz-20 qt-bg-contain qt-ml-auto"
                        ></i>
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>
