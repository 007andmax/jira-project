<div
    class="qt-input-block --required"
    ngbDropdown
>
    <div class="qt-df qt-ai-c qt-jc-sb qt-mb-16">
      <span class="qt-input-block__label">Linked Agents</span>
      <div class="qt-button --sm --gray qt-jc-c pointer qt-ml-12 button-gl-number__add">
        <span class="icon__link-agent qt-sz-16 qt-bg-contain qt-dib qt-mr-4 qt-button-icon"></span> Add </div>
    </div>
    <div
        class="device-user pointer"
        [ngClass]="{'has-placeholder': !selectedDevice}"
        ngbDropdownToggle
    >
        <div
            class="selected-user"
            *ngIf="selectedDevice"
        >
            <i class="icon__monitor qt-sz-16 qt-bg-contain qt-mr-4"></i>
            {{getLabelDevice(selectedDevice)}}
            <i
                class="icn-sm icon__close--light-gray qt-ml-4"
                (click)="removeItem()"
            ></i>
        </div>
    </div>
    <div
        class="select-wrapper"
        ngbDropdownMenu
    >
        <div class="qt-input-search">
          <input
            type="text"
            autocomplete="off"
            class="qt-dropdown-input"
            placeholder="Search Agents"
            (input)="onSearch($event)"
          >
        </div>
        <div class="content">
            <div>
                <div
                    class="dropdown-item"
                    *ngFor="let item of devicesList; let i = index"
                    (click)="selected(item)"
                    ngbDropdownItem
                >
                    <label class="qt-checkbox pointer">
                        <div
                            class="name"
                            [textContent]="getLabelDevice(item)"
                        ></div>
                        <i
                            *ngIf="isSeleted(item)"
                            class="icon__assign-user-check qt-za-20 qt-sz-20 qt-bg-contain qt-ml-auto"
                        ></i>
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>
