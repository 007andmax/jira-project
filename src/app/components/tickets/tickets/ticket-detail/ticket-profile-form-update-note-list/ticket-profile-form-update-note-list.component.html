<div
    class="note-list-container"
    ngbDropdown
    [placement]="placement"
>
    <div
        class="icon__note-list-container pointer"
        ngbDropdownToggle
        placement="top"
        [container]="'body'"
        [ngbTooltip]="'Canned Responses'"
    >
        <i class="icon__note-list qt-sz-16 qt-bg-contain qt-dib"></i>
    </div>
    <div
        ngbDropdownMenu
        aria-labelledby="dropdown1"
        class="app-drop-down__dropdown"
        style="width: 560px; min-height: 236px; max-height: 236px;"
    >
        <div class="header-note-list">
            <div class="header-note-list-title">Canned Responses</div>
            <div
                class="header-note-list-add"
                (click)="createResponse()"
                *ngIf="getPermissions('CREATE_TICKET_NOTE_TEMPLATE')"
            >
                <div class="qt-button --gray --sm select-product__header-add-product ng-star-inserted">
                    <span class="icon__add--grey-500 qt-sz-16 qt-bg-contain qt-dib qt-mr-4 qt-button-icon"></span>
                    Create Response
                </div>
            </div>
        </div>
        <ng-template
            ngFor
            let-item
            [ngForOf]="noteTemplate"
            let-i="index"
        >
            <button
                ngbDropdownItem
                [textContent]="item.title"
                (click)="onSelect(item)"
            ></button>
        </ng-template>
    </div>
</div>
