<div class="tasks__header qt-df qt-jc-sb qt-ai-c qt-mr-24 qt-ml-24">
    <div>Tasks</div>
    <div
        class="qt-button qt-button--with-icon --sm --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
        (click)="showAdd = true"
        *ngIf="ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
    >
        <span class="qt-icon icon__add qt-sz-16 qt-dib qt-mr-4 qt-button-icon"></span>
        Add Task
    </div>
</div>
<div class="tab-pane__table-body qt-mr-24 qt-ml-24">
    <div
        *ngIf="showAdd"
        [ngClass]="[addTask.status == 'COMPLETED' ? '--completed' : '']"
        class="add-task-container tab-pane__table-row --selected"
        appClickOtside
        #addTaskBtn="click"
        [init]="true"
        [class]="'.add-task-container'"
        (onOutSide)="onAddTicketTask()"
    >
        <div class="tab-pane__table-cell tab-pane__table-checkboxes qt-ml-8 pointer">
            <app-dynamic-tooltip
                [content]="'Mark task as incomplete'"
                [position]="'right'"
                #incomplete
            ></app-dynamic-tooltip>
            <app-dynamic-tooltip
                [content]="'Mark task as completed'"
                [position]="'right'"
                #complete
            ></app-dynamic-tooltip>
            <i
                [hidden]="addTask.status != 'INCOMPLETED'"
                class="qt-icon icon__check icn-20"
                (click)="setStatus(addTask,'COMPLETED')"
                (mouseenter)="complete.show($event.target)"
                (mouseleave)="complete.hide()"
            ></i>
            <i
                [hidden]="addTask.status != 'COMPLETED'"
                class="qt-icon icon__check qt-icon__green-600 icn-20"
                (click)="setStatus(addTask,'INCOMPLETED')"
                (mouseenter)="incomplete.show($event.target)"
                (mouseleave)="incomplete.hide()"
            ></i>
        </div>
        <div class="tab-pane__table-cell ticket-status-table__status">
            <input
                type="text"
                class="form-input --editable"
                placeholder="Enter Name Task"
                [(ngModel)]="addTask.subject"
                (keyup)="onKeyUp($event)"
                maxlength="500"
                minlength="1"
            >
        </div>
        <div class="tab-pane__table-cell"></div>
        <div class="tab-pane__table-cell ticket-status-table__preview"></div>
        <div class="tab-pane__table-cell ticket-status-table__action">
            <app-date-picker
                [editMode]="true"
                [editDate]="addTask.dateForDatePicker"
                [placement]="'bottom-right'"
                [useMinDate]="false"
                [type]="'DETAIL_TICKET'"
                (onChange)="onChangeDatePicker($event,addTask)"
            ></app-date-picker>
            <app-tech-users
                [type]="'TICEKTS'"
                [selectedMode]="'SINGLE'"
                [users]="listTechUsers"
                [container]="'body'"
                (usersChange)="onChangeUser($event,addTask)"
            ></app-tech-users>
        </div>
    </div>
    <div
        class="tab-pane__table-row"
        *ngFor="let item of list; let i = index"
        appClickOtside
        [init]="item.isInitEdit"
        [ngClass]="['edit-ticket-container-' + i,item.status == 'COMPLETED' ? '--completed' : '']"
        [class]="'.edit-ticket-container-' + i"
        (onOutSide)="onEditTicketTask(item)"
    >
        <div
            class="ab-pane__table-cell tab-pane__table-checkboxes qt-ml-8"
            [ngClass]="{'pointer':ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)}"
        >
            <app-dynamic-tooltip
                [content]="'Mark task as incomplete'"
                [position]="'right'"
                #incomplete
            ></app-dynamic-tooltip>
            <app-dynamic-tooltip
                [content]="'Mark task as completed'"
                [position]="'right'"
                #complete
            ></app-dynamic-tooltip>
            <i
                *ngIf="ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
                [hidden]="item.status != 'INCOMPLETED'"
                class="qt-icon icon__check icn-20"
                (click)="setStatus(item,'COMPLETED');onEditTicketTask(item)"
                (mouseenter)="complete.show($event.target)"
                (mouseleave)="complete.hide()"
            ></i>
            <i
                *ngIf="ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
                [hidden]="item.status != 'COMPLETED'"
                class="qt-icon icon__check qt-icon__green-600 icn-20"
                (click)="setStatus(item,'INCOMPLETED');onEditTicketTask(item)"
                (mouseenter)="incomplete.show($event.target)"
                (mouseleave)="incomplete.hide()"
            ></i>
            <i
                *ngIf="!ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
                [ngClass]="{'icon__active':item.status != 'COMPLETED',
            'icon__task-pending':item.status != 'INCOMPLETED'}"
                class=" icn-20"
            ></i>
        </div>
        <div class="tab-pane__table-cell ticket-status-table__status">
            <input
                type="text"
                class="form-input  --editable"
                placeholder="Enter Name Taks"
                [(ngModel)]="item.subject"
                maxlength="500"
                minlength="1"
                appKeyUpEnter
                (onChange)="onEditTicketTask(item)"
                (input)="item.onInitEdit(true)"
                [disabled]="!ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
            >
        </div>
        <div class="tab-pane__table-cell ticket-status-table__action">
            <app-date-picker
                [editMode]="true"
                [editDate]="item.date"
                [placement]="'bottom-right'"
                [useMinDate]="false"
                [type]="'DETAIL_TICKET'"
                (onChange)="onChangeDatePicker($event,item);onEditTicketTask(item)"
                [isDisabled]="!ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
            ></app-date-picker>
            <app-tech-users
                [editMode]="true"
                [editUsers]="item.assignedUser ? [item.assignedUser] : []"
                [type]="'TICEKTS'"
                [selectedMode]="'SINGLE'"
                [users]="listTechUsers"
                [container]="'body'"
                (usersChange)="onChangeUser($event,item);onEditTicketTask(item)"
                [isDisabled]="!ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
            ></app-tech-users>
            <app-dynamic-tooltip
                [content]="'Delete task'"
                [position]="'top'"
                #dateTooltip
            ></app-dynamic-tooltip>
            <div
                class="ticket-updates__delete qt-icon icon__delete"
                *ngIf="ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
                (click)="remove(item)"
                (mouseenter)="dateTooltip.show($event.target)"
                (mouseleave)="dateTooltip.hide()"
            ></div>
        </div>
    </div>
</div>
