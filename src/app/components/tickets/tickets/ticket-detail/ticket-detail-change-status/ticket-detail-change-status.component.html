<div class="qt-input-block">
    <span class="qt-input-block__label">Status</span>
    <app-drop-down
        #dp
        [class]="['qt-dropdown']"
        [heightInput]="'32px'"
        [field]="'title'"
        [isBlockClear]="true"
        [editItem]="selectedTicketStatus"
        [list]="list"
        [sort]="true"
        [isDisabled]="!ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null) || customerPortalStateService.isCustomerPortal"
        (onSelectedItem)="changeTicketStatus($event)"
    ></app-drop-down>
</div>
