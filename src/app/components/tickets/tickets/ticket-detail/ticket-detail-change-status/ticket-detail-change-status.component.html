<div class="qt-input-block">
    <span class="qt-input-block__label">Status</span>
    <app-drop-down
        [class]="['qt-dropdown']"
        [field]="'title'"
        [isBlockClear]="true"
        [editItem]="selectedTicketStatus"
        [list]="list"
        [isDisabled]="ticketProfile.status === 'COMPLETED' || ticketProfile.status === null"
        (onSelectedItem)="changeTicketStatus($event)"
    ></app-drop-down>
</div>
