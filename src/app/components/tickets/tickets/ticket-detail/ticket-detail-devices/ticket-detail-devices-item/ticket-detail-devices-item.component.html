<div
    class="ticket-detail-devices__item"
    ngbDropdown
    container="body"
>
    <div class="qt-df qt-ai-fs">
        <div
            class="qt-df qt-ai-c qt-jc-c qt-sz-40 qt-circle ticket-detail-devices__item-icon qt-mr-8 qt-fs-0 qt-icon"
            [ngClass]="{'--ofline': !device.online,'device-type-icon':!device.isCustom}"
        >
            <div
                [ngClass]="{'icon__devices' : device.getFieldForCheckIcon() === 'workstation' || !device.getFieldForCheckIcon(),
               'icon__router' : device.getFieldForCheckIcon() === 'router',
            'icon__print' : device.getFieldForCheckIcon() === 'printer',
                'qt-icon icon__network-switch' : device.getFieldForCheckIcon() === 'switch',
          'icon__server' : device.getFieldForCheckIcon() === 'server',
            'icon__tablet' : device.getFieldForCheckIcon() === 'tablet',
            'icon__network_device' : device.getFieldForCheckIcon() === 'network device',
            'icon__phone-old' : device.getFieldForCheckIcon() === 'phone',
             'icon__generic_device' : device.getFieldForCheckIcon() === 'generic device'}"
                class="qt-za-16 qt-sz-16 qt-bg-contain"
            >
            </div>
        </div>
        <div>
            <div
                class="ticket-detail-devices__item-subtitle"
                [textContent]="getLabelForEdit()"
            ></div>
            <div class="ticket-detail-devices__item-text qt-df qt-ai-c">
                <span
                    class="qt-mr-4"
                    *ngIf="device.userName"
                    [textContent]="device.userName"
                ></span>
                <span
                    [ngClass]="{'logged-time-point':device.userName,
                'qt-ml-4': device.userName}"
                    class="logged-time"
                    *ngIf="!device.isCustom && device.online && device.timing.idle > 0"
                >
                    Idle:
                    <span *ngIf="device.timing.idle && returnTimeFormat(device.timing.idle).hours > 0">
                        {{returnTimeFormat(device.timing.idle).hours}} hrs
                    </span>
                    <span *ngIf="device.timing.idle && returnTimeFormat(device.timing.idle).minutes > 0">
                        {{returnTimeFormat(device.timing.idle).minutes}} min
                    </span>
                    <span *ngIf="device.timing.idle && returnTimeFormat(device.timing.idle).minutes < 1 || !device.timing.idle">0 min</span>
                </span>
                <span
                    [ngClass]="{'logged-time-point':device.userName,
                'qt-ml-4': device.userName}"
                    class="logged-time"
                    *ngIf="!device.isCustom && device.timing.idle == 0"
                >
                    <div *ngIf="device.online">
                        Online
                        <span [textContent]="getTimeStatus(device.timing.online)"></span>
                    </div>
                    <div *ngIf="!device.online">
                        Offline
                        <span [textContent]="getTimeStatus(device.timing.offline)"></span>
                    </div>
                </span>
            </div>
        </div>
    </div>
    <div
        class="qt-icon icon__more qt-sz-16 qt-bg-contain action-more"
        ngbDropdownToggle
    ></div>
    <div
        ngbDropdownMenu
        class="dropdown-menu-qt"
    >
        <div
            class="qt-df qt-ai-c pointer dropdown-menu-qt-item"
            (click)="remoteAccess('CSS')"
            *ngIf="!device.isCustom"
        >
            <i class="qt-icon icon__remote-access-ticket qt-sz-20 qt-bg-contain qt-mr-12 qt-fs-0 qt-dib"></i>
            Remote Access
        </div>
        <div
            class="qt-df qt-ai-c pointer dropdown-menu-qt-item"
            (click)="turnOff('reboot')"
            *ngIf="!device.isCustom"
        >
            <i class="qt-icon icon__reset qt-sz-20 qt-bg-contain qt-mr-12 qt-fs-0 qt-dib"></i>
            Restart
        </div>
        <div
            class="qt-df qt-ai-c pointer dropdown-menu-qt-item"
            (click)="turnOff('shutdown')"
            *ngIf="!device.isCustom"
        >
            <i class="qt-icon icon__shutdown qt-sz-20 qt-bg-contain qt-mr-12 qt-fs-0 qt-dib"></i>
            Shutdown
        </div>
        <hr *ngIf="!device.isCustom">
        <div
            class="qt-df qt-ai-c pointer dropdown-menu-qt-item qt-color-red-600"
            (click)="removeDevice()"
        >
            <i class="qt-icon icon__remove qt-sz-20 qt-bg-contain qt-mr-12 qt-fs-0 qt-dib"></i>
            Remove
        </div>
    </div>
</div>
