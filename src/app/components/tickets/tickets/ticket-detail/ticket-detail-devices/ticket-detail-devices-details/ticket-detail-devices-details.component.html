<div class="ticket-detail-devices ticket-detail-documents__full">
    <div class="ticket-detail-devices__header qt-df qt-ai-c qt-jc-sb">
        <div class="ticket-detail-devices__main-title">Devices</div>
        <div
            class="qt-button --square-md --gray pointer"
            (click)="close()"
        >
            <div class="qt-icon icon__close qt-sz-16 pointer"></div>
        </div>
    </div>
    <div class="qt-input-search qt-mt-16 qt-mb-16 qt-ml-16 qt-mr-16">
        <input
            id="search-devices"
            placeholder="Search devices"
            (input)="search($event)"
        >
        <span
            *ngIf="isSearch"
            (click)="clearSearch()"
            class="search-clear icon__close-round"
        ></span>
    </div>
    <div class="ticket-detail-devices__body">
        <div
            class="no-find-devices"
            *ngIf="devices.length == 0"
        >
            <div class="no-find-devices-avatar">
                <div class="qt-icon icon__devices qt-sz-24"></div>
            </div>
            <h4
                class="qt-mt-16"
                [textContent]="devices.length == 0 && !isSearch ? 'No Devices' : 'No Devices found'"
            ></h4>
            <span [textContent]="devices.length == 0 && !isSearch ? 'New Devices will appear here' : 'Try using another word'"></span>
        </div>
        <ng-template
            ngFor
            let-item
            [ngForOf]="devices"
            [ngForTrackBy]="trackById"
        >
            <ticket-detail-devices-item [device]="item"></ticket-detail-devices-item>
        </ng-template>
    </div>
</div>
