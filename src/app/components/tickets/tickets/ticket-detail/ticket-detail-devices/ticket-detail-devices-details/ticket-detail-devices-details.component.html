<div class="ticket-detail-devices ticket-detail-documents__full">
    <div class="ticket-detail-devices__header qt-df qt-ai-c qt-jc-sb">
        <div class="ticket-detail-devices__main-title">Devices</div>
        <div
            class="qt-button --square-md --gray pointer"
            (click)="close()"
        >
            <div class="icon__close qt-bg-contain qt-sz-16 pointer"></div>
        </div>
    </div>
    <div class="qt-input-search qt-mt-16 qt-mb-16 qt-ml-16 qt-mr-16">
        <input
            id="search-devices"
            placeholder="Search devices"
            (input)="search($event)"
        >
        <span
            *ngIf="isSearch"
            (click)="clearSearch()"
            class="search-clear icon__close-round"
        ></span>
    </div>
    <div class="ticket-detail-devices__body">
        <ng-template
            ngFor
            let-item
            [ngForOf]="devices"
            [ngForTrackBy]="trackById"
        >
            <ticket-detail-devices-item [device]="item"></ticket-detail-devices-item>
        </ng-template>
    </div>
</div>
