<div class="ticket-detail-passwords ticket-detail-documents__full">
    <div class="ticket-detail-passwords__header qt-df qt-ai-c qt-jc-sb">
        <div class="ticket-detail-passwords__main-title">Passwords</div>
        <div
            class="qt-button --square-md --gray pointer"
            (click)="close()"
        >
            <div class="qt-icon icon__close qt-bg-contain qt-sz-16 pointer"></div>
        </div>
    </div>
    <div class="qt-input-search qt-mt-16 qt-mb-16 qt-ml-16 qt-mr-16">
        <input
            id="search-passwords"
            placeholder="Search passwords"
            (keyup)="onKeyUp($event)"
        >
        <span
            *ngIf="isSearch"
            (click)="clearSearch()"
            class="search-clear icon__close-round"
        ></span>
    </div>
    <div
        class="ticket-detail-passwords__body"
        [ngStyle]="{'height': (showPendingPreloader) ? 'calc(100% - 200px)' : 'calc(100% - 124px)'}"
    >
        <div
            infiniteScroll
            [infiniteScrollContainer]="container"
            [infiniteScrollDistance]="2"
            [infiniteScrollThrottle]="50"
            [infiniteScrollDisabled]="infiniteScrollDisabled"
            (scrolled)="onScroll()"
        >
            <div
                class="no-find-passwords"
                *ngIf="list_records.length == 0 && !showPreloader"
            >
                <div class="no-find-passwords-avatar">
                    <div class="icon__locked qt-sz-24 qt-bg-contain"></div>
                </div>
                <h4
                    class="qt-mt-16"
                    [textContent]="list_records.length == 0 && !isSearch ? 'No Passwords' : 'No Password found'"
                ></h4>
                <span [textContent]="list_records.length == 0 && !isSearch ? 'New Passwords will appear here.' : 'Try using another word'"></span>
            </div>
            <ng-template
                ngFor
                let-item
                [ngForOf]="list_records"
                [ngForTrackBy]="trackById"
            >
                <ticket-detail-passwords-item [password]="item"></ticket-detail-passwords-item>
            </ng-template>
            <div
                class="loading"
                *ngIf="showPreloader"
            ></div>
            <div
                class="loading pengind-loading"
                *ngIf="showPendingPreloader"
            ></div>
        </div>
    </div>
</div>
