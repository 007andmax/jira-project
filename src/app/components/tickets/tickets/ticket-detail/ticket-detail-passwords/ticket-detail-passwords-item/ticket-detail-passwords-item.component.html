<div class="ticket-detail-passwords__item">
    <div class="qt-df qt-ai-c qt-jc-sb ticket-detail-passwords__header qt-mb-8">
        <div
            class="ticket-detail-passwords__item-title qt-pr-20"
            [textContent]="password.description"
        ></div>
        <i
            class="icn-sm qt-icon icon__arrow-down report-caret-icon pointer"
            [ngClass]="{'report-caret-icon-rotate' : toggleBodyPassword}"
            (click)="onToggleBodyPassword(!toggleBodyPassword)"
        ></i>
    </div>
    <div class="qt-df qt-ai-c">
        <div
            *ngIf="password.template.name === 'OFFICE_365_ACCOUNT' && password.isDefaultType()"
            class="qt-icon icon__office-365 qt-za-16 qt-sz-16 qt-mr-8"
        ></div>
        <div
            *ngIf="password.template.name === 'GENERIC' && password.isDefaultType()"
            class="qt-icon icon__globe qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8 qt-fs-0"
        ></div>
        <div
            *ngIf="password.template.name === 'LOCAL_USER_ACCOUNT' && password.isDefaultType()"
            class="qt-icon icon__my-profile qt-za-16 qt-sz-16 qt-mr-8 qt-fs-0"
        ></div>
        <div
            *ngIf="password.template.name === 'EMAIL_ACCOUNT' && password.isDefaultType()"
            class="qt-icon icon__email qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8 qt-fs-0"
        ></div>
        <div
            *ngIf="password.template.name === 'WIFI_NETWORK' && password.isDefaultType()"
            class="qt-icon icon__wifi-network qt-za-16 qt-sz-16 qt-mr-8 qt-fs-0"
        ></div>
        <div
            *ngIf="password.template.name === 'AGENT' && password.isDefaultType()"
            class="qt-icon icon__agent qt-za-16 qt-sz-16 qt-mr-8 qt-fs-0"
        ></div>
        <div
            *ngIf="password.template.name === 'DEVICE' && password.isDefaultType()"
            class="qt-icon icon__devices qt-za-16 qt-sz-16 qt-mr-8 qt-fs-0"
        ></div>
        <div
            *ngIf="password.template.name === 'MICROSOFT_ACCOUNT' && password.isDefaultType()"
            class="qt-icon icon__microsoft qt-za-16 qt-sz-16 qt-mr-8 qt-fs-0"
        ></div>
        <div
            *ngIf="password.template.name === 'HOSTING' && password.isDefaultType()"
            class="qt-icon icon__hosting qt-za-16 qt-sz-16 qt-mr-8 qt-fs-0"
        ></div>
        <div
            *ngIf="!password.isDefaultType()"
            class="qt-icon icon__custom-category qt-za-16 qt-sz-16 qt-mr-8 qt-fs-0"
        ></div>
         <app-dynamic-tooltip
            [content]="password.username"
            [position]="'top'"
            #restoreTooltip
        ></app-dynamic-tooltip>
        <div
            class="ticket-detail-passwords__item-subtitle ellipsis"
            (mouseenter)="password.username.length > 20 ? restoreTooltip.show($event.target) : null"
            (mouseleave)="password.username.length > 20 ? restoreTooltip.hide() : null"
            [textContent]="password.username"
            *ngIf="!toggleBodyPassword"
        ></div>
        <div
            class="qt-button --square-sm --gray pointer qt-ml-auto qt-mr-25 qt-fs-0"
            (click)="copy(password.username)"
            placement="top"
            container="body"
            ngbTooltip="Copy"
            *ngIf="!toggleBodyPassword"
        >
            <div class="qt-icon icon__copy qt-bg-contain qt-sz-16 pointer"></div>
        </div>
    </div>
    <div
        class="ticket-detail-passwords__item-body qt-mt-8"
        *ngIf="toggleBodyPassword"
    >
        <div class="qt-df qt-ai-c qt-jc-sb ticket-detail-passwords__item-body-row">
            <div class="ellipsis">
                <div class="ticket-detail-passwords__item-body-title qt-mb-4">User Name</div>
                <div
                    class="ticket-detail-passwords__item-body-name ellipsis"
                    (mouseenter)="password.username.length > 20 ? restoreTooltip.show($event.target) : null"
                    (mouseleave)="password.username.length > 20 ? restoreTooltip.hide() : null"
                    [textContent]="password.username"
                ></div>
            </div>
            <div
                class="qt-button --square-sm --gray pointer"
                (click)="copy(password.username)"
                placement="top"
                container="body"
                ngbTooltip="Copy"
            >
                <div class="qt-icon icon__copy qt-bg-contain qt-sz-16 pointer qt-fs-0"></div>
            </div>
        </div>
        <div class="qt-df qt-ai-c qt-jc-sb ticket-detail-passwords__item-body-row">
            <div>
                <div class="ticket-detail-passwords__item-body-title qt-mb-4">Password</div>
                <div
                    class="ticket-detail-passwords__item-body-password"
                    *ngIf="togglePassword"
                    [textContent]="password.password"
                ></div>
                <div
                    *ngIf="!togglePassword"
                    class="active ticket-detail-passwords__item-body-password"
                >
                    •••••
                </div>
            </div>
            <div class="qt-df qt-ai-c">
                <div
                    *ngIf="!togglePassword && getPermissions('VIEW_PASSWORD')"
                    class="qt-button --square-sm --gray pointer"
                    (click)="showPassword()"
                    placement="top"
                    container="body"
                    ngbTooltip="Show"
                >
                    <div class="qt-icon icon__show qt-bg-contain qt-sz-16 pointer"></div>
                </div>
                <div
                    *ngIf="togglePassword"
                    class="qt-button --square-sm qt-button-square__prepend --gray pointer"
                    (click)="togglePassword = false"
                    placement="top"
                    container="body"
                    ngbTooltip="Hide"
                >
                    <div class="qt-icon icon__hide qt-sz-16 pointer"></div>
                </div>
                <div
                    class="qt-button --square-sm qt-button-square__afterpend --gray pointer"
                    (click)="copyPassword(password.password)"
                    placement="top"
                    container="body"
                    ngbTooltip="Copy"
                >
                    <div class="qt-icon icon__copy qt-bg-contain qt-sz-16 pointer"></div>
                </div>
            </div>
        </div>
        <div
            class="qt-df qt-ai-c qt-jc-sb ticket-detail-passwords__item-body-row"
            *ngIf="password.otpEnable && !password.resetAuthenticationKey"
        >
            <div class="qt-w100 qt-mr-12">
                <div class="ticket-detail-passwords__item-body-title qt-mb-4">One-time password</div>
                <div
                    class="secret-code-progress-container"
                    *ngIf="showSecretCode && isGetSecretCode"
                >
                    <app-upload-area-progress
                        class="qt-mb-8"
                        [progress]="getCodeProgress()"
                        [color]="'#2ec866'"
                    ></app-upload-area-progress>
                    <div
                        class="ticket-detail-passwords__item-body-name qt-mt-4 qt-w100 secret-code-txt"
                        [textContent]="password.otp"
                    ></div>
                </div>
                <div
                    *ngIf="!(showSecretCode && isGetSecretCode)"
                    class="active ticket-detail-passwords__item-body-password"
                >
                    •••••
                </div>
            </div>
            <div class="qt-df qt-ai-c">
                <div
                    class="qt-button --square-sm --gray pointer"
                    (click)="toggleSecretCode()"
                    *ngIf="!showSecretCode"
                    placement="top"
                    container="body"
                    ngbTooltip="Show"
                >
                    <div class="qt-icon icon__show qt-bg-contain qt-sz-16 pointer"></div>
                </div>
                <div
                    *ngIf="showSecretCode"
                    class="qt-button --square-sm qt-button-square__prepend --gray pointer"
                    (click)="toggleSecretCode()"
                    placement="top"
                    container="body"
                    ngbTooltip="Hide"
                >
                    <div class="qt-icon icon__hide qt-sz-16 pointer"></div>
                </div>
                <div
                    *ngIf="showSecretCode"
                    class="qt-button --square-sm qt-button-square__afterpend --gray pointer"
                    (click)="copy(password.otp)"
                    placement="top"
                    container="body"
                    ngbTooltip="Copy"
                >
                    <div class="qt-icon icon__copy qt-bg-contain qt-sz-16 pointer"></div>
                </div>
            </div>
        </div>
    </div>
</div>
