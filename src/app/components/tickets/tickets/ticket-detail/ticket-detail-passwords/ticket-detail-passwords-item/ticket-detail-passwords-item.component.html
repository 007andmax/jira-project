<div class="ticket-detail-passwords__item">
    <div class="qt-df qt-ai-c qt-jc-sb ticket-detail-passwords__header">
        <div
            class="ticket-detail-passwords__title qt-mb-8"
            [textContent]="password.description"
        ></div>
        <i
            class="icn-sm report-caret-icon pointer"
            [ngClass]="{'report-caret-icon-rotate' : toggleBodyPassword}"
            (click)="toggleBodyPassword = !toggleBodyPassword"
        ></i>
    </div>
    <div class="qt-df qt-ai-c">
        <div
            *ngIf="password.template.name === 'OFFICE_365_ACCOUNT' && password.isDefaultType()"
            class="icon__office-account qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
        ></div>
        <div
            *ngIf="password.template.name === 'GENERIC' && password.isDefaultType()"
            class="icon__globe qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
        ></div>
        <div
            *ngIf="password.template.name === 'LOCAL_USER_ACCOUNT' && password.isDefaultType()"
            class="icon__user-account qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
        ></div>
        <div
            *ngIf="password.template.name === 'EMAIL_ACCOUNT' && password.isDefaultType()"
            class="icon__email qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
        ></div>
        <div
            *ngIf="password.template.name === 'WIFI_NETWORK' && password.isDefaultType()"
            class="icon__wifi qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
        ></div>
        <div
            *ngIf="password.template.name === 'AGENT' && password.isDefaultType()"
            class="icon__agent qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
        ></div>
        <div
            *ngIf="password.template.name === 'DEVICE' && password.isDefaultType()"
            class="icon__devices-grey qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
        ></div>
        <div
            *ngIf="password.template.name === 'MICROSOFT_ACCOUNT' && password.isDefaultType()"
            class="icon__microsoft qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
        ></div>
        <div
            *ngIf="password.template.name === 'HOSTING' && password.isDefaultType()"
            class="icon__hosting qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
        ></div>
        <div
            *ngIf="!password.isDefaultType()"
            class="icon__custom-category qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
        ></div>
        <div
            class="ticket-detail-passwords__subtitle"
            [textContent]="password.template.title"
        ></div>
    </div>
    <div *ngIf="toggleBodyPassword">
        <div class="qt-df qt-ai-c qt-jc-sb">
            <div>
                <div>User Name</div>
                <span [textContent]="password.username"></span>
            </div>
            <div
                class="qt-button --square-md --gray pointer qt-mr-8"
                (click)="copy(password.username)"
                placement="top"
                container="body"
                ngbTooltip="Copy"
            >
                <div class="icon__copy qt-bg-contain qt-sz-16 pointer"></div>
            </div>
        </div>
        <div class="qt-df qt-ai-c qt-jc-sb">
            <div>
                <div>Password</div>
                <span
                    *ngIf="togglePassword"
                    [textContent]="password.password"
                ></span>
                <span
                    *ngIf="!togglePassword"
                    class="active"
                >
                    •••••
                </span>
            </div>
            <div class="qt-df qt-ai-c">
                <div
                    *ngIf="!togglePassword && getPermissions('VIEW_PASSWORD')"
                    class="qt-button --square-md --gray pointer qt-mr-8"
                    (click)="showPassword()"
                    placement="top"
                    container="body"
                    ngbTooltip="Copy"
                >
                    <div class="icon__view qt-bg-contain qt-sz-16 pointer"></div>
                </div>
                <div
                    *ngIf="togglePassword"
                    class="qt-button --square-md --gray pointer qt-mr-8"
                    (click)="togglePassword = false"
                    placement="top"
                    container="body"
                    ngbTooltip="Copy"
                >
                    <div class="icon__hide qt-bg-contain qt-sz-16 pointer"></div>
                </div>
                <div
                    *ngIf="togglePassword"
                    class="qt-button --square-md --gray pointer qt-mr-8"
                    (click)="copy(password.password)"
                    placement="top"
                    container="body"
                    ngbTooltip="Copy"
                >
                    <div class="icon__copy qt-bg-contain qt-sz-16 pointer"></div>
                </div>
            </div>
        </div>
        <div
            class="qt-df qt-ai-c qt-jc-sb"
            *ngIf="password.otpEnable && !password.resetAuthenticationKey"
        >
            <div>
                <div>One-time password</div>
                <div
                    class="secret-code-progress-container"
                    *ngIf="showSecretCode && isGetSecretCode"
                >
                    <app-upload-area-progress
                        class="qt-mb-8"
                        [progress]="getCodeProgress()"
                        [color]="'#2ec866'"
                    ></app-upload-area-progress>
                    <span
                        class="qt-w100 secret-code-txt"
                        [textContent]="password.otp"
                    ></span>
                </div>
                <span
                    *ngIf="!(showSecretCode && isGetSecretCode)"
                    class="active"
                >
                    •••••
                </span>
            </div>
            <div class="qt-df qt-ai-c">
                <div
                    class="qt-button --square-md --gray pointer qt-mr-8"
                    (click)="toggleSecretCode()"
                    *ngIf="!showSecretCode"
                    placement="top"
                    container="body"
                    ngbTooltip="Copy"
                >
                    <div class="icon__view qt-bg-contain qt-sz-16 pointer"></div>
                </div>
                <div
                    *ngIf="showSecretCode"
                    class="qt-button --square-md --gray pointer qt-mr-8"
                    (click)="toggleSecretCode()"
                    placement="top"
                    container="body"
                    ngbTooltip="Copy"
                >
                    <div class="icon__hide qt-bg-contain qt-sz-16 pointer"></div>
                </div>
                <div
                    *ngIf="showSecretCode"
                    class="qt-button --square-md --gray pointer qt-mr-8"
                    (click)="copy(password.otp)"
                    placement="top"
                    container="body"
                    ngbTooltip="Copy"
                >
                    <div class="icon__copy qt-bg-contain qt-sz-16 pointer"></div>
                </div>
            </div>
        </div>
    </div>
</div>
