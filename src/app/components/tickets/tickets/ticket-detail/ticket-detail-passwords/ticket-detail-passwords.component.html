<div class="ticket-detail-passwords qt-mb-8">
    <div
        class="ticket-detail-passwords__header qt-pos-rel pointer"
        (click)="toggleContainer = !toggleContainer"
    >
        <div class="ticket-detail-passwords__title">Passwords</div>
        <i class="icn-sm report-caret-icon pointer"></i>
    </div>
    <div class="ticket-detail-passwords__body">
        <ng-template
            ngFor
            let-password
            [ngForOf]="passwords"
            [ngForTrackBy]="trackByIndex"
        >
            <div class="ticket-detail-passwords__item">
                <div class="qt-df qt-ai-c qt-jc-sb">
                    <div
                        class="ticket-detail-passwords__title qt-mb-8"
                        [textContent]="password.description"
                    ></div>
                    <i class="icn-sm report-caret-icon pointer"></i>
                </div>
                <div class="qt-df qt-ai-c">
                    <div
                        *ngIf="password.template.name === 'OFFICE_365_ACCOUNT' && password.isDefaultType()"
                        class="icon__office-account qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
                    ></div>
                    <div
                        *ngIf="password.template.name === 'GENERIC' && password.isDefaultType()"
                        class="icon__globe qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
                    ></div>
                    <div
                        *ngIf="password.template.name === 'LOCAL_USER_ACCOUNT' && password.isDefaultType()"
                        class="icon__user-account qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
                    ></div>
                    <div
                        *ngIf="password.template.name === 'EMAIL_ACCOUNT' && password.isDefaultType()"
                        class="icon__email qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
                    ></div>
                    <div
                        *ngIf="password.template.name === 'WIFI_NETWORK' && password.isDefaultType()"
                        class="icon__wifi qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
                    ></div>
                    <div
                        *ngIf="password.template.name === 'AGENT' && password.isDefaultType()"
                        class="icon__agent qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
                    ></div>
                    <div
                        *ngIf="password.template.name === 'DEVICE' && password.isDefaultType()"
                        class="icon__devices-grey qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
                    ></div>
                    <div
                        *ngIf="password.template.name === 'MICROSOFT_ACCOUNT' && password.isDefaultType()"
                        class="icon__microsoft qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
                    ></div>
                    <div
                        *ngIf="password.template.name === 'HOSTING' && password.isDefaultType()"
                        class="icon__hosting qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
                    ></div>
                    <div
                        *ngIf="!password.isDefaultType()"
                        class="icon__custom-category qt-za-16 qt-sz-16 qt-bg-contain qt-mr-8"
                    ></div>
                    <div
                        class="ticket-detail-passwords__subtitle"
                        [textContent]="password.template.title"
                    ></div>
                </div>
                <div
                    class="ticket-detail-passwords__view pointer"
                    (click)="viewDocument(document)"
                >
                    View
                </div>
            </div>
        </ng-template>
        <div
            class="qt-df qt-ai-c qt-jc-c"
            *ngIf="toggleContainer && passwords.length === 0"
        >
            <span>No associated documents</span>
        </div>
        <button
            *ngIf="toggleContainer && passwords.length > 0"
            class="qt-button --gray --sm qt-w100 qt-jc-c"
            (click)="showMore()"
        >
            View All
        </button>
    </div>
</div>
