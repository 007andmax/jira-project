<div class="qt-input-block">
    <span class="qt-input-block__label">
        Company
        <app-dynamic-tooltip
            class="user-companies-tooltip"
            [content]="getTextForTooltip()"
            [position]="'bottom'"
            #userCompanyTooltip
        ></app-dynamic-tooltip>
        <i
            *ngIf="ticketProfile.ticketSource === 'FROM_EMAIL' && !checkExistServicesProducts() && getCompany(ticketProfile.company.id)"
            class="qt-icon icon__help default-services-page__question-icon qt-sz-12 qt-ic-c"
            (mouseenter)="userCompanyTooltip.show($event.target)"
            (mouseleave)="userCompanyTooltip.hide()"
        ></i>
    </span>
    <app-drop-down
        *ngIf="ticketProfile.ticketSource === 'FROM_EMAIL' && !checkExistServicesProducts() && getCompany(ticketProfile.company.id) && !getCompany(ticketProfile.company.id).isUnknown"
        [class]="['qt-dropdown']"
        [heightInput]="'32px'"
        [field]="'name'"
        [isBlockClear]="true"
        [editItem]="selectedCompany"
        [list]="listCompanies"
        [sort]="true"
        (onSelectedItem)="onSelectCompany($event)"
        [isDisabled]="!ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
    ></app-drop-down>
    <company-drop-down
        *ngIf="ticketProfile.ticketSource === 'FROM_EMAIL' && !checkExistServicesProducts() && getCompany(ticketProfile.company.id) && getCompany(ticketProfile.company.id).isUnknown || !(ticketProfile.ticketSource === 'FROM_EMAIL' && !checkExistServicesProducts() && getCompany(ticketProfile.company.id) && !getCompany(ticketProfile.company.id).isUnknown)"
        [class]="['qt-dropdown']"
        [heightInput]="'32px'"
        [placeholder]="'Select Company'"
        [clientType]="'CLIENT'"
        [field]="'name'"
        [search]="true"
        [change]="true"
        [editItem]="selectedCompany"
        [isBlockClear]="true"
        [isDisabled]="!(ticketProfile.ticketSource === 'FROM_EMAIL' && !checkExistServicesProducts() && getCompany(ticketProfile.company.id) && getCompany(ticketProfile.company.id).isUnknown)"
        (onSelectedItem)="onSelectCompany($event)"
    ></company-drop-down>
</div>
