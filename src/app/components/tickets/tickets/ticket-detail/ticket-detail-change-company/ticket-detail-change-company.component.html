<div class="qt-input-block">
    <company-drop-down
        #companyDP
        [title]="'Company'"
        [class]="['qt-dropdown']"
        [heightInput]="'32px'"
        [placeholder]="'Select Company'"
        [clientType]="'CLIENT'"
        [field]="'name'"
        [search]="true"
        [change]="true"
        [editItem]="selectedCompany"
        (onSelectedItem)="onSelectCompany($event)"
    ></company-drop-down>
</div>
