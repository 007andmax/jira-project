<div
    class="qt-input-block"
    ngbDropdown
    #tagsDp="ngbDropdown"
    (openChange)="onChangeDropDown($event)"
    autoClose="outside"
    container="body"
>
    <div class="qt-df qt-ai-c qt-jc-sb qt-mb-16">
        <span class="qt-input-block__label">Tags</span>
        <div
            class="qt-button qt-button--with-icon --sm --gray qt-jc-c pointer qt-ml-12 button-gl-number__add"
            ngbDropdownToggle
            *ngIf="!customerPortalStateService.isCustomerPortal && ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
        >
            <span class="icon__add--grey-500 qt-sz-16 qt-bg-contain qt-dib qt-mr-4 qt-button-icon"></span>
            Add
        </div>
    </div>
    <div class="light-dropdown ticket-edit-tags">
        <app-mat-form-field ngbDropdownAnchor>
            <app-mat-chip-list
                #chipList
                aria-label="Fruit selection"
            >
                <span class="tag-icon"></span>
                <app-mat-chip
                    class="selected-tag-ticket"
                    *ngFor="let tag of selectedTag; let i = index"
                    [selectable]="selectable"
                    [isRemove]="removable && !customerPortalStateService.isCustomerPortal && ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
                    (onClose)="remove(i)"
                >
                    {{tag.word}}
                </app-mat-chip>
                <input
                    id="dropdownServices"
                    ngbDropdownToggle
                    #userInput
                    placeholder="Type characters and hit tab"
                    class="pointer"
                    autocomplete="new-password"
                    [formControl]="tagCtrl"
                    [matChipInputFor]="chipList"
                    [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                    [matChipInputAddOnBlur]="addOnBlur"
                    (input)="onSearch($event)"
                    (keyup)="onKeyUp($event)"
                    *ngIf="!customerPortalStateService.isCustomerPortal && ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
                >
            </app-mat-chip-list>
        </app-mat-form-field>
        <div
            class="dropdown-menu ticket-detail-tag__dropdown-menu"
            ngbDropdownMenu
            aria-labelledby="dropdownServices"
        >
            <div class="qt-input-search">
                <input
                    id="search-dropdown"
                    placeholder="Search Tags"
                    class="pointer"
                    autocomplete="new-password"
                    (input)="onSearch($event)"
                >
            </div>
            <div class="ticket-tags-container">
                <ng-template
                    ngFor
                    let-tag
                    [ngForOf]="tags"
                    [ngForTrackBy]="trackById"
                >
                    <button
                        class="dropdown-item"
                        (click)="selected(tag)"
                        [textContent]="tag.word"
                        [ngClass]="{'--selected':isSelected(tag.id)}"
                    >
                    </button>
                </ng-template>
            </div>
        </div>
    </div>
</div>
