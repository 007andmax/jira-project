<div class="light-dropdown ticket-edit-tags"
     ngbDropdown #products="ngbDropdown" (openChange)="onChangeDropDown($event)">
  <mat-form-field>
    <mat-chip-list #chipList aria-label="Fruit selection">
      <span class="tag-icon"></span>
      <mat-chip
        class="selected-tag-ticket"
        *ngFor="let tag of selectedTag; let i = index"
        [selectable]="selectable"
        [removable]="removable"
        (removed)="remove(i)">
        {{tag.word}}
        <mat-icon matChipRemove *ngIf="removable">cancel</mat-icon>
      </mat-chip>
      <input
        id="dropdownServices" ngbDropdownToggle
        #userInput
        placeholder="Select Tag"
        class="pointer"
        [formControl]="tagCtrl"
        [matChipInputFor]="chipList"
        [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
        [matChipInputAddOnBlur]="addOnBlur"
        (input)="onSearch($event)"
        (keyup)="onKeyUp($event)"
         >
    </mat-chip-list>

  </mat-form-field>
  <div class="dropdown-menu"
       ngbDropdownMenu aria-labelledby="dropdownServices" >
 <ng-template ngFor let-tag [ngForOf]="tags" [ngForTrackBy]="trackById">
      <button ngbDropdownItem class="dropdown-item"
              (click)="selected(tag)"
              [textContent]="tag.word">
      </button>
    </ng-template>
  </div>
</div>
