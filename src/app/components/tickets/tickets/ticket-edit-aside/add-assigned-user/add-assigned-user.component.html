<div class="ticket-edit-user-tags">
    <span *ngIf="type == 'DETAIL-TICKET'">Notify to All:</span>
    <mat-form-field
        ngbDropdown
        [autoClose]="'outside'"
        [placement]="placement"
        #assignedUserDp="ngbDropdown"
        [container]="container"
        (openChange)="onCloseDropDown($event)"
    >
        <mat-chip-list
            #chipList
            aria-label="Fruit selection"
            ngbDropdownAnchor
        >
            <mat-chip
                class="selected-tag-user"
                *ngFor="let user of selectedUsers; let i = index"
                [selectable]="selectable"
                [removable]="removable"
                (removed)="remove(i)"
            >
                <div class="assigne-user-item">
                    <div
                        class="assigne-user-avatar"
                        [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                        [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                    ></div>
                    <div [textContent]="getUserName(user)"></div>
                    <mat-icon
                        matChipRemove
                        *ngIf="removable"
                    >
                        cancel
                    </mat-icon>
                </div>
            </mat-chip>
            <input
                *ngIf="type != 'DETAIL_TICKET_ASSIGNED_USER'"
                #userInput
                class="pointer"
                [formControl]="userCtrl"
                [matChipInputFor]="chipList"
                [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                (input)="onSearchUser($event)"
                id="dropdown"
                ngbDropdownToggle
            >
        </mat-chip-list>
        <span
            class="placeholder-detail-ticket"
            *ngIf="type == 'DETAIL_TICKET_ASSIGNED_USER' && selectedUsers.length == 0"
        >
            Select user to assign
        </span>
        <div
            class="autocomplete-user-tags"
            ngbDropdownMenu
            aria-labelledby="dropdown"
        >
            <div
                class="qt-input-search"
                *ngIf="type == 'DETAIL_TICKET_ASSIGNED_USER'"
            >
                <input
                    #userInput
                    id="search-user"
                    class="pointer"
                    [formControl]="userCtrl"
                    [matChipInputFor]="chipList"
                    [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                    (input)="onSearchUser($event)"
                    placeholder="Search Users"
                >
            </div>
            <div class="autocomplete-container">
                <mat-option
                    class="qt-ai-c"
                    *ngFor="let user of users"
                    [value]="user"
                    (click)="selected(user)"
                >
                    <ng-template
                        ngFor
                        let-customerCompany
                        [ngForOf]="user.customerCompaniesInfo"
                        let-i="index"
                    >
                        <div
                            ngbDropdownItem
                            (click)="onSelectUser(user,customerCompany)"
                            [ngClass]="{'--selected':isSelectedUser(user,customerCompany)}"
                            class="qt-df user-container pointer"
                            *ngIf="!user.searchByCompany || user.searchByCompany && user.searchByCompany.companyId == customerCompany.companyId"
                        >
                            <div
                                class="assigne-user-avatar qt-mr-12"
                                [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                                [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                            ></div>
                            <div>
                                <div
                                    class="user-name"
                                    [textContent]="getUserName(user)"
                                ></div>
                                <div
                                    class="user-description"
                                    [textContent]="customerCompany.clientCompanyName"
                                ></div>
                            </div>
                            <i
                                class="icon__assign-user-check qt-za-20 qt-sz-20 qt-bg-contain qt-ml-auto"
                                *ngIf="isSelectedUser(user,customerCompany)"
                            ></i>
                        </div>
                    </ng-template>




                    <div
                        class="assigne-user-item"
                        *ngIf="false"
                    >
                        <div
                            class="assigne-user-avatar"
                            [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                            [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                        ></div>
                        <div
                            class="assigne-user-name"
                            [textContent]="getUserName(user)"
                        ></div>
                        <span
                            class="assigne-user-email"
                            [textContent]="user.primaryEmail"
                        ></span>
                        <i
                            *ngIf="isSelected(user)"
                            class="icon__assign-user-check qt-za-20 qt-sz-20 qt-bg-contain qt-ml-auto"
                        ></i>
                    </div>
                </mat-option>
            </div>
        </div>
    </mat-form-field>
</div>
