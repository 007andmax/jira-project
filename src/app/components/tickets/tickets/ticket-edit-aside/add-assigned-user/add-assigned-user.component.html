<div class="ticket-edit-user-tags">
    <span *ngIf="type == 'DETAIL-TICKET'">Notify to All:</span>
    <mat-form-field
        ngbDropdown
        [autoClose]="'outside'"
        [placement]="placement"
        #assignedUserDp="ngbDropdown"
        [container]="container"
    >
        <mat-chip-list
            #chipList
            aria-label="Fruit selection"
        >
            <mat-chip
                ngbDropdownAnchor
                class="selected-tag-user"
                *ngFor="let user of selectedUsers; let i = index"
                [selectable]="selectable"
                [removable]="removable"
                (removed)="remove(i)"
            >
                <div class="assigne-user-item">
                    <div
                        class="assigne-user-avatar"
                        [textContent]="getAssignedUserNameForAvatar(user)"
                        [ngStyle]="{'background': getStyleAvatar(user),'background-size': 'cover'}"
                    ></div>
                    <div [textContent]="getUserName(user)"></div>
                    <mat-icon
                        matChipRemove
                        *ngIf="removable"
                    >
                        cancel
                    </mat-icon>
                </div>
            </mat-chip>
            <input
                *ngIf="type != 'DETAIL_TICKET_ASSIGNED_USER'"
                #userInput
                class="pointer"
                [formControl]="userCtrl"
                [matChipInputFor]="chipList"
                [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                (input)="onSearchUser($event)"
                id="dropdown"
                ngbDropdownToggle
            >
        </mat-chip-list>
        <div
            class="autocomplete-user-tags"
            ngbDropdownMenu
            aria-labelledby="dropdown"
        >
            <div
                class="qt-input-search"
                *ngIf="type == 'DETAIL_TICKET_ASSIGNED_USER'"
            >
                <input
                    #userInput
                    class="pointer"
                    [formControl]="userCtrl"
                    [matChipInputFor]="chipList"
                    [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                    (input)="onSearchUser($event)"
                >
            </div>
            <div class="autocomplete-container">
                <mat-option
                    class="qt-ai-c"
                    *ngFor="let user of users"
                    [value]="user"
                    (click)="selected(user)"
                >
                    <div class="assigne-user-item">
                        <div
                            class="assigne-user-avatar"
                            [textContent]="getAssignedUserNameForAvatar(user)"
                            [ngStyle]="{'background': getStyleAvatar(user),'background-size': 'cover'}"
                        ></div>
                        <div
                            class="assigne-user-name"
                            [textContent]="getUserName(user)"
                        ></div>
                        <span
                            class="assigne-user-email"
                            [textContent]="user.primaryEmail"
                        ></span>
                        <i
                            *ngIf="isSelected(user)"
                            class="icon__assign-user-check qt-za-20 qt-sz-20 qt-bg-contain qt-ml-auto"
                        ></i>
                    </div>
                </mat-option>
            </div>
        </div>
    </mat-form-field>
</div>
