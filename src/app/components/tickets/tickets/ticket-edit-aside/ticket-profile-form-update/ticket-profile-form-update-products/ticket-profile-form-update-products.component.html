<div class="cps-block__products-block">
    <ng-template
        class="assigned-ticket-user"
        ngFor
        let-product
        [ngForOf]="addedProductList"
        let-i="index"
        [ngForTrackBy]="trackByIndex"
    >
        <div class="product-item">
            <div class="product-item__first-line d-f">
                <app-product-list
                    [type]="'TICKET'"
                    [editItem]="product.item"
                    class="product-item__prodect-list"
                    (selectedProductItem)="onChangeProduct($event,i)"
                ></app-product-list>
                <button
                    class="product-item__btn-del "
                    (click)="removeProduct(i)"
                >
                    <span class="icon__close btn-icon"></span>
                </button>
            </div>
            <div class="d-f">
                <label class="product-item__serial-num-input">
                    <input
                        class="product-item__input serial-num"
                        type="text"
                        [(ngModel)]="product.serialNumber"
                    >
                </label>
                <label class="product-item__cost-input">
                    <input
                        class="product-item__input cost"
                        type="text"
                        number
                        [money]="true"
                        [ngModel]="product.item.cost"
                        appToFixed
                        (blur)="onValidateSaleCostProduct(i)"
                        (ngModelChange)="onChangeCostProduct($event, i)"
                    >
                </label>
                <label class="product-item__qty-input">
                    <input
                        class="product-item__input qty"
                        [(ngModel)]="product.item.quantity"
                        type="text"
                    >
                </label>
                <label class="product-item__price-input">
                    <input
                        class="product-item__input price"
                        type="text"
                        [(ngModel)]="product.item.sale"
                        [ngClass]="{'--input-error':!product.valdiateSaleCost}"
                        number
                        [money]="true"
                        [ngModel]="product.item.sale"
                        (blur)="onValidateSaleCostProduct(i)"
                        appToFixed
                        (ngModelChange)="onChangeSaleProduct($event, i)"
                    >
                    <mat-error
                        class="qt-tooltip-error"
                        *ngIf="!product.valdiateSaleCost"
                    >
                        Product price can not be lower than cost
                    </mat-error>
                </label>
                <label class="product-item__discount-input">
                    <input
                        class="product-item__input"
                        [(ngModel)]="product.discountAmount"
                        type="text"
                    >
                </label>
            </div>
        </div>
    </ng-template>
    <div class="product-item">
        <div class="product-item__first-line d-f">
            <app-product-list
                [type]="'TICKET'"
                #productDP
                class="product-item__prodect-list"
                (selectedProductItem)="selectProduct($event)"
            ></app-product-list>
            <button
                class="product-item__btn-add"
                (click)="addProduct()"
            >
                <span class="icon__plus-white btn-icon"></span>
            </button>
        </div>
        <div class="d-f">
            <label class="product-item__serial-num-input">
                <input
                    class="product-item__input serial-num"
                    [(ngModel)]="currentProduct.serialNumber"
                    type="text"
                >
            </label>
            <label class="product-item__cost-input">
                <input
                    class="product-item__input cost"
                    number
                    [money]="true"
                    [ngModel]="currentProduct.item.cost"
                    (blur)="onValidateSaleCost()"
                    appToFixed
                    (ngModelChange)="onChangeCost($event)"
                >
            </label>
            <label class="product-item__qty-input">
                <input
                    class="product-item__input qty"
                    [(ngModel)]="currentProduct.quantity"
                >
            </label>
            <label class="product-item__price-input">
                <input
                    class="product-item__input price"
                    [ngClass]="{'--input-error':!currentProduct.valdiateSaleCost}"
                    number
                    [money]="true"
                    [ngModel]="currentProduct.item.sale"
                    (blur)="onValidateSaleCost()"
                    appToFixed
                    (ngModelChange)="onChangeSale($event)"
                >
                <mat-error
                    class="qt-tooltip-error"
                    *ngIf="!currentProduct.valdiateSaleCost"
                >
                    Product price can not be lower than cost
                </mat-error>
            </label>
            <label class="product-item__discount-input">
                <input
                    class="product-item__input discount"
                    [(ngModel)]="currentProduct.discountAmount"
                    type="text"
                >
            </label>
        </div>
    </div>
    <!-- Mobile -->
    <div class="qt-aside-modern__footer">
        <div class="qt-df">
            <button
                class="qt-button --gray"
                [ngClass]="{'--loading':isUpdate}"
                appDisabledBtn
                #addMoreMobileBtn="disabled"
                (onClick)="addMoreMobile()"
            >
                <span *ngIf="!isUpdate">Add More</span>
                <app-preloader-ticket *ngIf="isUpdate"></app-preloader-ticket>
            </button>
            <button
                class="qt-button"
                [ngClass]="{'--loading':isUpdate}"
                appDisabledBtn
                #updateMobileBtn="disabled"
                (onClick)="updateMobile()"
            >
                <span
                    class="ng-star-inserted"
                    *ngIf="!isUpdate"
                >
                    Save
                </span>
                <app-preloader-ticket *ngIf="isUpdate"></app-preloader-ticket>
            </button>
        </div>
    </div>
    <!-- End Mobile -->
</div>
