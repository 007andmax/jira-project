<div ngbDropdown>
    <div
        class="qt-modal-circle-button more-vertical-ng2"
        ngbDropdownToggle
    ></div>
    <div
        ngbDropdownMenu
        class="dropdown-menu-qt --left-side"
    >
        <ul
            class
            style="width: 205px; overflow: visible;"
            role="menu"
            class="dropdown-qt"
        >
            <li *ngIf="ticketsPermissionsService.isActionVisible('claim_ticket', ticketProfile,null,null)">
                <a
                    tabindex="-1"
                    href="javascript:void(0)"
                    (click)="claimTicket()"
                >
                    <i class="icn-16 icon__claim-edit-ticket"></i>
                    Claim Ticket
                </a>
            </li>
            <li
                class="dropdown-submenu left-align linked-agent-dropdown"
                (click)="showAgentLink()"
                *ngIf="ticketProfile.company && !ticketProfile.company.default && getDevicesByCompany() && isDeviceToLink()"
            >
                <a
                    tabindex="-1"
                    href="javascript:void(0)"
                    class="link-user"
                >
                    <i class="icn-16 icon__link-gray"></i>
                    {{ ticketProfile.agent && ticketProfile.agent.deviceId ? 'Relink with another' : 'Link with' }}
            Agent
                </a>
                <ul
                    class="dropdown-submenu-wrapper dropdown-menu"
                    *ngIf="!appService.checkMobile() && getDevicesByCompany().length > 0"
                >
                    <ng-template
                        ngFor
                        let-agent
                        [ngForOf]="getDevicesByCompany()"
                    >
                        <li
                            (click)="changeLinkedAgent(agent.id)"
                            *ngIf="!ticketProfile.agent || agent.id !== ticketProfile.agent.deviceId"
                        >
                            {{ agent.hostName || agent.ip }}
                        </li>
                    </ng-template>
                </ul>
            </li>
            <li *ngIf="ticketProfile.agent && ticketProfile.agent.deviceId">
                <a
                    tabindex="-1"
                    class="unlink-user"
                    href="javascript:void(0)"
                    (click)="changeLinkedAgent('')"
                >
                    <i class="icn-16 icon__unlink"></i>
                    Unlink Agent
                </a>
            </li>
            <li *ngIf="ticketsPermissionsService.isActionVisible('send_to_trash', ticketProfile,null,null)">
                <a
                    tabindex="-1"
                    class="trash-user"
                    href="javascript:void(0)"
                    (click)="moveToTrash(true)"
                >
                    <i class="icn-16 icon__remove"></i>
                    Move to Trash
                </a>
            </li>
            <li *ngIf="ticketsPermissionsService.isActionVisible('send_to_spam', ticketProfile,null,null)">
                <a
                    tabindex="-1"
                    class="spam-user"
                    href="javascript:void(0)"
                    *ngIf="currentUser && currentUser.isOwner"
                    (click)="moveIntoSpam()"
                >
                    <i class="icn-16 icon__disable"></i>
                    Mark as Spam
                </a>
                <a
                    tabindex="-1"
                    class="spam-user"
                    href="javascript:void(0)"
                    *ngIf="currentUser && !currentUser.isOwner"
                    (click)="moveIntoSpam()"
                >
                    <i class="icn-16 icon__disable"></i>
                    Report as Spam
                </a>
            </li>
        </ul>
    </div>
</div>
