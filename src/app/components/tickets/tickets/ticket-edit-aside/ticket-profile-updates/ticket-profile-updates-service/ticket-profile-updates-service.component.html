<div class="qt-df ticket-updates__update-block">
    <div
        class="ticket-updates__ticket-photo"
        [textContent]="ticketsListService.getAssignedUserNameForAvatar(update.user)"
        [ngStyle]="{'background': ticketsListService.getStyleAvatar(update.user)}"
    ></div>
    <div class="ticket-updates__content">
        <div class="ticket-updates__author-line qt-df jc-sb qt-ai-c ">
            <div>
                <span
                    class="ticket-updates__author"
                    [textContent]="ticketsListService.getUserName(update.user)"
                ></span>
                <span class="ticket-updates__add-note">&nbsp;added a service</span>
            </div>
            <app-dynamic-tooltip
                [content]="'Delete Update'"
                [position]="'top'"
                #deleteTooltip
            ></app-dynamic-tooltip>
            <div
                class="ticket-updates__delete icon__remove"
                *ngIf="!isBlockChange"
                (click)="remove()"
                (mouseenter)="deleteTooltip.show($event.target)"
                (mouseleave)="deleteTooltip.hide()"
            ></div>
        </div>
        <ng-template
            ngFor
            let-service
            [ngForOf]="update.services"
            let-i="index"
            [ngForTrackBy]="trackById"
        >
            <app-ticket-profile-updates-service-item
                [update]="update"
                [service]="service"
                [isBlockChange]="isBlockChange"
            ></app-ticket-profile-updates-service-item>
        </ng-template>
        <app-ticket-profile-updates-footer
            [date]="update.createdAt"
            [shares]="update.shares"
        ></app-ticket-profile-updates-footer>
    </div>
</div>
