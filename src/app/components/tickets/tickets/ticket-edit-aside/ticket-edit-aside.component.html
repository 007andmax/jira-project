<div
    class="ticket-edit-aside qt-aside d-f"
    [hidden]="!opened"
>
    <div
        class="collapse-arrow icon__close"
        (click)="close()"
    ></div>
    <div class="ticket-edit-aside__ticket-info">
        <div
            class="prelaoder-body"
            *ngIf="showPreloader"
        >
            <div class="loading"></div>
        </div>
        <div class="qt-aside__body ticket-edit-aside__body">
            <div class="ticket-edit-aside__header d-f jc-sb ai-c">
                <div class="ticket-edit-aside__header-client-info">
                    <div
                        class="ticket-edit-aside__header-avatar"
                        [textContent]="ticketsListService.getAssignedUserNameForAvatar(ticketProfile.createdUser)"
                        [ngStyle]="{'background': ticketsListService.getStyleAvatar(ticketProfile.createdUser)}"
                    ></div>
                    <div>
                        <div class="d-f ai-c">
                            <div
                                class="ticket-edit-aside__header-company"
                                ngbDropdown
                                (openChange)="onOpenCompaniesDropDown()"
                                placement="bottom-left"
                            >
                                <app-dynamic-tooltip
                                    class="user-companies-tooltip"
                                    [content]="'You must remove all Product/Services updates from the ticket before changing the company.'"
                                    [position]="'bottom'"
                                    #userCompanyTooltip
                                    [disableTooltip]="!checkExistServicesProducts()"
                                ></app-dynamic-tooltip>
                                <span
                                    [ngClass]="{'pointer': ticketProfile.ticketSource === 'FROM_EMAIL'}"
                                    [textContent]="getCompanyName()"
                                    id="dropdownCompany"
                                    ngbDropdownToggle
                                    (mouseenter)="userCompanyTooltip.show($event.target)"
                                    (mouseleave)="userCompanyTooltip.hide()"
                                ></span>
                                <span
                                    class="pointer"
                                    [textContent]="' - ' + getNameCreateUser()"
                                    (click)="showDetailUser()"
                                ></span>
                                <div
                                    *ngIf="ticketProfile.ticketSource === 'FROM_EMAIL' && !checkExistServicesProducts()"
                                    ngbDropdownMenu
                                    aria-labelledby="dropdownCompany"
                                >
                                    <div class="dropdown-menu-qt">
                                        <ul>
                                            <ng-template
                                                ngFor
                                                let-item
                                                [ngForOf]="ticketProfile.userCompanies"
                                                let-i="index"
                                            >
                                                <li
                                                    *ngIf="getCompany(item)"
                                                    ngbDropdownItem
                                                    [textContent]="getCompany(item).name"
                                                    (click)="changeTicketCompany(item)"
                                                ></li>
                                            </ng-template>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                            <app-ticket-change-status [ticketProfile]="ticketProfile"></app-ticket-change-status>
                        </div>
                        <div class="ticket-edit-aside__header-info">
                            <span [textContent]="parseTicketSource() + getAgentName()"></span>
                            <span class="divider-point"></span>
                            <span [textContent]="getCreatAt()"></span>
                        </div>
                    </div>
                </div>
                <div class="ticket-edit-aside__header-menu">
                    <div
                        class="ticket-edit-aside__more-users-title"
                        *ngIf="listAssignedUser.length > 3"
                        [textContent]="'+' + (listAssignedUser.length- 3) + ' more'"
                    >
                    </div>
                    <div class="more-users-avatars">
                        <ng-template
                            class="assigned-ticket-user"
                            ngFor
                            let-user
                            [ngForOf]="listAssignedUser"
                            let-i="index"
                            [ngForTrackBy]="trackByIndex"
                        >
                            <div
                                class="more-users-avatars__avatar"
                                *ngIf="i < 3"
                                [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                                [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                            ></div>
                        </ng-template>
                    </div>
                    <div
                        class="qt-modal-circle-button add-user toggle-select-user"
                        (click)="onToggleAddAssignedUser()"
                        placement="top"
                        ngbTooltip="Assign"
                    ></div>
                    <app-ticket-profile-actions
                        (onClaimTicket)="claimTicket()"
                        [ticketProfile]="ticketProfile"
                        placement="top"
                        ngbTooltip="Settings"
                    ></app-ticket-profile-actions>
                </div>
                <!-- Mobile -->
                <div
                  class="ticket-edit-aside__header-subject"
                  [hidden]="modeSubject === 'edit'"
                  (click)="toggleSubject()"
                >
                  <span [ngClass]="getClassType()"></span>
                  <span [textContent]="'Tkt# ' + ticketProfile.number"></span>
                  <span>-</span>
                  <span [textContent]="ticketProfile.subject"></span>
                </div>
                <!-- End mobile -->
            </div>
            <app-ticket-edit-tags
                [selectedTag]="ticketProfile.tags"
                (tagsChange)="onChangeTags($event)"
                [hidden]="showAddAssignedUser"
            ></app-ticket-edit-tags>
            <app-add-assigned-user
                [placement]="'bottom-left'"
                [userList]="getUsersForAssign()"
                [selectedUsers]="listAssignedUser"
                (onSelected)="onSelectAssignedUser($event)"
                (hidden)="onToggleAddAssignedUser()"
                *ngIf="showAddAssignedUser"
            ></app-add-assigned-user>
            <div class="ticket-edit-aside__ticket-text">
                <div
                    class="ticket-edit-aside__ticket-subject"
                    [hidden]="modeSubject === 'edit'"
                    (click)="toggleSubject()"
                >
                    <span [ngClass]="getClassType()"></span>
                    <span [textContent]="'Tkt# ' + ticketProfile.number"></span>
                    <span>-</span>
                    <span [textContent]="ticketProfile.subject"></span>
                </div>
                <div
                    class="ticket-edit-aside__ticket-subject-edit d-f ai-c"
                    [hidden]="modeSubject === 'view'"
                    appClickOtside
                    [init]="modeSubject === 'edit'"
                    [class]="'.ticket-edit-aside__ticket-text'"
                    (onOutSide)="toggleSubject()"
                >
                    <span [textContent]="'Tkt# ' + ticketProfile.number"></span>
                    <input
                        id="ticket-subject"
                        [value]="ticketProfile.subject"
                    >
                </div>
                <div
                    class="ticket-edit-aside__ticket-description-edit"
                    appClickOtside
                    [init]="modeDescription === 'edit'"
                    [class]="'.ticket-edit-aside__ticket-text'"
                    (onOutSide)="toggleNote()"
                >
                    <div
                        class="form-control editor"
                        (blur)="modeDescription = 'edit'"
                        contenteditable="true"
                        id="ticket-note"
                        placeholder="Enter description here"
                    ></div>
                </div>
            </div>
            <app-ticket-claim-info [ticketProfile]="ticketProfile"></app-ticket-claim-info>
            <app-ticket-message
                #ticketMessage
                (onMoveToTrash)="moveToTrash($event)"
                (onRestoreFromSpam)="restoreFromSpam()"
                (onOpenTicket)="markAsOpen()"
                (onClaimTicket)="claimTicket()"
                [ticketProfile]="ticketProfile"
            ></app-ticket-message>
            <app-ticket-profile-attachments [attachments]="ticketProfile.attachments"></app-ticket-profile-attachments>
            <app-ticket-profile-updates
                [hidden]="!ticketProfile.updates || ticketProfile.updates.length === 0"
                (onFetchUpdates)="onFetchUpdates($event)"
                [ticketProfile]="ticketProfile"
                [updates]="ticketProfile.updates"
            ></app-ticket-profile-updates>
            <app-ticket-profile-form-update
                [ngClass]="{'--open':openedMobileUpdate}"
                (onClosed)="close()"
                [hidden]="!ticketsPermissionsService.isActionVisible('update', ticketProfile,null,null)"
                #updateForm
                [ticket]="ticketProfile"
                [lisUpdateUser]="lisUpdateUser"
            ></app-ticket-profile-form-update>
        </div>
    </div>
    <app-ticket-edit-aside-right-panel
        #rightPanel
        [ticketProfile]="ticketProfile"
    ></app-ticket-edit-aside-right-panel>
    <!-- Mobile -->
    <div class="qt-aside-modern__footer updata-close">
      <button class="qt-button">
        <span>Update & Close</span></button>
    </div>
    <!-- End Mobile -->
</div>
