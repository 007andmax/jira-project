<div class="users-aside">
    <div
        class="users-aside__title"
        [textContent]="'Users (' + users.length + ')'"
    >
    </div>
    <div class="users-aside__search">
        <span class="qt-input-search users-aside__search-devices --dark">
            <input
                class="qt-input-search"
                placeholder="Search Users…"
                title="Search users"
                type="text"
                (input)="onSearch($event)"
            >
        </span>
    </div>
    <div class="users-aside__users-list">
        <ng-template
            ngFor
            let-user
            [ngForOf]="users"
            [ngForTrackBy]="trackById"
            let-i="index"
        >
            <div
                class="users-aside__user"
                [ngClass]="{'--online': user.online, '--away' : !user.online}"
                ngbDropdown
            >
                <div
                    [ngClass]="'users-aside__user-' + i"
                    class="d-f"
                >
                    <div
                        class="users-aside__user-avatar"
                        [ngClass]="{'--letter-avatar': ticketsListService.getAssignedUserNameForAvatar(user)}"
                        [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                        [ngStyle]="{'background': getStyleAvatar(user)}"
                    ></div>
                    <div>
                        <div
                            class="users-aside__user-name"
                            [textContent]="ticketsListService.getUserName(user)"
                        ></div>
                        <ng-template
                            ngFor
                            let-phoneNumber
                            [ngForOf]="user.phoneNumbers"
                            [ngForTrackBy]="trackById"
                        >
                            <preview-phone-mask
                                [class]="'users-aside__user-email'"
                                *ngIf="phoneNumber.number"
                                [number]="phoneNumber.number"
                            ></preview-phone-mask>
                        </ng-template>
                        <div
                            class="users-aside__user-email"
                            [textContent]="user.primaryEmail"
                        ></div>
                    </div>
                    <div
                        class="users-aside__user-menu"
                        id="dropdownForm1"
                        (click)="onOpenDropDown(input,bodyDropDown)"
                        #input
                    ></div>
                    <div
                        class="dropdown-menu-qt"
                        ngbDropdownMenu
                        aria-labelledby="dropdownForm1"
                        #bodyDropDown
                        appClickOtside
                        [init]="true"
                        [class]="'.users-aside__user-' + i"
                        (onOutSide)="hiddenDropDown(bodyDropDown)"
                    >
                        <ul>
                            <li (click)="sendEmail(user)">
                                <span class="dropdown-menu-qt__item-icon icon__email-dark"></span>
                                Email
                            </li>
                            <li (click)="showPrivilege = !showPrivilege">
                                <span class="dropdown-menu-qt__item-icon icon__set-privilege"></span>
                                Set {{ user.firstName }} role
                                <ul
                                    class="dropdown-menu-qt__submenu dropdown-menu set-role-user-dropdown"
                                    *ngIf="showPrivilege"
                                >
                                    <ng-template
                                        ngFor
                                        let-type
                                        [ngForOf]="userTypes"
                                        [ngForTrackBy]="trackById"
                                    >
                                        <li
                                            ngbDropdownItem
                                            (click)="changeUserRole(user,type.id)"
                                            [textContent]="type.name"
                                        >
                                        </li>
                                    </ng-template>
                                </ul>
                            </li>
                            <li (click)="showSubscription = !showSubscription">
                                <span class="dropdown-menu-qt__item-icon icon__subscribe"></span>
                                Subscribe {{ user.firstName }} to...
                                <ul
                                    *ngIf="showSubscription"
                                    class="dropdown-menu-qt__submenu dropdown-menu"
                                >
                                    <li>
                                      <label
                                        class="qt-checkbox"
                                        [attr.for]="'ticket-' + i"
                                        (click)="onChangeSubscriptions('ticketSubscription',user)"
                                      >
                                        <input
                                          [attr.id]="'ticket-' + i"
                                          [checked]="isSeletedSubscription(user,'ticketSubscription')"
                                          type="checkbox"
                                        >
                                        <span></span>
                                        <div class="qt-ml-8">Ticket Updates</div>
                                      </label>
                                    </li>
                                    <li>
                                      <label
                                        class="qt-checkbox pointer"
                                        [attr.for]="'invoice-' + i"
                                        (click)="onChangeSubscriptions('invoiceSubscription',user)"
                                      >
                                        <input
                                          [attr.id]="'invoice-' + i"
                                          [checked]="isSeletedSubscription(user,'invoiceSubscription')"
                                          type="checkbox"
                                        >
                                        <span></span>
                                        <div class="qt-ml-8">Invoice Updates</div>
                                      </label>
                                    </li>
                                    <li>
                                      <label
                                        class="qt-checkbox"
                                        [attr.for]="'ticketManager-' + i"
                                        (click)="onChangeSubscriptions('ticketManagerSubscription',user)"
                                      >
                                        <input
                                          [attr.id]="'ticketManager-' + i"
                                          [checked]="isSeletedSubscription(user,'ticketManagerSubscription')"
                                          type="checkbox"
                                        >
                                        <span></span>
                                        <div class="qt-ml-8">Ticket Manager</div>
                                      </label>
                                    </li>
                                </ul>
                            </li>
                            <li
                                ngbDropdownItem
                                (click)="archiveUser(user)"
                            >
                                <span class="dropdown-menu-qt__item-icon icon__archive"></span>
                                Archive
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </ng-template>
    </div>
</div>
