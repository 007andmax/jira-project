<div
    class="merge-ticket-item qt-df "
    (click)="selectPrimaryTicket()"
>
    <div class="qt-radio contract-type-select__radio">
        <input
            [attr.id]="'merge-ticket-' + item.id"
            type="radio"
            name="radio"
            value="1"
            [checked]="primaryTicket && primaryTicket.id === item.id"
        >
        <label [attr.for]="'merge-ticket-' + item.id"></label>
    </div>
    <div class="qt-w100">
        <div class="qt-df qt-ai-c qt-jc-sb qt-mb-4">
            <div class="qt-df qt-ai-c">
                <span class="number-ticket">Tkt# {{item.number}}</span>
                <span
                    class="tag__modern qt-ml-4"
                    *ngIf="primaryTicket && primaryTicket.id === item.id"
                >
                    Primary
                </span>
            </div>
            <div
                [ngClass]="{'--disabled-primary':primaryTicket && primaryTicket.id === item.id,
            'pointer' : primaryTicket && primaryTicket.id !== item.id}"
                class="qt-button --square-md  --gray merge-ticket-remove "
                (click)="remove($event)"
            >
                <i class="qt-icon icon__close qt-sz-16"></i>
            </div>
        </div>
        <div
            class="qt-mb-4 subject-ticket"
            [textContent]="item.subject"
        ></div>
        <div class="qt-df qt-ai-c create-ticket">
            <span
                class="date-ticket"
                [textContent]="getCreatAt()"
            ></span>
            <span
                class="qt-ml-12"
                [textContent]="getCompanyName()"
            ></span>
        </div>
    </div>
</div>
