<div class="merge-ticket-item">
    <div [ngClass]="{'qt-mb-12':editNote}">
        <div class="qt-df qt-ai-c qt-jc-sb qt-mb-6">
            <span class="number-ticket">Tkt# {{getTicket().number}}</span>
            <button
                *ngIf="!mergeTicket.isPrimary"
                class="qt-button --gray merge-ticket-edit-note qt-df"
                (click)="toggleEditNote()"
            >
                <span class="qt-icon icon__edit qt-sz-16 qt-bg-contain qt-dib qt-mr-4"></span>
                <span>Edit ticket</span>
            </button>
        </div>
        <div
            [hidden]="!mergeTicket.isPrimary && editNote"
            class="qt-mb-4 subject-ticket"
            [ngClass]="{'subject-ticket-not-primary':!mergeTicket.isPrimary}"
            [textContent]="mergeTicket.isPrimary ? getTicket().subject : mergeTicket.subject"
        ></div>
        <div class="qt-df qt-ai-c create-ticket">
            <span
                class="date-ticket"
                [textContent]="getCreatAt()"
            ></span>
            <span
                class="qt-ml-12 create-ticket__name"
                [textContent]="getCompanyName()"
            ></span>
        </div>
    </div>
    <div
        class="edit-note"
        *ngIf="editNote"
        ngbDropdown
        [container]="'body'"
    >
        <div
            class="qt-inputs-row qt-mb-4"
            *ngIf="!mergeTicket.isPrimary"
        >
            <div class="qt-input-block">
                <label
                    for="add-ticket-subject"
                    class="qt-input-block__label qt-pl-12"
                >
                    Subject
                </label>
                <input
                    class="qt-input-block__input"
                    [(ngModel)]="mergeTicket.subject"
                    (change)="onChangeSubject($event)"
                    type="text"
                    maxlength="300"
                    placeholder="Write Ticket Subject"
                >
            </div>
        </div>
        <div class="qt-input-block">
            <label
                for="add-ticket-subject"
                class="qt-input-block__label qt-pl-12"
            >
                Note
            </label>
            <textarea
                id="description-note"
                [value]="mergeTicket.note"
                (input)="onChangeNote($event)"
                class="terms-n-conditions__textarea qt-input-block__textarea"
                placeholder="Enter job description"
                appTextArea
                maxlength="500"
                [height]="'120px'"
            ></textarea>
        </div>
        <div class="qt-df qt-ai-c note-type">
            <div
                id="dropdownBasic1"
                ngbDropdownToggle
                class="qt-df qt-ai-c"
            >
                <div class="qt-icon icon__globe qt-sz-16  "></div>
                <div
                    class="qt-ml-8"
                    [textContent]="mergeTicket.noteType == 'PUBLIC' ? 'Visible to All Users' : 'Visible to Tech users only'"
                ></div>
                <i class="qt-icon icon__arrow-down qt-sz-20 qt-ml-4"></i>
            </div>
            <!-- <div class="qt-df">
                <button
                    class="qt-button --gray qt-mr-12 qt-w100 qt-jc-c"
                    (click)="closed()"
                >
                    Cancel
                </button>
                <button class="qt-button   qt-jc-c">Save</button>
            </div> -->
        </div>
        <ul
            class="qt-dropdown-menu"
            ngbDropdownMenu
            aria-labelledby="dropdownBasic1"
        >
            <li
                class="pointer"
                (click)="mergeTicket.setNoteType('PUBLIC')"
                ngbDropdownItem
            >
                Visible to All Users
            </li>
            <li
                class="pointer"
                (click)="mergeTicket.setNoteType('PRIVATE')"
                ngbDropdownItem
            >
                Visible to Tech users only
            </li>
        </ul>
    </div>
    <span
        *ngIf="getTicket().priorityLevel && getTicket().priorityLevel.isDisplay"
        class="priority-icon"
        [ngStyle]="{'background-color':  listColors[getTicket().priorityLevel.color] && listColors[getTicket().priorityLevel.color].textColor}"
    ></span>
</div>
