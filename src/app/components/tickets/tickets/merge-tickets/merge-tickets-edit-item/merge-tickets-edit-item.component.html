<div class="merge-ticket-item">
    <div>
        <div class="qt-df qt-ai-c qt-jc-sb qt-mb-6">
            <span class="number-ticket">Tkt# {{getTicket().number}}</span>
            <button
                *ngIf="!mergeTicket.isPrimary"
                class="qt-button --gray merge-ticket-edit-note qt-df"
                (click)="toggleEditNote()"
            >
                <span class="qt-icon icon__edit qt-sz-16 qt-bg-contain qt-dib qt-mr-4"></span>
                <span>Edit Note</span>
            </button>
        </div>
        <div
            class="qt-mb-4 subject-ticket"
            [textContent]="getTicket().subject"
        ></div>
        <div class="qt-df qt-ai-c create-ticket">
            <span
                class="date-ticket"
                [textContent]="getCreatAt()"
            ></span>
            <span
                class="qt-ml-12"
                [textContent]="getCompanyName()"
            ></span>
        </div>
    </div>
    <div
        class="edit-note"
        *ngIf="editNote"
        ngbDropdown
        [container]="'body'"
    >
        <textarea
            id="description-note"
            [value]="mergeTicket.note"
            (input)="onChangeNote($event)"
            class="terms-n-conditions__textarea qt-input-block__textarea"
            placeholder="Enter job description"
            appTextArea
            maxlength="500"
            [height]="'120px'"
        ></textarea>
        <div class="qt-df qt-ai-c note-type">
            <div
                id="dropdownBasic1"
                ngbDropdownToggle
                class="qt-df qt-ai-c"
            >
                <div class="qt-icon icon__globe qt-sz-16  "></div>
                <div
                    class="qt-ml-8"
                    [textContent]="mergeTicket.noteType == 'PUBLIC' ? 'Visible to All Users' : 'Visible to Tech users only'"
                ></div>
                <i class="qt-icon icon__arrow-down qt-sz-20 qt-ml-4"></i>
            </div>
            <!-- <div class="qt-df">
                <button
                    class="qt-button --gray qt-mr-12 qt-w100 qt-jc-c"
                    (click)="closed()"
                >
                    Cancel
                </button>
                <button class="qt-button   qt-jc-c">Save</button>
            </div> -->
        </div>
        <ul
            class="qt-dropdown-menu"
            ngbDropdownMenu
            aria-labelledby="dropdownBasic1"
        >
            <li
                class="pointer"
                (click)="mergeTicket.setNoteType('PUBLIC')"
                ngbDropdownItem
            >
                Visible to All Users
            </li>
            <li
                class="pointer"
                (click)="mergeTicket.setNoteType('PRIVATE')"
                ngbDropdownItem
            >
                Visible to Tech users only
            </li>
        </ul>
    </div>
</div>
