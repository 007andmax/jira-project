<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line">
        <div class="icon__menu-white qt-sz-24 qt-bg-contain qt-ml-6 pointer"></div>
        <div class="qt-page-list__header-title-line--left">
            <h6
                class="qt-page-list__header-title"
                [textContent]="title"
            ></h6>
        </div>
        <div class="qt-page-list__header-title-line--rigth">
            <div class="d-f ai-c">
                <span
                    class="qt-input-search"
                    [hidden]="true"
                >
                    <input
                        class="qt-input-search tickets-list-search"
                        placeholder="Search Tickets…"
                        type="text"
                        title="Ticket Search"
                        name="ticket_search"
                    >
                </span>
                <button
                    class="qt-btn --outline-blue qt-mr-8"
                    (click)="clearAll()"
                    *ngIf="countFilter > 0"
                >
                    Clear all
                </button>
                <button
                    class="qt-btn filter-button qt-mr-8 d-f"
                    [ngClass]="{'active':!toggleFilter}"
                    (click)="toggleFilter = !toggleFilter"
                >
                    <span [textContent]="getTextCountFilters()"></span>
                </button>
                <button
                    class="qt-btn --outline-blue qt-md-d-none"
                    (click)="onAddTicket()"
                >
                    Add ticket
                </button>
                <div class="icon__search-white qt-sz-24 qt-bg-contain qt-ml-6 pointer"></div>
            </div>
        </div>
    </div>




    <div class="qt-page-list__header-filters">
        <app-tickets-filter
            class="qt-w100"
            #filter
            (changeCountFilter)="onChangeCountFilter($event)"
            [hidden]="toggleFilter"
            (onClose)="toggleFilter = true"
        ></app-tickets-filter>
    </div>
