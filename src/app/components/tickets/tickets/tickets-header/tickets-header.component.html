<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line">
        <tickets-filter-info [title]="title"></tickets-filter-info>
        <div class="qt-page-list__header-title-line--rigth">
            <div class="qt-df qt-ai-c">
                <span
                    class="qt-input-search"
                    [hidden]="true"
                >
                    <input
                        class="qt-input-search tickets-list-search"
                        placeholder="Search Tickets…"
                        type="text"
                        title="Ticket Search"
                        name="ticket_search"
                    >
                </span>
                <button
                    class="qt-btn --transparent qt-mr-8"
                    (click)="clearAll()"
                    *ngIf="countFilter > 0"
                >
                    Clear all
                </button>
                <!-- TODO Check Mobile Style -->
                <!-- <button -->
                <!-- class="qt-btn filter-button qt-mr-8 qt-df" -->
                <!-- [ngClass]="{'active':toggleFilter, -->
                <!-- 'is-exist-filters':isExistFilters()}" -->
                <!-- (click)="onToggleFilter(!toggleFilter)" -->
                <!-- > -->
                <!-- <span [textContent]="getTextCountFilters()"></span> -->
                <!-- </button> -->
                <button
                    class="qt-button --gray --md filter-button qt-mr-8 qt-df"
                    [ngClass]="{'active':toggleFilter,
                  'is-exist-filters':isExistFilters()}"
                    (click)="onToggleFilter(!toggleFilter)"
                >
                    <span class="icon__filter qt-sz-16 qt-bg-contain qt-dib qt-mr-8"></span>
                    <span [textContent]="getTextCountFilters()"></span>
                </button>
                <button
                    class="qt-button --md"
                    (click)="onAddTicket()"
                >
                    <span class="icon__add--white qt-sz-16 qt-bg-contain qt-dib qt-mr-8"></span>
                    Add ticket
                </button>
                <div class="icon__search-white qt-sz-24 qt-bg-contain qt-ml-6 pointer"></div>
            </div>
        </div>
    </div>
    <div class="qt-page-list__header-filters"></div>
</div>
<div
    class="list-filters"
    *ngIf="ticketsFilter.selectedCompanies.length > 0 ||
    ticketsFilter.selectedTechUsers.length > 0 ||
    ticketsFilter.selectedUsers.length > 0 ||
    ticketsFilter.selectedStatus.length > 0 ||
    ticketsFilter.tags.length > 0"
>
    <mat-form-field>
        <mat-chip-list aria-label="Fruit selection">
            <ng-template
                ngFor
                let-item
                [ngForOf]="ticketsFilter.selectedCompanies"
                [ngForTrackBy]="trackById"
            >
                <mat-chip (removed)="filter.companyDp.clearClient();refreshFilters()">
                    {{item.name}}
                    <mat-icon matChipRemove>cancel</mat-icon>
                </mat-chip>
            </ng-template>
            <ng-template
                ngFor
                let-item
                let-i="index"
                [ngForOf]="ticketsFilter.selectedTechUsers"
                [ngForTrackBy]="trackById"
            >
                <mat-chip (removed)="filter.techUsersDp.remove(i);refreshFilters()">
                    {{getUserName(item)}}
                    <mat-icon matChipRemove>cancel</mat-icon>
                </mat-chip>
            </ng-template>
            <ng-template
                ngFor
                let-item
                let-i="index"
                [ngForOf]="ticketsFilter.selectedUsers"
                [ngForTrackBy]="trackById"
            >
                <mat-chip (removed)="filter.usersDp.remove(i);refreshFilters()">
                    {{getUserName(item)}}
                    <mat-icon matChipRemove>cancel</mat-icon>
                </mat-chip>
            </ng-template>
            <ng-template
                ngFor
                let-item
                [ngForOf]="ticketsFilter.selectedStatus"
                [ngForTrackBy]="trackById"
            >
                <mat-chip
                    (removed)="refreshFilters()"
                    class="status"
                >
                    {{getStatus(item.name)}}
                    <mat-icon matChipRemove>cancel</mat-icon>
                </mat-chip>
            </ng-template>
            <ng-template
                ngFor
                let-item
                let-i="index"
                [ngForOf]="ticketsFilter.tags"
                [ngForTrackBy]="trackById"
            >
                <mat-chip (removed)="filter.tagsDp.remove(i);refreshFilters()">
                    {{item.word}}
                    <mat-icon matChipRemove>cancel</mat-icon>
                </mat-chip>
            </ng-template>
        </mat-chip-list>
    </mat-form-field>
</div>
