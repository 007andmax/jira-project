<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line">
        <tickets-filter-info [title]="title"></tickets-filter-info>
        <div class="qt-page-list__header-title-line--right">
            <div class="qt-df qt-ai-c">
                <span
                    class="qt-input-search"
                    [hidden]="true"
                >
                    <input
                        class="qt-input-search tickets-list-search"
                        placeholder="Search Tickets…"
                        type="text"
                        title="Ticket Search"
                        name="ticket_search"
                    >
                </span>
                <!-- TODO Check Mobile Style -->
                <!-- <button -->
                <!-- class="qt-button qt-button-filter --md qt-mr-8 qt-df" -->
                <!-- [ngClass]="{'active':toggleFilter, -->
                <!-- 'is-exist-filters':isExistFilters()}" -->
                <!-- (click)="onToggleFilter(!toggleFilter)" -->
                <!-- > -->
                <!-- <span [textContent]="getTextCountFilters()"></span> -->
                <!-- </button> -->
                <button
                    class="qt-button --gray --md qt-button-filter qt-mr-8 qt-df"
                    [ngClass]="{'--disabled':ticketsStateService.getTicketsForMerge().length < 2}"
                    (click)="mergeTicket()"
                    placement="top"
                    container="body"
                    ngbTooltip="You have to select at least two tickets from the same company"
                    [disableTooltip]="ticketsStateService.getTicketsForMerge().length >= 2"
                >
                    <span class="qt-icon icon__merge qt-sz-16 qt-bg-contain qt-button-icon qt-dib qt-mr-8"></span>
                    <span>Merge Ticket</span>
                </button>
                <button
                    class="qt-button --gray --md qt-button-filter qt-mr-8 qt-df"
                    [ngClass]="{'active':toggleFilter,
                  'is-exist-filters':isExistFilters()}"
                    (click)="onToggleFilter(!toggleFilter)"
                >
                    <span class="qt-icon icon__filter qt-sz-16 qt-bg-contain qt-dib qt-mr-8"></span>
                    <span [textContent]="getTextCountFilters()"></span>
                </button>
                <button
                    class="qt-button --md"
                    (click)="onAddTicket()"
                >
                    <span class="qt-icon icon__add qt-sz-16 qt-icon__white qt-dib qt-mr-8"></span>
                    Add Ticket
                </button>
            </div>
        </div>
    </div>
    <div class="qt-page-list__header-filters"></div>
</div>
<div
    class="list-filters"
    *ngIf="ticketsFilter.selectedCompanies.length > 0 ||
    ticketsFilter.selectedTechUsers.length > 0 ||
    ticketsFilter.selectedUsers.length > 0 ||
    ticketsFilter.selectedStatus.length > 0 ||
    ticketsFilter.tags.length > 0"
>
    <app-mat-form-field>
        <app-mat-chip-list aria-label="Fruit selection">
            <ng-template
                ngFor
                let-item
                [ngForOf]="ticketsFilter.selectedCompanies"
                [ngForTrackBy]="trackById"
            >
                <app-mat-chip
                    [isRemove]="true"
                    (onClose)="filter.companyDp.clearClient();refreshFilters()"
                >
                    {{item.name}}
                </app-mat-chip>
            </ng-template>
            <ng-template
                ngFor
                let-item
                let-i="index"
                [ngForOf]="ticketsFilter.selectedTechUsers"
                [ngForTrackBy]="trackById"
            >
                <app-mat-chip
                    [isRemove]="true"
                    (onClose)="filter.techUsersDp.remove(i);refreshFilters()"
                >
                    {{getUserName(item)}}
                </app-mat-chip>
            </ng-template>
            <ng-template
                ngFor
                let-item
                let-i="index"
                [ngForOf]="ticketsFilter.selectedUsers"
                [ngForTrackBy]="trackById"
            >
                <app-mat-chip
                    [isRemove]="true"
                    (onClose)="filter.usersDp.remove(i);refreshFilters()"
                >
                    {{getUserName(item)}}
                </app-mat-chip>
            </ng-template>
            <ng-template
                ngFor
                let-item
                [ngForOf]="ticketsFilter.selectedStatus"
                [ngForTrackBy]="trackById"
            >
                <app-mat-chip
                    [isRemove]="true"
                    (onClose)="refreshFilters()"
                    class="status"
                >
                    {{getStatus(item.name)}}
                </app-mat-chip>
            </ng-template>
            <ng-template
                ngFor
                let-item
                let-i="index"
                [ngForOf]="ticketsFilter.tags"
                [ngForTrackBy]="trackById"
            >
                <app-mat-chip
                    [isRemove]="true"
                    (onClose)="filter.tagsDp.remove(i);refreshFilters()"
                >
                    {{item.word}}
                </app-mat-chip>
            </ng-template>
        </app-mat-chip-list>
    </app-mat-form-field>
</div>
