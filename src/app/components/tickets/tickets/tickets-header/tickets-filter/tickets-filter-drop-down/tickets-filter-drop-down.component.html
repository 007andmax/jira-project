<div
    class="light-dropdown"
    ngbDropdown
    #dp="ngbDropdown"
    [placement]="placement"
>
    <p
        class="title-filter qt-mb-8"
        [textContent]="title"
    ></p>
    <app-mat-form-field
        #formField
        ngbDropdownAnchor
    >
        <app-mat-chip-list
            #chipList
            aria-label="Fruit selection"
            [items]="selectedTag"
            (onChangeItems)="formField.checkSelectedItems(selectedTag)"
        >
            <app-dynamic-tooltip
                [position]="'top'"
                #productTooltip
            ></app-dynamic-tooltip>
            <app-mat-chip
                *ngFor="let tag of selectedTag; let i = index"
                [isRemove]="removable"
                (onClose)="remove(i)"
            >
                <div
                    class="clip-text"
                    *ngIf="reduceItemName(tag).length >= 30"
                    (mouseenter)="productTooltip.setContent(reduceItemName(tag));productTooltip.show($event.target)"
                    (mouseleave)="productTooltip.hide()"
                >
                    {{reduceItemName(tag)}}
                </div>
                <div
                    class="clip-text"
                    *ngIf="reduceItemName(tag).length < 30"
                >
                    {{reduceItemName(tag)}}
                </div>
            </app-mat-chip>
            <input
                id="dropdownServices"
                ngbDropdownToggle
                [placeholder]="placeholder"
                #userInput
                class="pointer"
                autocomplete="off"
                (input)="onSearch($event)"
            >
        </app-mat-chip-list>
    </app-mat-form-field>
    <div
        class="dropdown-menu"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <ng-template
            ngFor
            let-item
            [ngForOf]="list"
            [ngForTrackBy]="trackById"
        >
            <div class="qt-pos-rel">
                <button
                    ngbDropdownItem
                    class="dropdown-item"
                    (click)="toggleItem(item)"
                    [textContent]="reduceItemName(item)"
                    [ngClass]="{'--selected':isSelected(item)}"
                >
                </button>
                <div
                    *ngIf="isSelected(item)"
                    class="icon__assign-user-check qt-za-20 qt-sz-20 qt-bg-contain filter-check"
                ></div>
            </div>
        </ng-template>
    </div>
</div>
