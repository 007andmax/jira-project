<div
    class="light-dropdown"
    ngbDropdown
    #dp="ngbDropdown"
    [placement]="placement"
>
    <mat-form-field ngbDropdownAnchor>
        <mat-chip-list
            #chipList
            aria-label="Fruit selection"
        >
            <app-dynamic-tooltip
                [position]="'top'"
                #productTooltip
            ></app-dynamic-tooltip>
            <mat-chip
                *ngFor="let tag of selectedTag; let i = index"
                [selectable]="selectable"
                [removable]="removable"
                (removed)="remove(i)"
            >
                <div
                    class="clip-text"
                    *ngIf="tag.word.length >= 30"
                    (mouseenter)="productTooltip.setContent(tag.word);productTooltip.show($event.target)"
                    (mouseleave)="productTooltip.hide()"
                >
                    {{tag.word}}
                </div>
                <div
                    class="clip-text"
                    *ngIf="tag.word.length < 30"
                >
                    {{tag.word}}
                </div>
                <mat-icon
                    matChipRemove
                    *ngIf="removable"
                >
                    cancel
                </mat-icon>
            </mat-chip>
            <input
                id="dropdownServices"
                ngbDropdownToggle
                placeholder="Select tag"
                #userInput
                class="pointer"
                [matChipInputFor]="chipList"
                [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                [matChipInputAddOnBlur]="addOnBlur"
                autocomplete="off"
                (input)="onSearch($event)"
                (keyup)="onKeyUp($event)"
            >
        </mat-chip-list>
    </mat-form-field>
    <div
        class="dropdown-menu"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <ng-template
            ngFor
            let-tag
            [ngForOf]="tags"
            [ngForTrackBy]="trackById"
        >
            <div class="qt-pos-rel">
                <button
                    ngbDropdownItem
                    class="dropdown-item"
                    (click)="toggleItem(tag)"
                    [textContent]="tag.word"
                    [ngClass]="{'--selected':isSelected(tag.id)}"
                >
                </button>
                <div
                    *ngIf="isSelected(tag.id)"
                    class="icon__done qt-za-20 qt-sz-20 qt-bg-contain filter-tags-check"
                ></div>
            </div>
        </ng-template>
    </div>
</div>
