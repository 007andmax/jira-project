<div
    class="light-dropdown"
    ngbDropdown
    #products="ngbDropdown"
    [placement]="placement"
>
    <mat-form-field ngbDropdownAnchor>
        <mat-chip-list
            #chipList
            aria-label="Fruit selection"
        >
            <mat-chip
                *ngFor="let tag of selectedTag; let i = index"
                [selectable]="selectable"
                [removable]="removable"
                (removed)="remove(i)"
            >
                {{tag.word}}
                <mat-icon
                    matChipRemove
                    *ngIf="removable"
                >
                    cancel
                </mat-icon>
            </mat-chip>
            <input
                id="dropdownServices"
                ngbDropdownToggle
                placeholder="Select tag"
                #userInput
                class="pointer"
                [matChipInputFor]="chipList"
                [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                [matChipInputAddOnBlur]="addOnBlur"
                autocomplete="off"
                (input)="onSearch($event)"
                (keyup)="onKeyUp($event)"
            >
        </mat-chip-list>
    </mat-form-field>
    <div
        class="dropdown-menu"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <ng-template
            ngFor
            let-tag
            [ngForOf]="tags"
            [ngForTrackBy]="trackById"
        >
            <button
                ngbDropdownItem
                class="dropdown-item"
                (click)="toggleItem(tag)"
                [textContent]="tag.word"
                [ngClass]="{'--selected':isSelected(tag.id)}"
            >
            </button>
        </ng-template>
    </div>
</div>
