<div
    class="light-dropdown"
    ngbDropdown
    #dp="ngbDropdown"
    [placement]="placement"
>
    <app-mat-form-field
        ngbDropdownAnchor
        #formField
        [placeholder]="'Select tech user'"
    >
        <app-mat-chip-list>
            <app-dynamic-tooltip
                [position]="'top'"
                #productTooltip
            ></app-dynamic-tooltip>
            <app-mat-chip
                [value]="tag.word"
                [isRemove]="true"
                *ngFor="let tag of selectedTag; let i = index"
                (onClose)="remove(i)"
            >
                <div
                    class="clip-text"
                    *ngIf="tag.word.length >= 30"
                    (mouseenter)="productTooltip.setContent(tag.word);productTooltip.show($event.target)"
                    (mouseleave)="productTooltip.hide()"
                >
                    {{tag.word}}
                </div>
                <div
                    class="clip-text"
                    *ngIf="tag.word.length < 30"
                >
                    {{tag.word}}
                </div>
            </app-mat-chip>
            <input
                id="mat-form-field"
                ngbDropdownToggle
                placeholder="Select tag"
                #userInput
                class="pointer pointer mat-chip-input mat-input-element"
                autocomplete="off"
                (input)="onSearch($event)"
                (keyup)="onKeyUp($event)"
            >
        </app-mat-chip-list>
    </app-mat-form-field>
    <div
        class="dropdown-menu"
        ngbDropdownMenu
        aria-labelledby="mat-form-field"
    >
        <ng-template
            ngFor
            let-tag
            [ngForOf]="tags"
            [ngForTrackBy]="trackById"
        >
            <div class="qt-pos-rel">
                <button
                    ngbDropdownItem
                    class="dropdown-item"
                    (click)="toggleItem(tag)"
                    [textContent]="tag.word"
                    [ngClass]="{'--selected':isSelected(tag.id)}"
                >
                </button>
                <div
                    *ngIf="isSelected(tag.id)"
                    class="icon__assign-user-check qt-za-20 qt-sz-20 qt-bg-contain filter-tags-check"
                ></div>
            </div>
        </ng-template>
    </div>
</div>
