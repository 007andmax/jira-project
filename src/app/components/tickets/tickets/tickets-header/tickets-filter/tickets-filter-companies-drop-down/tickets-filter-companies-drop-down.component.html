<div
    class="light-dropdown"
    ngbDropdown
    #products="ngbDropdown"
    [placement]="placement"
    (openChange)="onOpenChange($event)"
>
    <p
        class="title-filter qt-mb-10"
        [textContent]="placeholder"
    ></p>
    <mat-form-field ngbDropdownAnchor>
        <mat-chip-list
            #chipList
            aria-label="Fruit selection"
        >
            <app-dynamic-tooltip
                [position]="'top'"
                #productTooltip
            ></app-dynamic-tooltip>
            <mat-chip
                *ngFor="let item of selectedItems; let i = index"
                [selectable]="selectable"
                [removable]="removable"
                (removed)="remove(i)"
            >
                <div
                    class="clip-text"
                    *ngIf="reduceItemName(item).length >= 30"
                    (mouseenter)="productTooltip.setContent(reduceItemName(item));productTooltip.show($event.target)"
                    (mouseleave)="productTooltip.hide()"
                >
                    {{reduceItemName(item)}}
                </div>
                <div
                    class="clip-text"
                    *ngIf="reduceItemName(item).length < 30"
                >
                    {{reduceItemName(item)}}
                </div>
                <mat-icon
                    matChipRemove
                    *ngIf="removable && !isDisabled"
                >
                    cancel
                </mat-icon>
            </mat-chip>
            <input
                id="dropdownServices"
                ngbDropdownToggle
                placeholder="Select company"
                #userInput
                class="pointer"
                [matChipInputFor]="chipList"
                [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                [matChipInputAddOnBlur]="addOnBlur"
                autocomplete="off"
                (input)="onSearch($event)"
                [disabled]="isDisabled"
            >
        </mat-chip-list>
    </mat-form-field>
    <div
        class="dropdown-menu"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <ng-template
            ngFor
            let-item
            [ngForOf]="list"
            [ngForTrackBy]="trackById"
        >
            <div class="qt-pos-rel">
                <button
                    ngbDropdownItem
                    class="dropdown-item"
                    (click)="toggleItem(item)"
                    [textContent]="reduceItemName(item)"
                    [ngClass]="{'--selected':isSelected(item)}"
                >
                </button>
                <div
                    *ngIf="isSelected(item)"
                    class="icon__done qt-za-20 qt-sz-20 qt-bg-contain filter-company-check"
                ></div>
            </div>
        </ng-template>
    </div>
</div>
