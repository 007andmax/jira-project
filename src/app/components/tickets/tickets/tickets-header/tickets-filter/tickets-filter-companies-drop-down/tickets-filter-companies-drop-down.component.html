<div
    class="light-dropdown"
    ngbDropdown
    #products="ngbDropdown"
    [placement]="placement"
    (openChange)="onOpenChange($event)"
>
    <p
        class="qt-input-block__label"
        [textContent]="placeholder"
    ></p>
    <app-mat-form-field
        #formField
        ngbDropdownAnchor
    >
        <app-mat-chip-list
            #chipList
            [items]="selectedItems"
            (onChangeItems)="formField.checkSelectedItems(selectedItems)"
        >
            <app-dynamic-tooltip
                [position]="'top'"
                #productTooltip
            ></app-dynamic-tooltip>
            <app-mat-chip
                *ngFor="let item of selectedItems; let i = index"
                [isRemove]="removable && !isDisabled"
                (onClose)="remove(i)"
            >
                <div
                    class="clip-text"
                    *ngIf="reduceItemName(item).length >= 30"
                    (mouseenter)="productTooltip.setContent(reduceItemName(item));productTooltip.show($event.target)"
                    (mouseleave)="productTooltip.hide()"
                >
                    {{reduceItemName(item)}}
                </div>
                <div
                    class="clip-text"
                    *ngIf="reduceItemName(item).length < 30"
                >
                    {{reduceItemName(item)}}
                </div>
            </app-mat-chip>
            <input
                id="dropdownServices"
                ngbDropdownToggle
                placeholder="Select Company"
                #userInput
                class="pointer"
                autocomplete="off"
                (input)="onSearch($event)"
                [disabled]="isDisabled"
            >
        </app-mat-chip-list>
    </app-mat-form-field>
    <div
        class="dropdown-menu"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <ng-template
            ngFor
            let-item
            [ngForOf]="list"
            [ngForTrackBy]="trackById"
        >
            <div class="qt-pos-rel">
                <button
                    ngbDropdownItem
                    class="dropdown-item"
                    (click)="toggleItem(item)"
                    [textContent]="reduceItemName(item)"
                    [ngClass]="{'--selected':isSelected(item)}"
                >
                </button>
                <div
                    *ngIf="isSelected(item)"
                    class="qt-icon icon__done qt-za-20 qt-sz-20 qt-bg-contain filter-company-check"
                ></div>
            </div>
        </ng-template>
    </div>
</div>
