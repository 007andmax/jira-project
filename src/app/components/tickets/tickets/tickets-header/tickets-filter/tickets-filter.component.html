<div class="left-panel-ng2__content--filters aside-filters-content__main">
    <div class="content-filters-header">
        <div
            class="icon__close-white qt-sz-20 qt-bg-contain"
            (click)="close()"
        ></div>
        <div class="content-filters-header__title pointer">Filters</div>
    </div>
    <tickets-filter-status
        *ngIf="ticketsStatus.length > 0"
        #filterStatus
        [ticketsStatus]="ticketsStatus"
        (onSelectStatus)="onSelectStatus($event.item, $event.event)"
    ></tickets-filter-status>
    <!-- <company-drop-down
        class="search-company"

        [placeholder]="'Select Company'"

    ></company-drop-down> -->
    <tickets-filter-companies-drop-down
        #companyDp
        [clientType]="'CLIENT'"
        [placeholder]="'Select Company'"
        [placement]="'top-left'"
        [field]="'name'"
        (filterChange)="onSelectCompany($event)"
    >
    </tickets-filter-companies-drop-down>
    <tickets-filter-search
        [ticketsFilter]="ticketsFilter"
        (changeTypeFilter)="setTypeSearchFilterWithoutChange($event)"
    ></tickets-filter-search>
    <tickets-filter-drop-down
        #usersDp
        [placeholder]="'Select User'"
        [placement]="'top-left'"
        [list]="clientsUsersNamesList"
        (filterChange)="onSelectUser($event)"
    ></tickets-filter-drop-down>
    <tickets-filter-drop-down
        #techUsersDp
        [placeholder]="'Select Tech User'"
        [placement]="'top-left'"
        [list]="techUsersNamesList"
        (filterChange)="onSelectTechUser($event)"
    >
    </tickets-filter-drop-down>
    <tickets-filter-drop-down
        #priorityDp
        [placeholder]="'Select proirity'"
        [placement]="'top-left'"
        [field]="'name'"
        [list]="ticketPriorities"
        (filterChange)="onSelectPriority($event)"
    >
    </tickets-filter-drop-down>

    ></app-drop-down>

    <app-tickets-filter-tags
        #tagsDp
        [placement]="'top-left'"
        (tagsChange)="onChangeTags($event)"
    ></app-tickets-filter-tags>
</div>
<div class="aside-filters-content__footer">
    <div class="qt-df">
        <button
            *ngIf="!customerPortalStateService.isCustomerPortal"
            class="qt-button --gray qt-mr-12 qt-w100 qt-jc-c"
            (click)="saveFilter()"
        >
            Save filter
        </button>
        <button
            class="qt-button qt-w100 qt-jc-c"
            (click)="applyFilters()"
        >
            Apply
        </button>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="qt-df qt-w100">
            <button
                class="qt-button --gray qt-mr-12 qt-w100 qt-jc-c"
                (click)="onClearAll()"
            >
                Clear All
            </button>
            <button
                class="qt-button qt-w100 qt-jc-c"
                (click)="applyFilters()"
            >
                Apply Filters
            </button>
        </div>
    </div>
</div>
