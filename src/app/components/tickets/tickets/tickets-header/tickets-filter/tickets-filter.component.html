<div class="left-panel-ng2__content--filters">
    <div class="content-filters-header">
        <div
            class="icon__close-white qt-sz-20 qt-bg-contain"
            (click)="close()"
        ></div>
        <div class="content-filters-header__title pointer">Filters</div>
    </div>
    <company-drop-down
        class="search-company"
        #companyDp
        [placeholder]="'Select Company'"
        [change]="true"
        [search]="true"
        [class]="['qt-dropdown']"
        [field]="'name'"
        (onSelectedItem)="onSelectCompany($event)"
    ></company-drop-down>
    <app-drop-down
        class="search-users"
        #usersDp
        [placeholder]="'Select User'"
        [change]="false"
        [class]="['qt-dropdown']"
        [list]="getUserList()"
        (onSelectedItem)="onSelectUser($event)"
    ></app-drop-down>
    <app-drop-down
        class="search-tech-users"
        #techUsersDp
        [placeholder]="'Select Tech User'"
        [change]="false"
        [class]="['qt-dropdown']"
        [list]="techUsersNamesList"
        (onSelectedItem)="onSelectTechUser($event)"
    ></app-drop-down>
    <app-drop-down
        class="search-status"
        #statusDp
        [placeholder]="'Select by Status'"
        [change]="false"
        [class]="['qt-dropdown']"
        [list]="ticketsStatus"
        [field]="'title'"
        (onSelectedItem)="onSelectStatus($event)"
    ></app-drop-down>
    <app-tickets-filter-tags
        #tagsDp
        [placement]="appService.checkMobile() ? 'top-left' : 'bottom-left'"
        (tagsChange)="onChangeTags($event)"
    ></app-tickets-filter-tags>
    <div class="qt-df">
        <button
            class="qt-button --gray qt-mr-12"
            (click)="saveFilter()"
        >
            Save filter
        </button>
        <button
            class="qt-button"
            (click)="applyFilters()"
        >
            Apply
        </button>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="qt-df qt-w100">
            <button
                class="qt-button --gray qt-mr-12"
                (click)="onClearAll()"
            >
                Clear All
            </button>
            <button
                class="qt-button"
                (click)="applyFilters()"
            >
                Apply Filters
            </button>
        </div>
    </div>
</div>
