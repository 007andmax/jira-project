<div class="left-panel-ng2__content--filters aside-filters-content__main">
    <div class="content-filters-header">
        <div
            class="icon__close-white qt-sz-20 qt-bg-contain"
            (click)="close()"
        ></div>
        <div class="content-filters-header__title pointer">Filters</div>
    </div>
    <div class="qt-inputs-row --required">
        <div class="qt-input-block">
            <label class="qt-input-block__label">Status</label>
            <ng-template
                ngFor
                let-status
                [ngForOf]="ticketsStatus"
                [ngForTrackBy]="trackById"
            >
                <div class="qt-df content-filters-checkbox">
                    <label
                        class="qt-checkbox receive-full-amount-check qt-mb-0 pointer"
                        [attr.for]="'status-' + status.id"
                    >
                        <input
                            [attr.id]="'status-' + status.id"
                            type="checkbox"
                            [(ngModel)]="status.selected"
                            (change)="onSelectStatus(status,$event)"
                        >
                        <span></span>
                        <div
                            class="qt-ml-8"
                            [textContent]="status.title"
                        ></div>
                    </label>
                    <span
                        class="qt-ml-auto content-filters-checkbox__count"
                        [textContent]="status.count"
                    ></span>
                </div>
            </ng-template>
        </div>
    </div>
    <company-drop-down
        class="search-company"
        #companyDp
        [placeholder]="'Select Company'"
        [change]="true"
        [search]="true"
        [class]="['qt-dropdown']"
        [field]="'name'"
        (onSelectedItem)="onSelectCompany($event)"
    ></company-drop-down>
    <app-drop-down
        class="search-users"
        #usersDp
        [placeholder]="'Select User'"
        [change]="false"
        [class]="['qt-dropdown']"
        [list]="getUserList()"
        (onSelectedItem)="onSelectUser($event)"
    ></app-drop-down>
    <app-drop-down
        class="search-tech-users"
        #techUsersDp
        [placeholder]="'Select Tech User'"
        [change]="false"
        [class]="['qt-dropdown']"
        [list]="techUsersNamesList"
        (onSelectedItem)="onSelectTechUser($event)"
    ></app-drop-down>
    <app-drop-down
        class="search-status"
        #statusDp
        [placeholder]="'Select by Status'"
        [change]="false"
        [class]="['qt-dropdown']"
        [list]="ticketsStatus"
        [field]="'title'"
        (onSelectedItem)="onSelectStatus($event)"
    ></app-drop-down>
    <app-tickets-filter-tags
        #tagsDp
        [placement]="appService.checkMobile() ? 'top-left' : 'bottom-left'"
        (tagsChange)="onChangeTags($event)"
    ></app-tickets-filter-tags>
</div>
<div class="aside-filters-content__footer">
    <div class="qt-df">
        <button
            class="qt-button --gray qt-mr-12 qt-w100 qt-jc-c"
            (click)="saveFilter()"
        >
            Save filter
        </button>
        <button
            class="qt-button qt-w100 qt-jc-c"
            (click)="applyFilters()"
        >
            Apply
        </button>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="qt-df qt-w100">
            <button
                class="qt-button --gray qt-mr-12 qt-w100 qt-jc-c"
                (click)="onClearAll()"
            >
                Clear All
            </button>
            <button
                class="qt-button qt-w100 qt-jc-c"
                (click)="applyFilters()"
            >
                Apply Filters
            </button>
        </div>
    </div>
</div>
