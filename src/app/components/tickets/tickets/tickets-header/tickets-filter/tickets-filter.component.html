<div class="left-panel-ng2__content--filters">
    <div class="content-filters-header">
        <div
            class="icon__close-white qt-sz-20 qt-bg-contain"
            (click)="close()"
        ></div>
        <div class="content-filters-header__title pointer">Filters</div>
    </div>
    <app-select-search
        class="search-company"
        #companyDp
        [placeholder]="'Select Company'"
        [change]="false"
        [class]="['qt-dropdown']"
        [field]="'name'"
        [list]="companies"
        (onSelectedItem)="onSelectCompany($event)"
    ></app-select-search>
    <app-select-search
        class="search-users"
        #usersDp
        [placeholder]="'Select User'"
        [change]="false"
        [class]="['qt-dropdown']"
        [list]="getUserList()"
        (onSelectedItem)="onSelectUser($event)"
    ></app-select-search>
    <app-select-search
        class="search-tech-users"
        #techUsersDp
        [placeholder]="'Select Tech User'"
        [change]="false"
        [class]="['qt-dropdown']"
        [list]="getTechUserList()"
        (onSelectedItem)="onSelectTechUser($event)"
    ></app-select-search>
    <app-select-search
        class="search-status"
        #statusDp
        [placeholder]="'Select by Status'"
        [change]="false"
        [class]="['qt-dropdown']"
        [list]="listsStatus"
        [field]="'title'"
        (onSelectedItem)="onSelectStatus($event)"
    ></app-select-search>
    <app-tickets-filter-tags (tagsChange)="onChangeTags($event)"></app-tickets-filter-tags>
    <!-- Mobile -->
    <div class="qt-aside-modern__footer">
        <div class="qt-df qt-w100">
            <button class="qt-button --gray qt-mr-12">Clear All</button>
            <button
                class="qt-button"
                (click)="applyFilters()"
            >
                Apply Filters
            </button>
        </div>
    </div>
    <!-- Mobile -->
</div>
