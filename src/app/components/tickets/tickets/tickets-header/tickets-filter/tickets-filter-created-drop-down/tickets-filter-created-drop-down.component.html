<div
    ngbDropdown
    [ngClass]="class"
    [placement]="placement"
    [container]="container"
    #dp="ngbDropdown"
>
    <div
        *ngIf="title"
        class="app-drop-down__title"
        [textContent]="title"
    ></div>
    <app-mat-error
        class="invalid-feedback"
        *ngIf="!validate"
        [textContent]="errorMessage"
    >
    </app-mat-error>
    <input
        type="text"
        [ngStyle]="{'width': '100%', 'height': heightInput ? heightInput : '40px' }"
        [ngClass]="{'disabled': isDisabled, '--input-error' : !validate}"
        [disabled]="isDisabled"
        [value]="getSelectedItemText()"
        autocomplete="off"
        [placeholder]="placeholder"
        id="dropdown1"
        class="qt-dropdown-input"
        [attr.maxlength]="maxlength"
        (input)="onCheckAdd($event)"
        [readonly]="!change"
        ngbDropdownToggle
    >
    <span
        class="app-drop-down__right-icon pointer"
        *ngIf="list && !isDisabled"
        [ngStyle]="{'bottom': heightInput ? dividePosition(heightInput) : '20px' }"
    >
        <i
            *ngIf="selectedItem && !isAdd && !isBlockClear"
            class="icn-sm icn-remove-old"
            (click)="clearClient()"
        ></i>
        <i
            *ngIf="(!selectedItem || isBlockClear) && !isAdd && !preloader"
            class="icn-sm report-caret-icon"
        ></i>
        <i
            *ngIf="isAdd"
            (click)="addItem()"
            class="icn-sm icn-product-save qt-icon icon__done qt-icon__blue-light-600"
        ></i>
    </span>
    <i
        class="loading xs"
        *ngIf="preloader"
    ></i>
    <div
        ngbDropdownMenu
        [ngStyle]="{'width': dropdownWidth ? dropdownWidth : '100%', 'max-height': dropdownHeight ? dropdownHeight : '192px'}"
        aria-labelledby="dropdown1"
        class="app-drop-down__dropdown date-picker"
    >
        <div *ngIf="selectedItem && selectedItem.type == 'CUSTOM'">
            <ngb-datepicker
                #dp
                (select)="onDateSelection($event)"
                [displayMonths]="2"
                [dayTemplate]="t"
                [outsideDays]="outsideDays"
            >
            </ngb-datepicker>
            <ng-template
                #t
                let-date
                let-focused="focused"
            >
                <span
                    class="custom-day"
                    [class.focused]="focused"
                    [class.range]="isRange(date)"
                    [class.faded]="isHovered(date) || isInside(date)"
                    (mouseenter)="hoveredDate = date"
                    (mouseleave)="hoveredDate = null"
                >
                    {{ date.day }}
                </span>
            </ng-template>
        </div>
        <div
            *ngIf="!selectedItem || selectedItem.type != 'CUSTOM'"
            [ngStyle]="{'min-width': '265px'}"
        >
            <ng-template
                ngFor
                let-item
                [ngForOf]="list"
                let-i="index"
            >
                <button
                    [textContent]="reduceItemName(item)"
                    (click)="onSelect(item)"
                    [title]="reduceItemName(item)"
                    [ngClass]="{'--selected':isSelected(item)}"
                ></button>
            </ng-template>
        </div>
    </div>
</div>
