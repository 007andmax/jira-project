<div class="archive-modal de-archive tickets-edit-filter-modal">
    <button
        class="close-modal"
        (click)=cancelConfirm()
    ></button>
    <div class="archive-modal__body">
        <h3 class="archive-modal__title qt-mb-24">Edit Filter View</h3>
        <div class="exist-agreements">
            <div class="contract-container qt-mt-16">
                <div class="contract-container-agreements qt-mt-8">
                    <div class="qt-inputs-row">
                        <div class="qt-input-block qt-f100">
                            <div class="qt-input-block__label">Save Filter view as</div>
                            <input
                                type="text"
                                minlength="1"
                                maxlength="50"
                                [(ngModel)]="globalFilter.name"
                                placeholder="Text Tickets i have raised"
                            >
                        </div>
                    </div>
                    <div class="qt-inputs-row">
                        <div class="qt-input-block qt-f100">
                            <div class="qt-input-block__label">Visible to</div>
                            <label
                                class="radio-container"
                                for="global-filter-1"
                            >
                                Just me
                                <input
                                    type="radio"
                                    [(ngModel)]="globalFilter.global"
                                    [value]="false"
                                    name="global-filter"
                                    id="global-filter-1"
                                >
                                <span class="radio-mark"></span>
                            </label>
                            <label
                                class="radio-container"
                                for="global-filter-2"
                            >
                                All Tech users
                                <input
                                    type="radio"
                                    [(ngModel)]="globalFilter.global"
                                    [value]="true"
                                    name="global-filter"
                                    id="global-filter-2"
                                >
                                <span class="radio-mark"></span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="archive-modal__footer">
        <div class="qt-df qt-jc-fe">
            <button
                class="qt-button --gray qt-mr-12 qt-jc-c qt-w100"
                (click)=cancelConfirm()
            >
                Cancel
            </button>
            <button
                class="qt-button qt-jc-c qt-w100"
                (click)=save()
            >
                Save
            </button>
        </div>
    </div>
</div>
