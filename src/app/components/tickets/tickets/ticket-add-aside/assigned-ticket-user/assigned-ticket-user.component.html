<div
    ngbDropdown
    #dp="ngbDropdown"
    [ngClass]="class"
    [container]="container"
    [ngStyle]="{'width':widthInput ? widthInput : '100%'}"
    class="tech-users-container"
>
    <div
        *ngIf="title"
        class="app-drop-down__title"
        [textContent]="title"
    ></div>
    <mat-error
        class="invalid-feedback"
        *ngIf="!validate"
        [textContent]="errorMessage"
    >
    </mat-error>
    <input
        type="text"
        [ngStyle]="{'width': '100%', 'height': heightInput ? heightInput : '40px' }"
        [ngClass]="{'disabled': isDisabled, '--input-error' : !validate}"
        [disabled]="isDisabled"
        autocomplete="off"
        [placeholder]="placeholder"
        id="dropdown1"
        class="qt-dropdown-input"
        [attr.maxlength]="maxlength"
        (input)="onCheckAdd($event)"
        (focus)="onFocus($event)"
        [readonly]="!change"
        ngbDropdownAnchor
    >
    <span
        class="app-drop-down__right-icon pointer"
        *ngIf="list && !isDisabled"
        [ngStyle]="{'top': heightInput ? dividePosition(heightInput) : '20px' }"
    >
        <i
            *ngIf="selectedItem && !isAdd && !isBlockClear"
            class="icn-sm icn-remove-old"
            (click)="clearClient()"
        ></i>
        <i
            *ngIf="(!selectedItem || isBlockClear) && !isAdd && !preloader"
            class="icn-sm report-caret-icon"
        ></i>
        <i
            *ngIf="isAdd"
            (click)="addItem()"
            class="icn-sm icn-product-save icon__active_subscription"
        ></i>
    </span>
    <i
        class="loading xs"
        *ngIf="preloader"
    ></i>
    <div class="save-template qt-mt-8">
        <div class="assigned-users-list">
            <div class="assigned-users-type assigned-users-type-clients">
                <ng-template
                    class="assigned-ticket-user"
                    ngFor
                    let-user
                    [ngForOf]="selectedUsers"
                    let-i="index"
                    [ngForTrackBy]="trackByIndex"
                >
                    <app-dynamic-tooltip
                        [content]="user.firstName + ' ' + user.lastName"
                        [position]="'top'"
                        #userTooltip
                    ></app-dynamic-tooltip>
                    <div
                        class="assigned-ticket-user__item"
                        *ngIf="user.accountType === 'CLIENT'"
                        (mouseenter)="userTooltip.show($event.target)"
                        (mouseleave)="userTooltip.hide()"
                    >
                        <div *ngIf="user.avatar">
                            <img
                                ng-if="user.avatar"
                                class="qt-circle default-user-avatar"
                                [src]="'/users/' + (user.id || 'default') + '/image' + (user.avatar ? '.jpg?t=' + user.avatar.updatedAt : '')"
                                alt="..."
                            >
                        </div>
                        <div *ngIf="!user.avatar">
                            <div class="default-user-avatar avatar-background-color-odd ng-scope">
                                <span [textContent]="(user.firstName) ? user.firstName[0].toUpperCase() : ''"></span>
                                <span [textContent]="(user.lastName) ? user.lastName[0].toUpperCase() : ''"></span>
                            </div>
                        </div>
                        <div
                            class="assigned-ticket-user__name qt-ml-4 qt-mr-4"
                            [textContent]="user.firstName + ' ' + user.lastName"
                        ></div>
                        <label class="qt-sz-20 relative">
                            <input
                                type="checkbox"
                                [(ngModel)]="user.selected"
                            >
                            <span class="assigned-ticket-user__checkmark"></span>
                        </label>


                    </div>
                </ng-template>
            </div>
            <div class="assigned-users-type">
                <ng-template
                    class="assigned-ticket-user"
                    ngFor
                    let-user
                    [ngForOf]="selectedUsers"
                    let-i="index"
                    [ngForTrackBy]="trackByIndex"
                >
                    <app-dynamic-tooltip
                        [content]="user.firstName + ' ' + user.lastName"
                        [position]="'top'"
                        #userTooltip
                    ></app-dynamic-tooltip>
                    <div
                        class="assigned-ticket-user__item"
                        *ngIf="user.accountType === 'TECH'"
                        (mouseenter)="userTooltip.show($event.target)"
                        (mouseleave)="userTooltip.hide()"
                    >
                        <div *ngIf="user.avatar">
                            <img
                                ng-if="user.avatar"
                                class="qt-circle default-user-avatar"
                                [src]="'/users/' + (user.id || 'default') + '/image' + (user.avatar ? '.jpg?t=' + user.avatar.updatedAt : '')"
                                alt="..."
                            >
                        </div>
                        <div *ngIf="!user.avatar">
                            <div class="default-user-avatar avatar-background-color-odd ng-scope">
                                <span [textContent]="(user.firstName) ? user.firstName[0].toUpperCase() : ''"></span>
                                <span [textContent]="(user.lastName) ? user.lastName[0].toUpperCase() : ''"></span>
                            </div>
                        </div>
                        <div
                            class="assigned-ticket-user__name qt-ml-4 qt-mr-4"
                            [textContent]="user.firstName + ' ' + user.lastName"
                        ></div>
                        <label class="qt-sz-20 relative">
                            <input
                                type="checkbox"
                                [(ngModel)]="user.selected"
                            >
                            <span class="assigned-ticket-user__checkmark"></span>
                        </label>
                    </div>
                </ng-template>
            </div>
        </div>
    </div>
    <div
        ngbDropdownMenu
        [ngStyle]="{'width': dropdownWidth ? dropdownWidth : '100%', 'max-height': dropdownHeight ? dropdownHeight : '192px'}"
        aria-labelledby="dropdown1"
        class="tech-user-body"
    >
        <div class="select-wrapper dropdown-assign-ticket fixed-assign">
            <div class="content">
                <form class="px-4 py-3">
                    <div class="assign-ticket">
                        <div class="assign-ticket-content">
                            <div class="assign-ticket-header">
                                <div class="clearfix">
                                    <div class="qt-input-search">
                                        <input
                                            #userInput
                                            placeholder="Search Users"
                                            autocomplete="off"
                                            id="search-user"
                                            (input)="onSearchUser($event)"
                                        >
                                    </div>
                                </div>
                            </div>
                            <div class="scroll-pane">
                                <div
                                    class="users-list"
                                    tabindex="-1"
                                >
                                    <ng-template
                                        ngFor
                                        let-user
                                        [ngForOf]="list"
                                        let-i="index"
                                        [ngForTrackBy]="trackByIndex"
                                    >
                                        <div
                                            class="user-item-detail pointer"
                                            data-index="1"
                                            (click)="selected(user)"
                                            [ngClass]="(user.selected) ? 'active' : ''"
                                        >
                                            <div
                                                class="user-item-user-avatar"
                                                [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
                                                [ngStyle]="{'background': ticketsListService.getStyleAvatar(user)}"
                                            ></div>
                                            <div
                                                class="user-item-user-name"
                                                [textContent]="getUserName(user)"
                                            ></div>
                                            <span
                                                class="user-item-user-email"
                                                [textContent]="user.primaryEmail"
                                            ></span>
                                            <i
                                                *ngIf="isSelected(user)"
                                                class="icon__assign-user-check qt-za-20 qt-sz-20 qt-bg-contain qt-ml-auto"
                                            ></i>
                                        </div>
                                    </ng-template>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
