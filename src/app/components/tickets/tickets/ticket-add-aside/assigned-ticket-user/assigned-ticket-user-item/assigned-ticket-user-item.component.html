<div
    class="user-item-detail pointer"
    data-index="1"
    (click)="selected(user)"
    [ngClass]="isSelected(user) ? 'active' : ''"
>
    <div
        class="user-item-user-avatar"
        [textContent]="ticketsListService.getAssignedUserNameForAvatar(user)"
        [ngStyle]="{'background': ticketsListService.getStyleAvatar(user,listColorNoAvatar[user.indexNoAvatar])}"
    ></div>
    <div
        class="user-item-user-name"
        [textContent]="getUserName(user)"
    ></div>
    <span
        class="user-item-user-email"
        [textContent]="user.primaryEmail"
    ></span>
    <i
        *ngIf="isSelected(user)"
        class="qt-icon icon__done qt-za-20 qt-sz-20 qt-bg-contain qt-ml-auto"
    ></i>
</div>
