<div
    [hidden]="!opened"
    class="qt-aside-modern ticket-add-aside"
>
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-info d-f ai-c">
            <div class="qt-aside__title">Create New Ticket</div>
            <div
                class="qt-aside__ticket-name"
                [textContent]="'QT ' + actualNumber"
            ></div>
            <div
                class="ticket-priority create-dropdown"
                ngbDropdown
            >
                <input
                    type="text"
                    class="form-control ticket-drop has-dropdown readonly-normal"
                    ngbDropdownToggle
                    readonly
                >
                <i class="icn-sm report-caret-icon"></i>
                <ul
                    class="dropdown-menu dropdown-priority"
                    ngbDropdownMenu
                >
                    <ng-template
                        class="assigned-ticket-user"
                        ngFor
                        let-item
                        [ngForOf]="ticketPriorities"
                    >
                        <li
                            ngbDropdownItem
                            (click)="setPriorityLevel(item)"
                        >
                            <a
                                tabindex="-1"
                                href="javascript:void(0)"
                            >
                                <span class="priority-dot {{ item.type.toLowerCase() }}"></span>
                                {{ item.title }}
                            </a>
                        </li>
                    </ng-template>
                </ul>
                <div class="default-value">
                    <span class="priority-dot {{ ticketAdd.priorityLevel.toLowerCase() }}"></span>
                    {{getPriorityLevel()}}
                </div>
            </div>
        </div>
        <div>
            <div
                class="qt-aside__close-modal icon__close"
                (click)="closed()"
            ></div>
        </div>
    </div>
    <div class="qt-aside-modern__content">
        <!-- Mobile -->
        <div class="qt-input-block qt-input-line ticket-add-aside__priority-level-input">
            <span class="qt-input-block__label">Priority Level</span>
            <app-select-search
                [class]="['qt-dropdown']"
                [field]="'title'"
                [isBlockClear]="true"
                [editItem]="selectedTicketPriorities"
                [list]="ticketPriorities"
                (onSelectedItem)="setPriorityLevel($event)"
                [placeholder]="'Low'"
            ></app-select-search>
        </div>
        <!-- End Mobile -->
        <div class="qt-input-block qt-input-line --required">
            <mat-error
                class="qt-tooltip-error"
                *ngIf="!ticketValidate.getSubject()"
            >
                Ticket Subject is required
            </mat-error>
            <label
                for="add-ticket-subject"
                class="qt-input-block__label"
            >
                Ticket Subject
            </label>
            <input
                [ngClass]="{'--input-error' : !ticketValidate.getSubject()}"
                id="add-ticket-subject"
                class="qt-input-block__input"
                [(ngModel)]="ticketAdd.subject"
                (change)="onChangeSubject()"
                type="text"
                placeholder="Write Ticket subject"
            >
        </div>
        <div class="qt-input-block qt-input-line">
            <label
                for="add-ticket-describe-issue"
                class="qt-input-block__label"
            >
                Describe Issue
            </label>
            <div
                id="add-ticket-describe-issue"
                class="qt-input-block__textarea"
                contenteditable="true"
                placeholder="Describe Issue here…"
                (input)="onChangeNote($event)"
            ></div>
            <!-- <textarea id="add-ticket-describe-issue" class="qt-input-block__textarea" appTextArea [limit]="250"
                  placeholder="Describe Issue here…" (input)="onChangeNote($event)" (onPast)="onPastNote($event)"></textarea> -->
        </div>
        <div class="qt-input-line">
            <div class="qt-input-block">
                <app-drop-down
                    #companyDP
                    [title]="'Company'"
                    [class]="['qt-dropdown']"
                    [placeholder]="'Select Company'"
                    [list]="companies"
                    [validate]="ticketValidate.getCompany()"
                    [errorMessage]="'Company is required'"
                    [field]="'name'"
                    [search]="true"
                    [change]="true"
                    (onSelectedItem)="onSelectCompany($event)"
                ></app-drop-down>
            </div>
            <div class="qt-input-block">
                <app-drop-down
                    #userDP
                    [title]="'User'"
                    [class]="['qt-dropdown']"
                    [placeholder]="'Select User'"
                    [list]="getUserList()"
                    [validate]="ticketValidate.getClientUser()"
                    [errorMessage]="'Client User is required'"
                    [search]="true"
                    [change]="true"
                    (onSelectedItem)="onSelectUser($event)"
                ></app-drop-down>
            </div>
        </div>
        <div class="qt-input-line">
            <div class="qt-input-block">
                <span class="qt-input-block__label">Assign To</span>
                <app-select-search
                    #techUserDP
                    [class]="['qt-dropdown']"
                    [list]="getTechUserList()"
                    (onSelectedItem)="onSelectTechUser($event)"
                    [placeholder]="'Select User to assign'"
                ></app-select-search>
            </div>
            <div class="qt-input-block">
                <span class="qt-input-block__label">Device</span>
                <app-select-search
                    #deviceDP
                    [class]="['qt-dropdown']"
                    [field]="'hostName'"
                    [list]="devices"
                    [placeholder]="'Select device'"
                    (onSelectedItem)="onSelectDevice($event)"
                ></app-select-search>
            </div>
        </div>
        <app-upload-area
            #uplaodFile
            (changeFiles)="onChangeFiles($event)"
            class="ticket-fileupload"
        ></app-upload-area>
        <div class="users-to-notify">
            <div class="users-to-notify__title">Add users to notify them ticket update</div>
            <div class="save-template">
                <div
                    class="device-user pointer"
                    id="dropdownTehuser"
                    *ngIf="appService.checkMobile()"
                    (click)="onAddAssignedUser()"
                >
                </div>
                <app-teh-users
                    *ngIf="!appService.checkMobile()"
                    [users]="listTechUsersForAssign"
                    (usersChange)="onChangeShareUsers($event)"
                ></app-teh-users>
                <div class="assigned-users-list">
                    <div class="assigned-users-type assigned-users-type-clients">
                        <ng-template
                            class="assigned-ticket-user"
                            ngFor
                            let-user
                            [ngForOf]="shareUsersList"
                            let-i="index"
                            [ngForTrackBy]="trackByIndex"
                        >
                            <div
                                class="assigned-ticket-user__item"
                                *ngIf="user.accountType === 'CLIENT'"
                            >
                                <div *ngIf="user.avatar">
                                    <img
                                        ng-if="user.avatar"
                                        class="img-circle default-user-avatar"
                                        [src]="'/users/' + (user.id || 'default') + '/image' + (user.avatar ? '.jpg?t=' + user.avatar.updatedAt : '')"
                                        alt="..."
                                    >
                                </div>
                                <div *ngIf="!user.avatar">
                                    <div class="default-user-avatar avatar-background-color-odd ng-scope">
                                        <span [textContent]="(user.firstName) ? user.firstName[0].toUpperCase() : ''"></span>
                                        <span [textContent]="(user.lastName) ? user.lastName[0].toUpperCase() : ''"></span>
                                    </div>
                                </div>
                                <label>
                                    <input
                                        type="checkbox"
                                        [(ngModel)]="user.selected"
                                    >
                                    <span class="assigned-ticket-user__checkmark"></span>
                                </label>
                            </div>
                        </ng-template>
                    </div>
                    <div class="assigned-users-type">
                        <ng-template
                            class="assigned-ticket-user"
                            ngFor
                            let-user
                            [ngForOf]="shareUsersList"
                            let-i="index"
                            [ngForTrackBy]="trackByIndex"
                        >
                            <div
                                class="assigned-ticket-user__item"
                                *ngIf="user.accountType === 'TECH'"
                            >
                                <div *ngIf="user.avatar">
                                    <img
                                        ng-if="user.avatar"
                                        class="img-circle default-user-avatar"
                                        [src]="'/users/' + (user.id || 'default') + '/image' + (user.avatar ? '.jpg?t=' + user.avatar.updatedAt : '')"
                                        alt="..."
                                    >
                                </div>
                                <div *ngIf="!user.avatar">
                                    <div class="default-user-avatar avatar-background-color-odd ng-scope">
                                        <span [textContent]="(user.firstName) ? user.firstName[0].toUpperCase() : ''"></span>
                                        <span [textContent]="(user.lastName) ? user.lastName[0].toUpperCase() : ''"></span>
                                    </div>
                                </div>
                                <label>
                                    <input
                                        type="checkbox"
                                        [(ngModel)]="user.selected"
                                    >
                                    <span class="assigned-ticket-user__checkmark"></span>
                                </label>
                            </div>
                        </ng-template>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="qt-df">
            <button
                class="qt-button qt-mr-12"
                appDisabledBtn
                #addBtn="disabled"
                (onClick)="add()"
            >
                <span *ngIf="!addBtn.isBlock()">Create Ticket</span>
                <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
            </button>
            <button
                class="qt-button --gray"
                (click)="closed()"
            >
                Cancel
            </button>
        </div>
    </div>
</div>
