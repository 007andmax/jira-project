<div
    [hidden]="!opened"
    class="qt-aside-modern qt-aside-modern--page-settings"
>
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-info qt-df qt-ai-c">
            <div class="qt-aside__title">Create New Ticket</div>
            <div
                class="qt-aside__ticket-name"
                [textContent]="'QT ' + actualNumber"
            ></div>
            <div
                class="ticket-priority create-dropdown"
                ngbDropdown
            >
                <input
                    type="text"
                    class="form-control ticket-drop has-dropdown readonly-normal"
                    ngbDropdownToggle
                    readonly
                >
                <i class="icn-sm report-caret-icon"></i>
                <ul
                    class="dropdown-menu dropdown-priority"
                    ngbDropdownMenu
                >
                    <ng-template
                        class="assigned-ticket-user"
                        ngFor
                        let-item
                        [ngForOf]="ticketPriorities"
                    >
                        <li
                            ngbDropdownItem
                            (click)="setPriorityLevel(item)"
                        >
                            <a
                                tabindex="-1"
                                href="javascript:void(0)"
                            >
                                <div
                                    class="qt-input-block__dot priority-dot"
                                    [ngStyle]="{'background-color':  statusColors[item.color] && statusColors[item.color].textColor ,
                            'border-color':  statusColors[item.color] && statusColors[item.color].textColor}"
                                ></div>
                                {{ item.name }}
                            </a>
                        </li>
                    </ng-template>
                </ul>
                <div class="default-value">
                    <div
                        class="qt-input-block__dot priority-dot"
                        [ngStyle]="{'background-color':ticketAdd.priorityLevel && statusColors[ticketAdd.priorityLevel.color] && statusColors[ticketAdd.priorityLevel.color].textColor ,
                            'border-color': ticketAdd.priorityLevel &&  statusColors[ticketAdd.priorityLevel.color] && statusColors[ticketAdd.priorityLevel.color].textColor}"
                    ></div>
                    {{getPriorityLevel()}}
                </div>
            </div>
        </div>
        <div>
            <div
                class="qt-aside__close-modal icon__close"
                (click)="closed()"
            ></div>
        </div>
    </div>
    <div class="qt-aside-modern__content">
        <div class="qt-inputs-row ticket-add-aside__priority-level-input">
            <div class="qt-input-block">
                <span class="qt-input-block__label">Priority Level</span>
                <app-drop-down
                    [class]="['qt-dropdown']"
                    [field]="'name'"
                    [isBlockClear]="true"
                    [editItem]="ticketAdd.priorityLevel"
                    [list]="ticketPriorities"
                    (onSelectedItem)="setPriorityLevel($event)"
                    [placeholder]="'Low'"
                ></app-drop-down>
            </div>
        </div>
        <div class="qt-inputs-row --required">
            <div class="qt-input-block">
                <label
                    for="add-ticket-subject"
                    class="qt-input-block__label"
                >
                    Ticket Subject
                </label>
                <input
                    [ngClass]="{'--input-error' : !ticketValidate.getSubject()}"
                    id="add-ticket-subject"
                    class="qt-input-block__input"
                    [(ngModel)]="ticketAdd.subject"
                    (change)="onChangeSubject()"
                    type="text"
                    placeholder="Write Ticket subject"
                >
                <mat-error
                    class="invalid-feedback"
                    *ngIf="!ticketValidate.getSubject()"
                >
                    Ticket Subject is required
                </mat-error>
            </div>
        </div>
        <div class="qt-inputs-row">
            <div class="qt-input-block">
                <label
                    for="add-ticket-describe-issue"
                    class="qt-input-block__label"
                >
                    Describe Issue
                </label>
                <div
                    id="add-ticket-describe-issue"
                    class="qt-input-block__textarea"
                    contenteditable="true"
                    placeholder="Describe Issue here…"
                    (input)="onChangeNote($event)"
                ></div>
            </div>
        </div>
        <div class="qt-inputs-row">
            <div class="qt-input-block qt-f100 qt-flex-md-100">
                <company-users-drop-down
                    #userDP
                    [title]="'User'"
                    [class]="['qt-dropdown']"
                    [placeholder]="'Select User'"
                    [validate]="ticketValidate.getCompany()"
                    [errorMessage]="'Company is required'"
                    [field]="'name'"
                    [search]="true"
                    [change]="true"
                    [sort]="false"
                    (onSelectedItem)="onSelectUser($event.user,$event.customerCompany)"
                ></company-users-drop-down>
            </div>
        </div>
        <div
            class="qt-inputs-row"
            *ngIf="!customerPortalStateService.isCustomerPortal"
        >
            <div class="qt-input-block qt-f50 qt-flex-md-100">
                <span class="qt-input-block__label">Assign To</span>
                <app-drop-down
                    #techUserDP
                    [class]="['qt-dropdown']"
                    [list]="namesTechUsersList"
                    [search]="true"
                    [change]="true"
                    (onSelectedItem)="onSelectTechUser($event)"
                    [placeholder]="'Select User to assign'"
                ></app-drop-down>
            </div>
            <div class="qt-input-block qt-f50 qt-flex-md-100">
                <span class="qt-input-block__label">Device</span>
                <app-drop-down
                    #deviceDP
                    [class]="['qt-dropdown']"
                    [field]="'hostName'"
                    [list]="devices"
                    [search]="true"
                    [change]="true"
                    [preloader]="ticketAdd.getPreloaderDevices()"
                    [isDisabled]="!selectedCompanyId || ticketAdd.getPreloaderDevices()"
                    [placeholder]="'Select device'"
                    (onSelectedItem)="onSelectDevice($event)"
                ></app-drop-down>
            </div>
        </div>
        <app-upload-area
            #uplaodFile
            (changeFiles)="onChangeFiles($event)"
            class="ticket-fileupload"
        ></app-upload-area>
        <div class="users-to-notify">
            <div class="users-to-notify__title">Add users to notify them ticket update</div>
            <div class="save-template">
                <div
                    class="device-user pointer"
                    id="dropdownTechuser"
                    *ngIf="appService.checkMobile()"
                    (click)="onAddAssignedUser()"
                >
                </div>
                <app-tech-users
                    #techUsersDp
                    *ngIf="!appService.checkMobile()"
                    [users]="listTechUsersForAssign"
                    [editMode]="true"
                    [editUsers]="shareUsersList"
                    (usersChange)="onChangeShareUsers($event)"
                ></app-tech-users>
                <div class="assigned-users-list">
                    <div class="assigned-users-type assigned-users-type-clients">
                        <ng-template
                            class="assigned-ticket-user"
                            ngFor
                            let-user
                            [ngForOf]="shareUsersList"
                            let-i="index"
                            [ngForTrackBy]="trackByIndex"
                        >
                            <app-dynamic-tooltip
                                [content]="user.firstName + ' ' + user.lastName"
                                [position]="'top'"
                                #userTooltip
                            ></app-dynamic-tooltip>
                            <div
                                class="assigned-ticket-user__item"
                                *ngIf="user.accountType === 'CLIENT'"
                                (mouseenter)="userTooltip.show($event.target)"
                                (mouseleave)="userTooltip.hide()"
                            >
                                <div *ngIf="user.avatar">
                                    <img
                                        ng-if="user.avatar"
                                        class="qt-circle default-user-avatar"
                                        [src]="'/users/' + (user.id || 'default') + '/image' + (user.avatar ? '.jpg?t=' + user.avatar.updatedAt : '')"
                                        alt="..."
                                    >
                                </div>
                                <div *ngIf="!user.avatar">
                                    <div class="default-user-avatar avatar-background-color-odd ng-scope">
                                        <span [textContent]="(user.firstName) ? user.firstName[0].toUpperCase() : ''"></span>
                                        <span [textContent]="(user.lastName) ? user.lastName[0].toUpperCase() : ''"></span>
                                    </div>
                                </div>
                                <label>
                                    <input
                                        type="checkbox"
                                        [(ngModel)]="user.selected"
                                    >
                                    <span class="assigned-ticket-user__checkmark"></span>
                                </label>
                            </div>
                        </ng-template>
                    </div>
                    <div class="assigned-users-type">
                        <ng-template
                            class="assigned-ticket-user"
                            ngFor
                            let-user
                            [ngForOf]="shareUsersList"
                            let-i="index"
                            [ngForTrackBy]="trackByIndex"
                        >
                            <app-dynamic-tooltip
                                [content]="user.firstName + ' ' + user.lastName"
                                [position]="'top'"
                                #userTooltip
                            ></app-dynamic-tooltip>
                            <div
                                class="assigned-ticket-user__item"
                                *ngIf="user.accountType === 'TECH'"
                                (mouseenter)="userTooltip.show($event.target)"
                                (mouseleave)="userTooltip.hide()"
                            >
                                <div *ngIf="user.avatar">
                                    <img
                                        ng-if="user.avatar"
                                        class="qt-circle default-user-avatar"
                                        [src]="'/users/' + (user.id || 'default') + '/image' + (user.avatar ? '.jpg?t=' + user.avatar.updatedAt : '')"
                                        alt="..."
                                    >
                                </div>
                                <div *ngIf="!user.avatar">
                                    <div class="default-user-avatar avatar-background-color-odd ng-scope">
                                        <span [textContent]="(user.firstName) ? user.firstName[0].toUpperCase() : ''"></span>
                                        <span [textContent]="(user.lastName) ? user.lastName[0].toUpperCase() : ''"></span>
                                    </div>
                                </div>
                                <label>
                                    <input
                                        type="checkbox"
                                        [(ngModel)]="user.selected"
                                    >
                                    <span class="assigned-ticket-user__checkmark"></span>
                                </label>
                            </div>
                        </ng-template>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="qt-df">
            <button
                class="qt-button qt-mr-12"
                appDisabledBtn
                #addBtn="disabled"
                (onClick)="add()"
                *ngIf="!appService.checkMobile()"
            >
                <span *ngIf="!addBtn.isBlock()">Create Ticket</span>
                <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
            </button>
            <button
                class="qt-button --gray"
                (click)="closed()"
            >
                Cancel
            </button>
            <button
                class="qt-button qt-ml-12"
                appDisabledBtn
                #addBtn="disabled"
                (onClick)="add()"
                *ngIf="appService.checkMobile()"
            >
                <span *ngIf="!addBtn.isBlock()">Create Ticket</span>
                <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
            </button>
        </div>
    </div>
</div>
