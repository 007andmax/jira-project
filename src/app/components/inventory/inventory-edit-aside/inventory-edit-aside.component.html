<div
    class="qt-aside-modern --large new-companies-content__modal"
    [hidden]="!opened"
>
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-title">Edit Product</div>
        <div
            class="qt-aside-modern__header-close icon__close"
            (click)="close()"
        ></div>
    </div>
    <div class="qt-aside-modern__content qt-pt-0-important --less-padding new-companies-content__modal--content advanced">
        <div class="col-md-4">
            <mat-error *ngIf="!validate.getManufactureIsExist()">This number is already occupied</mat-error>
            <p>Item Number</p>
            <input
                type="text"
                [(ngModel)]="inventory.manufacture"
                (blur)="onCheckManufacture()"
                placeholder="Enter Item Number"
            >
        </div>
        <div class="col-md-4">
            <mat-error *ngIf="!validate.getILCIsExist()">This number is already occupied</mat-error>
            <p>ILC Number</p>
            <input
                type="text"
                [(ngModel)]="inventory.ilc"
                (blur)="onCheckILC()"
                placeholder="Enter ILC Number"
            >
        </div>
        <div class="col-md-4">
            <p>GL Number</p>
            <app-select-search
                [class]="['light-dropdown']"
                [list]="glNumbers"
                #glNumberSelect
                [add]="true"
                [field]="'glNumber'"
                [placeholder]="'Select GL'"
                [editItem]="inventory.glNumber"
                (onAddItem)="onAddGlNumber($event)"
                (onSelectedItem)="onSelectGlNumbers($event)"
            ></app-select-search>
        </div>
        <div class="col-md-12">
            <mat-error *ngIf="!validate.getDescription()">Description is required</mat-error>
            <p>Description</p>
            <div class="editable-description">
                <textarea
                    appTextArea
                    [limit]="160"
                    id="inventory-description"
                    placeholder="Write Product Description"
                    (input)="onChangeDescription($event)"
                    (onPast)="onPastDescription($event)"
                ></textarea>
            </div>
        </div>
        <div
            class="col-md-6"
            *ngIf="!validate.getCostSale()"
        >
            <mat-error *ngIf="!validate.getCostSale()">Cost cannot be higher than Price</mat-error>
        </div>
        <div class="col-md-4">
            <p>Cost</p>
            <input
                type="text"
                decimalNumber
                [useFixed]="true"
                appToFixed
                (blur)="validate.checkPriceCost(inventory.sale,inventory.cost)"
                [value]="inventory.cost"
                (onChange)="onChangeCost($event)"
                placeholder="Enter Cost"
            >
        </div>
        <div class="col-md-4">
            <p>Markup</p>
            <input
                type="text"
                decimalNumber
                (onChange)="changeMarkup($event)"
                [value]="inventory.markup"
                placeholder="Enter Cost"
            >
        </div>
        <div class="col-md-4">
            <mat-error *ngIf="!validate.getSale()">Price is required</mat-error>
            <p>Price</p>
            <input
                type="text"
                decimalNumber
                [useFixed]="true"
                appToFixed
                [value]="inventory.sale"
                (input)="validate.resetSale()"
                (blur)="validate.checkPriceCost(inventory.sale,inventory.cost)"
                (onChange)="onChangeSale($event)"
                placeholder="Enter Price"
            >
        </div>
        <div class="qt-inputs-row col-md-12">
            <div class="create-product-taxes-select qt-flex-md-100">
                <app-taxes (taxesChange)="onTaxesChange($event)"></app-taxes>
            </div>
        </div>
        <div class="col-md-12">
            <mat-error *ngIf="!validate.getCategory()">Category is required</mat-error>
            <app-drop-down
                #categoriesSelect
                [class]="['light-dropdown', 'qt-select-input-40']"
                [placeholder]="'Select Category'"
                [validate]="validate.getCategory()"
                [errorMessage]="'Category is required'"
                [title]="'Category'"
                [field]="'name'"
                [add]="true"
                [list]="categories"
                [search]="true"
                [change]="true"
                [editItem]="inventory.category"
                (onAddItem)="onAddCategory($event)"
                (onSelectedItem)="onSelectCategory($event)"
            >
            </app-drop-down>
        </div>
        <div class="col-md-12">
            <p>Suppliers</p>
            <app-select-search
                [class]="['light-dropdown']"
                [list]="suppliers"
                #suppliersSelect
                [field]="'name'"
                [placeholder]="'Select Supplier'"
                [editItem]="editSupplier"
                (onSelectedItem)="onSelectSupplier($event)"
            ></app-select-search>
        </div>
        <div class="col-md-12 qt-df qt-ai-c">
            <label
                class="qt-checkbox receive-full-amount-check qt-mb-0 pointer"
                for="inventory-active"
            >
                <input
                    id="inventory-active"
                    type="checkbox"
                    [(ngModel)]="inventory.active"
                >
                <span></span>
            </label>
            <div class="qt-fs-12 qt-ml-5">Set product as active</div>
        </div>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="d-f">
            <button
                class="qt-button qt-mr-12"
                (click)="save()"
            >
                Save Product
            </button>
            <button
                class="qt-button --gray"
                (click)="close()"
            >
                Cancel
            </button>
        </div>
    </div>
</div>
