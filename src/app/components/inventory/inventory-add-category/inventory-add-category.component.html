<div class="add-tax-dropdown">
    <div class="add-tax-dropdown__category">
        <div class="tax-title">Add Category</div>
        <div
            class="qt-input-block qt-mb-24"
            [ngClass]="{'--input-error' : disableCreateCategory}"
        >
            <div class="qt-input-block__label">Category Name</div>
            <input
                placeholder="Enter category name"
                type="text"
                class="qt-input-block__input"
                [(ngModel)]="name"
                (input)="checkDublicateCategory()"
                required
            >
            <mat-error
              class="invalid-feedback"
              *ngIf="disableCreateCategory"
            >
              This category name is already occupied
            </mat-error>
        </div>
        <div class="d-f">
            <button
                class="qt-button qt-mr-12"
                type="submit"
                [disabled]="disableCreateCategory"
                (click)="save()"
            >
                Save
            </button>
            <button
                class="qt-button --gray"
                (click)="close()"
            >
                Cancel
            </button>
        </div>
    </div>
</div>
