<div class="archive-modal">
    <button
        class="close-modal"
        (click)=cancelConfirm()
    ></button>
    <div class="archive-modal__body modal-body">
        <h3>Delete Product</h3>
        <span>
            Are you sure you want to delete this product?
        </span>
        <div class="info-product">
            <h3 [textContent]="inventory.description"></h3>
            <span>Associate with no contracts</span>
        </div>
    </div>
    <div class="archive-modal__footer">
        <div class="d-f qt-jc-fe">
            <button
                class="btn-new btn-primary"
                (click)=approveConfirm()
            >
                Yes, I am sure
            </button>
            <button
                class="btn-new disabled"
                (click)=cancelConfirm()
            >
                Cancel
            </button>
        </div>
    </div>
</div>
