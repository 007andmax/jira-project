<tr>
    <td class="products-table__product-name pre-line">
        <!-- <pre [textContent]="inventory.description"></pre> -->
        <div
            contenteditable="true"
            class="inventory-description-textarea"
            placeholder="Write ticket conversation here…"
            (input)="onChangeDescription($event)"
            (keyup)="onEnterDescription($event)"
            (blur)="onBlurDescription($event)"
        ></div>
    </td>
    <td class="products-table__category">
        <!-- <div [textContent]="inventory.category.name"></div> -->
        <app-drop-down
            #categoriesSelect
            [class]="['qt-select-input-40']"
            [placeholder]="'Select Category'"
            [validate]="validate.getCategory()"
            [errorMessage]="'Category is required'"
            [field]="'name'"
            [add]="true"
            [list]="categories"
            [search]="true"
            [change]="true"
            [isBlockClear]="true"
            [editItem]="inventory.category"
            (onAddItem)="onAddCategory($event)"
            (onSelectedItem)="onSelectCategory($event)"
        >
        </app-drop-down>
    </td>
    <td class="products-table__cost">
        <div
            *ngIf="!getPermissions('VIEW_PRODUCT_COST')"
            [textContent]="'$' + parseTotal(inventory.cost || 0)"
        >
        </div>
        <input
            *ngIf="getPermissions('VIEW_PRODUCT_COST')"
            [ngClass]="{'--input-error' : !validate.getCostSale()}"
            type="text"
            decimalNumber
            [useFixed]="true"
            appToFixed
            (blur)="onBlurCost()"
            [value]="inventory.cost"
            (onChange)="onChangeCost($event)"
            (keyup)="onEnterCost($event)"
            placeholder="Enter Cost"
        >
        <mat-error
            class="qt-tooltip-error"
            *ngIf="!validate.getCostSale()"
        >
            Cost cannot be higher than Price
        </mat-error>
    </td>
    <td class="products-table__sale-price">
        <!-- <div [textContent]="'$' + parseTotal(inventory.sale || 0)"></div> -->
        <input
            class="qt-input-40 inventory-add-body__input"
            type="text"
            [ngClass]="{'--input-error' : !validate.getSale()}"
            decimalNumber
            [useFixed]="true"
            appToFixed
            [value]="inventory.sale"
            (blur)="onBlurSale()"
            (input)="validate.resetSale()"
            (onChange)="changeSales($event)"
            (keyup)="onEnterSale($event)"
            placeholder="Enter Price"
        >
        <mat-error
            class="qt-tooltip-error"
            *ngIf="!validate.getSale()"
        >
            Price is required
        </mat-error>
    </td>
    <td class="products-table__mfg">
        <mat-error
            class="qt-tooltip-error"
            *ngIf="!validate.getManufactureIsExist()"
        >
            This number is already occupied
        </mat-error>
        <input
            type="text"
            [ngClass]="{'--input-error' : !validate.getManufactureIsExist()}"
            class="qt-input-40 inventory-add-body__input"
            [(ngModel)]="inventory.manufacture"
            (blur)="onCheckManufacture()"
            (keyup)="onEnterManufacture($event)"
            placeholder="Enter Item Number"
        >
        <!-- <div [textContent]="inventory.manufacture"></div> -->
    </td>
    <td class="products-table__tac">
        <app-invoice-form-ticket-edit-taxes
            #taxes
            [selectedTax]="getSelectedTaxes()"
            (taxesChange)="onTaxesChange($event)"
        ></app-invoice-form-ticket-edit-taxes>
    </td>
    <td class="products-table__ilc">
        <mat-error
            class="qt-tooltip-error"
            *ngIf="!validate.getILCIsExist()"
        >
            This number is already occupied
        </mat-error>
        <input
            type="text"
            [(ngModel)]="inventory.ilc"
            (blur)="onCheckILC()"
            (keyup)="onEnterILC($event)"
            placeholder="Enter ILC Number"
        >
    </td>
    <td class="products-table__gl">
        <!-- <div [textContent]="getGlNumberName()"></div> -->
        <app-drop-down
            #glNumberSelect
            [class]="['--small-padding']"
            [list]="glNumbers"
            [placeholder]="'Select GL'"
            [container]="'body'"
            [change]="false"
            [editItem]="inventory.glNumber"
            [add]="true"
            [field]="'glNumber'"
            uiType="dark"
            heightInput="32px"
            dropdownWidth="392px"
            [reducerItem]="glDropDownItemName"
            (onAddItem)="onAddGlNumber($event)"
            (onSelectedItem)="onSelectGlNumbers($event)"
        >
        </app-drop-down>
    </td>
    <td class="products-table__menu">
        <div
            *ngIf="getPermissions('MANAGE_PRODUCTS')"
            [container]="'body'"
            [placement]="'bottom-right'"
            ngbDropdown
        >
            <div
                class="qt-ic-c icon__more  qt-pointer qt-sz-16 qt-bg-contain"
                id="dropdownBasic1"
                ngbDropdownToggle
            ></div>
            <ul
                class="qt-dropdown-menu"
                ngbDropdownMenu
                aria-labelledby="dropdownBasic1"
            >
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="edit()"
                >
                    <div class="icon__edit qt-bg-contain  qt-sz-16 qt-mr-8"></div>
                    Edit
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="delete()"
                >
                    <div class="archive-grey-ng2 qt-bg-contain qt-sz-16 qt-mr-8"></div>
                    Delete
                </li>
            </ul>
        </div>
    </td>
</tr>
