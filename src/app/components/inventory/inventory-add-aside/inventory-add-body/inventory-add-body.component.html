<div
    class="qt-aside-modern__content new-companies-content__modal--content advanced create-product"
    [ngClass]="class"
>
    <div class="qt-inputs-row">
        <div class="qt-input-block qt-f50 --required">
            <div class="qt-input-block__label">Item Number</div>
            <input
                type="text"
                [ngClass]="{'--input-error' : !validate.getManufactureIsExist()}"
                class="qt-input-40 inventory-add-body__input"
                [(ngModel)]="inventory.manufacture"
                (blur)="onCheckManufacture()"
                placeholder="Enter Item Number"
            >
            <app-mat-error
                class="invalid-feedback"
                *ngIf="!validate.getManufactureIsExist()"
            >
                This number is already occupied
            </app-mat-error>
        </div>
        <div class="qt-input-block qt-f50 --required">
            <div class="qt-input-block__label">ILC Number</div>
            <input
                type="text"
                class="qt-input-40 inventory-add-body__input"
                [(ngModel)]="inventory.ilc"
                (blur)="onCheckILC()"
                placeholder="Enter ILC Number"
            >
            <app-mat-error
                class="invalid-feedback"
                *ngIf="!validate.getILCIsExist()"
            >
                This number is already occupied
            </app-mat-error>
        </div>
    </div>
    <div class="qt-inputs-row">
        <div class="qt-input-block --required">
            <app-drop-down
                #categoriesSelect
                [class]="['qt-select-input-40']"
                [placeholder]="'Select Category'"
                [validate]="validate.getCategory()"
                [errorMessage]="'Category is required'"
                [title]="'Category'"
                [field]="'name'"
                [add]="true"
                [list]="categories"
                [search]="true"
                [change]="true"
                (onAddItem)="onAddCategory($event)"
                (onSelectedItem)="onSelectCategory($event)"
            >
            </app-drop-down>
        </div>
    </div>
    <div class="qt-inputs-row">
        <div class="qt-input-block --required">
            <app-drop-down
                #typeSelect
                [class]="['qt-select-input-40']"
                [placeholder]="'Select Type'"
                [title]="'Product Type'"
                [field]="'title'"
                [list]="listTypes"
                [search]="true"
                [change]="true"
                (onSelectedItem)="onSelectProuctType($event)"
            >
            </app-drop-down>
        </div>
    </div>
    <div class="qt-inputs-row --required">
        <div class="qt-input-block">
            <div class="qt-input-block__label">Description</div>
            <div
                class="editable-description"
                [ngClass]="{'--input-error' : !validate.getDescription()}"
            >
                <textarea
                    appTextArea
                    [height]="'100px'"
                    rows="5"
                    id="inventory-description"
                    placeholder="Write Product Description"
                    (input)="onChangeDescription($event)"
                    (paste)="onPastDescription($event)"
                ></textarea>
            </div>
            <app-mat-error
                class="invalid-feedback"
                *ngIf="!validate.getDescription()"
            >
                Description is required
            </app-mat-error>
        </div>
    </div>
    <div class="qt-inputs-row">
        <div class="qt-f33 qt-input-block --required">
            <div class="qt-input-block__label">Cost</div>
            <input
                class="qt-input-40 inventory-add-body__input"
                [ngClass]="{'--input-error' : !validate.getCostSale()}"
                type="text"
                decimalNumber
                [useFixed]="true"
                appToFixed
                (blur)="validate.checkPriceCost(inventory.sale,inventory.cost)"
                (onChange)="changeCost($event)"
                [value]="inventory.cost"
                placeholder="Enter Cost"
            >
            <app-mat-error
                class="invalid-feedback --pos-static"
                *ngIf="!validate.getCostSale()"
            >
                Cost cannot be higher than Price
            </app-mat-error>
        </div>
        <div class="qt-f33 qt-input-block --required">
            <div class="qt-input-block__label">Markup %</div>
            <input
                class="qt-input-40 inventory-add-body__input"
                type="text"
                decimalNumber
                (blur)="validate.checkPriceCost(inventory.sale,inventory.cost)"
                (onChange)="changeMarkup($event)"
                [value]="inventory.markup"
                placeholder="Enter Markup"
            >
        </div>
        <div class="qt-f33 qt-input-block --required">
            <div class="qt-input-block__label">Price</div>
            <input
                class="qt-input-40 inventory-add-body__input"
                type="text"
                [ngClass]="{'--input-error' : !validate.getSale()}"
                decimalNumber
                [useFixed]="true"
                appToFixed
                [value]="inventory.sale"
                (blur)="validate.checkPriceCost(inventory.sale,inventory.cost)"
                (input)="validate.resetSale()"
                (onChange)="changeSales($event)"
                placeholder="Enter Price"
            >
            <app-mat-error
                class="invalid-feedback"
                *ngIf="!validate.getSale()"
            >
                Price is required
            </app-mat-error>
        </div>
    </div>
    <div class="qt-inputs-row">
        <div>
            <app-taxes
                #taxesDp
                [selectedTax]="defaultSelectedTax"
                (taxesChange)="onTaxesChange($event)"
            ></app-taxes>
        </div>
    </div>
    <div class="qt-inputs-row">
        <div class="--required">
            <div class="qt-input-block__label">GL Number</div>
            <app-drop-down
                [class]="['light-dropdown', 'new-product-gl-select', 'qt-select-input-40']"
                [list]="glNumbers"
                [reducerItem]="formatterGLNumber"
                [reducerSelectedItem]="formatterSeletedGLNumber"
                #glNumberSelect
                [placeholder]="'Select GL'"
                [add]="true"
                [field]="'glNumber'"
                (onAddItem)="onAddGlNumber($event)"
                (onSelectedItem)="onSelectGlNumbers($event)"
            ></app-drop-down>
        </div>
    </div>
    <div class="qt-inputs-row">
        <div class="select-open-top">
            <div class="qt-input-block__label">Suppliers</div>
            <app-drop-down
                [class]="['light-dropdown', 'qt-select-input-40']"
                [list]="suppliers"
                [field]="'name'"
                [placeholder]="'Select Supplier'"
                #suppliersSelect
                (onSelectedItem)="onSelectSupplier($event)"
            ></app-drop-down>
        </div>
    </div>
    <div class="qt-inputs-row qt-df qt-ai-c">
        <label
            class="qt-checkbox receive-full-amount-check qt-mb-0 pointer"
            for="inventory-add-active"
        >
            <input
                id="inventory-add-active"
                type="checkbox"
                [(ngModel)]="inventory.active"
            >
            <span></span>
            <div class="qt-ml-8">Set product as active</div>
        </label>
    </div>
</div>
<div class="qt-aside-modern__footer">
    <div class="qt-df qt-w100">
        <button
            class="qt-button --gray qt-mr-12 qt-w100 qt-jc-c"
            (click)="close()"
        >
            Cancel
        </button>
        <button
            class="qt-button qt-w100 qt-jc-c"
            appDisabledBtn
            #addBtn="disabled"
            (onClick)="add()"
            [ngClass]="{'--loading':addBtn.isBlock()}"
        >
            <span>Create Product</span>
            <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
        </button>
    </div>
</div>
