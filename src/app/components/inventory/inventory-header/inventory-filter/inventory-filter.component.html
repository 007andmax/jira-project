<div class="qt-page-list__header-filters">
    <app-drop-down
        #categoriesSelect
        [sort]="true"
        class="products-page__category-btn qt-mr-8"
        [heightInput]="'36px'"
        [placeholder]="'Select Category'"
        [list]="categories"
        [field]="'name'"
        [search]="true"
        [change]="true"
        (onSelectedItem)="onSelectCategory($event)"
    ></app-drop-down>
    <div class="inventory-add-category qt-pos-rel qt-mr-8">
        <button
            class="qt-button --md"
            (click)="showAddCategory = true"
        >
            Add Category
        </button>
        <inventory-add-category
            *ngIf="showAddCategory"
            (onClose)="showAddCategory = false"
        ></inventory-add-category>
    </div>
    <app-drop-down
        #productTypeSelect
        class="products-page__category-btn qt-mr-8"
        [placeholder]="'Select Product Type'"
        [field]="'title'"
        [list]="listTypes"
        [search]="true"
        [change]="true"
        (onSelectedItem)="onSelectProuctType($event)"
    ></app-drop-down>
    <app-drop-down
        class="active-drop-down qt-mr-8"
        [placeholder]="'Select Active'"
        [editItem]="selectedActive"
        [list]="listActive"
        [field]="'title'"
        [search]="true"
        [change]="true"
        [isBlockClear]="true"
        (onSelectedItem)="selectActive($event)"
        heightInput="36px"
    ></app-drop-down>
      <app-drop-down
      #lastSoldDb
        class="active-drop-down"
        [placeholder]="'Select Interval'"
        [list]="lastSold"
        [field]="'title'"
        [search]="true"
        [sort]="false"
        [change]="true"
        (onSelectedItem)="selectLastSold($event)"
        heightInput="36px"
        dropdownHeight="200px"
    ></app-drop-down>
</div>
