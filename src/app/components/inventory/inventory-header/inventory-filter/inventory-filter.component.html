<div class="left-panel-ng2__content--filters aside-filters-content__main">
    <div class="content-filters-header">
        <div
            class="qt-icon icon__close qt-icon__white qt-sz-20"
            (click)="close()"
        ></div>
        <div class="content-filters-header__title pointer">Filters</div>
    </div>
    <app-drop-down
        #categoriesSelect
        [sort]="true"
        class="products-page__category-btn qt-mr-8"
        [heightInput]="'36px'"
        [placeholder]="'Select Category'"
        [list]="categories"
        [field]="'name'"
        [search]="true"
        [change]="true"
        (onSelectedItem)="onSelectCategory($event)"
    ></app-drop-down>
   <div class="inventory-add-category qt-pos-rel qt-mr-8">
        <button
            class="qt-button --md"
            (click)="showAddCategory = true"
        >
            Add Category
        </button>
        <inventory-add-category
            *ngIf="showAddCategory"
            (onClose)="showAddCategory = false"
        ></inventory-add-category>
    </div>
    <app-drop-down
        #productTypeSelect
        class="products-page__category-btn qt-mr-8"
        [placeholder]="'Select Product Type'"
        [field]="'title'"
        [list]="listTypes"
        [search]="true"
        [change]="true"
        (onSelectedItem)="onSelectProuctType($event)"
    ></app-drop-down>
    <app-drop-down
        class="active-drop-down qt-mr-8"
        [placeholder]="'Select Active'"
        [editItem]="selectedActive"
        [list]="listActive"
        [field]="'title'"
        [search]="true"
        [change]="true"
        [isBlockClear]="true"
        (onSelectedItem)="selectActive($event)"
        heightInput="36px"
    ></app-drop-down>
      <app-drop-down
      #lastSoldDb
        class="last-sold-drop-down"
        [placeholder]="'Select Interval'"
        [list]="lastSold"
        [field]="'title'"
        [search]="true"
        [sort]="false"
        [change]="true"
        (onSelectedItem)="selectLastSold($event)"
        heightInput="36px"
        dropdownHeight="200px"
    ></app-drop-down>
</div>
<div class="aside-filters-content__footer">
    <div class="qt-df">
        <button
            class="qt-button --md --gray qt-mr-12 qt-w100 qt-jc-c"
            (click)="onClearAll()"
        >
            Clear All
        </button>
        <button
            class="qt-button --md qt-w100 qt-jc-c"
            (click)="applyFilters()"
        >
            Apply
        </button>
    </div>
</div>
