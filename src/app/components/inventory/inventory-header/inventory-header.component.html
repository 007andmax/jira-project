<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line">
        <div class="qt-page-list__header-title-line--left">
            <h6
                class="qt-page-list__header-title"
                [textContent]="'Products'"
            ></h6>
        </div>
        <div class="qt-page-list__header-title-line--right">
            <div class="qt-df qt-ai-c">
                <div
                    class="company-devices-page__list-header-buttons qt-fs-0 qt-mr-8"
                    *ngIf="getCountSelected() > 0"
                >
                    <div
                        class="qt-fs-0"
                        [textContent]="getCountSelected() + ' Products Selected'"
                    ></div>
                    <div
                        class="qt-ml-20 qt-fw-500 qt-df qt-ai-c qt-color-info qt-ai-c qt-pointer qt-fs-0"
                        (click)="setProductType()"
                    >
                        <div class="qt-lh-1">Set Product Type</div>
                    </div>
                    <div
                        class="qt-ml-20 qt-fw-500 qt-df qt-ai-c qt-color-info qt-ai-c qt-pointer qt-fs-0"
                        (click)="setActive()"
                    >
                        <div
                            class="qt-lh-1"
                            [textContent]="parseMarkSelectedProducts()"
                        ></div>
                    </div>
                </div>
                 <div class="password-add-category qt-pos-rel">
                    <button
                        class="plus-btn qt-mr-8"
                          (click)="showAddCategory = true"
                    >
                        +
                    </button>
                    <inventory-add-category
            *ngIf="showAddCategory"
            (onClose)="showAddCategory = false"
        ></inventory-add-category>
                </div>
                <div class="qt-input-search">
                    <input
                        type="text"
                        placeholder="Search Products…"
                        (blur)="onBlurSearch($event)"
                        (keyup)="onKeyUp($event)"
                        [(ngModel)]="productSearchName"
                    >
                </div>
                <button
                    class="qt-button --gray --md qt-ml-8"
                    (click)="clearAll()"
                    *ngIf="countFilter > 0"
                >
                    Clear All
                </button>
                <button
                    class="qt-button qt-button-filter --gray --md qt-df qt-ml-8"
                    [ngClass]="{'active':!toggleFilter}"
                  (click)="onToggleFilters(!toggleFilter)"
                >
                    <span class="qt-icon icon__filter qt-sz-16 qt-bg-contain qt-dib qt-mr-8"></span>
                    <span [textContent]="getTextCountFilters()"></span>
                </button>
                <button
                    class="qt-button --gray --md qt-ml-8"
                    *ngIf="getPermissions('MANAGE_PRODUCTS')"
                    (click)="addProduct()"
                >
                    Create Product
                </button>
            </div>
        </div>
    </div>
   
</div>
