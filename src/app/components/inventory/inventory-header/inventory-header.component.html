<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line">
        <div class="qt-page-list__header-title-line--left">
            <h6
                class="qt-page-list__header-title"
                [textContent]="'Products'"
            ></h6>
        </div>
        <div class="qt-page-list__header-title-line--rigth">
            <div class="qt-df qt-ai-c">
                <div
                    class="company-devices-page__list-header-buttons qt-fs-0 qt-mr-8"
                    *ngIf="getCountSelected() > 0"
                >
                    <div
                        class="qt-fs-0"
                        [textContent]="getCountSelected() + ' Products Selected'"
                    ></div>
                    <div
                        class="qt-ml-20 qt-fw-500 qt-df qt-ai-c qt-color-info qt-ai-c qt-pointer qt-fs-0"
                        (click)="setProductType()"
                    >
                        <div class="qt-lh-1">Set Product Type</div>
                    </div>
                    <div
                        class="qt-ml-20 qt-fw-500 qt-df qt-ai-c qt-color-info qt-ai-c qt-pointer qt-fs-0"
                        (click)="setActive()"
                    >
                        <div
                            class="qt-lh-1"
                            [textContent]="parseMarkSelectedProducts()"
                        ></div>
                    </div>
                </div>
                <div class="qt-input-search">
                    <input
                        type="text"
                        placeholder="Search Products…"
                        (blur)="onBlurSearch($event)"
                        (keyup)="onKeyUp($event)"
                        [(ngModel)]="productSearchName"
                    >
                </div>
                <button
                    class="qt-button qt-button-filter --md qt-df qt-ml-8"
                    [ngClass]="{'active':!toggleFilter}"
                    (click)="toggleFilter = !toggleFilter"
                >
                    Filters
                </button>
                <button
                    class="qt-button --gray --md qt-ml-8"
                    *ngIf="getPermissions('MANAGE_PRODUCTS')"
                    (click)="addProduct()"
                >
                    Create Product
                </button>
            </div>
        </div>
    </div>
    <inventory-filter
        [hidden]="toggleFilter"
        (onResetSelected)="resetSelected()"
    ></inventory-filter>
    <div class="qt-page-list__header-thead-container">
        <div class="qt-table-modern qt-page-list__header-thead">
            <div class="qt-table-modern qt-page-list__header-thead">
                <div class="qt-page-list__header-thead__row">
                    <div class="companies-table__check">
                        <div class="qt-df qt-jc-fe">
                            <label class="qt-checkbox">
                                <input
                                    type="checkbox"
                                    class="ng-untouched ng-pristine ng-valid"
                                    [(ngModel)]="selectAll"
                                    (change)="toggleAllCompanies($event)"
                                >
                                <span></span>
                            </label>
                        </div>
                    </div>
                    <div
                        class="products-table__product-name pointer"
                        (click)="filter('description')"
                    >
                        Product Name
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div
                        class="products-table__category pointer"
                        (click)="filter('category')"
                    >
                        Category
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div
                        class="products-table__cost pointer"
                        (click)="filter('cost')"
                        *ngIf="getPermissions('VIEW_PRODUCT_COST')"
                    >
                        Cost
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div
                        class="products-table__cost pointer"
                        (click)="filter('markup')"
                    >
                        Markup
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div
                        class="products-table__sale-price pointer"
                        (click)="filter('sale')"
                    >
                        Sale Price
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div
                        class="products-table__mfg pointer"
                        (click)="filter('manufacture')"
                    >
                        #Mfg
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div class="products-table__tac">Tax</div>
                    <div
                        class="products-table__ilc pointer"
                        (click)="filter('ilc')"
                    >
                        ILC
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div
                        class="products-table__gl pointer"
                        (click)="filter('glNumber')"
                    >
                        GL
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div
                        class="products-table__product-type pointer"
                        (click)="filter('productType')"
                    >
                        Product Type
                        <span class="qt-table-modern__sorting"></span>
                    </div>
                    <div class="products-table__menu pointer"></div>
                </div>
            </div>
        </div>
    </div>
</div>
