<div class="archive-modal de-archive">
    <button
        class="close-modal"
        (click)=cancelConfirm()
    ></button>
    <div class="archive-modal__body">
        <h3>Delete Product</h3>
        <p>
            You can’t delete a product that associate with contracts, Please remove the product from following contracts before you delete it.
        </p>
        <div class="contract-container qt-mt-16">
            <h3 [textContent]="inventory.description"></h3>
            <p [textContent]="'Associate with ' + agreements.length + ' following contracts'"></p>
            <div class="contract-container-agreements qt-mt-12">
                <ng-template
                    ngFor
                    let-agreement
                    let-i="index"
                    [ngForOf]="agreements"
                    [ngForTrackBy]="trackById"
                >
                    <div class="contract-item">
                        <div
                            class="qt-table-modern__circle-avatar qt-mr-8"
                            [textContent]="getNameForAvatar(getCompanyName(agreement.companyId))"
                            [ngStyle]="{'background': ticketsListService.getStyleAvatar(null,listColorNoAvatar[getIndexNoAvatar(i)]) }"
                        ></div>
                        <div class="contract-item-info">
                            <h3 [textContent]="getCompanyName(agreement.companyId)"></h3>
                            <span [textContent]="agreement.description"></span>
                        </div>
                        <span
                            class="view-contract pointer"
                            (click)="showContract(agreement)"
                        >
                            View Contract
                        </span>
                    </div>
                </ng-template>
            </div>
        </div>
    </div>
</div>
