<div class="archive-modal de-archive">
    <button
        class="close-modal"
        (click)=cancelConfirm()
    ></button>
    <div class="archive-modal__body">
        <h3>Delete Product</h3>
        <p>
            You can’t delete a product that associate with contracts, Please remove the product from following contracts before you delete it.
        </p>
        <div class="contract-container">
            <h3 [textContent]="inventory.description"></h3>
            <p [textContent]="'Associate with ' + agreements.length + ' following contracts'"></p>
            <ng-template
                ngFor
                let-agreement
                [ngForOf]="agreements"
                [ngForTrackBy]="trackById"
            >
                <div class="contract-item">
                    <h3 [textContent]="getCompanyName(agreement.companyId)"></h3>
                    <span [textContent]="agreement.description"></span>
                    <span (click)="showContract(agreement)">View Contract</span>
                </div>
            </ng-template>
        </div>
    </div>
    <div class="archive-modal__footer">
        <div class="d-f">
            <button
                class="btn-new btn-primary"
                (click)=approveConfirm()
            >
                Yes, I am sure
            </button>
            <button
                class="btn-new disabled"
                (click)=cancelConfirm()
            >
                Cancel
            </button>
        </div>
    </div>
</div>
