<div class="content-filters-header">
    <div
        class="icon__close-white qt-sz-20 qt-bg-contain"
        (click)="close()"
    ></div>
    <div class="content-filters-header__title pointer">Filters</div>
</div>
<app-drop-down
    #typesDp
    class="filter-category type qt-mr-8 dropdown"
    [placeholder]="'By Types'"
    [list]="companyTypes"
    [field]="'title'"
    [search]="true"
    [change]="true"
    [sort]="false"
    [heightInput]="'36px'"
    [widthInput]="'22%'"
    (onSelectedItem)="onSelectType($event)"
></app-drop-down>
<app-drop-down
    #personsDp
    class="filter-category sales-person qt-mr-8 dropdown"
    [placeholder]="'Search By Sales Person'"
    [list]="listPersons"
    [field]="'name'"
    [search]="true"
    [change]="true"
    [heightInput]="'36px'"
    [widthInput]="'22%'"
    (onSelectedItem)="onSelectTechLead($event)"
></app-drop-down>
<app-drop-down
    #industriesDp
    class="filter-category industry qt-mr-8 dropdown"
    [placeholder]="'Search By Industry'"
    [field]="'name'"
    [list]="industries"
    [search]="true"
    [change]="true"
    [heightInput]="'36px'"
    [widthInput]="'22%'"
    (onSelectedItem)="onSelectClientIndustry($event)"
></app-drop-down>
<app-company-tags
    #tagsDp
    [filter]="true"
    class="filter-category tags dropdown companies-filter-tags"
    (tagsChange)="onChangeTags($event)"
></app-company-tags>
<div class="qt-aside-modern__footer">
    <div class="qt-df qt-w100">
        <button
            class="qt-button --gray qt-mr-12"
            (click)="onClearAll()"
        >
            Clear All
        </button>
        <button
            class="qt-button"
            (click)="applyFilters()"
        >
            Apply Filters
        </button>
    </div>
</div>
