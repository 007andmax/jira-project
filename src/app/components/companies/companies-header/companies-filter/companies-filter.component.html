<div class="aside-filters-content__main">
  <app-drop-down
    #typesDp
    class="filter-category type dropdown"
    [placeholder]="'By Types'"
    [list]="companyTypes"
    [field]="'title'"
    [search]="true"
    [change]="true"
    [sort]="false"
    (onSelectedItem)="onSelectType($event)"
  ></app-drop-down>
  <app-drop-down
    #personsDp
    class="filter-category sales-person dropdown"
    [placeholder]="'Search By Sales Person'"
    [list]="listPersons"
    [field]="'name'"
    [search]="true"
    [change]="true"
    (onSelectedItem)="onSelectTechLead($event)"
  ></app-drop-down>
  <app-drop-down
    #industriesDp
    class="filter-category industry dropdown"
    [placeholder]="'Search By Industry'"
    [field]="'name'"
    [list]="industries"
    [search]="true"
    [change]="true"
    (onSelectedItem)="onSelectClientIndustry($event)"
  ></app-drop-down>
  <app-company-tags
    #tagsDp
    [filter]="true"
    class="filter-category tags dropdown companies-filter-tags"
    (tagsChange)="onChangeTags($event)"
  ></app-company-tags>
</div>
<div class="aside-filters-content__footer">
  <div class="qt-df qt-w100">
    <button
      class="qt-button --gray qt-mr-12"
      (click)="onClearAll()"
    >
      Clear All
    </button>
    <button
      class="qt-button"
      (click)="applyFilters()"
    >
      Apply
    </button>
  </div>
</div>
