<div class="aside-filters-content__main">
    <app-drop-down
        #typesDp
        class="filter-category type dropdown"
        [placeholder]="'Select Type'"
        [list]="companyTypes"
        [field]="'title'"
        [title]="'Types'"
        [search]="true"
        [change]="true"
        [sort]="false"
        (onSelectedItem)="onSelectType($event)"
    ></app-drop-down>
    <app-drop-down
        #personsDp
        class="filter-category sales-person dropdown"
        [placeholder]="'Select Sales person'"
        [list]="listPersons"
        [field]="'name'"
        [title]="'Sales Person'"
        [search]="true"
        [change]="true"
        (onSelectedItem)="onSelectTechLead($event)"
    ></app-drop-down>
    <app-drop-down
        #industriesDp
        class="filter-category industry dropdown"
        [placeholder]="'Select Industry'"
        [field]="'name'"
        [title]="'Industry'"
        [list]="industries"
        [search]="true"
        [change]="true"
        (onSelectedItem)="onSelectClientIndustry($event)"
    ></app-drop-down>
    <div class="qt-inputs-row">
        <div class="qt-inputs-block">
            <div class="qt-input-block__label">Tags</div>
            <app-company-tags
                #tagsDp
                [filter]="true"
                [placeholder]="'Select Tag'"
                class="filter-category tags dropdown companies-filter-tags"
                (tagsChange)="onChangeTags($event)"
            ></app-company-tags>
        </div>
    </div>
</div>
<div class="aside-filters-content__footer">
    <div class="qt-df qt-w100">
        <button
            class="qt-button --gray qt-mr-12"
            (click)="onClearAll()"
        >
            Clear All
        </button>
        <button
            class="qt-button"
            (click)="applyFilters()"
        >
            Apply
        </button>
    </div>
</div>
