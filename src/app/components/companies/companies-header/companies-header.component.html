<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line qt-mb-16">
        <div class="qt-page-list__header-title-line--left">
            <h6 class="qt-page-list__header-title">
                All Companies ({{calculateCount.getCurrent()}})
            </h6>
        </div>
        <div class="qt-page-list__header-title-line--rigth">
            <div class="qt-input-search qt-ml-8">
                <!-- *ngIf="getSelectedCount() === 0" -->
                <input
                    type="text"
                    placeholder="Search company"
                    [(ngModel)]="searchText"
                    (keyup)="onKeyUp($event)"
                >
                <span
                    class="search-clear qt-icon icon__close-round qt-icon__gray-400"
                    *ngIf="searchText.length > 0"
                    (click)="clearSearch()"
                ></span>
            </div>
            <div
                class="new-companies-content__header-buttons"
                *ngIf="getCountSelected() > 0"
            >
                <div class="new-companies-content__header-buttons-top">
                    <div [textContent]="getCountSelected() + ' Selected'"></div>
                </div>
                <div class="new-companies-content__header-buttons-bottom">
                    <div
                        class="qt-df qt-mr-16"
                        (click)="showAsideForDraftEmail()"
                    >
                        <div class="qt-icon icon__email qt-icon__blue-light-600 qt-za-16 qt-sz-16 qt-mr-6"></div>
                        Write Draft
                    </div>
                    <div
                        class="qt-df"
                        *ngIf="getCountSelected() === 1"
                        (click)="archive()"
                    >
                        <div class="qt-icon icon__delete qt-icon__red-600 qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"></div>
                        Archive Company
                    </div>
                </div>
            </div>
            <div class="new-companies-content__header--search">
                <div class="new-companies-selected">
                    <div class="new-companies-selected-qty">
                        <span>2</span>
                        Selected
                    </div>
                    <div class="new-companies-selected-actions">
                        <i class="icn-16 qt-icon icon__email qt-icon__blue-light-600"></i>
                    </div>
                </div>
                <button
                    class="qt-btn --transparent"
                    (click)="clearAll()"
                    *ngIf="countFilter > 0"
                >
                    Clear All
                </button>
                <button
                    class="qt-btn btn-filter qt-mr-8 qt-ml-8 qt-df"
                    [ngClass]="{'active':toggleFilter,
                 'is-exist-filters':isExistFilters()}"
                    (click)="onToggleFilter(!toggleFilter)"
                >
                    <span
                        class="filter-counter qt-circle qt-sz-18 qt-ff-sb qt-fs-10 qt-color-white qt-bg-info qt-mr-8 qt-df qt-ai-c qt-jc-c"
                        *ngIf="countFilter > 0"
                        [textContent]="countFilter"
                    ></span>
                    <span>Filters</span>
                </button>
                <button
                    class="qt-button --gray --md qt-mr-8"
                    uib-tooltip="Draft email"
                    tooltip-placement="top"
                    (click)="showAsideForDraftEmail()"
                >
                    <span class="qt-icon icon__email qt-sz-16 qt-bg-contain qt-dib qt-mr-8 qt-button-icon"></span>
                    Send email
                </button>
                <button
                    class="new-link qt-d-none"
                    style="font-size: 13px;"
                    (click)="showAsideForAdd()"
                    *ngIf="getPermissions('CREATE_COMPANIES')"
                >
                    Add Company
                </button>
                <button
                    *ngIf="getPermissions('CREATE_COMPANIES')"
                    class="qt-button --md --gray qt-fs-0"
                    (click)="showAsideForAdd()"
                >
                    Add Company
                </button>
            </div>
        </div>
    </div>
    <div class="qt-page-list__header-filters">
        <companies-filter
            class="qt-w100"
            #filter
            (changeCountFilter)="onChangeCountFilter($event)"
            (onClose)="onToggleFilter(false)"
            [hidden]="!toggleFilter"
        ></companies-filter>
    </div>
    <div class="qt-page-list__header-thead-container">
        <div class="qt-table-modern qt-page-list__header-thead">
            <div class="qt-page-list__header-thead__row">
                <div class="companies-table__check">
                    <div class="qt-df qt-jc-fe">
                        <label class="qt-checkbox">
                            <input
                                type="checkbox"
                                class="ng-untouched ng-pristine ng-valid"
                                [(ngModel)]="selectAll"
                                (change)="toggleAllCompanies($event)"
                            >
                            <span></span>
                        </label>
                    </div>
                </div>
                <div
                    class="companies-table__name pointer"
                    (click)="onFilter('name')"
                >
                    Name
                </div>
                <div
                    class="companies-table__address pointer"
                    (click)="onFilter('address')"
                >
                    Address
                    <div class="qt-table-modern__sorting"></div>
                </div>
                <div
                    class="companies-table__primary-contact pointer"
                    (click)="onFilter('primary_contact')"
                >
                    Primary Contact
                    <div class="qt-table-modern__sorting"></div>
                </div>
                <div
                    class="companies-table__email-address pointer"
                    (click)="onFilter('email')"
                >
                    Email Address
                    <div class="qt-table-modern__sorting"></div>
                </div>
                <div
                    class="companies-table__tickets pointer"
                    (click)="onFilter('tickets')"
                >
                    Tickets
                    <div class="qt-table-modern__sorting"></div>
                </div>
                <div
                    class="companies-table__devices pointer"
                    (click)="onFilter('devices')"
                >
                    Devices
                    <div class="qt-table-modern__sorting"></div>
                </div>
                <div
                    class="companies-table__users pointer"
                    (click)="onFilter('users')"
                >
                    Users
                    <div class="qt-table-modern__sorting"></div>
                </div>
                <div class="companies-table__download-btn  pointer"></div>
                <div class="companies-table__menu pointer"></div>
            </div>
        </div>
    </div>
</div>
