<div
    class="pointer qt-table-modern__row"
    [ngClass]="(showNotificationReview) ? 'documents-no-valid' : ''"
    (click)="showTemplate()"
>
    <div
        class="documents-table__title ellipsis"
        (click)="navigateToCategory()"
        [ngClass]="{'pointer':item.isCategory}"
    >
        <div class="documents-table__title-menu ellipsis">
            <div
                class="qt-sz-16 qt-bg-contain qt-mr-8 qt-fs-0"
                [ngClass]="{ 'qt-icon icon__documents':item.documentType === 'TEMPLATE',
            'icon__templete-thumb':item.documentType === 'DOCUMENT'}"
            ></div>
            <div
                class="title ellipsis"
                [textContent]="item.isCategory ? item.categoryName : item.title"
            ></div>
        </div>
    </div>
    <div
        class="documents-table__create-by ellipsis"
        [textContent]="item.isCategory ? '' : getCreateBy()"
        (click)="navigateToCategory()"
        [ngClass]="{'pointer':item.isCategory}"
    ></div>
    <div
        class="documents-table__created-date ellipsis"
        [textContent]="item.isCategory ? '' : parseCreateAt()"
        (click)="navigateToCategory()"
        [ngClass]="{'pointer':item.isCategory}"
    ></div>
    <div
        class="documents-table__review-date ellipsis"
        [textContent]="item.isCategory ? '' : parseReviewAt()"
        (click)="navigateToCategory()"
        [ngClass]="{'pointer':item.isCategory}"
    ></div>
    <div
        class="documents-table__company ellipsis"
        (click)="navigateToCategory()"
        [ngClass]="{'pointer':item.isCategory}"
    >
        <div
            class="ellipsis"
            [textContent]="item.isCategory ? '' : getCompanies()"
        ></div>
    </div>
    <div
        class="documents-table__menu"
        (click)="$event.stopPropagation();"
    >
        <div
            ngbDropdown
            [container]="'body'"
        >
            <div
                *ngIf="!item.isCategory && (getPermissions('EDIT_DOCUMENT') || getPermissions('CREATE_DOCUMENT') || getPermissions('VIEW_DOCUMENT') || getPermissions('DELETE_DOCUMENT')) || item.isCategory"
                class="qt-ic-c qt-icon icon__more qt-pointer qt-sz-16 qt-bg-contain"
                id="dropdownBasic1"
                ngbDropdownToggle
            ></div>
            <ul
                class="qt-dropdown-menu"
                ngbDropdownMenu
                *ngIf="item.isCategory"
                aria-labelledby="dropdownBasic1"
            >
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="goToAddDocumentInCategory()"
                    *ngIf="getPermissions('CREATE_DOCUMENT')"
                >
                    <div class="qt-icon icon__add-document qt-sz-20 qt-mr-12"></div>
                    Add New Document
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="removeCategory()"
                >
                    <div class="qt-icon icon__delete qt-sz-20 qt-bg-contain qt-mr-12"></div>
                    Delete
                </li>
            </ul>
            <ul
                class="qt-dropdown-menu"
                ngbDropdownMenu
                *ngIf="!item.isCategory"
                aria-labelledby="dropdownBasic1"
            >
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="goToEditDocument()"
                    *ngIf="getPermissions('EDIT_DOCUMENT')"
                >
                    <div class="qt-icon icon__edit qt-sz-20 qt-bg-contain qt-mr-12"></div>
                    Edit
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="goToCloneDoucment()"
                    *ngIf="getPermissions('CREATE_DOCUMENT')"
                >
                    <div class="icon__clone-document qt-sz-20 qt-bg-contain qt-mr-12"></div>
                    Clone Document
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="printPdf()"
                    *ngIf="getPermissions('VIEW_DOCUMENT')"
                >
                    <div class="qt-icon icon__print qt-sz-20 qt-bg-contain qt-mr-12"></div>
                    Print
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="exportPdf()"
                    *ngIf="getPermissions('VIEW_DOCUMENT')"
                >
                    <div class="qt-icon icon__download qt-sz-20 qt-bg-contain qt-mr-12"></div>
                    Export PDF
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    (click)="previewDocument()"
                    *ngIf="getPermissions('VIEW_DOCUMENT')"
                >
                    <div class="qt-icon icon__external-link qt-sz-20 qt-mr-12"></div>
                    Open in new tab
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    class="remove-item"
                    (click)="removeDocument()"
                    *ngIf="getPermissions('DELETE_DOCUMENT')"
                >
                    <div class="qt-icon icon__delete qt-sz-20 qt-bg-contain qt-mr-12"></div>
                    Delete
                </li>
            </ul>
        </div>
    </div>
</div>
