<div class="qt-page-list documents-page --sticky-breadcrumbs">
    <documents-header
        #header
        [companyId]="companyId"
        [showAssignedCompanies]="false"
        (onChangeFilterField)="onFilter($event)"
    ></documents-header>
    <div class="qt-page-list__body">
        <div class="qt-page-list__body-table-container">
            <div class="qt-page-list__body-tbody qt-table-modern documents-table">
                <div class="tbody">
                    <ng-template
                        ngFor
                        let-item
                        [ngForOf]="list"
                        [ngForTrackBy]="trackById"
                    >
                        <company-documents-table
                            [companyId]="companyId"
                            [item]="item"
                            (onRemoveCategory)="onRemoveCategory($event)"
                            (onRemoveDocument)="onRemoveDocument($event)"
                        >
                        </company-documents-table>
                    </ng-template>
                </div>
            </div>
            <div
                class="loading"
                *ngIf="showPreloader"
            ></div>
            <div
                class="no-exist-documents"
                *ngIf="!showPreloader && list.length === 0"
            >
                No documents
            </div>
        </div>
    </div>
</div>
<documents-templates-info></documents-templates-info>
