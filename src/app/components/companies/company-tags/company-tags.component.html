<div
    class="col-md-12"
    [placement]="placement"
    ngbDropdown
    #products="ngbDropdown"
>
    <mat-form-field>
        <mat-chip-list
            #chipList
            aria-label="Fruit selection"
        >
            <mat-chip
                *ngFor="let tag of selectedTag; let i = index"
                [selectable]="selectable"
                [removable]="removable"
                (removed)="remove(i)"
            >
                {{tag.word}}
                <mat-icon
                    matChipRemove
                    *ngIf="removable"
                >
                    cancel
                </mat-icon>
            </mat-chip>
            <input
                id="dropdownServices"
                ngbDropdownToggle
                placeholder="eg. Window update, Monthly maintainace"
                #userInput
                class="pointer"
                [formControl]="tagCtrl"
                [matChipInputFor]="chipList"
                [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                [matChipInputAddOnBlur]="addOnBlur"
                (input)="onSearch($event)"
                (keyup)="onKeyUp($event)"
            >
        </mat-chip-list>
    </mat-form-field>
    <div
        class="dropdown-menu"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <ng-template
            ngFor
            let-tag
            [ngForOf]="tags"
            [ngForTrackBy]="trackById"
        >
          <label
            class="qt-checkbox pointer"
            ngbDropdownItem
            (click)="selected(tag)"
          >
            <input
              type="checkbox"
              readonly
            >
            <span></span>
            <div
              class="text-content">
              <div class="name">
                {{tag.word}}
              </div>
                <div class="description"
                  *ngIf="tag.defaultTag === 'USER_TAG'"
                  [textContent]="getCompanyName(tag)"
                ></div>
            </div>
            <i
              *ngIf="tag.defaultTag === 'USER_TAG'"
              class="icon__user-light-gray qt-sz-16 qt-bg-contain qt-ml-8"
            ></i>
            <i
              *ngIf="tag.defaultTag === 'COMMON'"
              class="icon__tag-light-gray qt-sz-16 qt-bg-contain qt-ml-8"
            ></i>
            <i
              *ngIf="tag.defaultTag === 'COMPANY_TAG'"
              class="icon__office-account qt-za-16 qt-sz-16 qt-bg-contain qt-ml-8"
            ></i>
          </label>
        </ng-template>
    </div>
</div>
