<div
    class="col-md-12 --required filter-tags-body"
    ngbDropdown
    #products="ngbDropdown"
>
    <mat-form-field ngbDropdownAnchor>
        <mat-chip-list
            #chipList
            aria-label="Fruit selection"
        >
            <mat-chip
                *ngFor="let tag of selectedTag; let i = index"
                [selectable]="selectable"
                [removable]="removable"
                (removed)="remove(i)"
            >
                {{tag.word}}
                <mat-icon
                    matChipRemove
                    *ngIf="removable"
                >
                    cancel
                </mat-icon>
            </mat-chip>
            <input
                id="dropdownServices"
                ngbDropdownToggle
                placeholder="eg. Window update, Monthly maintainace"
                #userInput
                class="pointer"
                [formControl]="tagCtrl"
                [matChipInputFor]="chipList"
                [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                [matChipInputAddOnBlur]="addOnBlur"
                (input)="onSearch($event)"
                (keyup)="onKeyUp($event)"
            >
        </mat-chip-list>
    </mat-form-field>
    <div
        class="select-wrapper"
        ngbDropdownMenu
        aria-labelledby="dropdownServices"
    >
        <div
            class="content"
            (click)="$event.preventDefault()"
        >
            <div>
                <div
                    *ngFor="let item of tags; let i = index"
                    (click)="toggleItem(item)"
                >
                    <label class="qt-checkbox pointer">
                        <input
                            type="checkbox"
                            [checked]="isSeleted(item)"
                            readonly
                        >
                        <span></span>
                        <div class="text-content">
                            <div class="name">{{item.word}}</div>
                            <div
                                class="description"
                                *ngIf="item.defaultTag === 'USER_TAG'"
                                [textContent]="getCompanyName(item)"
                            >
                            </div>
                        </div>
                        <i
                            *ngIf="item.defaultTag === 'USER_TAG'"
                            class="icon__user-light-gray qt-sz-16 qt-bg-contain qt-ml-8"
                        ></i>
                        <i
                            *ngIf="item.defaultTag === 'COMMON'"
                            class="icon__tag-light-gray qt-sz-16 qt-bg-contain qt-ml-8"
                        ></i>
                        <i
                            *ngIf="item.defaultTag === 'COMPANY_TAG'"
                            class="icon__office-account qt-za-16 qt-sz-16 qt-bg-contain qt-ml-8"
                        ></i>
                    </label>
                </div>
            </div>
        </div>
    </div>
</div>
