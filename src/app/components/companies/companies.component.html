<div class="qt-page-list companies-page">
    <app-companies-header
        (onChangeFilterField)="onFilter($event)"
        (onSelectAllCompanies)="onSelectAllCompanies($event)"
    ></app-companies-header>
    <div class="qt-page-list__body">
        <div class="qt-page-list__body-table-container">
            <div
                class="qt-page-list__body-tbody qt-table-modern companies-table"
                [ngClass]="{'--selected':isSelectedConpanies()}"
            >
                <div
                    class
                    infiniteScroll
                    [infiniteScrollDistance]="2"
                    [infiniteScrollThrottle]="50"
                    [infiniteScrollDisabled]="infiniteScrollDisabled"
                    (scrolled)="onScroll()"
                >
                    <ng-template
                        ngFor
                        let-company
                        [ngForOf]="CompaniesList"
                        [ngForTrackBy]="trackById"
                    >
                        <app-companies-table
                            [showArchivedCompanies]="showArchivedCompanies"
                            [company]="company"
                        ></app-companies-table>
                    </ng-template>
                    <div
                        class="loading"
                        *ngIf="showPreloader"
                    ></div>
                </div>
            </div>
        </div>
    </div>
    <div
        class="mobile-action-btn"
        (click)="onAddCompany()"
    ></div>
</div>
<app-company-edit-aside></app-company-edit-aside>
