<div
    class="qt-aside-modern --large new-companies-content__modal"
    *ngIf="opened"
>
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-title">Create New Company</div>
        <div
            class="qt-aside-modern__header-close qt-icon icon__close"
            (click)="close()"
        ></div>
    </div>
    <company-add-aside-short
        [company]="company"
        [validate]="validate"
        *ngIf="version === 'short'"
        (onInitFullVersion)="onInitFullVersion()"
    ></company-add-aside-short>
    <company-add-aside-full
        [company]="company"
        [validate]="validate"
        *ngIf="version === 'full'"
    ></company-add-aside-full>
    <div class="qt-aside-modern__footer">
        <div class="qt-df qt-w100">
            <button
                class="qt-button --gray qt-mr-12 qt-w100 qt-jc-c"
                (click)="close()"
            >
                Cancel
            </button>
            <button
                *ngIf="version === 'short'"
                class="qt-button qt-w100 qt-jc-c"
                appDisabledBtn
                #addBtn="disabled"
                (onClick)="onAddShort()"
                [ngClass]="{'--loading':addBtn.isBlock()}"
            >
                <span>Save Company</span>
                <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
            </button>
            <button
                *ngIf="version === 'full'"
                class="qt-button qt-w100 qt-jc-c"
                appDisabledBtn
                #addBtn="disabled"
                (onClick)="onAddFull()"
                [ngClass]="{'--loading':addBtn.isBlock()}"
            >
                <span>Save Company</span>
                <app-preloader-ticket *ngIf="addBtn.isBlock()"></app-preloader-ticket>
            </button>
        </div>
    </div>
</div>
