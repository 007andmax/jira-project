<div
    class="qt-aside-modern --large new-companies-content__modal"
    *ngIf="opened"
>
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-title">Create New Company</div>
        <div
            class="qt-aside-modern__header-close icon__close"
            (click)="close()"
        ></div>
    </div>
    <company-add-aside-short
        [company]="company"
        [validate]="validate"
        *ngIf="version === 'short'"
        (onInitFullVersion)="onInitFullVersion()"
    ></company-add-aside-short>
    <company-add-aside-full
        [company]="company"
        [validate]="validate"
        *ngIf="version === 'full'"
    ></company-add-aside-full>
    <div class="qt-aside-modern__footer">
        <div class="qt-df">
            <button
                *ngIf="version === 'short' && !appService.checkMobile()"
                class="qt-button qt-mr-12"
                (click)="onAddShort()"
            >
                Save Company
            </button>
            <button
                *ngIf="version === 'full' && !appService.checkMobile()"
                class="qt-button qt-mr-12"
                (click)="onAddFull()"
            >
                Save Company
            </button>
            <button
                class="qt-button --gray"
                (click)="close()"
            >
                Cancel
            </button>
            <button
                *ngIf="version === 'short' && appService.checkMobile()"
                class="qt-button  "
                (click)="onAddShort()"
            >
                Save Company
            </button>
            <button
                *ngIf="version === 'full' && appService.checkMobile()"
                class="qt-button  "
                (click)="onAddFull()"
            >
                Save Company
            </button>
        </div>
    </div>
</div>
