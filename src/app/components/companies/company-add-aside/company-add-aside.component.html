<div
    class="qt-aside-modern --large new-companies-content__modal"
    *ngIf="opened"
>
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-title">Add New Company</div>
        <div
            class="qt-aside-modern__header-close icon__close"
            (click)="close()"
        ></div>
    </div>
    <!-- BASIC -->
    <company-add-aside-short
        [company]="company"
        [validate]="validate"
        *ngIf="version === 'short'"
        (onInitFullVersion)="onInitFullVersion()"
    ></company-add-aside-short>
    <!-- ADVANCED -->
    <company-add-aside-full
        [company]="company"
        [validate]="validate"
        *ngIf="version === 'full'"
    ></company-add-aside-full>
    <div class="qt-aside-modern__footer">
        <div class="qt-df qt-jc-sb qt-ai-c qt-w100">
            <div class="qt-df">
                <button
                    *ngIf="version === 'short'"
                    class="qt-button qt-mr-12"
                    (click)="onAddShort()"
                >
                    Create Company
                </button>
                <button
                    *ngIf="version === 'full'"
                    class="qt-button qt-mr-12"
                    (click)="onAddFull()"
                >
                    Create Company
                </button>
                <button
                    class="qt-button --gray"
                    (click)="close()"
                >
                    Cancel
                </button>
            </div>
            <div class="qt-mr-50">
                <div
                    *ngIf="version === 'full'"
                    class="create-contract"
                >
                    <div class="new-link">Create Contract</div>
                </div>
            </div>
        </div>
    </div>
</div>
