<div class="download-agent-modal">
    <button
        class="close-modal"
        uib-tooltip="Close"
        (click)="closeModal()"
    ></button>
    <h5 class="qt-fw-600">Download the installer</h5>
    <button
        class="btn btn-primary"
        (click)="downloadAgent()"
    >
        <i class="icon__windows qt-sz-32 qt-bg-contain qt-mr-6 qt-dib qt-va-m"></i>
        <span>Download for Windows</span>
    </button>
    <button
        class="btn btn-primary"
        (click)="downloadDemoAgent()"
    >
        <i class="icon__windows qt-sz-32 qt-bg-contain qt-mr-6 qt-dib qt-va-m"></i>
        <span>Demo Offline agent</span>
    </button>
    <!-- <button class="btn btn-primary not-active"><i class="apple-icn"></i><span>Download for Mac</span></button> -->
    <button class="btn btn-primary not-active">
        <i class="linux-icn"></i>
        <span>Download for Linux</span>
    </button>
    <p>OR</p>
    <button
        class="btn primary-default ng-isolate-scope"
        (click)="getDonwloadLink()"
        custom-disabled="false"
        ng-disabled="false"
    >
        Copy a installer link to clipboard
    </button>
</div>
