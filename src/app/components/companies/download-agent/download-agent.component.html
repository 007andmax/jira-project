<div class="download-agent-modal">
    <button
        class="qt-icon icon__close qt-sz-24 close-modal"
        uib-tooltip="Close"
        (click)="closeModal()"
    ></button>
    <h5 class="qt-fw-600">Download the installer</h5>
    <button
        class="qt-button qt-w100 qt-mb-16"
        (click)="downloadAgent()"
    >
        <i class="qt-icon icon__microsoft qt-mr-8 qt-icon__white qt-sz-32 qt-bg-contain qt-mr-6 qt-dib qt-va-m"></i>
        <span>Download for Windows</span>
    </button>
    <!-- <button
        class="qt-button"
        (click)="downloadDemoAgent()"
    >
        <i class="qt-icon icon__microsoft  qt-icon__whiteqt-sz-32 qt-bg-contain qt-mr-6 qt-dib qt-va-m"></i>
        <span>Demo Offline agent</span>
    </button> -->
    <!-- <button class="qt-button not-active"><i class="apple-icn"></i><span>Download for Mac</span></button> -->
    <button class="qt-button qt-w100 qt-mb-12 not-active">
        <i class="qt-sz-32 qt-bg-contain qt-mr-6 qt-dib qt-va-m"></i>
        <span>Download for Linux</span>
    </button>
    <p class="qt-color-gray-400 qt-fs-12 qt-lh-1">OR</p>
    <button
        class="qt-button --outline qt-w100 primary-default ng-isolate-scope qt-mb-12"
        (click)="getDonwloadLink()"
        custom-disabled="false"
        ng-disabled="false"
    >
        Copy a installer link to clipboard
    </button>
     <button
        class="qt-button --outline qt-w100 primary-default ng-isolate-scope"
        (click)="onToggleWingetCommand()"
    >
        Winget installer Command
    </button>
    <div class="qt-mt-16" *ngIf="toggleWingetCommand">
         <div class="qt-inputs-row">
            <div
                class="qt-input-block qt-w100"
               
            >
                <div class="qt-input-block__label">Add Quicktech Winget repository</div>
                <div class="qt-df qt-ai-c">
                <input
                    type="text"
                    [value]="getWingetRepositoryLink()"
                    disabled
                >
                    <div
    class="qt-button-square pointer qt-ml-4 draft-email-btn "  
      placement="top"
    ngbTooltip="Copy"
    (click)="copyWingetRepositoryLink()"
>
    <div class="qt-icon icon__copy  qt-sz-16 pointer qt-bg-contain"></div>
</div>
</div>
            </div>
        </div>
         <div class="qt-inputs-row">
            <div
                class="qt-input-block qt-w100"
               
            >
                <div class="qt-input-block__label">Install Quicktech Win-Get command</div>
                  <div class="qt-df qt-ai-c">
                <input
                    type="text"
                    [value]="getWinGetCommand()"
                    disabled
                >
                    <div
    class="qt-button-square pointer qt-ml-4 draft-email-btn "  
      placement="top"
    ngbTooltip="Copy"
    (click)="copyWinGetCommand()"
>
    <div class="qt-icon icon__copy  qt-sz-16 pointer qt-bg-contain"></div>
</div>
</div>
            </div>
        </div>
    </div>
</div>
