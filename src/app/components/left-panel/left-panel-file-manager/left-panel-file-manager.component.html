<div
    class="app-left-panel__menu"
    [ngClass]="{'--active': open}"
    (click)="open = !open;openPanel()"
>
    <div class="app-left-panel__menu-title">File Manager</div>
</div>
<ul
    class="app-left-panel__menu-expand"
    [ngClass]="{'menu-expand-show': open, 'menu-expand-hide': !open}"
>
    <li>
      <a
        href
        [link]="'companies'"
        target="_blank"
        appRightClickBlank
      >
        <span
          [ngClass]="{'--active':activePage === 'file-manager'}"
          (click)="goToState('file-manager');"
          class="app-left-panel__menu-expand-link"
        >
            All Folder
        </span>
      </a>
    </li>
   <li>
     <a
       *ngIf="false"
       href
       [link]="'companies'"
       target="_blank"
       appRightClickBlank
     >
       <span
         [ngClass]="{'--active':activePage === 'new-companies'}"
         (click)="goToState('new-companies');"
         class="app-left-panel__menu-expand-link"
       >
         Share Folder
       </span>
     </a>
   </li>
</ul>
