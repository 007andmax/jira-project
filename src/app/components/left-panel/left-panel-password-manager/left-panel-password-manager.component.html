<div
    class="app-left-panel__menu"
    [ngClass]="{'--active': activePage === 'password-manager'}"
>
    <div class="app-left-panel__menu-title">Password Manager</div>
</div>
<ul
    class="app-left-panel__menu-expand"
    [ngClass]="{'menu-expand-show': open, 'menu-expand-hide': !open}"
>
    <a
        href
        [link]="'password-manager'"
        target="_blank"
        appRightClickBlank
    >
        <li
            [ngClass]="{'--active':  activePage === 'password-manager'}"
            (click)="goToState();"
        >
            All passwords
        </li>
    </a>
</ul>
