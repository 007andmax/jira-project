<div
    class="app-left-panel__menu"
    [ngClass]="{'--active': activePage === 'password-manager'}"
    (click)="openPanel()"
>
    <div class="app-left-panel__menu-title">Password Manager</div>
</div>
<ul class="app-left-panel__menu-expand menu-expand-hide">
    <li
        href
        [link]="'password-manager'"
        target="_blank"
        appRightClickBlank
    >
        <a
            [ngClass]="{'--active':  activePage === 'password-manager'}"
            (click)="goToAll()"
            class="app-left-panel__menu-expand-link"
        >
            All passwords
        </a>
    </li>
    <ul class="app-left-panel__filter-menu-expand qt-mt-6">
        <ng-template
            ngFor
            let-category
            [ngForOf]="categories"
            [ngForTrackBy]="trackById"
        >
          <li>
            <a
              [ngClass]="{'--active': selectedCategory && selectedCategory.id === category.id && activePage === 'password-manager'}"
              (click)="goToState();selectCategory(category)"
              [textContent]="category.title"
              class="app-left-panel__filter-menu-expand-link"
            >
            </a>
          </li>
        </ng-template>
    </ul>
</ul>
