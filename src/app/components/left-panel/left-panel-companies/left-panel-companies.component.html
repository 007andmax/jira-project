<div
    class="app-left-panel__menu"
    [ngClass]="{'--active': open}"
    (click)="open = !open;openPanel();onToggleTypeCompanies()"
>
    <div class="icon__collapse-arrow-white qt-sz-24 qt-mr-12 qt-d-none qt-d-md-block"></div>
    <div class="app-left-panel__menu-title">Companies</div>
    <i
        class="icn-sm report-caret-icon"
        *ngIf="selectedCompany"
        [ngClass]="{'report-caret-icon-rotate':toggleTypeCompanies}"
    ></i>
</div>
<ul
    class="app-left-panel__menu-expand"
    *ngIf="toggleTypeCompanies"
    [ngClass]="{'menu-expand-show': open, 'menu-expand-hide': !open}"
>
    <a
        href
        [link]="'companies'"
        target="_blank"
        appRightClickBlank
    >
        <li
            [ngClass]="{'--active':activePage === 'new-companies' && !showArchivedCompanies}"
            (click)="onShowAll();"
        >
            All Companies
        </li>
    </a>
    <a
        href
        [link]="'companies'"
        target="_blank"
        appRightClickBlank
    >
        <li
            [ngClass]="{'--active':activePage === 'new-companies' && clientType === 'CLIENT'}"
            (click)="onSetFilterClientType('CLIENT');goToState('new-companies');"
            [textContent]="(activePage === 'new-companies') ? 'Clients ('+getCount('CLIENT') +')' : 'Clients'"
        >
        </li>
    </a>
    <a
        href
        [link]="'companies'"
        target="_blank"
        appRightClickBlank
    >
        <li
            [ngClass]="{'--active':activePage === 'new-companies' && clientType === 'LEAD'}"
            (click)="onSetFilterClientType('LEAD');goToState('new-companies');"
            [textContent]="(activePage === 'new-companies') ? 'Leads ('+getCount('LEAD') +')' : 'Leads'"
        >
        </li>
    </a>
    <a
        href
        [link]="'companies'"
        target="_blank"
        appRightClickBlank
    >
        <li
            [ngClass]="{'--active':activePage === 'new-companies' && clientType === 'VENDOR'}"
            (click)="onSetFilterClientType('VENDOR');goToState('new-companies');"
            [textContent]="(activePage === 'new-companies') ? 'Vendors ('+getCount('VENDOR') +')' : 'Vendors'"
        >
        </li>
    </a>
    <a
        href
        [link]="'companies'"
        target="_blank"
        appRightClickBlank
    >
        <li
            [ngClass]="{'--active':activePage === 'new-companies' && clientType === 'SUPPLIER'}"
            (click)="onSetFilterClientType('SUPPLIER');goToState('new-companies');"
            [textContent]="(activePage === 'new-companies') ? 'Suppliers ('+getCount('SUPPLIER') +')' : 'Suppliers'"
        >
        </li>
    </a>
    <a
        href
        [link]="'companies'"
        target="_blank"
        appRightClickBlank
    >
        <li
            [ngClass]="{'--active':activePage === 'new-companies' && showArchivedCompanies}"
            (click)="onShowArchived();goToState('new-companies');"
        >
            Archive
        </li>
    </a>
</ul>
<app-left-panel-company
    [selectedCompany]="selectedCompany"
    (onChangeState)="goToState($event)"
    [activePage]="activePage"
    *ngIf="selectedCompany && !appService.checkMobile()"
></app-left-panel-company>
