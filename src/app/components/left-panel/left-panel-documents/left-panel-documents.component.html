<div
    class="app-left-panel__menu"
    [ngClass]="{'--active': open}"
    (click)="open = !open;openPanel()"
>
    <div class="app-left-panel__menu-title">Documents</div>
</div>
<ul
    class="app-left-panel__menu-expand icon-list"
    [ngClass]="{'menu-expand-show': open, 'menu-expand-hide': !open}"
>
    <a
        href
        [link]="'documents'"
        target="_blank"
        appRightClickBlank
    >
        <li
            class="app-left-panel__menu-expand-item-icon"
            [ngClass]="{'--active':  activePage === 'new-documents'}"
            (click)="goToState('new-documents')"
        >
            All Documents
        </li>
    </a>
    <a
        href
        [link]="'documents/templates'"
        target="_blank"
        appRightClickBlank
    >
        <li
            class="app-left-panel__menu-expand-item-icon"
            [ngClass]="{'--active':  activePage === 'new-template-documents'}"
            (click)="goToState('new-template-documents')"
        >
            Templates
        </li>
    </a>
</ul>
