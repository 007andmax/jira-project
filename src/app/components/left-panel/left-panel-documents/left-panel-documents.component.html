<div

>
    <div class="app-left-panel__menu-icon --documents"></div>
    <div class="app-left-panel__menu-title">Documents</div>
    <div class="app-left-panel__menu-arrow"></div>
</div>
<ul class="app-left-panel__menu-expand icon-list top-menu menu-expand-show">

    <span class="app-left-panel__submenu-icon --folder"></span>
    How it Work</li>
  <li class="app-left-panel__menu-expand-item-icon">
    <span class="app-left-panel__submenu-icon --add-folder"></span>
    New Folder
