<div
    class="app-left-panel__menu"
    [ngClass]="{'--active': open}"
    (click)="open = !open;openPanel()"
>
    <div class="app-left-panel__menu-title">Billing</div>
</div>
<ul
    class="app-left-panel__menu-expand"
    [ngClass]="{'menu-expand-show': open, 'menu-expand-hide': !open}"
>
    <a
        href
        [link]="'billing-dashboard'"
        target="_blank"
        appRightClickBlank
    >
        <li
            *ngIf="getPermissions('VIEW_ACCOUNTING_DASHBOARD')"
            [ngClass]="{'--active':activePage === 'billing-dashboard'}"
            (click)="goToState('billing-dashboard')"
        >
            Dashboard
        </li>
    </a>
    <a
        href
        [link]="'non-contract-services'"
        target="_blank"
        appRightClickBlank
        *ngIf="!customerPortalStateService.isCustomerPortal"
    >
        <li
            [ngClass]="{'--active':activePage === 'non-contract-services'}"
            (click)="goToState('non-contract-services')"
        >
            Non-contract Services
        </li>
    </a>
    <a
        href
        [link]="'subscription-services'"
        target="_blank"
        appRightClickBlank
        *ngIf="!customerPortalStateService.isCustomerPortal"
    >
        <li
            [ngClass]="{'--active':activePage === 'subscription-services'}"
            (click)="goToState('subscription-services')"
        >
            Subscription Services
        </li>
    </a>
    <a
        href
        [link]="'billable'"
        target="_blank"
        appRightClickBlank
    >
        <li
            [ngClass]="{'--active':activePage === 'new-billable' || activePage === 'new-billable-tickets'}"
            (click)="goToState('new-billable')"
            *ngIf="getPermissions('VIEW_ACCOUNTING')"
        >
            Billable Items
        </li>
    </a>
    <a
        href
        [link]="'invoices'"
        target="_blank"
        appRightClickBlank
    >
        <li
            *ngIf="getPermissions('VIEW_ACCOUNTING') || getCompanyInfoPermissions('VIEW_ALL_INVOICES')"
            [ngClass]="{'--active':activePage === 'new-billable-invoices'}"
            (click)="goToState('new-billable-invoices')"
        >
            Invoices
        </li>
    </a>
    <a
        href
        [link]="'quotes'"
        target="_blank"
        appRightClickBlank
        *ngIf="customerPortalStateService.isCustomerPortal && getCompanyInfoPermissions('VIEW_ALL_QUOTES') || !customerPortalStateService.isCustomerPortal"
    >
        <li
            [ngClass]="{'--active':activePage === 'quotes-component'}"
            (click)="goToState('quotes-component')"
        >
            Quotes
        </li>
    </a>
    <a
        href
        [link]="'payments'"
        target="_blank"
        appRightClickBlank
        *ngIf="customerPortalStateService.isCustomerPortal && getCompanyInfoPermissions('VIEW_ALL_PAYMENTS') || !customerPortalStateService.isCustomerPortal"
    >
        <li
            [ngClass]="{'--active':activePage === 'new-payments-ng2'}"
            (click)="goToState('new-payments-ng2')"
        >
            Payments
        </li>
    </a>
    <a
        href
        [link]="'contracts'"
        target="_blank"
        appRightClickBlank
    >
        <li
            [ngClass]="{'--active':activePage === 'new-contracts'}"
            (click)="goToState('new-contracts')"
            *ngIf="getPermissions('VIEW_SERVICE_AGREEMENTS')"
        >
            Contracts
        </li>
    </a>
    <a
        href
        [link]="'contract-statistics'"
        target="_blank"
        appRightClickBlank
    >
        <li
            [ngClass]="{'--active':activePage === 'contract-statistics'}"
            (click)="goToState('contract-statistics')"
            *ngIf="getPermissions('VIEW_SERVICE_AGREEMENTS')"
        >
            Contract statistics
        </li>
    </a>
</ul>
