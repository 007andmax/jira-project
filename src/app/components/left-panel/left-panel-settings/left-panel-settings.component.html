<div
    class="app-left-panel__menu"
    [ngClass]="{'--active': open}"
    (click)="open = !open;openPanel()"
>
    <div class="app-left-panel__menu-title">Settings</div>
</div>
<ul
    class="app-left-panel__menu-expand"
    [ngClass]="{'menu-expand-show': open, 'menu-expand-hide': !open}"
>
    <li
        [ngClass]="{'--active':activePage === 'myprofile-component'}"
        (click)="goToState('myprofile-component')"
    >
        <div class="icon__menu--submenu qt-icon icon__my-profile qt-icon__gray-300 qt-sz-20 qt-bg-contain qt-mr-8"></div>
        My Profile Settings
    </li>
    <li
        [ngClass]="{'--active':activePage === 'company-profile-component'}"
        (click)="goToState('company-profile-component')"
        *ngIf="currentUser && currentUser.isOwner || getPermissions('VIEW_COMPANY_PROFILE_SETTINGS')"
    >
        <div class="icon__menu--submenu qt-icon icon__companies qt-sz-20 qt-icon__gray-300 qt-mr-8"></div>
        Company Profile
    </li>
    <li
        [ngClass]="{'--active':activePage === 'commission-component'}"
        (click)="goToState('commission-component')"
    >
        <div class="icon__menu--submenu qt-icon icon__commissions qt-icon__gray-300 qt-sz-20 qt-bg-contain qt-mr-8"></div>
        Commissions
    </li>
    <li
        [ngClass]="{'--active':activePage === 'crm-settings'}"
        (click)="goToState('crm-settings')"
        *ngIf="currentUser && currentUser.isOwner || getPermissions('VIEW_CRM_SETTINGS')"
    >
        <div class="icon__menu--submenu qt-icon icon__crm qt-sz-20 qt-icon__gray-300 qt-mr-8"></div>
        CRM Settings
    </li>
    <li
        [ngClass]="{'--active':activePage === 'customer-portal'}"
        (click)="goToState('customer-portal')"
        *ngIf="getPermissions('VIEW_COMPANIES') && getPermissions('CREATE_COMPANIES') && getPermissions('VIEW_USERS') && getPermissions('CREATE_USERS')"
    >
        <div class="icon__menu--submenu qt-icon icon__users qt-icon__gray-300 qt-sz-20 qt-mr-8"></div>
        Customer Portal
    </li>
    <li
        [ngClass]="{'--active':activePage === 'device-setting-component'}"
        (click)="goToState('device-setting-component')"
    >
        <div class="icon__menu--submenu qt-icon icon__tool qt-icon__gray-300 qt-sz-20 qt-mr-8"></div>
        Device Setting
    </li>
    <li
        [ngClass]="{'--active':activePage === 'email-setting-component'}"
        (click)="goToState('email-setting-component')"
        *ngIf="currentUser && currentUser.isOwner || getPermissions('VIEW_EMAIL_SETTINGS')"
    >
        <div class="icon__menu--submenu qt-icon icon__email qt-icon__gray-300 qt-sz-20 qt-mr-8"></div>
        Email Settings
    </li>
    <li
        [ngClass]="{'--active':activePage === 'email-template-component'}"
        (click)="goToState('email-template-component')"
        *ngIf="currentUser && currentUser.isOwner || getPermissions('VIEW_EMAIL_TEMPLATES_SETTINGS')"
    >
        <div class="icon__menu--submenu qt-icon icon__template-settings qt-icon__gray-300 qt-sz-20 qt-bg-contain qt-mr-8"></div>
        Email Templates
    </li>
    <li
        [ngClass]="{'--active':activePage === 'invoice-ticket-component'}"
        (click)="goToState('invoice-ticket-component')"
        *ngIf="currentUser && currentUser.isOwner || getPermissions('VIEW_ACCOUNTING_SETTINGS')"
    >
        <div class="icon__menu--submenu qt-icon icon__crm qt-sz-20 qt-icon__gray-300 qt-mr-8"></div>
        Finance
    </li>
    <li
        [ngClass]="{'--active':activePage === 'marketing-email'}"
        (click)="goToState('marketing-email')"
    >
        <div class="icon__menu--submenu qt-icon icon__marketing qt-icon__gray-300 qt-sz-20 qt-bg-contain qt-mr-8"></div>
        Marketing Email
    </li>
    <li
        [ngClass]="{'--active':activePage === 'products-settings'}"
        *ngIf="currentUser && currentUser.isOwner || getPermissions('VIEW_PRODUCT_CATEGORY_SETTINGS')"
        (click)="goToState('products-settings')"
    >
        <div class="icon__menu--submenu qt-icon icon__products qt-sz-20 qt-icon__gray-300 qt-mr-8"></div>
        Products
    </li>
    <li
        [ngClass]="{'--active':activePage === 'manage-tags-component'}"
        *ngIf="currentUser && currentUser.isOwner || getPermissions('VIEW_TAGS_SETTINGS')"
        (click)="goToState('manage-tags-component')"
    >
        <div class="icon__menu--submenu qt-icon icon__tags qt-icon__gray-300 qt-sz-20 qt-mr-8"></div>
        Tags
    </li>
    <li
        [ngClass]="{'--active':activePage === 'tech-component'}"
        (click)="goToState('tech-component')"
        *ngIf="currentUser && currentUser.isOwner || getPermissions('VIEW_TECH_USERS_SETTINGS')"
    >
        <div class="icon__menu--submenu qt-icon icon__users qt-icon__gray-300 qt-sz-20 qt-mr-8"></div>
        Tech Users
    </li>
    <li
        [ngClass]="{'--active':activePage === 'ticket-settings'}"
        (click)="goToState('ticket-settings')"
        *ngIf="currentUser && currentUser.isOwner || getPermissions('VIEW_TICKET_SETTINGS')"
    >
        <div class="icon__menu--submenu qt-icon icon__tickets qt-sz-20 qt-icon__gray-300 qt-mr-8"></div>
        Ticket Settings
    </li>
</ul>
