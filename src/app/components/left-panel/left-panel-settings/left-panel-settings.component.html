<div
    class="app-left-panel__menu"
    [ngClass]="{'--active': open}"
    (click)="open = !open;openPanel()"
>
    <div class="app-left-panel__menu-icon --settings"></div>
    <div class="app-left-panel__menu-title">Settings</div>
    <div class="app-left-panel__menu-arrow"></div>
</div>



<ul
    class="app-left-panel__menu-expand top-menu"
    [ngClass]="{'menu-expand-show': open, 'menu-expand-hide': !open}"
>
    <li [ngClass]="{'--active':activePage === 'myprofile-component'}">
        <a
            href="#/setting/myprofile"
            (click)="goToState('myprofile-component')"
        >
            My Profile Settings
        </a>
    </li>
    <li
        [ngClass]="{'--active':activePage === 'manage-tags-component'}"
        *ngIf="currentUser && currentUser.isOwner || getPermissions('VIEW_TAGS_SETTINGS')"
    >
        <a
            href="#/setting/tags"
            (click)="goToState('manage-tags-component')"
        >
            Manage Tags
        </a>
    </li>
    <li [ngClass]="{'--active':activePage === 'glnumber-component'}">
        <a
            href="#/setting/glnumber"
            (click)="goToState('glnumber-component')"
        >
            Manage GL number
        </a>
    </li>
    <li [ngClass]="{'--active':activePage === 'company-profile-component'}">
        <a
            href="#/setting/companyprofile"
            (click)="goToState('company-profile-component')"
            *ngIf="currentUser && currentUser.isOwner || getPermissions('VIEW_COMPANY_PROFILE_SETTINGS')"
        >
            Company Profile
        </a>
    </li>
    <li [ngClass]="{'--active':activePage === 'tech-component'}">
        <a
            href="#/setting/techUsers"
            (click)="goToState('tech-component')"
        >
            Manage Tech Users
        </a>
    </li>
    <li [ngClass]="{'--active':activePage === 'email-setting-component'}">
        <a
            href="#/setting/emailSetting"
            (click)="goToState('email-setting-component')"
        >
            Email Settings
        </a>
    </li>
    <li [ngClass]="{'--active':activePage === 'taxes-component'}">
        <a
            href="#/setting/taxes"
            (click)="goToState('taxes-component')"
        >
            Taxes
        </a>
    </li>
    <li
        [ngClass]="{'--active':activePage === 'permission-manage-component'}"
        *ngIf="currentUser && currentUser.isOwner || getPermissions('VIEW_PERMISSIONS_SETTINGS')"
    >
        <a
            href="#/setting/permission"
            (click)="goToState('permission-manage-component')"
        >
            Permission Management
        </a>
    </li>
    <li [ngClass]="{'--active':activePage === 'email-templete-component'}">
        <a
            href="#/setting/emailTemplete"
            (click)="goToState('email-templete-component')"
        >
            Email Templetes
        </a>
    </li>
    <li [ngClass]="{'--active':activePage === 'integrations-component'}">
        <a
            href="#/setting/integration"
            (click)="goToState('integrations-component')"
        >
            Integrations
        </a>
    </li>
    <li [ngClass]="{'--active':activePage === 'invoice-ticket-component'}">
        <a
            href="#/setting/invoiceTickets"
            (click)="goToState('invoice-ticket-component')"
        >
            Invoice and Ticket
        </a>
    </li>
    <li [ngClass]="{'--active':activePage === 'commission-component'}">
        <a
            href="#/setting/commission"
            (click)="goToState('commission-component')"
        >
            Commissions
        </a>
    </li>
    <li [ngClass]="{'--active':activePage === 'subscription-component'}">
        <a
            href="#/setting/subscription"
            (click)="goToState('subscription-component')"
        >
            Subscription
        </a>
    </li>
</ul>
