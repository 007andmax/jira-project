<div
    class="app-left-panel__menu"
    [ngClass]="{'--active': open}"
    (click)="open = !open;openPanel()"
>
    <div class="app-left-panel__menu-title">Tasks</div>
</div>
<ul
    class="app-left-panel__menu-expand"
    [ngClass]="{'menu-expand-show': open, 'menu-expand-hide': !open}"
>
    <a
        href
        [link]="'tasks-dashboard'"
        target="_blank"
        appRightClickBlank
    >
        <li
            [ngClass]="{'--active':activePage === 'tasks-dashboard'}"
            (click)="goToState('tasks-dashboard')"
        >
            Dashboard
        </li>
    </a>
    <a
        href
        [link]="'my-tasks'"
        target="_blank"
        appRightClickBlank
        *ngIf="!customerPortalStateService.isCustomerPortal"
    >
        <li
            [ngClass]="{'--active':activePage === 'my-tasks'}"
            (click)="goToState('my-tasks')"
        >
            My tasks
        </li>
    </a>
</ul>
<hr class="app-left-panel__ticket-menu-line">
<ul
    class="app-left-panel__menu-expand menu-expand-show app-left-panel__menu-expand--filter"
    *ngIf="!customerPortalStateService.isCustomerPortal"
>
    <li class="qt-mt-12 name-custom-filter">
        <span class="qt-icon icon__filter-lines qt-icon__gray-300 qt-sz-16 qt-bg-contain qt-dib qt-mr-4"></span>
        QUICK FILTERS
    </li>
    <ng-template
        ngFor
        let-item
        [ngForOf]="quickFilter"
        [ngForTrackBy]="trackById"
    >
        <li
            class="desktop-version filter-item"
            (click)="setStatus(item)"
        >
            <div [textContent]="item.title"></div>
        </li>
    </ng-template>
</ul>


<hr class="app-left-panel__ticket-menu-line">
<ul
    class="app-left-panel__menu-expand menu-expand-show"
    *ngIf="!customerPortalStateService.isCustomerPortal"
>
    <li class="qt-mt-12 name-custom-filter">
        <span class="qt-icon icon__filter-lines qt-icon__gray-300 qt-sz-16 qt-bg-contain qt-dib qt-mr-4"></span>
        Custom Filters
    </li>
    <ng-template
        ngFor
        let-user
        [ngForOf]="techUsersList"
        [ngForTrackBy]="trackById"
    >
        <li
            class="desktop-version filter-item"
            (click)="toggleTechUser(user)"
        >
            <div class="qt-df qt-mr-8">
                <label class="qt-checkbox">
                    <input
                        type="checkbox"
                        [checked]="filter.techUser && filter.techUser.id == user.id"
                        disabled
                    >
                    <span></span>
                </label>
            </div>
            <div [textContent]="user.firstName + ' ' + user.lastName"></div>
        </li>
    </ng-template>
</ul>
