<div class="app-left-panel__menu-info">
    <div
        class="select-company"
        [ngClass]="{'with-logo': checkLogo()}"
    >
        <img
            [src]="companiesStateService.getCompanyLogoUrl(selectedCompany)"
            alt
            *ngIf="checkLogo()"
        >
        <span
            class="empty-logo"
            *ngIf="!checkLogo()"
            [textContent]="selectedCompany.name[0].toUpperCase()"
        ></span>
    </div>
    <div class="mob-styles">
        <p
            class="qt-fs-12 qt-fw-600 qw-ff-qm"
            [textContent]="selectedCompany.name"
        ></p>
    </div>
</div>
<ul class="app-left-panel__menu-expand">
    <li>
      <a
        href
        [link]="getLinkSection('dashboard')"
        target="_blank"
        appRightClickBlank
        *ngIf="!customerPortalStateService.isCustomerPortal"
      >
        <span
          [ngClass]="{'--active':activePage === 'company-dashboard'}"
          (click)="goToCompanySection('dashboard')"
          class="app-left-panel__menu-expand-link"
        >
          Dashboard
        </span>
      </a>
    </li>
    <li>
      <a
        href
        [link]="getLinkSection('tickets')"
        target="_blank"
        appRightClickBlank
      >
        <span
          [ngClass]="{'--active':activePage === 'company-tickets'}"
          (click)="goToCompanySection('tickets')"
          class="app-left-panel__menu-expand-link"
        >
            Tickets
        </span>
      </a>
    </li>
    <li>
      <a
        href
        [link]="getLinkSection('user')"
        target="_blank"
        appRightClickBlank
        *ngIf="getPermissions('VIEW_USERS') || customerPortalStateService.isCustomerPortal"
      >
        <span
          *ngIf="getPermissions('VIEW_USERS')"
          [ngClass]="{'--active':activePage === 'company-user' || activePage === 'company-user-details'}"
          (click)="goToCompanySection('user')"
          class="app-left-panel__menu-expand-link"
        >
            Users
        </span>
      </a>
    </li>
    <li>
      <a
        href
        [link]="getLinkSection('devices')"
        target="_blank"
        appRightClickBlank
        *ngIf="customerPortalStateService.isCustomerPortal && getCompanyInfoPermissions('VIEW_ALL_DEVICES') || !customerPortalStateService.isCustomerPortal"
      >
        <span
          [ngClass]="{'--active':activePage === 'company-devices'}"
          (click)="goToCompanySection('devices')"
          class="app-left-panel__menu-expand-link"
        >
            Devices
        </span>
      </a>
    </li>

        >

        </li>
    </a> -->
    <!-- <a
        href
        [link]="getLinkSection('network-scan-beta')"
        target="_blank"
        appRightClickBlank
        *ngIf="companiesStateService.getCurrentCompany() && (companiesStateService.getCurrentCompany().id === '73221c72-f87c-4519-8235-c4b57ad1cc19' || companiesStateService.getCurrentCompany().id === '72381bff-127c-4a63-9d2e-6e952350dcbd')"

        >

    <li>
      <a
        href
        [link]="getLinkSection('network-scan')"
        target="_blank"
        appRightClickBlank
        *ngIf="!customerPortalStateService.isCustomerPortal"
      >
        <span
          [ngClass]="{'--active':activePage === 'company-network-scan'}"
          (click)="goToCompanySection('network-scan')"
          class="app-left-panel__menu-expand-link"
        >
            Network Scan
        </span>
      </a>
    </li>
    <li>
      <a
        href
        [link]="getLinkSection('password-manager')"
        target="_blank"
        appRightClickBlank
        *ngIf="getPermissions('VIEW_PASSWORD_SECTION') || !customerPortalStateService.isCustomerPortal"
      >
        <span
          [ngClass]="{'--active':activePage === 'company-password-manager'}"
          (click)="goToCompanySection('password-manager')"
          class="app-left-panel__menu-expand-link"
        >
            Password Manager
        </span>
      </a>
    </li>
    <li>
      <a
        href
        [link]="getLinkSection('products')"
        target="_blank"
        appRightClickBlank
      >
        <span
          *ngIf="getPermissions('VIEW_SALES_REPORT')"
          [ngClass]="{'--active':activePage === 'company-products'}"
          (click)="goToCompanySection('products')"
          class="app-left-panel__menu-expand-link"
        >
            Products
        </span>
    </a>
    </li>
    <li>
      <a
        href
        [link]="getLinkSection('contracts')"
        target="_blank"
        appRightClickBlank
        *ngIf="!customerPortalStateService.isCustomerPortal"
      >
        <span
          *ngIf="getPermissions('VIEW_SERVICE_AGREEMENTS') && selectedCompany &&  selectedCompany.clientType !== 'LEAD' && selectedCompany.clientType !== 'VENDOR'"
          [ngClass]="{'--active':activePage === 'company-contracts'}"
          (click)="goToCompanySection('contracts')"
          class="app-left-panel__menu-expand-link"
        >
            Contracts
        </span>
      </a>
    </li>
    <li>
      <a
        class="clear-link-style"
        href
        [link]="getLinkSection('file-manager')"
        target="_blank"
        appRightClickBlank
        *ngIf="!customerPortalStateService.isCustomerPortal"
      >
        <span
          [ngClass]="{'--active':activePage === 'company-file-manager'}"
          (click)="goToCompanySection('file-manager')"
          class="app-left-panel__menu-expand-link"
        >
            File Manager
        </span>
      </a>
    </li>
    <li>
      <a
        class=""
        href
        [link]="getLinkSection('documents')"
        target="_blank"
        appRightClickBlank
        *ngIf="!customerPortalStateService.isCustomerPortal"
      >
        <span
          [ngClass]="{'--active':activePage === 'company-documents'}"
          class="app-left-panel__menu-expand-link"
        >
            <span
              (click)="goToCompanySection('documents')"
            >
                Documents
            </span>
            <span
              (click)="toogleCategoriesDocuments = !toogleCategoriesDocuments"
              *ngIf="assignedDocumentCategories.length > 0"
            >
                <i
                  class="icn-sm qt-icon icon__arrow-down report-caret-icon"
                  [ngClass]="{'show-categories-documents':toogleCategoriesDocuments}"
                ></i>
            </span>
        </span>
      </a>
    </li>
    <ul
        class="categories app-left-panel__filter-menu-expand qt-mt-6"
        *ngIf="toogleCategoriesDocuments && !customerPortalStateService.isCustomerPortal"
    >
        <ng-template
            ngFor
            let-assignedDocumentCategory
            [ngForOf]="assignedDocumentCategories"
            [ngForTrackBy]="trackById"
        >
            <li
                [ngClass]="{'--active-category-document':selectedCategoryDocument === assignedDocumentCategory.id}"
                (click)="goToCompanyDocumentsCategory(assignedDocumentCategory.id)"
                class="app-left-panel__filter-menu-expand-link"
            >
                <i
                    class="qt-dib qt-sz-16 qt-bg-contain qt-icon icon__folder"
                    [ngClass]="{'qt-icon__white':selectedCategoryDocument === assignedDocumentCategory.id,
                'qt-icon__gray-400':selectedCategoryDocument !== assignedDocumentCategory.id}"
                ></i>
                {{assignedDocumentCategory.name}}
            </li>
        </ng-template>
    </ul>
</ul>
