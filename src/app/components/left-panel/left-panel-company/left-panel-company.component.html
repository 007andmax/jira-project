<div class="app-left-panel__menu-info">
    <div
        class="select-company"
        [ngClass]="{'with-logo': checkLogo()}"
    >
        <img
            [src]="getCompanyLogoUrl()"
            alt
            *ngIf="checkLogo()"
        >
        <span
            class="empty-logo"
            *ngIf="!checkLogo()"
            [textContent]="selectedCompany.name[0].toUpperCase()"
        ></span>
    </div>
    <div class="mob-styles">
        <p
            class="ff-g-m qw-ff-qm"
            [textContent]="selectedCompany.name"
        ></p>
    </div>
</div>
<ul class="app-left-panel__menu-expand">
    <a
        href
        [link]="getLinkSection('dashboard')"
        target="_blank"
        appRightClickBlank
    >
        <li
            [ngClass]="{'--active':activePage === 'company-dashboard'}"
            (click)="goToCompanySection('dashboard')"
        >
            Dashboard
        </li>
    </a>
    <a
        href
        [link]="getLinkSection('tickets')"
        target="_blank"
        appRightClickBlank
    >
        <li
            [ngClass]="{'--active':activePage === 'company-tickets'}"
            (click)="goToCompanySection('tickets')"
        >
            Tickets
        </li>
    </a>
    <a
        href
        [link]="getLinkSection('user')"
        target="_blank"
        appRightClickBlank
    >
        <li
            *ngIf="getPermissions('VIEW_USERS')"
            [ngClass]="{'--active':activePage === 'company-user'}"
            (click)="goToCompanySection('user')"
        >
            Users
        </li>
    </a>
    <a
        href
        [link]="getLinkSection('devices')"
        target="_blank"
        appRightClickBlank
    >
        <div>Devices</div>
        <!-- <div class="qt-sz-16 icon__create-folder"></div> -->
    </li>
    </a>
    <li
        [ngClass]="{'--active':activePage === 'company-devices-beta'}"
        (click)="goToCompanySection('devices-beta')"
    >
        <div>Devices Beta</div>
    </li>
   <a
        href
        [link]="getLinkSection('network-scan')"
        target="_blank"
        appRightClickBlank
    >
        <li
            [ngClass]="{'--active':activePage === 'company-network-scan'}"
            (click)="goToCompanySection('network-scan')"
        >
            Network Scan
        </li>
    </a>
    <a
        href
        [link]="getLinkSection('password-manager')"
        target="_blank"
        appRightClickBlank
    >
        <li
            *ngIf="getPermissions('VIEW_PASSWORD_SECTION')"
            [ngClass]="{'--active':activePage === 'company-password-manager'}"
            (click)="goToCompanySection('password-manager')"
        >
            Password Manager
        </li>
    </a>
    <a
        href
        [link]="getLinkSection('products')"
        target="_blank"
        appRightClickBlank
    >
        <li
            *ngIf="getPermissions('VIEW_SALES_REPORT')"
            [ngClass]="{'--active':activePage === 'company-products'}"
            (click)="goToCompanySection('products')"
        >
            Products
        </li>
    </a>
    <a
        href
        [link]="getLinkSection('contracts')"
        target="_blank"
        appRightClickBlank
    >
        <li
            *ngIf="getPermissions('VIEW_SERVICE_AGREEMENTS') && selectedCompany &&  selectedCompany.clientType !== 'LEAD' && selectedCompany.clientType !== 'VENDOR'"
            [ngClass]="{'--active':activePage === 'company-contracts'}"
            (click)="goToCompanySection('contracts')"
        >
            Contracts
        </li>
    </a>
    <li [ngClass]="{'--active':activePage === 'company-documents'}">
        <a
            class="clear-link-style"
            href
            [link]="getLinkSection('documents')"
            target="_blank"
            appRightClickBlank
        >
            <span
                class="documents-name-link"
                (click)="goToCompanySection('documents')"
            >
                Documents
            </span>
        </a>
        <div
            class="qt-ml-auto qt-sz-20"
            (click)="toogleCategoriesDocuments = !toogleCategoriesDocuments"
            *ngIf="assignedDocumentCategories.length > 0"
        >
            <i
                class="icn-sm report-caret-icon"
                [ngClass]="{'show-categories-documents':toogleCategoriesDocuments}"
            ></i>
        </div>
    </li>
    <ul
        class="categories"
        *ngIf="toogleCategoriesDocuments"
    >
        <ng-template
            ngFor
            let-assignedDocumentCategory
            [ngForOf]="assignedDocumentCategories"
            [ngForTrackBy]="trackById"
        >
            <li
                [ngClass]="{'--active-category-document':selectedCategoryDocument === assignedDocumentCategory.id}"
                (click)="goToCompanyDocumentsCategory(assignedDocumentCategory.id)"
            >
                <i
                    class="qt-sz-16 qt-bg-contain qt-mr-8"
                    [ngClass]="{'icon__folder-active':selectedCategoryDocument === assignedDocumentCategory.id,
                'icon__folder':selectedCategoryDocument !== assignedDocumentCategory.id}"
                ></i>
                {{assignedDocumentCategory.name}}
            </li>
        </ng-template>
    </ul>
</ul>
