<div
    class="app-left-panel__menu"
    [ngClass]="{'--active': open}"
    (click)="open = !open;openPanel()"
>
    <div class="app-left-panel__menu-title">Users</div>
</div>
<ul
    class="app-left-panel__menu-expand"
    [ngClass]="{'menu-expand-show': open, 'menu-expand-hide': !open}"
>
    <a
        href
        [link]="'users'"
        target="_blank"
        appRightClickBlank
    >
        <li
            [ngClass]="{'--active': !filter.isArchive  && activePage === 'new-users'}"
            (click)="goToAll()"
        >
            All Users
        </li>
    </a>
    <li
        [ngClass]="{'--active': filter.getClientType() === 'CLIENT' && activePage === 'new-users'}"
        (click)="goToState();setShowArchivedCompanies(false);onSetFilterClientType('CLIENT')"
    >
        Customer Users
    </li>
    <li
        [ngClass]="{'--active': filter.getClientType() === 'LEAD' && activePage === 'new-users'}"
        (click)="goToState();setShowArchivedCompanies(false);onSetFilterClientType('LEAD')"
    >
        Lead Users
    </li>
    <li
        [ngClass]="{'--active': filter.isArchive && activePage === 'new-users'}"
        (click)="goToState();onShowArchived()"
    >
        Archived Users
    </li>
</ul>
