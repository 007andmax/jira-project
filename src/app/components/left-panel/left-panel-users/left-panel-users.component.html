<div
    class="app-left-panel__menu"
    [ngClass]="{'--active': open}"
    (click)="open = !open;openPanel()"
>
    <div class="app-left-panel__menu-title">Users</div>
</div>
<ul
    class="app-left-panel__menu-expand"
    [ngClass]="{'menu-expand-show': open, 'menu-expand-hide': !open}"
>
    <li
        href
        [link]="'users'"
        target="_blank"
        appRightClickBlank
    >
        <a
            [ngClass]="{'--active': !filter.isArchive  && activePage === 'new-users'}"
            (click)="goToAll()"
            class="app-left-panel__menu-expand-link"
        >
            <span>All Users</span>
            <span
                class="qt-color-gray-400 qt-ml-6 app-left-panel__menu-expand-count"
                [textContent]="userCount.all"
            ></span>
        </a>
    </li>
    <li
        [ngClass]="{'--active': filter.getClientType() === 'CLIENT' && activePage === 'new-users'}"
        (click)="goToState();setShowArchivedCompanies(false);onSetFilterClientType('CLIENT')"
        class="app-left-panel__menu-expand-link"
    >
        <span>Customer Users</span>
        <span
            class="qt-color-gray-400 qt-ml-6 app-left-panel__menu-expand-count"
            [textContent]="userCount.customer"
        ></span>
    </li>
    <li
        [ngClass]="{'--active': filter.getClientType() === 'LEAD' && activePage === 'new-users'}"
        (click)="goToState();setShowArchivedCompanies(false);onSetFilterClientType('LEAD')"
         class="app-left-panel__menu-expand-link"
    >
        <span>Lead Users</span>
        <span
            class="qt-color-gray-400 qt-ml-6 app-left-panel__menu-expand-count"
            [textContent]="userCount.lead"
        ></span>
    </li>
    <li
        [ngClass]="{'--active': filter.isArchive && activePage === 'new-users'}"
        (click)="goToState();onShowArchived()"
         class="app-left-panel__menu-expand-link"
    >
        <span>Archived Users</span>
        <span
            class="qt-color-gray-400 qt-ml-6 app-left-panel__menu-expand-count"
            [textContent]="userCount.archived"
        ></span>
    </li>
</ul>
<hr class="app-left-panel__ticket-menu-line">
<ul
    class="app-left-panel__filter-menu-expand menu-expand-show"
    *ngIf="!customerPortalStateService.isCustomerPortal"
>
    <li class="app-left-panel__menu-expand-subtitle">
        Custom Filters
    </li>
    <ng-template
        ngFor
        let-filter
        [ngForOf]="globalFilters"
        [ngForTrackBy]="trackById"
    >
        <li
            [ngClass]="{'--active': selectedGlobalFilter.id == filter.id}"
            class="desktop-version filter-item"
            (click)="setGlobalFilter(filter)"
        >
            <div class="app-left-panel__filter-menu-expand-link" [textContent]="filter.name"></div>
            <div class="qt-df qt-ai-c">
                <i
                    class="qt-icon icon__warning qt-icon__yellow-600 qt-sz-16 pointer qt-ml-4 qt-mr-6"
                    container="body"
                    placement="top"
                    ngbTooltip="Some parameters of the filter have been deleted"
                    *ngIf="filter.modified"
                ></i>
                <i
                    class="qt-icon icon__globe qt-bg-contain qt-sz-16 pointer qt-ml-4 qt-mr-6"
                    container="body"
                    placement="top"
                    ngbTooltip="Global Filter"
                    *ngIf="filter.global"
                ></i>
                <div
                    class="qt-ml-auto"
                    ngbDropdown
                    [placement]="'bottom-right'"
                    (click)="blockClick($event)"
                    *ngIf="getPermissions('DELETE_GLOBAL_USER_FILTER') && filter.global || !filter.global"
                >
                    <div
                        class="qt-ic-c qt-icon icon__more qt-pointer qt-sz-16 qt-bg-contain actions-filter"
                        id="dropdownBasic1"
                        ngbDropdownToggle
                    ></div>
                    <ul
                        class="qt-dropdown-menu"
                        ngbDropdownMenu
                        aria-labelledby="dropdownBasic1"
                    >
                        <li
                            class="pointer"
                            (click)="removeFilter(filter)"
                            ngbDropdownItem
                        >
                            <div class="qt-icon icon__delete qt-sz-20 qt-mr-12 qt-bg-contain pointer"></div>
                            Delete
                        </li>
                    </ul>
                </div>
            </div>
        </li>
    </ng-template>
    <div
        *ngIf="showLoadMoreUpdates && globalFilters.length > 0"
        class="button-loader"
        (click)="getGLobalFilters()"
    >
        <span *ngIf="!showPreloaderGlobalFilters">+ Load more</span>
        <span
            *ngIf="showPreloaderGlobalFilters"
            class="loading"
        ></span>
    </div>
</ul>
