<div
    class="app-left-panel__menu"
    [ngClass]="{'--active': activePage === 'new-reports'}"
>
    <div class="app-left-panel__menu-title">Reports</div>
</div>
<ul
    class="app-left-panel__menu-expand"
    [ngClass]="{'menu-expand-show': open, 'menu-expand-hide': !open}"
>
    <a
        href
        [link]="'reports'"
        target="_blank"
        appRightClickBlank
    >
        <li
            [ngClass]="{'--active': activePage === 'new-users'}"
            (click)="goToState();"
        >
            All Reports
        </li>
    </a>
</ul>
