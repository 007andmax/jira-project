<div
    class="app-left-panel__menu"
    [ngClass]="{'--active': activePage === 'new-reports'}"
>
    <div class="app-left-panel__menu-title">Reports</div>
</div>
<ul class="app-left-panel__menu-expand menu-expand-hide">
    <li>
      <a
        href
        [link]="'reports'"
        target="_blank"
        appRightClickBlank
      >
        <span
          [ngClass]="{'--active':  activePage === 'new-reports'}"
          (click)="goToState('new-reports')"
          class="app-left-panel__menu-expand-link"
        >
          All Reports
        </span>
      </a>
    </li>
</ul>
<div class="qt-aside-modern__content advanced">
    <ng-template
        ngFor
        let-report
        [ngForOf]="list"
        [ngForTrackBy]="trackById"
    >
        <hr class="app-left-panel__ticket-menu-line">
        <div
            class="report-menu-item"
            *ngIf="report.permissions ? getPermissions(report.permissions) : true"
        >
            <div class="report-menu-item-header">
                <h3
                    class="qt-ml-8"
                    [textContent]="report.category"
                ></h3>
            </div>
            <ng-template
                ngFor
                let-subcategory
                [ngForOf]="report.subcategories"
                [ngForTrackBy]="trackById"
            >
                <span
                    class="app-left-panel__menu-expand-link"
                    [ngClass]="{'--active':isActive(subcategory.route)}"
                    [textContent]="subcategory.name"
                    (click)="goToState(subcategory.route)"
                ></span>
            </ng-template>
        </div>
    </ng-template>
</div>
