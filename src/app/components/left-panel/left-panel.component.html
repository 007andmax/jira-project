<div class="app-left-panel__header">
    <div class="app-left-panel__header-logo --beta"></div>
    <div
        class="app-left-panel__header-resize-btn qt-d-md-none"
        (click)="onToggleLeftPanel()"
    ></div>
    <div
        class="icon__close-white qt-sz-20 qt-bg-contain qt-d-none qt-d-md-block ppointer"
        (click)="onToggleMobileLeftPanel()"
    ></div>
    <div class="app-left-panel__systems-info">
        <div
            class="app-left-panel__systems-info-avatar"
            style="color: #24a6a5"
            [ngStyle]="{'background':  getCompanyLogoUrl()}"
            *ngIf="checkLogo()"
        >
        </div>
        <div
            class="app-left-panel__systems-info-avatar"
            style="background-color: #e6ffff; color: #24a6a5"
            *ngIf="!checkLogo()"
            [textContent]="getShortCompanyName()"
        >
        </div>
        <div>
            <div class="app-left-panel__systems-info-header">
                {{ (currentCompany) ? currentCompany.name : ''}}
            </div>
            <div class="app-left-panel__systems-info-name">
                <div class="app-left-panel__systems-info-circle"></div>
                {{getCurrentUserName()}}
            </div>
        </div>
    </div>
</div>
<div class="app-left-panel__body">
    <app-left-panel-support
        #panelSupport
        (onOpenPanel)="onOpenPanel()"
        (onChangeState)="onChangeState($event)"
        [activePage]="state"
        class="qt-d-md-none"
    ></app-left-panel-support>
    <app-left-panel-tickets
        #panelTickets
        (onOpenPanel)="onOpenPanel()"
        (onChangeState)="onChangeState($event)"
        [activePage]="state"
    ></app-left-panel-tickets>
    <app-left-panel-users
        #panelUsers
        (onOpenPanel)="onOpenPanel()"
        (onChangeState)="onChangeState($event)"
        [activePage]="state"
        class="qt-d-md-none"
    ></app-left-panel-users>
    <app-left-panel-companies
        #panelCompanies
        (onOpenPanel)="onOpenPanel()"
        (onChangeState)="onChangeState($event)"
        [activePage]="state"
    ></app-left-panel-companies>
    <app-left-panel-billing
        #panelBilling
        (onOpenPanel)="onOpenPanel()"
        (onChangeState)="onChangeState($event)"
        [activePage]="state"
        class="qt-d-md-none"
    ></app-left-panel-billing>
    <app-left-panel-inventory
        [activePage]="state"
        (onChangeState)="onChangeState($event)"
        class="qt-d-md-none"
    ></app-left-panel-inventory>
    <app-left-panel-password-manager
        [activePage]="state"
        (onChangeState)="onChangeState($event)"
        class="qt-d-md-none"
    ></app-left-panel-password-manager>
    <app-left-panel-documents
        #panelDocuments
        (onOpenPanel)="onOpenPanel()"
        (onChangeState)="onChangeState($event)"
        [activePage]="state"
        class="qt-d-md-none"
    ></app-left-panel-documents>
    <hr class="app-left-panel__divider qt-d-md-none">
    <app-left-panel-reports
        [activePage]="state"
        (onChangeState)="onChangeState($event)"
        class="qt-d-md-none"
    ></app-left-panel-reports>
    <app-left-panel-settings
        #panelSettings
        (onOpenPanel)="onOpenPanel()"
        (onChangeState)="onChangeState($event)"
        [activePage]="state"
        class="qt-d-md-none"
    ></app-left-panel-settings>
    <!-- Mobile -->
    <div
        class="app-left-panel__menu qt-d-none qt-d-md-flex"
        (click)="logOut()"
    >
        <div class="app-left-panel__menu-icon --logout"></div>
        <div class="app-left-panel__menu-title">Logout</div>
    </div>
    <!-- End Mobile -->
</div>
