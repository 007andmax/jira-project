<div
    class="app-left-panel__header"
    *ngIf="!hideleLeftPanel"
>
    <div class="app-left-panel__header-logo --beta"></div>
    <div
        class="app-left-panel__header-resize-btn"
        (click)="onToggleLeftPanel()"
    ></div>
</div>
<div
    class="app-left-panel__body"
    *ngIf="!hideleLeftPanel"
>
    <app-left-panel-support
        #panelSupport
        (onOpenPanel)="onOpenPanel()"
        (onChangeState)="onChangeState($event)"
        [activePage]="state"
    ></app-left-panel-support>
    <app-left-panel-tickets
        #panelTickets
        (onOpenPanel)="onOpenPanel()"
        (onChangeState)="onChangeState($event)"
        [activePage]="state"
    ></app-left-panel-tickets>
    <app-left-panel-users
        #panelUsers
        (onOpenPanel)="onOpenPanel()"
        (onChangeState)="onChangeState($event)"
        [activePage]="state"
    ></app-left-panel-users>
    <app-left-panel-companies
        #panelCompanies
        (onOpenPanel)="onOpenPanel()"
        (onChangeState)="onChangeState($event)"
        [activePage]="state"
    ></app-left-panel-companies>
    <app-left-panel-billing
        #panelBilling
        (onOpenPanel)="onOpenPanel()"
        (onChangeState)="onChangeState($event)"
        [activePage]="state"
    ></app-left-panel-billing>
    <app-left-panel-inventory
        [activePage]="state"
        (onChangeState)="onChangeState($event)"
    ></app-left-panel-inventory>
    <app-left-panel-password-manager
        [activePage]="state"
        (onChangeState)="onChangeState($event)"
    ></app-left-panel-password-manager>
    <hr class="app-left-panel__divider">
    <app-left-panel-reports
        [activePage]="state"
        (onChangeState)="onChangeState($event)"
    ></app-left-panel-reports>
    <app-left-panel-documents
        (onChangeState)="onChangeState($event)"
        [activePage]="state"
    ></app-left-panel-documents>
    <app-left-panel-settings
        #panelSettings
        (onOpenPanel)="onOpenPanel()"
        (onChangeState)="onChangeState($event)"
        [activePage]="state"
    ></app-left-panel-settings>
</div>
