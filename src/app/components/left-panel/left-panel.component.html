<div class="app-left-panel__body">
    <div class="app-left-panel__body-icon">
        <div class="qt-df qt-jc-sb qt-ai-c app-left-panel__header-mobile qt-df qt-jc-fs">
            <div class="icon__quicktech-logo-mini qt-sz-40 qt-bg-contain qt-ml-auto qt-mr-auto qt-mt-16 qt-mb-16"></div>
            <div class="app-left-panel__systems-info qt-df qt-ai-c qt-ml-16 qt-d-none">
                <img
                    [src]="checkLogo()"
                    class="app-left-panel__systems-info-avatar qt-sz-32 qt-circle"
                    alt
                    *ngIf="checkLogo()"
                >
                <div
                    class="app-left-panel__systems-info-avatar qt-sz-32 qt-circle"
                    style="background-color: #7A5AF8; color: #fff"
                    *ngIf="!checkLogo()"
                    [textContent]="getShortCompanyName()"
                >
                </div>
                <div class="qt-ml-6">
                    <div class="app-left-panel__systems-info-header">{{getCurrentUserName()}}</div>
                    <div class="app-left-panel__systems-info-name qt-color-gray-400 qt-fs-12">
                        <div class="app-left-panel__systems-info-circle"></div>
                        {{ (currentCompany) ? currentCompany.name : ''}}
                    </div>
                </div>
            </div>
            <div class="header-mobile-close qt-d-none qt-d-md-flex pointer qt-ml-auto">
                <div
                    class="icon__close-white qt-sz-20 qt-bg-contain"
                    (click)="onToggleMobileLeftPanel()"
                ></div>
            </div>
        </div>
        <div
            class="app-left-panel__menu-icon-wrap qt-d-md-none pointer"
            (click)="changePage('SUPPORT');onOpenPanel();panelSupport.onFilter('ALL')"
            [ngClass]="{'--active':page === 'SUPPORT' }"
            placement="right"
            ngbTooltip="Support"
        >
            <div class="app-left-panel__menu-icon --quick-support"></div>
        </div>
        <div
            class="app-left-panel__menu-icon-wrap pointer"
            (click)="changePage('TICKETS');onOpenPanel();panelTickets.setTypeFilter('USERS')"
            [ngClass]="{'--active':page === 'TICKETS' }"
            placement="right"
            ngbTooltip="Tickets"
        >
            <div class="app-left-panel__menu-icon --tickets"></div>
            <div class="app-left-panel__menu-text qt-ml-12 qt-mr-12 qt-d-none qt-d-md-block">Tickets</div>
            <div class="icon__arrow-right-gray-400 qt-sz-16 qt-bg-contain qt-ml-auto qt-d-none qt-d-md-block"></div>
        </div>
        <div
            class="app-left-panel__menu-icon-wrap qt-d-md-none pointer"
            (click)="changePage('USERS');onOpenPanel();panelUsers.goToAll()"
            [ngClass]="{'--active':page === 'USERS' }"
            placement="right"
            ngbTooltip="Users"
        >
            <div class="app-left-panel__menu-icon --users"></div>
        </div>
        <div
            class="app-left-panel__menu-icon-wrap qt-d-md-none pointer"
            (click)="changePage('MARKETING');onOpenPanel();panelMarketing.goToAll()"
            [ngClass]="{'--active':page === 'MARKETING' }"
            placement="right"
            ngbTooltip="Marketing"
        >
            <div class="app-left-panel__menu-icon --marketing"></div>
        </div>
        <div
            class="app-left-panel__menu-icon-wrap pointer"
            (click)="changePage('COMPANIES');onOpenPanel();panelCompanies.onShowAll()"
            [ngClass]="{'--active':page === 'COMPANIES' }"
            placement="right"
            ngbTooltip="Companies"
        >
            <div class="app-left-panel__menu-icon --companies"></div>
            <div class="app-left-panel__menu-text qt-ml-12 qt-mr-12 qt-d-none qt-d-md-block">Companies</div>
            <div class="icon__arrow-right-gray-400 qt-sz-16 qt-bg-contain qt-ml-auto qt-d-none qt-d-md-block"></div>
        </div>
        <div
            class="app-left-panel__menu-icon-wrap qt-d-md-none pointer"
            (click)="changePage('BILLING');onOpenPanel();onChangeState('billing-dashboard')"
            [ngClass]="{'--active':page === 'BILLING' }"
            placement="right"
            ngbTooltip="Billing"
        >
            <div class="app-left-panel__menu-icon --billing"></div>
        </div>
        <div
            class="app-left-panel__menu-icon-wrap qt-d-md-none pointer"
            (click)="changePage('INVENTORY');onOpenPanel();panelInventory.goToAll()"
            [ngClass]="{'--active':page === 'INVENTORY' }"
            placement="right"
            ngbTooltip="Inventory"
        >
            <div class="app-left-panel__menu-icon --products"></div>
        </div>
        <div
            class="app-left-panel__menu-icon-wrap pointer"
            (click)="changePage('PASSWORD_MANAGER');onOpenPanel();panelPasswordManager.goToAll()"
            [ngClass]="{'--active':page === 'PASSWORD_MANAGER' }"
            placement="right"
            ngbTooltip="Password Manager"
        >
            <div class="app-left-panel__menu-icon --password-manager"></div>
            <div class="app-left-panel__menu-text qt-ml-12 qt-mr-12 qt-d-none qt-d-md-block">Password Manager</div>
            <div class="icon__arrow-right-gray-400 qt-sz-16 qt-bg-contain qt-ml-auto qt-d-none qt-d-md-block"></div>
        </div>
        <div
            class="app-left-panel__menu-icon-wrap qt-d-md-none pointer"
            (click)="changePage('DOCUMENTS');onOpenPanel();onChangeState('new-documents')"
            [ngClass]="{'--active':page === 'DOCUMENTS' }"
            placement="right"
            ngbTooltip="Documents"
        >
            <div class="app-left-panel__menu-icon --documents"></div>
        </div>
        <div
            class="app-left-panel__menu-icon-wrap qt-d-md-none pointer"
            (click)="changePage('REPORTS');onChangeState('new-reports')"
            [ngClass]="{'--active':page === 'REPORTS' }"
            placement="right"
            ngbTooltip="Reports"
        >
            <div class="app-left-panel__menu-icon --reports"></div>
        </div>
        <div
            class="app-left-panel__menu-icon-wrap app-left-panel__menu-icon-wrap-settings qt-d-md-none pointer"
            (click)="changePage('SETTINGS');onOpenPanel();onChangeState('myprofile-component')"
            [ngClass]="{'--active':page === 'SETTINGS' }"
            placement="right"
            ngbTooltip="Settings"
        >
            <div class="app-left-panel__menu-icon --settings"></div>
        </div>
        <div
            class="app-left-panel__menu-icon-wrap qt-d-none qt-d-md-flex pointer"
            (click)="logOut()"
        >
            <div class="app-left-panel__menu-icon --logout"></div>
            <div class="app-left-panel__menu-text qt-ml-12 qt-mr-12 qt-d-none qt-d-md-block">Logout</div>
            <div class="icon__arrow-right-gray-400 qt-sz-16 qt-bg-contain qt-ml-auto qt-d-none qt-d-md-block"></div>
        </div>
    </div>
    <div
        class="app-left-panel__body-menu"
        [ngClass]="{'--open':showMobTab}"
    >
        <div
            class="app-left-panel__header-resize-btn qt-d-md-none"
            (click)="onToggleLeftPanel()"
        ></div>
        <app-left-panel-support
            #panelSupport
            *ngIf="getPermissions('ALLOW_QUICK_CONNECT')"
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            class="qt-d-md-none"
            [hidden]="page !== 'SUPPORT'"
        ></app-left-panel-support>
        <app-left-panel-tickets
            #panelTickets
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            [hidden]="page !== 'TICKETS'"
        ></app-left-panel-tickets>
        <app-left-panel-users
            *ngIf="getPermissions('VIEW_USERS')"
            #panelUsers
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            class="qt-d-md-none"
            [hidden]="page !== 'USERS'"
        ></app-left-panel-users>
        <left-panel-marketing
            *ngIf="getPermissions('VIEW_USERS')"
            #panelMarketing
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            class="qt-d-md-none"
            [hidden]="page !== 'MARKETING'"
        ></left-panel-marketing>
        <app-left-panel-companies
            *ngIf="getPermissions('VIEW_COMPANIES')"
            #panelCompanies
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            [hidden]="page !== 'COMPANIES'"
        ></app-left-panel-companies>
        <app-left-panel-billing
            #panelBilling
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            class="qt-d-md-none"
            [hidden]="page !== 'BILLING'"
        ></app-left-panel-billing>
        <app-left-panel-inventory
            #panelInventory
            [activePage]="state"
            (onChangeState)="onChangeState($event)"
            class="qt-d-md-none"
            [hidden]="page !== 'INVENTORY'"
        ></app-left-panel-inventory>
        <app-left-panel-password-manager
            #panelPasswordManager
            (onOpenPanel)="onOpenPanel()"
            *ngIf="getPermissions('VIEW_PASSWORD_SECTION')"
            [activePage]="state"
            (onChangeState)="onChangeState($event)"
            [hidden]="page !== 'PASSWORD_MANAGER'"
        ></app-left-panel-password-manager>
        <app-left-panel-documents
            #panelDocuments
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            class="qt-d-md-none"
            [hidden]="page !== 'DOCUMENTS'"
        ></app-left-panel-documents>
        <app-left-panel-reports
            *ngIf="getAccessReports()"
            [activePage]="state"
            (onChangeState)="onChangeState($event)"
            class="qt-d-md-none"
            [hidden]="page !== 'REPORTS'"
        ></app-left-panel-reports>
        <app-left-panel-settings
            #panelSettings
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            class="qt-d-md-none"
            [hidden]="page !== 'SETTINGS'"
        ></app-left-panel-settings>
    </div>
</div>
