<div class="app-left-panel__body">
    <div class="app-left-panel__body-icon">
        <div class="qt-df qt-jc-sb qt-ai-c app-left-panel__header-mobile qt-df qt-jc-fs">
            <div class="icon__monogram qt-sz-40 qt-bg-contain qt-ml-auto qt-mr-auto qt-mt-16 qt-mb-16"></div>
        </div>
        <div
            *ngIf="getPermissions('ALLOW_QUICK_CONNECT')"
            class="app-left-panel__menu-icon-wrap pointer"
            (click)="changePage('SUPPORT');onOpenPanel();panelSupport.onFilter('ALL')"
            [ngClass]="{'--active':page === 'SUPPORT' }"
            placement="right"
            ngbTooltip="Support"
        >
            <div class="app-left-panel__menu-icon --quick-support"></div>
        </div>
        <div
            class="app-left-panel__menu-icon-wrap pointer"
            (click)="setDefaultTypeFilter();changePage('TICKETS');onOpenPanel()"
            [ngClass]="{'--active':page === 'TICKETS' }"
            placement="right"
            ngbTooltip="Tickets"
        >
            <div class="app-left-panel__menu-icon --tickets"></div>
        </div>
        <div
            *ngIf="getPermissions('VIEW_USERS') || customerPortalStateService.isCustomerPortal"
            class="app-left-panel__menu-icon-wrap pointer"
            (click)="changePage('USERS');onOpenPanel();onChangeState('new-users')"
            [ngClass]="{'--active':page === 'USERS' }"
            placement="right"
            ngbTooltip="Users"
        >
            <div class="app-left-panel__menu-icon --users"></div>
        </div>
        <div
            *ngIf="getPermissions('VIEW_USERS')"
            class="app-left-panel__menu-icon-wrap pointer"
            (click)="changePage('MARKETING');onOpenPanel();onChangeState('marketing')"
            [ngClass]="{'--active':page === 'MARKETING' }"
            placement="right"
            ngbTooltip="Marketing"
        >
            <div class="app-left-panel__menu-icon --marketing"></div>
        </div>
        <div
            *ngIf="getPermissions('VIEW_COMPANIES') || customerPortalStateService.isCustomerPortal"
            class="app-left-panel__menu-icon-wrap pointer"
            (click)="changePage('COMPANIES');onOpenPanel();panelCompanies.onShowAll()"
            [ngClass]="{'--active':page === 'COMPANIES' }"
            placement="right"
            ngbTooltip="Companies"
        >
            <div class="app-left-panel__menu-icon --companies"></div>
        </div>
        <div
            *ngIf="customerPortalStateService.isCustomerPortal && (getCompanyInfoPermissions('VIEW_ALL_QUOTES') || getCompanyInfoPermissions('VIEW_ALL_INVOICES') || getCompanyInfoPermissions('VIEW_ALL_PAYMENTS')) || !customerPortalStateService.isCustomerPortal"
            class="app-left-panel__menu-icon-wrap pointer"
            (click)="changePage('BILLING');onOpenPanel();onChangeState('billing-dashboard')"
            [ngClass]="{'--active':page === 'BILLING' }"
            placement="right"
            ngbTooltip="Billing"
        >
            <div class="app-left-panel__menu-icon --billing"></div>
        </div>
        <div
            *ngIf="!customerPortalStateService.isCustomerPortal"
            class="app-left-panel__menu-icon-wrap pointer"
            (click)="changePage('INVENTORY');onOpenPanel();panelInventory.goToAll()"
            [ngClass]="{'--active':page === 'INVENTORY' }"
            placement="right"
            ngbTooltip="Inventory"
        >
            <div class="app-left-panel__menu-icon --products"></div>
        </div>
        <div
            *ngIf="getPermissions('VIEW_PASSWORD_SECTION')"
            class="app-left-panel__menu-icon-wrap pointer"
            (click)="changePage('PASSWORD_MANAGER');onOpenPanel();panelPasswordManager.goToAll()"
            [ngClass]="{'--active':page === 'PASSWORD_MANAGER' }"
            placement="right"
            ngbTooltip="Password Manager"
        >
            <div class="app-left-panel__menu-icon --password-manager"></div>
        </div>
        <div
            *ngIf="!customerPortalStateService.isCustomerPortal"
            class="app-left-panel__menu-icon-wrap pointer"
            (click)="changePage('DOCUMENTS');onOpenPanel();onChangeState('new-documents')"
            [ngClass]="{'--active':page === 'DOCUMENTS' }"
            placement="right"
            ngbTooltip="Documents"
        >
            <div class="app-left-panel__menu-icon --documents"></div>
        </div>
        <!-- <div
            class="app-left-panel__menu-icon-wrap pointer"
            (click)="changePage('DEVICES');onOpenPanel();panelDevices.goToAll()"
            [ngClass]="{'--active':page === 'DEVICES' }"
            placement="right"
            ngbTooltip="Devices"
            *ngIf="currentCompany && (currentCompany.id === '73221c72-f87c-4519-8235-c4b57ad1cc19' || currentCompany.id === '72381bff-127c-4a63-9d2e-6e952350dcbd')"
        >
            <div class="app-left-panel__menu-icon --devices"></div>
        </div> -->
        <div
            *ngIf="getAccessReports()"
            class="app-left-panel__menu-icon-wrap pointer"
            (click)="changePage('REPORTS');onChangeState('new-reports')"
            [ngClass]="{'--active':page === 'REPORTS' }"
            placement="right"
            ngbTooltip="Reports"
        >
            <div class="app-left-panel__menu-icon --reports"></div>
        </div>
        <div
            *ngIf="currentCompany && (currentCompany.id === '73221c72-f87c-4519-8235-c4b57ad1cc19' || currentCompany.id === '72381bff-127c-4a63-9d2e-6e952350dcbd') && !customerPortalStateService.isCustomerPortal"
            class="app-left-panel__menu-icon-wrap pointer"
            (click)="changePage('FILE_MANAGER');onChangeState('file-manager')"
            [ngClass]="{'--active':page === 'FILE_MANAGER' }"
            placement="right"
            ngbTooltip="File Manager"
        >
            <div class="app-left-panel__menu-icon --folder-management"></div>
        </div>
        <div
            class="app-left-panel__menu-icon-wrap app-left-panel__menu-icon-wrap-settings pointer"
            (click)="changePage('SETTINGS');onOpenPanel();onChangeState('myprofile-component')"
            [ngClass]="{'--active':page === 'SETTINGS' }"
            placement="right"
            ngbTooltip="Settings"
        >
            <div class="app-left-panel__menu-icon --settings"></div>
        </div>
    </div>
    <div
        class="app-left-panel__body-menu"
        [ngClass]="{'--open':showMobTab}"
    >
        <div
            class="app-left-panel__header-resize-btn"
            (click)="onToggleLeftPanel()"
        ></div>
        <app-left-panel-support
            #panelSupport
            *ngIf="getPermissions('ALLOW_QUICK_CONNECT')"
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            [hidden]="page !== 'SUPPORT'"
        ></app-left-panel-support>
        <app-left-panel-tickets
            #panelTickets
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            [hidden]="page !== 'TICKETS' && page !== 'TICKET-DETAIL'"
        ></app-left-panel-tickets>
        <app-left-panel-users
            *ngIf="getPermissions('VIEW_USERS') || customerPortalStateService.isCustomerPortal"
            #panelUsers
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            [hidden]="page !== 'USERS'"
        ></app-left-panel-users>
        <left-panel-marketing
            *ngIf="getPermissions('VIEW_USERS')"
            #panelMarketing
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            [hidden]="page !== 'MARKETING'"
        ></left-panel-marketing>
        <app-left-panel-companies
            *ngIf="getPermissions('VIEW_COMPANIES') || customerPortalStateService.isCustomerPortal"
            #panelCompanies
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            [hidden]="page !== 'COMPANIES'"
        ></app-left-panel-companies>
        <app-left-panel-file-manager
            #filesCompanies
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            [hidden]="page !== 'FILE_MANAGER'"
        ></app-left-panel-file-manager>
        <app-left-panel-billing
            #panelBilling
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            [hidden]="page !== 'BILLING'"
        ></app-left-panel-billing>
        <app-left-panel-inventory
            #panelInventory
            [activePage]="state"
            (onChangeState)="onChangeState($event)"
            [hidden]="page !== 'INVENTORY'"
        ></app-left-panel-inventory>
        <app-left-panel-password-manager
            #panelPasswordManager
            (onOpenPanel)="onOpenPanel()"
            *ngIf="getPermissions('VIEW_PASSWORD_SECTION')"
            [activePage]="state"
            (onChangeState)="onChangeState($event)"
            [hidden]="page !== 'PASSWORD_MANAGER'"
        ></app-left-panel-password-manager>
        <app-left-panel-documents
            #panelDocuments
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            [hidden]="page !== 'DOCUMENTS'"
        ></app-left-panel-documents>
        <app-left-panel-devices
            #panelDevices
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            [hidden]="page !== 'DEVICES'"
        >
        </app-left-panel-devices>
        <app-left-panel-reports
            *ngIf="getAccessReports()"
            [activePage]="state"
            (onChangeState)="onChangeState($event)"
            [hidden]="page !== 'REPORTS'"
        ></app-left-panel-reports>
        <app-left-panel-settings
            #panelSettings
            (onOpenPanel)="onOpenPanel()"
            (onChangeState)="onChangeState($event)"
            [activePage]="state"
            [hidden]="page !== 'SETTINGS'"
        ></app-left-panel-settings>
    </div>
</div>
