
<div>
  <div class="receivable-content">
    <div class="tabs-container" style="height: 90px">

      <div class="payment-receive-fixed" fixed-block-top style="height: 90px;">
        <ul class="nav nav-qt" role="tablist">
          <li role="presentation" ng-class="{active: mode === 'payments-list'}" >
            <a ui-sref="payments({mode: 'payments-list'})" >
              Payments List
            </a>
          </li>
          <li role="presentation" ng-class="{active: mode === 'deposit-slips'}" >
            <a ui-sref="payments({mode: 'deposit-slips'})" >
              Deposit Slips
            </a>
          </li>

        </ul>
        <div>
          <h3>{{ mode === 'payments-list' ? 'Payments' : 'Deposit Slips' }}</h3>
        </div>
        <button ng-click="openDepositModal()" ng-show="mode === 'payments-list'" class="btn btn-primary"
                custom-disabled="{{ !isAnyPaymentSelected() }}">
          Create Deposit Slip
        </button>
      </div>
    </div>

    <div class="tab-content" ng-hide="loadingInProgress" ng-include="'/html/scripts/core/billable/payments/'+ mode +'.tpl.html'"></div>
    <loading-indicator loading-trigger="loadingInProgress"></loading-indicator>


  </div>
</div>
