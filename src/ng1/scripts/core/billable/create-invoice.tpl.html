<div class="inv-modal " ng-if="locksInitialized" invoice-modal-window>
  <div class="sticky-invoice-header" ng-style="{'opacity': showTimer || receivablePreview  ? 1 : 0}" style="height: 50px" ng-show="showHeader">
    <div class="expires-in" ng-show="showTimer && !invoiceCreated">
      <strong>{{ invoiceTimer | invoiceTimeFilter }}</strong>
      {{ invoiceTimer > 0 ? 'mins remaining until unlock' : 'Invoice has been expired and it cannot be saved' }}
    </div>

    <div class="expires-in" ng-show="shoeInvoiceCreatedMessage">
      <div style="margin-top: 10px;">{{notificationMessage}}</div>
    </div>

    <div class="invoice-actions invoice-btns"  style="position: fixed;" ng-style="invoiceCreated && {'background-color': 'white'}">
      <button ng-if="!invoicePreview && !invoiceCreated"
              ng-click="receivablePreview ? download() : createInvoice(invoiceLocks[showInvoiceLockIndex], download)"
              ng-disabled="(savingInvoiceInProcess.indexOf(invoiceLocks[showInvoiceLockIndex].id) > -1) || invoiceLocks[showInvoiceLockIndex].expired"
              tooltip-append-to-body="true"
              tooltip-placement="bottom"
              uib-tooltip="{{ receivablePreview ? 'Download Invoice' : 'Create and Download Invoice' }}">
        <i class="invoice-download"></i>
      </button>

      <button ng-if="(!receivablePreview || receivablePreview ) && !invoiceCreated"
              ng-click="receivablePreview ? sentInvoiceToMail() : createInvoice(invoiceLocks[showInvoiceLockIndex])"
              ng-disabled="(savingInvoiceInProcess.indexOf(invoiceLocks[showInvoiceLockIndex].id) > -1) || invoiceLocks[showInvoiceLockIndex].expired"
              tooltip-placement="bottom"
              tooltip-append-to-body="true" uib-tooltip="{{ receivablePreview ? 'Sent Invoice' : 'Create and Send Invoice'}}">
        <i class="invoice-send"></i>
      </button>

      <button ng-if="!invoicePreview && !invoiceCreated"
              ng-click="receivablePreview ? print() : createInvoice(invoiceLocks[showInvoiceLockIndex], print)"
              ng-disabled="(savingInvoiceInProcess.indexOf(invoiceLocks[showInvoiceLockIndex].id) > -1) || invoiceLocks[showInvoiceLockIndex].expired"
              tooltip-placement="bottom"
              tooltip-append-to-body="true"
              uib-tooltip="{{ receivablePreview ? 'Print Invoice' : 'Create and Print Invoice' }}">
        <i class="devices-printer"></i>
      </button>

      <a href="javascript:void(0)" class="close-icon" tooltip-placement="bottom" uib-tooltip="Close" ng-click="close()">
        <i class="icn-sm icn-remove-old"></i>
      </a>

    </div>
  </div>

  <div class="paging">
    <div class="tooltip body-tooltip top in" style="display: block;">
      <div class="tooltip-inner"></div>
    </div>
  </div>

  <div class="qt-inv-container"
       ng-model="invoiceLocks[showInvoiceLockIndex].invoiceDataDto || currentInvoice" invoice-content></div>

</div>
