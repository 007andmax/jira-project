<div class="cmp-dboard-stastics cmn-box d-flex">
  <ul class="list-unstyled d-flex">
    <li class="d-flex">
      <div class="cmp-profile-dp d-flex">
        <figure class="d-flex">
          <img
            src="html/assets/img/company-details/total-user.svg"
            alt="total-user"
          />
        </figure>
      </div>
      <div class="stastics-info d-flex">
        <div class="h1">{{countUsers}}</div>
        <span>Total Users</span>
      </div>
    </li>
    <li class="d-flex">
      <div class="cmp-profile-dp d-flex">

      <div class="stastics-info d-flex">
        <div class="h1">{{countDevices}}</div>
        <span>Total Devices</span>
      </div>
    </li>
    <li class="d-flex">
      <div class="cmp-profile-dp d-flex">
        <figure class="d-flex">
          <img
            src="html/assets/img/company-details/total-tickets.svg"

          />
        </figure>
      </div>
      <div class="stastics-info d-flex">
        <div class="h1">{{totalTickets}}</div>
        <span>Total Tickets</span>
      </div>
    </li>
    <li class="d-flex">
      <div class="cmp-profile-dp d-flex">
        <figure class="d-flex">
          <img
            src="html/assets/img/company-details/avg-response.svg"

          />

      </div>
      <div class="stastics-info d-flex">
        <div class="h1">{{averageResponseTime}} min</div>
