<div class="page-insider invoice-ticket">
    <div class="cmn-area in-ticks">
        <form
            [formGroup]="ticketForm"
            (ngSubmit)="onSubmit()"
        >
            <div class="f-row">
                <div class="f-col col-33">
                    <label>Starting ticket number</label>
                    <div class="form-row">
                        <input
                            type="text"
                            numbersOnly
                            formControlName="ticketCount"
                            class="form-input"
                            placeholder="Enter Starting ticket number"
                            value="Starting ticket number"
                        >
                        <div
                            *ngIf="submitted && f.ticketCount.errors"
                            class="invalid-feedback"
                        >
                            <div *ngIf="f.ticketCount.errors.required">Starting ticket number is required</div>
                            <div *ngIf="f.ticketCount.errors.pattern">Only Number is allowed</div>
                        </div>
                        <label
                            class="control-label"
                            *ngIf="used"
                        >
                            Already used. Next free is
                            <span class="free-number-link">
                                <!-- {{ ticketConfig.nextValid }} -->
                            </span>
                            .
                        </label>
                    </div>
                </div>


                <div class="f-col col-50">
                    <label>Outliers Time</label>


                    <div class="form-row outliersTime">
                        <span class="input-number">
                            <input
                                type="number"
                                min="1"
                                onkeypress="return event.charCode != 45"
                                formControlName="outliersTime"
                                class="number"
                            >
                            <div
                                *ngIf="submitted && f.outliersTime.errors"
                                class="invalid-feedback"
                            >
                                <div *ngIf="f.outliersTime.errors.required">OutliersTime is required</div>
                            </div>
                        </span>
                    </div>
                </div>
                <div class="f-col col-33">
                    <label>Timepicker type</label>
                    <div class="form-row">
                        <select
                            class="cmn-select form-input"
                            formControlName="timepickerType"
                        >
                            <option value="TIME_PICKER">Start-End time picker</option>
                            <option value="DURATION_PICKER">Duration picker</option>
                        </select>
                    </div>
                </div>
            </div>
            <input
                type="submit"
                class="btn btn-primary"
                value="Save Changes"
            >
        </form>
    </div>
    <!-- <div class="loading" *ngIf="loading"></div> -->
</div>
