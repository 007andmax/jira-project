<div
    class
    ngbDropdown
    [autoClose]="'outside'"
>
    <div
        class="device-user pointer"
        *ngIf="type === 'RECURRING_TICEKTS'"
        id="dropdownTehuser"
        style="margin-bottom: 10px;width: 109px;"
        ngbDropdownToggle
    >
        Assigned Users
    </div>
    <div
        class="tech__user-icon icon__assign-user"
        *ngIf="type === 'TICEKTS' && selectedUsers.length === 0 || type === 'CONTRACT'"
        id="dropdownTehuser"
        ngbDropdownToggle
    ></div>
    <button
        class="ticket-updates__photo-people"
        *ngIf="type === 'TICEKTS' && selectedUsers.length === 1"
        [textContent]="ticketsListService.getAssignedUserNameForAvatar(selectedUsers[0])"
        [ngStyle]="{'background': ticketsListService.getStyleAvatar(selectedUsers[0])}"
        id="dropdownTehuser"
        ngbDropdownToggle
        [disabled]="isDisabled"
        placement="top"
        [ngbTooltip]="ticketsListService.getUserName(selectedUsers[0])"
    ></button>
    <div
        class="teh-user-body"
        ngbDropdownMenu
        aria-labelledby="dropdownTehuser"
    >
        <div class="select-wrapper dropdown-assign-ticket fixed-assign">
            <div class="content">
                <form class="px-4 py-3">
                    <div
                        class="assign-ticket"
                        assign-user
                    >
                        <div class="assign-ticket-content">
                            <div class="assign-ticket-header">
                                <div class="clearfix">
                                    <div class="form-group">
                                        <input
                                            class="form-control"
                                            placeholder="Search Users"
                                            value
                                            autocomplete="off"
                                            (input)="onSearch($event)"
                                        >
                                    </div>
                                </div>
                            </div>
                            <div class="scroll-pane">
                                <div
                                    class="users-list custom-scroll"
                                    tabindex="-1"
                                    style="position: absolute; z-index: 9999;padding: 0; max-height: 171px;"
                                >
                                    <ng-template
                                        ngFor
                                        let-user
                                        [ngForOf]="usersList"
                                        let-i="index"
                                        [ngForTrackBy]="trackByIndex"
                                    >
                                        <div
                                            class="user-item"
                                            data-index="1"
                                            (click)="selectUser(i)"
                                            [ngClass]="(user.selected) ? 'active' : ''"
                                        >
                                            <a
                                                href="javascript:void(0)"
                                                [id]="user.id"
                                                class="dropdown-link"
                                            >
                                                <div
                                                    class="default-user-avatar avatar-background-color-odd ng-scope"
                                                    *ngIf="!user.avatar"
                                                >
                                                    <span [textContent]="(user.firstName) ? user.firstName[0].toUpperCase() : ''"></span>
                                                    <span [textContent]="(user.lastName) ? user.lastName[0].toUpperCase() : ''"></span>
                                                </div>
                                                <div
                                                    class="default-user-avatar avatar-background-color-odd ng-scope"
                                                    *ngIf="user.avatar"
                                                >
                                                    <img
                                                        ng-if="user.avatar"
                                                        class="img-circle avatar-26"
                                                        style="margin: 0;"
                                                        [src]="'/users/' + (user.id || 'default') + '/image' + (user.avatar ? '.jpg?t=' + user.avatar.updatedAt : '')"
                                                        alt="..."
                                                    >
                                                </div>
                                                <span>
                                                    <p [textContent]="user.firstName + ' ' + user.lastName"></p>
                                                    <p
                                                        [textContent]="user.primaryEmail"
                                                        style="margin: 0;"
                                                    ></p>
                                                </span>
                                            </a>
                                        </div>
                                    </ng-template>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
