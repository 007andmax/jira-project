<tr>
    <td class="track-and-bill-table__service-name">
        {{service.name}}
        <mat-error
            class="qt-tooltip-error qt-w-auto-important"
            *ngIf="!service.validate"
        >
            The selected service is existing on another contract with the same dates.
        </mat-error>
        <mat-error
            class="qt-tooltip-error qt-w-auto-important"
            *ngIf="!service.validateDuplicated"
        >
            Duplicate service name
        </mat-error>
    </td>
    <td class="track-and-bill-table__billable">
        <label class="qt-checkbox">
            <input
                type="checkbox"
                [(ngModel)]="service.billable"
            >
            <span></span>
        </label>
    </td>
    <td class="track-and-bill-table__tax --editable">
        <app-invoice-form-ticket-edit-taxes
            [hidden]="!service.billable"
            class="qt-taxes-multiselect"
            #taxesDropDown
            (taxesChange)="onTaxesChange($event)"
        ></app-invoice-form-ticket-edit-taxes>
    </td>
    <td class="track-and-bill-table__hourly-rate --editable">
        <input
            *ngIf="service.billable"
            class="payment-input qt-input-in-table"
            number
            [money]="true"
            [ngModel]="service.rate"
            (ngModelChange)="onChangeRate($event)"
            appToFixed
        >
    </td>
    <td>
        <div
            class="icon__raw-clear qt-ic-c qt-sz-16"
            (click)="remove()"
        ></div>
    </td>
</tr>
