<div class="credential-block">
    <div class="qt-df qt-fd-c qt-w100">
        <input
            class="credential-block__username qt-ff-sb qt-w100"
            type="text"
            [value]="item.username"
            (blur)="onCheckChangeName($event)"
        >
        <input
            class="credential-block__pass qt-ff-sb qt-w100"
            type="text"
            placeholder="********"
            [value]="item.password"
            (blur)="onCheckChangePassword($event)"
            (focus)="showPassword()"
        >
    </div>
    <div class="qt-df ">
        <div
            class="credential-block__icon-btn icon__play"
            (click)="select()"
        ></div>
        <div
            class="credential-block__icon-btn icon__remove"
            (click)="remove()"
        ></div>
    </div>
</div>
