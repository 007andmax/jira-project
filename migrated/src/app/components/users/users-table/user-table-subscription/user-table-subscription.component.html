<div ngbDropdown container="body">
  <div class="grey-dropdown">
    <div class="pointer subs-list"
         id="dropdownBasic"
         ngbDropdownToggle>
      <div [textContent]="title"></div>
      <i class="icn-sm report-caret-icon"></i>
    </div>
    <ul class="qt-dropdown-menu" ngbDropdownMenu aria-labelledby="dropdownBasic">
      <li ngbDropdownItem (click)="update('ticket')">Updates</li>
      <li ngbDropdownItem (click)="update('invoice')">Invoice</li>
      <li ngbDropdownItem (click)="update('ticketManager')">Ticket Manager</li>
    </ul>
  </div>
</div>
