<div class="tickets-dashboard-page billing-dashboard-page">
    <div
        class="loading"
        *ngIf="showPreloader"
    ></div>
    <div
        class="billing-dashboard-page__content tickets-dashboard-page__content"
        [hidden]="showPreloader"
    >
        <div class="qt-df qt-ai-c qt-jc-sb qt-mb-16">
            <h3 class="list-title qt-mt-0 qt-mb-0 qt-fs-16 qt-ff-sb">Dashboard</h3>
            <div
                class="list-type"
                ngbDropdown
            >
                <div
                    class="tickets-dashboard-page__dropdown pointer"
                    ngbDropdownToggle
                    [textContent]="currentInterval.title"
                    id="dropdownIntervals"
                ></div>
                <ul
                    class="qt-dropdown-menu --border --open-left"
                    ngbDropdownMenu
                    aria-labelledby="dropdownIntervals"
                >
                    <ng-template
                        ngFor
                        let-item
                        [ngForOf]="listIntervals"
                    >
                        <li
                            class="pointer"
                            tabindex="-1"
                            href="javascript:void(0)"
                            [textContent]="item.title"
                            ngbDropdownItem
                            (click)="onSelectInterval(item)"
                        ></li>
                    </ng-template>
                </ul>
            </div>
        </div>
        <div class="qt-df qt-jc-sb qt-mb-16">
            <app-dashboard-stats
                [title]="'Open Tickets'"
                [total]="dashboardTicketsStats.OPEN"
                [class]="'icon__tickets-on-time'"
            ></app-dashboard-stats>
            <app-dashboard-stats
                [title]="'On-hold Tickets'"
                [total]="dashboardTicketsStats.ON_HOLD"
                [class]="'icon__on-hold-tickets'"
            ></app-dashboard-stats>
            <app-dashboard-stats
                [title]="'New Tickets'"
                [total]="dashboardTicketsStats.UNASSIGNED"
                [class]="'icon__new-tickets'"
            ></app-dashboard-stats>
            <app-dashboard-stats
                [title]="'Completed Tickets'"
                [total]="dashboardTicketsStats.CLOSED"
                [class]="'icon__solved-tickets'"
            ></app-dashboard-stats>
            <app-dashboard-stats
                [title]="'Recurring Tickets'"
                [total]="dashboardTicketsStats.RECURRING_TICKETS"
                [class]="'icon__recurring-tickets'"
            ></app-dashboard-stats>
        </div>
        <app-tickets-analytics-widget
            #ticketsAnalytics
            (onTicketsAnalyticsReady)="onTicketsAnalyticsReady()"
        ></app-tickets-analytics-widget>
        <div class="qt-df qt-jc-sb qt-mb-16">
            <app-ticket-priority-widget
                #ticketPriority
                [dashboardTicketsStats]="dashboardTicketsStats"
            ></app-ticket-priority-widget>
            <app-recurring-ticket-widget
                #recurringTicket
                [dashboardTicketsStats]="dashboardTicketsStats"
            ></app-recurring-ticket-widget>
            <app-time-on-tickets-widget></app-time-on-tickets-widget>
        </div>
        <div class="qt-df qt-jc-sb qt-mb-16">
            <app-tickets-billable-hours-widget (onTicketsBillableHoursIsReady)="onTicketsBillableHoursIsReady()"></app-tickets-billable-hours-widget>
            <app-tech-tickets-widget (onTechTicketsIsReady)="onTechTicketsIsReady()"></app-tech-tickets-widget>
        </div>
    </div>
</div>
