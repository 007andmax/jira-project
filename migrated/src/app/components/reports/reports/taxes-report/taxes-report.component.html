<div>
  <app-report-menu [report]="'byTaxes'" (onSelectedClient)="onSelectedClient($event)" (onRequest)="onRequest($event)" (getReport)="getReport($event)"></app-report-menu>
 </div>
 <app-report-additional-actions   [fileName]="'taxes_report'" [selectedClient]="selectedClient"></app-report-additional-actions>
 <div class="loading" *ngIf="loadingInProgress"></div>
 <div class="product-list___ticket" id="product-list-ticket-data" >

  <div  class="product-list-ticket acc-col"   style="height: 100%;" *ngIf="!loadingInProgress">
    <div class="report-header"  >
       <h1>Tax Report</h1>
       <div class="company-info">
         <h3  [textContent]="(selectedClient) ? selectedClient.name : 'All companies'"></h3>
         <!--  <p><span [textContent]="perseStartDate()"></span> - <span [textContent]="perseEndDate()"></span></p>-->
       </div>
     </div>

     <div class="report-header">
      <h1>Tax Report</h1>
      <div class="company-info">
        <h3 [textContent]="(taxes.clientCompanyName) ? taxes.clientCompanyName : 'All companies'"></h3>
        <!-- <p><span>1 Dec 2018</span> - <span>31 Dec 2018</span></p> -->
      </div>
    </div>
    <div class="header-product-list-ticket" *ngIf="taxes.lines.length > 0">
      <!--HEADER-->
      <h3 [textContent]="taxes.techCompanyName"></h3>
      <p *ngIf="taxes.type ==='DETAILED' ">Account Recivable for <span [textContent]="taxes.clientCompanyName"></span>
      </p>
    </div>
    
     <div>
       <app-overview-report [headers]="headers" [list]="list"></app-overview-report>  
     
     </div>
  <app-report-footer></app-report-footer>
   </div>
 </div>
