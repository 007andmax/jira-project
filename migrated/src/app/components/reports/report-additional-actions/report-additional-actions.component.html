<div class="product-list-report-btn product-list-report-btn-ticket clearfix">
    <div
        class="product-report-btn"
        ngbDropdown
        keyboard-nav="true"
        uib-tooltip="export"
        tooltip-placement="top"
    >
        <div
            uib-dropdown-toggle
            style="height: 100%;width: 100%;"
            ngbDropdownToggle
        >
            <img
                src="assets/img/icons/export-icon.png"
                alt="export"
            >
        </div>
        <ul
            ngbDropdownMenu
            aria-labelledby="dropdown1"
        >
            <ng-template
                ngFor
                let-item
                [ngForOf]="listExport"
                let-i="index"
            >
                <li
                    class="open-pdf-btn "
                    ngbDropdownItem
                    [textContent]="item"
                    (click)="onSelectExport(item)"
                ></li>
            </ng-template>
        </ul>



    </div>
    <div
        class="product-report-btn"
        uib-tooltip="print"
        tooltip-placement="top"
        (click)="getPdfIdFromRest(ACION_OPEN_PDF)"
    >
        <img
            src="assets/img/icons/printer-icon.png"
            alt="print"
        >
    </div>
    <div
        class="product-report-btn dropdown-email"
        uib-tooltip="send mail"
        tooltip-placement="top"
        (click)="sendEmail()"
    >
        <div style="height: 100%;width: 100%;">
            <img
                src="assets/img/icons/message-icon.png"
                alt="send mail to"
            >
        </div>
    </div>



    <div
        *ngIf="report === 'company-roducts-report'"
        style="max-width: 300px; float: right; height: 32px; display: flex; align-items: center; margin-right: 10px;"
    >
        <label
            class="control checkbox hide-in-report"
            style="margin-left: 10px;margin-top: -3px;"
        >
            <input
                type="checkbox"
                (change)="togglePurchaseCost($event)"
                checked
            >
            <span class="control-indicator"></span>
        </label>
        Include product cost in report
    </div>
</div>
