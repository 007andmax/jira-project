<div class="qt-page-list products-page">
    <inventory-header
        (onSearch)="onSearch($event)"
        (onFilter)="onFilter($event)"
    ></inventory-header>
    <div class="qt-page-list__body">
        <div class="qt-page-list__body-table-container">
            <table class="qt-page-list__body-tbody qt-table-modern products-table">
                <tbody
                    infiniteScroll
                    [infiniteScrollDistance]="2"
                    [infiniteScrollThrottle]="50"
                    [infiniteScrollDisabled]="infiniteScrollDisabled"
                    (scrolled)="onScroll()"
                >
                    <ng-template
                        ngFor
                        let-inventory
                        [ngForOf]="inventoryList"
                        [ngForTrackBy]="trackById"
                    >
                        <app-inventory-table
                            [companies]="companies"
                            [taxes]="taxes"
                            [glNumbers]="glNumbers"
                            [inventory]="inventory"
                        ></app-inventory-table>
                    </ng-template>
                    <div
                        class="loading"
                        *ngIf="showPreloader"
                    ></div>
                </tbody>
            </table>
        </div>
    </div>
</div>
