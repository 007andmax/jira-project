<div class="network-scan-modal">
  <div class="close-btn btn btn-icn" ng-click="close()" tabindex="-1">
    <i class="icn-sm icn-remove-old" ></i>
  </div>
  <div ng-form="credentialsForm">
    <p>Master agent has wrong credentials. Update it.</p>
    <div class="form-container">
      <div class="form-group" ng-class="{'has-error': isShowingErrors(credentialsForm, 'agentName')}">

        <div ng-messages="credentialsForm.agentName.$error"
             ng-class="{'hide': !isShowingErrors(credentialsForm, 'agentName')}">
          <label class="control-label" ng-message="required">Login can't be left empty</label>
        </div>

        <input type="text" class="form-control" name="agentName" ng-model="dto.login"
               placeholder="Login" ng-required="!!dto.password">
      </div>
      <div class="form-group">
        <!--<label class="control-label"></label>-->
        <input type="password" class="form-control" name="agentPassword"
               ng-model="dto.password" autocomplete="new-password"
               placeholder="Password">
      </div>
    </div>
  </div>
  <div class="btn btn-primary has-tooltip" ng-click="testAndUpdateCredentials(credentialsForm)"
       custom-disabled="{{ isUpdateInProgress }}">
    Update
  </div>
</div>
