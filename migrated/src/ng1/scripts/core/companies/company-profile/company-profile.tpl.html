<div ng-controller="quicktech.core.companies.companyProfileTabsCtrl">
  <div ng-if=" companyData && company">
    <div ng-if="getOpenedTab() === 'dashboard'"
      ng-include="'/ng1/scripts/core/companies/company-profile/tabs/dashboard/dashboard.tpl.html'">
    </div>
  
    <div
      ng-if="getOpenedTab() === 'tickets-all'|| getOpenedTab() === 'tickets-unassigned'|| getOpenedTab() === 'tickets-inProgress'|| getOpenedTab() === 'tickets-onHold' || getOpenedTab() === 'tickets-completed'"
      ng-include="'/ng1/scripts/core/companies/company-profile/tabs/tickets-tab/tickets-tab.tpl.html'">
    </div>
    <div
      ng-if="getOpenedTab() === 'devices-all' || getOpenedTab() === 'devices-workstations' || getOpenedTab() === 'devices-servers' || getOpenedTab() === 'devices-devices'"
      ng-include="'/ng1/scripts/core/companies/company-profile/tabs/devices-tab/companyDevices-tab.tpl.html'">
    </div>
    <div ng-if="getOpenedTab() === 'network-scan'"
      ng-include="'/ng1/scripts/core/companies/company-profile/tabs/network-scan-tab/dashboard-network-scan-tab.tpl.html'">
    </div>
    
    <div ng-if="getOpenedTab() === 'contracts'"
      ng-include="'/ng1/scripts/core/companies/company-profile/tabs/contracts-tab/contracts-tab.tpl.html'">
    </div>
  </div>
</div>
