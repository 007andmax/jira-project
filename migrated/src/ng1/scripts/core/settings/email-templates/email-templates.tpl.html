<div class="settings-main-wrapper">
  <div class="help-text">Configure email templates according to your help desk requirements. Here, you can set what
    emails to send to agents, users, and vendors when their related actions are performed.
  </div>
  <div class="email-templates-wrapper">

    <h3 id="emailTemplatesTicket">Ticket Templates</h3>

    <ul class="template-list list-unstyled">

      <li class="template-item"
          ng-class="{'expanded': template === currentOpenTemplate,'default': !emailSettingPageDto.activeAndNotDefault[template].isNotDefault}"
          ng-repeat="(template, templateInfo) in ticketTemplates"
          ng-click="openEmailTemplate(template, $event)">

        <div ng-include="'/ng1/scripts/core/settings/email-templates/email-template.tpl.html'"></div>

      </li>

    </ul>
