<div class="settings-main-wrapper">

  <div class="help-text">
    Manage your basic information and general account settings.
    Here, you can set when HelpPro
    sends you updates via email.
  </div>

  <div class="basic-info-wrapper" id="myProfileBasicInfo"
       ng-controller="quicktech.core.settings.myProfileBasicInfoCtrl">

    <div class="create-new-user settings-basic-info clearfix">
      <form name="basicInfoForm">
        <div class="create-user-container">

          <div class="create-user-header clearfix">
            <h3 class="pull-left">Basic Info</h3>
          </div>

          <div edit-avatar model="editUser" model-name="user"></div>

          <div class="create-user-form">

            <div class="form-row clearfix">

              <div class="form-group" ng-class="{'has-error': isShowingErrors(basicInfoForm, 'firstName')}">

                <label class="control-label" ng-class="{'hide': isShowingErrors(basicInfoForm, 'firstName')}">
                  First Name
                </label>

                <div ng-messages="basicInfoForm.firstName.$error"
                     ng-class="{'hide': !isShowingErrors(basicInfoForm, 'firstName')}">
                  <label class="control-label" ng-message="required">First name is required.</label>
                  <label class="control-label" ng-message="maxlength">First name is too large.</label>
                  <label class="control-label" ng-message="minlength">First name is too short.</label>
                </div>

                <input type="text" class="form-control" aria-expanded="true" ng-minlength="2" ng-maxlength="15"
                       name="firstName" ng-model="editUser.firstName" required="true" make-dirty-on-blur
                       execute-when-outfocused="saveBasicInfo(basicInfoForm)">
              </div>

              <div class="form-group" ng-class="{'has-error': isShowingErrors(basicInfoForm, 'lastName')}">

                <label class="control-label" ng-class="{'hide': isShowingErrors(basicInfoForm, 'lastName')}">
                  Last Name
                </label>

                <div ng-messages="basicInfoForm.lastName.$error"
                     ng-class="{'hide': !isShowingErrors(basicInfoForm, 'lastName')}">
                  <label class="control-label" ng-message="maxlength">Last name is too large.</label>
                </div>

                <input type="text" class="form-control" aria-expanded="true" ng-maxlength="15"
                       name="lastName" ng-model="editUser.lastName" make-dirty-on-blur
                       execute-when-outfocused="saveBasicInfo(basicInfoForm)">
              </div>
            </div>

            <div class="form-row clearfix">

              <div class="form-group" ng-class="{'has-error': isShowingErrors(basicInfoForm, 'designation')}">

                <label class="control-label" ng-class="{'hide': isShowingErrors(basicInfoForm, 'designation')}">
                  Designation
                </label>

                <div ng-messages="basicInfoForm.designation.$error"
                     ng-class="{'hide': !isShowingErrors(basicInfoForm, 'designation')}">
                  <label class="control-label" ng-message="maxlength">Designation is too large</label>
                  <label class="control-label" ng-message="minlength">Designation is too short</label>
                </div>

                <input type="text" class="form-control " name="designation" aria-expanded="true" make-dirty-on-blur
                       ng-model="editUser.designation" ng-minlength="3" ng-maxlength="30"
                       execute-when-outfocused="saveBasicInfo(basicInfoForm)">
              </div>

              <div class="form-group" ng-class="{'has-error': isShowingErrors(basicInfoForm, 'primaryEmail')}">

                <label class="control-label" ng-class="{'hide': isShowingErrors(basicInfoForm, 'primaryEmail')}">
                  Email
                </label>

                <div ng-messages="basicInfoForm.primaryEmail.$error"
                     ng-class="{'hide': !isShowingErrors(basicInfoForm, 'primaryEmail')}">
                  <label class="control-label" ng-message="required">Email field cannot be left empty.</label>
                  <label class="control-label" ng-message="pattern">Please enter a valid email address.</label>
                  <label class="control-label" ng-message="unique">This email already occupied.</label>
                  <label class="control-label" ng-message="maxlength">Email mustn't be greater then 128 chars.</label>
                </div>

                <input type="text" class="form-control" name="primaryEmail" aria-expanded="true" make-dirty-on-blur
                       ng-model="editUser.primaryEmail" ng-required="true" ng-pattern="emailPattern"
                       is-uniq-validation validation-func="validateUserEmail" ng-maxlength="128"
                       execute-when-outfocused="saveBasicInfo(basicInfoForm)">
              </div>

            </div>

            <!--<div class="form-row clearfix">-->

            <!--<div class="form-group" ng-class="{'has-error': isShowingErrors(basicInfoForm, 'secondaryEmail')}">-->

            <!--<label class="control-label" ng-class="{'hide': isShowingErrors(basicInfoForm, 'secondaryEmail')}">-->
            <!--Secondary Email-->
            <!--</label>-->

            <!--<div ng-messages="basicInfoForm.secondaryEmail.$error"-->
            <!--ng-class="{'hide': !isShowingErrors(basicInfoForm, 'secondaryEmail')}">-->
            <!--<label class="control-label" ng-message="pattern">Please enter a valid email address.</label>-->
            <!--</div>-->

            <!--<input type="text" class="form-control" name="secondaryEmail" aria-expanded="true" make-dirty-on-blur-->
            <!--ng-model="editUser.secondaryEmail" ng-pattern="emailPattern">-->
            <!--</div>-->

            <!--<div class="form-group">-->

            <!--<label class="control-label">Account Type</label>-->

            <!--<input class="form-control readonly-dark" type="text" ng-value="accountType[editUser.role]"-->
            <!--readonly="readonly">-->

            <!--</div>-->

            <!--</div>-->

            <div class="form-row clearfix" ng-if="loadUserProfile">

              <div class="form-group full-width" text-editor ng-model="userProfile.signature.content"
                   te-initial-value="{{ userProfile.signature.content }}"
                   te-text-maxlength="5000" te-html-maxlength="5000" name="signature"
                   ng-class="{'has-error': isShowingErrors(basicInfoForm, 'signature')}">

                <label class="control-label" ng-hide="isShowingErrors(basicInfoForm, 'signature')">
                  Signature
                </label>

                <div ng-messages="basicInfoForm.signature.$error"
                     ng-show="isShowingErrors(basicInfoForm, 'signature')">
                  <label class="control-label" ng-message="maxlength">Signature mustn't be greater then 5000 characters.
                  </label>
                </div>

                <div id="editor" class="form-control editor" contenteditable="true"
                     te-editor contenteditable="true" placeholder="Type your message..."
                     execute-when-outfocused="saveBasicInfoWithTimeout(basicInfoForm)"></div>

                <div class="wysiwyg-controls-wrapper clearfix">

                  <div class="control-wrappers pull-left clearfix"
                       data-role="editor-toolbar" data-target="#editor">

                    <div class="font-styles pull-left">

                      <a data-edit="bold" class="hit-area ha-14 pull-left has-tooltip active"
                         tooltip-append-to-body="true" data-placement="top" uib-tooltip="Bold"
                         tooltip-html-unsafe="<div class='tooltip body-tooltip'><div class='tooltip-inner'></div></div>">
                        <i class="icon-sm wysiwyg-bold"></i>
                      </a>

                      <a data-edit="italic" class="hit-area ha-14 pull-left has-tooltip"
                         tooltip-append-to-body="true" data-placement="top" uib-tooltip="Italic"
                         tooltip-html-unsafe="<div class='tooltip body-tooltip'><div class='tooltip-inner'></div></div>">
                        <i class="icon-sm wysiwyg-italic"></i>
                      </a>

                      <a data-edit="underline" class="hit-area ha-14 pull-left has-tooltip"
                         tooltip-append-to-body="true" data-placement="top" uib-tooltip="Underline"
                         tooltip-html-unsafe="<div class='tooltip body-tooltip'><div class='tooltip-inner'></div></div>">
                        <i class="icon-sm wysiwyg-underline"></i>
                      </a>

                    </div>
                  </div>

                  <a href="javascript:void(0)" class="hit-area ha-14 pull-right has-tooltip" data-edit="removeformat"
                     tooltip-append-to-body="true" data-placement="top" uib-tooltip="Reset Formating"
                     tooltip-html-unsafe="<div class='tooltip body-tooltip'><div class='tooltip-inner'></div></div>">
                    <i class="icon-sm wysiwyg-reset"></i>
                  </a>

                </div>
              </div>
            </div>

            <!--<div class="form-row clearfix">-->
            <!--<div class="form-group no-label full-width">-->
            <!--<button class="btn btn-lg btn-primary pull-right"-->
            <!--custom-disabled="{{ !basicInfoForm.$valid || basicInfoForm.$pristine || savingInProcess }}"-->
            <!--ng-click="saveBasicInfo(basicInfoForm)">Save-->
            <!--</button>-->
            <!--</div>-->
            <!--</div>-->

          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="change-password-wrapper" id="myProfileAboutMe">

    <div class="create-new-user settings-basic-info clearfix">
      <form name="aboutMeForm">
        <div class="create-user-container">

          <div class="create-user-header clearfix">
            <h3 class="pull-left">About Me</h3>
          </div>

          <div class="create-user-form">
            <div class="form-row clearfix">

              <div class="form-group full-width" ng-class="{'has-error': isShowingErrors(aboutMeForm, 'aboutMe')}">

                <label class="control-label" ng-class="{'hide': isShowingErrors(aboutMeForm, 'aboutMe')}">
                  About Me Information
                </label>

                <div ng-messages="aboutMeForm.aboutMe.$error"
                     ng-class="{'hide': !isShowingErrors(aboutMeForm, 'aboutMe')}">
                  <label class="control-label" ng-message="maxlength">About me is too large</label>
                </div>

                <input type="text" class="form-control" name="aboutMe" ng-model="aboutMe" ng-maxlength="255"
                       execute-when-outfocused="saveAboutMe(aboutMeForm)">

              </div>

            </div>

            <!--<div class="form-row clearfix">-->
            <!--<div class="form-group no-label full-width">-->
            <!--<div class="btn btn-lg btn-primary pull-right"-->
            <!--custom-disabled="{{ !aboutMeForm.$valid || aboutMeForm.$pristine || savingAboutMeInProcess }}"-->
            <!--ng-click="saveAboutMe(aboutMeForm)">Save-->
            <!--</div>-->
            <!--</div>-->
            <!--</div>-->

          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="change-password-wrapper" id="myProfileChangePassword">

    <div class="create-new-user settings-basic-info clearfix">
      <form name="passwordForm">
        <div class="create-user-container">

          <div class="create-user-header clearfix">
            <h3 class="pull-left">Change Password</h3>
          </div>

          <div class="create-user-form">
            <div class="form-row clearfix">
              <div class="form-group full-width" ng-class="{'has-error': isShowingErrors(passwordForm, 'oldPassword')}">

                <label class="control-label" ng-class="{'hide': isShowingErrors(passwordForm, 'oldPassword')}">
                  Old Password
                </label>

                <div ng-messages="passwordForm.oldPassword.$error"
                     ng-class="{'hide': !isShowingErrors(passwordForm, 'oldPassword')}">
                  <label class="control-label" ng-message="notCorrectPass">Old Password is not correct</label>
                </div>

                <input style="padding-right: 40px;" type="{{ showOldPasswoprd ? 'text' : 'password' }}"
                       class="form-control show-password"
                       ng-model="password.oldPassword" name="oldPassword" replace-whitespace
                       ng-change="enableOnChange(passwordForm.oldPassword)">

                <a ng-class="{'hide': !showOldPasswoprd}" href="javascript:void(0)"
                   class="hide-password-hit hit-area ha-18 has-tooltip"
                   ng-click="showOldPasswoprd = false" tooltip-placement="top"
                   uib-tooltip="Show Password">
                  <i class="icn-sm icn-hide-password"></i>
                </a>

                <a ng-class="{'hide': showOldPasswoprd}" href="javascript:void(0)"
                   class="hide-password-hit hit-area ha-18 has-tooltip"
                   ng-click="showOldPasswoprd = true" tooltip-placement="top" uib-tooltip="Hide Password"
                   style="position: absolute;right: 12px;top: 31px;">
                  <i class="icn-sm icn-show-password"></i>
                </a>

              </div>
            </div>

            <div class="form-row clearfix">
              <div class="form-group full-width"
                   ng-class="{'has-error': isShowingErrors(passwordForm, 'newPassword')}">

                <label class="control-label" ng-class="{'hide': isShowingErrors(passwordForm, 'newPassword')}">
                  New Password
                </label>

                <div ng-messages="passwordForm.newPassword.$error"
                     ng-class="{'hide': !isShowingErrors(passwordForm, 'newPassword')}">
                  <label class="control-label" ng-message="minlength">Password is too short</label>
                </div>

                <input style="padding-right: 40px;" type="{{ showNewPasswoprd ? 'text' : 'password' }}"
                       class="form-control show-password"
                       ng-model="password.newPassword" name="newPassword" ng-minlength="4" replace-whitespace
                       ng-change="validateConfirmPassword(password.newPassword, password.confirmNewPassword, passwordForm.confirmNewPassword)">

                <a ng-class="{'hide': !showNewPasswoprd}" href="javascript:void(0)"
                   class="show-password-hit hit-area ha-18 has-tooltip"
                   ng-click="showNewPasswoprd = false" tooltip-placement="top"
                   uib-tooltip="Show Password">
                  <i class="icn-sm icn-hide-password"></i>
                </a>

                <a ng-class="{'hide': showNewPasswoprd}" href="javascript:void(0)"
                   class="show-password-hit hit-area ha-18 has-tooltip"
                   ng-click="showNewPasswoprd = true" tooltip-placement="top" uib-tooltip="Hide Password"
                   style="position: absolute;right: 12px;top: 31px;">
                  <i class="icn-sm icn-show-password"></i>
                </a>

              </div>
            </div>

            <div class="form-row clearfix">
              <div class="form-group full-width"
                   ng-class="{'has-error': isShowingErrors(passwordForm, 'confirmNewPassword')}">

                <label class="control-label" ng-class="{'hide': isShowingErrors(passwordForm, 'confirmNewPassword')}">
                  Confirm New Password
                </label>

                <div ng-messages="passwordForm.confirmNewPassword.$error"
                     ng-class="{'hide': !isShowingErrors(passwordForm, 'confirmNewPassword')}">
                  <label class="control-label" ng-message="confirm">Passwords do not match</label>
                </div>

                <input style="padding-right: 40px;" class="form-control show-password"
                       type="{{ showConfirmNewPasswoprd ? 'text' : 'password' }}"
                       ng-model="password.confirmNewPassword" name="confirmNewPassword" required replace-whitespace
                       ng-change="validateConfirmPassword(password.newPassword, password.confirmNewPassword, passwordForm.confirmNewPassword)">

                <a ng-class="{'hide': !showConfirmNewPasswoprd}" href="javascript:void(0)"
                   class="show-password-hit hit-area ha-18 has-tooltip"
                   ng-click="showConfirmNewPasswoprd = false" tooltip-placement="top"
                   uib-tooltip="Show Password">
                  <i class="icn-sm icn-hide-password"></i>
                </a>

                <a ng-class="{'hide': showConfirmNewPasswoprd}" href="javascript:void(0)"
                   class="show-password-hit hit-area ha-18 has-tooltip"
                   ng-click="showConfirmNewPasswoprd = true" tooltip-placement="top" uib-tooltip="Hide Password"
                   style="position: absolute;right: 12px;top: 31px;">
                  <i class="icn-sm icn-show-password"></i>
                </a>

              </div>
            </div>

            <div class="form-row clearfix">
              <div class="form-group no-label full-width">
                <div class="btn btn-lg btn-primary pull-right"
                     custom-disabled="{{ !passwordForm.$valid || passwordForm.$pristine || savingPasswordInProcess }}"
                     ng-click="savePassword(passwordForm)">Save new password
                </div>
              </div>
            </div>


          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="contact-info-wrapper" id="myProfileContactInfo"
       ng-controller="quicktech.core.settings.myProfileContactInfoCtrl">

    <div class="create-new-user settings-basic-info clearfix">
      <form name="phoneNumbersForm">
        <div class="create-user-container">

          <div class="create-user-header clearfix">
            <h3 class="pull-left">Contact Info</h3>
          </div>

          <div class="create-user-form">


            <div address-autocomplete template-page="settings" focus-address="isAddressFocused"
                 ng-model="userProfile.address" save-func="saveContactInfo"
                 show-validation-messages="triedToSave"></div>

            <div phone-numbers-edit ng-model="userProfile.address.phoneNumbers" is-try-to-save="savingProfileSettings"
                 country-code="{{userProfile.address.countryCode}}" on-lost-focus="saveContactInfo"></div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div id="deactivateAccount" ng-if="currentUser.isOwner">
    <h3 class="pull-left" style="font-size: 17px;">Deactivate Account</h3>
    <div class="row">
      <div class="col-md-12" style="padding: 0">
        <div class="btn btn-primary" deactivate-button>
          <div style="line-height: 2.5em;">Deactivate Account</div>
        </div>
      </div>
    </div>
  </div>

</div>
