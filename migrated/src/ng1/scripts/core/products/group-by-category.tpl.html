<div>

  <ul class="qt-list qt-products">

    <li ng-repeat="category in productsData.categories | orderBy: ['default', 'name'] track by category.id"
        ng-controller="quicktech.core.products.categoryCtrl" ng-form="editCategoryForm"
        on-finish-render="loadingFinished()"
        ng-class="{'default-ctgr-prdcs': category.default}">

      <div class="clickable-layer"
           ng-click="category.productsList.length > 0 ? setExpandedCategoryId(category.id) : null"></div>

      <div class="intermediate-category">
        <div class="col-1">
          <div class="category-name">{{ category.name}}</div>
        </div>

        <div class="col-2">

          <div class="no-items"
               ng-class="{'not-hide-labels': category.default || !PermissionsService.isAllowed('MANAGE_PRODUCTS')}">
            {{ category.productsList.length }} items
          </div>

          <div class="product-actions" ng-if="!category.default && PermissionsService.isAllowed('MANAGE_PRODUCTS')">

            <div class="btn btn-primary has-tooltip" create-new-entity="product" item="category"
                 category-for-modal="category"
                 tooltip-placement="top" tooltip-append-to-body="true" uib-tooltip="Add Product">
              <i class="icn-sm icn-product-add"></i>
            </div>

            <a href="javascript:void(0)" class="ha-delete hit-area pull-right has-tooltip"
               tooltip-placement="top" tooltip-append-to-body="true" uib-tooltip="Delete"
               ng-click="deleteCategory()" ng-if="!(category.productsList && category.productsList.length)">
              <i class="icon-sm icn-delete"></i>
            </a>

          </div>

        </div>

        <div class="slide-category-content angular-animate" ng-if="category.id === expandedCategoryId">
          <div>

            <div class="qt-list qt-product-list left-list">

              <div ng-include="'/ng1/scripts/core/products/products-table-header.tpl.html'"></div>

              <div
                ng-repeat="product in category.productsList | orderBy : orderByForProducts : orderProducts.reverse track by product.versionedId.id"
                ng-controller="quicktech.core.products.productCtrl"
                show-model-element="{{ 'show-' + product.versionedId.id}}"
                ng-init="setHighlightCreatedProductId(product.versionedId.id)">

                <div ng-include="'/ng1/scripts/core/products/products-table-row.tpl.html'"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </li>

  </ul>
</div>

    i[r] = i[r] || function () {

    a.async = 1;
