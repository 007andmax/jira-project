<ul class="context-menu rp-user-popover">

  <li>
    <a tabindex="-1" href="javascript:void(0)"
       ng-show="user.primaryEmail && user.primaryEmail.length > 0" ng-click="sendEmail()">
      <i class="icon-sm icn-user-mail pull-left"></i>Email
    </a>
  </li>

  <li ng-hide="selectMoreThanOneUser || !user.phoneNumbers || !user.phoneNumbers.length">
    <a tabindex="-1" href="javascript:void(0)" copy-key="user.phoneNumbers[0].number">
      <i class="icon-sm icn-iphone pull-left"></i>{{ user.phoneNumbers[0].number }}
    </a>
  </li>

  <li class="dropdown-submenu left-align" ng-hide="selectMoreThanOneUser">

    <a tabindex="-1" href="javascript:void(0)">
      <i class="icon-sm icn-user-privilege pull-left"></i>Set {{ user.firstName }} Priviled
    </a>

    <div class="dropdown-submenu-wrapper">

      <ul class="dropdown-menu dropdown-privilege">

        <li ng-class="{'active': user.role === 'USER'}">
          <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserRole('USER')"> User </a>
        </li>

        <li ng-class="{'active': user.role === 'ADMIN'}">
          <a tabindex="-1" href="javascript:void(0)" ng-click="changeUserRole('ADMIN')"> Administrator </a>
        </li>

      </ul>
    </div>

  </li>

  <!-- TODO do subscriptions-->
  <li class="dropdown-submenu left-align" ng-hide="selectMoreThanOneUser">

    <a tabindex="-1" href="javascript:void(0)">
      <i class="icon-sm icn-user-subscription pull-left"></i>Subscribe {{ user.firstName }} to...
    </a>

    <div class="dropdown-submenu-wrapper">

      <ul class="dropdown-menu dropdown-subscribe">

        <li ng-class="{'checked': user.subscriptions[user.id].ticket}">
          <a tabindex="-1" href="javascript:void(0)"  ng-click="subscribeUser(user.id, 'ticket')">
            <div class="clearfix">
              <label class="control checkbox pull-left">
                <input type="checkbox" ng-checked="user.subscription.ticket"
                       ng-disabled="disabledUpdateCheckbox">
                <span class="control-indicator"></span> Ticket Updates
              </label>
            </div>
          </a>
        </li>

        <li ng-class="{'checked': user.subscriptions[user.id].invoice}">
          <a tabindex="-1" href="javascript:void(0)" ng-click="subscribeUser(user.id, 'invoice')">
            <div class="clearfix">
              <label class="control checkbox pull-left">
                <input type="checkbox" ng-checked="user.subscription.invoice"
                       ng-disabled="disabledUpdateCheckbox || isLastUserWithInvoiceSubscription(user)">
                <span class="control-indicator"></span> Invoice Updates
              </label>
            </div>
          </a>
        </li>

        <li ng-class="{'checked': user.subscriptions[user.id].ticketManager}">
          <a tabindex="-1" href="javascript:void(0)" ng-click="subscribeUser(user.id, 'ticketManager')">
            <div class="clearfix">
              <label class="control checkbox pull-left">
                <input type="checkbox" ng-checked="user.subscription.ticketManager"
                       ng-disabled="disabledUpdateCheckbox">
                <span class="control-indicator"></span> Ticket Manager
              </label>
            </div>
          </a>
        </li>

      </ul>
    </div>
  </li>

  <li>
    <a tabindex="-1" href="javascript:void(0)" ng-click="archiveContact()"
       ng-if="PermissionsService.isAllowed('ARCHIVE_USERS')">
      <i class="icon-sm icn-delete pull-left"></i>
      Archive this Contact
    </a>
  </li>

</ul>
