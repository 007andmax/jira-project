<div ng-controller="quicktech.core.tickets.ticketsCtrl" ticket-uploader style="background:#f7fcff;">

  <div class="container-ticket-list pull-left">
    <div class="empty-page-helper" ng-if="!tickets.length && !loadingOrRendering">
      <p style="opacity: 0.57">There are no tickets</p>
    </div>
    <div class="desktop-hidden tickets-mob-filters" style="text-transform: capitalize">
      {{ ticketsGroup }} tickets
    </div>
    <div class="ticket-list" ng-style="{'display': !tickets.length && !loadingOrRendering ? 'none' : 'block'}">
      <ul class="tickets" tu-tickets-container>
        <li class="ticket {{ ticket.priorityLevel.toLowerCase() }}-priority-border"
            ng-repeat="ticket in tickets track by ticket.id"
            ng-controller="quicktech.core.tickets.ticketCtrl" on-finish-render="onFinishRendering()"
            ng-class="{'selected' : selectedTickets[ticket.id], 'closed': ticket.status === 'COMPLETED', 'active': ticket.id === currentOpeningTicket}"
            ui-sref="tickets.details({ ticketId: ticket.id, remoteParams: null })">
          <div ng-include="'/ng1/scripts/core/tickets/ticket.tpl.html'"></div>
        </li>
        <button class="mob-filters-btn mobile-btn primary"
                ng-click="toggleMobileTicketsFilters(true)">
          Filters
        </button>


      </ul>
    </div>
  </div>

  <div ui-view></div>

</div>
