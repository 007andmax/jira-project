        <div uib-dropdown>
          <input type="text"
                 value="Onsite"
                 class="new-input form-control has-dropdown"
                 placeholder="Service"
                 name="serviceName" placeholder="Service" uib-dropdown-toggle aria-expanded="false"
                 ng-model="serviceExpense.item.name" required
                 uib-tooltip="Service"
                 tooltip-placement="top"
                 tooltip-append-to-body="true">

          <ul class="dropdown-menu dropdown-menu-services dropdown-menu-services-create">

            <li role="presentation"
                ng-repeat="service in serviceList | orderBy: 'name'">
              <a role="menuitem" tabindex="-1" href="javascript:void(0)" ng-click="serviceExpense.item = service">
                {{ service.name }}
              </a>
            </li>

          </ul>
        </div>

        <div style="position: absolute;right: 10px;top: 9px;cursor: pointer;"
             typeahead-input-icon="serviceExpense.item"></div>
        <div class="service-list-container"></div>
        <input type="hidden" name="service" ng-model="serviceExpense.item.versionedId.id"
               ng-required="serviceExpense.item ? true : false">
      </div>
    </div>
    <div ng-if="isMobileUpdateShown">
      <div class="col-2" service-quantity-picker="serviceExpense.quantity" sqp-is-show-format="false"
           ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceTime')}">
        <input uib-tooltip="Hr(s) : Min(s)" tooltip-placement="top"
               id="service-quantity-picker" type="text" class="form-control"
               placeholder="Hr(s) : Min(s)" sqp-input
               autocomplete="off" aria-expanded="true" />
        <input type="hidden" ng-model="serviceExpense.quantity" name="serviceTime"
               ng-required="serviceExpense.item ? true : false" />
      </div>
    </div>
    <div class="col-2" ng-if="serviceExpenseDurationPresentation==='DURATION_PICKER' && !isMobileUpdateShown ">

  <div class="col-2 new-date-picker" style="position: relative"
       ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceData')}">
    <input type="text" class="new-input absolute-stick-datepicker has-dropdown" placeholder="Date"
           qt-data-time-picker data-position="ticket" ng-model="serviceExpense.date"
           name="serviceData" ng-required="true">
  </div>
  <div class="col-1" ng-class="{'has-error': isShowingErrors(addServiceForm, 'serviceDescription')}">
    <div class="ticket-update-service-description">
        <textarea auto-expand limit="250"
                  value="serviceExpense.description"
                  type="text" style="width: 100%; border: none" type="text" class="form-validation modal-textarea"
                  ng-model="serviceExpense.description" ng-required="true" rows="1"
                  name="editProductDescription" tabindex="1"></textarea>
    </div>
  </div>

  <div class="ticket-add-service-actions">
    <div style="margin-bottom: 25px;" class="has-tooltip" tooltip-placement="top" uib-tooltip="Remove"
         ng-click="removeService()">
      <i class="icon-sm icn-delete"></i>
    </div>
    <div ng-if="$last">
      <div class="has-tooltip add-expense-btn" uib-tooltip="Add" tooltip-placement="top"

        <i class="icon-sm icn-add-action"></i>
