<div class="ticket-update-service-edit"
     ng-controller="quicktech.core.tickets.ticketEditUpdateServiceCtrl">
  <form name="updateTicketService">
    <div class="col-md-6 service-name gm pl-0">
        <label class="checkbox-container">
            <input type="checkbox">
            <span class="checkbox-mark"></span>
          </label>
          
        <div class="edit-col1" ng-class="{'has-error': !editService.item.versionedId.id}">
            <div uib-dropdown>
  
              <input type="text" value="Onsite" class="form-control has-dropdown new-input" placeholder="Service"
                     name="serviceName" placeholder="Service" uib-dropdown-toggle aria-expanded="false"
                     ng-model="editService.item.name" required>
              <i class="icn-sm icn-caret-gray"></i>
  
              <ul class="dropdown-menu dropdown-menu-services" style="top: 46px;margin: 0;">
  
                <li role="presentation"
                    ng-repeat="companyService in companyServices | orderBy: 'name'">
                  <a role="menuitem" tabindex="-1" href="javascript:void(0)" ng-click="setNewService(companyService)">
                    {{ companyService.name }}
                  </a>
                </li>
  
              </ul>
            </div>
          </div>
   
      <textarea auto-expand limit="250"
      value="editService.description"
      type="text" style="border: none" type="text" class="form-validation modal-textarea"
      ng-model="editService.description"  rows="1"
       tabindex="1"></textarea>
    </div>
    <div class="col-md-2 new-quantity-picker">
      <div ng-include="'/ng1/scripts/core/time-picker/time-picker.tpl.html'"></div>
      
    </div>
    <div class="col-md-1"
         ng-if="serviceExpenseDurationPresentation !=='DURATION_PICKER'">
      <p class="flex-text-right" style="height: 40px;">{{durationText}}</p>
    </div>
    <div class="col-md-1"
         ng-if="serviceExpenseDurationPresentation ==='DURATION_PICKER'">
      <div
        ng-include="'/ng1/scripts/core/duration/duration.tpl.html'"></div>
      
    </div>
    <div class="col-md-2 action-update pr-0"
         style="height: 46px;">
      <i class="new-calendar-icn pointer"></i>
      <i class="assign-icn pointer"></i>
      <i class="icn-sm icn-label-save-dashboard icn-label-save pointer"
         ng-click="saveUpdateService(updateTicketService)"></i>
      <i class="icn-sm dashboard-remove icn-remove-old pointer"
         ng-click="setEditExpenseId()"></i>
    </div>
  </form>
</div>

    i[r] = i[r] || function () {
