<div class="ticket-update-product-edit"
     ng-controller="quicktech.core.tickets.ticketEditUpdateProductCtrl">
  <form name="updateTicketProduct">
    <div class="col-md-6 product-name gm pl-0">
      <label class="checkbox-container">
        <input type="checkbox">
        <span class="checkbox-mark"></span>
      </label>
      <p class="pre-line" ng-bind-html="product.item.description"></p>
    </div>
    <div class="col-md-1">
      <input type="number"
             class="new-input form-control"
             placeholder="Price"
             name="productPrice"
             ng-required="true"
             ng-model="editProduct.item.sale"
             qt-to-fixed="2"
             ng-max="9999999999"
             ng-readonly="!PermissionsService.isAllowed('MANAGE_PRODUCTS')"
             hard-reset-pattern="pricePattern"
             hard-reset-required="true"
             uib-tooltip="Price"
             tooltip-placement="top"
             tooltip-append-to-body="true">
    </div>
    <div class="col-md-1">
      <input type="text"
             class="new-input form-control"
             placeholder="Qty"
             ng-model="editProduct.quantity"
             ng-maxlength="10"
             name="productQty"
             hard-reset-required="true"
             ng-change="controlProductQty(updateTicketProduct)"
             hard-reset-pattern="numberPattern"
             uib-tooltip="Qty"
             tooltip-placement="top"
             tooltip-append-to-body="true">
    </div>
    <div class="col-md-1 text-right gm"
         style="height: 46px;padding: 13px 5px;">
      {{ editProduct.item.sale * editProduct.quantity || ''| currency :'$':2 }}
    </div>
    <div class="col-md-2 action-update pr-0"
         style="height: 46px;">
      <i class="new-calendar-icn pointer"></i>
      <i class="assign-icn pointer"></i>
      <i class="icn-sm icn-label-save-dashboard icn-label-save pointer"
         ng-click="saveUpdateProduct(updateTicketProduct)"></i>
      <i class="icn-sm dashboard-remove icn-remove-old pointer"
         ng-click="setEditExpenseId()"></i>
    </div>
