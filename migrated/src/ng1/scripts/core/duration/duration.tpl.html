<div class="duration"
     ng-controller="quicktech.core.duration.userListCtrl"
     uib-dropdown
     auto-close="outsideClick">
  <div class="duration-preview"
       uib-dropdown-toggle>
    <span>{{hourText}}</span> : <span>{{minuteText}}</span>
  </div>
  <div uib-dropdown-menu
       class="dropdown-menu"
       stop-propagation="click"
       onUserAssign="'true'"
       aub-is-bulk-operation="true">
    <div class="duration-container">
      <div class="duration-container-header">
        <div>HH</div>
        <div>MM</div>
      </div>
      <div class="duration-container-content">
        <div class="duration-container-values has-arrows">
          <div class="arrow-top"></div>
          <div class="duration-container-values-hours">
            <div ng-repeat="hour in hours track by $index"
                 ng-click="selectHour(hour)">{{hour}}
            </div>
          </div>
          <div class="arrow-bottom"></div>
        </div>
        <div class="duration-container-values has-arrows">
          <div class="arrow-top"></div>
          <div class="duration-container-values-minutes">
            <div ng-repeat="min in minutes track by $index"
                 ng-click="selectMinute(min)">{{min}}
            </div>
          </div>
          <div class="arrow-bottom"></div>
        </div>
      </div>
      <button class="duration-container-button"
              type="button"
              ng-click="setDuration()">
        Set it
      </button>
    </div>
  </div>
</div>
