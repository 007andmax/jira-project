<div ng-controller="quicktech.core.user-list.userListCtrl">
  <div class="assign-ticket-content">
    <div class="assign-ticket-header">
      <div class="clearfix">
        <div class="form-group">
          <input class="form-control" placeholder="Search Users" value="">
          <!--<div class="label-add-btn">-->
          <!--<div class="btn-icn btn input-btn-cr btn-success  btn-add-more pull-left disabled"><i class="icn-sm small-icn-tick"></i></div>-->
          <!--</div>-->
        </div>
      </div>
    </div>
    <div class="scroll-pane">

      <div ng-repeat="user in users track by $index" style="margin-top:10px" class="user-item"
        ng-attr-data-index="{{$index}}" ng-class="{'active': user.selected == true}" ng-click="selectUser($index)"><a href="javascript:void(0)" ng-attr-id="{{user.id}}" class="dropdown-link">
          <img ng-if="user.avatar" ng-attr-src="{{getUserAvatarUrl(user)}}" alt="..."
            class="img-circle avatar-26">
          <div ng-if="!user.avatar" class="default-user-avatar avatar-background-color-odd ng-scope">
            <span>{{user.firstName[0].toUpperCase()}}</span><span>{{(user.lastName.length > 1 ? user.lastName[0].toUpperCase() : '')}}</span>
          </div>
          <span>
            <p>{{getUserName(user)}}</p>
            <p>{{user.primaryEmail}} </p>
          </span>
        </a></div>
    </div>
  </div>

</div>
