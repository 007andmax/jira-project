 <td colspan="5">Block Time Contracts</td>
  
   <td   class="is-billable">
      <div class=" category-expanded angular-animate" style="overflow: visible;"  >

        <div class="services-list__select">
          <input type="text" class="form-control has-dropdown pointer"
                 placeholder="Select GL number"
                 next-after-text-editor ng-trim="false"
                 typeahead-input-formatter="getGlNumberName($model)"
                 autocomplete="off"  ng-model="currentBlockTimeContracts"
                 uib-typeahead="itemGLnumber as itemGLnumber.glNumber for itemGLnumber in glNumbersList | filter:{'glNumber': $viewValue}:stateComparator | orderBy:'glNumber'"
                 qt-typeahead-async-show-on-focus smart-dropdown-menu-position
                 no-overflow="true"
                 name="blockTimeContracts"
                 custom-style="{width: '100%', 'max-height': '160px', 'overflow-y': 'auto'}">
                 <div typeahead-input-icon="checkClearContract('blockTime')" ng-click="resetContract('blockTime')"></div>
        </div>
        
      </div>
    </td>
 
   <td></td>
   <td></td>
