<table class="quicktech__table quicktech__table--list">
  <thead >
  <tr>
    <th ng-click="setOrderForServices('name')"  style="cursor: pointer">
      Service Name
<!--      <i class="icn-sm sort-icon icn-sort" ng-class="{'rotate': orderServices.reverse, 'active': orderServices.field === 'name'}"></i>-->
    </th>
    
    <th ng-click="setOrderForServices('rate')" style="cursor: pointer; width: 120px">
      Per Hour
<!--      <i class="icn-sm sort-icon icn-sort" ng-class="{'rotate': orderServices.reverse, 'active': orderServices.field === 'rate'}"></i>-->
    </th>
    
    <th style="width: 120px">
      taxes
    </th>
    
    <th ng-click="setOrderForServices('billable')" style="cursor: pointer; width: 80px">
      Is Billable
<!--      <i class="icn-sm sort-icon icn-sort" ng-class="{'rotate': orderServices.reverse, 'active': orderServices.field === 'billable'}"></i>-->
    </th>
    
    <th  ng-click="setOrderForServices('canUseInTicket')" style="cursor: pointer; width: 80px">
      Is Default
<!--      <i class="icn-sm sort-icon icn-sort" ng-class="{'rotate': orderServices.reverse, 'active': orderServices.field === 'canUseInTicket'}"></i>-->
    </th>
    
    <th ng-click="setOrderForServices('canUseInTicket')" style="cursor: pointer; width: 350px">
      GL #
<!--      <i class="icn-sm sort-icon icn-sort" ng-class="{'rotate': orderServices.reverse, 'active': orderServices.field === 'canUseInTicket'}"></i>-->
    </th>
    <th style="width: 40px"></th>
    <th style="width: 40px"></th>
  </tr>
  </thead>
  <tbody>
    <tr ng-repeat="service in services | orderBy : orderByForServices : orderServices.reverse"
        ng-controller="quicktech.core.services.serviceCtrl"
        on-finish-render="loadingFinished('default')"
        show-model-element="{{ 'show-' + service.versionedId.id }}"
    >
      <td>{{ service.name }}</td>
      <td>{{ service.rate | currency: '$': 2 }}</td>
      <td>{{ getSelectedTaxNames(service.taxes) }}</td>
      <td>
        <label class="control checkbox pull-left">
          <input type="checkbox" ng-checked="service.billable"
                 custom-disabled="{{ disabledCheckbox || !PermissionsService.isAllowed('MANAGE_SERVICES') }}"
                 ng-click="onChangeBillable()">
          <span class="control-indicator"></span>
        </label>
      </td>
      <td>
        <label class="control checkbox pull-left">
          <input type="checkbox" ng-checked="service.canUseInTicket"
                 custom-disabled="{{ disabledCheckbox || !PermissionsService.isAllowed('MANAGE_SERVICES') }}"
                 ng-click="onChangeDefaultState()">
          <span class="control-indicator"></span>
        </label>
      </td>
      
      <td>
        <div class="services-list__select">
          <input type="text" class="form-control has-dropdown pointer"
                 placeholder="Select GL number"
                 next-after-text-editor ng-trim="false"
                 typeahead-input-formatter="getGlNumberName($model)"
                 autocomplete="off" ng-model="glNumber"
                 uib-typeahead="item as item.glNumber for item in glNumbersList | filter:{'glNumber': $viewValue}:stateComparator | orderBy:'glNumber'"
                 qt-typeahead-async-show-on-focus smart-dropdown-menu-position
                 no-overflow="true"
                 custom-style="{width: '100%', 'max-height': '160px', 'overflow-y': 'auto'}">
          <div typeahead-input-icon="service.glNumber" ng-click="resetGlNumber(service)"></div>
        </div>
      </td>
      
      <td>
        <a href="javascript:void(0)" class="ha-delete hit-area pull-right has-tooltip"
                  ng-click="deleteService()"
                  tooltip-placement="top" tooltip-append-to-body="true" uib-tooltip="Delete">
        <i class="icon-sm icn-delete"></i>
      </a>
      </td>
      
      <td>
        <a href="javascript:void(0)" class="ha-edit hit-area pull-right has-tooltip"
           create-new-entity="service" item="service"
           tooltip-placement="top" tooltip-append-to-body="true" uib-tooltip="edit">
          <i class="icon-sm edit-icon"></i>
        </a>
      </td>
      
    </tr>
  </tbody>
  <thead>
    <tr>
      <th colspan="8">Contracts</th>
    </tr>
  </thead>
  
  <tbody  ng-controller="quicktech.core.services.blocktimeServiceCtrl">
    <tr  ng-include="'/ng1/scripts/core/services/block-time-service.tpl.html'"></tr>
  </tbody>
  
  <tbody  ng-controller="quicktech.core.services.userdeviceServiceCtrl">
  <tr class="no-bottom-border"  ng-include="'/ng1/scripts/core/services/user-device-service.tpl.html'"></tr>
  </tbody>
</table>
