<div class="service-form-wrapper">
  <div class="hourly read-only clearfix">
    <div class="close-btn btn" ng-click="closeModal()" tabindex="1">
      <i class="icn-sm icn-remove-old"></i>
    </div>

    <div class="service-header">
      <h4 class="title-services">Hourly Service</h4>
    </div>
    <div class="service-contract-details clearfix">
      <div class="col-md-7">
        <div class="form-group">
          Description
          <input placeholder="Description"
                 type="text"
                 class="form-control"
                 ng-model="editContract.description"
                 ng-maxlength="255"
                 readonly>
        </div>
      </div>
      <div class="col-md-12"></div>
      <div class="col-md-3" style="margin-right: 25px;">
        <div class="form-group">
          Start Date:
          <input type="text"
                 class="form-control has-dropdown default-cursor"
                 name="StartDate"
                 value="{{dateFilter(editContract.startDate)}}"
                 readonly
                 placeholder="Start Date">
          <i class="report-calendar"></i>
        </div>
      </div>
      <div class="col-md-3">
        <div class="form-group">
          End Date:
          <input type="text"
                 class="form-control has-dropdown default-cursor"
                 name="EndDate"
                 readonly
                 value="{{endDatePreview}}"
                 placeholder="End Date">
          <i class="report-calendar"></i>
        </div>
      </div>
    </div>

    <div class="service-bill-hide-content clearfix">

      <div class="col-md-6">Service name</div>
      <div class="col-md-1 text-center" style="padding: 0;">Billable</div>
      <div class="price-agreement" ng-style="{'visibility': showServiceColumn() ? 'visible' : 'hidden'}">Per hour</div>
      <div class="tax-agreement text-center" ng-style="{'visibility': showServiceColumn() ? 'visible' : 'hidden'}">Tax</div>
      <div class="bill-hide-content-item clearfix" ng-repeat="service in editContract.services | orderBy : 'name'  ">
        <div class="col-md-6 form-group">
          <input placeholder="Service Name" type="text" class="form-control" ng-model="service.name" readonly ng-maxlength="30">
        </div>
        <div class="col-md-1 fourm-group text-center">
          <label class="control checkbox default-cursor" onclick="return false;">
            <input ng-show="service.billable" ng-model="service.billable" type="checkbox" onclick="return false;">
            <!--<input ng-show="!service.billable" type="checkbox" onclick="return false;">-->
            <span class="control-indicator"></span>
          </label>
        </div>
        <div class="price-agreement fourm-group before-icon" ng-style="{'visibility': service.billable ? 'visible' : 'hidden'}">
          <input placeholder="0.00" type="text" class="form-control" ng-model="service.rate" readonly qt-to-fixed="2">
        </div>
        <div class="tax-agreement fourm-group text-center" ng-style="{'visibility': service.billable ? 'visible' : 'hidden'}">
          <div>
            <div>
              <!--<i class="icn-sm icn-tax" ng-hide="service.taxes.length > 0"> </i>-->
              <select-taxes  ng-hide="service.taxes.length > 0" taxes="taxes" entity="service"  is-preview-mode="true" style="pointer-events: none;"></select-taxes>
              <select-taxes  ng-show="service.taxes.length > 0" taxes="taxes" entity="service"  is-preview-mode="true" ></select-taxes>
              <!--<p>{{service.taxes.length}}</p>-->
            </div>
          </div>
        </div>
        <div class="col-md-1 fourm-group text-center">
          <!--<div class="add-remove-service">-->
          <!--<div ng-click="deleteService(service)">-->
          <!--<i class="icon-sm icn-delete"></i>-->
          <!--</div>-->
          <!--</div>-->
        </div>
      </div>


    </div>

  </div>
  <div class="col-md-12 text-right agreement-fixed-button hourly-service-modal__buttons" ng-hide="contractStatus == 'TERMINATED'">
    <!--<div class="btn btn-success btn-create" ng-click="createContract()">Create</div>-->
    <div class="btn btn-primary btn-create" ng-click="copy()">Copy</div>
    <div class="btn btn-primary btn-create" ng-click="terminateAndEdit()">Edit</div>
    <div class="btn btn-primary btn-create" ng-click="terminateAndCopy()">Terminate and copy</div>
    <div class="btn btn-primary btn-create" ng-click="terminateContract()">Terminate and close</div>
  </div>
</div>
