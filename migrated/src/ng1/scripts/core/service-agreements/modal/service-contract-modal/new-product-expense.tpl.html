<div ng-form="newProductExpenseForm" ng-if="reInitNewProductExpenseForm">
  <div ng-show="showProductExpenseError">
    <p style="color: red;padding-left: 15px; margin-bottom: 0;">{{validationServiceError}}</p>
  </div>
  <div class="col-sm-7">
    <div uib-dropdown>
      <!--<input type="text"-->
      <!--style="cursor: pointer;"-->
      <!--name="productName"-->
      <!--ng-model="newProductExpense.name"-->
      <!--ng-minlength="1"-->
      <!--autocomplete="off"-->
      <!--tabindex="5"-->
      <!--placeholder="New Product"-->
      <!--class="form-control form-control-dropdown dropdown-toggle"-->
      <!--uib-typeahead="product as product.name for product in defaultProducts | filter:{'picked': false} | orderBy:'name'"-->
      <!--qt-typeahead-show-on-focus-->
      <!--custom-style="{width: '100%', 'max-height': '160px', 'overflow-y': 'auto'}"-->
      <!--value="product" hard-reset-pattern="serviceNamePattern">-->

      <!--<div class="input-top-4" typeahead-input-icon="productName"></div>-->

      <div products-list id="product-list-cont"
           click-outside="closeDropdown()" outside-if-not="product-list-cont"
           ng-class="{'has-error': (isShowingErrorsNewProductExpenseeField(newProductExpenseForm, 'newProductExpenseName') || showNotAddedProductExpenseError(newProductExpense)) }">

        <div ng-click="refreshNotAddedError('productExpense')">

          <input ng-hide="isPLOpen" type="text" class="form-control has-dropdown" pl-product-input name="newProductExpenseName"
                 placeholder="Product" autocomplete="off" ng-model="newProductExpense.name.description" required>

          <input ng-show="isPLOpen" type="text" class="form-control has-dropdown"
                 pl-search-product-input
                 placeholder="Search or Add Product" autocomplete="off" ng-model="searchProduct">

          <i class="icn-sm icn-caret-gray"></i>
        </div>

        <input type="hidden" name="product" ng-required="true">

        <div class="nano dropdown-menu custom-product-list" pl-conteiner
             ng-include="'/ng1/scripts/common/templates/products-list.tpl.html'"></div>

      </div>


    </div>
  </div>

  <div class="col-sm-2"
       ng-class="{'has-error': isShowingErrorsNewProductExpenseeField(newProductExpenseForm, 'newProductExpenseQuantity') }">
    <input type="text" class="form-control" placeholder="Qty" name="newProductExpenseQuantity"
           ng-model="newProductExpense.quantity" required

           hard-reset-pattern="quantityPattern">
  </div>

  <div class="col-sm-2"
       ng-class="{'has-error': isShowingErrorsNewProductExpenseeField(newProductExpenseForm, 'newProductExpensePrice') }">
    <input type="text" class="form-control" placeholder="Price" name="newProductExpensePrice" qt-to-fixed="2"
           ng-required="true" ng-model="newProductExpense.name.sale"
           hard-reset-pattern="decimalNumberPatternLow" required>
  </div>

  <div class="col-sm-1">
    <div class="add-remove-service">
      <div ng-click="addProductExpense(newProductExpenseForm, newProductExpense)">
        <i class="icon-sm icn-add-action"></i>
      </div>
    </div>
  </div>
</div>
