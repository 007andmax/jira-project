<div>

  <div class="invoices clearfix" ng-style="{'padding': isInvoiceShown ? '0px' : '25px'}">
    <div ng-show="!isInvoiceShown" class="invoice-header-fixed">
      <div class="invoices-header">
        <h3 style="margin: 20px 10px;">Invoices</h3>
        <div class="invoices-header-filters" slyle="position: relative;">
          <div>
            <input class="pointer" type="text" placeholder="Filter by date" date-range-picker
                   ng-model="invoiceDateFilter"
                   options="invoiceDateFilterOptions">
            <i class="new-calendar" ng-show="!invoiceDateFilter.startDate && !invoiceDateFilter.endDate"></i>
            <i class="icn-sm icn-remove-old pointer"
               ng-show="invoiceDateFilter.startDate && invoiceDateFilter.endDate"
               uib-tooltip="clear date filter" tooltip-placement="top" ng-click="clearInvoiceDateFilter()"></i>
          </div>
          <div>
            <input type="text"
                   class="has-dropdown pointer"
                   placeholder="Search by company"
                   ng-trim="false"
                   autocomplete="off"
                   ng-model="invoiceFilterCompany"
                   ng-change="filterInvoicesBy(invoiceFilterCompany)"
                   uib-typeahead="company.name as company.name for company in companies | filter:{'name': $viewValue, 'isDefault': false}:stateComparator | orderBy:'name'"
                   qt-typeahead-async-show-on-focus smart-dropdown-menu-position>

            <div typeahead-input-icon="invoiceFilter"></div>
          </div>
          <div>
            <input class="pointer"
                   type="text"
                   id="inputNumber"
                   ng-model-options="{ debounce: 10 }"
                   ng-blur="onBlurInvoice(invoiceNumberFilter)"
                   ng-keypress="onKeyPressInvoice($event)"
                   placeholder="Search by number"
                   ng-model="invoiceNumberFilter">
          </div>
          <div class="clearfix sort-by">

            <div uib-dropdown smart-dropdown-menu-position="dropdown-menu">
              <div uib-dropdown-toggle>
                <input class="pointer" type="text" placeholder="Sort By" readonly ng-model="sortByValue">
                <div>
                  <i class="icn-sm report-caret-icon pointer" ng-show="!sortByValue"></i>
                  <i class="icn-sm icn-remove-old pointer"
                     ng-show="sortByValue"
                     uib-tooltip="clear" tooltip-placement="top" ng-click="sortBySetItem('')"></i>
                </div>
              </div>
              <ul class="dropdown-menu" role="menu" style="margin-top: -3px;">
                <li><a ng-click="sortBySetItem('Paid')">Paid invoices</a></li>
                <li><a ng-click="sortBySetItem('Unpaid')">Unpaid invoices</a></li>
                <li><a ng-click="sortBySetItem('Overdue')">Overdue invoices</a></li>
                <!--<li><a ng-click="sortBy('Group by companies')">Group by companies</a></li>-->
              </ul>
            </div>

          </div>
          <button
            ng-disabled="(savingInvoiceInProcess.indexOf(invoiceLocks[showInvoiceLockIndex].id) > -1) || invoiceLocks[showInvoiceLockIndex].expired"
            tooltip-append-to-body="true"
            class="save-invoice-button btn btn-success"
            modal-window-button="/ng1/scripts/core/billable/new-billable-modals/multiple-payments.tpl.html"
            mw-controller="quicktech.core.receivable.receivePaymentCtrl"
            modal-window-class="modal-receive-payment"
            tooltip-placement="bottom">
            Process payment
          </button>
        </div>
      </div>
      <ul class="qt-list company-devices qt-users invoices-list" ng-show="mode === 'list'">
        <li class="list-heading clearfix"
            style="z-index: 2;box-shadow: 0 10px 10px -2px rgba(0,0,0,0.05);padding-bottom: 1px;">
          <div class="col-md-1 pointer w-11" ng-click="setOrderForInvoices('number')">
            <label class="control checkbox pull-left">
              <input type="checkbox" ng-click="selectAllInvoices()" ng-checked="isAllinvoicesSelected()">
              <span class="control-indicator"></span>
            </label>
            Invoice#
          </div>
          <div class="col-md-3 pointer w-22" ng-click="setOrderForInvoices('company')">Company</div>
          <div class="col-md-2 pointer" ng-click="setOrderForInvoices('date')">Invoice date</div>
          <div class="col-md-1 pointer" style="width: 13.6%;" ng-click="setOrderForInvoices('readedAt')">Read On</div>
          <div class="col-md-1 pointer" ng-click="setOrderForInvoices('sum')">Amount</div>
          <div class="col-md-1 pointer" ng-click="setOrderForInvoices('balance')">Balance</div>
          <div class="col-md-2 pointer" ng-click="setOrderForInvoices('dueDate')">Due Date</div>
          <div class="col-md-1" style="width: 3%;"></div>
        </li>
      </ul>
    </div>

    <div ng-hide="loadingInProgress"
         ng-include="'/ng1/scripts/core/receivable/invoices-'+ mode +'.tpl.html'"
         ng-style="{'margin-top': isInvoiceShown ? '0' : mode === 'list' ? '87px' : '50px'}"></div>
    <loading-indicator loading-trigger="loadingInProgress"></loading-indicator>
    <div class="no-exist-receivable" ng-if="!loadingInProgress && invocesList.length == 0"><p>No invoice found</p></div>

  </div>


</div>
