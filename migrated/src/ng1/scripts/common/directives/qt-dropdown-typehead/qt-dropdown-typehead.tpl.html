
<div id="qtDropdown">
  <div smart-dropdown-menu-position no-overflow="true">
    <div ng-if="activePlaceholder" class="placeholder">{{ activePlaceholder }}</div>
    <input type="text"
           class="form-control has-dropdown"
           id="qtInput"
           ng-if="!noForm && !byIndustry"
           ng-model="$ctrl.viewValueItem.name"
           ng-click="$ctrl.changeDropdownState()"
           ng-keyup="$ctrl.listFilterFunction()">
    <input type="text"
           class="has-dropdown"
           id="qtInput"
           ng-if="noForm && !byIndustry"
           placeholder="{{ activePlaceholder ? '' : 'Select Vendor' }}"
           ng-model="$ctrl.viewValueItem"
           ng-click="$ctrl.changeDropdownState()"
           ng-keyup="$ctrl.listFilterFunction()">
    <input type="text"
           class="has-dropdown form-control"
           id="qtInput"
           ng-if="byIndustry"

           placeholder="Select Industry"
           ng-model="$ctrl.viewValueItem"
           ng-click="$ctrl.changeDropdownState()"
           ng-keyup="$ctrl.listFilterFunction()">
    <div>
          <span class="x-mark" ng-click="$ctrl.clearValueByIconClick()" ng-show="$ctrl.viewValueItem.length">
            <i class="icn-sm icn-remove-old"
               tooltip="clear"
               style="top: 14px;right: 10px;"
               tooltip-placement="top"></i>
          </span>
          <span class="caret-mark ng-hide" ng-hide="$ctrl.viewValueItem.length" ng-click="$ctrl.changeDropdownState()">
            <i class="icn-sm report-caret-icon"></i>
          </span>
    </div>
  </div>


    <ul class="dropdown-content" ng-show="$ctrl.isOpen">
      <li ng-repeat="item in $ctrl.list | orderBy: $ctrl.getAttributeForSorting(item) " ng-click="$ctrl.selectItem(item)">
        <span ng-bind-html="$ctrl.getFilterProperty(item) | highlightFilter: $ctrl.viewValueItem" ng-if="!$ctrl.qtTemplateUrl"></span>
        <div ng-if="$ctrl.qtTemplateUrl" ng-include="$ctrl.qtTemplateUrl"></div>
      </li>
    </ul>


</div>
