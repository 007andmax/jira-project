<div
    class="alert alert-yellow hide"
    user-notification
    style="z-index: 991;"
></div>
<div
    class="top-bar"
    style="z-index: 991;"
    ng-include="'/ng1/scripts/core/header/header.tpl.html'"
></div>
<app-header
    class="top-bar"
    [ngClass]="{'full-header':toggleLeftPanel,
            'no-full-header':!toggleLeftPanel}"
    style="z-index: 991;"
></app-header>
<app-left-panel [ngClass]="{'hidden-left-panel':toggleLeftPanel}"></app-left-panel>
<div
    ng-controller="quicktech.core.header.headerCtrl"
    class="mobile-top-bar"
    ng-class="{ 'ticket-detail-header': isTicketOpened && !isTicketEditOpened, 'ticket-create-update': isTicketEditOpened }"
    style="z-index: 991;"
    ng-include="'/ng1/scripts/core/header/mobile-header.tpl.html'"
></div>
<aside
    id="left"
    style="z-index: 991;"
    ng-include="'/ng1/scripts/core/left-panel/left-panel.tpl.html'"
></aside>
<aside
    ng-controller="quicktech.core.leftPanel.leftPanelCtrl"
    id="mobile-left"
    ng-class="{opened: isLeftPanelOpened}"
    qt-sidebar
    style="z-index: 991;"
    ng-include="'/ng1/scripts/core/left-panel/mobile-left-panel.tpl.html'"
></aside>
<div class="main-container">
    <div class="row">
        <div
            class="content-container"
            [ngClass]="{'large': toggleLeftPanel}"
        >
            <div class="content-wrapper">
                <div ng-include="'/ng1/scripts/common/templates/index-page-body.tpl.html'"></div>
                <div
                    class="loading"
                    style="display: none;"
                ></div>
                <app-map-modal></app-map-modal>
                <notification></notification>
                <app-error-notification></app-error-notification>
                <modal-image-cropper></modal-image-cropper>
                <app-draft-email></app-draft-email>
                <app-main></app-main>
                <app-ticket-add-aside></app-ticket-add-aside>
                <app-users-aside></app-users-aside>
                <app-company-add-aside></app-company-add-aside>
                <app-default-services-add></app-default-services-add>
                <app-inventory-add-aside></app-inventory-add-aside>
                <app-ticket-edit-aside></app-ticket-edit-aside>
                <users-aside-edit></users-aside-edit>
            </div>
        </div>
    </div>
</div>
<!-- <div feedback-form ></div> -->
<div welcome-wizard></div>
