<div class="alert alert-yellow hide" user-notification style="z-index: 1039;" ></div>

<div class="top-bar" style="z-index: 1038;"
     ng-include="'/ng1/scripts/core/header/header.tpl.html'"></div>

<div ng-controller="quicktech.core.header.headerCtrl"
class="mobile-top-bar"
ng-class="{ 'ticket-detail-header': isTicketOpened && !isTicketEditOpened, 'ticket-create-update': isTicketEditOpened }"
style="z-index: 1038;"
ng-include="'/ng1/scripts/core/header/mobile-header.tpl.html'"></div>

<aside id="left" style="z-index: 1039;" ng-if="applicationLoaded"
       ng-include="'/ng1/scripts/core/left-panel/left-panel.tpl.html'"></aside>

<aside ng-controller="quicktech.core.leftPanel.leftPanelCtrl"
id="mobile-left" ng-class="{opened: isLeftPanelOpened}"

ng-include="'/ng1/scripts/core/left-panel/mobile-left-panel.tpl.html'"></aside>

<aside id="right" class="nano collapsed" ng-if="!isRightPanelHidden && applicationLoaded" right-panel
       ng-include="'/ng1/scripts/core/right-panel/right-panel.tpl.html'"></aside>

<app-main></app-main>
