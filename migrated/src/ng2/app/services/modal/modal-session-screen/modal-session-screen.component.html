<div class="archive-modal">
    <button
        class="close-modal"
        (click)=cancelConfirm()
    ></button>
    <div class="archive-modal__body modal-body">
        <p [textContent]="message"></p>
    </div>
    <div class="archive-modal__footer">
        <div class="d-f">
            <button
                class="btn-new btn-primary"
                (click)=approveConfirm()
            >
                OK
            </button>
        </div>
    </div>
</div>
