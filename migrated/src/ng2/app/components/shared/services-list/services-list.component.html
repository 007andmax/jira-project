
<div class="light-dropdown" ngbDropdown [autoClose]="'outside'" #products="ngbDropdown">
  <input class="pointer" type="text" 
         [ngClass]="{'no-valid': isFormValid}" [value]="getNameOrDescription(service)"
         placeholder="Service" id="dropdownServices" ngbDropdownToggle>
  <i class="icn-sm report-caret-icon"></i>

  <div class="dropdown-menu show" ngbDropdownMenu aria-labelledby="dropdownServices">
    <button class="dropdown-item"
            *ngFor="let item of itemList"
            (click)="selectServicesItem(item)"
    >
      {{item.name}}
    </button>
  </div>

</div>
