<div class="qt-fileupload" appDnd (fileDropped)="onFileDropped($event)">
<label class="qt-fileupload__label">
  <div class="qt-fileupload__attach-icon icon__attach-blue"></div>
<span class="qt-fileupload__title">Drag your file here or <span class="qt-fileupload__link">Upload manually</span></span>
<input type="file" #fileDropRef id="fileDropRef" multiple (change)="fileBrowseHandler($event.target.files)" />
</label>
</div>
<div class="files-list">
  <div class="single-file" *ngFor="let file of files; let i = index">
    <img src="assets/img/dnd/ic-file.svg" width="45px" alt="file">
    <div class="info">
      <h4 class="name">
        {{ file?.name }}
      </h4>
      <p class="size">
        {{ formatBytes(file?.size) }}
      </p>
      <app-upload-area-progress [progress]="file?.progress"></app-upload-area-progress>
    </div>
    <img src="assets/img/dnd/ic-delete-file.svg" class="delete" width="20px" alt="file" (click)="deleteFile(i)">
  </div>
</div>
