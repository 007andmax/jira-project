<div class="device-user pointer">
  <button class="btn-new disabled" (click)="showSelectWrapper($event)">Users</button>
</div>

<div class="select-wrapper" *ngIf="showSelect">

  <div class="content" (click)="$event.preventDefault()">

    <form class="px-4 py-3">
      <div class="assign-ticket" assign-user="">

        <div class="assign-ticket-content">
          <div class="assign-ticket-header" id="abId0.27334344384079334">
            <div class="clearfix" id="abId0.31207852822948245">
              <div class="form-group" id="abId0.9607284611182108">
                <input class="form-control" placeholder="Search Users" value="" autocomplete="off">

              </div>
            </div>
          </div>
          <div class="scroll-pane">
            <div class="users-list custom-scroll" tabindex="-1" style="position: absolute; z-index: 9999;">

              <ng-template ngFor let-user [ngForOf]="usersList" let-i="index" [ngForTrackBy]="trackByIndex">
                <div class="user-item" data-index="1" (click)="selectUser(i)"><a href="javascript:void(0)"
                    [id]="user.id" class="dropdown-link">
                    <div class="default-user-avatar avatar-background-color-odd ng-scope" *ngIf="!user.avatar">
                        <span [textContent]="user.firstName[0].toUpperCase()"></span>
                        <span [textContent]="user.lastName[0].toUpperCase()"></span>
                    </div>
                    <div class="default-user-avatar avatar-background-color-odd ng-scope" *ngIf="user.avatar">
                        <img ng-if="user.avatar" class="img-circle avatar-26"
                        [src]="'/users/' + (user.id || 'default') + '/image' + (user.avatar ? '.jpg?t=' + user.avatar.updatedAt : '')"
                        alt="...">
                    </div> 
                    <span>
                      <p [textContent]="user.firstName + ' ' + user.lastName"></p>
                      <p [textContent]="user.primaryEmail"></p>
                    </span>
                  </a></div>
              </ng-template>





            </div>
          </div>
        </div>


      </div>


    </form>



  </div>
</div>
