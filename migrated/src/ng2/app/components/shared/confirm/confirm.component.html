<div class="confirm-modal">
  <div class="close-btn btn pull-right" (click)="closeModal()" tabindex="1" style="z-index: 1000">
    <i class="icn-sm icn-remove-old" uib-tooltip="Close"></i>
  </div>
  <div class="modal-body">
    <p [textContent]="message"></p>
  </div>
  <div class="modal-footer">
    <div class="btn btn-lg btn-primary"
         data-dismiss='modal' (click)=cancelConfirm() [textContent]="btnCancel">

    </div>
    <div class="btn btn-lg btn-primary" (click)=approveConfirm() [textContent]="buttonConfirm"></div>
  </div>
</div>

<div class="archive-modal">
  <button class="close-modal"></button>
  <div class="archive-modal__body">
    <h3>Archive this Company ?</h3>
    <p>All related users and service agreements will be archived and all agents will be uninstalled.</p>
  </div>
  <div class="archive-modal__footer">
    <div class="d-f">
      <button class="btn-new btn-primary">Yes, I am sure</button>
      <button class="btn-new disabled">Cancel</button>
    </div>
  </div>
</div>
