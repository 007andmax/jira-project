<div
    class="breadcrumbs"
    *ngIf="isCompanyState()"
    [ngClass]="{'class':state === 'company-dashboard'}"
>
    <div
        class="breadcrumbs-location pointer"
        (click)="back()"
    >
        <span>All companies</span>
        <img
            src="dropdown-arrow-down.svg"
            alt
            class="breadcrumb-separator"
        >
    </div>
    <div
        class="breadcrumbs-attribute"
        *ngIf="selectedCompany"
    >
        <span [textContent]="selectedCompany.name"></span>
        <img
            src="dropdown-arrow-down.svg"
            alt
            class="breadcrumb-separator"
        >
    </div>
    <div class="breadcrumbs-path">
        <span [textContent]="getPath()"></span>
    </div>
</div>
