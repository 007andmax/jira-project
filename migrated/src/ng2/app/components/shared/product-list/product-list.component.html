<div class="product-dropdown-new-ng light-dropdown select-product" ngbDropdown [autoClose]="'outside'" #products="ngbDropdown" (openChange)="onCloseProducts($event)" >
  <input class="pointer select-product__input" type="text"
    [ngClass]="{'no-valid': isFormValid}" placeholder="Search or Add product" (input)="onSearch($event)"
    id="dropdownProducts" ngbDropdownToggle>
    <span *ngIf="itemList">
      <i *ngIf="selectedItem"
         class="icn-sm icn-remove-old"
         (click)="clear($event)"></i>
      <i *ngIf="!selectedItem"
         class="icn-sm report-caret-icon"></i>
    </span>
  <div class=select-product__dropdown ngbDropdownMenu aria-labelledby="dropdownProducts" >
    <div class="select-product__header">
        <div class="select-product__header-title">Product list</div>
        <div class="select-product__header-add-product">+ Create Product</div>
    </div>
    <ngb-accordion #acc="ngbAccordion" class="item-list products-accordion">
      <ngb-panel *ngFor="let item of itemList | filter : resetSearch : search"> <!--| filter :'name' : search -->
        <ng-template ngbPanelHeader>
          <button ngbPanelToggle class="btn select-product__item-title">
            <div>
            {{item.name}} <span *ngIf="item.products.length"> ({{item.products.length}})</span>
          </div>
            <div class="select-product__expand icon__expand"></div>
          </button>
        </ng-template>
        <ng-template ngbPanelContent>
          <div class="category-product" *ngFor="let productItem of item.products" (click)="setProduct(productItem)">
              <div class="d-f jc-sb">
                <div class="title">{{ productItem.description }}</div>
                <div class="text-right total-count">{{ productItem.sale | currency: '$' }}</div>
              </div>

              <div class="manufacture">
                <span *ngIf="productItem.ilc">ILC: {{ productItem.ilc }}</span>
                <span *ngIf="productItem.manufacture">P/N: {{ productItem.manufacture }}</span>
              </div>
          </div>
        </ng-template>
      </ngb-panel>
    </ngb-accordion>
  </div>
  </div>
