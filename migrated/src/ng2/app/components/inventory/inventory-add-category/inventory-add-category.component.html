<div class="add-tax-dropdown">
    <div class="d-inline-block">
        <div class="tax-title">Add Category</div>
        <div class="add-tax-label">Category Name</div>
        <input
            placeholder="Enter category name"
            type="text"
            class="qt-input-40 input qt-mb-24"
            [(ngModel)]="name"
            (input)="checkDublicateCategory()"
            required
        >
        <div class="d-f">
            <button
                class="qt-button qt-mr-12"
                type="submit"
                [disabled]="disableCreateCategory"
                (click)="save()"
            >
                Save
            </button>
            <button
                class="qt-button --gray"
                (click)="close()"
            >
                Cancel
            </button>
        </div>
    </div>
</div>
