<div class="qt-page-list__header-filters">
    <app-drop-down
        #categoriesSelect
        [sort]="true"
        class="products-page__category-btn qt-mr-8"
        [heightInput]="'36px'"
        [placeholder]="'Select Category'"
        [list]="categories"
        [field]="'name'"
        [search]="true"
        [change]="true"
        (onSelectedItem)="onSelectCategory($event)"
    ></app-drop-down>
    <div class="inventory-add-category qt-pos-rel">
        <button
            class="qt-btn"
            (click)="showAddCategory = true"
        >
            Add Category
        </button>
        <inventory-add-category
            *ngIf="showAddCategory"
            (onClose)="showAddCategory = false"
        ></inventory-add-category>
    </div>
    <app-drop-down
        class="qt-w100 qt-ml-8 dropdown"
        [placeholder]="'Select Active'"
        [editItem]="selectedActive"
        [list]="listActive"
        [field]="'title'"
        [search]="true"
        [change]="true"
        [isBlockClear]="true"
        (onSelectedItem)="selectActive($event)"
        heightInput="36px"
        widthInput="30%"
    ></app-drop-down>
</div>
