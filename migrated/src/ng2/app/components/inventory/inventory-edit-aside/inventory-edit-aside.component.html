<div
    class="qt-aside-modern --large new-companies-content__modal"
    [hidden]="!opened"
>
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-title">Edit Product</div>
        <div
            class="qt-aside-modern__header-close icon__close"
            (click)="close()"
        ></div>
    </div>
    <div class="qt-aside-modern__content qt-pt-0-important --less-padding new-companies-content__modal--content advanced">
        <div class="col-md-4">
            <mat-error *ngIf="!validate.getManufactureIsExist()">This number already occupied</mat-error>
            <p>Item Number</p>
            <input
                type="text"
                [(ngModel)]="inventory.manufacture"
                (blur)="onCheckManufacture()"
                placeholder="Enter Item Number"
            >
        </div>
        <div class="col-md-4">
            <mat-error *ngIf="!validate.getILCIsExist()">This number already occupied</mat-error>
            <p>ILC Number</p>
            <input
                type="text"
                [(ngModel)]="inventory.ilc"
                (blur)="onCheckILC()"
                placeholder="Enter ILC Number"
            >
        </div>
        <div class="col-md-4">
            <p>GL Number</p>
            <app-select-search
                [class]="['light-dropdown']"
                [list]="glNumbers"
                #glNumberSelect
                [add]="true"
                [field]="'glNumber'"
                [placeholder]="'Select GL'"
                [editItem]="inventory.glNumber"
                (onAddItem)="onAddGlNumber($event)"
                (onSelectedItem)="onSelectGlNumbers($event)"
            ></app-select-search>
        </div>
        <div class="col-md-12">
            <mat-error *ngIf="!validate.getDescription()">Description is required</mat-error>
            <p>Description</p>
            <div class="editable-description">
                <textarea
                    appTextArea
                    [limit]="160"
                    id="inventory-description"
                    placeholder="Write Product Description"
                    (input)="onChangeDescription($event)"
                    (onPast)="onPastDescription($event)"
                ></textarea>
            </div>
        </div>
        <app-taxes (taxesChange)="onTaxesChange($event)"></app-taxes>
        <div
            class="col-md-6"
            *ngIf="!validate.getCostSale()"
        >
            <mat-error *ngIf="!validate.getCostSale()">Cost cannot be higher than Price</mat-error>
        </div>
        <div class="col-md-3">
            <p>Cost</p>
            <input
                type="text"
                number
                [money]="true"
                (blur)="validate.checkPriceCost(inventory.sale,inventory.cost)"
                [(ngModel)]="cost"
                (input)="onChangeCost($event)"
                placeholder="Enter Cost"
            >
        </div>
        <div class="col-md-3">
            <mat-error *ngIf="!validate.getSale()">Price is required</mat-error>
            <p>Price</p>
            <input
                type="text"
                number
                [money]="true"
                [(ngModel)]="sale"
                (input)="onChangeSale($event);validate.resetSale()"
                (blur)="validate.checkPriceCost(inventory.sale,inventory.cost)"
                placeholder="Enter Price"
            >
        </div>
        <div class="col-md-12">
            <mat-error *ngIf="!validate.getCategory()">Category is required</mat-error>
            <p>Category</p>
            <app-select-search
                [class]="['light-dropdown']"
                [list]="categories"
                #categoriesSelect
                [field]="'name'"
                [placeholder]="'Select Category'"
                [add]="true"
                [editItem]="inventory.category"
                (onAddItem)="onAddCategory($event)"
                (onSelectedItem)="onSelectCategory($event)"
            ></app-select-search>
        </div>
        <div class="col-md-12">
            <p>Vendors</p>
            <app-select-search
                [class]="['light-dropdown']"
                [list]="vendors"
                #vendorsSelect
                [field]="'name'"
                [placeholder]="'Select Vendor'"
                [editItem]="editVendor"
                (onSelectedItem)="onSelectVendor($event)"
            ></app-select-search>
        </div>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="d-f">
            <button
                class="qt-button qt-mr-12"
                (click)="save()"
            >
                Save Product
            </button>
            <button
                class="qt-button --gray"
                (click)="close()"
            >
                Cancel
            </button>
        </div>
    </div>
</div>
