<div>
  <div  style="width: 100%; display: inline-block;"> <!--ng-hide="loadingInProgress"-->

    <div class="products-content"  >

      <div class="products-content__header">
        <h3>Products</h3>
    <!--    <div class="products-content__header--search-result" ng-if="successProductAdding">
          Product has been added
        </div>-->
        <div class="products-content__header--search">
          <input type="text" placeholder="Search Products…" (input)="onSearch()" [(ngModel)]="productSearchName">
          <button class="plus-btn" create-new-entity="product">+</button>
        </div>
      </div>
      <div class="products-content__list">
        <div class="products-content__list--header clearfix">
          <div class="col-md-3 pointer"
               (click)="onFilter('description')">Product Name
          </div>
          <div class="col-md-2 pointer"
               (click)="onFilter('vendor')">Vendor
          </div>
          <div class="col-md-1 pointer"
               (click)="onFilter('cost')"
               ng-if="PermissionsService.isAllowed('VIEW_PRODUCT_COST')">Cost
          </div>
          <div class="col-md-1 pointer"
               (click)="onFilter('sale')">Sale Price
          </div>
          <div class="col-md-1 pointer"
               (click)="onFilter('manufacture')">#Mfg
          </div>
          <div class="col-md-1">Tax</div>
          <div class="col-md-1 pointer"
               (click)="onFilter('ilc')">ILC
          </div>
          <div class="col-md-1 pointer"
          (click)="onFilter('glNumber')">GL</div>
        </div>

        <div class="products-content"
        infiniteScroll
        [infiniteScrollDistance]="2"
        [infiniteScrollThrottle]="50"
        [infiniteScrollDisabled]="infiniteScrollDisabled"
        (scrolled)="onScroll()">
     <ng-template ngFor let-inventory
                  [ngForOf]="inventoryList"
                  [ngForTrackBy]="trackById">
       <app-inventory-table [companies]="companies" [taxes]="taxes" [glNumbers]="glNumbers" [inventory]="inventory"></app-inventory-table>
     </ng-template>
     <div class="loading" *ngIf="showPreloader"></div>
   </div>
     
      </div>
