<div>
    <div style="width: 100%; display: inline-block;">
        <div class="products-content">
            <div class="products-content__header">
                <h3>Products</h3>
                <div class="products-content__header--search">
                    <input
                        type="text"
                        placeholder="Search Products…"
                        (input)="onSearch()"
                        [(ngModel)]="productSearchName"
                    >
                    <button
                        class="qt-btn filter-button qt-mr-8"
                       >
                       Filters
                    </button>
                    <button
                      class="qt-btn --outline-blue"
                      *ngIf="getPermissions('MANAGE_PRODUCTS')"
                      (click)="addProduct()"
                    >
                      Create Product
                    </button>
                </div>
            </div>
          <div class="qt-page-list__header-filters qt-mb-16">
            <app-drop-down
              #titleDp
              class="qt-max-w370 qt-mr-8"
              [placeholder]="'Select Category'"
              [heightInput]="'36px'"
              [list]="[]"
              [search]="true"
              [change]="true"
            ></app-drop-down>
            <button
              class="qt-btn"
            >
              Add Category
            </button>
          </div>
            <div class="products-content__list">
                <div class="products-content__list--header clearfix">
                    <div
                        class="col-md-3 pointer"
                        (click)="onFilter('description')"
                    >
                        Product Name
                    </div>
                    <div
                        class="col-md-2 pointer"
                        (click)="onFilter('vendor')"
                    >
                        Vendor
                    </div>
                    <div
                        class="col-md-1 pointer"
                        (click)="onFilter('cost')"
                        *ngIf="getPermissions('VIEW_PRODUCT_COST')"
                    >
                        Cost
                    </div>
                    <div
                        class="col-md-1 pointer"
                        (click)="onFilter('sale')"
                    >
                        Sale Price
                    </div>
                    <div
                        class="col-md-1 pointer"
                        (click)="onFilter('manufacture')"
                    >
                        #Mfg
                    </div>
                    <div class="col-md-1">Tax</div>
                    <div
                        class="col-md-1 pointer"
                        (click)="onFilter('ilc')"
                    >
                        ILC
                    </div>
                    <div
                        class="col-md-1 pointer"
                        (click)="onFilter('glNumber')"
                    >
                        GL
                    </div>
                </div>
                <div
                    class="products-content"
                    style="padding: 0"
                    infiniteScroll
                    [infiniteScrollDistance]="2"
                    [infiniteScrollThrottle]="50"
                    [infiniteScrollDisabled]="infiniteScrollDisabled"
                    (scrolled)="onScroll()"
                >
                    <ng-template
                        ngFor
                        let-inventory
                        [ngForOf]="inventoryList"
                        [ngForTrackBy]="trackById"
                    >
                        <app-inventory-table
                            [companies]="companies"
                            [taxes]="taxes"
                            [glNumbers]="glNumbers"
                            [inventory]="inventory"
                        ></app-inventory-table>
                    </ng-template>
                    <div
                        class="loading"
                        *ngIf="showPreloader"
                    ></div>
                </div>
            </div>
        </div>
    </div>
</div>
