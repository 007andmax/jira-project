<!--for show filters add class "show" for app-left-panel-->
<div class="password-content">

  <app-company-passwoord-manager-header></app-company-passwoord-manager-header>

  <div class="password-content__list">

    <div class="password-content__list--header clearfix">
      <div style="width: 5.5%;" class="col-md-1"></div>
      <div class="col-md-2" >Company</div>
      <div class="col-md-3 sort-field"   (click)="sortBy('description')">Description</div>
      <div class="col-md-2" >User/device</div>
      <div class="col-md-2 sort-field"    (click)="sortBy('expiredDate')">Password Expiry</div>
      <div class="col-md-1"  >Safety Level</div>
    </div>

    <app-company-password-manager-table
      [selectedCompany]="selectedCompany"
      [selectedUserOrDevice]="selectedUserOrDevice"
      [selectedDate]="selectedDate"
      [addNewRecords]="newRecord"
      [showDataTable]="showDataTable()"
    ></app-company-password-manager-table>

  </div>

  <button class="mob-filters-btn mobile-btn primary" (click)="showMobileFilters()">
    Filters
  </button>
  <div class="loading" *ngIf="showPreloader"></div>
</div>

<app-password-manager-edit-aside
  (addRecord)="addRecord($event)"
></app-password-manager-edit-aside>
