

<div class="password-content__list--item clearfix"
     *ngFor=" let item of recordsData
         | company: selectedCompany
         | user: selectedUserOrDevice
         | dateFormat: selectedDate
         | passwordCategory: selectedCategory">
  <div style="width: 5.5%;" class="col-md-1">
    <label class="control checkbox">
      <input type="checkbox">
      <span class="control-indicator" style="margin-top: 3px;"></span>
    </label>
  </div>
  <div class="col-md-3 password-email">{{item.description}}</div>
  <div class="col-md-4">
    <p *ngFor="let linkItem of item.links">
      {{(linkItem.userName || linkItem.deviceLabel)}}
    </p>
  </div>
  <div class="col-md-2">{{item.expiredDate}}</div>
  <div class="col-md-2" style="width: 15%;"></div>
  <div class="col-md-1 btn-actions">
    <a class="hit-area ha-20-20 pointer">
      <i class="icn-sm icn-more-light-grey"></i>
    </a>
    <div ngbDropdown class="d-inline-block">
      <span class="btn btn-outline-primary" id="dropdownBasic1" ngbDropdownToggle>...</span>
      <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
        <button ngbDropdownItem (click)="editRecord(item)">Edit</button>
        <button ngbDropdownItem>Remove</button>
      </div>
    </div>
  </div>
</div>
