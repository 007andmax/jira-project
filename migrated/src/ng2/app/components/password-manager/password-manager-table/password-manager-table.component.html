<div  *ngIf="showDataTable">
    <ng-template ngFor let-item [ngForOf]="list_records | sortBy : sort : direction" [ngForTrackBy]="trackById">
  <div class="password-content__list--item clearfix pointer"
     >
     <!--  *ngFor=" let item of recordsData
           | company: selectedCompany
           | user: selectedUserOrDevice
           | dateFormat: selectedDate
           | passwordCategory: selectedCategory
           | sortBy : sort : direction;trackBy: trackById;"-->
    <div style="width: 5.5%;"
         class="col-md-1 password-icon"
         [ngClass]="getRecordTypeClass(item.template)">
      <label class="control checkbox">
        <input type="checkbox">
        <span class="control-indicator" style="margin-top: 3px;"></span>
      </label>
    </div>
    <div class="col-md-2 password-icon mob-hidden"
         (click)="editRecord(item)"
         [ngClass]="getRecordTypeClass(item.template)">
      {{item.companyName}}
    </div>
    <div class="col-md-3 password-icon"
         (click)="editRecord(item)">{{item.description}}
    </div>
    <div class="col-md-2"
         (click)="editRecord(item)">
      <p *ngFor="let linkItem of item.links">
        {{(linkItem.userName || linkItem.deviceLabel)}}
      </p>
    </div>
    <div class="col-md-2 mob-hidden"
         (click)="editRecord(item)">{{item.expiredDate}}
    </div>
    <div class="col-md-2 mob-hidden"
         style="width: 15%;"
         (click)="editRecord(item)"></div>
    <div class="col-md-1 btn-actions grey-dropdown right mob-hidden">
      <div ngbDropdown class="d-inline-block">
        <a class="hit-area ha-20-20 pointer"
           id="dropdownBasic1"
           ngbDropdownToggle>
          <i class="icn-sm icn-more-light-grey"></i>
        </a>
        <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
          <button ngbDropdownItem
                  *ngIf="getPermissions('VIEW_PASSWORD')"
                  (click)="editRecord(item)">Edit
          </button>
          <button ngbDropdownItem
                  *ngIf="getPermissions('DELETE_PASSWORD')"
                  (click)="deleteRecord(item.id)">Remove
          </button>
        </div>
      </div>
    </div>
  </div>
  </ng-template>
</div>
