<div class="qt-page-list__body">
  <div class="qt-page-list__body-table-container">
    <table class="qt-page-list__body-tbody qt-table-modern password-table">
      <tbody
        infiniteScroll
        [infiniteScrollDistance]="2"
        [infiniteScrollThrottle]="50"
      >
        <tr>
          <td
            class="password-table__check"
          >
            <div class="d-f">
              <label
                class="qt-checkbox"
              >
                <input
                  type="checkbox"
                >
                <span></span>
              </label>
            </div>
          </td>
          <td
            class="password-table__account"
            >
            <div class="qt-df qt-ai-c qt-lh-1">
              <div class="icon__office-account qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"></div>
<!--              <div class="icon__generic qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"></div>-->
<!--              <div class="icon__user-account qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"></div>-->
<!--              <div class="icon__email qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"></div>-->
<!--              <div class="icon__wifi qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"></div>-->
<!--              <div class="icon__agent qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"></div>-->
<!--              <div class="icon__devices-grey qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"></div>-->
<!--              <div class="icon__microsoft qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"></div>-->
              Office Account
            </div>
          </td>
          <td
            class="password-table__description"
          >
            VPN Server - L2TP Pre-shared key - 108.173.171.174
          </td>
          <td
            class="password-table__user-password"
          >
            <div class="email">actionchiroyyc2@outlook.com</div>
            <div class="user-password">
              <span>123456</span>
              <span class="active">******</span>
              <div class="icon__view qt-za-16 qt-sz-16 qt-bg-contain qt-ml-6"></div>
              <div class="icon__copy-gray qt-za-16 qt-sz-16 qt-bg-contain qt-ml-6"></div>
            </div>
          </td>
          <td class="password-table__status">
<!--             <span-->
<!--               class="tag__modern &#45;&#45;warning"-->
<!--               [textContent]="'Expired'"-->
<!--             ></span>-->
            <span
              class="tag__modern --error"
              [textContent]="'15 days to expire'"
            ></span>
          </td>
          <td
           class="password-table__menu"
          >
<!--            <div class="qt-ic-c icon__more  qt-pointer qt-sz-16 qt-bg-contain"></div>-->
            <div
              ngbDropdown
              [container]="'body'"
              [placement]="'bottom-right'"
            >
              <div
                class="qt-ic-c icon__more  qt-pointer qt-sz-16 qt-bg-contain"
                id="dropdownBasic1"
                ngbDropdownToggle
              ></div>
              <ul
                class="qt-dropdown-menu"
                ngbDropdownMenu
                aria-labelledby="dropdownBasic1"
              >
                <li
                  class="pointer"

                >
                  <div class="icon__email-dark qt-za-16 qt-bg-contain  qt-sz-16 qt-mr-8"></div>
                  Share via Email
                </li>
                <li
                  class="pointer"
                >
                  <div class="icon__print qt-za-16 qt-bg-contain qt-sz-16 qt-mr-8"></div>
                  Print
                </li>
                <li
                  class="pointer"
                >
                  <div class="icon__export-dark qt-za-16 qt-bg-contain qt-sz-16 qt-mr-8"></div>
                  Export
                </li>
                <li
                  class="pointer"
                >
                  <div class="icon__remove qt-sz-16 qt-bg-contain qt-mr-8"></div>
                  Remove
                </li>
              </ul>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
