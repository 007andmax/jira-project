<tr>
    <td class="password-table__check">
        <div class="d-f">
            <label
                class="qt-checkbox"
                [attr.for]="'record-' + item.id"
            >
                <input
                    [attr.id]="'record-' + item.id"
                    [(ngModel)]="item.selected"
                    type="checkbox"
                    (change)="selectRecord($event)"
                >
                <span></span>
            </label>
        </div>
    </td>
    <td
        class="password-table__account"
        (click)="editRecord()"
    >
        <div class="qt-df qt-ai-c qt-lh-1">
            <div
                *ngIf="item.template.name === 'OFFICE_365_ACCOUNT'"
                class="icon__office-account qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"
            ></div>
            <div
                *ngIf="item.template.name === 'GENERIC'"
                class="icon__generic qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"
            ></div>
            <div
                *ngIf="item.template.name === 'LOCAL_USER_ACCOUNT'"
                class="icon__user-account qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"
            ></div>
            <div
                *ngIf="item.template.name === 'EMAIL_ACCOUNT'"
                class="icon__email qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"
            ></div>
            <div
                *ngIf="item.template.name === 'WIFI_NETWORK'"
                class="icon__wifi qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"
            ></div>
            <div
                *ngIf="item.template.name === 'AGENT'"
                class="icon__agent qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"
            ></div>
            <div
                *ngIf="item.template.name === 'DEVICE'"
                class="icon__devices-grey qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"
            ></div>
            <div
                *ngIf="item.template.name === 'MICROSOFT_ACCOUNT'"
                class="icon__microsoft qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"
            ></div>
            <div
                *ngIf="item.template.name === 'HOSTING'"
                class="icon__hosting qt-za-16 qt-sz-16 qt-bg-contain qt-mr-6"
            ></div>
            <span [textContent]="item.template.name"></span>
        </div>
    </td>
    <td
        (click)="editRecord()"
        class="password-table__company-name"
        [textContent]="(item.companyName) ? item.companyName : ''"
    >
    </td>
    <td
        class="password-table__description"
        (click)="editRecord()"
    >
        <span
            class="text-description"
            [textContent]="(item.description) ? item.description : ''"
        >
        </span>
    </td>
    <td
        class="password-table__user-password"
        (click)="editRecord()"
    >
        <div
            class="email"
            [textContent]="item.username"
        ></div>
        <div class="user-password">
            <span
                *ngIf="togglePassword"
                [textContent]="item.password"
            ></span>
            <span
                *ngIf="!togglePassword"
                class="active"
            >
                ******
            </span>
            <div
                *ngIf="!togglePassword"
                class="icon__view qt-za-16 qt-sz-16 qt-bg-contain qt-ml-6 pointer"
                (click)="showPassword()"
            ></div>
            <div
                *ngIf="togglePassword"
                class="icon__hide qt-za-16 qt-sz-16 qt-bg-contain qt-ml-6 pointer"
                (click)="togglePassword = false"
            ></div>
            <div
                class="icon__copy-gray qt-za-16 qt-sz-16 qt-bg-contain qt-ml-6 pointer"
                *ngIf="togglePassword"
                (click)="copyPassword()"
            ></div>
        </div>
    </td>
    <td
        class="password-table__status"
        (click)="editRecord()"
    >
        <span
            *ngIf="item.expiredDate && isExpired()"
            class="tag__modern &#45;&#45;warning"
            [textContent]="'Expired'"
        ></span>
        <span
            *ngIf="item.expiredDate && !isExpired() && isExpiredLess30()"
            class="tag__modern --error"
            [textContent]="parseExpiredDate()"
        ></span>
    </td>
    <td class="password-table__menu">
        <!-- <div class="qt-ic-c icon__more  qt-pointer qt-sz-16 qt-bg-contain"></div> -->
        <div
            ngbDropdown
            [container]="'body'"
            [placement]="'bottom-right'"
        >
            <div
                class="qt-ic-c icon__more  qt-pointer qt-sz-16 qt-bg-contain"
                id="dropdownBasic1"
                ngbDropdownToggle
            ></div>
            <ul
                class="qt-dropdown-menu"
                ngbDropdownMenu
                aria-labelledby="dropdownBasic1"
            >
                <li
                    class="pointer"
                    ngbDropdownItem
                >
                    <div class="icon__email-dark qt-za-16 qt-bg-contain  qt-sz-16 qt-mr-8"></div>
                    Share via Email
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                >
                    <div class="icon__print qt-za-16 qt-bg-contain qt-sz-16 qt-mr-8"></div>
                    Print
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                >
                    <div class="icon__export-dark qt-za-16 qt-bg-contain qt-sz-16 qt-mr-8"></div>
                    Export
                </li>
                <li
                    class="pointer"
                    *ngIf="getPermissions('DELETE_PASSWORD')"
                    (click)="deleteRecord()"
                    ngbDropdownItem
                >
                    <div class="icon__remove qt-sz-16 qt-bg-contain qt-mr-8"></div>
                    Remove
                </li>
            </ul>
        </div>
    </td>
</tr>
