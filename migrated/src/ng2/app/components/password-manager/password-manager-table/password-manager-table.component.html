<div class="qt-page-list__body">
    <div class="qt-page-list__body-table-container">
        <table class="qt-page-list__body-tbody qt-table-modern password-table">
            <tbody
                infiniteScroll
                [infiniteScrollDistance]="2"
                [infiniteScrollThrottle]="50"
                [infiniteScrollDisabled]="infiniteScrollDisabled"
                (scrolled)="onScroll()"
            >
                <ng-template
                    ngFor
                    let-item
                    [ngForOf]="list_records"
                    [ngForTrackBy]="trackById"
                >
                    <app-password-manager-item [item]="item"></app-password-manager-item>
                </ng-template>
            </tbody>
        </table>
        <div
            class="loading"
            *ngIf="showPreloader"
        ></div>
    </div>
</div>
