<ng-sidebar-container>

  <!-- A sidebar -->
  <ng-sidebar
    [sidebarClass]="'test'"
    [(opened)]="_opened"
    [position]="'right'"
  >
    <p>Sidebar contents</p>
  </ng-sidebar>

  <!-- Page content -->
  <div ng-sidebar-content
       [ngClass]="ng-sidebar--right">
    <button (click)="_toggleSidebar()">Toggle sidebar</button>
  </div>

</ng-sidebar-container>
