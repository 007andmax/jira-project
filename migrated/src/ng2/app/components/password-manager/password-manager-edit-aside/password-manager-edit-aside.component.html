<ng-sidebar-container>
  <!-- A sidebar -->
  <ng-sidebar
    [(opened)]="opened"
    [position]="'right'"
  >
    <div class="password-content__modal open">
      <div class="password-content__modal--header">
        <h3>Create Password</h3>
        <div class="password-modal-actions">
          <button><i class="icn-16 edit-new"></i></button>
          <button><i class="icn-16 print-new"></i></button>
          <button><i class="icn-16 export-new"></i></button>
        </div>
        <button class="close-modal" (click)="_toggleSidebar()"></button>
      </div>
      <form
        [formGroup]="createPasswordRecord"
        (submit)="save()"
        novalidate
        class="password-content__modal--content clearfix">

        <div class="col-md-6">
          <label>
            <p>Description</p>
            <input type="text" placeholder="Write Description" formControlName="description">
          </label>
        </div>

        <div class="col-md-6">
          <label class="light-dropdown">
            <p>Client</p>
            <input
              id="typeahead-focus1"
              placeholder="Select Company"
              type="text"
              class="pointer"
              [ngClass]="{'has-error': submitted && form['client'].hasError('required')}"
              formControlName="client"
              [inputFormatter]="formatterClients"
              [resultFormatter]="formatterClients"
              [ngbTypeahead]="searchClients"
              (selectItem)="getCompanyDevices($event)"
              (focus)="focusClients$.next($event.target.value)"
              (click)="clickClients$.next($event.target.value)"
              #instance="ngbTypeahead"
            />
            <div *ngIf="submitted">
              <div *ngIf="form['client'].hasError('required')">
                Field is required
              </div>
            </div>
          </label>
        </div>

        <div class="col-md-6">
          <label class="light-dropdown">
            <p>Select Type</p>
            <input
              id="typeahead-focus2"
              type="text"
              class="pointer"
              readonly
              formControlName="type"
              [(ngModel)]="currentType"
              [inputFormatter]="formatter"
              [resultFormatter]="formatter"
              [ngbTypeahead]="search"
              [ngClass]="{'has-error': submitted && form['type'].hasError('required')}"
              (ngModelChange)="changeType($event)"
              (focus)="focus$.next($event.target.value)"
              (click)="click$.next($event.target.value)"
              #instance="ngbTypeahead"
            />
          </label>
          <div *ngIf="submitted">
            <div *ngIf="form['type'].hasError('required')">
              Field is required
            </div>
          </div>
        </div>

        <div class="col-md-6" *ngIf="type == 8">
          <label>
            <p>SSID</p>
            <input type="text"
                   placeholder="SSID"
                   [ngClass]="{'has-error': submitted && checkSsid()}"
                   formControlName="ssid">
          </label>
          <div *ngIf="submitted">
            <div *ngIf="checkSsid()">
              Field is required
            </div>
          </div>
        </div>

        <div class="col-md-6" *ngIf="type !== 8">
          <label>
            <p>Username</p>
            <input type="text"
                   placeholder="Enter Username"
                   [ngClass]="{'has-error': submitted && (form['userName'].hasError('required') || form['userName'].hasError('maxLength'))}"
                   formControlName="userName">
            <div *ngIf="submitted">
              <div *ngIf="form['userName'].hasError('required')">
                Field is required
              </div>
              <div *ngIf="form['userName'].hasError('maxLength')">
                Max length is 100
              </div>
            </div>
          </label>
        </div>

        <div class="col-md-6">
          <div class="password-actions">
            <i class="icn-16 edit-password-field pointer"></i>
            <i class="icn-16 private-password-field pointer"></i>
            <i class="icn-16 copy-password-field pointer"></i>
          </div>
          <label class="password">
            <p>Password</p>
            <input id="password"
                   placeholder="Enter Password"
                   formControlName="password"
                   type="password"
                   [ngClass]="{'has-error': submitted && form['password'].hasError('required')}"
                   placeholder="Password"
                   matInput showHideInput>
            <i matSuffix
               class="material-icons"
               showHideTrigger="password"
               [showHideStatus]="{ materialIcon: true, id: 'password' }"
            ></i>
            <div *ngIf="submitted">
              <div *ngIf="form['password'].hasError('required')">
                Field is required
              </div>
            </div>
          </label>
        </div>

        <div class="col-md-6"
             *ngIf="type == 0">
          <label>
            <p>Key</p>
            <input type="text" placeholder="Enter Key" formControlName="key">
          </label>
        </div>

        <div class="col-md-6" *ngIf="(type == 1 || type == 0)">
          <label>
            <p>Link</p>
            <input type="text" placeholder="Enter Link" formControlName="link">
          </label>
        </div>

        <div class="col-md-6" *ngIf="type === 3">
          <label>
            <p>Url</p>
            <input type="text" placeholder="Enter Url" formControlName="url">
          </label>
        </div>

        <div class="col-md-6"  *ngIf="type && (type === 5)">
          <label>
            <p>Code</p>
            <input type="text" placeholder="Enter Code" formControlName="code">
          </label>
        </div>

        <div class="col-md-12"
             (clickOutside)="hideSelectWrapper()"
             style="position: relative"
             *ngIf="(type !== 3 && type !== 6)">
          <label>
            <p>Device / User</p>
            <div class="device-user pointer"
                 [ngClass]="{'has-error': submitted && checkLinks()}"
                 (click)="showSelectWrapper()">
              <span *ngFor="let item of selectedUserAndDevices" class="selected-user">
                {{item.firstName || item.hostName || item.name}} {{item.lastName}}
                <span (click)="changeSelectedUserAndDevices(item)">x</span>
              </span>
            </div>
            <div *ngIf="submitted">
              <div *ngIf="checkLinks()">
                Field is required
              </div>
            </div>
            <div class="select-wrapper" *ngIf="showSelect">
              <div class="tab-wrapper">
                <div class="tab"
                     (click)="setCurrentTab($event, item)"
                     *ngFor="let item of tabs"
                     [ngClass]="{'active' : (currentTab === item)}"
                >{{item}}
                </div>
              </div>
              <div class="content">
                <div *ngIf="currentTab === 'Device'">
                  <div *ngFor="let item of devicesList; let i = index"
                       (click)="toggleItem($event, item, 'device', i)">
                    <label class="control checkbox">
                      <input type="checkbox"
                             [checked]="deviceCheckbox[i]">
                      <span class="control-indicator"></span>
                      {{item.hostName}}
                    </label>

                  </div>
                </div>
                <div *ngIf="currentTab === 'User'">
                  <div *ngFor="let item of usersList; let i = index"
                       (click)="toggleItem($event, item, 'user', i)">
                    <label class="control checkbox">
                      <input type="checkbox"
                             [checked]="usersCheckbox[i]">
                      <span class="control-indicator"></span>
                      {{item.firstName}} {{item.lastName}}
                    </label>
                  </div>
                </div>
                <div *ngIf="currentTab === 'Not monitored'">
                  <div>
                    <button class="content-btn" *ngIf="!showGadgetsForm" (click)="showGadgetsAddForm()">Add</button>
                    <div class="content-header" *ngIf="showGadgetsForm">
                      <input
                        [ngModelOptions]="{standalone: true}"
                        type="text"
                        [(ngModel)]="newGadgets">
                      <div class="new-link" (click)="addGadgetsform()">Add</div>
                    </div>
                  </div>
                  <div *ngFor="let item of gadgets;  let i = index"
                       (click)="toggleItem($event, item, 'gadget', i)">
                    <label class="control checkbox">
                      <input type="checkbox" [checked]="gadgetCheckbox[i]">
                      <span class="control-indicator"></span>
                    </label>
                    {{item.name}}
                  </div>
                </div>
              </div>
            </div>
          </label>
        </div>

        <div class="col-md-6" *ngIf="type && (type === 4)">
          <label>
            <p>IP Address</p>
            <input type="text" placeholder="IP Address" formControlName="ipAdres">
          </label>
        </div>

        <div class="col-md-3" style="width: 19.3%;" *ngIf="type && (type === 4)">
          <label>
            <p>Port</p>
            <input type="text" placeholder="0000" formControlName="port">
          </label>
        </div>

        <div class="col-md-3" style="width: 30.7%;">
          <label>
            <p>Expiry Date</p>
            <div class="input-group">
              <input type="text"
                     id="business_incorp_date"
                     class="form-control"
                     formControlName="expiryDate"
                     ngbDatepicker
                     #incorporatedDatePicker="ngbDatepicker"
                     (click)="incorporatedDatePicker.toggle()"
                     readonly>
            </div>
          </label>
        </div>

        <div class="col-md-12 password-links" *ngIf="type === 8">
          <label class="control checkbox">
            <input type="checkbox" formControlName="http">
            <span class="control-indicator"></span>
            https://
          </label>
          <label class="control checkbox" formControlName="ssh">
            <input type="checkbox">
            <span class="control-indicator"></span>
            SSH
          </label>
          <label class="control checkbox" formControlName="telnet">
            <input type="checkbox">
            <span class="control-indicator"></span>
            Telnet
          </label>
        </div>

        <div class="col-md-12" *ngIf="type !== 6">
          <label>
            <p>Note</p>
            <textarea placeholder="Write your note here…"></textarea>
          </label>
        </div>

        <div class="password-content__modal--footer col-md-12">
          <button
            class="btn btn-new btn-primary"
            type="submit"
          >Save Changes
          </button>
          <div class="password-modal-footer-actions">
            <p class="pointer">
              Password History
              <i style="height: 18px;" class="icn-16 rollback-new"></i>
            </p>
            <p class="pointer">
              Delete
              <i class="icn-16 remove-red"></i>
            </p>
          </div>
        </div>
      </form>



    </div>
  </ng-sidebar>

</ng-sidebar-container>
