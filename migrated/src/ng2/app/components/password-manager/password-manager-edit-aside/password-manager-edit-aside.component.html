<ng-sidebar-container>
  <!-- A sidebar -->
  <ng-sidebar
    [sidebarClass]="'test'"
    [(opened)]="_opened"
    [position]="'right'"
  >
    <form
      class="password-content__modal open"
      [formGroup]="createPasswordRecord"
    >
      <div class="password-content__modal--header">
        <h3>Create Password</h3>
        <div class="password-modal-actions">
          <button><i class="icn-16 edit-new"></i></button>
          <button><i class="icn-16 print-new"></i></button>
          <button><i class="icn-16 export-new"></i></button>
        </div>
        <button class="close-modal" (click)="_toggleSidebar()"></button>
      </div>
      <div class="password-content__modal--content clearfix">
        <div class="col-md-6" *ngIf="type !== 6">
          <label>
            <p>Description</p>
            <input type="text" placeholder="Write Description" formControlName="description">
          </label>
        </div>
        <div class="col-md-6">
          <label>
            <p>Client</p>
            <input
              id="typeahead-focus1"
              type="text"
              class="form-control"
              formControlName="type"
              [inputFormatter]="formatterClients"
              [resultFormatter]="formatterClients"
              [ngbTypeahead]="searchClients"
              (focus)="focusClients$.next($event.target.value)"
              (click)="clickClients$.next($event.target.value)"
              #instance="ngbTypeahead"
            />
          </label>
        </div>
        <div class="col-md-6">
          <label>
            <p>Select Type</p>
            <input
              id="typeahead-focus2"
              type="text"
              class="form-control"
              formControlName="type"
              [(ngModel)]="currentType"
              [inputFormatter]="formatter"
              [resultFormatter]="formatter"
              [ngbTypeahead]="search"
              (ngModelChange)="changeType($event)"
              (focus)="focus$.next($event.target.value)"
              (click)="click$.next($event.target.value)"
              #instance="ngbTypeahead"
            />
          </label>
        </div>
        <div class="col-md-6" *ngIf="type == 8">
          <label>
            <p>SSID</p>
            <input type="text" placeholder="SSID" formControlName="ssid">
          </label>
        </div>
        <div class="col-md-6" *ngIf="type !== 8">
          <label>
            <p>Username</p>
            <input type="text" placeholder="Enter Username" formControlName="userName">
          </label>
        </div>
        <div class="col-md-6">
          <div class="password-actions">
            <i class="icn-16 edit-password-field pointer"></i>
            <i class="icn-16 private-password-field pointer"></i>
            <i class="icn-16 copy-password-field pointer"></i>
          </div>
          <label class="password">
            <p>Password</p>
            <input type="password" placeholder="Enter Password" formControlName="password">
          </label>
        </div>
        <div class="col-md-6"
             *ngIf="type == 0">
          <label>
            <p>Key</p>
            <input type="text" placeholder="Enter Key" formControlName="key">
          </label>
        </div>
        <div class="col-md-6" *ngIf="(type == 1 || type == 2  || type == 0)">
          <label>
            <p>Link</p>
            <input type="text" placeholder="Enter Link" formControlName="link">
          </label>
        </div>
        <div class="col-md-6" *ngIf="type === 3">
          <label>
            <p>Url</p>
            <input type="text" placeholder="Enter Url" formControlName="url">
          </label>
        </div>
        <div class="col-md-6">
          <label>
            <p>Code</p>
            <input type="text" placeholder="Enter Code" formControlName="code">
          </label>
        </div>
        <div class="col-md-12" *ngIf="type && (type !== 3 && type !== 6)">
          <label>
            <p>Device / User</p>
            <input class="pointer" type="text" placeholder="Select Device / User" formControlName="userOrDevice">
            <i class="icn-16 light-grey-caret"></i>
          </label>
        </div>
        <div class="col-md-6" *ngIf="type && (type === 4)">
          <label>
            <p>IP Address</p>
            <input type="text" placeholder="IP Address" formControlName="ipAdres">
          </label>
        </div>
        <div class="col-md-3" style="width: 19.3%;" *ngIf="type && (type === 4)">
          <label>
            <p>Port</p>
            <input type="text" placeholder="0000" formControlName="port">
          </label>
        </div>
        <div class="col-md-3" style="width: 30.7%;">
          <label>
            <p>Expiry Date</p>
            <input class="pointer" type="text" placeholder="Expiry Date" formControlName="expiryDate">
            <i class="icn-12 new-calendar"></i>
          </label>
        </div>
        <div class="col-md-12 password-links" *ngIf="type && (type === 4)">
          <label class="control checkbox">
            <input type="checkbox">
            <span class="control-indicator"></span>
            https://
          </label>
          <label class="control checkbox">
            <input type="checkbox">
            <span class="control-indicator"></span>
            SSH
          </label>
          <label class="control checkbox">
            <input type="checkbox">
            <span class="control-indicator"></span>
            Telnet
          </label>
        </div>
        <div class="col-md-12" *ngIf="type && (type !== 6)">
          <label>
            <p>Note</p>
            <textarea placeholder="Write your note here…"></textarea>
          </label>
        </div>
      </div>
      <div class="password-content__modal--footer">
        <button
          class="btn btn-new btn-primary"
          type="submit"
          (click)="save()"
        >Save Changes</button>
        <div class="password-modal-footer-actions">
          <p class="pointer">
            Password History
            <i style="height: 18px;" class="icn-16 rollback-new"></i>
          </p>
          <p class="pointer">
            Delete
            <i class="icn-16 remove-red"></i>
          </p>
        </div>
      </div>
    </form>
  </ng-sidebar>

</ng-sidebar-container>
