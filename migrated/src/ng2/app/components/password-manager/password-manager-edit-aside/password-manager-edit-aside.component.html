<ng-sidebar-container>

  <!-- A sidebar -->
  <ng-sidebar
    [sidebarClass]="'test'"
    [(opened)]="_opened"
    [position]="'right'"
  >
    <div class="password-content__modal open">
      <div class="password-content__modal--header">
        <h3>Create Password</h3>
        <div class="password-modal-actions">
          <button><i class="icn-16 edit-new"></i></button>
          <button><i class="icn-16 print-new"></i></button>
          <button><i class="icn-16 export-new"></i></button>
        </div>
        <button class="close-modal" (click)="_toggleSidebar()"></button>
      </div>
      <div class="password-content__modal--content clearfix">
        <div class="col-md-6">
          <label>
            <p>Description</p>
            <input type="text" placeholder="Write Description">
          </label>
        </div>
        <div class="col-md-6">
          <label>
            <p>Client</p>
            <input class="pointer" type="text" placeholder="Select Client">
            <i class="icn-16 light-grey-caret"></i>
          </label>
        </div>
        <div class="col-md-6">
          <label>
            <p>Select Type</p>
            <input class="pointer" type="text" placeholder="Select Type">
            <i class="icn-16 light-grey-caret"></i>
          </label>
        </div>
        <div class="col-md-6">
          <label>
            <p>SSID</p>
            <input type="text" placeholder="SSID">
          </label>
        </div>
        <div class="col-md-6">
          <label>
            <p>Username</p>
            <input type="text" placeholder="Enter Username">
          </label>
        </div>
        <div class="col-md-6">
          <div class="password-actions">
            <i class="icn-16 edit-password-field pointer"></i>
            <i class="icn-16 private-password-field pointer"></i>
            <i class="icn-16 copy-password-field pointer"></i>
          </div>
          <label class="password">
            <p>Password</p>
            <input type="password" placeholder="Enter Password">
          </label>
        </div>
        <div class="col-md-6">
          <label>
            <p>Key</p>
            <input type="text" placeholder="Enter Key">
          </label>
        </div>
        <div class="col-md-6">
          <label>
            <p>Link</p>
            <input type="text" placeholder="Enter Link">
          </label>
        </div>
        <div class="col-md-6">
          <label>
            <p>Url</p>
            <input type="text" placeholder="Enter Url">
          </label>
        </div>
        <div class="col-md-6">
          <label>
            <p>Code</p>
            <input type="text" placeholder="Enter Code">
          </label>
        </div>
        <div class="col-md-12">
          <label>
            <p>Device / User</p>
            <input class="pointer" type="text" placeholder="Select Device / User">
            <i class="icn-16 light-grey-caret"></i>
          </label>
        </div>
        <div class="col-md-6">
          <label>
            <p>IP Address</p>
            <input type="text" placeholder="IP Address">
          </label>
        </div>
        <div class="col-md-3" style="width: 19.3%;">
          <label>
            <p>Port</p>
            <input type="text" placeholder="0000">
          </label>
        </div>
        <div class="col-md-3" style="width: 30.7%;">
          <label>
            <p>Expiry Date</p>
            <input class="pointer" type="text" placeholder="Expiry Date">
            <i class="icn-12 new-calendar"></i>
          </label>
        </div>
        <div class="col-md-12 password-links">
          <label class="control checkbox">
            <input type="checkbox">
            <span class="control-indicator"></span>
            https://
          </label>
          <label class="control checkbox">
            <input type="checkbox">
            <span class="control-indicator"></span>
            SSH
          </label>
          <label class="control checkbox">
            <input type="checkbox">
            <span class="control-indicator"></span>
            Telnet
          </label>
        </div>
        <div class="col-md-12">
          <label>
            <p>Note</p>
            <textarea placeholder="Write your note here…"></textarea>
          </label>
        </div>
      </div>
      <div class="password-content__modal--footer">
        <button class="btn btn-new btn-primary">Save Changes</button>
        <div class="password-modal-footer-actions">
          <p class="pointer">
            Password History
            <i style="height: 18px;" class="icn-16 rollback-new"></i>
          </p>
          <p class="pointer">
            Delete
            <i class="icn-16 remove-red"></i>
          </p>
        </div>
      </div>
    </div>
  </ng-sidebar>

</ng-sidebar-container>
