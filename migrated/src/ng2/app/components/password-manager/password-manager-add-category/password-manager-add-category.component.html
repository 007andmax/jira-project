<div class="add-tax-dropdown">
    <div class="d-inline-block">
        <div class="tax-title">Add Password Folder</div>
        <div class="add-tax-label">Name</div>
        <div
            class="add-category-input qt-mb-24"
            [ngClass]="{'--input-error' : disableCreateCategory}"
        >
            <mat-error
                class="qt-tooltip-error"
                *ngIf="disableCreateCategory"
            >
                This category name is already occupied
            </mat-error>
            <input
                placeholder="Folder Name"
                type="text"
                class="qt-input-40 input"
                [(ngModel)]="name"
                (input)="checkDublicateCategory()"
                required
            >
        </div>
        <div class="d-f">
            <button
                class="qt-button qt-mr-12"
                type="submit"
                [disabled]="disableCreateCategory"
                (click)="save()"
            >
                Save
            </button>
            <button
                class="qt-button --gray"
                (click)="close()"
            >
                Cancel
            </button>
        </div>
    </div>
</div>
