<div class="qt-page-list__header --sticky">
  <div class="qt-page-list__header-title-line">
    <div class="qt-page-list__header-title-line--left">
      <h3
        class="qt-page-list__header-title"
        [textContent]="'Password Manager'"
      ></h3>
    </div>
    <div class="qt-page-list__header-title-line--rigth">
      <div class="qt-df qt-ai-c">
        <div
          class="company-devices-page__list-header-buttons"
        >
          <div>3 Selected</div>
          <div
            class="qt-ml-25 qt-ff-gm qt-df qt-color-info qt-ai-c qt-pointer"
          >
            <div class="password-icon password-icon__email-blue qt-ic-c qt-mr-6"></div>
            <div>Share via Email</div>
          </div>
          <div
            class="qt-ml-16 qt-ff-gm qt-df qt-color-info qt-ai-c qt-pointer"
          >
            <div class="password-icon password-icon__print-blue qt-ic-c qt-mr-6"></div>
            <div>Print</div>
          </div>
          <div
            class="qt-ml-16 qt-ff-gm qt-df qt-color-info qt-ai-c qt-pointer"
          >
            <div class="password-icon password-icon__export-blue qt-ic-c qt-mr-6"></div>
            <div>Export</div>
          </div>
        </div>
        <div class="password-content__header--search qt-ml-8">
          <input
            type="text"
            placeholder="Search password"
          >
          <button
            class="qt-btn btn-filter qt-ml-8 d-f"
          >
            Filters
          </button>
          <button
            class="qt-btn --outline-blue qt-ml-8"
            *ngIf="getPermissions('CREATE_PASSWORD')"
            (click)="addRecord()"
          >
            Create Password
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="qt-page-list__header-filters">
    <app-drop-down
      class="filter-category qt-mr-8"
      [placeholder]="'Select by Category'"
      [list]="[]"
    ></app-drop-down>
    <button class="plus-btn qt-mr-8">
      +
    </button>
    <app-drop-down
      class="filter-company qt-mr-8"
      [placeholder]="'Select Company'"
      [list]="[]"
    ></app-drop-down>
    <app-drop-down
      class="filter-device-user qt-mr-8"
      [placeholder]="'Select Device or User'"
      [list]="[]"
    ></app-drop-down>
    <app-drop-down
      class="data-picker qt-w100"
      [placeholder]="'Data picker'"
      [list]="[]"
    ></app-drop-down>
  </div>

  <div class="qt-page-list__header-thead-container">
    <table class="qt-table-modern qt-page-list__header-thead">
      <thead>
      <tr>
        <th
          class="password-table__check"
        >
          <div class="d-f">
            <label class="qt-checkbox">
              <input
                type="checkbox"
              >
              <span></span>
            </label>
          </div>
        </th>
        <th
          class="password-table__account pointer"
        >
          Account Type
          <span class="qt-table-modern__sorting"></span>
        </th>
        <th
          class="password-table__description pointer"
        >
          Description
          <span class="qt-table-modern__sorting"></span>
        </th>
        <th
          class="password-table__user-password pointer"
        >
          User & Password
          <span class="qt-table-modern__sorting"></span>
        </th>
        <th class="password-table__menu"></th>
      </tr>
      </thead>
    </table>
  </div>

</div>
