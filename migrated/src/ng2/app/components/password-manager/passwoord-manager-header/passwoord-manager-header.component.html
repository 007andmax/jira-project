<div class="qt-page-list__header --sticky">
    <div class="qt-page-list__header-title-line">
        <div class="qt-page-list__header-title-line--left">
            <h3
                class="qt-page-list__header-title"
                [textContent]="'Password Manager'"
            ></h3>
        </div>
        <div class="qt-page-list__header-title-line--rigth">
            <div class="qt-df qt-ai-c">
                <div class="company-devices-page__list-header-buttons">
                    <div>3 Selected</div>
                    <div class="qt-ml-25 qt-ff-gm qt-df qt-color-info qt-ai-c qt-pointer">
                        <div class="email-ng2 qt-za-16 qt-sz-16 qt-bg-contain qt-ic-c qt-mr-6"></div>
                        <div>Share via Email</div>
                    </div>
                    <div class="qt-ml-16 qt-ff-gm qt-df qt-color-info qt-ai-c qt-pointer">
                        <div class="icon__print-blue qt-za-16 qt-sz-16 qt-bg-contain qt-ic-c qt-mr-6"></div>
                        <div>Print</div>
                    </div>
                    <div class="qt-ml-16 qt-ff-gm qt-df qt-color-info qt-ai-c qt-pointer">
                        <div class="export-ng2 qt-za-16 qt-sz-16 qt-bg-contain qt-ic-c qt-mr-6"></div>
                        <div>Export</div>
                    </div>
                </div>
                <div class="qt-page-list__search qt-ml-8">
                    <input
                        type="text"
                        placeholder="Search password"
                    >
                </div>
                <button class="qt-btn btn-filter qt-ml-8 d-f">Filters</button>
                <button
                    class="qt-btn --outline-blue qt-ml-8"
                    *ngIf="getPermissions('CREATE_PASSWORD')"
                    (click)="addRecord()"
                >
                    Create Password
                </button>
            </div>
        </div>
    </div>















    <div class="qt-page-list__header-filters">
        <app-drop-down
            class="filter-category qt-mr-8"
            [placeholder]="'Select by Category'"
            [list]="PASSWORD_RECORD_TYPES"
            [field]="'TITLE'"
            [class]="['dropdown']"
            (onSelectedItem)="onSelectCategory($event)"
        ></app-drop-down>
        <div class="password-add-category qt-pos-rel">
            <button
                class="plus-btn qt-mr-8"
                (click)="showAddCategory = true"
            >
                +
            </button>
            <app-password-manager-add-category
                *ngIf="showAddCategory"
                (onClose)="showAddCategory = false"
            ></app-password-manager-add-category>
        </div>
        <app-drop-down
            class="filter-company qt-w100 qt-mr-8"
            [placeholder]="'Select Company'"
            [class]="['dropdown']"
            [list]="companies"
            [field]="'name'"
            [search]="true"
            [change]="true"
            (onSelectedItem)="selectCompany($event)"
        ></app-drop-down>
        <app-drop-down
            class="filter-device qt-mr-8"
            [placeholder]="'Select Device or User'"
            [isDisabled]="true"
            [list]="[]"
            [class]="['dropdown']"
        ></app-drop-down>
        <app-drop-down
            class="filter-data-picker"
            [placeholder]="'Data picker'"
            [list]="listDates"
            [field]="'title'"
            [class]="['dropdown']"
            (onSelectedItem)="selectDate($event)"
        ></app-drop-down>
    </div>















    <div class="qt-page-list__header-thead-container">
        <table class="qt-table-modern qt-page-list__header-thead">
            <thead>
                <tr>
                    <th class="password-table__check">
                        <div class="d-f">
                            <label class="qt-checkbox">
                                <input
                                    type="checkbox"
                                    [(ngModel)]="selectAll"
                                    (change)="toggleAll($event)"
                                >
                                <span></span>
                            </label>
                        </div>
                    </th>
                    <th
                        class="password-table__account pointer"
                        (click)="onFilter('account_type')"
                    >
                        Account Type
                        <span class="qt-table-modern__sorting"></span>
                    </th>
                    <th
                        class="password-table__description pointer"
                        (click)="onFilter('description')"
                    >
                        Description
                        <span class="qt-table-modern__sorting"></span>
                    </th>
                    <th
                        class="password-table__user-password pointer"
                        (click)="onFilter('user_password')"
                    >
                        User & Password
                        <span class="qt-table-modern__sorting"></span>
                    </th>
                    <th class="password-table__status">Status</th>
                    <th class="password-table__menu"></th>
                </tr>
            </thead>
        </table>
    </div>















</div>
