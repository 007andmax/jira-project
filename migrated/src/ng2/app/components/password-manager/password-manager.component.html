<div class="password-content">
  <div class="password-content__header">
    <h3>Password Manager</h3>
    <div class="password-content__header--search">
      <div class="password-selected">
        <div class="password-selected-qty new-link">
          <span>2</span> Selected
        </div>
        <div class="password-selected-actions">
          <i class="icn-16 edit-new"></i>
          <i class="icn-16 print-new"></i>
          <i class="icn-16 export-new"></i>
        </div>
      </div>
      <button class="plus-btn">+</button>
    </div>
  </div>
  <div class="password-content__list">
    <div class="password-content__list--header clearfix">
      <div style="width: 5.5%;" class="col-md-1"></div>
      <div class="col-md-3">Description</div>
      <div class="col-md-4">User/device</div>
      <div class="col-md-2">Password Expiry</div>
      <div class="col-md-2">Safety Level</div>
    </div>
    <div class="password-content__list--item clearfix">
      <div style="width: 5.5%;" class="col-md-1">
        <label class="control checkbox">
          <input type="checkbox">
          <span class="control-indicator" style="margin-top: 3px;"></span>
        </label>
      </div>
      <!--POSSIBLE CLASSES:-->
      <!-- - password-email-->
      <!-- - password-365-->
      <!-- - password-agent-->
      <!-- - password-generic-->
      <!-- - password-local-user-->
      <!-- - password-routers-->
      <!-- - password-server-->
      <div class="col-md-3 password-email">Network agent credentials</div>
      <div class="col-md-4">Chakrika Joyanto / Office Server-01</div>
      <div class="col-md-2">24 Dec, 2018</div>
      <div class="col-md-2" style="width: 15%;"></div>
      <div class="col-md-1 btn-actions">
        <a class="hit-area ha-20-20 pointer">
          <i class="icn-sm icn-more-light-grey"></i>
        </a>
        <ul class="dropdown-menu">
          <li>
            <a>Edit</a>
          </li>
          <li>
            <a>Remove</a>
          </li>
        </ul>
      </div>
    </div>
  </div>
  <div class="password-content__modal open">
    <div class="password-content__modal--header">
      <h3>Create Password</h3>
      <div class="password-modal-actions">
        <button><i class="icn-16 edit-new"></i></button>
        <button><i class="icn-16 print-new"></i></button>
        <button><i class="icn-16 export-new"></i></button>
      </div>
      <button class="close-modal"></button>
    </div>
    <div class="password-content__modal--content clearfix">
      <div class="col-md-6">
        <label>
          <p>Description</p>
          <input type="text" placeholder="Write Description">
        </label>
      </div>
      <div class="col-md-6">
        <label>
          <p>Client</p>
          <input class="pointer" type="text" placeholder="Select Client">
          <i class="icn-16 light-grey-caret"></i>
        </label>
      </div>
      <div class="col-md-6">
        <label>
          <p>Select Type</p>
          <input class="pointer" type="text" placeholder="Select Type">
          <i class="icn-16 light-grey-caret"></i>
        </label>
      </div>
      <div class="col-md-6">
        <label>
          <p>SSID</p>
          <input type="text" placeholder="SSID">
        </label>
      </div>
      <div class="col-md-6">
        <label>
          <p>Username</p>
          <input type="text" placeholder="Enter Username">
        </label>
      </div>
      <div class="col-md-6">
        <div class="password-actions">
          <i class="icn-16 edit-password-field pointer"></i>
          <i class="icn-16 private-password-field pointer"></i>
          <i class="icn-16 copy-password-field pointer"></i>
        </div>
        <label class="password">
          <p>Password</p>
          <input type="password" placeholder="Enter Password">
        </label>
      </div>
      <div class="col-md-6">
        <label>
          <p>Key</p>
          <input type="text" placeholder="Enter Key">
        </label>
      </div>
      <div class="col-md-6">
        <label>
          <p>Link</p>
          <input type="text" placeholder="Enter Link">
        </label>
      </div>
      <div class="col-md-6">
        <label>
          <p>Url</p>
          <input type="text" placeholder="Enter Url">
        </label>
      </div>
      <div class="col-md-6">
        <label>
          <p>Code</p>
          <input type="text" placeholder="Enter Code">
        </label>
      </div>
      <div class="col-md-12">
        <label>
          <p>Device / User</p>
          <input class="pointer" type="text" placeholder="Select Device / User">
          <i class="icn-16 light-grey-caret"></i>
        </label>
      </div>
      <div class="col-md-6">
        <label>
          <p>IP Address</p>
          <input type="text" placeholder="IP Address">
        </label>
      </div>
      <div class="col-md-3" style="width: 19.3%;">
        <label>
          <p>Port</p>
          <input type="text" placeholder="0000">
        </label>
      </div>
      <div class="col-md-3" style="width: 30.7%;">
        <label>
          <p>Expiry Date</p>
          <input class="pointer" type="text" placeholder="Expiry Date">
          <i class="icn-12 new-calendar"></i>
        </label>
      </div>
      <div class="col-md-12 password-links">
        <label class="control checkbox">
          <input type="checkbox">
          <span class="control-indicator"></span>
          https://
        </label>
        <label class="control checkbox">
          <input type="checkbox">
          <span class="control-indicator"></span>
          SSH
        </label>
        <label class="control checkbox">
          <input type="checkbox">
          <span class="control-indicator"></span>
          Telnet
        </label>
      </div>
      <div class="col-md-12">
        <label>
          <p>Note</p>
          <textarea placeholder="Write your note here…"></textarea>
        </label>
      </div>
    </div>
    <div class="password-content__modal--footer">
      <button class="btn btn-new btn-primary">Save Changes</button>
      <div class="password-modal-footer-actions">
        <p class="pointer">
          Password History
          <i style="height: 18px;" class="icn-16 rollback-new"></i>
        </p>
        <p class="pointer">
          Delete
          <i class="icn-16 remove-red"></i>
        </p>
      </div>
    </div>
  </div>
</div>
