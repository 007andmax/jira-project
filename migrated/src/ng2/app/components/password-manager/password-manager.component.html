<app-left-panel></app-left-panel>
<div class="password-content">
  <div class="password-content__header">
    <h3>Password Manager</h3>
    <div class="password-content__header--search">
      <div class="password-selected">
        <div class="password-selected-qty new-link">
          <span>2</span> Selected
        </div>
        <div class="password-selected-actions">
          <i class="icn-16 edit-new"></i>
          <i class="icn-16 print-new"></i>
          <i class="icn-16 export-new"></i>
        </div>
      </div>
      <button class="plus-btn">+</button>
    </div>
  </div>
  <div class="password-content__list">
    <div class="password-content__list--header clearfix">
      <div style="width: 5.5%;" class="col-md-1"></div>
      <div class="col-md-3">Description</div>
      <div class="col-md-4">User/device</div>
      <div class="col-md-2">Password Expiry</div>
      <div class="col-md-2">Safety Level</div>
    </div>
    <div class="password-content__list--item clearfix">
      <div style="width: 5.5%;" class="col-md-1">
        <label class="control checkbox">
          <input type="checkbox">
          <span class="control-indicator" style="margin-top: 3px;"></span>
        </label>
      </div>
      <!--POSSIBLE CLASSES:-->
      <!-- - password-email-->
      <!-- - password-365-->
      <!-- - password-agent-->
      <!-- - password-generic-->
      <!-- - password-local-user-->
      <!-- - password-routers-->
      <!-- - password-server-->
      <div class="col-md-3 password-email">Network agent credentials</div>
      <div class="col-md-4">Chakrika Joyanto / Office Server-01</div>
      <div class="col-md-2">24 Dec, 2018</div>
      <div class="col-md-2" style="width: 15%;"></div>
      <div class="col-md-1 btn-actions">
        <a class="hit-area ha-20-20 pointer">
          <i class="icn-sm icn-more-light-grey"></i>
        </a>
        <ul class="dropdown-menu">
          <li>
            <a>Edit</a>
          </li>
          <li>
            <a>Remove</a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
