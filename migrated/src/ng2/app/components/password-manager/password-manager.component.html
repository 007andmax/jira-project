<div class="qt-page-list password-page">
    <app-passwoord-manager-header
        [selectAll]="selectAll"
        (onSelectAll)="onSelectAll($event)"
        (onChangeFilterField)="onFilter($event)"
        (onSearch)="onSearch($event)"
        [recordsData]="recordsData"
    ></app-passwoord-manager-header>
    <div class="qt-page-list__body">
        <div class="qt-page-list__body-table-container">
            <table class="qt-page-list__body-tbody qt-table-modern password-table">
                <tbody
                    infiniteScroll
                    [infiniteScrollDistance]="2"
                    [infiniteScrollThrottle]="50"
                    [infiniteScrollDisabled]="infiniteScrollDisabled"
                    (scrolled)="onScroll()"
                >
                    <ng-template
                        ngFor
                        let-item
                        [ngForOf]="list_records"
                        [ngForTrackBy]="trackById"
                    >
                        <app-password-manager-table
                            [item]="item"
                            (onSelectRecord)="onSelectRecord($event)"
                        ></app-password-manager-table>
                    </ng-template>
                </tbody>
            </table>
            <div
                class="loading"
                *ngIf="showPreloader"
            ></div>
        </div>
    </div>
    <button
        class="mob-filters-btn mobile-btn primary"
        (click)="showMobileFilters()"
    >
        Filters
    </button>
