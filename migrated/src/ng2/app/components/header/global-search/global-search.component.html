<div
    class="topNavbarLeft-Left "
    ngbDropdown
    [autoClose]="'outside'"
    #globalSearch="ngbDropdown"
    (openChange)="onCloseProducts($event)"
>

    <div class="topNavbar-search global-search ">
        <div class="input-group-search dropdown">

            <input
                type="text"
                class="form-control-top-search"
                placeholder="Global search..."
                autocomplete="off"
                [(ngModel)]="word"
                (input)="onSearch()"
            >

            <span
                class="input-group-addon-search"
                *ngIf="word.length > 0"
            >
                <i class="icn-sm icn-search form-control-top-search-icn disabled"></i>
                <i
                    class="icn-sm icn-remove-old"
                    style="cursor:pointer;pointer-events: auto;"
                ></i>
            </span>

        </div>
    </div>

    <div
        class=select-product__dropdown
        ngbDropdownMenu
        aria-labelledby="dropdownProducts"
    >
        <ngb-accordion
            #acc="ngbAccordion"
            class="item-list products-accordion"
        >
            <ng-template
                ngFor
                let-item
                [ngForOf]="list"
                [ngForTrackBy]="trackByIndex"
            >
                <ngb-panel *ngIf="isShowType(item.type)">
                    <!-- | filter :'name' : search -->
                    <ng-template
                        ngbPanelHeader
                        let-opened="opened"
                    >
                        <button
                            ngbPanelToggle
                            class="btn select-product__item-title"
                            (click)="togglePanel(opened,$event)"
                        >
                            <div>
                                {{getText(item.type) + ' '}}
                                <span>({{item.list.length}})</span>
                            </div>
                            <div class="select-product__expand icon__expand"></div>
                        </button>
                    </ng-template>
                    <ng-template ngbPanelContent>
                        <div
                            class="category-product"
                            *ngFor="let listItem of item.list"
                            (click)="showInfo(listItem)"
                        >
                            <div class="d-f category-product__main-info">
                                <div class="d-f jc-sb category-product__title-price">
                                    <div class="title">{{listItem.name }}</div>
                                    <div class="text-right total-count"></div>
                                </div>

                                <div class="manufacture">
                                    <span>{{ listItem.info }}</span>

                                </div>
                            </div>
                        </div>
                    </ng-template>
                </ngb-panel>
            </ng-template>
        </ngb-accordion>
    </div>

</div>
