<div
    class="topNavbarLeft-Left "
    ngbDropdown
    [autoClose]="'outside'"
    #globalSearch="ngbDropdown"
>
    <div
        class="topNavbar-search global-search "
        ngbDropdownAnchor
    >
        <div class="input-group-search dropdown">
            <input
                type="text"
                class="form-control-top-search"
                placeholder="Global search..."
                autocomplete="off"
                [(ngModel)]="word"
                (input)="onSearch()"
                (click)="onShowDropDown()"
            >
            <span
                class="input-group-addon-search"
                *ngIf="word.length > 0"
                (click)="clearWord()"
            >
                <i class="icn-sm icn-search form-control-top-search-icn disabled"></i>
                <i
                    class="icn-sm icn-remove-old"
                    style="cursor:pointer;pointer-events: auto;"
                ></i>
            </span>
        </div>
    </div>
    <div
        class=select-product__dropdown
        ngbDropdownMenu
        aria-labelledby="dropdownProducts"
    >
        <div
            class="cps-block"
            *ngIf="list.length === 0"
        >
            <p>No data available yet</p>
        </div>
        <div
            class="cps-block"
            *ngIf="list.length > 0"
        >
            <div class="cps-block__header d-f">
                <ul class="cps-block__nav">
                    <ng-template
                        ngFor
                        let-item
                        [ngForOf]="list"
                        [ngForTrackBy]="trackByIndex"
                    >
                        <li
                            class="cps-block__nav-item"
                            [ngClass]="{'active':selectedType === item.type }"
                            *ngIf="isShowType(item.type)"
                            (click)="selectedType = item.type"
                            [textContent]="getText(item.type) + ' ('+item.list.length +')'"
                        >
                        </li>
                    </ng-template>
                </ul>
            </div>
            <div class="cps-block__content">
                <div class="cps-block__chat-block">
                    <div
                        class="category-product"
                        *ngFor="let listItem of getTypeList(selectedType)"
                        (click)="showInfo(listItem)"
                    >
                        <div class="d-f category-product__main-info">
                            <div class="d-f jc-sb category-product__title-price">
                                <div
                                    *ngIf="selectedType === 'USERS'"
                                    class="qt-table-modern__circle-avatar"
                                    [ngClass]="!getNameForAvatar(listItem).length ? 'transparent-text' : ''"
                                    [textContent]="getNameForAvatar(listItem)"
                                    [ngStyle]="{'background': ticketsListService.getStyleAvatar(getUserById(listItem.id),listColorNoAvatar[indexNoAvatar]) }"
                                ></div>
                                <div
                                    class="title"
                                    [textContent]="getFistLine(listItem)"
                                ></div>
                                <div class="text-right total-count"></div>
                            </div>
                            <div class="manufacture">
                                <span [textContent]="getSecondLine(listItem)"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
