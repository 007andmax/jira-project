<!-- for show filters add class "show" for app-left-panel -->
<div class="new-users-content">
    <app-users-header [count]="count"></app-users-header>
    <div class="new-users__list">
        <div class="new-users__list--header clearfix mob-hidden">
            <div class="col-md-3 pointer with-checkbox">
                <label class="checkbox-container">
                    <input
                        type="checkbox"
                        (change)="onSelectAllUser($event)"
                    >
                    <span class="checkbox-mark"></span>
                </label>
                <p (click)="onFilter('name')">Name</p>
            </div>
            <div
                class="col-md-4 pointer"
                (click)="onFilter('company')"
            >
                Company
            </div>
            <div
                class="col-md-4 pointer"
                (click)="onFilter('contact')"
            >
                Contact No.
            </div>
            <div class="col-md-4 pointer">Subscription</div>
            <div
                class="col-md-1 pointer text-center"
                (click)="onFilter('tickets')"
            >
                Tickets
            </div>
            <div class="col-md-2 pointer"></div>
        </div>
        <div
            class="user-content"
            infiniteScroll
            [infiniteScrollDistance]="2"
            [infiniteScrollThrottle]="50"
            [infiniteScrollDisabled]="infiniteScrollDisabled"
            (scrolled)="onScroll()"
        >
            <ng-template
                ngFor
                let-user
                [ngForOf]="users"
                [ngForTrackBy]="trackById"
            >
                <app-users-table
                    [showArchivedUsers]="showArchivedUsers"
                    [user]="user"
                ></app-users-table>
            </ng-template>
            <div
                class="loading"
                *ngIf="showPreloader"
            ></div>
        </div>
        <button
            class="mob-filters-btn mobile-btn primary"
            (click)="showMobileFilter()"
        >
            Filters
        </button>
        <div
            class="loading"
            style="display: none;"
        ></div>
    </div>
</div>
<users-aside-edit></users-aside-edit>
<app-users-aside></app-users-aside>
<app-left-panel-company></app-left-panel-company>
