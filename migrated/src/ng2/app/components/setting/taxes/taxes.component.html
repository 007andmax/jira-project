<ngx-loading [show]="loading"></ngx-loading>
<!-- Middle Wrapper  -->
<div class="page-container">
  <div class="page-insider manage-taxes">
    <div class="heading">
      <h1>Taxes</h1>
      <div class="heading-serach">
        <a href="javascript:;" class="btn-outline" (click)="create = !create"
          >Add Tax</a
        >
        <!-- Modal create Tags -->
        <div class="modal-content toggle-area" [class.opened]="create">
          <div class="toggle-header">
            <h2 class="h1">Add Tax</h2>
          </div>
          <div class="modal-body">
            <form method="POST">
              <div class="f-row">
                <div class="f-col col-100">
                  <label>Tax Name</label>
                  <div class="form-row">
                    <input
                      type="text"
                      class="form-input"
                      placeholder="Enter Tax Name"
                    />
                  </div>
                </div>
                <div class="f-col col-100">
                  <label>Tax Rate (%)</label>
                  <div class="form-row">
                    <input
                      type="text"
                      class="form-input"
                      placeholder="Set Tax Rate"
                    />
                  </div>
                </div>
                <div class="f-col col-100 check-area">
                  <span class="cmn-checkbox">
                    <input type="checkbox" id="set-as" />
                    <label for="set-as">Set as Default</label>
                  </span>
                </div>
                <div class="m-btn-row">
                  <div class="m-btn-col">
                    <input
                      type="submit"
                      value="Save"
                      class="btn btn-primary"
                      disabled
                    />
                    <a
                      href="javascript:;"
                      class="btn btn-secondary"
                      aria-label="Close"
                      (click)="create = !create"
                      >Cancel</a
                    >
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <div class="cmn-area">
      <div class="data-table-wrap">
        <table class="display dataTable" style="width:100%">
          <thead>
            <tr>
              <th class="tax-name">Tax Name</th>
              <th class="rate">Rate (%)</th>
              <th class="default">Set as Default</th>
              <th class="action">&nbsp;</th>
            </tr>
          </thead>
          <tbody *ngIf="taxes">
            <tr *ngFor="let tax of taxes">
              <td class="tax-name">{{ tax.name }}</td>
              <td class="rate">{{ tax.rate }}%</td>
              <td class="default">
                <span class="cmn-checkbox">
                  <input
                    type="checkbox"
                    id="gmi"
                    checked="{{ tax.isDefault }}"
                  />
                  <label for="gmi"></label>
                </span>
              </td>
              <td class="action">
                <a
                  href="javascript:;"
                  data-tooltip="Edit"
                  class="edit"
                  (click)="editTax(tax)"
                  ><img src="/ng2/assets/img/edit.svg" alt="Edit"
                /></a>
                <a
                  href="javascript:;"
                  data-tooltip="Remove"
                  class="remove"
                  (click)="removeTax(tax)"
                  ><img src="/ng2/assets/img/remove.svg" alt="Remove"
                /></a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
