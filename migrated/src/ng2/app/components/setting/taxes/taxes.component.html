<!-- Middle Wrapper  -->
<div class="page-container">
  <div class="page-insider manage-taxes">
    <div class="heading">
      <h1>Taxes</h1>
      <div class="heading-serach">
        <a href="javascript:;" class="btn-outline" (click)="create = !create">Add Tax</a>
        <!-- Modal create Tags -->
        <div class="modal-content toggle-area" [class.opened]="create">
          <div class="toggle-header">
            <h2 class="h1">Add Tax</h2>
          </div>
          <div class="modal-body">
            <form method="POST">
              <div class="f-row">
                <div class="f-col col-100">
                  <label>Tax Name</label>
                  <div class="form-row">
                    <input type="text" class="form-input" placeholder="Enter Tax Name" />
                  </div>
                </div>
                <div class="f-col col-100">
                  <label>Tax Rate (%)</label>
                  <div class="form-row">
                    <input type="text" class="form-input" placeholder="Set Tax Rate" />
                  </div>
                </div>
                <div class="f-col col-100 check-area">
                  <span class="cmn-checkbox">
                    <input type="checkbox" id="set-as" />
                    <label for="set-as">Set as Default</label>
                  </span>
                </div>
                <div class="m-btn-row">
                  <div class="m-btn-col">
                    <input type="submit" value="Save" class="btn btn-primary" disabled />
                    <a
                      href="javascript:;"
                      class="btn btn-secondary"
                      aria-label="Close"
                      (click)="create = !create"
                      >Cancel</a
                    >
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
