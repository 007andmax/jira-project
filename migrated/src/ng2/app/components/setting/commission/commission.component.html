<div class="page-container commision-container">
    <div class="page-insider commision">
        <div class="heading">
            <h1>
                <a
                    href="javascript:;"
                    (click)="onBackMenu()"
                    class="back-menu"
                    style="display: none;"
                >
                    backmneu
                </a>
                Commissions
            </h1>
            <div
                class="heading-serach"
                style="display: none;"
            >
                <a
                    href="javascript:;"
                    class="btn-outline"
                >
                    Add Commision
                </a>
            </div>
        </div>
        <ngb-tabset>
            <!-- Companies -->
            <ngb-tab
                title="Companies’s Sales Person"
                id="tab1"
            >
                <ng-template ngbTabContent>
                    <app-company-commission></app-company-commission>
                </ng-template>
            </ngb-tab>
            <!-- Product -->
            <ngb-tab title="Product">
                <ng-template ngbTabContent>
                    <app-product></app-product>
                </ng-template>
            </ngb-tab>
            <!-- Contract -->
            <ngb-tab title="Contract">
                <ng-template ngbTabContent>
                    <app-contract></app-contract>
                </ng-template>
            </ngb-tab>
            <!-- Service -->
            <ngb-tab title="Service">
                <ng-template ngbTabContent>
                    <app-service></app-service>
                </ng-template>
            </ngb-tab>
        </ngb-tabset>
    </div>
</div>
