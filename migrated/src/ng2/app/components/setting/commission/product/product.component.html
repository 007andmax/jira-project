
<div class="cmn-area products-area">
  <div class="data-table-wrap">
    <table dataTable class="display dataTable" style="width:100%">
      <thead>
        <tr>
          <th class="p-name">Product Name</th>
          <th class="rate">Rate (%)</th>
          <th class="action">&nbsp;</th>
        </tr>
      </thead>
      <tbody *ngIf="categories">
        <tr *ngFor="let category of categories;trackBy:category?.name; let i = index">
          <td>{{ category.name }}</td>
          <td>{{ category.commissionRate }}</td>
          <td class="action">
            <a
              href="javascript:;"
              data-tooltip="Edit"
              class="edit"
              (click)="editProduct(i)"
              ><img src="../../../../../../ng1/images/setting-module/edit.svg" alt="Edit"
            /></a>
            <a href="javascript:;" data-tooltip="Remove" class="remove"
            (click)="confirmDelete(category)"
              ><img src="../../../../../../ng1/images/setting-module/remove.svg" alt="Remove"
            /></a>
            <!-- Edit create Tags -->
            <div class="modal-content toggle-area" [ngClass]="{'opened': selectedIdx === i}" >
                <div class="modal-wrapper">
                  <div class="toggle-header">
                    <h2 class="h1">Edit Rate</h2>
                  </div>
                  <div class="modal-body">
                    <form method="POST">
                      <div class="f-row">
                        <div class="f-col col-100">
                          <label>Commission Rate (%)</label>
                          <div class="form-row">
                            <input
                              type="text"
                              class="form-input"
                              name="commissionRate"
                              autocomplete="off"
                              #commissionRate
                              value="{{category.commissionRate}}"
                              step="0.01"
                              placeholder="Enter Commission Rate"
                            />
                          </div>
                        </div>
                        <div class="m-btn-row">
                          <div class="m-btn-col">
                            <input
                              type="submit"
                              (click)="confirmEdit(commissionRate.value,category.id,category)"
                              value="Save"
                              class="btn btn-primary"
                            />
                            <a
                              href="javascript:;"
                              class="btn btn-secondary"
                              aria-label="Close"
                              (click)="selectedIdx = -1"
                              >Cancel</a
                            >
                          </div>
                        </div>
                      </div>
                    </form>
                  </div>
                </div>  
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <!-- <div class="loading" *ngIf="loading"></div> -->
</div>

<div class="img-croparea deletePopup" *ngIf="deletePopup">
  <div class="crop-inner">
    <div class="cropping">
      <div class="popup-message">
        <span class="icon-part">
          <img
            src="../../../../../ng1/images/setting-module/delete-red.svg"
            alt="delete"
          />
        </span>
        <div class="message-right">
          <h1>Delete Commission Rate</h1>
          <p>Are you sure you want {{category.name}} commission rate to zero?</p>
        </div>
        <a class="close-ico" href="javascript:;" (click)="deletePopup = false"
          ><img
            src="../../../../../ng1/images/setting-module/close.svg"
            alt="close"
        /></a>
      </div>
      <div class="btn-crops">
        <button
          type="button"
          class="btn btn-primary"
          (click)="deletePopup = false;removeProduct()"
        >
          Yes, I am sure
        </button>
        <button
          type="button"
          class="btn btn-secondary"
          (click)="deletePopup = false"
        >
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>

<div class="img-croparea deletePopup" *ngIf="confirmPopup">
  <div class="crop-inner">
    <div class="cropping">
      <div class="popup-message">
        <!-- <span class="icon-part">
          <img
            src="../../../../../ng1/images/setting-module/delete-red.svg"
            alt="delete"
          />
        </span> -->
        <div class="message-right">
          <p>Do you want this commission to fact old items?</p>
        </div>
        <a class="close-ico" href="javascript:;" (click)="factItem = false;confirmPopup = false;setCategoryRate();"
          ><img
            src="../../../../../ng1/images/setting-module/close.svg"
            alt="close"
        /></a>
      </div>
      <div class="btn-crops">
        <button
          type="button"
          class="btn btn-primary"
          (click)="factItem = true;confirmPopup = false;setCategoryRate()"
        >
          Yes, I want
        </button>
        <button
          type="button"
          class="btn btn-secondary"
          (click)="factItem = false;confirmPopup = false;setCategoryRate();"
        >
          Cancel
        </button>
      </div>
    </div>
  </div>
</div>
