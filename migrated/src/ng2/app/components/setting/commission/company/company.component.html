<ngx-loading [show]="loading"></ngx-loading>
<div class="cmn-area companies">
  <div class="data-table-wrap">
    <table class="display dataTable" style="width:100%">
      <thead>
        <tr>
          <th class="c-name">Company</th>
          <th class="address">Address</th>
          <th class="sp">Sales Person</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let company of clientsCompanies; let i = index">
          <td class="c-name">
            <!-- {{company | json}} -->
            <div class="c-info">
              <span class="c-logo">{{ displayFrstLstChar(company.name)}}</span>
              <h5>{{ company.name }}</h5>
            </div>
          </td>
          <td class="address">
            {{
              company.companyInfo.addresses[0]
                .addressWithSuitNumberAndPostalCode
            }}
          </td>
          <td class="sp">
            <div class="">
              <ng-select
              class="disable-arrow disable-dropdown disable-clear-all"
                [items]="activeTechUsers"
                bindLabel="firstName"
                bindValue="firstName"
                (change)="setTechLead($event, company)"
                placeholder="Select Tech Users"
                [ngModel]="selectedActiveTechUsers(company, i)"
              >
                <ng-template ng-label-tmp let-item="item" let-clear="clear">
                  <img height="15" width="15" *ngIf="item.avatar" [src]="getClinetUrl(item)" />
                  <span *ngIf="item.avatar === null">{{dropFrstLstChar(item)}}</span>
                  <b>{{ getFullName(item)}}</b>
                </ng-template>
                <ng-template ng-option-tmp let-item="item" let-index="index">
                  <!-- {{item | json}} -->
                  <img
                    height="15"
                    width="15"
                    *ngIf="item.avatar"
                    src="/users/{{ item.id }}/image.jpg?t={{
                      item.avatar.updatedAt
                    }}"
                  />
                  <span *ngIf="item.avatar === null">{{dropFrstLstChar(item)}}</span>
                  <b>{{ item.firstName }} {{ item.lastName }}</b>
                </ng-template>
              </ng-select>
            </div>
          </td>
        </tr>
