<div class="page-insider invoice-ticket">
<div class="cmn-area in-ticks">
    <form method="POST" action="">
        <div class="f-row">
            <div class="f-col col-33">
                <label>Starting ticket number</label>
                <div class="form-row">
                   <input type="text" class="form-input" placeholder="Enter Starting ticket number" value="Starting ticket number"/>
                </div>
            </div>
            <div class="f-col col-50">
                <label>Outliers Time</label>
                <div class="form-row">
                <div class="input-number">
                    {{ log }} <span>Hours</span>
                    <div class="inc-btns">
                      <a href="javascript:;" class="plus" (click)="increaseValue()">+</a>
                      <a href="javascript:;" class="minus" (click)="decreaseValue()">-</a>
                    </div>
                  </div>
                </div>
            </div>
            <div class="f-col col-33">
                <label>Timepicker type</label>
                <div class="form-row">
                  <select class="cmn-select form-input">
                    <option>Start-End time picker</option>
                    <option>Start-End time picker</option>
                    <option>Start-End time picker</option>
                  </select>
                </div>
            </div>
            <div class="f-col col-33">
                <label> Tax ID</label>
                <div class="form-row">
                   <input type="text" class="form-input" placeholder="Enter Tax Id" value="1344450"/>
                </div>
            </div>
            <div class="f-col col-33">
                <label> Tax ID description</label>
                <div class="form-row">
                   <input type="text" class="form-input" placeholder="Enter Tax ID description" value="#8890902"/>
                </div>
            </div>
            <div class="f-col col-100">
                <label> Memo of invoice</label>
                <div class="form-row">
                   <textarea class="form-input" placeholder="Enter memo of invoice">Glad to work with you !</textarea>
                </div>
            </div>
        </div>
        <input type="submit" class="btn btn-primary" value="Save Changes" />
    </form>
</div>
</div>
