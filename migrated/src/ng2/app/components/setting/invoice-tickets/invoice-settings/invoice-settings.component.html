<div class="page-insider invoice-ticket">

    <form method="POST" action="">
        <div class="f-row">

                <label>Starting ticket number</label>
                <div class="form-row">
                   <input type="text" class="form-input" placeholder="Enter Starting ticket number" value="1001"/>
                </div>
            </div>
            <div class="f-col col-50">
                <label>Outliers Time</label>
                <div class="form-row">

                      <select class="cmn-select form-input">

                          <option>17 days</option>
                        </select>
                  </div>
                </div>
            </div>
            <div class="f-col col-100">
                <span class="cmn-checkbox">
                    <input type="checkbox" id="enable" />

            </div>
            <div class="f-col col-50">

            </div>
            <div class="f-col col-50">

                <div class="form-row">
                   <input type="email" class="form-input" placeholder="Enter Your Email Address" value="Miguelburgess@activetek.net"/>

            </div>
            <div class="f-col col-50">
                <label>Role</label>
                <div class="form-row">
                   <input type="text" class="form-input" placeholder="Enter Your Role" value="Software Engineer"/>

            </div>
            <div class="f-col col-50">
                <label>Primary Phone Number <a href="javascript:;" class="static-link">+ Add Phone</a></label>
                <div class="form-row primary-phone">
                   <input type="text" class="form-input" placeholder="Primary Phone Number" value="774-792-4426"/>
                   <select class="cmn-select form-input">
                     <option>mobile</option>
                     <option>office</option>
                     <option>fax</option>
                   </select>
                </div>
            </div>
        </div>
        <input type="submit" class="btn btn-primary" value="Save Changes" />
