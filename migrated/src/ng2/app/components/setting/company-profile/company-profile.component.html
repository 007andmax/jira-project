<!-- Middle Wrapper  -->
<div class="page-container">
    <div class="page-insider company-profile">
      <div class="heading">
        <h1>Company Profile</h1>
      </div>
      <tabset>
        <!-- Profile -->
          <tab heading="Profile" id="tab1">
            <div class="cmn-area profile">
                <div class="dp-area">
                    <span class="dp">
                      <img src="ng2/assets/img/company-logo.svg" alt="Company" />
                    </span>
                    <div class="dp-info">
                      <input type="file" id="profile-dp" style="display: none;" />
                      <label for="profile-dp" class="static-link">Change Logo</label>
                      <span>Maximum size of 2MB. JPG, GIF, PNG</span>
                    </div>
                </div>
                <form method="POST" action="">
                    <div class="f-row">
                        <div class="f-col col-50">
                            <label>Company Name</label>
                            <div class="form-row">
                               <input type="text" class="form-input" placeholder="Enter Company Name" value="Acer Electronics company"/>
                            </div>
                        </div>
                        <div class="f-col col-50">
                            <label>Company URL</label>
                            <div class="form-row">
                               <input type="text" class="form-input link" placeholder="Enter Your Company URL" value="activeis.quicktech.com" disabled/>
                            </div>
                        </div>
                        <div class="f-col col-50">
                            <label>Time Zone</label>
                            <div class="form-row">
                              <select class="cmn-select form-input">
                                <option>Canada/Atlantic</option>
                                <option>Pacific Time zone</option>
                                <option>Mountain Time zone</option>
                              </select>
                            </div>
                        </div>
                        <div class="f-col col-50">
                            <label>Primary Phone Number <a href="javascript:;" class="static-link">+ Add Phone</a></label>
                            <div class="form-row primary-phone">
                               <input type="text" class="form-input" placeholder="Primary Phone Number" value="774-792-4426"/>
                               <select class="cmn-select form-input">
                                 <option>mobile</option>
                                 <option>office</option>
                                 <option>fax</option>
                               </select>
                            </div>
                        </div>
                    </div>
                    <input type="submit" class="btn btn-primary" value="Save Changes" />
                </form>
            </div>
          </tab>
          <!-- Contact Details -->
          <tab heading="Contact Details">
              <div class="cmn-area contact">
                  <form method="POST">
                      <div class="f-row">
                          <div class="f-col col-20">
                              <label>Suite Number</label>
                              <div class="form-row">
                                 <input type="text" placeholder="Enter Suite Number" class="form-input" value="346"/>
                              </div>
                          </div> 
                          <div class="f-col col-60">
                              <label>Mailing Address</label>
                              <div class="form-row">
                                 <input type="text" placeholder="Enter Mailing Address" class="form-input" value="Calgary Trail, Edmonton, AB, Canada"/>
                              </div>
                          </div>
                          <div class="f-col col-20">
                              <label>Zip</label>
                              <div class="form-row">
                                 <input type="text" placeholder="Enter Zip Code" class="form-input" value="403568"/>
                              </div>
                          </div>
                          <div class="f-col col-100">
                              <div class="map-area">
                                  <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14680.19568247228!2d72.5559743!3d23.09530495!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x53a01f27a9ccc8c5%3A0x88350b6b08718301!2sCalgary%20Trail%20NW%2C%20Edmonton%2C%20AB%2C%20Canada!5e0!3m2!1sen!2sin!4v1566740627587!5m2!1sen!2sin"  frameborder="0" style="border:0;" allowfullscreen=""></iframe>
                              </div>
                          </div>
                      </div>
                      <input type="submit" class="btn btn-primary" value="Save Changes" />
                  </form>
              </div>
          </tab>
          <!-- Ticket Response Time Setting  -->
          <tab heading="Ticket Response Time Setting">
              <div class="cmn-area ticket-response">
                  <form method="POST">
                      <div class="outlair">
                          <h5>Outliers Time</h5>
                          <div class="input-number"> 
                            {{ log }} <span>Hours</span> 
                            <div class="inc-btns">
                              <a href="javascript:;" class="plus" (click)="increaseValue()">+</a>
                              <a href="javascript:;" class="minus" (click)="decreaseValue()">-</a>
                            </div>
                          </div>
                      </div>
                      <div class="c-hours">
                          <h5>Select days with correct hours</h5>
                          <ul class="list-unstyled">
                              <li>
                                <div class="cmn-checkbox">
                                    <input type="checkbox" id="Monday" checked />
                                    <label for="Monday">Monday</label>
                                </div>
                                <div class="time-zone">
                                    <div class="tl-col"><input type="text" class="form-input" placeholder="Enter Time" value="08:30 AM"  ng-model="checked"/></div>
                                    <div class="tl-col"><input type="text" class="form-input" placeholder="Enter Time" value="05:30 PM" /></div>
                                </div>
                              </li>
                              <li>
                                <div class="cmn-checkbox">
                                    <input type="checkbox" id="Tuesday" />
                                    <label for="Tuesday">Tuesday</label>
                                </div>
                                <div class="time-zone">
                                    <div class="tl-col"><input type="text" class="form-input" placeholder="Enter Time" value="08:30 AM" disabled /></div>
                                    <div class="tl-col"><input type="text" class="form-input" placeholder="Enter Time" value="05:30 PM" disabled /></div>
                                </div>
                              </li>
                              <li>
                                <div class="cmn-checkbox">
                                    <input type="checkbox" id="Wednesday" />
                                    <label for="Wednesday">Wednesday</label>
                                </div>
                                <div class="time-zone">
                                    <div class="tl-col"><input type="text" class="form-input" placeholder="Enter Time" value="08:30 AM" disabled /></div>
                                    <div class="tl-col"><input type="text" class="form-input" placeholder="Enter Time" value="05:30 PM" disabled /></div>
                                </div>
                              </li>
                              <li>
                                <div class="cmn-checkbox">
                                    <input type="checkbox" id="Thursday" />
                                    <label for="Thursday">Thursday</label>
                                </div>
                                <div class="time-zone">
                                    <div class="tl-col"><input type="text" class="form-input" placeholder="Enter Time" value="08:30 AM" disabled /></div>
                                    <div class="tl-col"><input type="text" class="form-input" placeholder="Enter Time" value="05:30 PM" disabled /></div>
                                </div>
                              </li>
                              <li>
                                <div class="cmn-checkbox">
                                    <input type="checkbox" id="Friday" />
                                    <label for="Friday">Friday</label>
                                </div>
                                <div class="time-zone">
                                    <div class="tl-col"><input type="text" class="form-input" placeholder="Enter Time" value="08:30 AM" disabled /></div>
                                    <div class="tl-col"><input type="text" class="form-input" placeholder="Enter Time" value="05:30 PM" disabled /></div>
                                </div>
                              </li>
                              <li>
                                <div class="cmn-checkbox">
                                    <input type="checkbox" id="Saturday" />
                                    <label for="Saturday">Saturday</label>
                                </div>
                                <div class="time-zone">
                                    <div class="tl-col"><input type="text" class="form-input" placeholder="Enter Time" value="08:30 AM" disabled /></div>
                                    <div class="tl-col"><input type="text" class="form-input" placeholder="Enter Time" value="05:30 PM" disabled /></div>
                                </div>
                              </li>
                              <li>
                                <div class="cmn-checkbox">
                                    <input type="checkbox" id="Sunday" checked />
                                    <label for="Sunday">Sunday</label>
                                </div>
                                <div class="time-zone">
                                    <div class="tl-col"><input type="text" class="form-input" placeholder="Enter Time" value="08:30 AM"  /></div>
                                    <div class="tl-col"><input type="text" class="form-input" placeholder="Enter Time" value="05:30 PM"  /></div>
                                </div>
                              </li>
                          </ul>
                      </div>
                      <input type="submit" class="btn btn-primary" value="Save Changes" />
                  </form>
              </div>
          </tab>
        </tabset>
    </div>
  </div>
