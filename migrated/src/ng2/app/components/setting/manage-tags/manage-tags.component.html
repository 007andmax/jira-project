<ngx-loading [show]="loading"></ngx-loading>
<!-- Middle Wrapper  -->
<div class="page-container">
  <div class="page-insider manage-tags">
    <div class="heading">
      <h1>Manage Tags</h1>
      <div class="heading-serach">
        <form method="GET">
          <input
            type="search"
            class="form-input"
            [(ngModel)]="searchTag"
            name="searchTag"
            placeholder="Search Tags…"
          />
        </form>
        <a href="javascript:;" class="btn-outline" (click)="create = !create"
          >Create Tag</a
        >
        <!-- Modal create Tags -->
        <div class="modal-content toggle-area" [class.opened]="create">
          <div class="toggle-header">
            <h2 class="h1">Create Tag</h2>
          </div>
          <div class="modal-body">
            <form [formGroup]="compnayForm" (ngSubmit)="onSubmit()">
              <div class="f-row">
                <div class="f-col col-100">
                  <label *ngIf="!submitted || !f.word.errors">Tag Name</label>
                  <div
                    *ngIf="submitted && f.word.errors"
                    class="invalid-feedback"
                  >
                    <div *ngIf="f.word.errors.required">
                      Tag Name is required
                    </div>
                  </div>
                  <div class="form-row">
                    <input
                      type="text"
                      formControlName="word"
                      class="form-input"
                      placeholder="Enter Tag Name"
                      [ngClass]="{ 'is-invalid': submitted && f.word.errors }"
                    />
                  </div>
                </div>
                <div class="m-btn-row">
                  <div class="m-btn-col">
                    <input type="submit" value="Save" class="btn btn-primary" />
                    <a
                      href="javascript:;"
                      class="btn btn-secondary"
                      aria-label="Close"
                      (click)="create = !create"
                      >Cancel</a
                    >
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <tabset (click)="setTab()">
      <!-- Companies -->
      <tab heading="Companies" id="tab1">
        <div class="cmn-area">
          <div class="data-table-wrap">
            <table #dataTable class="display dataTable" style="width:100%">
              <thead>
                <tr>
                  <th class="c-tag"><span>Custom Tags</span></th>
                  <th class="count"><span>Count</span></th>
                  <th class="action">&nbsp;</th>
                </tr>
              </thead>
              <tbody>
                <tr
                  *ngFor="
                    let company of companyTags | tag: searchTag;
                    let i = index
                  "
                >
                  <td>{{ company.word | titlecase }}</td>
                  <td>{{ company.usedCounter }}</td>
                  <td class="action">
                    <a
                      href="javascript:;"
                      data-tooltip="Edit"
                      class="edit"
                      (click)="editTag(company, i)"
                      ><img src="/ng2/assets/img/edit.svg" alt="Edit"
                    /></a>
                    <a
                      href="javascript:;"
                      data-tooltip="Remove"
                      class="remove"
                      (click)="removeCompanyTag(company.id)"
                      ><img src="/ng2/assets/img/remove.svg" alt="Remove"
                    /></a>
                    <!-- Edit create Tags -->
                    <div
                      class="modal-content toggle-area"
                      [ngClass]="{ opened: selectedIdx === i }"
                    >
                      <div class="toggle-header">
                        <h2 class="h1">Edit Tag</h2>
                      </div>
                      <div class="modal-body">
                        <form [formGroup]="compnayForm" (ngSubmit)="onSubmit()">
                          <div class="f-row">
                            <div class="f-col col-100">
                              <label *ngIf="!submitted || !f.word.errors"
                                >Tag Name</label
                              >
                              <div
                                *ngIf="submitted && f.word.errors"
                                class="invalid-feedback"
                              >
                                <div *ngIf="f.word.errors.required">
                                  Tag Name is required
                                </div>
                              </div>
                              <div class="form-row">
                                <input
                                  type="text"
                                  formControlName="word"
                                  class="form-input"
                                  placeholder="Enter Tag Name"
                                  [ngClass]="{
                                    'is-invalid': submitted && f.word.errors
                                  }"
                                />
                              </div>
                              <input
                                type="text"
                                hidden
                                formControlName="id"
                                class="form-input"
                              />
                            </div>
                            <div class="m-btn-row">
                              <div class="m-btn-col">
                                <input
                                  type="submit"
                                  value="Save"
                                  class="btn btn-primary"
                                />
                                <a
                                  href="javascript:;"
                                  class="btn btn-secondary"
                                  aria-label="Close"
                                  (click)="selectedIdx = -1"
                                  >Cancel</a
                                >
                              </div>
                            </div>
                          </div>
                        </form>
                      </div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </tab>
      <!-- Tickets -->

                              <div class="form-row">

                                  type="text"
                                  formControlName="word"
                                  class="form-input"
                                  [ngClass]="{
                                    'is-invalid': submitted && f.word.errors

                                  placeholder="Enter Tag Name"
                                />
                              </div>
                              <input
                                type="text"
                                hidden
                                formControlName="id"
                                class="form-input"
                              />
                            </div>

                            <div class="m-btn-row">
                              <div class="m-btn-col">
                                <input
                                  type="submit"
                                  value="Save"
                                  class="btn btn-primary"
                                />
                                <a
                                  href="javascript:;"
                                  class="btn btn-secondary"
                                  aria-label="Close"
                                  (click)="selectedIdx = -1"
                                  >Cancel</a
                                >
                              </div>
                            </div>
                          </div>
                        </form>
                      </div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
