<div class="left-panel-ng2__content--types">
  <div class="types-header">TICKET STATUS</div>
  
  <div class="ticket-statuses">
    <ng-template ngFor let-itemStatus [ngForOf]="listsStatus">

      <div class="ticket-status-color d-f jc-sb ai-c " [ngClass]="{'active' : listType === itemStatus.status}" ngbDropdown>
        <div (click)="setStatus(itemStatus.status)">{{itemStatus.title}}</div>
        <div class="ticket-status-circle" [ngStyle]="{'border-color' : (statusColor) ?  listColors[statusColor[itemStatus.field]].borderColor : null,'background-color' : (statusColor) ?  listColors[statusColor[itemStatus.field]].backgroundColor : null}" [id]="itemStatus.field" ngbDropdownToggle></div>
   
     <div ngbDropdownMenu aria-labelledby="itemStatus.field">
       <ng-template ngFor let-item [ngForOf]="listColors" let-i="index">
        <div class="ticket-status-circle" [ngStyle]="{'border-color' :   item.borderColor ,'background-color' :  item.backgroundColor}" (click)="changeColor(itemStatus.field,i)" ngbDropdownItem></div>
       </ng-template>
   </div>
      </div>
    </ng-template>
  </div>
  
</div>
