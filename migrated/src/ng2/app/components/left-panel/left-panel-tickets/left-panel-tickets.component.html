<div class="left-panel-ng2 new-tickets">
  <div class="left-panel-ng2__header d-f jc-sb ">
    <div>Filters</div>
    <div class="header-filter-icon icon__filters"></div>
  </div>
  <div class="left-panel-ng2__content">
    
    <div class="left-panel-ng2__content--lists">
      <!--<div class="list-item">Dashboard</div> -->
      <div class="list-item" [ngClass]="{'active': listType === 'ALL'}" (click)="setTypeFilter('ALL')">All tickets</div>
      <div class="list-item" [ngClass]="{'active': listType === 'UNASSIGNED'}" (click)="setTypeFilter('UNASSIGNED')">Unassigned</div>
      <div class="list-item" [ngClass]="{'active': listType === 'OPEN'}" (click)="setTypeFilter('OPEN')">Open</div>
      <div class="list-item" [ngClass]="{'active': listType === 'CLOSED'}" (click)="setTypeFilter('CLOSED')">Close</div>
      <div class="list-item" [ngClass]="{'active': listType === 'ON_HOLD'}" (click)="setTypeFilter('ON_HOLD')">On Hold</div>
      <div class="list-item" [ngClass]="{'active': listType === 'TRASH'}" (click)="setTypeFilter('TRASH')">Trash</div>
      <div class="list-item" [ngClass]="{'active': listType === 'SPAM'}" (click)="setTypeFilter('SPAM')">Spam</div>
      <div class="list-item" [ngClass]="{'active': listType === 'USERS'}" (click)="setTypeFilter('USERS')">My Tickets</div>
      <div class="list-item" [ngClass]="{'active': listType === 'RECURRING_TICKETS'}" (click)="setTypeFilter('RECURRING_TICKETS')">Recurring tickets</div>
      <div class="list-item" [ngClass]="{'active': listType === 'RECURRING_TICKETS_OPEN'}" (click)="setTypeFilter('RECURRING_TICKETS_OPEN')">Recurring tickets Open</div>
      <div class="list-item" [ngClass]="{'active': listType === 'RECURRING_TICKETS_CLOSED'}" (click)="setTypeFilter('RECURRING_TICKETS_CLOSED')">Recurring tickets Closed</div>
    </div>
    
  <app-tickets-status (onSetStatus)="setTypeFilter($event)"></app-tickets-status>
  
    <div class="left-panel-ng2__content--tags clearfix">
      <div class="tags-header">
        By tags
      </div>
    
      <app-left-panel-tags [type]="'ALL'" [blockCreateTag]="true" (tagsChange)="onChangeTags($event)"> 
      </app-left-panel-tags>
    </div>
  
  
    <div class="left-panel-ng2__content--filters">
      <div class="filter-item">
        <i class="icn-sm report-caret-icon"></i>
        <div class="filter-item__header" (click)="toggleFilter($event)">
          By Company
        </div>
        <div class="filter-item__content">
          <div class="dark-dropdown">
            <app-select-search [placeholder]="'Select Company'" [change]="false" [class]="['dark-dropdown']"
            [field]="'name'" [editItem]="selectedCompany"  [list]="companies"
              (onSelectedItem)="onSelectCompany($event)"></app-select-search>
          </div>
          <div class="resent-block">
            <div class="resent-block__header">Recent</div>
            <div class="resent-block__content">
              <ng-template ngFor let-item [ngForOf]="companiesHistory" let-i="index" [ngForTrackBy]="trackByIndex">
                <p [textContent]="item" (click)="selectClientCompany(item)"></p>
              </ng-template>


            </div>
          </div>
        </div>
      </div>
      <div class="filter-item">
        <i class="icn-sm report-caret-icon"></i>
        <div class="filter-item__header" (click)="toggleFilter($event)">
          By User
        </div>
        <div class="filter-item__content">
          <div class="dark-dropdown">
            <app-select-search #usersDp [placeholder]="'Select User'"  [class]="['dark-dropdown']" [editItem]="selectedUser"
            [list]="getUserList()"
                               (onSelectedItem)="onSelectUser($event)"></app-select-search>
          </div>
          <div class="resent-block">
            <div class="resent-block__header">Recent</div>
            <div class="resent-block__content">
              <ng-template ngFor let-item [ngForOf]="usersHistory" let-i="index" [ngForTrackBy]="trackByIndex">
                <p [textContent]="item" (click)="selectUser(item)"></p>
              </ng-template>
            </div>
          </div>
        </div>
      </div>
      
      
      <div class="filter-item">
        <i class="icn-sm report-caret-icon"></i>
        <div class="filter-item__header" (click)="toggleFilter($event)">
          By Tech Team
        </div>
        <div class="filter-item__content">
          <div class="dark-dropdown">
            <app-select-search [placeholder]="'Select Tech User'" [class]="['dark-dropdown']"
            [editItem]="selectedTechUser"  [list]="getTechUserList()"
              (onSelectedItem)="onSelectTechUser($event)"></app-select-search>
          </div>
          <div class="resent-block">
            <div class="resent-block__header">Recent</div>
            <div class="resent-block__content">
              <ng-template ngFor let-item [ngForOf]="techUsersHistory" let-i="index" [ngForTrackBy]="trackByIndex">
                <p [textContent]="item" (click)="selectTechUser(item)"></p>
              </ng-template>


            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
