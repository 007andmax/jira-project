<div class="left-panel-ng2 new-tickets">
  <div class="left-panel-ng2__header d-f jc-sb ">
    <div>Filters</div>
    <div class="header-filter-icon icon__filters"></div>
  </div>
  <div class="left-panel-ng2__content">
    
    <div class="left-panel-ng2__content--lists">
      <!--<div class="list-item">Dashboard</div> -->
      <div class="list-item" (click)="setTypeFilter('ALL')">All tickets</div>
      <div class="list-item" (click)="setTypeFilter('UNASSIGNED')">Unassigned</div>
      <div class="list-item" (click)="setTypeFilter('OPEN')">Open</div>
      <div class="list-item" (click)="setTypeFilter('CLOSED')">Close</div>
      <div class="list-item" (click)="setTypeFilter('ON_HOLD')">On Hold</div>
      <div class="list-item" (click)="setTypeFilter('TRASH')">Trash</div>
      <div class="list-item" (click)="setTypeFilter('SPAM')">Spam</div>
      <div class="list-item" (click)="setTypeFilter('USERS')">Users</div>
      <div class="list-item" (click)="setTypeFilter('RECURRING_TICKETS_OPEN')">Recurring tickets Open</div>
      <div class="list-item" (click)="setTypeFilter('RECURRING_TICKETS_CLOSED')">Recurring tickets Closed</div>
    </div>
    
    <div class="left-panel-ng2__content--types">
      <div class="types-header">TICKET STATUS</div>
      
      <div class="ticket-statuses">
        <div class="ticket-status-color d-f jc-sb ai-c ">
          <div>Unassigned</div>
          <div class="ticket-status-circle --red"></div>
        </div>
        <div class="ticket-status-color d-f jc-sb ai-c">
          <div>Completed</div>
          <div class="ticket-status-circle --green"></div>
        </div>
        <div class="ticket-status-color d-f jc-sb ai-c">
          <div>In Progress</div>
          <div class="ticket-status-circle --blue"></div>
        </div>
        <div class="ticket-status-color d-f jc-sb ai-c">
          <div>On Hold</div>
          <div class="ticket-status-circle --yellow"></div>
        </div>
      </div>
      
    </div>
  
    <div class="left-panel-ng2__content--filters">
      <div class="filter-item">
        <i class="icn-sm report-caret-icon"></i>
        <div class="filter-item__header">
          By Company
