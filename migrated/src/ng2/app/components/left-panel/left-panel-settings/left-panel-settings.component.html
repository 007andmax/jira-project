<div
    class="category-name"
    (click)="open = !open"
>
    <span>Settings</span>
</div>
<div
    class="category-list-items"
    *ngIf="open"
>
    <li
        class="category-item"
        [ngClass]="{'active':activePage === 'myprofile-component'}"
    >
        <a
            href="#/ng2/setting/myprofile"
            (click)="goToState('myprofile-component')"
        >
            <span class="nav-ico">
                <img
                    src="ng1/images/setting-module/my-profile.svg"
                    alt="My Profile"
                >
            </span>
            My Profile Settings
        </a>
    </li>
    <li
        class="category-item"
        [ngClass]="{'active':activePage === 'manage-tags-component'}"
        *ngIf="currentUser && currentUser.isOwner || getPermissions('VIEW_TAGS_SETTINGS')"
    >
        <a
            href="#/ng2/setting/tags"
            (click)="goToState('manage-tags-component')"
        >
            <span class="nav-ico">
                <img
                    src="ng1/images/setting-module/manage-tags.svg"
                    alt="Tags"
                >
            </span>
            Manage Tags
        </a>
    </li>
    <li
        class="category-item"
        [ngClass]="{'active':activePage === 'glnumber-component'}"
    >
        <a
            href="#/ng2/setting/glnumber"
            (click)="goToState('glnumber-component')"
        >
            <span class="nav-ico">
                <img
                    src="ng1/images/setting-module/gl-number.svg"
                    alt="Glnumber"
                >
            </span>
            Manage GL number
        </a>
    </li>
    <li
        class="category-item"
        [ngClass]="{'active':activePage === 'company-profile-component'}"
    >
        <a
            href="#/ng2/setting/companyprofile"
            (click)="goToState('company-profile-component')"
            *ngIf="currentUser && currentUser.isOwner || getPermissions('VIEW_COMPANY_PROFILE_SETTINGS')"
        >
            <span class="nav-ico">
                <img
                    src="ng1/images/setting-module/company-profile.svg"
                    alt="Company"
                >
            </span>
            Company Profile
        </a>
    </li>
    <li
        class="category-item"
        [ngClass]="{'active':activePage === 'tech-component'}"
    >
        <a
            href="#/ng2/setting/techUsers"
            (click)="goToState('tech-component')"
        >
            <span class="nav-ico">
                <img
                    src="ng1/images/setting-module/manage-users.svg"
                    alt="Tech"
                >
            </span>
            Manage Tech Users
        </a>
    </li>
    <li
        class="category-item"
        [ngClass]="{'active':activePage === 'email-setting-component'}"
    >
        <a
            href="#/ng2/setting/emailSetting"
            (click)="goToState('email-setting-component')"
        >
            <span class="nav-ico">
                <img
                    src="ng1/images/setting-module/email-settings.svg"
                    alt="Email"
                >
            </span>
            Email Settings
        </a>
    </li>
    <li
        class="category-item"
        [ngClass]="{'active':activePage === 'taxes-component'}"
    >
        <a
            href="#/ng2/setting/taxes"
            (click)="goToState('taxes-component')"
        >
            <span class="nav-ico">
                <img
                    src="ng1/images/setting-module/taxes.svg"
                    alt="Taxes"
                >
            </span>
            Taxes
        </a>
    </li>
    <li
        class="category-item"
        [ngClass]="{'active':activePage === 'permission-manage-component'}"
        *ngIf="currentUser && currentUser.isOwner || getPermissions('VIEW_PERMISSIONS_SETTINGS')"
    >
        <a
            href="#/ng2/setting/permission"
            (click)="goToState('permission-manage-component')"
        >
            <span class="nav-ico">
                <img
                    src="ng1/images/setting-module/permission-management.svg"
                    alt="Permission"
                >
            </span>
            Permission Management
        </a>
    </li>
    <li
        class="category-item"
        [ngClass]="{'active':activePage === 'email-templete-component'}"
    >
        <a
            href="#/ng2/setting/emailTemplete"
            (click)="goToState('email-templete-component')"
        >
            <span class="nav-ico">
                <img
                    src="ng1/images/setting-module/email-templates.svg"
                    alt="Templetes"
                >
            </span>
            Email Templetes
        </a>
    </li>
    <li
        class="category-item"
        [ngClass]="{'active':activePage === 'integrations-component'}"
    >
        <a
            href="#/ng2/setting/integration"
            (click)="goToState('integrations-component')"
        >
            <span class="nav-ico">
                <img
                    src="ng1/images/setting-module/integrations.svg"
                    alt="Integrations"
                >
            </span>
            Integrations
        </a>
    </li>
    <li
        class="category-item"
        [ngClass]="{'active':activePage === 'invoice-ticket-component'}"
    >
        <a
            href="#/ng2/setting/invoiceTickets"
            (click)="goToState('invoice-ticket-component')"
        >
            <span class="nav-ico">
                <img
                    src="ng1/images/setting-module/invoice.svg"
                    alt="Commissions"
                >
            </span>
            Invoice and Ticket
        </a>
    </li>
    <li
        class="category-item"
        [ngClass]="{'active':activePage === 'commission-component'}"
    >
        <a
            href="#/ng2/setting/commission"
            (click)="goToState('commission-component')"
        >
            <span class="nav-ico">
                <img
                    src="ng1/images/setting-module/commissions.svg"
                    alt="Commissions"
                >
            </span>
            Commissions
        </a>
    </li>
    <li
        class="category-item"
        [ngClass]="{'active':activePage === 'subscription-component'}"
    >
        <a
            href="#/ng2/setting/subscription"
            (click)="goToState('subscription-component')"
        >
            <span class="nav-ico">
                <img
                    src="ng1/images/setting-module/subscription.svg"
                    alt="Subscription"
                >
            </span>
            Subscription
        </a>
    </li>
</div>
