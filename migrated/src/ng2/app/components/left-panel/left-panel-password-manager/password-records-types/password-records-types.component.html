<div class="left-panel-filter">
  <div class="inventory-lp-header">
    <div>Select by Category</div>
  </div>
  <div class="center-category__category">
    <div class="center-category__category--item"
         *ngFor="let item of passwordRecordTypes"
         (click)="filterByPasswordTypes(item)">
      <div>{{item.TITLE}}</div>
      <div *ngIf="item.TITLE !== 'Clear'">{{item.count}}</div>
    </div>
  </div>
</div>
