<div class="left-panel-filter desktop-version">
    <p>Select Company</p>
    <div class="dark-dropdown">
        <input
            type="text"
            placeholder="Company List"
            [attr.disabled]="!companiesListStatus ? 'disabled' : null"
            class="pointer test"
            (selectItem)="selectCompany($event)"
            [(ngModel)]="company"
            [inputFormatter]="formatter"
            [resultFormatter]="formatter"
            [ngbTypeahead]="search"
        >
        <span *ngIf="companiesList">
            <i
                *ngIf="!!loadStatus"
                class="icn-sm icn-remove-old pointer"
                (click)="clearCompany()"
            ></i>
            <i
                *ngIf="!loadStatus"
                class="icn-20 icn-search-light pointer"
            ></i>
        </span>
        <div
            class="loading xs"
            *ngIf="!companiesList"
        ></div>
    </div>
</div>
<div class="left-panel-filter desktop-version">
    <p>Select Device/User</p>
    <div class="dark-dropdown">
        <input
            placeholder="Device/User List"
            type="text"
            class="pointer"
            (selectItem)="selectDeviceOrUser($event)"
            [(ngModel)]="device"
            [inputFormatter]="formatterDevices"
            [resultFormatter]="formatterDevices"
            [ngbTypeahead]="searchDevices"
        >
        <i
            *ngIf="device"
            class="icn-sm icn-remove-old pointer"
            (click)="clearDevice()"
        ></i>
        <i
            *ngIf="!device"
            class="icn-20 icn-search-light pointer"
        ></i>
    </div>
</div>
<div class="left-panel-filter desktop-version">
    <p>Search By Expiry Date</p>
    <form class="form-inline">
        <div class="form-group">
            <div class="input-group date-picker">
                <input
                    class="pointer"
                    placeholder="yyyy-mm-dd"
                    name="dp"
                    [(ngModel)]="selectedDate"
                    (ngModelChange)="selectDate($event)"
                    ngbDatepicker
                    #dd="ngbDatepicker"
                    (click)="dd.toggle();"
                >
                <i
                    *ngIf="selectedDate"
                    class="icn-sm icn-remove-old pointer"
                    (click)="clearDate($event)"
                ></i>
                <i
                    *ngIf="!selectedDate"
                    class="icn-16 icn-calendar-light pointer"
                ></i>
            </div>
        </div>
    </form>
</div>



<div class="left-panel-filter mob-version">
    <p>Select Company</p>
    <div class="dark-dropdown">
        <input
            type="text"
            placeholder="Company List"
            [attr.disabled]="!companiesList ? 'disabled' : null"
            class="pointer"
            (selectItem)="selectCompanyMob($event)"
            [(ngModel)]="company"
            [inputFormatter]="formatter"
            [resultFormatter]="formatter"
            [ngbTypeahead]="search"
        >
        <i
            *ngIf="company && companiesList"
            class="icn-sm icn-remove-old pointer"
            (click)="clearCompanyMob()"
        ></i>
        <i
            *ngIf="!company && companiesList"
            class="icn-20 icn-search-light pointer"
        ></i>
        <div
            class="loading"
            *ngIf="!companiesList"
        ></div>
    </div>
</div>
