<div class="left-panel-full-wrapper nano password">
  <div class="left-panel-full__head">

    <div class="icon-pos go-back-left-panel" ng-click="toggleLeftPanel(openedCategory)"
         ng-show="showLeftArrowToggleLeftPanel()">
      <i class="icn-sm icn-back-arrow"></i>
    </div>
    <span class="left-panel-full__head--header">Password</span>
  </div>
  <div class="center-category collapsed-nav nano-content">
    <div class="left-panel-filter" style="position: relative">
      <label for="typeahead-basic">Search for a state:</label>
      <p>{{!(this.companiesList)}}</p>
      <input id="typeahead-basic"
             type="text"
             [attr.disabled]="!this.companiesList ? 'disabled' : null"
             class="form-control"
             (selectItem)="selectedItem($event)"
             [(ngModel)]="model"
             [inputFormatter]="formatter"
             [resultFormatter]="formatter"
             [ngbTypeahead]="search"/>
      <hr>
      <pre>Model: {{ model }}</pre>
    </div>
    <div class="left-panel-filter">
      <label>
        <p>Select Device</p>
        <input class="pointer" type="text" placeholder="Device List">
        <i class="icn-16 light-grey-caret"></i>
      </label>
    </div>
    <div class="left-panel-filter">
      <label>
        <p>Search By Expiry Date</p>
        <input class="pointer" type="text" placeholder="Expiry Date">
        <i class="icn-16 date-calendar"></i>
      </label>
    </div>
    <div class="left-panel-filter">
      <label>
        <p>Search By User</p>
        <input type="text" placeholder="Search...">
        <i class="icn-20 search-new"></i>
      </label>
    </div>
    <div class="left-panel-filter">
      <div class="inventory-lp-header">
        <div>Select by Category</div>
      </div>
      <div class="center-category__category">
        <div class="center-category__category--item">
          <div>Agents</div>
          <div>2</div>
        </div>
      </div>
    </div>
  </div>
</div>
