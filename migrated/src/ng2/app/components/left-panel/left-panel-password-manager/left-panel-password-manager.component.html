<div class="left-panel-full-wrapper nano password">
  <div class="left-panel-full__head">

    <div class="icon-pos go-back-left-panel" ng-click="toggleLeftPanel(openedCategory)"
         ng-show="showLeftArrowToggleLeftPanel()">
      <i class="icn-sm icn-back-arrow"></i>
    </div>
    <span class="left-panel-full__head--header">Password</span>
  </div>
  <div class="center-category collapsed-nav nano-content">
    <div class="left-panel-filter">
      <p>Select Company</p>
      <div class="dark-dropdown">
        <input id="typeahead-basic"
               type="text"
               placeholder="Company List"
               [attr.disabled]="!companiesList ? 'disabled' : null"
               class="pointer"
               (selectItem)="selectCompany($event)"
               [(ngModel)]="company"
               [inputFormatter]="formatter"
               [resultFormatter]="formatter"
               [ngbTypeahead]="search" />
        <i *ngIf="company && companiesList"
           class="icn-sm icn-remove-old pointer"
           (click)="clearCompany()"></i>
        <i *ngIf="!company && companiesList"
           class="icn-20 icn-search-light pointer"></i>
        <div class="loading" *ngIf="!companiesList"></div>
      </div>
    </div>
    <div class="left-panel-filter">
      <p>Select Device/User</p>
      <div class="dark-dropdown">
        <input id="typeahead-basic1"
               placeholder="Device/User List"
               type="text"
               class="pointer"
               (selectItem)="selectDeviceOrUser($event)"
               [(ngModel)]="device"
               [inputFormatter]="formatterDevices"
               [resultFormatter]="formatterDevices"
               [ngbTypeahead]="searchDevices" />
        <i *ngIf="device"
           class="icn-sm icn-remove-old pointer"
           (click)="clearDevice()"></i>
        <i *ngIf="!device"
           class="icn-20 icn-search-light pointer"></i>
      </div>
    </div>
    <div class="left-panel-filter">
      <p>Search By Expiry Date</p>
      <form class="form-inline">
        <div class="form-group">
          <div class="input-group date-picker">
            <input class="pointer"
                   placeholder="yyyy-mm-dd"
                   name="dp"
                   [(ngModel)]="selectedDate"
                   (ngModelChange)="selectDate($event)"
                   ngbDatepicker #d="ngbDatepicker"
                   (click)="d.toggle();">
            <i *ngIf="selectedDate"
               class="icn-sm icn-remove-old pointer"
               (click)="clearDate($event)"></i>
            <i *ngIf="!selectedDate"
               class="icn-16 icn-calendar-light pointer"></i>
          </div>
        </div>
      </form>
    </div>

    <app-password-records-types
      [passwordRecords]="passwordRecords"
    ></app-password-records-types>
  </div>
</div>
