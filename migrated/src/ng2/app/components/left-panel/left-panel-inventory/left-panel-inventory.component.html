<div class="left-panel-full-wrapper nano inventory" ng-show="openedCategory === 'inventory' && !isLeftPanelHidden">
  <div class="left-panel-full__head">
    <div class="icon-pos go-back-left-panel" ng-click="toggleLeftPanel(openedCategory)"
         ng-show="showLeftArrowToggleLeftPanel()">
      <i class="icn-sm icn-back-arrow"></i>
    </div>
    <span class="left-panel-full__head--header">Inventory</span>
  </div>
  <div class="center-category collapsed-nav nano-content">
    <div class="inventory-lp-header">
      <div>Category List</div>
      <div class="add-category-lp" ngbDropdown>
        <div   class="new-link"id="dropdownManual" ngbDropdownToggle (click)="resetAddCategory()">+Add
        </div>
        <div class="add-category-lp-dropdown" ngbDropdownMenu aria-labelledby="dropdownManual" style="z-index: 100000000;">
         <app-add-category-product #addCategory [inventoryCategoryList]="inventoryCategoryList"></app-add-category-product>
        </div>
      </div>
    </div>
    
    <div class="container-inventory-category">
      <div class="center-category__category" ng-class="{active: !sortCategoty}"
        ng-click="stateGo($event, 'products', {category: ''})">
        <div class="center-category__category--item">
          <div class="center-category__category--item__category-label" (click)="selectCategory(null)">ALL PRODUCTS</div>
          <div>{{getAllProductsCount()}}</div>
        </div>
      </div>
      <ng-template ngFor let-category [ngForOf]="inventoryCategoryList" [ngForTrackBy]="trackById" let-i="index">
      <div class="center-category__category" [ngClass]="{active: (sortCategoty) ?  category.name === sortCategoty.name : false}" *ngIf="i < countOfCategories">
        <div *ngIf="category.productsAmount >0 || category.name === 'Uncategorized'"
          class="center-category__category--item" (click)="selectCategory(category)">
          <div>{{category.name}}</div>
          <div>{{category.productsAmount}}</div>
        </div>
        <div *ngIf="category.productsAmount === 0 && category.name !== 'Uncategorized'"
          class="center-category__category--item">
          <div (click)="selectCategory(category)">
            {{category.name}}
          </div>
          <div>
            <i class="icon-sm new-icn-delete-white pointer has-tooltip" (click)="deleteCategory(category)"
              tooltip-placement="top" tooltip-append-to-body="true" uib-tooltip="Delete"></i>
          </div>
        </div>
      </div>
    </ng-template>
    </div>

    <div class="new-link" style="padding: 0 24px!important;" *ngIf="inventoryCategoryList.length > 10"
      (click)="changeShowAllCategories()">Show All
    </div>
  </div>
</div>
