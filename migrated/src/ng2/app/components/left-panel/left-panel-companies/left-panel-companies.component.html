<div
    class="app-left-panel__menu"
    [ngClass]="{'--active': open}"
    (click)="open = !open;openPanel()"
>
    <div class="app-left-panel__menu-icon --companies"></div>
    <div class="app-left-panel__menu-title">Companies</div>
    <div class="app-left-panel__menu-arrow"></div>
</div>
<ul
    class="app-left-panel__menu-expand top-menu"
    [ngClass]="{'menu-expand-show': open, 'menu-expand-hide': !open}"
>
    <li
        [ngClass]="{'--active':activePage === 'new-companies' && !showArchivedCompanies}"
        (click)="goToState('new-companies');onShowAll()"
    >
        All Companies
    </li>
    <li
        [ngClass]="{'--active':activePage === 'new-companies' && filter.getClientType() === 'CLIENT'}"
        (click)="goToState('new-companies');onSetFilterClientType('CLIENT')"
        [textContent]="(activePage === 'new-companies') ? 'Clients ('+calculateCount.getClients() +')' : 'Clients'"
    >
    </li>
    <li
        [ngClass]="{'--active':activePage === 'new-companies' && filter.getClientType() === 'LEAD'}"
        (click)="goToState('new-companies');onSetFilterClientType('LEAD')"
        [textContent]="(activePage === 'new-companies') ? 'Leads ('+calculateCount.getLeads() +')' : 'Leads'"
    >
    </li>
    <li
        [ngClass]="{'--active':activePage === 'new-companies' && filter.getClientType() === 'VENDOR'}"
        (click)="goToState('new-companies');onSetFilterClientType('VENDOR')"
        [textContent]="(activePage === 'new-companies') ? 'Vendor ('+calculateCount.getVndors() +')' : 'Vendor'"
    >
    </li>
    <li
        [ngClass]="{'--active':activePage === 'new-companies' && showArchivedCompanies}"
        (click)="goToState('new-companies');onShowArchived()"
    >
        Archive
    </li>
</ul>
<app-left-panel-company
    [selectedCompany]="selectedCompany"
    (onChangeState)="goToState($event)"
    [activePage]="activePage"
    *ngIf="open && selectedCompany"
></app-left-panel-company>
