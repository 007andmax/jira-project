<div class="app-left-panel__menu" [ngClass]="{'--active': open}" (click)="open = !open">
  <div class="app-left-panel__menu-icon --companies"></div>
  <div class="app-left-panel__menu-title">Companies</div>
  <div class="app-left-panel__menu-arrow"></div>
</div>

<ul class="app-left-panel__menu-expand" *ngIf="open">
    <li [ngClass]="{'--active':activePage === 'new-companies' && !showArchivedCompanies}" (click)="goToState();onShowAll()">
      All Companies
    </li>
    <li [ngClass]="{'--active':activePage === 'new-companies' && showArchivedCompanies}" (click)="goToState();onShowArchived()">
      Archive
    </li>
</ul>
