<div class="left-panel-ng2 new-companies">
  <div class="left-panel-ng2__header mob-hidden">Companies</div>
  <div class="left-panel-ng2__content">
    <div class="mob-filters-header desktop-hidden">
      <button class="x-mark mobile-btn"></button>
      <div>Filters</div>
    </div>

    <div class="left-panel-ng2__content--lists mob-hidden">
      <div class="list-item" [ngClass]="{'active': !showArchivedCompanies}" (click)="onShowAll()">All Companies</div>
      <div class="list-item" [ngClass]="{'active': showArchivedCompanies}" (click)="onShowArchived()">Archive</div>
    </div>
    <div class="left-panel-ng2__content--types mob-hidden">
      <div class="types-header">By Types</div>
      <div class="types-item" [ngClass]="{'active': filter.getClientType() === 'CLIENT'}"
           (click)="onSetFilterClientType('CLIENT')">Clients ({{calculateCount.getClients()}})
      </div>
      <div class="types-item" [ngClass]="{'active': filter.getClientType() === 'LEAD'}"
           (click)="onSetFilterClientType('LEAD')">Leads ({{calculateCount.getLeads()}})
      </div>
      <div class="types-item" [ngClass]="{'active': filter.getClientType() === 'VENDOR'}"
           (click)="onSetFilterClientType('VENDOR')">Vendor ({{calculateCount.getVndors()}})
      </div>
    </div>
    <div class="left-panel-ng2__content--tags clearfix">
      <div class="tags-header">
        By tags
      </div>
      <app-company-tags [blockCreateTag]="true" (tagsChange)="onChangeTags($event)"></app-company-tags>
    </div>
    <div class="left-panel-ng2__content--filters">
      <!--      for show "filter-item__content" click on "filter-item__header" and add class "show-filter" for "filter-item"-->
      <div class="filter-item">
        <i class="icn-sm report-caret-icon"></i>
        <div class="filter-item__header">
          By sales person
        </div>
        <div class="filter-item__content">
          <div class="dark-dropdown"
               ngbDropdown>
            <input id="dropdownPersons"
                   [value]="getSelectedTechLead()"
                   placeholder="Select Sales Person"
                   ngbDropdownToggle>
            <i class="icn-sm icn-remove-old" (click)="clearSalesPerson()" tooltip="clear"
               tooltip-placement="top"></i>
            <i class="icn-sm report-caret-icon"></i>
            <div ngbDropdownMenu aria-labelledby="dropdownPersons">
              <ng-template ngFor let-item [ngForOf]="listPersons" let-i="index">
                <button ngbDropdownItem [textContent]="item.firstName + ' ' + item.lastName"
                        (click)="onSelectTechLead(i)"></button>
              </ng-template>
            </div>
          </div>
          <div class="resent-block">
            <div class="resent-block__header">Recent</div>
            <div class="resent-block__content">
              <ng-template ngFor let-item [ngForOf]="salesHistory" let-i="index" [ngForTrackBy]="trackByIndex">
                <p [textContent]="item" (click)="selectTechLead(item)"></p>
              </ng-template>
            </div>
          </div>
        </div>
      </div>
      <!--      for show "filter-item__content" click on "filter-item__header" and add class "show-filter" for "filter-item"-->
      <div class="filter-item">
        <i class="icn-sm report-caret-icon"></i>
        <div class="filter-item__header">
          By industry
        </div>
        <div class="filter-item__content">
          <div class="dark-dropdown"
               ngbDropdown>
            <input id="dropdownClientIndustry"
                   placeholder="Select Industry"
                   [value]="clientIndustry"
                   ngbDropdownToggle>
            <i class="icn-sm icn-remove-old" (click)="clearClientIndustry()" tooltip="clear"
               tooltip-placement="top"></i>
            <i class="icn-sm report-caret-icon"></i>
            <div ngbDropdownMenu aria-labelledby="dropdownClientIndustry">
              <ng-template ngFor let-item [ngForOf]="industries">
                <button ngbDropdownItem [textContent]="item" (click)="onSelectClientIndustry(item)"></button>
              </ng-template>
            </div>
          </div>
          <div class="resent-block">
            <div class="resent-block__header">Recent</div>
            <div class="resent-block__content">
              <ng-template ngFor let-item [ngForOf]="industryHistory" let-i="index" [ngForTrackBy]="trackByIndex">
                <p [textContent]="item" (click)="selectClientIndustry(item)"></p>
              </ng-template>


            </div>
          </div>
        </div>
      </div>
    </div>

    <button class="mob-filters-btn apply-filters mobile-btn primary">
      Apply Filters
    </button>

  </div>
</div>
