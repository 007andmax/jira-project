<div class="qt-fs-15 qt-mb-16 qt-lh-133 qt-ff-sb qt-color-dark">Edit Device Name</div>
<div class="qt-input-block qt-mb-24">
    <label>User name</label>
    <input
        class="company-device-edit-name__input"
        placeholder="Enter a new device name here"
        type="text"
        [(ngModel)]="networkScanCredentialsAdd.username"
    >
</div>
<div class="qt-input-block qt-mb-24">
    <label>Password</label>
    <input
        class="company-device-edit-name__input"
        placeholder="Enter a new device name here"
        type="text"
        [(ngModel)]="networkScanCredentialsAdd.password"
    >
</div>
<div class="qt-df">
    <button
        class="company-device-edit-name__button qt-button qt-mr-12"
        (click)="add()"
        ngbDropdownItem
    >
        Save Changes
    </button>
    <button
        class="company-device-edit-name__button qt-button --gray"
        (click)="close()"
        ngbDropdownItem
    >
        Cancel
    </button>
</div>
