<div class="network-scan-page__empty-content">
    <div class="network-scan-page__empty-content-icon icon__no-devices-installed"></div>
    <div class="network-scan-page__empty-content-title qt-ff-sb">No Devices added Yet!</div>
    <div class="network-scan-page__empty-content-subtitle">
        It seems No devices added for this company,
        <br>
        try to search for other results.
    </div>
    <button
        class="network-scan-page__empty-content-download-button qt-button qt-mb-15"
        (click)="downloadAgent()"
    >
        Download Agent Installer
    </button>
    <div class="network-scan-page__empty-content-or-divider qt-ff-sb">or</div>
    <div
        class="qt-button --small --outline"
        (click)="copyInstallerLink()"
    >
        <div class="icon__link qt-sz-16 qt-mr-5"></div>
        Copy Installer link to clipboard
    </div>
</div>
