<ng-template
    #tipConnected
    class="tooltip"
>
    <span>{{device.message}}</span>
    <span [innerHTML]="device.message"></span>
</ng-template>
<span
    [disableTooltip]="device.agentStatus === 'managed'"
    [hidden]="device.agentStatus === 'unknown'"
    container="body"
    placement="top"
    [ngbTooltip]="tipConnected"
    [ngClass]="getClass()"
    (shown)="shownTooltip()"
    [textContent]="getStatusText()"
>
</span>
