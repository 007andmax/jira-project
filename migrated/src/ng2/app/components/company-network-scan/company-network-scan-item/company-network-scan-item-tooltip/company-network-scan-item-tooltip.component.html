<ng-template
    #tipConnected
    class="tooltip"
>
    <span [textContent]="device.message"></span>
</ng-template>
<!-- [disableTooltip]="device.agentStatus === 'managed'" -->
<span
    [hidden]="device.agentStatus === 'unknown'"
    placement="top"
    [ngbTooltip]="tipConnected"
    triggers="click"
    [autoClose]="'outside'"
    [ngClass]="getClass()"
    (shown)="shownTooltip()"
    [textContent]="getStatusText()"
>
</span>
