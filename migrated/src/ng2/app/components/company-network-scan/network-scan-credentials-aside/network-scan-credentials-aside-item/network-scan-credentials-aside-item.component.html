<div class="credential-block">
    <div class="qt-df qt-fd-c qt-w100">
        <input
            class="credential-block__username qt-ff-sb qt-w100"
            type="text"
            [(ngModel)]="item.username"
        >
        <input
            class="credential-block__pass qt-ff-sb qt-w100"
            type="text"
            value="*****"
            [(ngModel)]="item.password"
            (focus)="showPassword()"
        >
    </div>
    <div class="qt-df ">
        <div class="credential-block__icon-btn icon__play"></div>
        <div
            class="credential-block__icon-btn icon__remove"
            (click)="remove()"
        ></div>
    </div>
</div>
