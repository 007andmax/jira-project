<div
    class="network-scan-page__aside"
    *ngIf="open"
>
    <div class="aside-header qt-df qt-ai-c qt-jc-sb qt-pr-16 qt-pl-32">
        <div class="qt-fs-20 qt-ff-gm qt-color-dark">Select Credential</div>

        <div
            class="qt-df qt-ai-c"
            (click)="close()"
        >
            <div class="icon__close qt-sz-24 qt-pointer"></div>
        </div>
    </div>
    <div
        class="contracts-page-scroll-content"
        ngbDropdown
        [placement]="'bottom-right'"
    >
        <div class="qt-pr-24 qt-pl-24 qt-pb-12 qt-pt-12">
            <div class="qt-df qt-jc-sb qt-ai-c qt-mb-12">
                <div class="qt-ff-gm qt-fs-13 qt-color-dark-light">
                    Apply Credential to selected devices from list below
                </div>
                <button
                    class="qt-button --small --outline"
                    ngbDropdownToggle
                >
                    + Add new
                </button>
                <app-network-scan-credentials-add
                    ngbDropdownMenu
                    [companyId]="companyId"
                ></app-network-scan-credentials-add>
            </div>
            <ng-template
                ngFor
                let-item
                [ngForOf]="list"
                [ngForTrackBy]="trackById"
            >
                <app-network-scan-credentials-aside-item [item]="item"></app-network-scan-credentials-aside-item>
            </ng-template>
        </div>
    </div>
</div>
