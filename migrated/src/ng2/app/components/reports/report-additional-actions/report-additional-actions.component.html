<div class="product-list-report-btn product-list-report-btn-ticket clearfix">
  <div class="product-report-btn" ngbDropdown keyboard-nav="true" uib-tooltip="export" tooltip-placement="top">
    <div uib-dropdown-toggle style="height: 100%;width: 100%;" ngbDropdownToggle>
      <img src="../../../../../ng1/images/new-icons/export-icon.png" alt="export">
    </div>
    <ul ngbDropdownMenu aria-labelledby="dropdown1">
      <ng-template ngFor let-item [ngForOf]="listExport" let-i="index">
        <li class="open-pdf-btn " ngbDropdownItem [textContent]="item" (click)="onSelectExport(item)"></li>
      </ng-template>
    </ul>

  </div>
  <div class="product-report-btn" uib-tooltip="print" tooltip-placement="top"
    (click)="getPdfIdFromRest(ACION_OPEN_PDF)">
    <img src="../../../../../ng1/images/new-icons/printer-icon.png" alt="print">
  </div>
  <div class="product-report-btn dropdown-email" uib-tooltip="send mail" tooltip-placement="top" (click)="sendEmail()">
    <div style="height: 100%;width: 100%;">
      <img src="ng1/images/new-icons/message-icon.png" alt="send mail to">
    </div>
  </div>
</div>
