<!--MENU FOR NON-TECH REPORTS-->
<div>
  <div>
    <div class="run-report-content clearfix" [ngClass]="className">
      <div class="new-reports-reverse">
        <button class="form-group btn btn-success" (click)="getReportByGlNumber()">Get
          Report
        </button>

        <div class="form-group content custom-width dropdown-height">
          <app-select-client-company [blockEditMode]="true" [valid]="validate.getCompany()" style="width: 75%;"
            class="light-dropdown" [filter]="true" (selectedItem)="selectClient($event)"></app-select-client-company>
        </div>
        <div class="form-group content">
        
            <app-multi-datepicker #dp (selectedDate)="filterByDate($event)"></app-multi-datepicker>
         
        </div>
        <div class="form-group content">
          <div class="input-field">
            <app-select [placeholder]="'Select filter'" [list]="listDetailed" (onChange)="onSelectDetailed($event)"></app-select>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="new-reports-btn">
    <button class="form-group btn btn-success" (click)="getReportByGlNumber()">Get
      Report
    </button>
  </div>
</div>
