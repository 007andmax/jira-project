<!--MENU FOR NON-TECH REPORTS-->
<div class="report-menu">
  <div *ngIf="report === 'income-accounts'">
    <div class="run-report-content clearfix" [ngClass]="className">
      <div class="new-reports-reverse">
        <button class="form-group btn btn-success" (click)="getReportByGlNumber()">Get
          Report
        </button>

        <div class="form-group content custom-width dropdown-height">
          <app-select-client-company [blockEditMode]="true" style="width: 75%;" class="light-dropdown" [filter]="true"
            (selectedItem)="selectClient($event)"></app-select-client-company>
        </div>
        <div class="form-group content">
          <app-multi-datepicker #dp (selectedDate)="filterByDate($event)"></app-multi-datepicker>
          <mat-error *ngIf="!validate.getDates() && validate.geMonthlyDetailed()">
            Please select the dates
          </mat-error>

        </div>
        <div class="form-group content">
          <div class="input-field">
            <app-select [placeholder]="'Select filter'" [list]="listDetailed" (onChange)="onSelectDetailed($event)">
            </app-select>
          </div>

          <mat-error *ngIf="!validate.getDates() && !validate.geMonthlyDetailed()">
            Please select any dates or intervals
          </mat-error>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="report === 'byTaxes'">
    <div class="run-report-content clearfix" [ngClass]="className">
      <div class="new-reports-reverse">
        <button class="form-group btn btn-success" (click)="getReportByTaxes()">Get
          Report
        </button>
        <div class="grey-dropdown form-group content dropdown-button" ngbDropdown>
          <button class="types-btn" id="dropdownBasic" ngbDropdownToggle [textContent]="taxes.type">

          </button>
          <i class="icn-sm report-caret-icon"></i>
          <div ngbDropdownMenu aria-labelledby="dropdownBasic">
            <ng-template ngFor let-item [ngForOf]="listTypes">
              <button ngbDropdownItem [textContent]="item" (click)="onSelectTypeTaxes(item)"></button>
            </ng-template>

          </div>
        </div>
        <!--   <div class="form-group content">
          <div class="input-field">
            <app-select [placeholder]="'Select filter'" [list]="listTypes" (onChange)="onSelectTypeTaxes($event)"></app-select>
          </div>
  
          
        </div>-->

        <div class="form-group content">
          <app-multi-datepicker #dp (selectedDate)="filterByDate($event)"></app-multi-datepicker>
          <mat-error *ngIf="!validate.getDates()">
            Please select the dates
          </mat-error>

        </div>

      </div>
    </div>
  </div>
  <div *ngIf="report === 'accounts-receivable'">
    <div class="run-report-content clearfix" [ngClass]="className">
      <div class="new-reports-reverse">
        <button class="form-group btn btn-success" (click)="getReportByAccountsReceivable()">Get
          Report
        </button>

        <div class="form-group content custom-width dropdown-height">
          <app-select-client-company [blockEditMode]="true" style="width: 75%;" class="light-dropdown" [filter]="true"
            (selectedItem)="selectClient($event)"></app-select-client-company>
        </div>


      </div>
    </div>
  </div>

  <div *ngIf="report === 'byProducts'">
    <div class="run-report-content clearfix" [ngClass]="className">
      <div class="new-reports-reverse">
        <button class="form-group btn btn-success" (click)="getReportByProducts()">Get
          Report
        </button>
        <div class="grey-dropdown form-group content dropdown-button" ngbDropdown>
          <button class="types-btn" id="dropdownBasic" ngbDropdownToggle [textContent]="productSalesReport.type">

          </button>
          <i class="icn-sm report-caret-icon"></i>
          <div ngbDropdownMenu aria-labelledby="dropdownBasic">
            <ng-template ngFor let-item [ngForOf]="listTypes">
              <button ngbDropdownItem [textContent]="item" (click)="onSelectTypeProduct(item)"></button>
            </ng-template>
          </div>
        </div>
    
        <div class="form-group content">
          <app-multi-datepicker #dp (selectedDate)="filterByDate($event)"></app-multi-datepicker>
          <mat-error *ngIf="!validate.getDates()">
            Please select the dates
          </mat-error>

        </div>

      

        <div class="form-group content custom-width dropdown-height">
          <app-select-client-company [isDisabled]="isDisabledCompany" [blockEditMode]="true" style="width: 75%;" class="light-dropdown" [filter]="true"
            (selectedItem)="selectClient($event)"></app-select-client-company>
            <mat-error *ngIf="!validate.getCompany()">
              Please select the company name
            </mat-error>
        </div>
        <div class="form-group content custom-width">
          <app-product-list  [editItem]="product" [itemList]="productList"
            (selectedProductItem)="selectProduct($event,i)"></app-product-list>
        </div>

      </div>
    </div>
  </div>

  <div *ngIf="report === 'byCustomers'">
    <div class="run-report-content clearfix" [ngClass]="className">
      <div class="new-reports-reverse">
        <button class="form-group btn btn-success" (click)="getReportByCustomers()">Get
          Report
        </button>
        <div class="grey-dropdown form-group content dropdown-button" ngbDropdown>
          <button class="types-btn" id="dropdownBasic" ngbDropdownToggle [textContent]="customerSalesReport.type">

          </button>
          <i class="icn-sm report-caret-icon"></i>
          <div ngbDropdownMenu aria-labelledby="dropdownBasic">
            <ng-template ngFor let-item [ngForOf]="listTypes">
              <button ngbDropdownItem [textContent]="item" (click)="onSelectTypeCustomers(item)"></button>
            </ng-template>

          </div>
        </div>
    
        <div class="form-group content">
          <app-multi-datepicker #dp (selectedDate)="filterByDate($event)"></app-multi-datepicker>
          <mat-error *ngIf="!validate.getDates()">
            Please select the dates
          </mat-error>

        </div>

      

        <div class="form-group content custom-width dropdown-height">
          <app-select-client-company [isDisabled]="isDisabledCompany" [blockEditMode]="true" style="width: 75%;" class="light-dropdown" [filter]="true"
            (selectedItem)="selectClient($event)"></app-select-client-company>
            <mat-error *ngIf="!validate.getCompany()">
              Please select the company name
            </mat-error>
        </div>
        

      </div>
    </div>
  </div>



  <div *ngIf="report === 'ticket-report'">
    <div class="run-report-content clearfix" [ngClass]="className">
      <div class="new-reports-reverse">
        <button class="form-group btn btn-success" (click)="getReportByTickets()">Get
          Report
        </button>
        <div class="grey-dropdown form-group content select-users-list" >
          <app-tech-users-list-report (onChange)="onSelectTechUser($event)"></app-tech-users-list-report>
        </div>
    
        <div class="form-group content">
          <app-multi-datepicker #dp (selectedDate)="filterByDate($event)"></app-multi-datepicker>
          
        </div>


        <div class="form-group content custom-width dropdown-height">
          <app-select-client-company [isDisabled]="isDisabledCompany" [blockEditMode]="true" style="width: 75%;" class="light-dropdown" [filter]="true"
            (selectedItem)="selectClient($event)"></app-select-client-company>
            <mat-error *ngIf="!validate.getCompany()">
              Please select the company name
            </mat-error>
        </div>
        

      </div>
      <div   class="col-md-11">
        <div class="include-ticket-report">
          <p>What to include</p>
          <label class="control checkbox">
            <input type="checkbox" (change)="toggleShowDashboard($event)" checked />
            <span class="control-indicator"></span>
            Show dashboard
          </label>
          <label class="control checkbox">
            <input type="checkbox"  (change)="toggleShowResponseTime($event)" checked />
            <span class="control-indicator"></span>
            Average response time
          </label>
         
          <label class="control checkbox">
            <input type="checkbox" (change)="toggleShowServices($event)" checked  />
            <span class="control-indicator"></span>
            Show services
          </label>
          <label class="control checkbox">
            <input type="checkbox" (change)="toggleShowProducts($event)" checked />
            <span class="control-indicator"></span>
            Show products
          </label>
        </div>
      </div>
    </div>
   
  </div>


  <div *ngIf="report === 'service-report'">
    <div class="run-report-content clearfix" [ngClass]="className">
      <div class="new-reports-reverse">
        <button class="form-group btn btn-success" (click)="getReportByService()">Get
          Report
        </button>
        
    
        <div class="form-group content">
          <app-multi-datepicker #dp (selectedDate)="filterByDate($event)"></app-multi-datepicker>
          
        </div>


        <div class="form-group content custom-width dropdown-height">
          <app-select-client-company [isDisabled]="isDisabledCompany" [blockEditMode]="true" style="width: 75%;" class="light-dropdown" [filter]="true"
            (selectedItem)="selectClient($event)"></app-select-client-company>
            <mat-error *ngIf="!validate.getCompany()">
              Please select the company name
            </mat-error>
        </div>
        

      </div>
      <div   class="col-md-11">
        <div class="include-ticket-report">
          <p>What to include</p>
          <label class="control checkbox">
            <input type="checkbox" (change)="toggleShowDashboard($event)" checked />
            <span class="control-indicator"></span>
            Show dashboard
          </label>
         
        </div>
      </div>
    </div>
   
  </div>

</div>
