<div>
  <app-report-menu [report]="'tech-service'" (onRequest)="onRequest($event)" (getReport)="getReport($event)"></app-report-menu>
 </div>
 <app-report-additional-actions [report]="'tech-service'"  [template]="'CUSTOMER_REPORT'" ></app-report-additional-actions> <!--[fileName]="'customer-report-' + getSelectedClientName()"-->
 <div class="loading" *ngIf="loadingInProgress"></div>
 <div class="product-list___ticket report-show-footer-header"  id="product-list-ticket-data" >
  <div  class="product-list-ticket"   *ngIf="!loadingInProgress">
    <div class="customer-ticket" *ngIf="onInit" >
      <div class="customer-ticket__report">
        <div class="report-header">
          <h1>Tech Service report</h1>
        </div>
        <div *ngIf="showHeader" class="customer-ticket__report--summary"  >
          <h3>Tech Service report
          </h3>
        </div>
        <div class="customer-ticket__report--details" >
          <h3 [textContent]="'Tech User Name ' + ((techUser) ? techUser.firstName + ' ' + techUser.lastName : '')"></h3>
          <div class="details-header clearfix">
            <div class="col-md-8" style="width: 20%;">Date</div>
            <div class="col-md-2" style="width: 20%;">Ticket</div>
            <div class="col-md-2" style="width: 20%;">Company</div>
            <div class="col-md-2" style="width: 20%;">Service</div>
            <div class="col-md-2" style="width: 20%;">Time</div>
          </div>
          <ng-template ngFor let-item [ngForOf]="techService.lines" let-i="index" [ngForTrackBy]="trackByIndex" >
          
          <div class="details-content clearfix"  >
            <div class="col-md-2" style="width: 20%;margin-bottom: 20px;" [textContent]="getDate(item.serviceExpenseDate)"></div>
            <div class="col-md-2" style="width: 20%;margin-bottom: 20px;" [textContent]="'txt# ' + item.ticketNumber"></div>
            <div class="col-md-2" style="width: 20%;margin-bottom: 20px;" [textContent]="item.companyName"></div>
            <div class="col-md-2" style="width: 20%;margin-bottom: 20px;" [textContent]="item.serviceName"></div>
            <div class="col-md-2" style="width: 20%;margin-bottom: 20px;" [textContent]="getDuration(item.quantity)"></div>
            </div>
</ng-template>
        </div>
      </div>
    </div>
    
   
  <app-report-footer *ngIf="onInit"></app-report-footer>
   </div>
 </div>
