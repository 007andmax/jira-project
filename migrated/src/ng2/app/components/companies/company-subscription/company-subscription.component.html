  <div class="grey-dropdown" ngbDropdown container="body">
    <i class="icn-sm report-caret-icon"></i>
    <div class="user-subscription"
         id="dropdownServices"
         ngbDropdownToggle>
         <ng-template ngFor let-item [ngForOf]="subscriptions" let-i="index"  >
            <div *ngIf="item.selected" [textContent]="item.title">
                 <!--(click)="remove(i)"-->
            </div>
          </ng-template>
    </div>
    <ul class="qt-dropdown-menu" ngbDropdownMenu
         aria-labelledby="dropdownServices">
         <ng-template ngFor let-tag [ngForOf]="subscriptions" let-i="index" [ngForTrackBy]="trackById">
            <li ngbDropdownItem
                    (click)="selected(i)"
                    [textContent]="tag.title">
            </li>
          </ng-template>

    </ul>
  </div>
