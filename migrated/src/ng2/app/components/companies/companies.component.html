<!--for show filters add class "show" for app-left-panel-->
<app-left-panel-companies class="" (onFilterTags)="onFilterTags($event)"></app-left-panel-companies>

<div class="new-companies-content">
  <app-companies-header></app-companies-header>
  <div class="new-companies__list">
    <div class="new-companies__list--header clearfix mob-hidden">
      <div class="col-md-3 with-checkbox" >
        <label class="checkbox-container">
          <input type="checkbox">
          <span class="checkbox-mark"></span>
        </label>
        <p (click)="onFilter('name')">Name</p>
      </div>
      <div class="col-md-3" (click)="onFilter('address')">Address</div>
      <div class="col-md-4" (click)="onFilter('primary_contact')">Primary Contact</div>
      <div class="col-md-4" (click)="onFilter('email')">Email Address</div>
      <div class="col-md-1" (click)="onFilter('tickets')">Tickets</div>
      <div class="col-md-1" (click)="onFilter('devices')">Devices</div>
      <div class="col-md-1" (click)="onFilter('users')">Users</div>
      <div class="col-md-2"></div>
    </div>
    <div class="company-content"
    infiniteScroll
    [infiniteScrollDistance]="2"
    [infiniteScrollThrottle]="50"
    [infiniteScrollDisabled]="infiniteScrollDisabled"
    (scrolled)="onScroll()">
        <ng-template ngFor let-company
                   [ngForOf]="CompaniesList"
                   [ngForTrackBy]="trackById">
      <app-companies-table [company]="company"  ></app-companies-table>
      </ng-template>
      <div class="loading" *ngIf="showPreloader"></div>
    </div>
    <button class="mob-filters-btn mobile-btn primary">
      Filters
    </button>
    <div class="loading" style="display: none;"></div>
  </div>
</div>
<app-company-add-aside></app-company-add-aside>
<app-company-edit-aside></app-company-edit-aside>
<app-draft-email></app-draft-email>
