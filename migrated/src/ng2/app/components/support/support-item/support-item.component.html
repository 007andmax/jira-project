<div class="support-tickets-list__item">
    <div class="support-tickets-list__item-top">
        <div
            class="support-tickets-list__title"
            [textContent]="'Remote Session - ' + getUserName()"
        ></div>
        <div class="qt-df qt-ai-c qt-jc-fe">
            <div class="qt-mr-24 qt-ml-16">
                <div class="support-item-menu">
                    <div class="support-item-menu__key icon__key"></div>
                    <div
                        class="support-item-menu__number"
                        [textContent]="item.key"
                    >
                    </div>
                    <div class="support-item-menu__button icon__copy"></div>
                    <div class="support-item-menu__button icon__email-dark"></div>
                    <div class="support-item-menu__button icon__link-gray"></div>
                    <div class="support-item-menu__button icon__new-ticket-support"></div>
                </div>
            </div>
            <div class="support-timeline-status qt-mr-24">
                <div class="support-timeline-status__step1 icon__computer"></div>
                <div class="support-timeline-status__line">
                    <div class="support-timeline-status__line-title">Miguel Burgess</div>
                </div>
                <div class="support-timeline-status__step2 icon__remote-access-gray"></div>
                <div class="support-timeline-status__line">
                    <div class="support-timeline-status__line-title line-title--gray">URL has been generated</div>
                </div>
                <div class="support-timeline-status__step3 icon__computer"></div>
            </div>
            <div class="support-tickets-list__close icon__close"></div>
        </div>
    </div>

</div>
