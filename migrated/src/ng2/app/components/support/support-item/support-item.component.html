<div class="support-tickets-list__item">
    <div class="support-tickets-list__item-top">
        <div
            class="support-tickets-list__title"
            [textContent]="'Remote Session - ' + getUserName()"
        ></div>
        <div class="qt-df qt-ai-c qt-jc-fe">
            <div class="qt-mr-24 qt-ml-16">
                <div
                    class="support-item-menu"
                    *ngIf="item.status === 'URL_GENERATED' || item.status === 'URL_OPENED'"
                >
                    <div class="support-item-menu__key icon__key"></div>
                    <div
                        class="support-item-menu__number"
                        [textContent]="item.key"
                    >
                    </div>
                    <app-dynamic-tooltip
                        [content]="'Copy Key'"
                        [position]="'top'"
                        #copyKeyTooltip
                    ></app-dynamic-tooltip>
                    <div
                        class="support-item-menu__button icon__copy pointer"
                        (mouseenter)="copyKeyTooltip.show($event.target)"
                        (mouseleave)="copyKeyTooltip.hide()"
                        (click)="copyKey()"
                    ></div>
                    <app-dynamic-tooltip
                        [content]="'Email Info'"
                        [position]="'top'"
                        #emailInfoTooltip
                    ></app-dynamic-tooltip>
                    <div
                        (mouseenter)="emailInfoTooltip.show($event.target)"
                        (mouseleave)="emailInfoTooltip.hide()"
                        class="support-item-menu__button icon__email-dark pointer"
                        (click)="sendEmail()"
                    ></div>
                    <app-dynamic-tooltip
                        [content]="'Copy Support URL'"
                        [position]="'top'"
                        #copySupportTooltip
                    ></app-dynamic-tooltip>
                    <div
                        (mouseenter)="copySupportTooltip.show($event.target)"
                        (mouseleave)="copySupportTooltip.hide()"
                        class="support-item-menu__button icon__link-gray pointer"
                        (click)="copyLink()"
                    ></div>
                    <app-dynamic-tooltip
                        [content]="'Create Ticket'"
                        [position]="'top'"
                        #createTicketTooltip
                    ></app-dynamic-tooltip>
                    <div
                        (mouseenter)="createTicketTooltip.show($event.target)"
                        (mouseleave)="createTicketTooltip.hide()"
                        class="support-item-menu__button icon__new-ticket-support pointer"
                        (click)="onAddTicket()"
                    ></div>
                </div>
            </div>
            <div class="support-timeline-status qt-mr-24">
                <div
                    class="support-timeline-status__step1"
                    [ngClass]="{'icon__computer-green' : item.status === 'CONNECTED',
                'icon__computer' : item.status !== 'CONNECTED'}"
                ></div>
                <div
                    class="support-timeline-status__line"
                    [ngClass]="{'--success' : item.status === 'CONNECTED'}"
                >
                    <div class="support-timeline-status__line-title">
                        <span [textContent]="getUserFirstLastName(item.performer)"></span>
                    </div>
                </div>
                <app-dynamic-tooltip
                    [content]="'Agent Connected'"
                    [position]="'top'"
                    #agentConnectedTooltip
                ></app-dynamic-tooltip>
                <div
                    *ngIf="item.status === 'CONNECTED' && item.online"
                    class="support-timeline-status__step2 icon__connected-device-green"
                    (mouseenter)="agentConnectedTooltip.show($event.target)"
                    (mouseleave)="agentConnectedTooltip.hide()"
                ></div>
                <div
                    *ngIf="item.status !== 'INSTALLED' || !item.online"
                    class="support-timeline-status__step2 icon__remote-access-gray"
                ></div>
                <div
                    *ngIf="item.status === 'INSTALLED' && item.online"
                    class="support-timeline-status__step2 icon__remote-access-green pointer"
                    ngbDropdown
                    container="body"
                    ngbDropdownToggle
                >
                    <ul
                        ngbDropdownMenu
                        class="qt-dropdown-menu"
                    >
                        <li
                            ngbDropdownItem
                            (click)="connectRemoteAccess('CSS')"
                        >
                            CSS – Custom Share Screen
                        </li>
                        <li
                            ngbDropdownItem
                            (click)="connectRemoteAccess('RDP')"
                        >
                            RDP – Remote desktop protocol
                        </li>
                    </ul>
                </div>
                <div
                    class="support-timeline-status__line"
                    [ngClass]="{'--success' : item.status === 'INSTALLED' && item.online || item.status === 'CONNECTED' && item.online}"
                >
                    <div class="support-timeline-status__line-title">
                        <span [textContent]="item.userName"></span>
                        <span
                            class="line-title--gray"
                            [textContent]="statusMap[item.status]"
                        ></span>
                    </div>
                </div>
                <div
                    class="support-timeline-status__step3"
                    [ngClass]="{'icon__computer-green' : item.status === 'CONNECTED' && item.online,
                'icon__computer' : item.status !== 'CONNECTED' || !item.online}"
                ></div>
            </div>
            <app-dynamic-tooltip
                [content]="'Close Remote Session'"
                [position]="'left'"
                #closedTooltip
            ></app-dynamic-tooltip>
            <div
                class="support-tickets-list__close icon__close pointer"
                (mouseenter)="closedTooltip.show($event.target)"
                (mouseleave)="closedTooltip.hide()"
                (click)="removeSession()"
            ></div>
        </div>
    </div>
    <div class="support-tickets-list__status-msg">
        <span [innerHTML]="getMessage()"></span>
    </div>
</div>
