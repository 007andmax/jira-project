<tr>
  <td class="default-service-table__service-name" [textContent]="service.name"></td>
  <td class="default-service-table__rate" [textContent]="service.rate | currency"></td>
  <td class="default-service-table__taxes" [textContent]="getSelectedTaxNames(service.taxes)"></td>
  <td class="default-service-table__gl" ngbDropdown >
    <div class="gl-number-dropdown">
      <p ngbDropdownToggle [textContent]="(service.glNumber) ? service.glNumber.glNumber : ''"></p>
      <span *ngIf="glNumbers">
        <i class="icn-sm report-caret-icon" ngbDropdownToggle></i>
      </span>

      <div class="qt-number-dropdown-menu" ngbDropdownMenu aria-labelledby="dropdown1">
        <ng-template ngFor let-item [ngForOf]="glNumbers" let-i="index">
          <button ngbDropdownItem [textContent]="item.glNumber + ((item.description != '') ?  ' (' + item.description + ')' : '')" (click)="changeGlNumber(item)"></button>
        </ng-template>
      </div>
    </div>


  </td>
  <td class="default-service-table__billable">
    <div class="d-f qt-jc-c">
      <label class="qt-checkbox pointer" [attr.for]="'service-billable-' + service.versionedId.id">
        <input [attr.id]="'service-billable-' + service.versionedId.id" type="checkbox" [(ngModel)]="service.billable" [disabled]="!getPermissions('MANAGE_SERVICES')" (change)="onChangeBillalble()">
        <span></span>
      </label>
    </div>
  </td>
  <td class="default-service-table__default">
    <div class="d-f qt-jc-c">
      <label class="qt-checkbox pointer" [attr.for]="'service-default-' + service.versionedId.id">
        <input [attr.id]="'service-default-' + service.versionedId.id" type="checkbox" [(ngModel)]="service.canUseInTicket" [disabled]="!getPermissions('MANAGE_SERVICES')" (change)="onChangeDefault()">
        <span></span>
      </label>
    </div>
  </td>
  <td class="default-service-table__menu" ngbDropdown>
    <div class="qt-ic-c icon__more qt-pointer qt-sz-16 qt-bg-contain"  id="dropdownBasic1" ngbDropdownToggle></div>
    <ul class="qt-dropdown-menu invoice-items-dropdown"  ngbDropdownMenu aria-labelledby="dropdownBasic1">
      <li class="pointer" ngbDropdownItem (click)="edit()"> Edit</li>
      <li class="pointer" ngbDropdownItem (click)="delete()"> Delete</li>
  </ul>
  </td>
</tr>
