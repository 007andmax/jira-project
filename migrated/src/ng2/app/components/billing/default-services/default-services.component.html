<div class="page-list default-services-page">
  <div class="qt-list-header sticky-list-header default-services-page__header">
    <div>
      <h3 class="list-title">Default Services</h3>
    </div>

    <div class="d-f ai-c">
      <button class="qt-btn --outline-blue" (click)="showCreateService = true">Create Service</button>
    </div>
  </div>

  <div class="default-services-page__table-container">
    <table class="qt-table-modern default-service-table">
      <thead>
        <tr>
          <th class="default-service-table__service-name">
            Service Name
            <span class="qt-table-modern__sorting"></span>
          </th>
          <th class="default-service-table__rate">
            Hourly Rate($)
            <span class="qt-table-modern__sorting"></span>
          </th>
          <th class="default-service-table__taxes">
            Taxes
            <span class="qt-table-modern__sorting"></span>
          </th>
          <th class="default-service-table__gl">
            GL Number
            <span class="icon__info-question default-services-page__question-icon qt-sz-12 qt-ic-c"></span>
            <span class="qt-table-modern__sorting"></span>
          </th>
          <th class="default-service-table__billable">
            Make Billable
          </th>
          <th class="default-service-table__default">
            Set as Default
          </th>
          <th class="default-service-table__menu"></th>
        </tr>
      </thead>
      <tbody>
        <ng-template ngFor let-item
        [ngForOf]="list"
        [ngForTrackBy]="trackById">
        <app-default-services-item [service]="item"></app-default-services-item>
</ng-template>
      </tbody>
    </table>
  </div>


  <div class="default-services-page__table-container">
    <table class="qt-table-modern default-service-table">
      <thead>
        <tr>
          <th class="default-service-table__contracts  qt-ff-sb">
            Contracts
          </th>
          <th class="default-service-table__rate"></th>
          <th class="default-service-table__taxes"></th>
          <th class="default-service-table__gl"></th>
          <th class="default-service-table__billable"></th>
          <th class="default-service-table__default"></th>
          <th class="default-service-table__menu"></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="default-service-table__contracts">Managed Services</td>
          <td class="default-service-table__rate"></td>
          <td class="default-service-table__taxes"></td>
          <td class="default-service-table__gl">
            <input class="ql-input-number" type="text">
          </td>
          <td class="default-service-table__billable"></td>
          <td class="default-service-table__default"></td>
          <td class="default-service-table__menu"></td>
        </tr>

        <tr>
          <td class="default-service-table__contracts">Managed Services</td>
          <td class="default-service-table__rate"></td>
          <td class="default-service-table__taxes"></td>
          <td class="default-service-table__gl">
            <input class="ql-input-number" type="text">
          </td>
          <td class="default-service-table__billable"></td>
          <td class="default-service-table__default"></td>
          <td class="default-service-table__menu"></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>


  <app-default-services-add *ngIf="showCreateService" (onClose)="showCreateService = false"></app-default-services-add>
