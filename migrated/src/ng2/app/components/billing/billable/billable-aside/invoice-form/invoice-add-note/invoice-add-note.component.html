<div class="qt-pt-24 qt-pb-24 qt-pl-24 qt-pr-24 qt-pos-rel">
  <div class="qt-popup-arrow --bottom"></div>

  <div class="qt-mb-20 qt-ff-sb qt-fs-15 qt-lh-133">Add Saved Note</div>

  <div class="qt-mb-16">
    <div class="qt-input-block qt-lh-154">
      <mat-error *ngIf="!validate.getTitle()">
        This company name already occupied
      </mat-error>
      <label>Note Subject</label>
      <input type="text"  [(ngModel)]="createNote.title" (blur)="validate.checkValidTitle(createNote.title)" placeholder="Write Note Subject">
    </div>
  </div>

  <div class="qt-mb-24">
    <div class="qt-input-block qt-text-area-block">
      <mat-error *ngIf="!validate.getLine1()">
        This company name already occupied
      </mat-error>
      <label class="qt-lh-154">Note Description</label>
    <textarea class="qt-textarea" [(ngModel)]="createNote.line1" (blur)="validate.checkValidLine1(createNote.line1)" placeholder="Write Note Description"></textarea>
    </div>
  </div>

  <div class="qt-df">
    <button class="qt-button qt-mr-12"  (click)="add()">Save Note</button>
    <button class="qt-button --outline" (click)="close()">Cancel</button>
  </div>

</div>
