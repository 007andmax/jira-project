<div class="billing-page__aside qt-aside-modern --x-large" *ngIf="opened">
    <div class="qt-aside-modern__header">
        <div class="qt-aside-modern__header-title">New Invoice</div>
        <div
            class="qt-df qt-ai-c"
            *ngIf="isInit"
        >
            <div
                class="icon__clock-timer qt-sz-20 qt-ic-c qt-mr-6"
                *ngIf="billableTaimer && !billableTaimer.isFinished"
            ></div>
            <div
                class="qt-fs-13 qt-ff-gr qt-mr-16 qt-color-dark-light"
                *ngIf="billableTaimer && !billableTaimer.isFinished"
            >
                <span
                    class="qt-ff-gm qt-color-dark"
                    [textContent]="billableTaimer.getTimeText()"
                ></span>
                mins remaining until unlock
            </div>
            <div
                class="icon__invoice-expired qt-sz-20 qt-ic-c qt-mr-6"
                *ngIf="billableTaimer && billableTaimer.isFinished"
            ></div>
            <div
                class="qt-fs-13 qt-ff-gr qt-mr-16 qt-color-dark-light"
                *ngIf="billableTaimer && billableTaimer.isFinished"
            >
                Invoice has been expired and it cannot be saved
            </div>
            <div
                class="qt-aside-modern__header-close icon__close"
                (click)="unlock()"
            ></div>
        </div>
    </div>
    <div class="qt-aside-modern__content --no-padding">
        <app-invoice-form
            [hidden]="isUdpateInvoice || showPreview"
            (onUpdateInvoice)="onUpdateInvoice($event)"
            #formInvoice
            *ngIf="!showPreloader"
            [invoiceNotes]="invoiceNotes"
            [invoiceTaxNumber]="invoiceTaxNumber"
            [invoiceNumber]="invoiceNumber"
            [company]="company"
            [invoice]="invoice"
        ></app-invoice-form>
        <app-invoice-preview
            [invoiceTaxNumber]="invoiceTaxNumber"
            [company]="company"
            [invoiceNumber]="invoiceNumber"
            [invoice]="invoice"
            *ngIf="showPreview"
        ></app-invoice-preview>
    </div>
    <div
        class="prelaoder-body"
        *ngIf="showPreloader || isUdpateInvoice"
    >
        <div class="loading"></div>
    </div>
    <div class="qt-aside-modern__footer">
        <div class="qt-df">
            <div
                class="qt-pos-rel"
                ngbDropdown
                [placement]="'top-right'"
            >
                <ul
                    class="qt-dropdown-menu"
                    ngbDropdownMenu
                    aria-labelledby="dropdownSave"
                >
                    <li
                        ngbDropdownItem
                        appDisabledBtn
                        #saveAndPrintBtn="disabled"
                        (onClick)="saveAndPrint()"
                    >
                        <div class="icon__print qt-sz-16 qt-mr-8"></div>
                        Save and Print
                    </li>
                    <li
                        ngbDropdownItem
                        appDisabledBtn
                        #saveAndDownloadBtn="disabled"
                        (onClick)="saveAndDownload()"
                    >
                        <div class="icon__download qt-sz-16 qt-mr-8"></div>
                        Save and Download
                    </li>
                </ul>
                <button class="qt-button --with-menu qt-mr-12">
                    <span
                        class="save-billable-aside-btn left-side"
                        appDisabledBtn
                        #saveAndSendBtn="disabled"
                        (onClick)="saveAndSend()"
                    >
                        <span *ngIf="!saveAndSendBtn.isBlock() && !saveAndPrintBtn.isBlock() && !saveAndDownloadBtn.isBlock()">Save and Send</span>
                        <app-preloader-ticket *ngIf="saveAndSendBtn.isBlock() || saveAndPrintBtn.isBlock() || saveAndDownloadBtn.isBlock()"></app-preloader-ticket>
                    </span>
                    <div
                        class="button-menu"
                        id="dropdownSave"
                        ngbDropdownToggle
                    >
                        <div class="qt-sz-16 qt-ic-c icon__dropdown-arrow-up"></div>
                    </div>
                </button>
            </div>
            <button
                class="qt-button --outline"
                *ngIf="!showPreview"
                (click)="onPreview()"
            >
                Preview
            </button>
            <button
                class="qt-button --outline"
                *ngIf="showPreview"
                (click)="showPreview = false"
            >
                Edit
            </button>
        </div>
    </div>
</div>
