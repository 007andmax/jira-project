

  <div class="qt-df qt-pos-rel address-block">
    <hr class="address-block__horisontal-divider">
    <div class="qt-w50 qt-pt-16 qt-pr-24 qt-pl-32 qt-pb-16">
      <div class="qt-input-block">
        <label>Customer Name</label>
        <input  [value]="company.name" type="text" disabled>
      </div>
    </div>

    <div class="qt-w50 qt-pt-30 qt-pl-24 qt-pr-24 qt-pb-30" ngbDropdown [autoClose]="'inside'" #editCustomer="ngbDropdown">
      <div class="qt-fs-10 qt-ff-sb  qt-df qt-ai-c qt-mb-4 qt-lh-154"><div class="qt-sz-16 icon__company-address qt-ic-c qt-mr-4"></div> BILLING ADDRESS</div>
      <div class="qt-fs-13 qt-lh-154 qt-fw-b qt-color-dark" [textContent]="company.name"></div>
      <div class="qt-fs-13 qt-lh-154" [textContent]="company.contacts[0].firstName + ' ' +
      company.contacts[0].lastName"></div>
      <div class="qt-fs-13 qt-lh-154" [textContent]="company.addresses[0].addressWithSuitNumberAndPostalCode"></div>
      <div class="qt-fs-13 qt-lh-154" [textContent]="company.contacts[0].primaryEmail"></div>
      <div class="qt-fs-13 qt-mb-4" [textContent]="(company.contacts[0].phoneNumbers && company.contacts[0].phoneNumbers.length > 0) ? company.contacts[0].phoneNumbers[0].number : ''"></div>
    <!--  <div class="qt-fs-13 qt-mb-10">AB T3S 0B5</div>-->
      <div class="qt-fs-13 qt-color-info  qt-pointer" id="dropdownForm1" ngbDropdownToggle (click)="onEditCustomer()">Edit Customer</div>
      <div ngbDropdownMenu aria-labelledby="dropdownForm1" >
      <app-invoice-form-edit-customer #companyEdit (onUpdateCompany)="onUpdateCompany()"  [dropDown]="editCustomer"></app-invoice-form-edit-customer>
        </div>
    </div>
  </div>

  <div class="infoice-info-row qt-df qt-pt-16 qt-pl-30 qt-pr-30 qt-mb-24 ">

    <div class="qt-input-block qt-mr-16 qt-w100">
      <label>Invoice#</label>
      <input [(ngModel)]="invoiceNumber" (blur)="onChangeInvoiceNumber()" type="text">
    </div>

    <div class="qt-input-block qt-mr-16 qt-w100">
      <label [textContent]="invoiceTaxNumber.taxIdDescription"></label>
      <input [(ngModel)]="invoiceTaxNumber.taxId" (blur)="onChangeTax()"  type="text">
    </div>

    <div class="qt-input-block qt-mr-16 qt-w100 input_inside_white_important">
      <label>Invoice Date</label>
      <app-date-picker   [editMode]="true" [editDate]="invoice.invoiceDataDto.date"   [useMinDate]="false" (onChange)="onChangeDate($event)"></app-date-picker>
    </div>

    <div class="qt-input-block qt-w100 input_inside_white_important">
      <label>Due Date</label>
      <app-date-picker   [editMode]="true"  [editDate]="invoice.invoiceDataDto.dueDate" [useMinDate]="false" (onChange)="onChangeDueDate($event)"></app-date-picker>

    </div>
  </div>

  <div class="invoice-items">
    <ng-template ngFor let-ticket
    [ngForOf]="invoice.invoiceDataDto.tickets"
    [ngForTrackBy]="trackById">
    <div class="invoice-item qt-mb-16 qt-w100">
      <div class="qt-df qt-ai-c">
        <div class="invoice-item__header qt-w100 qt-ml-30 qt-df qt-ai-c qt-pt-10 qt-pb-10 qt-h40">
          <div class="invoice-item__number qt-color-white qt-fs-10 qt-pt-4 qt-pb-4 qt-pl-4 qt-pr-4 qt-mr-16" [textContent]="'Tkt# ' + ticket.number"></div>
          <div class="qt-fs-12 qt-mr-16" ><span class="qt-fs-11 qt-ff-sb">Date</span> {{getDate(ticket.closedAt)}}</div>
          <div class="qt-fs-12"><span class="qt-fs-11 qt-ff-sb">Subject:</span> {{ticket.subject}}</div>
        </div>
        <div class="delete-item-container qt-pl-4">
          <div class="qt-pointer  qt-sz-16 icon__raw-clear qt-ic-c " *ngIf="invoice.invoiceDataDto.tickets.length > 1" placement="left" ngbTooltip="Remove Ticket" (click)="delete(ticket)"></div>
        </div>
      </div>

      <table class="invoice-item__table">
        <thead >
          <tr>
            <th></th>
            <th class="invoice-item__col-item  qt-ff-sb">Item</th>
            <th class="invoice-item__col-desc  qt-ff-sb" >Description</th>
            <th class="invoice-item__col-price qt-ff-sb">Unit Price</th>
            <th class="invoice-item__col-quentity qt-ff-sb">Quantity</th>
            <th class="invoice-item__col-tax qt-ff-sb">Tax</th>
            <th class="invoice-item__col-amount qt-ff-sb">Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <ng-template ngFor let-service
    [ngForOf]="ticket.serviceExpenses"
    [ngForTrackBy]="trackById">


          <tr>
            <td>
              <div class=" qt-pointer qt-sz-20 icon__move-light qt-ic-c"></div>
            </td>
            <td class="invoice-item__col-item" [textContent]="service.item.name"></td>
            <td class="invoice-item__col-desc" [textContent]="service.description"></td>
            <td class="invoice-item__col-price" [textContent]="service.item.rate | currency"></td>
            <td class="invoice-item__col-quentity" *ngIf="service.description =='By User' || service.description =='By Device' || service.description =='Managed Service Contract'" [textContent]="service.billableQuantity"></td>
            <td class="invoice-item__col-quentity"  *ngIf="service.description !=='By User' && service.description !=='By Device' && service.description !=='Managed Service Contract'" [textContent]="getDuration(service.billableQuantity)"></td>
            <td class="invoice-item__col-tax" [textContent]="service.taxSum | currency"></td>
            <td class="invoice-item__col-amount" [textContent]="service.totalSum | currency"></td>
            <td>

            </td>
          </tr>
        </ng-template>

        <ng-template ngFor let-product
    [ngForOf]="ticket.productExpenses"
    [ngForTrackBy]="trackById">


          <tr>
            <td>
              <div class=" qt-pointer qt-sz-20 icon__move-light qt-ic-c"></div>
            </td>
            <td class="invoice-item__col-item" [textContent]="product.item.manufacture"> </td>
            <td class="invoice-item__col-desc" [textContent]="product.item.description"></td>
            <td class="invoice-item__col-price" [textContent]="product.item.sale | currency"></td>
             <td class="invoice-item__col-quentity"   [textContent]="product.billableQuantity"></td>
            <td class="invoice-item__col-tax" [textContent]="product.taxSum | currency"></td>
            <td class="invoice-item__col-amount" [textContent]="product.totalSum | currency"></td>
            <td>

            </td>
          </tr>
        </ng-template>

        </tbody>
      </table>
    </div>
</ng-template>

  <div class="summary-info qt-df qt-pl-30 qt-pr-30 qt-pb-24 qt-jc-sb">
    <div>
      <div class="qt-mb-30">
        <div class="info-button-sm qt-ff-gm"><div class="icon__discount qt-mr-4 qt-sz-16 qt-ic-c"></div> Apply Discount</div>
      </div>

      <div class="summary-info__notes">
        <div class="qt-df qt-jc-sb qt-mb-12">
          <div class="qt-fs-13 qt-ff-gm">Customer Note</div>
          <div class="qt-fs-12 qt-color-info qt-ff-gm" placement="top" ngbTooltip="Expand Notes" (click)="toogleCustomerNote = !toogleCustomerNote">Saved Notes +</div>

        </div>
        <div >
          <div class="qt-mb-16 qt-df" style="display: flex !important;" *ngIf="toogleCustomerNote" ngbDropdown [autoClose]="'inside'" #addNoteDd="ngbDropdown">
            <app-invoice-select-note   [placeholder]="'Select Saved Notes'"   [class]="['light-dropdown']"
            [field]="'title'"   [list]="regularNotes" (onChangeInput)="onCheckUpdateTitleNote($event)"
              (onSelectedItem)="onSelectNotes($event)"></app-invoice-select-note>


            <div class="qt-square-btn --done" (click)="onUpdateRegularNote()" *ngIf="changeRegularNote"></div>

            <div class="qt-square-btn --add" placement="top" ngbTooltip="Add Note"  id="dropdownAddNote" ngbDropdownToggle>

              <div class="billable-popup-add-note" ngbDropdownMenu aria-labelledby="dropdownAddNote">
                <app-invoice-add-note (onUpdateNotes)="getInvoiceNote()" [dropDown]="addNoteDd"></app-invoice-add-note>
              </div>

            </div> <!--*ngIf="getLenRegularNotes() < 5"-->
          </div>
          <textarea (input)="onCheckUpdateDescriptionNote()"  (blur)="onChangeRegularNote()" class="summary-info__textarea qt-textarea" placeholder="Type your custom note here" name="" id="description-regular-note" appTextArea    maxlength="250"   cols="30" rows="1"></textarea>
        </div>
      </div>
    </div>

    <div>
      <div class="invoice-total qt-color-dark" >
        <div class="qt-df qt-jc-sb qt-fs-13 qt-mb-15">
          <div>Sub Total</div>

        </div>
        <div class="qt-df qt-jc-sb qt-fs-13 qt-mb-15">
          <div>Tax</div>

        </div>
        <div class="qt-df qt-jc-sb qt-pt-15 invoice-total__total-line">
          <div class="qt-fs-13 qt-fw-b">Total</div>
          <div class="qt-fs-16 qt-fw-b">$98.43</div>
        </div>
      </div>

    </div>
