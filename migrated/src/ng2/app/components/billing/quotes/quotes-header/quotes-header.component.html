<div class="qt-list-header sticky-list-header quotes-list-header">
  <div>
    <h3 class="list-title" [textContent]="'Quotes'"></h3>
  </div>

  <div class="d-f ai-c">
    <button class="qt-btn --transparent" (click)="clearAll()" *ngIf="countFilter > 0">Clear All</button>
    <button class="qt-btn btn-filter qt-ml-8" [ngClass]="{'active':!toggleFilter}" (click)="toggleFilter  = !toggleFilter"> <span class="filter-counter qt-circle qt-sz-18 qt-ff-sb qt-fs-10 qt-color-white qt-bg-info qt-mr-8 qt-df qt-ai-c qt-jc-c" *ngIf="countFilter > 0" [textContent]="countFilter"></span> Filters</button>
    <button class="qt-btn --outline-blue qt-ml-8" (click)="onShowCreateQuote()"> Сreate Quotation</button>
  </div>
  <app-quotes-filter class="qt-w100" #filter (changeCountFilter)="onChangeCountFilter($event)" [hidden]="toggleFilter"></app-quotes-filter>

</div>
<div class="sticky-list-table-header quotes-list-table-header" [ngClass]="{'--filters-open':!toggleFilter}">


  <table class="qt-table-modern invoice-table">
    <thead>
      <tr>
        <th class="quotes-table__date pointer" (click)="sortBy('date')">
          Date
          <span class="qt-table-modern__sorting"></span>
        </th>

        <th class="quotes-table__number" (click)="sortBy('number')">
          Quote#
        </th>

        <th class="quotes-table__company pointer" (click)="sortBy('customerName')">
          Company
          <span class="qt-table-modern__sorting"></span>
        </th>

        <th class="quotes-table__description pointer"  >
          Description
          <span class="qt-table-modern__sorting"></span>
        </th>

        <th class="quotes-table__create-by" >
          Created By
        </th>

        <th class="quotes-table__status"  >
          Status

        </th>
        <th class="quotes-table__valid pointer" (click)="sortBy('validUntil')">
          Valid Until
          <span class="qt-table-modern__sorting"></span>
        </th>
        <th class="quotes-table__total pointer" (click)="sortBy('amount')">
          Amount
          <span class="qt-table-modern__sorting"></span>
        </th>
        <th class="quotes-table__menu"></th>
      </tr>
    </thead>
  </table>
</div>
