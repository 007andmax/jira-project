<div class="quotes-page__aside invoices-page__aside aside-preview"  [hidden]="!open" >
  <div class="aside-header qt-df qt-ai-c qt-jc-sb qt-pr-16 qt-pl-20"  >
    <div class="qt-fs-20 qt-ff-gm qt-color-dark"  [textContent]="'New Quote'">
    </div>
     <div class="qt-df qt-ai-c">
      <div class="icon__close qt-sz-24 qt-pointer qt-ic-c " (click)="close()"></div>
    </div>
  </div>
  <div class="aside-body-container">
  <div class="qt-pl-30 qt-pr-30 qt-pt-24 quote-aside-scroll-content">
    <app-quote-aside-add-body #quoteAdd [validate]="validate" [hidden]="showPreview" *ngIf="open"></app-quote-aside-add-body>
    <app-quote-aside-preview-body *ngIf="showPreview" [quote]="quotePreview"></app-quote-aside-preview-body>
  </div>
  <div class="aside-footer qt-pr-30 qt-pl-30 qt-pb-16 qt-pt-16 qt-df qt-ai-c qt-jc-sb">
    <div class="qt-df">
      <div class="qt-pos-rel" ngbDropdown [placement]="'top-right'">
        <ul class="qt-dropdown-menu" ngbDropdownMenu aria-labelledby="dropdownSave">
          <li ngbDropdownItem appDisabledBtn #saveAndApproveBtn="disabled" (onClick)="saveAndApprove()"  ><div class="icon__print qt-sz-16 qt-mr-8"></div>Save and Approve</li>
          <li ngbDropdownItem appDisabledBtn #saveAndDownloadBtn="disabled" (onClick)="saveAndDownload()"  ><div class="icon__download qt-sz-16 qt-mr-8"></div>Save and Download</li>
          <li ngbDropdownItem appDisabledBtn #saveAndSendBtn="disabled" (onClick)="saveAndContinue()"  ><div class="icon__download qt-sz-16 qt-mr-8"></div>Save and Continue</li>

        </ul>
        <button class=" qt-button --with-menu qt-mr-12" >
          <span class="save-billable-aside-btn" appDisabledBtn #saveAndContinueBtn="disabled" (onClick)="saveAndSend()"  >
            <span  *ngIf="!saveAndSendBtn.isBlock() && !saveAndContinueBtn.isBlock() && !saveAndApproveBtn.isBlock() && !saveAndDownloadBtn.isBlock()">Save and Send</span>
            <app-preloader-ticket *ngIf="saveAndSendBtn.isBlock() || saveAndContinueBtn.isBlock() || saveAndApproveBtn.isBlock() || saveAndDownloadBtn.isBlock()"></app-preloader-ticket>
          </span>
          <div class="button-menu"  id="dropdownSave" ngbDropdownToggle>
            <div class="qt-sz-16 qt-ic-c icon__dropdown-arrow-up"></div>
          </div>
        </button>
      </div>
      <button class="qt-button --outline" *ngIf="!showPreview" (click)="onPreview()">Preview</button>
        <button class="qt-button --outline" *ngIf="showPreview" (click)="showPreview = false">Edit</button>
    </div>

   </div>
  </div>

  </div>
