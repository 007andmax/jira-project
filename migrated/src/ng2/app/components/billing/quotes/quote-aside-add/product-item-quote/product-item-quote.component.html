<tr>
  <td class="new-quote-table__col-item" [textContent]="product.item.manufacture"> </td>
  <td class="new-quote-table__col-desc"><input type="text" [(ngModel)]="product.item.description" class="qt-input-in-table" /></td>
  <td class="new-quote-table__col-unit-price">
    <input class="qt-input-in-table"
      decimalNumber
      [useFixed]="true"
      placeholder="0.00"
      [value]="product.item.cost"
      (blur)="onCheckSaleCost()"
      (onChange)="product.item.cost=$event"
    />
  </td>
  <td class="new-quote-table__col-markup">
    <input class="qt-input-in-table"
      decimalNumber
      [useFixed]="true"
      placeholder="0.00"
      [value]="product.markup"
      (onChange)="product.markup=$event"
    />
  </td>
  <td class="new-quote-table__col-sales-price">
    <input class="qt-input-in-table"
      [ngClass]="{'--input-error':!product.validateSaleCost}"
      decimalNumber
      [useFixed]="true"
      placeholder="0.00"
      [value]="product.item.sale"
      (onChange)="product.item.sale=$event"
      (blur)="onCheckSaleCost()"
    />
    <mat-error class="qt-tooltip-error" *ngIf="!product.validateSaleCost">
      Product price can not be lower than cost
    </mat-error>
  </td>
   <td class="new-quote-table__col-quantify">
    <input class="qt-input-in-table"
      decimalNumber
      [value]="product.quantity"
      (onChange)="product.quantity=$event"
    />
   </td>
  <td class="new-quote-table__col-tax"[innerHTML]="getSelectedTaxes(product.item.taxes)">
  </td>
  <td class="invoice-preview__col-amount" [textContent]="getPriceProduct(product) | currency"></td>
  <td> <div class="icon__raw-clear qt-ic-c qt-sz-16" (click)="removeProduct()"></div></td>
</tr>
