<div class="qt-pos-rel">
  <div class="invoice-preview__status" ></div> <!--[ngClass]="{'--paid': invoiceProfile.paidOn, '--overdue': invoiceProfile.isOverDue && !invoiceProfile.paidOn}"-->

  <div class="qt-df qt-jc-sb qt-pb-24 company-info">
    <div class="qt-input-block">
      <label class="qt-lh-154">Customer Name</label>
      <app-select-search class="search-company invoices-company-filter"  #companyDp  [placeholder]="'Select Company'"
[change]="false" [class]="['qt-dropdown']" [field]="'name'" [editItem]="quoteCompany" [list]="companies"
(onSelectedItem)="onSelectCompany($event)"></app-select-search>

<div class="quote-description editable-description"  >
  <textarea [(ngModel)]="quote.description" placeholder="Quote description in short words" appTextArea></textarea>
</div>
 
    </div>

    <div class="qt-color-dark qt-lh-131 qt-pr-24 qt-fs-26 qt-text-upper qt-ff-gm" ngbDropdown [autoClose]="'inside'" #editCustomer="ngbDropdown">
      <div class="qt-fs-10 qt-color-light qt-mb-8 qt-ff-sb qt-lh-12">BILLING ADDRESS</div>
      <div class="qt-fs-13 qt-color-dark qt-ff-gm" *ngIf="quoteCompany" [textContent]="quoteCompany.name"></div>
      <div class="qt-fs-13"  *ngIf="quoteCompany"  [textContent]="(quoteCompany.companyInfo.contacts.length > 0) ? quoteCompany.companyInfo.contacts[0].firstName + ' ' + quoteCompany.companyInfo.contacts[0].lastName : ''"></div>
      <div class="qt-fs-13"  *ngIf="quoteCompany"  [textContent]="(quoteCompany.companyInfo.addresses.length > 0) ? quoteCompany.companyInfo.addresses[0].address : ''"></div>
      <div class="qt-fs-13"  *ngIf="quoteCompany"  [textContent]="(quoteCompany.companyInfo.contacts.length > 0) ? quoteCompany.companyInfo.contacts[0].primaryEmail : ''"></div>
      <div class="qt-fs-13 qt-color-info  qt-pointer" id="dropdownForm1" *ngIf="quoteCompany" ngbDropdownToggle (click)="onEditCustomer()">Edit Customer</div>
      <div ngbDropdownMenu aria-labelledby="dropdownForm1" >
      <app-invoice-form-edit-customer #companyEdit (onUpdateCompany)="onUpdateCompany()"  [dropDown]="editCustomer"></app-invoice-form-edit-customer>
        </div>
    </div>
  </div>

  <div class="qt-df qt-pt-16 qt-pl-30 qt-pr-30 qt-mb-16">

    <div class="qt-input-block qt-mr-16 qt-w100">
      <label class="qt-lh-154">Quote#</label>
      <div class="qt-df"   >
         <input class="qt-input-prepend" decimalNumber
         [value]="quote.number"
         (onChange)="quote.number=$event" >
      </div>
    </div>

    <div class="qt-input-block qt-mr-16 qt-w100">
      <label class="qt-lh-154">PO#
      </label>
      <div class="qt-df"  >
        
         <input class="qt-input-prepend" [(ngModel)]="quote.purchaseOrder" type="text">

      
      </div>

    

    </div>

    <div class="qt-input-block qt-mr-16 qt-w100">
      <label class="qt-lh-154">Quote Date</label>
      <app-date-picker [formatDate]="formatDate" [editMode]="true" [editDate]="today" [useMinDate]="false" [useMaxDate]="true" (onChange)="onChangeQuoteDate($event)"></app-date-picker>

    </div>

    <div class="qt-input-block qt-w100">
      <label class="qt-lh-154">Expiry Date</label>
      <app-date-picker [formatDate]="formatDate" [editMode]="true" [editDate]="today" [useMinDate]="false" [useMaxDate]="true" (onChange)="onChangeExpiryDate($event)"></app-date-picker>

    </div>
  </div>

   <div class="invoice-preview__items">
   
    <div class="qt-mb-16">
      <div class="invoice-preview__item-header qt-color-dark qt-df qt-pt-8 qt-pb-8 qt-pl-12 qt-pr-12 qt-ai-c">
          </div>
      <table class="invoice-preview__table">
        <thead class=" qt-lh-127 qt-color-dark">
          <tr>
            <th class="invoice-preview__col-item">Item</th>
            <th class="invoice-preview__col-desc">Description</th>
            <th class="invoice-preview__col-price">Unit Price</th>
            <th class="invoice-preview__col-qty">Quantity</th>
            <th class="invoice-preview__col-tax">Tax</th>
            <th class="invoice-preview__col-amount">Amount</th>
          </tr>
        </thead>
        <tbody class=" qt-lh-133">
          <ng-template ngFor let-service
          [ngForOf]="quote.services"
          [ngForTrackBy]="trackById">
          <tr>
            <td class="invoice-preview__col-item" [textContent]="service.name"></td>
            <td class="invoice-preview__col-desc" [textContent]="service.description"></td>
            <td class="invoice-preview__col-price" [textContent]="service.rate | currency"></td>
            <td class="invoice-preview__col-qty"   [textContent]="service.quantity"></td>
            <td class="invoice-preview__col-tax" [innerHTML]="getSelectedTaxes(service.taxes)"></td>
          <td class="invoice-preview__col-amount" [textContent]="service.sum | currency"></td>
          </tr>
</ng-template>
<ng-template ngFor let-product
[ngForOf]="quote.products"
[ngForTrackBy]="trackById">
      <tr>
        <td class="invoice-preview__col-item" [textContent]="product.manufacture"> </td>
        <td class="invoice-preview__col-desc" [textContent]="product.description"></td>
        <td class="invoice-preview__col-price" [textContent]="product.sale | currency"></td>
         <td class="invoice-preview__col-qty"   [textContent]="product.quantity"></td>
        <td class="invoice-preview__col-tax" [innerHTML]="getSelectedTaxes(product.taxes)"></td>
        <td class="invoice-preview__col-amount" [textContent]="product.sum | currency"></td>
      </tr>
      </ng-template>

        </tbody>
      </table>



    </div>

   
<app-product-list-quote (selectedProductItem)="selectProduct($event)"></app-product-list-quote>

  </div>
