<div class="qt-pos-rel">
  <div class="invoice-preview__status" ></div> <!--[ngClass]="{'--paid': invoiceProfile.paidOn, '--overdue': invoiceProfile.isOverDue && !invoiceProfile.paidOn}"-->

  <div class="qt-df qt-jc-sb qt-pb-24 company-info">
    <div class="qt-input-block">
      <label class="qt-lh-154">Customer Name</label>
      <app-select-search class="search-company invoices-company-filter"  #companyDp  [placeholder]="'Select Company'"
[change]="false" [class]="['qt-dropdown']" [field]="'name'" [editItem]="quoteCompany" [list]="companies"
(onSelectedItem)="onSelectCompany($event)"></app-select-search>

<div class="quote-description editable-description"  >
  <textarea [(ngModel)]="quote.description" placeholder="Quote description in short words" appTextArea></textarea>
</div>
 
    </div>

    <div class="qt-color-dark qt-lh-131 qt-pr-24 qt-fs-26 qt-text-upper qt-ff-gm" ngbDropdown [autoClose]="'inside'" #editCustomer="ngbDropdown">
      <div class="qt-fs-10 qt-color-light qt-mb-8 qt-ff-sb qt-lh-12">BILLING ADDRESS</div>
      <div class="qt-fs-13 qt-color-dark qt-ff-gm" *ngIf="quoteCompany" [textContent]="quoteCompany.name"></div>
      <div class="qt-fs-13"  *ngIf="quoteCompany"  [textContent]="(quoteCompany.companyInfo.contacts.length > 0) ? quoteCompany.companyInfo.contacts[0].firstName + ' ' + quoteCompany.companyInfo.contacts[0].lastName : ''"></div>
      <div class="qt-fs-13"  *ngIf="quoteCompany"  [textContent]="(quoteCompany.companyInfo.addresses.length > 0) ? quoteCompany.companyInfo.addresses[0].address : ''"></div>
      <div class="qt-fs-13"  *ngIf="quoteCompany"  [textContent]="(quoteCompany.companyInfo.contacts.length > 0) ? quoteCompany.companyInfo.contacts[0].primaryEmail : ''"></div>
      <div class="qt-fs-13 qt-color-info  qt-pointer" id="dropdownForm1" *ngIf="quoteCompany" ngbDropdownToggle (click)="onEditCustomer()">Edit Customer</div>
      <div ngbDropdownMenu aria-labelledby="dropdownForm1" >
      <app-invoice-form-edit-customer #companyEdit   [dropDown]="editCustomer"></app-invoice-form-edit-customer>
        </div>
    </div>
  </div>

  <div class="qt-df qt-pt-16 qt-pl-30 qt-pr-30 qt-mb-16">

    <div class="qt-input-block qt-mr-16 qt-w100">
      <label class="qt-lh-154">Quote#</label>
      <div class="qt-df"   >
         <input class="qt-input-prepend" decimalNumber
         [value]="quote.number"
         (onChange)="quote.number=$event" >
      </div>
    </div>

    <div class="qt-input-block qt-mr-16 qt-w100">
      <label class="qt-lh-154">PO#
      </label>
      <div class="qt-df"  >
        
         <input class="qt-input-prepend" [(ngModel)]="quote.purchaseOrder" type="text">

      
      </div>

    

    </div>

    <div class="qt-input-block qt-mr-16 qt-w100">
      <label class="qt-lh-154">Quote Date</label>
      <app-date-picker [formatDate]="formatDate" [editMode]="true" [editDate]="today" [useMinDate]="false" [useMaxDate]="true" (onChange)="onChangeQuoteDate($event)"></app-date-picker>

    </div>

    <div class="qt-input-block qt-w100">
      <label class="qt-lh-154">Expiry Date</label>
      <app-date-picker [formatDate]="formatDate" [editMode]="true" [editDate]="today" [useMinDate]="false" [useMaxDate]="true" (onChange)="onChangeExpiryDate($event)"></app-date-picker>

    </div>
  </div>

   <div class="invoice-preview__items">
   
    <div class="qt-mb-16">
      <div class="invoice-preview__item-header qt-color-dark qt-df qt-pt-8 qt-pb-8 qt-pl-12 qt-pr-12 qt-ai-c">
          </div>
      <table class="invoice-preview__table">
        <thead class=" qt-lh-127 qt-color-dark">
          <tr>
            <th class="invoice-preview__col-item">Item</th>
            <th class="invoice-preview__col-desc">Description</th>
            <th class="invoice-preview__col-price">Unit Price</th>
            <th class="invoice-preview__col-price">Markup</th>
            <th class="invoice-preview__col-price">Sales Price</th>
            <th class="invoice-preview__col-qty">Quantity</th>
            <th class="invoice-preview__col-tax">Tax</th>
            <th class="invoice-preview__col-amount">Amount</th>
            <th></th>
          </tr>
        </thead>
        <tbody class=" qt-lh-133">
          <ng-template ngFor let-service
          let-i="index"
          [ngForOf]="quote.services"
          [ngForTrackBy]="trackById">
          <tr>
            <td class="invoice-preview__col-item" [textContent]="service.item.name"></td>
            <td class="invoice-preview__col-desc"  ><input type="text" [(ngModel)]="service.description"  /></td>
            <td class="invoice-preview__col-price" ></td>
            <td class="invoice-preview__col-price" ></td>
            <td class="invoice-preview__col-price" [textContent]="service.rate | currency"></td>
            <td class="invoice-preview__col-qty"    >  <input class="qt-input-prepend" 
              decimalNumber
              [value]="service.quantity"
              (onChange)="service.quantity=$event"
              /></td>
            <td class="invoice-preview__col-tax" [innerHTML]="getSelectedTaxes(service.item.taxes)"> </td>
          <td class="invoice-preview__col-amount" [textContent]="getPriceService(service) | currency"></td>
          <td> <div class="icon__raw-clear qt-ic-c qt-sz-16" (click)="removeService(i)"></div></td>
          </tr>
</ng-template>
<ng-template ngFor let-product
let-i="index"
[ngForOf]="quote.products"
[ngForTrackBy]="trackById">
      <tr>
        <td class="invoice-preview__col-item" [textContent]="product.item.manufacture"> </td>
        <td class="invoice-preview__col-desc"  ><input type="text" [(ngModel)]="product.item.description"  /></td>
        <td class="invoice-preview__col-price"  ><input class="qt-input-prepend" 
            decimalNumber
          [useFixed]="true"
          placeholder="0.00"
          [value]="product.item.cost"
          (onChange)="product.item.cost=$event"
            /></td>
        <td class="invoice-preview__col-price"  >
          <input class="qt-input-prepend" 
            decimalNumber
          [useFixed]="true"
          placeholder="0.00"
          [value]="product.markup"
          (onChange)="product.markup=$event"
            />
        </td>
        <td class="invoice-preview__col-price"  >
          <input class="qt-input-prepend" 
          decimalNumber
        [useFixed]="true"
        placeholder="0.00"
        [value]="product.item.sale"
        (onChange)="product.item.sale=$event"
          />
        </td>
         <td class="invoice-preview__col-qty"    >
          <input class="qt-input-prepend" 
          decimalNumber
          [value]="product.quantity"
          (onChange)="product.quantity=$event"
          />
         </td>
        <td class="invoice-preview__col-tax"  [innerHTML]="getSelectedTaxes(product.item.taxes)">   
        </td>
        <td class="invoice-preview__col-amount" [textContent]="getPriceProduct(product) | currency"></td>
        <td> <div class="icon__raw-clear qt-ic-c qt-sz-16" (click)="removeProduct(i)"></div></td>
      </tr>
      </ng-template>

        </tbody>
      </table>



    </div>

   
<app-product-list-quote (selectedProductItem)="selectProduct($event)"></app-product-list-quote>
<app-service-list-quote #servicesList [quoteCompany]="quoteCompany" (onSelect)="onAddDefaultService($event)"></app-service-list-quote>

  </div> 

 
  <div   class="qt-df qt-w100 qt-jc-sb qt-color-dark qt-fs-12 qt-ff-gm qt-mb-20 qt-lh-133">

    <div>
      
 <app-invoice-regular-note *ngIf="notes"   [invoiceNotes]="notes" (onUpdateInvoiceData)="updateInvoiceData($event)"></app-invoice-regular-note>
    </div>

    <div>
      <div class="invoice-total qt-color-dark" >
        <div class="qt-df qt-jc-sb qt-fs-13 qt-mb-15">
          <div>Sub Total Services</div>
          <div [textContent]="getSubTotalServices() | currency"></div>
        </div>
        <div class="qt-df qt-jc-sb qt-fs-13 qt-mb-15"  >
          <div>Sub Total Products</div>
          <div [textContent]="getSubTotalProducts() | currency"></div>
        </div>
        <div class="qt-df qt-jc-sb qt-fs-13 qt-mb-15">
          <div>Tax</div>
          <div [textContent]="getTotalTaxes() | currency"></div>
        </div>
        <div class="qt-df qt-jc-sb qt-pt-15 invoice-total__total-line">
          <div class="qt-fs-13 qt-fw-b">Total</div>
          <div class="qt-fs-16 qt-fw-b" [textContent]="getSubTotal() | currency"></div>
        </div>  
      </div>

    </div>

  </div>  

  <div class="terms-n-conditions qt-pl-30 qt-pr-30 qt-pb-24 qt-pt-16">

    <div class="qt-fs-13 qt-ff-gm qt-mb-12">Terms & Conditions</div>
    <div class="qt-fs-12 qt-color-info qt-ff-gm pointer"  *ngIf="changeGlobalNote" (click)="onUpdateGlobalNote()">Save Terms & Conditions</div>

    <textarea id="description-global-note" (input)="onCheckUpdateGlobalNote()" class="terms-n-conditions__textarea qt-textarea" placeholder="Enter the terms and conditions of your business to be displayed in your transaction" appTextArea    maxlength="250"   cols="30" rows="1"></textarea>

  </div>

</div>
