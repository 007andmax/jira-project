
<div class="page-list quotes-page">

  <div class="qt-df qt-fd-c qt-jc-sb quotes-page__list-container">
    <div>
      <app-quotes-header (onCreatePayment)="onCreatePayment()" (onSortBy)="sortBy($event)"></app-quotes-header>
      <div class="table-container"  *ngIf="!showPreloader">
        <table class="qt-table-modern quotes-table">
          <tbody
          infiniteScroll
          [infiniteScrollDistance]="2"
          [infiniteScrollThrottle]="50"
          [infiniteScrollDisabled]="infiniteScrollDisabled"
          (scrolled)="onScroll()">
       <ng-template ngFor let-quote
                    [ngForOf]="quotes"
                    [ngForTrackBy]="trackById">
                    <app-quotes-item [quote]="quote"
                    (onResend)="resend($event)"
                    (onConvertToInvoice)="convertToInvoice($event)"
                    (onConvertToTicket)="convertToTicket($event)"
                    (onApproveQuote)="approveQuote($event)"
                    (onMarkAsRead)="markAsRead($event)"
                    (onCancelQuote)="cancelQuote($event)"
                    (onArchiveQuote)="archiveQuote($event)"
                    (onGoToQuoteEdit)="goToQuoteEdit($event)"
                    (onDownloadPdf)="downloadPdf($event)"
                    (onPreview)="preview($event)" ></app-quotes-item>
       </ng-template>
     </tbody>
        </table>
        <div class="loading" *ngIf="showPreloader"></div>
      </div>
    </div>

    <div class="total-info">
      <div class="loading pengind-loading" *ngIf="showPendingPreloader"></div>
    </div>

  </div>
</div>
