<!--<app-left-panel-billing [ngClass]="{'show': isMobileFilterShowing }"></app-left-panel-billing>-->
<div class="quotes">
  <div class="quotes__header">
    <div class="quotes__header--top">
      <h1>Quotes</h1>
      <div class="quotes-actions">
        <div class="input-field">
          <app-multi-datepicker (selectedDate)="filterByDate($event)"></app-multi-datepicker>
        </div>
        <div class="input-field w-280">
          <app-select-client-company style="width: 75%;"
                                     class="light-dropdown"
                                     (selectedItem)="selectClient($event)">
          </app-select-client-company>
        </div>
        <div class="input-field w-160">
          <input type="text"
                 placeholder="Search by number"
                 [(ngModel)]="searchNumber"
                 (blur)="setNumberOnBlur()"
                 (keydown)="setNumberEnter($event)">
        </div>
        <div class="input-field w-160 light-dropdown"
             ngbDropdown>
          <input type="text"
                 [(ngModel)]="selectedStatus"
                 class="pointer"
                 id="dropdownBasic1"
                 ngbDropdownToggle
                 placeholder="Sort by">
          <i *ngIf="selectedStatus"
             class="icn-sm icn-remove-old"
             (click)="clearStatus()"></i>
          <i *ngIf="!selectedStatus"
             class="icn-sm report-caret-icon"></i>
          <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
            <button ngbDropdownItem *ngFor="let item of quoteStatuses" (click)="setStatus(item)">{{item.name}}</button>
          </div>
        </div>
        <button class="btn-new btn-success"
                type="button" (click)="goToCreate()">
          Сreate Quotation
        </button>
      </div>
    </div>
    <div class="quotes__header--bottom row">
      <div class="col-md-1 w-1-5">
        <label class="control checkbox">
          <input type="checkbox">
          <span class="control-indicator"
                style="margin-top: 3px;">
          </span>
        </label>
      </div>
      <div class="col-md-1 pointer" (click)="sortBy('number')">Quote No.</div>
      <div class="col-md-3 pointer" (click)="sortBy('customerName')">Company name</div>
      <div class="col-md-2 pointer" (click)="sortBy('date')">Date</div>
      <div class="col-md-1 pointer" (click)="sortBy('validUntil')">Valid Until</div>
      <div class="col-md-1 pointer" (click)="sortBy('amount')">Amount</div>
      <div class="col-md-1 pointer" (click)="sortBy('deposit')">Deposit</div>
      <div class="col-md-1 pointer">Status</div>
    </div>
  </div>
  <div class="quotes__content"
       *ngIf="quotesList.length"
       infiniteScroll
       [infiniteScrollDistance]="2"
       [infiniteScrollThrottle]="50"
       [infiniteScrollDisabled]="infiniteScrollDisabled"
       (scrolled)="onScroll()">
    <div class="quotes__content--item row"
         *ngFor="let item of quotesList">
      <div class="col-md-1 w-1-5">
        <label class="control checkbox">
          <input type="checkbox">
          <span class="control-indicator"
                style="margin-top: 3px;">
          </span>
        </label>
      </div>
      <div class="col-md-1 pointer"
           (click)="goToPreview(item)"
      >#{{item.number}}
      </div>
      <div class="col-md-3 g-m">{{item.company.name}}</div>
      <div class="col-md-2">{{getDate(item.date)}}</div>
      <div class="col-md-1">{{getDate(item.validUntil)}}</div>
      <div class="col-md-1">{{item.totalAmount | currency}}</div>
      <div class="col-md-1">{{item.partialDeposit}}</div>
      <div class="col-md-1 df jc-sb">
        <div class="quote-status" [ngClass]="getClass(item.status)"> {{item.status}}</div>
        <div ngbDropdown class="light-dropdown to-left df ai-c">
          <i class="icn-sm icn-more-light-grey pointer"
             style="height: 100%;background-position: -1664px 9px;"
             id="status" ngbDropdownToggle></i>
          <div
            class="dropdown-menu show"
            style="width: 170px;"
            ngbDropdownMenu
            aria-labelledby="status">
            <button
              class="dropdown-item"
              (click)="resend(item)"
              ngbDropdownItem>
              Resend quote
            </button>
            <button
              class="dropdown-item"
              ngbDropdownItem
              *ngIf="checkStatus(item, ['APPROVED'])"
              (click)="convertToInvoice(item)">
              Convert to Invoice
            </button>
            <button
              class="dropdown-item"
              ngbDropdownItem
              *ngIf="checkStatus(item, ['APPROVED'])"
              (click)="convertToTicket(item)">
              Convert to Ticket
            </button>
            <button
              class="dropdown-item"
              ngbDropdownItem
              *ngIf="checkStatus(item, ['DRAFT', 'READ', 'EXPIRED', 'UNREAD'])"
              (click)="approveQuote(item)">
              Approve a quote
            </button>
            <button
              class="dropdown-item"
              ngbDropdownItem
              *ngIf="checkStatus(item, ['UNREAD'])"
              (click)="markAsRead(item)">
              Mark as Read
            </button>
            <button
              class="dropdown-item"
              ngbDropdownItem
              *ngIf="checkStatus(item, ['READ','UNREAD'])"
              (click)="refuseQuote(item)">
              Refuse a quote
            </button>
            <button
              class="dropdown-item"
              ngbDropdownItem
              *ngIf="checkStatus(item, ['UNREAD','DRAFT', 'EXPIRED', 'INVOICED', 'TICKETED'])"
              (click)="archiveQuote(item)">
              Archive a quote
            </button>
            <button
              class="dropdown-item"
              ngbDropdownItem
              *ngIf="checkStatus(item, ['READ','UNREAD','DRAFT', 'APPROVED', 'REFUSED', 'EXPIRED'])"
              (click)="goToQuoteEdit(item)">
              Edit a quote
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="loading" *ngIf="!quotesList.length"></div>
</div>
