<div
    class="quotes-page__aside invoices-page__aside qt-aside-modern --x-large aside-preview"
    [hidden]="!open"
>
    <div class="qt-aside-modern__header">
      <div class="qt-aside-modern__header-title">Edit Quote</div>
      <div class="qt-aside-modern__header-close icon__close" (click)="close()"></div>
    </div>
    <div class="qt-aside-modern__content --no-padding">
        <div
            class="loading"
            *ngIf="showPreloader"
        ></div>
        <div class="qt-pl-30 qt-pr-30 qt-pt-24 quote-aside-scroll-content">
            <app-quote-aside-edit-body
                #quoteEdit
                [validate]="validate"
                [hidden]="showPreview"
                (onStopPreloader)="showPreloader = false"
            ></app-quote-aside-edit-body>
            <app-quote-aside-preview-body
                *ngIf="showPreview"
                [quote]="quotePreview"
            ></app-quote-aside-preview-body>
        </div>
    </div>
    <div class="qt-aside-modern__footer"  *ngIf="!showPreloader">
      <div class="qt-df">
        <div
            class="qt-pos-rel"
            ngbDropdown
            [placement]="'top-right'"
        >
            <ul
                class="qt-dropdown-menu"
                ngbDropdownMenu
                aria-labelledby="dropdownUpdate"
            >
                <li
                    *ngIf="getEditQuote() && getEditQuote().status !== 'APPROVED'"
                    ngbDropdownItem
                    appDisabledBtn
                    #saveAndApproveBtn="disabled"
                    (onClick)="saveAndApprove()"
                >
                    <div class="icon__print qt-sz-16 qt-mr-8"></div>
                    Save and Approve
                </li>
                <li
                    ngbDropdownItem
                    appDisabledBtn
                    #saveAndDownloadBtn="disabled"
                    (onClick)="saveAndDownload()"
                >
                    <div class="icon__download qt-sz-16 qt-mr-8"></div>
                    Save and Download
                </li>
                <li
                    ngbDropdownItem
                    appDisabledBtn
                    #saveAndSendBtn="disabled"
                    (onClick)="saveAndContinue()"
                >
                    <div class="icon__download qt-sz-16 qt-mr-8"></div>
                    Save and Continue
                </li>
            </ul>
            <button class=" qt-button --with-menu qt-mr-12">
                <span
                    class="save-billable-aside-btn left-side"
                    appDisabledBtn
                    #saveAndContinueBtn="disabled"
                    (onClick)="saveAndSend()"
                >
                    <span *ngIf="!saveAndSendBtn.isBlock() && !saveAndContinueBtn.isBlock() && ((saveAndApproveBtn) ?  !saveAndApproveBtn.isBlock() : true) && !saveAndDownloadBtn.isBlock()">Save and Send</span>
                    <app-preloader-ticket *ngIf="saveAndSendBtn.isBlock() || saveAndContinueBtn.isBlock() || saveAndApproveBtn &&  saveAndApproveBtn.isBlock() || saveAndDownloadBtn.isBlock()"></app-preloader-ticket>
                </span>
                <div
                    class="button-menu"
                    id="dropdownUpdate"
                    ngbDropdownToggle
                >
                    <div class="qt-sz-16 qt-ic-c icon__dropdown-arrow-up"></div>
                </div>
            </button>
        </div>
        <button
            class="qt-button --outline"
            *ngIf="!showPreview"
            (click)="onPreview()"
        >
            Preview
        </button>
        <button
            class="qt-button --outline"
            *ngIf="showPreview"
            (click)="showPreview = false"
        >
            Edit
        </button>
    </div>
    </div>
</div>
