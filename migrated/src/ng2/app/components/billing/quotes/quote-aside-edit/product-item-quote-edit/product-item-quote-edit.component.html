<tr>
  <td class="invoice-preview__col-item" [textContent]="product.manufacture"> </td>
  <td class="invoice-preview__col-desc"  ><input type="text" [(ngModel)]="product.description"  /></td>
  <td class="invoice-preview__col-price"  ><input class="qt-input-prepend" 
      decimalNumber
    [useFixed]="true"
    placeholder="0.00"
    [value]="product.cost"
    (blur)="onCheckSaleCost()"
    (onChange)="product.cost=$event"
      /></td>
  <td class="invoice-preview__col-price"  >
    <input class="qt-input-prepend" 
      decimalNumber
    [useFixed]="true"
    placeholder="0.00"
    [value]="product.markup"
    (onChange)="product.markup=$event"
      />
  </td>
  <td class="invoice-preview__col-price"  >
    <input class="qt-input-prepend" 
    [ngClass]="{'--input-error':!product.validateSaleCost}"
    decimalNumber
  [useFixed]="true"
  placeholder="0.00"
  [value]="product.sale"
  (onChange)="product.sale=$event"
  (blur)="onCheckSaleCost()"
    />
    <mat-error class="qt-tooltip-error" *ngIf="!product.validateSaleCost">
      Product price can not be lower than cost
    </mat-error>
  </td>
   <td class="invoice-preview__col-qty"    >
    <input class="qt-input-prepend" 
    decimalNumber
    [value]="product.quantity"
    (onChange)="product.quantity=$event"
    />
   </td>
  <td class="invoice-preview__col-tax"  [innerHTML]="getSelectedTaxes(product.taxes)">   
  </td>
  <td class="invoice-preview__col-amount" [textContent]="getPriceProduct(product) | currency"></td>
  <td> <div class="icon__raw-clear qt-ic-c qt-sz-16" (click)="removeProduct(i)"></div></td>
</tr>
