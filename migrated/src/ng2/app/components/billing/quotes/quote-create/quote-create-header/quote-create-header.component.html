<div class="quote-create__header">
  <h1>Create Quote</h1>
  <div class="quote-create__header--actions">
    <button class="btn-new disabled" (click)="returnToQuotes()">Back</button>
    <button class="btn-new disabled" (click)="goToState('quote-preview-component')">Preview</button>
    <div class="btn-new btn-success df">
      <button type="button" (click)="saveQuotes()">Save and Continue</button>
      <div class="light-dropdown" ngbDropdown role="group" aria-label="Button group with nested dropdown">
        <button class="dropdown-toggle-split" ngbDropdownToggle>
          <i class="icn-sm pointer report-caret-icon-white"></i>
        </button>
        <div class="dropdown-menu" ngbDropdownMenu>
          <button class="dropdown-item" ngbDropdownItem (click)="approveQuote()">Approve a quote</button>
          <button class="dropdown-item" ngbDropdownItem (click)="downloadPdf()">Save and Download</button>
          <button class="dropdown-item" ngbDropdownItem (click)="saveAndSend()">Save and Send</button>
        </div>
      </div>
    </div>

  </div>
</div>
