<div class="row" *ngFor="let productItem of productItemsArray;  let i = index">
  <div class="col-md-2">
    <input type="text"
           (click)="toggleShowServices()"
           placeholder=""
           readonly
           [(ngModel)]="productItem && productItem.manufacture">
    <app-services-list [client]="client"
                       *ngIf="showServices && !i"
                       (selectedProductItem)="setServiceItem($event)"></app-services-list>
  </div>
  <div class="col-md-2">
    <input type="text"
           readonly
           [(ngModel)]="productItem && productItem.description"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [(ngModel)]="productItem && productItem.cost"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [(ngModel)]="productItem && productItem.sale"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [(ngModel)]="productItem && productItem.cost"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           placeholder="">
  </div>
  <div class="col-md-1 text-right">$0.00</div>
  <i class="icn-delete"></i>
</div>
