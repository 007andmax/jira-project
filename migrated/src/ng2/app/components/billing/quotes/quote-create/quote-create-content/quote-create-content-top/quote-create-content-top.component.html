<div class="quote-create__content--top row">
  <div class="col-md-4">
    <div class="quote-create-field">
      <app-select-client-company></app-select-client-company>
    </div>
  </div>
  <div class="col-md-4">
    <div class="quote-create-field">
      <p>Quote Date</p>
      <input type="text"
             placeholder=""
             class="pointer">
      <i class="new-calendar"></i>
    </div>
    <div class="quote-create-field">
      <p>Valid Until</p>
      <input type="text"
             placeholder=""
             class="pointer">
      <i class="new-calendar"></i>
    </div>
    <div class="quote-create-field">
      <p>Partial/ Deposit</p>
      <input type="text"
             placeholder="">
    </div>
    <div class="request-payments">
      <div></div>
      <div><label class="control checkbox">
        <input type="checkbox">
        <span class="control-indicator"
              style="margin-top: 3px;">
          </span>
        <p>Request payment</p>
      </label></div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="quote-create-field">
      <p>Quote #</p>
      <input type="text"
             placeholder="">
    </div>
    <div class="quote-create-field">
      <p>PO #</p>
      <input type="text"
             placeholder="">
    </div>
  </div>
</div>
