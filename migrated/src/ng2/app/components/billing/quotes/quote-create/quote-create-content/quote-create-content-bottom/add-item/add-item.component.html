<div class="row" *ngIf="type && (itemListServices || itemListProducts)">
  <div class="col-md-1"
       (clickOutside)="hideDropDown($event)">
    <div *ngIf="type === 'service'"
         class="light-dropdown">
      <input class="pointer"
             type="text"
             (click)="toggleShowDropDown()"
             [ngClass]="{'no-valid': isFormValid}"
             placeholder="Service">
      <i class="icn-sm report-caret-icon"></i>
      <app-services-list
        *ngIf="isDropDownShow"
        [itemList]="itemListServices"
        (selectedServicesItem)="setItem($event)"></app-services-list>
    </div>
    <div *ngIf="type === 'product'"
         class="product-dropdown-new-ng light-dropdown">
      <input class="pointer"
             type="text"
             (click)="toggleShowDropDown()"
             [ngClass]="{'no-valid': isFormValid}"
             placeholder="Product">
      <i class="icn-sm report-caret-icon"></i>
      <app-product-list *ngIf="isDropDownShow"
                        [itemList]="itemListProducts"
                        (selectedProductItem)="setItem($event)"></app-product-list>
    </div>
  </div>
  <div class="col-md-2">
    <input type="text"
           [ngClass]="{'no-valid': isFormValid}"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [ngClass]="{'no-valid': isFormValid}"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [ngClass]="{'no-valid': isFormValid}"
           readonly
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [ngClass]="{'no-valid': isFormValid}"
           readonly
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [ngClass]="{'no-valid': isFormValid}"
           placeholder="">
  </div>
  <div class="col-md-1 text-right">
    <i class="icn-delete" (click)="hideAddForm()"></i>
  </div>
</div>
