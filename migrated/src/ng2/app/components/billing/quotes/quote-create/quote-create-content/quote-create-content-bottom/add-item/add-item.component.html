<div class="row" *ngIf="type && (itemListServices || itemListProducts)">
  <!-- IF SERVICE -->
  <div class="col-md-1"
       style="width: 23%;"
       *ngIf="type === 'service'"
       (clickOutside)="hideDropDown($event)">
    <div class="light-dropdown">
      <app-services-list [itemList]="itemListServices"
                         (selectedServicesItem)="setItem($event)"></app-services-list>
      <i class="icn-sm report-caret-icon"></i>
      <!--<input class="pointer"
              type="text"
              (click)="toggleShowDropDown()"
              [ngClass]="{'no-valid': isFormValid}"
              placeholder="Service">
       <i class="icn-sm report-caret-icon"></i>
       <app-services-list
         *ngIf="isDropDownShow"
         [itemList]="itemListServices"
         (selectedServicesItem)="setItem($event)"></app-services-list>-->
    </div>
  </div>
  <div class="col-md-2"
       *ngIf="type === 'service'">
    <div class="editable-description">
       <textarea
         appTextArea
         [limit]="250"
         [ngClass]="{'no-valid': isFormValid}"
         placeholder=""></textarea>
    </div>
  </div>

  <!-- IF PRODUCT -->
  <div class="col-md-3"
       style="width: 59%;"
       *ngIf="type === 'product'">
    <div class="product-dropdown-new-ng light-dropdown">
      <app-product-list [itemList]="itemListProducts"
                        (selectedProductItem)="setItem($event)"></app-product-list>
      <i class="icn-sm report-caret-icon"></i>
      <!-- <input class="pointer"
               type="text"
               (click)="toggleShowDropDown()"
               [ngClass]="{'no-valid': isFormValid}"
               placeholder="Product">
        <i class="icn-sm report-caret-icon"></i>
        <app-product-list *ngIf="isDropDownShow"
                          [itemList]="itemListProducts"
                          (selectedProductItem)="setItem($event)"></app-product-list>-->
    </div>
  </div>

  <div class="col-md-1 with-dollar">
    <input type="text"
           [ngClass]="{'no-valid': isFormValid}"
           [disabled]="type === 'service'"
           placeholder="">
  </div>
  <div class="col-md-1 with-percent">
    <input type="text"
           [ngClass]="{'no-valid': isFormValid}"
           [disabled]="type === 'service'"
           placeholder="">
  </div>
  <div class="col-md-1 with-dollar">
    <input type="text"
           [ngClass]="{'no-valid': isFormValid}"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [ngClass]="{'no-valid': isFormValid}"
           placeholder="">
  </div>
  <i class="icn-delete" (click)="hideAddForm()"></i>
</div>
