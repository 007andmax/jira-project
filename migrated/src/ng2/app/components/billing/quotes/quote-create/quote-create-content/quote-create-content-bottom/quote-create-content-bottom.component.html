<div class="quote-create__content--bottom">
  <div class="quote-content-header row">
    <div class="col-md-1">Item</div>
    <div class="col-md-2">Description</div>
    <div class="col-md-1">Unit Cost</div>
    <div class="col-md-1">Markup </div>
    <div class="col-md-1">Sale price </div>
    <div class="col-md-1">Quantity</div>
    <div class="col-md-1 text-right">Line Total</div>
  </div>
  <div class="quote-content-body-choose row" *ngIf="client">
    <div class="col-md-12">
      <div class="new-link" (click)="addService()">Add Service</div>
      <p>Or</p>
      <div class="new-link" (click)="addProduct()">Add Product</div>
    </div>
  </div>
  <div class="quote-content-body row">
    <app-product-table
      [itemsArray]="itemsArray"
    >
    </app-product-table>
    <app-add-item [setType]="type"
                  (changeType)="changeType($event)"
                  (selectedServiceItem)="addItemToItemsArray($event)"></app-add-item>
    <div class="quote-content-body--bottom">
      <div class="col-md-11 text-right">Sub Total Services</div>
      <div class="col-md-1 text-right">{{subTotalServices | currency}}</div>
      <div class="col-md-11 text-right">Sub Total Products</div>
      <div class="col-md-1 text-right">{{subTotalProducts | currency}}</div>
      <div class="col-md-11 text-right">Taxes</div>
      <div class="col-md-1 text-right">{{totalTaxes | currency}}</div>
      <div class="col-md-11 mt-10 text-right">Total</div>
      <div class="col-md-1 mt-10 text-right">{{total | currency}}</div>
    </div>
  </div>
</div>
