<div class="quote-create__content--bottom">
  <div class="quote-content-header row">
    <div class="col-md-2">Item</div>
    <div class="col-md-2">Description</div>
    <div class="col-md-1">Unit Cost</div>
    <div class="col-md-1">Markup </div>
    <div class="col-md-1">Sale price </div>
    <div class="col-md-1">Quantity</div>
    <div class="col-md-1 text-right">Line Total</div>
  </div>
  <div class="quote-content-body-choose row" *ngIf="client">
    <div class="col-md-12">
      <div class="new-link" (click)="addService()">Add Service</div>
      <p>Or</p>
      <div class="new-link" (click)="addProduct()">Add Product</div>
    </div>
  </div>
  <div class="quote-content-body row">
    <app-product-table
      *ngIf="productItemsArray && productItemsArray.length > 0"
      [productItemsArray]="productItemsArray">
    </app-product-table>
    <div class="quote-content-body--bottom">
      <div class="col-md-11 text-right">Sub Total</div>
      <div class="col-md-1 text-right">$0.00</div>
      <div class="col-md-11 text-right">Paid to date</div>
      <div class="col-md-1 text-right">$0.00</div>
      <div class="col-md-11 mt-10 text-right">Total</div>
      <div class="col-md-1 mt-10 text-right">$0.00</div>
    </div>
  </div>
</div>
