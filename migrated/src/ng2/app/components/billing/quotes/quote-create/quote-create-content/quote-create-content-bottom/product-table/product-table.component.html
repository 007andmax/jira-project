<ng-template ngFor let-item [ngForOf]="itemsListArray" let-i="index" [ngForTrackBy]="trackById">
<div class="row fixed-width">
  <!-- IF SERVICE -->
  <div class="col-md-1"
       *ngIf="!getMarkup(item)">
    <div class="light-dropdown">
      <app-services-list [type]="TYPE_QUOTE" [editItem]="item" [itemList]="servicesList"
                         (selectedServicesItem)="setItem($event, i, 'service')"></app-services-list>
      <i class="icn-sm report-caret-icon"></i>
      <!--  <input type="text"
               class="pointer"
               placeholder=""
               (click)="toggleShowDropDown(i)"
               [(ngModel)]="item.name || item.description ">
        <i class="icn-sm report-caret-icon"></i>
        <app-services-list
          *ngIf="isDropDownShow[i] && !getMarkup(item)"
          [itemList]="servicesList"
          (selectedServicesItem)="setItem($event, i, 'service')"></app-services-list>-->
    </div>
  </div>
  <div class="col-md-2"
       *ngIf="!getMarkup(item)">
    <div class="editable-description">
       <textarea
         [minHeight]="38"
         [(ngModel)]="item && item.description"
         appTextArea
         [limit]="250"></textarea>
    </div>
  </div>

  <!-- IF PRODUCT -->
  <div class="col-md-3"
       *ngIf="getMarkup(item)">
    <div class="product-dropdown-new-ng light-dropdown">
      <app-product-list [type]="'QUOTE'" [editItem]="item" [itemList]="productList"
                        (selectedProductItem)="selectProduct($event, i)"></app-product-list>
      <!-- <input type="text"
              class="pointer"
              placeholder=""
              (click)="toggleShowDropDown(i)"
              [(ngModel)]="item.name || item.description ">-->
      
      <!-- <app-product-list
         *ngIf="isDropDownShow[i] && getMarkup(item)"
         [itemList]="productList"
         (selectedProductItem)="setItem($event, i, 'product')"></app-product-list>-->


    </div>
  </div>

  <div class="col-md-4 with-dollar">
    <input type="text"
           number
           [money]="true"
           [disabled]="!getMarkup(item)"
           [ngModel]="item.cost"
           (ngModelChange)="changeCost($event, i)"
           placeholder="">
  </div>
  <div class="col-md-4 with-percent">
    <input type="text"
    number
    [money]="true"
           [ngModel]="item.markup"
           [disabled]="!getMarkup(item)"
           (ngModelChange)="changeMarkup($event, i)"
           placeholder="">
  </div>
  <div class="col-md-4 with-dollar">
    <input type="text"
           number
           [money]="true"
           [disabled]="!getMarkup(item)"
           [ngModel]="(item.sale || item.rate)"
           (ngModelChange)="changeSales($event, i)"
           placeholder="">
  </div>
  <div class="col-md-4">
    <input type="text"
           number

           [(ngModel)]="item && item.quantity"
           (ngModelChange)="changedQuantity($event, i)"
           placeholder="">
  </div>
  <div class="col-md-5 text-right"
       style="padding: 8px 15px;">
    {{getTaxPrice((item.sale || item.rate), item.quantity, item.taxes) | currency}}
  </div>
  <div class="col-md-5 text-right"
       style="padding: 8px 15px;">
    {{getPrice((item.sale || item.rate), item.quantity, item.taxes) | currency}}
  </div>
  <i class="icn-delete" (click)="deleteItem(i)"></i>
</div>
</ng-template>
