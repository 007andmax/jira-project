<div class="row" *ngFor="let item of itemsListArray;  let i = index">
  <div class="col-md-1"
       [ngClass]="{'col-md-2': getMarkup(item)}">
    <input type="text"
           placeholder=""
           (click)="toggleShowDropDown(i)"
           [(ngModel)]="item.name || item.description ">
    <app-product-list
      *ngIf="isDropDownShow[i] && getMarkup(item)"
      [itemList]="productList"
      (selectedProductItem)="setItem($event, i, 'product')"></app-product-list>
    <app-services-list
      *ngIf="isDropDownShow[i] && !getMarkup(item)"
      [itemList]="servicesList"
      (selectedServicesItem)="setItem($event, i, 'service')"></app-services-list>

  </div>
  <div class="col-md-2"
       [ngClass]="{'d-none': getMarkup(item)}">
    <input type="text"
           [(ngModel)]="item && item.description"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [(ngModel)]="item.rate || item.cost"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [(ngModel)]="item.markup"
           [readonly]="!getMarkup(item)"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [readonly]="!getMarkup(item)"
           [(ngModel)]="item && item.sale"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [(ngModel)]="item && item.quantity"
           (ngModelChange)="changedQuantity($event, i)"
           placeholder="">
  </div>
  <div class="col-md-1 text-right">{{getTaxPrice((item.sale || item.rate), item.quantity, item.taxes[0])}}</div>
  <div class="col-md-1 text-right">{{getPrice((item.sale || item.rate), item.quantity, item.taxes[0])}}</div>
  <div class="col-md-1">
    <i class="icn-delete" (click)="deleteItem(i)"></i>
  </div>
</div>

//service немає markup sale price
//product немає descricpition
