<div class="row" *ngFor="let item of itemsListArray;  let i = index">
  <div class="col-md-1">
    <input type="text"
           placeholder=""
           (click)="toggleShowDropDown()"
           [(ngModel)]="item.name || item.description ">
    <app-product-list *ngIf="isDropDownShow"
                      [itemList]="itemListProducts"
                      (selectedProductItem)="setItem($event)"></app-product-list>
  </div>
  <div class="col-md-2">
    <input type="text"
           readonly
           [(ngModel)]="item && item.description"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [(ngModel)]="item.rate || item.cost"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [(ngModel)]="item.markup"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"_w
           [(ngModel)]="item && item.sale"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [(ngModel)]="item && item.quantity"
           (ngModelChange)="changedQuantity($event, i)"
           placeholder="">
  </div>
  <div class="col-md-1 text-right">{{getTaxPrice((item.sale || item.rate), item.quantity, item.taxes[0])}}</div>
  <div class="col-md-1 text-right">{{getPrice((item.sale || item.rate), item.quantity, item.taxes[0])}}</div>
  <div class="col-md-1">
    <i class="icn-delete" (click)="deleteItem(i)"></i>
  </div>
</div>
