<div class="row" *ngFor="let item of itemsListArray;  let i = index">
  <div class="col-md-1">
    <input type="text"
           placeholder=""
           readonly
           [(ngModel)]="item.name || item.description ">
  </div>
  <div class="col-md-2">
    <input type="text"
           readonly
           [(ngModel)]="item && item.description"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [(ngModel)]="item && item.cost"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [(ngModel)]="item && item.sale"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           [(ngModel)]="item && item.quantity"
           placeholder="">
  </div>
  <div class="col-md-1">
    <input type="text"
           placeholder="">
  </div>
  <div class="col-md-1 text-right">{{getPrice((item.cost || item.rate), item.quantity, item.taxes[0])}}</div>
  <div class="col-md-1">
    <i class="icn-delete"></i>
  </div>
</div>
