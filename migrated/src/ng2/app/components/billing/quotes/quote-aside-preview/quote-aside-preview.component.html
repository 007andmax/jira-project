    <div class="invoice-preview qt-pos-rel">
      <div class="invoice-preview__status" ></div> <!--[ngClass]="{'--paid': invoiceProfile.paidOn, '--overdue': invoiceProfile.isOverDue && !invoiceProfile.paidOn}"-->
  
      <div class="qt-df qt-jc-sb qt-pb-24 company-info">
        <div class="qt-lh-154">
          <img class="company-logo qt-mb-8" [src]="getCompanyLogoUrl()" alt="">
          <div class="qt-fs-13 qt-color-dark qt-ff-gm" [textContent]="currentCompany.name"></div>
          <div class="qt-fs-13" [textContent]="currentCompany.senderAddress"></div>
          <div class="qt-fs-13" [textContent]="(currentCompany.phoneNumbers && currentCompany.phoneNumbers.length > 0) ? currentCompany.phoneNumbers[0].number : ''"></div>
        </div>
  
        <div class="qt-color-dark qt-lh-131 qt-pr-24 qt-fs-26 qt-text-upper qt-ff-gm" [textContent]="'Quote#' + quote.number">
  
        </div>
      </div>
  
      <div class="qt-mt-24 qt-mb-32 qt-df qt-jc-sb">
        <div class="qt-lh-154">
          <div class="qt-fs-10 qt-color-light qt-mb-8 qt-ff-sb qt-lh-12">BILLING ADDRESS</div>
          <div class="qt-fs-13 qt-color-dark qt-ff-gm" [textContent]="quote.company.name"></div>
          <div class="qt-fs-13"    [textContent]="(quote.company.addresses.length > 0 && quote.company.addresses[0].address) ? quote.company.addresses[0].address : ''"></div>
          <ng-container *ngIf="quote.company.addresses.length > 0 && quote.company.addresses[0].phoneNumbers">
            <ng-template  ngFor let-item [ngForOf]="quote.company.addresses[0].phoneNumbers"   >
           <div class="qt-fs-13"  [textContent]="item.number"></div>
           </ng-template> 
         </ng-container>
          
          </div>
  
        <div class="qt-fs-13 qt-text-right qt-lh-154">
          
          <div class="qt-df qt-jc-sb qt-mb-8">
            <div class="qt-ff-gm qt-text-right invoice-info-title">Estimate Date:</div>
            <div class="invoice-info-value" [textContent]="getDate(quote.startDate)"></div>
          </div>
          <div class="qt-df qt-jc-sb qt-mb-8">
            <div class="qt-ff-gm qt-text-right invoice-info-title">Expiry Date:</div>
            <div class="invoice-info-value" [textContent]="getDate(quote.endDate)"></div>
          </div>
          <div class="qt-df qt-jc-sb qt-mb-8">
            <div class="qt-ff-gm qt-text-right invoice-info-title">Grand Total:</div>
            <div class="invoice-info-value" [textContent]="quote.total | currency"></div>
          </div>
        </div>
      </div>
  
      <div class="invoice-preview__items">
       
        <div class="qt-mb-16">
          <table class="invoice-preview__table">
            <thead class=" qt-lh-127">
              <tr>
                <th class="invoice-preview__col-item">Item</th>
                <th class="invoice-preview__col-desc">Description</th>
                <th class="invoice-preview__col-price">Unit Price</th>
                <th class="invoice-preview__col-qty">Quantity</th>
                <th class="invoice-preview__col-tax">Tax</th>
                <th class="invoice-preview__col-amount">Amount</th>
              </tr>
            </thead>
            <tbody class=" qt-lh-133">
              <ng-template ngFor let-service
              [ngForOf]="quote.services"
              [ngForTrackBy]="trackById">
              <tr>
                <td class="invoice-preview__col-item" [textContent]="service.name"></td>
                <td class="invoice-preview__col-desc" [textContent]="service.description"></td>
                <td class="invoice-preview__col-price" [textContent]="service.rate | currency"></td>
                <td class="invoice-preview__col-qty"   [textContent]="service.quantity"></td>
                <td class="invoice-preview__col-tax" [innerHTML]="getSelectedTaxes(service.taxes)"></td>
              <td class="invoice-preview__col-amount" [textContent]="service.sum | currency"></td>
              </tr>
  </ng-template>
  <ng-template ngFor let-product
  [ngForOf]="quote.products"
  [ngForTrackBy]="trackById">
          <tr>
            <td class="invoice-preview__col-item" [textContent]="product.manufacture"> </td>
            <td class="invoice-preview__col-desc" [textContent]="product.description"></td>
            <td class="invoice-preview__col-price" [textContent]="product.sale | currency"></td>
             <td class="invoice-preview__col-qty"   [textContent]="product.quantity"></td>
            <td class="invoice-preview__col-tax" [innerHTML]="getSelectedTaxes(product.taxes)"></td>
            <td class="invoice-preview__col-amount" [textContent]="product.sum | currency"></td>
          </tr>
          </ng-template>
  
            </tbody>
          </table>
  
  
  
        </div>
 
  
  
  
      </div>
