<tr >
  <td class="billable-payment-table__date" [textContent]="payment.createdAt" (click)="showDetailsPayment()"></td>
  <td class="billable-payment-table__invoice" [innerHTML]="getInvoices()" (click)="onShowPreviewInvoice()"></td>
  <td class="billable-payment-table__company" [textContent]="payment.clientCompanyName" (click)="showDetailsPayment()"></td>
  <td class="billable-payment-table__payment-mode" [textContent]="parsePaymentMethod(payment.paymentMethod)" (click)="showDetailsPayment()"></td>
  <td class="billable-payment-table__reference" [textContent]="payment.reference" (click)="showDetailsPayment()"></td>
  <td class="billable-payment-table__payment"  ><ng-template #tipContent><div [textContent]="payment.note"></div></ng-template>
    <div class="icon__payment-note qt-sz-24 qt-ic-c qt-mr-8 payments-page__payment-note-table-icon" *ngIf="payment.note && payment.note.length > 0" placement="top" [ngbTooltip]="tipContent"></div></td>
  <td class="billable-payment-table__amount" [textContent]="(payment.partialPaidAmount || payment.totalSum ) | currency" (click)="showDetailsPayment()"></td>
  <td class="billable-payment-table__status"   (click)="showDetailsPayment()">
    <span class="tag__modern" [ngClass]="payment.refundMethod ? '--error' : '--success'" [textContent]="payment.refundMethod ? 'Refund' : 'Paid'">
    </span>
  </td>
  <td class="billable-payment-table__menu" ngbDropdown>
    <div class="qt-ic-c icon__more  qt-pointer qt-sz-16 qt-bg-contain"  id="dropdownBasic1" ngbDropdownToggle></div>
    <ul class="qt-dropdown-menu invoice-items-dropdown"  ngbDropdownMenu aria-labelledby="dropdownBasic1">
      <li class="pointer" ngbDropdownItem (click)="deletePayment()">Delete payment</li>
      <li class="pointer" ngbDropdownItem (click)="showRefundPayment()">Refund payment</li>

      <li class="pointer" ngbDropdownItem *ngIf="!invoice.readedAt" (click)="markAsRead()"> <div class="icon__mark-as-read qt-sz-16 qt-mr-8"></div> Mark as Read</li>
      <li class="pointer" ngbDropdownItem (click)="exportAsPDF()"> <div class="icon__download-pdf qt-sz-16 qt-mr-8"></div> Export as PDF</li>
      <li class="pointer" ngbDropdownItem *ngIf="invoice.paidOn" (click)="refundPayments()"> <div class="icon__restart qt-sz-16 qt-mr-8"></div> Refund Payments</li>
      <li class="pointer" ngbDropdownItem *ngIf="!invoice.paidOn" (click)="rollbackInvoice()">  <div class="icon__restart qt-sz-16 qt-mr-8"></div> Rollback</li>
      <li class="pointer" ngbDropdownItem (click)="deleteInvoice()"> <div class="icon__remove qt-sz-16 qt-mr-8"></div> Remove</li>
      <li ngbDropdownItem class="payment-menu-item"> <div class="icon__payment-history qt-sz-16 qt-mr-8"></div> Payment history

             >

              </div>

              </div>
            </div>

              <div class="col-md-4">

  </td>
