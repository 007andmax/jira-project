<div class="dashboard-quotes">

  <div class="dashboard-quotes__header qt-mb-16">
    <span [textContent]="stats.getTotal()" class="dashboard-quotes__header-title qt-mr-5"></span>
    <span class="dashboard-quotes__header-subtitle" [textContent]="'Quotes'"></span>
  </div>

  <div class="dashboard-quotes__progress-bar">
      <div class="dashboard-quotes__progress-bar-item" [ngStyle]="{'background-color': '#0747a6','width' :getProcent(stats.APPROVED) + '%'}" *ngIf="stats.APPROVED" ></div>
      <div class="dashboard-quotes__progress-bar-item" [ngStyle]="{'background-color': '#00ccff','width' :getProcent(stats.ARCHIVED) + '%'}" *ngIf="stats.ARCHIVED" ></div>
      <div class="dashboard-quotes__progress-bar-item" [ngStyle]="{'background-color': '#052e6b','width' :getProcent(stats.CANCELED) + '%'}" *ngIf="stats.CANCELED" ></div>
      <div class="dashboard-quotes__progress-bar-item" [ngStyle]="{'background-color': '#16a4fa','width' :getProcent(stats.EXPIRED) + '%'}" *ngIf="stats.EXPIRED" ></div>
      <div class="dashboard-quotes__progress-bar-item" [ngStyle]="{'background-color': '#cdecff','width' :getProcent(stats.INVOICED) + '%'}" *ngIf="stats.INVOICED" ></div>
      <div class="dashboard-quotes__progress-bar-item" [ngStyle]="{'background-color': '#ffb937','width' :getProcent(stats.READ) + '%'}" *ngIf="stats.READ" ></div>
      <div class="dashboard-quotes__progress-bar-item" [ngStyle]="{'background-color': '#2ec866','width' :getProcent(stats.SAVED) + '%'}" *ngIf="stats.SAVED" ></div>
      <div class="dashboard-quotes__progress-bar-item" [ngStyle]="{'background-color': '#7c77cb','width' :getProcent(stats.TICKETED) + '%'}" *ngIf="stats.TICKETED" ></div>
      <div class="dashboard-quotes__progress-bar-item" [ngStyle]="{'background-color': '#ff5263','width' :getProcent(stats.UNREAD) + '%'}" *ngIf="stats.UNREAD" ></div>

  </div>

  <div class="qt-df">
    <ul class="dashboard-quotes__list d-flex">
      <li class="dashboard-quotes__list-item" *ngIf="stats.APPROVED">
        <span style="background-color: #0747a6" class="dashboard-quotes__list-item-box"></span>
        <span class="dashboard-quotes__list-item-label">Approved</span>
        <span class="dashboard-quotes__list-item-value" [textContent]="stats.APPROVED"></span>
      </li>
      <li class="dashboard-quotes__list-item" *ngIf="stats.ARCHIVED">
        <span style="background-color: #00ccff" class="dashboard-quotes__list-item-box"></span>
        <span class="dashboard-quotes__list-item-label">Archived</span>
        <span class="dashboard-quotes__list-item-value" [textContent]="stats.ARCHIVED"></span>
      </li>
      <li class="dashboard-quotes__list-item" *ngIf="stats.CANCELED">
        <span style="background-color: #052e6b" class="dashboard-quotes__list-item-box"></span>
        <span class="dashboard-quotes__list-item-label">Canceled</span>
        <span class="dashboard-quotes__list-item-value" [textContent]="stats.CANCELED"></span>
       </li>
      <li class="dashboard-quotes__list-item" *ngIf="stats.EXPIRED">
        <span style="background-color: #16a4fa" class="dashboard-quotes__list-item-box"></span>
        <span class="dashboard-quotes__list-item-label">Expired</span>
        <span class="dashboard-quotes__list-item-value" [textContent]="stats.EXPIRED"></span>
      </li>
      <li class="dashboard-quotes__list-item" *ngIf="stats.INVOICED">
        <span style="background-color: #cdecff" class="dashboard-quotes__list-item-box"></span>
        <span class="dashboard-quotes__list-item-label">Invoiced</span>
        <span class="dashboard-quotes__list-item-value" [textContent]="stats.INVOICED"></span>
      </li>
  </ul>

  <ul class="dashboard-quotes__list d-flex">
    <li class="dashboard-quotes__list-item" *ngIf="stats.READ">
      <span style="background-color: #ffb937" class="dashboard-quotes__list-item-box"></span>
      <span class="dashboard-quotes__list-item-label">Read</span>
      <span class="dashboard-quotes__list-item-value" [textContent]="stats.READ"></span>
    </li>
    <li class="dashboard-quotes__list-item" *ngIf="stats.SAVED">
      <span style="background-color: #2ec866" class="dashboard-quotes__list-item-box"></span>
      <span class="dashboard-quotes__list-item-label">Draft</span>
      <span class="dashboard-quotes__list-item-value" [textContent]="stats.SAVED"></span>
    </li>
    <li class="dashboard-quotes__list-item" *ngIf="stats.TICKETED">
      <span style="background-color: #7c77cb" class="dashboard-quotes__list-item-box"></span>
      <span class="dashboard-quotes__list-item-label">Ticketed</span>
      <span class="dashboard-quotes__list-item-value" [textContent]="stats.TICKETED"></span>
    </li>
    <li class="dashboard-quotes__list-item" *ngIf="stats.UNREAD">
      <span style="background-color: #ff5263" class="dashboard-quotes__list-item-box"></span>
      <span class="dashboard-quotes__list-item-label">Unread</span>
      <span class="dashboard-quotes__list-item-value" [textContent]="stats.UNREAD"></span>
    </li>
  </ul>
  </div>






</div>
