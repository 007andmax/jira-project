<div class="contract-dashboard-chart-card qt-ml-16">
  <div class="contract-dashboard-chart-card__header">
    <div class="contract-dashboard-chart-card__header-title" [textContent]="stats.getTotal() + ' Quotes'"></div>
  </div>
   
  <div class="cmp-board-progresbbar d-flex">
      <span [ngStyle]="{'background-color': '#0747a6','width' :getProcent(stats.APPROVED) + '%'}" *ngIf="stats.APPROVED" ></span>
      <span [ngStyle]="{'background-color': '#00ccff','width' :getProcent(stats.ARCHIVED) + '%'}" *ngIf="stats.ARCHIVED" ></span>
      <span [ngStyle]="{'background-color': '#052e6b','width' :getProcent(stats.CANCELED) + '%'}" *ngIf="stats.CANCELED" ></span>
      <span [ngStyle]="{'background-color': '#16a4fa','width' :getProcent(stats.EXPIRED) + '%'}" *ngIf="stats.EXPIRED" ></span>
      <span [ngStyle]="{'background-color': '#cdecff','width' :getProcent(stats.INVOICED) + '%'}" *ngIf="stats.INVOICED" ></span>
      <span [ngStyle]="{'background-color': '#0747a6','width' :getProcent(stats.READ) + '%'}" *ngIf="stats.READ" ></span>
      <span [ngStyle]="{'background-color': '#00ccff','width' :getProcent(stats.SAVED) + '%'}" *ngIf="stats.SAVED" ></span>
      <span [ngStyle]="{'background-color': '#052e6b','width' :getProcent(stats.TICKETED) + '%'}" *ngIf="stats.TICKETED" ></span>
      <span [ngStyle]="{'background-color': '#16a4fa','width' :getProcent(stats.UNREAD) + '%'}" *ngIf="stats.UNREAD" ></span>
      
  </div>
  <ul class="list-unstyled d-flex">
      <li class="onsite d-flex" *ngIf="stats.APPROVED">
          <span>Approved</span>
          <b [textContent]="stats.APPROVED"></b>
      </li>
      <li class="remote-service d-flex" *ngIf="stats.ARCHIVED">
        <span>Archived</span>
        <b [textContent]="stats.ARCHIVED"></b>
      </li>
      <li class="block-tile d-flex" *ngIf="stats.CANCELED">
        <span>Canceled</span>
        <b [textContent]="stats.CANCELED"></b>
       </li>
      <li class="manage-fully d-flex" *ngIf="stats.EXPIRED">
        <span>Expired</span>
        <b [textContent]="stats.EXPIRED"></b>
      </li>  
      <li class="manage-fully d-flex" *ngIf="stats.INVOICED">
        <span>Invoiced</span>
        <b [textContent]="stats.INVOICED"></b>
      </li>
      
      <li class="manage-fully d-flex" *ngIf="stats.READ">
        <span>Read</span>
        <b [textContent]="stats.READ"></b>
      </li>
      <li class="manage-fully d-flex" *ngIf="stats.SAVED">
        <span>Draft</span>
        <b [textContent]="stats.SAVED"></b>
      </li>
      <li class="manage-fully d-flex" *ngIf="stats.TICKETED">
        <span>Ticketed</span>
        <b [textContent]="stats.TICKETED"></b>
      </li>
      <li class="manage-fully d-flex" *ngIf="stats.UNREAD">
        <span>Unread</span>
        <b [textContent]="stats.UNREAD"></b>
      </li>

 
  </ul>
  
  
 

 
</div>
