<div class="contract-info-card">
  <div class="contract-info-card__container" >
    <div class="contract-info-card__circle-outer">
      <div class="contract-info-card__circle-inner icon__quotes"></div>
    </div>
    <div class="contract-info-card__text-info">
      <div class="contract-info-card__title" [textContent]="saleQuotesPossibleRevenue | currency"></div>
      <div class="contract-info-card__subtitle">Total Quotes</div>
    </div>
  </div>
  <div class="contract-info-card__grow-info --up">
    <div class="contract-info-card__arrow-icon"></div>
    <div>4.46%</div>
  </div>
</div>
