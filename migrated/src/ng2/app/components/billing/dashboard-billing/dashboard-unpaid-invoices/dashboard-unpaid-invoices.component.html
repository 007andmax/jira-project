<div class="contract-info-card qt-mr-16">
  <div class="contract-info-card__container" >
    <div class="contract-info-card__circle-outer">
      <div class="contract-info-card__circle-inner icon__unpaid-invoice"></div>
    </div>
    <div class="contract-info-card__text-info">
      <div class="contract-info-card__title" [textContent]="totalReceivableUnpaid | currency"></div>
      <div class="contract-info-card__subtitle">Unpaid Invoices</div>
    </div>
  </div>
  <div class="contract-info-card__grow-info --down">
    <div class="contract-info-card__arrow-icon"></div>
    <div>4.46%</div>
  </div>
</div>
