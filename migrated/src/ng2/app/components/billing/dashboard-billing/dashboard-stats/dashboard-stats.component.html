<div class="contract-info-card qt-mr-16">
  <div class="contract-info-card__container" >
    <div class="contract-info-card__circle-outer">
      <div class="contract-info-card__circle-inner" [ngClass]="class"></div>
    </div>
    <div class="contract-info-card__text-info">
      <div class="contract-info-card__title" [textContent]="total | currency"></div>
      <div class="contract-info-card__subtitle" [textContent]="title"></div>
    </div>
  </div>
