<tr [ngClass]="{'--selected': invoice.selected}">
  <td class="invoice-table__check">
    <div class="d-f">
      <label class="qt-checkbox" [attr.for]="'invoice-' + invoice.id">
        <input [attr.id]="'invoice-' + invoice.id"  [(ngModel)]="invoice.selected"  type="checkbox">
        <span ></span>
      </label>
    </div>
  </td>

  <td class="invoce-table__date" [textContent]="getDate(invoice.date)"></td>
  <td class="invoce-table__invoice" [textContent]="invoice.number" (click)="onShowPreviewInvoice()"></td>
  <td class="invoce-table__company" [textContent]="company.name"></td>
  <td class="invoce-table__status">
    <span class="tag__modern --warning" *ngIf="invoice.isOverDue && !invoice.paidOn" [textContent]="'Overdue by ' + getDueDate() + ' days'"></span>
    <span class="tag__modern --info" *ngIf="!invoice.isOverDue && !invoice.paidOn" [textContent]="'Due in ' + getDueDate() + ' days'"></span>
    <span class="tag__modern --success" *ngIf="invoice.paidOn" [textContent]="'Paid ' + getPaidOnDate() + ' days ago'"></span>
    </td>
  <td class="invoce-table__read-on" [textContent]="getDate(invoice.readedAt)"></td>
  <td class="invoce-table__amount" [textContent]="invoice.sum | currency"></td>
  <td class="invoce-table__balance-due" [textContent]="invoice.paidSum | currency"></td>
  <td class="invoce-table__menu" ngbDropdown>
    <div class="qt-ic-c icon__more  qt-pointer qt-sz-16 qt-bg-contain"  id="dropdownBasic1" ngbDropdownToggle></div>
    <ul class="qt-dropdown-menu invoice-items-dropdown"  ngbDropdownMenu aria-labelledby="dropdownBasic1">
      <li ngbDropdownItem (click)="resendInvoices()"> <div class="icon__email-dark qt-sz-16 qt-mr-8"></div> Resend</li>

      <li ngbDropdownItem *ngIf="!invoice.readedAt" (click)="markAsRead()">Mark as Read</li>
      <li ngbDropdownItem (click)="deleteInvoice()"> <div class="icon__remove qt-sz-16 qt-mr-8"></div> Remove</li>


      <li ngbDropdownItem (click)="exportAsPDF()"> <div class="icon__download-pdf qt-sz-16 qt-mr-8"></div> Export as PDF</li>
      <li ngbDropdownItem *ngIf="!invoice.paidOn" (click)="rollbackInvoice()">  <div class="icon__restart qt-sz-16 qt-mr-8"></div> Rollback</li>
      <li ngbDropdownItem *ngIf="invoice.paidOn" (click)="refundPayments()">Refund Payments</li>
      <li ngbDropdownItem>Payment history

        <div class="dropdown-submenu-wrapper payment-info-submenu">
          <div class="payment-info clearfix">
            <ng-template ngFor let-payment
            [ngForOf]="allPayments"
             >
            <div  class="col-md-12">
              <div class="col-md-4" [textContent]="payment.createdAt">

              </div>
              <div class="col-md-4" [textContent]="parsePaymentMethod(payment.paymentMethod)">

              </div>
              <div class="col-md-4" [textContent]="(payment.partialPaidAmount || paymentSum) | currency">

              </div>
            </div>
            </ng-template>
            <div class="col-md-12">
              <div class="col-md-4">
              </div>
              <div class="col-md-4">
                Total payment:
              </div>
              <div class="col-md-4" [textContent]="(allPaymentsSum || invoice.payment && invoice.payment.totalSum || invoice.sum) | currency">

              </div>
            </div>
          </div>
        </div>

      </li>
    </ul>
  </td>

</tr>
