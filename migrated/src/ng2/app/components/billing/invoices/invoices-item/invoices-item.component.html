<tr>
  <td class="invoice-table__check">
    <div class="d-f">
      <label class="qt-checkbox">
        <input  type="checkbox">
        <span ></span>
      </label>
    </div>
  </td>

  <td class="invoce-table__date" [textContent]="getDate(invoice.date)"></td>
  <td class="invoce-table__invoice" [textContent]="invoice.number" (click)="onShowPreviewInvoice()"></td>
  <td class="invoce-table__company" [textContent]="company.name"></td>
  <td class="invoce-table__status">
    <span class="tag__modern" *ngIf="invoice.isOverDue && !invoice.paidOn" [textContent]="'Overdue by ' + getDueDate() + ' days'"></span>
    <span class="tag__modern" *ngIf="!invoice.isOverDue && !invoice.paidOn" [textContent]="'Due in ' + getDueDate() + ' days'"></span>
    <span class="tag__modern" *ngIf="invoice.paidOn" [textContent]="'Paid ' + getPaidOnDate() + ' days ago'"></span>    
    </td>
  <td class="invoce-table__read-on" [textContent]="getDate(invoice.readedAt)"></td>
  <td class="invoce-table__amount" [textContent]="invoice.sum | currency"></td>
  <td class="invoce-table__balance-due" [textContent]="invoice.paidSum | currency"></td>
  <td class="invoce-table__menu" ngbDropdown> <div class="qt-ic-c icon__more qt-pointer qt-sz-16 qt-bg-contain"  id="dropdownBasic1"
    ngbDropdownToggle></div> 
    <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
      <button ngbDropdownItem (click)="resendInvoices()">Resend</button>
      <button ngbDropdownItem *ngIf="!invoice.readedAt" (click)="markAsRead()">Mark as Read</button>
      <button ngbDropdownItem (click)="deleteInvoice()">Remove</button>
      <button ngbDropdownItem (click)="exportAsPDF()">Export as PDF</button>
    </div></td>

</tr>
