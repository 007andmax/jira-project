<div class="qt-list-header sticky-list-header invoices-list-header">
  <div>
    <h3 class="list-title" [textContent]="'Invoices'"></h3>
  </div>

  <div class="d-f ai-c">
    <button class="qt-btn --transparent" (click)="clearAll()" *ngIf="countFilter > 0">Clear All</button>
    <!-- <button class="qt-btn --light-blue qt-ml-8" (click)="toggleFilter  = !toggleFilter"> <span class="filter-counter qt-circle qt-sz-18 qt-ff-sb qt-fs-10 qt-color-white qt-bg-info qt-mr-8 qt-df qt-ai-c qt-jc-c" *ngIf="countFilter > 0" [textContent]="countFilter"></span> Filters</button> -->
    <button class="qt-btn filter-button qt-ml-8" [ngClass]="{'active':!toggleFilter}" (click)="toggleFilter  = !toggleFilter"> <span class="filter-counter qt-circle qt-sz-18 qt-ff-sb qt-fs-10 qt-color-white qt-bg-info qt-mr-8 qt-df qt-ai-c qt-jc-c" *ngIf="countFilter > 0" [textContent]="countFilter"></span> Filters</button>
    <!-- <button class="qt-btn --outline-blue qt-ml-8" (click)="onShowCreateInvoice()">Create Invoice</button> -->
    <button class="qt-btn --outline-blue qt-ml-8" (click)="onShowCreateInvoice()">Record Payment</button>
  </div>
  <app-invoices-filter #filter (changeCountFilter)="onChangeCountFilter($event)" [hidden]="toggleFilter"></app-invoices-filter>

</div>
<div class="sticky-list-table-header invoice-list-table-header" [ngClass]="{'--filters-open':!toggleFilter}">


  <table class="qt-table-modern invoice-table">
    <thead>
      <tr>
        <th class="invoice-table__check">
        <!--   <div class="d-f">
            <label class="qt-checkbox">
              <input type="checkbox">
              <span></span>
            </label>
          </div> -->
        </th>

        <th class="invoce-table__date pointer" (click)="sortBy('INVOICE_DATE')">
          Date
          <span class="qt-table-modern__sorting"></span>
        </th>

        <th class="invoce-table__invoice pointer" (click)="sortBy('INVOICE_NUMBER')">
          Invoice#
          <span class="qt-table-modern__sorting"></span>
        </th>

        <th class="invoce-table__company pointer" (click)="sortBy('COMPANY_NAME')">
          Company
          <span class="qt-table-modern__sorting"></span>
        </th>

        <th class="invoce-table__status">
          Status
        </th>

        <th class="invoce-table__read-on pointer" (click)="sortBy('READ_ON')">
          Read On
          <span class="qt-table-modern__sorting"></span>
        </th>


        <th class="invoce-table__amount pointer" (click)="sortBy('AMOUNT')">
          Amount
          <span class="qt-table-modern__sorting"></span>
        </th>

        <th class="invoce-table__balance-due pointer" (click)="sortBy('BALANCE')">
          Balance Due
          <span class="qt-table-modern__sorting"></span>
        </th>

        <th class="invoce-table__menu"></th>
      </tr>
    </thead>
  </table>
</div>
