<div class="qt-df qt-ai-c">
    <app-select-search
        class="search-company invoices-company-filter"
        #companyDp
        [placeholder]="'Select Company'"
        [change]="false"
        [class]="['qt-dropdown']"
        [field]="'name'"
        [list]="companies"
        (onSelectedItem)="onSelectCompany($event)"
    ></app-select-search>
    <app-select-search
        class="search-company invoices-status-filter"
        #statusDp
        [placeholder]="'Select Status'"
        [change]="false"
        [class]="['qt-dropdown']"
        [field]="'title'"
        [list]="statusTypes"
        (onSelectedItem)="onSelectStatus($event)"
    ></app-select-search>
    <input
        type="text"
        appKeyUpEnter
        (onChange)="onSetNumberInvoice($event)"
        (blur)="onSetNumberInvoice($event)"
        placeholder="Enter invoice #"
        class="qt-mr-8 qt-input h36 filter-invoice invoices-number-filter"
        [(ngModel)]="invoicesFilter.invoiceNumber"
    >
    <app-multi-datepicker
        class="qt-input-block invoices-date-filter"
        #datesDp
        (selectedDate)="filterByDate($event)"
    ></app-multi-datepicker>
    <!-- <div class="qt-circle qt-sz-32 icon__print qt-ic-c qt-mr-8 filters-icon"></div>
  <div class="qt-circle qt-sz-32 icon__download qt-ic-c filters-icon"></div> -->
</div>
