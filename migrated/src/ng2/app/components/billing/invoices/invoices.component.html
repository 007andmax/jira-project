<div class="page-list invoices-page">

  <div class="qt-df qt-fd-c qt-jc-sb invoices-page__list-container">
    <div>
      <app-invoices-header (onCreateInvoice)="showCreateInvoice = true"></app-invoices-header>

      <div class="sticky-list-table-header">



        <table class="qt-table-modern invoice-table">
          <thead>
            <tr>
              <th class="invoice-table__check">
                <div class="d-f">
                  <label class="qt-checkbox">
                    <input type="checkbox">
                    <span></span>
                  </label>
                </div>
              </th>

              <th class="invoce-table__date">
                Date
                <span class="qt-table-modern__sorting"></span>
              </th>

              <th class="invoce-table__invoice">
                Invoice#
                <span class="qt-table-modern__sorting"></span>
              </th>

              <th class="invoce-table__company">
                Company
                <span class="qt-table-modern__sorting"></span>
              </th>

              <th class="invoce-table__status">
                Status
                <span class="qt-table-modern__sorting"></span>
              </th>

              <th class="invoce-table__read-on">
                Read On
                <span class="qt-table-modern__sorting"></span>
              </th>


              <th class="invoce-table__amount">
                Amount
                <span class="qt-table-modern__sorting"></span>
              </th>

              <th class="invoce-table__balance-due">
                Balance Due
                <span class="qt-table-modern__sorting"></span>
              </th>

              <th class="invoce-table__menu"></th>
            </tr>
          </thead>
        </table>
      </div>


      <div class="table-container">
        <table class="qt-table-modern billable-table">
          <tbody
          infiniteScroll
          [infiniteScrollDistance]="2"
          [infiniteScrollThrottle]="50"
          [infiniteScrollDisabled]="infiniteScrollDisabled"
          (scrolled)="onScroll()">
       <ng-template ngFor let-invoice
                    [ngForOf]="invoices"
                    [ngForTrackBy]="trackById">
                    <app-invoices-item (onPreviewInvoice)="onPreviewInvoice($event)" [invoice]="invoice"></app-invoices-item>
       </ng-template>
     </tbody>
        </table>
        <div class="loading pengind-loading" *ngIf="showPendingPreloader"></div>
  <div class="loading" *ngIf="showPreloader"></div>


      </div>
    </div>

    <div class="total-info">
      <hr class="total-divider qt-mb-16">
      <div class="qt-df qt-jc-fe">
        <div><span class="qt-ff-sb qt-fs-13 qt-mr-5">Total:</span> <span class="qt-ff-sb qt-fs-16">$39399.00</span></div>
      </div>
    </div>

  </div>
</div>

<app-invoices-aside *ngIf="showCreateInvoice" (onClose)="showCreateInvoice = false"></app-invoices-aside>
<app-invoices-aside-preview *ngIf="showPreviewInvoice" (onClose)="showPreviewInvoice = false" [invoice]="previewInvoice"></app-invoices-aside-preview>
