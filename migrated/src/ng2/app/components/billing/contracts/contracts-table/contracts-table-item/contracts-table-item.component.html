<tr [ngClass]="(showNotificationReview) ? 'no-valid' : ''">
  <td class="contracts-table__company" [textContent]="contract.company.name" (click)="preview()"></td>
  <td class="contracts-table__description" [textContent]="contract.description" (click)="preview()"></td>
  <td class="contracts-table__contract-type" [textContent]="getType()" (click)="preview()"></td>
  <td class="contracts-table__status" (click)="preview()"><span class="tag__modern"
    [ngClass]="{'--error' : contract.status === 'TERMINATED',
    '--warning' : contract.status === 'EXPIRED' || contract.status === 'PENDING',
    '--info' : contract.status === 'CURRENT'}" [textContent]="contractStatusDictionary[contract.status]"></span></td>
  <td class="contracts-table__start-date" [textContent]="getDate(contract.startDate)" (click)="preview()"></td>
  <td class="contracts-table__review-date" [textContent]="getDate(contract.reviewDate)" (click)="preview()"></td>
  <td class="contracts-table__amount" [textContent]="contract.amount | currency" (click)="preview()"></td>
  <td class="contracts-table__menu" ngbDropdown container="body">
    <div class="qt-ic-c icon__more qt-pointer qt-sz-16 qt-bg-contain"  id="dropdownBasic1" ngbDropdownToggle></div>

    <ul class="qt-dropdown-menu invoice-items-dropdown"  ngbDropdownMenu aria-labelledby="dropdownBasic1">
      <li class="pointer" ngbDropdownItem (click)="copyContract()"  >Copy contract</li>
      <li class="pointer" ngbDropdownItem (click)="editContract()"  *ngIf="contract.status !== 'TERMINATED'">Edit contract</li>
      <li class="pointer" ngbDropdownItem (click)="terminateContract()"  *ngIf="contract.status !== 'TERMINATED'">Terminate</li>
      <li class="pointer" ngbDropdownItem (click)="deleteContract()"  *ngIf="getPermissions('DELETE_SERVICE_AGREEMENTS') && contract.status !== 'CURRENT'">Delete agreement</li>
    </ul>
  </td>
</tr>
