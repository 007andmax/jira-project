<tr>
  <td class="contracts-aside-block-time-tabble-td">
    <mat-error  class="qt-tooltip-error qt-w-auto-important" *ngIf="!service.validate">
      An agreement with current service name already using for current company
    </mat-error>
    <mat-error class="qt-tooltip-error qt-w-auto-important" *ngIf="!service.validateDuplicated">
      The duplicated service name
    </mat-error>
    <input type="text" class="qt-input-in-table" [ngClass]="{'--input-error' : !service.validate || !service.validateDuplicated}" [(ngModel)]="service.name" (blur)="checkName()" (input)="onChange()" /></td>
  <td>
    <div class="icon__raw-clear qt-ic-c qt-sz-16" (click)="remove()"></div>
  </td>
</tr>
