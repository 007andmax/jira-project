<div class="contracts-page-scroll-content">
  <div class="qt-pr-32 qt-pl-32 qt-pb-8 qt-pt-16">

   <app-contracts-aside-top [selectedType]="selectedType" ></app-contracts-aside-top>


    <div class="qt-df qt-mb-16 qt-w50 qt-mr-16">
      <div class="qt-input-block --required qt-w50 qt-mr-16">
        <label>Start Date</label>
        <app-date-picker [formatDate]="formatDate" [editMode]="true" [editDate]="today"   (onChange)="onChangeStartDate($event)"></app-date-picker>

      </div>

      <div class="qt-input-block --required qt-w50">
        <label>Review Date</label>
        <app-date-picker [formatDate]="formatDate" [editMode]="true" [editDate]="today"   (onChange)="onChangeReviewDate($event)"></app-date-picker>

      </div>
    </div>

    <div>
      <div class="qt-input-block --required qt-w100">
        <label>Description</label>
        <input placeholder="Write contract description" type="text">
      </div>
    </div>

  </div>

  <hr class="qt-horisontal-line qt-mb-16">


  <div class="qt-pl-32 qt-pr-32 qt-pb-20">

    <div class="qt-mb-16 qt-ff-sb qt-fs-15 qt-lh-147 qt-color-dark">Check this services you want for this customer</div>

    <table class="qt-gray-table service-table qt-mb-16" colspan="0">
      <thead>
        <tr>
          <th class="service-table__check" >
            <label class="qt-checkbox">
              <input type="checkbox">
              <span></span>
            </label>
          </th>
          <th class="service-table__name">Service Name</th>
          <th class="service-table__billable">
            <div class="qt-df qt-ai-c qt-jc-fe">
              <div>Billable</div>
              <div class="qt-sz-12 icon__question-help"></div>
            </div>
          </th>
          <th class="service-table__tax">
            <div class="qt-df qt-ai-c qt-jc-fe">
              <div>Tax</div>
              <div class="qt-sz-12 icon__question-help"></div>
            </div>
          </th>
          <th class="service-table__rate">
            <div class="qt-df qt-ai-c qt-jc-fe">
              <div>Hourly Rate</div>
              <div class="qt-sz-12 icon__question-help"></div>
            </div>
          </th>
        </tr>
      </thead>
      <tbody>
        <ng-template ngFor let-item
        [ngForOf]="defaultServices"
        [ngForTrackBy]="trackById">
        <app-contracts-aside-hourly-billing-default-service [defaultService]="item"></app-contracts-aside-hourly-billing-default-service>
      </ng-template>
      

         

      </tbody>
    </table>

    <button class="qt-mb-24 qt-btn --outline --small">+ Add Custom Service</button>

  </div>

</div>
