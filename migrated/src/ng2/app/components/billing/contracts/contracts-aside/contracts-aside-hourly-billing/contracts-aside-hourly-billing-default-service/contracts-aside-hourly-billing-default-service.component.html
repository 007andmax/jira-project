<tr>
  <td class="service-table__check">
    <label class="qt-checkbox">
      <input type="checkbox" [(ngModel)]="defaultService.selected" (change)="toggleService()">
      <span></span>
    </label>
  </td>
  <td class="service-table__name">
    <input class="qt-input-in-table" type="text" [(ngModel)]="defaultService.name">
  </td>
  <td class="service-table__billable">
    <label class="qt-checkbox">
      <input type="checkbox" [(ngModel)]="defaultService.billable">
      <span></span>
    </label>
  </td>
  <td class="service-table__tax"><app-invoice-form-ticket-edit-taxes class="qt-taxes-multiselect" #taxes (taxesChange)="onTaxesChange($event)"></app-invoice-form-ticket-edit-taxes></td>
  <td class="service-table__rate"><input class="payment-input qt-input-in-table"   number
    [money]="true"
    [ngModel]="defaultService.rate"
    (ngModelChange)="onChangeRate($event)"
    appToFixed /></td>
</tr>
