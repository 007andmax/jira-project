<div class="qt-df qt-mb-16">
  <div class="qt-w50 qt-input-block qt-mr-16">

    <app-drop-down
    #companiesDP
      [title]="'Company Name'"
      [placeholder]="'Select Company'"
      [list]="companies"
      [validate]="validateCompany"
      [errorMessage]="'Company is required'"
      [field]="'name'"
      [search]="true"
      [change]="true"
      (onSelectedItem)="selectCompany($event)"
    ></app-drop-down>
  </div>

  <app-drop-down
    [title]="'Contract Type'"
    [placeholder]="'Contract Type'"
    [widthInput]="'280px'"
    [isBlockClear]="true"
    [editItem]="selectedType"
    [list]="listsTypes"
    [field]="'title'"
    (onSelectedItem)="onSelectType($event)"
  ></app-drop-down>
</div>
