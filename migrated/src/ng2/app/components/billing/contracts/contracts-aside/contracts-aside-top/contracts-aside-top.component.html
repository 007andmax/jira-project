<div class="qt-df qt-mb-16">
  <div class="qt-w50 qt-input-block qt-mr-16">
    <label>Company Name</label>
    <app-select-search class="contracts-company-filter search-company"     [placeholder]="'Select Company'"
    [change]="false" [class]="['qt-dropdown']" [field]="'name'" [list]="companies"
    (onSelectedItem)="onSelectCompany($event)"></app-select-search>
  </div>


  <div class="contracts-page__contract-type-name-input qt-input-block">
    <label>Contract Type</label>
  <app-select-search  class="contracts-company-filter search-users "    [placeholder]="'Contract Type'"
[change]="false" [isSearch]="false" [isBlockClear]="true" [editItem]="selectedType" [class]="['qt-dropdown']"  [list]="listsTypes" [field]="'title'"
(onSelectedItem)="onSelectType($event)"></app-select-search>
  </div>
</div>
