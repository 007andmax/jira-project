<tr>
  <td class="contract-product-products-table__name" ><app-product-list    class="product-item__prodect-list"
    (selectedProductItem)="onChangeProduct($event)"></app-product-list></td>
  <td class="contract-product-products-table__quantity"><input   class="payment-input qt-input-in-table"   decimalNumber
    [value]="product.quantity"
    (onChange)="product.quantity=$event" /></td>
  <td class="contract-product-products-table__price"><input   class="payment-input qt-input-in-table"   number
    [money]="true"
    [ngModel]="product.salePrice"
    (ngModelChange)="onChangeSalePrice($event)"
    appToFixed /></td>
  <td>
    <div class="icon__raw-clear qt-ic-c qt-sz-16" (click)="remove()"></div>
  </td>
</tr>
