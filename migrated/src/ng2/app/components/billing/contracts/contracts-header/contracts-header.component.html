<div class="qt-list-header sticky-list-header contracts-list-header">
  <div>
    <h3 class="list-title" [textContent]="'Contracts'"></h3>
  </div>
  <div class="d-f ai-c">
    <button class="qt-btn filter-button qt-ml-8"> Filters</button>
    <button class="qt-btn --outline-blue qt-ml-8">Create Contract</button>
  </div>
</div>
<div class="sticky-list-table-header contracts-list-table-header">
  <table class="qt-table-modern contracts-table">
    <thead>
      <tr>
        <th class="contracts-table__company pointer">
          Company
          <span class="qt-table-modern__sorting"></span>
        </th>
        <th class="contracts-table__description pointer">
          Description
          <span class="qt-table-modern__sorting"></span>
        </th>
        <th class="contracts-table__contract-type pointer">
          Contract Type
          <span class="qt-table-modern__sorting"></span>
        </th>
        <th class="contracts-table__status pointer">
          Status
          <span class="qt-table-modern__sorting"></span>
        </th>
        <th class="contracts-table__start-date pointer">
          Start Date
          <span class="qt-table-modern__sorting"></span>
        </th>
        <th class="contracts-table__review-date pointer">
          Review Date
          <span class="qt-table-modern__sorting"></span>
        </th>
        <th class="contracts-table__amount pointer">
          Amount
          <span class="qt-table-modern__sorting"></span>
        </th>
        <th class="contracts-table__menu"></th>
      </tr>
    </thead>
  </table>
</div>
