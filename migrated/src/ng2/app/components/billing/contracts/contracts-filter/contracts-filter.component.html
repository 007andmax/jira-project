<div class="qt-df qt-ai-c">
  <app-select-search class="contracts-company-filter search-company"  #companyDp  [placeholder]="'Select Company'"
    [change]="false" [class]="['qt-dropdown']" [field]="'name'" [list]="companies"
    (onSelectedItem)="onSelectCompany($event)"></app-select-search>


  <app-select-search  class="contracts-company-filter search-users "   #typesDp [placeholder]="'Contract Type'"
    [change]="false" [class]="['qt-dropdown']"  [list]="listsTypes" [field]="'title'"
    (onSelectedItem)="onSelectType($event)"></app-select-search>


    <app-multi-datepicker    class="qt-input-block contracts-date-filter search-type" #datesDp (selectedDate)="filterByDate($event)"></app-multi-datepicker>

    <app-select-search  class="contracts-status-filter search-status "  #statusDp  [placeholder]="'Select by Status'"
    [change]="false" [class]="['qt-dropdown']" [list]="listsStatus" [field]="'title'"
    (onSelectedItem)="onSelectStatus($event)"></app-select-search>
</div>
