<div class="qt-df qt-pos-rel">


  <div class="contract-aside-hourly-add-service__name">
    <app-drop-down
      #serviceDropDown
      [placeholder]="'Service Name'"
      [list]="defaultServices"
      [field]="'name'"
      [change]="true"
      [search]="true"
      (onSelectedItem)="selectService($event)"
    ></app-drop-down>
      <mat-error class="qt-tooltip-error" *ngIf="!validate.getValidate() || !validate.getDuplicateName()">
        Duplicate Service
      </mat-error>
      <mat-error class="qt-tooltip-error" *ngIf="!validate.getName()">
        Service name is required
      </mat-error>
  </div>

  <div class="contract-aside-hourly-add-service__billable">
    <label class="qt-checkbox receive-full-amount-check qt-mb-0 pointer" for="email-payment">
      <input id="email-payment" type="checkbox"  [(ngModel)]="service.billable"  >
      <span></span>
    </label>
  </div>

  <div class="contract-aside-hourly-add-service__tax ">
    <div class="create-product-taxes-select">
      <app-invoice-form-ticket-edit-taxes class="qt-taxes-multiselect" #taxes [selectedTax]="defaultSelectedTax" (taxesChange)="onTaxesChange($event)"></app-invoice-form-ticket-edit-taxes>
    </div>
  </div>


  <div class="qt-input-block contract-aside-hourly-add-service__rate" [ngClass]="{'--input-error':!validate.getRate()}">
    <input   [(ngModel)]="service.rate" type="text" number placeholder="Per Hour Rate"
    [money]="true"
    (input)="onChangeRate($event)" appToFixed>
    <mat-error class="qt-tooltip-error" *ngIf="!validate.getRate()">
      Hour rate is required
    </mat-error>
  </div>


    <div class="icon__close contract-aside-hourly-add-service__add qt-sz-16 qt-pointer qt-ic-c" (onClick)="searchDuplicatedServiceNames()"></div>
    <div class="icon__close contract-aside-hourly-add-service__cancel qt-sz-16 qt-pointer qt-ic-c" (click)="closed()"></div>
</div>
