<div class="qt-page-list contracts-page">
    <app-contracts-header></app-contracts-header>
    <app-contracts-table></app-contracts-table>
</div>
<app-contracts-preview
    *ngIf="showPreview"
    [serviceAgreement]="serviceAgreement"
></app-contracts-preview>
<app-contracts-aside
    *ngIf="showCreate"
    (onClose)="showCreate = false"
></app-contracts-aside>
<app-contracts-edit
    *ngIf="showEdit"
    [serviceAgreement]="serviceAgreement"
></app-contracts-edit>
