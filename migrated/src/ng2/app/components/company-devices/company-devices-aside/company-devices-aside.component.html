<div
    class="company-devices-page__aside company-device-aside"
    *ngIf="open"
>
    <div class="company-device-aside__menu">
        <ng-template
            ngFor
            let-item
            [ngForOf]="devices"
            [ngForTrackBy]="trackById"
        >
            <app-company-devices-aside-device-icon
                (onSelect)="currentDevice = item"
                [currentDevice]="currentDevice"
                [device]="item"
            ></app-company-devices-aside-device-icon>
        </ng-template>
    </div>
    <div class="company-device-aside__header qt-df qt-ai-c qt-jc-sb">
        <div class="qt-df qt-ai-c">
            <div
                class="icon qt-sz-24 qt-mr-12"
                [ngClass]="{'icon__computer' : currentDevice.iconName === 'workstation' || !currentDevice.iconName,
              'icon__tablet' : currentDevice.iconName === 'device',
            'icon__printer' : currentDevice.iconName === 'printer',
          'icon__server' : currentDevice.iconName === 'server',
        '--ofline': !currentDevice.online,
    '--online':currentDevice.online }"
            ></div>
            <div
                class="qt-fs-13 qt-ff-sb qt-lh-154"
                [textContent]="!isLabel() ? currentDevice.hostName || currentDevice.ip :  currentDevice.label || currentDevice.hostName || currentDevice.ip"
            >
            </div>
        </div>
        <div
            class="qt-df qt-ai-c"
            ngbDropdown
            placement="bottom-right"
        >
            <div
                class="qt-sz-24 qt-mr-8 qt-pointer company-device-aside__more-icon icon__more-vertical"
                ngbDropdownToggle
            ></div>
            <ul
                class="qt-dropdown-menu invoice-items-dropdown"
                ngbDropdownMenu
            >
                <li
                    class="pointer"
                    ngbDropdownItem
                >
                    <div class="qt-ic-c icon__go-to qt-pointer qt-sz-24 qt-bgsz-16"></div>
                    Device Detail
                </li>
                <li
                    class="pointer"
                    ngbDropdownItem
                    *ngIf="currentDevice.type !== 'workstation' && currentDevice.online && getPermissions('REMOTE_CONNECTIONS')"
                    (click)="remoteAccess('PROXY')"
                >
                    <div class="qt-ic-c icon__go-to qt-pointer qt-sz-24 qt-bgsz-16"></div>
                    Remote Access
                </li>
                <li
                    class="pointer"
                    *ngIf="currentDevice.type === 'workstation' && currentDevice.online && getPermissions('REMOTE_CONNECTIONS')"
                    (click)="showRemoteAccess = !showRemoteAccess "
                >
                    <div class="qt-ic-c icon__go-to qt-pointer qt-sz-24 qt-bgsz-16"></div>
                    Remote Access
                    <ul
                        class="dropdown-menu-qt__submenu dropdown-menu"
                        *ngIf="showRemoteAccess"
                    >
                        <li
                            ngbDropdownItem
                            (click)="remoteAccess('CSS')"
                        >
                            Custom Share Screen
                        </li>
                        <li
                            ngbDropdownItem
                            (click)="remoteAccess('RDP')"
                        >
                            Remote desktop protocol
                        </li>
                    </ul>
                </li>
                <li
                    class="pointer"
                    (click)="turnOff('reboot')"
                    ngbDropdownItem
                >
                    <div class="qt-bg-contain qt-sz-16 qt-mr-8"></div>
                    Restart
                </li>
                <li
                    class="pointer"
                    (click)="turnOff('shutdown')"
                    ngbDropdownItem
                >
                    <div class="qt-bg-contain qt-sz-16 qt-mr-8"></div>
                    Shutdown
                </li>
                <li
                    class="pointer"
                    (click)="setMasterAgent()"
                    *ngIf="!currentDevice.master"
                    ngbDropdownItem
                >
                    <div class="qt-bg-contain qt-sz-16 qt-mr-8"></div>
                    Set as Master Agent
                </li>
                <li
                    class="pointer"
                    (click)="removeCurrentDevice()"
                >
                    <div class="icon__remove qt-bg-contain qt-sz-16 qt-mr-8"></div>
                    Remove
                </li>
            </ul>
            <div
                class="qt-sz-24 qt-pointer company-device-aside__close-icon icon__close"
                *ngIf="devices.length > 1"
                (click)="removeDevice()"
            ></div>
            <div
                class="qt-pointer company-device-aside__arrow-right-icon icon__arrow-right"
                (click)="close()"
            ></div>
        </div>
    </div>
    <div class="company-device-aside__subheader">
        <div
            class="company-device-aside__subheader-item subheader-item-system"
            [ngClass]="{'--active':tab === 'SYSTEM'}"
            (click)="tab = 'SYSTEM'"
        ></div>
        <div
            class="company-device-aside__subheader-item subheader-item-network"
            [ngClass]="{'--active':tab === 'NETWORK'}"
            (click)="tab = 'NETWORK'"
        ></div>
        <div
            class="company-device-aside__subheader-item subheader-item-software"
            [ngClass]="{'--active':tab === 'SOFTWARE'}"
            (click)="tab = 'SOFTWARE'"
        ></div>
        <div class="company-device-aside__subheader-item subheader-item-updates"></div>
    </div>
    <div class="company-device-aside__body">
        <app-company-devices-aside-system
            [device]="currentDevice"
            *ngIf="tab === 'SYSTEM'"
        ></app-company-devices-aside-system>
        <app-company-devices-aside-network-tab
            [device]="currentDevice"
            *ngIf="tab === 'NETWORK'"
        ></app-company-devices-aside-network-tab>
        <app-company-devices-aside-software
            [device]="currentDevice"
            *ngIf="tab === 'SOFTWARE'"
        ></app-company-devices-aside-software>
