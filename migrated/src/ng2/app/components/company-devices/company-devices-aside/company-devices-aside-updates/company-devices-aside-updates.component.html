<!-- Update tab -->
<div class="sidebar-updates qt-pt-24 qt-pb-24 qt-pl-24 qt-pr-24">
    <div class="qt-df qt-jc-sb">
        <div class="sidebar-updates__tab-title qt-ff-sb">UPDATES</div>
    </div>
    <div class="sidebar-updates__items">
        <div class="sidebar-updates__item">
            <div
                class="sidebar-updates__icon icon__virus-protection icon "
                [ngClass]="{'--updated': device.report.antivirus[0].isUpToDate == true, '--alert': device.report.antivirus[0].isUpToDate == false}"
            ></div>
            <div class="sidebar-updates__title">Virus Protection</div>
            <div class="sidebar-updates__subtitle">Up-to-date</div>
        </div>
        <div class="sidebar-updates__item">
            <div class="sidebar-updates__icon icon__security-update icon --alert"></div>
            <div class="sidebar-updates__title">Security Update</div>
            <div class="sidebar-updates__subtitle --link">Install 7 Updates</div>
        </div>
        <div class="sidebar-updates__item">
            <div class="sidebar-updates__icon icon icon__drivers-missing --updated"></div>
            <div class="sidebar-updates__title">Drivers Misssing</div>
            <div class="sidebar-updates__subtitle">Up-to-date</div>
        </div>
    </div>
</div>
