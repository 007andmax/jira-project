<!-- for show filters add class "show" for app-left-panel -->
<app-left-panel-users></app-left-panel-users>
<div class="page-list users-page">
  <app-users-header [count]="count"></app-users-header>
  <div class="table-container">
    <table class="qt-table-modern users-table">
      <tbody
        infiniteScroll
        [infiniteScrollDistance]="2"
        [infiniteScrollThrottle]="50"
        [infiniteScrollDisabled]="infiniteScrollDisabled"
        (scrolled)="onScroll()">
        <ng-template ngFor let-user
          [ngForOf]="users"
          [ngForTrackBy]="trackById">
          <app-users-table [showArchivedUsers]="showArchivedUsers" [user]="user"></app-users-table>
        </ng-template>
      </tbody>
    </table>
    <div class="loading" *ngIf="showPreloader"></div>
  </div>
</div>

<app-users-aside></app-users-aside>
<users-aside-edit></users-aside-edit>
