<div class="qt-page-list__header --sticky">
  <div class="qt-page-list__header-title-line">

    <div class="qt-page-list__header-title-line--left">
      <h3 class="qt-page-list__header-title" [textContent]="'All Users (' + count + ')'"></h3>
    </div>

    <div class="qt-page-list__header-title-line--rigth">

      <div class="qt-df qt-ai-c">
        <div class="company-devices-page__list-header-buttons">
          <div [textContent]="'3 Users Selected'"></div>
          <div class="qt-ml-25 qt-ff-gm qt-df qt-color-info qt-ai-c qt-pointer">
            <div class="email-ng2 qt-sz-16 qt-ic-c qt-mr-6"></div>
            <div (click)="showAsideForDraftEmail()">Write Draft</div>
          </div>
          <div class="qt-ml-16 qt-ff-gm qt-df qt-color-info qt-ai-c qt-pointer">
            <div class="archive-blue-ng2 qt-sz-16 qt-ic-c qt-mr-6"></div>
            <div>Archive User</div>
          </div>
        </div>

        <button class="qt-btn btn-filter qt-ml-8 d-f">Filters</button><!-- add class 'active' if filters open  -->
        <button class="qt-btn --outline-blue qt-ml-8" (click)="addUser()">Add user</button>
      </div>

    </div>

  </div>

  <div class="qt-page-list__header-filters">
    <input
      type="text"
      placeholder="Select Title"
      class="qt-mr-8 qt-input h36 qt-w100"
      (change)="onSelectAllUser($event)"
    >
    <input
      type="text"
      placeholder="Search By Company"
      class="qt-mr-8 qt-input h36 qt-w100"
    >
    <input
      type="text"
      placeholder="Search By Industry"
      class="qt-input h36 qt-w100"
    >
  </div>

  <div class="qt-page-list__header-thead-container">
    <table class="qt-table-modern qt-page-list__header-thead">
      <thead>
          <tr>
            <th class="users-table__check">
              <div class="d-f">
                <label class="qt-checkbox">
                  <input
                    type="checkbox"
                  >
                  <span></span>
                </label>
              </div>
            </th>
            <th class="users-table__name">
              Name
              <span (click)="onFilter('name')" class="qt-table-modern__sorting"></span>
            </th>
            <th class="users-table__company">
              Company
              <span (click)="onFilter('company')" class="qt-table-modern__sorting"></span>
            </th>
            <th class="users-table__contract-no">
              Contract no
              <span (click)="onFilter('contact')" class="qt-table-modern__sorting"></span>
            </th>
            <th class="users-table__subscription">
              Subscription
              <span class="qt-table-modern__sorting"></span>
            </th>
            <th class="users-table__tickets">
              Tickets
              <span (click)="onFilter('tickets')" class="qt-table-modern__sorting"></span>
            </th>
            <th class="users-table__email"></th>
            <th class="users-table__menu"></th>
          </tr>
      </thead>
    </table>
  </div>

</div>
