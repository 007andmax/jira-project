<div class="new-users-content__header">
  <h3>Users ({{count}})</h3>
  <div class="new-users-content__header--search">
    <!--add class "show" to <div class="new-users-selected">-->
    <div class="new-users-selected">
      <div class="new-users-selected-qty">
        <span>2</span> Selected
      </div>
      <div class="new-users-selected-actions">
        <i class="icn-16 email-ng2"></i>
        <i class="icn-16 archive-blue-ng2"></i>
        <i class="icn-16 export-ng2"></i>
      </div>
    </div>
    <i class="icn-16 email-ng2"
    uib-tooltip="Draft email"
    tooltip-placement="top"
    (click)="showAsideForDraftEmail()"></i>
    <button class="new-link desktop-hidden" style="font-size: 13px;" (click)="addUser()">Add User
    </button>
    <button class="btn-new btn-primary-white mob-hidden" (click)="addUser()">
      Add User
    </button>
  </div>
</div>
