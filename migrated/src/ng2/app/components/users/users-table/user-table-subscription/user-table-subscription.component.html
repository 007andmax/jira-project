<div class="grey-dropdown" ngbDropdown>
    <div class="pointer subs-list"
         id="dropdownBasic"
         ngbDropdownToggle>
      <div [textContent]="title"></div>
      <i class="icn-sm report-caret-icon"></i>
    </div>
    <div ngbDropdownMenu aria-labelledby="dropdownBasic">
      <button ngbDropdownItem (click)="update('ticket')">Updates</button>
      <button ngbDropdownItem (click)="update('invoice')">Invoice</button>
      <button ngbDropdownItem (click)="update('ticketManager')">Manager</button>
    </div>
  </div>
