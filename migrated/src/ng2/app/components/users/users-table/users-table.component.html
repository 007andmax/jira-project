<div class="new-users-content__list--item clearfix">
  <div class="col-md-3 w-100">
    <label class="checkbox-container">
      <input type="checkbox">
      <span class="checkbox-mark"></span>
    </label>
    <div class="circle-avatar" [ngStyle]="{'background': 'url(' + getUserAvatarUrl(user) + ') no-repeat'}" [textContent]="getNameForAvatar()"></div>
    <div class="mob-styles">
      <p class="ff-g-m fz-13 fw-600" [textContent]="getUserName()"></p>
      <p class="fz-12" [textContent]="user.designation"></p>
      <p class="desktop-hidden company-phone">979-431-8937</p>
    </div>
  </div>
  <div class="col-md-4 company-location w-100 fz-13">
   {{getUserCompanyName()}}
    <a class="company-link desktop-hidden">Show Map</a>
  </div>
  <div class="col-md-4 w-100 fz-13"  [innerHtml]="getContact()"></div>
  <div class="col-md-4 subs">
   <app-user-table-subscription (onChange)="onChangeSubscriptions($event)" [subscription]="user.subscription"></app-user-table-subscription>
  </div>
  <div class="col-md-1 fz-13 jc-c" [textContent]="user.userStatistic.ticketsSubmitted || 0"></div>
  <div class="col-md-2">
    <div class="grey-dropdown right with-icons" ngbDropdown>
      <i class="icn-16 more-vertical-ng2 pointer"
         id="dropdownBasic1"
         ngbDropdownToggle></i>
      <div ngbDropdownMenu aria-labelledby="dropdownBasic1">
        <button ngbDropdownItem *ngIf="!showArchivedUsers" (click)="edit()"><i class="icn-16 edit-grey-ng2" ></i>Edit</button>
        <button ngbDropdownItem *ngIf="!showArchivedUsers"><i class="icn-16 send-grey-ng2"></i>Send</button>
        <button ngbDropdownItem *ngIf="currentUser.checkPermission('ARCHIVE_USERS') && !showArchivedUsers" (click)="delete()"><i class="icn-16 archive-grey-ng2"></i>Delete</button>
        <button ngbDropdownItem *ngIf="currentUser.checkPermission('ARCHIVE_USERS') && showArchivedUsers" (click)="restore()"><i class="icn-16 archive-grey-ng2"></i>Restore</button>
      </div>
    </div>
  </div>
</div>
