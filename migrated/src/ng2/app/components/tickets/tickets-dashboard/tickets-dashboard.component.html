 <div class="tickets-dashboard-page billing-dashboard-page">
  <div class="loading" *ngIf="showPreloader"></div>
  <div class="billing-dashboard-page__content" *ngIf="!showPreloader">
    <div class="qt-df qt-ai-c qt-jc-sb qt-mb-16">
      <h3 class="list-title qt-mt-0 qt-mb-0 qt-fs-16 qt-ff-sb">Dashboard</h3>
      <div class="list-type" ngbDropdown>
        <span ngbDropdownToggle [textContent]="currentInterval.title"  id="dropdownIntervals"></span>
        <div ngbDropdownMenu aria-labelledby="dropdownIntervals">
          <ng-template ngFor let-item [ngForOf]="listIntervals" >
            <a tabindex="-1" href="javascript:void(0)" ngbDropdownItem (click)="onSelectInterval(item)">
              {{item.title}}
            </a>
          </ng-template>
        </div>
      </div>
    </div>

      <div class="qt-df qt-jc-sb qt-mb-16">
    <app-dashboard-stats [title]="'Open Tickets'" [total]="dashboardTicketsStats.OPEN" [class]="'icon__total-sales'"></app-dashboard-stats>
    <app-dashboard-stats [title]="'On-hold Tickets'" [total]="dashboardTicketsStats.ON_HOLD" [class]="'icon__unpaid-invoice'"></app-dashboard-stats>
    <app-dashboard-stats [title]="'New Tickets'" [total]="dashboardTicketsStats.UNASSIGNED" [class]="'icon__unbilled-amount'"></app-dashboard-stats>
    <app-dashboard-stats [title]="'Completed Tickets'" [total]="dashboardTicketsStats.CLOSED" [class]="'icon__quotes'"></app-dashboard-stats>
    <app-dashboard-stats [title]="'Recurring Tickets'" [total]="dashboardTicketsStats.RECURRING_TICKETS" [class]="'icon__quotes'"></app-dashboard-stats>
      </div>
    <app-tickets-analytics-widget></app-tickets-analytics-widget>
    <div class="qt-df qt-jc-sb qt-mb-16">
      <app-ticket-priority-widget  [dashboardTicketsStats]="dashboardTicketsStats"></app-ticket-priority-widget>
      <app-recurring-ticket-widget [dashboardTicketsStats]="dashboardTicketsStats" ></app-recurring-ticket-widget>
      <app-time-on-tickets-widget></app-time-on-tickets-widget>
          </div>
    <app-tickets-billable-hours-widget></app-tickets-billable-hours-widget>

  </div>
</div>
