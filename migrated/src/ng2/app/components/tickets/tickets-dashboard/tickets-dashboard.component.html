 <div class="billing-dashboard-page">
  <div class="loading" *ngIf="showPreloader"></div>
  <div class="billing-dashboard-page__content" *ngIf="!showPreloader">
    <div class="qt-df qt-ai-c qt-jc-sb qt-mb-16">
      <h3 class="list-title qt-mt-0 qt-mb-0 qt-fs-16 qt-ff-sb">Dashboard</h3>
      <div [textContent]="'Accounting date: ' + getTextAccountingStartDate()"></div>
    </div>

    <div class="qt-df qt-jc-sb qt-mb-16">
      <app-dashboard-stats [title]="'Open Tickets'" [total]="dashboard.openTickets" [class]="'icon__total-sales'"></app-dashboard-stats>
    <!-- <app-dashboard-total-sales [totalSales]="dashboard.totalSales"></app-dashboard-total-sales>
-->
<app-dashboard-stats [title]="'On-hold Tickets'" [total]="dashboard.onHoldTickets" [class]="'icon__unpaid-invoice'"></app-dashboard-stats>

    <!-- <app-dashboard-unpaid-invoices [totalReceivableUnpaid]="dashboard.totalReceivableUnpaid"></app-dashboard-unpaid-invoices>-->
    <app-dashboard-stats [title]="'New Tickets'" [total]="0" [class]="'icon__unbilled-amount'"></app-dashboard-stats>

    <!--  <app-dashboard-unbilled-amount [totalBillable]="dashboard.totalBillable"></app-dashboard-unbilled-amount>-->
    <app-dashboard-stats [title]="'Completed Tickets'" [total]="0" [class]="'icon__quotes'"></app-dashboard-stats>

    <app-dashboard-stats [title]="'Recurring Tickets'" [total]="0" [class]="'icon__quotes'"></app-dashboard-stats>

    <!-- <app-dashboard-total-quotes [saleQuotesPossibleRevenue]="dashboard.saleQuotesPossibleRevenue"></app-dashboard-total-quotes>-->
    </div>
    <div class="qt-df qt-jc-sb qt-mb-16">
      <app-ticket-priority-dashboard   ></app-ticket-priority-dashboard>
      
      
      
      
      <app-recurring-ticket-dashboard  ></app-recurring-ticket-dashboard>
          </div>
   
  </div>
</div>
