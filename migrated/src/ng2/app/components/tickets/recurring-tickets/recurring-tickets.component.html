<div class="recurring-tickets-content">
  <app-recurring-tickets-header></app-recurring-tickets-header>
  <div class="recurring-tickets__list">
    <div class="recurring-tickets__list--header clearfix">
      <div class="col-md-3 pointer with-checkbox">
        <label class="checkbox-container">
          <input type="checkbox">
          <span class="checkbox-mark"></span>
        </label>
        <p (click)="sortBy('company_name')">Company Name</p>
      </div>
      <div class="col-md-2 pointer" (click)="sortBy('agent_label')">Device</div>
      <div class="col-md-3 pointer" (click)="sortBy('description')">Description</div>
      <div class="col-md-1 pointer" (click)="sortBy('startDate')">Start Date</div>
      <div class="col-md-1">Interval</div>
      <div class="col-md-2">Assigned User</div>
    </div>
    <div class="ticket-content" infiniteScroll
         [infiniteScrollDistance]="2"
         [infiniteScrollThrottle]="50"
         [infiniteScrollDisabled]="infiniteScrollDisabled"
         (scrolled)="onScroll()">
      <ng-template ngFor let-ticket [ngForOf]="ticketList" [ngForTrackBy]="trackById">
        <app-recurring-tickets-table [ticket]="ticket"></app-recurring-tickets-table>

      </ng-template>
    </div>
    <div class="loading" *ngIf="showPreloader"></div>
  </div>
</div>
<app-recurring-tickets-edit-aside></app-recurring-tickets-edit-aside>
<app-recurring-tickets-add-aside></app-recurring-tickets-add-aside>
