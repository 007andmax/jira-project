<ng-sidebar-container>
  <ng-sidebar [(opened)]="opened" [position]="'right'">
    <div class="recurring-tickets-content__modal open">
      <div class="recurring-tickets-content__modal--header">
        <h3>Create Recurring Service</h3>
        <button class="close-modal" (click)="close()"></button>
      </div>
      <!-- <form class="recurring-tickets-content__modal--content clearfix" [formGroup]="ticketForm">-->
      <div class="recurring-tickets-content__modal--content clearfix">
        <div class="col-md-12">
          <p>Service Description</p>
          <input type="text" id="service-description" placeholder="Write Description" (input)="onChangeDescription($event)">
        </div>

        <div class="col-md-12">
          <p>Assign to Company</p>
          <app-select-client-company style="width: 75%;" class="light-dropdown" [formGroup]="ticketForm"
         
                                     (selectedItem)="selectClient($event)"></app-select-client-company>
        </div>

        <div class="col-md-4">
          <p>Device Name</p>
          <app-devices-recurring-tickets style="width: 75%;" class="light-dropdown" [formGroup]="ticketForm"
          [editItem]="ticketForEdit.agent"
                                         [companyId]="(selectedClient) ? selectedClient.id : ''"
                                         (selectedItem)="selectDevice($event)">
          </app-devices-recurring-tickets>
        </div>

        <div class="col-md-4">
          <p>Date</p>
          <div class="input-group date-picker" ngbDropdown [autoClose]="'outside'" #date="ngbDropdown">
            <input type="text" class="pointer" placeholder="Select Date" ngbDropdownToggle id="dropdownDate" readonly>
            <i class="icn-16 icn-calendar-light pointer"></i>
            <div ngbDropdownMenu aria-labelledby="dropdownDate"><!-- <div *ngIf="showDatePicker" class="dropdown-menu show" style="top: 100%;">-->
              <ngb-datepicker [navigation]="navigation" [(ngModel)]="datepicker" (select)="selectDate($event)"
                              (navigate)="navigateDate($event)" [startDate]="datepicker"
                              [ngModelOptions]="{standalone: true}"
                              style="border: none"></ngb-datepicker>
              <div class="date-picker-actions clearfix">
                <div class="col-md-12 p-0 mb-5 d-f">
                  <button class="btn-new btn-primary-white" (click)="selectToday();">Start Now</button>
                  <button class="btn-new btn-primary-white" (click)="selectTomorrow();">Tomorrow</button>
                </div>
                <div class="col-md-12 p-0 d-f">
                  <button class="btn-new btn-primary-white" (click)="selectStartMonth();">Start of Month</button>
                  <button class="btn-new btn-primary-white" (click)="selectEndMonth();">End of Month</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <app-interval (cronChange)="onChangeCron($event)"></app-interval>

        <div class="col-md-12 ticket-tabs">

          <!--ONCLICK ADD CLASS 'active-tab'------------------------------------>
          <div class="ticket-tabs-product d-f ai-c" (click)="type = 'products'"
               [ngClass]="(type === 'products') ? 'active-tab' : ''">
            <i class="icn-20 tab-product"></i>
            Products
          </div>
          <!-------------------------------------------------------------------->

          <!--ONCLICK ADD CLASS 'active-tab'------------------------------------>
          <div class="ticket-tabs-service d-f ai-c" (click)="type = 'services'"
               [ngClass]="(type === 'services') ? 'active-tab' : ''">
            <i class="icn-20 tab-service"></i>
            Service
          </div>
          <!-------------------------------------------------------------------->

        </div>

        <!--IF TAB IS 'PRODUCT'------------------------------------------------->
        <div class="col-md-12 product-tab-content p-0" *ngIf="type === 'products'">
          <ng-template ngFor let-product [ngForOf]="products" let-i="index" [ngForTrackBy]="trackByIndex">
            <div [ngClass]="{'separator-hr': products.length > 1}" class="row product-tab-content__item">
              <div class="col-md-12">
                <p>Search Product</p>

                <div class="product-dropdown-new-ng light-dropdown">
                  <input class="pointer" type="text" (click)="product.isDropDownShowProducts = true;"
                         [ngClass]="{'no-valid': isFormValid}" [value]="getNameOrDescription(product)"
                         placeholder="Product">
                  <i class="icn-sm report-caret-icon"></i>
                  <app-product-list *ngIf="product.isDropDownShowProducts" [itemList]="productList"
                                    (selectedProductItem)="selectProduct($event,i)"></app-product-list>

                </div>
                <i class="icn-delete" *ngIf="products.length > 1" (click)="removeProduct(i)"></i>

              </div>
              <div class="col-md-4 mt-20">
                <p>Serial No.</p>
                <input type="text" [(ngModel)]="product.manufacture" placeholder="Write Serial No.">
              </div>
              <div class="col-md-4 mt-20">
                <p>Product Cost</p>
                <input type="text" [(ngModel)]="product.cost" placeholder="Write Product Cost">
              </div>
              <div class="col-md-4 mt-20">
                <p>Quantity</p>
                <input type="text" [(ngModel)]="product.quantity" placeholder="Write Quantity">
              </div>
              <div class="col-md-4 mt-20">
                <p>Product Price</p>
                <input type="text" [(ngModel)]="product.sale" placeholder="Write Product Price">
              </div>
              <div class="col-md-4 mt-20">
                <p>Discount</p>
                <input type="text" [(ngModel)]="product.discount" placeholder="Write Discount">
              </div>
            </div>
          </ng-template>
        </div>
        <div class="new-link" *ngIf="type === 'products'" (click)="addProduct()">+Add Product</div>
        <!---------------------------------------------------------------------->

        <!--IF TAB IS 'SERVICE'------------------------------------------------->
        <div class="col-md-12 service-tab-content p-0" *ngIf="type === 'services'">
          <ng-template ngFor let-service [ngForOf]="services" let-i="index" [ngForTrackBy]="trackByIndex">
            <div [ngClass]="{'separator-hr': services.length > 1}" class="row service-tab-content__item">
              <div class="col-md-8">
                <p>Service</p>
                <div class="light-dropdown">
                  <input class="pointer" type="text" (click)="service.isDropDownShowServices = true;"
                         [ngClass]="{'no-valid': isFormValid}" [value]="getNameOrDescription(service)"
                         placeholder="Service">
                  <i class="icn-sm report-caret-icon"></i>
                  <app-services-list *ngIf="service.isDropDownShowServices" [itemList]="servicesList"
                                     (selectedServicesItem)="setService($event,i)"></app-services-list>
                </div>
              </div>
              <div class="col-md-4">
                <p>Duration</p>
                <app-duration style="width: 75%;" class="light-dropdown" [formGroup]="ticketForm"
                              (selectedDucation)="selectDuration($event,i)" [editItem]="service.duration"></app-duration>
                <i class="icn-delete" *ngIf="services.length > 1" (click)="removeService(i)"></i>
              </div>
              <div class="col-md-12 mt-20">
                <p>Description</p>
                <input type="text" [(ngModel)]="service.description" placeholder="Write Description">
              </div>
            </div>
          </ng-template>
        </div>
        <div class="new-link" *ngIf="type === 'services'" (click)="addService()">+Add Service</div>
        <!---------------------------------------------------------------------->

        <app-tags (tagsChange)="onChangeTags($event)" ></app-tags>

        <div class="col-md-12 checkbox-wrapper">
          <div class="with-checkbox">
            <label class="checkbox-container">
              <input id="requireUpdate" type="checkbox">
              <span class="checkbox-mark"></span>
            </label>
            <p>Require update Notes</p>
          </div>
          <div class="with-checkbox">
            <label class="checkbox-container">
              <input id="quickClose"  type="checkbox">
              <span class="checkbox-mark"></span>
            </label>
            <p>Quick Close</p>
          </div>
          <div class="with-checkbox">
            <label class="checkbox-container">
              <input id="createTask"  type="checkbox">
              <span class="checkbox-mark"></span>
            </label>
            <p>Create Task for user</p>
          </div>
        </div>

        <div class="col-md-12 recurring-tickets-content__modal--content-footer">
          <div class="d-f">
            <button class="btn-new btn-primary" (click)="save()">Save & Next</button>
            <button class="btn-new disabled" (click)="close()">Cancel</button>
          </div>
          <div class="save-template">
            <app-teh-users  (usersChange)="onChangeTehUsers($event)"></app-teh-users>
            <!--<ng-template ngFor let-user [ngForOf]="tehUsers" let-i="index" [ngForTrackBy]="trackByIndex">-->
            <!--<div *ngIf="user.avatar" >-->
            <!--<img ng-if="user.avatar" class="img-circle avatar-26"-->
            <!--[src]="'/users/' + (user.id || 'default') + '/image' + (user.avatar ? '.jpg?t=' + user.avatar.updatedAt : '')"-->
            <!--alt="...">-->
            <!--</div>-->
            <!--<div *ngIf="!user.avatar">-->
            <!--<div class="default-user-avatar avatar-background-color-odd ng-scope">-->
            <!--<span [textContent]="user.firstName[0].toUpperCase()"></span><span-->
            <!--[textContent]="user.lastName[0].toUpperCase()"></span></div>-->
            <!--</div>-->
            <!--</ng-template>-->
          </div>
        </div>
        <!-- </form>-->
      </div>
    </div>

  </ng-sidebar>
</ng-sidebar-container>
