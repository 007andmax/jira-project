<ng-sidebar-container>
  <ng-sidebar
    [(opened)]="opened"
    [position]="'right'"
  >
    <div class="recurring-tickets-content__modal open">
      <div class="recurring-tickets-content__modal--header">
        <h3>Create Recurring Service</h3>
        <button class="close-modal" (click)="close()"></button>
      </div>
      <form class="recurring-tickets-content__modal--content clearfix"  [formGroup]="ticketForm">
        <div class="col-md-12">
          <p>Service Description</p>
          <input type="text"
                 placeholder="Write Description">
        </div>

        <div class="col-md-12">
          <p>Assign to Company</p>
          
          <app-select-client-company style="width: 75%;"
                                 class="light-dropdown"
                                 [formGroup]="ticketForm"
                                 (selectedItem)="selectClient($event)"> </app-select-client-company>
        </div>

        <div class="col-md-4">
            <app-devices-recurring-tickets style="width: 75%;"
                                 class="light-dropdown"
                                 [formGroup]="ticketForm"
                                 [companyId]="selectedClient.id"
                                 (selectedItem)="selectDevice($event)"> </app-devices-recurring-tickets>
        <!--  <p>Select Device</p>
          <div class="light-dropdown">
            <input type="text"
                   class="pointer"
                   type="text"
                    [(ngModel)]="devicesList"
                    class="pointer"
                    [inputFormatter]="formatter"
                    [resultFormatter]="formatter"
                    [ngbTypeahead]="search"
                    (selectItem)="selectDevice($event)"
                    (focus)="focus$.next('')"
                    (click)="click$.next('')"
                    #instance="ngbTypeahead"
                   placeholder="Select Device">
            <i class="icn-sm report-caret-icon"></i>
          </div>-->
        </div>

        <div class="col-md-4">
          <p>Date</p>
          <div class="input-group"
               ngbDropdown>
            <input type="text"
                   class="pointer"
                   placeholder="Select Date"
                   formControlName="date"
                   [value]="date.title"
                   id="dropdownForm1"
                   (click)="toggleDatePicker()"
                   readonly>
            <i class="icn-16 icn-calendar-light pointer"></i>
            <div class="date-picker"
            *ngIf="showDatePicker">
              <ngb-datepicker [navigation]="navigation"
              [(ngModel)]="datepicker"
              (select)="selectDate($event)"
              (navigate)="navigateDate($event)"
              [startDate]="datepicker"
              [ngModelOptions]="{standalone: true}"
              
                              style="border: none"></ngb-datepicker>
              <div class="date-picker-actions clearfix">
                <div class="col-md-12 p-0 mb-5 d-f">
                  <button class="btn-new btn-primary-white" (click)="selectToday();">Start Now</button>
                  <button class="btn-new btn-primary-white" (click)="selectTomorrow();">Tomorrow</button>
                </div>
                <div class="col-md-12 p-0 d-f">
                  <button class="btn-new btn-primary-white" (click)="selectStartMonth();">Start of Month</button>
                  <button class="btn-new btn-primary-white" (click)="selectEndMonth();">End of Month</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <p>Set Interval</p>
          <div class="light-dropdown right"
               ngbDropdown>
            <input type="text"
                   class="pointer"
                   placeholder="Select Interval"
                   id="dropdownForm2"
                   ngbDropdownToggle>
            <i class="icn-sm report-caret-icon"></i>
            <div class="recurring-interval-dropdown"
                 ngbDropdownMenu
                 aria-labelledby="dropdownForm2">
              <div class="recurring-interval-dropdown">
                <div class="recurring-interval-dropdown__header">
                  <label class="radio-container">Daily
                    <input type="radio"
                           checked
                           name="recurring-interval">
                    <span class="radio-mark"></span>
                  </label>
                  <label class="radio-container">Weekly
                    <input type="radio"
                           name="recurring-interval">
                    <span class="radio-mark"></span>
                  </label>
                  <label class="radio-container">Monthly
                    <input type="radio"
                           name="recurring-interval">
                    <span class="radio-mark"></span>
                  </label>
                </div>

                <!--IF TYPE 'DAILY' OR 'WEEKLY'-------------------------------->
                <div class="recurring-interval-dropdown__content clearfix">
                  <div class="col-md-6 p-0">
                    <label class="checkbox-container">Monday
                      <input type="checkbox">
                      <span class="checkbox-mark"></span>
                    </label>
                    <label class="checkbox-container">Tuesday
                      <input type="checkbox">
                      <span class="checkbox-mark"></span>
                    </label>
                    <label class="checkbox-container">Wednesday
                      <input type="checkbox">
                      <span class="checkbox-mark"></span>
                    </label>
                    <label class="checkbox-container">Thursday
                      <input type="checkbox">
                      <span class="checkbox-mark"></span>
                    </label>
                  </div>
                  <div class="col-md-6 p-0">
                    <label class="checkbox-container">Friday
                      <input type="checkbox">
                      <span class="checkbox-mark"></span>
                    </label>
                    <label class="checkbox-container">Saturday
                      <input type="checkbox">
                      <span class="checkbox-mark"></span>
                    </label>
                    <label class="checkbox-container">Sunday
                      <input type="checkbox">
                      <span class="checkbox-mark"></span>
                    </label>
                  </div>
                </div>
                <!------------------------------------------------------------->

                <!--IF TYPE 'MONTHLY'------------------------------------------>
                <div class="date-picker">
                  <ngb-datepicker
                    style="width: 100%;border: none"
                    [navigation]="navigation"></ngb-datepicker>
                  <div class="date-picker-actions d-f">
                    <button class="btn-new btn-primary-white">Start of Month</button>
                    <button class="btn-new btn-primary-white">End of Month</button>
                  </div>
                </div>
                <!------------------------------------------------------------->
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-12 ticket-tabs">

          <!--ONCLICK ADD CLASS 'active-tab'------------------------------------>
          <div class="ticket-tabs-product d-f ai-c" (click)="type = 'products'" [ngClass]="(type === 'products') ? 'active-tab' : ''">
            <i class="icn-20 tab-product"></i>
            Products
          </div>
          <!-------------------------------------------------------------------->

          <!--ONCLICK ADD CLASS 'active-tab'------------------------------------>
          <div class="ticket-tabs-service d-f ai-c" (click)="type = 'services'" [ngClass]="(type === 'services') ? 'active-tab' : ''">
            <i class="icn-20 tab-service"></i>
            Service
          </div>
          <!-------------------------------------------------------------------->

        </div>

        <!--IF TAB IS 'PRODUCT'------------------------------------------------->
        <div class="col-md-12 product-tab-content p-0" *ngIf="type === 'products'">
          
         <div class="product-dropdown-new-ng light-dropdown">
           <input class="pointer"
                  type="text"
                  (click)="toggleShowDropDownProducts()"
                  [ngClass]="{'no-valid': isFormValid}"
                  [value]="getNameOrDescription(product)"
                  placeholder="Product">
           <i class="icn-sm report-caret-icon"></i>
           <app-product-list *ngIf="isDropDownShowProducts"
                             [itemList]="productList"
                             (selectedProductItem)="setProductItem($event)"></app-product-list>
       
       </div>
        
          <div class="col-md-4 mt-20">
            <p>Serial No.</p>
            <input type="text"
            formControlName="serial"
            [(ngModel)]="product.manufacture"
                   placeholder="Write Serial No.">
          </div>
          <div class="col-md-4 mt-20">
            <p>Product Cost</p>
            <input type="text"
            formControlName="cost"
            [(ngModel)]="product.cost"
                   placeholder="Write Product Cost">
          </div>
          <div class="col-md-4 mt-20">
            <p>Quantity</p>
            <input type="text"
            formControlName="quantity"
            [(ngModel)]="product.quantity"
                   placeholder="Write Quantity">
          </div>
          <div class="col-md-4 mt-20">
            <p>Product Price</p>
            <input type="text"
            formControlName="price"
            [(ngModel)]="product.sale"
                   placeholder="Write Product Price">
          </div>
          <div class="col-md-4 mt-20">
            <p>Discount</p>
            <input type="text"
            formControlName="discount"
         
                   placeholder="Write Discount">
          </div>
          <div class="new-link">+Add Product</div>
        </div>
       
        <!---------------------------------------------------------------------->

        <br>

        <!--IF TAB IS 'SERVICE'------------------------------------------------->
        <div class="col-md-12 service-tab-content p-0" *ngIf="type === 'services'">
           
          <div class="col-md-8">
              <div class="light-dropdown">
                  <input class="pointer"
                         type="text"
                         (click)="toggleShowDropDownServices()"
                         [ngClass]="{'no-valid': isFormValid}"
                         [value]="getNameOrDescription(service)"
                         placeholder="Service">
                  <i class="icn-sm report-caret-icon"></i>
                  <app-services-list
                    *ngIf="isDropDownShowServices"
                    [itemList]="servicesList"
                    (selectedServicesItem)="setServiceItem($event)"></app-services-list>
                </div>
          </div>
          <div class="col-md-4">
            <p>Duration</p>
            <input type="text"
                   class="pointer"
                   placeholder="Hr(s) : Min(s)">
          </div>
          
          <div class="col-md-12 mt-20">
            <p>Description</p>
            <input type="text"
            [(ngModel)]="service.description"
            formControlName="description"
           
                   placeholder="Write Description">
          </div>
          <div class="new-link">+Add Service</div>
        </div>
       
        <!---------------------------------------------------------------------->

        <div class="col-md-12 tags-wrapper">
          <p>Tags</p>
          <input type="text"
                 placeholder="Select Tag"
                 class="pointer">
        </div>

        <div class="col-md-12 checkbox-wrapper">
          <div class="with-checkbox">
            <label class="checkbox-container">
              <input type="checkbox">
              <span class="checkbox-mark"></span>
            </label>
            <p>Require update Notes</p>
          </div>
          <div class="with-checkbox">
            <label class="checkbox-container">
              <input type="checkbox">
              <span class="checkbox-mark"></span>
            </label>
            <p>Quick Close</p>
          </div>
          <div class="with-checkbox">
            <label class="checkbox-container">
              <input type="checkbox">
              <span class="checkbox-mark"></span>
            </label>
            <p>Create Task for user</p>
          </div>
        </div>

        <div class="col-md-12 recurring-tickets-content__modal--content-footer">
          <div class="d-f">
            <button class="btn-new btn-primary">Save & Next</button>
            <button class="btn-new disabled">Cancel</button>
          </div>
          <div class="save-template">Save as Template</div>
        </div>
      </form>
    </div>

  </ng-sidebar>
</ng-sidebar-container>
