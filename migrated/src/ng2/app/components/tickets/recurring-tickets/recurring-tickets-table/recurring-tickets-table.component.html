<div class="recurring-tickets-content__list--item clearfix">
  <div class="col-md-3">
    <label class="checkbox-container">
      <input type="checkbox">
      <span class="checkbox-mark"></span>
    </label>
    <div class="circle-avatar" [textContent]="getParseShortName(ticket.company.name)"></div>
    <p class="ff-g-m fw-600" [textContent]="ticket.company.name"></p>
  </div>
  <div class="col-md-2" [textContent]="(ticket.agent) ? ticket.agent.label : ''"></div>
  <div class="col-md-3" [textContent]="ticket.description"></div>
  <div class="col-md-1" [textContent]="getPareDate(ticket.startDate)"></div>
  <div class="col-md-1">Daily</div>
  <div class="col-md-2 assigned-container">
    <div class="assigned-wrapper"></div>

    <div class="grey-dropdown right with-icons"
      ngbDropdown>
      <i class="icn-16 more-vertical-ng2 pointer"
         id="dropdownBasic"
         ngbDropdownToggle></i>
      <div ngbDropdownMenu aria-labelledby="dropdownBasic">
        <button ngbDropdownItem (click)="editTicket()"><i class="icn-16 edit-grey-ng2"></i>Edit</button>
        <button ngbDropdownItem><i class="icn-16 email-grey-ng2"></i>Email</button>
        <button ngbDropdownItem><i class="icn-16 archive-grey-ng2"></i>Archive</button>
      </div>
    </div>
  </div>
</div>
