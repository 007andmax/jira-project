<tr>
  <td>
    <div class="d-f">
      <div class="qt-table-modern__circle-avatar" [textContent]="getNameForAvatar()"
        [ngStyle]="{'background': getStyleAvatar(requestedUser),'background-size': 'cover'}"></div>
      <div [textContent]="getUserName(requestedUser)"></div>
    </div>
  </td>
  <td class="--strong">{{'Tkt# ' + ticket.number + ' - ' + ticket.subject}} <span [ngClass]="getClassType()"></span>
  </td>
  <td [textContent]="getCompanyName()"></td>

  <td *ngIf="!ticket.assignedUserId && ticket.multiAssignedUsers.length > 0">
   
      <div class="d-f">
        <ng-template ngFor let-user [ngForOf]="ticket.multiAssignedUsers" [ngForTrackBy]="trackById">
        <div class="qt-table-modern__circle-avatar" [textContent]="getAssignedUserNameForAvatar(user)"
          [ngStyle]="{'background': getStyleAvatar(user),'background-size': 'cover'}"></div>
      
      </ng-template>
      </div>
   


  </td>
  <td *ngIf="!ticket.assignedUserId && ticket.multiAssignedUsers.length === 0"></td>
  <td *ngIf="ticket.assignedUserId && ticket.multiAssignedUsers.length === 0">
    <div class="d-f">
      <div class="qt-table-modern__circle-avatar" [textContent]="getAssignedUserNameForAvatar(assignedUser)"
        [ngStyle]="{'background': getStyleAvatar(assignedUser),'background-size': 'cover'}"></div>
      <div [textContent]="getUserName(assignedUser)"></div>
    </div>
  </td>
  <td> <span class="tag__modern --info" *ngIf="ticket.status === 'IN_PROGRESS'">In Progress</span>
    <span class="tag__modern --success" *ngIf="ticket.status === 'COMPLETED'">Completed</span>
    <span class="tag__modern" *ngIf="ticket.status === null">Unassigned</span>
    <span class="tag__modern --warning" *ngIf="ticket.status === 'ON_HOLD'">On Hold</span></td>
  <td [textContent]="getCreateAt()"></td>
</tr>
