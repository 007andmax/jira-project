<div class="table-container">
<table class="qt-table-modern ticket-table">
  <thead>
      <tr>
        <th class="ticket-table__requested-by">Requested By</th>
        <th class="ticket-table__subject">Subject</th>
        <th class="ticket-table__company">Company</th>
        <th class="ticket-table__assignee">Assignee</th>
        <th class="ticket-table__status">Status</th>
        <th class="ticket-table__created-date">Created Date</th>
      </tr>
  </thead>
  <tbody  infiniteScroll
  [infiniteScrollDistance]="2"
  [infiniteScrollThrottle]="15"
  [infiniteScrollDisabled]="infiniteScrollDisabled"
  (scrolled)="onScroll()">
  
  <ng-template ngFor let-ticket
              [ngForOf]="tickets"
              [ngForTrackBy]="trackById">
   <app-tickets-table-item (click)="editTicket(ticket.id)" [listColors]="listColors" [statusColor]="statusColor"  [ticket]="ticket"></app-tickets-table-item>
 </ng-template>
  </tbody>
</table>
  <div class="loading" *ngIf="showPreloader"></div>
</div>
