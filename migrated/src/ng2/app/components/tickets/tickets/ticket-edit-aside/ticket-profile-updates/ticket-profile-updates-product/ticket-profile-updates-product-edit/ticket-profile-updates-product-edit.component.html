<div class="d-f jc-sb ai-fs ticket-updates__ticket-info-container">
  <div class="ticket-updates__ticket-info">
    <div class="ticket-updates__ticket-header d-f">
      <div class="ticket-updates__ticket-header-name">Product Name</div>
      <div class="ticket-updates__ticket-header-price">Price</div>
      <div class="ticket-updates__ticket-header-qty">Qty</div>
      <div class="ticket-updates__ticket-header-total">Total</div>
    </div>
    <div class="d-f ticket-updates__ticket-body" [ngClass]="{'--done':editProduct.completed}">
      <div class="ticket-updates__done-status icon__task-pending"></div>
      <app-product-list [editItem]="editProduct.item" class="product-item__prodect-list" [itemList]="productList"
      (selectedProductItem)="onChangeProduct($event)"></app-product-list>

      <input  [(ngModel)]="editProduct.item.sale"   />
     <input  [(ngModel)]="editProduct.quantity"   />
      <div class="ticket-updates__ticket-total" [textContent]="'$' + getTotal(editProduct.item.sale,editProduct.quantity)"></div>

      <div class="ticket-updates__date-icon icon__assign-date"></div>
      <div class="ticket-updates__photo-people" [textContent]="ticketsListService.getAssignedUserNameForAvatar(editProduct.user)"
      [ngStyle]="{'background': ticketsListService.getStyleAvatar(editProduct.user),'background-size': 'cover'}"></div>
    </div>
    <span  class="tag__modern ticket-updates__service-tag-completed" *ngIf="editProduct.completed" [textContent]="'Completed on ' + getDate(editProduct.date)"></span>
    <span  class="tag__modern ticket-updates__service-tag-completed" *ngIf="!editProduct.completed && editProduct.date" [textContent]="'Due date - ' + getDate(editProduct.date)"></span>


  </div>
  <button (click)="saveProduct()"><i class="icn-16 archive-grey-ng2"></i>save
  </button>
  <button (click)="cancelProduct()"><i class="icn-16 archive-grey-ng2"></i>cancel
  </button>
</div>
