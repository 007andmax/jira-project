<div class="col-md-12">
  <mat-form-field>
    <mat-chip-list #chipList aria-label="Fruit selection">
      <mat-chip
        *ngFor="let user of selectedUsers; let i = index"
        [selectable]="selectable"
        [removable]="removable"
        (removed)="remove(i)">
        <div class="assigne-user-item">
          <div class="assigne-user-avatar" [textContent]="getAssignedUserNameForAvatar(user)"
          [ngStyle]="{'background': getStyleAvatar(user),'background-size': 'cover'}"></div>
          <div [textContent]="getUserName(user)"></div>
         
          <mat-icon matChipRemove *ngIf="removable">cancel</mat-icon>
        </div>
       
      </mat-chip>
      <input
        placeholder="Add receipt email address"
        #userInput
        class="pointer"
        [formControl]="userCtrl"
        [matAutocomplete]="auto"
        [matChipInputFor]="chipList"
        [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
        (input)="onSearchUser($event)"
        >
    </mat-chip-list>
    <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selected($event)">
      <mat-option *ngFor="let user of users" [value]="user">
        <div class="assigne-user-item">
        <div class="assigne-user-avatar" [textContent]="getAssignedUserNameForAvatar(user)"
        [ngStyle]="{'background': getStyleAvatar(user),'background-size': 'cover'}"></div>
        <div [textContent]="getUserName(user)"></div>
        <span [textContent]="user.primaryEmail"></span>
      </div>
      </mat-option>
    </mat-autocomplete>
  </mat-form-field>
  <p *ngIf="showError">at least 1 user</p>
  <p *ngIf="showErrorClient">please choose Client</p>
</div>
