<div  class="cps-block__products-block">
  <ng-template class="assigned-ticket-user" ngFor let-product [ngForOf]="addedProductList" let-i="index" [ngForTrackBy]="trackByIndex">

  <div class="product-item">
    <div class="product-item__first-line d-f">
      <app-product-list [editItem]="product.item" class="product-item__prodect-list" [itemList]="productList"
      (selectedProductItem)="onChangeProduct($event,i)"></app-product-list>
         <button class="product-item__btn-del " (click)="removeProduct(i)">
        <span class="icon__close btn-icon"></span>
      </button>
    </div>

    <div class="d-f">
      <label class="product-item__serial-num-input">
        <input class="product-item__input serial-num" type="text"  [(ngModel)]="product.serialNumber">
      </label>

      <label class="product-item__cost-input">
        <input class="product-item__input cost" type="text" 
        number
        [money]="true"
        [ngModel]="product.item.cost"
        (ngModelChange)="onChangeCostProduct($event, i)">
      </label>

      <label class="product-item__qty-input">
        <input class="product-item__input qty" [(ngModel)]="product.item.quantity" type="text">
      </label>

      <label class="product-item__price-input">
        <input class="product-item__input price" type="text" [(ngModel)]="product.item.sale"
        number
        [money]="true"
        [ngModel]="product.item.sale"
        (ngModelChange)="onChangeSaleProduct($event, i)">
      </label>

      <label class="product-item__discount-input">
        <input class="product-item__input" [(ngModel)]="product.discountAmount" type="text">
      </label>

    </div>
  </div>
  </ng-template>

  <div class="product-item">
    <div class="product-item__first-line d-f">
      <app-product-list #productDP class="product-item__prodect-list" [itemList]="productList"
      (selectedProductItem)="selectProduct($event)"></app-product-list>

      <button class="product-item__btn-add" (click)="addProduct()">
        <span class="icon__plus-white btn-icon"></span>
      </button>
    </div>

    <div class="d-f">
      <label class="product-item__serial-num-input">
        <input class="product-item__input serial-num"  [(ngModel)]="currentProduct.serialNumber" type="text">
      </label>

      <label class="product-item__cost-input">
        <input class="product-item__input cost" 
        number
        [money]="true"
        [ngModel]="currentProduct.item.cost"
        (ngModelChange)="onChangeCost($event)">
      </label>

      <label class="product-item__qty-input">
        <input class="product-item__input qty" [(ngModel)]="currentProduct.quantity">
      </label>

      <label class="product-item__price-input">
        <input class="product-item__input price"  
        number
        [money]="true"
        [ngModel]="currentProduct.item.sale"
        (ngModelChange)="onChangeSale($event)">
      </label>

      <label class="product-item__discount-input">
        <input class="product-item__input discount" [(ngModel)]="currentProduct.discountAmount" type="text">
      </label>
    </div>
  </div>
</div>
