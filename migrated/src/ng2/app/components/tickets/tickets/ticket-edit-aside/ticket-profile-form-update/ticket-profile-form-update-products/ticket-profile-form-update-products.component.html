<div  class="cps-block__products-block">
  <ng-template class="assigned-ticket-user" ngFor let-product [ngForOf]="addedProductList" let-i="index" [ngForTrackBy]="trackByIndex">

  <div class="product-item">
    <div class="product-item__first-line d-f">
      <app-product-list [editItem]="product.item" class="product-item__prodect-list" [itemList]="productList"
      (selectedProductItem)="onChangeProduct($event,i)"></app-product-list>
         <button class="product-item__btn-del " (click)="removeProduct(i)">
        <span class="icon__close btn-icon"></span>
      </button>
    </div>

    <div class="d-f">
      <input class="product-item__input serial-num" type="text"  [(ngModel)]="product.serialNumber" placeholder="Serial No">
      <input class="product-item__input cost" type="text" [(ngModel)]="product.item.cost" placeholder="Cost">
      <span class="product-item__input-with-prefix qty">
        <span class=product-item__prefix>Qty</span>
        <input class="product-item__input qty" [(ngModel)]="product.item.quantity" type="text">
      </span>
      <input class="product-item__input price" type="text" [(ngModel)]="product.item.sale" placeholder="Price">
      <span class="product-item__input-with-prefix discount">
        <span class=product-item__prefix>Discount</span>
        <input class="product-item__input" [(ngModel)]="product.discountAmount" type="text"  >
      </span>
    </div>
  </div>
  </ng-template>

  <div class="product-item">
    <div class="product-item__first-line d-f">
      <app-product-list #productDP class="product-item__prodect-list" [itemList]="productList"
      (selectedProductItem)="selectProduct($event)"></app-product-list>

      <button class="product-item__btn-add" (click)="addProduct()">
        <span class="icon__plus-white btn-icon"></span>
      </button>
    </div>

    <div class="d-f">
      <input class="product-item__input serial-num"  [(ngModel)]="currentProduct.serialNumber" type="text" placeholder="Serial No">
      <input class="product-item__input cost" [(ngModel)]="currentProduct.item.cost" placeholder="Cost">
      <input class="product-item__input qty" [(ngModel)]="currentProduct.quantity" placeholder="Qty">
      <input class="product-item__input price" [(ngModel)]="currentProduct.item.sale" placeholder="Price">
      <input class="product-item__input discount" [(ngModel)]="currentProduct.discountAmount" type="text" placeholder="Discount">
    </div>
  </div>
</div>
