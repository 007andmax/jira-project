<button (click)="hiddenAttachments = !hiddenAttachments">toggle</button>
<div [hidden]="hiddenAttachments">
<ng-template  ngFor let-attachment [ngForOf]="attachments" [ngForTrackBy]="trackById">
  <div >
    <p [textContent]="attachment.file.name"></p>
    <button (click)="download(attachment.file.id,attachment.file.contentType,attachment.file.name)">download</button>
  </div>

  </ng-template>
</div>
