<div class="d-f ticket-updates__update-block"  >
  <div class="ticket-updates__ticket-photo" [textContent]="ticketsListService.getAssignedUserNameForAvatar(update.user)"
  [ngStyle]="{'background': ticketsListService.getStyleAvatar(update.user),'background-size': 'cover'}"></div>

  <div class="ticket-updates__content">
    <div class="ticket-updates__author-line d-f jc-sb ai-c ">
      <div><span class="ticket-updates__author" [textContent]="ticketsListService.getUserName(update.user)"> </span> <span class="ticket-updates__add-note">added a product</span></div>
      <div class="ticket-updates__delete icon__remove"></div>
    </div>
   
    <div class="d-f jc-sb ai-fs ticket-updates__ticket-info-container">
      <div class="ticket-updates__ticket-info">
        <div class="ticket-updates__ticket-header d-f">
          <div class="ticket-updates__ticket-header-name">Product Name</div>
          <div class="ticket-updates__ticket-header-price">Price</div>
          <div class="ticket-updates__ticket-header-qty">Qty</div>
          <div class="ticket-updates__ticket-header-total">Total</div>
        </div>
        <ng-template   ngFor let-product [ngForOf]="update.products" let-i="index" [ngForTrackBy]="trackByIndex">
        <div class="d-f ticket-updates__ticket-body" [ngClass]="{'--done':product.completed}">
          <div class="ticket-updates__done-status icon__task-pending"></div>
          <div class="ticket-updates__ticket-title" [textContent]="product.item.description"></div>
          <div class="ticket-updates__ticket-price" [textContent]="'$' + product.price"></div>
          <div class="ticket-updates__ticket-qty" [textContent]="product.quantity"></div>
          <div class="ticket-updates__ticket-total" [textContent]="'$' + getTotal(product.price,product.quantity)"></div>

          <div class="ticket-updates__date-icon icon__assign-date"></div>
          <div class="ticket-updates__photo-people" [textContent]="ticketsListService.getAssignedUserNameForAvatar(product.user)"
          [ngStyle]="{'background': ticketsListService.getStyleAvatar(product.user),'background-size': 'cover'}"></div>
        </div>
        <span  class="tag__modern ticket-updates__service-tag-completed" *ngIf="product.completed" [textContent]="'Completed on ' + getDate(product.date)"></span>
        <span  class="tag__modern ticket-updates__service-tag-completed" *ngIf="!product.completed && product.date" [textContent]="'Due date - ' + getDate(product.date)"></span>
     
      </ng-template>
      </div>
      <div class="ticket-updates__more icon__more"></div>
    </div>
  
    <app-ticket-profile-updates-footer [shares]="update.shares"></app-ticket-profile-updates-footer>
  </div>

</div>
