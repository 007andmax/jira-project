<div class="d-f ticket-updates__update-block"  >
  <div class="ticket-updates__ticket-photo" [textContent]="ticketsListService.getAssignedUserNameForAvatar(update.user)"
  [ngStyle]="{'background': ticketsListService.getStyleAvatar(update.user)}"></div>

  <div class="ticket-updates__content">
    <div class="ticket-updates__author-line d-f jc-sb ai-c ">
      <div><span class="ticket-updates__author" [textContent]="ticketsListService.getUserName(update.user)"> </span> <span class="ticket-updates__add-note">&nbsp;added a product</span></div>
      <div class="ticket-updates__delete icon__remove" (click)="remove()" placement="top" ngbTooltip="Delete Update"></div>
    </div>
    <ng-template   ngFor let-product [ngForOf]="update.products" let-i="index" [ngForTrackBy]="trackById">

  <app-ticket-profile-updates-product-item [update]="update" [product]="product"></app-ticket-profile-updates-product-item>
  </ng-template>
    <app-ticket-profile-updates-footer [date]="update.createdAt" [shares]="update.shares"></app-ticket-profile-updates-footer>
  </div>

</div>
