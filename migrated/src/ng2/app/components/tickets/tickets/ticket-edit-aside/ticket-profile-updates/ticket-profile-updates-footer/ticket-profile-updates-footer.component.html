<div class="d-f ai-c ticket-updates__update-info"  >
  <span class="ticket-updates__date" [textContent]="getDate()"></span>
  <span class="divider-point"></span>
  <span class="ticket-updates__people-added" [textContent]="' ' + shares.length + ' people added to this update'"></span>
  <div class="d-f">
    <ng-template   ngFor let-share [ngForOf]="shares" let-i="index" [ngForTrackBy]="trackByIndex">
      <ng-template #tipContent><span [textContent]="ticketsListService.getUserName(share.user)"></span><p [textContent]="((share.user.accountType === 'TECH') ? 'Tech' : 'Client') + ' user'"></p></ng-template>
      <div class="ticket-updates__photo-people" [textContent]="ticketsListService.getAssignedUserNameForAvatar(share.user)"
      [ngStyle]="{'background': ticketsListService.getStyleAvatar(share.user),'background-size': 'cover'}" placement="top" [ngbTooltip]="tipContent"></div>
      </ng-template>
  
      </div>
</div>
