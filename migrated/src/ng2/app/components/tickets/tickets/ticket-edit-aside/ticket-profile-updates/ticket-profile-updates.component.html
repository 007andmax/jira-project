<div class="ticket-updates">
  <div class="ticket-updates__title"><span class="ticket-updates__count" [textContent]="updates.length + ticketProfile.unloadedUpdates"></span> Ticket
    Updates</div>

  <div class="ticket-updates__ticket">
    <ng-template ngFor let-update [ngForOf]="updates" let-i="index" [ngForTrackBy]="trackByIndex">
      <app-ticket-profile-updates-note (onRemove)="removeUpdate($event)" *ngIf="update.type === 'NOTE'" [update]="update">
      </app-ticket-profile-updates-note>
      <app-ticket-profile-updates-product *ngIf="update.type === 'PRODUCT'" [update]="update">
      </app-ticket-profile-updates-product>
      <app-ticket-profile-updates-service *ngIf="update.type === 'SERVICE'" [update]="update">
      </app-ticket-profile-updates-service>
    </ng-template>

<button *ngIf="showLoadMoreUpdates" (click)="fetchUpdates()">Load More Updates</button>


  </div>
</div>
