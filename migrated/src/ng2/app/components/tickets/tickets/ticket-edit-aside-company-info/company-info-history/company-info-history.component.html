<div class="company-info-aside__history" infiniteScroll [infiniteScrollDistance]="2" [infiniteScrollThrottle]="15"
  [infiniteScrollDisabled]="infiniteScrollDisabled" (scrolled)="onScroll()">
  <ng-template ngFor let-ticket [ngForOf]="tickets" [ngForTrackBy]="trackById">
    <div class="company-info-aside__history-block">
      <div class="company-info-aside__history-block-title">
        {{'Tkt# ' + ticket.number + ' - ' + ticket.subject}}
      </div>
      <div class="company-info-aside__history-block-date" [textContent]="getCreateAt()">
      </div>
    </div>
  </ng-template>
  <div class="loading" *ngIf="showPreloader"></div>
</div>
