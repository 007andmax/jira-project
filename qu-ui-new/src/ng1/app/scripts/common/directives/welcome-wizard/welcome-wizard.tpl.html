<div class="welcome-wrapper container-fluid">
  <div class="welcome-wrapper__header">
    <h1 class="welcome-wrapper__header--description">
      Welcome to
      <img src="images/input-icons/Quicktech-logo.png" alt="">
    </h1>
    <p>Please update three areas so that you get the most out of your package</p>
  </div>
  <div class="first-time-setup-container">
    <div class="setup-point" ng-click="openSection('settings.techUsers')">
      <img src="images/input-icons/tech-user.png" alt="">
      <p>Add Staff</p>
      <span custom-disabled="{{ !currentUser.wizardTracker || !currentUser.wizardTracker.addStaff }}"
            class="confirm-arrow"></span>
    </div>
    <div class="setup-point" ng-click="openSection('settings.email')">
      <img src="images/input-icons/email-settings.png" alt="">
      <p>Email Settings</p>
      <span custom-disabled="{{ !currentUser.wizardTracker || !currentUser.wizardTracker.emailSettings }}"
            class="confirm-arrow"></span>
    </div>
    <div class="setup-point" ng-click="openSection('settings.taxes')">
      <img src="images/input-icons/taxes.png" alt="">
      <p>Rates</p>
      <span custom-disabled="{{ !currentUser.wizardTracker || !currentUser.wizardTracker.rates }}"
            class="confirm-arrow"></span>
    </div>
    <div class="setup-point" ng-click="openSection('settings.companyProfile', { fromWelcomeWizard: true })">
      <img src="images/input-icons/company-profile.png" alt="">
      <p>Company Settings</p>
      <span custom-disabled="{{ !currentUser.wizardTracker || !currentUser.wizardTracker.companySettings }}"
            class="confirm-arrow"></span>
    </div>
    <div class="setup-point" create-new-entity="company" ng-click="closeModal()">
      <img src="images/input-icons/group.png" alt="">
      <p>Setup Client</p>
      <span custom-disabled="{{ !currentUser.wizardTracker || !currentUser.wizardTracker.setupClient }}"
            class="confirm-arrow"></span>
    </div>
  </div>
  <div class="footer-container">
    <div uib-dropdown>

      <input class="form-control has-dropdown" type="text"
             ng-model="pageMapping[pageToOpen]" name="pageToOpen" make-dirty-on-blur
             uib-dropdown-toggle aria-expanded="false" readonly="readonly">

      <i class="icn-sm icn-caret-gray" style="top: 11px"></i>

      <ul class="dropdown-menu">

        <li>
          <a href="javascript:void(0)" ng-click="setPageToOpen('ALL')">All Tickets</a>
        </li>

        <li>
          <a href="javascript:void(0)" ng-click="setPageToOpen('UNASSIGNED')">Unassigned</a>
        </li>

        <li>
          <a href="javascript:void(0)" ng-click="setPageToOpen('MY_TICKETS')">My Tickets</a>
        </li>

        <li>
          <a href="javascript:void(0)" ng-click="setPageToOpen('SHARED')">Shared</a>
        </li>

        <li>
          <a href="javascript:void(0)" ng-click="setPageToOpen('OPEN')">Open</a>
        </li>

        <li>
          <a href="javascript:void(0)" ng-click="setPageToOpen('CLOSED')">Closed</a>
        </li>

        <li>
          <a href="javascript:void(0)" ng-click="setPageToOpen('TRASH')">Trash</a>
        </li>

        <li>
          <a href="javascript:void(0)" ng-click="setPageToOpen('SPAM')">Spam</a>
        </li>

      </ul>

    </div>
    <label class="control checkbox">
      <input type="checkbox" ng-model="dontShowThisAgain">
      <span class="control-indicator"></span>
      Don't show this again
    </label>
    <button class="btn btn-primary" ng-click="goToTickets()">Just take me to Tickets</button>
  </div>
</div>
