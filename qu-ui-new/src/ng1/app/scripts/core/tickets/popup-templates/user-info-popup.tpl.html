<div style="max-width: unset;">
  <div style="display: inline-flex;">
    <div class="pull-left" style="margin-right: 10px;">
      <img width="50px" ng-src="{{ getUserAvatarUrl(user) }}" alt="...">
    </div>
    <div class="pull-right" style="width: calc(100% - 50px)">
      <p style="white-space: nowrap; display: inline-flex;"><strong> {{ getUserName(user) }} </strong> <span
        ng-if="user.role" style="margin-left: 50px;"
        class="label label-light pull-right">{{ userReadable(user.role) }}</span>
      </p>
      <div style="display: inline-flex;" ng-if="!company.isDefault">
        <strong>Company:</strong> &nbsp;<span style="white-space: nowrap;">{{ company.name }}</span>
      </div>
      <div style="display: inline-flex;" ng-if="user.primaryEmail">
        <strong>Email:</strong> &nbsp; <span>{{ user.primaryEmail }}</span>
      </div>
      <div style="display: inline-flex;"
           ng-if="user.phoneNumbers && user.phoneNumbers.length && user.phoneNumbers[0].number">
        <i style="float: left;margin: 4px 5px 0 0;" class="icon-sm" ng-class="{'icn-iphone': user.phoneNumbers[0].typeNumber === 'MOBILE',
            'icn-user-fax': user.phoneNumbers[0].typeNumber === 'FAX',
            'icn-user-phone': user.phoneNumbers[0].typeNumber === 'OFFICE'}"></i>
        <strong>Phone:</strong> &nbsp; <span style="white-space: nowrap">{{ user.phoneNumbers[0].number }}</span>
      </div>
    </div>
  </div>
</div>
