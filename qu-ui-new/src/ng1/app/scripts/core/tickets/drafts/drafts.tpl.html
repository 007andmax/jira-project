<div>
  <div class="empty-page-helper" ng-if="!sources.length && !loadingOrRendering && !isAnyDraftsExist(sources)">
    <p style="opacity: 0.57">There are no inbox</p>
  </div>
  <div class="container-ticket-list inbox pull-left">

    <div class="ticket-list sources-wrap">
      <ul class="tickets sources">
        <li class="ticket" ng-repeat="source in sources track by source.source"
            draft-uploader ng-if="source.amount > 0" ng-click="openSource(source)"
            event-toggle-slider show-event="showDrafts{{ source.source }}" hide-event="hideDrafts{{ source.source }}">

          <div class="source">
            <div class="ticket-checkbox pull-left" stop-propagation="click">
              <label class="control checkbox" ng-mousedown="toggleSelectedDrafts(source)">
                <input type="checkbox" ng-model="source.selected"
                       custom-disabled="{{ !source.drafts || !source.drafts.length }}">
                <span class="control-indicator"></span>
              </label>
            </div>
            <div class="ticket-meta">
              <p><strong>{{ source.source }}</strong></p>
              <p style="display: block;"  class="text-muted">Amount: &nbsp;{{ source.amount }}</p>
            </div>
          </div>

          <ul class="drafts" drafts-container stop-propagation="click" ets-slider style="display: none;">
            <li class="ticket" ng-repeat="draft in source.drafts track by draft.id" on-finish-render="onFinishRendering()"
                ui-sref="drafts.details({ draftId: draft.id })" ng-class="{'active': draft.id === openedDraft}"
                ng-click="openDraft(draft.id)">
              <div class="ticket-checkbox pull-left" stop-propagation="click">
                <label class="control checkbox">
                  <input type="checkbox" ng-model="selectedDrafts[draft.id]" ng-change="toggleSelectedDraft(draft.id, source)">
                  <span class="control-indicator"></span>
                </label>
              </div>

              <div class="ticket-meta">
                <div class="ticket-list-header clearfix">
                  <p class="pull-left text-muted ellipsis">
                    <span ng-if="!draft.firstName && !draft.lastName">{{ draft.source }}</span>
                  </p>
                </div>

                <div class="ticket-title ellipsis clearfix">
                  <p class="pull-left ellipsis"><strong>{{ draft.number + (draft.subject ? (' - ' + draft.subject) : '') }}</strong></p>
                  <span class="text-muted ellipsis">{{ draft.previewNote || '&nbsp;' }}</span>
                  <a href="javascript:void(0)" class="ticket-list-attachment pull-right"
                     ng-show="draft.hasAttachment === true">
                    <i class="icn-sm icn-ticket-list-attachment"></i>
                  </a>
                  <p class="text-muted ellipsis">{{ draft.createdAt | ticketCreateDate }}</p>

                </div>
              </div>
            </li>
          </ul>

        </li>
      </ul>
    </div>
  </div>

  <div ui-view></div>
</div>
<script>
  (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
    m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
  })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');

  ga('create', 'UA-93441341-1', 'auto');
  ga('send', 'pageview');

</script>
