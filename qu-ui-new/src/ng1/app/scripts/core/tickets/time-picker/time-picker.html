<div class='proton-multi-list-picker {{attachment}}'>
  <span ng-transclude class='proton-multi-list-picker-contents'></span>
  <div class='before'></div>
  <div class='container'>
    <ul class='lists'>
      <li class='toolbar'>
        <a class='toolbar-button' ng-click='done({$model: model})'>Done</a>
      </li>
      <li class='before-lists' ng-init='first= false'></li>
      <li ng-repeat='list in items track by $index'
          class="list-container {{$index == 0 || first ? 'first' : ''}} {{$index == items.length - 1 ? 'last' :''}}"
          data-index='{{$index}}' proton-multi-list-motion data-motion-start='motionStart($event)'
          data-motion-change='motionChange($event)' data-motion-end='motionEnd($event)'>
          <span class="divider {{!list.value ? 'blank': ''}}"
           ng-if='list.$divider' ng-init='first = !list.value'>
            <span ng-if='!bindHtml' ng-bind='list.value'></span>
            <span ng-if='bindHtml' ng-bind-html='list.value'></span>
          </span>
          <ul class='list' ng-if='!list.$divider' data-selected='{{list.selected}}'>
            <li class="item {{item.index== list.selected ? 'selected' : ''}}
            {{(!list.cycle && list.selected &lt; 3) ? 'offset-down-' + (3 - list.selected) : ''}}
            {{(list.cycle ? item.cycleIndex : item.index) &lt; list.selected && (list.cycle ? item.cycleIndex : item.index) &gt;= list.selected - 3 ? 'distance-' + (list.selected - (list.cycle ? item.cycleIndex : item.index)) : ''}}

        {{(list.cycle ? item.cycleIndex : item.index) &gt; list.selected && (list.cycle ? item.cycleIndex : item.index)
        &lt;= list.selected + 3 ? 'distance-' + ((list.cycle ? item.cycleIndex : item.index) - list.selected) :''}}"
            ng-repeat='item in list.view track by $index' data-index='{{item.index}}'
          ng-click='select(list, item.index)'
          style='width: {{list.width}}px'>
        <span ng-if='item.$placeholder'></span>
        <span ng-if='!item.$placeholder && !bindHtml'
              ng-bind='item.label'></span>
        <span ng-if='!item.$placeholder && bindHtml' ng-bind-html='item.label'></span>
        </li>
      </ul>
      </li>
      <li class='after-lists'></li>
    </ul>
  </div>
  <div class='after'></div>
</div>
