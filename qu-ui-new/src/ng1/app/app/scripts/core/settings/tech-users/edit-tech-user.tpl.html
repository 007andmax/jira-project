<div>
  <div class="tech-action">
    <a href="javascript:void(0)" class="hit-area pull-right has-tooltip"
       tooltip-placement="top" uib-tooltip="Close"
       ng-click="openEditUser()">
      <i class="icn-sm icn-remove-old"></i>
    </a>
  </div>

  <div class="recepients" style="margin-left: 41px;">
    <strong>{{ editUser.id ? 'Edit' : 'Create' }} Tech User</strong>
  </div>

  <form name="editUserForm">

    <div class="create-user-container">

      <div class="create-user-form">

        <div class="row clearfix" style="margin-bottom: 15px;">

          <div class=" col-xs-6" ng-class="{'has-error': isShowingErrors(editUserForm, 'firstName')}">

            <label class="control-label" ng-class="{'hide': isShowingErrors(editUserForm, 'firstName')}">First
              Name</label>

            <div ng-messages="editUserForm.firstName.$error"
                 ng-class="{'hide': !isShowingErrors(editUserForm, 'firstName')}">
              <label class="control-label" ng-message="required">First name is required.</label>
              <label class="control-label" ng-message="maxlength">First name is too large.</label>
              <label class="control-label" ng-message="minlength">First name is too short.</label>
            </div>

            <input class="form-control" type="text" aria-expanded="true" ng-minlength="2" ng-maxlength="15"
                   name="firstName" ng-model="editUser.firstName" ng-required="true" make-dirty-on-blur>

          </div>

          <div class=" col-xs-6" ng-class="{'has-error': isShowingErrors(editUserForm, 'lastName')}">

            <label class="control-label" ng-class="{'hide': isShowingErrors(editUserForm, 'lastName')}">Last
              Name</label>

            <div ng-messages="editUserForm.lastName.$error"
                 ng-class="{'hide': !isShowingErrors(editUserForm, 'lastName')}">
              <label class="control-label" ng-message="maxlength">Last name is too large.</label>
            </div>

            <input class="form-control" type="text" aria-expanded="true" ng-maxlength="15"
                   name="lastName" ng-model="editUser.lastName" make-dirty-on-blur>

          </div>

        </div>

        <div class="row clearfix" style="margin-bottom: 15px;">

          <div class=" col-xs-6">

            <label class="control-label">Account Type</label>

            <div uib-dropdown>

              <input type="text"class="form-control has-dropdown form-control-dropdown dropdown-toggle no-cursor"
                     ng-model="editUser.techRole" custom-disabled="{{ editUser.isOwner }}" uib-dropdown-toggle aria-expanded="true" READONLY>
              <i class="icn-sm icn-caret-gray"></i>

              <ul class="dropdown-menu dropdown-account-type">
                <li ng-repeat="role in techRoles" ng-click="editUser.techRole = role; editUserForm.$setDirty()">
                  <a tabindex="-1" href="javascript:void(0)"> {{ role }} </a>
                </li>
              </ul>

            </div>

          </div>

          <div class=" col-xs-6" ng-class="{'has-error': isShowingErrors(editUserForm, 'primaryEmail')}">

            <label class="control-label"
                   ng-class="{'hide': isShowingErrors(editUserForm, 'primaryEmail')}">Email</label>

            <div ng-messages="editUserForm.primaryEmail.$error"
                 ng-class="{'hide': !isShowingErrors(editUserForm, 'primaryEmail')}">
              <label class="control-label" ng-message="required">Email field cannot be left empty.</label>
              <label class="control-label" ng-message="pattern">Please enter a valid email address.</label>
              <label class="control-label" ng-message="unique">This email already occupied.</label>
              <label class="control-label" ng-message="maxlength">Email mustn't be greater then 128 chars.</label>
            </div>

            <input class="form-control" type="text" name="primaryEmail" aria-expanded="true" make-dirty-on-blur
                   ng-model="editUser.primaryEmail" required="true" ng-pattern="emailPattern" ng-maxlength="128"
                   is-uniq-validation validation-func="validateUserEmail">

          </div>

        </div>

        <div class="form-row clearfix" style="padding: 0 15px;">

          <div class="btn btn-success pull-right"
               custom-disabled="{{ !editUserForm.$valid || editUserForm.$pristine || savingInProcess }}"
               ng-click="save(editUserForm)">
            {{ editUser.id ? 'Save' : 'Create' }}
          </div>

          <div class="btn btn-primary pull-right" style="margin-right: 10px"
               ng-click="openEditUser()">
            Cancel
          </div>

        </div>

      </div>
    </div>
  </form>
</div>

      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),

  })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
