<div role="tabpanel" class="tab-pane active">
  <ul class="qt-list qt-receipt-number">

    <li class="list-heading" style="cursor: pointer !important;" fixed-block-top offset-top="148">
      <div class="col-1" ng-click="setOrderForInvoices('number')">
        <span class="sort-span">
          invoice no.
          <i class="icn-sm sort-icon icn-sort"
             ng-class="{'rotate': orderInvoices.reverse, 'active': orderInvoices.field === 'number'}"></i></span>
      </div>
      <div class="col-2" ng-click="setOrderForInvoices('company')">
        <span class="sort-span">
          company
          <i class="icn-sm sort-icon icn-sort"
             ng-class="{'rotate': orderInvoices.reverse, 'active': orderInvoices.field === 'company'}"></i></span>
      </div>
      <div class="col-3" ng-click="setOrderForInvoices('date')">
        <span class="sort-span">
          invoice date
          <i class="icn-sm sort-icon icn-sort"
             ng-class="{'rotate': orderInvoices.reverse, 'active': orderInvoices.field === 'date'}"></i></span>
      </div>
      <div class="col-4" ng-click="setOrderForInvoices('paidOn')">
        <span class="sort-span">
          paid on
          <i class="icn-sm sort-icon icn-sort"
             ng-class="{'rotate': orderInvoices.reverse, 'active': orderInvoices.field === 'paidOn'}"></i></span>
      </div>
      <div class="col-5" ng-click="setOrderForInvoices('amount')">
        <span class="sort-span">
          amount
          <i class="icn-sm sort-icon icn-sort"
             ng-class="{'rotate': orderInvoices.reverse, 'active': orderInvoices.field === 'amount'}"></i></span>
      </div>
    </li>

    <li ng-repeat="invoice in receiptArchiveData.list | filter: filterByCompany | orderBy: orderByForInvoices : orderInvoices.reverse track by invoice.id"
        ng-controller="quicktech.core.receiptArchive.invoiceCtrl"
        on-finish-render="hideLoadingIndicator()">

      <div class="col-1">
        <label class="control checkbox pull-left">
          <input type="checkbox"
                 ng-disabled="!(selectableCompanyId === undefined || selectableCompanyId === company.id)"
                 ng-model="invoiceToSent.invoices[invoice.id]">
          <span class="control-indicator"></span>
        </label>

        <div class="checkbox-caption free-number-link"
             tooltip-placement="top" uib-tooltip="Invoice Preview"
             modal-window-button="/html/scripts/core/billable/create-invoice.tpl.html"
             modal-window-class="invoice-modal-not-background"
             mw-window-template-url="/html/scripts/core/billable/create-invoice-modal.tpl.html"
             mw-controller="quicktech.core.receivable.invoicePreviewCtrl">{{ invoice.number }}</div>
      </div>

      <div class="col-2">{{ company.name }}</div>
      <div class="col-3">{{ invoice.date | date:'dd MMM yyyy' }}</div>

      <div class="col-4">
        <span class="label label-warning">{{ invoice.paidOn | date:'dd MMM yyyy' }}</span>
      </div>

      <div class="col-5">{{ invoice.deletedAt ? 'deleted' : (invoice.sum | currency:'$':2) }}</div>
    </li>

  </ul>
</div>
