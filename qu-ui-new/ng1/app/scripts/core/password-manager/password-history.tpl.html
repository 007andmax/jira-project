<div style="min-width: 200px;">
  <div ng-repeat="history in password.histories">
    <p><strong>{{ getUserName(getUserById(history.userId)) }}</strong></p>
    <p>
      <span>{{ history.historyType }}</span>
      <span class="pull-right">{{ parseDate(history.actionDate) | date: 'dd.MM.yyyy' }}</span>
    </p>
  </div>
</div>
